verification_plan:
  - step: 1
    phase: pre-deploy
    action: Run the new and changed tests.
    command: >-
      bin/venv-python -m pytest tests/checks/iam_tf/test_ci_deploy_record_prefixes.py
      tests/checks/ci_guards/test_validate_content_reader_lock.py tests/checks/ci_guards/test__manifest.py
      tests/ci/test_deploy_gate.py tests/ci/test_telemetry_content_deploy_script.py tests/ci/test_telemetry_content_record.py
      tests/lambdas/ducklake_telemetry_content_reader/test_deploy_config.py
      tests/lambdas/ducklake_telemetry_content_reader/test_packaging.py tests/test_build_lambda.py
      tests/convergence_health/code_drift/test_ducklake.py tests/checks/misc/test_sensitive_value_detectors.py
      tests/verify_ci_workflow/test_deploy_gate_wiring.py tests/checks/ci_guards/test_validate_ci_rca_taxonomy_accounting.py
      tests/checks/ops_governance/test_validate_deploy_channel_conformance.py
      tests/checks/ci_guards/test_validate_actions_evidence.py tests/checks/contracts/test_validate_actions_capacity.py
      tests/checks/ci_guards/test_validate_environment_reviewer_preflight.py
      tests/verify_ci_workflow/test_deploy_telemetry_content_workflow.py tests/test_build_lambda_config.py
      tests/test_ci_rca_designed_refusal.py tests/verify_ci_workflow/test_ci_rca_and_canary.py -q
    expected: All pass, and the same files against the unchanged tree fail on the new assertions.
    fix_if: A failure is fixed in the code, never by narrowing an assertion (Decision 235).
    hermetic: true
    expected_literals: ["passed"]
    graduation: waive
    graduation_waiver_reason: >-
      PR CI's diff-selected pytest runs these files; the test_obligations nodes pin each behaviour and the gate test is
      rec-5246's acceptance surface.
  - step: 2
    phase: pre-deploy
    action: The content zip is byte-reproducible and built with no AWS credential.
    command: >-
      env -u AWS_PROFILE -u AWS_ACCESS_KEY_ID -u AWS_SECRET_ACCESS_KEY -u AWS_SESSION_TOKEN bin/venv-python -m
      scripts.build_lambda --content-reader-only | grep CONTENT_READER_SHA256 > /tmp/a.sha && env -u AWS_PROFILE -u
      AWS_ACCESS_KEY_ID -u AWS_SECRET_ACCESS_KEY -u AWS_SESSION_TOKEN bin/venv-python -m scripts.build_lambda
      --content-reader-only | grep CONTENT_READER_SHA256 > /tmp/b.sha && cmp /tmp/a.sha /tmp/b.sha && echo REPRODUCIBLE
    expected: REPRODUCIBLE prints.
    fix_if: Two digests differ; find the nondeterministic input in the staged bundle.
    hermetic: true
    expected_literals: ["REPRODUCIBLE"]
    graduation: waive
    graduation_waiver_reason: tests/test_build_lambda.py's reproducibility node graduates the same property.
  - step: 3
    phase: pre-deploy
    action: Fast and full tiers before handoff.
    command: >-
      bin/venv-python -m scripts.validate --pre && bin/venv-python -m scripts.validate && bin/venv-python -m
      scripts.checks.validation_result --verify-head
    expected: >-
      Both tiers pass and validation_result verifies the head sha. The full tier starts in the background with a 2 h
      limit from the top-level session; its verdict is --verify-head's. test_aws_profile's known container failure
      (rec-5196) is cited, not fixed.
    fix_if: >-
      A failure caused by this diff is fixed on the branch; one that reproduces on origin/main is cited by its existing
      rec in the PR body, never fixed inline.
    hermetic: false
    graduation: not-applicable
  - step: 4
    phase: pre-deploy
    action: >-
      The build's tree holds exactly the sidecar's words with {{N}} and {{DATE}} filled, and the approval run the
      planning session dispatched (Decision 246) is approved; a changed word needs a new run before merge.
    command: bin/venv-python -m scripts.roadmap.plan_wording_check --slug telemetry-content-deploy-channel --tree .
    expected: PASS, naming the sidecar digest that the approval run recorded.
    fix_if: A mismatch is fixed toward the sidecar; a needed word change goes back to the planning session and a new run.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      Its digest is specific to this sidecar and PR CI's approved-text binding re-checks the same words on every later
      change, so a standing rerun would duplicate that gate.
  - step: 5
    phase: pre-deploy
    action: The new workflow and script pass the standing workflow guards and actionlint-equivalent checks.
    command: >-
      bin/venv-python -c "import importlib; f=[]; [getattr(importlib.import_module('scripts.checks.ci_guards.' + n),
      n)(f) for n in ('validate_content_reader_lock', 'validate_environment_reviewer_preflight',
      'validate_actions_account_id_masking', 'validate_workflow_dependency_install', 'validate_project_region',
      'validate_ci_rca_adjudication', 'validate_actions_evidence', 'validate_composite_action_shell_bodies')];
      import scripts.checks.contracts.validate_ci_rca_lifecycle_projection as c; c.validate_ci_rca_lifecycle_projection(f);
      print('FAILED', f); raise SystemExit(1 if f else 0)" && bash -n scripts/ci/telemetry_content_deploy.sh && echo
      GUARDS_OK
    expected: FAILED [] and GUARDS_OK print (each module's validate_<name>(failed) entry runs over the real tree; the modules have no __main__).
    fix_if: A finding names the workflow line; fix the workflow, never the check.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: Each is a standing fast-tier check; this step runs them early on the new files.
  - step: 6
    phase: pre-deploy
    action: >-
      Operator one-liner in AWS CloudShell (no admin action; reads only): the layer versions and digests the telemetry
      reader runs, which the build writes into deploy_config.json. Asked once, with the exact block, before the first
      commit of deploy_config.json.
    command: >-
      for a in $(aws lambda get-function-configuration --function-name agent-platform-ducklake-telemetry-reader --query
      'Layers[].Arn' --output text); do n=$(echo "$a" | cut -d: -f7); v=$(echo "$a" | cut -d: -f8); echo "$n $v
      $(aws lambda get-layer-version --layer-name "$n" --version-number "$v" --query Content.CodeSha256 --output text)";
      done
    expected: Two lines, ducklake-deps and ducklake-extensions, each with a version and a base64 digest; no ARN or account id printed.
    fix_if: A missing layer or an error; the operator pastes the error text with any account id removed, and the build waits.
    hermetic: false
    graduation: not-applicable
  - step: 7
    phase: pre-deploy
    action: Related-work and red overlap before the first commit.
    command: bin/venv-python -m scripts.ci_rca.red_overlap --plan docs/plans/PLAN-telemetry-content-deploy-channel.yaml
    expected: Exit 0, or exit 1 only for reds this plan's context already defers; the build waits while a new overlapping red reports blocked.
    fix_if: A new overlapping red; record it and wait, never fix it inline.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      A point-in-time red census at build start; its verdict depends on the live red set, so it cannot be a standing
      check.
  - step: 8
    phase: post-deploy
    action: >-
      After the squash merge, the terraform-apply-sandbox run on the merge sha applied the DeployRecordWrite update and
      nothing else in IAM; read back by the run's conclusion and its apply log summary.
    command: >-
      mcp__github__actions_list method list_workflow_runs, resource_id terraform-apply-sandbox.yml, branch main; take
      the run whose head_sha is the merge sha, then mcp__github__get_job_logs on its apply job and read the plan line
      plan's change addresses.
    expected: >-
      conclusion success and the run link; aws_iam_role_policy.github_ci_deploy is among the in-place changes, no other
      IAM address changes, and nothing is destroyed (a batched merge may add unrelated non-IAM changes).
    fix_if: A red apply follows deploy-paths.yaml's reconcile row; the operator is not asked to approve a deploy until it is green.
    hermetic: false
    graduation: not-applicable
  - step: 9
    phase: post-deploy
    action: >-
      The first channel run: the next CI completion on main wakes it, the gate reports baseline_unknown and deploy true,
      the build job is green with held false, the deploy job waits for the operator. The build posts the run link and
      the summary's evidence block in the thread and asks him to approve; after approval the deploy job's read-back and
      the record job pass. The content-change alarm email is expected (Decision 270 cl.3).
    command: >-
      mcp__github__actions_list method list_workflow_jobs on the run id the build posted (never the newest run): the
      deploy and record jobs must be success; then mcp__github__get_job_logs on each (sessions hold no S3 read grant,
      so the record is proven from its writer's log and the next gate run): the deploy job's read-back line, the record
      job's "OK deploy record written: deploy-records/telemetry-content/agent-platform-ducklake-telemetry-content.json",
      and the next channel run's gate line DEPLOY-GATE skip reason=already_deployed (or no_source_change) with the same
      sha.
    expected: >-
      deploy and record success on the posted run; the deploy log reads back a live CodeSha256 equal to base64 of the
      posted digest; the record log names the telemetry-content key; the next gate run skips on that record.
    fix_if: >-
      A failed deploy job leaves the previous (placeholder) code live; diagnose from the step name in its error and
      re-dispatch after the fix merges (Decision 249 cl.4); no local deploy.
    hermetic: false
    graduation: not-applicable
  - step: 10
    phase: post-deploy
    action: >-
      Masked read-back as agent-platform-session through telemetry/content: describe names exactly the two masked verbs,
      then session_transcript_masked for one session, its id from the telemetry reader's sessions_window over a single
      UTC day two days back (a one-day window, not the 7-day roots read rec-5247 times out on), printing counts only.
    command: >-
      D=$(date -u -d '2 days ago' +%F); OTL_OPS_VERBS_TRANSPORT=execute_api bin/venv-python -c "import sys; from
      scripts.telemetry_capture.read_route import TelemetryReader, content_reader; d=sys.argv[1];
      s=TelemetryReader(profile='agent_platform').named('sessions_window', day_from=d, day_to=d)[0]['session_id'];
      c=content_reader('agent_platform'); print('VERBS', sorted(c.describe())); r=c.named('session_transcript_masked',
      session_id=s); print('ROWS', len(r), 'MASKED', all('masked_sha256' in x for x in r))" "$D"
    expected: VERBS ['session_transcript_masked', 'transcript_row_masked'], then ROWS above 0 and MASKED True. A 503 content_reader_not_deployed is red.
    fix_if: >-
      503 means the deploy did not land (VP 9); another error names its verb and status. A read deadline on
      sessions_window is rec-5247's, not this plan's: re-run with an earlier day; the content leg is what this step
      proves.
    hermetic: false
    graduation: not-applicable
  - step: 11
    phase: post-deploy
    action: >-
      Access-log proof: the operator runs one Logs Insights query in CloudShell over the last hour; the build reads the
      unexpected-caller alarm's state itself.
    command: >-
      q=$(aws logs start-query --log-group-name platform-security-telemetry-content-access --start-time $(($(date +%s)-3600))
      --end-time $(date +%s) --query-string "filter event = 'telemetry_content_read' | stats count() by role, verb"
      --query queryId --output text); sleep 10; aws logs get-query-results --query-id "$q" --query 'results' --output text
    expected: Rows only for role agent-platform-session with the verbs VP 10 used; the alarm platform-security-telemetry-content-unexpected-caller reads OK (aws cloudwatch describe-alarms as agent_platform).
    fix_if: A missing line means the access log is not written; stop and RCA (Decision 55). Another role is the alarm's case; tell the operator at once.
    hermetic: false
    graduation: not-applicable
  - step: 12
    phase: post-deploy
    action: rec-5246 and rec-4696 read closed after the squash merge's Resolves trailer runs.
    command: >-
      OTL_OPS_VERBS_TRANSPORT=execute_api bin/venv-python -c "from src.common.ducklake_reader_client import
      fetch_recs_by_ids, make_reader; rows, _ = fetch_recs_by_ids(make_reader(profile='agent_platform'), ['rec-5246',
      'rec-4696']); print(sorted((r['id'], r['status']) for r in rows))"
    expected: "[('rec-4696', 'closed'), ('rec-5246', 'closed')]"
    fix_if: >-
      An open rec after the closure job means its acceptance verdict refused: follow git-ops.yaml's acceptance-verdict
      route (fix forward or strengthen the acceptance, then re-run the closure); a manual close is forbidden.
    hermetic: false
    graduation: not-applicable
