constraints:
  - "No rescue agents or workaround loops (Decision 55). No local Lambda deploy: the channel is the only path (Decision 239 cl.5, Decision 270 cl.3)."
  - "Never write an account id, ARN with an account, ExternalId, key, API id or host into the repo, a PR, a comment or the shared folder (Decision 101). The operator's VP 6 and VP 11 output is pasted with any account id removed."
  - "Governed words are the sidecar's, verbatim; any change goes back to the planning session and a new approval run (Decision 246)."
  - "No assertion is loosened (Decision 235)."
  - "The deploy job holds the locked role only for aws calls in telemetry_content_deploy.sh: no python or pip after configure-aws-credentials (the stdlib -I approvals preflight runs before it), no third-party action other than the SHA-pinned checkout, download-artifact and configure-aws-credentials."
