schema_version: 6
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "telemetry-content-deploy-channel"
intent: >-
  Plan A of rec-5246 (plan 2 of rec-4696; plan 1 is PLAN-telemetry-content-reader-api-lock, Decision 270, live since
  ddb28a40). Take the masked telemetry content reader live, so the feedback loop's forensic reads can read production
  transcripts masked through the DuckLake API's telemetry/content route. deploy-telemetry-content.yml is woken like
  every governed code-deploy channel (Decisions 249 and 254: the last-green main commit) but, by the operator's ruling
  of 2026-11-17 recorded as a new Decision, only when the reader's protective set changed. A credential-free build job
  builds the reader zip and records its digest; the deploy job waits in the reviewer-gated telemetry-content-deploy
  Environment and, as telemetry-content-deploy, deploys exactly that digest with the handler, layers and environment
  pinned in deploy_config.json, then reads back the live CodeSha256 and configuration (Decision 239 cl.5, Decision 154).
  A record job writes the channel's deploy record under the CI deploy role, so the gate's skip rules and the deploy
  history cover the reader. A repo check keeps the channel's premises; the new files join PROTECTED, CODEOWNERS and
  boundary_patterns; the manifest flips to active. The protected-path edit hook and the golden replay's masked
  read-back leg are plan B (rec-5322). Closes rec-4696 and rec-5246.
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-telemetry-content-deploy-channel.yaml
phase: >-
  ad_hoc_rec (soft-warn category; no tier_item claimed, so the Tier Item Freshness Gate is skipped): rec-5246 (High)
  and rec-4696 (High), a prerequisite on the operator's feedback-loop gate before T3.3/T3.4 waves 2-4. closes_criteria
  is empty.
cites: [dec:239, dec:270, dec:249, dec:254, dec:154, dec:125, dec:126, dec:79, dec:238, dec:232, dec:246, dec:267]
closes_criteria: []
amends:
  - dec:249#2
introduces:
  - deploy-telemetry-content
  - validate_content_reader_lock
  - TELEMETRY_CONTENT_SOURCE_PATHSPECS
scope:
  - file: docs/plans/approved/telemetry-content-deploy-channel.yaml
    action: Create
    purpose: >-
      The approved-text sidecar (Decision 246): every word this plan lands in a bound file, verbatim, with {{N}} and
      {{DATE}} the only placeholders. It binds the new Decision and Decision 249's dated note (docs/DECISIONS.md), the
      DeployRecordWrite edit (terraform/personal/oidc_pipeline_roles.tf) and its pin test; the build edits nothing
      else in those files.
  - file: docs/DECISIONS.md
    action: Modify
    purpose: Its two sidecar blocks verbatim (the new Decision at the top; the dated note under Decision 249's 254 note).
  - file: terraform/personal/oidc_pipeline_roles.tf
    action: Modify
    purpose: >-
      Its two sidecar blocks verbatim: DeployRecordWrite gains deploy-records/telemetry-content/* and the header comment
      says so. An in-budget inline-policy update on a boundary-carrying managed role, applied by terraform-apply-sandbox
      on merge (environment-taxonomy.yaml Axis A); not the bootstrap apply.
  - file: tests/checks/iam_tf/test_ci_deploy_record_prefixes.py
    action: Create
    purpose: Its sidecar block verbatim (the statement grants s3:PutObject on exactly the three record prefixes).
  - file: .github/workflows/deploy-telemetry-content.yml
    action: Create
    purpose: >-
      Header comment naming Decisions 239 cl.5, 249, 254, 270 and {{N}}. on: workflow_run (workflows [CI], types
      [completed], branches [main]) and workflow_dispatch (inputs force and rebaseline, boolean, default false; rebaseline is the recovery
      for a BASELINE_UNPROVEN run: the summary lists every bundled commit since ddb28a40 and both baseline checks are
      skipped for that run only). Top-level permissions contents: read.
      concurrency: group deploy-telemetry-content, cancel-in-progress false (a newer pending run replaces an older
      pending one; an in-flight deploy always completes). Every non-local uses: is pinned to a 40-hex commit SHA with a
      version comment. Jobs, in order:
        - gate: the deploy-prod-lambdas.yml gate job's if: expression verbatim (dispatch on main by a non-bot actor, or a
          successful same-repo push run of CI), uses ./.github/workflows/deploy-gate.yml with channel telemetry-content
          and force, secrets inherit, permissions id-token write, contents read, actions read.
        - build: needs gate, if needs.gate.outputs.deploy == 'true'. No environment and no id-token; permissions
          contents read and actions read. Steps: checkout with ref needs.gate.outputs.sha, fetch-depth 0 and
          persist-credentials false; "Check the telemetry-content-deploy Environment has reviewers" (python3 -I
          scripts/ci/environment_reviewer_preflight.py environment --environment telemetry-content-deploy
          --require-no-admin-bypass, GH_TOKEN and REVIEWER_LOGINS from vars.TF_GITHUB_GATED_APPLY_REVIEWER_LOGINS);
          setup-python 3.12 and pip install -c requirements.txt pyyaml pydantic; the telemetry hold (python -m
          scripts.checks.ops_governance.validate_reconcile_pending_gate --telemetry-hold, held exported as an output,
          held=true writing a TELEMETRY_PRODUCTION_HOLD notice, a green skip); python -m scripts.build_lambda
          --content-reader-only with its CONTENT_READER_SHA256 exported as output sha256; upload
          lambda-packages/ducklake-telemetry-content-reader.zip as artifact telemetry-content-<sha256>, retention-days
          30, if-no-files-found error; "Prove the recorded baseline" when needs.gate.outputs.record_sha is non-empty and
          rebaseline is not true (git worktree add at record_sha, python -m scripts.build_lambda --content-reader-only
          there, and fail with BASELINE_UNPROVEN unless base64 of that digest equals needs.gate.outputs.record_code_sha256:
          the deploy record is writable by agent-reachable identities, so the summary's commit range is trusted only
          once the recorded commit is shown to build the recorded code; decision-scout r3 NOTE); "Write the approval
          summary" (bash scripts/ci/telemetry_content_deploy.sh summary with GATE_SHA, HEAD_SHA (github.sha), RECORD_SHA
          (empty, or rebaseline, means the range starts at ddb28a40), RUN_URL of the waking CI run, CONTENT_SHA256 and
          HELD through env).
        - deploy: needs [gate, build], if needs.build.outputs.held == 'false', environment telemetry-content-deploy,
          permissions id-token write, contents read and actions read. Steps: checkout (ref gate sha, persist-credentials
          false) for the scripts and deploy_config.json, then a second checkout at path .dispatch-tooling (the
          workflow's own ref, persist-credentials false), as validate_environment_reviewer_preflight (c) requires of a
          job whose first checkout takes a ref; "Check the reviewer approval for telemetry-content-deploy" (python3 -I
          scripts/ci/environment_reviewer_preflight.py approvals, working-directory .dispatch-tooling, before any other
          non-checkout step; the job's only python, stdlib, before any credential); ./.github/actions/aws-region;
          download the artifact by its digest name; configure-aws-credentials with role-to-assume
          arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/telemetry-content-deploy, aws-region env.AWS_REGION and
          MASK_AWS_ROLE_ID_ACCOUNT_PART from secrets.AWS_ROLE_ID_ACCOUNT_PART in the step env; bash
          scripts/ci/telemetry_content_deploy.sh deploy with ZIP, CONTENT_SHA256, RECORD_CODE_SHA256
          (needs.gate.outputs.record_code_sha256) and REBASELINE through env, exporting code_sha256.
          It runs no pip install and no repo Python while it holds the role.
        - record: needs [gate, deploy], if needs.deploy.result == 'success'. permissions id-token write, contents read.
          Checkout at the gate sha; aws-region; setup-python and pip install -c requirements.txt pyyaml pydantic, before
          any credential; configure-aws-credentials for agent-platform-github-ci-deploy (the deploy-prod-lambdas.yml
          form); python -m
          scripts.ci.telemetry_content_record with CODE_SHA256 (needs.deploy.outputs.code_sha256) and
          LAMBDA_ARTIFACT_SHA (gate sha) through env, which refuses an empty or non-base64 digest and writes
          deploy-records/telemetry-content/agent-platform-ducklake-telemetry-content.json through
          scripts.build_lambda_deploy._write_ducklake_deploy_record (schema_version 2 run facts).
  - file: scripts/ci/telemetry_content_deploy.sh
    action: Create
    purpose: >-
      Bash, set -euo pipefail, using only aws, jq, sha256sum, base64 and git; every error names a step, never a value.
      Subcommands:
        - summary: writes $GITHUB_STEP_SUMMARY, intent and evidence first (Decision 232 cl.4): the protective-set
          commits since the deployed record (git log --oneline over TELEMETRY_CONTENT_SOURCE_PATHSPECS, read from the
          repo by a stdlib python3 -I one-liner-free helper in the same script's data, or "first deploy"), the waking
          CI run URL, the built digest, the hold state and the deploy_config.json layer pins; then every bundled commit
          going out over the manifest's paths and the build tooling that assembles the zip (scripts/build_lambda.py,
          scripts/build_lambda_packaging.py, scripts/build_lambda_config.py, scripts/lambda_manifest.py: a tooling
          change alters the shipped bytes without touching a bundled file, decision-scout r4 NOTE; it does not wake the
          channel, it is shown on the next approval); then deploy_config.json's diff over the range; then the line "CI
          publishes the layers: a pin proves which bytes run, not who built them (rec-4742)". It prints gate and HEAD
          shas. It reads no credential.
        - deploy: fails unless sha256sum(ZIP) equals CONTENT_SHA256; adds a mask for the STS account; when
          RECORD_CODE_SHA256 is non-empty and REBASELINE is not true, fails at step baseline unless get-function's live
          Configuration.CodeSha256 equals it (the live reader is the recorded one, so the approved summary listed
          everything that changes); for each
          deploy_config.json layer resolves its version ARN and fails unless get-layer-version's Content.CodeSha256
          equals the pin; update-function-configuration with exactly --handler, --layers and --environment from
          deploy_config.json, wait function-updated-v2; update-function-code --zip-file, wait again; fails unless the
          live CodeSha256 equals base64 of the digest bytes (Decision 154) and get-function-configuration reads back
          the handler, the resolved layer ARNs and the environment exactly; writes code_sha256 to GITHUB_OUTPUT. Nothing
          prints a value from the environment block.
  - file: tests/ci/test_telemetry_content_deploy_script.py
    action: Create
    purpose: >-
      Literal-argv tests of telemetry_content_deploy.sh with a fake aws on PATH (the Decision 162 R2 precedent): a
      digest mismatch, a live-versus-record baseline mismatch, a layer pin mismatch and a read-back mismatch each exit
      non-zero naming the step and printing no
      environment value; the happy path calls update-function-configuration before update-function-code and writes
      code_sha256; summary writes the evidence block before the commit lists, and a commit touching only
      scripts/build_lambda_packaging.py appears in its going-out list.
  - file: scripts/ci/telemetry_content_record.py
    action: Create
    purpose: >-
      Entry point for the record job: validates CODE_SHA256 (non-empty base64 of 32 bytes) and LAMBDA_ARTIFACT_SHA (40
      hex), then calls scripts.build_lambda_deploy._write_ducklake_deploy_record("agent-platform-ducklake-telemetry-content",
      json.dumps({"CodeSha256": code_sha256}), "agent-platform-data-lake", "", os.environ["AWS_REGION"],
      channel="telemetry-content"), the existing writer, which parses CodeSha256 from an update-function-code-shaped
      JSON string, reads LAMBDA_ARTIFACT_SHA and the run facts, and writes with aws s3 cp (an empty profile omits
      --profile). Exits 2 on a refused input; the writer exits 1 on a failed write.
  - file: tests/ci/test_telemetry_content_record.py
    action: Create
    purpose: >-
      An empty, short or non-base64 digest and a short sha are refused before any write; a valid pair calls the writer
      once (subprocess.run patched, as tests/build_lambda_deploy/test_deploy_records.py does) with key
      deploy-records/telemetry-content/agent-platform-ducklake-telemetry-content.json, an argv with no --profile, and a
      record whose code_sha256 and source_git_sha are the inputs.
  - file: src/lambdas/ducklake_telemetry_content_reader/deploy_config.json
    action: Create
    purpose: >-
      handler src.lambdas.ducklake_telemetry_content_reader.handler.handler; layers [{name, version, code_sha256}] for
      ducklake-deps and ducklake-extensions, the values the operator's VP 6 one-liner prints (the versions the
      telemetry reader runs); environment TELEMETRY_META_SCHEMA ducklake_telemetry, TELEMETRY_DATA_PATH
      s3://agent-platform-data-lake/ducklake-telemetry/, TELEMETRY_BLOB_ROOT
      s3://agent-platform-data-lake/telemetry-blobs/ducklake_telemetry/, DUCKLAKE_EXTENSION_DIRECTORY
      /opt/duckdb_extensions, DUCKLAKE_FIELD_SEMANTICS_PATH /var/task/config/lambda/ducklake/field_semantics.yaml and
      TELEMETRY_DSN_PARAMETER /secret/agent-platform-ducklake-telemetry-reader-dsn. No account id.
  - file: tests/lambdas/ducklake_telemetry_content_reader/test_deploy_config.py
    action: Create
    purpose: >-
      Shape (three keys, two layers, 64-hex-free base64 digests), environment equal to the telemetry reader's HCL
      values minus TELEMETRY_DSN_SECRET_ID, plus TELEMETRY_BLOB_ROOT matching the content role's blob prefix, no 12-digit number anywhere.
  - file: src/lambdas/ducklake_telemetry_content_reader/manifest.yaml
    action: Modify
    purpose: status stub -> active; notes name deploy-telemetry-content.yml, Decision 239 cl.5, Decision {{N}} and deploy_config.json. Includes and assets unchanged.
  - file: tests/lambdas/ducklake_telemetry_content_reader/test_packaging.py
