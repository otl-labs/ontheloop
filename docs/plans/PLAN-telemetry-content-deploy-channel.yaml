pre_implementation_checklist:
  - Branch confirmed not on main
  - docs/PROJECT_CONTEXT.md read
  - Only the plan-cited decision sections (239, 249, 254, 270)
  - All files in scope located and readable
  - Acceptance criteria understood and verifiable
  - "Start condition: this plan merged, its approval run approved, and no change to the content reader's roles or the Environment merged since ddb28a40."
execution_steps:
  - "VP 7 (red_overlap) and VP 6 (the operator's layer read) first. Post: no new overlapping red; two layer lines in hand."
  - "Tests first (scope test rows), seen red on the unchanged tree. Post: they fail on the new assertions."
  - "Apply each sidecar block verbatim with {{N}} the next free Decision number and {{DATE}} the build date; then the remaining scope edits. Post: VP 1, 2, 4 and 5 pass."
  - "Commit, VP 3, push, PR (body: the Decision number, the approval run link, no Resolves trailer until the final squash), CI green, review PROCEED, scripts.rec_trailer_acceptance census and evaluate at the PR head show both recs holds; squash-merge with 'Resolves: rec-5246, rec-4696' (operator's standing rule: an approved plan's build merges on review PROCEED and green CI)."
  - "VP 8 (sandbox apply green), then VP 9: post the first run's approval ask to the operator with the evidence block; after his approval VP 10, then ask VP 11, then VP 12."
  - "Execute Verification Plan: run each step; loop until pass; on an unrecoverable V3 failure stop and RCA (Decision 55)."
  - "Report: what was implemented, the validation_result --verify-head verdict, VP 8-12's lines, the merge SHA, and that Decision 267's lock-available condition fired (rec-5323)."
rollback: >-
  Revert the PR before the first approval: the sandbox apply removes the record prefix and nothing else changed in AWS.
  After a deploy, a revert PR ships through the channel with a fresh approval (a dispatch with force after the merge
  when the revert touches only shared modules), or the operator's admin tier restores
  the previous code; a dispatch cannot target an older commit.
