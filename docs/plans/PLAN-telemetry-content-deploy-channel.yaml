  - file: tests/convergence_health/code_drift/test_ducklake.py
    action: Modify
    purpose: >-
      TELEMETRY_CONTENT_SOURCE_PATHSPECS is the three paths; every .py file it matches is bundled by the content
      manifest, and its only unbundled matches are the package's manifest.yaml and deploy_config.json.
  - file: scripts/checks/ci_guards/validate_content_reader_lock.py
    action: Create
    purpose: >-
      Predicates over parsed workflows, the build-lambda and actions-capacity contracts and the pathspecs, each red on
      synthetic input:
        (a) only deploy-telemetry-content.yml names Environment telemetry-content-deploy, never as an expression;
        (b) that file declares no workflow_call, pull_request or pull_request_target trigger, and its deploy job is
            defined in it (not a reusable call);
        (c) no other workflow, and no build-lambda.yaml ducklake_function_zip_keys entry, names
            agent-platform-ducklake-telemetry-content or ducklake-telemetry-content-reader.zip;
        (d) the deploy job runs only when needs.build.outputs.held is 'false', passes the digest through env (no
            ${{ }} inside a run body) together with RECORD_CODE_SHA256 from needs.gate.outputs.record_code_sha256, and
            no step after configure-aws-credentials invokes python or pip (the only python is the stdlib -I approvals
            preflight before it); the build job's baseline step precedes its summary step;
        (e) TELEMETRY_CONTENT_SOURCE_PATHSPECS covers the protective set, every .py file it matches is bundled by the
            content manifest, and its only unbundled matches are the package's manifest.yaml and deploy_config.json;
        (f) build-lambda.yaml deploy_channels.telemetry_content_function.governed_channel names the workflow, its
            cli_flags name --content-reader-only, and actions-capacity.yaml lists deploy-telemetry-content.yml (no
            standing check reads either row).
      An early warning (Decision 239 cl.5): an agent PR can edit the check itself.
  - file: scripts/checks/ci_guards/validate_environment_reviewer_preflight.py
    action: Modify
    purpose: UPSTREAM gains "deploy-telemetry-content.yml" ("build", "deploy"), so predicate (d) enforces the build job's environment --require-no-admin-bypass preflight.
