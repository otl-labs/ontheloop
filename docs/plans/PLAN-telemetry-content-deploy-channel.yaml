      entry (Class D contract) names the row.
  - file: scripts/ci/deploy_gate.py
    action: Modify
    purpose: >-
      Channel telemetry-content: _channel_inputs names [agent-platform-ducklake-telemetry-content] and
      TELEMETRY_CONTENT_SOURCE_PATHSPECS; ducklake and prod keep theirs; any other channel raises GateError (no
      fall-through to prod); the CLI choices gain it. read_record(channel, function) returns the record mapping or None
      (read_record_sha keeps its signature and wraps it); resolve also emits record_sha and record_code_sha256, set
      only for a channel with exactly one function and a present record, else empty. A telemetry-content rule 0,
      pre_channel_target: skip (deploy false) when the target commit lacks
      src/lambdas/ducklake_telemetry_content_reader/deploy_config.json, so a wake whose newest green commit predates this
      channel never builds a tree without its flag, script or config.
  - file: .github/workflows/deploy-gate.yml
    action: Modify
    purpose: >-
      The workflow and gate-job outputs gain record_sha and record_code_sha256 from steps.resolve. The ducklake and
      prod callers ignore them; nothing else changes.
  - file: tests/verify_ci_workflow/test_deploy_gate_wiring.py
    action: Modify
    purpose: >-
      test_deploy_gate_is_workflow_call_only_with_outputs_and_manifest also requires the record_sha and
      record_code_sha256 outputs; the wake and gate-guard tests also read deploy-telemetry-content.yml. Nodes are
      added or extended, none renamed.
  - file: tests/ci/test_deploy_gate.py
    action: Modify
    purpose: The new channel resolves its function and pathspecs; an unknown channel raises; a single-function channel
      emits record_sha and record_code_sha256 from its record, a two-function channel and an absent record emit them
