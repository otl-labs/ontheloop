slug: "telemetry-content-edit-hook"
intent: >-
  Plan B of rec-5246 (plan A, PLAN-telemetry-content-deploy-channel, is live as Decision 272). Deliver the two early
  warnings Decision 239 cl.5 and Decision 272's Coverage paragraph still owe (rec-5322), so the feedback loop's
  forensic reads stand on a content reader whose masking is proven live and whose protective files a session cannot
  edit without a merged plan. (1) A PreToolUse hook refuses an Edit, Write, MultiEdit or NotebookEdit of a PROTECTED
  path unless a plan merged to main, named in .claude/protected_edit_plan, scopes that exact path. (2) An opt-in masked
  read-back leg of the golden replay writes one current, runtime-built synthetic tree (one row above the inline
  threshold carrying a runtime-built value that only read-time masking hides, rec-4699), reads it back through the
  content route as agent-platform-session, and reads one January tree expecting the window refusal. Folds the go-live
  review's small edges (rec-5369) and re-decides Decision 267 cl.5's lock-available condition (rec-5323): clause 5
  stands, and the content deploy job refuses a re-run attempt.
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-telemetry-content-edit-hook.yaml
phase: >-
  ad_hoc_rec (soft-warn category; no tier_item claimed, so the Tier Item Freshness Gate is skipped): rec-5322 (Medium),
  rec-5323 (Medium), rec-4699 (Medium) and rec-5369 (Low), the content reader's tail before the operator's
  feedback-loop gate opens T3.3/T3.4 waves 2-4. closes_criteria is empty.
