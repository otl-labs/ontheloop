  - file: scripts/ducklake_smoke/lambda_telemetry_golden_content.py
    action: Create
    purpose: >-
      The content leg (its own module, so the gates file stays under budget, Decision 128). run(replay, content,
      stats) takes the gates module's started _Run (duck-typed: register_project, send, named) and a content reader
      exposing named(). Steps, in order:
        1. Build the current tree from one corpus case chosen by name (CONTENT_CASE, the first replayable case in
           index order whose producer output holds both a prompt and a response transcript row; the build names it):
           every record's timestamp is shifted by one offset so the root starts at the run's clock minus one minute;
           ids are never minted here: they re-derive at the write boundary from the fresh project (Decision 199 cl.3).
        2. Append one user record after the last, whose text is filler plus a planted value built at run time from
           secrets for a class that the read_masked profile masks and the write_time profile does not (capture scrubs
           write_time classes before storage, src/turn_capture/scrub.py, so only such a class proves the reader's own
           masking), sized so its content passes the writer's advertised inline_threshold_bytes while the whole tree stays
           below the content reader's SESSION_BUDGET_BYTES (src/lambdas/ducklake_telemetry_content_reader/masked.py:21),
           so no row is served too_large; a row served too_large (text None, masked.py:178-184) counts as content_text,
           never as a match. The planted value is never printed, logged, written to a file or committed.
        3. register_project through the gates' own synthetic path (Decision 236 cl.1), record_turn, send; assert the
           planted row's wire row carries content_uri (spilled to the blob tier); read the tree back with read_tree
           through the telemetry reader and assert the planted row's stored content_sha256 equals the sent one.
        4. Page session_transcript_masked (offset, max_rows, next_offset) for the root session through the content
           route and compare against the sent transcript rows (excluding the rows the verb skips by default): the
           multiset of (purpose, origin, content_sha256) is equal; each served text equals local
           mask(raw, "read_masked").text for the raw content of its content_sha256; masked_sha256 equals sha256 of that
           text; mask_counts equal the local counts; the planted row is served with storage object; the envelope's
           detector equals the local fingerprint("read_masked") (its own class, content_reader_behind_main); and the
           planted value appears nowhere in any response body.
        5. Read one already replayed January tree's root and expect 404 outside_read_window. _Run.check keeps no ids,
           and handler.py:133 decides on the session id's time prefix alone, so the leg derives that root's session id
           with derive_entity_key from the January fixture's root ref and session_started_at under the leg's own
           registered synthetic project (Decision 199 cl.3); any January-prefixed id proves the same check. window_refused evidences handler.py:133's
           check on the session id's time prefix; handler.py:152's tree check is not separately proven.
      Classes counted (never a value): content_text, content_hash, content_counts, content_reader_behind_main,
      planted_unmasked, blob_tier_missing, stored_hash, window_open. A 503 content_reader_not_deployed, an unresolved
      route or any other read failure is a stop of class content_<reason>, never a pass. Output is one GOLDEN_CONTENT
      line of counts (rows, blob_rows, planted_masked, window_refused, mismatches) or GOLDEN_CONTENT_STOP class=...;
      never text, a session id, a project ref or a hash.
