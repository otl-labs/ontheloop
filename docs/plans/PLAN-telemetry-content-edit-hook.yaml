  - file: .claude/hooks/protected_path_guard.py
    action: Create
    purpose: >-
      PreToolUse adapter for Edit, Write, MultiEdit and NotebookEdit (every other tool exits 0). The target is
      tool_input file_path, else notebook_path, normalised (os.path.normpath, so a .. segment cannot dodge an entry) and
      made relative to CLAUDE_PROJECT_DIR (else the repo root two levels up);
      a target outside the repository, or no target, exits 0. PROTECTED is the union of the PROTECTED tuple parsed
      with ast (never imported) from the working tree's scripts/checks/misc/sensitive_value_detectors.py and from
      `git show origin/main:` of the same file, so a branch can neither shorten the list nor miss a new entry. An
      entry ending in / covers every path under it, an entry with * matches by fnmatch, any other entry matches exactly.
      A target not covered exits 0. A covered target is allowed (exit 0) only when .claude/protected_edit_plan holds
      one repository-relative docs/plans/PLAN-*.yaml path whose `git show origin/main:` copy parses as YAML and has a
      scope row whose file equals the target exactly; .claude/active_plan and CLAUDE_ACTIVE_PLAN are never read, so
      declaring a plan never turns on edit_scope_guard. Otherwise exit 2: no marker, an empty or malformed marker, a
      plan absent at origin/main, an unparseable plan, a plan that does not scope the target, an unparseable PROTECTED
      on both sides, or a git error on a covered target (the message names `git fetch origin main`). A git error
      reading origin/main falls back to the working tree's PROTECTED for coverage, so an uncovered target still exits 0
      and only a covered one blocks. Malformed hook input exits 0 (the
      never_on_main precedent). Every block message's first line is "BLOCKED by .claude/hooks/protected_path_guard.py: "
      followed by the target (the form test_hook_block_marker's _assert_marked reads); it names the reason and the fix
      (write the merged plan's path to .claude/protected_edit_plan with Bash, for example printf '%s\n' <path> >
      .claude/protected_edit_plan, since an active edit_scope_guard plan refuses a Write of that file; its scope must
      list this exact file) and its last
      line is exactly "This hook covers Edit, Write, MultiEdit and NotebookEdit only; a Bash edit bypasses it. It is an
      early warning, not a control (Decision 239 cl.5)." The adapter holds no 'HOOK-BLOCK v1' literal: rule HB-1's shim
      pattern (src/turn_capture/markers.py; PLAN-telemetry-hook-block-markers, approved on main) puts the marker in the
      shim, so one block prints one marker. It prints nothing to stdout
      and never returns a permission decision. Stdlib plus yaml only; git calls carry a 5 s timeout. Its
      docstring states the residuals the context's hook-residuals line names.
  - file: .claude/hooks/protected_path_guard.sh
    action: Create
    purpose: >-
      The registered command, on protected_action_gate.sh's pattern (no set -e, no set -u): reads the payload, runs
      the adapter under `timeout -k 5 20 "$ROOT/bin/venv-python" -I`, passes exit 0 and 2 through with their stderr,
      and maps a missing adapter, a timeout or any other exit to a deny only when the payload's file_path or
      notebook_path value (extracted with sed, never a whole-payload match) contains one of its COARSE literals, and to
      an allow otherwise. Rule HB-1, on PLAN-telemetry-hook-block-markers's shim pattern: one EXIT trap captures the exit
      status first and prints 'HOOK-BLOCK v1 hook=protected_path_guard' to stderr exactly when it is 2 (the adapter's
      deny and every fallback deny), then exits with that same status; allow paths print nothing new. So an adapter
      block ends with the adapter's Bash-bypass line and then the marker, and a fallback deny ends with the shim's own
      one-line reason (it names the target and the fallback cause) and then the marker. A checkout whose branch
      predates the shim exits 127, which Claude Code does not treat as a block: the merge gate's accepted residual.
