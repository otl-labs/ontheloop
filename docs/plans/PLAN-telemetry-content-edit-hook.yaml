verification_plan:
  - step: 1
    phase: pre-deploy
    action: Run the new and changed tests.
    command: >-
      bin/venv-python -m pytest tests/hooks/test_protected_path_guard.py tests/hooks/test_hook_block_marker.py
      tests/hooks/test_plugin_hooks.py tests/checks/misc/test_sensitive_value_detectors.py
      tests/ducklake_neon_smoke_test/test_lambda_telemetry_golden_content.py
      tests/ducklake_neon_smoke_test/test_lambda_telemetry_golden_gates.py tests/ci/test_telemetry_content_record.py
      tests/ci/test_deploy_gate.py tests/verify_ci_workflow/test_deploy_telemetry_content_workflow.py
      tests/lambdas/ducklake_telemetry_writer/test_packaging.py tests/test_edit_scope_guard.py -q
    expected: All pass, and the new nodes fail on the unchanged tree.
    fix_if: A failure is fixed in the code, never by narrowing an assertion (Decision 235).
    hermetic: false  # test_lambda_telemetry_golden_gates.py is duckdb-guarded, absent from PR CI's fast tier
    graduation: waive
    graduation_waiver_reason: >-
      PR CI's diff-selected pytest runs these files on every later change, and the test_obligations nodes pin each
      behaviour; a standing rerun would duplicate them.
  - step: 2
    phase: pre-deploy
    action: The real hook refuses a protected edit in this checkout and lets an unprotected one through.
    command: >-
      printf '%s' '{"tool_name":"Edit","tool_input":{"file_path":"src/sensitive_values/engine.py"}}' |
      env -u CLAUDE_ACTIVE_PLAN bash .claude/hooks/protected_path_guard.sh; echo "rc=$?";
      printf '%s' '{"tool_name":"Edit","tool_input":{"file_path":"README.md"}}' | bash .claude/hooks/protected_path_guard.sh;
      echo "rc=$?"
    expected: >-
      The first call prints the block ending in the HOOK-BLOCK line and rc=2 (engine.py is PROTECTED and outside this
      plan's scope, so it blocks with or without the build's marker); the second prints rc=0.
    fix_if: The first allows or the second blocks; fix the adapter or the shim.
    hermetic: false  # the adapter reads git show origin/main:, which needs a fetched ref
    graduation: waive
    graduation_waiver_reason: tests/hooks/test_protected_path_guard.py runs the same calls on a temporary repository.
  - step: 3
    phase: pre-deploy
    action: Fast and full tiers before handoff.
    command: >-
      bin/venv-python -m scripts.validate --pre && bin/venv-python -m scripts.validate && bin/venv-python -m
      scripts.checks.validation_result --verify-head
    expected: >-
      Both tiers pass and validation_result verifies the head sha. The full tier starts in the background with a 2 h
      limit from the top-level session; its verdict is --verify-head's.
    fix_if: >-
      A failure caused by this diff is fixed on the branch; one that reproduces on origin/main is cited by its existing
      rec in the PR body, never fixed inline.
    hermetic: false
    graduation: not-applicable
  - step: 4
    phase: pre-deploy
    action: >-
      The build's tree holds exactly the sidecar's words with {{DATE}} filled, and the approval run the planning
      session dispatched (Decision 246) is approved; a changed word needs a new run before merge.
    command: bin/venv-python -m scripts.roadmap.plan_wording_check --slug telemetry-content-edit-hook --tree .
    expected: PASS, naming the sidecar digest that the approval run recorded.
    fix_if: A mismatch is fixed toward the sidecar; a needed word change goes back to the planning session and a new run.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      Its digest is specific to this sidecar and PR CI's approved-text binding re-checks the same words on every later
      change.
  - step: 5
    phase: pre-deploy
    action: The changed workflow passes the content-reader lock check and the standing workflow guards.
    command: >-
      bin/venv-python -c "import importlib; f=[]; [getattr(importlib.import_module('scripts.checks.ci_guards.' + n),
      n)(f) for n in ('validate_content_reader_lock', 'validate_environment_reviewer_preflight',
      'validate_actions_account_id_masking', 'validate_composite_action_shell_bodies')]; print('FAILED', f);
      raise SystemExit(1 if f else 0)" && echo GUARDS_OK
    expected: FAILED [] and GUARDS_OK print.
    fix_if: A finding names the workflow line; fix the workflow, never the check.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: Each is a standing fast-tier check; this step runs them early on the changed workflow.
  - step: 6
    phase: pre-deploy
    action: Red-overlap check before the first commit.
    command: bin/venv-python -m scripts.ci_rca.red_overlap --plan docs/plans/PLAN-telemetry-content-edit-hook.yaml
    expected: Exit 0, or exit 1 naming only reds that share no path with this plan, recorded with the plan's deferral rationale.
    fix_if: A red that shares a path with this plan stops the build until its owner fixes it (Decision 226).
    hermetic: false
    graduation: not-applicable
  - step: 7
    phase: post-deploy
    action: >-
      After the squash merge, the agent session runs the content leg once against the live reader (the reader's
      protective set is unchanged, so no deploy is owed or asked).
    command: >-
      OTL_OPS_VERBS_TRANSPORT=execute_api AWS_PROFILE=agent_platform bin/venv-python -m
      scripts.ducklake_smoke.lambda_telemetry_golden_gates --content-leg --no-alarms --assert-zero-mismatches
    expected: >-
      Exit 0 with GOLDEN_SKEW records=unchecked, GOLDEN_SMOKE mismatches=0 skew=0 and GOLDEN_CONTENT blob_rows=1
      planted_masked=1 window_refused=1
      mismatches=0. A skew line (deployed telemetry reader older than the checkout) is re-run after the DuckLake
      channel deploys, never counted as a pass.
    fix_if: >-
      content_reader_behind_main means the reader's protective code differs from main: report it to the coordinator,
      never dispatch a deploy from the build. Any other class is a real fault: stop and RCA (Decision 55), filing a rec.
    hermetic: false
    graduation: not-applicable
  - step: 8
    phase: post-deploy
    action: The bundled recs are closed.
    command: >-
      OTL_OPS_VERBS_TRANSPORT=execute_api bin/venv-python -c "from scripts.ops_data_portal import _fetch_rec_from_reader
      as f; s=[(r, (f(r, profile='agent_platform') or {}).get('status')) for r in ('rec-5322','rec-5323','rec-4699','rec-5369')];
      print(s); raise SystemExit(0 if all(v == 'closed' for _, v in s) else 1)"
    expected: All four print closed.
    fix_if: A rec still open after the closure job ran is closed through ops_data_portal with the merge SHA as evidence.
    hermetic: false
    graduation: not-applicable
  - step: 9
    phase: post-deploy
    action: >-
      Operator step: after the squash merge, update the ontheloop plugin on claude.ai (Customize > Plugins), since
      project threads take hooks only from that plugin (.claude/hooks/plugin_hooks.py:4-9) and never read
      .claude/settings.json. Then ask the coordinator for a fresh project thread on this repo, on a session branch with
      no .claude/protected_edit_plan, whose first act is this check: run the command, then call the Write tool to
      create the new file src/sensitive_values/protected_path_guard_probe.txt with the content probe (a new file needs
      no prior Read, so the tool's own input checks pass and the hook is reached; src/sensitive_values/ is a PROTECTED
      directory entry).
    command: bin/venv-python .claude/hooks/plugin_hooks.py check
    expected: >-
      The command prints no line tagged [plugin_hooks] reporting drift (it exits 0 on every path, so its exit code
      says nothing), and the Write call is refused with a message ending in
      "HOOK-BLOCK v1 hook=protected_path_guard"; the probe file does not exist afterwards.
    fix_if: >-
      A drift warning, or the probe file created: the hook did not run, so the thread deletes the probe file (rm, never
      committed), the operator updates the plugin and the thread repeats the check. Refused by the hook but with a different tail: fix the
      adapter through a new plan's build.
