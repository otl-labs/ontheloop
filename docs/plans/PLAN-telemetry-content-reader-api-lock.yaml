    graduation: not-applicable
  - step: 10
    phase: post-deploy
    action: >-
      As agent-platform-session through the signed API, the content route answers with the placeholder, proving route,
      permission, grant and parameter before plan 2 deploys any code.
    command: |-
      OTL_OPS_VERBS_TRANSPORT=execute_api bin/venv-python - <<'PY'
      from scripts.telemetry_capture.read_route import CONTENT_VERBS, content_reader
      from src.common.ducklake_reader_client import ReaderInvokeError
      r = content_reader("agent_platform")
      print("ROUTE", "/".join(r._reader_url().rsplit("/", 2)[-2:]))
      try:
          r.named(sorted(CONTENT_VERBS)[0])
          print("UNEXPECTED_OK")
      except ReaderInvokeError as e:
          print("STATUS", e.status, (e.body or {}).get("error"))
      PY
    expected: "ROUTE telemetry/content, then STATUS 503 content_reader_not_deployed (after the client's two 503 retries)."
    fix_if: >-
      403 from API Gateway: the session grant or resource policy lacks the route; 500 or 502: the permission or
      integration is wrong. Diagnose from the API access log by request id; any fix is a plan amendment.
    hermetic: false
    graduation: not-applicable
