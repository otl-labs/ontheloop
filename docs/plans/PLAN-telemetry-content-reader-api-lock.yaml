pre_implementation_checklist:
  - Branch confirmed not on main
  - docs/PROJECT_CONTEXT.md read
  - Only the plan-cited decision sections (144, 213, 230, 239, 248, 255, 256, 257, 258)
  - All files in scope located and readable
  - Acceptance criteria understood and verifiable
  - "Start condition: this plan merged, its approval run approved, no other bootstrap change merged and unapplied, and the boundary still renders 5,696 B on main."
execution_steps:
  - "Tests first (scope test rows), seen red on the unchanged tree. Post: they fail on the new assertions."
  - "Apply each sidecar block verbatim with {{N}} the next free Decision number and {{DATE}} the build date; write the placeholder zip at terraform/lambda-placeholders/ (byte-reproducible) and the token edits; the remaining source edits. Post: VP 1, 2 and 4 pass."
  - "Measure tests/checks/iam_tf/test_platform_role_metadata_admin_scope.py's SLOC after its sidecar block: it lands at 500 of 500; record that in the PR body so the next plan scoping it (PLAN-agent-proxy-signed-access, PLAN-bootstrap-ci-gated-apply) decomposes it first. Over 500: stop and return to planning (the words are bound)."
  - "Commit, VP 3, push, PR, CI green. The squash body carries no Resolves trailer (rec-4696 closes with plan 2)."
  - "Post VP 5 and VP 6 to the operator with the full head sha and the detector-email notice; record the address list on the PR; merge on the plan's gates (operator's standing rule) once VP 6 matches; the operator runs VP 7 in the same sitting."
  - "VP 8, VP 9 and VP 10; tell the coordinator plan 2 (rec-5246) may be planned."
  - "Execute Verification Plan: run each step; loop until pass; on an unrecoverable V3 failure stop and RCA (Decision 55)."
  - "Report: what was implemented, the validation_result --verify-head verdict, VP 6-10's lines and the merge SHA."
rollback: >-
  Before plan 2 nothing serves content: revert the PR and have the operator apply the revert from CloudShell. A revert
  removes the resource blocks, and prevent_destroy goes with them, so the access log is kept by skip_destroy (the log
  group leaves state, the AWS object stays) and the revert's plan must show it as a state-only removal; the GitHub
  Environment's revert is a separate gated terraform-github-apply dispatch the operator approves.
