      case is dropped and each mutation case keeps a red twin (Decision 235 cl.1, approved with this plan).
  - file: tests/checks/iam_tf/test_telemetry_prefix_fence.py
    action: Modify
    purpose: Its sidecar blocks verbatim (DenyTelemetryProdPrefixIO's exception set gains role/telemetry-content-reader).
  - file: tests/checks/iam_tf/test_bootstrap_ci_roles.py
    action: Modify
    purpose: Its sidecar blocks verbatim (the protected-role prefix set and the closed read-action set gain the new names).
  - file: tests/checks/iam_tf/test_platform_role_metadata_admin_scope.py
    action: Modify
    purpose: Its sidecar block verbatim (both new bootstrap files join the scanned tuple).
  - file: tests/checks/iam_tf/test_terraform_github_import_blocks.py
    action: Modify
    purpose: Its sidecar blocks verbatim (the two new GitHub addresses are exempt until VP 8 creates them; rec-4911 pattern).
  - file: tests/checks/iam_tf/_platform_security_patterns.py
    action: Modify
    purpose: Its sidecar blocks verbatim (the alarm set, the filter's required clauses and a regex hit/miss predicate).
  - file: tests/fixtures/platform_security_filter_events.yaml
    action: Modify
    purpose: Its sidecar block verbatim, four events (an allowed and a denied role write, a denied code update, and the deploy role's own update, which pages too).
  - file: tests/checks/iam_tf/test_agent_ducklake_api.py
    action: Modify
    purpose: Five routes; the content route's permission source ARN names its exact stage, method and route.
  - file: tests/lambdas/ducklake_telemetry_content_reader/test_access_log.py
    action: Modify
    purpose: REST and Function URL shapes yield the caller name; mixed, absent and malformed shapes yield unknown.
  - file: tests/lambdas/ducklake_telemetry_content_reader/test_handler.py
    action: Modify
    purpose: A named_read without caller fields returns 403 missing_caller_identity and writes one access-log line; describe is unaffected.
  - file: tests/telemetry_capture/test_read_route.py
    action: Modify
    purpose: execute_api resolves the content route parameter; a content verb on the event route still raises WrongRoute.
  - file: docs/plans/PLAN-telemetry-content-reader-lock.yaml
    action: Delete
    purpose: >-
      The superseded, never-built plan (#1723: Function URL, PlatformDev caller, other role names) is retired by
      deletion with provenance in git history (docs/CLAUDE.md plans lifecycle), so no worker picks it up and builds it.
bundled_recommendations: []
followon_recs: [rec-5246]
infrastructure_dependencies:
  - >-
    terraform/bootstrap is admin-only and this change is in Decision 257 cl.3's protected set (the boundary, new roles
    outside agent-platform-*, the agent session user's policies, bootstrap-* policies), so the merge push's
    terraform-bootstrap-apply preview ends CLOUDSHELL_REQUIRED (expected) and the operator applies the whole plan from
    CloudShell, never split and never -target (deploy-paths.yaml admin_out_of_band.bootstrap_ci_apply). Pre-merge: the
    operator's ENVIRONMENT CHECK and screened read-only plan at the PR head (VP 5-6). One merged-unapplied bootstrap
    change at a time.
  - >-
    Order after merge: bootstrap CloudShell apply (VP 7) -> IAM simulation (in VP 7) -> terraform-github-apply dispatch
    naming github_repository_environment.telemetry_content_deploy and
    github_repository_environment_deployment_policy.telemetry_content_deploy_main in gate_change, approved by the
    operator (Decision 248 cl.3; VP 8) -> the sandbox apply of terraform/personal's concurrency change runs on the merge
    push by itself (VP 9) -> the placeholder answers through the API (VP 10).
  - >-
    Detector email expected from the bootstrap apply: platform-security-detector-tamper (new platform-security-* log
    group, filter and alarms; the trail's selector), platform-security-platform-role-iam-change (the boundary's new
    version), platform-security-agent-session-iam-change (the session user's policy and boundary versions gain the
    route), platform-security-ducklake-api-change (the new route, deployment and Lambda permission) and
    platform-security-telemetry-content-change (the content function's create and the new roles). All are this
    plan's own writes; the operator is told before VP 7.
  - "Spend: one Lambda with no traffic until plan 2, one log group and three alarms; no new quota."
acceptance_criteria:
  - >-
    The boundary's minified PROD rendering is 5427 B and every bound principal is refused every Lambda create, delete,
    publish, put, tag and update on the content function and its qualifiers, while invoke and permission edits stay
    refused by the URL-only Denies for every identity-trusting function (test_telemetry_content_reader_iam.py,
    test_url_only_invoke_guard.py; live by VP 7's simulation).
  - >-
    telemetry-content-deploy is boundary-free, trusted only by the telemetry-content-deploy Environment subject plus the
    deploy workflow's job_workflow_ref at main, and holds only code and configuration changes on the function plus layer
    reads; telemetry-content-reader carries the boundary and reads only the production telemetry data and blob prefixes,
    the reader DSN parameter and its own log group (tests; VP 7 simulation).
  - >-
    agent-platform-session reaches the function only through POST telemetry/content on the DuckLake API and, before plan
    2, gets the placeholder's 503 content_reader_not_deployed (VP 10).
  - >-
    The access log names the caller from the delivering path's event shape and a named_read without caller fields is
    refused 403 (test_access_log.py, test_handler.py).
  - >-
    The telemetry-content-deploy Environment exists with a required reviewer, admin bypass off and a main-only policy
    (VP 8), created by Terraform with no Settings step.
  - >-
    docs/DECISIONS.md carries the new Decision and its nine amendment notes word for word from the sidecar, and the
    approval run binds the sidecar (VP 4).
verification_plan:
  - step: 1
    phase: pre-deploy
    action: Run the new and changed tests.
    command: >-
      bin/venv-python -m pytest tests/checks/iam_tf/test_telemetry_content_reader_iam.py
      tests/checks/iam_tf/test_url_only_invoke_guard.py tests/checks/iam_tf/test_agent_ducklake_api.py
      tests/lambdas/ducklake_telemetry_content_reader/test_access_log.py
      tests/lambdas/ducklake_telemetry_content_reader/test_handler.py tests/telemetry_capture/test_read_route.py
      tests/checks/iam_tf/test_telemetry_prefix_fence.py tests/checks/iam_tf/test_bootstrap_ci_roles.py
      tests/checks/iam_tf/test_platform_role_metadata_admin_scope.py tests/checks/iam_tf/test_terraform_github_import_blocks.py
      tests/checks/iam_tf/test_platform_role_iam_change_alarms.py tests/test_terraform_bootstrap_apply_gate.py
      tests/test_security_detector_probe.py tests/checks/iam_tf/test_iam_invariants.py
      tests/checks/iam_tf/test_telemetry_reader_and_twin_pins.py -q
    expected: >-
      All pass, and the same files against the unchanged tree fail on the new assertions (the IAM test file does not
      exist before).
    fix_if: A failure is fixed in the code or Terraform, never by narrowing an assertion (Decision 235).
    hermetic: true
    expected_literals: ["passed"]
    graduation: waive
    graduation_waiver_reason: >-
      PR CI's diff-selected pytest runs these files; the test_obligations nodes pin each behaviour and the IAM file is
      rec-4696's acceptance.
  - step: 2
    phase: pre-deploy
    action: Standing IAM and Terraform text checks accept the changed roots.
    command: >-
      bin/venv-python -m scripts.checks.iam_tf.validate_iam_policy_size && bin/venv-python -m
      scripts.checks.ci_guards.validate_project_region && terraform fmt -check -recursive terraform/bootstrap
      terraform/github terraform/personal && echo FMT_OK
    expected: Both checks pass and FMT_OK prints.
    fix_if: A finding names the resource; fix the Terraform, never the check.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: Standing checks already run in the fast tier; this step runs them early.
  - step: 3
    phase: pre-deploy
    action: Fast and full tiers before handoff.
    command: >-
      bin/venv-python -m scripts.validate --pre && bin/venv-python -m scripts.validate && bin/venv-python -m
      scripts.checks.validation_result --verify-head
    expected: >-
      Both tiers pass and validation_result verifies the head sha. The full tier starts in the background with a 2 h
      limit from the top-level session; its verdict is --verify-head's.
    fix_if: >-
      A failure caused by this diff is fixed on the branch; one that reproduces on origin/main is cited by its existing
      rec in the PR body, never fixed inline.
    hermetic: false
    graduation: not-applicable
  - step: 4
    phase: pre-deploy
    action: >-
      The build's tree holds exactly the sidecar's words with {{N}} and {{DATE}} filled, and the approval run the planning
      session dispatched (Decision 246) is approved; a changed word needs a new run before merge.
    command: >-
      bin/venv-python -m scripts.roadmap.plan_wording_check --slug telemetry-content-reader-api-lock --tree .
    expected: PASS, naming the sidecar digest that the approval run recorded.
    fix_if: A mismatch is fixed toward the sidecar; a needed word change goes back to the planning session and a new run.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      Its digest is specific to this sidecar and PR CI's approved-text binding (validate_merge_step) re-checks the same
      words on every later change, so a standing rerun would duplicate that gate.
  - step: 5
    phase: pre-deploy
    action: >-
      ENVIRONMENT CHECK (deploy-paths.yaml admin_out_of_band.pre_merge_live_plan), operator-run in AWS CloudShell in
      the PROD account as user/platform-breakglass, posted once the PR is CI green.
    command: >-
      ( printf 'caller-arn check: '; aws sts get-caller-identity --query Arn --output text 2> /dev/null | grep -q
      ':user/platform-breakglass$' && echo ADMIN_CHAIN_OK || echo ADMIN_CHAIN_ABSENT )
    expected: caller-arn check, ADMIN_CHAIN_OK. The ARN itself is never printed.
    fix_if: ADMIN_CHAIN_ABSENT; the operator signs in as the break-glass user and re-runs, and VP 6 waits.
    hermetic: false
    graduation: not-applicable
  - step: 6
    phase: pre-deploy
    action: >-
      PRE-MERGE GATE (ADMIN), operator-run in CloudShell after VP 5 at the PR's full CI-green head (the build fills
      PR_HEAD_SHA): fetch, screen (only this plan's terraform/bootstrap files changed under terraform/bootstrap, no
      provider, module, data source, provisioner or import added), verified terraform install, tfvars from SSM, init, a
      read-only plan, and the boundary's planned minified length. Names and counts only.
    command: >-
      ( set -o pipefail; PR_HEAD_SHA=<full PR head sha>; W="${TMPDIR:-/tmp}/tcr"; L="$HOME/tcr-tf.err"; rm -rf "$W";
      mkdir -p "$W/bin"; : > "$L"; trap 'rm -rf "$W"' EXIT; unset AWS_PROFILE; git init -q "$W/repo" 2>> "$L"; { git -C
      "$W/repo" fetch -q --depth 1 https://github.com/otl-labs/ontheloop.git +refs/heads/main:refs/o/main && git -C
      "$W/repo" fetch -q --depth 1 https://github.com/otl-labs/ontheloop.git "$PR_HEAD_SHA" && git -C "$W/repo" checkout
      -q --detach FETCH_HEAD; } 2>> "$L" || { echo CLONE_FAILED; exit 1; }; F=$(git -C "$W/repo" diff --name-only
      refs/o/main HEAD -- terraform/bootstrap config/aws-region config/terraform-version 2>> "$L" | LC_ALL=C sort | tr '\n' ' ');
      X=$(git -C "$W/repo" diff refs/o/main HEAD -- 'terraform/*.tf' 2>> "$L" | grep -E '^\+' | grep -cE 'data
      "(external|http)"|provider "|required_providers|module "|provisioner|local-exec|^\+\s*(data|import|removed|check|terraform)\b');
      [ "$F" = "terraform/bootstrap/agent_ducklake_api.tf terraform/bootstrap/bootstrap_ci_apply.tf terraform/bootstrap/github_ci_apply_boundary.tf terraform/bootstrap/platform_security_alarms.tf terraform/bootstrap/platform_security_trail.tf terraform/bootstrap/telemetry_content_deploy_role.tf terraform/bootstrap/telemetry_content_reader.tf " ]
      && [ "$X" = 0 ] || { echo SCREEN_REFUSED; exit 1; }; echo SCREEN_OK; R=$(tr -d '[:space:]' <
      "$W/repo/config/aws-region"); export AWS_REGION="$R" AWS_DEFAULT_REGION="$R"; V=$(tr -d '[:space:]' <
      "$W/repo/config/terraform-version"); case "$(uname -m)" in aarch64) P=linux_arm64 ;; *) P=linux_amd64 ;; esac;
      Z="terraform_${V}_${P}.zip"; { curl -fsSL -o "$W/$Z" "https://releases.hashicorp.com/terraform/$V/$Z" && curl -fsSL
      -o "$W/sums" "https://releases.hashicorp.com/terraform/$V/terraform_${V}_SHA256SUMS" && ( cd "$W" && grep " $Z\$"
      sums | sha256sum -c --quiet - ) && unzip -qo "$W/$Z" -d "$W/bin"; } >> "$L" 2>&1 || { echo TERRAFORM_INSTALL_FAILED;
      exit 1; }; export PATH="$W/bin:$PATH"; command -v jq > /dev/null || { echo JQ_ABSENT; exit 1; }; aws ssm
      get-parameter --name /secret/agent-platform-terraform-personal-tfvars --with-decryption --query Parameter.Value
      --output text > "$W/vars.tfvars" 2>> "$L" && test -s "$W/vars.tfvars" || { echo TFVARS_ABSENT; exit 1; }; A=$(aws
      sts get-caller-identity --query Account --output text 2>> "$L"); test -n "$A" || { echo IDENTITY_FAILED; exit 1; };
      B="$W/repo/terraform/bootstrap"; terraform -chdir="$B" init -input=false -lockfile=readonly
      -backend-config="region=$R" > /dev/null 2>> "$L" || { echo INIT_FAILED; exit 1; }; terraform -chdir="$B" plan
      -lock=false -input=false -no-color -detailed-exitcode -var-file="$W/vars.tfvars" -var "account_id=$A" -var
      "aws_profile=" -out="$W/head.bin" > "$W/plan.txt" 2>> "$L"; echo "HEAD_PLAN_EXIT $?"; grep -E '^Plan: '
      "$W/plan.txt"; terraform -chdir="$B" show -json "$W/head.bin" > "$W/plan.json" 2>> "$L"; jq -r '.resource_changes[]
