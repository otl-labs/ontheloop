      (a depth-2 fetch, screened on HEAD^..HEAD), a saved plan applied only when its address list equals the one the
      build recorded from VP 6, a fresh plan, and IAM simulation with ARNs built in-shell and never printed. The
      operator's paste is the direction for the apply (Decision 126 cl.1).
    command: >-
      ( set -o pipefail; M=<full merge sha>; G0='<address list recorded from VP 6, space-terminated>';
      W="${TMPDIR:-/tmp}/tcr"; L="$HOME/tcr-tf.err"; rm -rf "$W"; mkdir -p "$W/bin"; : > "$L"; trap 'rm -rf "$W"' EXIT;
      unset AWS_PROFILE; git init -q "$W/repo" 2>> "$L"; { git -C "$W/repo" fetch -q --depth 2
      https://github.com/otl-labs/ontheloop.git "$M" && git -C "$W/repo" checkout -q --detach FETCH_HEAD; } 2>> "$L" || {
      echo CLONE_FAILED; exit 1; }; X=$(git -C "$W/repo" diff HEAD^ HEAD -- 'terraform/*.tf' 2>> "$L" | grep -E '^\+' |
      grep -cE 'data "(external|http)"|provider "|required_providers|module "|provisioner|local-exec|^\+\s*(data|import|removed|check|terraform)\b');
      [ "$X" = 0 ] || { echo SCREEN_REFUSED; exit 1; }; echo SCREEN_OK; R=$(tr -d '[:space:]' <
      "$W/repo/config/aws-region"); export AWS_REGION="$R" AWS_DEFAULT_REGION="$R"; V=$(tr -d '[:space:]' <
      "$W/repo/config/terraform-version"); case "$(uname -m)" in aarch64) P=linux_arm64 ;; *) P=linux_amd64 ;; esac;
      Z="terraform_${V}_${P}.zip"; { curl -fsSL -o "$W/$Z" "https://releases.hashicorp.com/terraform/$V/$Z" && curl -fsSL
      -o "$W/sums" "https://releases.hashicorp.com/terraform/$V/terraform_${V}_SHA256SUMS" && ( cd "$W" && grep " $Z\$"
      sums | sha256sum -c --quiet - ) && unzip -qo "$W/$Z" -d "$W/bin"; } >> "$L" 2>&1 || { echo TERRAFORM_INSTALL_FAILED;
      exit 1; }; export PATH="$W/bin:$PATH"; aws ssm get-parameter --name /secret/agent-platform-terraform-personal-tfvars
      --with-decryption --query Parameter.Value --output text > "$W/vars.tfvars" 2>> "$L" && test -s "$W/vars.tfvars" ||
      { echo TFVARS_ABSENT; exit 1; }; A=$(aws sts get-caller-identity --query Account --output text 2>> "$L"); test -n
      "$A" || { echo IDENTITY_FAILED; exit 1; }; B="$W/repo/terraform/bootstrap"; terraform -chdir="$B" init -input=false
      -lockfile=readonly -backend-config="region=$R" > /dev/null 2>> "$L" || { echo INIT_FAILED; exit 1; }; terraform
      -chdir="$B" plan -input=false -no-color -var-file="$W/vars.tfvars" -var "account_id=$A" -var "aws_profile="
      -out="$W/apply.bin" > "$W/plan.txt" 2>> "$L"; grep -E '^Plan: ' "$W/plan.txt"; G=$(terraform -chdir="$B" show -json
      "$W/apply.bin" | jq -r '.resource_changes[] | select(.change.actions != ["no-op"]) | .address' | LC_ALL=C sort | tr
      '\n' ' '); [ "$G" = "$G0" ] || { echo APPLY_SKIPPED; exit 1; }; terraform -chdir="$B" apply -input=false -no-color
      "$W/apply.bin" > /dev/null 2>> "$L" && echo APPLY_DONE || { echo APPLY_FAILED; exit 1; }; terraform -chdir="$B" plan
      -lock=false -input=false -no-color -detailed-exitcode -var-file="$W/vars.tfvars" -var "account_id=$A" -var
      "aws_profile=" > /dev/null 2>> "$L"; echo "REPLAN_EXIT $?"; FN="arn:aws:lambda:$R:$A:function:agent-platform-ducklake-telemetry-content";
      sim() { aws iam simulate-principal-policy --policy-source-arn "$1" --action-names "$2" --resource-arns "$3"
      --context-entries "ContextKeyName=aws:PrincipalArn,ContextKeyValues=$1,ContextKeyType=string" --query 'EvaluationResults[0].EvalDecision' --output text 2>> "$L" | sed "s/^/SIM $4 /" || echo "SIM $4 ERROR"; };
      sim "arn:aws:iam::$A:role/agent-platform-github-ci-deploy" lambda:UpdateFunctionCode "$FN" ci_deploy_code; sim
      "arn:aws:iam::$A:role/agent-platform-github-ci-apply" lambda:UpdateFunctionConfiguration "$FN" ci_apply_config; sim
      "arn:aws:iam::$A:role/agent-platform-github-ci-apply" iam:PutRolePolicy "arn:aws:iam::$A:role/telemetry-content-deploy"
      ci_apply_deploy_role; sim "arn:aws:iam::$A:role/bootstrap-apply" lambda:UpdateFunctionCode "$FN" bootstrap_code; sim
      "arn:aws:iam::$A:role/telemetry-content-deploy" lambda:UpdateFunctionCode "$FN" deploy_code; sim
      "arn:aws:iam::$A:role/telemetry-content-deploy" iam:PutRolePolicy "arn:aws:iam::$A:role/telemetry-content-deploy"
      deploy_iam; sim "arn:aws:iam::$A:role/telemetry-content-reader" s3:GetObject
      "arn:aws:s3:::agent-platform-data-lake/ducklake-telemetry/x" reader_data; sim "arn:aws:iam::$A:role/telemetry-content-reader"
      lambda:UpdateFunctionCode "$FN" reader_code; sim "arn:aws:iam::$A:role/bootstrap-preview" lambda:GetFunction "$FN"
      preview_get; sim "arn:aws:iam::$A:role/bootstrap-preview" lambda:ListVersionsByFunction "$FN" preview_versions; sim
      "arn:aws:iam::$A:role/bootstrap-preview" lambda:GetRuntimeManagementConfig "$FN" preview_runtime; echo "M $M" )
