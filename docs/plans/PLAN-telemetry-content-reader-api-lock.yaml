schema_version: 6
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "telemetry-content-reader-api-lock"
intent: >-
  Plan 1 of 2 for rec-4696, superseding PLAN-telemetry-content-reader-lock (#1723), which predates Decisions 248, 255,
  256, 257 and 258. terraform/bootstrap creates the masked telemetry content reader with an inert placeholder, its
  execution role telemetry-content-reader (CI apply boundary, excepted from the telemetry prefix fence) and a deploy
  role telemetry-content-deploy that is boundary-free by an explicit Decision 144 cl.3 exclusion, its 365-day access-log
  group, unexpected-caller and error alarms, and a fifth route telemetry/content on the DuckLake REST API, so the agent
  session user reaches it only through the signed API. The CI apply boundary gains DenyTelemetryContentChange and the
  telemetry-content-* protected-role prefix, paid for by naming the three URL-only Denies' functions by prefix (account
  wildcarded, region kept), so it falls from 5,696 B to 5,427 B and the operator's re-decided trigger sits there.
  terraform/github declares the reviewer-gated telemetry-content-deploy Environment and its main policy. The handler
  reads the caller from the delivering path's event shape. Plan 2 (rec-5246) builds the deploy channel and closes
  rec-4696.
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-telemetry-content-reader-api-lock.yaml
phase: >-
  ad_hoc_rec (soft-warn category; no tier_item claimed, so the Tier Item Freshness Gate is skipped): rec-4696 (High),
  a prerequisite on the operator's feedback-loop gate before T3.3/T3.4 waves 2-4. closes_criteria is empty.
cites: [dec:126, dec:144, dec:172, dec:177, dec:202, dec:213, dec:223, dec:230, dec:236, dec:237, dec:238, dec:235, dec:239, dec:246, dec:248, dec:252, dec:255, dec:256, dec:257, dec:258]
closes_criteria: []
amends:
  - dec:144#3
  - dec:202#3
  - dec:213#1
  - dec:230#5
  - dec:239#1
  - dec:239#4
  - dec:239#5
  - dec:239#7
  - dec:255#1
  - dec:256#2
  - dec:257#3
  - dec:258#2
introduces:
  - telemetry-content-deploy
  - telemetry-content-reader
  - DenyTelemetryContentChange
  - platform-security-telemetry-content-change
scope:
  - file: docs/plans/approved/telemetry-content-reader-api-lock.yaml
    action: Create
    purpose: >-
      The approved-text sidecar (Decision 246): every word this plan lands in a bound file, verbatim, with {{N}} and
      {{DATE}} the only placeholders. It binds the Decision text and, because IAM is always_ask, every Terraform, test pin
      and fixture edit below whose purpose says "sidecar"; the build edits nothing else in those files. Generated from
      the wording-check tree's diff, so the bound test pins are green against the bound Terraform.
  - file: terraform/bootstrap/telemetry_content_reader.tf
    action: Create
    purpose: >-
      Its sidecar block verbatim: the function (placeholder code; ignore_changes on code, layers, handler
      and environment, which plan 2's gated job owns; reserved concurrency 2), the execution role and its exact policy,
      the 365-day platform-security-telemetry-content-access log group, the unexpected-caller filter and alarm and the
      errors alarm. Every resource is count-gated to sandbox (SIT declares none, as agent_ducklake_api.tf). No Function URL.
  - file: terraform/bootstrap/telemetry_content_deploy_role.tf
    action: Create
    purpose: Its sidecar block verbatim. Inert until plan 2's workflow exists.
  - file: terraform/lambda-placeholders/telemetry_content_placeholder.zip
    action: Create
    purpose: >-
      Committed inert placeholder (environment-taxonomy conformance: Terraform reads no build artifact). One member,
      src/lambdas/ducklake_telemetry_content_reader/handler.py, whose handler returns statusCode 503 with body
      {"error": "content_reader_not_deployed"} to every event; written byte-reproducibly (fixed mtime, mode 0644,
      ZIP_DEFLATED) and its sha256 pinned in the IAM test. The sidecar's .gitignore line un-ignores this one path, so
      validate_terraform_no_build_artifact_reads (rule b) passes: the file is tracked source, not a build output. It sits
      outside every Terraform root because the bootstrap screen (scripts/ci/terraform_hcl_screen.py read_root and
      tree_rules) refuses any non-.tf or binary file in terraform/bootstrap; telemetry_content_reader.tf reads it as
      ${path.module}/../lambda-placeholders/telemetry_content_placeholder.zip.
  - file: .gitignore
    action: Modify
    purpose: Its sidecar block verbatim (the placeholder's un-ignore line, directly under *.zip).
  - file: terraform/bootstrap/agent_ducklake_api.tf
    action: Modify
    purpose: Its sidecar block verbatim; the session grant and boundary, method, integration, permission and URL parameter follow by for_each.
  - file: terraform/bootstrap/github_ci_apply_boundary.tf
    action: Modify
    purpose: >-
      Its sidecar blocks verbatim: prefix names in the three URL-only Denies, the fence exception for
      role/telemetry-content-reader, the telemetry-content-* protected-role prefix and DenyTelemetryContentChange.
      Measured at planning (terraform console over the boundary locals, placeholder account id): 5,696 -> 5,427 B
      minified PROD, 5,463 B SIT.
  - file: terraform/bootstrap/bootstrap_ci_apply.tf
    action: Modify
    purpose: >-
      Its sidecar blocks verbatim, line-neutral (the file is at its 500-line budget): bootstrap_plan_read_actions'
      "lambda:GetPolicy" item and LambdaPolicyRead's Action gain "lambda:GetFunction*", "lambda:GetRuntimeManagementConfig"
      and "lambda:ListVersionsByFunction" on the same lines, so the preview and apply refresh the content function
      (resource stays function:agent-platform-ducklake-*); DenyProtectedRoleWrite's ducklake-api-* line gains
      role/telemetry-content-* (Decision 257 cl.3's protected set). bootstrap-apply gains no Lambda write.
  - file: scripts/ci/terraform_bootstrap_apply_classify.py
    action: Modify
    purpose: >-
      Its sidecar block verbatim: PROTECTED_NAME_PATTERNS gains "role/telemetry-content-*", matching the HCL Deny
      (test_protected_patterns_match_hcl_denies), so a plan touching either role classifies CLOUDSHELL_REQUIRED by name,
      not only by the non-agent-platform rule.
  - file: tests/test_terraform_bootstrap_apply_gate.py
    action: Modify
    purpose: A plan creating role telemetry-content-reader, and one updating telemetry-content-deploy's inline policy, classify CLOUDSHELL_REQUIRED and name the matched pattern.
  - file: terraform/bootstrap/platform_security_trail.tf
    action: Modify
    purpose: Its sidecar block verbatim (Decision 213 cl.4).
  - file: terraform/bootstrap/platform_security_alarms.tf
    action: Modify
    purpose: >-
      Its sidecar blocks verbatim: the platform-security-telemetry-content-change filter (case-insensitive role regex,
      denied calls matched on errorMessage, Lambda writes by any identity, the gated deploy included, since Decision 202
      cl.6 never filters by actor; under 1,024 characters), its metric name and its alarm resource.
  - file: config/iam-invariants.json
    action: Modify
    purpose: >-
      Its sidecar block verbatim: the ci_writable protected-role never row gains role/telemetry-content-*, so the
      classifier's protected names and the invariants agree (test_every_protected_name_is_a_ci_writable_never_resource).
  - file: tests/checks/iam_tf/test_iam_invariants.py
    action: Modify
    purpose: Its sidecar block verbatim (the field-for-field pin gains the same resource).
  - file: scripts/ci/security_detector_probe.py
    action: Modify
    purpose: >-
      Its sidecar block verbatim: EXPECTED_ALARMS gains platform-security-telemetry-content-change, matching the HCL
      (tests/test_security_detector_probe.py test_expected_alarms_match_the_hcl).
  - file: terraform/github/environments.tf
    action: Modify
    purpose: Its sidecar block verbatim.
  - file: terraform/personal/ducklake_telemetry_reader.tf
    action: Modify
    purpose: >-
      reserved_concurrent_executions 5 -> 4, with a comment naming the content reader (1): the reader login's CONNECTION
      LIMIT 10 is summed across both functions at two slots each (Decision 239 cl.1, Decision 230 cl.3). 4, not 3: the
      reader's daily peak ConcurrentExecutions over 14 days to 2026-11-17 was 2-5 with zero throttles (critic's
      CloudWatch read), and its client retries only 502/503/504, so 3 would add a 429 failure class while rec-5247 and
      rec-5248 are open; the content reader serves one feedback-loop consumer, so 1 suffices until plan 2 measures it.
      A non-IAM in-budget update that the sandbox apply applies after merge.
  - file: tests/checks/iam_tf/test_telemetry_reader_and_twin_pins.py
    action: Modify
    purpose: >-
      concurrency_problems sums both functions (2 * (reader + content) <= the login's limit, the content literal read
      from terraform/bootstrap/telemetry_content_reader.tf), and the red-twin mutation moves from
      "reserved_concurrent_executions = 5" to "= 4" so it still bites (Decision 235: no case dropped).
  - file: src/lambdas/ducklake_telemetry_content_reader/access_log.py
    action: Modify
    purpose: >-
      _role reads the caller's name from the delivering path only: requestContext.identity.userArn on a REST AWS_PROXY
      event (httpMethod present, requestContext.apiId set, no authorizer.iam), or requestContext.authorizer.iam.userArn
      on a Function URL event; both present, neither, or a malformed ARN is "unknown" (Decision 255 cl.2). The name is
      the ARN's second resource segment (user/agent-platform-session -> agent-platform-session), masked as today.
  - file: src/lambdas/ducklake_telemetry_content_reader/handler.py
    action: Modify
    purpose: >-
      A named_read without the delivering path's signed caller fields (accountId and userArn, the same shape rule)
      returns 403 missing_caller_identity before any read; describe stays open. The access-log line is still written.
  - file: src/lambdas/ducklake_telemetry_content_reader/manifest.yaml
    action: Modify
    purpose: runtime_config names /agent-platform/ducklake/api_url/telemetry/content; notes name the API route; status stays stub (plan 2 flips it).
  - file: scripts/telemetry_capture/read_route.py
    action: Modify
    purpose: >-
      The content reader resolves only /agent-platform/ducklake/api_url/telemetry/content through the API transport (the
      function has no Function URL); under the function_url transport it raises a clear error naming the API route
      instead of probing a Function URL that cannot exist. Its docstring drops "no API route yet".
  - file: docs/contracts/ducklake_telemetry_content_reader.yaml
    action: Modify
    purpose: The principal becomes agent-platform-session over the telemetry/content route (no Function URL); the deploy role telemetry-content-deploy is named.
  - file: docs/DECISIONS.md
    action: Modify
    purpose: Its sidecar blocks verbatim (the new entry and nine dated notes), with {{N}} the next free number and {{DATE}} the build date.
  - file: tests/checks/iam_tf/test_telemetry_content_reader_iam.py
    action: Create
    purpose: >-
      rec-4696's acceptance file. Pins: the boundary's minified PROD rendering is 5427 B and SIT's is under 6,144 B;
      DenyTelemetryContentChange's actions and resource; the five URL-only prefixes; the fence exception; the
      protected-role prefix; both roles' names, boundary presence (reader) and absence (deploy), trust conditions and
      exact grants; no Function URL; the route key; the placeholder zip's sha256 and single member; bootstrap-apply's
      policy holds no lambda write action; the alarm filter's length and both clauses.
  - file: tests/checks/iam_tf/test_url_only_invoke_guard.py
    action: Modify
    purpose: >-
      Its sidecar blocks verbatim: _FIVE becomes _FUNCTIONS with the content reader added, the boundary pins move from
