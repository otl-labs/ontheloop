      the preview did not list.
    hermetic: false
    graduation: not-applicable
  - step: 9
    phase: post-deploy
    action: The merge push's terraform-apply-sandbox run applies the telemetry reader's concurrency change alone.
    command: >-
      bin/venv-python -c "print('MCP: mcp__github__actions_list(method=list_workflow_runs, workflow terraform-apply-sandbox,
      head_sha=<merge sha>) then actions_get asserting conclusion == success and get_job_logs asserting the plan names
      only aws_lambda_function.ducklake_telemetry_reader, update in-place; then, 24 hours later, aws cloudwatch
      get-metric-statistics --profile agent_platform --namespace AWS/Lambda --metric-name Throttles --dimensions
      Name=FunctionName,Value=agent-platform-ducklake-telemetry-reader --period 86400 --statistics Sum over that day')"
    expected: >-
      The run concluded success, the plan changed only reserved_concurrent_executions on the telemetry reader, and the
      reader's Throttles sum for the following 24 hours is 0.
    fix_if: >-
      A red run follows the reconcile row in deploy-paths.yaml; never apply by hand. Throttles above 0: file a rec naming
      the count, and the operator chooses between raising the login's CONNECTION LIMIT through the operator verb and
      adding 429 to the reader client's retry set.
