      SCREEN_OK; a Plan line; APPLY_DONE; REPLAN_EXIT 0; SIM ci_deploy_code explicitDeny; SIM ci_apply_config
      explicitDeny; SIM ci_apply_deploy_role explicitDeny; SIM bootstrap_code implicitDeny; SIM deploy_code allowed; SIM
      deploy_iam implicitDeny; SIM reader_data allowed; SIM reader_code explicitDeny (the execution role carries the
      boundary, so the lock refuses it too); SIM preview_get allowed; SIM preview_versions allowed; SIM preview_runtime
      allowed; M. Every sim passes aws:PrincipalArn as context, because the simulator leaves it unset and a negated
