  - file: terraform/bootstrap/telemetry_content_deploy_role.tf
    action: Create
    purpose: >-
      Pinned verbatim in execution step PINNED-2. aws_iam_role.telemetry_content_deploy, named agent-platform-ducklake-telemetry-content-deploy, carries the CI
      apply boundary. Its name shares the content prefix, so DenyTelemetryContentChange's role resource covers it.
      Trust has ONE statement: Federated arn:aws:iam::${var.account_id}:oidc-provider/token.actions.githubusercontent.com,
      action sts:AssumeRoleWithWebIdentity, StringEquals with three keys:
        - aud: sts.amazonaws.com;
        - sub: [for repo in local.github_repos : "repo:${repo}:environment:telemetry-content-deploy"] (Decision 172
          immutable subjects; the local lives in github_ci_apply.tf);
        - job_workflow_ref: local.telemetry_content_workflow_refs =
          ["otl-labs/ontheloop/.github/workflows/deploy-telemetry-content.yml@refs/heads/main"] (Decision 238 cl.2 shape).
      No StringLike, and no ref or pull_request sub. The job_workflow_ref values are local.telemetry_content_workflow_refs
      in this file, which validate_github_org_transfer's content_deploy_workflow_ref row evaluates.
      aws_iam_role_policy.telemetry_content_deploy, over local.telemetry_content_deploy_policy_json with the 10,240 B
      lifecycle precondition, has five statements:
        - DeployCode: lambda:GetFunction, lambda:GetFunctionConfiguration, lambda:UpdateFunctionCode and
          lambda:UpdateFunctionConfiguration on the content function ARN only.
        - LayerRead: lambda:GetLayerVersion on layer:ducklake-deps:* and layer:ducklake-extensions:*.
        - UrlRead: lambda:GetFunctionUrlConfig on the function.
        - InvokeUrl: lambda:InvokeFunctionUrl on the function and its :*, unconditioned.
        - InvokeViaUrlOnly: lambda:InvokeFunction on the same two, with Bool lambda:InvokedViaFunctionUrl = true
          (Decision 213 cl.1).
      No iam:*, no PassRole, no PublishVersion, no concurrency, URL-config or permission verbs, no S3. No statement
      names PlatformDev or PlatformAdmin (Decision 225 cl.1).
  - file: terraform/bootstrap/github_ci_apply_boundary.tf
    action: Modify
    purpose: >-
      Three edits, pinned verbatim in execution step PINNED-3.
      (1) DenyTelemetryProdPrefixIO's ArnNotLike list gains the exact role/agent-platform-ducklake-telemetry-content
      (Decision 230 cl.5 as amended by Decision 239 cl.7). There is no wildcard, so the deploy role stays fenced.
      (2) A new statement DenyTelemetryContentChange, placed after DenyTelemetryProdPrefixIO:
        - Effect: Deny.
        - Action: lambda:Create*, lambda:Delete*, lambda:Publish*, lambda:Put*, lambda:Update*, lambda:TagResource,
          lambda:UntagResource, iam:Attach*, iam:Delete*, iam:Detach*, iam:PassRole, iam:Put*, iam:Tag*,
          iam:Untag* and iam:Update*.
        - Resource: arn:aws:lambda:${var.aws_region}:${var.account_id}:function:agent-platform-ducklake-telemetry-content*
          and arn:aws:iam::${var.account_id}:role/agent-platform-ducklake-telemetry-content*.
        - Condition: ArnNotLike aws:PrincipalArn arn:aws:iam::${var.account_id}:role/agent-platform-ducklake-telemetry-content-deploy.
      Every boundary carrier is therefore refused any code, configuration, permission, alias, concurrency or tag change
      to the function, and any policy, trust, boundary, tag or PassRole action on the execution role or the deploy
      role. Those carriers include agent-platform-github-ci-deploy, whose UpdateFunctionCode spans
      function:agent-platform-*, and the CI apply role, whose IAM writes span role/agent-platform-* (Decision 143
      cl.1, Decision 144 cl.2). PlatformAdmin and root sit outside the boundary (Decision 144 cl.3).
      (3) Byte recovery. In DenyDuckLakeDirectInvoke, DenyDuckLakeResourcePolicyEdit and DenyDuckLakeEventSourceMapping,
      the writer pair (name and name:*) becomes function:agent-platform-ducklake-writer* and the reader pair becomes
      function:agent-platform-ducklake-reader*. Each still covers the same functions and every qualifier. It can only
      widen a Deny, and only to a future function with that prefix; none exists today.
      Measured 2026-10-29: 5,266 B today and 5,463 B after all three edits with the real region; 5,311 B and 5,493 B
      with the test's 12-character placeholders. Both are under Decision 230's 5,632 B review trigger and the 6,144 B
      AWS limit. The precondition is unchanged.
