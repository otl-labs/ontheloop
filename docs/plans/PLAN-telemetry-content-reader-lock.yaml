        (e) The boundary carries DenyTelemetryContentChange with the declared action set, both resources and the single
            deploy-role exception, and the fence names the execution role exactly.
        (f) The deploy role's trust is one statement with the three exact StringEquals keys.
        (g) The script's update-function-configuration call passes exactly --handler, --layers and --environment.
        (h) terraform/github declares environment telemetry-content-deploy with required reviewers, prevent_self_review
            false, can_admins_bypass false, custom_branch_policies true, protected_branches false and prevent_destroy; one
