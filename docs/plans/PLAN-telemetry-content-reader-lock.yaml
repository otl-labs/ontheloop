    PINNED-5 (operator-approved, verbatim): .github/workflows/deploy-telemetry-content.yml, the whole file.
    name: deploy-telemetry-content

    # The masked telemetry content reader's only deploy path (Decision 239 cl.5, rec-4696). The build job holds no AWS
    # credential and no Environment: it checks the Environment's settings, lists the commits since the last approved
    # deploy, honours the production column hold and records the zip's digest. The deploy job waits in the
    # reviewer-gated telemetry-content-deploy Environment; once the operator approves, it assumes
    # agent-platform-ducklake-telemetry-content-deploy (the one identity the CI apply boundary lets change the function)
    # and deploys exactly the recorded digest with deploy_config.json's handler, layers and environment. It runs no pip
    # install and no repo Python while it holds the role.
    #
    # check-environment and change-summary are evidence for the operator, not controls (the script is repo code); the
    # controls are the Environment's protection rules and the role's trust. A newer push cancels an older run, so the
    # operator approves only the latest; a cancel between the configuration and code updates leaves approved configuration
    # beside the previously approved code until the next approved run. A rejected or cancelled run is an operator action
    # (ci_rca excluded); a pending approval never blocks another merge or deploy (Decision 93 note).

    on:
      push:
        branches: [main]
        paths:
          - '.github/workflows/deploy-telemetry-content.yml'
          - 'config/lambda/ducklake/field_semantics.static.yaml'
          - 'config/lambda/ducklake/field_semantics.yaml'
          - 'config/lambda/ducklake/version.yaml'
          - 'scripts/__init__.py'
          - 'scripts/aws_profile.py'
          - 'scripts/ci/telemetry_content_deploy.sh'
          - 'src/__init__.py'
          - 'src/common/__init__.py'
          - 'src/common/ducklake_content_read_verbs.py'
          - 'src/common/ducklake_control_tables.py'
          - 'src/common/ducklake_event_content.py'
          - 'src/common/ducklake_event_read_sql.py'
          - 'src/common/ducklake_event_read_verbs.py'
          - 'src/common/ducklake_event_reads.py'
          - 'src/common/ducklake_handler_errors.py'
          - 'src/common/ducklake_metrics.py'
          - 'src/common/ducklake_named_reads.py'
          - 'src/common/ducklake_partition_spec.py'
          - 'src/common/ducklake_read_deadline.py'
          - 'src/common/ducklake_reads.py'
          - 'src/common/ducklake_runtime.py'
          - 'src/common/ducklake_scd2_schema.py'
          - 'src/common/ducklake_spike.py'
          - 'src/common/ducklake_tables.py'
          - 'src/common/ducklake_telemetry_blobstore.py'
          - 'src/common/ducklake_version.py'
          - 'src/common/ducklake_write_rules.py'
          - 'src/common/ducklake_write_verbs.py'
          - 'src/common/ducklake_writes.py'
          - 'src/lambdas/__init__.py'
          - 'src/lambdas/ducklake_telemetry_content_reader/__init__.py'
          - 'src/lambdas/ducklake_telemetry_content_reader/access_log.py'
          - 'src/lambdas/ducklake_telemetry_content_reader/deploy_config.json'
          - 'src/lambdas/ducklake_telemetry_content_reader/handler.py'
          - 'src/lambdas/ducklake_telemetry_content_reader/manifest.yaml'
          - 'src/lambdas/ducklake_telemetry_content_reader/masked.py'
          - 'src/row_rules/__init__.py'
          - 'src/row_rules/rules.py'
          - 'src/sensitive_values/__init__.py'
          - 'src/sensitive_values/classes.py'
          - 'src/sensitive_values/engine.py'
          - 'src/sensitive_values/profiles.py'
          - 'src/telemetry/__init__.py'
          - 'src/telemetry/blobs.py'
          - 'src/telemetry/identity.py'
          - 'src/telemetry/request.py'
          - 'src/telemetry/timestamps.py'
      workflow_dispatch:

    permissions:
      contents: read

    concurrency:
      group: deploy-telemetry-content
      cancel-in-progress: true

    jobs:
      build:
        if: github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        timeout-minutes: 15
        permissions:
          contents: read
          deployments: read
          actions: read
        outputs:
          held: ${{ steps.hold.outputs.held }}
          sha256: ${{ steps.build.outputs.sha256 }}
        steps:
          - uses: actions/checkout@v7
            with:
              persist-credentials: false
              fetch-depth: 0

          - name: Environment settings (required reviewer, admin bypass off, main-only policy)
            env:
              GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            run: bash scripts/ci/telemetry_content_deploy.sh check-environment

          - name: Commits since the last approved deploy
            env:
              GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            run: bash scripts/ci/telemetry_content_deploy.sh change-summary

          - uses: actions/setup-python@v7
            with:
              python-version: '3.12'

          - name: Install build_lambda runtime deps (the repo's pinned versions)
            run: pip install -c requirements.txt pyyaml pydantic

          - name: Production column hold (a declared telemetry column still awaiting its production add)
            # The deploy-ducklake-lambdas.yml precedent: production telemetry code never ships ahead of the owner-login
            # column add. A hold is a green skip; the deploy job never asks the operator to approve a held run.
            id: hold
            run: |
              set -euo pipefail
              python -m scripts.checks.ops_governance.validate_reconcile_pending_gate --telemetry-hold | tee -a "$GITHUB_OUTPUT"
              if grep -qx 'held=true' "$GITHUB_OUTPUT"; then
                echo "::notice::TELEMETRY_PRODUCTION_HOLD - the content reader is not deployed until the pending column is added (docs/contracts/deploy-paths.yaml, code-deploy recovery)."
              fi

          - name: Build the content reader (no AWS credentials)
            id: build
            run: |
              set -euo pipefail
              python -m scripts.build_lambda --content-reader-only | tee build.log
              echo "sha256=$(sed -n 's/^CONTENT_READER_SHA256 //p' build.log)" >> "$GITHUB_OUTPUT"

          - name: Upload the content zip under its digest
            uses: actions/upload-artifact@v7
            with:
              name: telemetry-content-${{ steps.build.outputs.sha256 }}
              path: lambda-packages/ducklake-telemetry-content-reader.zip
              if-no-files-found: error
              retention-days: 30

      deploy:
        needs: build
        if: github.ref == 'refs/heads/main' && needs.build.outputs.held == 'false'
        runs-on: ubuntu-latest
        timeout-minutes: 15
        environment: telemetry-content-deploy
        permissions:
          id-token: write
          contents: read
        steps:
          - uses: actions/checkout@v7
            with:
              persist-credentials: false

          - uses: ./.github/actions/aws-region

          - uses: actions/download-artifact@v8
            with:
              name: telemetry-content-${{ needs.build.outputs.sha256 }}
              path: artifact

          - name: Assume the content deploy role (operator-approved run on main only)
            uses: aws-actions/configure-aws-credentials@v6
            env:
              MASK_AWS_ROLE_ID_ACCOUNT_PART: ${{ secrets.AWS_ROLE_ID_ACCOUNT_PART }}
            with:
              role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/agent-platform-ducklake-telemetry-content-deploy
              aws-region: ${{ env.AWS_REGION }}

          - name: Deploy the recorded digest with deploy_config.json
            env:
              CONTENT_SHA256: ${{ needs.build.outputs.sha256 }}
            run: bash scripts/ci/telemetry_content_deploy.sh deploy artifact/ducklake-telemetry-content-reader.zip "$CONTENT_SHA256"

          - name: Served verbs are exactly the two masked verbs
            run: bash scripts/ci/telemetry_content_deploy.sh describe
