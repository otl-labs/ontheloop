execution_steps:
  - |-
    PINNED-1 (operator-approved, verbatim): terraform/bootstrap/telemetry_content_reader.tf, the whole file.
    # Telemetry content reader (Decision 239; rec-4696).
    #
    # The masked transcript content reader lives in this admin-only root so that no CI identity can change it: the CI apply
    # boundary's DenyTelemetryContentChange refuses every boundary carrier any Lambda write on the function and any IAM
    # write or PassRole on its roles, except the deploy role (telemetry_content_deploy_role.tf), which only the
    # reviewer-gated telemetry-content-deploy Environment can assume (Decision 239 cl.5).
    #
    # Terraform owns identity, runtime, memory, timeout, concurrency, URL and logging. The gated job
    # (.github/workflows/deploy-telemetry-content.yml) owns code, layers, handler and environment, which ignore_changes
    # hands over. Until the first approved deploy the function runs telemetry_content_placeholder.zip, committed beside
    # this file, which answers 503 to every event: nothing serves content before the operator approves, Terraform reads no
    # build artifact, and no CI-writable S3 object can supply the code if the function is ever recreated.
    #
    # The access log group, its metric filter and both alarms are platform-security-* resources (Decision 202 cl.3 as
    # amended by Decision 239): no CI identity holds a write or log-event read grant on them, the detector-tamper alarm
    # pages on retention, filter and alarm definition changes to them, and PlatformDev cannot read the group (its log reads cover
    # /aws/lambda/agent-platform-* only), so an error line that echoes a row never reaches an agent.

    locals {
      ducklake_telemetry_content_function = "agent-platform-ducklake-telemetry-content"
      telemetry_content_data_prefix       = "ducklake-telemetry"
      telemetry_content_blob_prefix       = "telemetry-blobs/ducklake_telemetry"
      telemetry_content_bucket            = "agent-platform-data-lake"
      telemetry_content_alerts_topic_arn  = "arn:aws:sns:${var.aws_region}:${var.account_id}:agent-platform-alerts"
    }

    data "aws_secretsmanager_secret" "telemetry_content_reader_dsn" {
      name = "agent-platform-ducklake-telemetry-reader-dsn"
    }

    resource "aws_iam_role" "telemetry_content" {
      # Decision 144 cl.3: the mandatory exec-identity boundary.
      name                 = "agent-platform-ducklake-telemetry-content"
      description          = "Telemetry content reader: masked transcript reads over the reader login, data and blob prefixes read-only"
      permissions_boundary = "arn:aws:iam::${var.account_id}:policy/agent-platform-github-ci-apply-boundary"

      assume_role_policy = jsonencode({
        Version = "2012-10-17"
        Statement = [
          {
            Effect    = "Allow"
            Principal = { Service = "lambda.amazonaws.com" }
            Action    = "sts:AssumeRole"
          }
        ]
      })
    }

    locals {
      telemetry_content_policy_json = jsonencode({
        Version = "2012-10-17"
        Statement = [
          {
            Sid      = "Logs"
            Effect   = "Allow"
            Action   = ["logs:CreateLogStream", "logs:PutLogEvents"]
            Resource = ["${aws_cloudwatch_log_group.telemetry_content.arn}:*"]
          },
          {
            Sid      = "TelemetryCatalogDataRead"
            Effect   = "Allow"
            Action   = ["s3:GetObject"]
            Resource = ["arn:aws:s3:::${local.telemetry_content_bucket}/${local.telemetry_content_data_prefix}/*"]
          },
          {
            Sid      = "TelemetryCatalogDataList"
            Effect   = "Allow"
            Action   = ["s3:ListBucket", "s3:GetBucketLocation"]
            Resource = ["arn:aws:s3:::${local.telemetry_content_bucket}"]
            Condition = {
              StringLike = {
                "s3:prefix" = ["${local.telemetry_content_data_prefix}/*"]
              }
            }
          },
          {
            Sid      = "TelemetryBlobRead"
            Effect   = "Allow"
            Action   = ["s3:GetObject"]
            Resource = ["arn:aws:s3:::${local.telemetry_content_bucket}/${local.telemetry_content_blob_prefix}/*"]
          },
          {
            # Decision 237 cl.2: a declared consumer of the existing reader login, no new secret or parameter.
            Sid      = "TelemetryReaderDsnRead"
            Effect   = "Allow"
            Action   = ["secretsmanager:GetSecretValue"]
            Resource = [data.aws_secretsmanager_secret.telemetry_content_reader_dsn.arn]
          },
          {
            # The SSM twin of the read above; secrets-to-ssm-retire removes the Secrets Manager statement.
            Sid      = "TelemetryReaderDsnParameterRead"
            Effect   = "Allow"
            Action   = ["ssm:GetParameter"]
            Resource = ["arn:aws:ssm:${var.aws_region}:${var.account_id}:parameter/secret/agent-platform-ducklake-telemetry-reader-dsn"]
          },
        ]
      })
    }

    resource "aws_iam_role_policy" "telemetry_content" {
      name = "DuckLakeTelemetryContentRuntime"
      role = aws_iam_role.telemetry_content.id

      policy = local.telemetry_content_policy_json

      lifecycle {
        precondition {
          # AWS measures the whitespace-stripped document against the 10,240 B inline-policy limit (rec-2793).
          condition     = length(jsonencode(jsondecode(local.telemetry_content_policy_json))) <= 10240
          error_message = "Telemetry content reader inline policy exceeds the 10,240 B IAM inline-policy limit (whitespace-stripped measure, rec-2793)."
        }
      }
    }

    resource "aws_cloudwatch_log_group" "telemetry_content" {
      # Decision 239 cl.4: every read's access line is kept at least 90 days.
      name              = "platform-security-telemetry-content-access"
      retention_in_days = 365

      tags = {
        Name    = "DuckLake Telemetry Content Reader Logs"
        Purpose = "Decision 239 content reader access log"
      }

      lifecycle {
        prevent_destroy = true
      }
    }

    resource "aws_lambda_function" "telemetry_content" {
      function_name = local.ducklake_telemetry_content_function
      description   = "Decision 239 masked transcript content reader. Deployed only by the operator-approved telemetry-content-deploy job."
      role          = aws_iam_role.telemetry_content.arn
      runtime       = "python3.12"
      handler       = "src.lambdas.ducklake_telemetry_content_reader.handler.handler"
      architectures = ["x86_64"]
      timeout       = 120
      memory_size   = 1024

      # With the telemetry reader's 3, inside the reader login's CONNECTION LIMIT 10 at two slots each (Decision 239 cl.1).
      reserved_concurrent_executions = 2

      logging_config {
        log_format = "Text"
        log_group  = aws_cloudwatch_log_group.telemetry_content.name
      }

      # One member, src/lambdas/ducklake_telemetry_content_reader/handler.py, answering 503 content_reader_not_deployed to
      # every event (the IAM pins test pins its digest and decodes it).
      filename = "${path.module}/telemetry_content_placeholder.zip"

      depends_on = [
        aws_iam_role_policy.telemetry_content,
        aws_cloudwatch_log_group.telemetry_content,
      ]

      tags = {
        Name    = "DuckLake Telemetry Content Reader"
        Purpose = "Decision 239 masked content reads"
      }

      # Decision 239 cl.5: the gated job owns code, layers, handler and environment.
      lifecycle {
        ignore_changes = [filename, source_code_hash, layers, handler, environment]
      }
    }

    resource "aws_lambda_function_url" "telemetry_content" {
      function_name      = aws_lambda_function.telemetry_content.function_name
      authorization_type = "AWS_IAM"
    }

    resource "aws_ssm_parameter" "telemetry_content_url" {
      name  = "/agent-platform/ducklake/telemetry_content_reader_url"
      type  = "String"
      value = aws_lambda_function_url.telemetry_content.function_url

      tags = {
        Name    = "DuckLake Telemetry Content Reader URL"
        Purpose = "Decision 239 endpoint discovery"
      }
    }

    resource "aws_cloudwatch_log_metric_filter" "telemetry_content_unexpected_invoker" {
      # Any reader but PlatformDev, the deploy role included (its describe writes no line); role "unknown", the access
      # log's fallback line, matches on purpose.
      name           = "platform-security-telemetry-content-unexpected-invoker"
      log_group_name = aws_cloudwatch_log_group.telemetry_content.name
      pattern        = "{ ($.event = \"telemetry_content_read\") && ($.role != \"PlatformDev\") }"

      metric_transformation {
        name          = "TelemetryContentUnexpectedInvoker"
        namespace     = "AgentPlatform/TelemetryContent"
        value         = "1"
        default_value = "0"
      }
    }

    resource "aws_cloudwatch_metric_alarm" "telemetry_content_unexpected_invoker" {
      alarm_name          = "platform-security-telemetry-content-unexpected-invoker"
      alarm_description   = "A content read by a role other than PlatformDev (Decision 239 cl.6). Who read what: Logs Insights on platform-security-telemetry-content-access, filter event = 'telemetry_content_read' | stats count() by role, verb, session_id."
      namespace           = "AgentPlatform/TelemetryContent"
      metric_name         = aws_cloudwatch_log_metric_filter.telemetry_content_unexpected_invoker.metric_transformation[0].name
      statistic           = "Sum"
      period              = 300
      evaluation_periods  = 1
      threshold           = 1
      comparison_operator = "GreaterThanOrEqualToThreshold"
      treat_missing_data  = "notBreaching"
      alarm_actions       = [local.telemetry_content_alerts_topic_arn]
    }

    resource "aws_cloudwatch_metric_alarm" "telemetry_content_errors" {
      alarm_name          = "platform-security-telemetry-content-errors"
      alarm_description   = "DuckLake telemetry content reader: AWS/Lambda Errors plus Url5xxCount > 0 over 15m (loud-fail posture, Decision 55). The placeholder's 503 before the first approved deploy pages too."
      comparison_operator = "GreaterThanThreshold"
      evaluation_periods  = 1
      threshold           = 0
      treat_missing_data  = "notBreaching"

      metric_query {
        id = "m1"

        metric {
          metric_name = "Errors"
          namespace   = "AWS/Lambda"
          period      = 900
          stat        = "Sum"

          dimensions = {
            FunctionName = aws_lambda_function.telemetry_content.function_name
          }
        }
      }

      metric_query {
        id = "m2"

        metric {
          metric_name = "Url5xxCount"
          namespace   = "AWS/Lambda"
          period      = 900
          stat        = "Sum"

          dimensions = {
            FunctionName = aws_lambda_function.telemetry_content.function_name
          }
        }
      }

      metric_query {
        id          = "e1"
        expression  = "FILL(m1, 0) + FILL(m2, 0)"
        label       = "errors plus url 5xx"
        return_data = true
      }

      alarm_actions = [local.telemetry_content_alerts_topic_arn]
      ok_actions    = [local.telemetry_content_alerts_topic_arn]
    }
