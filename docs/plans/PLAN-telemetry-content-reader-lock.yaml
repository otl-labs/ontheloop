      bin/venv-python -c "from scripts.telemetry_capture.read_route import content_reader; v=sorted(content_reader('agent_platform').describe()); print('CONTENT_VERBS', v); assert v == ['session_transcript_masked', 'transcript_row_masked']" &&
      bin/venv-python -m scripts.ducklake_smoke.lambda_telemetry_golden_gates --profile agent_platform --no-alarms
      --assert-zero-mismatches --content-leg
    expected: >-
      exit 0. CONTENT_VERBS names exactly the two masked verbs (PlatformDev reaches the URL), and the golden run reports
      every replayed tree matched on the event and content legs, counts only.
    fix_if: A content mismatch -- read the leg's tree name and the access-log counts; fix forward through the gated channel. AccessDenied -- the PlatformDev grant did not apply; re-check step 11.
    hermetic: false
    graduation: not-applicable
  - step: 15
    phase: post-deploy
    action: >-
      The access log (Decision 239 cl.4): the group keeps 365 days, step 13's reads wrote PlatformDev lines, and
      PlatformDev cannot read the group. The line count is the named post-apply admin read in this walk.
    command: >-
      bin/venv-python -c "import json,subprocess,sys,time; g='platform-security-telemetry-content-access';
      aws=lambda prof,*a: subprocess.run(['aws',*a,'--profile',prof,'--output','json'],capture_output=True,text=True);
      groups=json.loads(aws('agent_platform','logs','describe-log-groups','--log-group-name-prefix',g).stdout)['logGroups'];
      ret=[x.get('retentionInDays') for x in groups if x['logGroupName']==g]; pat='{ ($.event = "telemetry_content_read") && ($.role = "PlatformDev") }';
      start=str(int((time.time()-7200)*1000)); ev=json.loads(aws('agent_platform_admin','logs','filter-log-events','--log-group-name',g,'--start-time',start,'--filter-pattern',pat).stdout)['events'];
      dev=aws('agent_platform','logs','filter-log-events','--log-group-name',g,'--start-time',start,'--limit','1'); denied=dev.returncode!=0 and 'AccessDenied' in dev.stderr;
      print('RETENTION', ret, 'PLATFORMDEV_READ_LINES', len(ev), 'DEV_LOG_READ_DENIED', denied); sys.exit(0 if ret==[365] and len(ev)>=1 and denied else 1)"
    expected: RETENTION [365] PLATFORMDEV_READ_LINES n (n >= 1) DEV_LOG_READ_DENIED True. Counts only; no line content is printed.
    fix_if: >-
      No lines -- the function is not logging to the configured group (read logging_config). DEV_LOG_READ_DENIED False
      -- a PlatformDev log grant reaches platform-security-*; stop and report it (an agent could read error text).
    hermetic: false
    graduation: not-applicable
  - step: 17
    phase: post-deploy
    action: rec-4696 is closed (the squash body's Resolves trailer).
    command: >-
      bin/venv-python -c "from src.common.ducklake_reader_client import fetch_recs_by_ids, make_reader;
      recs,_=fetch_recs_by_ids(make_reader(profile='agent_platform'), ['rec-4696']); st=[(x['id'], x['status']) for x in recs];
      print(st); assert st == [('rec-4696', 'closed')]; print('CLOSURE_OK')"
    expected: "[('rec-4696', 'closed')] then CLOSURE_OK."
    fix_if: Open -- the closure job did not run on the Resolves trailer; close it with update_rec naming the merged PR.
    hermetic: false
    graduation: not-applicable
  - step: 20
    phase: post-deploy
    action: ops_decisions carries PINNED-7's trailers (the sanctioned DECISIONS.md -> ops_decisions ETL, Decision 84 I-2).
    command: >-
      bin/venv-python -m scripts.ops_data_portal --backfill-decisions-md && bin/venv-python -c "from src.common.ducklake_reader_client import make_reader;
      r=make_reader(profile='agent_platform'); got={d: 'metric filter and alarms' in str(r.named('decision_by_id', id=d)[0]['raw_block']) for d in ('dec-239','dec-202','dec-101')};
      print(got); assert all(got.values()); print('BACKFILL_OK')"
    expected: "{'dec-239': True, 'dec-202': True, 'dec-101': True} then BACKFILL_OK."
    fix_if: A row lacks the trailer -- re-run the backfill once the agent_platform chain is reachable (no offline outbox, Decision 84 I-4); never write ops_decisions directly.
    hermetic: false
    graduation: not-applicable
