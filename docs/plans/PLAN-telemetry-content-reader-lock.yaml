  role. After: the operator, in a bootstrap apply, removes the deploy role and the function, then the boundary
  statement and the grants. The access log group stays, and so does its resource block (prevent_destroy guards only
  while the block exists): destroying a platform-security-* resource is break-glass (Decision 202), and PlatformAdmin
  holds no DeleteLogGroup there, so a rollback that deleted the block would fail partway. The workflow is reverted in the same
  change, and the reader concurrency goes back to 5. Until then, refusing pending runs keeps the function on its last
