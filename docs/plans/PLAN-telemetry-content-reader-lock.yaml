  - file: .github/workflows/deploy-telemetry-content.yml
    action: Create
    purpose: >-
      Pinned verbatim in execution step PINNED-5. Triggers: push to main whose paths list every include and asset the
      content reader manifest bundles, the
      manifest, deploy_config.json, config/lambda/ducklake/field_semantics.static.yaml (the sidecar whose
      pending_reconcile releases the production column hold), this file and scripts/ci/telemetry_content_deploy.sh, plus
      workflow_dispatch (both jobs carry if: github.ref == 'refs/heads/main'). Top-level permissions: contents: read. concurrency: group
      deploy-telemetry-content, cancel-in-progress true: a newer push cancels an older run, so the operator approves only
      the latest; a cancel between the configuration and code updates leaves approved configuration beside the previously
      approved code until the next approved run (both operator-approved; decided with notice).
      Job build: no environment and no id-token. permissions are contents: read, deployments: read and actions: read.
      It checks out at the triggering sha with persist-credentials false, fetch-depth 0 and no ref input. It runs
      telemetry_content_deploy.sh check-environment and change-summary (evidence for the operator, not controls: the
      script is repo code; the controls are the Environment's protection rules and the role's trust), then sets up
      Python 3.12 and installs pyyaml and pydantic constrained to requirements.txt's pins (pip install -c). It runs python -m
      scripts.checks.ops_governance.validate_reconcile_pending_gate --telemetry-hold and exports held as a job output;
      held=true writes the TELEMETRY_PRODUCTION_HOLD notice, a green skip (the deploy-telemetry precedent: production
      telemetry code never ships ahead of the owner-login column add). It then runs python -m scripts.build_lambda
      --content-reader-only, exports the sha256 as a job output and uploads the zip in the step "Upload the content zip
      under its digest" as artifact telemetry-content-<sha256 hex>, retention-days 30 (github-actions-evidence
      governed_deployment, the class maximum: the deploy job downloads it only after the operator approves).
      Job deploy: needs build, if needs.build.outputs.held == 'false' (a held run never asks the operator to approve),
      environment telemetry-content-deploy, permissions id-token: write and contents: read.
      It checks out (persist-credentials false) only for the script and deploy_config.json, runs
      ./.github/actions/aws-region, downloads the artifact, and assumes
      arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/agent-platform-ducklake-telemetry-content-deploy with aws-region
      from env.AWS_REGION and MASK_AWS_ROLE_ID_ACCOUNT_PART from secrets.AWS_ROLE_ID_ACCOUNT_PART in the step env
      (validate_actions_account_id_masking R3, validate_project_region). It runs telemetry_content_deploy.sh deploy
      <zip> "$CONTENT_SHA256" (the digest passed through env, never an inline expression) and then describe. It runs no
      pip install and no repo Python while it holds the role.
  - file: scripts/ci/telemetry_content_deploy.sh
    action: Create
    purpose: >-
      Bash, set -euo pipefail, using only aws, curl, jq, sha256sum, base64 and git. Errors name a step, never a value.
      Subcommands:
        - check-environment: GET /repos/$GITHUB_REPOSITORY/environments/telemetry-content-deploy with GITHUB_TOKEN.
          It fails unless protection_rules holds a required_reviewers rule with at least one reviewer,
          can_admins_bypass is false and deployment_branch_policy.custom_branch_policies is true.
        - change-summary: finds the environment's latest deployment with a success status. It writes to
          $GITHUB_STEP_SUMMARY the commits between that sha and HEAD that touched a bundled path (git log --oneline
          over the workflow's push paths), or "first deploy" when there is none. It then prints deploy_config.json's
          diff over the same range, under a line saying that CI publishes the layers, so a pin proves which bytes run,
          not who built them (Decision 239 cl.6 as amended by PINNED-7; rec-4742).
        - deploy ZIP SHA256: fails unless sha256sum(ZIP) equals SHA256. It masks the STS account id (::add-mask::). For
          each deploy_config.json layer it resolves arn:aws:lambda:$AWS_REGION:<account>:layer:<name>:<version>, and
          fails unless get-layer-version's Content.CodeSha256 equals the pin. It then runs update-function-configuration
          with exactly --handler, --layers and --environment from deploy_config.json, waits for function-updated-v2,
          runs update-function-code --zip-file fileb://ZIP and waits again. It fails unless the live CodeSha256 equals
          base64(SHA256 bytes) (Decision 154 gate vector), and unless get-function-configuration reads back exactly
          deploy_config.json's handler, the resolved layer ARNs and the environment (acceptance 3). Nothing prints a
          value from the environment.
        - describe: resolves the URL with get-function-url-config and adds a mask. It POSTs {"action": "describe"} with
          curl --aws-sigv4 "aws:amz:$AWS_REGION:lambda" and the session token header, and fails unless the served verb
          set is exactly {session_transcript_masked, transcript_row_masked}.
  - file: src/lambdas/ducklake_telemetry_content_reader/deploy_config.json
    action: Create
    purpose: >-
      The configuration the gated job deploys. It holds three keys:
        - handler: src.lambdas.ducklake_telemetry_content_reader.handler.handler.
        - layers: [{name, version, code_sha256}] for ducklake-deps and ducklake-extensions, the versions and digests
          live at build time. Layer versions are immutable, and these values carry no account id.
        - environment: TELEMETRY_META_SCHEMA ducklake_telemetry, TELEMETRY_DATA_PATH
          s3://agent-platform-data-lake/ducklake-telemetry/, TELEMETRY_BLOB_ROOT
          s3://agent-platform-data-lake/telemetry-blobs/ducklake_telemetry/, DUCKLAKE_EXTENSION_DIRECTORY
          /opt/duckdb_extensions, DUCKLAKE_FIELD_SEMANTICS_PATH /var/task/config/lambda/ducklake/field_semantics.yaml,
          TELEMETRY_DSN_SECRET_ID agent-platform-ducklake-telemetry-reader-dsn and TELEMETRY_DSN_PARAMETER
          /secret/agent-platform-ducklake-telemetry-reader-dsn. These are the telemetry reader's production values,
          and the deploy-config test pins them equal to its HCL.
      The protected package path covers this file. A layer bump or a setting change is a commit inside the run the
      operator approves.
