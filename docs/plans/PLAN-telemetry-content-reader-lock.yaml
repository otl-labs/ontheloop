schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "telemetry-content-reader-lock"
intent: >-
  Deploy the masked telemetry content reader that PLAN-telemetry-content-reader built as a stub, behind Decision 239
  cl.5's change lock, and close rec-4696. terraform/bootstrap creates the function with an inert placeholder, its
  execution role, Function URL, log group, unexpected-invoker alarm and a deploy role bound to a reviewer-gated GitHub
  Environment. The CI apply boundary refuses every other identity any Lambda or IAM write on the function and on both
  roles. A deploy workflow builds the artifact with no AWS credentials, shows the operator the commits since the last
  deploy, and, once the operator approves, deploys exactly the recorded digest with the layers, handler and environment
  that the approved commit pins. PlatformDev gets masked URL-only invoke and the security trail records every invoke.
  A protected-path edit hook, CODEOWNERS, boundary_patterns and a repo check are the early warnings. The golden replay
  gains an opt-in masked read-back leg. The manifest flips to active.
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-telemetry-content-reader-lock.yaml
phase: >-
  ad_hoc_rec (soft-warn category; no tier_item claimed). Plan 3 of 3 for rec-4481, which plan 2 resolved. It carries
  rec-4696 (High), the deploy half split off at planning time. It depends on PLAN-sensitive-value-detectors (#1708),
  PLAN-telemetry-content-reader (#1718) and PLAN-telemetry-top-level-agent-run's production column hold (#1717,
  validate_reconcile_pending_gate --telemetry-hold); all three are merged. closes_criteria is empty.
closes_criteria: []
amends:
  - dec:239#4
  - dec:239#6
  - dec:202#3
  - dec:101#b
introduces:
  - telemetry-content-deploy
  - DenyTelemetryContentChange
scope:
  - file: terraform/bootstrap/telemetry_content_reader.tf
    action: Create
    purpose: >-  # pragma: allowlist secret
      The operator-approved text is pinned verbatim in execution step PINNED-1. Locals (the module's only definition of
      ducklake_telemetry_content_function = "agent-platform-ducklake-telemetry-content", which platform_dev_policies.tf
      also uses; the bucket and the data and blob prefixes as literals, since bootstrap reads no personal-root state).
      (a) aws_iam_role.telemetry_content, agent-platform-ducklake-telemetry-content: the CI apply boundary (Decision 144
      cl.3) and a lambda.amazonaws.com-only trust.
      (b) aws_iam_role_policy.telemetry_content over local.telemetry_content_policy_json, with a lifecycle precondition
      that the whitespace-stripped document is at most 10,240 B (validate_iam_policy_size). Six statements, the
      telemetry reader's shape plus the blob read:
        - Logs: logs:CreateLogStream and logs:PutLogEvents on (c) ":*".
        - TelemetryCatalogDataRead: s3:GetObject on agent-platform-data-lake/ducklake-telemetry/*.
        - TelemetryCatalogDataList: s3:ListBucket and s3:GetBucketLocation on the bucket, StringLike s3:prefix
          ducklake-telemetry/*.
        - TelemetryBlobRead: s3:GetObject on agent-platform-data-lake/telemetry-blobs/ducklake_telemetry/*.
        - TelemetryReaderDsnRead: secretsmanager:GetSecretValue on the exact ARN of
          agent-platform-ducklake-telemetry-reader-dsn, looked up by name through a data source (Decision 157).
        - TelemetryReaderDsnParameterRead: ssm:GetParameter on the literal ARN of
          parameter/secret/agent-platform-ducklake-telemetry-reader-dsn (Decision 237 cl.2: a declared consumer of an
          existing login, no secret or parameter change; validate_secret_parameter_grants needs the literal ARN, and
          secrets-to-ssm-retire removes the Secrets Manager statement).
      (c) aws_cloudwatch_log_group.telemetry_content, platform-security-telemetry-content-access, retention 365 days
      (Decision 239 cl.4 needs at least 90), prevent_destroy. It is a platform-security-* resource (Decision 202 cl.3 as
      amended by Decision 239, PINNED-7): no CI identity holds a write or log-event read grant on it, the
      detector-tamper alarm pages on its retention and metric-filter changes, PlatformAdmin's existing
      PlatformSecurityLogGroupManage creates it and its filter, and PlatformDev cannot read it, so an error line that
      echoes a row never reaches an agent.
      (d) No S3 object: the function's filename names terraform/bootstrap/telemetry_content_placeholder.zip (its own
      Create row, PINNED-8), a committed zip whose single member is
      src/lambdas/ducklake_telemetry_content_reader/handler.py, returning {"statusCode": 503, "body": "{\"error\":
      \"content_reader_not_deployed\"}"} for every event. Nothing serves content before the first approved deploy,
      Terraform reads no build artifact (environment-taxonomy conformance), the apply needs no S3 verb, and no
      CI-writable object can supply the code if the function is ever recreated.
      (e) aws_lambda_function.telemetry_content: role (a), python3.12, x86_64, memory 1024, timeout 120, reserved
      concurrency 2, the handler path above, filename (d), no layers, no environment variables, and logging_config
      { log_format Text, log_group (c) }. lifecycle ignore_changes = [filename, source_code_hash, layers, handler,
      environment]: the gated job owns code, layers, handler and environment
      (Decision 239 cl.5 as amended); Terraform owns role, runtime, memory, timeout, concurrency and logging. It
      depends_on (b) and (c).
      (f) aws_lambda_function_url.telemetry_content, authorization_type AWS_IAM.
      (g) aws_ssm_parameter.telemetry_content_url, /agent-platform/ducklake/telemetry_content_reader_url (plan 2's
      read route resolves it; the CI-writable name is a declared residual, rec-4739).
      (h) aws_cloudwatch_log_metric_filter.telemetry_content_unexpected_invoker,
      platform-security-telemetry-content-unexpected-invoker on (c), pattern { ($.event = "telemetry_content_read") &&
      ($.role != "PlatformDev") }: any other reader, the deploy role included (its describe writes no line), and role
      "unknown" (plan 2's fallback line) match on purpose. Metric TelemetryContentUnexpectedInvoker in namespace
      AgentPlatform/TelemetryContent, value 1, default 0.
      (i) aws_cloudwatch_metric_alarm.telemetry_content_unexpected_invoker,
      platform-security-telemetry-content-unexpected-invoker: Sum >= 1 over 300 s, one period, notBreaching, to the
      agent-platform-alerts topic by ARN template (Decision 239 cl.6, the platform_security_alarms.tf shape). The
      description names the Logs Insights query over (c) that answers who read what.
      (j) aws_cloudwatch_metric_alarm.telemetry_content_errors, platform-security-telemetry-content-errors (in the
      family, so no CI alarm write grant reaches it; PINNED-7): Errors plus Url5xxCount > 0 over 15 minutes (the telemetry
      reader's shape, Decision 55).
      Every ARN is built from var.account_id and var.aws_region. Nothing names an account id.
