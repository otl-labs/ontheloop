infrastructure_dependencies:
  - "terraform/bootstrap (admin-only, Decision 223): a pre-merge read-only ADMIN plan and candidate-boundary simulate at the PR head (deploy-paths admin_out_of_band.pre_merge_live_plan, VP 6-9), then the operator-directed apply after merge (VP 10)."
  - "terraform/github (operator): the operator creates the telemetry-content-deploy environment in Settings before the build starts (required reviewer, admin bypass off, deployment branches selected: main). It is inert until the bootstrap apply creates the role. The operator reports its main policy id (the agent proxy blocks environment reads) for the import variable's default; the import blocks key it at the next root apply (rec-4355 re-key pending)."
  - "terraform/personal (CI plan and apply): reader concurrency 5 -> 3, a non-IAM in-budget update, auto-applies after merge. It must land before the first content deploy, so that both readers share the login's connection limit within it."
  - "Ordering: bootstrap apply -> iam_simulate (VP 11) -> environment exists -> personal apply green -> no TELEMETRY_PRODUCTION_HOLD (the operator's provision_telemetry_catalog column add for #1717 done) -> first deploy run approved (VP 12) -> masked read-back (VP 13) -> access-log proof (VP 15) -> rec-4696 closed (VP 17). The bootstrap apply pages platform-security-detector-tamper (writes to the family's log group, filter and alarms) and platform-security-platform-role-iam-change (the boundary's new version and PlatformDev's policy); both are expected, and the operator is told first."
acceptance_criteria:
  - >-
    Among boundary-carrying identities, only agent-platform-ducklake-telemetry-content-deploy, under the
    operator-approved environment, can change the content function's code or configuration; every other one is refused
    any Lambda write on the function and any IAM write or PassRole on its two roles (iam_simulate rows, VP 7 and 11).
    PlatformAdmin and root sit outside the boundary (the Decision 239 cl.6 residual).
  - >-
    A merge touching a bundled path starts a deploy run that waits for the operator. The run summary lists the commits
    since the last deployment, and the deployed CodeSha256 equals the digest the credential-free build recorded and a
    local rebuild of the same commit.
  - >-
    The deployed layers, handler and environment are exactly deploy_config.json's (the deploy script reads them back
    after every deploy and fails otherwise), and each layer's digest matches its pin.
  - >-
    PlatformDev invokes the content function only through its URL, and no agent-reachable role can invoke a raw
    function (none exists).
  - >-
    Each read writes a telemetry_content_read line to platform-security-telemetry-content-access, kept 365 days, on
    which no CI identity holds a write or log-event read grant and which PlatformDev cannot read (VP 15); the security
    trail records the invoke. A role other than PlatformDev raises the unexpected-invoker alarm, and a retention or
    metric-filter change to the group, or an alarm-definition change to its alarms, pages the detector-tamper alarm.
  - The rendered boundary stays at or under 5,632 bytes.
  - >-
    Decisions 239, 202 and 101 carry PINNED-7's trailers verbatim, each a whole line equal to PINNED-7's, with no
    Decision check failing (VP 19), and
    ops_decisions holds them after the post-merge backfill (VP 20).
  - >-
    rec-4696 closes on its acceptance test (VP 17), with the function live and a masked golden read-back that matches as
    PlatformDev.
