    # Telemetry content deploy role (Decision 239 cl.5; rec-4696).
    #
    # The only identity the CI apply boundary's DenyTelemetryContentChange lets change the content reader. Trust is ONE
    # statement: StringEquals on aud, the telemetry-content-deploy Environment sub (a required reviewer, admin bypass off,
    # main-only deployment policy; terraform/github/environments.tf) and job_workflow_ref naming the deploy workflow at
    # refs/heads/main (local.telemetry_content_workflow_refs, evaluated by validate_github_org_transfer's
    # content_deploy_workflow_ref row). No StringLike, no ref or pull_request sub. Its name shares the content prefix, so the boundary's
    # role resource refuses every other boundary carrier any IAM write or PassRole on it.
    #
    # Grants: code and configuration on the content function, the two DuckLake layers' digests, the URL and URL-only invoke
    # for the served-verb check. No iam, PassRole, PublishVersion, concurrency, URL-config, permission or S3 verb, and no
    # statement names PlatformDev or PlatformAdmin (Decision 225 cl.1).

    locals {
      telemetry_content_workflow_refs = [
        "otl-labs/ontheloop/.github/workflows/deploy-telemetry-content.yml@refs/heads/main",
      ]
    }

    resource "aws_iam_role" "telemetry_content_deploy" {
      name                 = "agent-platform-ducklake-telemetry-content-deploy"
      description          = "Telemetry content reader deploy: the reviewer-gated telemetry-content-deploy Environment job on main only"
      permissions_boundary = "arn:aws:iam::${var.account_id}:policy/agent-platform-github-ci-apply-boundary"

      assume_role_policy = jsonencode({
        Version = "2012-10-17"
        Statement = [
          {
            Effect = "Allow"
            Principal = {
              Federated = "arn:aws:iam::${var.account_id}:oidc-provider/token.actions.githubusercontent.com"
            }
            Action = "sts:AssumeRoleWithWebIdentity"
            Condition = {
              StringEquals = {
                "token.actions.githubusercontent.com:aud" = "sts.amazonaws.com"
                "token.actions.githubusercontent.com:sub" = [
                  for repo in local.github_repos : "repo:${repo}:environment:telemetry-content-deploy"
                ]
                "token.actions.githubusercontent.com:job_workflow_ref" = local.telemetry_content_workflow_refs
              }
            }
          }
        ]
      })
    }

    locals {
      telemetry_content_deploy_policy_json = jsonencode({
        Version = "2012-10-17"
        Statement = [
          {
            Sid    = "DeployCode"
            Effect = "Allow"
            Action = [
              "lambda:GetFunction",
              "lambda:GetFunctionConfiguration",
              "lambda:UpdateFunctionCode",
              "lambda:UpdateFunctionConfiguration",
            ]
            Resource = ["arn:aws:lambda:${var.aws_region}:${var.account_id}:function:${local.ducklake_telemetry_content_function}"]
          },
          {
            Sid    = "LayerRead"
            Effect = "Allow"
            Action = ["lambda:GetLayerVersion"]
            Resource = [
              "arn:aws:lambda:${var.aws_region}:${var.account_id}:layer:ducklake-deps:*",
              "arn:aws:lambda:${var.aws_region}:${var.account_id}:layer:ducklake-extensions:*",
            ]
          },
          {
            Sid      = "UrlRead"
            Effect   = "Allow"
            Action   = ["lambda:GetFunctionUrlConfig"]
            Resource = ["arn:aws:lambda:${var.aws_region}:${var.account_id}:function:${local.ducklake_telemetry_content_function}"]
          },
          {
            Sid    = "InvokeUrl"
            Effect = "Allow"
            Action = ["lambda:InvokeFunctionUrl"]
            Resource = [
              "arn:aws:lambda:${var.aws_region}:${var.account_id}:function:${local.ducklake_telemetry_content_function}",
              "arn:aws:lambda:${var.aws_region}:${var.account_id}:function:${local.ducklake_telemetry_content_function}:*",
            ]
          },
          {
            # Decision 213 cl.1: an invoke through the URL also needs InvokeFunction, granted for the URL path only.
            Sid    = "InvokeViaUrlOnly"
            Effect = "Allow"
            Action = ["lambda:InvokeFunction"]
            Resource = [
              "arn:aws:lambda:${var.aws_region}:${var.account_id}:function:${local.ducklake_telemetry_content_function}",
              "arn:aws:lambda:${var.aws_region}:${var.account_id}:function:${local.ducklake_telemetry_content_function}:*",
            ]
            Condition = {
              Bool = {
                "lambda:InvokedViaFunctionUrl" = "true"
              }
            }
          },
        ]
      })
    }

    resource "aws_iam_role_policy" "telemetry_content_deploy" {
      name = "TelemetryContentDeploy"
      role = aws_iam_role.telemetry_content_deploy.id

      policy = local.telemetry_content_deploy_policy_json

      lifecycle {
        precondition {
          # AWS measures the whitespace-stripped document against the 10,240 B inline-policy limit (rec-2793).
          condition     = length(jsonencode(jsondecode(local.telemetry_content_deploy_policy_json))) <= 10240
          error_message = "Telemetry content deploy inline policy exceeds the 10,240 B IAM inline-policy limit (whitespace-stripped measure, rec-2793)."
        }
      }
    }
