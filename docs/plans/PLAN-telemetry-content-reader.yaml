    action: Create
    purpose: >-
      CONTENT_READS, a registry separate from EVENT_READS (so the telemetry reader never serves it), of two
      ducklake_event_reads.EventRead entries with no data.response flag, so ev.execute_entry returns resolved rows and
      never calls serve_content. Both bind only names ev.bind_values already binds (no new bound name, no edit to
      ducklake_event_reads.py): transcript_row_masked -- tables (TRANSCRIPTS,), sql=TRANSCRIPT_CONTENT_SQL unchanged,
      params (session_id, producer, event_id, parser_version, offset, max_bytes), binding session, int_params
      (parser_version, offset, max_bytes). session_transcript_masked -- params (session_id, offset, max_rows), binding
      tree, int_params (offset, max_rows); SQL = compose((TRANSCRIPTS,), body) from ducklake_event_read_sql (R4/R5
      dedupe and the conflicts CTE reused, never re-written) where body resolves the tree key as TREE_ROWS_SQL's tk does
      ($session_id inside the root's day partition), selects each deduped transcript row of the tree (session_id,
      producer, event_id, parser_version, event_timestamp, source_ordinal, purpose, origin, content, content_uri,
      content_sha256, content_bytes, content_omitted_reason) with total_rows = count(*) OVER (), the tree's
      conflicts only (conflicts joined to the tree's session_ids), ordered by a TOTAL key: root session first, then
      each child session by its first event_timestamp, then session_id; then event_timestamp,
      coalesce(source_ordinal, -1); then the block index from the turn_capture external_ref grammar
      (src/turn_capture/refs.py: "<source_record_id>#<block_index>", a "/full" role sorting after its base;
      coalesce(-1) for other grammars), because every block of one source record shares event_timestamp and
      source_ordinal and event_id is a hash; then purpose rank (prompt, system, thinking, response, tool_input,
      tool_result, tool_output), producer, event_id, parser_version; LIMIT $max_rows OFFSET $offset. external_ref is
      read for ordering only and never returned.
      READ_WINDOW_DAYS = 90. in_read_window(session_id, now) -> bool from the session_id's ULID time prefix
      (decode_time_prefix), decided before any connection. content_read_version(entry) -> 16 hex over the entry
      definition and ev.compared_columns(TRANSCRIPTS), the event_read_version recipe applied to this registry (that
      function is keyed on EVENT_READS and stays unedited). No import-time work.
  - file: src/lambdas/ducklake_telemetry_content_reader/__init__.py
    action: Create
    purpose: Package marker.
  - file: src/lambdas/ducklake_telemetry_content_reader/handler.py
    action: Create
    purpose: >-
      Entrypoint with the telemetry reader's handler shape (parse, _handle, size guard, terminal errors, log_invocation
      on every path) and its own helpers where ducklake_event_reads' are keyed on EVENT_READS: actions describe
      (CONTENT_READS rows with content_read_version and params_schema from ev._described_params, plus include_tool_output
      as an optional boolean on session_transcript_masked, so the self-describing surface names every accepted
      parameter) and named_read only; SERVED_VERBS =
      frozenset(CONTENT_READS). named_read order, each step before any connection: unknown verb 400; a deadline_ms or
      window key in the payload 400 bad_request; include_tool_output popped from params and validated as a boolean
      (session verb only, default false; 400 named_read_input otherwise); ev.bind_values(entry, params) (400 on
      refusal); ev.require_production_pin(); in_read_window(session_id, now) else 404 outside_read_window. Then the
      connection from ev.telemetry_acquirer(meta_schema, data_path, EXTENSION_DIRECTORY,
      dsn_secret_id=TELEMETRY_DSN_SECRET_ID, read_only=True), the statement under deadline.runner(remaining_ms, None,
      mark) where mark adds ev.TELEMETRY_SLOT to ev._INTERRUPTED_SLOTS (the set the acquirer probes, read through the
      module), ev.execute_entry, the dead-connection reopen, then masked.serve_row or masked.serve_session with the
      remaining-time callable. The entrypoint writes access_log exactly once per named_read in its finally (the
      sibling's log_invocation placement), with the final status of whichever branch answered: the size-guarded
      return (a 413 logs 413 and masked_bytes 0), or the except path through handler_errors.terminal for every
      TypedFault (grain_conflict, blob_*, read_deadline_exceeded 504, catalog_unavailable 503) and unmapped
      exception; session_id is logged only once ev.bind_values has accepted it as a canonical ULID, otherwise null.
  - file: src/lambdas/ducklake_telemetry_content_reader/masked.py
    action: Create
    purpose: >-
      serve_row: resolves the stored row with ducklake_event_content's own _choose and _store_fault (imported, not
      copied; grain_conflict 500, inline preferred), reads the WHOLE payload (inline content, or the blob through
      ducklake_event_content.BLOB_STORE.get_blob at offset 0 for its full size, HEAD and ETag bound), decodes UTF-8
      strictly (content_not_text 500), masks with mask(text, "read_masked"), then pages the masked UTF-8 bytes as
      base64 pages of window = max(1, min(max_bytes, ducklake_event_content.MAX_CHUNK_BYTES)) bytes, serve_content's
      rule (offset past masked_bytes 400). A zero-length blob row is served as empty text with no get_blob call (a
      0-byte range would ask for bytes=0--1). Envelope (one row, as serve_content): storage,
      encoding, offset, length, content_bytes, content_sha256 (raw, as stored), masked_bytes, masked_sha256,
      mask_counts, detector (the read_masked fingerprint), data_class "untrusted_transcript", data, omitted_reason.
      serve_session(rows, include_tool_output, remaining_ms): one envelope row {rows, next_offset, total_rows,
      conflicts, detector}; walks the SQL rows in order, skips tool_output rows unless included (next_offset counts SQL
      rows, never returned rows), masks inline text, fetches and masks object rows one at a time, and per row carries
      text, the hashes and mask counts. It stops before a row whose cost would pass SESSION_BUDGET_BYTES = 5,000,000,
      measured as the size guard measures it (len of json.dumps(json.dumps(row)) encoded UTF-8, so escaping and
      non-ASCII expansion count), or when remaining_ms() falls below MIN_REMAINING_MS = 15,000 before a fetch; it
      returns the next SQL offset, or null at the end. A single row over the budget is returned without text and with
      too_large true, so the caller pages it through transcript_row_masked. Never logs or returns content_uri, a
      bucket, a key or an exception message.
  - file: src/lambdas/ducklake_telemetry_content_reader/access_log.py
