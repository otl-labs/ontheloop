acceptance_criteria:
  - >-
    The new Decision is in docs/DECISIONS.md verbatim as pinned, under the per-entry cap, with the five dated
    annotations and a regenerated index.
  - >-
    The content reader serves exactly two verbs, every served byte masked with read_masked, and refuses every other
    verb, caller SQL, caller deadline and caller window, deciding the 90-day window before any connection.
  - Every named_read writes exactly one value-free telemetry_content_read line.
  - >-
    session_transcript_masked reassembles every golden tree's deduped transcript rows in the declared order against a
    real DuckDB catalog, and a session response stays under the size guard on non-ASCII-heavy trees.
  - The manifest is a stub with a complete import closure, so no build, deploy or smoke runs; no active artifact's bundle changes.
  - The agent CLI prints masked text inside nonce-framed untrusted-data markers that stored text cannot close, and fails on any masked_sha256 mismatch.
  - >-
    storage-substrate.yaml's telemetry row names the production writer and both readers (rec-4692), read-engine.yaml
    and the check cover CONTENT_READS, and no live pointer names rec-4481 as an owner.
  - >-
    The content reader's package, verbs module, contract and tests are in the detector ratchet's PROTECTED set, each
    with an operator CODEOWNERS line and a boundary_patterns entry.
  - rec-4481 and rec-4692 are closed after merge by the Resolves trailer, and the new Decision is in ops_decisions.
