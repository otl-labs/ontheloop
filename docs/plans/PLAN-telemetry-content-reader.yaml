      URL is AWS_IAM, so it is never missing in production). Never the ARN, account id, session name, text or params
      beyond session_id. An unknown verb logs verb "unknown". write never raises (it runs in the entrypoint's finally,
      so an internal error prints a fixed fallback line with role "unknown" instead of replacing the typed answer).
