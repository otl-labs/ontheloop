schema_version: 6
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: telemetry-fact-index
intent: >-
  Make every stored or derivable telemetry fact findable by meaning before anyone proposes a new field (data estate
  inventory phase 2, rec-5438). A generator projects the five telemetry contracts, _joins.yaml, the telemetry lexicon's
  concept entries, the declared metadata keys and the reader verbs' output columns into a generated fact index,
  config/telemetry/fact_index.yaml, one row per fact wherever it lives: a column, a column on some row kinds
  (table.column[discriminator=value]), a key inside a payload or the metadata bag (address suffix #key), or a link
  carried inside a ref; each row says which reader serves it (operator ruling 2026-11-20 on audit TFC-10). A local lookup command, scripts.session.telemetry_facts, takes a
  phrase and prints at most ten facts with kind, producer or unproduced owner, joins and serving verbs; the lexicon gains
  a digest concept (aka hash, fingerprint, checksum, sha256) and a skill name concept whose fact entries name where those
  facts are stored, checked against the contracts; the design walk's existence step and the file router point at the command.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-telemetry-fact-index.yaml
phase: >-
  Data estate inventory phase 2 (operator-directed 2026-11-20), part A: no deploy. Part B (rec-5439, describe lists verb
  outputs, governed reader deploy) is planned separately after this build and after PLAN-friction-signature-coverage's
  build; rec-5472 (the realized flag) follows rec-5439. Closes no roadmap exit criterion (no tier item owns the
  inventory; phase 3, rec-5474, makes the existence record mandatory). Phase 1 (rec-5440) is built (7062a93d): its
  walk step 0 and its ref_links key are on main.
closes_criteria: []
cites: [dec:95, dec:166, dec:168, dec:170, dec:275, dec:279]
scope:
  - file: scripts/telemetry_fact_index/__init__.py
    action: Create
    purpose: Facade re-exporting generate, check and the FactRow shape (Decision 80/104/124 facade pattern).
  - file: scripts/telemetry_fact_index/contracts.py
    action: Create
    purpose: >-
      Contract projection. For each of telemetry_sessions, _observations, _agents, _transcripts, _persona_findings:
      resolve_refs (scripts/contracts.py:193); one row per field (address table.column), plus one row per
      dq_intent.required_when discriminator combination (address table.column[observation_type=tool_call]); kind from
      realization (stored, or unproduced with its owner) or derivation.timing read (read_derived with derived_by, and
      served true only when derived_by names a verb registered in EVENT_READS or the content verbs, read from the
      registry and never from the contract's realized flag, which is false on every field today, audit TFC-09); type,
      nullable, description first sentence, populated_by, join ids; contract path and the field's line. Never parses
      semantics prose.
  - file: scripts/telemetry_fact_index/sources.py
    action: Create
    purpose: >-
      Non-contract sources: _joins.yaml read generically (every join id whose from/to is a telemetry table, from the
      `joins` key, and every `ref_links` entry as a row of kind ref_link with its from, to and grammar_owner, first
      tool_call_open_to_tool_input); the lexicon's terms (term, aka, facts), where a facts address with a #key suffix
      becomes a row of kind payload_key on its base column; metadata keys as rows of kind metadata_key (address
      telemetry_observations.metadata#<key>[observation_type=<value>]), read from the declared metadata key registry
      when it exists (the audit review's plan C), else from the keys present in the producer's golden rows
      (tests/fixtures/turn_capture/golden/*.json, read as data) marked undeclared; and config/telemetry/verb_outputs.yaml.
      Verb outputs attach serving verbs to matching rows and add verb-only rows (verb:<verb>.<column>); a payload_key
      or metadata_key row is served by the verbs that return its base column.
  - file: scripts/telemetry_fact_index/verb_outputs.py
    action: Create
    purpose: >-
      Generates config/telemetry/verb_outputs.yaml: executes each EVENT_READS and content verb's rendered SQL with every
      parameter bound to NULL against an in-memory DuckDB catalog built from field_semantics.yaml's telemetry tables, and
      records the cursor's column names per verb with agent_facing. duckdb imported inside the function only; never
      imports tests/. A verb that cannot run on an empty catalog (telemetry_health_count reads DuckLake metadata tables)
      takes its outputs from a hand-declared exception map that the freshness test proves still needs it.
  - file: scripts/telemetry_fact_index/cli.py
    action: Create
    purpose: >-
      `bin/venv-python -m scripts.telemetry_fact_index [--check] [--verb-outputs]`: default writes fact_index.yaml;
      --check regenerates in memory and byte-compares, exit 1 on drift, never writes; --verb-outputs regenerates
      verb_outputs.yaml.
  - file: scripts/telemetry_fact_index/__main__.py
    action: Create
    purpose: Module entry point calling cli.main.
  - file: config/telemetry/fact_index.yaml
    action: Create
    purpose: >-
      Generated fact index with the GENERATED -- DO NOT EDIT banner in its first lines (Decision 166 generated class);
      one flow-mapping row per fact address. Not Lambda-packaged.
  - file: config/telemetry/verb_outputs.yaml
    action: Create
    purpose: >-
      Generated verb output columns with the GENERATED -- DO NOT EDIT banner (Decision 166 generated class); retired by
      rec-5439 when verbs declare outputs (NS.5).
  - file: scripts/session/telemetry_facts.py
    action: Create
    purpose: >-
      Lookup: `bin/venv-python -m scripts.session.telemetry_facts <term> [<term> ...]`. Each term expands to itself
      plus every lexicon aka set it belongs to; names and addresses split on underscore, dot, # and brackets; a fact
      matches when every term matches its address, description, populated_by, discriminator value or concept words.
      Rank: concept fact, then column name, then description; stored before unproduced before read_derived before
      payload_key, metadata_key, ref_link and verb-only. Prints at most ten facts (address, kind, type, discriminator
      condition, one-line description, producer or unproduced owner, join or ref link ids, serving verbs with
      agent_facing and served, contract path:line) and "N of M shown". No match: exit 1, prints the expanded words and
      "no match is not proof of absence: answer data-modeling-standard.yaml design_time_walk step 0 from its sources".
      Reads config/telemetry/fact_index.yaml and the lexicon only; no cloud call.
  - file: scripts/checks/contracts/validate_telemetry_fact_index.py
    action: Create
    purpose: >-
      Fast-tier drift gate running the --check projection (no duckdb import); declares examined() and skipped()
      (Decision 170 cl.3).
  - file: scripts/checks/contracts/_manifest.py
    action: Modify
    purpose: Register validate_telemetry_fact_index (pre=True, full_segment full_after_lint).
  - file: scripts/checks/contracts/validate_telemetry_lexicon_tables.py
    action: Modify
    purpose: >-
      Also prove each term's facts entries: a bare address string (a mapping, or text carrying a description, type or
      rule, fails, keeping the lexicon term-level, Decision 95); the base address resolves to a resolved field of a
      telemetry contract; the discriminator is a field of that table and the value is in its accepted_values; aka
      words are lower case and unique within a term. Keeps reading the lexicon's canonical_tables (Decision 168 cl.2)
      and declares examined() for the new unit.
  - file: docs/contracts/telemetry-lexicon.yaml
    action: Modify
    purpose: >-
      Notice-class wording (Decision 279 cl.1; not in approval-routing.yaml's gated set), exactly this text.
      Under lexicon.model add key term_facts: "A term may carry facts: a list of fact addresses naming where the facts
      its definition describes are stored: table.column, table.column[discriminator=value], or
      table.column#key[discriminator=value] for a key inside a JSON payload or the metadata bag. Addresses only: a
      field's type, meaning and rules stay in its Class A contract (Decision 95). The generated fact index
      (config/telemetry/fact_index.yaml) projects them, a term's aka words become lookup search words, and
      validate_telemetry_lexicon_tables proves every address resolves." Under lexicon.terms add term digest, aka
      [hash, fingerprint, checksum, sha256], definition "A lowercase hex SHA-256 stored to identify bytes without
      reading them. Every transcript row stores one (content_sha256, of the payload it stores), and every tool_call
      close with a readable output stores one (output_sha256, of the raw full output). A tool call's input digest is
      the content_sha256 of its tool_input row; no other column holds it.", facts
      [telemetry_transcripts.content_sha256[purpose=tool_input], telemetry_transcripts.content_sha256[purpose=tool_result],
      telemetry_transcripts.content_sha256[purpose=tool_output], telemetry_observations.output_sha256[observation_type=tool_call]],
      see_also [transcript, tool_output, output_capture]; and term skill name, aka [skill, skill_name], definition "The
      name of the skill a Skill tool call loads. Per call it is the skill key of the call's JSON input, stored as the
      content of the call's tool_input transcript row (the call's own tool_call row has name Skill); per session,
      telemetry_sessions.workflow holds the first workflow or gate skill the session invoked.", facts
      [telemetry_transcripts.content#skill[purpose=tool_input], telemetry_observations.name[observation_type=tool_call],
      telemetry_sessions.workflow], see_also [transcript]. One new amendment_log entry (governance_note_add,
      semantic_break false, "Term-level only (Decision 95)"); last_updated bumped.
  - file: docs/contracts/file-router.yaml
    action: Modify
    purpose: >-
      Notice-class wording (Decision 279 cl.1), exactly this text: one route row {topic: telemetry-facts, targets:
      [config/telemetry/fact_index.yaml, scripts/session/telemetry_facts.py], description: "Telemetry facts by
      meaning: the generated fact index and its lookup, bin/venv-python -m scripts.session.telemetry_facts <words>.
      Search it before proposing a new telemetry field."} (targets name no Class D contract, so no topic-equals-subject
      obligation, Decision 168 cl.4), and a new amendment_log entry. NEAR_CAP (500 of 500 effective lines, 45,115 B):
      relief by compacting the oldest amendment_log rows to terse rows (Decision 275 cl.3 order), measured against
      main at build time.
  - file: docs/contracts/data-modeling-standard.yaml
    action: Modify
    purpose: >-
      Notice-class wording (Decision 279 cl.1), exactly this sentence appended to design_time_walk step 0 after "a
      genuinely new fact still gets a typed column.": "For telemetry, search first with bin/venv-python -m
      scripts.session.telemetry_facts <words>; no match is not proof of absence." Plus a new amendment_log entry.
      NEAR_CAP (512 of 533 effective lines, 47,029 B on main 5070cb63): relief by compacting the oldest amendment_log
      rows (Decision 275 cl.3 order), measured against main at build time.
  - file: config/ci_rca_taxonomy.yaml
    action: Modify
    purpose: function_to_category row for validate_telemetry_fact_index.
  - file: tests/test_session_telemetry_facts.py
    action: Create
    purpose: >-
      The lookup's mapped test (Decision 131 home) holding the golden queries: tool input digest and tool input hash
      return telemetry_transcripts.content_sha256[purpose=tool_input] in the top three, and do not once the digest
      term's facts are removed (in-memory lexicon copy); skill name returns telemetry_transcripts.content#skill[purpose=tool_input];
      stop reason returns a metadata_key row on model_call; tool call input link returns the ref_link row
      tool_call_open_to_tool_input; a nonsense phrase exits 1 with the no-proof line; at most ten rows; the
      file-router row routes telemetry-facts to the lookup (test_file_router_routes_telemetry_facts); the design walk's
      step 0 names the lookup (test_design_walk_step_zero_names_the_lookup); the lexicon's digest and skill name terms
      carry their facts (test_lexicon_concepts_carry_their_facts).
  - file: tests/telemetry_fact_index/__init__.py
    action: Create
    purpose: Mirror test package marker.
  - file: tests/telemetry_fact_index/test_contracts.py
    action: Create
    purpose: >-
      Projection over synthetic contracts (required_when expansion, unproduced owner, read_derived served from a stub
      registry against a realized:false flag) plus completeness over the real ones: every resolved field of the five
      contracts has a row.
  - file: tests/telemetry_fact_index/test_sources.py
    action: Create
    purpose: Joins, ref_links, lexicon facts and metadata-key rows (registry when present, golden rows else).
  - file: tests/telemetry_fact_index/test_cli.py
    action: Create
    purpose: --check passes on the committed tree and fails on a hand-edited index; default write is idempotent.
  - file: tests/telemetry_fact_index/test_verb_outputs.py
    action: Create
    purpose: >-
      Regenerates verb_outputs.yaml in memory (pytest.importorskip duckdb) and compares with the committed file; proves
      each exception-map verb still fails on the empty catalog; fails once any EventRead declares an outputs attribute
      (rec-5439 retires the file).
  - file: tests/checks/contracts/test_validate_telemetry_lexicon_tables.py
    action: Modify
    purpose: Cases for the facts and aka checks, including a non-address facts entry.
  - file: tests/checks/contracts/test_validate_telemetry_fact_index.py
    action: Create
    purpose: Mirror test for the drift gate (clean tree passes; a hand-edited index and an unregenerated contract fail).
bundled_recommendations: []
followon_recs: []
infrastructure_dependencies: []
acceptance_criteria:
  - The lookup for "tool input digest" and for "tool input hash" lists telemetry_transcripts.content_sha256[purpose=tool_input] in its first three rows; with the digest term's facts removed it does not.
  - The lookup for "skill name" lists telemetry_transcripts.content#skill[purpose=tool_input] (a payload fact); for "stop reason" a metadata_key row on model_call; for "tool call input link" the ref_link row tool_call_open_to_tool_input; each with its serving reader.
  - A read-derived fact is shown served only when its derived_by verb is registered; telemetry_sessions.surface (no verb) shows unserved while the realized flag is false on every field.
  - Every resolved field of the five telemetry contracts and every output column of every reader verb has at least one row in fact_index.yaml.
  - A hand edit to fact_index.yaml or a contract change without regeneration fails the fast tier; a verb SQL change without regenerating verb_outputs.yaml fails a test.
  - A lexicon facts entry that is not a bare address, or names a missing field, a missing discriminator or a value outside accepted_values, fails validate_telemetry_lexicon_tables.
  - No Lambda-packaged file changes (scripts.lambda_manifest --list-patterns matches none of the scope files).
verification_plan:
  - step: 1
    phase: pre-deploy
    action: Golden queries and the generator's projection tests.
    command: >-
      bin/venv-python -m pytest tests/test_session_telemetry_facts.py tests/telemetry_fact_index/test_contracts.py
      tests/telemetry_fact_index/test_sources.py tests/telemetry_fact_index/test_cli.py -q
    expected: exit 0 with every test passing; red before (the test files and modules do not exist).
    fix_if: a golden query misses its address, a field has no row, a served flag follows realized, or the committed index drifts
    hermetic: true
    expected_literals: []
    graduation: graduate
    graduation_check_id: telemetry-fact-index-golden
  - step: 2
    phase: pre-deploy
    action: Lexicon facts validator and the drift gate's mirror test.
    command: >-
      bin/venv-python -m pytest tests/checks/contracts/test_validate_telemetry_lexicon_tables.py
      tests/checks/contracts/test_validate_telemetry_fact_index.py tests/checks/ci_guards/test_validate_ci_rca_taxonomy.py -q
    expected: exit 0; red before (the drift gate test file does not exist and the new lexicon cases fail).
    fix_if: a bad address, discriminator, value or non-address entry passes, or a drifted index passes the gate
    hermetic: true
    expected_literals: []
    graduation: graduate
    graduation_check_id: telemetry-lexicon-facts-and-index-gate
  - step: 3
    phase: pre-deploy
    action: Verb outputs freshness (needs duckdb, so not hermetic under the fast-tier environment).
    command: bin/venv-python -m pytest tests/telemetry_fact_index/test_verb_outputs.py -q
    expected: exit 0; red before (the test file does not exist).
    fix_if: the committed verb_outputs.yaml differs from the regenerated one, or an exception-map verb now runs
    hermetic: false
    graduation: graduate
    graduation_check_id: telemetry-verb-outputs-fresh
  - step: 4
    phase: pre-deploy
    action: Drift gate on the real tree.
    command: bin/venv-python -m scripts.telemetry_fact_index --check
    expected: exit 0
    fix_if: non-zero
    hermetic: true
    expected_literals: []
    graduation: waive
    graduation_waiver_reason: duplicates the validate_telemetry_fact_index check this plan registers in the fast tier
  - step: 5
    phase: pre-deploy
    action: The incident query by hand.
    command: bin/venv-python -m scripts.session.telemetry_facts tool input digest
    expected: the tool_input content digest address appears among the first three rows
    fix_if: absent or not in the top three
    hermetic: true
    expected_literals: ["telemetry_transcripts.content_sha256[purpose=tool_input]"]
    graduation: waive
    graduation_waiver_reason: duplicates step 1's golden query, which ranks it in the top three
  - step: 6
    phase: pre-deploy
    action: Full tier, then HEAD attestation, after the build commit and rebase and before the push; started from the top-level session, backgrounded with a 2 h limit.
    command: bin/venv-python -m scripts.validate && bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: the full tier exits 0 and the validation result attests the current HEAD's tree
    fix_if: any failure; fix and rerun the full tier from the start
    hermetic: false
    graduation: waive
    graduation_waiver_reason: A whole full-tier run; graduate steps may not invoke scripts.validate (recursion), and steps 1-3 carry the durable regressions.
