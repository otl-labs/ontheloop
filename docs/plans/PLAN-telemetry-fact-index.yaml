constraints:
  - No cloud call, no spend, no embeddings; no Lambda-packaged file changes.
  - The index is a generated projection, never hand-edited (AGENTS.md Agent-First); no prose companion document.
  - Never parse contract semantics prose; lexicon facts are bare addresses (Decision 95).
  - No new Decision; no budget raise (Decision 275 relief order for the two NEAR_CAP contracts).
  - No rescue agents or workaround loops (Decision 55).
