    behavior: design walk step 0 names the lookup command
    verification_step: 1
    test_selector: tests/test_session_telemetry_facts.py::test_design_walk_step_zero_names_the_lookup
    red_green_expectation: red before (no pointer), green after
constraints:
  - No cloud call, no spend, no embeddings; no Lambda-packaged file changes.
  - Nothing derived from the contracts is committed; the fact rows are computed at call time (AGENTS.md Agent-First, summaries are query results); no prose companion document.
  - Never parse contract semantics prose; lexicon facts are bare addresses (Decision 95).
  - No new Decision; no budget raise (Decision 275 relief order for the two contracts at or near cap).
  - No rescue agents or workaround loops.
