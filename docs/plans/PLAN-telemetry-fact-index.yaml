schema_version: 6
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: telemetry-fact-index
intent: >-
  Make every stored or derivable telemetry fact findable by meaning before anyone proposes a new field (data estate
  inventory phase 2, rec-5438). A local lookup command, scripts.session.telemetry_facts, projects at call time the five
  telemetry contracts, _joins.yaml, the telemetry lexicon's concept entries, the metadata keys in the producer's golden
  rows and the reader verbs' output columns into one row per fact wherever it lives: a column, a column on some row
  kinds (table.column[discriminator=value]), a key inside a payload or the metadata bag (address suffix #key), or a
  link carried inside a ref; each row says which registered reader serves it (operator ruling 2026-11-20 on audit
  TFC-10). It takes a phrase and prints at most ten facts with kind, producer or unproduced owner, joins and serving
  verbs. Nothing derived is committed, so a contract edit elsewhere needs no regeneration. The lexicon gains a digest
  concept (aka hash, fingerprint, checksum, sha256) and a skill name concept whose fact entries name where those facts
  are stored, checked against the contracts; the design walk's existence step and the file router point at the command.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-telemetry-fact-index.yaml
phase: >-
  Data estate inventory phase 2 (operator-directed 2026-11-20), part A: no deploy. Part B (rec-5439, describe lists verb
  outputs, governed reader deploy) is planned separately after this build and after PLAN-friction-signature-coverage's
  build; rec-5472 (the realized flag) follows rec-5439. Closes no roadmap exit criterion (no tier item owns the
  inventory; phase 3, rec-5474, makes the existence record mandatory). Phase 1 (rec-5440) is built (7062a93d): its
  walk step 0 and its ref_links key are on main.
closes_criteria: []
cites: [dec:95, dec:168, dec:170, dec:275, dec:279]
scope:
  - file: scripts/telemetry_fact_index/__init__.py
    action: Create
    purpose: >-
      Facade (Decision 80/104/124 pattern) re-exporting FactRow and project(root, lexicon=None, verb_outputs=None),
      which returns every fact row from the sources at call time; lexicon and verb_outputs are the seams tests use to
      pass an in-memory lexicon copy or a stub verb-output map (None reads the declared outputs below). No duckdb.
  - file: scripts/telemetry_fact_index/contracts.py
    action: Create
    purpose: >-
      Contract projection. For each of telemetry_sessions, _observations, _agents, _transcripts, _persona_findings:
      resolve_refs (scripts/contracts.py:193); one row per field (address table.column), plus one row per field
      carrying dq_intent.required_when, whose address names every key of that mapping, keys sorted and joined by a
      comma, values in contract order joined by | (table.column[event_kind=close,observation_type=tool_call],
      table.column[output_capture=not_persisted|captured|omitted_oversize]). Kind: stored or unproduced (with its
      owner) from the realization block; read_derived from derivation.timing read, taking the raw field's local
      derivation when resolve_refs drops it on a $ref field (telemetry_persona_findings tenant_id and project_id), with
      derived_by, and served true only when derived_by names a verb registered in EVENT_READS or CONTENT_READS, read
      from the registry and never from the contract's realized flag (false on every field today, audit TFC-09). A field
      that still has no kind raises naming it. Also type, nullable, description first sentence, populated_by, join
      ids, contract path and the field's line. Never parses semantics prose.
  - file: scripts/telemetry_fact_index/sources.py
    action: Create
    purpose: >-
      Non-contract sources. _joins.yaml read generically: every join id whose from/to is a telemetry table, from the
      `joins` key, and every `ref_links` entry as a row of kind ref_link, address ref_link:<id> (first
      ref_link:tool_call_open_to_tool_input), carrying its from, to, key and grammar_owner and no serving verbs of its
      own (a link is followed by reading its two ends). The lexicon's terms (term, aka, facts): every facts address with
      no contract-projected row of the same address materializes its own row, kind payload_key when it carries a #key
      suffix, else the base column's kind with the base column's serving verbs, and the term's words attach to it.
      Metadata keys as rows of kind metadata_key (address
      telemetry_observations.metadata#<key>[event_kind=<value>,observation_type=<value>], keys sorted as in
      contracts.py, with the producers that emit it). When docs/contracts/telemetry-metadata-keys.yaml exists (the
      audit review's plan C registry, PLAN-telemetry-metadata-keys, merged as a plan at 822e495a), each row of its
      keys: list (producer, observation_type, event_kind, key, meaning, since, until) becomes a declared metadata_key
      row whose description is its meaning. The golden corpora are read either way: for each producer in
      config/telemetry/parser_versions.yaml with a golden_index, that index's cases and their expected_rows, the same
      walk as validate_telemetry_field_realization.load_inputs (mirrored, since that function also reads the roadmap
      and field semantics), json.loads on each observation row's metadata string, a null metadata skipped (claude_code
      and litellm today; litellm adds error and loss on model_call). A golden key with no registry row, or every
      golden key while the registry file is absent, is a row marked undeclared. Serving from verb outputs: a verb serves a row when one of its output
      columns equals the row's base column and the row's table is the verb's only table, or the column exists in no
      other of the verb's tables; a same-named column on a verb reading several tables that hold it is attached to each
      such row marked ambiguous, never to a table lacking the column. A verb returning row_json serves every
      compared_columns(table) column (src/common/ducklake_event_reads.py:198) of each of its tables, a rule applied only
      from declared outputs (no SQL text matching). payload_key and metadata_key rows are served by their
      base column's verbs, and verb_outputs.py's content map attaches the content verbs to telemetry_transcripts.content
      and content_omitted_reason. This verb-output rule applies to stored, unproduced, payload_key and metadata_key
      rows only; a read_derived row's serving comes from its derived_by alone (contracts.py). Output columns matching
      no row become verb-only rows (verb:<verb>.<column>).
  - file: scripts/telemetry_fact_index/verb_outputs.py
    action: Create
    purpose: >-
      Declared verb output columns, no SQL execution and no duckdb: every EVENT_READS verb's outputs come from
      src.common.ducklake_reader_client.VERB_FIELDS (already declared for every EVENT_READS verb, coverage-equal to the
      registry by tests/common/ducklake_reader_client/test_verb_fields_parity.py and parity-tested against the rendered
      SQL by tests/common/test_ducklake_event_read_verbs.py, including transcript_content's envelope and
      telemetry_health_count), with agent_facing from the EventRead. The two CONTENT_READS verbs, absent from
      VERB_FIELDS by its set-equality test, are declared here: transcript_row_masked (the keys masked.serve_row returns,
      src/lambdas/ducklake_telemetry_content_reader/masked.py:61-107) and session_transcript_masked (serve_session's
      envelope keys plus its rows' _row_out keys, masked.py:114-205); neither lists content_uri or raw content
      (masked.py never returns content_uri, Decision 101). A content map names which stored column each content
      verb's renamed output carries: transcript_content data -> content; transcript_row_masked data -> content
      (masked); session_transcript_masked text -> content (masked); each verb's omitted_reason ->
      content_omitted_reason; content_uri is never mapped. rec-5439 moves these declarations onto the verbs.
  - file: scripts/session/telemetry_facts.py
    action: Create
    purpose: >-
      Lookup: `bin/venv-python -m scripts.session.telemetry_facts <term> [<term> ...]`, calling project(). Tokens are
      lower case, split on every run of characters outside [a-z0-9]; a row's tokens are its address,
      kind name (ref_link gives ref and link), description words, populated_by, discriminator values, and the name and
      aka words (not the definition) of every term whose facts name it, all tokenized the same way. Each query term
      expands to itself plus every lexicon aka set it belongs to (aka words tokenized the same way) and
      matches a row by token equality; a row matches when every query term matches. Rank, primary key first: match
      source, the weakest across the query's terms (concept fact, then address token, then description), then kind
      (stored, unproduced, read_derived,
      payload_key, metadata_key, ref_link, verb-only), then address. Prints at most ten facts (address, kind, type,
      discriminator condition, one-line description, producer or unproduced owner, join or ref link ids and the link's
      from and to, serving verbs with agent_facing, labelled registered and never deployed, or unserved, contract
      path:line) and "N of M shown". No match: exit 1, prints the expanded words and "no match is not proof
      of absence: answer data-modeling-standard.yaml design_time_walk step 0 from its sources". No cloud call.
  - file: scripts/checks/contracts/validate_telemetry_lexicon_tables.py
    action: Modify
    purpose: >-
      Also prove each term's facts entries: a bare address string (a mapping, or text carrying a description, type or
      rule, fails, keeping the lexicon term-level, Decision 95); the base address resolves to a resolved field of a
      telemetry contract, loading only the contracts its facts entries name; at most one discriminator, as the
      term_facts text states, a field of that table with the value in its dq_intent.accepted_values.values; aka words
      are lower case
      and unique within a term. Keeps reading the lexicon's canonical_tables (Decision 168 cl.2); declares examined()
      once, counting both units (the registry holds one slot).
  - file: docs/contracts/telemetry-lexicon.yaml
    action: Modify
    purpose: >-
      Notice-class wording (Decision 279 cl.1; not in approval-routing.yaml's gated set), exactly this text.
      Under lexicon.model add key term_facts: "A term may carry facts: a list of fact addresses naming where the facts
      its definition describes are stored: table.column, table.column[discriminator=value], or
      table.column#key[discriminator=value] for a key inside a JSON payload or the metadata bag. Addresses only: a
      field's type, meaning and rules stay in its Class A contract (Decision 95). The fact lookup (bin/venv-python -m
      scripts.session.telemetry_facts) projects them with the contracts at call time, a term's aka words become lookup
      search words, and validate_telemetry_lexicon_tables proves every base address and discriminator resolves." Under
      lexicon.terms add term
      digest, aka [hash, fingerprint, checksum, sha256], definition "A lowercase hex SHA-256 stored to identify bytes
      without reading them. Every transcript row stores one (content_sha256, of the payload it stores), and every
      tool_call close with a readable output stores one (output_sha256, of the raw full output). A tool call's input
      digest is the content_sha256 of its tool_input row; no other column holds it.", facts
      [telemetry_transcripts.content_sha256[purpose=tool_input], telemetry_transcripts.content_sha256[purpose=tool_result],
      telemetry_transcripts.content_sha256[purpose=tool_output], telemetry_observations.output_sha256[observation_type=tool_call]],
      see_also [transcript, tool_output, output_capture]; and term skill name, aka [skill, skill_name], definition "The
      name of the skill a Skill tool call loads. Per call it is the skill key of the call's JSON input, stored as the
      content of the call's tool_input transcript row (the call's own tool_call row has name Skill); per session,
      telemetry_sessions.workflow holds the first workflow or gate skill the session invoked.", facts
      [telemetry_transcripts.content#skill[purpose=tool_input], telemetry_observations.name[observation_type=tool_call],
      telemetry_sessions.workflow], see_also [transcript]. One new amendment_log entry, terse (keys date,
      semantic_break false, change_class governance_note_add, summary of at most 160 characters naming this plan and
      "Term-level only (Decision 95)"), since the file holds 5 full rows against keep_full 5 (Decision 275 cl.4);
      last_updated bumped.
  - file: docs/contracts/file-router.yaml
    action: Modify
    purpose: >-
      Notice-class wording (Decision 279 cl.1), exactly this text: one route row {topic: telemetry-facts, targets:
      [scripts/session/telemetry_facts.py, scripts/telemetry_fact_index/], description: "Telemetry facts by meaning:
      the fact lookup, bin/venv-python -m scripts.session.telemetry_facts <words>, projecting the telemetry contracts,
      joins, lexicon and reader verbs at call time. Search it before proposing a new telemetry field."} (targets name no
      Class D contract, so no topic-equals-subject obligation, Decision 168 cl.4), and a new terse amendment_log entry
      (keys date, semantic_break, change_class, summary of at most 160 characters; Decision 275 cl.4). AT CAP
      (500 of 500 effective lines, 45,115 B on main 5070cb63). Valve 1 frees nothing: every top-level amendment_log row
      is already one line and no row may be dropped (contract-population.yaml amendment_log_retention.rule). Relief is
      valve 2 (Decision 275 cl.3, move detail to its owner by citation; the owner here is the route's target,
      docs/contracts/overseer-dispatch.yaml, which already holds every item the description lists): the
      overseer-dispatch-contract route's seven-line description becomes exactly "Overseer dispatch model
      (Design B relief valve, Decision 86/127), relocated from .claude/skills/overseer/SKILL.md; its target lists what
      it holds." on one line, freeing six lines for the two this edit adds; the amendment row names the move.
      Re-measured against main at build; if that route is gone by then, the same valve on the longest remaining
      description.
  - file: docs/contracts/data-modeling-standard.yaml
    action: Modify
    purpose: >-
      Notice-class wording (Decision 279 cl.1), exactly this sentence appended to design_time_walk step 0 after "a
      genuinely new fact still gets a typed column.": "For telemetry, search first with bin/venv-python -m
      scripts.session.telemetry_facts <words>; no match is not proof of absence." Plus a new terse amendment_log entry
      (keys date, semantic_break, change_class, summary of at most 160 characters; Decision 275 cl.4).
      NEAR_CAP (512 of 533 effective lines, 47,029 B on main 5070cb63; simulated head 513 lines, 47,346 B, 8 full rows
      unchanged): no relief needed if the build-time re-measure confirms, else compact the oldest full amendment_log
      rows to terse rows (Decision 275 cl.3 order).
  - file: tests/test_session_telemetry_facts.py
    action: Create
    purpose: >-
      The lookup's mapped test (Decision 131 home), hermetic, one projection shared per module through a fixture.
      Golden queries: test_tool_input_digest_finds_stored_column (tool input digest and tool input hash list
      telemetry_transcripts.content_sha256[purpose=tool_input] in the first three, matched through the digest concept;
      with only the digest term's aka list removed from an in-memory lexicon copy passed to project(), tool input hash
      does not list it); skill name lists telemetry_transcripts.content#skill[purpose=tool_input]; stop reason lists a metadata_key
      row on model_call; tool call input link lists ref_link:tool_call_open_to_tool_input with its from and to; a
      nonsense phrase exits 1 with the no-proof line; at most ten rows; test_file_router_routes_telemetry_facts;
      test_design_walk_step_zero_names_the_lookup; test_lexicon_concepts_carry_their_facts.
  - file: tests/telemetry_fact_index/__init__.py
    action: Create
    purpose: Mirror test package marker.
  - file: tests/telemetry_fact_index/test_contracts.py
    action: Create
    purpose: >-
      Projection over synthetic contracts (a one-key and a two-key multi-value required_when address, unproduced
      owner, read_derived served from a stub registry against a realized:false flag, a $ref field whose local
      derivation resolve_refs drops, a field with no kind raising) plus over the real ones: every resolved field of the
      five contracts has a row, and a field added to a tmp-root copy of a contract appears with no other file changed.
  - file: tests/telemetry_fact_index/test_sources.py
    action: Create
    purpose: >-
      Joins, ref_links, metadata keys from both registered corpora (key loss on model_call has a row naming litellm,
      key stop_reason on model_call names claude_code; a synthetic registry file declares a key and leaves a golden-only
      key undeclared; a null metadata is skipped), serving from a
      stub verb-output map (single-table match, a same-named column across several tables marked ambiguous, row_json
      serving compared columns), verb-only rows, and lexicon facts: each of the seven digest and skill name addresses
      has a row.
  - file: tests/telemetry_fact_index/test_verb_outputs.py
    action: Create
    purpose: >-
      Hermetic lasting rules: every EVENT_READS and CONTENT_READS verb has declared outputs; the content-verb
      declarations equal the keys masked.serve_row and _row_out return on stub inline rows and serve_session's
      envelope on a stub call (masked.py imports without duckdb or boto3); no content verb serves
      telemetry_transcripts.content_uri; the lookup shows session_transcript_masked serving
      telemetry_transcripts.content_sha256[purpose=tool_input] and telemetry_transcripts.content#skill[purpose=tool_input]
      (masked), and verb:session_transcript_masked.next_offset is a verb-only row.
  - file: tests/checks/contracts/test_validate_telemetry_lexicon_tables.py
    action: Modify
    purpose: >-
      test_facts_entries_resolve (missing field, missing discriminator, two discriminators, value outside
      accepted_values, aka case and uniqueness) and test_facts_entry_rejects_non_address (a mapping or prose entry).
bundled_recommendations: [rec-5438]
followon_recs: []
infrastructure_dependencies: []
acceptance_criteria:
  - The lookup for "tool input digest" and for "tool input hash" lists telemetry_transcripts.content_sha256[purpose=tool_input] in its first three rows; with the digest term's aka list removed from the lexicon, "tool input hash" does not list it.
  - The lookup for "skill name" lists telemetry_transcripts.content#skill[purpose=tool_input] (a payload fact); for "stop reason" a metadata_key row on model_call; for "tool call input link" the row ref_link:tool_call_open_to_tool_input with its from and to; each fact row shows its registered serving verbs or unserved, and the skill name payload fact lists session_transcript_masked (masked).
  - A read-derived fact is shown served only when its derived_by verb is registered; telemetry_sessions.surface (no verb) shows unserved while the realized flag is false on every field.
  - Every resolved field of the five telemetry contracts has at least one row; every registered verb has declared outputs, the content verbs show their response envelope fields (never content_uri), and verb:session_transcript_masked.next_offset is a verb-only row.
  - Metadata keys come from every producer's registered golden corpus, so key loss on model_call (litellm) has a row; a key the metadata key registry declares is shown declared with its meaning.
  - Nothing derived from the contracts is committed; a field added to a contract shows in the lookup with no other file changed.
  - A lexicon facts entry that is not a bare address, or names a missing field, a missing discriminator, two discriminators or a value outside accepted_values, fails validate_telemetry_lexicon_tables.
  - No Lambda-packaged file changes (scripts.lambda_manifest --list-patterns matches none of the scope files).
verification_plan:
  - step: 1
    phase: pre-deploy
    action: Golden queries and the projection tests, without duckdb.
    command: >-
      bin/venv-python -m pytest tests/test_session_telemetry_facts.py tests/telemetry_fact_index/test_contracts.py
      tests/telemetry_fact_index/test_sources.py -q
    expected: exit 0 with every test passing; red before (the test files and modules do not exist).
    fix_if: a golden query misses its address, a field has no row, or a served flag follows realized
    hermetic: true
    expected_literals: []
    graduation: graduate
    graduation_check_id: telemetry-fact-index-golden
  - step: 2
    phase: pre-deploy
    action: Lexicon facts validator.
    command: >-
      bin/venv-python -m pytest tests/checks/contracts/test_validate_telemetry_lexicon_tables.py::test_facts_entries_resolve
      tests/checks/contracts/test_validate_telemetry_lexicon_tables.py::test_facts_entry_rejects_non_address -q
    expected: exit 0; red before (the two named tests do not exist).
    fix_if: a bad address, discriminator, value or non-address entry passes
    hermetic: true
    expected_literals: []
    graduation: graduate
    graduation_check_id: telemetry-lexicon-facts
  - step: 3
    phase: pre-deploy
    action: Declared verb outputs.
    command: bin/venv-python -m pytest tests/telemetry_fact_index/test_verb_outputs.py -q
    expected: exit 0; red before (the test file does not exist).
    fix_if: a registered verb has no outputs, a content declaration differs from masked.py, a content verb serves content_uri, or the named verb-only row is missing
    hermetic: true
    expected_literals: []
    graduation: graduate
    graduation_check_id: telemetry-verb-outputs-declared
  - step: 4
    phase: pre-deploy
    action: The incident query by hand.
    command: bin/venv-python -m scripts.session.telemetry_facts tool input digest
    expected: the tool_input content digest address appears among the first three rows, with session_transcript_masked among its registered verbs
    fix_if: absent or not in the top three
    hermetic: true
    expected_literals: ["telemetry_transcripts.content_sha256[purpose=tool_input]"]
    graduation: waive
    graduation_waiver_reason: duplicates step 1's golden query, which ranks it in the top three, and step 3's serving case
  - step: 5
    phase: pre-deploy
    action: Full tier, then HEAD attestation, after the build commit and rebase and before the push; started from the top-level session, backgrounded with a 2 h limit.
    command: bin/venv-python -m scripts.validate && bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: the full tier exits 0 and the validation result attests the current HEAD's tree
    fix_if: any failure; fix and rerun the full tier from the start
    hermetic: false
    graduation: waive
    graduation_waiver_reason: A whole full-tier run; graduate steps may not invoke scripts.validate (recursion), and steps 1-3 carry the durable regressions.
  - step: 6
    phase: post-deploy
    action: >-
      rec-5438 is closed by the squash merge's Resolves trailer; its acceptance (bin/venv-python -m pytest
      tests/test_session_telemetry_facts.py::test_tool_input_digest_finds_stored_column -q) runs in ci.yml's closure job.
    command: >-
      AWS_PROFILE=agent_platform bin/venv-python -c "from src.common.ducklake_reader_client import fetch_recs_by_ids,
      make_reader; rows, _ = fetch_recs_by_ids(make_reader(), ['rec-5438']); print([(r['id'], r['status']) for r in rows])"
    expected: rec-5438 closed after the closure job runs on the merge commit
    fix_if: >-
      still open; read the closure job log for an acceptance refusal marker and fix its cause (no Resolves line in the
      squash body, or the acceptance test failing on main), never a direct status write
    hermetic: false
