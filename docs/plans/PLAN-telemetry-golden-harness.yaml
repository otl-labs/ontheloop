constraints:
- >-
  Authoring order and basis for the two derived_golden files. Their values are the contract formula applied to the rows the CURRENT
  producer (PARSER_VERSION in src/turn_capture/record_turn.py) emits for the tree; for a trap tree that reproduces a
  known producer defect, the value follows the emitted rows (for example output_tokens 8, background outcome success)
  and the expectation carries known_defect naming the owner rec (rec-4354, rec-4358), while the transcript truth is
  asserted by shape.py's and ledger.py's declared classes. Reading record_turn's emitted rows is reading the formula's
  input and is allowed; reading a verb's or the oracle's output is not. Both files are committed in their own commit
  before any dedupe, derive or chain code is written, and the report names that commit's SHA, so the authoring order is
  auditable. Size (Decision 166, residual class): each file stays under 500 effective lines and 2,000-character lines,
  enforced in --pre by validate_structural_size_limits; one flow-mapping line per expectation, why inline; if one file
  would still pass 450 effective lines, split it again by tree into a third file named for its trees before the
  authoring commit, and list the split in the report; a limit raise is never the fix. Values are never copied from verb or oracle output and never edited to make a run pass; a disagreement is
  resolved by re-deriving by hand (VP step 4 fix_if). Re-authoring rule: a plan that bumps PARSER_VERSION and changes a
  tree's emitted rows re-authors the affected expectations by hand in its own PR, citing itself in each changed
  entry's why, and moves the header; the header check fails until it does (the producer fixes plan, approved
  2026-10-17, is the first such plan; the coordinator sequences the two merges). Integer conversion: a fractional
  duration is truncated toward zero to whole seconds, the convention the hand author and the oracle both follow until
  rec-4405 states it in the contracts.
- >-
  Producer fixes alignment (relayed 2026-10-17 from the capture producer fixes planning thread). That plan's build moves
  PARSER_VERSION to 4, regenerates the producer golden corpus and adds five cases (subagent_usage_final_and_spawn_correction,
  background_notice_statuses, resume_segment_closes, session_provenance_facts, model_call_request_fields). If this
  plan's build merges first, that build owns re-authoring both derived_golden files at parser_version 4 by hand under
  constraints[0] (the header check in VP step 2 fails its PR until it does), and it may move a trap tree's builder into
  the producer corpus as the aligned case named in execution_steps[1]; when it does, it re-points the expectation from
  verification:<tree> to corpus:<case> and deletes the trap builder, so each raw shape has one home. Shapes it changes
  at parser_version 4 (a close row at each root resume boundary; resume rows emitted once their hook group ends; a
  background child with no notice before a later root resume completes there; killed, failed or unknown notices read
  as failed) are that plan's to re-author; this plan authors only parser_version 3 values and writes nothing for
  parser_version 4, and its build runs only while PARSER_VERSION is 3 (VP step 1). The mutation node's discriminating
  inputs are selected by property, not by tree name (execution_steps[6]), so re-authoring the two data files is the
  whole hand-off: a parser_version 4 shape that leaves no close tie or fewer than two idle_threshold expectations fails
  that node as a named precondition, and the re-authoring restores one.
- >-
  No change under src/ (producer, kernel, reader, writer) and no change to the reader's SQL; a reader defect the harness
  finds is filed through the portal and escalated to the coordinator (scope escalation rule; Decision 59), never fixed
  here. No change to tests/fixtures/turn_capture/golden/, config/telemetry/parser_versions.yaml or any existing test
  module; the verification trees live in tests/fixtures/telemetry_verification_trees.py.
- >-
  scripts/telemetry_verify DIRECT imports (AST-checked, VP step 2): the standard library, yaml (joins.py reads the
  contract), the package's own modules (scripts.telemetry_verify.*), src.turn_capture.transcript
  (tree access and raw lines), src.common.ducklake_event_reads (compared_columns), src.common.ducklake_event_read_verbs
  (IDLE_THRESHOLD_SECONDS, FRICTION_RULES) and src.common.ducklake_reader_client (VERB_FIELDS); never duckdb,
  src.common.ducklake_event_read_sql, src.turn_capture.streams, src.turn_capture.observations or anything under tests/.
  The allowed data modules import the SQL module themselves; that is accepted because the oracle uses only their data.
  Pure functions over passed-in data, with two declared file reads: joins.py's read of docs/contracts/_joins.yaml, and
  dedupe.py's default compared-column set, which compared_columns(table) reads from the field_semantics projection;
  no network, no catalog read, no file write (Decision 84 I-3).
- >-
  Nothing prints transcript content or a row value beyond counts, model names and finding classes (this repository and
  its CI logs are public; Decision 101).
- >-
  The extended stop_reason dashboard in tests/turn_capture/test_real_transcript_conformance.py stays with rec-4354's
  owner (the producer fixes plan); this plan does not modify that file.
- >-
  Two stdlib dedupe implementations exist until rec-4392 lands (tests/fixtures/telemetry_dedupe_reference.py, test-only,
  and scripts/telemetry_verify/dedupe.py, production); both are checked against dedupe_vectors.yaml, and this plan does
  not touch the fixture.
- >-
  Runtime: the full tier runs each test under a 120 s timeout with coverage and xdist (scripts/checks/_scaffolding.py),
  so the whole-corpus nodes (VP steps 5 and 7) are parametrized per tree and the mutation node (VP step 6) per mutation
  (a file::node selector still selects every parameter), and each parameter stays well inside 120 s; the report gives
  the module's measured wall time and the slowest parameter of each of those three nodes.
- >-
  SLOC (Decision 128): every new Python file in scope, the test module and both helpers included, stays under 500 SLOC;
  if one would not, split it within its own directory (a scripts/telemetry_verify submodule behind the facade, or a
  second test module or helper) and list the split in the report; a budget raise is never the fix.
- No rescue agents or workaround loops (Decision 55).
