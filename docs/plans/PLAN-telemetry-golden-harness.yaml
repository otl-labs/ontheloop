schema_version: 5
implementation_declared: true
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: telemetry-golden-harness
intent: >-
  Telemetry slice 4's first leg (rec-4025): prove the derived layer end to end on known inputs before the feedback loop
  trusts it. Every producer golden transcript tree runs through the real producer, the real append kernel and every
  derivation reader verb, and the results must equal values written by hand from the Class A contract formulas AND an
  independent re-derivation written from the same formulas without the reader's SQL. The plan also lands the pure check
  library (independent re-derivation, Claude Code ledger reconciliation, transcript shape counts) that the in-session
  source check and the verification monitor plans reuse.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-telemetry-golden-harness.yaml
phase: >-
  rec-4025 carrier (telemetry slice 4, verification): the first of its four plans (golden harness, verification verbs,
  in-session source check, verification monitor), approved by Benjamin's "write the plan" on 2026-10-17
  (cmsg_012XgaFy8VaDQbxP5D8nC958MdLJawKLhVPEQqyXDX82iS) on the approach in
  /mnt/project-files/telemetry-slice4/step6b-presentation.md. Related tier items, named in context only: T3.20 and
  T2.36; this plan closes no criterion (T3.20 c3 closes with the verification monitor plan), and rec-4025 stays open as
  the slice's carrier until that plan lands.
closes_criteria: []
scope:
- file: scripts/telemetry_verify/__init__.py
  action: Create
  purpose: >-
    Package facade (telemetry slice 4 check library). Re-exports the public surface of dedupe, derive, joins, ledger and
    shape only; no logic, no I/O at import.
- file: scripts/telemetry_verify/dedupe.py
  action: Create
  purpose: >-
    Independent stdlib implementation of the envelope's generation and read-side dedupe rules over plain row dicts:
    R4 generations (max parser_version of each producer's open rows per session), R5a retirement, R5b event collapse,
    R5c model_call entity collapse (claude_code then litellm then others, latest event_timestamp, created_timestamp,
    producer, event_id), and the Decision 207 conflict report (a grain key whose rows differ on any compared column,
    computed before retirement). The compared-column set is an injectable argument per table, defaulting to
    src.common.ducklake_event_reads.compared_columns(table) (governed data, declared shared with the reader), so the
    dedupe vectors' opaque content marker can stand in for it in tests.
- file: scripts/telemetry_verify/derive.py
  action: Create
  purpose: >-
    Independent re-derivation of every session-bound and window derivation verb from deduped rows, written from the
    contract formulas (telemetry_sessions.yaml:156-162 state, :241 duration_seconds, :200 and :355 process events, :214
    rework, :229 exceptions; telemetry_agents.yaml:190-251 run totals and duration; telemetry_observations.yaml:267
    cost, realized subset only: reported, allowance and unpriced as in derivation_cases.yaml c15, since the formula's
    price table is rec-4031's and not built), never from src/common/ducklake_event_read_sql.py:
    session_state_and_duration, agent_run_state_and_duration, agent_run_token_rollup, session_process_event_rollup,
    session_friction_rollup, model_call_cost_estimate, sessions_window and sessions_window_all_purposes, each returning
    the verb's VERB_FIELDS columns (src/common/ducklake_reader_client.py) including the three stamps (generations,
    conflicted_grain_keys, derivation_conflicted). Governed data it shares with the reader, declared in its module
    docstring: IDLE_THRESHOLD_SECONDS and FRICTION_RULES from src/common/ducklake_event_read_verbs.py (the rules are data;
    the matcher is this module's own), VERB_FIELDS (output column names only) and EVENT_READS[verb].tables (the stamp
    scope: a verb's generations, conflicted_grain_keys and derivation_conflicted cover only the tables it composes, four
    for the state and window verbs, sessions and observations for the four roll-up verbs; no contract text states this,
    so the registry is its rule source). duration_seconds (an int whose formula yields a fractional total_seconds())
    is truncated toward zero to whole seconds, the declared convention until rec-4405 puts it in the contracts. Columns no Class A formula defines
    (model_call_count, usage_missing_count, label_counts, unmapped_count, cost_source) follow the rule source named in
    the module docstring for each: the verb's EVENT_READS description, the FRICTION_RULES data and the committed
    derivation_cases.yaml (c15) and friction_vectors.yaml expectations. The docstring also declares the residual:
    agreement with the verbs proves the SQL implements the same reading of the contract text, not that the formula is
    right.
- file: scripts/telemetry_verify/ledger.py
  action: Create
  purpose: >-
    Claude Code ledger reconciliation over one transcript tree, read through the TranscriptTree protocol
    (src/turn_capture/transcript.py) with its own json walk, never src/turn_capture/streams.py: find each cost-state
    record in the root stream (modelUsage per model, keyed by the requestedModel string); sum the four token classes of
    the prefix before that record's line, per model (the record's requestedModel, else message.model), over root
    responses (last record per message.id; synthetic and API-error records excluded) plus every sub-agent stream whose
    spawn record precedes the cut; then classify every model into the finding vocabulary in execution_steps[4].
- file: scripts/telemetry_verify/shape.py
  action: Create
  purpose: >-
    Source-shape counts over one transcript tree with its own json walk (independent of the producer's parse):
    non-final model calls (owner record without stop_reason and not isAbortedMidStream) by stream kind (root or
    sub-agent) and position (final call of its stream or mid-stream); each sync spawn's toolUseResult.usage against its
    child's last call; each background spawn's completion-notice status (the <status> element of the
    <task-notification>), compared with given agent close outcomes; tool-results sidecars pinned absent in a given
    cursor that now exist; and the root's stop_hook_summary records with their hookCount. Findings use the vocabulary in
    execution_steps[5].
- file: scripts/telemetry_verify/joins.py
  action: Create
  purpose: >-
    load_telemetry_joins(path) reads docs/contracts/_joins.yaml and returns every join whose from and to are both
    telemetry_* tables as (join_id, child_table, child_column, parent_table, parent_column), the child side being the
    to side of a one_to_many join and the from side of a many_to_one join (the contract's own cardinality). The contract
    stays the single rule source for referential integrity (Decision 210 cl.3); nothing restates the pairs by hand.
- file: tests/telemetry_verify/__init__.py
  action: Create
  purpose: Mirror test package marker (prepend import mode).
- file: tests/telemetry_verify/test_joins.py
  action: Create
  purpose: >-
    Mirror tests for joins.py: test_telemetry_joins_load_from_the_contract asserts a membership floor (the seven pairs
    the contract states today, each with its direction), never an exact count (tests/CLAUDE.md test-count coupling).
- file: tests/telemetry_verify/test_package_boundary.py
  action: Create
  purpose: >-
    AST boundary node test_oracle_has_no_direct_reader_sql_duckdb_streams_or_tests_import, in the style of
    tests/telemetry/test_package_boundary.py: every scripts/telemetry_verify module's DIRECT runtime imports are the
    standard library or the allow-list in constraints[3]; never duckdb, src.common.ducklake_event_read_sql,
    src.turn_capture.streams, src.turn_capture.observations or a tests module. Direct imports only, because the allowed
    data modules themselves import the SQL module (the oracle's independence is its own code, not its import closure);
    never an .importlinter forbidden contract, which checks the transitive closure.
- file: tests/telemetry_verify/test_dedupe.py
  action: Create
  purpose: >-
    Mirror tests for dedupe.py, stdlib and yaml only (fast tier). Node test_oracle_matches_every_dedupe_vector runs all
    vectors of tests/telemetry/fixtures/dedupe_vectors.yaml (survivors and conflicted grain keys per table, with the
    vectors' content marker injected as the compared column), plus unit cases for R5c precedence, a NULL-versus-value
    conflict and the default compared-column set.
- file: tests/telemetry_verify/test_derive.py
  action: Create
  purpose: >-
    Mirror tests for derive.py, stdlib and yaml only. Node test_oracle_matches_every_committed_derivation_case rebuilds
    each case of tests/telemetry/fixtures/derivation_cases.yaml as rows (its own derive_entity_key-based identity, the
    approach tests/common/test_ducklake_event_read_verbs.py takes, restated, never imported) and asserts every one of its
    expectations; node test_oracle_matches_every_friction_vector asserts the facts and totals of
    tests/telemetry/fixtures/friction_vectors.yaml; node test_derived_golden_headers_match_parser_version (stdlib and
    yaml, fast tier) asserts both derived_golden files' parser_version equals PARSER_VERSION, so a parser bump that skips
    re-authoring fails the PR tier, not only the full tier.
- file: tests/telemetry_verify/test_ledger.py
  action: Create
  purpose: >-
    Mirror tests for ledger.py. Node test_cut_bounded_reconciliation_classifies_every_model drives the verification trees
    and hand-built variants through every finding class in execution_steps[4], including the cut (records after the
    cost-state line excluded), the requestedModel key, a second cost-state record, an auxiliary model with and without
    transcript records, a compaction before the cut and a background sub-agent spanning the cut.
- file: tests/telemetry_verify/test_shape.py
  action: Create
  purpose: >-
    Mirror tests for shape.py, each over the verification trees and hand-built variants:
    test_nonfinal_calls_are_counted_at_every_position, test_spawn_usage_is_compared_with_the_childs_last_call,
    test_background_notice_status_is_read_and_compared, test_pinned_absent_sidecars_now_present_are_found and
    test_stop_hook_summaries_are_counted.
- file: tests/telemetry_verify/test_real_transcript_checks.py
  action: Create
  purpose: >-
    Integration-marked, local only (never CI; real trees exist only in a live session). Runs ledger and shape over every
    real tree found the way tests/fixtures/turn_capture_real.py finds them (TURN_CAPTURE_REAL_TRANSCRIPTS, else
    ~/.claude/projects/*/*.jsonl), prints counts only (never content), prints LEDGER_UNPROVEN when no tree holds a
    cost-state record, and fails only on an alarm-class finding.
- file: tests/fixtures/telemetry_verification_trees.py
  action: Create
  purpose: >-
    Shared helper (never a test_ module): the slice 4 trap trees, built at runtime with the producer corpus builders in
    tests/fixtures/turn_capture_corpus.py, kept OUT of the producer golden corpus so its parser_versions.yaml golden
    digest does not move. Trees in execution_steps[1]; each names the producer parser_version 4 case it lines up with
    (constraints[1]).
- file: tests/fixtures/telemetry_golden_chain.py
  action: Create
  purpose: >-
    Shared helper: build a catalog under the reader's telemetry alias (tests/fixtures/telemetry_read_db.py
    open_memory_catalog, or open_local_lake for the DuckLake leg), register one real-purpose project row, append a tree's
    record_turn batches through src.telemetry.append.append_events with the contract-derived specs
    (tests/fixtures/turn_capture_ducklake.load_specs) and an explicit now, read every stored row back, resolve a session
    selector (root, or agent:<agentId>) to its stored session_id by entity_ref, and run a verb through
    src.common.ducklake_event_reads.execute. Runs record_turn inside turn_capture_corpus.case_cap(name) so a case's
    test-only cap applies. Takes its foreign-key pairs from scripts.telemetry_verify.joins (the contract), never a
    restated list, and holds back transcript rows above the inline threshold exactly as
    tests/turn_capture/test_capture_ducklake_integration.py does (the kernel facade has no blob route).
- file: tests/telemetry/fixtures/derived_golden_state.yaml
  action: Create
  purpose: >-
    Hand-authored expectations for the state verbs (session_state_and_duration, agent_run_state_and_duration,
    sessions_window, sessions_window_all_purposes); shape and authoring rule in execution_steps[2]. A residual-class file
    under Decision 166 (500 effective lines, 2,000-character lines, enforced in --pre by validate_structural_size_limits):
    one flow-mapping line per expectation with its why inline.
- file: tests/telemetry/fixtures/derived_golden_rollups.yaml
  action: Create
  purpose: >-
    Hand-authored expectations for the roll-up verbs (agent_run_token_rollup, session_process_event_rollup,
    session_friction_rollup, model_call_cost_estimate), same shape, header and size rule as the state file. Together the
    two files are the one expectations set every engine asserts.
- file: tests/telemetry/test_derived_layer_reconciliation.py
  action: Create
  purpose: >-
    rec-4025's acceptance module. Module-level duckdb = pytest.importorskip("duckdb") (the assignment form
    scripts/verification_graduation.py recognises; a bare call is not recognised), not integration-marked except the local
    DuckLake node. Nodes in execution_steps[6], including rec-4025's acceptance node test_golden_fixtures_reconcile.
- file: docs/contracts/file-router.yaml
  action: Modify
  purpose: >-
    Add the telemetry-verify route (targets [scripts/telemetry_verify/]) after the telemetry-capture route, with an
    additive amendment_log entry. The file is at 500 of 500 effective lines (Decision 166), so compact multi-line
    amendment_log entries (today the 2026-09-21 to 2026-09-26 entries) to one line each to pay for the addition, keeping
    every entry's date, change_class and summary (the PLAN-telemetry-blob-route precedent).
bundled_recommendations: []
followon_recs:
- rec-4025
- rec-4392
- rec-4405
infrastructure_dependencies: []
acceptance_criteria:
- >-
  The independent oracle (scripts/telemetry_verify dedupe and derive) reproduces every expectation in
  tests/telemetry/fixtures/derivation_cases.yaml, every dedupe vector's survivors and conflicted keys and every friction
  vector's facts and totals (VP step 2), and no scripts/telemetry_verify module directly imports duckdb,
  src/common/ducklake_event_read_sql.py, src/turn_capture/streams.py, src/turn_capture/observations.py or a tests module
  (the AST boundary node, VP step 2).
- >-
  For every tree with expectations in the two derived_golden files, the chain (record_turn, append_events, catalog,
  reader verb) and the oracle over the stored rows both equal the hand-authored values (test_golden_fixtures_reconcile,
  VP step 4), and each file's parser_version header equals PARSER_VERSION in the fast tier (VP step 2).
- >-
  For every producer golden tree (iterated over case_names(), never a literal count) and every verification tree, at both
  pass kinds where the tree finalizes: the verb output equals the oracle output for every emitted session and every
  session-bound verb at the authored as_of rule's values; every telemetry join of docs/contracts/_joins.yaml (loaded by
  scripts.telemetry_verify.joins) resolves for finalized trees;
  survivors equal the emitted rows; no grain key is conflicted; and each session has exactly one generation, at
  PARSER_VERSION (VP step 5).
- >-
  Mutation evidence: each of the four planted verb-SQL defects in execution_steps[6] makes the reconciliation report at
  least one mismatch, over inputs that can expose it (an as_of exactly at the idle threshold of a NON-TERMINAL session's
  own last event; a shared-observation_id model_call pair), so the harness is shown to discriminate (VP step 6).
- >-
  Replay and delivery cannot move a derived value: an identical re-send inserts 0 rows; reversed batch order and
  incremental delivery (a non-final pass at every root line count from turn_capture_corpus.fork_boundary(files), which
  is 0 on an unforked tree, to the end, then the final pass; earlier cuts on a forked tree halt by the producer's K-1
  rule) leave every verb output unchanged; and a delivery
  three days late (append_events now = event time plus three days) leaves every verb output equal to the on-time baseline
  (now = event time plus one second) (VP step 7).
- >-
  A differing re-send is refused (GrainConflictError) and writes nothing; a stored conflicting pair (distinct
  created_timestamps) is reported in every verb's stamps and identically in the oracle's, with no other column compared
  for that session because Decision 207 leaves the survivor unspecified; a directly inserted claude_code plus litellm model_call pair sharing one
  observation_id is counted once by verbs and oracle alike; re-appending a tree at PARSER_VERSION + 1 leaves only the new
  generation live, and a sessions-only bump retires the other tables' rows in both (VP step 8).
- >-
  The ledger check classifies every model of every cost-state cut on the verification trees and unit vectors into the
  documented finding classes, alarms only on the alarm classes, and excludes everything after the cut (VP step 3).
- >-
  The shape checks count non-final calls by stream kind and position, compare sync spawn usage with the child's last
  call, read background notice statuses, find pinned-absent sidecars that now exist and count Stop hook summaries, one
  node each (VP step 3).
- The same expectations pass on a local DuckLake catalog, run before handoff (VP step 9).
- >-
  The real-transcript checks run on the implementing session's own tree and report counts, or LEDGER_UNPROVEN when no
  tree holds a cost-state record (VP step 10).
- >-
  Every scripts/telemetry_verify module is at 100% line coverage from its mirror tests (VP step 11), and
  docs/contracts/file-router.yaml routes scripts/telemetry_verify/ (VP step 12).
verification_plan:
- step: 1
  phase: pre-deploy
  action: >-
    Precondition. The branch is on current main, the files this plan builds on exist at the shapes it names, and the
    producer is still at parser_version 3 (constraints[1]).
  command: >-
    git fetch origin main --quiet && git merge-base --is-ancestor origin/main HEAD && test -f
    tests/fixtures/turn_capture_corpus.py && test -f tests/fixtures/telemetry_read_db.py && test -f
    tests/fixtures/turn_capture_ducklake.py && test -f tests/fixtures/turn_capture_real.py && grep -q "def append_events"
    src/telemetry/append.py && grep -q "def compared_columns" src/common/ducklake_event_reads.py && grep -q "FRICTION_RULES"
    src/common/ducklake_event_read_verbs.py && grep -q "def execute" src/common/ducklake_event_reads.py && grep -q
    "^PARSER_VERSION = 3$" src/turn_capture/record_turn.py && echo PRECONDITION_OK
  expected: PRECONDITION_OK.
  fix_if: >-
    The ancestry test failing means main moved: rebase the branch onto origin/main (git rebase origin/main) and re-run.
    A missing helper or symbol means main changed a file this plan builds on: stop and escalate to the coordinator for a
    plan amendment, never adapt the scope inline. PARSER_VERSION other than 3 means the producer fixes build merged
    first (at the start or after a rebase): stop and escalate to the coordinator for a plan amendment; never author at
    parser_version 4 here.
  hermetic: false
  graduation: waive
  graduation_waiver_reason: >-
    A sequencing precondition on other plans' files, not a behaviour of this change; as a standing guard it would only
    re-assert that those files exist.
- step: 2
  phase: pre-deploy
  action: >-
    The oracle reproduces every committed dedupe, derivation and friction expectation, and the package's direct imports
    stay inside the allow-list.
  command: >-
    bin/venv-python -m pytest tests/telemetry_verify/test_dedupe.py::test_oracle_matches_every_dedupe_vector
    tests/telemetry_verify/test_derive.py::test_oracle_matches_every_committed_derivation_case
    tests/telemetry_verify/test_derive.py::test_oracle_matches_every_friction_vector
    tests/telemetry_verify/test_derive.py::test_derived_golden_headers_match_parser_version
    tests/telemetry_verify/test_joins.py::test_telemetry_joins_load_from_the_contract
    tests/telemetry_verify/test_package_boundary.py::test_oracle_has_no_direct_reader_sql_duckdb_streams_or_tests_import -q
  expected: Exit 0, all six nodes pass. Red before because the nodes and the package are absent.
  expected_literals: []
  fix_if: >-
    A disagreement with a committed expectation means the oracle misreads the contract formula; re-read the formula and fix
    the oracle. Never edit derivation_cases.yaml, dedupe_vectors.yaml or friction_vectors.yaml to match the oracle; if a
    committed expectation itself contradicts its contract formula, stop and escalate to the coordinator. A boundary
    failure means a module imports what constraints[3] forbids; remove the import, never widen the allow-list. A header
    mismatch means main moved PARSER_VERSION: stop per VP step 1's fix_if (constraints[1]). A missing join means the loader misreads
    _joins.yaml's direction; fix the loader, never the contract.
  hermetic: true
  graduation: graduate
  graduation_check_id: telemetry-verify-oracle-matches-committed-cases
- step: 3
  phase: pre-deploy
  action: The ledger and shape checks classify every documented case.
  command: >-
    bin/venv-python -m pytest tests/telemetry_verify/test_ledger.py::test_cut_bounded_reconciliation_classifies_every_model
    tests/telemetry_verify/test_shape.py::test_nonfinal_calls_are_counted_at_every_position
    tests/telemetry_verify/test_shape.py::test_spawn_usage_is_compared_with_the_childs_last_call
    tests/telemetry_verify/test_shape.py::test_background_notice_status_is_read_and_compared
    tests/telemetry_verify/test_shape.py::test_pinned_absent_sidecars_now_present_are_found
    tests/telemetry_verify/test_shape.py::test_stop_hook_summaries_are_counted -q
  expected: Exit 0, all six nodes pass. Red before because they are absent.
  expected_literals: []
  fix_if: >-
    A misclassified model or a miscounted call means the walk differs from execution_steps[4] or [5]; fix the walk, never
    widen a declared class to absorb a mismatch.
  hermetic: true
  graduation: graduate
  graduation_check_id: telemetry-verify-ledger-and-shape-classify
- step: 4
  phase: pre-deploy
  action: The chain and the oracle both equal the hand-authored expectations (rec-4025's acceptance node).
  command: >-
    bin/venv-python -m pytest tests/telemetry/test_derived_layer_reconciliation.py::test_golden_fixtures_reconcile -q
  expected: >-
    Exit 0. Red before because the module is absent. Steps 4 to 8 graduate as test_selector rows (one pytest node
    each), the only slot whose venv-less differential treats the duckdb importorskip's "found no collectors" as a skip
    (scripts/verification_graduation.py, rec-2655).
  fix_if: >-
    When the verb and the oracle agree with each other but not with the authored value, re-derive the value by hand from
    the formula before changing anything. When the verb alone disagrees, that is a reader defect: stop, file it through the
    portal (out-of-scope bug, never an inline fix to src/) and escalate to the coordinator. Never copy a value from either
    output into a derived_golden file. A header mismatch means main moved PARSER_VERSION: stop per VP step 1's fix_if (constraints[1]).
  hermetic: false
  graduation: graduate
  graduation_check_id: telemetry-derived-layer-golden-reconcile
- step: 5
  phase: pre-deploy
  action: Whole-corpus agreement between the verbs and the oracle, with the structural invariants.
  command: >-
    bin/venv-python -m pytest
    tests/telemetry/test_derived_layer_reconciliation.py::test_every_tree_agrees_with_the_oracle_and_holds_invariants -q
  expected: Exit 0.
  fix_if: >-
    An oracle-versus-verb disagreement on a tree with no authored expectation is resolved exactly as step 4 says: decide
    from the contract formula which side is wrong; a reader defect is filed and escalated, an oracle defect is fixed here.
  hermetic: false
  graduation: graduate
  graduation_check_id: telemetry-derived-layer-oracle-agreement
- step: 6
  phase: pre-deploy
  action: Mutation evidence. Each planted verb-SQL defect is detected.
  command: >-
    bin/venv-python -m pytest tests/telemetry/test_derived_layer_reconciliation.py::test_harness_detects_planted_verb_defects
    -q
  expected: Exit 0. Red before because the node is absent.
  fix_if: >-
    A planted defect that survives means the harness misses that class of error: add the authored expectation or the
    discriminating input that catches it, never drop or weaken the mutation.
  hermetic: false
  graduation: graduate
  graduation_check_id: telemetry-derived-layer-mutation-evidence
- step: 7
  phase: pre-deploy
  action: Replay, batch order, incremental Stop-pass delivery and late delivery leave every derived value unchanged.
  command: >-
    bin/venv-python -m pytest
    tests/telemetry/test_derived_layer_reconciliation.py::test_replay_order_and_late_delivery_leave_derived_values_unchanged
    -q
  expected: Exit 0. Red before because the node is absent.
  fix_if: >-
    A CursorError on a cut before a forked tree's fork boundary is the producer's declared K-1 halting case
    (tests/fixtures/turn_capture_corpus.py fork_boundary), not a defect: start that tree's cuts at the boundary. Any
    other derived value that moves under replay, order or late delivery is a reader or kernel defect: file it and
    escalate.
  hermetic: false
  graduation: graduate
  graduation_check_id: telemetry-derived-layer-delivery-independence
- step: 8
  phase: pre-deploy
  action: Conflicts are reported, the R5c pair is counted once, and generations retire.
  command: >-
    bin/venv-python -m pytest
    tests/telemetry/test_derived_layer_reconciliation.py::test_conflicts_are_reported_and_generations_retire -q
  expected: Exit 0. Red before because the node is absent.
  fix_if: >-
    A conflict the stamps miss, an R5c pair counted twice, or a retired generation still counted is resolved as step 4
    says.
  hermetic: false
  graduation: graduate
  graduation_check_id: telemetry-derived-layer-conflicts-and-generations
- step: 9
  phase: pre-deploy
  action: The same expectations on a local DuckLake catalog (partitioned, inlining off, UTC).
  command: >-
    bin/venv-python -m pytest
    tests/telemetry/test_derived_layer_reconciliation.py::test_golden_fixtures_reconcile_on_local_ducklake -m integration -q
  expected: Exit 0. The extension helper fails, never skips, when ducklake cannot load (rec-4071).
  fix_if: >-
    A DuckLake-only failure (in-memory green) is an engine difference: report it with the failing tree and verb, file it
    through the portal and escalate; never relax the expectation for one engine.
  hermetic: false
  graduation: waive
  graduation_waiver_reason: >-
    Integration-marked: it needs a network INSTALL of the ducklake extension, and no CI tier runs integration nodes
    until rec-4071 provisions the extension; the deployed-engine leg (the verification verbs plan's deploy smoke) is the
    standing real-DuckLake guard.
- step: 10
  phase: pre-deploy
  action: >-
    The check library over this session's own real transcript tree (counts only). Run it after the session has resumed at
    least once if possible, so a cost-state record exists.
  command: bin/venv-python -m pytest tests/telemetry_verify/test_real_transcript_checks.py -m integration -q -s
  expected: >-
    Exit 0, with one count line per tree (models, finding classes, non-final calls by kind and position), or
    LEDGER_UNPROVEN when no tree holds a cost-state record. Report the lines verbatim.
  fix_if: >-
    An alarm-class finding on a real tree is a real finding: report it, file it through the portal and escalate to the
    coordinator; never add a declared class to silence it. A shape the vocabulary does not name (for example a new record
    type) is reported the same way.
  hermetic: false
  graduation: waive
  graduation_waiver_reason: >-
    It reads the live session's own transcript trees under ~/.claude/projects, which exist in no CI tier; the in-session
    source check plan runs the same library on real trees in production.
- step: 11
  phase: pre-deploy
  action: >-
    Every new module is fully covered by its mirror tests. Run pytest-cov directly: the coverage checker's source-to-test
    map does not reach scripts/ subpackages outside its allow-list, so it would report scripts/telemetry_verify as skipped
    (mapping owner rec-2641, annotated 2026-10-17 to name this package; the misleading skip message is rec-3617).
  command: >-
    bin/venv-python -m pytest tests/telemetry_verify -m "not integration" --cov=scripts/telemetry_verify
    --cov-report=term-missing --cov-fail-under=100 -q
  expected: Exit 0 at 100% line coverage.
  fix_if: A coverage gap needs a direct assertion in the module's mirror test, never a pragma.
  hermetic: false
  graduation: waive
  graduation_waiver_reason: >-
    A whole-directory coverage run of this plan's own new tests needing pytest-cov, which the venv-less fast tier lacks; a
    standing row would re-implement the repository coverage policy for one package, whose mechanical gap (scripts/
    subpackages outside the checker's map) is owned by rec-2641.
- step: 12
  phase: pre-deploy
  action: The new package is routed for discovery.
  command: grep -c "scripts/telemetry_verify/" docs/contracts/file-router.yaml
  expected: The count is 1 or more.
  expected_literals: []
  fix_if: A count of 0 means the route row is missing; add it as the file-router scope row says.
  hermetic: true
  graduation: waive
  graduation_waiver_reason: >-
    validate_placement already guards every route's target resolution in both tiers; the row's presence is a one-time
    bookkeeping fact, not a behaviour that can regress silently.
- step: 13
  phase: pre-deploy
  action: Lint and run the full tier on the committed, clean tree before the push, as the handoff policy requires.
  command: >-
    bin/venv-python -m ruff check scripts/telemetry_verify tests/telemetry_verify tests/telemetry tests/fixtures &&
    bin/venv-python -m scripts.validate
  expected: Exit 0 from both.
  fix_if: Fix the reported finding at its root (Decision 55); never skip, disable or quarantine a test.
  hermetic: false
  graduation: not-applicable
- step: 14
  phase: post-deploy
  action: >-
    After the merge (no deploy: the step runs once the squash commit is on main), the carrier recs carry this plan's
    outcome. rec-4025 is still open, its acceptance names the verification monitor's node and no longer this plan's,
    and its context carries this plan's note; rec-4392 is open with no dependency.
  command: >-
    AWS_PROFILE=agent_platform bin/venv-python -c "from src.common.ducklake_reader_client import make_reader;
    r={x['id']:x for x in make_reader().named('recs_by_ids',ids='rec-4025,rec-4392')}; a=r['rec-4025'];
    assert a['status']=='open',a['status']; assert a['file']=='tests/telemetry_verify/test_monitor.py',a['file'];
    assert 'tests/telemetry_verify/test_monitor.py' in a['acceptance'] and
    'test_golden_fixtures_reconcile' not in a['acceptance'],a['acceptance']; assert 'PLAN-telemetry-golden-harness' in
    a['context']; b=r['rec-4392']; assert b['status']=='open' and not b.get('dependencies'),b.get('dependencies');
    print('CARRIERS_OK')"
  expected: CARRIERS_OK.
  fix_if: >-
    A missing note or an old acceptance means the closure's portal update did not land: run it now through
    scripts.ops_data_portal update_rec (context note with the merge SHA; acceptance
    tests/telemetry_verify/test_monitor.py::test_monitor_reports_rederivation_orphan_and_completeness_counts). Never close
    either rec here.
  hermetic: false
  graduation: not-applicable
