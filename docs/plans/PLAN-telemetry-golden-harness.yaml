execution_steps:
- >-
  Confirm VP step 1 (rebase onto origin/main first if the ancestry test fails). Read the contract formulas named in the
  derive.py scope row, then src/common/ducklake_event_reads.py (execute, compared_columns) and VERB_FIELDS in
  src/common/ducklake_reader_client.py for the output columns only. Do not read src/common/ducklake_event_read_sql.py
  before the oracle passes VP step 2.
- >-
  tests/fixtures/telemetry_verification_trees.py, using the corpus builders (assistant, tool_result, hook, attachment,
  child, make_files), editing message.stop_reason and message.usage after building where a tree needs them. Trees: (a)
  subagent_nonfinal_midstream: a root that spawns one sync sub-agent whose toolUseResult carries usage equal to the
  child's last call's FINAL usage; the child makes three calls: one single-line complete call (stop_reason set), one
  mid-stream two-line call
  (thinking plus tool_use) whose lines carry stop_reason null and output_tokens 4, and a final two-line handback call with
  stop_reason null and output_tokens 8 where the spawn usage says 768. (b) subagent_background_failed: three background
  spawns whose <task-notification> notices carry <status>failed</status>, <status>killed</status> and an unrecognised
  token <status>unrecognised_status</status> (status values other than completed are inferred from Claude Code's notice
  format, not observed); shape.py reports background_status_mismatch 3, and each child's close reads success at the
  current producer (known_defect rec-4358). (c) resume_with_cost_state, reproducing ledger measurement 2 of
  planning-facts.md: turn 1 on the main model (records carry requestedModel claude-test-1[1m], message.model
  claude-test-1); a sync sub-agent on the MAIN model (same requestedModel) with one mid-stream non-final call; a second
  sync sub-agent on claude-sub-1 whose calls are all complete; then a cost-state record in the measured shape
  ({type: cost-state, sessionId, totalCostUSD, modelUsage: {<requestedModel>: {inputTokens, outputTokens,
  thinkingTokens, cacheReadInputTokens, cacheCreationInputTokens, webSearchRequests, costUSD}}}, the keys this
  session's own resumed transcript carries, planning-facts.md) holding: claude-test-1[1m] equal to the prefix sums
  (root plus both sub-agents) on input, cache read and cache creation and 12 above it on output; claude-sub-1 exact on
  all four classes; claude-haiku-aux present only in the ledger. Then a SessionStart:resume hook group and a turn 2
  whose calls lie after the cut. Expected classes: claude-test-1[1m] ledger_output_residual_nonfinal (shortfall 12,
  one non-final call), claude-sub-1 ledger_exact, claude-haiku-aux ledger_auxiliary_only. Each tree's docstring names
  the measurement it reproduces and the producer fixes plan's parser_version 4 golden case it lines up with (a:
  subagent_usage_final_and_spawn_correction, b: background_notice_statuses, c: resume_segment_closes), per
  constraints[1].
- >-
  tests/telemetry/fixtures/derived_golden_state.yaml and derived_golden_rollups.yaml, authored by hand per
  constraints[0] and committed together on their own before any dedupe, derive or chain code. Shape of each: a header
  comment stating the authoring rule; parser_version (the integer the values were authored against); trees: a list of
  {tree: "corpus:<golden case file>" or "verification:<tree name>", pass: final or stop, why, expect: [one flow-mapping
  line per expectation: {verb, session: root or "agent:<agentId>" (absent for the window verbs), params, rows: [asserted
  subset of columns], why, known_defect (optional rec id), discriminates (optional; idle_threshold on the exact-threshold
  as_of expectations below)}]}. as_of rule for every state verb (session_state_and_duration,
  agent_run_state_and_duration, sessions_window): two absolute ISO values, one inside and one beyond the 24 h idle
  threshold of THAT session's own last event_timestamp across its rows in the four tables, and a third value exactly at
  that last event plus 86,400 s, tagged discriminates idle_threshold, on at least two NON-TERMINAL sessions (at
  parser_version 3: the pass-stop root of hooks_resume_and_compact
  and the child of subagent_background_without_completion) (the contract says the idle time must EXCEED the threshold,
  so that value reads running; telemetry_sessions.yaml:157, derivation_cases.yaml c06). A terminal session reads its
  outcome at any as_of, so an exact-threshold value there proves nothing. Author expectations for the derivation-relevant subset: hooks_resume_and_compact,
  resume_after_interrupt, close_cancelled_mid_stream, close_cancelled_running_tool, close_failed_api_error, subagent_sync,
  subagent_background_with_completion, subagent_background_without_completion, nested_subagent_depth2,
  fork_session_nested, multiblock_response_interleaved_tool_results, gate_and_precommit_markers, hook_blocked_tool_call,
  tool_result_error, sidecar_present, no_reply_session (it emits no row in any table, so its expectation is an empty
  sessions_window_all_purposes answer over its day), and the three verification trees, at pass final and, for at least
  hooks_resume_and_compact and subagent_background_with_completion, also at pass stop.
- >-
  dedupe.py and derive.py, then test_dedupe.py, test_derive.py and test_package_boundary.py (VP step 2). The oracle takes
  rows as plain dicts keyed by stored column name (timestamps as timezone-aware datetimes or ISO strings, normalised once
  on entry) and returns lists of dicts with the verb's VERB_FIELDS columns in order. Window verbs take a projects mapping
  (project_id -> purpose) for the real-purpose filter. Stamps: generations as (producer, parser_version) pairs ordered by
  producer; conflicted_grain_keys as (table_name, producer, event_id, parser_version) ordered; derivation_conflicted.
- >-
  ledger.py and test_ledger.py (VP step 3). Finding vocabulary (stable names the later plans consume; DECLARED maps each
  declared class to its owner or reason as module data): ledger_exact; ledger_output_residual_nonfinal (declared,
  rec-4354: output short and at least one non-final call in the prefix for that model; the finding carries the
  shortfall and the non-final call count so a later trend can bound it); ledger_auxiliary_only (declared:
