    1. Precondition: rebase onto main; confirm no open PR edits the four hooks and that rec-5384's acceptance is the VP 4
    node; if not, stop and tell the coordinator.
  - 2. Tests red-first in tests/hooks/test_hook_block_marker.py; run them and confirm the new nodes fail.
  - 3. The four hook edits (HB-1). Run VP 1 and VP 2 until green.
  - 4. VP 3 (live block in this session); VP 4.
  - >-
    5. Commit Flow (implement skill, git-ops.yaml handoff_sequence and resolves_trailer): Resolves: rec-5384 in the
    implementation commit; rebase; VP 5 on the rebased clean HEAD; push; PR body with the rule, the VP table and the four
    hook diffs; paste the hook diffs inline in the PR thread and ask Benjamin for his word; merge on code review PROCEED,
    green CI and his word.
  - "6. After merge, VP 6 and VP 7. Report what was implemented, VP results, merge SHA and rec-5384's status."
rollback: Revert the squash commit; the marker line is ignored by every other reader, so the revert only renames the rows back.
