    red_green_expectation: red before (no marker), green after
  - source: .claude/hooks/merge_gate.sh
    behavior: HB-1 on every exit-2 path, none on allow.
    verification_step: 1
    test_selector: tests/hooks/test_hook_block_marker.py::test_shim_deny_paths_end_with_one_marker
    red_green_expectation: red before (no marker), green after
  - source: .claude/hooks/protected_action_gate.sh
    behavior: HB-1 on every exit-2 path, none on allow.
    verification_step: 1
    test_selector: tests/hooks/test_hook_block_marker.py::test_shim_deny_paths_end_with_one_marker
    red_green_expectation: red before (no marker), green after
  - source: .claude/hooks/rec_writer_tripwire.py
    behavior: HB-1 as the block message's last line.
    verification_step: 1
    test_selector: tests/hooks/test_hook_block_marker.py::test_rec_writer_tripwire_block_ends_with_its_marker
    red_green_expectation: red before (no marker), green after
constraints:
  - >-
    Rule HB-1, pinned: each block of a registered PreToolUse hook ends its stderr with the line 'HOOK-BLOCK v1
    hook=<the registered script's stem>', printed once. For a shim the shim prints it, never its adapter. No exit code,
    message line, timeout bound, pre-filter or allow path changes.
  - >-
    No edit to src/, the parser, the reader, any contract, settings.json, hooks.json, or the four marked hooks. The
    adapters (handoff_evidence_gate.py, merge_gate.py, protected_action_gate.py) are not edited.
  - 'Public repository (Decision 101): fixtures synthetic; the probes print counts and fixed tokens only.'
  - >-
    Hook code: the operator's word on the final diff of the four hooks is required before merge (coordinator contract
    standing_authorisation; hook and security code), pasted inline in the PR thread.
  - No rescue agents or workaround loops (Decision 55); a failed live step stops for RCA.
