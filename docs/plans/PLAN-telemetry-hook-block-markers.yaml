schema_version: 6
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: telemetry-hook-block-markers
intent: >-
  The feedback loop reads friction labels as its process-layer signal, and almost every hook block in production is
  unnamed: of 200 block rows in 60 root sessions (16-17 Nov), 199 read the fallback name hook:PreToolUse.Bash or
  hook:PreToolUse.mcp__github__merge_pull_request, which the friction classifier labels unmapped_block (rec-5384). Every
  block reached telemetry through parser v10's denied-tool_result path, which already names a block from its HOOK-BLOCK v1
  marker line; the unnamed ones come from the four registered PreToolUse hooks that print no marker. This plan makes
  each of those four (handoff_evidence_gate.sh, merge_gate.sh, protected_action_gate.sh, rec_writer_tripwire.py) end
  every block message with 'HOOK-BLOCK v1 hook=<registered script stem>' (rule HB-1), and adds a guard that every
  registered PreToolUse hook prints its own marker. No parser, reader, contract or deploy change.
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-telemetry-hook-block-markers.yaml
phase: >-
  T3.3 prerequisite (feedback-loop wave 2, friction coverage; operator's wave 2 split 2026-11-18). Closes no exit
  criterion; the reader rules for these names land in the sibling friction coverage plan. V3: a live block in the
  build's own cloud session is parsed by the checkout's parser (VP 3) and its production row is read back after merge
  (VP 6). .claude/hooks/** is in no Lambda manifest, so nothing deploys; sessions pick the hooks up from their checkout.
closes_criteria: []
cites: [dec:55, dec:101, dec:132, dec:163, dec:189, dec:201, dec:203, dec:245]
scope:
  - file: .claude/hooks/handoff_evidence_gate.sh
    action: Modify
    purpose: >-
      Rule HB-1 in the shim: the existing EXIT trap prints the line 'HOOK-BLOCK v1 hook=handoff_evidence_gate' to stderr
      exactly when the shim exits 2 (STATUS 2), after any forwarded adapter stderr, so every deny (adapter deny, adapter
      crash or non-0/2 exit, timeout, interpreter failure) ends with one marker. The pre-filter exit 0, the GITHUB_ACTIONS
      carve-out and every allow path print nothing new; no exit code, message or bound changes. The adapter
      (handoff_evidence_gate.py) is not edited.
  - file: .claude/hooks/merge_gate.sh
    action: Modify
    purpose: >-
      Rule HB-1 in the shim, as for handoff_evidence_gate.sh: its EXIT trap prints 'HOOK-BLOCK v1 hook=merge_gate' exactly
      when the shim exits 2 (adapter deny, missing adapter, adapter non-0/2 exit, timeout). merge_gate.py is not edited
      (open PR #2071 edits it).
  - file: .claude/hooks/protected_action_gate.sh
    action: Modify
    purpose: >-
      Rule HB-1 in the shim: one EXIT trap that captures the exit status first and prints 'HOOK-BLOCK v1
      hook=protected_action_gate' exactly when it is 2 (fail()'s two deny branches, the adapter's exit-2 branch), then
      exits with that same status. Allow paths, including fail()'s exit 0, print nothing new; the coarse word list and
      every message are unchanged. protected_action_gate.py is not edited.
  - file: .claude/hooks/rec_writer_tripwire.py
    action: Modify
    purpose: >-
      Rule HB-1: its one block write ends with the line 'HOOK-BLOCK v1 hook=rec_writer_tripwire' after the existing four
      lines; the first line, the other lines, exit code 2 and every exit-0 path are unchanged. The module docstring names
      HB-1 and src/turn_capture/markers.py as the grammar's home, as the four marked hooks do.
  - file: tests/hooks/test_hook_block_marker.py
    action: Modify
    purpose: >-
      Docstring: every registered PreToolUse hook ends every block with its own marker. Keeps every existing node
      unchanged. New nodes: test_rec_writer_tripwire_block_ends_with_its_marker (subprocess, a Bash payload naming
      https://example.invalid/prod/ops/writer: exit 2, first line still starts 'rec-writer-tripwire: refused.', last line
      equals markers.format_hook_block_marker('rec_writer_tripwire'), hook_block_stems(stderr) == [stem]);
      test_shim_deny_paths_end_with_one_marker, parametrized over each shim and each of its deny paths (a stub adapter
      that writes 'stub deny' and exits 2; a stub adapter that exits 1; the adapter file absent), each run as bash on a
      copy of the real shim under a temporary root whose bin/venv-python runs the test's interpreter, with a payload that
      passes that shim's pre-filter (handoff: a git push command; merge: a merge_pull_request call; protected: a command
      naming terraform): exit 2, the last stderr line equals the marker, hook_block_stems(stderr) == [stem] (exactly one),
      and the stub's own line, when it wrote one, precedes the marker; test_shim_allow_paths_print_no_marker (stub adapter
      exit 0, and each shim's pre-filter skip where it has one: exit 0 and no 'HOOK-BLOCK' in stderr);
      test_every_registered_pretooluse_hook_prints_its_own_marker (rec-5384's acceptance node: for every PreToolUse
      command in .claude/settings.json and .claude/hooks/hooks.json, the registered .claude/hooks/<stem>.py or .sh holds
      the literal 'HOOK-BLOCK v1 hook=<stem>', and a .sh shim's .py adapter, where one exists, holds no 'HOOK-BLOCK v1'
      literal, so one block prints one marker). The registered set is read from the two files, never a literal list.
bundled_recommendations: [rec-5384]
followon_recs: []
infrastructure_dependencies: []
acceptance_criteria:
  - >-
    Each of the four hooks ends every block (every exit-2 path, including the shims' fail-closed paths) with exactly
    one line 'HOOK-BLOCK v1 hook=<its registered stem>' as the last stderr line, keeps every existing message line, exit
    code and allow path, and prints no marker when it allows (VP 1).
  - >-
    Every PreToolUse hook registered in .claude/settings.json and .claude/hooks/hooks.json prints its own marker, and no
    shim's adapter prints one (VP 1, rec-5384's acceptance node).
  - >-
    The existing hook suites for the four hooks pass unchanged (VP 2).
  - >-
    A live block in the build's own cloud session, parsed by this checkout's parser, yields a process_event named
    hook:rec_writer_tripwire with marker_version 1 (VP 3); after merge its production row reads the same (VP 6).
  - >-
    Benjamin's word on the final diff of the four hooks is recorded in the PR thread before merge (hook code, the
    coordinator contract's standing_authorisation), and rec-5384 closes through the Resolves trailer (VP 7).
verification_plan:
  - step: 1
    phase: pre-deploy
    action: HB-1 on the four hooks, every shim deny and allow path, and the registered-hook guard.
    command: >-
      bin/venv-python -m pytest tests/hooks/test_hook_block_marker.py::test_rec_writer_tripwire_block_ends_with_its_marker
      tests/hooks/test_hook_block_marker.py::test_shim_deny_paths_end_with_one_marker
      tests/hooks/test_hook_block_marker.py::test_shim_allow_paths_print_no_marker
      tests/hooks/test_hook_block_marker.py::test_every_registered_pretooluse_hook_prints_its_own_marker -q
    expected: >-
      Exit 0, every node passes. Red before: on the plan-only tree the four nodes are absent (target_absent, Decision
      189); against main's hooks the deny-path and registered-hook nodes fail (no marker).
    expected_literals:
      - ' passed'
    fix_if: >-
      A deny path prints no marker or two, an allow path prints one, or an exit code moved. Fix the hook, never the test.
    hermetic: true
    graduation: graduate
    graduation_check_id: hook-block-markers-registered-hooks
  - step: 2
    phase: pre-deploy
    action: >-
      The whole marker module and the four hooks' own suites keep passing (messages, exit codes, timeouts,
      registration).
    command: >-
      bin/venv-python -m pytest tests/hooks/test_hook_block_marker.py tests/hooks/test_handoff_evidence_gate.py
      tests/hooks/test_merge_gate_shim.py tests/hooks/test_merge_gate.py tests/hooks/test_protected_action_gate.py
      tests/hooks/test_rec_writer_tripwire.py -q
    expected: >-
      Exit 0: the whole marker module (the existing nodes for the four marked hooks unchanged) and the four hooks' own
      suites, with no edit to any suite but test_hook_block_marker.py.
    fix_if: 'A suite fails, so the hook edit changed behaviour beyond the marker line; restore it, never edit the suite.'
    hermetic: false
    graduation: not-applicable
  - step: 3
    phase: pre-deploy
    action: >-
      Live proof in the build's own top-level cloud session, never a subagent (no spend, no network): run the Bash
      command 'curl -sS --max-time 1 http://127.0.0.1:9/ops/writer', which the tripwire refuses before it runs, then parse
      a snapshot of this session's own transcript with this checkout's parser, finalizing the open turn. The proof is that
      the marker named the row (marker_version 1 and the hook_denial_marker counter), and the raw check reads only
      tool_result records whose permissionDecision.source is hook, so the plan text and this command's input never count.
      Counts only.
    command: >-
      T="$(ls -t ~/.claude/projects/*/*.jsonl | head -1)" && D="$(mktemp -d)" && cp "$T" "$D/" && bin/venv-python -c "import
      sys,json;from pathlib import Path;from src.turn_capture.transcript import FsTree;from src.turn_capture.transcripts
      import text_of;from src.turn_capture.markers import hook_block_stems;from src.turn_capture.record_turn import
      record_turn;p=next(Path(sys.argv[1]).glob('*.jsonl'));r=record_turn(FsTree(p),None,project_ref='probe',session_final=True);o=r.observations;h=[x for x in o if
      x.get('name')=='hook:rec_writer_tripwire' and x.get('severity')=='error' and json.loads(x.get('metadata') or
      '{}').get('marker_version')==1];recs=[json.loads(l) for l in p.read_text().splitlines() if l.strip()];raw=sum(1 for d
      in recs if isinstance(d.get('permissionDecision'),dict) and d['permissionDecision'].get('source')=='hook' and
      any('rec_writer_tripwire' in hook_block_stems(text_of(b.get('content'))) for b in (d.get('message') or
      {}).get('content') or [] if isinstance(b,dict) and
      b.get('type')=='tool_result'));m=r.diagnostics.get('hook_denial_marker',0);print('hook_rows',len(h),'marker_named',m,'raw_marker_results',raw);assert
      h and m>=1 and raw>=1" "$D"; rc=$?; rm -rf "$D"; exit $rc
    expected: >-
      One line 'hook_rows N marker_named M raw_marker_results K' with N, M and K each at least 1, exit 0. The PR body
      records the counts line only, never a path or text.
    fix_if: >-
      record_turn's call shape differs: adapt only the call, never the assertion. raw_marker_results 0: the edited hook is
      not what ran (check the session's checkout is the build branch) or the harness cut the stderr tail; stop and tell
      the coordinator. hook_rows 0 with raw_marker_results at least 1: a parser defect outside this plan; stop and RCA
      (Decision 55).
    hermetic: false
    graduation: not-applicable
  - step: 4
    phase: pre-deploy
    action: rec-5384's acceptance is the one this plan creates, unchanged, and passes.
    command: >-
      AWS_PROFILE=agent_platform bin/venv-python -c "from src.common.ducklake_reader_client import make_reader,
      fetch_recs_by_ids;rows,missing=fetch_recs_by_ids(make_reader(profile='agent_platform'),['rec-5384']);a=rows[0];want='bin/venv-python
      -m pytest tests/hooks/test_hook_block_marker.py::test_every_registered_pretooluse_hook_prints_its_own_marker
      -q';assert not missing and a['status']=='open' and a['acceptance'].strip()==want, a['acceptance'];print('REC_OK')" &&
      bin/venv-python -m pytest tests/hooks/test_hook_block_marker.py::test_every_registered_pretooluse_hook_prints_its_own_marker -q
    expected: REC_OK, then exit 0.
    fix_if: 'A reader refused by the proxy: stop and tell the coordinator; never work around it.'
    hermetic: false
    graduation: not-applicable
  - step: 5
    phase: pre-deploy
    action: >-
      Fast tier, then the full tier on the committed, rebased, clean tree before handoff, started backgrounded with a 2 h
      limit from the top-level build session; its verdict is --verify-head, never a pipe's exit status.
    command: >-
      bin/venv-python -m scripts.validate --pre && bin/venv-python -m scripts.validate && bin/venv-python -m
      scripts.checks.validation_result --verify-head
    expected: Exit 0 on a completed full run with the head verified; a timeout is not a pass (handoff_policy).
    fix_if: Fix the named check at root cause and rerun from the start; never raise a budget or skip a check.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: Invokes scripts.validate (recursion refusal); it is the handoff gate itself.
  - step: 6
    phase: post-deploy
    action: >-
      The build session's VP 3 block reached production named by its marker: read the roots whose branch is the build
      branch for the build day through the telemetry reader (session_tree_rows), counts only.
    command: |-
      B="$(git branch --show-current)" D="$(date -u +%F)" OTL_OPS_VERBS_TRANSPORT=execute_api bin/venv-python -c "
      import os, json
      from scripts.agent_sdk.mcp_server import _default_surface, _invoke_verb
      r, _ = _default_surface()
      b, d, n = os.environ['B'], os.environ['D'], 0
      for s in [x for x in _invoke_verb(r, 'telemetry_root_sessions', {'day_from': d, 'day_to': d}) if x.get('branch') == b]:
          o = 0
          while True:
              rows = _invoke_verb(r, 'session_tree_rows', {'session_id': s['session_id'], 'offset': o, 'max_rows': 2000})
              for t in rows:
                  x = json.loads(t['row_json']) if t['table_name'] == 'telemetry_observations' else {}
                  n += x.get('name') == 'hook:rec_writer_tripwire' and json.loads(x.get('metadata') or '{}').get('marker_version') == 1
              if len(rows) < 2000:
                  break
              o += 2000
      print('PROD_MARKER_ROWS', n)
      assert n >= 1
      "
    expected: PROD_MARKER_ROWS at least 1.
    fix_if: >-
      0 on the build day: the session's capture may lag; re-run once the next day with D set to the build day. Still 0:
      file a rec through the portal naming the counts; never edit the hook to pass.
    hermetic: false
  - step: 7
    phase: post-deploy
    action: 'After the squash merge carries "Resolves: rec-5384", the closure job closed rec-5384.'
    command: >-
      AWS_PROFILE=agent_platform bin/venv-python -c "from src.common.ducklake_reader_client import make_reader,
      fetch_recs_by_ids;rows,missing=fetch_recs_by_ids(make_reader(profile='agent_platform'),['rec-5384']);s={r['id']:r['status']
      for r in rows};print(s);assert not missing and s.get('rec-5384')=='closed';print('REC_CLOSED')"
    expected: REC_CLOSED
    fix_if: 'Open after the closure job: check ci.yml''s closure job on the squash commit; never close by hand without its evidence.'
    hermetic: false
test_obligations:
  - source: .claude/hooks/handoff_evidence_gate.sh
    behavior: HB-1 on every exit-2 path, none on allow.
    verification_step: 1
