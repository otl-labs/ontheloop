    Purity (envelope R7, Decision 207): every verdict reads only the result record, its tool_use and the records before it;
    no settings, environment, git or clock.
  - 'Typed columns only (Benjamin, 2026-10-17): no new column and no new metadata key; the diag counters are pass diagnostics.'
  - >-
    The other blocking hooks (merge_gate, handoff_evidence_gate, protected_action_gate) are not edited (operator's F3 names
    four hooks; protected_action_gate is another workspace's file). They read hook:<event>.<tool> and the reader labels them
    unmapped_block, a declared gap in the envelope line.
