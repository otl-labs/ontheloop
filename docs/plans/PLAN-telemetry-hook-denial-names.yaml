      fetch_recs_by_ids;rows,missing=fetch_recs_by_ids(make_reader(profile='agent_platform'),['rec-4959']);a=rows[0];want='bin/venv-python
      -m pytest tests/common/test_friction_rules_labelled_hooks.py::test_labelled_branch_policy_block_classifies_as_branch_policy_block
      -q';assert not missing and a['status']=='open' and a['acceptance'].strip()==want, a['acceptance'];print('REC_OK')"
      && bin/venv-python -m pytest
      tests/common/test_friction_rules_labelled_hooks.py::test_labelled_branch_policy_block_classifies_as_branch_policy_block -q
    expected: The verify line passes, REC_OK, then exit 0.
    fix_if: >-
      A verify mismatch means the edit differs from the approved words: restore the words, never edit the sidecar. A
      reader refused by the proxy (sts:AssumeRole): stop and tell the coordinator; never work around it.
    hermetic: false
