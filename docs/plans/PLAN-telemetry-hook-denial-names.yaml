    fix_if: >-
      tool_blocked appears, a hand-derived value disagrees (a plan defect to explain, never a value copied from a verb), or
      the module skipped.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      Needs duckdb (hermetic_authoring iii); the full tier runs both files on every main commit, and the reconciliation
      module is already a standing check.
