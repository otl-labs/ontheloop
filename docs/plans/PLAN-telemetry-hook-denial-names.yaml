acceptance_criteria:
  - >-
    A tool call a hook denied in the cloud shape (no hook record; result permissionDecision.source hook) gets one hook
    process_event at severity error under it, named hook:<stem> from the HOOK-BLOCK v1 line, else from the legacy BLOCKED
    by text, else hook:<event>.<tool>, else hook:unknown; the close stays blocked; no row for any other denial (VP 1).
  - >-
    The four blocking hooks end every block message with exactly 'HOOK-BLOCK v1 hook=<own stem>', keep their first line,
    the rest of their text and exit code 2 (VP 1).
  - >-
    A tool call whose block an exit-2 hook record already names gets no second row, and no existing golden case changes
    beyond its parser_version stamp; the corpus gains two cases, the registry records v10 (VP 3, VP 4).
  - >-
    Through the reader's friction SQL, the labelled cloud tree reads branch_policy_block, scope_creep and unmapped_block
    once each and never tool_blocked (rec-4959's acceptance node, VP 6).
  - >-
    The envelope's PARSER_VERSION 10 line and the ports SA-02 clause, with their amendment_log entries, match the
    approved-text sidecar word for word; Benjamin's word on that text and on the four hook diffs is recorded before the
    build merges (VP 2 and VP 7 check the words; the merge_step premerge --expect step and the PR thread hold his word;
    Decision 246 cl.4).
  - >-
    A live block in the build's own cloud session, parsed by this checkout's parser, yields hook:edit_scope_guard at
    severity error under a blocked close (VP 5), and rec-4959 closes through the Resolves trailer (VP 10).
verification_plan:
  - step: 1
    phase: pre-deploy
    action: Rules HD-1..HD-4, the grammar and HB-1 in all four hooks.
    command: >-
      bin/venv-python -m pytest tests/turn_capture/test_hook_denials.py tests/hooks/test_hook_block_marker.py
      tests/turn_capture/test_markers.py::test_hook_block_marker_round_trips
      tests/turn_capture/test_markers.py::test_hook_block_marker_refuses_bad_stems
      tests/turn_capture/test_markers.py::test_hook_block_lines_parse_only_as_whole_lines -q
    expected: Exit 0, every node passes. Red before (both new files and the three nodes absent).
    expected_literals:
      - ' passed'
    fix_if: >-
      A non-hook denial mints a row, a mid-line marker is read, a twin yields two rows, or a hook's first line or exit code
      moved. Fix the rule or the hook, never the fixture.
    hermetic: true
    graduation: graduate
    graduation_check_id: turn-capture-hook-denial-names
  - step: 2
    phase: pre-deploy
    action: Contract notes, their order relative to R8, and the ports validator.
    command: >-
      bin/venv-python -m pytest tests/telemetry/test_hook_denial_contract_notes.py
      tests/telemetry/test_capture_hook_labels_contract_notes.py -q && bin/venv-python -c "from
      scripts.checks.contracts.validate_ports_contract import validate_ports_contract as v;f=[];v(f);assert not f,
      f;print('PORTS_OK')"
    expected: Exit 0, then PORTS_OK. Red before (module absent).
    expected_literals:
      - ' passed'
    fix_if: A note is missing or out of order, or a contract passes 500 effective lines (relief, never a raise).
    hermetic: true
    graduation: graduate
    graduation_check_id: telemetry-hook-denial-names-declared
  - step: 3
    phase: pre-deploy
    action: >-
      The golden corpus at v10 and the registry: every case matches, the new cases equal their builders, incremental
      equals full at every line cut, finalize and resume schedules emit each row once.
    command: >-
      bin/venv-python -m pytest tests/turn_capture/test_record_turn.py::test_golden_cases_match_expected_rows
      tests/turn_capture/test_record_turn.py::test_incremental_equals_full_at_every_line_cut
      tests/turn_capture/test_record_turn.py::test_finalize_resume_schedules_emit_each_row_once
      tests/turn_capture/test_record_turn.py::test_finalize_equals_virtual_prompt_at_eof
      tests/turn_capture/test_record_turn.py::test_new_cases_are_built_from_their_builders
      tests/turn_capture/test_record_turn.py::test_finalization_cuts_are_recorded_once_and_survive_a_reset
      tests/telemetry/test_parser_version_registry.py tests/telemetry_verify/test_derive.py -q
    expected: Exit 0, every node passes.
    fix_if: >-
      Regenerate expected_rows only after VP 1-2 pass. A line-cut failure is a prefix defect in HD-3 (the exit-2 record
      must precede the result), never a test to relax.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      Its nodes already belong to graduated standing checks (turn-capture-golden-corpus,
      turn-capture-r7-incremental-equals-full, turn-capture-finalize-resume-emits-each-row-once and the parser version
      registry); the new cases join the corpus through the index, not a new check.
  - step: 4
    phase: pre-deploy
    action: >-
      Mechanical proof of "no existing golden case changes beyond the version stamp" (the approved envelope sentence):
      every case in origin/main's golden index has the same expected_rows in the regenerated tree with parser_version
      masked. Run after execution step 6's regeneration.
    command: >-
      git fetch origin main --quiet && bin/venv-python -c "import json,subprocess as s;g='tests/fixtures/turn_capture/golden/';b=json.loads(s.check_output(['git','show','origin/main:'+g+'index.json']))['cases'];m=lambda
      r:[{k:v for k,v in x.items() if k!='parser_version'} for x in r];bad=[c for c in b if
      m(json.loads(s.check_output(['git','show','origin/main:'+g+c]))['expected_rows'])!=m(json.load(open(g+c))['expected_rows'])];assert
      not bad,bad;print('UNCHANGED',len(b))"
    expected: UNCHANGED 59 (main's index at planning; a later corpus addition on main raises it, which is fine).
    fix_if: >-
      A listed case changed beyond its stamp: a rule is not a no-op on an old shape (most likely HD-1 firing on a result
      without permissionDecision.source hook); fix the rule, never the golden.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      A one-time comparison against the pre-build base; after merge the standing golden-corpus check pins the regenerated
      rows.
  - step: 5
    phase: pre-deploy
    action: >-
      Live proof in the build's own top-level cloud session, never a subagent, whose denial would land under subagents/ (no spend,
      no network): write .claude/active_plan naming this plan,
      attempt one Write to tmp-hook-denial-probe.txt at the repo root (outside this plan's scope; edit_scope_guard
      blocks it with exit 2), delete .claude/active_plan, then parse a snapshot of this session's own transcript with this
      checkout's parser, finalizing the open turn. The proof is that the MARKER named the row (marker_version 1 and the
      hook_denial_marker counter), not merely the name, which the legacy rule would also produce; the raw check reads only
      tool_result records whose permissionDecision.source is hook, so the plan text and this command's own input never
      count. Counts only.
    command: >-
      test ! -e .claude/active_plan && test ! -e tmp-hook-denial-probe.txt && T="$(ls -t ~/.claude/projects/*/*.jsonl | head -1)"
      && D="$(mktemp -d)" && cp "$T" "$D/" && bin/venv-python -c "import sys,json;from pathlib import Path;from
      src.turn_capture.transcript import FsTree;from src.turn_capture.transcripts import text_of;from
      src.turn_capture.markers import hook_block_stems;from src.turn_capture.record_turn import
      record_turn,PARSER_VERSION;p=next(Path(sys.argv[1]).glob('*.jsonl'));r=record_turn(FsTree(p),None,project_ref='probe',session_final=True);o=[x
      for t,rows in r.batches if t=='telemetry_observations' for x in rows];h=[x for x in o if
      x.get('name')=='hook:edit_scope_guard' and x.get('severity')=='error' and
      json.loads(x.get('metadata') or '{}').get('marker_version')==1];recs=[json.loads(l) for l in p.read_text().splitlines() if
      l.strip()];raw=sum(1 for d in recs if isinstance(d.get('permissionDecision'),dict) and
      d['permissionDecision'].get('source')=='hook' and any('edit_scope_guard' in hook_block_stems(text_of(b.get('content')))
      for b in (d.get('message') or {}).get('content') or [] if isinstance(b,dict) and
      b.get('type')=='tool_result'));m=r.diagnostics.get('hook_denial_marker',0);print('v',PARSER_VERSION,'hook_rows',len(h),'marker_named',m,'raw_marker_results',raw);assert
      PARSER_VERSION==10 and h and m>=1 and raw>=1" "$D"; rc=$?; rm -rf "$D"; exit $rc
    expected: >-
      One line 'v 10 hook_rows N marker_named M raw_marker_results K' with N, M and K each at least 1, exit 0. The row's
      parent is the blocked Write's
      tool_call (check its parent_observation_ref against the close once by hand and say so in the PR body; never paste a
      path or text).
    fix_if: >-
      record_turn's call shape differs: adapt only the call, never the assertion. hook_rows 0 with the marker present: a
      parser defect, stop and RCA (Decision 55). raw_marker_results 0: the hook edit is not live in this checkout, or the
      harness changed the stderr lines (record the CLI version; HD-2's legacy rule still names the row, but the marker
      choice's premise failed, so stop and tell the coordinator). If the probe aborted before its delete step, delete
      .claude/active_plan before any other edit; a test ! -e failure means a probe file was left behind.
    hermetic: false
    graduation: not-applicable
  - step: 6
    phase: pre-deploy
    action: >-
      The labelled tree through the real append kernel and the reader's friction SQL (rec-4959's acceptance), and the
