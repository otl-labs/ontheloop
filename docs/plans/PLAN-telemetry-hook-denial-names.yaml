      CC_SCHEDULED_AGENT_NAME): exit 2, the first stderr line still starts 'BLOCKED by .claude/hooks/<stem>.py: ', the
      last stderr line equals markers.format_hook_block_marker(<stem>) and hook_block_stems(stderr) == [<stem>], where
      <stem> is the hook file's own stem. Plus test_every_block_literal_carries_the_marker (the hook docstrings name rule HB-1 but never spell the literal
      'HOOK-BLOCK v1 hook=', so the count stays exact): in each of the four files the
      count of 'BLOCKED by .claude/hooks/' literals equals the count of 'HOOK-BLOCK v1 hook=' literals.
