schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: telemetry-hook-denial-names
intent: >-
  The feedback loop reads friction labels as its process-layer signal (Decision 221 cl.1), and three of them
  (branch_policy_block, stale_branch_base, scope_creep) have been silent in cloud sessions: a probe on Claude Code 2.1.322
  (2026-11-12) showed that a blocking PreToolUse hook writes no hook record there, so the block survives only in the
  denied tool_result and the reader sees a bare tool_blocked close (rec-4959). This plan makes the parser name the
  blocking hook again. The four blocking hooks that already open their message with 'BLOCKED by .claude/hooks/<stem>.py: '
  also print a new versioned marker line, HOOK-BLOCK v1 hook=<stem>, as their last stderr line; parser version 10 emits
  one hook process_event under each hook-denied tool call, named from the marker, else from the old BLOCKED-by text for
  transcripts written before the marker, else hook:<event>.<tool> (operator decision F3 2026-11-12, "marker plus
  fallback"). The reader needs no change: rules r01-r03 already key on these names.
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-telemetry-hook-denial-names.yaml
phase: >-
  T3.3 prerequisite (friction correctness; operator gate list 2026-11-10 names rec-4605 and rec-4959). Closes no exit
  criterion; T3.3 stays not_started. V3: pre-merge, a live block in the build's own cloud session is parsed by this
  checkout's parser (VP 5); post-merge, a session on merged main shows the hook row. src/turn_capture and .claude/hooks
  are in no Lambda bundle, so nothing deploys; sessions pick the change up from their checkout of main.
scope:
  - file: .claude/hooks/never_on_main.py
    action: Modify
    purpose: >-
      Rule HB-1: the block message gains one last line, exactly 'HOOK-BLOCK v1 hook=never_on_main', after the existing
      lines; the first line, the other lines, exit code 2 and every allow path are unchanged. The module docstring names
      HB-1 and markers.py as the grammar's home. Another workspace's file (2026-10-29 ruling): no open PR touched it at
      planning (2026-11-12); re-check at build.
  - file: .claude/hooks/fresh_branch_base.py
    action: Modify
    purpose: Rule HB-1 on _BLOCK_MESSAGE (last line 'HOOK-BLOCK v1 hook=fresh_branch_base'); nothing else changes.
  - file: .claude/hooks/edit_scope_guard.py
    action: Modify
    purpose: >-
      Rule HB-1 on both block writes (the fail-closed unreadable plan and the out-of-scope path): each ends with the line
      'HOOK-BLOCK v1 hook=edit_scope_guard'; nothing else changes.
  - file: .claude/hooks/scheduled_agent_log_only.py
    action: Modify
    purpose: Rule HB-1 on its one block write (last line 'HOOK-BLOCK v1 hook=scheduled_agent_log_only'); nothing else changes.
  - file: src/turn_capture/markers.py
    action: Modify
    purpose: >-
      The fourth declared grammar (docstring updated): HOOK_BLOCK_PREFIX 'HOOK-BLOCK', HOOK_BLOCK_VERSION 1,
      format_hook_block_marker(stem) ('HOOK-BLOCK v1 hook=<stem>', ValueError when the stem does not fullmatch
      SIGNATURE_PATTERN) and hook_block_stems(text) (the stems of the lines that, after _normalise, fullmatch the
      grammar, in text order). parse_markers is not changed, so a marker inside a Bash output never mints a gate,
      pre-commit or status row. Stdlib only.
    new_imports: []
  - file: src/turn_capture/hook_denials.py
    action: Create
    purpose: >-
      build_hook_denials(ctx, stream, turn, diag, make_row), the build_gate_events pattern, rules HD-1..HD-4 in the
      docstring. HD-1: for each tool_use of the turn whose result record's permissionDecision is a dict with source ==
      'hook', one process_event point at severity error, parented to use.tool_id; external_ref and entity both
      role_ref(result uuid, result block, 'process_event') (an existing role; a tool_result record never also holds a hook
      attachment, so it cannot collide with _hook_row's refs). HD-2: text = clean(text_of(result content)); name
      'hook:' + the LAST stem of markers.hook_block_stems(text) (HB-1 prints the marker last; hook stderr can echo paths it
      does not control, so an earlier marker-shaped line never wins; diag hook_denial_marker; a second, different stem
      counts hook_denial_markers_disagree), else the first match of LEGACY_BLOCK_RE = 'BLOCKED by \.claude/hooks/(<SIGNATURE_PATTERN>)\.py: '
      found with re.search, never anchored to the harness prefix (diag hook_denial_legacy), else
      'hook:<event>.<tool>' where event is permissionDecision.reasonCode's part after 'hook:' and tool is the tool_use
      name, kept only if the whole name fullmatches 'hook:' + SIGNATURE_PATTERN (diag hook_denial_fallback), else
      hook:unknown (diag hook_denial_unknown); a reasonCode that is missing or does not start with 'hook:' also gives
      hook:unknown. HD-3: no row when stream.pre_tool_blocks holds a line before the result's
      line for that tool_use id (an older CLI wrote the exit-2 record, which _hook_row already names). HD-4: reads only the
      result record, its tool_use and stream.pre_tool_blocks (R7). metadata uses existing keys only: hook_event (the
      reasonCode event or None), tool_use_id, marker_version (1 when named by the marker, else None). The result text is
      never stored. At most 80 SLOC.
  - file: src/turn_capture/observations.py
    action: Modify
    purpose: >-
      build_observations calls build_hook_denials for each closed turn right after build_gate_events (one import, one
      line; 402 SLOC today, at most 405 after). outcome_of, hook_name and _hook_row are unchanged.
  - file: src/turn_capture/record_turn.py
    action: Modify
    purpose: PARSER_VERSION 10, PRODUCER_VERSION "turn-capture-10" (one above main's value at build time, see context).
  - file: config/telemetry/parser_versions.yaml
