    Rules, pinned (ids go into docstrings and the envelope line). HB-1: each block write of the four hooks ends with the
    line 'HOOK-BLOCK v1 hook=<the hook file's stem>'. HD-1..HD-4 as in hook_denials.py's scope row. No rule anchors the
    harness prefix ('PreToolUse:<Tool> hook error: [command hook N]: '), reads the 'command hook N' label, or stores the
    result text.
