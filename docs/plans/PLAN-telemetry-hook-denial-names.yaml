    No file crosses 500 SLOC (Decision 128): observations.py at most 405, streams.py untouched (497), test_record_turn.py
    (469) plus 2; ports.yaml lands at 496 effective lines (495 on main 0d51ede0) and the envelope at about 448. If a rebase
