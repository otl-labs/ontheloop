  - file: tests/turn_capture/test_hook_denials.py
    action: Create
    purpose: >-
      Mirror test of hook_denials.py over synthetic trees built with tests/fixtures/turn_capture_corpus helpers (the
      cloud shape copied from the probe: is_error true, toolDenialKind permission-rule, permissionDecision {decision:
      reject, source: hook, reasonType: hook, reasonCode: 'hook:PreToolUse'}, text 'PreToolUse:<Tool> hook error:
      [command hook 3]: BLOCKED by .claude/hooks/<stem>.py: ...' then the marker line, a blank line and 'This hook comes
      from the ontheloop@synced plugin.'). Nodes: test_marker_names_the_denied_tool_call (one hook:edit_scope_guard
      process_event, severity error, parent the tool_call, metadata marker_version 1; the close stays blocked);
      test_legacy_text_names_a_pre_marker_transcript; test_marker_wins_over_legacy_text (marker stem a, text stem b -> a);
      test_fallback_names_event_and_tool (handoff-evidence-gate text -> hook:PreToolUse.Bash, diag hook_denial_fallback;
      a missing reasonCode and one not starting with 'hook:' -> hook:unknown, diag hook_denial_unknown);
      test_attachment_twin_yields_no_second_row (HD-3); test_non_hook_denials_emit_nothing (user_reject, no
      permissionDecision, source 'X y'); test_marker_inside_a_line_is_not_read (echoed mid-line -> legacy/fallback);
      test_bad_stem_falls_through (marker 'hook=bad stem' or a 201-character stem -> next source);
      test_disagreeing_markers_take_the_last_and_count; test_open_turn_emits_no_denial_row (runs record_turn, not
      build_hook_denials, on a non-final pass with no Stop witness: no denial row; then with the witness appended: one
      row, so the observations.py wiring and its closed-turn gate are what is tested).
  - file: tests/turn_capture/test_markers.py
    action: Modify
    purpose: >-
      Three nodes for the new grammar: test_hook_block_marker_round_trips, test_hook_block_marker_refuses_bad_stems,
      test_hook_block_lines_parse_only_as_whole_lines (115 SLOC today).
  - file: tests/hooks/test_hook_block_marker.py
    action: Create
    purpose: >-
      Pins HB-1 against the grammar (advisor trap: no test drives the four hooks' block text today). For each of the five
      block paths (never_on_main on main, fresh_branch_base branching from local main, edit_scope_guard unreadable plan
      and out-of-scope path, scheduled_agent_log_only outside its log prefix), driven the way that hook's own test module
