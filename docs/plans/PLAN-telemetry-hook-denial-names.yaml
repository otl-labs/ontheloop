pre_implementation_checklist:
  - Branch confirmed not on main
  - docs/PROJECT_CONTEXT.md read
  - Only the plan-cited decision sections read
  - All files in scope located and readable
  - Acceptance criteria understood and verifiable
  - docs/plans/approved/telemetry-hook-denial-names.yaml read; its approval run approved
  - main's PARSER_VERSION read (9 expected; otherwise see the version collision context line before any edit)
  - No open PR touches the four hooks (list_pull_requests, files)
execution_steps:
  - >-
    1. Precondition: rebase onto main; confirm PARSER_VERSION 9, 59 golden cases, ports.yaml at or below 499 effective
    lines (495 on main 0d51ede0) and no open PR on the four hooks; if any differs, stop and tell the coordinator.
  - >-
    2. Builders and expected friction values first: tests/fixtures/turn_capture_v10_cases.py with both trees (shapes from
    the probe evidence), and the hand-derived derived_golden_state.yaml and derived_golden_rollups.yaml entries (scope
    rows), written before any parser code.
  - >-
    3. Tests red-first: test_hook_denials.py, the three test_markers.py nodes, test_hook_block_marker.py,
    test_friction_rules_labelled_hooks.py, test_hook_denial_contract_notes.py; run them and confirm red.
  - 4. markers.py grammar, then the four hooks (HB-1), then hook_denials.py and the observations.py call. Run VP 1 until green.
  - >-
    5. Contracts: the four sidecar blocks copied verbatim from docs/plans/approved/telemetry-hook-denial-names.yaml
    ({{DATE}} filled with the build day). Run VP 2 and VP 7's approved_text verify.
  - >-
    6. Version and corpus: PARSER_VERSION 10, PRODUCER_VERSION "turn-capture-10", the sanctioned pin change, the index,
    the registry test's CASES. Only after VP 1-2 pass, regenerate every case's expected_rows from record_turn and review
    the diff by kind: parser_version on every row and new rows only in the two new cases. Set the registry v10 entry
    with the regenerated digest; move both derived golden headers to 10. Run VP 3, VP 4 and VP 6.
  - 7. VP 5 (live block in this session); on failure stop and RCA (Decision 55).
  - >-
    8. Commit Flow (implement skill, git-ops.yaml handoff_sequence and resolves_trailer, in this order; report each
    outcome separately). Readiness: bin/venv-python -m scripts.session.github_readiness, weakening_dispositions equal to
    the detector's output, implementation_declared true, VP 1-7 pass and validate --pre is green. Commit: the
    implementation commit's message carries a Key: value block with Resolves: rec-4959 above the footer. Rebase onto
    origin/main (scripts.session.rebase_resolve RESOLVE CLEAN); if the rebase moved any sidecar before-text or the parser
    number, stop (context). Validator evidence: VP 8 on that rebased, clean HEAD. Postflight evidence:
    /tmp/implementation-retrospective.json, then bin/venv-python -m scripts.session.postflight --evidence
    /tmp/implementation-retrospective.json passes. Push: git push -u origin HEAD as its own call. PR: body holds the
    rules, the Resolves block, the VP compliance table, the four hook diffs and the envelope and ports text; paste the
    hook diffs inline in the thread for Benjamin's final-diff word; subscribe to its activity. Merge only after code
    review PROCEED, green CI and Benjamin's word on the hook diffs: merge_step premerge --slug
    telemetry-hook-denial-names --message-file <the commit body> --expect <approved= from approved_text record>, squash
    with that commit_message and expectedHeadSha, then merge_step readback --sha <merge sha>.
  - >-
    9. After merge: update_rec on rec-4959 (portal, get_rec_write_guidance first): file field
    src/turn_capture/hook_denials.py and a context note that the cloud label was tool_blocked, not unmapped_block (probe
    2026-11-12), fixed by parser v10 (this PR); read it back. File the Low follow-on rec for the
    telemetry_observations.yaml description gap (context; get_rec_write_guidance first) and read it back. Ask the coordinator for a session on merged main for VP 9;
    then VP 10.
  - "10. Report: what was implemented, VP results, merge SHA, rec-4959 status, the follow-on rec id and the read-backs."
rollback: >-
  Revert the squash commit as a forward change (the next parser_version with the v9 rules; a version is never reused).
  The hooks' marker line is harmless to every other reader, so a hook revert is optional.
