schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: telemetry-in-session-source-check
intent: >-
  Telemetry slice 4's real-session leg (rec-4025): inside every captured Claude Code session, compare what the warehouse
  stored for the session's tree with a fresh re-parse of its transcript at the capture cursor, and reconcile the
  session's tokens per model against Claude Code's own cost-state ledger, in code, never by agent judgement (Benjamin,
  2026-10-15). The check runs in the already-detached Stop runner right after a pass: on the first pass after a new
  ledger record (a resume), on a session's 10th sent pass and every 50th after it, after its backoff when a check did
  not complete, and on demand as a CLI. Findings are counts in the
  tree's local diagnostics; each alarm class files or updates one rec under the telemetry_verify source through the
  verification verbs plan's helper; declared residual classes are counted, never filed. It never changes a capture
  pass's outcome and never blocks capture (Decision 210 cl.2: alarm, not gate).
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-telemetry-in-session-source-check.yaml
implementation_declared: true
phase: >-
  rec-4025 carrier (telemetry slice 4, verification): the third of its four plans (golden harness, verification verbs,
  in-session source check, verification monitor), approved by Benjamin's "write the plan" on 2026-10-17
  (cmsg_012XgaFy8VaDQbxP5D8nC958MdLJawKLhVPEQqyXDX82iS) on the approach in
  /mnt/project-files/telemetry-slice4/step6b-presentation.md, which carries his 2026-10-15 rulings
  (cmsg_012XgaFy8VaDQbxP5D8nC9585DQ3zJCYVFZ3Y5QULniDZ3: the SessionEnd re-parse check moves into slice 4; tokens
  reconcile against Claude Code's usage summary per model, compared in code). Related tier items, named in context
  only: T3.20 and T2.36; this plan closes no criterion, and rec-4025 stays open as the slice's carrier.
closes_criteria: []
scope:
- file: scripts/telemetry_capture/verify_due.py
  action: Create
  purpose: >-
    The due rule, importing only the standard library and src.turn_capture.transcript (so it can never break a capture
    pass's imports): verify_due(cursor, root_bytes, verify_state, *, event, final, outcome, now) per execution_steps[1];
    producer_fingerprint(), computed once per process: the sha256 over the relative path and bytes of each of
    src/turn_capture/*.py, src/telemetry/timestamps.py and src/telemetry/identity.py (the code that emits a tree's rows
    and derives its keys) and over the bytes of the four ops_tables.telemetry_* blocks of
    config/lambda/ducklake/field_semantics.yaml (the comparison's column roles; a stdlib line scan of the generated file,
    each block running from its two-space key line to the next two-space or top-level key, skipping every
    accepted_values list, which is registry-sourced and never a comparison input, so neither an unrelated ops-table
    change nor a new rec source moves it), read by path from the checkout that holds src.turn_capture.transcript; and the constants
    VERIFY_FIRST_SENT_PASS = 10, VERIFY_EVERY_SENT_PASSES = 50, MAX_CHECKS_PER_TREE_PER_DAY = 3, VERIFY_RETRY_S = 1800
    (doubling to at most 21,600 after each check that did not complete) and VERIFY_GUARD_S = 1,500. Pure apart from
    producer_fingerprint's file reads.
- file: scripts/telemetry_capture/cursor_tree.py
  action: Create
  purpose: >-
    CursorTree(tree, cursor) is a TranscriptTree view of the tree as the cursor consumed it: read(key) returns the
    first cursor.lines_consumed[key] lines of that stream (absent key: no stream), agent_ids() only the streams the
    cursor holds, and a sidecar reads as the cursor pinned it (pinned absent reads absent; pinned present returns the
    current bytes, and a sha that no longer matches raises SidecarMutated, the skip token sidecar_mutated).
    expected_rows(view, cursor, *, session_final=None) is the full emission set at the cursor: record_turn(view,
    dataclasses.replace(cursor, parser_version=PARSER_VERSION + 1), project_ref=cursor.project_ref,
    session_final=cursor.finalized when session_final is None), which takes record_turn's documented parser-bump path
    (cursor.py: a mismatch resets everything but the four pins and the finalization cuts, so the prior set is empty and
    every row of every cut is rebuilt); a reset cursor at the current version would return only the rows after the
    cuts. call_refs(message_ids) maps message ids to model_call external_refs with src.turn_capture.refs.model_call_ref.
    Imports the standard library and src.turn_capture only.
- file: scripts/telemetry_capture/verify.py
  action: Create
  purpose: >-
    The check. run_verify(transcript_path, session_id, *, trigger, scheduling_record, reader, portal, budget,
    alarms=True) runs one check in the order of execution_steps[2], holding the tree's lock only to load the cursor,
    to re-check that no pass ran while it worked and for its final writes; it records reader_calls, response_bytes,
    elapsed_s and each class's denominator, hands alarm classes to scripts.telemetry_verify.alarms.raise_alarms and
    writes its diagnostics record and the verify state under the lock. rows.read_tree reaches the reader through this
    module's wrapper of named(), which counts session_tree_rows calls (413 retries included), raises the module's own
    TreeCallCap before a call beyond MAX_TREE_PAGES, and records each page's total_rows, roots_in_tree and response
    bytes, so a moving total is read from those records, never from read_tree's exception class. A reader call starts
    only while at least 180 s of the budget remain. Every other exception is caught and becomes the token
    verify_error:<ExceptionClass>; nothing is printed on the detached path, and all logging is disabled for the whole
    check (logging.disable), because the reader client's and the writer transport's warnings can carry an ARN or a
    Function URL host.
- file: scripts/telemetry_capture/runner.py
  action: Modify
  purpose: >-
    After a non-final pass whose outcome is sent or no_rows and whose cursor was persisted, still under the pass lock:
    on a sent outcome, advance sent_passes and record verify_due.producer_fingerprint() (set producer_fingerprint when
    absent; set the sticky producer_changed when it differs); add verify_due (verify_due.verify_due over the persisted
    cursor and the root snapshot) to the pass record; when due, increment today's checks_by_day and set scheduled_at =
    now and next_attempt_at = now + VERIFY_GUARD_S (the check's 600 s budget, one reader call's worst case of three
    180 s attempts with backoff, and a margin), so later passes do not re-schedule while the check runs and every
    scheduled check counts against the daily cap. The runner owns sent_passes, checks_by_day, producer_fingerprint,
    producer_changed, scheduled_at and this scheduling next_attempt_at; the check owns the other fields (state.py
    row). PassResult and
    every pass outcome are otherwise unchanged; an exception in this step is recorded as verify_due_error and the
    outcome stands. verify_due.py is the only new import.
- file: scripts/telemetry_capture/__main__.py
  action: Modify
  purpose: >-
    run: after run_pass returns a result whose record carries verify_due true, call verify.run_verify in the same
    already-detached process (trigger detached; imported inside the guarded block, so an import failure changes
    nothing), with its own Budget of VERIFY_BUDGET_S = 600; still silent and exit 0 on every path. New command verify
    --tree [--session-id] [--no-alarms] [--assert-zero <class>] (trigger operator): prints one VERIFY line of counts
    and fixed tokens (status=<completed or skip token> compare_skipped=<none, root_not_due, root_absent,
    tree_too_large, tree_collision or producer_modified> rows_equal=<n> missing_in_store=<n> unexpected_in_store=<n>
    column_mismatch=<n> key_mismatch=<n> duplicate_ref_rows=<n> race_duplicate_rows=<n> r7_boundary_divergence=<n>
    other_generation_rows=<n> other_producer_rows=<n> root_checked=<n>
    ledger_records=<n> stored_ledger_tested=<n> root_calls=<n> sync_spawns=<n> pinned_absent=<n> reader_calls=<n>
    elapsed_s=<n> alarms=<classes or none>), never a row value. Exit 0 when the check completed with no alarm class; 1
    when it completed with an alarm class, or with --assert-zero when that class is above zero; 2 when it did not
    complete (any skip or error token). --assert-zero <class> exits 0 only after a completed check in which that class
    is zero and its own denominator is positive: compare classes, rows_equal of at least 1 with
    r7_boundary_divergence zero (a tree whose compare classes were declared away is never green); root_absent,
    root_checked
    of at least 1 (the expected root telemetry_sessions row exists and the root was looked up or read from the cache);
    ledger classes, at least one reconciled cost-state record; stored-ledger classes, at least one tested model;
    nonfinal_root_call, root_calls (root model calls); spawn_usage_mismatch, sync_spawns (sync spawns compared);
    sidecar_pinned_absent_present, pinned_absent (sidecars the cursor pinned absent); verify_incomplete, the completed
    check itself. A completed check with a zero denominator exits 2, so neither a check that did not run nor a leg
    that had no input is ever green.
- file: scripts/telemetry_capture/state.py
  action: Modify
  purpose: >-
    CaptureState.verify_state() and save_verify_state(state_dict): one JSON file beside the cursor holding
    sent_passes, checks_by_day (UTC day -> count), producer_fingerprint, producer_changed, scheduled_at and the
    scheduling next_attempt_at, owned by the runner; and last_ledger_line (the root file line number of the newest
    cost-state record a completed check covered) and held_ledger_line (the newest one it checked, a pending record
    included), settled_at (the scheduled_at of the newest detached check that completed or
    ended on a per-tree condition; a scheduled_at newer than it is a check that has not settled, busy and a dropped
    final write included), root_session_id (the cached lookup), retry_s, incomplete_streak (consecutive non-benign
    non-completed detached checks) and alarm_at (class -> epoch seconds of the last portal episode call), owned by the
    check, which also sets next_attempt_at after a check that did not complete. An operator check (trigger operator,
    with or without --no-alarms) writes only its diagnostics record, root_session_id and, when it filed, alarm_at;
    never last_ledger_line, held_ledger_line, settled_at, retry_s, incomplete_streak or next_attempt_at, so an operator or acceptance
    run never consumes a due detached check. merge_verify_state(current, updates, owner) applies only the owner's
    fields to a freshly read state. A missing or malformed file reads as the empty state; written with the module's
    atomic _write and only by a holder of the tree lock.
- file: scripts/telemetry_verify/compare.py
  action: Create
  purpose: >-
    compare_tree(expected_batches, stored_by_table, *, producer, parser_version, semantics=None) returns per-table
    counts over rows keyed by (table, producer, external_ref), comparing only the given producer's rows (claude_code;
    parser_version is scoped per producer): rows_equal; missing_in_store (alarm: an expected row with no stored row at
    parser_version); unexpected_in_store (alarm: a stored row at parser_version the re-parse does not produce);
    column_mismatch (alarm, counted per column name); key_mismatch (alarm: a stored derived key that differs from
    src.telemetry.identity's derivation, execution_steps[3]); other_generation_rows (that producer's stored rows at
    another parser_version) and other_producer_rows (any other producer's stored rows), both counted, never compared.
    A key held by more than one stored row at parser_version (the writer's grain is producer, event_id and
    parser_version) counts every row beyond the first: duplicate_ref_rows (alarm) when their event_ids differ, one
    event stored under two identities; race_duplicate_rows (declared, rec-4063's grain monitor, the Decision 210 cl.2
    concurrent-append race) when they share one event_id. The compared survivor is the row whose event_id equals the
    expected derivation, else the one with the smallest event_id, so no count depends on read order. Pure; no I/O.
- file: scripts/telemetry_verify/stored_ledger.py
  action: Create
  purpose: >-
    The stored-row ledger leg (the producer fixes thread's silent-failure check 5, relayed 2026-10-17):
    reconcile(records, stored_model_calls, transcript_classes) takes, per cost-state record, its cut index, its
    modelUsage and, per model, the prefix's call refs split four ways by verify.py (this module never imports the
    producer): selected (refs of the calls the ledger leg's own prefix walk counts, ledger.prefix_calls, that the
    expected emission at the cursor holds), pending (refs the producer defers at the cursor but emits once the stream
    closes: in a session_final expected emission and not the cursor's), inherited (calls on inherited fork lines,
    src.turn_capture.transcript.inherited_lines, which the producer never stores) and unemitted (every other prefix
    call: neither emission holds it); and transcript_classes, the ledger leg's class per (cut_index, model) from
    ledger.reconcile_ledger over the same view. It sums the stored model_call rows of the selected refs at the
    cursor's parser_version only, one row per ref (the compare's survivor; another generation under the same refs is
    counted other_generation, never summed), per model as the prefix walk groups its calls (ledger.model_key:
    requestedModel, else message.model), never by the stored requested_model, whose value is the compare's column
    check. A model with a selected ref whose stored row the compare found missing or column-mismatched is
    stored_ledger_not_compared (compare_defect), because the compare's alarm already names that cause. A model with an
    inherited call is
    stored_ledger_not_compared (inherited_prefix); with a pending call, stored_ledger_not_compared (pending_emission),
    and a completed check holds that record (held_ledger_line, execution_steps[1]), so it is checked again by the
    next sampled check or the next new cost-state record, never on every pass; with an unemitted call, the alarm stored_ledger_call_unemitted (the ledger counts a
    call the producer never emits). Otherwise by its transcript class. ledger_exact and
    ledger_output_residual_nonfinal compare exactly: stored_ledger_exact; stored_ledger_output_residual_final_false
    (declared, rec-4354: output short and at least one selected row has usage_final false for that model); or the
    alarm classes stored_ledger_input_class_mismatch, stored_ledger_output_residual_unexplained (output short, every
    selected row final) and stored_ledger_output_excess. A bounded class (ledger_bounded_compaction,
    ledger_bounded_background, ledger_bounded_auxiliary: a compaction call has no assistant record, so no stored row,
    and a straddling background child is outside the prefix walk) compares as a bound: stored_ledger_bounded (declared)
    when every class is at or below the ledger, else the alarm stored_ledger_bound_exceeded. ledger_auxiliary_only,
    ledger_unavailable and every ledger alarm class are counted as stored_ledger_not_compared, because the ledger leg's
    own alarm names that cause and one cause never files twice. A model with any untested selected row reads only
    stored_ledger_untested, never a declared or alarm stored-ledger class. stored_ledger_untested counts selected rows
    written before parser_version 4 or whose usage_final is null (a v4 row's requested_model is null whenever its owner record
    carries no requestedModel, so it never marks a row untested); a model is tested only when
    compared from rows none of which is untested, and is never reported exact or bounded from untested rows. A
    cost-state record on an inherited fork line is counted as inherited and not reconciled. Pure; no I/O.
- file: scripts/telemetry_verify/ledger.py
  action: Modify
  purpose: >-
    prefix_calls(tree, cut_line) returns, per model key, the (stream key, file line number, message id) of every
    response the cost-state prefix at cut_line (the position in the parsed stream, as Finding.cut_line) counts, from
    the same walk as _prefix (one shared helper, so the two can never disagree), and file_line(tree, cut_line) maps a
    parsed root position to its file line number (read_lines' RawLine.line), so the stored-row leg selects exactly the
    calls the ledger leg summed, and every line the check stores or tests against inherited_lines is a file line
    number. reconcile_ledger and its findings are unchanged.
- file: scripts/telemetry_verify/__init__.py
  action: Modify
  purpose: Facade re-exports compare and stored_ledger's public surface.
- file: docs/contracts/ports.yaml
  action: Modify
  purpose: >-
    PC-01's description names scripts/telemetry_capture/verify.py as a further function_url client (the reader's named
