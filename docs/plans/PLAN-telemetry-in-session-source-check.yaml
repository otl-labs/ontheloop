pre_implementation_checklist:
- Branch confirmed not on main and rebased on origin/main; VP step 1 passes
- docs/PROJECT_CONTEXT.md read
- Decisions 210 (cl.2), 84 (I-3), 61 and 215 (cl.4 and its reversal conditions) read, only the cited clauses
- scripts/telemetry_capture runner, state and __main__, src/turn_capture/record_turn.py and cursor.py, and the golden harness and verification verbs modules read
- All files in scope located and readable
- Acceptance criteria understood and verifiable
execution_steps:
- >-
  Confirm VP step 1. Read scripts/telemetry_capture/runner.py, state.py, __main__.py and __init__.py,
  src/turn_capture/record_turn.py (the emission-set docstring and the parser-bump path), cursor.py (reset keeps pins
  and finalization cuts) and transcript.py (read_lines, inherited_lines), scripts/telemetry_verify (ledger, shape, rows,
  alarms, and the declared-class vocabulary), src/telemetry/identity.py (KEY_PLANS, derive_entity_key,
  derive_event_id), config/lambda/ducklake/field_semantics.yaml's column roles and scripts/rec_episode.py.
- >-
  verify_due.py and its tests (VP step 4), in this order: false unless event is Stop or StopFailure, final is false
  and the outcome is sent or no_rows with the cursor persisted; false before next_attempt_at or when checks_by_day for
  today has reached MAX_CHECKS_PER_TREE_PER_DAY; true when scheduled_at is newer than settled_at (a scheduled check
  that has not settled); true when the persisted root holds a cost-state record (a root line whose type is cost-state,
  read with transcript.read_lines, inside lines_consumed["root"], not inherited) at a file line number above both
  last_ledger_line and held_ledger_line;
  true when the outcome is sent and this pass advanced sent_passes to VERIFY_FIRST_SENT_PASS or to a positive multiple
  of VERIFY_EVERY_SENT_PASSES; else false. When due, the runner increments today's checks_by_day and sets scheduled_at
  = now and next_attempt_at = now + VERIFY_GUARD_S. Every ledger line the state holds is a file line number (verify.py
  maps each Finding.cut_line through ledger.file_line before storing it or testing it against inherited_lines). A
  completed detached check sets last_ledger_line to the file line of the newest cost-state record it covered, stopping
  before the first record with a pending model, and held_ledger_line to the newest record it checked (so a held record
  never re-triggers the cost-state rule; the next sampled check or the next new record re-reads every record above
  last_ledger_line), sets settled_at to its
  scheduled_at, clears next_attempt_at, and resets retry_s and incomplete_streak. A detached check that did not
  complete sets next_attempt_at = now + retry_s and doubles retry_s up to 21,600; it settles (sets settled_at) only
  when its token is a per-tree condition the next due trigger re-tests locally (no_cursor, cursor_tail_mismatch,
  halted, parser_version_skip, non_real_project), so every other non-completion, busy and a dropped final write
  included, is retried after its backoff; and a non-benign token increments incomplete_streak. Benign tokens: busy
  (which writes nothing), tree_moved, superseded_by_pass, those five per-tree conditions and no_credentials (the
  credential resolution transport.make_client performs, a boto3 Session under resolve_aws_profile() whose
  get_credentials() is None or raises, run before the first reader call). Every other token (sidecar_mutated,
  budget_exhausted and each verify_error:<class>) is non-benign. Then the state file and the runner hook-up's tests (VP
  steps 2 and 5), writing the runner hook-up itself last (constraints[7]).
- >-
  CursorTree, expected_rows and run_verify (scope rows), in this order. (1) Acquire the tree lock (wait at most 30 s;
  busy: return the token busy, writing nothing). Under it: read the verify state; load the cursor with
  state.load_cursor(root bytes), the runner's own tail check (no_cursor, cursor_tail_mismatch, halted,
  parser_version_skip, non_real_project are skip tokens); confirm the latest diagnostics record is the scheduling pass
  record (same event, at and outcome; else superseded_by_pass); release. (2) Unlocked (the view reads only the lines
  the loaded cursor consumed, and the sidecar pins are checked on read): build the expected rows, the model_call refs
  of the session_final emission, and for each cost-state record in the view the prefix's calls (ledger.prefix_calls,
  mapped with cursor_tree.call_refs) split into selected, pending, inherited and unemitted refs (scope row
  stored_ledger.py); run the transcript legs, ledger.reconcile_ledger and shape.check_shape over the view (closes
  taken from the expected rows' agent close outcomes; the sidecar check over the real tree with the cursor's pins), reclassifying a ledger alarm on a model with an inherited prefix
  call as ledger_fork_unmeasured. Then compare_skipped, first match wins: producer_modified (the verify state's
  producer_changed is set or a recorded producer_fingerprint differs from this process's; an absent fingerprint, before
  the tree's first sent pass under this build, is never producer_modified); tree_too_large (more than
  MAX_TREE_PAGES x 2,000 expected rows, judged before any reader call); then credentials (no_credentials) and the root
  session_id (cached, else telemetry_root_sessions over the pin's UTC day, matched on entity_ref ==
  cursor.root_session_ref); none found while the expected set holds no root telemetry_sessions row (the root's first
  turn is still open, its children's rows already stored) is root_not_due with root_checked 0, benign; none found while
  that row is expected is root_absent, the alarm class of that name, root_checked 1; in both the stored tree is not
  read, so one cause never also reads as missing_in_store; then the stored tree through rows.read_tree and the
  wrapper: page 1's total_rows above MAX_TREE_PAGES x 2,000 or a TreeCallCap is tree_too_large, roots_in_tree above 1
  is tree_collision, and a page whose recorded total_rows differs from page 1's is the skip tree_moved. (3)
  Re-acquire (30 s): the cursor and the latest diagnostics record are unchanged, else tree_moved; release. (4)
  Unlocked: unless compare_skipped is set, compare_tree (producer claude_code); when the expected CaptureResult's
  diagnostics.get("notice_after_boundary", 0) is above zero, its column_mismatch, missing_in_store and
  unexpected_in_store counts sum into r7_boundary_divergence (constraints[3]); then stored_ledger.reconcile over the
  stored model_call rows with the per-record ref sets, the ledger leg's classes and the per-ref compare findings (so
  compare_defect keeps those models stored_ledger_not_compared); then raise_alarms over every alarm
  class (a detached check, or an operator check without --no-alarms). (5) Re-acquire (30 s): append one diagnostics
  record (event verify, trigger, status, compare_skipped, counts, denominators, reader_calls, response_bytes,
  elapsed_s, alarm classes), re-read the verify state and merge only the check's fields (merge_verify_state, owner
  check; an operator check writes only what the state.py row allows), then save; if the lock stays busy the record
  and the check's fields are dropped (the alarms already landed; the check stays unsettled, so it is retried after
  next_attempt_at, and the runner's checks_by_day already counted the attempt, so the daily cap holds). Every step
  stops at the budget with the token budget_exhausted. A detached check that ends at any step with a non-benign token
  finishes the same way: unlocked, when the streak it brings (the incomplete_streak read in step (1), plus one)
  reaches VERIFY_INCOMPLETE_STREAK, raise_alarms with the class verify_incomplete (the helper's per-class rate limit
  bounds repeats while the streak stays at or above it); then step (5)'s locked write of its record and fields. A
  completed check is never verify_incomplete, whatever compare_skipped says.
- >-
  scripts/telemetry_verify/compare.py and tests/telemetry_verify/test_compare.py (VP step 3). Column rules, declared in
  the module docstring and pinned by test_column_rules_are_declared_and_minimal, and nothing else: the compared value
  columns are compared_columns(table) (src.common.ducklake_event_reads, the reader's own Decision 207 set) restricted to
  role input in field_semantics.yaml; the derived columns are checked as keys instead, event_id with
  derive_event_id(table, tenant_id, project_id, external_ref, event_timestamp) and every KEY_PLANS[table] column with
  derive_entity_key over the EXPECTED row's ref field for it (session_ref, observation_ref, parent_session_ref,
  parent_observation_ref or entity_ref, which are not stored columns) and the stored row's session_started_at, both
  from the stored row's own tenant_id and project_id, which are not themselves compared (the writer resolves them); created_timestamp is never compared; a
  column the producer row omits compares as NULL; timestamps compare as UTC instants at millisecond precision;
  transcripts content compares by content_sha256 and content_bytes (the tree verb never returns content or
  content_uri); JSON-typed columns compare as parsed values. The test asserts a one-millisecond difference, a one-byte
  content difference and a non-null stored value against an omitted producer column are each reported. Only rows of
  the given producer are compared; another producer's rows are counted in other_producer_rows.
  test_a_key_held_by_two_stored_rows_is_classified: two stored rows at one ref with differing event_ids count one
  duplicate_ref_rows, two with one event_id count one race_duplicate_rows, and the survivor rule makes every count
  independent of row order. Then
  scripts/telemetry_verify/stored_ledger.py and its tests (VP step 3).
- >-
  The alarm hand-off (VP step 6) to the verification verbs plan's raise_alarms: scope the root session ref, alarm_at the
  verify state's map, file scripts/telemetry_capture/verify.py, and acceptance_for(class) the static command
  AWS_PROFILE=agent_platform bin/venv-python -m scripts.telemetry_capture verify --tree "$(ls -t
  ~/.claude/projects/*/*.jsonl | head -1)" --no-alarms --assert-zero <class> (exit 0 only after a completed check on a
  fresh session's tree with that class at zero), which test_acceptance_is_the_verify_command_for_the_class lints with
  lint_acceptance_command(require_decidable=True). The declared classes (ledger, shape and stored-ledger declared
  entries, stored_ledger_bounded among them, plus race_duplicate_rows, ledger_fork_unmeasured and
  r7_boundary_divergence) go in
  raise_alarms' declared argument, which test_declared_classes_are_passed_as_declared pins class by class; the returned AlarmOutcome's counts go into the diagnostics record. Episodes close through normal triage once the cause is fixed; this check never closes one.
- >-
  tests/telemetry_capture/test_verify_due.py, test_cursor_tree.py and test_verify.py: the nodes VP steps 4, 5, 6 and 9
  name, including test_expected_rows_are_the_full_emission_set_after_finalization (duckdb-free: a corpus tree finalized
  at half its root lines then resumed; the expected set equals the union of the incremental record_turn emissions
  across those passes), test_an_unsettled_check_is_retried_after_its_backoff (a sample-triggered check that skipped,
  found the lock busy, or lost its final write is due again on the first pass past next_attempt_at; a per-tree skip
  is not), test_producer_fingerprint_covers_the_emitting_code (editing a fingerprinted module or a telemetry table's
  field_semantics block changes it; an unrelated file or a non-telemetry block does not), test_a_pass_during_the_read_is_tree_moved_never_a_finding, test_state_fields_are_merged_by_owner (a Stop
  pass advancing sent_passes while the check reads keeps its count), test_moving_and_tail_mismatched_trees_skip,
  test_an_r7_boundary_divergence_is_declared_never_filed (alarms on, over fakes: an expected emission whose
  CaptureResult diagnostics hold notice_after_boundary 1 turns a planted column_mismatch into r7_boundary_divergence
  with no portal call and --assert-zero column_mismatch exiting 2, while a planted duplicate_ref_rows still files;
  the same plant with the key absent reads column_mismatch and files), test_compare_skips_keep_the_transcript_legs (root_not_due, root_absent, tree_too_large judged from the expected rows
  with no reader call, tree_collision and producer_modified each complete with their compare_skipped token, the ledger and
  shape counts present, no compare or stored-ledger count, root_absent filed as its own class and no missing_in_store),
  test_tree_reads_stop_at_the_call_cap (a reader answering 413 until the page halves past the cap stops at
  MAX_TREE_PAGES calls with tree_too_large), test_no_credentials_is_benign,
  test_an_operator_check_never_writes_scheduling_fields (a --no-alarms check after a due detached check leaves
  last_ledger_line, settled_at and next_attempt_at as they were), test_a_persistent_non_completion_files_one_incomplete_alarm
  (three non-benign non-completions inside one UTC day, the third ending at step (1) or (2), file exactly one
  verify_incomplete alarm; a benign token neither counts nor resets),
  test_a_pending_record_does_not_retrigger_every_pass (after a completed check that held a pending record, the
  next passes are not due until a sample or a new record), test_malformed_lines_keep_one_index_space (malformed root
  lines before a fork boundary and before a cost-state record: the inherited split, last_ledger_line and verify_due
  agree in file line numbers, and the pass after a completed check is not due), test_writes_happen_only_under_the_lock,
  test_a_newer_pass_record_skips_the_check (a stopped pass that sent some requests after the scheduling pass) and
  test_a_failing_check_is_recorded_silent_and_backs_off.
- >-
  tests/telemetry/test_in_session_verify_chain.py over the golden chain, parametrized per tree, each parameter in a
  fresh open_catalog() (the chain registers one project, and most golden trees share one root ref and pin):
  test_verify_finds_no_compare_alarm_on_any_golden_tree_at_any_point (every tree from case_names() and every
  verification tree; at every root line count from fork_boundary to the end, at the final pass, and finalized at half
  then resumed to the end, the chain built with store_held_back_as_blob: where the expected set holds the root
  telemetry_sessions row, zero compare classes and rows_equal equal to the stored row count at PARSER_VERSION, and
  elsewhere compare_skipped=root_not_due; run with alarms off, so no portal call at any point);
  test_final_pass_ledger_and_shape_classes_match_the_raw_tree (at the final pass of every tree, the check's ledger and
  shape class counts equal reconcile_ledger's and check_shape's over the raw tree, the raw-tree check_shape given the
  same closes the check derived, and no stored-ledger alarm class is set); test_planted_store_defects_are_reported_by_class (after a full
  capture, each of four direct catalog edits: delete one observation row, change one compared column of a sessions
  row, insert one extra transcripts row at PARSER_VERSION, change one stored observation_id; each yields exactly its
  class); test_ledger_classes_on_the_resume_trap_and_a_planted_input_mismatch (the resume trap, resume_with_cost_state
  or its corpus successor resume_segment_closes, yields its declared classes, no stored-ledger alarm and no portal
  call; the stored-ledger assertion follows the checkout's PARSER_VERSION, never a catalog edit, which would read as
  column_mismatch: at 3 every model is stored_ledger_untested or stored_ledger_not_compared, at 4 or later every model
  reads a declared stored-ledger class or stored_ledger_not_compared and claude-sub-1 a tested class; with the
  cost-state record's inputTokens raised by 1, one portal file call whose classes include
  ledger_input_class_mismatch). Each parameter stays well inside the full tier's 120 s timeout; report
  the slowest.
- Execute VP steps 1-12; loop until each passes.
- Code review (the code-review skill in a fresh context); fix every blocking finding.
- >-
  Closure (implement skill Commit Flows; docs/contracts/git-ops.yaml), each outcome reported separately: the readiness
  check; set implementation_declared true; rebase on origin/main and re-run VP step 1; VP step 13 on the committed,
  clean tree, then scripts.checks.validation_result --verify-head; the postflight evidence file and
  scripts.session.postflight --evidence; push; PR; CI green on the head. No Resolves trailer (rec-4025 stays open).
  Merge on code review PROCEED and green CI under the standing rule (no deploy, IAM, spend, contract field or Decision
  text). After the merge, update rec-4025's context through the portal (naming PLAN-telemetry-in-session-source-check,
  the merge SHA and VP step 10's two lines), then VP step 14.
- >-
  Report: what was implemented, each VP step's output (step 10's lines verbatim), the slowest chain parameter, the
  implementing session's measured reader_calls per check, every alarm the real tree raised and the rec it was filed
  as, and the disposition of any rec filed during implementation.
rollback: >-
  Revert the squash commit: the runner stops recording verify_due and no check runs; the verify state file is ignored
  by the reverted code. Recs already filed stay open for triage; no stored row is touched in either direction.
