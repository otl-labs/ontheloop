constraints:
- >-
  Never a gate (Decision 210 cl.2). The check runs after the pass returned; the pass's outcome, cursor and diagnostics
  record are fixed before verify_due is read, and a failing check is a counted token with a backoff. The tree lock is
  held only for local work (reading the verify state, loading the cursor, confirming the scheduling pass record is
  still the latest) and for the final writes; the expected rows are built and the stored tree is paged with the lock
  released, and the check then
  re-acquires it to confirm that neither the cursor nor the latest pass record moved (else tree_moved, never a
  finding). A Stop pass that finds the lock held returns busy as today and the next pass catches up. No check runs on
  a final pass (SessionEnd runs in-process under its own budget).
- >-
  Counts only (Decision 101): diagnostics, CLI output and rec text carry counts, class names, column names, refs and
  parser_version, never a row value or transcript content; all logging is disabled during a check. No
  verification row is ever written to a telemetry table (the friction rules would count it as agent friction; Decision
  95).
- >-
  Imports: scripts/telemetry_verify keeps the allow-list as the golden harness and verification verbs plans left it,
  extended by exactly src.telemetry.identity (compare.py); never duckdb, src.common.ducklake_event_read_sql,
  src.turn_capture.streams, src.turn_capture.observations or tests. scripts/telemetry_capture/cursor_tree.py imports
  the standard library and src.turn_capture only; verify.py may import cursor_tree, src.common.ducklake_reader_client
  (the reader) and scripts.telemetry_verify; verify_due.py only the standard library and src.turn_capture.transcript;
  never
  src.telemetry.append (.importlinter scripts-never-import-telemetry-append).
- >-
  Reads only through named verbs (Decision 84 I-3): telemetry_root_sessions once per tree (the session_id is cached),
  then session_tree_rows pages; no telemetry-writer call; recs only through the portal (rec_episode's find_rec reads
  through the portal's own reader path). The expected rows are the CURRENT producer's full emission set at the cursor
  (record_turn's parser-bump path over the cursor view), so the comparison holds by the producer's
  incremental-equals-full property (record_turn.py's R7 docstring and its line-cut test). The one R7 exception the
  cut-retaining re-parse does not reproduce (BN-1's, added at parser_version 4: a root background child completed at
  a resume boundary that keeps writing keeps its rows as first emitted, and a resume records no finalization cut) is
  declared: when the expected emission's DG-1 counter notice_after_boundary is above zero (a counter the
  parser_version 3 CaptureResult lacks reads as zero), the tree's compare still runs, its column_mismatch,
  missing_in_store and unexpected_in_store counts sum into the declared class r7_boundary_divergence (owner: the
  producer fixes plan's R7 exception) and are never filed, while duplicate_ref_rows and key_mismatch (which keeping a
  first-emitted row cannot produce) stay filed and the per-class counts stay in the diagnostics record. Residuals the
  coverage follow-on rec names: the rule covers the whole tree for the rest of its life, so it can hide a real store
  defect of those three classes there; and before the notice reaches the cursor view, or when none ever arrives, the
  divergence files as compare alarms, which errs toward filing. A tree whose cursor carries
  another parser_version is skipped and counted, never compared; a tree whose project_ref carries a reserved prefix
  (synthetic:, drill:; ops_projects.yaml prefix_map) is skipped as non_real_project, because telemetry_root_sessions
  reads real-purpose projects only.
- >-
  Reader budget (Decision 215 cl.4 and its reader-invocations-doubled reversal condition, a fleet count of daily
  reader invocations against a 7-day baseline): a check costs one session_tree_rows call per 2,000 stored rows (413
  retries included, at most MAX_TREE_PAGES = 10 calls; a larger tree is compare_skipped tree_too_large, judged from
  the expected rows before any call where it can be), plus one telemetry_root_sessions call per tree's lifetime and one
  portal read per alarm class filed; at most MAX_CHECKS_PER_TREE_PER_DAY checks run per tree per day, so a captured
  session adds at most 1 + 3 x 10 reader invocations a day. Measured on 2026-10-17 over a one-day CC-web coordinator
  session (3,640 root lines, 22 sub-agents): 11,729 emitted rows, six calls a check, so its resume check and its
  10th-pass sample cost 1 + 2 x 6 = 13 invocations that day against the six per session of cl.4; a short session is
  one or two calls a check. If reader-invocations-doubled trips, MAX_CHECKS_PER_TREE_PER_DAY moves first (to 1, which
  keeps the resume-triggered check), then VERIFY_EVERY_SENT_PASSES grows, then MAX_TREE_PAGES shrinks. The per-tree
  caps are the bound; no fleet tripwire is claimed, because nothing outside the reader's own log_invocation lines
  counts fleet invocations. Egress (Decision 88): each page re-runs the verb's ordered union, so each verify record
  also carries response_bytes. Residuals, which the verification monitor plan's coverage follow-on rec names: a tree
  above 20,000 rows (routine for multi-day, resume-heavy sessions) and a producer_modified session get the transcript
  ledger and shape legs but no compare or stored-ledger leg; a session whose checks always end on a benign token that
  never settles (tree_moved, superseded_by_pass, no_credentials) stays unverified with no signal beyond its local
  diagnostics. Each verify record carries reader_calls and elapsed_s, and the closure report states the
  implementing session's measured calls.
- >-
  Defaults decided with notice: VERIFY_FIRST_SENT_PASS = 10 and VERIFY_EVERY_SENT_PASSES = 50 (so a session that never
  resumes is still checked from its 10th turn); MAX_CHECKS_PER_TREE_PER_DAY = 3; MAX_TREE_PAGES = 10;
  VERIFY_INCOMPLETE_STREAK = 3 (one day of a session's capped checks, retries included, reaches it); VERIFY_RETRY_S =
  1,800 doubling to 21,600; VERIFY_BUDGET_S = 600 (the check's own budget; each reader call keeps the client's 180 s
  timeout and three attempts, so VERIFY_GUARD_S = 1,500 covers the budget plus one call's worst case); the helper's
  ALARM_MIN_INTERVAL_S = 21,600 and priority High. Concurrent sessions can each file the first rec of a class before
  either sees the other's; such a duplicate is closed as a duplicate on triage, never by this check. A fleet-wide
  defect updates its class's one open rec at most four times a day per session (the rate limit is per tree);
  accepted, because that is when the updates should land.
- >-
  Ledger and shape: the golden harness's ledger and shape modules run over the cursor view as they are, except the
  sidecar_pinned_absent_present check, which runs over the real tree with the cursor's pins (the cursor view hides
  exactly the sidecars it looks for). Their declared classes (ledger_output_residual_nonfinal, nonfinal_call and the
  rest, each with its owner rec) are counted and never filed; their alarm classes are filed. The stored-row ledger leg
  is this plan's, not the verification monitor's, because the cost-state ledger exists only in the transcript; it reads
  the column additions plan's requested_model and usage_final when present and counts rows without them as untested.
  A forked session's prefix holds fork-copied calls the producer never stores: the stored leg reads those models as
  not compared, and a ledger alarm class on such a model is counted as ledger_fork_unmeasured (declared) and not
  filed, because how Claude Code's cost-state counts a fork is unmeasured; the coverage follow-on rec names it.
  Closing a ledger, stored-ledger or spawn class needs its denominator: the rec text says its acceptance needs a
  session that has resumed (ledger and stored-ledger classes) or spawned a sync sub-agent (spawn_usage_mismatch), and
  exit 2 elsewhere means not yet probeable, never green.
- >-
  Development safety: the runner hook-up (scope rows runner.py and __main__.py's run path) is the last code step,
  after VP steps 2-9 pass, because the implementing session's own hooks run this branch's code; this plan changes no
  fingerprinted file, so its implementing session's own tree compares (VP step 10). A session whose working tree
  changes src/turn_capture, the timestamps or identity module or a telemetry table's field_semantics.yaml block after
  its first fingerprinted pass gets compare_skipped producer_modified, so its own detached check never files compare or stored-ledger recs
  about its own development; the producer fixes plan's build session, whose rows that plan hands slice 4 to exclude,
  is one such session. Rows a tree stored before its first fingerprinted pass are presumed emitted by the code that
  fingerprint names; the residual is a session that changed those files before this build reached it at an unchanged
  PARSER_VERSION, which is transitional. Any rec the check files during implementation is listed in the report with
  a disposition (kept when the finding is real; closed as superseded, naming the build commit that fixed the defect,
  when a half-built check filed it).
- >-
  SLOC: every module under 500 (the cursor view and the expected-row construction live in cursor_tree.py from the
  start, so verify.py holds only the orchestration). No change under src/, no Lambda-packaged path, no
  Terraform, IAM, contract field or Decision text; data-model walk not owed (no table, field or write path).
- >-
  Coverage gate gap: scripts/test_coverage_checker.py's map_source_to_test returns None for scripts/ subpackages
  (rec-2641), so VP step 11 runs pytest-cov directly.
