acceptance_criteria:
- >-
  For every producer golden tree and every verification tree, captured through record_turn and the append kernel at
  every root line cut from the fork boundary to the end, at the final pass, and finalized at half its root lines then
  resumed to the end, run_verify at each point whose expected set holds the root telemetry_sessions row reports
  rows_equal equal to the stored row count at PARSER_VERSION and zero for every compare class (missing_in_store,
  unexpected_in_store, column_mismatch, key_mismatch, duplicate_ref_rows), and at every other point completes with
  compare_skipped=root_not_due and root_checked 0; the chain stores rows above the inline threshold as the blob route
  does (store_held_back_as_blob), and the check runs with alarms off (the hand-off is VP steps 6 and 8's). At the final
  pass every stored-ledger alarm class is zero, and the check's ledger and shape classes equal those
  ledger.reconcile_ledger and shape.check_shape report on the raw tree, computed independently in the test, so a
  corpus case that plants a ledger or shape alarm (the producer fixes corpus's
  subagent_usage_final_and_spawn_correction carries a spawn_usage_mismatch at PARSER_VERSION 4) is reported as that
  class and no other (VP step 7).
- >-
  Each planted store defect is reported as its class: a stored row deleted (missing_in_store), a compared column
  altered (column_mismatch naming the column), an extra row at PARSER_VERSION (unexpected_in_store), a derived key
  altered (key_mismatch); a row at another parser_version is counted in other_generation_rows and never compared (VP
  steps 3 and 8).
- >-
  The stored-row ledger leg sums, per model as the prefix walk keys it, only the stored model_call rows of the calls
  the ledger leg's own prefix walk counts at each cost-state record (an open last turn's calls included), one row per
  ref, classifies each model into the stored_ledger classes, counts rows written before parser_version 4 or with a null
  usage_final as untested, never
  reports a model exact from untested rows, sums only the cursor's generation, compares a model the ledger leg bounds
  (compaction, straddling background child, auxiliary) as a bound, never re-compares a model the ledger leg already
  alarms on, reads a model with fork-inherited or still-deferred prefix calls as not compared and one with a call the
  producer never emits as stored_ledger_call_unemitted, and skips inherited records (VP step 3).
- >-
  On the golden harness's resume trap (resume_with_cost_state, or its corpus successor resume_segment_closes if the
  producer fixes build moved it) the check reports the trap's declared ledger classes and files nothing for them, with
  no stored-ledger alarm: at PARSER_VERSION 3 every model reads stored_ledger_untested or stored_ledger_not_compared;
  at PARSER_VERSION 4 or later, on the producer's own rows (no catalog edit), every model reads a declared
  stored-ledger class or stored_ledger_not_compared and the sub-agent model claude-sub-1, whose records carry no
  requestedModel, reads a tested class. The same tree with the cost-state record's inputTokens raised by 1 files a rec
  whose classes include ledger_input_class_mismatch (VP step 8).
- >-
  A check is due on the first non-final pass after a new cost-state record, on the sent pass that advances the
  counter to VERIFY_FIRST_SENT_PASS or a later multiple of VERIFY_EVERY_SENT_PASSES, and after its backoff when a
  detached check did not complete, at most
  MAX_CHECKS_PER_TREE_PER_DAY a day counted when scheduled, never before
  next_attempt_at, never on a final, halted, stopped, busy or deferred pass; it never changes the pass outcome; a
  check that raises is recorded as verify_error:<class>, backs off, and the next pass captures normally (VP steps 4
  and 5).
- >-
  The check holds the tree lock only for local work and skips with tree_moved when a pass ran while it read or a
  page's total_rows differs from page 1's; it runs the transcript ledger and shape legs but neither the compare nor the
  stored-ledger leg when no root row is expected yet (root_not_due, benign), the root is absent though its row is
  expected (root_absent, an alarm), the tree is above MAX_TREE_PAGES pages or calls
  (tree_too_large), roots_in_tree is above 1 (tree_collision) or the session's producer fingerprint changed
  (producer_modified); it merges only its own verify-state fields into a freshly read state under the lock, an operator
  check never writes the scheduling fields, and the non-completed detached check that brings incomplete_streak to
  VERIFY_INCOMPLETE_STREAK files one verify_incomplete alarm on that skip or failure path (VP steps 4 and 5).
- >-
  Alarm classes reach the shared helper with the tree's root session ref as scope and the verify state's rate map, so
  each files or updates one rec under source telemetry_verify, never closes, at most once per class per tree per
  ALARM_MIN_INTERVAL_S; declared classes pass as declared and are never filed; diagnostics carry counts, class names
  and refs only (VP step 6).
- >-
  The CLI exits 0, 1 or 2 by the exit contract, --assert-zero is never green for a check that did not complete or a
  class whose own denominator (scope row __main__.py) is zero, and its acceptance commands pass the decidable acceptance lint (VP step 9). In the implementing session, the operator
  command over its own tree prints one VERIFY line of counts with status=completed (VP step 10).
verification_plan:
- step: 1
  phase: pre-deploy
  action: >-
    Precondition. The golden harness and verification verbs builds have merged and are on this branch, and the branch
    is on current main.
  command: >-
    git fetch origin main --quiet && git merge-base --is-ancestor origin/main HEAD && test -f
    scripts/telemetry_verify/ledger.py && test -f scripts/telemetry_verify/shape.py && test -f
    scripts/telemetry_verify/rows.py && test -f scripts/telemetry_verify/alarms.py && test -f
    tests/fixtures/telemetry_golden_chain.py && grep -q "session_tree_rows" src/common/ducklake_event_read_verbs.py &&
    grep -q "telemetry_root_sessions" src/common/ducklake_event_read_verbs.py && grep -q "canonical_id: telemetry_verify"
    config/agent/data_quality/source_registry.yaml && grep -E "^PARSER_VERSION = [0-9]+$"
    src/turn_capture/record_turn.py && AWS_PROFILE=agent_platform bin/venv-python -c "from
    src.common.ducklake_reader_client import make_reader;from src.common import ducklake_event_reads as ev;
    d=make_reader(profile='agent_platform')._invoke({'action':'describe'})['verbs'];w=ev.describe_all();
    assert all(d[v]['read_version']==w[v]['read_version'] for v in ('session_tree_rows','telemetry_root_sessions'))"
    && echo PRECONDITION_OK
  expected: >-
    The PARSER_VERSION line (3 or 4; the build runs on either, and VP steps 7 and 8 follow it: VP 7 through the raw
    tree's own ledger and shape classes, VP 8 through its stored-ledger assertion),
    then PRECONDITION_OK.
  fix_if: >-
    The ancestry test failing means main moved: rebase onto origin/main and re-run. A missing file or symbol means a
    sibling build has not merged, and a read_version mismatch means the verbs deploy is not live yet: stop and wait. A
    changed shape (a renamed helper, verb, column or private reader method) means escalate to the coordinator for a
    plan amendment, never adapt the scope inline.
  hermetic: false
  graduation: waive
  graduation_waiver_reason: >-
    A sequencing precondition on other plans' builds and deploy, not a behaviour of this change; as a standing guard it
    would only re-assert that those files and stamps exist.
