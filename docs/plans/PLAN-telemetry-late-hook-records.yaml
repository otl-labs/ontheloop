schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: telemetry-late-hook-records
intent: >-
  Make turn capture read fresh Claude Code project threads correctly. In those threads the ontheloop plugin loads after the
  CLI starts, so Claude Code writes the plugin's SessionStart hook records late (after the first turn's Stop), and writes
  each stdout-printing hook run twice (a heldContent copy and a plain twin). Today that double-counts hook process_events
  (rec-4633), files the late hooks under the user's first turn, and would let a late SessionStart:resume group cut a turn
  in half. One claude_code parser bump (6 -> 7) fixes all three. Telemetry is the learning signal of the self-improvement
  loop (PROJECT_CONTEXT): wrong hook counts and wrong turn spans teach it the wrong lessons.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-telemetry-late-hook-records.yaml
phase: >-
  ad_hoc_rec (defect rec-4633, Medium, tagged telemetry-project, plus the late-record findings of
  /mnt/project-files/project-thread-hooks/FINDINGS.md section 5e; the coordinator asked for this plan on 2026-10-26 and
  Benjamin said "write the plan" on 2026-10-26, cmsg_012XgaFy8VaDQbxP5D8nC958NK4XsqRAKhnjC7vBuSB7Hi). Closes no roadmap
  exit criterion: closes_criteria is empty by design. T3.20 owns turn capture, but its only open criteria are c6
  (SESSION_LOG retirement) and c9 (CI agent capture, rec-4415), and this plan touches neither. V2: src/turn_capture is
  excluded from every Lambda bundle, and contract prose never reaches config/lambda/ducklake/field_semantics.yaml
  (generated with include_prose=False), so nothing deploys.
scope:
  - file: src/turn_capture/hook_groups.py
    action: Create
    purpose: >-
      The new hook-record rules, pure and stdlib-only over record dicts and parsed timestamps (no import from streams.py,
      so no cycle): twin_key (rule HG-1), is_late_session_start (HG-2) and late_resume_start (HG-3), with the constants
      they name. Kept out of streams.py so that file stays under its 500-SLOC limit (471 today; Decision 128, no raise).
  - file: src/turn_capture/streams.py
    action: Modify
    purpose: >-
      _walk applies HG-1..HG-4: a twin is skipped before _hook_effect and before stream.hooks.append (kind becomes
      "hook_twin", attached to no turn, counted hook_twin_records); every SessionStart startup, clear or resume hook
      record attaches to no turn (a late startup or clear record is counted late_session_start_records); a late resume
      group's first record is still appended to stream.resumes but closes no turn, and Stream gains resume_at
      (first-record line -> effective boundary line, rule HG-4; on-time groups map to their own line). _background_spawn
      both selects its boundary and compares notices by effective line (the first resume whose resume_at line is after
      the spawn's record). Idempotent across the frontier re-assembly (_build_stream re-runs _assemble on the same Rec
      objects in every non-final pass): the twin key set and every HG verdict are rebuilt on each walk, and a record that
      arrives already marked "hook_twin" attaches to no turn, so both walks build the same turns (envelope R7). Net
      growth at most 20 SLOC.
  - file: src/turn_capture/sessions.py
    action: Modify
    purpose: >-
      _segment_closes (SC-1/SC-2) uses stream.resume_at for the boundary position: the turns of the segment before it and
      the close anchor both stop at the effective line (turns with start < first.line < effective line), and the next
      segment starts just before it (start = effective line - 1), so the turn a late group landed in belongs to the
      segment after it. On-time groups keep start = their own line (v6 unchanged). Resume rows unchanged (they key on the
      group's first record; SC-3 still makes a resume row due only once its group ends).
  - file: src/turn_capture/provenance.py
    action: Modify
    purpose: >-
      PV-2 unchanged. open_provenance adds the diagnostics counter pin_after_first_prompt (root only): no pin before the
      first prompt, but a SessionStart pin record whose hookName is not SessionStart:resume or SessionStart:compact lies
      later in the parsed stream. Counts only; never a row value.
  - file: src/turn_capture/observations.py
    action: Modify
    purpose: >-
      Module docstring only: "one process_event per hook attachment" becomes "one process_event per hook run (twins
