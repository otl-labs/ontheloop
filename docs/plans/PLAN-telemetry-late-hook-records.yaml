bundled_recommendations:
  - rec-4633
followon_recs:
  - rec-4641
  - rec-4642
closes_criteria: []
infrastructure_dependencies: []
acceptance_criteria:
  - >-
    One process_event per hook run: hook records matching on toolUseID, hookEvent, hookName, command and durationMs
    collapse to the first in file order; a record without a toolUseID never collapses; two different hooks of one event,
    or a PreToolUse and PostToolUse pair of one tool call, stay separate rows; a twin never opens a resume boundary
    (VP 1).
  - >-
    A SessionStart startup, clear or resume hook record attaches to no turn, even when written after a prompt record (on
    any surface). A SessionStart:resume group whose first record's hook started before the latest prompt or assistant
    record already written closes no turn, is still a resume (its resume row is due once the group ends, rule SC-3;
    execution_attempt order kept), and its SC-1 close,
    the next segment's start and the background-completion boundary all sit at the first prompt of the turn it was
    written into; a spawn launched inside that turn is never completed at it. On-time groups behave exactly as at v6
    (VP 2).
  - >-
    PV-2 is unchanged (the open row never reads a pin written after the first prompt), and pin_after_first_prompt counts
    the root streams where that happened (VP 2).
  - >-
    Every rule is decided from the record and the records before it, so incremental capture equals full capture at every
    line cut of every golden case, the three new cases included (VP 4).
  - >-
    The golden corpus is regenerated at parser_version 7 with the registry bumped and three new cases; the only existing
    row that changes beyond the version stamps is observed_real_shapes.json's SessionStart:startup hook row sh1 (parent
    p1 -> NULL); the derived golden state and rollups are re-authored by hand at 7 (VP 4).
  - >-
    The contracts say the same as the code: telemetry_sessions (late pin, late resume), telemetry_observations (one row
    per hook run, late startup parent NULL), the envelope's PARSER_VERSION 7 line before R8, and ports.yaml SA-02; all Class
    A text was pasted inline to Benjamin and he gave his word before the build merged (VP 3).
  - >-
    Real transcripts on the build machine (a fresh project thread) parse at v7 with no duplicate hook process_event and no
    SessionStart:startup hook row under a turn; a fresh project thread started on merged main is captured with the same
    properties (VP 5, VP 9).
  - rec-4633 closes through the Resolves trailer against its existing acceptance (VP 1, VP 10).
verification_plan:
  - step: 1
    phase: pre-deploy
    action: rec-4633's acceptance file plus the twin key unit nodes.
    command: >-
      bin/venv-python -m pytest tests/turn_capture/test_hook_resume_twins.py
      tests/turn_capture/test_hook_groups.py::test_twin_key_needs_the_full_key
      tests/turn_capture/test_hook_groups.py::test_twin_key_is_none_without_a_tool_use_id
      tests/turn_capture/test_streams.py::test_twins_stay_turnless_across_the_frontier_reassembly -q
    expected: Exit 0, every node passes. Red before because the files and the module are absent.
    fix_if: >-
      A twin still emits, a toolUseID-only match collapses two hooks, or a twin after a later prompt adds a resume. Fix
      the rule, never the fixture.
    hermetic: true
    graduation: graduate
    graduation_check_id: turn-capture-hook-twins
  - step: 2
    phase: pre-deploy
    action: Late-group rules HG-2..HG-4 and the provenance counter.
    command: >-
      bin/venv-python -m pytest tests/turn_capture/test_hook_groups.py tests/turn_capture/test_streams.py::test_late_startup_records_attach_to_no_turn
