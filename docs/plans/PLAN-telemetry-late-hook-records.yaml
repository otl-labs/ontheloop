constraints:
  - >-
    Rules, pinned (rule ids HG-1..HG-4 go into code docstrings and the contracts). HG-1 twin: a hook attachment record whose
    (toolUseID, hookEvent, hookName, command, durationMs) equals an earlier hook record's in the same stream is a twin; a
    record whose toolUseID is not a string is never a twin. HG-2 late session start: a SessionStart:startup or
    SessionStart:clear hook record with any own prompt record before it in the stream (inherited records never count).
    HG-3 late resume: the first record of a SessionStart:resume group (the record that would open the group in _walk) is
    late when its timestamp minus its durationMs (its timestamp alone when durationMs is not an int) is earlier than the
    latest timestamp of any prompt or assistant record before it in the stream; a record without a timestamp is never
    late. HG-4 effects: a twin is no row, no boundary, no group start and attaches to no turn; every SessionStart:startup,
    SessionStart:clear and SessionStart:resume hook record attaches to no turn on every surface (observed_real_shapes sh1
    included; HG-2's verdict only feeds the late_session_start_records counter); a late resume group is appended to
    stream.resumes, closes no turn, and its effective boundary (stream.resume_at) is the first prompt record of the turn
    current when it arrives (its own line when no turn is current); _segment_closes starts the next segment at that
    effective line, and _background_spawn selects and compares its boundary by resume_at. SessionStart:fork and
    SessionStart:compact keep v6 behaviour.
  - >-
    Purity (envelope R7, Decision 207): every HG verdict reads only the record and the records before it in file order, so
    a verdict never flips when the file grows; no rule reads the CLI's heldContent flag, a wall clock, git or the
    environment. A row built differently by two prefixes is a defect, never a test to relax.
  - >-
    PV-2 stays as it is: the open row is built at the first Stop pass from a parse cut at the turn's frontier (WT-7), so it
    can never see a pin written after that Stop (Fable consult F2). Recovery is rec-4641's reader work (Benjamin chose it,
    decision card cmsg_012XgaFy8VaDQbxP5D8nC958CMhHdLJy4DznnJyzSKNF3y). No new deferral: the runner's existing
    deferred_no_pin opt-in (rules P-1..P-4) is unchanged.
  - >-
    Typed columns only (Benjamin, 2026-10-17): no new column and no new metadata key. The surviving twin keeps its own
    record's fields; a held copy's release timestamp is accepted as its event_timestamp, never recomputed.
  - >-
    No file crosses 500 SLOC, tests included (Decision 128/130); streams.py grows at most 20 SLOC; contracts stay under 500
    effective lines (telemetry_observations.yaml at or under 498) by relief, never a raise or split (Decision 166);
    governance lines stay under 2000 characters.
  - >-
    Graduated checks (turn-capture-*, telemetry-parser-version-registry) keep resolving and are never weakened; the only
    assertion change is the sanctioned version pin. Any further weakening candidate the PR surfaces goes into
    weakening_dispositions or the change is reworked.
  - 'Public repository (Decision 101): fixtures synthetic; integration and probe steps print counts only.'
  - Do not touch terraform/personal (rec-4618 pause). No admin credentials; portal calls use AWS_PROFILE=agent_platform.
  - No rescue agents or workaround loops (Decision 55); a failed live step stops for RCA.
