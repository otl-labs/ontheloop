schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: telemetry-lifecycle-friction-amendment
intent: >-
  Land the one upfront telemetry contract amendment the feedback-loop review asked for (REVIEW.md section 2, items C9-C13)
  before the first telemetry row is written. Session lifecycle state, the close-row identity, the friction roll-ups, a closed
  severity set, effective-dated cost inputs and the window-verb reading then exist as one ratified text that the 3b producer
  emits against and the 2b reader derives from. Friction telemetry is the learning signal for recursive self-improvement
  (PROJECT_CONTEXT). Every rule here is either write-enforced from the contract (Decision 210) or declared as a read-time
  derivation, with three named exceptions: the process_event name grammar, declared but not yet write-enforced because the
  engine's pattern rule is unconditional (a Decision 181 cl.2 residual owned by rec-4176, which the separate process-event
  name enforcement plan bundles and resolves); process_event parentage, a cross-row fact the DQ monitor owns (Decision 210
  cl.2, rec-4101); and the per-finalization close row with its transcript-derived outcome, a producer obligation the 3b
  producer meets (rec-4026). The change is deploy-inert: contracts and tests only, merged before telemetry slice 2a-2 plan
  1's implementation registers these tables in the bundled registry.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-telemetry-lifecycle-friction-amendment.yaml
implementation_declared: true
phase: >-
  T2.36 (telemetry re-lands on DuckLake). Contract groundwork carried by rec-4024 (slice 2) and rec-4026 (3b); it closes
  no exit criterion. It advances T3.20 c7 (the telemetry_sessions schema-accuracy pass) without closing it.
scope:
- file: docs/contracts/telemetry_sessions.yaml
  action: Modify
  purpose: >-
    C9 lifecycle (W3 rulings reader-k1 (a) and reader-k3 (a); the #1384 close-row identity; rec-4146). (1) New read-derived
    field `state`: type str, nullable true, accepted [running, abandoned, success, failed, cancelled]; description, semantics,
    populated_by and dq_intent per category 2; derivation with timing read, derived_by reader_verb:session_state_and_duration,
    realized false, and inputs naming every column the rule reads: parent_session_id (the root-or-sub-agent branch discriminator);
    event_kind, event_timestamp, source_ordinal, event_id and outcome (root branch); telemetry_agents.session_id, event_kind,
    event_timestamp and outcome (sub-agent branch); and the session_id and event_timestamp of telemetry_observations, telemetry_transcripts
    and telemetry_agents (the idle test). A ROOT session's state comes from its latest lifecycle row, ordered by event_timestamp,
    then source_ordinal, then close ranked last on a tie, then event_id, over every producer's rows after each producer's
    own R5 dedupe (the envelope's generation rule); annotate rows are excluded. That state is running unless the latest
    row is a close, in which case it is that close's outcome. abandoned: not terminal, and as_of minus the session's last
    event_timestamp across its rows in all four tables exceeds a governed idle threshold. The threshold lives in the reader's
    named-read registry as versioned data, seeded at 24 h and owned by 2b (rec-4024); a later resume makes the session running
    again and nothing is stored. A SUB-AGENT session takes state and duration from its telemetry_agents agent-run open/close
    pair: an open with no close is running, or abandoned past the same threshold; a close maps its agent-run outcome into
    state as success -> success and failed, timeout or throttled -> failed (the detail stays on telemetry_agents.outcome).
    (2) duration_seconds: the latest close's event_timestamp minus session_started_at, wall-clock, including any idle gap
    between a close and a later resume. NULL until a close row exists. A sub-agent session's duration is its agent-run close
    minus open (telemetry_agents.duration_seconds). The formula covers both branches, and its inputs add parent_session_id,
    source_ordinal, event_id and telemetry_agents.session_id, event_kind and event_timestamp. (3) Close-row identity: ONE
    close row per finalization. Its external_ref is the role_ref '<uuid>#0/close' of the last root-stream record carrying
    a uuid at that finalize, and its event_timestamp and source_ordinal are that record's. outcome is derived from the transcript,
    never from SessionEnd hook input. This goes in outcome's semantics and populated_by, which also drop the legacy session_postflight
    populator, and in the external_ref and source_ordinal notes. (4) rec-4146: event_timestamp's note states that a sub-agent
    session's open row carries the ROOT start (session_started_at is the tree's pin), so a child's own start is its telemetry_agents
    open. external_ref's note declares the open marker '<session entity_ref>#0/open'. (5) Every live statement of the superseded
    rule (no close row means running; a close row's outcome IS the terminal state) is re-pointed at `state` and the resume-after-close
    rule: event_kind's accepted_values note, outcome's description and semantics, duration_seconds' description, and the
    governance_notes SESSION STATE paragraph. C10 (friction-k1 (a), friction-k2 (a)) on rework_total and exception_total:
    - the facts are process_events at severity error, warning or critical, plus tool_call closes with outcome error or blocked;
    - exception_total counts labelled exception-class facts. Each fact gets one label (an exact signature beats the generic
    rule), and a blocked tool_call whose own hook block is already a fact is not counted twice; - rework_total counts runs:
    at least repeat_threshold consecutive error closes of the same tool inside one turn. A same-tool blocked close breaks
    a run; - inputs add severity, outcome, parent_observation_id, event_timestamp, source_ordinal, event_kind and observation_id,
    read after R5 dedupe; - the rules (signatures, dispositions, labels, classes, repeat_threshold) live in a governed,
    versioned rules file bundled into the reader's named-read registry as data, owned by 2b. classifier_version is stamped
    on every response and is never a column; - the descriptions, the two formulas and the ROLL-UP RECONCILIATION note stop
    naming the rec-4032 labels table as the read source; rec-4032 stays as the later materialised form (KNOWN GAPS). C13
    (CD.52; Benjamin chose a contract note over a Decision 199 annotation): a WINDOW VERBS governance note. A verb over
    many sessions is a bounded window of per-session derivations, each reading only its own session's single calendar-day
    partition. Each window verb declares its own maximum window in the reader's named-read registry and stamps its read_version;
    there is no contract-wide day count, and each window is an egress line under Decision 88. Stale premise (fork 2 (a)):
    - workflow and ci_outcome semantics stop deferring enforcement to a "Phase 4 telemetry DQ config". They say instead
    that the set is open, and a closed set would be declared here and enforced at write (Decision 210 cl.3); - projects_to
    takes the ops convention keys {artifact: config/lambda/ducklake/field_semantics.yaml, table, generator: scripts/schema_to_field_semantics.py}
    plus a note that the event projection (scripts/field_semantics_event_projection.py) emits the entry from slice 2a-2
    plan 1's registration onward and runs in-process before then, so no later flip is owed; - write_path: not provisioned
    in production (2c); the writer is rec-4024's append verb; - the NULLABILITY AXES note states the event projection's
    actual rule (scripts/field_semantics_event_projection.py _is_not_null): a column is NOT NULL at write when nullable
    is false or not_null.enforced is true, unless the field carries required_when, which then governs; required_when, accepted_values
    and pattern are write-enforced whatever their enforced value (Decision 210, #1405), and the flag otherwise keeps its
    DQ-runner meaning, whose platform-wide re-read is rec-4158 plan C; - the header comment drops "TARGET-STATE (dq_INTENT
    only)". Category 6: field-level amendment_log entries for state (field_add, semantic_break true), outcome and duration_seconds
    (governance_note_add, true), rework_total and exception_total (governance_note_add, true; their first entries), workflow
    and ci_outcome (prose_improvement, false), and event_timestamp and external_ref, whose notes carry rec-4146's declarations
    and the close-row identity (governance_note_add, true; the agents.session_id R6 precedent). Plus one newest-first top-level
    entry. Any block-style entry may be compacted to a flow mapping with content unchanged. Expect to cross 500 effective
    lines before compaction (464 today, about +50): compact the block-style entries (event_kind, producer, outcome) to flow
    mappings and reflow folded (>-) scalars, parsed strings unchanged, to stay at or under 500.
- file: docs/contracts/telemetry_observations.yaml
  action: Modify
  purpose: >-
    C11: - severity gets dq_intent accepted_values [info, warning, error, critical] and required_when {event_kind: [point],
    observation_type: [process_event]}. Its semantics drop the "open set; enforcement deferred" premise. The entry is accepted_values_narrow,
    semantic_break true. The v2 producer emits only info, warning or error, so nothing it produces is rejected. - name gets
    required_when {event_kind: [point], observation_type: [process_event]}. The '<source>:<signature>' grammar stays in
    semantics, now with a declared residual (Decision 181 cl.2): it is not write-enforced yet because the engine's pattern
    rule is unconditional and would reject tool_call and model_call names, and its owner is rec-4176, which the separate
    "Process-event name enforcement" plan bundles and resolves. No pattern and no write_time_exemptions entry are added
    (the engine exempts payload legs only). Its semantics stop naming the rec-4032 labels table and point at the reader's
    rules file. - parent_observation_id's governance_notes_local declares a process_event's parent: the tool_call the hook
    gated when that call is in the stream, else the enclosing turn, else NULL (a root). This is cross-row, so it is prose
    only, and the DQ intent belongs to rec-4101. C12: cost_usd's derivation inputs add event_timestamp and provider, so
    the price table can be effective-dated (rec-4031). Its semantics say so. C10: - time_lost_seconds semantics and the
    friction sentence in governance_notes stop naming the rec-4032 labels table as the read source; - governance_notes say
    classifier_version is a reader response stamp, never a column; - the header comment is reworded. Stale premise: - provider
    semantics, as for workflow on sessions; - projects_to.note and write_path, as on sessions; - "REPORT-ONLY: target-state,
    not implemented" becomes "not provisioned in production"; - the NULLABILITY AXES sentence, as on sessions. Field-level
    entries: severity accepted_values_narrow with semantic_break true; name, parent_observation_id and cost_usd governance_note_add
    with true; time_lost_seconds and provider prose_improvement with false; plus one top-level entry. The file is 493 of
    500 effective lines today. Compact the remaining block-style amendment_log entries to flow mappings and reflow folded
    (>-) scalars onto fewer lines, the parsed strings unchanged and each line at most 2000 characters (the #1405 precedent,
    Decision 166), to end at or under 492. That leaves room for the name-enforcement thread's later entry, and no budget
    raise.
- file: docs/contracts/telemetry_agents.yaml
  action: Modify
  purpose: >-
    Stale premise only: - provider and trigger semantics stop saying "enforcement deferred"; open set, with a closed set
    declared here when ratified (Decision 210 cl.3), and provider's vocabulary stays rec-4135's; - projects_to.note and
    write_path, as on sessions; - governance_notes drops "REPORT-ONLY: target-state, not implemented" and states the NULLABILITY
    AXES as on sessions; - duration_seconds semantics add one sentence: the agent-run pair is also the state of the sub-agent's
    session (telemetry_sessions.state): running while open, abandoned past the same idle threshold, and at close success
    -> success, failed, timeout or throttled -> failed. Field-level entries go on provider and trigger (prose_improvement,
    false) and duration_seconds (governance_note_add, true), plus one top-level entry.
- file: docs/contracts/telemetry_transcripts.yaml
  action: Modify
  purpose: >-
    Stale premise only: projects_to.note, write_path (not provisioned in production; the writer and blob route are rec-4024's
    slice 2a-2) and governance_notes ("REPORT-ONLY" and the NULLABILITY AXES), as on sessions. These are meta and notes,
    not description or semantics, so category 6 does not apply, but one top-level amendment_log entry records them by convention.
- file: tests/telemetry/test_contract_amendments.py
  action: Modify
  purpose: >-
    Add test_subagent_open_timestamp_and_open_marker_ref_declared, whose name and module are fixed by rec-4146's acceptance,
    in the module's existing style (load_contract, case-insensitive phrase checks over whitespace-normalised text, asserting
    its field-level amendment_log entry and change_class). Re-pins: test_tool_result_capture_policy_declared's transcripts
    amendment_log[0] date check and test_model_call_reasoning_fields_declared's observations amendment_log[0] summary check
    each become a lookup of the 2026-10-04 entry asserting the same content -- a correction, not a weakening (implement-scope-boundary
    CONTENT rule). About 340 SLOC after.
- file: tests/telemetry/test_contract_lifecycle_friction.py
  action: Create
  purpose: >-
    New module (the C9-C13 amendment's own tests, kept apart from test_contract_amendments.py, whose docstring covers the
    R3/R6/R7 contract-risk amendments); module-level tests in the sibling module's style (load_contract, case-insensitive
    phrase checks over whitespace-normalised text, each asserting its field-level amendment_log entry and change_class):
    - test_session_state_and_close_identity_declared: the state field shape, accepted set, derivation timing read, ordering
    and close-last tie, idle threshold owner, sub-agent pair and its outcome mapping, the state and duration derivation
    inputs, wall-clock duration and close-row identity, and that the superseded no-close-row rule is absent from outcome,
    duration_seconds and event_kind live text; also telemetry_agents.duration_seconds' session-state sentence and its governance_note_add/true
    entry; - test_friction_rollups_read_the_rules_file: the facts, the run rule, the input list including event_kind and
    observation_id, the rules-file home and classifier_version as a stamp; no live text in the four contracts still calls
    the labels table the read source; - test_severity_closed_and_name_required_on_process_event, including name's residual
    text and its owner rec-4176; - test_process_event_parentage_declared; - test_cost_usd_inputs_are_effective_dated; -
    test_window_verb_reading_declared: per-verb bounds, and no contract-wide day count in the note; - test_no_stale_enforcement_premise:
    no live description, semantics, note, projects_to or write_path text in the four contracts says "enforcement deferred",
    "Phase 4 telemetry DQ config", "dq_INTENT only", "REPORT-ONLY", "target-state" or "no generated artifact" (case-insensitive),
    and each projects_to carries artifact, table and generator; it also pins the NULLABILITY AXES sentence to the projection's
    rule (nullable false or not_null.enforced true, unless required_when); amendment_log and previous_versions history is
    excluded; a raw-text check over each file's '#' comment lines asserts none says "dq_INTENT only" or "target-state" and
    none names rec-4032 as the friction source. About 170 SLOC.
- file: tests/test_field_semantics_event_projection.py
  action: Modify
  purpose: >-
    Add test_amended_telemetry_rules_project, using the module's existing real-contract projection path: - the projected
    telemetry_observations severity column carries accepted_values [info, warning, error, critical] and the process_event
    required_when, and name carries its required_when without a pattern; - telemetry_sessions projects no `state` column,
    because it is derived at read.
- file: config/agent/verification_registry/entries/telemetry-lifecycle-friction-amendment.yaml
  action: Create
  purpose: >-
    Verification-registry row for graduated VP step 1: check_id telemetry-lifecycle-friction-amendment, primitive_slot command_exit_zero,
    with the step's pytest node list as check_spec.command. Its guard_target is the comma-separated four contracts (the
    telemetry-contract-risk-amendments.yaml precedent), and graduated_by is implement-agent. The command names the new module's
    seven nodes, rec-4146's node and the projection node.
bundled_recommendations:
- rec-4146
followon_recs:
- rec-4176
infrastructure_dependencies: []
acceptance_criteria:
- >-
  telemetry_sessions declares a read-derived `state` [running, abandoned, success, failed, cancelled]: - root state from
  the latest lifecycle row, ordered by event_timestamp, source_ordinal, close last on a tie, then event_id, over every producer's
  rows after R5, with annotate excluded; - abandoned past a governed idle threshold owned by 2b and seeded at 24 h, and
  a resume returns the session to running; - a sub-agent session from its agent-run pair, with success -> success and failed,
  timeout or throttled -> failed. duration_seconds is the latest close minus session_started_at, wall-clock. Each finalization
  writes one close row, anchored on '<uuid>#0/close' of the last root-stream record with a uuid, and its outcome is derived
  from the transcript. No live text still says a session without a close row is running or that a close row's outcome is
  the terminal state; state and duration_seconds name every input their derivations read, the branch discriminator and the
  idle-test join columns included.
- >-
  rec-4146: a sub-agent session's open row is declared to carry the root start, and the '<session entity_ref>#0/open' marker
  is declared. Its acceptance command passes.
- >-
  rework_total and exception_total follow friction-k2 (a): the facts, the run rule, and inputs that include event_kind and
  observation_id. Their rules live as versioned data in the reader's named-read registry, with classifier_version stamped
  per response and never a column. No live contract text names the rec-4032 labels table as the read source.
- >-
  telemetry_observations: - severity accepts only [info, warning, error, critical] and is required on process_event points;
  - name is required on process_event points; its grammar stays declared in semantics with no pattern, as a named residual
  owned by rec-4176; - parent_observation_id declares the three observed process_event parents; - cost_usd's derivation
  inputs include event_timestamp and provider.
- >-
  telemetry_sessions' governance notes state the window-verb reading of Decision 199 cl.1: per-session derivations, per-verb
  maximum windows in the reader registry, and no contract-wide day count. docs/DECISIONS.md is unchanged.
- >-
  No live description, semantics, note, projects_to or write_path text in the four contracts defers enforcement to a DQ
  config, calls the contract TARGET-STATE, dq_INTENT only or REPORT-ONLY, or says no generated artifact exists. Each projects_to
  carries the ops convention keys {artifact, table, generator}. Each NULLABILITY AXES note states the projection's write-time
  NOT NULL rule accurately.
- >-
  The change is deploy-inert: - scripts.schema_to_field_semantics --check passes with no regeneration; - no file under src/,
  scripts/, config/lambda/ or docs/DECISIONS.md changes; - contract_version is unchanged on all four contracts and category
  6 is clean against the merge base; - each contract is at most 500 effective lines (telemetry_observations at most 492)
  with lines of at most 2000 characters; - the v2 producer's golden output still passes every contract rule.
- rec-4146 closes via the Resolves trailer on the implementation squash merge.
verification_plan:
- step: 1
  phase: pre-deploy
  action: Run the new amendment tests and the projection test (rec-4146's acceptance node among them).
  command: >-
    bin/venv-python -m pytest tests/telemetry/test_contract_amendments.py::test_subagent_open_timestamp_and_open_marker_ref_declared
    tests/telemetry/test_contract_lifecycle_friction.py::test_session_state_and_close_identity_declared tests/telemetry/test_contract_lifecycle_friction.py::test_friction_rollups_read_the_rules_file
    tests/telemetry/test_contract_lifecycle_friction.py::test_severity_closed_and_name_required_on_process_event tests/telemetry/test_contract_lifecycle_friction.py::test_process_event_parentage_declared
    tests/telemetry/test_contract_lifecycle_friction.py::test_cost_usd_inputs_are_effective_dated tests/telemetry/test_contract_lifecycle_friction.py::test_window_verb_reading_declared
    tests/telemetry/test_contract_lifecycle_friction.py::test_no_stale_enforcement_premise tests/test_field_semantics_event_projection.py::test_amended_telemetry_rules_project
    -q
  expected: 'Exit 0, 9 passed. Red before: every node is absent from the pre-change tree.'
  fix_if: >-
    A failing assertion names a contract field and the missing text or rule. Fix the contract, not the test, unless the
    test asserts something the acceptance criteria do not require.
  hermetic: true
  graduation: graduate
  graduation_check_id: telemetry-lifecycle-friction-amendment
  expected_literals: []
- step: 2
  phase: pre-deploy
  action: >-
    Tripwire: the v2 producer's golden output still passes every rule projected from the amended contracts, including the
    closed severity set and the process_event name requirement.
  command: >-
    bin/venv-python -m pytest tests/turn_capture/test_record_turn.py::test_every_emitted_row_passes_kernel_rules tests/turn_capture/test_observations.py::test_every_hook_attachment_is_one_process_event
    tests/turn_capture/test_observations.py::test_hook_name_fallbacks tests/telemetry/test_prepare.py tests/telemetry/test_append.py
    -q
  expected: >-
    Exit 0, every node passes, green before and after. A failure means the amendment rejects a row today's producer emits.
  fix_if: >-
    A RowRuleError naming severity or name means the amended rule rejects real producer output. Re-read the producer (src/turn_capture/observations.py)
    and correct the rule. Never change the producer in this plan, and never weaken the test.
  hermetic: false
  graduation: waive
  graduation_waiver_reason: >-
    Existing standing tests in the turn-capture and telemetry suites, which run in every validation tier; graduating them
    again would duplicate that coverage. Here they serve as this plan's non-regression evidence, and two of them are whole-file
    runs (not hermetic under vp-red-before rule (v)).
- step: 3
  phase: pre-deploy
  action: >-
    Re-run the modified test modules whole (the re-pinned nodes included) and the standing contract suites (contract_version
    pins and the extra=forbid parse).
  command: >-
    bin/venv-python -m pytest tests/telemetry/test_contract_amendments.py tests/telemetry/test_contract_lifecycle_friction.py
    tests/test_field_semantics_event_projection.py tests/checks/contracts/test_telemetry_event_journal_contracts.py tests/test_contracts.py
    tests/test_contracts_schema.py -q
  expected: Exit 0; no failures.
  fix_if: >-
    A re-pinned node fails: point it at the 2026-10-04 entry by date and assert the same content; never drop the assertion.
    A contract_version pin fails: the version was bumped, so revert it.
  hermetic: false
  graduation: waive
  graduation_waiver_reason: >-
    This is a whole-file re-run of test modules the plan modifies, plus standing suites that run in every tier. The new
    nodes are graduated by step 1.
- step: 4
  phase: pre-deploy
  action: >-
    Category 6 and contract_version against the merge base, then the deploy-inert proof: the generated registry is byte-identical,
    and no deploy-path, code or Decision file changed.
  command: >-
    bin/venv-python -c "import subprocess,yaml;from scripts.contracts_schema import ContractDocument;from scripts.contracts_enforcement
    import check_amendment_for_diff;mb=subprocess.run(['git','merge-base','origin/main','HEAD'],capture_output=True,text=True,check=True).stdout.strip();base=lambda
    f:yaml.safe_load(subprocess.run(['git','show',mb+':docs/contracts/%s.yaml'%f],capture_output=True,text=True,check=True).stdout);head=lambda
    f:yaml.safe_load(open('docs/contracts/%s.yaml'%f,encoding='utf-8'));fs=('telemetry_sessions','telemetry_observations','telemetry_agents','telemetry_transcripts');errs=[];[errs.extend(check_amendment_for_diff(ContractDocument.model_validate(base(f)),ContractDocument.model_validate(head(f))))
    for f in fs];[errs.append(f+': contract_version changed') for f in fs if base(f)['contract']['contract_version']!=head(f)['contract']['contract_version']];print(chr(10).join(errs)
    or 'AMENDMENTS_OK');assert not errs" && bin/venv-python -m scripts.schema_to_field_semantics --check && git diff --quiet
    "$(git merge-base origin/main HEAD)" -- src scripts config/lambda docs/DECISIONS.md docs/ROADMAP-PLATFORM.yaml && echo
    INERT_OK
  expected: Exit 0, with both success markers printed.
  fix_if: >-
    A category-6 error names a field: add its field-level entry with a consistent pairing. A contract_version change: revert
    it. If --check fails because the telemetry tables are already registered in the generator (2a-2 plan 1's implementation
    merged first), STOP. The deploy-inert premise is void; return to planning, because the amendment would then regenerate
    field_semantics.yaml and redeploy the DuckLake Lambdas, which needs Benjamin's word (Decision 55; never regenerate here).
    A diff under src/, scripts/, config/lambda/, docs/DECISIONS.md or docs/ROADMAP-PLATFORM.yaml is out of scope: revert
    it.
  hermetic: false
  graduation: waive
  graduation_waiver_reason: >-
    This is diff-relative to the merge base by construction. The standing equivalents are scripts.validate's contract-drift
    and field-semantics-drift checks.
- step: 5
  phase: pre-deploy
  action: >-
    Size: every amended contract stays within the contracts class cap (500 effective lines, 2000 characters per line). telemetry_observations
    ends at or under 492, leaving headroom for the name-enforcement thread.
  command: >-
    bin/venv-python -c "import pathlib;fs=('telemetry_sessions','telemetry_observations','telemetry_agents','telemetry_transcripts');L={f:pathlib.Path('docs/contracts/%s.yaml'%f).read_text(encoding='utf-8').splitlines()
    for f in fs};r={f:(sum(1 for l in L[f] if l.strip() and not l.strip().startswith('#')),max(len(l) for l in L[f])) for
    f in fs};print(r);assert all(n<=500 and w<=2000 for n,w in r.values()) and r['telemetry_observations'][0]<=492, r;print('SIZE_OK')"
  expected: Exit 0 and the success marker printed.
  fix_if: >-
    Over a limit: compact block-style amendment_log entries to flow mappings, and reflow folded (>-) scalars onto fewer,
    longer lines (at most 2000 characters); the parsed strings stay identical, so category 6 sees no change. Never raise
    a budget and never drop history.
  hermetic: true
  graduation: waive
  graduation_waiver_reason: >-
    The 500-line and 2000-character limits are the standing structural size check in every tier. The 492 headroom is a one-off
    coordination margin for the name-enforcement thread, not a standing rule.
  expected_literals:
  - SIZE_OK
- step: 6
  phase: pre-deploy
  action: Full validation tier before handoff.
  command: bin/venv-python -m scripts.validate
  expected: Exit 0.
  fix_if: Fix the named check; never raise a budget or skip a check.
  hermetic: false
  graduation: not-applicable
- step: 7
  phase: post-deploy
  action: >-
    Closure. After the squash merge carrying 'Resolves: rec-4146', confirm rec-4146 reads closed in the warehouse.
  command: >-
    bin/venv-python -m scripts.ops_data_portal --sync && bin/venv-python -c "import json,pathlib; r={json.loads(l)['id']:json.loads(l)['status']
    for l in pathlib.Path('logs/.recommendations-log.jsonl').read_text().splitlines() if l.strip()}; s=r.get('rec-4146');
    print('rec-4146:', s); raise SystemExit(0 if s=='closed' else 1)"
  expected: Exit 0, rec-4146 closed.
  fix_if: >-
    The portal sync cannot reach the reader: read the rec through the reader's named verb instead (ducklake-reads rec_by_id).
    The manual update_rec close is sanctioned only after a transport failure or a merge-leg refusal (git-ops.yaml resolves_trailer,
    Decision 201). A squash body that omitted the trailer is neither: leave rec-4146 open and report it to Benjamin and
    the coordinator instead of closing it by hand. An acceptance refusal: fix the failing acceptance; never force-close.
