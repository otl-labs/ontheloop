constraints:
- >-
  The plan touches only the four telemetry Class A contracts, two test modules and one registry row. It changes no code
  under src/ or scripts/, nothing under config/lambda/, no Decision text (Benjamin chose fork 3 (a)), no roadmap and no
  producer behaviour.
- >-
  It is deploy-inert only while the telemetry tables are absent from the generator's _CONTRACT_TABLE_IDS. If 2a-2 plan 1's
  implementation is already on main when this plan is implemented, stop and return to planning. Never regenerate field_semantics.yaml
  under this plan (Decision 55).
- >-
  Amend within the ratified Decision 199 model: - no stored field is added or removed (`state` is read-derived, with no
  column); - no identity, partition, dedupe, grain or parser_version change; - no contract_version bump (the in-place amendment
  precedent, and the tests pin version 2).
- >-
  Category 6: every description or semantics diff carries a NEW field-level amendment_log entry with a consistent pairing.
  Field-level logs run oldest-first and top-level logs newest-first. Summaries open with the plan slug and cite the review
  item or ruling.
- >-
  No closed set is added for provider, workflow, ci_outcome or trigger; only the deferral wording changes. provider's vocabulary
  is rec-4135's.
- >-
  The process_event name grammar stays semantics text with its declared residual and owner rec-4176: no pattern and no write_time_exemptions
  on name. The "Process-event name enforcement" plan owns the conditional rule, resolves rec-4176, and edits name's dq_intent
  after this lands.
- >-
  Compaction rewrites only formatting: block amendment_log entries become flow mappings and folded (>-) scalars may be reflowed
  onto fewer lines, so every parsed string is identical; every line stays at or under 2000 characters and no history is
  dropped. No budget raise (Decisions 128 and 166).
- >-
  Re-pinned tests assert the same entry's content by date lookup. That is a correction, never a weakening (implement-scope-boundary
  CONTENT rule).
- No rescue agents or workaround loops (Decision 55).
