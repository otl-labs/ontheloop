execution_steps:
  - >-
    1. Registry rows: one per line below as "<producer> <observation_type> <event_kind> <key>: <meaning>". Write each
    meaning as given; adjust wording only to match the code it cites, never to add a fact. Re-run the golden key tally
    first: if the corpus on main carries a row not listed here, or lacks one listed, the corpus wins and the difference
    is reported in the PR body.
  - |-
    Meanings table (31 rows, counted on main 4232ed1e):
    claude_code tool_call open caller_type: the tool_use block's caller.type, who issued the call (observations.py _tool_rows).
    claude_code tool_call open attribution_mcp_server: the record's attributionMcpServer, the MCP server a tool call is attributed to; read by the reader's tool_use_rollup.
    claude_code tool_call close tool_denial_kind: the tool_result record's toolDenialKind identifier when the call was denied (_result_meta).
    claude_code tool_call close permission_decision_source: permissionDecision.source on the result record (hook, rule, user...), as an identifier.
    claude_code tool_call close is_error: the tool_result block's is_error flag (true or false).
    claude_code tool_call close interrupted: toolUseResult.interrupted, whether the tool run was interrupted.
    claude_code tool_call close persisted_output: file name of the harness-saved full output sidecar, when the output was persisted.
    claude_code tool_call close persisted_output_size: toolUseResult.persistedOutputSize in bytes.
    claude_code tool_call close agent_id: toolUseResult.agentId of a spawned sub-agent run.
    claude_code tool_call close is_async: toolUseResult.isAsync, true when the harness ran the spawned agent in the background.
    claude_code tool_call close status: toolUseResult.status string (for example async_launched).
    claude_code tool_call close synthetic: true on a close the producer synthesised for a tool call with no result (outcome interrupted, output_capture no_result).
    claude_code turn open is_meta: true when the turn's first record is a harness meta record (isMeta).
    claude_code turn open prompt_source: the first record's promptSource string.
    claude_code turn open turn_origin: the first record's turnOrigin string.
    claude_code turn close response_count: number of model responses in the turn window this close bounds.
    claude_code turn close tool_call_count: number of tool calls in that window.
    claude_code model_call point request_id: the API requestId of the response's owner record.
    claude_code model_call point stop_reason: the response message's stop_reason.
    claude_code model_call point block_count: total content blocks across the response's records.
    claude_code process_event point hook_event: the hook event (PreToolUse, Stop...) of a hook attachment row, or the event taken from a hook denial's reasonCode (src/turn_capture/hook_denials.py); null when the reasonCode carries no hook: event.
    claude_code process_event point hook_name: the hook attachment's hookName.
    claude_code process_event point attachment_type: the hook attachment's type.
    claude_code process_event point exit_code: a hook run's exit code from its attachment (severity derives from it).
    claude_code process_event point duration_ms: the hook run's durationMs.
    claude_code process_event point tool_use_id: the tool_use id the event belongs to (hook attachment, hook denial, gate or status marker).
    claude_code process_event point command: the hook command, scrubbed.
    claude_code process_event point stderr_head: the first 512 characters of the hook's stderr, scrubbed.
