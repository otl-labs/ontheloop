schema_version: 6
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: telemetry-metadata-keys
intent: >-
  Make every fact stored in telemetry_observations.metadata findable from the contracts, so a planner stops reading
  producer code (or proposing a new column) to learn what the bag holds. The claude_code producer writes 29 keys and
  litellm 2; the contract names one of the claude_code keys and lists STEP/PHASE/PROCESS_EVENT keys nothing writes
  (audit TFC-01, audits/telemetry-field-consolidation-5a48cc4b7.yaml:2505). This plan adds a Class D registry,
  docs/contracts/telemetry-metadata-keys.yaml (one row per producer, observation_type, event_kind and key, with its
  meaning and the first parser_version whose golden corpus carries it), and a fast-tier check, validate_telemetry_metadata_keys,
  that fails when any producer's golden rows and the registry disagree in either direction. The observations metadata
  semantics becomes a pointer and stops calling exit_code absent from the bag (TFC-02, wording half). No parser bump,
  no stored-field change, no schema change, no deploy.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-telemetry-metadata-keys.yaml
phase: >-
  T3.3 prerequisite (data inventory; field consolidation audit, plan C of the operator's 2026-11-20 breakdown). Closes
  no exit criterion. V2: a contract, a pure check over the golden corpus and its tests; no Lambda-packaged file, no
  Terraform, no deploy (config/lambda/ducklake/field_semantics.yaml projects no semantics prose).
closes_criteria: []
cites: [dec:59, dec:86, dec:168, dec:170, dec:199, dec:210, dec:275, dec:279]
scope:
  - file: docs/contracts/telemetry-metadata-keys.yaml
    action: Create
    purpose: >-
      Class D registry (contract_version 1, status draft, subject telemetry-metadata-keys, evaluator check validate_telemetry_metadata_keys). Body `keys:`
      is a LIST of flow mappings {producer, observation_type, event_kind, key, meaning, since, until (optional)}, one per (producer,
      observation_type, event_kind, key) the golden corpus carries (31 rows today: 29 claude_code across tool_call
      open/close, turn open/close, model_call point, process_event point; litellm error and loss on model_call point).
      No leaf uses a Class A descriptor key (contract-population.yaml smuggling_detection). `meaning` says what the value
      is and which writer emits it (process_event rows name their source: hook attachment, hook denial (rec-5211), gate
      or status marker). `since` is the first parser_version of that producer whose golden corpus carries the row (corpus coverage can lag
      producer behaviour, and the registry description says so),
      derived at build from git history (never guessed; an undatable key is recorded as the literal "<=N" with N the
      first version the corpus history shows). A null-valued key counts as written. Meanings: execution step 1's table.
      description says why this is Class D mechanism, not Class A fields: bag keys are not columns; the metadata
      column's Class A obligations stay in telemetry_observations.yaml, and this file is the producers' key catalogue
      checked against the golden corpus. `until` is the last parser_version that wrote a key the producer has stopped
      writing: stored rows are append-only (Decision 199), so a dropped key keeps its row and meaning with until set,
      and the registry explains every key any stored row can carry. No row carries until at birth. procedure (one
      paragraph): a producer change that adds a key adds its row, and one that drops a key sets that row's until, in
      the same parser_version bump (plan D is the first to use until); the registry is not a write-time rule source, and any bag-key rule a writer
      enforces is declared in telemetry_observations.yaml (Decision 210 cl.3). A top-level amendment_log opens with the
      creation row (change_class field_add, summary "created with 31 key rows (PLAN-telemetry-metadata-keys, rec-4733)"),
      as telemetry-writer-principals.yaml does.
  - file: docs/contracts/telemetry_observations.yaml
    action: Modify
    purpose: >-
      fields.metadata.semantics becomes exactly: "Keys are declared one row each in telemetry-metadata-keys.yaml
      (producer, row type, meaning, since parser_version), among them MODEL_CALL error and loss (litellm, envelope LL-4:
      cancelled | usage_not_recorded), and checked against the golden rows. The high-value analytic fields are PROMOTED
      to typed columns (provider, acceptance_passed, time_lost_seconds, the four token classes) and are NOT in this bag;
      a hook run's exit code is the process_event bag key exit_code (the typed exit_code column is model_call-only and
      unproduced). A definition hash is the typed telemetry_agents.definition_sha256, never a metadata key." (keeps
      the loss substring tests/telemetry/test_litellm_producer_contract_notes.py pins; no prompt_hash). One field-level
      amendment_log row, newest first, with no migration_story (optional on a semantic_break row, as the 2026-11-20
      litellm row): {date: "<build date>", semantic_break: true, change_class: governance_note_add, summary:
      "PLAN-telemetry-metadata-keys (rec-4733): keys move to telemetry-metadata-keys.yaml; a hook exit_code is a
      process_event bag key."}. No stored row changes (no producer writes the dropped STEP, PHASE, PROCESS_EVENT or
      MODEL_CALL purpose_detail keys); say so in the PR body. fields.exit_code and the realization block are NOT edited
      (they change with the parser v12 producer change). Measured on main 5070cb63: the field row is 227 bytes and the
      semantics +18, so about +245 bytes against 259 of headroom, and +1 line against 2 with the semantics kept at its 2
      physical lines. No other amendment_log row is compacted: the top-level 2026-10-17 row's migration_story is pinned
      by tests/checks/contracts/test_telemetry_event_journal_contracts.py::test_capture_provenance_and_usage_columns_are_nullable_and_ruled.
      Re-measure at build; if a sibling build has used the headroom, shorten the new row's summary and the pointer's
      unpinned clauses (keep the loss substring and the registry file name); never raise and never compact a row whose
      migration_story a test pins.
  - file: scripts/checks/contracts/validate_telemetry_metadata_keys.py
    action: Create
    purpose: >-
      Pure function metadata_key_errors(registry, corpora, registry_order, currents) plus a wrapper that loads them,
      reusing validate_telemetry_field_realization.load_inputs for the golden corpus. Rules: K1 every (producer,
      observation_type, event_kind, key) in a producer's golden metadata is a registry row; K2 every registry row without until is
      carried by that producer's golden rows, and a row with until by none; K3 rows are unique and their producer is registered; K4 since is an int
      in 1..current, or "<=N" with N in 1..current, and until, when present, is an int with since <= until < current; K5
      no row uses a Class A descriptor key (_population._CLASS_A_DESCRIPTOR_KEYS imported, a deliberate coupling to the
      contract-population smuggling detector, never a copy). K5 is this file's only shape guard: detect_smuggled_shape
      skips list-valued bodies, and K5 is stricter (any one descriptor key); the registry description says so. Each error names the row.
      Declares examined(count, unit="key rows") through the Decision 170 output channel.
      Holds the literal telemetry-metadata-keys.yaml in executable context (Decision 168 evaluator grammar). Known
      coupling: load_inputs also parses field_semantics.yaml, the roadmap and the telemetry contracts, so a failure in
      one of those fails this check too; a golden-only loader would edit the realization module, out of scope here.
    new_imports: [scripts.checks.contracts.validate_telemetry_field_realization, scripts.checks.contracts._population]
  - file: scripts/checks/contracts/_manifest.py
    action: Modify
    purpose: >-
      Register validate_telemetry_metadata_keys, pre=True, full_segment="full_after_lint" (as the realization entry),
      pre_globs: the realization entry's nine (docs/contracts/telemetry_*.yaml, config/telemetry/parser_versions.yaml,
      tests/fixtures/turn_capture/golden/**, config/lambda/ducklake/field_semantics.yaml, docs/ROADMAP-PLATFORM.yaml,
      scripts/contracts_schema.py, scripts/checks/contracts/**, scripts/checks/_common.py, scripts/checks/registry.py)
      plus docs/contracts/telemetry-metadata-keys.yaml (the hyphenated name misses telemetry_*.yaml),
      scripts/checks/_marker_guard*.py and scripts/decisions_md.py: the check's import closure (through _population)
      plus every input load_inputs reads, so validate_pre_glob_closure (a blocking --pre gate) passes. Re-measure the
      closure once the module exists and add any path it reports; never drop the entry to ungated.
  - file: tests/checks/contracts/test_validate_telemetry_metadata_keys.py
    action: Create
    purpose: >-
      Real-tree test test_registry_matches_every_golden_key_set (rec-4733 acceptance) plus one red fixture per rule:
      an undeclared key (K1), a declared key no golden row carries (K2), a duplicate row and an unregistered producer
      (K3), since 0, since above current, a malformed "<=" and until at or above current or below since (K4), a row
      with until that a golden row still carries (K2), a leaf with `description` (K5); the real-tree test also pins
      since 1 on both litellm rows (that producer has had one version); and
      test_check_runs_in_the_fast_and_full_tiers (the manifest entry is in registry.pre_sequence() and full_sequence(),
      and its pre_globs cover every path load_inputs reads, as test__manifest.py's test_pre_globs_cover_the_inputs does
      for the realization check).
  - file: tests/telemetry/test_hook_denial_contract_notes.py
    action: Modify
    purpose: >-
      Add test_observations_contract_names_the_hook_denial_source (rec-5211 acceptance): the registry's
      process_event rows for hook_event and marker_version name the hook-denial source (src/turn_capture/hook_denials.py),
      and the observations metadata semantics points at the registry (names telemetry-metadata-keys.yaml). The same
      node also asserts acceptance criterion 3: the metadata semantics holds no "STEP ->" and no "PHASE ->", the
      PROMOTED parenthesis no longer lists exit_code, and the process_event bag-key sentence for exit_code is present. Widen the module docstring from "The parser_version 10 contract text" to name
      the metadata registry pointer as well.
  - file: config/ci_rca_taxonomy.yaml
    action: Modify
    purpose: >-
      function_to_category row validate_telemetry_metadata_keys -> schema_drift, beside validate_telemetry_field_realization.
      NEAR_CAP: 493 of 500 effective lines on main, with 10 other unbuilt plans scoping it (plan_obligations). Re-measure
      at build; if the +1 line would pass 500, relieve per config/structural_size_budgets.yaml's config row (compact
      resolved rows: drop a function_to_category row whose check is no longer registered, or a stale comment line) in the
      same diff; never raise.
