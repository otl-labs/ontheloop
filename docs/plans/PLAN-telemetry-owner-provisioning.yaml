infrastructure_dependencies:
- >-
  No Terraform, no IAM change, no role SQL change and no admin step. The maintenance-smoke function already connects as the
  owner login, is env-pinned to ducklake_smoke and has an execution role scoped to the smoke S3 prefix (Decision 143);
  github_ci_branch already holds its URL invoke (MaintenanceSmokeInvokeCI). The telemetry writer's login and grants are
  unchanged (Decision 213 cl.3, PLAN-url-only-invoke-guard). The function's Terraform description goes stale (rec-4310).
- >-
  Deploy: the merge redeploys every DuckLake function through the governed channel (src/common/ducklake_*.py and both
  manifests change). The first run's maintenance-smoke step creates the nine smoke telemetry tables (none exist: the
  failed run 38548925749 committed nothing); the smoke job then runs the telemetry gate against them. The live schema's
  owner is first measured by that step's ownership report (schema_owner_is_current_user).
- >-
  Production (slice 2c, not built here): an operator-invoked admin verb on ducklake_maintenance wrapping the same
  create_telemetry_tables and ownership check with an explicit meta_schema, after rec-4292 item (2)'s egress
  measurement; an ADMIN-container agent path needs its own carve-out. Recorded on rec-4292 (2026-10-14).
acceptance_criteria:
- create_telemetry_tables creates and partitions only absent telemetry tables, writes no row and never drops or re-ALTERs.
- provision_telemetry_catalog issues no DDL; with any target table absent it fails naming the tables and writes nothing.
- ducklake_maintenance_smoke dispatches exactly {merge, gc, breaker_probe, hot_merge, create_telemetry_tables}; the new verb reads nothing from the event, refuses a non-smoke meta schema, and answers every failure after that check as a typed 500, never a bare 502.
- On Postgres 16 with a Neon-shaped non-superuser owner and the real role SQL, with and without pg_read_all_data, the owner creates, the scoped login verifies, seeds, registers and inserts, the owner reads, dumps and maintains, and every relation in ducklake_smoke stays owner-owned; the run's log is in the implementation PR.
- The scoped login holds no CREATE on ducklake_smoke or public, live (the maintenance step's ownership report and the writer's own probe) and in the test.
- The deploy pipeline runs create_telemetry_tables as maintenance-smoke's last, never-skipped step, and the smoke job runs after maintenance-smoke.
- Decision N is on main amending Decisions 143 and 213, with a Coverage line and dated annotations on both.
- The deployed run prints MAINTENANCE_CREATE_TELEMETRY OK and, in the telemetry step, TELEMETRY_PROVISION_OK and TELEMETRY_PROBE_OK with no 502 (rec-4294's acceptance evidence).
- rec-4294 is closed through the escape-classified manual route with a closure_artifact from this plan's tests and the live evidence in its resolution.
