constraints:
- >-
  Never grant the scoped login CREATE, never give the telemetry writer an owner credential or SET ROLE to the owner, and
  never change the role SQL in this plan (Decision N cl.1; a role SQL change needs an admin re-run, always-ask).
- >-
  The new verb is create-only and smoke-pinned: no drop, no re-ALTER, no row write, no input read from the event. The
  counter seed stays on the writer (one write path for ops_entity_counters, Decision 81 cl.5 / 210). Re-laying a live
  partition stays an admin verb (Decision 204).
- >-
  No Terraform and no IAM change. Nothing under scripts/ may import a module that imports src.telemetry.append
  (.importlinter scripts-never-import-telemetry-append). No new CI job: real-engine CI gating is rec-4071 (scripts.validate
  stays the single source of CI checks, Decision 80 cl.3).
- >-
  Public repository (Decision 101): no account id, ARN, host or DSN in code, fixtures, logs, responses or gate output; the
  PG test refuses any non-local host.
- >-
  Keep every touched file under 500 SLOC; decompose rather than raise a budget (Decision 128). The flat smoke handler test
  (363 SLOC) must stay under 500.
- >-
  Decision text goes in as a NEW entry plus dated annotations; never rewrite Decision 143's or 213's text (Decision 177).
- >-
  rec-4294 is escape-classified (context_v2_json escape_class no-edge, Decision 186): never put a Resolves trailer for it
