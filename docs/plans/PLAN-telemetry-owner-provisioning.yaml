rollback: >-
  Revert the code, workflow, test and contract edits in a new PR (not docs/DECISIONS.md); the governed channel redeploys
  the previous code. The owner-created smoke telemetry tables stay (owner-owned, disposable), so the reverted writer's
  create-only provision_telemetry finds them all present, creates nothing and the gate stays green; a revert before the
  first owner step ran restores the pre-fix red gate. Decision N stays in DECISIONS.md and is superseded by a later
  Decision if the design is reversed, never deleted (Decision 177).
