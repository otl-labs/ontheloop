execution_steps:
- >-
  Write the new provision tests (step 1's nodes) against a recording fake, then split src/common/ducklake_telemetry_provision.py
  (create_telemetry_tables, DDL-free provision_telemetry_catalog, ownership_report, session_can_create, the identifier
  guard). Update the telemetry-provision-ddl shard's node list. Run step 1.
- >-
  Write tests/common/test_ducklake_telemetry_catalog_ownership.py and run it against a local PG16 (step 7) BEFORE wiring
  any Lambda: it is the evidence that the split holds on real Postgres. Adjust the registration integration fixture and
  run step 8.
- >-
  Write src/lambdas/ducklake_maintenance_smoke/telemetry_actions.py and its nodes in
  tests/test_ducklake_maintenance_smoke_handler.py, wire the handler's dispatch and docstring citation, widen the
  exact-set pin, update the manifest and the packaging nodes. Run steps 2 and 6.
- >-
  Add can_create to the writer's telemetry_probe, the gate check in _check_probe, the owner-step gate, its flag and their
  tests. Run step 3.
- >-
  Wire the deploy workflow (owner step last in maintenance-smoke with id create-telemetry-tables and !cancelled(); smoke
  needs maintenance-smoke with !cancelled()), add its body baseline row and the wiring tests. Run step 4.
- >-
  Write Decision N into docs/DECISIONS.md with this content, in decision-entry.yaml's required-marker shape (the
  **Status:** and **Date:** markers, the fenced metadata envelope, Problem, Decision, Rationale, Coverage, the
  reversal-conditions stanza, Related and the trailing --- block separator), N = origin/main max + 1, replacing N throughout. Title "## Decision N: One owner
  per DuckLake metadata schema -- scoped catalog logins never hold CREATE, and telemetry tables are created under the owner
  login, by CI on the disposable smoke catalog (amends Decision 143 clause 2 and Decision 213 clause 3) (Decided)";
  envelope {number N, status Decided, decided_date 2026-10-14, amends [143, 213], significance numbered_decision,
  justification: "Durable identity-scope commitment with reversal conditions: widens Decision 143 cl.2's exact
  CI-reachable dispatch set and carves the smoke catalog out of Decision 213 cl.3's admin step; an amendment_forms
  annotation cannot widen a ratified exact set or add a carve-out (the Decision 204 cl.4 precedent), and no contract owns
  cross-function identity scope."}. Problem: DuckLake's CREATE TABLE also creates a physical Postgres table per table even
  with inlining off, so provisioning needs CREATE on the metadata schema; the telemetry writer's DML-only login could not
  run provision_telemetry (rec-4294's trigger), firing Decision 213's reversal condition scoped-login-blocks-verbs.
  Decision: 1. Single owner: every object in a DuckLake metadata schema is owned by that schema's owner and all
  DuckLake-level DDL (create, alter, partition, extension migration) runs under the owner login; a scoped login never
  holds CREATE on any schema, public included. 2. Smoke: ducklake_maintenance_smoke gains create_telemetry_tables
  (create-if-absent DDL for the declared telemetry tables, read-only drift checks, no row writes, no drop, nothing read
  from the event), run by the governed deploy pipeline's maintenance-smoke stage before the telemetry gate. Amends
  Decision 143 cl.2: its dispatch set is EXACTLY {merge, gc, breaker_probe, hot_merge, create_telemetry_tables};
  reversible and disposable, so agent-autonomous under cl.3. 3. Amends Decision 213 cl.3: creating a telemetry table is a
  schema migration. On the disposable smoke catalog it runs as clause 2's CI verb; on a production telemetry catalog it
  stays an admin step under the owner login, operator-invoked (Decision 126 admin tier), and an ADMIN-container agent path
  needs its own carve-out (rec-4292). The telemetry writer keeps provision_telemetry as DML only (verify presence and
  drift, seed the counter rows), so ops_entity_counters keeps one write path. 4. Decision 213's scoped-login-blocks-verbs
  condition fired and is resolved by moving the verb, not by widening the grant set. "DML-only" contains which catalog a
  scoped login reaches, not DuckLake-level verbs: metadata DML already permits a DuckLake DROP TABLE, so verb containment
  stays the closed verb set, S3 without DeleteObject and the nightly dump (rec-4297 narrows the grants by measurement).
  Rationale: measured on Postgres 16 with a Neon-shaped non-superuser owner: when the scoped login creates DuckLake's
  physical tables it owns them, and the owner login's reader, nightly DR dump and maintenance can read them only through
  neon_superuser's pg_read_all_data -- without it all three failed; a CREATE grant also lets the login plant tables and
  functions (the CVE-2018-1058 class). Postgres has no CREATE OR REPLACE privilege; replacing or dropping needs
  ownership. Owner-created tables stay reachable by the scoped login through default privileges, including after owner
  ALTERs. An independent review (2026-10-14) reached the same design. Rejected: granting CREATE; owner membership in the
  scoped role; an owner credential or SET ROLE for the writer (its worst verb becomes everything, Decision 143 cl.1);
  hand-run admin creation on smoke (a human in the deploy path, which Decision 143's rationale rejected). Coverage
  (Decision 181 cl.2): the smoke catalog -- the maintenance-smoke step's ownership report (foreign-owned relations,
  schema owner, scoped CREATE on the metadata schema and public; other schemas are an unenforced residual, the role SQL
  granting none) and the telemetry gate's can_create check from the writer's own
  session, on every deploy; the role SQL and DuckLake's DDL behaviour -- tests/common/test_ducklake_telemetry_catalog_ownership.py,
  run before merge and an unenforced CI residual until rec-4071 gates it; a production telemetry catalog -- an unenforced
  residual until slice 2c (rec-4292); DuckLake-level DROP through metadata DML -- a residual (rec-4297); the owner-login
  reader and a restore without pg_read_all_data -- a residual (rec-4300); the CI path's catalog identity -- the
  all-catalog owner login, smoke-pinned in code only (env pin and refusal, unit-tested) -- an unenforced residual until
  2c's smoke-only migrator login (rec-4292). Reversal conditions (fenced yaml
  reversal-conditions, decision N, review_by 2027-04-30, on_trigger "re-decide via /plan"): owner-identity-changes
  (manual: the catalog owner login is replaced, or a provider move changes ownership semantics -- re-derive clause 1, with
  2c's per-catalog owner role, rec-4292); ducklake-ddl-on-dml-path (manual: a DuckLake version issues Postgres DDL on an
  append, registration or verify path, which tests/common/test_ducklake_telemetry_catalog_ownership.py detects --
  re-decide clause 1 for that path); telemetry-schema-churn (manual: production telemetry schema changes become frequent
  enough that clause 3's admin step blocks delivery -- consider a CI-run migrator login at 2c). Related: 143, 213, 126,
  204, 81, 107, 55, 177, 181, 101. Then append "[Amendment 2026-10-14, Decision N: cl.2's dispatch set gains
  create_telemetry_tables, create-only on the disposable smoke catalog.]" to Decision 143 and "[Amendment 2026-10-14,
  Decision N: cl.3's admin step is carved out for the disposable smoke catalog; the reversal condition
  scoped-login-blocks-verbs fired and was resolved without widening the grant set.]" to Decision 213. Regenerate
  docs/decisions-index.json and write the Decision test. Run step 5.
