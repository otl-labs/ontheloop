schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: telemetry-owner-provisioning
intent: >-
  Telemetry slice 2a-2 fix (rec-4294's trigger, T2.36). The telemetry writer's scoped catalog login is DML-only (Decision
  213 cl.3), but a DuckLake CREATE TABLE also creates a physical Postgres table (ducklake_inlined_data_<table>_<version>),
  so the writer's provision_telemetry failed live with "permission denied for schema ducklake_smoke", masked as a 502.
  This plan keeps the writer DML-only and makes table creation an owner-login step: the CI-invoked, smoke-pinned
  ducklake_maintenance_smoke function gains a create-only verb that the deploy pipeline runs before the telemetry gate,
  the writer's provision_telemetry verifies and seeds only, and a new numbered Decision records one owner per DuckLake
  metadata schema. Telemetry is the learning signal for recursive self-improvement (PROJECT_CONTEXT); this unblocks plan
  3 part 1's live gate and everything queued behind it.
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-telemetry-owner-provisioning.yaml
phase: >-
  T2.36 (telemetry re-lands on DuckLake). Fix-forward for PLAN-telemetry-registration-verbs (#1465); closes no exit
  criterion (T2.36:c1 is production residency, slice 2c, rec-4292).
scope:
- file: src/common/ducklake_telemetry_provision.py
  action: Modify
  purpose: >-
    Split creation from provisioning. (1) NEW create_telemetry_tables(con, *, semantics) -> CreateResult(tables, created),
    the body of one run_telemetry_txn transaction under the OWNER login: the existing half-present-pair refusal and the
    read-only check_existing_tables drift check run first, then ONLY absent target tables are created and partitioned
    (the four event tables with their declared NOT NULL set, the two SCD2 pairs via create_scd2_tables, ops_entity_counters
    via create_control_table), exactly the DDL provision_telemetry_catalog issues today. It writes NO row, never drops,
    never re-ALTERs an existing table, never sets inlining. (2) provision_telemetry_catalog(con, *, semantics) keeps its
    signature and ProvisionResult but issues NO DDL: if any of the nine target tables is absent it raises
    DuckLakeRuntimeError naming the absent tables (never a value) and stating that tables are created only under the
    catalog owner by ducklake_maintenance_smoke's create_telemetry_tables (Decision N), before any write; then the
    half-pair and drift checks; then the unchanged counter seed. ProvisionResult.created is always () from this
    function. (3) NEW SCOPED_LOGIN = "ducklake_telemetry_writer" and ownership_report(con, *, meta_schema, scoped_login)
    -> OwnershipReport(foreign_owned, schema_owner_is_current_user, scoped_create_on_schema, scoped_create_on_public):
    reads pg_catalog through DuckDB's postgres_query on the postgres database DuckLake attaches for the metadata (found via
    duckdb_databases() type 'postgres', telemetry_actions._count_sessions' pattern, never a hard-coded alias):
    foreign_owned counts relations (relkind r, p, S, v, m) in meta_schema whose owner differs from the schema's owner;
    schema_owner_is_current_user compares the schema owner with current_user (so a mis-owned live schema is diagnosable
    rather than a bare count); the two CREATE booleans are has_schema_privilege(scoped_login, meta_schema | 'public',
    'CREATE'). (4) NEW session_can_create(con, *, meta_schema) -> bool: has_schema_privilege(current_user, meta_schema,
    'CREATE') through the same path. meta_schema and scoped_login must match ^[a-z_][a-z0-9_]{0,62}$ before any SQL is
    built (else DuckLakeRuntimeError), because they are interpolated into the postgres_query text. Stays under 500 SLOC.
- file: src/lambdas/ducklake_maintenance_smoke/telemetry_actions.py
  action: Create
  purpose: >-
    action_create_telemetry_tables(event, con) -> dict, the one new verb (Decision N, amending Decision 143 cl.2). It reads
    nothing from the event but the action the handler dispatched (a decoy meta_schema, data_path or table key changes
    nothing). Its meta schema is the function's env pin (DUCKLAKE_META_SCHEMA, default rt.SMOKE_META_SCHEMA, read the way
    the handler reads it) and it refuses with DuckLakeRuntimeError unless that equals rt.SMOKE_META_SCHEMA, so this
    CI-reachable function refuses in code to create tables in another catalog (its Postgres login is still the all-catalog
    owner; a smoke-only migrator login is 2c's, rec-4292). Body: ownership_report for the scoped login FIRST, refusing
    before any DDL unless foreign_owned is 0, schema_owner_is_current_user is true and both CREATE flags are false (so a
    mis-owned live schema never gets split ownership planted in it); then run_telemetry_txn(con, create_telemetry_tables)
    with load_field_semantics(); then ownership_report again, with the same refusal. A refusal raises DuckLakeRuntimeError
    carrying only the four report fields and whether it was the pre- or post-check. EVERYTHING after the env-pin check
    (both ownership reads and the transaction) is wrapped: any exception other than
    DuckLakeRuntimeError is printed with its traceback (CloudWatch only) and re-raised as DuckLakeRuntimeError naming only
    the exception class, so the Function URL never answers a bare 502 and a catalog host or path never reaches the public
    CI log. Response {ok, tables (the nine, sorted), created, ownership {the four fields}, elapsed_ms}.
