  action: Creation and provisioning are split, the creator writes no row, the provisioner issues no DDL, and the new readers build safe SQL.
  command: >-
    bin/venv-python -m pytest tests/common/test_ducklake_telemetry_provision.py::test_create_tables_creates_and_partitions_every_absent_table
    tests/common/test_ducklake_telemetry_provision.py::test_create_tables_event_tables_carry_not_null_and_the_session_day_partition
    tests/common/test_ducklake_telemetry_provision.py::test_create_tables_never_enables_inlining
    tests/common/test_ducklake_telemetry_provision.py::test_create_tables_writes_no_row
    tests/common/test_ducklake_telemetry_provision.py::test_create_tables_issues_no_drop_or_truncate
    tests/common/test_ducklake_telemetry_provision.py::test_create_tables_never_re_alters_existing
    tests/common/test_ducklake_telemetry_provision.py::test_create_tables_refuses_drift_before_any_ddl
    tests/common/test_ducklake_telemetry_provision.py::test_provision_issues_no_ddl
    tests/common/test_ducklake_telemetry_provision.py::test_provision_refuses_absent_tables_before_any_write
    tests/common/test_ducklake_telemetry_provision.py::test_ownership_report_sql_and_fields
    tests/common/test_ducklake_telemetry_provision.py::test_session_can_create_reads_current_user
    tests/common/test_ducklake_telemetry_provision.py::test_identifier_guard_refuses_unsafe_names -q
  expected: Exit 0, every node passes. Red before because the nodes are absent.
  fix_if: A CREATE or ALTER recorded by provision_telemetry_catalog, or a row written by create_telemetry_tables, is the bug this plan exists to prevent; fix the module.
  hermetic: true
  graduation: graduate
  graduation_check_id: telemetry-owner-create-split
  expected_literals: []
- step: 2
  phase: pre-deploy
  action: The maintenance-smoke verb is env-pinned, reads nothing from the event, enforces the single-owner check and never leaks a raw error.
  command: >-
    bin/venv-python -m pytest tests/test_ducklake_maintenance_smoke_handler.py::test_create_telemetry_event_keys_are_never_read
    tests/test_ducklake_maintenance_smoke_handler.py::test_create_telemetry_non_smoke_meta_schema_refuses_before_any_statement
    tests/test_ducklake_maintenance_smoke_handler.py::test_create_telemetry_owner_mismatch_refuses_before_any_ddl
    tests/test_ducklake_maintenance_smoke_handler.py::test_create_telemetry_single_owner_violation_raises_with_report_fields_only
    tests/test_ducklake_maintenance_smoke_handler.py::test_create_telemetry_unmapped_txn_error_names_the_class_only
    tests/test_ducklake_maintenance_smoke_handler.py::test_create_telemetry_ownership_read_failure_names_the_class_only
    tests/test_ducklake_maintenance_smoke_handler.py::test_create_telemetry_response_shape
    tests/test_ducklake_maintenance_smoke_handler.py::test_create_telemetry_handler_returns_500_runtime_never_raises
    tests/test_ducklake_maintenance_smoke_handler.py::test_dispatch_table_is_exactly_the_five_smoke_actions -q
  expected: Exit 0, every node passes. Red before because the nodes are absent.
  fix_if: A decoy meta_schema key reaching a statement means the verb reads the event; remove the read, never weaken the decoy.
  hermetic: true
  graduation: graduate
  graduation_check_id: maintenance-smoke-create-telemetry-verb
  expected_literals: []
- step: 3
  phase: pre-deploy
  action: >-
    The writer's probe reports can_create, absent tables answer a typed 500, and both gates fail loudly on a bad ownership
    report.
  command: >-
    bin/venv-python -m pytest tests/lambdas/ducklake_telemetry_writer/test_telemetry_actions.py::test_telemetry_probe_reports_can_create
    tests/lambdas/ducklake_telemetry_writer/test_handler.py::test_provision_absent_tables_maps_to_500_runtime
    tests/ducklake_neon_smoke_test/test_lambda_telemetry_gates.py::test_probe_can_create_true_fails
    tests/ducklake_neon_smoke_test/test_lambda_telemetry_gates.py::test_probe_can_create_null_fails
    tests/ducklake_neon_smoke_test/test_lambda_telemetry_gates.py::test_registration_vectors_pass_on_a_consistent_writer
    tests/ducklake_neon_smoke_test/test_lambda_maintenance_gates.py::test_create_telemetry_gate_passes_on_a_clean_report
    tests/ducklake_neon_smoke_test/test_lambda_maintenance_gates.py::test_create_telemetry_foreign_owned_fails
    tests/ducklake_neon_smoke_test/test_lambda_maintenance_gates.py::test_create_telemetry_schema_owner_mismatch_fails
    tests/ducklake_neon_smoke_test/test_lambda_maintenance_gates.py::test_create_telemetry_scoped_create_fails
    tests/ducklake_neon_smoke_test/test_lambda_maintenance_gates.py::test_create_telemetry_not_ok_fails
    tests/ducklake_neon_smoke_test/test_main_dispatch.py::test_create_telemetry_flag_dispatches_the_gate -q
  expected: Exit 0, every node passes. Red before because the new nodes are absent.
  fix_if: A gate passing on scoped_create true or can_create null is too weak; tighten the gate, never the fake.
  hermetic: true
  graduation: graduate
  graduation_check_id: telemetry-ownership-gates
  expected_literals: []
- step: 4
  phase: pre-deploy
  action: >-
    The deploy pipeline runs the owner step last and never skipped in maintenance-smoke, the smoke job waits for it, and
    the new run body is in the workflow body baseline.
  command: >-
    bin/venv-python -m pytest tests/verify_ci_workflow/test_ducklake_deploy_map_wiring.py::test_create_telemetry_step_is_last_in_maintenance_smoke_and_not_cancelled
    tests/verify_ci_workflow/test_ducklake_deploy_map_wiring.py::test_smoke_job_waits_for_maintenance_smoke -q &&
    bin/venv-python -c "from scripts.checks.ci_guards.validate_composite_action_shell_bodies import
    validate_composite_action_shell_bodies as v;f=[];v(f);assert not f, f;print('SHELL_BODIES_OK')"
  expected: Exit 0, both nodes pass, then SHELL_BODIES_OK. Red before because the nodes are absent.
  fix_if: A baseline miss means the step has no id or the key differs; key it by the step id, never extend the run body.
  hermetic: true
  graduation: graduate
  graduation_check_id: telemetry-owner-provisioning-wiring
  expected_literals: []
- step: 5
  phase: pre-deploy
  action: Decision N is on main in the pinned shape and annotates the two Decisions it amends.
  command: >-
    bin/venv-python -m pytest tests/checks/decisions/test_owner_provisioning_decision.py::test_decision_entry_and_annotations -q
    && bin/venv-python -m scripts.decisions_index --check
  expected: Exit 0 from both. Red before because the test file is absent.
  fix_if: An entry over 6,144 bytes is compacted, never split into a second Decision; an in-place edit of 143 or 213 text is reverted to a dated annotation (Decision 177).
  hermetic: true
  graduation: waive
  graduation_waiver_reason: >-
    The precedent Decision tests (tests/checks/decisions/test_neon_catalog_tuning_decision.py) run in every tier as unit
    tests, and validate_decisions_index_freshness already guards the index, so a registry copy adds nothing.
  expected_literals: []
- step: 6
  phase: pre-deploy
  action: Packaging includes the new verb and its closure where it runs and nowhere else; bundles import; fences hold.
  command: >-
    bin/venv-python -m pytest tests/lambdas/ducklake_telemetry_writer/test_packaging.py::test_maintenance_smoke_manifest_bundles_the_create_verb_and_its_closure
    tests/lambdas/ducklake_telemetry_writer/test_packaging.py::test_create_verb_module_affects_only_maintenance_smoke
    tests/lambdas/ducklake_telemetry_writer/test_packaging.py::test_new_common_modules_affect_only_the_telemetry_writer -q
    && bin/venv-python -m scripts.lambda_manifest --check-bundles && .venv/bin/lint-imports
  expected: Exit 0 from all three; the maintenance-smoke bundle stages and imports its handler with the new module.
  fix_if: A missing include surfaces as an ImportError in --check-bundles; add the file by name, never a wildcard.
  hermetic: false
  graduation: not-applicable
- step: 7
  phase: pre-deploy
  action: >-
    The real role SQL on Postgres 16 with a Neon-shaped non-superuser owner: owner creates, scoped login verifies, seeds,
    registers and inserts, owner reads, dumps and maintains, single-owner holds, with and without pg_read_all_data.
  command: >-
    test -n "$DUCKLAKE_TEST_PG_ADMIN_DSN" && bin/venv-python -m pytest
    tests/common/test_ducklake_telemetry_catalog_ownership.py -m integration -q -rs 2>&1 | tee
    "${TMPDIR:-/tmp}/ownership_pg.log" && ! grep -Eq "[0-9]+ (skipped|failed|error)" "${TMPDIR:-/tmp}/ownership_pg.log"
    && grep -Eq "[0-9]+ passed" "${TMPDIR:-/tmp}/ownership_pg.log"
  expected: Exit 0 with every node passing and none skipped (a skip is a FAIL, rec-4071); the log goes in the PR description.
  fix_if: >-
    A permission error for the scoped login on any statement other than the negative legs means DuckLake issues DDL on a
    DML path: stop and report it (Decision N's reversal condition ducklake-ddl-on-dml-path), never grant CREATE. Locally,
    start a throwaway PG16 cluster as the postgres OS user (initdb refuses root) on 127.0.0.1 and export the DSN.
  hermetic: false
  graduation: waive
  graduation_waiver_reason: >-
    Needs a Postgres server and network for INSTALL ducklake, which no validate tier provides today; gating it in CI is
    rec-4071's scope (widened 2026-10-14 to this module and its server), and a bespoke job outside scripts.validate would
    break the single-source rule (PROJECT_CONTEXT, Decision 80 cl.3).
- step: 8
  phase: pre-deploy
  action: On a real file-backed DuckLake catalog, create then provision, and the registration race still converges.
  command: >-
    bin/venv-python -m pytest tests/common/test_ducklake_telemetry_registration_integration.py -m integration -q -rs 2>&1 |
    tee "${TMPDIR:-/tmp}/registration_int.log" && ! grep -Eq "[0-9]+ (skipped|failed|error)"
    "${TMPDIR:-/tmp}/registration_int.log" && grep -Eq "[0-9]+ passed" "${TMPDIR:-/tmp}/registration_int.log"
  expected: Exit 0 with every node passing and none skipped (the module's importorskip would otherwise pass vacuously).
  fix_if: Divergent ids fire Decision 200's reversal condition; stop and return the model to /plan.
  hermetic: false
  graduation: waive
  graduation_waiver_reason: Needs network for INSTALL ducklake; CI excludes integration tests (rec-4071).
- step: 10
  phase: pre-deploy
  action: >-
    The contract pins still hold, every contract edit passes the contract-drift gate, and each changed module reaches 100%
    from its own mapped test.
  command: >-
    bin/venv-python -m pytest tests/lambdas/ducklake_telemetry_writer/test_telemetry_actions.py::test_contract_verbs_match_the_dispatched_production_verbs
    tests/checks/contracts/test_telemetry_dimension_contracts.py::test_substrate_rows_name_the_telemetry_writer -q &&
    bin/venv-python -c "from scripts.checks.contracts.validate_contract_drift import validate_contract_drift as v;f=[];v(f);assert
    not f, f;print('CONTRACTS_OK')" && bin/venv-python -m scripts.test_coverage_checker --check-tests --check-coverage
    --files src/common/ducklake_telemetry_provision.py src/lambdas/ducklake_maintenance_smoke/telemetry_actions.py
    src/lambdas/ducklake_maintenance_smoke/handler.py src/lambdas/ducklake_telemetry_writer/telemetry_actions.py
  expected: Both pinned nodes pass, CONTRACTS_OK, then exit 0 from the coverage check.
  fix_if: A storage-substrate edit without a new amendment_log entry fails the Class D leg; add it. Never add a coverage_baseline.yaml entry (Decision 159).
  hermetic: false
  graduation: waive
  graduation_waiver_reason: >-
    Every part duplicates a standing guard (the two nodes are already graduated or run in every tier, validate_contract_drift
    runs in the pre and full tiers, and the full tier checks per-file coverage), so a standing copy adds nothing.
- step: 11
  phase: pre-deploy
  action: Fast tier, then the full tier before handoff.
  command: bin/venv-python -m scripts.validate --pre && bin/venv-python -m scripts.validate
  expected: Exit 0 on a completed full run; a timeout is not a pass (handoff_policy).
  fix_if: Fix the named check at its root cause (Decision 55); never raise a budget or skip a check.
  hermetic: false
  graduation: not-applicable
- step: 13
  phase: post-deploy
  action: >-
    The governed deploy of the merge commit succeeded, each job included. Read with mcp__github__actions_list
    (list_workflow_runs, workflow deploy-ducklake-lambdas.yml, head_sha $MERGE_SHA) then list_workflow_jobs, written to
    $DEPLOY_JOBS_JSON.
  command: >-
    test -s "$DEPLOY_JOBS_JSON" && bin/venv-python -c "import json,os;j=json.load(open(os.environ['DEPLOY_JOBS_JSON']));jobs={x['name']:x.get('conclusion')
    for x in (j.get('jobs') if isinstance(j,dict) else j)};print(jobs);want=['deploy-maintenance','maintenance-smoke','reconcile-gate','deploy-serving','smoke'];assert
    all(any(n.startswith(w) and c=='success' for n,c in jobs.items()) for w in want),jobs;print('DEPLOY_OK')"
  expected: Every named job concluded success (a skipped job fails this step), then DEPLOY_OK.
  fix_if: >-
    A failed job is this plan's to root-cause and fix forward, never a re-run to green (Decision 55). A drift refusal on a
    pre-existing smoke telemetry table is an admin repair (Decision 204 cl.2), reported to Benjamin.
    schema_owner_is_current_user false means the live ducklake_smoke schema is not owned by the owner login: stop and
    report it, never reassign owners from code. scoped_create_on_public true means the provider grants CREATE on public:
    stop and report it to Benjamin; the remedy is a role SQL REVOKE CREATE ON SCHEMA public FROM PUBLIC with an admin
    re-run of provision_telemetry_login (always-ask), filed as a rec.
  hermetic: false
  graduation: not-applicable
- step: 14
  phase: post-deploy
  action: >-
    The owner step and the telemetry gate both passed live. Save the maintenance-smoke and smoke job logs
    (mcp__github__get_job_logs) to $MAINT_LOG_FILE and $SMOKE_LOG_FILE.
  command: >-
    test -s "$MAINT_LOG_FILE" && test -s "$SMOKE_LOG_FILE" && grep -q "MAINTENANCE_CREATE_TELEMETRY OK" "$MAINT_LOG_FILE" &&
    grep -q "foreign_owned=0 scoped_create=false" "$MAINT_LOG_FILE" && grep -q TELEMETRY_PROVISION_OK "$SMOKE_LOG_FILE" &&
    grep -q TELEMETRY_PROBE_OK "$SMOKE_LOG_FILE" && ! grep -q "provision_telemetry status=502" "$SMOKE_LOG_FILE" && echo
    OWNER_PROVISIONING_LIVE_OK
  expected: OWNER_PROVISIONING_LIVE_OK. This is rec-4294's acceptance evidence.
  fix_if: >-
    A missing PROVISION_OK with "telemetry tables absent" means the owner step did not run first; check the job graph. Any
    other miss is a deploy or vector fault to root-cause.
  hermetic: false
  graduation: not-applicable
- step: 15
  phase: post-deploy
  action: rec-4294's own acceptance command, run independently from this session as PlatformDev (URL-only invoke).
  command: >-
    DUCKLAKE_TELEMETRY_WRITER_URL=$(aws ssm get-parameter --profile agent_platform --region eu-west-2 --name
    /agent-platform/ducklake/telemetry_writer_url --query Parameter.Value --output text) AWS_PROFILE=agent_platform
    bin/venv-python -m scripts.ducklake_neon_smoke_test --lambda-telemetry 2>&1 | tee "${TMPDIR:-/tmp}/sm.log" | grep -q
    TELEMETRY_PROVISION_OK && ! grep -q "provision_telemetry status=502" "${TMPDIR:-/tmp}/sm.log" && echo REC_4294_ACCEPTANCE_OK
  expected: REC_4294_ACCEPTANCE_OK.
  fix_if: An AccessDenied on the URL call is a grant fault for the direct-invoke thread; never widen locally.
  hermetic: false
  graduation: not-applicable
- step: 16
  phase: post-deploy
  action: >-
    rec-4294 is closed through the escape-classified manual route (no Resolves trailer; see execution_steps), and the
    closure reads back.
  command: mcp__ducklake-reads__recs_by_ids ids=rec-4294
  expected: >-
    status closed, a closure_artifact naming a test this merge touched, the merge sha as the fix sha, and a resolution
    that quotes step 14's and step 15's markers.
  fix_if: >-
    A ClosureArtifactRequired or acceptance-verdict refusal means the route was not followed; repair the acceptance first
    (never weaken it, Decision 181) and re-run the census and evaluate in the merge worktree.
  hermetic: false
  graduation: not-applicable
