execution_steps:
- >-
  RULE S-1 (spike pins, observed on both host paths): HARNESS_INTERRUPT_SENTINELS = ("[Request interrupted by user]",
  "[Request interrupted by user for tool use]"), whole-text match; HARNESS_DENIAL_PREFIXES = () by evidence (the
  "doesn't want to proceed" text accompanies a user interrupt; a host deny's text is the host's own); API_ERROR_FLAG_KEYS
  = ("isApiErrorMessage",); TOOL_DENIAL_OUTCOMES = {"permission-rule": "blocked", "user-rejected": "interrupted"}
  keyed on the tool_result record's top-level toolDenialKind (an unknown kind is counted in
  unknown_tool_denial_kind and falls through). Still unobserved and not pinned: the cloud UI's own deny text,
  rate-limit and overloaded error kinds.
- >-
  RULE K-1 (forks, rec-4149): a root-stream record is INHERITED iff it carries a forkedFrom field (/branch), or it lies
  before the first attachment of the LAST SessionStart:fork hook group in the root file (--fork-session; a group is the
  existing consecutive hook-attachment notion; "last" keeps a fork of a fork from treating the child's own records as
  inherited). classify returns "inherited" for them (counted in inherited_records) and _build_stream leaves them out
  of Stream.recs, so no consumer of stream.recs sees them (sessions.py's open-row ordinal at :137 and _branch at
  :102-107 included); they build no row of any kind, are excluded from session_pin and from project_ref_pin, and are
  never parsed for turns, tools, spawns or hooks. No ref or
  session grammar changes (envelope R10 untouched). A /branch fork with no own SessionStart attachment has no pin and
  defers (declared: /branch is not dispatchable from the cloud UI). Prefix purity (Fable consult 4, option A):
  inherited_lines is computed over the lines the parse read (read_lines(data, limit)), never the whole current file,
  so parse(tree, c, final) is a function of the prefix c (R2-2 memo keys, R2-4 prior recomputation). The
  --fork-session boundary is not prefix-stable: a pass over a fork file not yet holding its own SessionStart:fork
  attachment cannot tell the copied head from own records; it treats the copies as own, pins on the source's earliest
  timestamp and keys their rows on copied uuids (F-1's neither-signal case). The first later pass holding the boundary
  halts in check_pins (CursorError, pin mismatch: session_started_at_ms, the pin moved later) before any batch is
  built: never re-pinned, never emitted. The producer cannot detect this at the earlier pass (no fork signal precedes
  the attachment); the P-C fork obligation (closeout) prevents it. A nested fork is the same hazard for a pass between
  the copied parent group and the child's own group. Cursor format 2 carries no fork field.
  test_fork_boundary_arriving_after_a_pass_halts (shaped like test_earlier_record_after_pin_halts), for both
  --fork-session goldens: pass 1 at cut fork_boundary - 1 (nested: between the copied parent group and the own group)
  emits a row keyed on a copied uuid and pins on the earliest timestamp among the prefix's non-inherited records (the
  copied head's for fork_session_copied_head; at or after the copied parent group for fork_session_nested); pass 2 at
  full length with that cursor raises CursorError (not PinOrderError) matching session_started_at_ms; a fresh full
  pass pins later and shares no uuid-keyed key with pass 1 (both emit the root open marker <sid>#0/open, whose
  event_id differs because its event_timestamp is the pin). test_transcript.py and test_streams.py assert prefix
  purity: over fork_session_copied_head's pre-boundary prefix inherited_lines returns no line and parse_tree counts
  inherited_records 0; over fork_session_nested's it inherits exactly the lines before the copied parent group; over
  either full file both see the whole copied head and session_pin moves later.
- >-
  RULE K-3 (synthetic records): an assistant record with isApiErrorMessage true is an assistant record for turn
  structure, last_assistant, open-row due-ness and the close outcome, but is never grouped into a response, so it
  yields no model_call and no response_count; its text becomes a purpose system, origin harness transcript row whose
  observation_ref is the turn's entity ref (turn_entity_ref, as meta and companion rows), never its message.id, which
  no model_call carries. Any
  other assistant record with message.model "<synthetic>" is classified other (counted in
  synthetic_assistant_records). _first_model skips both kinds and, for the open row, reads only records within the
  open bound (the first closed assistant-bearing turn's lines, as _branch does), so model_primary is absent when that
  turn holds only synthetic or API-error records and the open row never depends on the finalize point. The agent
  row's model keeps the unbounded read (a background child's later model is the declared cut_content_divergence
  class). test_api_error_first_turn_keeps_a_stable_open_row: a session whose first assistant-bearing turn holds only
  an API-error record is finalized, then resumed (RESUME tail) with a real reply; the open row is emitted once,
  without model_primary, and cut_content_divergence is 0.
- >-
  RULE K-4 (tool outcomes): outcome_of precedence is blocked (toolDenialKind permission-rule, or a PreToolUse exit-2
  hook block, or a HARNESS_DENIAL_PREFIXES prefix, a check kept and inert while the tuple is empty) > interrupted
  (toolDenialKind user-rejected, or toolUseResult.interrupted true, or sentinel text) > error (is_error) > success.
  _result_meta adds tool_denial_kind (top-level toolDenialKind) and permission_decision_source (permissionDecision.source),
  each present-as-null like its siblings: the value when it is a string fully matching [a-z][a-z0-9_-]{0,63}, else
  null (identifiers only). The synthetic close's metadata stays {synthetic: true}. The built-in
  "<tool_use_error>Blocked:" result carries no kind and stays error (declared).
- >-
  R2 RULES. R2-1: the cursor records finalize_cuts, an ordered list of per-file line-position maps; a finalize pass
  appends the pass's end positions E unless the last recorded cut equals E. R2-2: emit(cuts, L, f) is the union, in
  order, of the rows built ONCE per distinct (limits, final) key from parse(tree, c, final=True) for each c in cuts,
  then from parse(tree, L, f) (skipped when it equals the last cut's key), keyed by (table, external_ref); a key built
  by two distinct parses with different content increments cut_content_divergence once and keeps the first. R2-3: current = emit(cuts_after_this_pass, E, session_final). R2-4: prior = emit(base.finalize_cuts,
  base.lines_consumed, base.finalized) when the base cursor matches (producer, PARSER_VERSION), else empty (a reset:
  everything is re-emitted at the new version, including earlier finalizations' close rows, because reset keeps
  finalize_cuts). R2-5: fresh = rows of current whose key is not in prior; a key in both with different content
  increments prior_content_divergence and is not re-sent (defence in depth: it counts a row first emitted by a
  non-final, non-cut parse whose content later differs; no known shape produces one). R2-6: next_cursor carries lines_consumed E, finalized =
  session_final (not sticky), finalize_cuts, the merged sidecar pins and the four pins. Parses are memoised per
  (limits, final) within a pass and one Sidecars instance serves every build of the pass; parse_passes counts distinct
  parse_tree calls and sidecar_reads counts tree.sidecar and tree.sidecar_chunks calls. R2-7 (divergence test):
  test_child_growth_after_finalize_counts_divergence_and_resends_nothing finalizes while a background child's last
  response is incomplete, then grows that response with a later record of the same message.id, runs Stop then
  finalize, and asserts: cut_content_divergence equals the number of keys whose content changed (the model_call), each
  counted once; prior_content_divergence is 0; no row under a changed key is re-sent. The child's response at the
  cut ends in a tool_use whose result lands after the cut, so the test also asserts: the cut-time pass emits the
  synthetic tool_call close (outcome interrupted, output_capture no_result) keyed on the tool_use record, the child's
  agent_open and no agent_close; the later pass emits the result's close (outcome success) and the grown turn's
  turn_close under new keys; reanchored_close:turn == 1 and reanchored_close:tool_call == 1; each entity's latest close
  by (event_timestamp, source_ordinal) equals the full final parse's close. Its second phase finalizes the same tree
  truncated at the cut twice: one close per entity, both reanchored counters 0. R2-8 (declared re-anchor class, Fable
  consult 3 option A): a background sub-agent still running at its root's finalization is closed by the cut parse
  (streams.py: closing = final or spawn.complete); when it keeps writing, its trailing turn and each tool_call that had
  no result at the cut gain a second close under a later key. The cut-time close is superseded, never retracted.
  reanchored_close:<observation_type> counts the entities with more than one close row in the pass's emission set
  (current), so it counts only once the second close exists. The root case (a tool_use pending at a finalization whose
  result lands in the same turn because no SessionStart:resume record split it) counts under the same keys:
  test_root_result_after_a_finalize_counts_reanchor asserts reanchored_close:tool_call == 1 and
  reanchored_close:turn == 1 (the turn grows past the result) without the resume attachment, and both 0 with one
  interposed (results_outside_turn == 1, the synthetic close stays the only close). VP 1's
  schedule node also asserts the latest-close property for every entity with more than one close row. _repin's emitted-prefix check uses emit(cursor.finalize_cuts, cursor.lines_consumed, cursor.finalized), so a row emitted at any recorded finalization blocks a re-pin.
- >-
  OPEN-ROW RULE: sessions._open_bound returns due only when a closed turn holding an assistant record exists; the
  finalize fallback is removed (its content would depend on the finalize point: model_primary and branch).
- >-
  DEFERRAL RULE D-1: a stream is due iff its open row is due (OPEN-ROW RULE). Placement is record_turn._build_all
  only: it drops every built row of a stream sessions.stream_due rejects, matching on session_ref (observations,
  transcripts, and the spawn's agent_open and agent_close rows, which carry the child's session_ref) or on entity_ref
  for telemetry_sessions rows (build_sessions already skips non-due streams); the four builders are unchanged by D-1.
  test_child_without_reply_defers_its_rows: a spawned child holding only a prompt yields no row for that child in any
  table (agent rows included) at finalize, and all of them once it replies. Due-ness is monotone in lines, so deferral keeps incremental capture equal to one
  full parse. Rows previously emitted at once outside any turn (SessionStart hook process_events) now wait for the first
  closed assistant turn.
- >-
  CLOSE RULES. C-1: a close row is built only in a parse with final=True, for the ROOT stream only, and only when the
  root open row is due in that parse; two finalizations with no new root uuid record between them share one anchor and
  key, so the second writes no new close row. C-2: its anchor is the last root-stream record within the parse's line limit that
  has a non-empty uuid and a parseable timestamp (any record type); external_ref role_ref(uuid, 0, "close"),
  entity_ref the root session_ref, event_kind close, event_timestamp and source_ordinal the anchor's. C-3: outcome is
  cancelled iff, for the root stream's last turn T, T's last prompt-kind record's text is a sentinel, or T's last
  tool_result has toolDenialKind user-rejected or toolUseResult.interrupted true, or T holds a tool_use with no in-span
  result, or T's last assistant record has isAbortedMidStream true; else failed iff T's last assistant record has
  isApiErrorMessage true, with failure_reason that record's top-level error kind when it fully matches
  [a-z][a-z0-9_]{0,63} (else omitted, never text); else success (a host deny that ends in end_turn is success). C-4: no close row for a sub-agent stream (its lifecycle
  is telemetry_agents).
- >-
  GATE RULES. G-1: only a matched tool_result (use.result) of a tool_use named Bash in a closed turn is scanned. G-2:
  the scanned text is the persisted sidecar's text when persisted and readable within the cap, else the visible
  tool_result text; an omitted-oversize or unavailable sidecar is not scanned and increments gate_scan_unavailable.
  G-3: gate markers count only in the text's last 200 lines; pre-commit failure blocks count anywhere. G-4: one row per
  distinct (source, signature) in first-seen order, n its 1-based ordinal: observation_type process_event, event_kind
  point, name "<source>:<signature>", severity error, external_ref and entity_ref gate_event_ref(result uuid, result
  block, n), parent_observation_ref the tool_use id, event_timestamp and source_ordinal the tool_result record's,
  metadata {marker_version: 1, tool_use_id}. G-5: the scanned text is Output.text (the scrubbed full output the shared
  Sidecars already holds) or the visible tool_result text, never a second sidecar read; markers carry identifiers
  only, so the scrub cannot change them, and no marker text is stored beyond the row's name. G-6: only a Bash
  tool_use whose input command contains one of GATE_COMMAND_TOKENS ("scripts.validate", "scripts/validate.py",
  "pre-commit", "pre_commit", "git commit") is scanned, so most non-gate commands are never scanned. The match is a
  substring anywhere in the command, so a command that prints a saved gate log (cat /tmp/pre-commit.log) is scanned
  and mints events for the markers that log carries (declared residual noise).
- >-
  AGENT ERROR SCRUB (same defect class as rec-4151): sessions._agent_row's error is scrub_text(text).text[:2000],
  scrubbing BEFORE the 2000-character cut, so a credential straddling the cut is never stored as a fragment.
- >-
  HOOK-NAME RULES. H-1: tokens are the command split on whitespace with surrounding single or double quotes stripped
  from each token; the first token matching [^\s]+\.(py|sh)$ is the script. H-2: its stem gives hook:<stem> only if the
  stem fully matches markers.SIGNATURE_PATTERN; otherwise, or with no script token, hookName with ":" replaced by "."
  gives hook:<name> if that fully matches; H-3: otherwise hook:unknown. rec-4151: stderr_head is
  scrub_text(stderr).text[:512].
- >-
  PIN RULES. P-1: candidates are root-stream records of type attachment whose attachment type starts with "hook_" and
  whose hookEvent is SessionStart, in line order. P-2: a candidate pins iff its command's tokens (H-1 splitting) hold a
  script whose stem is session_start_log_turn and exactly one token of the form --project-ref=<ref>, ref fully matching
  [A-Za-z0-9][A-Za-z0-9._:/-]{0,199}. P-3: the earliest pinning candidate wins; later ones never re-pin. P-4: no
  pinning candidate returns None (the caller defers, capture-k2 (c)).
- >-
