schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: telemetry-parser-v3
intent: >-
  Ship the Claude Code turn-capture producer's single PARSER_VERSION 3 bump (telemetry slice 3b plan P-B, rec-4026):
  fix the resume dropped-last-turn defect, emit one telemetry_sessions close row per finalization with a
  transcript-derived outcome, take the project_ref pin from the transcript, record gate and pre-commit failures from the
  structured markers P-A added, fix hook names, scrub before truncating, share sidecar reads, and declare the v3 turn
  surface in the Class A contracts. All producer output changes land in this one bump before the first smoke write, so
  nothing is re-parsed later and the feedback loop's per-version comparisons start clean. Deploy-inert: no hook, no
  network, no writer change.
plan_type: IMPLEMENTATION
implementation_declared: true
verification_tier: V2
plan_path: docs/plans/PLAN-telemetry-parser-v3.yaml
phase: >-
  T3.20 (agent-turn telemetry capture), slice 3b plan P-B of three (Benjamin, 2026-10-12). Closes T3.20:c4 (the
  turn-surface contracts carry the realized turn/tool_call field set and the v3 producer conforms to every enforced
  rule, proven through the local kernel gate). c1, c2 and c8 stay open for P-C (hooks and transport), rec-4026 its
  carrier. Precondition: PLAN-gate-failure-markers (P-A) is merged and implemented on main.
closes_criteria:
- T3.20:c4
