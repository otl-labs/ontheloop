acceptance_criteria:
- >-
  Schedules over every golden case: a RESUME schedule finalizes the tree with its root file cut at line c, then
  appends a resume tail to that prefix (a SessionStart:resume hook attachment, a prompt and a reply), runs Stop, then
  finalizes; a CONTINUED schedule finalizes at root line c, then lets the original root file continue past c with no
  resume record, runs Stop, then finalizes; c ranges over every root line position at or after fork_boundary(files)
  (0 for a root holding no SessionStart:fork group; earlier cuts are rule K-1's halting case), sub-agent files at full
  length. In every schedule no (table, external_ref) is emitted twice, the
  union of emissions equals the emission set recomputed from scratch from the recorded cuts (keys and content), no row
  of one full final parse of the last tree is missing, and prior_content_divergence stays zero. In a RESUME schedule
  the union contains every row of that full parse, its only extra rows are earlier finalizations' close rows, and
  cut_content_divergence and both reanchored_close counters stay zero. A CONTINUED schedule is the root instance of
  the declared classes (R2-8): a cut inside a response counts its model_call in cut_content_divergence, and a turn or
  tool_call pending at the cut gains a second close. A background child that grows after a finalize counts each changed key
  once in cut_content_divergence and re-sends none of them; relative to one full final parse its further extra rows
  are the cut-time closes of its trailing turn and of each tool_call that had no result at the cut (synthetic,
  interrupted), under their earlier keys, counted per entity in reanchored_close:turn and reanchored_close:tool_call.
  In every schedule, each entity's latest close by (event_timestamp, source_ordinal) equals its close in one full final
  parse.
- >-
  Each finalization of a root session with a due open row emits at most one new close row (none when an earlier
  finalization already wrote the same anchor), anchored on the last root-stream record carrying a uuid and a
  parseable timestamp at that finalize, with outcome cancelled when its last turn was interrupted and success otherwise
  (failed when the last turn ends in an API-error record, with failure_reason its error kind). A stream with no closed
  turn holding an assistant record emits no
  row in any table (its spawn's telemetry_agents rows included) until it has one, so no row ever lacks its session's
  open row.
- >-
  A forked tree emits rows only for its own records: copied records (forkedFrom, or before the last SessionStart:fork
  hook group) emit nothing and take no part in either pin, so a fork captured from its first pass holding that
  boundary never collides with its source's event ids (rec-4149); a pass that ran before the boundary existed makes
  the next pass halt with CursorError before any batch is built (K-1). Interrupts, denials and API errors map to the observed outcomes: user-rejected or a sentinel or an aborted
  stream -> cancelled/interrupted, permission-rule -> blocked, isApiErrorMessage -> failed, with no model_call for a
  synthetic record.
- >-
  project_ref_pin returns the ref from the earliest SessionStart capture-hook attachment carrying exactly one pin token,
  and None otherwise; record_turn's output is unchanged for a given project_ref.
- >-
  A Bash tool_call that runs a gate (G-6) and whose full output carries GATE-FAILURE v1 lines in its last 200 lines,
  or failing pre-commit
  blocks anywhere, emits one process_event per distinct (source, signature), named gate:<check> or precommit:<hook>,
  severity error, parented to that tool_call; nothing else does.
- >-
  hook_name strips quotes, falls back to hookName when a script stem fails the contract's signature class, and to
  hook:unknown last; every name it can produce passes the contract pattern read from telemetry_observations.yaml.
- >-
  Hook stderr is scrubbed before the 512-character cut (rec-4151); a record_turn pass reads each sidecar at most once
  and calls parse_tree once per distinct (limits, final) key, at most 2 + len(base.finalize_cuts) times (rec-4152).
- >-
  parser_versions.yaml records v3 with the recomputed golden digest and signature_prefixes [hook, gate, precommit];
  the golden corpus's emitted process_event prefixes equal that set; every v3 golden row loads through the local
  DuckLake kernel gate with every FK resolving (T3.20:c4).
- >-
  The four contracts carry the v3 governance notes named in scope, each at or under 500 effective lines; the rec-4147
  and rec-4149 acceptance nodes pass.
verification_plan:
- step: 1
  phase: pre-deploy
  action: >-
    Run the resume defect's red-to-green node: the RESUME and CONTINUED schedules (acceptance_criteria[0]) over every
    golden case (rules R2-1..R2-6, R2-8).
  command: >-
    bin/venv-python -m pytest tests/turn_capture/test_record_turn.py::test_finalize_resume_schedules_emit_each_row_once -q
  expected: >-
    Exit 0, 1 passed. Red before: the node is absent on the plan-only tree (pytest exit 4, target_absent); on main's
    code it fails with the missing resumed-turn rows (the sticky finalized flag, record_turn.py:149).
  fix_if: >-
    A key emitted twice: the prior set is not built from the base cursor's cuts. Missing rows: finalized is still sticky
    or the new cut was not recorded. prior_content_divergence non-zero: a row first emitted by a non-final, non-cut
    parse changed (R2-5). Divergence or a re-anchor on a RESUME schedule: an open row still depends on the finalize
    point (sessions._open_bound), or the resume attachment does not end the pre-cut turn. A latest-close mismatch on a
