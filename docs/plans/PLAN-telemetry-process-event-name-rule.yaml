schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: telemetry-process-event-name-rule
intent: >-
  Enforce at write time the telemetry_observations process_event name grammar '<source>:<signature>' (Decision 210
  cl.1) through a conditional pattern rule kind, pattern_when, in the one shared row-rules engine. The read-side friction
  rules match these signatures exactly and the journal is append-only, so a malformed signature written today would
  escape friction classification forever. With the rule live, the write rejects it loudly and writes nothing.
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-telemetry-process-event-name-rule.yaml
implementation_declared: true
phase: >-
  T2.36 (telemetry re-lands on DuckLake) -- Decision 210 cl.1 row-local rule for telemetry_observations.name. Resolves
  rec-4176 (the residual owner the C9-C13 amendment declared on name, Decision 181 cl.2) and bundles rec-4164; closes NO
  exit criterion. Builds on ops plan B (#1413, 081f844d), the C9-C13 amendment (#1416, e081e49e) and telemetry 2a-2
  plan 1's table registration (#1419, de36454a), all on main.
scope:
- file: src/row_rules/rules.py
  action: Modify
  purpose: >-
    New column key pattern_when: a non-empty list of {when, pattern} entries. `when` uses the existing required_when
    condition grammar (a non-empty mapping of column to a non-empty value list, a conjunction of IN tests); `pattern` is a
    regex. A non-None value must re.fullmatch the pattern of every entry whose condition the row matches; a non-str value
    under a matching entry violates; None passes (NULL stays not_null/required_when's concern); no matching entry, no
    check. RowRuleError(table, "pattern_when", column) names no value. Not dateable: pattern_when stays out of
    _DATEABLE_KINDS, so an exclude_before naming it fails closed, as for required_when. from_projection fails closed on
    a malformed shape: not a list, empty, an entry that is not a mapping or whose keys are not exactly when and pattern,
    a bad condition, a bad regex. The shared condition parser also fails closed, for pattern_when, required_when and
    null_or_zero_when alike, when a condition names a column the projection lacks or a value outside that column's
    declared accepted_values (a typo would otherwise be a silently dead rule; at planning every live telemetry condition
    passes this check and no ops projection declares a condition). The existing required_when fail-closed test's message
    match keeps holding: the error names the rule key either way. rec-4164: pattern, array_element_format and pattern_when
    regexes compile once in from_projection and check_row uses the compiled objects. Still stdlib only, naming no table,
    column or value of any contract; the module docstring's value-rule list gains pattern_when.
- file: scripts/field_semantics_event_projection.py
  action: Modify
  purpose: >-
    pattern_when joins _COLUMN_RULE_KEYS, so a telemetry contract's dq_intent.pattern_when passes through verbatim into
    the projected column (and _KNOWN_DQ_KEYS accepts it). The ops SCD2 projection (scripts/field_semantics_rule_projection.py)
    and the ops census vocabulary are untouched and stay fail-closed on the key.
- file: docs/contracts/telemetry_observations.yaml
  action: Modify
  purpose: >-
    Field name only. dq_intent gains pattern_when: [{when: {observation_type: [process_event]}, pattern:
    '^(hook|gate|precommit):[A-Za-z0-9_][A-Za-z0-9_.-]{0,199}$'}] beside the existing required_when. In semantics the
    C9-C13 RESIDUAL sentence (not yet write-enforced; owner rec-4176) is replaced by one stating the grammar is
    write-enforced by dq_intent.pattern_when (Decision 210 cl.1): the source is hook, gate or precommit, and a new source
    ships as a contract amendment plus a writer deploy before any producer emits it (cl.4). One field-level amendment_log
    entry (governance_note_add, semantic_break true -- the telemetry_transcripts output_sha256 2026-10-04 precedent),
    dated the implementation day, recording the operator's approval (2026-10-06); no contract_version bump; ratified_at
    and ratified_via unchanged. The file is at 440 of 500 effective lines, so no compaction is needed.
- file: config/lambda/ducklake/field_semantics.yaml
  action: Modify
  purpose: >-
    Regenerated by bin/venv-python -m scripts.schema_to_field_semantics, never hand-edited. telemetry_observations is
    registered there since #1419, so exactly ops_tables.telemetry_observations.columns.name gains pattern_when; every
    other table's bytes are identical.
- file: tests/row_rules/test_rules.py
  action: Modify
  purpose: >-
    Mirror test (Decision 131): test_pattern_when_binds_only_where_its_condition_matches,
    test_pattern_when_fails_closed_on_malformed_projection, test_conditions_must_name_known_columns_and_values and
    test_patterns_are_compiled_once (rec-4164's node, at the path the engine moved to; behavioural: with the module's
    re.compile/re.fullmatch patched to raise, check_row still evaluates pattern, array_element_format and pattern_when).
- file: tests/test_field_semantics_event_projection.py
  action: Modify
  purpose: >-
    New node test_pattern_when_projects_verbatim (a tmp contract fixture, the test_unknown_rule_key_fails_closed
    precedent). The file is at 449 SLOC; it stays under 500.
- file: tests/telemetry/test_contract_lifecycle_friction.py
  action: Modify
  purpose: >-
    test_severity_closed_and_name_required_on_process_event: the four
    assertions pinning the C11 residual ("not yet write-enforced", "pattern rule is unconditional", "decision 181 cl.2"
    with rec-4176) are re-pinned to the resolved state -- name.dq_intent carries pattern_when scoped to process_event and
    semantics says the grammar is write-enforced. A correction that closes the residual this plan owns, never a
    weakening (implement-scope-boundary CONTENT rule); every other assertion stays.
- file: tests/telemetry/test_process_event_name_rule.py
  action: Create
  purpose: >-
    Fast tier (no duckdb). No test restates the regex (Decision 210 cl.3): each reads it from the contract, and its
    content is pinned by behaviour through the shared accept/reject vectors.
    test_contract_declares_the_name_grammar (structure: exactly one entry, when == {observation_type: [process_event]},
    the pattern compiles and is anchored); test_shipped_projection_carries_the_rule
    (config/lambda/ducklake/field_semantics.yaml's telemetry_observations name column equals the contract's rule);
    test_every_emitted_v2_name_conforms (every process_event name in the golden corpus's expected rows);
    test_registered_hooks_and_planned_sources_conform (hook_name over every command registered in .claude/settings.json
    and over '<HookEvent>:<tool>' forms including an MCP tool name with a hyphenated server, plus every registered gate
    check name and .pre-commit-config.yaml hook id, the sources rec-4172 will emit); test_rule_binds_process_event_rows_only
    (RowRules built from the real projected columns: a tool_call named Bash or mcp__github__create_pull_request, a step
    title with spaces and a NULL-named turn pass; every reject vector on a process_event raises RowRuleError rule
    pattern_when and every accept vector passes); test_no_python_file_restates_the_rule (reads the pattern from the
    contract at test time and finds it in no *.py file under src, scripts or tests).
- file: tests/fixtures/process_event_name_vectors.py
  action: Create
  purpose: >-
    The shared accept/reject vectors, data only, imported by both new test modules (a cross-test import is banned).
    Accept: hook:unknown, hook:never_on_main, hook:PreToolUse.mcp__github-full__create_pull_request,
    gate:validate_scope_boundary, precommit:ruff-format, a 200-character signature. Reject: never_on_main, Bash, Hook:x,
    hook:, hook:a b, hook:x:y, hook:.foo, hooks:x, gate:x/y, edit:suppression_added, a non-ASCII signature, a
    201-character signature, a trailing newline.
- file: tests/telemetry/test_name_rule_ducklake_integration.py
  action: Create
  purpose: >-
    pytest.mark.integration on a genuine local DuckLake catalog (tests/fixtures/turn_capture_ducklake helpers, which fail
    and never skip when the extension is unavailable, rec-4071): a golden hook case recorded by the v2 producer lands
    with the rule live; in a fresh catalog the same batch with one process_event name broken raises GateError caused by
    RowRuleError rule pattern_when and leaves telemetry_observations at zero rows and ducklake_list_files unchanged
    (nothing from the batch written); every stored
    process_event name passes DuckDB's regexp_full_match with the projected regex, and every shared vector
    (tests/fixtures/process_event_name_vectors.py) gets the same verdict from DuckDB as from Python re (the regex stays
    portable to a later DuckDB-side census).
- file: config/agent/verification_registry/entries/telemetry-name-rule-engine.yaml
  action: Create
  purpose: Graduated shard for VP step 1 (check_id telemetry-name-rule-engine).
- file: config/agent/verification_registry/entries/telemetry-name-rule-contract.yaml
  action: Create
  purpose: Graduated shard for VP step 2 (check_id telemetry-name-rule-contract).
bundled_recommendations:
- rec-4176
- rec-4164
followon_recs: []
infrastructure_dependencies: []
acceptance_criteria:
- >-
  A process_event row whose name breaks the grammar (no source, an unknown or upper-case source, an empty, over-length or
  whitespace-bearing signature, a second colon) is rejected with RowRuleError rule pattern_when naming
  telemetry_observations.name, and on a real local DuckLake the whole batch writes nothing; rows of every other
  observation_type keep their names unconstrained (a tool_call named Bash lands).
- >-
  The rule is declared once, in telemetry_observations.yaml's name dq_intent, and reaches the kernel and the shipped
  field_semantics.yaml only through the projection; no producer, writer or test restates the regex, and the C11
  residual on name is closed.
- >-
  Every name the v2 producer emits for the golden corpus and for every hook registered in .claude/settings.json, every
  registered gate check name and every pre-commit hook id fits the grammar.
- >-
  The engine fails closed on every malformed pattern_when projection, including an exclude_before naming it, and on any
  condition naming an unknown column or value; each regex compiles once (rec-4164).
- >-
  The merge deploys the five DuckLake Lambdas through the governed channel only after the operator's explicit approval;
  after it the deploy records name the merge commit and the ops row-rule and read-your-write probes pass on the new
  bundle.
- rec-4176 and rec-4164 close through the squash commit's Resolves trailer.
verification_plan:
- step: 1
  phase: pre-deploy
  action: The engine's conditional pattern binds only where its condition holds, conditions are validated, malformed shapes fail closed, and regexes compile once.
  command: >-
    bin/venv-python -m pytest tests/row_rules/test_rules.py::test_pattern_when_binds_only_where_its_condition_matches
    tests/row_rules/test_rules.py::test_pattern_when_fails_closed_on_malformed_projection
    tests/row_rules/test_rules.py::test_conditions_must_name_known_columns_and_values
    tests/row_rules/test_rules.py::test_patterns_are_compiled_once -q
  expected: Exit 0, 4 passed. Red before, because the nodes do not exist.
  expected_literals: []
  fix_if: A miss on the scoping or fail-closed legs -> fix the engine, never loosen the test.
  hermetic: true
  graduation: graduate
  graduation_check_id: telemetry-name-rule-engine
- step: 2
  phase: pre-deploy
  action: The contract declares the rule, the shipped projection carries it, every v2 and planned name conforms, and only process_event rows are bound.
  command: >-
    bin/venv-python -m pytest tests/telemetry/test_process_event_name_rule.py::test_contract_declares_the_name_grammar
    tests/telemetry/test_process_event_name_rule.py::test_shipped_projection_carries_the_rule
    tests/telemetry/test_process_event_name_rule.py::test_every_emitted_v2_name_conforms
    tests/telemetry/test_process_event_name_rule.py::test_registered_hooks_and_planned_sources_conform
    tests/telemetry/test_process_event_name_rule.py::test_rule_binds_process_event_rows_only
    tests/telemetry/test_process_event_name_rule.py::test_no_python_file_restates_the_rule
    tests/test_field_semantics_event_projection.py::test_pattern_when_projects_verbatim -q
  expected: Exit 0, 7 passed. Red before, because the nodes do not exist.
  expected_literals: []
  fix_if: >-
    A real v2 or registered name fails -> STOP and return to the operator (the grammar or the producer is wrong; a
    producer change rides parser_version 3, rec-4026); never widen the regex silently.
  hermetic: true
  graduation: graduate
  graduation_check_id: telemetry-name-rule-contract
- step: 3
  phase: pre-deploy
  action: Real local DuckLake -- the whole golden corpus lands with the rule live, and a broken name rejects its batch and writes nothing.
  command: >-
    bin/venv-python -m pytest
    tests/turn_capture/test_capture_ducklake_integration.py::test_every_golden_case_loads_with_every_fk_resolving
    tests/telemetry/test_name_rule_ducklake_integration.py -m integration -q
  expected: Exit 0, every test passed, none skipped.
  fix_if: >-
    The extension cannot load -> an environment defect: fix it, never skip (rec-4071, Benjamin 2026-09-25); a row left
    behind -> fix the write path.
  hermetic: false
  graduation: waive
  graduation_waiver_reason: >-
    Needs duckdb plus the ducklake extension under the integration marker, which neither CI tier collects; this is the
    only real-catalog proof and runs locally before merge. Steps 1-2 graduate the engine and contract verdicts.
- step: 4
  phase: pre-deploy
  action: The projection regenerates clean, and the telemetry, turn-capture, engine and ops-writer suites are green.
  command: >-
    bin/venv-python -m scripts.schema_to_field_semantics --check && bin/venv-python -m pytest tests/telemetry
    tests/turn_capture tests/row_rules tests/test_field_semantics_event_projection.py tests/common/test_ducklake_write_rules.py -q
  expected: Exit 0; no drift; every test passes.
  fix_if: "Drift -> regenerate; any other failure -> the change moved behaviour outside its scope -- fix it."
  hermetic: false
  graduation: waive
  graduation_waiver_reason: >-
    Whole-directory re-runs of suites this plan modifies and a regeneration guard; green before and after by design, so
    replay adds no independence; their standing forms are validate_field_semantics_drift and the fast tier.
- step: 5
  phase: pre-deploy
  action: The shared engine still enforces every ops rule on a real local DuckLake (plan B's integration suite).
  command: bin/venv-python -m pytest tests/common/test_ducklake_write_rules_integration.py -m integration -q
  expected: Exit 0, every test passed, none skipped.
  fix_if: "A failure -> the compile-once change or the condition validation broke an ops rule; fix the engine."
  hermetic: false
  graduation: waive
  graduation_waiver_reason: >-
    Real-catalog integration suite that neither CI tier collects; it is plan B's existing regression guard, green before
    and after this change by design.
- step: 6
  phase: pre-deploy
  action: The category-6 ritual for the amended contract and the contracts size cap.
  command: >-
    bin/venv-python -c "import subprocess,yaml;from scripts.contracts_schema import ContractDocument;from
    scripts.contracts_enforcement import check_amendment_for_diff;f='docs/contracts/telemetry_observations.yaml';base=yaml.safe_load(subprocess.run(['git','show','origin/main:'+f],capture_output=True,text=True,check=True).stdout);head=yaml.safe_load(open(f,encoding='utf-8'));errs=check_amendment_for_diff(ContractDocument.model_validate(base),ContractDocument.model_validate(head));print(chr(10).join(errs)
    or 'AMENDMENTS_OK');assert not errs" && bin/venv-python -c "from scripts.checks.structural._classify import
    effective_lines;n=effective_lines(open('docs/contracts/telemetry_observations.yaml').read());print(n);assert n<=500;print('SIZE_OK')"
  expected: Exit 0, AMENDMENTS_OK and SIZE_OK printed.
  fix_if: >-
    A category-6 error -> add the field-level entry with a consistent change_class/semantic_break pair; over 500 ->
    compact this field's amendment history with content unchanged (Decision 166), never raise.
  hermetic: false
  graduation: waive
  graduation_waiver_reason: Diffs against origin/main, so it depends on this session's transient branch state; validate_contract_drift and the structural size check are its standing forms.
- step: 7
  phase: pre-deploy
  action: Single source -- the regex's signature class appears in no Python file (only the contract and the generated projection carry it).
  command: >-
    test -z "$(grep -rlF '[A-Za-z0-9_.-]{0,199}' src scripts tests)" && test "$(grep -lF '[A-Za-z0-9_.-]{0,199}'
    docs/contracts/telemetry_observations.yaml config/lambda/ducklake/field_semantics.yaml | wc -l)" -eq 2 && echo
    REGEX_SINGLE_SOURCE
  expected: Exit 0 and REGEX_SINGLE_SOURCE printed (no Python file carries the class; both the contract and the projection do).
  expected_literals: []
  fix_if: A Python hit -> a test or module restates the rule; read it from the contract instead.
  hermetic: true
  graduation: waive
  graduation_waiver_reason: >-
    A shard would pin the regex literal and couple every future grammar amendment to it; step 2's graduated
    test_no_python_file_restates_the_rule (reading the regex from the contract) and the contract and shipped-projection
    nodes are its standing form.
- step: 8
  phase: pre-deploy
  action: Full tier on the committed, rebased, clean tree before handoff (Decision 163).
  command: bin/venv-python -m scripts.validate && bin/venv-python -m scripts.checks.validation_result --verify-head
  expected: Exit 0; Validation Summary (scope all) passes and the head is verified.
  fix_if: Any failure -> fix at root cause and rerun from the start (handoff_policy); never raise a budget, skip a check or weaken an assertion.
  hermetic: false
  graduation: waive
  graduation_waiver_reason: Invokes scripts.validate (recursion refusal); it is the handoff gate itself.
- step: 9
  phase: post-deploy
  action: All five DuckLake deploy records name the merge commit (the governed workflow shipped this code).
  command: >-
    git fetch origin main --quiet && bin/venv-python -c "import json,subprocess,boto3;s=boto3.Session(profile_name='agent_platform').client('s3');
    h=subprocess.check_output(['git','log','-1','--format=%H','origin/main','--','src/row_rules']).decode().strip();
    f=['writer','reader','maintenance','maintenance-smoke','catalog-dr']; bad=[x for x in f if
    json.loads(s.get_object(Bucket='agent-platform-data-lake',Key=f'deploy-records/ducklake/agent-platform-ducklake-{x}.json')['Body'].read()).get('source_git_sha')!=h];
    print('DEPLOY_RECORDS_FRESH' if not bad else bad);assert not bad"
  expected: Exit 0 and DEPLOY_RECORDS_FRESH printed.
  fix_if: >-
    A stale record -> the workflow failed or skipped: read its run, RCA, re-dispatch the governed workflow; never a local
    build_lambda --deploy without the operator's direction. A later DuckLake merge -> compare against that sha.
  hermetic: false
- step: 10
  phase: post-deploy
  action: The shared engine on the deployed writer still rejects a rule-breaking ops write (plan B's gate).
  command: >-
    DUCKLAKE_WRITER_URL="$(aws ssm get-parameter --name /agent-platform/ducklake/writer_url --query Parameter.Value
    --output text --profile agent_platform --region eu-west-2)" DUCKLAKE_READER_URL="$(aws ssm get-parameter --name
    /agent-platform/ducklake/reader_url --query Parameter.Value --output text --profile agent_platform --region eu-west-2)"
    bin/venv-python -m scripts.ducklake_neon_smoke_test --lambda-row-rules --profile agent_platform
  expected: Exit 0 and LAMBDA_ROW_RULES OK printed.
  fix_if: A 200 or a wrong rule -> STOP, revert the merge (the workflow redeploys the prior code) and RCA (Decision 55).
  hermetic: false
- step: 11
  phase: post-deploy
  action: The positive path on production -- a rule-clean write, update and supersede.
  command: >-
    DUCKLAKE_WRITER_URL="$(aws ssm get-parameter --name /agent-platform/ducklake/writer_url --query Parameter.Value
    --output text --profile agent_platform --region eu-west-2)" DUCKLAKE_READER_URL="$(aws ssm get-parameter --name
    /agent-platform/ducklake/reader_url --query Parameter.Value --output text --profile agent_platform --region eu-west-2)"
    bin/venv-python -m scripts.ducklake_neon_smoke_test --ops-read-your-write --profile agent_platform
  expected: Exit 0 and OPS_RYW OK printed.
  fix_if: A row_rule 422 on the clean probe -> STOP, revert, RCA.
  hermetic: false
- step: 12
  phase: post-deploy
  action: Bookkeeping landed -- rec-4176 and rec-4164 closed by the Resolves trailer.
  command: >-
    bin/venv-python -c "from scripts.ops_data_portal import _fetch_rec_from_reader as f;s=[(r,(f(r) or
    {}).get('status')) for r in ('rec-4176','rec-4164')];print(s);assert all(v=='closed' for _,v in s)"
  expected: Exit 0 and both recs printed as closed.
  fix_if: A rec still open -> check ci.yml's closure job ran on the squash commit; close it through update_rec with the PR as evidence.
  hermetic: false
