    governance.principal_admission: procedure "A producer identity reaches this writer only as a class declared here (T3.22
    c4, rec-4420). To admit one: (1) add its row under classes and its name to principal_classes; (2) grant it exactly
    grant_shape on the functions its row lists, under a permissions boundary, as an always-ask IAM change (Benjamin's word
    on the exact text); (3) for a role terraform/personal creates, pre-stage its ARN in terraform/bootstrap IAMRolesRead
    (admin apply, Decision 98) and add it to ci_full_refresh_read's IAMCIRolesRead (Decision 129) in the create PR, which
    routes to tf-gated-apply (Decision 144 cl.4); (4) tests/checks/iam_tf/test_telemetry_writer_principals.py holds every
    class to exactly its row and fails on any unregistered role holding an invoke action on the production writer;
    PlatformAdmin, the unbounded operator (Decision 144 cl.3), is the one named exclusion, never a class.
    The handler does not change: the tenant is the signed caller's account (tenant-id.yaml), so every class in this account
    writes the house tenant, and caller_role is logged in the C6 line, never consulted. A principal outside this account
    needs a per-tenant role first (tenant-id.yaml)."; grant_shape url_only_invoke, with a grant_shape_definition line "url_only_invoke: lambda:InvokeFunctionUrl on the
