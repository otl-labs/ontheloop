schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "telemetry-producer-admission-plan-review-capture"
intent: >-
  Declare how a producer identity is admitted to the production telemetry writer (a typed principal-class registry in the
  writer contract, with a test that holds every class to exactly its grant), admit the first new class (a narrow,
  main-only capture role), and use it to capture the subagent plan reviewer's claude -p sessions in the two apply jobs with
  the transcript text withheld, moving ci-rca's capture onto the same role. Closes T3.22 c4 (rec-4420) and, with the
  sibling capture adapter, T3.20 c9 (rec-4415), so every unattended Claude Code agent in Actions is visible to telemetry and
  the feedback loop.
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-telemetry-producer-admission-plan-review-capture.yaml
phase: >-
  T3.22 (c4) and T3.20 (c9). Builds LAST of three sibling plans: after PLAN-telemetry-top-level-agent-run (T3.22 c5) and
  the claude -p capture adapter plan have built and merged, and after PLAN-ratify-telemetry-writer-contract has merged.
scope:
  - file: terraform/bootstrap/github_ci_apply_reads.tf
    action: Modify
    purpose: >-
      PR 1. In the IAMRolesRead statement's Resource list, insert the APPROVED TEXT of execution step 1 immediately after the
      "arn:aws:iam::${var.account_id}:role/agent-platform-github-ci-trusted-plan" line (two comment lines plus one ARN line).
      Nothing else. Admin-only root: read-only ADMIN pre-merge plan, then the admin apply on Benjamin's word naming it.
  - file: tests/checks/iam_tf/test_telemetry_writer_principals.py
    action: Create
    purpose: >-
      CREATED IN PR 1 with the bootstrap assertion only (test_bootstrap_iam_roles_read_lists_capture_role: IAMRolesRead in
      terraform/bootstrap/github_ci_apply_reads.tf lists the capture role ARN exactly once, plus its red case on text with
      the ARN replaced), reusing _iam_roles_read_resources' approach from tests/checks/iam_tf/test_trusted_plan_identity.py.
      PR 2 extends it (rec-4420 acceptance node test_every_declared_principal_class_holds_exactly_its_grant): load the
      writer contract through scripts.contracts.load_contract; for every class in governance.principal_admission.classes,
      resolve the role's identity policy from its terraform_root and policy_document (terraform/personal: the data
      aws_iam_policy_document of that name, following source_policy_documents; terraform/bootstrap: the jsonencode held by
      the local of that name, resolving the local.*_function names) through the helpers module below. INVOKE set =
      lambda:InvokeFunctionUrl, lambda:InvokeFunction, lambda:InvokeAsync (IAM-wildcard matched, so lambda:* and
      lambda:Invoke* count). Per class, over the four telemetry functions (production writer, writer smoke twin, telemetry
      reader, reader smoke if it exists): the functions on which the policy holds any INVOKE action equal functions plus
      reads exactly, for EVERY class (not only dedicated ones); on each of them it holds lambda:InvokeFunctionUrl and holds
      lambda:InvokeFunction only under Bool lambda:InvokedViaFunctionUrl = true (url_only_invoke), never InvokeAsync, on
      both ARN forms (bare and :*); lambda:GetFunctionUrlConfig is permitted alongside, never required. For a dedicated
      class: the WHOLE inline policy is exactly the three Sids of the approved text (TelemetryWriterUrlParameterRead with
      ssm:Get* on the writer-URL parameter only, TelemetryWriterInvokeCapture, TelemetryWriterInvokeCaptureViaUrlOnly),
      exactly one aws_iam_role_policy and zero attachments target the role, its trust is one statement, StringEquals only,
      aud sts.amazonaws.com and sub iterating local.github_repos with ":ref:refs/heads/main" only (no agent/, pull_request,
      refs/pull, environment or StringLike), and its permissions_boundary is the apply boundary. Completeness: every
      aws_iam_role_policy and every customer-managed aws_iam_policy attached to a role, in terraform/personal and
      terraform/bootstrap, that holds an INVOKE action matching the production writer belongs to a registered class or to
      the one named exclusion PlatformAdmin (EXCLUDED_UNBOUNDED = {"platform_admin": "Decision 144 cl.3 unbounded operator;
      Decision 213 residual rec-4204"}), pinned by its own assertion that the exclusion still holds exactly that grant
      shape (Resource "*") and is not in principal_classes. Permissions boundaries and aws_lambda_permission resources are
      out of the completeness scan (a boundary grants nothing; no aws_lambda_permission names a telemetry function, asserted).
      Both read lists name the role (IAMRolesRead in bootstrap, IAMCIRolesRead in personal oidc.tf). Red cases on synthetic
      HCL: a dedicated role gaining an s3 statement, a registered class with an unconditioned InvokeFunction, an unregistered
      role with InvokeFunctionUrl on the writer, an unregistered role with lambda:* on function:agent-platform-*, a trust
      with an agent/* sub, a registry row naming a reads function the HCL does not grant, and a class holding the reader
      that its row omits. A role holding only lambda:Get* (the planner's LambdaRead) is NOT a holder (stays green).
  - file: tests/checks/iam_tf/_telemetry_principals.py
    action: Create
    purpose: >-
      PR 2. Helpers for test_telemetry_writer_principals.py so neither file nears the 500-SLOC gate: HCL resolution of a
      class's policy (data aws_iam_policy_document with source_policy_documents; bootstrap jsonencode locals with local.*
      name substitution), reusing the parse helpers of test_telemetry_writer_invoke_grants.py and _ci_platform_role_iam.py
      by import, never by copy; the INVOKE-set wildcard matcher; and the completeness scan.
  - file: config/agent/verification_registry/entries/telemetry-writer-principals.yaml
    action: Create
    purpose: >-
      PR 1 registry row (primitive_slot test_selector) for VP step 1's PR 1 node; PR 2 re-points guard_symbol and node_id to
      test_every_declared_principal_class_holds_exactly_its_grant (graduation_check_id telemetry-writer-principals).
  - file: terraform/personal/oidc_capture_role.tf
    action: Create
    purpose: >-
      PR 2. The APPROVED TEXT of execution step 2 verbatim (aws_iam_role github_ci_telemetry_capture, data
      aws_iam_policy_document github_ci_telemetry_capture, aws_iam_role_policy github_ci_telemetry_capture), under a header
      comment: what the role is for (claude -p telemetry capture in allow-listed Actions workflows, T3.20 c9, T3.22 c4),
      that it is the github_ci_telemetry_capture class of the writer contract's principal_admission registry, that its
      credentials are never exported to a job's environment (workflow sign-in with output-env-credentials false, enforced by
      validate_ci_capture_identity), that its CREATE routes to tf-gated-apply (Decision 144 cl.4) and later trust edits are
      admin split-applies (Decision 223 cl.4), and the accepted residual: any main-branch workflow could assume it, worst
      case appending telemetry rows under the house tenant; job_workflow_ref binding is a later tightening.
  - file: terraform/personal/oidc.tf
    action: Modify
    purpose: >-
      PR 2. In ci_full_refresh_read's IAMCIRolesRead resources, after the agent-platform-github-ci-trusted-plan entry, add
      "arn:aws:iam::${var.account_id}:role/agent-platform-github-ci-telemetry-capture" with one comment line naming the
      capture role file (validate_ci_refresh_read_coverage requires every managed role be refresh-readable by the planner;
      the approved IAM text 1 message pre-announced this ARN-only addition). Keep the trusted-plan line a quoted string
      followed by a comma.
  - file: scripts/contracts_schema.py
    action: Modify
    purpose: >-
      PR 2. Add two closed models (extra="forbid"): PrincipalClassSpec {role: str, terraform_root: Literal["terraform/personal",
      "terraform/bootstrap"], policy_document: str, functions: list[str] (min 1), reads: list[str], dedicated: bool,
      trust: str, tenant_scope: str, project_scope: str, project_scope_enforcement: Literal["producer", "writer"],
      audit_handle: str, purpose: str}, each field with a docstring: policy_document is the HCL symbol holding the role's
      identity policy (a data aws_iam_policy_document name under terraform/personal, a local name under
      terraform/bootstrap); functions are the telemetry WRITE functions the class invokes; reads the telemetry READ
      functions it invokes ([] = none); both under grant_shape; dedicated means the role exists only for this class and
      its whole policy is the admitted grant and PrincipalAdmission {procedure: str, grant_shape:
      Literal["url_only_invoke"], grant_shape_definition: str, classes: dict[str, PrincipalClassSpec]}; ContractGovernance gains principal_admission:
      PrincipalAdmission | None = None and a model_validator: when principal_admission is set, principal_classes is set and
      its entries equal the classes keys as a set, with no duplicates.
  - file: config/agent/verification_registry/entries/contracts-schema-principal-admission.yaml
    action: Create
    purpose: PR 2 registry row (test_selector) for VP step 2's node tests/test_contracts_schema.py::TestPrincipalAdmission.
  - file: tests/test_contracts_schema.py
    action: Modify
    purpose: >-
      PR 2. Class TestPrincipalAdmission: a governance block with a matching registry validates; a registry key missing from
      principal_classes, an extra class, an unknown key in a class row, a grant_shape other than url_only_invoke and a
      registry without principal_classes each raise ValidationError; every docs/contracts file still loads.
  - file: docs/contracts/ducklake_telemetry_writer.yaml
    action: Modify
    purpose: >-
      PR 2. Apply execution step 3's APPROVED-SHAPE text: principal_classes gains github_ci_telemetry_capture; a new
      governance.principal_admission block (procedure, grant_shape, grant_shape_definition, three class rows); the
      ratification plan's "Declared residual (principal classes):" audit invariant is amended in place to name the registry; one amendment_log entry (field_add,
      semantic_break false). contract_version and status stay as the ratification left them. No verb, request, response or
      typed error changes.
  - file: docs/contracts/tenant-id.yaml
    action: Modify
    purpose: >-
      PR 2. The governance_notes "Producer identity model (rec-4207)" sentence "The production writer's invoke stays
      {github_ci_branch, PlatformDev}, URL-only (Decision 213), with github_ci_branch's agent/* trust owned by rec-4480;
      admitting any other producer identity, and per-tenant roles for a principal outside this account, follow rec-4420."
      becomes execution step 4's text; one amendment_log entry (governance_note_add, semantic_break false).
  - file: tests/checks/contracts/test_telemetry_writer_ratification.py
    action: Modify
    purpose: >-
      PR 2 (the ratification build's census test). Where it pins the "Declared residual (principal classes):" invariant
      text or the newest amendment_log entries by position, re-key those pins to the ratification's entries by date and
      summary and to the residual's amended text (execution step 3), so this plan's in-place edit and its newer
      field_add head entry are planned changes, never a weakening (planned-change disposition citing
      acceptance_criteria[2]). If the merged test pins neither, no edit.
  - file: tests/checks/contracts/test_tenant_id_producer_identity_model.py
    action: Modify
    purpose: >-
      PR 2. The writer principal_classes assertion becomes ["github_ci_branch", "PlatformDev",
      "github_ci_telemetry_capture"]; the needle list gains "principal_admission" and "github_ci_telemetry_capture" (rec-4420
      stays a needle). A planned-change weakening disposition if validate_weakening_dispositions asks.
  - file: tests/checks/iam_tf/test_telemetry_writer_invoke_grants.py
    action: Modify
    purpose: >-
      PR 2. Module docstring only: github_ci_branch is the only CI role among branch, pr, planner and deploy that may invoke;
      the full admitted set is the writer contract's principal_admission registry, held by test_telemetry_writer_principals.
      No predicate or assertion changes.
  - file: .github/workflows/terraform-apply-sandbox.yml
    action: Modify
    purpose: >-
      PR 3. Append execution step 6's three steps as the LAST steps of job apply-sandbox (after "Self-dispatch ci-rca on
      re-run failure"): capture_env (a venv at the workspace root from requirements.txt; the job has setup-python 3.12 but
      only pip-installs boto3 and requests, so without it bin/venv-python finds no interpreter importing pydantic and the
      adapter's capture.sh skips), capture_creds (configure-aws-credentials, capture role, output-credentials true,
      output-env-credentials false) and the capture step (./.github/actions/telemetry-ci-capture, its one manifests input
      carrying the newline-separated ${{ github.workspace }}/terraform/personal/review.json.sessions.jsonl and
      ${{ github.workspace }}/terraform/personal/review_retry.json.sessions.jsonl, so ci-pass runs once per job over
      every manifest). The job's timeout-minutes goes 30 -> 45 so the apply keeps its full 30 minutes ahead of the
      capture steps' 13-minute ceiling (5 + 2 + 5 + 1). No other step, output, condition or job changes; speculative-plan,
      advisory-status and gated-apply are untouched.
  - file: .github/workflows/reconcile.yml
    action: Modify
    purpose: >-
      PR 3. Append the same three steps as the LAST steps of job apply-reconcile (after the best-effort wake), with
      capture_env building .dispatch-tooling/.venv from .dispatch-tooling/requirements.txt (the adapter's capture.sh
      resolves its root from github.action_path, which here is the side checkout) and the capture step using
      ./.dispatch-tooling/.github/actions/telemetry-ci-capture (main's tooling; the root checkout is the red commit) with
      the same two ${{ github.workspace }}-anchored manifest paths (review.sh writes them under the ROOT checkout's
      terraform/personal, so a relative glob resolved from .dispatch-tooling would match nothing; review and review_fresh
      share review.json, and the adapter's manifest appends). timeout-minutes 30 -> 45 as in apply-sandbox.
      resolve-target, gated-apply-reconcile and file-reconcile-starved-rec are untouched.
  - file: .github/workflows/ci-rca.yml
    action: Modify
    purpose: >-
      PR 3. Insert a capture_creds sign-in step (capture role, same shape as execution step 6, step-level
      MASK_AWS_ROLE_ID_ACCOUNT_PART env per R3) immediately before the adapter's capture step, make the sign-in and capture the job's
      final steps followed by the capture_skipped classifier, and pass capture_creds' three outputs to the capture step. The
      job's timeout-minutes rises by 3 over the adapter's value (25 -> 28 if unchanged) for the sign-in and classifier
      ceilings, the same parity reasoning as the apply jobs. The branch-role sign-in and the agent step are untouched; the
      agent keeps the branch role.
  - file: tests/test_telemetry_ci_capture_action.py
    action: Modify
    purpose: >-
      PR 3 (the adapter's test). Its ci-rca step-shape pins move to the new tail without weakening: the job ends sign-in,
      capture, capture_skipped classifier; the capture step's if is always() && steps.capture_creds.outcome == 'success'
      (still contains always()), continue-on-error true, timeout-minutes 5; the job timeout is the adapter's value + 3
      (28 if 25). Planned-change weakening disposition: moved, not weakened -- predicate (e) of validate_ci_capture_identity
      now carries the ordering. test_credential_inputs_replace_every_ambient_aws_variable is untouched.
  - file: config/telemetry/capture.yaml
    action: Modify
    purpose: >-
      PR 3. Delete the adapter's pending exemption (the ci_uncaptured entry whose call_site is
      .github/actions/subagent-plan-review, owner rec-4420). ci_workflows (the adapter's allow-list) gains two entries in the
      adapter's entry shape {workflow, agent, content_policy}: workflow .github/workflows/terraform-apply-sandbox.yml and
      .github/workflows/reconcile.yml, each agent plan-review (the source_registry key that becomes agent_type), content_policy withheld, with a
      comment citing Decision 238 cl.1 (no agent-obtainable identity reads plan-review transcripts; the content reader
      being built serves agent principals). No project_ref (the adapter reads the one registered project.ref, Decision
      224). claude.yml stays absent.
  - file: config/agent/data_quality/source_registry.yaml
    action: Modify
    purpose: >-
      PR 3. New entry canonical_id plan-review (description: the subagent-plan-review composite action's no-tools
      claude -p reviewer of names-only terraform plan digests in terraform-apply-sandbox.yml and reconcile.yml;
      signal_interpretation: a telemetry agent_type for top-level CI runs, files no recommendations, its transcript text is
      withheld by policy; added_date the build date), so agent plan-review is a registry key (the run-shape plan's rule; the id is hyphenated like the existing
      code-review, harmless beside the adapter's ci_rca).
  - file: scripts/checks/ci_guards/validate_ci_capture_identity.py
    action: Create
    purpose: >-
      PR 3. Registered fast-tier check (Decision 170 examined counts), CAPTURE_ROLE = "agent-platform-github-ci-telemetry-capture",
      CAPTURE_ACTION_SUFFIX = ".github/actions/telemetry-ci-capture". Over .github/workflows/*.yml (scripts.verify_ci_workflow
      loader), for every job with a step whose uses ends with CAPTURE_ACTION_SUFFIX: (a) runs-on is a GitHub-hosted
      ubuntu-* label; (b) exactly one earlier step in the job signs in with aws-actions/configure-aws-credentials whose
      role-to-assume ends with role/CAPTURE_ROLE, has an id, output-credentials 'true' (string or bool), output-env-credentials
      'false', continue-on-error true and if always(); (c) no other sign-in step in the job names CAPTURE_ROLE, and no
      sign-in step in any workflow names CAPTURE_ROLE without being such a pair; (d) the capture step passes exactly
      steps.<that id>.outputs.aws-access-key-id / aws-secret-access-key / aws-session-token to its three credential inputs,
      has if containing always() and steps.<that id>.outcome == 'success', continue-on-error true and timeout-minutes <= 5;
      (e) the job's last steps are, in order, an optional capture_env step, the sign-in step, the capture step and the
      capture_skipped classifier (if "always() && steps.capture_creds.outcome != 'success'", run printing only the fixed
      line CI_CAPTURE skipped reason=assume_failed, continue-on-error true, timeout-minutes 1, no aws, GITHUB_OUTPUT or
      GITHUB_ENV; it is the negative branch validate_oidc_failopen_guards requires of a continue-on-error sign-in), where
      capture_env (when present) has id capture_env, if always(), continue-on-error true, timeout-minutes <= 5, a run
      body that only creates <root>/.venv and pip-installs <root>/requirements.txt into it, and no aws, GITHUB_OUTPUT or
      GITHUB_ENV; (f) no job outputs expression and no
      later job references either step id; (g) the capture action's own action.yml contains no
      aws-actions/configure-aws-credentials (R4 restated for this action) and writes no GITHUB_OUTPUT; (h) every workflow
      with a job whose steps use .github/actions/subagent-plan-review has a config/telemetry/capture.yaml ci_workflows entry
      with agent plan-review and content_policy withheld, every ci_workflows entry's agent is a canonical_id in
      config/agent/data_quality/source_registry.yaml, and no ci_uncaptured entry names
      .github/actions/subagent-plan-review (Decision 238 cl.1: flipping to full, or re-exempting the call site, is a
      visible guard edit, never a config-only change); (i) the job can run the capture: <root>/.venv is created by some step of the job
      (root = the workspace for ./.github/actions/..., .dispatch-tooling for ./.dispatch-tooling/...); (j) a capture step
      whose action comes from a side checkout (uses not starting ./.github/) has every manifests line starting
      ${{ github.workspace }}/. Predicates take parsed data so red cases run on synthetic input. Vacuous (examined 0)
      until PR 3 wires a job.
  - file: tests/checks/ci_guards/test_validate_ci_capture_identity.py
    action: Create
    purpose: >-
      PR 3. Real tree green with the three wired jobs (apply-sandbox, apply-reconcile, rca) examined; one red case per
      predicate (a)-(j) on synthetic workflows and actions, including a capture action.yml that signs in with
      configure-aws-credentials or writes GITHUB_OUTPUT (g), a capture step after it a further step, output-env-credentials
      true, a capture step using the job's apply-role env (no credential inputs), a second job assuming the capture role
      for anything else, timeout-minutes 10, a job output reading steps.capture_creds, runs-on self-hosted, a
      plan-review workflow entry with content_policy full, a leftover subagent-plan-review ci_uncaptured entry (h), an entry whose agent is not a source_registry canonical_id (h), a capture job with no venv-creating step (i), a capture_env
      step that runs aws (e), a classifier that runs aws or sits before the capture step (e), and a .dispatch-tooling capture step with a relative manifest path (j).
  - file: scripts/checks/ci_guards/_manifest.py
    action: Modify
    purpose: >-
      PR 3. Register validate_ci_capture_identity (pre=True, full_segment="full_after_lint" like every ci_guards entry, so
      it also runs in the full tier on main) with pre_globs .github/workflows/**, .github/actions/**,
      config/telemetry/capture.yaml, config/agent/data_quality/source_registry.yaml,
      scripts/checks/ci_guards/validate_ci_capture_identity.py, scripts/verify_ci_workflow/**,
      scripts/checks/_common.py, scripts/checks/registry.py.
  - file: config/ci_rca_taxonomy.yaml
    action: Modify
    purpose: PR 3. validate_ci_capture_identity -> environment (same class as validate_trusted_plan_environment).
  - file: config/agent/verification_registry/entries/ci-capture-identity.yaml
    action: Create
    purpose: PR 3. Registry row (test_selector) for VP step 3's node, guard_target the new check.
  - file: tests/telemetry_capture/test_plan_review_text_withheld.py
    action: Create
    purpose: >-
      PR 3. Drives the merged adapter's producer path (ci-pass's row-building entry, not the transport) over its plan-review
      golden transcript fixture with a host-run sidecar whose content_policy is withheld and whose transcript text carries
      a unique canary string in the prompt, the stdin digest and the reply: every telemetry_transcripts row has content and
      content_uri None, content_omitted_reason withheld_by_policy, content_sha256 == hashlib.sha256(b"").hexdigest() and
      content_bytes 0 (the run-shape contract's write-enforced withheld row, so no digest of the text is stored either); no value in any row of the four tables (including
      observations.metadata, name, failure_reason and agents.error) contains the canary or any 40-character substring of the
      transcript's message text; usage tokens, turn counts and timing are present; and the same fixture under content_policy
      full stores the text (so the test cannot pass by capturing nothing).
  - file: config/agent/verification_registry/entries/plan-review-text-withheld.yaml
    action: Create
    purpose: PR 3 registry row (test_selector) for VP step 5's node tests/telemetry_capture/test_plan_review_text_withheld.py.
  - file: docs/ROADMAP-PLATFORM.yaml
    action: Modify
    purpose: >-
      PR 2: T3.22 status -> in_progress if not already (the run-shape plan builds first), c4 met (met_by telemetry-producer-admission-plan-review-capture) and a
      progress_note line. PR 4 (after VP 15): T3.20 c9 met with a bracketed re-grounding "[Re-grounded <date>,
      PLAN-telemetry-producer-admission-plan-review-capture: plan review is captured with its transcript text withheld by
      policy (content_omitted_reason withheld_by_policy, Decision 238 cl.1).]" and a progress_note line saying T3.20's
      complete flip waits on CD.40's ratification (Benjamin's word); T3.20 status stays in_progress.
  - file: docs/plans/PLAN-telemetry-producer-admission-plan-review-capture.yaml
    action: Create
    purpose: This planning artefact.
bundled_recommendations:
  - rec-4420
  - rec-4415
followon_recs:
  - rec-4714
  - rec-4717
closes_criteria:
  - "T3.22:c4"
  - "T3.20:c9"
infrastructure_dependencies:
  - "PR 1 (terraform/bootstrap): admin-only root; read-only ADMIN pre-merge plan, then the admin apply on Benjamin's own words naming it (CI-first rule), BEFORE PR 2 merges."
  - "PR 2 (terraform/personal): a new aws_iam_role plus trust routes to tf-gated-apply (guard exit 2); Benjamin approves the gated-apply job in Actions. The planner/trusted-plan policy updates from IAMCIRolesRead ride the same gated apply."
  - "PR 3 (workflows, capture config, check): no Terraform; opens only after PR 2's gated apply converges green, so the capture role exists before any workflow assumes it."
  - "LAMBDA-DEPLOY NOT OWED (CD.16 / Decision 79): compute_affected_artifacts over the scope returns only data-pipeline <- docs/ROADMAP-PLATFORM.yaml, roadmap bookkeeping data the pipeline bundles but never reads at run time; no handler or packaged code changes, and the telemetry writer handler does not change."
acceptance_criteria:
  - T3.22:c4 -- IAMRolesRead (bootstrap, applied live) and IAMCIRolesRead (personal) both list the capture role ARN exactly once.
  - T3.22:c4 -- agent-platform-github-ci-telemetry-capture exists live with the apply boundary, one main-only trust statement and exactly the three approved Sids and no attached policy; a live IAM simulation shows URL invoke on the production writer and the writer-URL parameter read allowed, and the smoke twin, the telemetry reader, a direct (non-URL) invoke, another SSM parameter and tfstate denied.
  - T3.22:c4 -- The writer contract's principal_admission registry declares github_ci_branch, PlatformDev and github_ci_telemetry_capture; test_every_declared_principal_class_holds_exactly_its_grant passes and reddens on each synthetic breach.
  - T3.20:c9 -- In apply-sandbox, apply-reconcile and ci-rca the capture runs under the capture role only, as the job's final capture steps (sign-in, capture, skip classifier), never exported to the job environment, and validate_ci_capture_identity is green in the fast tier.
  - T3.20:c9 -- A plan-review session from a live apply-sandbox run on main reads back through the telemetry reader as a top-level run with workflow plan-review, usage and turn rows present, and every transcript row a withheld_by_policy omission with no content.
  - Closure bookkeeping -- T3.22 c4 and T3.20 c9 are met in docs/ROADMAP-PLATFORM.yaml; T3.20 stays in_progress pending CD.40; rec-4415's acceptance is re-pointed to this plan's nodes; rec-4420 and rec-4415 are closed.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: The principal registry and every class's grant agree; the capture role is pre-staged and refresh-readable (rec-4420 acceptance)
    command: bin/venv-python -m pytest tests/checks/iam_tf/test_telemetry_writer_principals.py -q
    expected: all pass, including the red cases on synthetic HCL (PR 1 runs the bootstrap subset only)
    fix_if: a real-tree assertion fails -- fix the HCL or the registry row to match the approved text, never the assertion; a change to approved IAM text goes back to Benjamin inline
    hermetic: true
    expected_literals: []
    graduation: graduate
    graduation_check_id: telemetry-writer-principals
  - step: 2
    phase: pre-deploy
    action: The governance schema accepts a matching registry and refuses each malformed one
    command: bin/venv-python -m pytest tests/test_contracts_schema.py::TestPrincipalAdmission -q
