infrastructure_dependencies:
- >-
  terraform/personal (auto-apply at merge behind the guard): three Secrets Manager containers, one lifecycle rule, and
  in-budget inline-policy updates on the admin maintenance role and the planner role. No role, trust, function or destroy
  change; nothing routes to tf-gated-apply. The switch PR (PR 3) adds an in-budget env and inline-policy update on
  ducklake_maintenance_smoke and nothing else.
- >-
  terraform/bootstrap (admin-only, Decision 126): pre-merge read-only plan at the PR head (VP 15-17, the
  pre_merge_live_plan rule), then a human-directed apply after merge, then the post-apply simulate. Expected plan: four
  in-place updates (aws_iam_policy.github_ci_apply_boundary, aws_iam_policy.github_ci_apply_reads,
  aws_iam_role_policy.platform_dev_runtime, aws_cloudtrail.platform_security), nothing created or destroyed.
- >-
  LAMBDA-DEPLOY (Decision 79/125/126): ducklake_runtime.py is in every DuckLake bundle, so PR 1's merge redeploys all six
  DuckLake functions through deploy-ducklake-lambdas and runs their smoke gates (VP 18). The new verbs are inert until
  the admin session invokes them. Neither the bookkeeping PR (PR 2) nor the switch PR (PR 3) changes source, so
  neither triggers a DuckLake deploy.
- >-
  LAMBDA-DEPLOY DEFERRED (CD.16 / Decision 79), data-pipeline: compute_affected_artifacts flags it through
  docs/ROADMAP-PLATFORM.yaml, a manifest asset, in the bookkeeping PR (PR 2). No build, deploy or smoke test is owed: its handlers
  never read the c1 flip, deploy-prod-lambdas.yml's path triggers do not include the file, and the artifact refreshes
  with its next governed deploy (the PLAN-telemetry-reader-verbs precedent).
- >-
  Admin sitting 1, after PR 1's deploy and apply legs are green, in deploy-paths.yaml production_catalog_provisioning's
  order: bootstrap apply and simulate; measurement BEFORE any create (Decision 88 cl.2; Benjamin runs catalog_stats
  himself as operator); production catalog; the production writer and reader logins; ensure_catalog_indexes (Benjamin
  runs it himself as operator). catalog_stats and ensure_catalog_indexes stay human-invoked only
  (ducklake_maintenance.yaml principal_classes and admin_only_features; index_actions.py "never agent-invoked"): the
  agent records only their counts-only output. Each step appends counts-only results to ADMIN-SESSION-RECORD.md. The
  bookkeeping PR (PR 2) merges after sitting 1 on Benjamin's word.
- >-
  Admin sitting 2, independent of sitting 1 (it needs only PR 1's deploy), with DuckLake deploys held by the
  coordinator from adoption until the switch has applied and the smoke writer is narrowed and proven: adopt smoke;
  maintainer login; merge the switch PR (Benjamin's word given with PR 1's, so the hold spans only its merge and apply,
  never his response time) and wait for its apply; clean owner re-run; narrow the smoke writer and run the telemetry
  gate at once; release; one dispatched deploy run. Scheduled smoke cadences in the window are safe: EventBridge passes
  only {action} to merge, gc and hot_merge, which run no DDL; only the deploy gates pass force_recreate_tables, and
  they are held. Rollback keeps the hold: revert the switch PR, provision_catalog_owner(ducklake_smoke, mode release),
  one dispatched deploy whose five maintenance-smoke gates pass, then release.
acceptance_criteria:
- >-
  T2.36:c1 -- the production telemetry catalog ducklake_telemetry exists with the four event tables and the two
  dimension pairs created per the Class A contracts (calendar-day partition on session_started_at, declared NOT NULL
  set) and ops_entity_counters seeded; every relation is owned by ducklake_telemetry_owner and the report says so by name
  (schema_owner ducklake_telemetry_owner, schema_owner_is_current_user false for the shared owner login, foreign_owned
  0); the catalog stats index is valid on it (StatsIndexValid 1 for MetaSchema ducklake_telemetry).
- >-
  rec-4297 -- the four logins are provisioned from the closed table and each probe equals its expected scope; neither
  writer login can drop a DuckLake table or delete catalog history; the reader attaches READ_ONLY and cannot write
  (real Postgres 16 proof before merge, live probes after), recorded as reader_read_only_attach accepted at both; every
  probe equals its expected scope in either sitting order; the narrowed smoke writer serves every writer verb live.
- >-
  ducklake_smoke is owned by ducklake_smoke_owner; the smoke maintainer's session role is ducklake_smoke_owner, proven
  live before the switch merges, and its connection limit is sized from its measured peak sessions; ducklake_maintenance_smoke connects as ducklake_smoke_maintainer and holds no grant on
  the shared owner secret; the owner re-run after the switch reports nothing to re-own; the dispatched deploy run after
  the switch passes all five maintenance-smoke gates and the telemetry gate; and the switch has a named rollback
  (release mode) proven on the stage.
- >-
  The boundary carries the four fence statements and the telemetry-family pattern, its minified size is recorded and at
  most 6,144 bytes, the post-apply simulate rows all match, and PlatformDev holds URL-only invoke on the telemetry reader.
- >-
  Decision N is on main in the pinned shape with its annotations; rec-4218's ingestion_shape, the production column set
  and rec-4207's producer identity model are recorded; rec-4218, rec-4207 and rec-4297 are closed; the six telemetry
  registry entries stay pre_production and exempt with the production catalog and its column path in exempt_reason,
  and the status-vocabulary gap is the owned residual rec-4483.
- >-
  MEASUREMENT.md records the smoke baseline counts-only before provision_telemetry_catalog runs, including the per-day
  rates D and R the maintenance plan's thresholds use, and ADMIN-SESSION-RECORD.md carries every key the sibling plans
  read; no non-ops datapoint enters the undimensioned ops maintenance series during this plan.
