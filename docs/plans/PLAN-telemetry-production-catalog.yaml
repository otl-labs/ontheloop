- file: src/lambdas/ducklake_maintenance/ducklake_telemetry_writer_role.sql
  action: Modify
  purpose: >-
    Becomes the writer TEMPLATE ({login}, {schema}, {owner_role}, {connection_limit}) used by both writer logins. SET
    LOCAL lock_timeout = '5s'; create the role NOLOGIN if absent; ALTER ROLE ... LOGIN NOINHERIT NOCREATEDB NOCREATEROLE CONNECTION LIMIT
    {connection_limit}; statement_timeout 60s; CONNECT on ducklake_ops; USAGE on {schema}; REVOKE ALL on all tables and
    sequences in {schema} and REVOKE the earlier broad default privileges; then GRANT the MEASURED set from execution step
    4 in two shapes: one GRANT line per DuckLake catalog table with a fixed name (ducklake_snapshot, ducklake_data_file,
    ducklake_file_column_stats and so on; no UPDATE or DELETE on ducklake_table, ducklake_schema, ducklake_column or
    ducklake_snapshot unless the measurement proves a verb needs it, justified in the PR), and one class-level DO block
    granting the measured privilege on every existing relation in {schema} whose name starts ducklake_inlined_data_ (the
    per-table physical tables DuckLake creates per table version, whose names differ per catalog and exist before the
    template runs); default privileges FOR ROLE ducklake_ops and FOR ROLE {owner_role} carry the class-level privilege
    for relations created later. One transaction, so the revoke and the re-grant are atomic. Comments describe the
    measurement and the re-measure rule only; never a password.
- file: src/lambdas/ducklake_maintenance/ducklake_telemetry_reader_role.sql
  action: Create
  purpose: >-
    Reader TEMPLATE: SET LOCAL lock_timeout = '5s'; role NOLOGIN if absent; LOGIN NOINHERIT NOCREATEDB NOCREATEROLE CONNECTION LIMIT
    {connection_limit}; statement_timeout 100s (below the reader function's 120 s); default_transaction_read_only on;
    CONNECT on ducklake_ops; USAGE on {schema}; REVOKE ALL then GRANT SELECT ON ALL TABLES IN SCHEMA {schema}; default
    privileges SELECT ON TABLES FOR ROLE ducklake_ops and FOR ROLE {owner_role}. Nothing on any other schema or public.
- file: src/lambdas/ducklake_maintenance/ducklake_catalog_maintainer_role.sql
  action: Create
  purpose: >-
    Maintainer TEMPLATE: SET LOCAL lock_timeout = '5s'; role NOLOGIN if absent; LOGIN INHERIT NOCREATEDB NOCREATEROLE CONNECTION LIMIT
    {connection_limit}; GRANT CONNECT ON DATABASE ducklake_ops; GRANT {owner_role} TO {login} WITH INHERIT TRUE, SET
    TRUE; ALTER ROLE {login} SET role = '{owner_role}', so every connection it opens, DuckLake's included, runs DDL as
    the catalog's owner role and that role's default privileges apply. Membership of exactly one owner role; nothing
    else.
- file: src/lambdas/ducklake_maintenance/ducklake_catalog_owner.sql
  action: Create
  purpose: >-
    Owner TEMPLATE ({owner_role}, {schema}) in two named sections that render_owner_sql selects by mode: adopt (create
    the role and the membership, create-or-adopt the schema, then normalise every relation to the role) and release
    (ducklake_smoke only: the schema and every relation back to CURRENT_USER). No other mode exists: every sitting step
    and rerun uses adopt, and release is only the switch's rollback. Each rendering starts with SET LOCAL
    lock_timeout = '5s'; each is idempotent (every statement is a no-op on a converged catalog), in DO blocks that build
    each ALTER with format('%I') from pg_catalog names.
