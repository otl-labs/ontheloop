  action: Modify
  purpose: >-
    NEW numbered Decision N (origin/main max + 1 at build time; 229 at plan time), amends [81, 126, 213, 216], at most
    6,144 bytes (about 6,065 as pinned with N = 229), text pinned verbatim in execution step 3; dated trailing
    annotations on Decisions 216, 213, 126 and 81 naming it, each before its entry's closing --- (Decision 177 dialect;
    their text is not rewritten; validate_supersession_annotations requires one on every amended entry). Decision 216 is
    6,130 bytes today, so its annotation takes it past 6,144: per_entry_size_norm measures new-in-diff entries only, and
    an amended baseline entry over the cap is the WARN-only accretion signal (decision-entry.yaml size_governance).
- file: docs/decisions-index.json
  action: Modify
  purpose: Regenerated by bin/venv-python -m scripts.decisions_index --write.
- file: src/common/ducklake_runtime.py
  action: Modify
  purpose: >-
    Two constants beside SMOKE_META_SCHEMA and SMOKE_DATA_PATH: TELEMETRY_PROD_META_SCHEMA = "ducklake_telemetry" and
    TELEMETRY_PROD_DATA_PATH = "s3://agent-platform-data-lake/ducklake-telemetry/" (the later slice 2c plans import
    them). A comment states the data prefix is a sibling of ducklake/, never inside it, so the ops catalog's
    catalog-wide orphan cleanup never sees telemetry Parquet. open_connection gains keyword-only read_only: bool = False;
    when True the ATTACH option list gains READ_ONLY, and the default keeps today's ATTACH byte for byte. It is here (not
    in PLAN-telemetry-reader-and-smoke-twin) because the reader login's live probe (login_actions) is its first caller;
    that plan consumes it unchanged.
- file: src/common/ducklake_telemetry_provision.py
  action: Modify
  purpose: >-
    (1) OwnershipReport keeps its four positional fields and gains schema_owner_held (current_user IS the schema owner or
    can SET ROLE to it, pg_has_role(current_user, nspowner, 'SET')) and schema_owner (nspowner::regrole::text inside the postgres_query, so
    the scanner only ever sees a text column; the owner role's
    name, an identifier, never a host), so a check can tell "held through ducklake_smoke_owner" from "still owned by the
    login itself". schema_owner_is_current_user stays as an informational field. (2) ownership_report takes
    scoped_logins: tuple[str, ...] (default (SCOPED_LOGIN,)) and reports scoped_create_on_schema /
    scoped_create_on_public as true when ANY listed login holds CREATE, every name passing the existing identifier guard.
    Each listed login is resolved with to_regrole and read through the oid form, COALESCE(has_schema_privilege(
    to_regrole('<login>'), '<schema>', 'CREATE'), false), so a login that does not exist yet holds no CREATE instead of
    raising 42704: provision_telemetry_catalog (VP 21) reports before any production login exists. (3)
    provision_telemetry_catalog's absent-tables refusal names both owner steps (maintenance-smoke create_telemetry_tables
    on smoke, provision_telemetry_catalog on production). Nothing else changes; stays under 500 SLOC (280 today).
- file: src/lambdas/ducklake_maintenance/catalog_logins.py
  action: Create
  purpose: >-
    The one closed table (Decision N cl.3, cl.4). OWNER_ROLES = {"ducklake_smoke": "ducklake_smoke_owner",
    "ducklake_telemetry": "ducklake_telemetry_owner"}. DATA_PATHS = {"ducklake_smoke": rt.SMOKE_DATA_PATH,
    "ducklake_telemetry": rt.TELEMETRY_PROD_DATA_PATH}. LOGINS, a mapping of frozen Login records {name, secret_id,
    template, schema, owner_role, connection_limit, kind, expected_scope}: ducklake_telemetry_writer (secret
    agent-platform-ducklake-telemetry-writer-dsn, writer template, ducklake_smoke, limit 20 = 2 x (writer 5 + smoke twin
    5) reserved concurrency while both bind smoke), ducklake_telemetry_writer_prod
    (agent-platform-ducklake-telemetry-writer-prod-dsn, writer template, ducklake_telemetry, limit 10),
    ducklake_telemetry_reader (agent-platform-ducklake-telemetry-reader-dsn, reader template, ducklake_telemetry, limit
    10 = 2 x the reader's reserved concurrency 5), ducklake_smoke_maintainer (agent-platform-ducklake-smoke-maintainer-dsn,
    maintainer template, ducklake_smoke, limit = 2 x the peak concurrent sessions that
    test_maintainer_peak_sessions_across_the_five_smoke_actions measures (VP 11) for one invocation of each smoke
    action, at least 2; 2 is the provisional value and the node fails until the constant covers 2 x the measured peak,
    so the PR records the peak and the sized value). Each expected_scope is independent of sitting order. A writer's or
    the reader's true entries are USAGE and its granted privileges on its own schema only; it is a member of no owner
    role. Only the maintainer is a member of an owner role (its own catalog's), and its true entries are that
    membership and what the role holds on its own schema. Every entry on another catalog or role is false whether that
    catalog or role exists yet or not, and every true entry is on an object provisioning refuses to run without. Its
    current_user entry is the login's own name, except ducklake_smoke_maintainer's, which is ducklake_smoke_owner (the
    session-role default, proven live at VP 25 before the switch merges).
    render_login_sql(name) and render_owner_sql(meta_schema, mode) format ONLY values from these tables into the bundled
    templates (str.format, the catalog_stats_index.sql precedent) after the identifier guard; any other name or mode
    raises DuckLakeRuntimeError before any SQL is built. Every rendered template opens its transaction with SET LOCAL
    lock_timeout = '5s': the owner and login statements take ACCESS EXCLUSIVE locks on live smoke relations, so a lock
    held by an in-flight capture commit (CommitLatencyMs p50 572-855 ms on smoke) fails the whole transaction atomically
    (SQLSTATE 55P03), as does a deadlock against one (40P01), and the verb is simply re-run, instead of queueing every
    smoke writer behind it. template_sha256(name) hashes the template
    FILE bytes (what the procedure's check compares against the merged file). No I/O beyond reading the bundled SQL
    files.
- file: src/lambdas/ducklake_maintenance/catalog_actions.py
  action: Create
  purpose: >-
    Two OPERATIONAL verbs (Decision N cl.4), each refusing before any connection unless its closed preconditions hold,
    each raising only DuckLakeRuntimeError (never DuckLakeMaintenanceError, so no MaintenanceBreakerTrip datapoint) and
    emitting no metric. action_provision_catalog_owner {meta_schema in OWNER_ROLES, confirm == meta_schema, mode in
    {adopt (default), release}}: as the owner login (psycopg2, rt.fetch_dsn()), one transaction (SET LOCAL
    lock_timeout = '5s' first) runs render_owner_sql(meta_schema, mode). adopt: create the NOLOGIN role if absent under
    SET LOCAL createrole_self_grant = 'set, inherit' plus an idempotent GRANT role TO CURRENT_USER WITH INHERIT TRUE, SET
    TRUE; then CREATE
    SCHEMA IF NOT EXISTS ... AUTHORIZATION role, and for an existing schema owned by another role GRANT CREATE ON
    DATABASE to the role, ALTER SCHEMA ... OWNER TO it and REVOKE that CREATE again; then normalise: every relation
    (relkind r, p, S, v, m) in the schema not owned by the role is re-owned with its relkind's ALTER ... OWNER TO.
    release (Decision N cl.4, the named un-adopt step; refused before any connection unless meta_schema is
    ducklake_smoke): ALTER SCHEMA ducklake_smoke OWNER TO CURRENT_USER, then every relation in it not owned by
    CURRENT_USER is re-owned to it, so the shared owner login owns the smoke catalog again exactly as before adoption; the
    role and its memberships stay (nothing is dropped). Response {ok, meta_schema, owner_role, mode, schema_created,
    schema_adopted, schema_released, relations_reowned, owner_sql_sha256, member_inherit, member_set}, counts and booleans
    only. action_provision_telemetry_catalog {meta_schema == rt.TELEMETRY_PROD_META_SCHEMA, data_path ==
    rt.TELEMETRY_PROD_DATA_PATH, confirm == meta_schema}: the owner step in adopt mode; a DuckDB connection as the
    owner login on (data_path, meta_schema), which initialises the DuckLake metadata on first attach; normalisation;
    run_telemetry_txn(create_telemetry_tables) (create-if-absent plus the Decision 222 additive leg, which makes a re-run
    the production column add); normalisation; run_telemetry_txn(provision_telemetry_catalog) (verify and seed the
    counters, the catalog's first write); then ownership_report(scoped_logins=(ducklake_telemetry_writer_prod,
    ducklake_telemetry_reader)) refusing unless foreign_owned is 0, schema_owner equals ducklake_telemetry_owner,
    schema_owner_held is true and no scoped CREATE (the two logins do not exist yet at VP 21, so the to_regrole guard
    reads them as holding none; their own scope probe at VP 22 proves it). It never builds the stats index (Decision 214 cl.2) and never runs
    merge or GC. Response {ok, meta_schema, tables, created, added, counters, ownership, owner_sql_sha256, elapsed_ms}.
    Every psycopg2 or duckdb error after the precondition checks is re-raised as DuckLakeRuntimeError naming only its class
    (and SQLSTATE for psycopg2), so no host or path reaches a response. Module docstring cites "(Decision N, amending
    Decision 216 clauses 1 and 3)", the citation the Decision test resolves N from.
- file: src/lambdas/ducklake_maintenance/login_actions.py
  action: Modify
  purpose: >-
    provision_telemetry_login serves the closed LOGINS table: confirm must name one of its four logins (else refuse
    before any connection); before the migration it refuses with a typed error naming the missing object unless the
    login's owner role and schema exist (the procedure's order); it renders that login's template, applies it as the
    owner, reads THAT login's secret (refused unless username equals the login, host and dbname equal the owner's and
    sslmode is require), sets the password as a bound parameter, then probes as the login. The scope probe reads
    current_user and session_user; for ducklake_ops, ducklake_smoke and ducklake_telemetry, USAGE and CREATE as
    current_user, each through COALESCE(has_schema_privilege(current_user, to_regnamespace('<schema>'), ...), false);
    public and database CREATE; the session login's connection limit (session_user, so a login whose session role is an
    owner role still reports its own); membership of each owner role through COALESCE(pg_has_role(session_user,
    to_regrole('<role>'), 'MEMBER'), false), so ducklake_smoke_owner not existing yet (sitting 1 provisions the
    production logins, sitting 2 creates it) reads as not a member instead of raising 42704; whether
    default_transaction_read_only is on; and INSERT on <schema>.ducklake_snapshot. metadata_readable reads
    <schema>.ducklake_metadata. For the reader login only, the probe then opens rt.open_connection(read_only=True) as
    that login on (DATA_PATHS[schema], schema) and reads one count from a telemetry table, reporting read_only_attach
    "accepted", or "refused" with the error class only; it never raises for that outcome (VP 22 records it). Response
    adds login, read_only_attach (reader only) and migration_sha256 = template_sha256. TELEMETRY_LOGIN and
    TELEMETRY_DSN_SECRET_ID stay as aliases of the smoke writer's entry for existing importers.
