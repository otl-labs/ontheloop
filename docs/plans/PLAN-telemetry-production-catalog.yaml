rollback: >-
  The production catalog is additive and empty: nothing reads or writes it until the flip, so a code revert leaves it in
  place harmlessly. Smoke adoption and the switch roll back together, with DuckLake deploys held throughout: revert PR 3
  (its apply restores the shared credential), run provision_catalog_owner(ducklake_smoke, mode release) so the shared
  owner login owns the smoke schema and every relation again, dispatch one deploy run whose five maintenance-smoke gates must
  pass, then release the hold. Adoption without the switch is undone by the release mode alone. PR 2's records are
  bookkeeping of the production catalog and stay. A narrowed writer template that breaks a verb is rolled forward (a
  template grant line, the governed deploy, a provision_telemetry_login re-run); capture backs off and replays without
  loss. The bootstrap rolls back by applying the prior sha's HCL by hand.
