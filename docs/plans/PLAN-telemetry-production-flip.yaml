- step: 24
  phase: post-deploy
  action: >-
    Before the bookkeeping commit: every rec-4292 closure-ledger row (execution step 6) has a home that exists. Row L08's
    home is the merged "Retire query_ops raw SQL" plan, PLAN-query-ops-retirement, which bundles no rec: its PR B removed
    query_ops and closed the object-store residual that named it (amended 2026-10-29; the plan's earlier QUERY_OPS_REC
    lookup had no rec to find).
  command: |-
    git fetch origin main --quiet && AWS_PROFILE=agent_platform bin/venv-python - <<'EOF'
    import re, subprocess, yaml
    def show(path):
        return subprocess.run(["git", "show", f"origin/main:{path}"], capture_output=True, text=True).stdout
    plan = yaml.safe_load(open("docs/plans/PLAN-telemetry-production-flip.yaml"))
    ledger = next(s for s in plan["execution_steps"] if s.startswith("6. rec-4292 closure ledger"))
    rows = [line for line in ledger.splitlines() if re.match(r"L\d\d \| ", line)]
    main_plans = set(subprocess.run(["git", "ls-tree", "--name-only", "origin/main", "docs/plans/"], capture_output=True, text=True).stdout.split())
    query_ops = show("docs/plans/PLAN-query-ops-retirement.yaml")
    assert (yaml.safe_load(query_ops) or {}).get("implementation_declared") is True and "dq_check" in query_ops, "query_ops plan not merged"
    assert any(row.startswith("L08 | ") and "PLAN-query-ops-retirement" in row.split(" | ", 2)[2] for row in rows), "L08 is not homed on the query_ops plan"
    bad, recs = [], set()
    for row in rows:
        rid, _item, home = [part.strip() for part in row.split(" | ", 2)]
        if not home or re.search(r"no home|homeless|unowned|tbd", home, re.I):
            bad.append(rid)
        bad += [f"{rid}:{p}" for p in re.findall(r"PLAN-[a-z0-9-]+", home) if f"docs/plans/{p}.yaml" not in main_plans]
        recs |= set(re.findall(r"rec-\d+", home))
    attach = [row for row in rows if "ATTACH" in row]
    catalog_plan = show("docs/plans/PLAN-telemetry-production-catalog.yaml")
    for key in ("telemetry_attach_cold_ms", "neon_data_transfer_bytes_7d"):
        assert attach and key in attach[0] and key in catalog_plan, key
    from src.common.ducklake_reader_client import make_reader
    found = {r["id"] for r in make_reader().named("recs_by_ids", ids=",".join(sorted(recs)))}
    assert not bad and found == recs, (bad, sorted(recs - found))
    print("LEDGER_OK", len(rows), "rows", len(recs), "recs")
    EOF
  expected: LEDGER_OK with every row homed, every named plan on main and every named rec found.
  fix_if: >-
    A homeless row or a missing plan or rec is a stop: home it (a plan or a filed rec) before the trailer; an unmerged
    query_ops plan means that work is unfinished: report it to the coordinator and wait.
  hermetic: false
  graduation: not-applicable
