    'telemetry reader' in c['c3']['text'];print('C2_MET')" && AWS_PROFILE=agent_platform bin/venv-python -c "from
    src.common.ducklake_reader_client import make_reader;r={x['id']:x for x in make_reader().named('recs_by_ids',ids='rec-4292')};
