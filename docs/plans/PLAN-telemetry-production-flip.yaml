infrastructure_dependencies:
- >-
  Prerequisites (verified at build start, VP step 1): PLAN-telemetry-cold-read-deadline built (its deadline wiring is on
  main before any 2c build); PLAN-telemetry-catalog-aware-capture built (capture follows the writer; reads route by
  /agent-platform/ducklake/telemetry_catalog); PLAN-telemetry-production-catalog's admin session done (the production
  writer login and its secret value; the bootstrap fence and boundary entries applied; Decision A);
  PLAN-telemetry-reader-and-smoke-twin deployed (telemetry-twin-smoke, deploy-telemetry and telemetry-smoke jobs on
  main, the telemetry reader served, tests/common/ducklake_event_reads/ split; Decision B);
  PLAN-telemetry-production-maintenance built (T2.36:c5 met).
- >-
  PR flip, pre-merge: the speculative plan shows exactly three in-place updates
  (aws_lambda_function.ducklake_telemetry_writer, aws_iam_role_policy.ducklake_telemetry_writer,
  aws_ssm_parameter.ducklake_telemetry_catalog), nothing on the shared reader and a PASS predicted guard verdict (VP step
  7). Benjamin's word is required before merge (IAM on the writer role, the Class B writer contract). Post-merge the one
  apply expands the writer's policy, then moves its env and the deploy output; in-flight trees re-send whole to
  production. The PR touches no deploy trigger path, so the light gate runs from the session (VP step 8) and in the
  next deploy run.
- >-
  PR cleanup, after VP steps 8-11 pass: the merge triggers deploy-ducklake-lambdas (the shared reader, the telemetry
  reader, the telemetry writer and twin, and the smoke maintenance function if its docstring changed); no terraform.
  Benjamin's word is required before merge (reader contract semantics).
- >-
  PR narrow, after VP step 18 passes (so the code deploy and the configuration apply never touch the shared reader at
  once): the speculative plan shows exactly three in-place updates (aws_lambda_function.ducklake_reader,
  aws_iam_role_policy.ducklake_reader, aws_iam_role_policy.ducklake_telemetry_writer) and a PASS verdict (VP step 21).
  Benjamin's word is required (IAM).
- >-
  PR bookkeeping, after VP steps 12, 22, 23 and 24 pass and once the "Retire query_ops raw SQL" build has merged and
  retired the query_ops residual lines (it has: #1592; the former fallback re-point is moot, amended 2026-10-29): it
  touches docs/ROADMAP-PLATFORM.yaml, a manifest asset of the data-pipeline artifact
  (compute_affected_artifacts), a data-only change whose zip refreshes at the next governed deploy of that artifact
  (decoupled_build_pipeline), so no deploy step is owed here.
- >-
  One DuckLake deploy or apply at a time (the coordinator sequences merges); no merge during the org-transfer freeze
  window.
acceptance_criteria:
- >-
  T2.36:c2: after the flip, real Claude Code session capture lands in ducklake_telemetry through
  agent-platform-ducklake-telemetry-writer (the implementing session's own tree reads back through the production
  writer's probe and the in-session check), and no staging writer exists on any telemetry path.
- >-
  Sessions in flight at the flip re-send their trees to production with no halt and no grain conflict: no tree on the
  implementing container wrote a halt since the flip, and the writer's log holds no 409 grain_conflict answer since the
  flip for any session.
- >-
  Golden replay passes on ducklake_telemetry with zero mismatches and no skew; the monitor completes on the first full
  production day; the preflight gauge reads pass on ducklake_telemetry (T2.36:c3 re-verified in production).
- >-
  The production writer's deploy gate keeps the Decision 213 direct-invoke denial and the Decision 216 can_create check
  and writes no append, blob or project-registration row, and no job runs heavy vectors against the production writer;
  ontheloop is registered on production.
- >-
  After the cleanup and narrow PRs the shared reader serves no event verb and holds no telemetry env or blob grant, and
  the writer holds production grants only; production telemetry is written and read only through its own identities.
- >-
  The stale-reference guard passes, every rec-4292 ledger row has a home (VP step 24), rec-4292 is closed by the
  bookkeeping PR's Resolves trailer, and T2.36:c2 reads met with met_by telemetry-production-flip.
