rollback: >-
  Never a revert of the flip PR: a revert also drops the writer's expanded policy, and because the function depends_on
  its policy the apply would cut the writer to smoke-only grants before its env moves back (appends 500, begin_blobs
  fails, capture halts). Before the cleanup PR: a forward pin-back PR moves ducklake_telemetry_meta_schema back to
  "ducklake_smoke" and the writer's env back to the smoke secret and data path while keeping both bindings in its
  policy. That PR, under the human's direction, moves with it the guards and the gate that expect production: VP 2's
  production-pin nodes, VP 5's writer-contract node (and the contract text it reads), and telemetry-smoke's
  --lambda-telemetry-production step, which becomes the light gate against the smoke binding until the flip is
  re-planned. One apply moves the writer and the deploy output back, capture re-sends each tree to smoke (identical rows
  are no-ops there; a diverged one halts as grain_conflict_after_catalog_reset and is reported) and reads route back to
  the shared reader; the production grants are removed later in their own PR. Production rows stay (append-only).
  After the narrow or cleanup PRs: revert those first, narrow then cleanup (restoring the writer's smoke grants and the
  shared reader's slot and grants), then the same pin-back PR.
