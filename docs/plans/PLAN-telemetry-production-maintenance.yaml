    alarms present and none in ALARM except possibly gc-liveness before the first Sunday pass (cold start, excluded).
  fix_if: >-
    No telemetry datapoint after 13 hours (the rule never fired: check the target and permission), a failed pass (read
    the MAINTENANCE_FAILURE log line), merge-liveness still in ALARM after a green pass (its period or missing-data
    setting is wrong), or a missing alarm; RCA.
- step: 12
  phase: post-deploy
  action: PR 3 bookkeeping is on main.
  command: >-
    git fetch origin main --quiet && git show origin/main:docs/DECISIONS.md > "${TMPDIR:-/tmp}/c5-dec.md" && git show
    origin/main:docs/ROADMAP-PLATFORM.yaml | C5_DEC="${TMPDIR:-/tmp}/c5-dec.md" bin/venv-python -c "import
    os,re,sys,yaml;n=re.search(r'^## Decision (\d+): Production telemetry is proved by a smoke canary',open(os.environ['C5_DEC'],encoding='utf-8').read(),re.M).group(1);
    d=yaml.safe_load(sys.stdin);it=next(i for i in d['tier_items'] if i['id']=='T2.36');c=next(c for c in
    it['exit_criteria'] if c['id']=='c5');assert c['status']=='met' and c.get('met_by')=='telemetry-production-maintenance'
    and 'PLAN-telemetry-production-maintenance' in c['text'] and '(Decision '+n+' cl.5)' in c['text'] and 'N+1' not in
    c['text'],c;print('C5_MET',n)"
  expected: C5_MET and the resolved Decision number.
  fix_if: >-
    The bookkeeping PR is unmerged, the met_by token is wrong, the re-grounding prefix is missing, or it still carries
    the N+1 placeholder instead of the resolved number; fix the PR.
