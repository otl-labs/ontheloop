    bin/venv-python -c "import boto3,os,datetime as d;cw=boto3.client('cloudwatch',region_name='eu-west-2');now=d.datetime.now(d.timezone.utc);
    a=d.datetime.fromisoformat(os.environ['DEPLOY_DONE_AT'])-d.timedelta(hours=1);
    p=cw.get_metric_statistics(Namespace='DuckLakeTelemetryWriter',MetricName='CommitLatencyMs',Dimensions=[{'Name':'MetaSchema','Value':'ducklake_smoke'}],StartTime=a,EndTime=now,Period=3600,Statistics=['SampleCount'])['Datapoints'];
    assert p,p;print('SMOKE_SERIES_OK',len(p))" && AWS_PROFILE=agent_platform bin/venv-python -c "import
    boto3,os,datetime as d;cw=boto3.client('cloudwatch',region_name='eu-west-2');a=d.datetime.fromisoformat(os.environ['DEPLOY_DONE_AT']);
    now=d.datetime.now(d.timezone.utc);q=lambda dm:cw.get_metric_statistics(Namespace='DuckLakeMaintenance',MetricName='MergeOpsTablesCount',Dimensions=dm,StartTime=a,EndTime=now,Period=3600,Statistics=['SampleCount'])['Datapoints'];
    o=q([]);x=q([{'Name':'MetaSchema','Value':'ducklake_ops'}]);assert o and not x,(o,x);print('OPS_SERIES_CONTINUOUS',len(o))"
  expected: DEPLOY_OK, SMOKE_SERIES_OK with at least one datapoint, then OPS_SERIES_CONTINUOUS with at least one datapoint.
