    the telemetry writer and the twin redeploy; data-pipeline is affected only through the ROADMAP asset in PR 3 and owes
    no deploy), and the twin's gate traffic produced a CommitLatencyMs datapoint in the MetaSchema=ducklake_smoke series.
    After the next :30 ops merge pass following the deploy, the ops series is continuous: an undimensioned
    MergeOpsTablesCount datapoint and no MetaSchema=ducklake_ops datapoint (PR 1 rewires the ops emission path, and the
    ops series has no merge-failure alarm to catch a regression). The implementer saves the run's jobs JSON to
    DEPLOY_JOBS_JSON (GitHub MCP list_workflow_jobs for the run on PR 1's merge commit; save the inner jobs list, the
    response's jobs.jobs array) and exports MERGE_SHA (that
    commit) and DEPLOY_DONE_AT (the deploy-maintenance job's completion, ISO-8601 UTC).
  command: >-
    bin/venv-python -c "import json,os;j=json.load(open(os.environ['DEPLOY_JOBS_JSON']));
    jl=j.get('jobs') if isinstance(j,dict) else j;jobs={x['name']:x.get('conclusion') for x in jl};
    want={'deploy-maintenance','maintenance-smoke','reconcile-gate','deploy-serving','smoke','deploy-telemetry-twin','telemetry-twin-smoke','deploy-telemetry','telemetry-smoke'};
