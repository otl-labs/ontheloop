constraints:
- >-
  IMPLEMENTATION only (Decision 67). Decompose, never raise, an SLOC budget (Decision 128). No rescue loops: an
  unrecoverable live failure stops for RCA (Decision 55).
- >-
  Spend is always-ask, so PR 1 merges only on Benjamin's word, after code review PROCEED and green CI, with this plan's
  whole figure in the ask: 13 new custom-metric series (9 maintenance names for the telemetry catalog, OccRetryCount and
  CommitLatencyMs for ducklake_smoke and ducklake_telemetry; MergeOpsDurationMs is already among the 9) at about 0.30 USD
  each and 10 standard alarms at 0.10 USD (8 maintenance, 2 writer), about 4.90 USD a month at list price, plus a few
  Lambda minutes a week and Neon compute for the :50 telemetry merge: four more catalog wakes a day, each 20 minutes
  after the :30 ops merge and so past the endpoint's 300 s scale-to-zero (rec-4220 owns the compute cap); small, but
  named in the ask. PR 2 adds no spend beyond that figure and
  merges under the standing rule (its body cites his word on PR 1), unless the guard routes its Lambda permissions to
  the gated Environment, which he approves. PR 3 is bookkeeping. No IAM and no Decision text in this plan.
- >-
  The ops maintenance series stays undimensioned and its three alarms untouched (T2.18 c2, rec-3870); no telemetry
  datapoint ever enters it, which is why the telemetry dry run waits for PR 1's deploy. No edit to the admin function's
  IAM (PLAN-telemetry-production-catalog granted the prefix).
- >-
  Measured thresholds are literals from MEASUREMENT.md by the formulas in execution step 6; never guessed, never
  derived at apply time. The merge-duration threshold alone derives from the admin function's own timeout attribute
  (rec-4218 trigger 2 is defined as half of it).
- >-
  Public repo (Decision 101): no account id, ARN, hostname, URL or secret in any committed file, commit, PR body or
  log line; alarm descriptions carry no threshold shape.
- >-
  Never weaken a test assertion to obtain green (Decision 181): every changed pin is a planned-change or growth-safe
  disposition recorded in weakening_dispositions.
- >-
  One DuckLake deploy or apply at a time; the coordinator sequences this plan's merges against other telemetry builds.
context:
- "Carrier rec-4292; split and names: /mnt/project-files/telemetry-slice2c/ (step6b-presentation.md, ADVICE.md Q6-Q7). The coordinator split the earlier single plan into PLAN-telemetry-reader-and-smoke-twin and this one (2026-10-19). rec-4292's 422 blob_not_verified alarm item moves to rec-4482, this plan's follow-on, now widened: the writer rejection metric by error type, plus the telemetry writer's warm wall time EMF with a cold-start flag and its p95 alarm (Decision 214 cl.4's signal, unmeasured for this writer today)."
- "Order: docs/plans/PLAN-telemetry-production-catalog.yaml -> docs/plans/PLAN-telemetry-reader-and-smoke-twin.yaml (Decision N+1, the twin and the telemetry reader) -> this plan (its build may start once that plan's PR 1 merges, since it cites Decision N+1 cl.5; its PR 1 merges only after that plan's PR 2 merged with its VP 15 (the nine-job merge run, twin and reader gates green) and VP 16 (the reader gate as PlatformDev) green, since step 9 reads the nine-job run and the twin's gate traffic) -> PLAN-telemetry-catalog-aware-capture -> PLAN-telemetry-production-flip."
- "Decision-scout: FLAGS_FOUND, dispositioned (/mnt/project-files/telemetry-slice2c/decision-scout-report.md and decision-scout-report-reads.md). CITE 88, 188, 191, 192, 193, 214, 181, 213, 79, 177. Decisions triaged: 180 of 180. Roadmap items intersected: 13; CONFLICT: 0; RELATED: 12."
- "gates: decision-scout=FLAGS_FOUND (dispositioned); plan-critique=PROCEED after 4 rounds (round 3 REVISE fixed; confirming round 4 nits folded in)"
- "Scout dispositions here: 188 (gc_ops licensed by a committed dry-run baseline from the seeded catalog, never an empty-catalog exemption); 181 (c) c5 re-grounded as Decision N+1 cl.5 authorizes, with per-surface coverage; T2.18 [CITE] (merge_ops, gc_ops and breaker emissions for the telemetry catalog go only to its own series and only under CATALOG_METRICS names); 143 (no admin merge on smoke: merge duration is watched through MergeOpsDurationMs, rec-4218's trigger)."
- "Decision 79: compute_affected_artifacts(scope) = ducklake_maintenance, ducklake_maintenance_smoke (bundles ducklake_catalog_index_status.py), ducklake_telemetry_writer (deployed to the writer and the twin) and data-pipeline (only through docs/ROADMAP-PLATFORM.yaml, an asset; it owes no deploy). The three DuckLake artifacts redeploy through the governed channel on PR 1's merge; step 9 checks the run."
- "Thresholds: files-after-merge = 7 x D; catalog-stats-rows = 2 x (SNAPSHOT_RETAIN_DAYS 30 + 7) x R, because superseded files' stats rows persist until the weekly GC expires snapshots past retention, so the steady state is about 37 x R plus live rows and k = 2 fires only on runaway growth; a rate alarm was rejected because CloudWatch metric math has no time shift for a week-over-week comparison and a 6-hour DIFF swings with every weekly GC. A level alarm will fire on legitimate volume growth: that is the re-measure trigger (Decision N+1's growth-alarm-recurs)."
- "rec-4218 triggers (PLAN-telemetry-production-catalog's ingestion_shape block, storage-substrate.yaml tables.telemetry_tables.ingestion_shape): PR 2 points them at the MetaSchema=ducklake_telemetry series, alarms trigger 2 (merge pass above 450 s, half the 900 s timeout, one 0.10 USD alarm) and qualifies trigger 3 for the 30-37-day retention ramp, during which stats rows grow by construction."
