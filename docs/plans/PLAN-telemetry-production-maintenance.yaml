schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: telemetry-production-maintenance
intent: >-
  Telemetry slice 2c (rec-4292, T2.36), the third of five plans: PLAN-telemetry-production-catalog ->
  PLAN-telemetry-reader-and-smoke-twin -> this plan -> the cutover (PLAN-telemetry-catalog-aware-capture, then
  PLAN-telemetry-production-flip). It points merge (every 6 hours) and guarded GC (weekly) at the production telemetry
  catalog before its first event row, gives the telemetry catalog's maintenance and writer metrics their own MetaSchema
  series while the ops series stays undimensioned, and adds the breach, liveness, merge-failure, merge-duration and
  growth alarms that
  replace the breaker Decision 188 retired (Decision N+1 cl.5). That closes T2.36 c5. Telemetry is the learning signal
  for recursive self-improvement (PROJECT_CONTEXT); maintenance keeps its catalog cheap to read.
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-telemetry-production-maintenance.yaml
phase: >-
  T2.36 (telemetry re-lands on DuckLake), slice 2c; follow-on mode. Closes T2.36 c5 (maintenance covers the production
  catalog before its first telemetry write, read as Decision N+1 cl.5's "first event row": the catalog's counter seed
  is written first by design, at PLAN-telemetry-production-catalog's create). c1 is PLAN-telemetry-production-catalog's;
  c2 is PLAN-telemetry-production-flip's.
closes_criteria:
- T2.36:c5
scope:
- file: src/lambdas/ducklake_telemetry_writer/telemetry_log.py
  action: Modify
  purpose: >-
    PR 1. The append directive adds one catalog dimension set beside the existing empty one: OccRetryCount and
    CommitLatencyMs carry Dimensions [[], [MetaSchema]] (additive, so PLAN-telemetry-production-catalog's 7-day
    measurement series stays continuous), with a MetaSchema member read from the function's own TELEMETRY_META_SCHEMA
    env (identifier-checked, else "unknown"; never a caller value). RequestCount keeps [Verb] only (no new series: no
    alarm reads it per catalog). The twin and, until PLAN-telemetry-production-flip, the writer emit
    MetaSchema=ducklake_smoke, so gate traffic can never trip a production alarm.
- file: src/lambdas/ducklake_maintenance/_shared.py
  action: Modify
  purpose: >-
    PR 1. NEW catalog_dimensions(meta_schema) -> {"MetaSchema": meta_schema} for a valid identifier other than
    rt.META_SCHEMA, else None (the ops series stays undimensioned: T2.18 c2 and rec-3870 read it). NEW CATALOG_METRICS,
    the closed set merge_ops, gc_ops and the breaker sink emit for a non-ops catalog (cardinality bound; control_health's
    existing per-schema StatsIndexValid, FileColumnStatsIdxScan and FileColumnStatsSeqScan, already dimensioned by
    MetaSchema, are outside it and unchanged): MaintenanceBreakerTrip, GcReferencedMissing,
    GcDeletedSnapshots, GcDeferredFiles, MergeOpsPassFailed, MergeOpsTablesCount, MergeOpsFilesAfterTotal,
    MergeOpsDurationMs and CatalogFileColumnStatsRows (the seven alarm inputs, G4 drain pressure and rec-4218's
    merge-duration trigger).
- file: src/lambdas/ducklake_maintenance/handler.py
  action: Modify
  purpose: >-
    PR 1. NEW _catalog_sink(meta_schema) built over the handler's own re-bound _emit_maintenance_metric, so every
    existing patch point (h._emit_maintenance_metric in test_operational_actions, test_merge_ops_discovery,
    test_gc_action and test_dispatch) still holds: for ducklake_ops it returns the module-level _emit_maintenance_metric
    itself (calls byte-identical); for any other catalog a (name, value) emitter that drops names outside
    CATALOG_METRICS and passes catalog_dimensions(meta_schema). merge_ops emits through _catalog_sink(meta_schema);
    gc_ops passes it as metric_sink; the DuckLakeMaintenanceError branch emits MaintenanceBreakerTrip through
    _catalog_sink of the payload's meta_schema (an invalid or absent one is treated as ops). merge_ops' no-tables error
    names the event's catalog instead of the fixed ops text. Stays under 500 SLOC (452 today).
- file: src/lambdas/ducklake_maintenance/health_actions.py
  action: Modify
  purpose: >-
    PR 1. _report_stats_index also emits CatalogFileColumnStatsRows with MetaSchema=<schema> for the production
    telemetry catalog only (rt.TELEMETRY_PROD_META_SCHEMA, when enumerated), from index_status.stats_rows_est, called
    inside the existing cursor block after the index report in its own try/except: a failure there emits nothing,
    records growth_error {error_class, sqlstate} inside the telemetry schema's own report entry (never a top-level key:
    the emit loop reads state["valid"] for every top-level entry, health_actions.py:94-98) and never reaches the outer
    except, which emits StatsIndexValid=0
    for ducklake_ops on any exception inside its try (health_actions.py:81-93); a None estimate emits nothing.
    catalog_stats' undimensioned emissions and the ops and smoke schemas' metrics are unchanged.
- file: src/common/ducklake_catalog_index_status.py
  action: Modify
  purpose: >-
    PR 1. NEW stats_rows_est(cur, meta_schema) -> int | None: one SELECT of pg_class.reltuples for the schema's
    ducklake_file_column_stats (schema bound as a parameter, relkind r or p), returning None when the table is absent or
    reltuples is negative (never analysed on PostgreSQL 14 and later). SELECT only; the catalog_stats basis
    (ducklake_maintenance.catalog_stats) is not duplicated.
- file: docs/contracts/ducklake_telemetry_writer.yaml
  action: Modify
  purpose: >-
    PR 1: the C6 line's EMF section names the [MetaSchema] set on OccRetryCount and CommitLatencyMs. PR 2: the two
    writer alarms. amendment_log rows. Its governance_notes ingestion_shape pointer line is unchanged.
- file: docs/contracts/storage-substrate.yaml
  action: Modify
  purpose: >-
    PR 2 (Class D). An amendment to tables.telemetry_tables.ingestion_shape, which PLAN-telemetry-production-catalog
    adds (rec-4218): its three reversal triggers and the writer-sizing re-size rule read the MetaSchema=ducklake_telemetry series
    (DuckLakeMaintenance MergeOpsFilesAfterTotal, MergeOpsDurationMs and CatalogFileColumnStatsRows; DuckLakeTelemetryWriter
    OccRetryCount and CommitLatencyMs), never the undimensioned series, which mixes in twin gate traffic once PR 1
    deploys; trigger 2 (a telemetry merge_ops pass above half its 900 s timeout) is watched by the
    ducklake-telemetry-merge-duration alarm (MergeOpsDurationMs excludes the pass's ATTACH, about 21 s at p95; accepted); trigger 3 (stats rows growing week over week for three weeks despite
    merge) counts only weeks starting at least SNAPSHOT_RETAIN_DAYS + 7 = 37 days after the first production event
    row, because superseded files' stats rows rise by construction through the 30-37-day retention ramp. Exactly three
    triggers and their numbers stay as recorded; production_column_set is untouched. One amendment_log row (Class D,
    the Pass 2 amendment-log rule): "telemetry-production-maintenance: ingestion_shape triggers and re-size rule read
    the MetaSchema=ducklake_telemetry series; trigger 3 waits out the 37-day retention ramp".
- file: docs/contracts/ducklake_maintenance.yaml
  action: Modify
  purpose: >-
    PR 1: merge_ops and gc_ops payload rows name the MetaSchema dimension and CATALOG_METRICS for a non-ops catalog,
    edited in place: their payload_schema_ref lines (around 149 and 204, "SCHEDULED (EventBridge cron(...)) against
    PRODUCTION ducklake_ops") and human_initiated_value ("merge_ops hits PRODUCTION on the schedule") also name the
    telemetry catalog, inside the +10 budget below; control_health names the telemetry CatalogFileColumnStatsRows
    emission. PR 2: the lines that say merge_ops and
    gc_ops target only ducklake_ops -- contract.description (line 25), governance.auth_type (around 45),
    governance.principal_classes (around 53) and the audit invariant (around 392) -- name the telemetry schedules beside
    the ops ones; an audit invariant names the ten telemetry alarms (eight maintenance, two writer), the undimensioned
    ops series, G4 headroom (weekly dead files about 7 x D against G4_MAX_DELETE_FILES 20,000: above about 2,850 files a
    day every pass drains partially, Decision 193) and how Neon storage growth is detected (the stats-rows alarm on the
    dominant catalog table and egress driver, Decision 88 cl.1(iii)); no compute cap is claimed for storage (Decision
    214 cl.3 caps compute, and its Terraform limit is still pending under rec-4220). Size budget
    (validate_structural_size_limits, contracts class 500 effective lines, no roster entry): 434 today and about 490
    after PLAN-telemetry-production-catalog, so this plan adds at most 10: the schedule names edit the four existing
    lines in place, the payload, metric and control_health notes are single lines, the new audit invariant is one line,
    and one amendment_log entry in PR 2 covers both PRs (PR 1 changes no description or semantics field, so
    check_amendment_for_diff asks for none there; the PR 2 entry's change_class and semantic_break are consistent with
    it). If the fast tier still reports the file over 500, compress the prose of the rows this plan touches; never a
    budget raise (Decision 128).
- file: terraform/personal/ducklake_maintenance_telemetry.tf
  action: Create
  purpose: >-
    PR 2 (Decision N+1 cl.5, from PLAN-telemetry-reader-and-smoke-twin; its header comment cites the number execution
    step 1 resolves). On the admin maintenance function, with no IAM
    change (PLAN-telemetry-production-catalog granted the prefix). locals: telemetry_data_files_per_day,
    telemetry_stats_rows_per_day and telemetry_commit_latency_p95_ms_7d (literals from MEASUREMENT.md, execution step 6),
    telemetry_stats_retention_days = 37 (SNAPSHOT_RETAIN_DAYS 30 + 7: a superseded file's stats rows persist until the
    weekly GC expires snapshots past retention), telemetry_files_after_merge_threshold = 7 *
    local.telemetry_data_files_per_day, telemetry_stats_rows_threshold = 2 * local.telemetry_stats_retention_days *
    local.telemetry_stats_rows_per_day, telemetry_merge_duration_threshold_ms = aws_lambda_function.ducklake_maintenance.timeout
    * 1000 / 2 (rec-4218 trigger 2: half the 900 s timeout, 450,000 ms). Rules
    agent-platform-ducklake-maintenance-telemetry-merge cron(50 */6 * * ? *)
    and agent-platform-ducklake-maintenance-telemetry-gc cron(5 4 ? * SUN *), both ENABLED, inputs {action, data_path =
    local.ducklake_telemetry_data_path, meta_schema = local.ducklake_telemetry_prod_meta_schema}, lambda permissions
    AllowEventBridgeTelemetryMergeOps and AllowEventBridgeTelemetryGcOps. Eight alarms on namespace DuckLakeMaintenance,
    every metric dimensioned MetaSchema = local.ducklake_telemetry_prod_meta_schema, actions to aws_sns_topic.alerts, no
    threshold shape in any description: ducklake-telemetry-maintenance-breaker (MaintenanceBreakerTrip Sum >= 1, 300 s),
    ducklake-telemetry-gc-referenced-missing (Maximum >= 1, notBreaching), ducklake-telemetry-gc-liveness
    (GcDeletedSnapshots SampleCount < 1 over 7 daily periods, breaching), ducklake-telemetry-merge-failed
    (MergeOpsPassFailed Maximum >= 1 per hour, notBreaching), ducklake-telemetry-merge-liveness (MergeOpsTablesCount
    SampleCount < 1 over two 6-hour periods, breaching: it is in ALARM from creation until the first :50 pass, the ops
    gc-liveness precedent), ducklake-telemetry-merge-duration (MergeOpsDurationMs Maximum above
    telemetry_merge_duration_threshold_ms on one 6-hour period, notBreaching; MergeOpsDurationMs starts after ATTACH,
    discovery and classification, handler.py:361 and 418, so it under-reads a pass by about a cold ATTACH, about 21 s at
    p95: accepted against the 450 s threshold, and the writer-contract trigger text says so), ducklake-telemetry-files-after-merge
    (MergeOpsFilesAfterTotal Maximum above telemetry_files_after_merge_threshold on two consecutive 6-hour periods) and
    ducklake-telemetry-catalog-stats-rows (CatalogFileColumnStatsRows Maximum above telemetry_stats_rows_threshold on
    four consecutive 6-hour periods).
- file: terraform/personal/ducklake_telemetry_writer.tf
  action: Modify
  purpose: >-
    PR 2. Alarms ducklake-telemetry-writer-occ (OccRetryCount Maximum >= 3 in an hour: an OccRetryCount of 3 is the
    fourth of OCC_MAX_ATTEMPTS = 5, one attempt short of exhaustion, ducklake_writes.py:49) and ducklake-telemetry-writer-commit-latency (CommitLatencyMs p95 above ceil(2 *
    local.telemetry_commit_latency_p95_ms_7d / 1000) * 1000 for three consecutive hours), both on namespace
    DuckLakeTelemetryWriter with dimension MetaSchema = local.ducklake_telemetry_prod_meta_schema and treat_missing_data
    notBreaching, so they stay quiet until PLAN-telemetry-production-flip and never see the twin. Decision 214 cl.4 names
    the writer's warm wall p95 as the latency signal, and for the telemetry writer it is unmeasured today:
    build_request_line (telemetry_log.py) carries no wall or elapsed field and the C6 invariant lists none (only the ops
    writer and the reader log a ducklake_invocation line). rec-4482, widened, owns it (warm wall time EMF with a
    cold-start flag, plus the p95 alarm). Until then CommitLatencyMs, the commit that dominates an append, is the
    alarmed series. rec-4292's acceptance greps ducklake-telemetry-writer-occ here.
