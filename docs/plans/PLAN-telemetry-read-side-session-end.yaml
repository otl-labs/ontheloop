    cite: "acceptance_criteria[1]"
constraints:
- >-
  Derived at read, never stored (Decision 199 cl.1, data-modeling-standard derived-state rule): no column, no row and
  no producer change in this plan; each state verb still reads only its session's calendar-day partition and adds no
  catalog round-trip (Decision 88).
- >-
  Independence: derivation_cases.yaml, derive.py and derived_golden_state.yaml are authored from the contract text,
  never from the SQL or each other's output; a disagreement is resolved against the contract.
- >-
  Sub-agent state, the friction and token roll-ups and every other verb are unchanged (VP 5 proves it by read_version).
- >-
