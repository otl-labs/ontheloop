execution_steps:
- >-
  1. Precondition: confirm both builds named in phase are on main (PARSER_VERSION 5 in src/turn_capture/record_turn.py;
  the verification verbs registered in src/common/ducklake_event_read_verbs.py); rebase onto main. If either is missing,
  STOP and tell the coordinator.
- >-
  2. Rules SE-1..SE-3 (ducklake_event_read_sql.py, ROOT branch). Inputs after R4/R5 dedupe; every ordering below puts a
  NULL source_ordinal first (coalesce(source_ordinal, -1)). tip = the latest lifecycle row (annotate excluded) by
  event_timestamp, source_ordinal, close last on a tie, event_id (STATE_CTES's lc, unchanged); pc = the latest producer
  close by event_timestamp, source_ordinal, event_id (cl's ordering; when tip is a close, pc is that row); Topen = the
  session's latest observations row with observation_type turn and event_kind open by event_timestamp, source_ordinal,
  event_id; Tclose = the latest close sharing Topen's observation_id by the same ordering; idle = as_of minus the
  session's last event_timestamp over the four tables exceeds the governed threshold. SE-1 state: (1) tip is a close
  and (Topen is none, or (Topen.event_timestamp, Topen's source_ordinal) <= (pc.event_timestamp, pc's source_ordinal)
  compared as a pair) -> tip.outcome; (2) else Topen and Tclose exist and Tclose.outcome is not NULL -> idle ?
  map(Tclose.outcome) : running, map = success -> success, error -> failed, interrupted -> cancelled, blocked ->
  failed; (3) else Topen exists and Tclose is none -> idle ? abandoned : running; (4) else -> idle ? abandoned :
  running (the prior rule). SE-2 outcome: branch 1's stored outcome, or branch 2's MAPPED value (success, failed or
  cancelled, never the raw error or interrupted) when idle; else NULL; the at-rest cases assert outcome. SE-3 duration_seconds: Tany = the latest close of ANY of the session's
  root turns (any outcome, NULL included; any parser version) by the same ordering; duration = the later of the latest
  producer close's and Tany's event_timestamp, minus session_started_at, truncated toward zero to whole seconds; NULL
  when neither exists. Tclose (state) and Tany (duration) differ only when the latest turn is open. The new CTEs live
  in ROOT_TURN_CTES (scope row 1); STATE_CTES, the sub-agent arms, the stamps and the partition bound are untouched.
- >-
  3. derive.py from the amended contract text (step 4 first); the new derivation cases; run steps 1 and 2.
- >-
  4. Contracts as their scope rows pin, each with an amendment_log entry dated the build day. Structural size (Decision
  166 contracts class, 500 effective lines; telemetry_sessions.yaml is near it after the v4 and v5 builds): new
  amendment_log entries take the one-line flow form; if the file still exceeds 500, compact its remaining block-form
  amendment_log entries to the one-line form (#1535 precedent), then join older multi-line folded notes into one line
  each under 2,000 characters. Wording never changes; never a raise or a split. Run step 3.
- >-
  5. Rebase onto origin/main first (DECISIONS.md and decisions-index.json move on main), then write Decision N into
  docs/DECISIONS.md in decision-entry.yaml's required-marker shape (**Status:** and **Date:** markers, the fenced
  metadata envelope, Problem, Decision, Rationale, Coverage, the reversal-conditions stanza, Related, the trailing ---),
  N = origin/main max + 1, at most 6,144 bytes. Title "## Decision N: A telemetry session's end is read from its turns
  -- idle at rest reads the last turn's outcome, idle mid-turn reads abandoned, and a producer close row is optional
  evidence (amends Decision 199 clause 1) (Decided)"; envelope {number N, status Decided, decided_date <build day>,
  amends [199], significance numbered_decision, justification "Redefines terminal and abandoned for a root session,
  Decision 199 cl.1's read-derived state, whose 2026-10-16 update requires a numbered Decision for later clause-1
  changes; a telemetry_sessions.yaml note (considered) cannot also bind the producer's turn evidence and the reader's
  verbs."}. Problem: a cloud session's producer close row cannot be sent (Claude Code stops its egress proxy before
  SessionEnd hooks; a reclaimed container runs none), and any session can resume, so 0 of 28 root sessions read
  terminal on 2026-10-15..16 and state and duration were unusable. Decision: 1. A ROOT session's state is read from its
  own evidence in order: a producer close that is the latest lifecycle row with no turn opened after it gives its stored
  outcome; else a latest turn with a close and an outcome is at rest and, idle past the governed threshold, reads that
  outcome (error -> failed, interrupted -> cancelled), else running; else a latest turn with an open and no close
  stopped mid-turn and reads abandoned past the threshold, else running; else (no outcome-bearing turn close and no
  open turn: no turn rows, or closes without an outcome) it reads abandoned past the threshold, else running. A
  later turn or resume makes the session running again; nothing is stored. A turn continued after a Stop (a blocking
  Stop hook, a wake) already has a close; if it dies before its next Stop it reads that close's outcome, not
  abandoned, a residual slice 4 measures (rec-4025). 2. duration_seconds is the later of the
  latest producer close and the latest close of any root turn, minus session_started_at, truncated toward zero;
  sub-agent sessions keep their agent-run rule. 3. A producer close row is optional evidence: no reader rule requires it; the producer's
  obligation is turn evidence, an open row once the prompt is on disk and a close with outcome at each Stop
  (PLAN-telemetry-stop-turn-close). 4. The idle threshold stays the reader registry's one governed value (24 h), so a
  finished session reads running for that long; a shorter at-rest threshold is a later Decision. Rationale: end events
  fired at teardown are unreliable for clients that can vanish; sessionization practice derives the end from
  inactivity, and abandoned now means stopped mid-turn before the turn's first close. Rejected: a producer close at every Stop (reads a session
  closed while its next turn runs, one lifecycle row per Stop); relying on an upstream SessionEnd fix (a VM can stop
  with no hook). Coverage (Decision 181 cl.2): the rule -- derivation_cases.yaml through
  tests/common/test_ducklake_event_read_verbs.py (full tier) and the oracle (tests/telemetry_verify, graduated); the
  deployed reader -- the golden replay against derived_golden_state.yaml; the producer evidence --
  turn-capture-witness-closes; real sessions -- slice 4's monitor (rec-4025), a residual until it lands. Reversal
  conditions (decision N, review_by 2027-04-30, on_trigger "re-decide via /plan"): resume-after-threshold (manual:
  slice 4 finds at-rest sessions resuming after the threshold often enough that terminal readings mislead -- re-decide
  clause 4); turn-evidence-lost (manual: Claude Code stops recording the Stop witness and turn closes stop landing --
  re-decide clause 1); upstream-session-end (manual: Claude Code runs SessionEnd hooks with egress in cloud sessions --
  review clause 3). Related: 199, 207, 210, 212, 84, 101, 181, 177. Then add above Decision 199's trailing --- "[Amendment
  <build day>, Decision N: clause 1's root session state and duration read from turn evidence; a producer close is
  optional evidence.]". Regenerate docs/decisions-index.json, write the Decision test, run step 4.
