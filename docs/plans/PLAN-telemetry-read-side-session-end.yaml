schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: telemetry-read-side-session-end
intent: >-
  A root telemetry session's end is read from its own turns instead of waiting for a producer close row that cloud
  sessions cannot send (rec-4407): idle past the governed threshold, a session at rest reads as its last turn's outcome
  and one that stopped mid-turn reads abandoned; a producer close stays decisive only while no turn opened after it.
  Duration reads the later of the latest producer close and the latest close of any root turn, truncated toward zero
  (rec-4405). A new numbered Decision amends
  Decision 199 clause 1. Session state and duration are inputs the feedback loop and slice 4 read (PROJECT_CONTEXT
  telemetry as evidence); 0 of 28 sessions read terminal today, so neither can be used.
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-telemetry-read-side-session-end.yaml
implementation_declared: true
phase: >-
  ad_hoc_rec (rec-4407, rec-4405): the read side of rec-4407's direction (Benjamin, 2026-10-17); related tier item
  T3.20 (agent-turn telemetry capture). Closes no exit criterion (T3.20 c7 is the later schema-accuracy pass; slice 4
  owns c3). Preconditions: PLAN-telemetry-stop-turn-close's build merged (turn closes carry outcome; the golden harness
  rows are v5); PLAN-telemetry-verification-verbs's build, which changed the same reader module, is merged (909bac43). V3: the change redeploys the
  DuckLake reader Lambda (ducklake_event_read_sql.py is in the active ducklake_reader manifest, Decision 79) through
  deploy-ducklake-lambdas.yml (Decision 126), then the golden replay runs against it.
scope:
- file: src/common/ducklake_event_read_sql.py
  action: Modify
  purpose: >-
    Rules SE-1..SE-3 (execution step 2), ROOT branch only: a NEW constant ROOT_TURN_CTES (each session's latest root
    turn open, that turn's latest close, the latest close of any of its turns, all from the deduped observations o,
    and pc, the session's latest producer close with its event_timestamp and coalesce(source_ordinal, -1) under cl's
    ordering, the guard's key) composed ONLY into SESSION_STATE_SQL, SESSIONS_WINDOW_SQL and SESSIONS_WINDOW_ALL_SQL,
    and _STATE_SELECT's ROOT CASE arms (the producer-close guard, the four-branch state, outcome and duration). The
    module docstring's "written once" list and the stale state-rule comment above STATE_CTES are updated to name the
    turn rule. STATE_CTES stays byte-identical
    (AGENT_RUN_STATE_SQL composes it, tests/common/test_ducklake_event_read_sql.py pins that), as do the sub-agent arms,
    the stamps (generations, conflicted_grain_keys, derivation_conflicted) and the per-session partition bound. Only the
    three session-state verbs' read_version moves (event_read_version hashes each verb's SQL).
- file: scripts/telemetry_verify/derive.py
  action: Modify
  purpose: >-
    The independent oracle's _session_state gains SE-1..SE-3, written from the amended contract text, never from the SQL;
    the module docstring's truncation convention now cites the contract (rec-4405).
- file: docs/contracts/telemetry_sessions.yaml
  action: Modify
  purpose: >-
    Class A (the build merge needs Benjamin's word): event_kind's accepted_values note no longer says a session is
    running unless its latest lifecycle row is a close (it points at state); state's semantics carries SE-1 in prose,
    citing it as "Decision N (PLAN-telemetry-read-side-session-end)" (the citation the Decision test resolves N from),
    including the declared residual of execution step 5's clause 1 (a turn continued after a Stop that dies before its
    next Stop reads its earlier close's outcome, not abandoned); its `derivation` stays ONE
    flow-mapping line under the contracts class's 2,000-character limit (1,043 today), its formula rewritten tersely
    (the four ROOT branches, then the unchanged SUB-AGENT clause) and its inputs gaining telemetry_observations.
    observation_type, event_kind, observation_id, outcome, source_ordinal and event_id; outcome.semantics' sentence "a
    close row's outcome is the terminal state only while that close is the session's latest lifecycle row" is replaced
    (not supplemented) by the guarded rule (only while it is the latest lifecycle row and no turn opened after it) and
    says the verb's outcome is SE-2; duration_seconds' description, semantics and formula carry SE-3 with
    truncation toward zero (rec-4405), keeping the sentences "latest close's event_timestamp minus session_started_at,
    wall-clock" (the latest close now being the later of the producer close and any root turn close) and "NULL until a
    close row exists" true, and its derivation inputs gaining telemetry_observations.session_id, observation_type,
    event_kind, event_timestamp, source_ordinal and event_id; the SESSION STATE governance paragraph's sentence "The
    state is the session's latest lifecycle row" is rewritten to the turn rule naming Decision N, and the paragraph
    keeps "a resume after a close makes the session running again"; the parser v4 residual note on the last segment's
    close row keeps its words and gains the trailing clause "; since Decision N it instead reads from its turns: its
    last turn's outcome once idle at rest, abandoned once idle mid-turn (rec-4407 closed)". Phrases other tests pin stay
    true: "makes the session running again and nothing is stored" (test_contract_lifecycle_friction.py), "open row is
    due" (test_contract_amendments.py), and test_capture_v4_contract_notes.py's pins (SC-1..SC-3, PV-1..PV-4,
    rec-4407, "reads running then abandoned", "parser_version 4"); no new amendment_log summary names
    PLAN-telemetry-capture-producer-fixes or PLAN-telemetry-stop-turn-close (both plans' notes tests count their own
    entries exactly). event_timestamp's governance_notes_local sentence "duration_seconds (derived) is the latest
    close's event_timestamp minus session_started_at" gains "(the later of the producer close and any root turn close)".
    A physical line pushed past the 2,000-character limit (the governance paragraph is 1,523 today) is re-wrapped at a
    word boundary inside its folded scalar, wording unchanged (+1 effective line). Amendment_log entries. Stays inside the contracts class's 500
    effective lines by the relief order in execution step 4.
- file: docs/contracts/telemetry_agents.yaml
  action: Modify
  purpose: >-
    duration_seconds' formula and semantics state truncation toward zero to whole seconds (rec-4405). Amendment_log
    entry.
- file: docs/DECISIONS.md
  action: Modify
  purpose: >-
    NEW numbered Decision N (origin/main max + 1 at build time; 224 at plan time: 223 is on main, 219 is an unused gap),
    amends [199], at most 6,144 bytes, content pinned in execution step 5; a dated trailing annotation on Decision 199
    naming it (Decision 177 dialect; the entry's text is not rewritten).
- file: docs/decisions-index.json
  action: Modify
  purpose: Regenerated by bin/venv-python -m scripts.decisions_index --write.
- file: tests/telemetry/fixtures/derivation_cases.yaml
  action: Modify
  purpose: >-
    New hand-authored cases from the contract formulas, never from the SQL (sessions plus observations turn rows):
    c_at_rest_idle_reads_the_turn_outcome (success, error -> failed, interrupted -> cancelled), c_at_rest_not_idle_is_running,
    c_mid_turn_idle_is_abandoned (with an earlier closed turn: duration reads that turn's close),
    c_producer_close_stands_without_a_later_turn, c_turn_after_a_producer_close_reads_from_the_turn,
    c_turn_open_tied_with_the_producer_close (the guard's "not after": the producer close stands),
    c_turn_open_same_timestamp_later_ordinal_reads_from_the_turn (the guard's source_ordinal leg, mirroring c04b),
    c_producer_close_tied_with_a_turn_close, c_blocked_turn_takes_its_latest_close,
    c_turn_close_without_outcome_keeps_the_prior_rule (state by the prior rule, duration from that close) and
    c_duration_is_the_later_close_truncated. Existing cases unchanged (they carry no turn rows, so the prior rule
    reads them).
- file: tests/common/test_ducklake_event_read_verbs.py
  action: Modify
  purpose: >-
    Only if the case loader needs an observation_id or observation_type default for turn rows; every existing node keeps
    its assertions. New node test_session_end_reads_the_latest_turn (runs the new cases by id).
- file: tests/telemetry_verify/test_derive.py
  action: Modify
  purpose: >-
    New node test_oracle_session_end_follows_the_contract_branches (the oracle alone over the new cases, so a SQL bug and
    an oracle bug cannot agree by accident).
- file: tests/telemetry/fixtures/derived_golden_state.yaml
  action: Modify
  purpose: >-
    Re-authored by hand under SE-1..SE-3 (PLAN-telemetry-golden-harness constraints): each root session's state, outcome
    and duration at both as_of values re-derived from the amended formulas over its v5 rows, never copied from verb or
    oracle output; each changed entry's why cites this plan.
- file: tests/telemetry/test_contract_lifecycle_friction.py
  action: Modify
  purpose: >-
    SANCTIONED ASSERTION CHANGE (graduated check telemetry-lifecycle-friction-amendment; the property, that the state
    rule is declared in the contract, is kept): test_session_state_and_close_identity_declared's pin "running unless
    the latest row is a close" in state.semantics is replaced by the SE-1 tokens "no turn opened after it" and "stopped
    mid-turn"; its derivation-inputs loop gains telemetry_observations.observation_type, outcome and event_id. Every other pin
    (the ordering sentence, the 24 h threshold, the duration sentences, "null until a close row exists", "resume after a
    close makes the session running again", the retired-rule phrases) is unchanged and must stay true.
- file: tests/checks/contracts/test_telemetry_event_journal_contracts.py
  action: Modify
  purpose: >-
    rec-4405's acceptance node test_duration_seconds_declares_truncation_toward_zero (both contracts' duration formulas
    say truncation toward zero).
- file: tests/telemetry/test_read_side_session_end_contract_notes.py
  action: Create
  purpose: >-
    test_sessions_state_declares_the_turn_branches: state's formula and semantics carry the four branches and their
    tokens, outcome's note the producer-close guard, the amendment_log entries, and the residual note's trailing
    clause ("since Decision N it instead reads from its turns"), and the continued-turn residual; "running unless"
    appears in none of the event_kind note, the governance paragraph, state.semantics and state.derivation's formula;
    every "Decision N" citation in the contract (state.semantics, the governance paragraph's turn rule, the residual
    clause) equals the N the Decision test resolves (the same resolver, no hard-coded number); and duration_seconds'
    formula and semantics carry SE-3's token "later of the latest producer close and the latest
    close of any root turn" with its derivation inputs including telemetry_observations.observation_type, event_kind,
    event_timestamp, source_ordinal and event_id.
- file: tests/checks/decisions/test_read_side_session_end_decision.py
  action: Create
  purpose: >-
    test_decision_entry_and_annotation: resolves N from one citation, the state field's semantics sentence "Decision
    N (PLAN-telemetry-read-side-session-end)" matched by a regex (never hard-coded; the
    test_telemetry_column_additions_decision.py pattern); the entry exists, is at most 6,144 bytes, envelope number N, amends [199], significance
    numbered_decision; clauses 1-4; a Coverage line; the reversal stanza ids; the trailing --- separator; the dated
    annotation on Decision 199 above its trailing ---.
bundled_recommendations:
- rec-4407
- rec-4405
followon_recs: []
closes_criteria: []
infrastructure_dependencies:
- >-
  Precondition: PLAN-telemetry-stop-turn-close's build merged (parser_version 5 rows carry turn outcomes) and
  PLAN-telemetry-verification-verbs's build merged (same reader module). If either has not, stop and tell the
  coordinator.
- >-
  The merge redeploys the DuckLake reader Lambda through deploy-ducklake-lambdas.yml (governed CI channel, Decision
  125/126), then telemetry-golden-replay runs on workflow_run. No Terraform, IAM or writer change. The coordinator
  sequences it against any other DuckLake deploy (one at a time).
acceptance_criteria:
- >-
  A root session whose latest turn has a close reads that turn's outcome once idle past the threshold (success,
  failed for error, cancelled for interrupted) and running before; one whose latest turn has no close reads abandoned
  once idle (VP 1).
- >-
  A producer close stands only while no turn opened after it; sessions without turn outcomes keep the prior state rule;
  duration is the later of the latest producer close and the latest close of any root turn, minus the start, truncated
  (VP 1, VP 3).
- The independent oracle agrees with the verbs on every case and on the re-authored golden files (VP 2, VP 6).
- Decision N is on main in the pinned shape and annotates Decision 199; the contracts carry the rule (VP 3, VP 4).
- >-
  The governed deploy is green, the deployed reader serves the new state rule's read_version and the golden replay
  passes; rec-4407 and rec-4405 read closed (VP 9-12).
verification_plan:
- step: 1
  phase: pre-deploy
  action: The reader's state rule on hand-authored rows, every branch.
  command: >-
    bin/venv-python -m pytest tests/common/test_ducklake_event_read_verbs.py::test_session_end_reads_the_latest_turn
    tests/common/test_ducklake_event_read_verbs.py -q
  expected: Exit 0, every node passes. Red before because the node and the cases are absent.
  fix_if: >-
    Fix the SQL, never a case, unless the case misreads the contract text; a changed existing case means the prior
    rule moved for sessions without turn rows.
  hermetic: false
  graduation: waive
  graduation_waiver_reason: >-
    The module needs duckdb (a module-level importorskip, exception (iii) of hermetic authoring) and the full tier
    already runs it as the reader's derivation gate.
- step: 2
  phase: pre-deploy
  action: The independent oracle reads the same branches from the contract text.
  command: bin/venv-python -m pytest tests/telemetry_verify/test_derive.py::test_oracle_session_end_follows_the_contract_branches -q
  expected: Exit 0. Red before because the node is absent.
  fix_if: Fix the oracle from the contract text; never align it to the SQL.
  hermetic: true
  graduation: graduate
  graduation_check_id: telemetry-verify-oracle-session-end
- step: 3
  phase: pre-deploy
  action: The contracts carry the rule and rec-4405's truncation, and pass the drift and size gates.
  command: >-
    bin/venv-python -m pytest tests/telemetry/test_read_side_session_end_contract_notes.py
    tests/checks/contracts/test_telemetry_event_journal_contracts.py::test_duration_seconds_declares_truncation_toward_zero
    -q && bin/venv-python -c "from scripts.checks.contracts.validate_contract_drift import validate_contract_drift as
    v;f=[];v(f);assert not f, f;print('CONTRACTS_OK')" && bin/venv-python -c "from scripts.checks.structural.size_limits
    import validate_structural_size_limits as v;f=[];v(f);assert not f, f;print('SIZE_OK')"
  expected: The nodes pass, then CONTRACTS_OK and SIZE_OK. Red before because the new module and node are absent.
  fix_if: Fix the text the node names or the amendment_log shape; a size failure takes the relief order, never a raise.
  hermetic: true
  graduation: waive
  graduation_waiver_reason: A one-time text check of amended contracts plus standing validators scripts.validate runs.
- step: 4
  phase: pre-deploy
  action: Decision N is in the pinned shape and annotates Decision 199; the index matches.
  command: >-
    bin/venv-python -m pytest tests/checks/decisions/test_read_side_session_end_decision.py::test_decision_entry_and_annotation
    -q && bin/venv-python -m scripts.decisions_index --check
  expected: Exit 0 from both. Red before because the test file is absent.
  fix_if: Rewrite the entry to the pinned shape, add the annotation, regenerate the index.
  hermetic: true
  graduation: waive
  graduation_waiver_reason: >-
    A one-time text check of an append-only Decision entry; the standing decision-entry conformance and index checks
    already guard the corpus.
- step: 5
  phase: pre-deploy
  action: Only the three state verbs' read_version moved; every other event verb's equals its origin/main value.
  command: >-
    W="$(mktemp -d)/rv" && git worktree add -q "$W" origin/main && (cd "$W" && "$OLDPWD/bin/venv-python" -c "import
    json;from src.common import ducklake_event_reads as ev;print(json.dumps({v:r['read_version'] for v,r in
    ev.describe_all().items() if r.get('kind')=='event_journal'}))") > "$W.json" && bin/venv-python -c "import
    json,sys;from src.common import ducklake_event_reads as ev;old=json.load(open(sys.argv[1]));new=ev.describe_all();
    moved=sorted(v for v in old if new[v]['read_version']!=old[v]);print({'compared':len(old),'moved':moved});
    assert moved==['session_state_and_duration','sessions_window','sessions_window_all_purposes'],moved;print('RV_OK')"
    "$W.json"; rc=$?; git worktree remove --force "$W"; exit $rc
  expected: One line naming the three moved verbs, then RV_OK.
  fix_if: >-
    Another verb moved: the edit leaked outside the ROOT state branch (or a shared CTE changed); keep shared text
    byte-identical. If describe_all names the kind differently, use the existing names and say so.
  hermetic: false
  graduation: not-applicable
- step: 6
  phase: pre-deploy
  action: The golden harness under the new rule -- the re-authored derived_golden_state reconciles and the oracle agrees.
  command: >-
    bin/venv-python -m pytest tests/telemetry_verify tests/telemetry/test_derived_layer_reconciliation.py -m "not
    integration" -q
  expected: Exit 0, every node passes, the golden reconcile, oracle agreement and mutation nodes included.
  fix_if: >-
    Re-derive a failing authored value by hand from the amended formula, never by copying verb or oracle output; any
    golden harness file other than derived_golden_state.yaml needing a change means stop and escalate to the coordinator.
  hermetic: false
  graduation: waive
  graduation_waiver_reason: >-
    The golden harness's graduated rows, run by the full tier; a whole-module run above validate_vp_replay's 120 s
    aggregate (rec-4421).
- step: 7
  phase: pre-deploy
  action: Each changed module reaches 100% coverage from its mapped test; lint and the 500-SLOC limit hold.
  command: >-
    bin/venv-python -m scripts.test_coverage_checker --check-tests --check-coverage --files
    src/common/ducklake_event_read_sql.py scripts/telemetry_verify/derive.py && bin/venv-python -m ruff check
    src/common scripts/telemetry_verify tests/common tests/telemetry_verify tests/telemetry tests/checks && bin/venv-python
    -c "from scripts.checks.sloc.sloc_limits import validate_sloc_limits as v;f=[];v(f);assert not f, f;print('SLOC_OK')"
  expected: Exit 0 from each, then SLOC_OK.
  fix_if: Cover the new branches; fix lint at its source.
  hermetic: false
  graduation: not-applicable
- step: 8
  phase: pre-deploy
  action: Fast tier, then the full tier before handoff.
  command: bin/venv-python -m scripts.validate --pre && bin/venv-python -m scripts.validate
  expected: Exit 0 on a completed full run; a timeout is not a pass (handoff_policy).
  fix_if: Fix the named check; never skip or weaken one.
  hermetic: false
  graduation: not-applicable
- step: 9
  phase: post-deploy
  action: >-
    The governed deploy of the merge commit succeeded, every job included. Read with mcp__github__actions_list
    (list_workflow_runs, workflow deploy-ducklake-lambdas.yml, head_sha $MERGE_SHA) then list_workflow_jobs for that
    run, writing the jobs JSON to $DEPLOY_JOBS_JSON.
  command: >-
    test -s "$DEPLOY_JOBS_JSON" && bin/venv-python -c "import json,os;j=json.load(open(os.environ['DEPLOY_JOBS_JSON']));
    jobs={x['name']:x.get('conclusion') for x in (j.get('jobs') if isinstance(j,dict) else j)};print(jobs);
    want=['deploy-maintenance','maintenance-smoke','reconcile-gate','deploy-serving','smoke']; assert all(any(n.startswith(w)
    and c=='success' for n,c in jobs.items()) for w in want),jobs;print('DEPLOY_OK')"
  expected: Every named job concluded success (a skipped job fails this step), then DEPLOY_OK.
  fix_if: A failed deploy or smoke step is this plan's to root-cause and fix forward, never a re-run to green (Decision 55).
  hermetic: false
- step: 10
  phase: post-deploy
  action: The deployed reader serves the new state rule and answers a real window.
  command: >-
    export DUCKLAKE_READER_URL=$(aws ssm get-parameter --profile agent_platform --region eu-west-2 --name
    /agent-platform/ducklake/reader_url --query Parameter.Value --output text) && AWS_PROFILE=agent_platform
    bin/venv-python -c "import datetime as d;from scripts.ducklake_smoke import core;from
    src.common import ducklake_event_reads as ev;u=core._function_url('reader');desc=core._sigv4_invoke(u,{'action':'describe'}).json()['verbs'];
    want=ev.describe_all();vs=('session_state_and_duration','sessions_window','sessions_window_all_purposes');
    assert all(desc[v]['read_version']==want[v]['read_version'] for v in vs),[desc.get(v) for v in vs];
    t=d.datetime.now(d.timezone.utc);f=str((t-d.timedelta(days=2)).date());
    r=core._sigv4_invoke(u,{'action':'named_read','verb':'sessions_window','params':{'day_from':f,'day_to':str(t.date()),'as_of':t.isoformat()}}).json();
    assert r['ok'];from collections import Counter;print(dict(Counter(x['state'] for x in r['rows'])));print('LIVE_STATE_OK')"
  expected: One line of root-session counts by state over the last three days, then LIVE_STATE_OK.
  fix_if: >-
    A read_version mismatch means the deployed reader predates the merge: check the deploy run's head SHA, never relax
    the comparison. If the window verb's parameters or row shape are named differently, use the existing names and say so.
  hermetic: false
- step: 11
  phase: post-deploy
  action: >-
    The golden replay ran green for the merge commit: the telemetry-golden-replay run with event workflow_run created
    after the deploy run for $MERGE_SHA completed (confirm its checkout SHA in its job log), log saved to $REPLAY_LOG.
  command: >-
    grep -E "GOLDEN_SMOKE trees=[1-9][0-9]* expectations=[1-9][0-9]* .*mismatches=0" "$REPLAY_LOG"
  expected: One matching GOLDEN_SMOKE line and a run concluded success; report the line verbatim.
  fix_if: >-
    A mismatch on the deployed engine with the local legs green is an engine or transport defect: name the tree and verb
    from the failure line, file it through the portal and fix forward; never relax an expectation for one engine.
  hermetic: false
- step: 12
  phase: post-deploy
  action: The bundled recs closed through the squash-merge Resolves trailer.
  command: >-
    AWS_PROFILE=agent_platform bin/venv-python -c "from src.common.ducklake_reader_client import fetch_recs_by_ids,
    make_reader; rows, missing = fetch_recs_by_ids(make_reader(), ['rec-4407','rec-4405']); st={r['id']: r['status']
    for r in rows}; print(st, missing); assert not missing and set(st.values()) == {'closed'}, st"
  expected: Both read status closed, each naming this merge.
  fix_if: A rec stayed open; check the trailer and the ci.yml closure job's run; close it through the portal with its acceptance evidence.
  hermetic: false
rollback: >-
  Revert in a new PR: the reader's prior rule returns at the next governed deploy (no stored row changes; state is
  derived at read). The Decision is superseded by a later numbered Decision, never edited (Decision 177).
