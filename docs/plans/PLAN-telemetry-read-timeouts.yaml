  action: Modify
  purpose: The description and governance auth_type sentences name the telemetry catalog's merge_ops as hourly (cron(50 * * * ? *));
    the ops catalog's every-6h cadence and the historical amendment_log rows are unchanged. One new amendment_log row. All three edits
    are bound word for word by the approved-text sidecar.
  new_imports: []
- file: docs/DECISIONS.md
  action: Modify
  purpose: 'Decision 236 gains one trailing_bracket amendment line after its existing 2026-10-29 amendment: clause 5''s cadence is retuned
    to the write rate under Decision 88 cl.1(iii), so the telemetry merge_ops runs hourly. Bound word for word by the approved-text
    sidecar docs/plans/approved/telemetry-read-timeouts.yaml (Decision 246).'
  new_imports: []
- file: scripts/telemetry_verify/session_presence.py
  action: Modify
  purpose: '_walk: a roots_for call that raises ReadDeadlineExceededError (imported from src.common.ducklake_reader_client, as scripts/telemetry_usage.py
    does) is never retried as is. The window [first..last] splits with telemetry_usage''s rule (older half first..first+((days+1)//2-1),
    newer half the rest) and the NEWER half is read first, each half read the same way down to one day; after each successful read,
    if remaining is empty the walk stops and skips the unread halves. A one-day window that still answers read_deadline_exceeded raises
    Unreadable(''ReadDeadlineExceededError''). A module constant MAX_DEADLINE_HITS = 4 caps deadline-hit reads per run (about 4 x 111
    s, well inside the 30-minute job timeout); the fifth raises Unreadable(''ReadBudgetExceeded''), so the ARRIVAL line and junit are
    still written. Every other exception keeps today''s one retry then Unreadable. windows_read counts each successful read. The ARRIVAL
    line format is unchanged. The module docstring''s ''Imports only the standard library and yaml'' gains the reader client''s error
    class.'
  new_imports:
  - src.common.ducklake_reader_client
- file: tests/telemetry_verify/test_session_presence.py
  action: Modify
  purpose: 'Three new nodes, existing nodes unchanged. test_walk_halves_window_on_read_deadline (rec-5248''s acceptance): newest day
    N, window_days 7, a fake roots_for raising ReadDeadlineExceededError for any window over 3 days, the only key present on day N-5:
    the walk ends green and roots.calls equals [(N-6,N), (N-2,N), (N-6,N-3), (N-4,N-3), (N-6,N-5)] in ISO dates, windows_read 3. test_a_one_day_read_deadline_is_unreadable:
    a fake raising for every window ends unreadable with cause ReadDeadlineExceededError once the newest one-day leaf (N,N) fails, with
    that leaf called exactly once. test_read_deadline_cap_ends_unreadable: a fake raising for every window over 1 day while the key
    is never found ends unreadable with cause ReadBudgetExceeded after exactly MAX_DEADLINE_HITS + 1 deadline-hit calls.'
  new_imports: []
