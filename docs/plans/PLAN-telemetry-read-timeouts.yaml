slug: telemetry-read-timeouts
intent: 'Stop telemetry reads timing out as small files pile up between compactions. Every telemetry write lands as its own small file
  and the production telemetry catalog is merged only every 6 hours, so a cold reader that reads the newest days fetches every unmerged
  file one at a time and, at today''s write rate, hits its 110 s read deadline within about 40 minutes of a merge: the post-deploy reader
  smoke (rec-5247) and the post-merge arrival check (rec-5248) went red. The plan merges the telemetry catalog every 20 minutes, and
  lets the arrival check narrow one deadline-hit window, as the reader contract asks, without adding reader load.'
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-telemetry-read-timeouts.yaml
phase: 'ci_rca (soft-warn exception category): repairs Critical reds rec-5247 and rec-5248 under docs/contracts/red-main-recovery.yaml
  (Decision 226). No tier_item is targeted and no exit criterion is closed. The cold small-file read cost stays owned by rec-4474.'
