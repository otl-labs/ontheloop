infrastructure_dependencies:
- 'terraform/personal: one aws_cloudwatch_event_rule schedule and target input change, one in-budget inline-policy statement on the
  maintenance role (Decision 92 cl.5), one new alarm. Planned and applied by CI on merge (the guarded terraform/personal apply path,
  docs/contracts/environment-taxonomy.yaml); never a local terraform init/plan/apply (Decision 119).'
- 'Lambda code: agent-platform-ducklake-maintenance (status active) ships through the governed code-deploy channel deploy-ducklake-lambdas.yml
  on merge, behind maintenance-smoke (Decision 125/126). Order is safe either way: old code ignores the backlog_gate key and merges
  on every tick until the new code lands (bounded by the deploy, minutes); new code without the rule change keeps the every-6h rule
  with no backlog_gate key, so today''s path.'
acceptance_criteria:
- The production telemetry catalog's merge rule ticks every 5 minutes except :15, :30 and :45 and carries backlog_gate {min_commits
  60, max_unmerged_minutes 30, max_age_hours 6}, pinned by the terraform tests; every maintenance rule's minute set is disjoint from the others.
- merge_ops with a backlog_gate merges when at least 60 telemetry commits landed since the last pass, when any commit has waited
  30 minutes, when no pass ran in 6 hours, or when the gate's own reads fail; otherwise it returns skipped without opening a catalog connection, and every tick emits the backlog.
- The maintenance role gains only cloudwatch:GetMetricStatistics; the reader has a slow-call alarm at a 100 s maximum.
- Decision 236 clause 5 and docs/contracts/ducklake_maintenance.yaml describe the backlog-gated merge in the operator-approved words.
- After the deploy, for 24 hours on a busy day (at least 1,500 writer invocations) the telemetry reader's maximum Duration stays below
  100 s, no telemetry-arrival run ends unreadable on ReadDeadlineExceededError, the writer's OccRetryCount does not rise and the maintenance
  function is not throttled outside its known Sunday overlap; rec-5247 and rec-5248 are closed.
- Seven days after the deploy, merge passes per day, maintenance duration and catalog file column stats rows are read and recorded
  against the estimate (2 to 5 US dollars a month).
