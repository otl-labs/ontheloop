- step: 6
  phase: pre-deploy
  action: Full tier, then HEAD attestation, after the build commit and rebase and before the push; start it backgrounded from the top-level
    session with a 2 h limit and read only the attestation.
  command: bin/venv-python -m scripts.validate && bin/venv-python -m scripts.checks.validation_result --verify-head
  expected: the full tier exits 0 and the attestation matches HEAD
  fix_if: any failure; fix and rerun from the start
