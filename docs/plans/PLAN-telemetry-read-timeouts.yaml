context:
- 'Measured 2026-11-17 (raw files: /mnt/project-files/telemetry-read-timeouts/advisor-brief/). Writer invocations per busy day: 2,736
  (10-30), 2,636 (11-12), 2,712 (11-16); the lows are weekends and the three capture outages. Reader Duration maximum reached 110 s on
  10-29, 10-30, 10-31, 11-11, 11-12, 11-16 and 11-17, every busy day. Typical reads take under 1 s; the slow ones are the newest-window
  reads. The arrival check''s first (newest) 7-day read took 14-46 s at under 100 unmerged writer calls, about 80 s near 300, and hit
  the deadline from about 380 (11-17) or 510 (11-16).'
- Merge passes ran 0.5-155 s; files after a merge 117-153 all week; writer OccRetryCount 0 every day 11-10..17.
- 'Decision 266: every gated pass runs merge_ops''s rewrite_current_deletes step on the telemetry catalog''s ops_projects_current and
  ops_tenants_current, still only inside a scheduled merge_ops pass (cl.1). Inferred, not measured: the step merged 2026-11-16 17:38Z
  (#2068) and most measured passes predate it; its budget is 450 s of the 900 s timeout. A cl.3 proof mismatch is a breaker trip that
  aborts before MergeOpsTablesCount, so it repeats on each gated trigger (at least commits/60 a day, plus age-bound triggers in quiet
  hours, so up to about 60 a day by this plan''s sizing, instead of 4) until the cells read apply false; merges stay suspended as cl.3 requires, with more trips and Neon wakes.'
- 'Blind consult (Fable, 2026-11-17, ADVICE-fable-telemetry-read-timeouts-2026-11-17.md in the same folder): the backlog in the newest
  partitions drives the timeouts; reject clock-only cadence changes and window narrowing; trigger the merge on backlog, alarm on the
  pile and reader duration, and cut files at the source later. Operator chose this path 2026-11-17 14:54Z (cmsg_01YbaDZWowGfXCn2WtobCVVoTaL6Mq6CEoizRq4oTSbtu8).'
- 'Sizing: writer invocations run about 1.7-2.7 per committed append (1,731 commits on 11-17). At the 11-17 slope (about 0.25 s per
  unmerged writer invocation, so about 0.5 s per commit, on the newest window) a pass at 60 commits keeps the newest read well inside
  the deadline. The busiest 10 minutes measured held 88 commits (11-17 17:10Z), so with ticks at most 6 minutes apart a pass starts
  at no more than about 60 + 53 = 113 commits, plus commits during a pass that runs late (VP 7 allows about 150). The 30-minute age
  bound caps quiet-hour waits. Gate ticks take about 1 s and touch no catalog.'
- 'Second consult (Fable, ADVICE-fable-telemetry-inlining-2026-11-17.md): inlining needs the writer off MERGE INTO (a MERGE never inlines
  in DuckDB 1.5.4; re-verified locally 17:5xZ) and writer deploys are held, so this plan is stage 1 and stage 2 is rec-5291. Adopted:
  committed-append counts instead of invocations, an age bound. Declined: a psycopg backlog query on each active tick (wakes Neon and
  needs a catalog login; the commit count is the same signal from CloudWatch); dropping throttled ticks (the event-invoke config is
  function-wide and would also drop the other jobs'' retries; a throttled gate tick is retried and costs about 1 s); tiered merging
  (each gated pass re-supersedes about one merged file per table per touched day, inferred about 240 a day at 60 passes, small beside
  the 2,000-6,000 small files a busy day already supersedes; VP 13 measures files superseded per day). Operator chose both stages 2026-11-17
  18:18Z (cmsg_01YbaDZWowGfXCn2WtobCVVoNiostf2roVyoiWuEpjT3V3).'
- 'Dependency on rec-5291: the gate counts DuckLakeTelemetryWriter CommitLatencyMs samples; if stage 2 renames or stops that EMF series,
  the gate sees no commits and only the every-6h floor merges (the reader-slow alarm would fire). rec-5291''s build keeps the series or
  moves the gate in the same PR.'
- 'Deploy order (critique round 4 B4): the new rule names a new action, merge_ops_gated. Until the deploy gate ships the new code (hours
  after merge, longer while main is red; Decision 249) the old code answers 400 for an unknown action without opening a catalog connection,
  and the unchanged every-6h rule keeps merging. The unknown-action 400 is not an error metric on any alarm. VP 7 reads the deploy run.'
- 'Unreadable gate (critique round 4 B5, scout round 5 Decision 88 note): an unreadable tick skips, so a broken read can never merge
  every tick; the floor rule still merges every 6 hours, and the ducklake-telemetry-merge-gate-unreadable alarm makes it red within the
  hour (Decision 250).'
- 'Inferred, outside this plan: the telemetry catalog''s first snapshot expiry falls about 2026-11-27 (30-day retention from capture
  start); the first real gc_ops may meet many superseded small files against the breaker''s file-share cap. VP 12 reads that Sunday.'
- 'Spend and deploy (always_ask, Decision 246 cl.4): UNPROVEN estimate 2-5 USD/month (about 480 one-second gate ticks a day, about
  43,000 CloudWatch metric reads a month, merges only while writes keep Neon awake); VP 13 measures it beside Decision 214''s capped-bill
  trigger. IAM: one read-only statement. The operator''s plan approval must name both; his 2026-11-16 ruling (cmsg_01YbaDZWowGfXCn2WtobCVVoNkoksprjGv5Mz9HrYSDG27)
  lets the build merge on review PROCEED and green CI once he has approved the plan.'
- 'Singleton (reserved concurrency 1): control_health :15 (about 45 s), telemetry merge floor :50 every 6 h (up to about 155 s), ops
  merge :30 every 6 h (450 s budget), ops gc Sun 03:45 (up to 244 s), telemetry gc Sun 04:05. Gated minutes avoid the three minutes
  up to each of :05, :15, :30, :45 and :50, so a gated pass of up to about 155 s started on a scheduled tick ends before the next
  reserved start. A gate tick that meets a running pass is throttled and retried by Lambda, so a retried tick can start a pass off
