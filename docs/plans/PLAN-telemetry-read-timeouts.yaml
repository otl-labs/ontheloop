constraints:
- No account id, host, URL or response body in code, tests, failure text or PR text (Decision 101).
- The reader's timeout, memory, threads and deadline margin are unchanged; read cost stays with rec-4474 and rec-5293, files at the source with rec-5291, the arrival read load with rec-5292.
- The reader smoke gate and the arrival check are unchanged (Decision 235); no window is narrowed and nothing is retried to go green.
- No existing alarm's threshold, period or evaluation count changes; the ops catalog's every-6h merge is unchanged.
- The gate reads CloudWatch only and never opens a catalog connection on a skip, so a quiet catalog is not woken.
- No rescue agents or workaround loops (Decision 55).
- docs/contracts/ducklake_maintenance.yaml is NEAR_CAP (489 of 500 effective lines); only the amendment_log row adds a line; if main
  has used the headroom, stop and report, never a raise (Decision 128).
