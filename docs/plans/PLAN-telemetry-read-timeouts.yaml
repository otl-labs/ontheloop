scope:
- file: src/lambdas/ducklake_maintenance/backlog_gate.py
  action: Create
  purpose: 'decide(gate, now, client) -> GateDecision for merge_ops. gate is the event''s backlog_gate object {min_commits, max_unmerged_minutes,
    max_age_hours, meta_schema}; client is a boto3 CloudWatch client (injected). It reads the newest MergeOpsTablesCount datapoint for
    the MetaSchema over the last max_age_hours (period 60, SampleCount) as the last pass time, then the telemetry writer''s committed
    appends since then: DuckLakeTelemetryWriter CommitLatencyMs SampleCount with the same MetaSchema dimension (period 60; one sample
    per committed append, so refusals, describes and other verbs are excluded; 1,020 on 2026-11-16 against 2,712 invocations). merge
    is true when no pass is found in max_age_hours (reason max_age), when commits reach min_commits (reason backlog), when any commit
    waits and the last pass is at least max_unmerged_minutes old (reason age), or when either read raises (reason gate_unreadable:
    a non-destructive merge is the safe side; Decision 250 treats unreadable as a signal, so it is logged and counted, never silent).
    GateDecision carries merge, reason, commits (None when unreadable) and last_pass (ISO or None). Validates the gate object and raises
    DuckLakeRuntimeError on a missing or non-positive field. Standard library and boto3 only; no catalog connection.'
  new_imports: []
- file: src/lambdas/ducklake_maintenance/handler.py
  action: Modify
  purpose: 'action_merge_ops: when the event carries backlog_gate, call backlog_gate.decide before opening any connection; emit MergeOpsBacklogCommits
    (when known) and, on gate_unreadable, MergeOpsGateUnreadable 1.0 through the catalog sink; on merge false return {ok, action, skipped:
    true, reason, commits, last_pass} without touching the catalog. Without backlog_gate the action is unchanged (the ops rule and
    human invokes). After the per-table loop, emit MergeOpsFilesBeforeTotal as the sum of the per-table before counts (skipped when any
    count was unavailable, as files_after already is).'
  new_imports:
  - src.lambdas.ducklake_maintenance.backlog_gate
- file: src/lambdas/ducklake_maintenance/_shared.py
  action: Modify
  purpose: CATALOG_METRICS gains MergeOpsBacklogCommits, MergeOpsGateUnreadable and MergeOpsFilesBeforeTotal.
  new_imports: []
- file: tests/lambdas/ducklake_maintenance/test_backlog_gate.py
  action: Create
  purpose: 'Fake CloudWatch client (datapoints keyed by namespace and metric, raising on demand). Nodes: test_merges_at_the_backlog_threshold
    (rec-5248 acceptance: last pass 10 min ago, 60 commits -> merge, reason backlog; 59 -> no merge), test_merges_waiting_commits_after_the_age_bound
    (1 commit, last pass 30 min ago -> merge, reason age; 0 commits -> no merge), test_merges_after_max_age_without_writes (no MergeOpsTablesCount
    datapoint in 6 h -> merge, reason max_age, and the commit read is not made), test_unreadable_metrics_merge_and_say_so (a raising
    client -> merge, reason gate_unreadable, commits None), test_reads_commits_from_the_last_pass (the CommitLatencyMs query names the
    MetaSchema dimension and starts at the newest pass timestamp), test_rejects_a_malformed_gate (missing meta_schema, zero min_commits).'
  new_imports: []
- file: tests/lambdas/ducklake_maintenance/handler/test_merge_ops_backlog_gate.py
  action: Create
  purpose: 'Handler nodes with decide and the connection opener monkeypatched: test_skip_opens_no_connection (merge false -> skipped
    response, the opener is never called, MergeOpsBacklogCommits emitted with the MetaSchema dimension), test_merge_runs_the_unchanged_pass
    (merge true -> the existing pass runs), test_no_gate_keeps_todays_path (no backlog_gate -> decide is never called),
    test_files_before_total_is_emitted (the sum of per-table before counts).'
  new_imports: []
- file: terraform/personal/ducklake_maintenance_telemetry.tf
  action: Modify
  purpose: 'The telemetry merge rule''s schedule_expression becomes cron(0,5,10,20,25,35,40,50,55 * * * ? *) (every 5 minutes except
    :15, :30 and :45, which control_health, the ops merge and the Sunday gc windows use) and its description says backlog-gated; the
    target input adds backlog_gate = {min_commits = 60, max_unmerged_minutes = 30, max_age_hours = 6, meta_schema =
    local.ducklake_telemetry_prod_meta_schema}. The header (line 3''s every-6h merge, the cadence
    comment at lines 13-14 and line 15''s first :50 pass) is updated to match. Every alarm block is unchanged; the merge-liveness alarm''s
    6-hour lookback still holds because max_age_hours forces a pass at least every 6 hours.'
  new_imports: []
- file: terraform/personal/ducklake_maintenance.tf
  action: Modify
  purpose: 'aws_iam_role_policy.ducklake_maintenance gains one statement after CloudWatchMetrics: Sid CloudWatchMetricReads, Action
    [cloudwatch:GetMetricStatistics], Resource "*" (the action has no resource-level scoping). Read-only, inside the apply boundary''s
    cloudwatch:* ceiling, so an in-budget inline-policy UPDATE on a boundary-carrying role (Decision 92 cl.5).'
  new_imports: []
- file: terraform/personal/ducklake_telemetry_reader.tf
  action: Modify
  purpose: 'One alarm, ducklake_telemetry_reader_slow: AWS/Lambda Duration Maximum for the telemetry reader, period 900, evaluation_periods
    4, datapoints_to_alarm 2, threshold 100000 (ms), GreaterThanOrEqualToThreshold, treat_missing_data notBreaching, alarm_actions
    the alerts topic as the reader errors alarm uses. It watches the symptom the backlog gate exists to prevent.'
  new_imports: []
- file: tests/checks/iam_tf/test_telemetry_production_maintenance_tf.py
  action: Modify
  purpose: 'test_rules_target_the_production_telemetry_catalog pins the merge cron to "0,5,10,20,25,35,40,50,55 * * * ? *" and the target''s
    backlog_gate keys and literals (planned change citing acceptance_criteria[0]); the gc pin is unchanged. test_admin_cadence_minutes_are_distinct
    expands each rule''s minute field (list, range or start/step) into a minute set and asserts the merge set excludes 15, 30 and 45
    and every other rule''s set is pairwise disjoint (a strengthening; today it compares strings). New node test_reader_slow_alarm_pins
    pins the reader alarm''s metric, statistic, threshold, periods and treat_missing_data.'
  new_imports: []
- file: tests/checks/iam_tf/test_ducklake_maintenance_gc_rule_invariants.py
  action: Modify
  purpose: 'test_maintenance_role_iam_is_not_widened''s expected Sid list gains CloudWatchMetricReads (planned change citing acceptance_criteria[2]);
    a new assertion pins that statement to exactly [cloudwatch:GetMetricStatistics]; the namespace condition and the telemetry-prefix
    assertions are unchanged.'
  new_imports: []
- file: docs/contracts/ducklake_maintenance.yaml
  action: Modify
  purpose: The description and governance sentences name the telemetry catalog's backlog-gated merge; the merge_ops payload_schema_ref
    names the optional backlog_gate object; one amendment_log row. All edits are bound word for word by the approved-text sidecar.
  new_imports: []
- file: docs/DECISIONS.md
  action: Modify
  purpose: 'Decision 236 gains one trailing_bracket amendment line after its 2026-10-29 amendment: cl.5''s telemetry merge_ops becomes
    backlog-gated under Decision 88 cl.1(iii). Bound word for word by the approved-text sidecar (Decision 246).'
  new_imports: []
