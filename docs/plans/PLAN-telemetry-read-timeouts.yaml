    sidecar docs/plans/approved/telemetry-read-timeouts.yaml (Decision 246).'
  new_imports: []
- file: scripts/telemetry_verify/session_presence.py
  action: Modify
  purpose: '_walk: a roots_for call that raises ReadDeadlineExceededError (imported from src.common.ducklake_reader_client, as scripts/telemetry_usage.py
    does) is never retried as is. Each run tolerates ONE deadline hit (module constant MAX_DEADLINE_HITS = 1), answered by splitting
    that window with telemetry_usage''s rule (older half first..first+((days+1)//2-1), newer half the rest) and reading the NEWER half
    first, then the older; after each successful read, if remaining is empty the walk stops and skips unread halves. A deadline hit
    on a one-day window raises Unreadable(''ReadDeadlineExceededError''); any other second deadline hit raises Unreadable(''ReadBudgetExceeded'').
    So a failing run makes at most two deadline-hit reads, as today''s two attempts do, and the job always writes its ARRIVAL line.
    Every other exception keeps today''s one retry then Unreadable. windows_read counts each successful read; the ARRIVAL line format
    is unchanged. The module docstring''s ''Imports only the standard library and yaml'' names the reader client''s error class.'
  new_imports:
  - src.common.ducklake_reader_client
- file: tests/telemetry_verify/test_session_presence.py
  action: Modify
  purpose: 'Three new nodes, existing nodes unchanged; newest day N, ISO dates. test_walk_halves_window_on_read_deadline (rec-5248''s
    acceptance): window_days 7, a fake raising ReadDeadlineExceededError for any window over 4 days, the only key on day N-5: green,
    roots.calls == [(N-6,N), (N-2,N), (N-6,N-3)], windows_read 2. test_a_one_day_read_deadline_is_unreadable: window_days 2, a fake
    raising for every window: unreadable with cause ReadDeadlineExceededError, calls == [(N-1,N), (N,N)]. test_read_deadline_cap_ends_unreadable:
    window_days 7, a fake raising for any window over 1 day: unreadable with cause ReadBudgetExceeded, calls == [(N-6,N), (N-2,N)].'
  new_imports: []
