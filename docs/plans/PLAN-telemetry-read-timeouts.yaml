  never a local terraform init/plan/apply (Decision 119). Post-deploy proof is VP 7 (hourly MergeOpsTablesCount datapoints for MetaSchema
  ducklake_telemetry).'
acceptance_criteria:
- The production telemetry catalog's merge_ops rule fires hourly at :50 UTC (cron(50 * * * ? *)), pinned by the terraform test.
- Decision 236 clause 5 and docs/contracts/ducklake_maintenance.yaml say hourly for the telemetry catalog, in the operator-approved
  words.
- The arrival check narrows a window that answers read_deadline_exceeded down to one day instead of going red, still judges every merged
  session, is unreadable when a one-day window still times out, and stops at four deadline hits per run so the job always writes its
  ARRIVAL line.
- After the apply, the telemetry merge runs hourly; for 24 hours the telemetry reader's maximum Duration stays below 100 s, every telemetry-arrival
  run concludes success and the writer's OccRetryCount does not rise; the first Sunday shows no maintenance throttle; rec-5247 and rec-5248
  are closed.
- Seven days after the apply, the extra maintenance compute and the telemetry catalog's file column stats rows are read and recorded
  against the 3 to 12 US dollar estimate.
