  expected: writer invocations sum at least 1500; reader Duration maximum below 100000 (ms); writer OccRetryCount sum no higher than
    the 24 h before the deploy (0 on every day 2026-11-10..17); record the three lines.
  fix_if: 'a Duration maximum at or above 100000 with the backlog maximum under 250 means the cost is no longer the backlog alone: record
    the hour on rec-4474 and rec-5293 and report to the coordinator; a rising OccRetryCount is reported to the coordinator; nothing
    is widened or raised in this plan'
  hermetic: false
- step: 9
  phase: post-deploy
  action: rec-5247 and rec-5248 are closed by the squash's Resolves trailer.
  command: AWS_PROFILE=agent_platform bin/venv-python -c "from src.common.ducklake_reader_client import fetch_recs_by_ids, make_reader;
    rows, _ = fetch_recs_by_ids(make_reader(), ['rec-5247', 'rec-5248']); print([(r['id'], r['status']) for r in rows])"
  expected: both closed; record the closure job run id.
  fix_if: a ClosureArtifactRequired refusal means the shard is not in the squash; land it and re-run the closure route; never close
    with a direct status write after a refusal (Decision 186)
  hermetic: false
- step: 10
  phase: post-deploy
  action: No telemetry-arrival run in the 24 h of step 8 ended unreadable on a read deadline; other outcomes reported separately.
  command: for id in $(gh api "repos/otl-labs/ontheloop/actions/workflows/telemetry-arrival.yml/runs?per_page=100&created=>=$(date -u
    -d '-24 hours' +%Y-%m-%dT%H:%M:%SZ)" --jq '.workflow_runs[] | select(.status == "completed") | .id'); do line=$(gh run view $id -R
    otl-labs/ontheloop --log 2>/dev/null | grep -o -E 'ARRIVAL status=[a-z]+|ARRIVAL_UNREADABLE cause=[A-Za-z]+' | tail -1); echo "$id
    ${line:-no-arrival-line}"; done | awk '{print $2, $3}' | sort | uniq -c
  expected: no line reading ARRIVAL_UNREADABLE cause=ReadDeadlineExceededError; green, red (missing keys), cancelled and no-arrival-line
    counts are recorded separately and are not this plan's verdict.
  fix_if: a deadline unreadable goes on rec-4474 and rec-5293 and to the coordinator with its run id; a red naming a missing key
    is the arrival config owner's, reported to the coordinator
  hermetic: false
- step: 11
  phase: post-deploy
  action: 'rec-5247''s failing call, live: a one-day sessions_window during a busy afternoon hour.'
  command: AWS_PROFILE=agent_platform bin/venv-python -c "import time, datetime as t; from scripts.telemetry_capture import read_route;
    d = t.datetime.now(t.timezone.utc); s = time.monotonic(); r = read_route.make_routed_reader().named('sessions_window', day_from=d.date().isoformat(),
    day_to=d.date().isoformat(), as_of=d.isoformat()); print('rows', len(r), 'elapsed_s', round(time.monotonic() - s, 1))"
  expected: prints rows and an elapsed_s below 100; record the line, the minute it ran and that hour's writer invocations.
  fix_if: a ReadDeadlineExceededError is recorded on rec-4474 and rec-5293 and reported to the coordinator
  hermetic: false
- step: 12
  phase: post-deploy
  action: First Sunday after the deploy, the maintenance singleton's throttles around the 03:00-04:30 jobs.
  command: SUN=$(date -u -d 'last sunday' +%Y-%m-%d); aws --profile agent_platform cloudwatch get-metric-statistics --namespace AWS/Lambda
    --metric-name Throttles --dimensions Name=FunctionName,Value=agent-platform-ducklake-maintenance --start-time ${SUN}T03:00:00Z --end-time
    ${SUN}T05:00:00Z --period 300 --statistics Sum --output text
  expected: throttles only in the 04:05 bucket at most (the telemetry gc and a gate tick share that minute; Lambda retries a throttled
    async invoke), and GcDeletedSnapshots for ducklake_telemetry has a datapoint that day; record both.
  fix_if: a throttle outside 04:05, or no telemetry gc datapoint that Sunday, is reported to the coordinator for a follow-on rec (a new
    sidecar), never a local change
  hermetic: false
- step: 13
  phase: post-deploy
  action: Spend reading against the estimate (Decision 88), 7 days after the deploy.
  command: for m in MergeOpsTablesCount MergeOpsDurationMs CatalogFileColumnStatsRows; do aws --profile agent_platform cloudwatch get-metric-statistics
    --namespace DuckLakeMaintenance --metric-name $m --dimensions Name=MetaSchema,Value=ducklake_telemetry --start-time "$(date -u -d
    '-14 days' +%Y-%m-%dT00:00:00Z)" --end-time "$(date -u +%Y-%m-%dT00:00:00Z)" --period 86400 --statistics SampleCount Sum Maximum
    --output text; done
  expected: daily pass counts, merge duration sums and stats rows maxima for the 7 days before and after the deploy; the report converts
    the duration delta plus about 2,600 ticks a day of about 1 s to Lambda GB-seconds at 1536 MB and records it beside the estimate
    (2-5 USD/month) and Decision 214's capped-bill trigger, and states that Neon compute is not readable from the session, so the coordinator
    asks the operator for one reading of Neon usage.
  fix_if: more than 150 passes a day, a daily merge duration sum above 2 h, or stats rows growing faster than before the deploy is reported
