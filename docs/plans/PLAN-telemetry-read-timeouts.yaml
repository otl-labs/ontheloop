  never a local terraform init/plan/apply (Decision 119). Post-deploy proof is VP 7 (MergeOpsTablesCount datapoints every 20 minutes for
  MetaSchema ducklake_telemetry).'
acceptance_criteria:
- The production telemetry catalog's merge_ops rule fires every 20 minutes (cron(0/20 * * * ? *)), pinned by the terraform test, and
  the maintenance rules' minute sets are disjoint.
- Decision 236 clause 5 and docs/contracts/ducklake_maintenance.yaml say every 20 minutes for the telemetry catalog, in the operator-approved
  words.
- The arrival check answers one deadline-hit window by reading its halves, newer first, still judges every merged session, and is unreadable
  on a one-day deadline hit or a second hit, so a failing run costs no more reader time than today.
- After the apply, the telemetry merge runs every 20 minutes; for 24 hours the telemetry reader's maximum Duration stays below 100 s,
  no telemetry-arrival run ends unreadable on ReadDeadlineExceededError or ReadBudgetExceeded (other reds and cancelled runs are reported
  separately), and the writer's OccRetryCount does not rise; the first Sunday shows no maintenance throttle; rec-5247 and rec-5248 are
  closed.
- Seven days after the apply, the extra maintenance compute and the telemetry catalog's file column stats rows are read and recorded
  against the 5 to 10 US dollar estimate (up to about 20).
