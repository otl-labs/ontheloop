acceptance_criteria:
- 'A gated telemetry merge rule ticks at minutes {0,6,8,10,16,18,20,22,24,26,32,34,36,38,40,46,52,54,56,58} with action merge_ops_gated
  and backlog_gate {min_commits 60, max_unmerged_minutes 30}; the every-6h :50 rule is unchanged; no gated minute falls in the three
  minutes up to another maintenance rule''s start minute; pinned by the terraform tests.'
- merge_ops_gated runs the unchanged merge_ops pass when at least 60 telemetry commits landed since the last pass or any commit has
  waited 30 minutes; otherwise, or when its CloudWatch reads fail, it returns skipped without opening a catalog connection; every tick
  that reads the backlog emits it, and an unreadable tick emits MergeOpsGateUnreadable.
- The maintenance role gains only cloudwatch:GetMetricStatistics; alarms watch the reader's Duration at a 100 s maximum and any unreadable
  gate tick.
- Decision 236 clause 5 and docs/contracts/ducklake_maintenance.yaml (the governance sentence and the merge_ops_gated verb entry;
  contract.description unchanged) describe the gated pass in the operator-approved words.
- After the deploy, for 24 hours on a busy day (at least 1,000 telemetry commits) the telemetry reader's maximum Duration stays below
  100 s, no telemetry-arrival run ends unreadable on ReadDeadlineExceededError and the writer's OccRetryCount does not rise; on the first
  Sunday every non-gated maintenance job still lands its datapoint; rec-5247 and rec-5248 are closed.
- Seven days after the deploy, passes per day, maintenance duration, files superseded per day and catalog file column stats rows are
  read and recorded against the estimate (2 to 5 US dollars a month).
