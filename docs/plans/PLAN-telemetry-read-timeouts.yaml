  action: The gate is live (read 3 h after both the CI apply and the maintenance deploy have landed, inside working hours).
  command: for m in MergeOpsBacklogCommits MergeOpsTablesCount MergeOpsGateUnreadable; do aws --profile agent_platform cloudwatch
