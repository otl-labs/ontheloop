  action: The arrival walk halves a window on read_deadline_exceeded (rec-5248's acceptance node).
  command: bin/venv-python -m pytest "tests/telemetry_verify/test_session_presence.py::test_walk_halves_window_on_read_deadline" "tests/telemetry_verify/test_session_presence.py::test_a_one_day_read_deadline_is_unreadable"
    -q
  expected: exit 0; red before (the first window fails twice and the walk is unreadable).
  fix_if: the walk retries the same window, skips days, or reads older halves first
  hermetic: true
  expected_literals:
  - ' passed'
  graduation: graduate
  graduation_check_id: telemetry-arrival-halves-on-read-deadline
- step: 2
