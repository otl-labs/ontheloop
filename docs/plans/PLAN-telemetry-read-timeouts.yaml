slug: telemetry-read-timeouts
intent: 'Stop telemetry reads timing out late in each compaction cycle. Every telemetry write lands as its own small file and the production
  telemetry catalog is merged only every 6 hours, so a cold reader that reads the newest days fetches every unmerged file one at a time
  and, on a busy day, hits its 110 s read deadline: the post-deploy reader smoke (rec-5247) and the post-merge arrival check (rec-5248)
  went red. The plan merges the telemetry catalog hourly (the fix for both), and teaches the arrival check to narrow a window that answers
  read_deadline_exceeded, as the reader contract and the usage client already do.'
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-telemetry-read-timeouts.yaml
phase: 'ci_rca (soft-warn exception category): repairs Critical reds rec-5247 and rec-5248 under docs/contracts/red-main-recovery.yaml
  (Decision 226). No tier_item is targeted and no exit criterion is closed. The cold small-file read cost stays owned by rec-4474.'
