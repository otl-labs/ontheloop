    say hourly. Every alarm's period, evaluation_periods and threshold is unchanged (each stays correct with more datapoints per period).
    No IAM, target or permission change.
  new_imports: []
- file: tests/checks/iam_tf/test_telemetry_production_maintenance_tf.py
  action: Modify
