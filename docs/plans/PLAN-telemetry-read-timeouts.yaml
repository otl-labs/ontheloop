  graduation_waiver_reason: A whole full-tier run; graduate steps may not invoke scripts.validate (recursion).
- step: 7
  phase: post-deploy
  action: The hourly merge is live (read 7 h after the CI apply).
  command: aws --profile agent_platform cloudwatch get-metric-statistics --namespace DuckLakeMaintenance --metric-name MergeOpsTablesCount
    --dimensions Name=MetaSchema,Value=ducklake_telemetry --start-time "$(date -u -d '-7 hours' +%Y-%m-%dT%H:00:00Z)" --end-time "$(date
    -u +%Y-%m-%dT%H:%M:00Z)" --period 3600 --statistics SampleCount --query 'length(Datapoints)'
  expected: at least 6 hourly datapoints (an every-6h cadence gives at most 2); record the count and the apply run id.
  fix_if: at most 2 means the apply did not land or the rule still says */6; check the apply run, never apply locally
  hermetic: false
- step: 8
  phase: post-deploy
  action: Reads fit the deadline for a day, and arrival stays green (read 24 h after the apply).
  command: aws --profile agent_platform cloudwatch get-metric-statistics --namespace AWS/Lambda --metric-name Duration --dimensions
    Name=FunctionName,Value=agent-platform-ducklake-telemetry-reader --start-time "$(date -u -d '-24 hours' +%Y-%m-%dT%H:00:00Z)" --end-time
    "$(date -u +%Y-%m-%dT%H:%M:00Z)" --period 3600 --statistics Maximum --query 'max(Datapoints[].Maximum)'
  expected: below 100000 (ms); and every telemetry-arrival run in the same 24 h concluded success (list them from the workflow's runs;
    record the count and the maximum).
  fix_if: 'a maximum at or above 100000 means the hourly tail is still too heavy at peak; record the hour and its writer invocations
    on rec-4474 (the durable owner: reader parallelism) and report to the coordinator; do not raise the reader timeout or widen anything
    in this plan'
  hermetic: false
- step: 9
  phase: post-deploy
  action: rec-5247 and rec-5248 are closed by the squash's Resolves trailer.
  command: AWS_PROFILE=agent_platform bin/venv-python -c "from src.common.ducklake_reader_client import fetch_recs_by_ids, make_reader;
    rows, _ = fetch_recs_by_ids(make_reader(), ['rec-5247', 'rec-5248']); print([(r['id'], r['status']) for r in rows])"
  expected: both closed; record the closure job run id.
  fix_if: a ClosureArtifactRequired refusal means the shard is not in the squash; land it and re-run the closure route; never close
    with a direct status write after a refusal (Decision 186)
  hermetic: false
- step: 10
  phase: post-deploy
  action: Spend reading against the estimate (Decision 88), 7 days after the apply.
  command: for m in MergeOpsDurationMs CatalogMetadataBytes; do aws --profile agent_platform cloudwatch get-metric-statistics --namespace
    DuckLakeMaintenance --metric-name $m --dimensions Name=MetaSchema,Value=ducklake_telemetry --start-time "$(date -u -d '-14 days'
    +%Y-%m-%dT00:00:00Z)" --end-time "$(date -u +%Y-%m-%dT00:00:00Z)" --period 86400 --statistics Sum Maximum --output text; done
  expected: daily MergeOpsDurationMs sums for the 7 days before and after the apply, and the CatalogMetadataBytes maximum for each day;
    the report converts the duration delta to Lambda GB-seconds at 1536 MB and records it beside the estimate, and states that Neon
    compute is not readable from the session, so the coordinator asks the operator for one reading of Neon usage.
  fix_if: a daily merge duration sum above 2 h, or CatalogMetadataBytes growing faster than before the apply, is reported to the coordinator
    for the operator; nothing is changed in this plan
  hermetic: false
