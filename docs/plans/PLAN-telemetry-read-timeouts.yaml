- file: docs/contracts/ducklake_maintenance.yaml
  action: Modify
  purpose: The description and governance auth_type sentences name the telemetry catalog's merge_ops as hourly (cron(50 * * * ? *));
    the ops catalog's every-6h cadence and the historical amendment_log rows are unchanged. One new amendment_log row. All three edits
    are bound word for word by the approved-text sidecar.
  new_imports: []
- file: docs/DECISIONS.md
  action: Modify
  purpose: 'Decision 236 gains one trailing_bracket amendment line after its existing 2026-10-29 amendment: clause 5''s cadence is retuned
    to the write rate under Decision 88 cl.1(iii), so the telemetry merge_ops runs hourly. Bound word for word by the approved-text
    sidecar docs/plans/approved/telemetry-read-timeouts.yaml (Decision 246).'
  new_imports: []
- file: scripts/telemetry_verify/session_presence.py
  action: Modify
  purpose: '_walk: a roots_for call that raises ReadDeadlineExceededError (imported from src.common.ducklake_reader_client, as scripts/telemetry_usage.py
    does) is never retried as is; the window splits into two halves, newer half first, each read the same way, down to one day; a one-day
    window that still answers read_deadline_exceeded raises Unreadable("ReadDeadlineExceededError"). Every other exception keeps today''s
    one retry then Unreadable. windows_read counts each window read successfully. The ARRIVAL line format is unchanged.'
  new_imports:
  - src.common.ducklake_reader_client
- file: tests/telemetry_verify/test_session_presence.py
  action: Modify
  purpose: 'New node test_walk_halves_window_on_read_deadline (rec-5248''s acceptance): a fake roots_for that raises ReadDeadlineExceededError
    for any window over 3 days, and answers otherwise, ends green with every key found and reads 7 -> 3+4 -> ... halves newest first;
    plus test_a_one_day_read_deadline_is_unreadable: a one-day window that still raises ends unreadable with cause ReadDeadlineExceededError
    after exactly one call for that day. Existing nodes unchanged.'
  new_imports: []
