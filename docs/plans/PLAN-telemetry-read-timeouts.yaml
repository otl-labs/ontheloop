slug: telemetry-read-timeouts
intent: 'Bound the unmerged small-file backlog a telemetry reader can meet. Every telemetry write lands as its own small files and
  the production telemetry catalog is merged only every 6 hours, so on every busy day since capture began (2026-10-29..31, 11-11,
  11-12, 11-16, 11-17) cold reads of the newest days reached the reader''s 110 s deadline before the next pass, and the post-deploy
  reader smoke (rec-5247) and the arrival check (rec-5248) went red. Nothing owns that bound today: the clock owns the merge and the
  growth alarms watch files after a merge. The plan keeps the every-6h merge as the floor and adds a backlog-gated pass: a tick every
  two to six minutes reads CloudWatch only and merges at 60 telemetry commits or after 30 minutes with any commit waiting. It emits the
  backlog and the pre-merge file count, and alarms on an unreadable gate and on slow reader calls. Stage 2 (writer insert path plus
  per-table inlining) is rec-5291.'
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-telemetry-read-timeouts.yaml
phase: 'ci_rca (soft-warn exception category): repairs Critical reds rec-5247 and rec-5248 under docs/contracts/red-main-recovery.yaml
  (Decision 226). No tier_item is targeted and no exit criterion is closed; T2.18:c8 (higher-frequency merge for a high-write table)
  is advanced, not closed (closes_criteria stays empty: c8''s other half, co-tuning the gc deletion bound, is untouched, so this plan
  cannot close c8). Fewer files at the source and cheaper reads are follow-on
  recs, not this plan.'
