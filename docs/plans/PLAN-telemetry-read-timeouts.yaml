scope:
- file: src/lambdas/ducklake_maintenance/backlog_gate.py
  action: Create
  purpose: 'decide(gate, meta_schema, now, client) -> GateDecision and gated(action_fn) -> the merge_ops_gated action. gate is the event''s
    backlog_gate object {min_commits, max_unmerged_minutes}; client is a boto3 CloudWatch client (gated builds it with boto3.client("cloudwatch")
    and the gated tests monkeypatch backlog_gate.boto3.client, so no factory body stays uncovered). decide takes the last pass
    as the latest of the newest MergeOpsTablesCount and MergeOpsGateTriggered datapoints for the MetaSchema over the last 6 hours (period
    60, SampleCount) and this warm container''s own last trigger time (none found: the window start), then reads the telemetry writer''s
    committed appends since then: DuckLakeTelemetryWriter CommitLatencyMs SampleCount with the same MetaSchema dimension (period 60;
    one sample per committed append plus one per append whose OCC retries ran out, which is none while OccRetryCount stays 0; refusals,
    describes and other verbs are excluded; 1,020 on 2026-11-16 against 2,712 writer invocations).
    merge is true when commits reach min_commits (reason backlog) or when the oldest non-zero per-minute commit datapoint since the last
    pass is at least max_unmerged_minutes old (reason age); otherwise false (reason below_threshold). When any read raises, merge is
    false (reason gate_unreadable): the every-6h rule stays the floor, so an unreadable gate never merges on every tick, and Decision
    250''s "unreadable is red" is met by an alarm. GateDecision carries merge, reason, commits (None when unreadable), oldest_commit
    and last_pass. The gated wrapper validates the gate object (DuckLakeRuntimeError on a missing or non-positive field), emits MergeOpsBacklogCommits
    (when read) or MergeOpsGateUnreadable 1.0 through the catalog sink (_shared.catalog_dimensions and _emit_maintenance_metric), and
    on merge false returns {ok, action: merge_ops_gated, skipped: true, reason, commits, last_pass} without opening a catalog connection.
    On merge true it records the trigger time in the container, emits MergeOpsGateTriggered 1.0, then calls the unchanged merge_ops
    action with the same event, so a pass that fails before MergeOpsTablesCount is emitted does not re-trigger on every tick. Standard
    library, boto3 and _shared only.'
  new_imports:
  - src.lambdas.ducklake_maintenance._shared
- file: src/lambdas/ducklake_maintenance/handler.py
  action: Modify
