  the bootstrap apply that names both new functions in the three Decision 213 boundary denies, the Decision 202 trail
  selectors, PlatformDev's URL-only invoke on the telemetry reader and the apply and planner IAMRolesRead lists; the
  reader login provisioned against its secret container; the production catalog created and seeded; and the smoke
  writer login re-provisioned at CONNECTION LIMIT 20, with both limits (smoke writer 20, reader 10) and the keys
  reader_read_only_attach (must be accepted: the reader login's live READ_ONLY ATTACH probe succeeded) and
  reader_read_only_attach_stage recorded in /mnt/project-files/telemetry-slice2c/ADMIN-SESSION-RECORD.md, one
  `key: value` line per key; and open_connection(read_only=True) on main from that plan's PR 1, which this plan uses
  as-is. Without the boundary entry the gated apply below must
  not be approved (Decision 213 cl.1); without the raised limit the twin's fan-out can exhaust the shared smoke login;
  refused stops this plan for planning (execution step 1), since AC2, the contract, attach_check and the gate all
  require the READ_ONLY attach.
- >-
  Pre-build (PR 1): PLAN-telemetry-cold-read-deadline's build is merged (TELEMETRY_THREADS and the serial catalog scans,
  deadline_ms, deadline_guard, the interrupted-slot catalog probe and src/common/ducklake_read_deadline.py). This
  plan's build rebases onto it and moves that wiring into telemetry_acquirer; it never carries the wiring itself.
