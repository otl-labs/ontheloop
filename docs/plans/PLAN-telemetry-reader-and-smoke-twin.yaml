schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: telemetry-reader-and-smoke-twin
intent: >-
  Telemetry slice 2c (rec-4292, T2.36), the second of five plans: PLAN-telemetry-production-catalog -> this plan -> PLAN-telemetry-production-maintenance -> the cutover
  (PLAN-telemetry-catalog-aware-capture, then PLAN-telemetry-production-flip). It adds the two functions production telemetry needs before the
  writer can flip: a smoke-pinned twin of the telemetry writer that is deployed first and carries the disposable deploy
  proofs, so the production telemetry deploy waits on its gates; and a separate telemetry reader that serves the event
  verbs only (no caller SQL, no ops verb, no transcript content) on a SELECT-only login over the production telemetry
  data prefix. It carries Decision N+1, which also authorizes PLAN-telemetry-production-maintenance's maintenance re-grounding. Telemetry is the
  learning signal for recursive self-improvement (PROJECT_CONTEXT); these functions let it land in production safely.
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-telemetry-reader-and-smoke-twin.yaml
phase: >-
  T2.36 (telemetry re-lands on DuckLake), slice 2c; follow-on mode. Closes no criterion: c1 is PLAN-telemetry-production-catalog's, c5 is PLAN-telemetry-production-maintenance's and
  c2 is PLAN-telemetry-production-flip's.
