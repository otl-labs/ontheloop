- file: src/lambdas/ducklake_telemetry_reader/handler.py
  action: Create
  purpose: >-
    PR 1. The telemetry reader handler (Decision N+1 cl.2-3), under 300 SLOC. SERVED_VERBS = the EVENT_READS names
    minus transcript_content, a module constant derived from src.common.ducklake_event_read_verbs. Actions, exactly:
    describe (connectionless: {ok, function: "telemetry_reader", catalog: {meta_schema, data_path_is_smoke}, verbs:
    ev.describe_all() filtered to SERVED_VERBS}); attach_check (ev.require_production_pin, then the slot from
    ev.telemetry_acquirer(meta_schema, data_path, EXTENSION_DIRECTORY, dsn_secret_id=TELEMETRY_DSN_SECRET_ID,
    read_only=True); body {ok, meta_schema, data_path_is_smoke, catalog_login -- the DSN secret's username only --,
    read_only, connect_ms, reused}, where read_only is OBSERVED from the live connection, SELECT readonly FROM
    duckdb_databases() WHERE database_name = rt.TELEMETRY_CATALOG_ALIAS, never echoed from the flag); named_read (a
    verb outside SERVED_VERBS answers 400 {error_type: unknown_verb, served} before any connection and never echoes the
    caller's verb; otherwise ev.acquirer_for("named_read", payload, _no_ops_slot, EXTENSION_DIRECTORY,
    pin=ev.require_production_pin, dsn_secret_id=TELEMETRY_DSN_SECRET_ID, read_only=True), whose pin check and params
    validation run before any connection; rows from ev.execute(con, verb=..., params=..., limit=payload's limit) with
    ev.event_read_version: limit passes through, accepted for the three paginable served verbs (sessions_window,
    sessions_window_all_purposes, model_call_cost_estimate) and answered 500 runtime (ev.execute's DuckLakeRuntimeError)
    on any other, the shared reader's shape). _no_ops_slot raises: this
    function has no ops slot. Any other action answers 400 with the sorted action list and never echoes the action.
    Deadline wiring copied from the shared reader as PLAN-telemetry-cold-read-deadline merged it: handler() passes
    getattr(context, "get_remaining_time_in_millis", None) into _handle (the Lambda context is read only here, Decision
    212); named_read obtains ev.deadline_guard("named_read", payload, remaining_ms) and runs both the first query and
    the reopen-once query through it, each attempt with its own deadline; describe and attach_check run without one. A
    TypedFault from the guard reaches handler_errors.terminal unchanged: 504 {ok, error_type: read_deadline_exceeded,
    reason: reader_deadline, request_id, action}. deadline_ms is validated by acquirer_for before any connection.
    Error mapping copied in shape from the shared reader: 400 named_read_input, 413 response_too_large (the same
    6,000,000-byte envelope guard), 500 version_mismatch and runtime, 504 read_deadline_exceeded, handler_errors.terminal
    for 500 unmapped and 503 catalog_unavailable, reopen-once on a dead connection, one log_invocation line
    ("telemetry_reader") per request.
    It imports nothing from src.lambdas.ducklake_reader and never imports ducklake_event_content. Until
    PLAN-telemetry-production-flip rewrites them, the served verbs' descriptions still say they read the smoke catalog
    (the flip owns that text).
