    GetBucketLocation with s3:prefix ${local.ducklake_telemetry_data_prefix}/* only). No PutObject, DeleteObject,
    blob-root statement, shared-DSN statement or metrics statement. Function: handler
    src.lambdas.ducklake_telemetry_reader.handler.handler, s3_key lambda-packages/ducklake-telemetry-reader.zip, the
    deps and extensions layers, timeout 120, memory 1024, reserved_concurrent_executions = 5 (a literal: one telemetry
    slot and no ops slot per container, against the reader login's CONNECTION LIMIT 10 in
    PLAN-telemetry-production-catalog's LOGINS table, keeping the 2 x reserved-concurrency headroom recorded at
    ducklake_telemetry_writer_role.sql:19; test-pinned), env TELEMETRY_META_SCHEMA
    = local.ducklake_telemetry_prod_meta_schema, TELEMETRY_DATA_PATH = local.ducklake_telemetry_data_path,
    TELEMETRY_DSN_SECRET_ID = the reader secret's name, DUCKLAKE_EXTENSION_DIRECTORY and DUCKLAKE_FIELD_SEMANTICS_PATH;
    no TELEMETRY_BLOB_ROOT, no DUCKLAKE_DATA_PATH or DUCKLAKE_META_SCHEMA; lifecycle ignore_changes =
