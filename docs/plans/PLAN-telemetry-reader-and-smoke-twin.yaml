- file: terraform/personal/ducklake_telemetry_writer_smoke.tf
  action: Create
  purpose: >-
    PR 1. The twin (Decision N+1 cl.1), mirroring ducklake_telemetry_writer.tf: log group; role
    agent-platform-ducklake-telemetry-writer-smoke with the apply boundary and lambda_assume trust; inline policy
    DuckLakeTelemetryWriterSmokeRuntime with the writer's current statements bound to SMOKE only (Logs,
    TelemetryDsnRead on aws_secretsmanager_secret.ducklake_telemetry_writer_dsn -- the smoke scoped login --,
    Get/Put and prefix-conditioned List on local.ducklake_smoke_data_prefix, Get/Put and prefix-conditioned List on
    telemetry-blobs/${local.ducklake_smoke_meta_schema}/, PutMetricData on DuckLakeTelemetryWriter); no Delete anywhere
    and no production prefix. Function: same handler, s3_key lambda-packages/ducklake-telemetry-writer.zip, the
    writer's layers, timeout and memory, reserved_concurrent_executions = 5 (a literal: the gate's fan-out needs four
    concurrent containers; the smoke writer login is shared with the writer until PLAN-telemetry-production-flip, so
    PLAN-telemetry-production-catalog raises it to CONNECTION LIMIT 20 = 2 x (5 + 5); test-pinned against LOGINS),
    env TELEMETRY_META_SCHEMA =
    local.ducklake_smoke_meta_schema, TELEMETRY_DATA_PATH = local.ducklake_smoke_data_path, TELEMETRY_BLOB_ROOT =
    local.ducklake_telemetry_smoke_blob_root, TELEMETRY_DSN_SECRET_ID = the smoke secret's name, the extension and
    field-semantics paths; lifecycle ignore_changes = [source_code_hash] (Decision 125/126 conformance). AWS_IAM
    Function URL; SSM /agent-platform/ducklake/telemetry_writer_smoke_url; alarm ducklake-telemetry-writer-smoke-errors
    (the writer's Errors plus Url5xxCount expression, FunctionName dimension = this function); outputs
    ducklake_telemetry_writer_smoke_function_url and _function_name (core._function_url's terraform fallback name).
