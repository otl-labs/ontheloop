execution_steps:
  - "Run bin/venv-python -m scripts.ci_rca.red_overlap --plan docs/plans/PLAN-telemetry-reader-conflict-memory.yaml; rec-5491 must read repairs_this_red. If rec-5497 still blocks, carry on (this plan's own deferral is in context); push and open the PR when the local full tier passes, and hold only if the full tier fails on rec-5497's node. Deploys wait for a green main regardless (Decision 249 cl.3)."
