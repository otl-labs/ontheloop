schema_version: 6
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: telemetry-reader-conflict-memory
intent: >-
  Clear the Critical red rec-5491: telemetry-arrival goes unreadable because the telemetry reader's query engine runs out of
  its 300 MB memory plus 300 MB spill budget on a 7-day telemetry_root_sessions read. The shared Decision 207 conflict report
  compares whole rows for every grain key in the window, although almost every key holds one row; the plan compares rows only
  for keys that hold more than one, which returns the same conflicts at a fraction of the memory, and makes the arrival
  unreadable line carry the reader's HTTP status, error_type and error_class so the next failure names itself.
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-telemetry-reader-conflict-memory.yaml
phase: >-
  ci_rca (soft-warn exception category): repairs Critical red rec-5491 under docs/contracts/red-main-recovery.yaml
  (Decision 226). No tier_item is targeted and no exit criterion is closed.
closes_criteria: []
cites:
  - dec:79
  - dec:272
  - dec:125
  - dec:207
  - dec:226
  - dec:236
  - dec:249
  - dec:254
scope:
  - file: src/common/ducklake_event_read_sql.py
    action: Modify
    purpose: >-
      conflict_select(table) becomes duplicate-first: the same SELECT (table_name, producer, event_id, parser_version,
      min(session_id)) and the same HAVING count(DISTINCT row(compared columns)) > 1, but the outer WHERE adds
      "(producer, event_id, parser_version) IN (SELECT producer, event_id, parser_version FROM <table> WHERE <scope> GROUP BY
      producer, event_id, parser_version HAVING count(*) > 1)", so only grain keys holding more than one row in scope enter the
      row-value compare. A key with one row can never hold two distinct row values, so the result set is identical (Decision
      207: reported, never resolved; the NULL-safe row-value compare is unchanged). The IN filter drops a key with a NULL
      component, which the old GROUP BY would group; equivalence rests on the writer gate refusing NULL grain columns
      (the provisioned DDL declares them NOT NULL, src/common/ducklake_telemetry_provision.py:75-77; the writer also checks
      src/telemetry/append.py:52 _STRUCTURAL_NOT_NULL at src/telemetry/gate.py:102-105; field_semantics marks producer, event_id and parser_version nullable False), and the
      docstring states that premise and why the rewrite exists. Every verb built by
      compose(), including the content reader's SESSION_TRANSCRIPT_SQL, shares the text, so their read_version stamps move once.
    new_imports: []
  - file: tests/common/test_ducklake_event_read_memory.py
    action: Create
    purpose: >-
      Module-level duckdb importorskip (full tier, like test_ducklake_event_read_dedupe.py). A fixture writes the four journals
      as Parquet files under tmp_path with COPY (SELECT ... FROM range(n)) TO '<file>.parquet' (ROW_GROUP_SIZE 20000) (columns from tests.fixtures.telemetry_read_db.table_columns;
      300,000 observations with an 800-byte metadata value, 150,000 transcripts, 3,000 root sessions over 7 days, 1,500 agents),
      plants three conflicts (two observation grain keys whose second row differs in metadata, and one transcript grain key whose second row
      differs in content_sha256, a transcript compared column; transcripts have no metadata column), and opens a fresh DuckDB with the reader's own settings (threads=1, temp_directory under tmp_path, memory_limit
      ev.TELEMETRY_MEMORY_LIMIT, max_temp_directory_size ev.TELEMETRY_MAX_TEMP_SIZE) and views named as the reader's tables
      under rt.TELEMETRY_CATALOG_ALIAS plus a one-row real-purpose projects table, so render_sql's output runs unchanged with no
      ducklake extension. Node test_root_sessions_week_fits_the_reader_memory runs ev.execute(con, verb="telemetry_root_sessions",
      params 7-day window) and asserts 3,000 rows, and that exactly the planted sessions carry derivation_conflicted with the
      planted grain keys. The fixture-writing connection also sets memory_limit ev.TELEMETRY_MEMORY_LIMIT so the
      test's footprint stays bounded in the full tier (the bounded row group keeps the 300,000-row write inside that limit: critique round 6 measured observations written in
      about 1 s, current SQL red in 0.4 s, duplicate-first green in 0.6 s; rec-5497's
      inferred cause names a DuckDB abort in a fixture, so the build reports this node's full-tier duration and worker beside
      the golden-gates node). Red before (OutOfMemoryException, measured at plan time on a 300,000-row corpus in about 0.3 s), green
      after (about 1 s).
    new_imports: []
  - file: scripts/telemetry_verify/session_presence.py
    action: Modify
    purpose: >-
      _walk's second-attempt failure raises Unreadable with a cause built by a new helper reader_cause(exc): the class name, then
      " status=<n>" when the exception carries an int status attribute, then " error_type=<v>" and " error_class=<v>" when its
      body dict carries them, each value kept only when it matches ^[A-Za-z0-9_.]{1,64}$ (the body is server text and is printed
      to CI logs and junit). Any other exception keeps the bare class name, so the existing unreadable tests hold. The ARRIVAL_UNREADABLE
      line and the junit message print the richer cause unchanged. The body's request_id is added as " request_id=<v>" (pattern
      ^[A-Za-z0-9_.-]{1,64}$) so a failure traces to its reader log line. The Unreadable docstring ("the class name alone is
      reported"), _walk's noqa comment and the module docstring's "Output is counts and commit shas only" are updated to
      match. A Lambda request_id is a UUID, which scripts/ci_rca/fingerprint.py normalize_message_head scrubs to <uuid>, so the
      ci-rca fingerprint of the junit message stays stable per error class. The fingerprint now differs by status, error_type
      and error_class, so a 503 catalog_unavailable and a 500 unmapped out-of-memory become separate recs: an intended, finer
      dedup grain. The existing node test_unreadable_junit_head_names_the_class_only is kept unchanged as the non-reader case. The PR body notes that the telemetry-arrival.yml
      header ("Counts and commit shas only in the log") now also covers these four reader fields, none confidential (Decision 101). rec-5491's preventive note also names the commits
      path (_judge's commits() failure, :228-229): it reads git and GitHub, never the reader, so it carries no reader status and
      keeps the bare class name.
    new_imports: []
  - file: tests/telemetry_verify/test_session_presence_reader_status.py
    action: Create
    purpose: >-
      rec-5491's acceptance file. Nodes: test_unreadable_cause_names_status_and_error_type (a fake reader raising
      ReaderInvokeError("named_read", 500, text, {"error_type": "unmapped", "error_class": "OutOfMemoryException"}) on both
      attempts, with request_id "abc-123" -> status unreadable, cause "ReaderInvokeError status=500 error_type=unmapped
      error_class=OutOfMemoryException request_id=abc-123",
      and the rendered lines carry it), test_unsafe_body_values_are_dropped (an error_type with a space or newline is left out),
      test_other_exceptions_keep_the_class_name (RuntimeError -> "RuntimeError").
    new_imports: []
bundled_recommendations:
  - rec-5491
followon_recs: []
infrastructure_dependencies: []
acceptance_criteria:
  - The 7-day telemetry_root_sessions read over the 300,000-row local corpus completes under the reader's own memory and spill limits and reports exactly the planted conflicts (red before, green after).
  - The existing Decision 207 dedupe and conflict vectors pass unchanged (same conflicts reported).
  - The arrival unreadable cause carries the reader's HTTP status, error_type, error_class and request_id (rec-5491 acceptance).
  - After the governed deploy, 7-day telemetry_root_sessions reads succeed live and at least 31 completed telemetry-arrival runs after the new SQL went live are all readable.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: Memory regression on the reader's own limits
    command: bin/venv-python -m pytest tests/common/test_ducklake_event_read_memory.py::test_root_sessions_week_fits_the_reader_memory -q
    expected: The node passes; before the change it fails with an OutOfMemoryException.
    fix_if: An out-of-memory error means a heavy operator is left in the composed root-sessions SQL; find it with EXPLAIN ANALYZE on the same corpus.
    hermetic: false
    graduation: graduate
    graduation_check_id: telemetry-conflict-report-fits-reader-memory
  - step: 2
    phase: pre-deploy
    action: Decision 207 conflict and dedupe semantics unchanged
    command: bin/venv-python -m pytest tests/common/test_ducklake_event_read_dedupe.py tests/common/test_ducklake_event_read_sql.py tests/common/test_ducklake_event_read_verbs.py -q
    expected: All nodes pass with no edits to these files.
    fix_if: A changed conflict set means the rewrite is not equivalent; fix the SQL, never the vectors.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: The three files are standing full-tier tests already (they guard the same semantics on every main run), and duckdb is absent from the fast tier, so a graduated row would duplicate them and collect nothing in pr-validate.
  - step: 3
    phase: pre-deploy
    action: rec-5491 acceptance
    command: bin/venv-python -m pytest tests/telemetry_verify/test_session_presence_reader_status.py::test_unreadable_cause_names_status_and_error_type -q
    expected: The node passes; before the change the file does not exist.
    fix_if: A missing field means reader_cause does not read the exception's status or body.
    hermetic: true
    expected_literals: []
    graduation: graduate
    graduation_check_id: arrival-unreadable-names-reader-status
  - step: 4
    phase: pre-deploy
    action: Full tier, then HEAD attestation, after the build commit and rebase and before the push (handoff_policy); start it from the top-level session, backgrounded with a 2 h limit, and read only the attestation.
    command: bin/venv-python -m scripts.validate && bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: The full tier exits 0 and the validation result attests the current HEAD's tree. A timeout or a failure of rec-5497's golden-gates node is BLOCKED (handoff_policy timeout_disposition blocked); the build waits for rec-5497's fix, rebases and reruns; never waived here. A full tier that passes is not held for rec-5497.
    fix_if: Any failure; fix and rerun the full tier from the start.
    hermetic: false
    graduation: not-applicable
  - step: 5
    phase: post-deploy
    action: The deployed telemetry reader serves the new root-sessions SQL; record the live time
    command: >-
      OTL_OPS_VERBS_TRANSPORT=execute_api bin/venv-python -c "from scripts.telemetry_capture.read_route import make_routed_reader;
      from src.common import ducklake_event_reads as ev; d=make_routed_reader(profile='agent_platform').describe();
      ok=d['telemetry_root_sessions']['read_version']==ev.describe_all()['telemetry_root_sessions']['read_version']; print(ok);
      raise SystemExit(0 if ok else 1)" && date -u +%s000 | tee /tmp/reader-conflict-memory-live-ms | sed 's/^/LIVE_MS=/'
    expected: >-
      Prints True, then LIVE_MS=<epoch ms>, exit 0, after the deploy-ducklake-lambdas run for a main commit containing the merge
      has deployed the telemetry reader. The build report carries the LIVE_MS value as a named closure fact; VP 7 and VP 8 read
      it from the LIVE_MS environment variable (falling back to the /tmp file) so the coordinator can run them in a fresh session.
    fix_if: >-
      False means the deploy has not run or skipped the reader; read that run's job conclusions and deployed commit. Run this
      from a checkout of the deployed commit (git worktree), since a later merge to the shared SQL file moves main's stamp.
    hermetic: false
  - step: 6
    phase: post-deploy
    action: Live 7-day root-sessions reads, three in a row
    command: >-
      OTL_OPS_VERBS_TRANSPORT=execute_api bin/venv-python -c "import datetime as d; from scripts.telemetry_capture.read_route import
      make_routed_reader; r=make_routed_reader(profile='agent_platform'); t=d.datetime.now(d.UTC).date(); f=(t-d.timedelta(days=6)).isoformat();
      import time; g=lambda s: (len(r.named('telemetry_root_sessions', day_from=f, day_to=t.isoformat())), 'elapsed_s',
      round(time.monotonic() - s, 1)); [print('roots', *g(time.monotonic())) for _ in range(3)]"
    expected: Three roots lines, each with a row count and its elapsed seconds (the live cost of the extra per-table scan), exit 0.
    fix_if: >-
      A ReaderInvokeError on a roots read means the reader still runs out of memory; read its log group for OutOfMemoryException
      and stop with an RCA. An elapsed time within 20 s of the reader's 110 s read deadline is reported to the coordinator as a
      plan-defect, never passed.
    hermetic: false
  - step: 7
    phase: post-deploy
    action: Completed telemetry-arrival runs (any trigger) after the new SQL went live are never unreadable (read-only; nothing is dispatched)
    command: >-
      live=${LIVE_MS:-$(cat /tmp/reader-conflict-memory-live-ms)} && since=$(date -u -d "@$(( live / 1000 ))" +%Y-%m-%dT%H:%M:%SZ) &&
      for id in $(gh api --paginate "repos/otl-labs/ontheloop/actions/workflows/telemetry-arrival.yml/runs?per_page=100&created=>=$since"
      --jq '.workflow_runs[] | select(.status == "completed") | .id'); do line=$(gh run view $id -R otl-labs/ontheloop --log 2>/dev/null
      | grep -o -E 'ARRIVAL status=[a-z]+|ARRIVAL_UNREADABLE cause=[A-Za-z]+' | tail -1); echo "$id ${line:-no-arrival-line}"; done
      | tee /tmp/reader-conflict-memory-arrival.txt && ! grep -q 'unreadable\|ARRIVAL_UNREADABLE' /tmp/reader-conflict-memory-arrival.txt
      && n=$(grep -c 'ARRIVAL status=' /tmp/reader-conflict-memory-arrival.txt) && echo "readable_runs=$n" && test "$n" -ge 31
    expected: >-
      readable_runs=31 or more, none unreadable, exit 0. Base rate re-measured 2026-11-23 11:30Z with this loop: 3 of 41 completed
      runs in 48 h were unreadable (4 schedule, 37 workflow_run events), so 31 clean runs leave about a 10 percent chance of a
      false pass (ceil(log 0.1 / log(38/41)) = 31). At about 20 runs a day that is about a day and a half after VP 5, so the build
      reports this step pending and the coordinator runs it at the 48 h re-read; green and red (missing keys) both count as readable.
    fix_if: An unreadable status now names its HTTP status, error_type and request_id; follow that cause and stop with an RCA.
    hermetic: false
  - step: 8
    phase: post-deploy
    action: Evidence only, never the verdict - reader out-of-memory events since the new SQL went live, with request ids
    command: >-
      set -o pipefail; live=${LIVE_MS:-$(cat /tmp/reader-conflict-memory-live-ms)} && aws logs filter-log-events --profile agent_platform
      --region "$(cat config/aws-region)" --log-group-name /aws/lambda/agent-platform-ducklake-telemetry-reader --start-time "$live"
      --filter-pattern '"OutOfMemoryException"' --query 'events[].message' --output text | { grep -o -E '"request_id": ?"[^"]+"' || test $? -eq 1; } | sort
      | uniq | tee /tmp/reader-conflict-memory-oom.txt | wc -l | sed 's/^/oom_requests=/'
    expected: >-
      oom_requests=<n> and the request ids, exit 0. The unmapped log line carries no verb, and rec-5490's 7-day tool_use_rollup
      reads still run out of memory, so a non-zero count is expected and is not this plan's verdict (VP 6 and VP 7 are). The
      build and the 48 h re-read report the count.
    fix_if: A failed aws call or a grep error (exit 2) exits non-zero under pipefail; zero matches pass. Fix access and rerun; never paste an account id from an error.
    hermetic: false
  - step: 9
    phase: post-deploy
    action: >-
      Decision 79 for the content reader (Decision 272 residual while rec-5333 is open): its next deploy-telemetry-content run
      that the operator approves (this build never dispatches one) is on a commit that contains this build. Waits on the
      operator; the build reports it pending with this step named, and the coordinator keeps it on the waiting list.
    command: >-
      git fetch -q origin main && build=$(git log -1 --format=%H -E --grep='^Resolves: .*rec-5491([^0-9]|$)' origin/main) && test -n
      "$build" && ok= && for id in $(gh api
      'repos/otl-labs/ontheloop/actions/workflows/deploy-telemetry-content.yml/runs?status=success&per_page=100' --jq
      '.workflow_runs[].id'); do job=$(gh api "repos/otl-labs/ontheloop/actions/runs/$id/jobs" --jq '.jobs[] |
      select(.name=="record" and .conclusion=="success") | .id'); [ -n "$job" ] || continue; deployed=$(gh api
      "repos/otl-labs/ontheloop/actions/jobs/$job/logs" | grep -oE 'LAMBDA_ARTIFACT_SHA: [0-9a-f]{40}' | head -1 | cut -d' '
      -f2); echo "run $id deployed $deployed"; if git merge-base --is-ancestor "$build" "$deployed"; then echo contains; ok=1;
      fi; break; done; test -n "$ok"
    expected: >-
      "run <id> deployed <sha>" then contains, exit 0: the newest deploy-telemetry-content run whose record job succeeded, and
      the commit it deployed contains the build commit (the one squash commit carrying the rec-5491 Resolves trailer).
    fix_if: No approved run since the merge yet (wait, never dispatch), or the run failed (the content channel's own recovery).
    hermetic: false
  - step: 10
    phase: post-deploy
    action: >-
      Content reader smoke after that deploy (Decision 79): the live session_transcript_masked stamp equals main's and one masked
      read of a recent root session answers. Waits on VP 9; pending with it; prints counts only, never transcript text.
    command: >-
      OTL_OPS_VERBS_TRANSPORT=execute_api bin/venv-python -c "import datetime as d; from scripts.telemetry_capture.read_route import
      content_reader, make_routed_reader; from src.common import ducklake_content_read_verbs as cv; c=content_reader('agent_platform');
      live=c.describe()['session_transcript_masked']['read_version']; want=cv.content_read_version(cv.CONTENT_READS['session_transcript_masked']);
      t=d.datetime.now(d.UTC).date(); roots=make_routed_reader(profile='agent_platform').named('telemetry_root_sessions',
      day_from=(t-d.timedelta(days=1)).isoformat(), day_to=t.isoformat()); assert roots, 'no root session in 2 days';
      sid=roots[-1]['session_id']; env=c.named('session_transcript_masked', session_id=sid, offset=0, max_rows=5)[0]; print(live == want, len(env['rows']));
      raise SystemExit(0 if live == want else 1)"
    expected: Prints True and a row count (0 to 5), exit 0. Measured at plan time on the current deploy (True, 5).
    fix_if: False means the approved deploy predates the build (VP 9); an exception from the masked read is the content channel's own recovery.
    hermetic: false
  - step: 11
    phase: post-deploy
    action: rec-5491 closed by the merge's Resolves trailer
    command: >-
      OTL_OPS_VERBS_TRANSPORT=execute_api bin/venv-python -c "from src.common.ducklake_reader_client import make_reader, fetch_recs_by_ids;
      rows, missing = fetch_recs_by_ids(make_reader(profile='agent_platform'), ['rec-5491']); print(rows[0]['status'] if rows else missing)"
    expected: closed
    fix_if: open means the squash body lacks the Resolves trailer for rec-5491 or its acceptance failed in the closure job.
    hermetic: false
test_obligations:
  - source: src/common/ducklake_event_read_sql.py
    behavior: A 7-day root-sessions read fits the reader's memory and spill limits and reports the same conflicts.
    verification_step: 1
    test_selector: tests/common/test_ducklake_event_read_memory.py::test_root_sessions_week_fits_the_reader_memory
    red_green_expectation: red before (OutOfMemoryException), green after
  - source: scripts/telemetry_verify/session_presence.py
    behavior: The arrival unreadable cause names the reader's HTTP status, error_type and error_class.
    verification_step: 3
    test_selector: tests/telemetry_verify/test_session_presence_reader_status.py::test_unreadable_cause_names_status_and_error_type
    red_green_expectation: red before (file absent; the same assertion also fails on the old code, whose cause is the bare ReaderInvokeError), green after
constraints:
  - No raise of the reader's memory_size, DuckDB memory_limit or spill cap (those are spend and hide the cause).
  - No test, assertion or dedupe vector is loosened (Decision 235); the conflict result set must not change.
  - The telemetry reader deploys only through the governed deploy-ducklake-lambdas channel (Decisions 125, 126); no local deploy.
  - The content reader's deploy is never dispatched by this build (ducklake_event_read_sql.py is outside its protective set, so the channel does not ask); VP 9 and VP 10 record and smoke its next operator-approved deploy.
  - No AWS account id in any log excerpt, PR text or rec.
context:
  - "Decision-scout verdict NO_FLAGS (round 2, 228 of 228 triaged); CITE: dec:207, dec:272, dec:249, dec:125, dec:79, dec:236, dec:226, dec:254. Serves NS.6 (a measured failure fixed with red-before/green-after and live proof), within NS.3 (no spend raise)."
  - "Deploy order (Decisions 249 cl.3, 254): code deploys ship only the newest green main commit, so VP 5-11 wait until main is green again; the sibling red rec-5497 (full-tier xdist worker crash on the golden-gates tree test, cause low-confidence; another thread) must clear first or with this merge."
  - "Content reader (Decision 272): it packages this SQL file but it is outside its protective set, so its session_transcript_masked read_version differs from main until its next approved deploy; expected, not drift."
  - "Evidence (2026-11-23): every reader OutOfMemoryException since 2026-11-21 reads 'failed to offload data block ... (286.0 MiB/286.1 MiB used)'; DuckDB 1.5.4 names max_temp_directory_size in that message (reproduced locally), so memory was full and spill then filled; Lambda memory was not exhausted (REPORT max 902-970 of 1024 MB). Settings at src/common/ducklake_event_reads.py:32-34."
  - "Plan-time probe (scratch, synthetic Parquet corpus, reader limits): current root-sessions SQL fails at 300,000 observations in 0.3 s; duplicate-first conflicts pass in 0.7 s and at 1.5 million rows in about 4 s with identical row counts (the probe plants no conflicts; equivalence rests on VP 1's planted conflicts and VP 2's vectors). Locally the error reads 'failed to pin block', in production 'failed to offload'. Production totals: 831,247 observations and 537,962 transcripts in all."
  - "Inferred, not verified: a failure clusters on one warm container (four clusters, each on one log stream), so container state decides which 7-day read tips over; the rewrite removes the heavy operator either way."
  - "rec-5490 (7-day tool_use_rollup OOM) is NOT shown fixed by this change: the same probe corpus still runs out of memory in tool_use_rollup's own body after the rewrite. It stays its own rec, and VP 8 counts its out-of-memory events as evidence only."
  - "read_version: every compose() verb's stamp moves once; the monitor and golden-gate smokes already treat a stamp mismatch as deploy skew until the reader deploy lands."
  - "Data-model: no table, column or stored field is added."
  - "Shared file: src/common/ducklake_event_read_sql.py (474 of 500 SLOC; this edit adds about 3) is also scoped by unbuilt plans billing-shape-local, merge-annotate-contract-reader, telemetry-claude-p-capture-adapter, telemetry-planning-cost-reads and telemetry-repeated-tool-calls; only conflict_select changes here, so whichever builds second rebases."
  - "rec-5491 acceptance was a whole-file pytest path (out of the trailer census grammar, so the Resolves trailer could not close it); re-keyed at plan time 2026-11-23 through update_rec to the ::test_unreadable_cause_names_status_and_error_type node, read back."
  - "Related-work check (red_overlap, 2026-11-23 on fd930248): blocked; rec-5491 clear (repairs_this_red); rec-5497 overlap on selector-selected test paths only (no scope file is shared). Deferral rationale for rec-5497: it is the sibling Critical red (full-tier xdist worker crash on the golden-gates tree test, cause low-confidence) being repaired in another thread of this workspace; this plan repairs the other open red and edits none of its files. The build waits for rec-5497's repair before its full-tier handoff and deploy."
