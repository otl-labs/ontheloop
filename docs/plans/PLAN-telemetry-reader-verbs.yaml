    assert len(w.content)<1000000;print('LIVE_DERIVATION_OK')" && (aws logs filter-log-events --profile agent_platform
    --region eu-west-2 --log-group-name /aws/lambda/agent-platform-ducklake-reader --filter-pattern '"Max Memory Used"'
    --start-time $(( ($(date +%s) - 900) * 1000 )) --query 'events[-3:].message' --output text 2>/dev/null || echo
