infrastructure_dependencies:
- >-
  LAMBDA-DEPLOY (Decision 79/125/126): ducklake_runtime.py and ducklake_named_reads.py are in all six DuckLake bundles, so
  the governed deploy-ducklake-lambdas run on the merge commit rebuilds and redeploys the writer, telemetry writer,
  maintenance, maintenance-smoke, catalog_dr and reader functions and runs their smoke gates; step 12 asserts every deploy
  and smoke job. Only the reader gains behavior. No Terraform: the reader's TELEMETRY_* env pins and its smoke-prefix read
  grant already exist (terraform/personal/ducklake_lambdas.tf).
- >-
  LAMBDA-DEPLOY DEFERRED (CD.16 / Decision 79), per-artifact reasoned disposition: compute_affected_artifacts flags
  data-pipeline through src/common/ducklake_reader_client.py (bundled by its src/ wildcard), its own manifest,
  docs/ROADMAP-PLATFORM.yaml (an asset) and, until their exclude lines land, the three new modules. No build, deploy or smoke-test is owed: its handlers never read VERB_FIELDS or the
  version pin, .github/workflows/deploy-prod-lambdas.yml's path triggers include neither file, and the consuming scheduled
  agents are disabled; the artifact refreshes with its next governed deploy.
acceptance_criteria:
- >-
  The reader keeps two independent warm connections: an event-journal named_read binds the telemetry slot (ATTACHed under
  telemetry_catalog from TELEMETRY_META_SCHEMA/TELEMETRY_DATA_PATH, opened lazily); every other action, query_ops included,
  binds the ops slot and never opens or reaches the telemetry slot; a dead session reopens only its own slot; the ops
  slot's storage is unchanged.
- >-
  Every event verb refuses, before any connection or SQL, unless the telemetry pin names the smoke catalog; the refusal names
  rec-4292 (slice 2c lifts it with tenant-scoped reads, Decision 200 cl.2).
- >-
  NAMED_READS_VERSION is 6; describe lists the nine event verbs with every ops describe key (table, description, params,
  paginable, agent_facing, params_schema, read_version) plus kind, tables, catalog, binding and max_window_days
  (telemetry_health_count and sessions_window_all_purposes not agent-facing); scripts.agent_sdk.mcp_server's
  build_tool_registry over the live describe shape builds without error and projects only the agent-facing verbs; the 17
  ops verbs' read_versions are unchanged; an event verb's read_version changes when its SQL, any registry datum or any
  compared column changes.
- >-
  Parameters are validated before the telemetry slot is acquired (no ATTACH for a bad request) and every value is bound,
  never interpolated: a non-canonical session_id, a naive or malformed as_of, a malformed day or a window over its
  max_window_days each answer 400 named_read_input naming the parameter and never echoing the value; a non-string verb
  still answers the handler's own runtime error.
- >-
  The rendered R4/R5 block passes all 17 committed dedupe vectors in DuckDB with survivors compared by (event_id,
  parser_version) and conflicted grain keys exact, and distinguishes the two mutants the vectors miss (keep-lowest version;
  V* taken from non-open rows), in tests the full tier runs.
- >-
  Each derived row carries generations (V* per producer), conflicted_grain_keys and derivation_conflicted; a conflict never
  nulls, drops or errors the derivation.
- >-
  session_state_and_duration matches every golden case in derivation_cases.yaml at both as_of values (resume after close,
  close-last tie, annotate excluded, abandoned past 24 h and not before, a resume reviving an abandoned session,
  multi-producer, sync and async sub-agents from their agent-run pair with failed/timeout/throttled -> failed).
- >-
  session_process_event_rollup, session_friction_rollup (all 17 friction vectors; rework_total, exception_total, per-label
  counts, unmapped_count, classifier_version), agent_run_state_and_duration and agent_run_token_rollup (one count per
  model_call after the entity collapse) match their golden cases.
- >-
  sessions_window returns one derived row per root session of a real-purpose project in the bound day range ordered by
  (session_started_at, session_id), excludes drill and synthetic projects, refuses an eight-day window, and
  sessions_window_all_purposes includes all purposes.
- >-
  model_call_cost_estimate returns cost_usd with cost_source reported, allowance (billing_shape
  fixed_non_rollover_allowance, cost NULL) or unpriced (cost NULL), never a 0 standing in for an unknown.
- >-
  telemetry_health_count reads catalog metadata only (no data file); the preflight telemetry-store gauge names its catalog
  and is pass (any of the four tables populated, including only a non-sessions table), unpopulated (all empty) or
  unavailable from exactly one creds-gated warm-up reader call (none without credentials), with null counts when
  unavailable, and preflight.main writes it to the report.
- >-
  A per-session read touches only its own calendar day's data files on a real local DuckLake; that test is
  integration-marked, so no CI tier gates it (rec-4071 owns that residual) and the implementer runs it before the PR.
- >-
  The reader bundle carries the new modules and the three src/telemetry stdlib modules; data-pipeline excludes the new
  modules; ducklake_reader.yaml (with the narrowed object-store residual) and read-engine.yaml match the registries.
- >-
  After the governed deploy: every deploy and smoke job of the run passed; the CI lambda-reader step prints
  TELEMETRY_READS_OK (including the query_ops isolation check: HTTP 500, error_type unmapped, error_class CatalogException
  or BinderException); an independent live run of that gate and of the ops warm-reuse gate pass; a live window over the smoke
  rows returns at least one session whose per-session state agrees with its window row, with response bytes recorded; and
  the live preflight telemetry-store gauge reports pass on ducklake_smoke, after which T2.36 c3 is flipped to met by the
  bookkeeping PR.
verification_plan:
- step: 1
  phase: pre-deploy
  action: The pure event-read mechanism validates, binds, refuses, routes and versions correctly.
  command: >-
