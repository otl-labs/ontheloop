constraints:
- No caller SQL crosses the boundary; every value is a bound parameter and the SQL is registry content (Decision 84 I-3).
- One SQL statement per verb call, so a call pays one catalog stats transfer (Decision 88 cl.1, ducklake #859).
- >-
  The telemetry slot is a reused warm connection, reopened only on the dead-session condition (Decision 88 cl.1(i)); it is
  opened lazily. Two Postgres sessions per warm reader container on the shared owner login is the stated bound until
  rec-4300 gives the reader a SELECT-only login with a connection limit; no agent-readable probe of the reader's session
  count exists today, so this plan states the bound rather than measuring it.
- >-
  No Terraform, IAM, spend, Class A contract or Decision edit. The telemetry contracts' derivation blocks stay realized false
  (scripts/field_semantics_event_projection.py refuses true for read-timed fields); the Decision 199, 207 and 215 dated notes
  this work makes due are rec-4324's, for Benjamin's word.
- >-
  The reader handler change stays branch-free (every changed line runs on the ops path its existing suite executes, and
  the ops path calls _warm_reader_connection exactly as today); tests/test_ducklake_reader_handler.py (494 of 500 SLOC)
  gets only its one describe-assertion edit, and new handler behavior is tested in
  tests/lambdas/ducklake_reader/test_event_routing.py.
- >-
  Nothing in ducklake_runtime's import closure imports src.telemetry.append (the scripts-never-import-telemetry-append
  contract); event reads import only src.telemetry.identity/timestamps and src.row_rules.
- >-
  Decompose any module that would cross 500 SLOC into a facade package; never raise a budget (Decision 128). The SQL is
  already split from the registry data (ducklake_event_read_sql.py).
- >-
  No feedback-loop work (Benjamin 2026-10-12): per-label and unmapped counts are output columns only; no ratio signals,
  filer, back-validation or ladder shapes.
- sessions_window closes no T2.52 criterion and adds no depends_on to T2.52 (Decision 93).
- >-
  scripts/agent_sdk/mcp_server.py is unchanged: the event verbs reach agents through its derived projection, and its shared
  recommendations-cache note on every tool description is harmless on telemetry tools.
- No rescue agents or workaround loops (Decision 55).
- >-
  Not here: get_blob (rec-4291's follow-up), the canonical project remap (rec-4210), a SELECT-only reader login (rec-4300),
  duplicate-rate and pending-generation DQ monitors (rec-4063), tenant-scoped reads, lifting the smoke-pin refusal and the
  query_ops object-store residual (slice 2c, rec-4292), the price table (rec-4031), mid-request FatalException recycling
  (rec-4298), and Neon catalog egress measurement (catalog_stats is a PlatformAdmin action; rec-4292 item 2 measures before
  production).
- >-
  Gotchas: resolve_table_spec raises for event tables, so event verbs never touch the NamedRead path; describe is computed
  connectionless at MCP startup, so the registries must stay import-safe; the ops_projects current table name comes from
  resolve_table_spec('ops_projects'); DuckLake day() alone is day-of-month (rec-4065), so day bounds are timestamp ranges,
  never day(); a NUL in a string reaches DuckLake's pruning SQL (rec-4219), which the canonical-ULID and ISO-date checks
  rule out for these verbs.
