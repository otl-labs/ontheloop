- file: src/lambdas/ducklake_reader/handler.py
  action: Modify
  purpose: >-
    Branch-free wiring only (every changed line runs on the ops path the existing suite already executes, so its mapped
    coverage holds). _handle takes acquire = ev.acquirer_for(action, payload, _warm_reader_connection, EXTENSION_DIRECTORY)
    and calls acquire() and, on the reconnect-once path, acquire(force_reopen=True): for every ops action acquire IS
    _warm_reader_connection, called exactly as today (the suite's monkeypatched lambdas keep working), and a reopen touches
    only the slot in use. action_named_read calls ev.serve_named_read and stamps the read_version it returns;
    action_describe returns ev.describe_all(); the NamedReadInputError clause also catches ev.EventReadInputError (which
    carries verb and error_class) and _is_caller_input_error also accepts it, so an event-read input refusal answers the
    existing 400 named_read_input naming the parameter. query_ops and every other action bind the ops slot as today.
    Envelope, typed terminal answers (#1476) and the size guard are untouched.
