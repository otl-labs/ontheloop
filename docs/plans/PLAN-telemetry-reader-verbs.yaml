schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: telemetry-reader-verbs
intent: >-
  The telemetry read layer (rec-4291): give the shared ducklake_reader read access to the telemetry catalog through a
  second, isolated warm connection and an event-journal named-verb form, and ship the contract-named derived-state verbs
  (session state and duration, process-event, friction and agent-run roll-ups, the bounded sessions window, reported model
  cost) plus a metadata-only telemetry health verb and its preflight gauge. Telemetry state is then derived at read through
  the closed named-verb boundary (Decision 199 cl.1, Decision 84 I-3), every response reports generations and grain
  conflicts instead of resolving them (Decision 207), and slice 4 (rec-4025) has verbs to verify.
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-telemetry-reader-verbs.yaml
implementation_declared: true
phase: >-
  T2.36 (Phase 4: telemetry re-lands on DuckLake), the telemetry read layer (rec-4291; Benjamin, 2026-10-14,
  cmsg_012XgaFy8VaDQbxP5D8nC958GgNiPNy3uHRFLovP66hD4X). Closes T2.36:c3 ("Preflight telemetry health check re-enabled
  against the ducklake_reader boundary; telemetry-store preflight reports PASS when tables are populated") on the smoke
  catalog: the preflight gauge reads the smoke telemetry tables through the deployed reader and reports pass over the rows
  plan 3 part 2's smoke gate (PLAN-telemetry-append-inline, #1477) writes; the gauge re-points to production with the pin
  flip in slice 2c (rec-4292). The c3 flip lands in a post-deploy bookkeeping PR gated on that live PASS (step 17). get_blob
  is the one remaining rec-4291 item, in a follow-up blob read plan built after plan 4. T2.52 c3 is not closed and T2.52
  gains no dependant (Decision 93): sessions_window is the operator's reader-k2 (a) verb (2026-10-04), built in the reader.
closes_criteria:
- T2.36:c3
scope:
- file: src/common/ducklake_runtime.py
  action: Modify
  purpose: >-
    Named warm-connection slots: get_warm_connection gains slot (default "ops"). The ops slot keeps today's storage exactly
    (the module-level _warm_connection dict with its con/key entries, which tests/test_ducklake_runtime_warm_connection.py
    reads), so every existing caller, the telemetry writer included, is unchanged; any other slot lives in a separate
    named-slot map with its own key, liveness probe, dead-session reopen and connect meta, and a reopen of one slot never
    closes another. reset_warm_connection(slot=None) drops one slot or all. open_connection gains alias (default
    CATALOG_ALIAS); TELEMETRY_CATALOG_ALIAS = "telemetry_catalog" is added. No import of any src.telemetry or event-read
    module, so the five other DuckLake bundles that carry ducklake_runtime need no new file and the
    scripts-never-import-telemetry-append fence holds.
- file: src/common/ducklake_event_reads.py
  action: Create
  purpose: >-
    The event-journal read mechanism and the reader's routing helpers. The frozen EventRead type (verb, tables, sql
    template, params, binding session or window, max_window_days, data, description, paginable, agent_facing). Parameter
    validation before any SQL (session_id a canonical 26-character ULID; as_of a tz-aware ISO-8601 timestamp; day_from and
    day_to ISO dates with day_to - day_from + 1 <= max_window_days), raising EventReadInputError that names the parameter,
    never its value. require_smoke_pin (TELEMETRY_META_SCHEMA and TELEMETRY_DATA_PATH must name the smoke catalog, else a
    DuckLakeRuntimeError naming rec-4292). The partition binding (the session_id's 48-bit time prefix decoded with
    src.telemetry.identity.decode_time_prefix to its UTC calendar day, rendered as a bound session_started_at range plus the
    bound session_id; a window as a bound day range). The one rendered R4/R5 dedupe fragment and the pre-retirement
    conflict report (Decision 207), compared over every stored column except created_timestamp, producer_version and the
    row rules' representation-only columns (src.row_rules.RowRules.from_projection over the field_semantics event
    projection, never src.telemetry.append). event_read_version (sha256 over verb, tables, params, binding,
    max_window_days, paginable, normalised SQL template, canonical JSON of data and the compared-column set per table).
    execute (one SQL statement per call, values bound). Routing for the handler: acquirer_for(action, payload, ops,
    extension_directory) returns the handler's own ops acquirer unchanged for every action but an event-verb named_read
    (a non-string or unhashable verb counts as ops, so the handler's own verb check still answers it), and for an event
    verb first runs require_smoke_pin and the parameter validation (so a bad request never pays an ATTACH), then returns
    the telemetry-slot acquirer (rt.get_warm_connection with slot "telemetry" and an opener that ATTACHes the pinned
    catalog under TELEMETRY_CATALOG_ALIAS); serve_named_read (ops verbs to the unchanged rt.named_read and rt.read_version,
    event verbs to execute and event_read_version); describe_all (the ops rows from rt.describe_named_reads unchanged,
    plus one row per event verb that is a superset of the ops row shape -- table (its first table), description, params,
    paginable, agent_facing, params_schema, read_version -- plus kind event_journal, tables, catalog telemetry, binding and
    max_window_days). The telemetry slot's opener sets memory_limit '300MB' on its connection; the ops slot keeps DuckDB's
    default, so whether both fit the reader's 1024 MB is an expectation that step 16's Max Memory Used reading verifies
    (and step 6's local run records peak RSS with both slots open). Import direction (no cycle): ducklake_event_read_verbs
    imports EventRead from this module at module scope, and this module's routing helpers import EVENT_READS
    function-locally. Imported by the reader handler only.
- file: src/common/ducklake_event_read_sql.py
  action: Create
  purpose: >-
    The SQL templates (pre-declared split, Decision 128): the dedupe and conflict fragments, the root lifecycle and
    sub-agent agent-run state rule rendered once and shared by session_state_and_duration and both window verbs (one rule,
    one copy), the roll-up, friction (the friction report's section 2 sketch), token, cost and metadata-only health
    queries. Strings only, nothing that can raise at import.
- file: src/common/ducklake_event_read_verbs.py
  action: Create
  purpose: >-
    The registry data and the EVENT_READS entries: IDLE_THRESHOLD_SECONDS = 86400; the friction rules block
    (classifier_version 1, repeat_threshold 3, run rule repeated_tool_failure, rules r01-r04 and r90-r94 from
    docs/plans/reports/REPORT-w1-friction-classifier.md section 2); MAX_WINDOW_DAYS = 7; and the nine verbs with their
    agent_facing flag: session_state_and_duration (session_id, as_of), session_process_event_rollup (session_id),
    session_friction_rollup (session_id), agent_run_state_and_duration (session_id, as_of), agent_run_token_rollup
    (session_id), model_call_cost_estimate (session_id) and sessions_window (day_from, day_to, as_of; real-purpose projects
    only, paginable, ordered by session_started_at then session_id) are agent-facing; sessions_window_all_purposes (same
    params, every purpose) and telemetry_health_count (no params; per-table committed record counts read through the
    two-part __ducklake_metadata_<alias>.ducklake_table / ducklake_table_stats form the live partition-layout reads use,
    src/common/ducklake_partition_layout.py:106-112, plus the pinned meta schema as a bound value) are not. Each agent-facing description says it reads
    the smoke catalog only until slice 2c (rec-4292), so no agent reads synthetic smoke rows as real telemetry. Every verb
    returns derived rows only, never a raw row, transcript content or free text (Decision 209 cl.2a). Pure data, no I/O,
    nothing that can raise at import. session_state_and_duration and both window verbs return the same session_id, state,
    outcome and duration_seconds columns from the one shared state rule.
- file: src/common/ducklake_named_reads.py
  action: Modify
  purpose: >-
    NAMED_READS_VERSION 5 -> 6 (the registry format now spans two verb classes). NAMED_READS itself, read_version and
    describe_named_reads are unchanged, so the 17 ops verbs' read_versions and describe rows are byte-identical; the event
