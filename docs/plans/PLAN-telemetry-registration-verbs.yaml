constraints:
- >-
  The telemetry verbs live only on agent-platform-ducklake-telemetry-writer. Do not add them to the shared writer, to
  VERB_REGISTRY or to ducklake_writer.yaml (recon 7/12). Do not edit ducklake_writes.py or ducklake_scd2_schema.py; reuse
  their helpers by import.
- >-
  No Terraform and no IAM change. Emit metrics only with namespace DuckLakeTelemetryWriter: the role denies any other, and
  the denial is swallowed silently (recon 6).
- >-
  Nothing in ducklake_runtime's import closure, and nothing under scripts/, may import a module that imports
  src.telemetry.append (the scripts-never-import-telemetry-append contract, .importlinter:148-154).
- >-
  Public repository (Decision 101): no account id, ARN, host or a hash of any of them in code, fixtures, logs, responses
  or gate output. Tests use placeholders only; a 12-digit literal fails test_telemetry_dimension_contracts.py:55.
- >-
  Regenerate field_semantics.yaml with the generator, never by hand. Keep every new module, and every file the sibling
  plans created that this plan grows (lambda_telemetry_gates.py, test_lambda_telemetry_gates.py, test_handler.py moved
  from the flat path, test_packaging.py), under 500 SLOC; decompose rather than raise a budget (Decision 128). Each telemetry writer module
  keeps its own mirror test file; never special-case scripts/test_coverage_checker.py to route one.
- >-
  The implementation merge redeploys every DuckLake function, so it waits for Benjamin's explicit word, and only after the
  boundary Deny is verified and the deploy-wiring plan is deployed and green.
- No rescue agents or workaround loops (Decision 55).
