execution_steps:
- >-
  Write tests/common/test_ducklake_telemetry_txn.py, then src/common/ducklake_telemetry_txn.py. Run step 1.
- >-
  Change scripts/schema_to_field_semantics.py, regenerate config/lambda/ducklake/field_semantics.yaml, add the projection
  test. Run step 6.
- >-
  Write tests/common/test_ducklake_telemetry_registration.py (pure nodes plus the in-memory SQL nodes), then
  src/common/ducklake_telemetry_registration.py. Run steps 2 and 3.
- >-
  Write tests/common/test_ducklake_telemetry_registration_integration.py and run step 10 locally. If the ids diverge,
  stop: Decision 200's reversal condition fires and the model returns to /plan.
- >-
  Write tests/common/test_ducklake_telemetry_provision.py, then src/common/ducklake_telemetry_provision.py. Run step 4.
- >-
  Move the handler tests. A branch started before this amendment rebases onto it first (validate_scope_boundary reads
  scope from the base). git mv tests/test_ducklake_telemetry_writer_handler.py
  tests/lambdas/ducklake_telemetry_writer/test_handler.py, as its own commit where the branch allows, so review sees a
  rename; if a mirror test_handler.py already exists, fold the flat file's nodes into it without dropping any, then
  delete the flat file. Repoint the telemetry-writer-stub-handler shard's command; generalise the RS-08 pin in
  tests/test_coverage_checker/test_coverage_checker_map.py. Run step 19 and step 18's RS-08 node. If telemetry_actions.py
  already exists without test_telemetry_actions.py, tests/test_coverage_checker/test_coverage_checker_checks.py::
  test_unmapped_sources_do_not_grow stays red until the next step adds that file.
- >-
  Write telemetry_actions.py and its tests, extend handler.py and test_handler.py, and create
  docs/contracts/ducklake_telemetry_writer.yaml. Run step 5. Then add
  TestMapSourceToTest::test_telemetry_writer_modules_map_to_their_own_mirror_tests (it needs test_telemetry_actions.py to
  exist, since rule 4 falls back only to an existing mirror) and run steps 18 and 20.
- >-
  Update the telemetry writer and data-pipeline manifests, the deploy push paths and code_drift, with the wiring tests.
  Run steps 7 and 11.
- >-
  Add the gate vectors and their red cases (the markers TELEMETRY_PROVISION_OK, TELEMETRY_TENANT_STABLE,
  TELEMETRY_PROJECT_CONVERGED, TELEMETRY_PROBE_OK, TELEMETRY_SELF_ONLY_OK and the catalog_backend line are printed by the
  gate). Run step 8.
- >-
  Amend ops_tenants, ops_projects, ops_entity_counters, storage-substrate and ports, and extend the contract test. Run step 9.
- >-
  Run step 17 and step 12 (the fast tier, then a COMPLETED full tier; a timeout is not a pass).
- >-
  Closure evidence (implement skill Commit Flows): step 12's completed full tier; push, PR, CI green; postflight. Confirm
  preconditions (a)-(c) in infrastructure_dependencies hold at merge time, then ask Benjamin for the merge (it redeploys
  every DuckLake function). On his word, squash-merge.
- After the merge, run steps 13-16 against the deploy run for the merge commit.
- 'Report: what was implemented, verification results, the catalog_backend=neon evidence for the RDS swap thread, and the measured catalog_sessions for the direct-invoke thread''s CONNECTION LIMIT.'
