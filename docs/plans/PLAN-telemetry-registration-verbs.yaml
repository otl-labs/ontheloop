infrastructure_dependencies:
- >-
  No Terraform. Every runtime resource comes from the three plans merged in #1430 (5433e631): PLAN-url-only-invoke-guard
  (the boundary Deny on direct invoke, PlatformDev's URL-only grant, the scoped secret agent-platform-ducklake-telemetry-writer-dsn
  and the ducklake_telemetry_writer login set by the maintenance verb provision_telemetry_login, Decision 213),
  PLAN-telemetry-writer-function (the function, URL, role, env pins TELEMETRY_META_SCHEMA / TELEMETRY_DATA_PATH /
  TELEMETRY_DSN_SECRET_ID, DUCKLAKE_FIELD_SEMANTICS_PATH, the DuckLakeTelemetryWriter metric grant, reserved concurrency 5
  and the blob grant fenced to the smoke catalog's folder) and PLAN-telemetry-writer-deploy-wiring (the deploy map entry,
  the serving-leg deploy and the --lambda-telemetry smoke step run as github_ci_branch).
- >-
  The scoped login holds SELECT/INSERT/UPDATE/DELETE on the ducklake_smoke schema's tables and no CREATE anywhere
  (ducklake_telemetry_writer_role.sql). Every statement this plan issues is DuckLake metadata DML (DuckLake turns CREATE
  TABLE, SET PARTITIONED BY, INSERT, UPDATE and DELETE into metadata-table DML plus Parquet on S3), so it needs no grant
  beyond that; this plan's live gate is the first run of every telemetry verb under the login, the measurement the
  boundary consult (Q3) asks for, and it reports catalog_sessions for the login's CONNECTION LIMIT 10. A privilege error
  there is a grant gap reported to the direct-invoke thread, never worked around in code. The same holds for an S3
  AccessDenied raised while DuckLake cleans up a losing transaction in the 4-way fan-out: the role has no s3:DeleteObject
  by design, and this gate drives its first OCC conflicts.
- >-
  Ordering: this implementation merges only after (a) PLAN-url-only-invoke-guard is applied and verified (Decision 213
  on main, the login provisioned), (b) PLAN-telemetry-writer-function is merged and applied, and (c)
  PLAN-telemetry-writer-deploy-wiring is deployed with its --lambda-telemetry step green, and (d) the smoke catalog's
  pre-existing target tables are known: an admin-directed, read-only reconcile_partitions call on the maintenance function
  (dry_run true, meta_schema ducklake_smoke, the smoke data_path; PlatformAdmin, run by Benjamin's admin agent) reports
  which of the nine target tables already exist and any partition drift, and any drift is repaired under Decision 204
  cl.2's human-directed shape before the merge. If that read cannot run (for example an unclassified smoke table, or the
  admin role's data-prefix scope), say so to Benjamin with precondition (a); provisioning's own read-only check then
  fails loud on the first deploy and step 13's exception (1) applies. The merge
  redeploys all six DuckLake functions (field_semantics.yaml and src/common/ducklake_*.py), production writer and reader
  included, so it waits for Benjamin's explicit word.
- >-
  LAMBDA-DEPLOY DEFERRED for data-pipeline: its manifest edit only excludes the three new src/common modules, so its zip
  contents are unchanged; proven by VP 7's test_data_pipeline_excludes_every_ducklake_telemetry_module (the
  PLAN-telemetry-writer-function precedent).
- >-
  The RDS catalog swap's cutover waits for this plan's gate to be recorded on Neon (catalog_backend=neon); after the swap
  the same gate re-runs unchanged and records catalog_backend=rds (Benjamin, 2026-10-08).
acceptance_criteria:
- run_telemetry_txn re-raises every terminal class before the OCC-collision check, so a message containing "conflict" from
  a terminal error is never retried; an OCC collision retries and exhaustion raises OCCRetryExhaustedError.
- register_tenant returns one canonical ULID per signed principal across calls and never returns or logs the principal.
- register_project returns one project_id per (tenant, project_ref), derives purpose from the projected prefix_map,
  refuses an unregistered reserved ref when not explicit (403 project_unregistered) and requires a registered tenant (403
  tenant_unresolved); on all four verbs, a non-str value, U+0000 or a code point in U+D800-U+DFFF in an accepted string is
  400 bad_request naming the field, never the value, before any catalog read.
- provision_telemetry creates and partitions all seven tables before any row lands, seeds only the two telemetry counter
  rows without ever lowering one, and has no drop path.
- Two concurrent registrations of the same project_ref on a DuckLake catalog converge on one id (local race test, and the
  live gate's four concurrent calls).
- The handler maps registration errors to their statuses, emits metrics only in the DuckLakeTelemetryWriter namespace,
  and builds the principal at the edge.
- field_semantics.yaml carries ops_projects derivations.purpose equal to the contract's derivation block, and the
  generator's --check passes.
- The telemetry writer bundle includes the kernel and the new modules; data-pipeline excludes them; the deploy workflow
  triggers on src/telemetry/**; code_drift tracks src/telemetry.
- The deployed --lambda-telemetry step passes with part 1's vectors on the merge commit and logs catalog_backend=neon.
- Each telemetry writer module is measured by its own mirror test file at 100% line coverage (handler.py by
  tests/lambdas/ducklake_telemetry_writer/test_handler.py, telemetry_actions.py by test_telemetry_actions.py), and the flat
  tests/test_ducklake_telemetry_writer_handler.py no longer exists.
