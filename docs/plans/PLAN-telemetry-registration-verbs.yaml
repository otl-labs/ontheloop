schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: telemetry-registration-verbs
intent: >-
  Telemetry slice 2a-2, plan 3 part 1 (rec-4024 carrier, T2.36). The separate telemetry writer function
  (agent-platform-ducklake-telemetry-writer, built by PLAN-telemetry-writer-function and PLAN-telemetry-writer-deploy-wiring)
  gains its first production verbs: provision_telemetry, register_tenant (the signed caller only), register_project and the
  telemetry_probe gate action, all bound to the isolated ducklake_smoke catalog by the function's own pins. This proves the
  counter-row lock live on the catalog backend (Decision 200's lock arm) before part 2's append verb is built on it.
  Telemetry is the learning signal for recursive self-improvement (PROJECT_CONTEXT); this plan writes nothing to the
  production ops catalog.
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-telemetry-registration-verbs.yaml
implementation_declared: true
phase: >-
  T2.36 (telemetry re-lands on DuckLake). Writer-verb groundwork carried by rec-4024; closes no exit criterion.
scope:
- file: src/common/ducklake_telemetry_txn.py
  action: Create
  purpose: >-
    The telemetry writer's one transaction loop (seam 2 of part1-seams-from-part2.md) and its generic request error (seam 5).
    (1) TelemetryRequestError(Exception) carrying status (int), error_type (str) and a value-free fields mapping; its str()
    never includes a request value. (1b) invalid_string_field(values: Mapping[str, object]) -> str | None, a pure
    function returning the name of the first entry whose value is not a str, contains U+0000, or contains any code point
    in U+D800-U+DFFF (so str.encode("utf-8") succeeds; json.loads joins an escaped surrogate pair into one code point, so
    only a lone surrogate can remain), else None; it never returns, formats or logs the value. (2) run_telemetry_txn(con, body, *, terminal=(...), max_attempts=OCC_MAX_ATTEMPTS,
    metric_sink=None, sleep=time.sleep) -> TxnOutcome(result, occ_retries, commit_ms). It owns BEGIN TRANSACTION, the body
    call, COMMIT, rollback on any error, and classification. TERMINAL FIRST (seam 1): after rollback, any instance of
    TelemetryRequestError, rt.DuckLakeRuntimeError (which subsumes SchemaGateError, RowRuleViolationError and
    ReferentialError and covers lock_counter's and purpose_for's refusals, the ducklake_writes.py:421-423 precedent),
    src.telemetry.gate.AppendError (the GateError/GrainConflictError family) or a caller-supplied extra terminal class
    re-raises immediately, BEFORE
    ducklake_writes.is_occ_collision is consulted, because is_occ_collision matches the substring "conflict" and a kernel
    GrainConflictError message carries "TELEMETRY_GRAIN_CONFLICT: conflicting row". Then an OCC collision retries with
    ducklake_writes._occ_backoff up to max_attempts and raises OCCRetryExhaustedError on exhaustion (Decision 81 cl.3, one
    retry policy); any other error propagates (Decision 55). It emits OccRetryCount and CommitLatencyMs through the sink
    it is given, mirroring ducklake_writes._emit_write_metrics. It imports from ducklake_writes, ducklake_scd2_schema,
    ducklake_write_rules and src.telemetry.gate only; it never imports ducklake_runtime's facade (Decision 80 discipline)
    and nothing in ducklake_runtime's closure imports it (the scripts-never-import-telemetry-append fence, recon 5).
- file: src/common/ducklake_telemetry_registration.py
  action: Create
  purpose: >-
    Tenant and project registration primitives that compose inside the caller's transaction and own no BEGIN/COMMIT (seam
    3). (1) CallerPrincipal(kind, ref, role_name) frozen dataclass with ref excluded from repr; kind is aws_account or
    configured (ops_tenants.yaml:51-60), so the cloud edge and a later local adapter (Decision 184 cl.2) use the same port.
    (2) purpose_for(project_ref, derivation) -> str: the first prefix in the projected prefix_map that project_ref starts
    with, else the default; the map is read from field_semantics ops_tables.ops_projects.derivations.purpose (projected by
    this plan from ops_projects.yaml's derivation block, the single source, Decision 210 cl.3), never restated in Python;
    a missing projection raises DuckLakeRuntimeError. (3) lock_counter(con, counter_name): SELECT count(*) of the
    ops_entity_counters row (exactly one, else DuckLakeRuntimeError naming provision_telemetry), then UPDATE ... SET
    current_value = current_value + 1 WHERE counter_name = ? (Decision 84 I-2: the write-write conflict at COMMIT is the
    serialization point; no id is allocated from it, ids are ULIDs). (4) lookup_tenant / lookup_project read-only lookups
    on the current tables: (principal_kind, principal_ref) -> tenant_id and (tenant_id, project_ref) -> (project_id,
    registration); lookup_project first runs invalid_string_field over project_ref and raises TelemetryRequestError(400,
    bad_request, {field}) before any statement, because part 2's append path reaches it without telemetry_actions. (5)
    resolve_or_register_tenant(con, principal, *, identity, semantics) -> (tenant_id, created): lookup;
    on a miss, lock_counter("ops_tenants") then write the first SCD2 version (status active, canonical_tenant_id null).
    (6) resolve_or_register_project(con, tenant_id, project_ref, *, explicit, attributes, identity, semantics) ->
    (project_id, created): first runs invalid_string_field over project_ref and any supplied name or remote in
    attributes, raising TelemetryRequestError(400, bad_request, {field}) before any statement; then lookup; a hit with
    explicit=True writes a new SCD2 version only when a SUPPLIED name or remote
    differs (an omitted attribute means unchanged, so a bare re-register never clears one) or registration moves
    unregistered -> registered (never back); a miss with explicit=False and purpose != real raises
    TelemetryRequestError(403, project_unregistered, {remedy: register_project}) (project-id.yaml:55-59; part 2's append
    path); otherwise lock_counter("ops_projects") then insert with registration registered (explicit) or unregistered.
    (7) The dimension writer used by (5) and (6): schema_gate on the caller-known inputs, then the derived purpose added
    after the gate, check_write with rules_for(spec) (Decision 210 cl.1), and the history MERGE plus current MERGE built by
    ducklake_scd2_schema's _build_merge_history_sql / _build_merge_current_sql / _write_params over ordered_columns (history
    and current in one transaction, Decision 81 cl.8). write_scd2 is NOT used: its schema_gate refuses the derived purpose
    and it owns its own transaction (recon 7). ULIDs (tenant_id, project_id, the write ulid) are minted once per request
    outside the retry loop as canonical uppercase (Decision 200 cl.4); a retried attempt re-runs the lookup, so a loser
    returns the winner's id. (8) Per-container caches: tenant (kind, ref) -> tenant_id and project (tenant_id, project_ref)
    -> project_id, populated only after run_telemetry_txn returns (a COMMITTED read or registration), never inside the
    transaction body, so an OCC loser never caches its uncommitted ULID; plus one clear_telemetry_caches() (seam 4), called
    by the handler when its warm connection reopens. An attribute update carries created_timestamp unchanged and never
    moves registration back from registered.
    No function logs or returns principal.ref (ops_tenants.yaml:63-72, Decision 101).
- file: src/common/ducklake_telemetry_provision.py
  action: Create
  purpose: >-
    provision_telemetry_catalog(con, *, semantics) -> ProvisionResult(tables, counters), the body of ONE run_telemetry_txn
    transaction (DuckLake commits CREATE, SET PARTITIONED BY and row DML together; verified locally by the critique). In
    the connection's catalog (ops_catalog, which on this function is always the pinned ducklake_smoke), it first reads
    which tables exist (duckdb_tables() for the ops_catalog database), then ONLY for an absent table creates and
    partitions it in the same transaction, so an existing table is never re-ALTERed (no per-deploy snapshot or conflict
    with in-flight writers, Decision 88; re-laying a live partition spec is reserved to the admin verbs, Decision 204):
    (1) the four event tables telemetry_sessions/observations/transcripts/agents, CREATE TABLE from
    EventTableSpec.from_projection's declared columns with NOT NULL on spec.not_null (the structural grain columns plus the
    required key-plan columns) plus tenant_id and project_id, which the writer always stamps (Decision 200 cl.2); this is
    deliberately narrower than the projection's nullable:false set, which the kernel's row rules enforce before any SQL
    (Decision 210 cl.5 defence in depth), and create-only provisioning cannot tighten DDL later without an admin step, then ALTER ... SET PARTITIONED BY the entry's history partition (the session_started_at
    calendar-day triple, Decision 199 cl.2 / 137); the table name is an attribute so validate_table_registration skips
    it, and every name is checked against the registry; (2) ops_tenants and ops_projects via create_scd2_tables
    (calendar-day history, bucket current) only when BOTH halves of a pair are absent; exactly one half present raises a
    loud DuckLakeRuntimeError naming the admin repair (Decision 55), because create_scd2_tables would re-ALTER the existing
    half; (3) ops_entity_counters via create_control_table (partitioned on counter_name) when absent; (4) before any
    seed row is written, every PRE-EXISTING target table is checked read-only against its declared spec: its live
    partition transforms (the ducklake_table / partition metadata read that ducklake_partition_layout.read_partition_layout
    performs, restricted to the target tables, i.e. the four event tables, BOTH halves of each SCD2 pair and the counter
    table (nine physical tables), so an unrelated smoke-catalog table never fails provisioning,
    normalized with ducklake_partition_spec.normalize_partition_spec and compared as compare_to_declared does) and its
    column set (an information_schema read in the reconcile_table_columns shape); any mismatch raises a loud
    DuckLakeRuntimeError naming the table and the drift, never a value, and writes nothing (recon 3.5 item 4: the smoke
    catalog's legacy ops_entity_counters may be unpartitioned); (5) the ops_tenants and ops_projects counter rows only: a missing, duplicated or below-floor row is rewritten (DELETE that
    counter_name, one INSERT) at the maximum of its existing values and count(*) of its current table, so a seed never
    lowers a counter (the ulid floor control_health asserts, ops_entity_counters.yaml); an existing single row at or above
    the floor is left alone; no other row is touched. Every table is partitioned before any row lands (Decision 137).
    Create-if-not-exists only: there is NO drop or force-recreate path on this function, so CI's invoke never reaches a
    destructive verb (fable-consult-telemetry-writer-boundary/ADVICE.md Q2/Q4); a reset of the smoke telemetry tables
    stays an admin maintenance concern, out of this plan's scope. It never sets inlining (the connection already carries
    ducklake_default_data_inlining_row_limit = 0, Decision 107).
- file: src/lambdas/ducklake_telemetry_writer/telemetry_actions.py
  action: Create
  purpose: >-
    The verb bodies, called by the handler with (request, con, deps). TelemetryRequest is a frozen dataclass: action, body
    (dict), principal (CallerPrincipal), request_bytes (int, the raw body length, seam 6). Each verb declares its allowed
    keys; any other key is 400 bad_request, and "component" (a string) is allowed on every verb for part 2's C6 stamp
    (seam 7). (1) provision_telemetry {} -> {ok, tables, counters}; a force_recreate or confirm key is 400 like any unknown
    key. (2)
    register_tenant {} -> {ok, tenant_id, created}; principal_kind/principal_ref/tenant_id keys are 400 (self only, no
    confirm token, Fable Q13). (3) register_project {project_ref, name?, remote?} -> {ok, project_id, created, purpose,
    registration}; the tenant must already be registered, else 403 tenant_unresolved {remedy: register_tenant}. On the
    four verbs this plan adds, every string a verb accepts (project_ref, name, remote, component) must be a str with no
    U+0000 and no code point in U+D800-U+DFFF (str.encode("utf-8") succeeds), checked by ducklake_telemetry_txn's
    invalid_string_field before any catalog read, else 400 bad_request {field} naming the field, never the value
    (part 2 reuses the predicate for append_telemetry; the shared writer and reader's same gap is rec-4219): on a Postgres catalog a NUL in a value DuckLake renders into its
    file-pruning SQL (the lookup and MERGE key filters) raises an unmapped ParserException that echoes the value and
    pages as a Lambda Error (reproduced by the append-part thread on duckdb 1.5.4 with a Postgres 16 catalog; the local
    file catalog does not show it). (4)
    telemetry_probe {} (gate instrumentation, out of contract scope like the writer's probes) -> {ok, meta_schema,
    data_path_is_smoke, connect_reused, catalog_login, catalog_backend, catalog_sessions, tables (present and
    partitioned_as_declared per PHYSICAL table, both halves of each SCD2 pair included, from the same read-only check
    provisioning runs),
    counters, counter_rows, current_counts}. catalog_login and catalog_backend come from the handler's per-container
    capture inside the opener (the stub's catalog_login pattern): catalog_backend is "neon", "rds" or "other", classified
    from the scoped secret's host by its public suffix; the host itself is never returned or logged. catalog_sessions is a
    MEASUREMENT, not a check: the count of this login's sessions from pg_stat_activity, read through DuckDB's
    postgres_query on the postgres database DuckLake attaches for the catalog metadata (found in duckdb_databases(), never
    a hard-coded alias), or null with a reason when that read is unavailable; it sizes the login's CONNECTION LIMIT 10
    (PLAN-url-only-invoke-guard's migration names this gate as its measurement). Every write verb runs through
    run_telemetry_txn with the function's metric sink.
    Responses never carry principal.ref or a hash of it (Decision 101). This module imports src.common telemetry modules;
    nothing under scripts/ imports it.
