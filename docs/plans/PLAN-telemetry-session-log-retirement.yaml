    action: Create
    purpose: >-
      Fake-reader cases: ok (rows out of order -> newest 5 descending, last_session = newest, rendered line shape incl.
      last=, null outcome and duration render as -), empty (reader returns [] -> [] and "" with status empty), unavailable on
      exception, on a reader that sleeps past the deadline (result() returns within the remaining deadline + 1 s, counted
      from start, with a fake clock) and on a typed deadline error
      (both fields None, never [] or ""), exact verb and params passed (sessions_window; day_from/day_to span
      window_days UTC days ending today; as_of set), no `limit` argument passed, running rendered as-is, format_history
      lines for each status; a fake reader that logs through the reader-client logger from inside the worker produces
      no output while a main-thread warning on the same logger still appears, and the filter is removed afterwards.
