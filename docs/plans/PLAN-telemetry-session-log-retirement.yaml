constraints:
  - >-
    No reader or writer Lambda change, no src/common/ducklake_*.py or config/lambda/ducklake/** edit (either would start
    the governed Lambda deploy channel), no Terraform, IAM, Neon, secret or AWS change, no admin credentials.
  - >-
    Production telemetry is read only through the telemetry reader with a named verb (Decision 236 cl.2, Decision 84 I-3);
    preflight adds exactly one sessions_window call per creds-ok run (Decision 215 cl.4 / Decision 88 D4: one bounded
    call, window <= 2 UTC days, well inside MAX_WINDOW_DAYS).
  - An unknown is null, never [] or "" (Decision 215 cl.2); state and outcome are the reader's derivation, never re-derived (Decision 199, 228).
  - >-
    Weakening dispositions are recorded at the bookkeeping commit from validate_weakening_candidates' actual list
    (Decision 181, 235): a test whose subject file or symbol is deleted in this diff (tests/test_north_star_tracker.py,
    tests/session/preflight/test_context_docs_session_log.py, the check_plan_compliance class) is retirement citing the
    deleted path or symbol; a removed or changed test whose subject survives (run_close, run_auto, read_context_files:
    the intent and session_log_entry cases in test_close.py and test_auto.py, test_recent_sessions_extracted) is
    planned-change citing the acceptance_criteria[N] or test_obligations[N] that replaces it. The moved append_jsonl
    tests raise no candidate (byte-identical statements). Any other candidate stops and escalates.
  - >-
    README.md and AGENTS.md are on the hard always-ask list (public surface); Benjamin's word on the final hunks,
    pasted inline in the thread, before merge.
  - "SLOC: decompose rather than raise any budget (Decision 128)."
  - No rescue agents or workaround loops (Decision 55).
