    fix_if: A live hit remains - rewire or remove it in scope; a hit outside scope escalates to the coordinator (scope rule).
    hermetic: true
    expected_literals: []
    graduation: waive
    graduation_waiver_reason: >-
      A one-time retirement sweep over prose and code; the standing guard is
      tests/session/test_session_log_surface_retired.py, which runs in every tier and fails if the log file,
      SESSION_LOG_FILE, parse_last_session, _read_session_blocks, north_star_tracker, check_plan_compliance or the
      retired-identity exemption comes back.
  - step: 6
    phase: pre-deploy
    action: Discharge the handoff obligation with a full-tier run to completion.
    command: bin/venv-python -m scripts.validate
    expected: exit 0.
    fix_if: >-
      A failure in scope is fixed on the branch; never skip a test, relax an assertion or add a baseline. A failure
      outside scope becomes a rec via scripts.ops_data_portal (Decision 59, 55).
    hermetic: false
    graduation: not-applicable
  - step: 7
    phase: post-deploy
    action: >-
      Live read after merge (no deploy is involved; the verb and reader are already deployed): preflight on main under
      the agent_platform profile reports the history from production.
    command: >-
      AWS_PROFILE=agent_platform bin/venv-python -m scripts.session.preflight && bin/venv-python -c "import json,
      datetime as d; r=json.load(open('logs/.preflight-report.json')); h=r['session_history'];
      s=r['context']['recent_sessions']; ls=r['last_session'] or '';
      floor=(d.datetime.now(d.UTC).date()-d.timedelta(days=1)).isoformat(); print('SESSION_HISTORY', h['status'],
      len(s or []), ls[:16], h.get('reason')); raise SystemExit(0 if h['status']=='ok' and s and len(s)<=5 and ls[:10]>=floor else 1)"
    expected: >-
      Prints SESSION_HISTORY ok <n> <timestamp> with n between 1 and 5 and a timestamp within the last 2 UTC days; exit 0
      (the recency and count are asserted, not only printed).
    fix_if: >-
      unavailable with a deadline reason - the cold read exceeded SESSION_HISTORY_DEADLINE_S even overlapped; record the
      measured time and RCA against rec-4474 (cold window reads) before any re-run (Decision 55), never raise the
      deadline to pass; unavailable for another reason - read it and RCA; empty - check that capture is enabled and that real sessions ran in the window before suspecting
      the code.
    hermetic: false
    graduation: not-applicable
  - step: 8
    phase: post-deploy
    action: rec-4598 closed by the squash-merge's Resolves trailer.
    command: >-
      bin/venv-python -c "from src.common.ducklake_reader_client import fetch_recs_by_ids, make_reader;
      r,_=fetch_recs_by_ids(make_reader(profile='agent_platform'), ['rec-4598']); print(r[0]['id'], r[0]['status']);
      raise SystemExit(0 if r[0]['status']=='closed' else 1)"
    expected: Prints rec-4598 closed; exit 0.
    fix_if: Still open - follow only the route ci.yml's trailer-closure job prints (git-ops.yaml resolves_trailer), never a bare manual close.
    hermetic: false
    graduation: not-applicable
  - step: 9
    phase: post-deploy
    action: >-
      Recs mooted by the deletion read superseded, and rec-3614 is re-scoped to drop its north_star_tracker half.
    command: >-
      bin/venv-python -c "from src.common.ducklake_reader_client import fetch_recs_by_ids, make_reader;
      ids=['rec-3613','rec-3652','rec-3657','rec-3658','rec-3614']; r,_=fetch_recs_by_ids(make_reader(profile='agent_platform'),
      ids); m={x['id']: x for x in r}; print({i: m[i]['status'] for i in ids}); ok=all(m[i]['status']=='superseded' for i in
      ids[:4]) and m['rec-3614']['status']=='open' and 'north' not in (m['rec-3614'].get('acceptance') or '');
      raise SystemExit(0 if ok else 1)"
    expected: Prints the five statuses (four superseded, rec-3614 open); exit 0.
    fix_if: >-
      A rec still open or rec-3614 still naming north-star-tracker - run the update_rec call from execution step 7 through
      scripts.ops_data_portal (Single Portal Invariant), never a direct write.
    hermetic: false
    graduation: not-applicable
