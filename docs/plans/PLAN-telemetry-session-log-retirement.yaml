slug: "telemetry-session-log-retirement"
intent: >-
  Telemetry slice 5, plan 1 of 2: close T3.20 c6. docs/SESSION_LOG.md has not been written since 2026-07-01, yet
  session preflight still reports its July entries as last_session and recent_sessions, so every /plan and /orient
  reads a stale "recent momentum". Rewire both fields to the production telemetry store through the existing telemetry
  reader verb sessions_window (a query-Lambda verb), with a status that tells an unreachable reader from an empty
  window, retire the log by deletion (Decisions 127 and 174), and remove every reader and writer that only served it.
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-telemetry-session-log-retirement.yaml
phase: >-
  T3.20 (in_progress; follow-on mode): closes c6 only. c9 (rec-4415) stays open and is planned after slice 5.
closes_criteria:
  - T3.20:c6
scope:
  - file: scripts/preflight/session_history.py
    action: Create
    purpose: >-
      read_session_history(reader=None, *, now=None, window_days=2, limit=5) -> dict, plus start_session_history(...) ->
      a handle whose result(deadline_s=SESSION_HISTORY_DEADLINE_S) joins it. One named read of
      sessions_window(day_from, day_to, as_of) through scripts.preflight._common._make_event_reader() (the routed
      telemetry reader preflight's telemetry_health gauge already uses; Decision 236 cl.2, Decision 84 I-3). day_to is
      today (UTC), day_from today minus window_days-1, as_of now (UTC ISO). start_session_history runs the read on a
      daemon thread and records its start time; result() joins it for whatever remains of SESSION_HISTORY_DEADLINE_S = 60
      counted from that start (measured cold first reads: 28.5 s and 34.6 s; warm 4-6 s), so a cold reader (rec-4474
      class) never holds preflight open past the deadline; a timeout, any exception, or a 504/503 answer returns status
      unavailable. The thread writes nothing to stderr, and a logging.Filter on the src.common.ducklake_reader_client
      logger keyed to the worker thread's ident drops only that thread's records (never logger.disabled, setLevel or
      logging.disable, which are process-global and would swallow the main thread's reader warnings), so a read that
      outlives the deadline cannot print during interpreter shutdown. Returns {"status": "ok"|"empty"|"unavailable", "window_days": int,
      "recent_sessions": list[str] | None, "last_session": str | None, "reason"?: str}: on ok the newest `limit` rows by
      session_started_at DESCENDING (the verb orders ascending, so selection is client-side, never via `limit`), each
      rendered as one line "<session_started_at UTC, minute precision> state=<state> outcome=<outcome or -> duration=<s or
      ->s last=<last_event_timestamp UTC, minute precision> session=<first 8 chars of session_id>" (last= shows recent
      activity on a session that still reads running), last_session = the first of them; on empty (the reader answered with no
      row) [] and "" ; on unavailable both None (Decision 215 cl.2: never [] or "" for an unknown). State and outcome
      are printed as the reader derived them, never re-derived (Decision 199); a session reads running for up to 24 h
      after its last turn (Decision 228), which is not an error. format_history(result) -> one stderr line in the
      telemetry gauge's shape: "Session history: <status> (<n> root session(s) in <window_days> UTC day(s))" or
      "Session history: unavailable (<reason>)". Never raises. No row value other than the five rendered fields and
      the short id is printed.
