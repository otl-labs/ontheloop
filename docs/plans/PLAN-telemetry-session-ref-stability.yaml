slug: telemetry-session-ref-stability
intent: >-
  Solves rec-5477. Envelope rule R10 (telemetry-event-envelope.yaml, parser_version description) guards a syntactic
  proxy, "a change to ANY session entity_ref grammar", where the property it protects is that a stored session is
  never re-keyed (a re-keyed session escapes R5a retirement, Decision 199 cl.3 identity). This plan restates R10 as that
  invariant, deletes the one-off first-grammar carve-out and LL-1's "declaring one later is an R10 change" (both become
  corollaries), and makes the rule mechanical: a new fast-tier test asserts that every session a golden case produced
  at the merge-base is still produced under the same ref and session id, that session refs stay disjoint across
  producers, and that registered host_run_ref prefixes are append-only. Serves NS.6 (session evidence cannot silently
  double count) and unblocks rec-5437 (non-GitHub persona hosts) with no exemption.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-telemetry-session-ref-stability.yaml
phase: >-
  T3.22 (producer onboarding; rec-5477); closes no criterion. Contract words and test code only: no producer code,
  row, writer, Lambda or workflow changes, so nothing deploys (V2).
closes_criteria: []
cites: [dec:167, dec:199, dec:246, dec:275]
scope:
  - file: tests/telemetry/test_session_ref_stability.py
    action: Create
    purpose: >-
      The R10 check, three legs, each with a synthetic red case beside its live case. Corpora: claude_code
      tests/fixtures/turn_capture/golden/ (case_names, load_case in tests/fixtures/turn_capture_corpus.py) and litellm
      tests/fixtures/turn_capture/golden/litellm/ (litellm_case_names, load_litellm_case in
      tests/fixtures/turn_capture_litellm_cases.py); every producer in config/telemetry/parser_versions.yaml must map
      to a corpus and a form here, else the test fails (a new producer declares both).
      (a) test_golden_sessions_keep_their_refs: for each producer and each golden case present at the merge-base with
      origin/main (git show <base>:<path>), the set of (session_ref, session_id) and (parent_session_ref,
      parent_session_id) pairs over the case's committed expected_rows at the base is a subset of the set at HEAD, so
      no session a stored input produced disappears or changes id. A new case, or a new session in an old case,
      passes. No override marker: a real R10 change edits this test in its own Decision-gated PR (Decision 235). Base
      unreadable: pytest.fail when CI is set, skip locally (the registry test's _base_registry rule, Decision 208 cl.1).
      (b) test_session_refs_are_disjoint_across_producers: claude_code session refs match a UUID root with an optional
      ':<agent id>' sub-agent suffix; litellm session refs are 'litellm:' plus a full match of the alternatives in
      telemetry_agents.yaml fields.host_run_ref.dq_intent.pattern (read from the contract, never copied); each golden
      ref matches its own producer's form and no other's.
      (c) test_host_run_ref_prefixes_are_append_only: each alternative of that pattern at the merge-base is present
      verbatim at HEAD (split on the top-level '|' inside the outer group).
      Reads files and runs git only; no network, no producer call; well under 2 s.
  - file: tests/telemetry/test_litellm_producer_envelope_notes.py
    action: Modify
    purpose: >-
      Pins on the removed words move to the new words. In test_envelope_declares_litellm_line_before_dq_intents the
      token "outside R10" becomes "The root composes the host_run_ref registry (R10)". test_r10_says_a_first_grammar_is_not_a_change
      becomes test_r10_is_stated_on_stored_session_refs: it asserts "of any input that has stored rows",
      "bumps EVERY producer and requires a Decision (R10)", "a registered host_run_ref prefix never changes" and
      "tests/telemetry/test_session_ref_stability.py" in the flattened description, asserts "A new producer's first
      session entity_ref grammar is not such a change" is absent, and keeps the PLAN-litellm-producer-envelope
      field-level entry assertion. A new test_ll1_names_no_r10_change asserts "declaring one later is an R10 change"
      is absent from the LITELLM line. Every other assertion is unchanged.
  - file: docs/contracts/telemetry-event-envelope.yaml
    action: Modify
    purpose: >-
      Sidecar blocks env-r10, env-ll1, env-log, env-compact-0925a and env-compact-0925b only (Decision 246): R10
      restated, LL-1's two R10 sentences replaced, one terse semantic_break true top-level row, and two semantic_break
      false 2026-09-25 rows compacted to pay the bytes (Decision 275 cl.3-4). Byte seed 53867; after the blocks 53860
      on main ba54da0d.
  - file: docs/contracts/telemetry_agents.yaml
    action: Modify
    purpose: >-
      Sidecar blocks agt-prefix and agt-log only: host_run_ref semantics adds "a registered prefix never changes
      (envelope R10)", and one terse top-level row. 48534 -> 48794 of 49152 on ba54da0d.
