slug: telemetry-session-ref-stability
intent: >-
  Solves rec-5477. Envelope rule R10 (telemetry-event-envelope.yaml, parser_version description) guards a syntactic
  proxy, "a change to ANY session entity_ref grammar", where the property it protects is that a stored session is
  never re-keyed (a re-keyed session escapes R5a retirement, Decision 199 cl.3 identity). This plan restates R10 as that
  invariant, keeps the first-grammar carve-out only as a corollary of it, deletes LL-1's "declaring one later is an
  R10 change", and makes the rule mechanical: a new fast-tier test asserts that every session a golden case produced
  at the merge-base is still produced under the same ref and session id, that no two producers mint
  the same session root, and that registered host_run_ref prefixes are append-only. Serves NS.6 (session evidence cannot silently
  double count) and unblocks rec-5437 (non-GitHub persona hosts) with no exemption.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-telemetry-session-ref-stability.yaml
phase: >-
  T3.22 (producer onboarding; rec-5477), cited for context only: a rec-driven slice that closes no criterion. Contract words and test code only: no producer code,
  row, writer, Lambda or workflow changes, so nothing deploys (V2).
closes_criteria: []
cites: [dec:167, dec:199, dec:210, dec:235, dec:246, dec:275, dec:279]
scope:
  - file: tests/telemetry/test_session_ref_stability.py
    action: Create
    purpose: >-
      The R10 check, three legs, each with a synthetic red case beside its live case. Corpora: claude_code
      tests/fixtures/turn_capture/golden/ (case_names, load_case in tests/fixtures/turn_capture_corpus.py) and litellm
      tests/fixtures/turn_capture/golden/litellm/ (litellm_case_names, load_litellm_case in
      tests/fixtures/turn_capture_litellm_cases.py); every producer in config/telemetry/parser_versions.yaml must map
      to a corpus and a role here, else the test fails (a new producer declares both). The maps pre-declare
      ci_annotate (annotates claude_code; corpus tests/fixtures/merge_annotate/golden/index.json, quoted as a literal,
      PLAN-merge-annotate-producer, rec-5270): a mapped producer not yet in parser_versions.yaml contributes nothing
      (a loop continue, never pytest.skip), an absent corpus index at the base contributes no base pairs, and an absent
      id column reads as None when pairs are built, so neither build order breaks. Each map path must equal that
      producer's golden_index in parser_versions.yaml, and a registered producer whose HEAD index is absent fails.
      Session pairs: read per table from src/telemetry/identity.py KEY_PLANS, never hard-coded: each (ref, id) pair
      whose KeyPlan domain_tag is telemetry_sessions:session_id, i.e. (entity_ref, session_id) and (parent_session_ref,
      parent_session_id) on telemetry_sessions, and (session_ref, session_id) on the other tables; a None ref is skipped.
      (a) test_golden_sessions_keep_their_refs: for each producer and each golden case present at the merge-base with
      origin/main (git show <base>:<path>), the set of session pairs over the case's committed expected_rows at the
      base is a subset of the set at HEAD, so no session a stored input produced disappears or changes id. A new case,
      or a new session in an old case, passes. A base case renamed or deleted at HEAD fails by design: retiring a
      golden input is itself a change to stored evidence and edits this test under the weakening gate. No override marker: a real R10 change edits this test in its own Decision-gated PR (Decision 235). Base
      unreadable: pytest.fail when CI is set, else pytest.skip("env: origin/main unreadable locally") -- the env: label
      validate_test_skip_citations requires (Decision 181 CONTENT surface). Legs (a) and (c) share this base-read
      rule.
      (b) test_root_refs_are_disjoint_across_minters: a producer-role map names each producer either a minter
      with its root form or an annotator of a named minter (Decision 199 cl.3: a producer that annotates another
      producer's session, such as ci_annotate, writes under that session's ref). Minter forms: claude_code a UUID root
      with an optional ':<agent id>' sub-agent suffix; litellm 'litellm:' plus a full match of the alternatives in
      telemetry_agents.yaml fields.host_run_ref.dq_intent.pattern (read from the contract, never copied). Over the
      session-pair refs, each minter's golden refs match its own form and no other minter's; an annotator's refs match
      its named minter's form; no two minter forms both match any golden ref. A producer in parser_versions.yaml
      absent from the map fails the leg (a new producer declares its role).
      (c) test_host_run_ref_prefixes_are_append_only: each alternative of that pattern at the merge-base is present
      verbatim at HEAD (split on the top-level '|' inside the outer group), and each HEAD alternative's literal tag
      before its first ':' is a lowercase literal ([a-z]+) and unique, so a new alternative cannot overlap a registered
      prefix. Its failure message states the rule: a whole registered alternative never changes, character class
      included.
      The module quotes config/telemetry/parser_versions.yaml, docs/contracts/telemetry_agents.yaml (leg (c) compares a
      file with itself on main, so it acts only when --pre selects it on a PR) and the golden index.json paths as
      literal strings:
      an index edit selects it directly, and a case-file edit selects it through parser_versions.yaml, which the
      registry test's golden_digest forces to change with any expected_rows edit. Leg (a)'s failure message says
      "no stored session disappears or is re-keyed" so a fix that drops a spurious session sees the rule it trips. Its docstring
      names docs/contracts/telemetry_sessions.yaml's entity_ref grammar (governance_notes_local, the
      '<sessionId>:<agentId>' form) as the source leg (b)'s claude_code form restates, and rec-4419 (T3.22:c3) as the
      owner of moving that form to the writer. Leg (b)'s synthetic cases include two annotator cases: refs matching the
      named minter's form pass, refs matching no form fail. Reads files and runs git only; no network, no producer call; well under 2 s.
