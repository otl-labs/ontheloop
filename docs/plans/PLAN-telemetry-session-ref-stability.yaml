    command: bin/venv-python -m pytest tests/telemetry/test_session_ref_stability.py::test_golden_sessions_keep_their_refs tests/telemetry/test_session_ref_stability.py::test_root_refs_are_disjoint_across_minters tests/telemetry/test_session_ref_stability.py::test_host_run_ref_prefixes_are_append_only -q && ! grep -q 'declaring one later is an R10 change' docs/contracts/telemetry-event-envelope.yaml && AWS_PROFILE=agent_platform bin/venv-python -c "from src.common.ducklake_reader_client import fetch_recs_by_ids, make_reader; r,_=fetch_recs_by_ids(make_reader(),['rec-5477']); print(r[0]['status']); assert r[0]['status']=='closed'"
    expected: >-
      Run only after ci.yml's trailer-closure job has finished on the merge SHA (name its run id; it waits behind
      main-validate, about 16-20 minutes; event-driven, never polled). Exit 0, then prints closed.
    fix_if: >-
      Open: run bin/venv-python -m scripts.session.merge_step readback; a missing trailer goes to merge_step recover
