    phase: pre-deploy
    action: The R10 check's three legs and their red cases.
    command: bin/venv-python -m pytest tests/telemetry/test_session_ref_stability.py -q
    expected: 'Exit 0, every node passes. Red before: the file is absent (pytest exits 4).'
    fix_if: 'A live leg fails on main: a golden session moved or a prefix changed; STOP to this planning thread, never edit a golden case to pass.'
    hermetic: true
    graduation: waive
    graduation_waiver_reason: The module is itself the standing check and runs in every tier that selects tests/telemetry, so a graduated shard would duplicate it.
  - step: 2
    phase: pre-deploy
    action: The approved words are placed word for word, and the pinned contract tests and size limits hold.
    command: bin/venv-python -m scripts.roadmap.approved_text verify --slug telemetry-session-ref-stability && bin/venv-python -m pytest tests/telemetry/test_litellm_producer_envelope_notes.py tests/telemetry/test_litellm_producer_contract_notes.py tests/telemetry/test_contract_amendments.py tests/telemetry/test_parser_version_registry.py -q
    expected: Prints the approved-text OK line, then exit 0 from pytest.
    fix_if: 'A before-block not found on main (main moved under it): STOP to this planning thread for a sidecar amendment, never re-word in the build.'
    hermetic: false
    graduation: waive
    graduation_waiver_reason: approved_text verify is the merge-step check and the pytest files are standing tests in every tier that reads the envelope.
  - step: 3
    phase: pre-deploy
    action: Pre-handoff full tier on the committed, rebased tree (Decision 163), read through its evidence file.
    command: bin/venv-python -m scripts.validate; bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: Start the full tier backgrounded with a 2 h limit from the top-level session (AGENTS.md), then read the verdict with --verify-head, never a pipe's exit status. It reports the full tier passed on HEAD's tree, including validate_contract_drift and the structural size budgets.
    fix_if: Any failure; fix and re-run both from the start (timeout_disposition blocked).
    hermetic: false
    graduation: not-applicable
  - step: 4
    phase: post-deploy
    action: rec-5477's acceptance holds on main after the merge, and the rec is closed.
    command: bin/venv-python -m pytest tests/telemetry/test_session_ref_stability.py -q && ! grep -q 'declaring one later is an R10 change' docs/contracts/telemetry-event-envelope.yaml && AWS_PROFILE=agent_platform bin/venv-python -c "from src.common.ducklake_reader_client import fetch_recs_by_ids, make_reader; r,_=fetch_recs_by_ids(make_reader(),['rec-5477']); print(r[0]['status']); assert r[0]['status']=='closed'"
    expected: Exit 0, then prints closed.
    fix_if: An open rec means the Resolves trailer was missing; close it through the portal with the merge SHA as evidence.
    hermetic: false
    graduation: not-applicable
