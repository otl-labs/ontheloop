  - file: docs/plans/approved/telemetry-session-ref-stability.yaml
    action: Create
    purpose: >-
      Plan PR only, never the build: the approved-text sidecar (Decision 246), ten blocks (nine contract, one test).
      It is notice class on the approval-routing map (Decision 279), and its approval run is what binds the narrowed
