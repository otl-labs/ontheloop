pre_implementation_checklist:
  - Branch confirmed not on main
  - docs/PROJECT_CONTEXT.md read
  - Only the plan-cited decision sections read (167, 199, 210, 235, 246, 275, 279)
  - All files in scope located and readable
  - Acceptance criteria understood and verifiable
execution_steps:
  - Run bin/venv-python -m scripts.ci_rca.red_overlap --plan docs/plans/PLAN-telemetry-session-ref-stability.yaml; on blocked, stop and report.
  - >-
    Create tests/telemetry/test_session_ref_stability.py per its scope row: three legs, a synthetic red case per leg,
    the producer-to-corpus and producer-to-form maps, the base read with the CI fail-closed rule.
  - Place the sidecar's ten blocks verbatim (approved_text verify passes).
  - Record weakening dispositions per the constraint.
  - Commit, then execute the Verification Plan (VP 1-2) on the committed tree (VP 2's drift gate reads merge_base..HEAD only, rec-5480); loop until pass; on an unrecoverable failure stop and report (Decision 55).
  - Code review via a fresh code-review subagent; fix blocking findings and rerun VP 1-2.
  - >-
    CLOSURE (implement skill Commit Flows; docs/contracts/git-ops.yaml): set implementation_declared true; commit; rebase
    on origin/main; re-run red_overlap; run VP 3 on the committed clean HEAD; push; open the build PR; subscribe; run
    merge_step premerge; squash-merge on code review PROCEED and green CI with "Resolves: rec-5477" in the commit body;
    run merge_step readback; then VP 4.
  - >-
    Report, as separate facts: what was implemented; readiness state; the full-tier exit plus validation_result
    --verify-head for the pushed HEAD; structured postflight evidence (bin/venv-python -m scripts.session.postflight
    --evidence); the push, PR number, CI result and read-back merge SHA; VP 4's read-back.
rollback: >-
  Revert the build's squash commit to restore the contracts and tests. After a revert, file a successor rec via file_rec
  naming rec-5477 and the revert SHA (Decision 103: a resolved rec is never reactivated). A revert also demotes every
  file it reverts to gated whole (approval-routing.yaml demotions.rule, Decision 279 cl.7), so restoring them later
  needs an approval run; prefer a forward fix.
