schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: telemetry-stop-turn-close
intent: >-
  Every Claude Code turn's telemetry rows land at that turn's own Stop (claude_code parser_version 4 -> 5), so a cloud
  session that is never resumed keeps its last turn and a one-turn session lands at all (rec-4407: the SessionEnd pass
  cannot reach the writer because Claude Code stops its egress proxy first). Each turn closes on a witness the capture
  Stop shim leaves in the transcript, turn closes carry their outcome, and each turn's open row lands once its prompt is
  on disk, which gives PLAN-telemetry-read-side-session-end the evidence to tell a session at rest from one that died
  mid-turn. Telemetry is the learning signal of the recursive self-improvement loop (PROJECT_CONTEXT); lost last turns
  and unreadable session ends would teach it the wrong lessons.
plan_type: IMPLEMENTATION
implementation_declared: true
verification_tier: V3
plan_path: docs/plans/PLAN-telemetry-stop-turn-close.yaml
phase: >-
  ad_hoc_rec (the producer half of rec-4407's direction, chosen by Benjamin on 2026-10-17); related tier item T3.20
  (agent-turn telemetry capture). Closes no exit criterion and affects none (c9, CI agent capture, is rec-4415's: in
  GitHub Actions the prompt hook spawns a runner that exits off; c3 is slice 4's orphan monitor; c6 and c7 are outside
  capture correctness). Precondition: PLAN-telemetry-capture-producer-fixes's build merged (parser_version 4; the same
  modules). V3 because the build proves the new rows against the live smoke-catalog writer (c8 smoke); nothing here is
  Lambda-packaged and nothing deploys. PLAN-telemetry-read-side-session-end builds after this one and closes rec-4407.
scope:
- file: src/turn_capture/witness.py
  action: Create
  purpose: >-
    Pure (stdlib plus src.turn_capture: transcript.hook_script, as test_package_boundary allows). It never imports
    streams at module level (streams.py imports it): the streams types it annotates come in under TYPE_CHECKING only,
    and is_api_error with API_ERROR_FLAG_KEYS moves here from streams.py, which re-exports both so sessions.py and
    transcripts.py import them unchanged. WITNESS_LINE = "[stop_log_turn] turn witness"; is_witness_record(data) (the raw-record predicate waits.py shares)
    and is_witness(rec) (rule WT-2);
    at_rest(turn, line) (WT-3's usable test); closing_events(turn) (usable witnesses and API-error records, in file
    order, WT-3/WT-4); frontier(turn) (WT-7); close_window(turn, event) (the turn's records before the event, WT-3);
    the close-row content helpers observations.py calls (counts and outcome over a window, WT-6). Keeps streams.py and
    observations.py inside their budgets (Decision 128).
- file: src/turn_capture/streams.py
  action: Modify
  purpose: >-
    Turn gains closes (its usable closing events) and frontier. parse_tree gains a keyword `frontier: bool = False`;
    WT-7 runs only when it is true, and record_turn's emitter passes frontier=True for every non-final parse, so direct
    parse_tree callers and their tests (test_streams.py, test_sessions.py) keep today's non-final parse unchanged.
    WT-7 applies to the ROOT stream only: when its last turn has no later boundary, the root's records after that turn's frontier are dropped and the
    root is walked again over the kept records, so every collection _walk builds (stream.hooks, stream.compacts,
    stream.resumes, turn.recs, turn.prompts, turn.companions, turn.last_assistant) and the later tool indexing and
    response grouping see only kept records (the re-walk counts each record's classification diagnostics once). closed
    is true when the turn has a later boundary, the pass closes the
    stream, or the turn holds a usable closing event. Sub-agent streams are unchanged. Witnesses keep kind "hook" (one
    process_event each, as every hook attachment). Stays under 500 SLOC.
- file: src/turn_capture/observations.py
  action: Modify
  purpose: >-
    Turn rows: every turn close is keyed on the record that ends its window, role_ref(<that record's uuid>, 0,
    "turn_close"): a usable witness (WT-3), an API-error record (WT-4), or, for the boundary close, the turn's last
    record carrying a uuid and a parseable timestamp before its boundary or eof (WT-5, the SC-1 and session-close anchor
    rule; it replaces v3's last-assistant key), so a key always fixes its content. The boundary close is emitted only
    when the turn holds an assistant record and no usable closing event lies at or after its last one; a turn holding
    no assistant record carries no close, as in v4. Outcome on every turn close (WT-6);
    a turn that is not closed emits its open row only (WT-8). metadata keys unchanged (response_count, tool_call_count,
    over the close's window).
- file: src/turn_capture/sessions.py
  action: Modify
  purpose: >-
    _open_bound becomes the first close bound of the stream's first closed assistant-bearing turn: its first usable
    closing event's line, else its last record line when a boundary closed it (WT-9), so the open row's content (and
    v4's PV-4 harness_session_key read at or before the bound) cannot move while that turn continues.
- file: src/turn_capture/record_turn.py
  action: Modify
  purpose: >-
    PARSER_VERSION 5, PRODUCER_VERSION "turn-capture-5". Counters (rule DG-5): reanchored_close:<type> counts entities
    whose distinct close rows across the cursor's prior set and the pass's emitted union (prior plus current) outnumber
    their close rows in the pass's own end-of-tree parse (closes left behind by a recorded cut, a child-file append
    after completion evidence or a superseded API-error-frontier synthetic tool close: R7's declared exceptions, all
    counted; every witness close is in the end-of-tree parse, so none counts); multi_close_turns counts turns with more than
    one close row in the end-of-tree parse (witness closes, an API-error self-close, a boundary close after a continued
    turn). The parser's witness counters reach the pass diagnostics.
- file: .claude/hooks/stop_log_turn.py
  action: Modify
  purpose: >-
    Rule WT-1: main() writes WITNESS_LINE (a literal in the shim, equal to witness.WITNESS_LINE) to stderr as its FIRST
    action, before reading stdin or checking the switch, on every path, exit 0, nothing on stdout (the module loads only
    the stdlib, as today). Then for Stop and StopFailure (stop_hook_active true included), when capture_allowed holds,
    it detaches `run` with --lock-wait LOCK_WAIT_S; for UserPromptSubmit it detaches `run` with --prompt-id (the
    payload's prompt_id when it matches ^[A-Za-z0-9-]{1,64}$, else nothing is detached) and --lock-wait WITHOUT reading
    the switch (the runner's own capture_mode check decides, before any state is touched), so the prompt waits only for
    the interpreter's start, never for v4's git reads. The docstring's "prints nothing" becomes "prints the witness line
    only".
- file: .claude/settings.json
  action: Modify
  purpose: >-
    Registers the same shim command for UserPromptSubmit (a new hooks key appended after the existing ones), no matcher,
    no timeout, not async (rule HK-1's shape).
- file: scripts/telemetry_capture/waits.py
  action: Create
  purpose: >-
    Rules RW-1..RW-4, stdlib plus src.turn_capture.witness (pure, src.turn_capture only): wait_for_witness(root_file, clock,
    sleep) reads the root once, then only appended newline-terminated lines, every 0.2 s, until the root holds a
    witness (witness.is_witness_record, the ONE raw-record predicate streams.py's witness test also uses) later than
    both its last prompt record and its last assistant record, bound WITNESS_WAIT_S 30 s, then a settle (root unchanged
    for 1 s, bound 5 s); wait_for_prompt(root_file, prompt_id, clock, sleep) waits the same way for a root prompt record
    carrying prompt_id, bound PROMPT_WAIT_S 10 s. Each returns a fixed token (witness_seen, witness_wait_timeout,
    settle_timeout, prompt_seen, prompt_wait_timeout). No offset is needed: a witness already present (the smoke's
    synthetic trees, a pass that starts late) satisfies the wait at once, and an earlier Stop's witness never does,
    because a later prompt or assistant record follows it. Never parses content beyond type, attachment, message
    stop_reason presence and promptId keys.
- file: scripts/telemetry_capture/runner.py
  action: Modify
  purpose: >-
    run_pass gains an OPT-IN keyword `wait: Callable[[], str] | None = None`, run after the capture_mode and smoke_ref
    checks (a switch-off prompt pass exits off without polling) and before the lock, inside the same budget; its token
    and lock_waited (the lock was acquired after waiting) are counted in the pass's diag (the diagnostics line's diag
    map); a lock timeout stays outcome busy with no diagnostics line, as today. A
    wait timeout still runs the pass. Every existing caller that passes no wait (the SessionEnd hook, the operator
    `pass` command, tests/telemetry_capture/test_runner.py's helper) behaves exactly as today. No other behaviour
    changes.
- file: scripts/telemetry_capture/__main__.py
  action: Modify
  purpose: >-
    _cmd_run builds the wait from --event (RW-1: Stop -> wait_for_witness; UserPromptSubmit -> wait_for_prompt with
    --prompt-id; StopFailure, SessionEnd and anything else -> None) and passes it to run_pass; run gains --prompt-id
    (optional); main(argv, ...) gains keyword-only clock and sleep (defaults time.monotonic, time.sleep) handed to the
    wait, so an in-process caller can bound it; budget = wait bounds + lock wait + STOP_BUDGET_S. Silent, exit 0, as
    today.
- file: scripts/telemetry_capture/smoke.py
  action: Modify
  purpose: >-
    The c8 synthetic tree gains a witness attachment closing a turn with a tool call, an API-error turn and a trailing
    prompt with no witness, so the live read-back proves the writer accepts witness-keyed closes with outcome and an
    open row without its close. The tree is written in stages so every wait is satisfied at once, as on a real
    session: a Stop drive on the tree ending at its witness (witness_seen), a StopFailure drive after the API-error turn
    is appended (no wait), and a UserPromptSubmit drive after the trailing prompt is appended (prompt_seen); then the
    SessionEnd drive as today. The replay leg (cursor deleted, the finished tree re-driven) drives the UserPromptSubmit
    entry with the trailing prompt's id (prompt_seen at once), so no drive waits. Each drive's diagnostics line must
    carry its token (witness_seen for the Stop drive, prompt_seen for each UserPromptSubmit drive) and none may carry
    witness_wait_timeout, settle_timeout or prompt_wait_timeout, else SmokeFailure naming the token. Counts only, as
    today.
