constraints:
- >-
  Purity (envelope R7, Decision 207): every row is a function of the records at or before its own closing event or
  frontier, so any pass that emits it emits the same content; every close is keyed on the record that ends its window,
  so a close key is never shared by two windows. A row built
  differently by two passes is a defect here, never a test to relax.
- >-
  The witness is a tree fact: the shim prints it before the switch check, so trees captured with capture on or off
  re-derive alike. No git, environment, clock or hook-payload value enters src/turn_capture; the runner's waits decide
  only when a pass runs, never what it emits.
- >-
  Typed columns only (Benjamin, 2026-10-17): no new metadata key; outcome uses telemetry_observations' existing accepted
  values and stays optional at write (no required_when), so the writer is unchanged (Decision 210).
- >-
  Graduated checks (turn-capture-*, telemetry-parser-version-registry) keep resolving and are never weakened; the only
  assertion changes are the sanctioned ones in scope, each keeping or tightening its property.
- >-
  No file crosses 500 SLOC, tests included (Decision 128/130): new logic goes to witness.py and waits.py, new nodes to
  the new test modules named in scope; never a budget raise.
- >-
  Public repository (Decision 101): fixtures are synthetic; the integration, smoke and probe steps print counts only.
- No rescue agents or workaround loops (Decision 55); a failed live step stops for RCA.
