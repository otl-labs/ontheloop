execution_steps:
- >-
  1. Precondition: confirm PLAN-telemetry-capture-producer-fixes's build is on main (PARSER_VERSION 4 in
  src/turn_capture/record_turn.py); rebase onto main. If not, STOP and tell the coordinator. Then confirm the v4 names
  this plan relies on exist as merged: tests/turn_capture/test_segment_closes.py, tests/turn_capture/test_real_transcript_coverage.py,
  the DG-1 counter names, PV-4 reading sessions._open_bound (PV-2 reads pins before the first prompt), the 40-case
  golden index; on any divergence from the
  v4 plan's text, STOP and tell the coordinator before writing code. Note whether
  PLAN-telemetry-read-side-session-end's build has merged (it should not have; if it has, step 8's derived_golden values
  follow its state rule).
- >-
  2. WT-1, WT-2 (shim, witness.py). The shim's main() writes WITNESS_LINE plus a newline to stderr as its first action,
  before reading stdin or checking the switch. A witness is a ROOT-stream record of kind hook whose attachment.type is hook_success, hookEvent is Stop,
  hook_script(command)'s stem is stop_log_turn and whose stderr's first line equals WITNESS_LINE; it attaches to the
  current turn (a witness outside any turn is counted witness_outside_turn and ignored).
- >-
  3. WT-3..WT-6 (witness.py, observations.py). A witness is USABLE iff the turn holds an assistant record before it, the
  last such record is an API-error record or carries a string message.stop_reason, and every tool_use of the turn before
  the witness has its tool_result before the witness; otherwise counted witness_not_at_rest and ignored. A turn's
  closing events are its usable witnesses and its API-error assistant records, in file order. Each closing event e
  yields one turn close row: key role_ref(<e's uuid>, 0, "turn_close") for a witness or an API-error record;
  event_timestamp and source_ordinal from e's record; metadata response_count (responses with at least one record
  before e) and tool_call_count (tool_uses before e) over the turn's records before e (an API-error record's window
  includes it); outcome per C-3's tests over the same window: interrupted when C-3 reads interrupted, error when
  the window's last assistant record is an API-error record, else success. The boundary close (a later boundary, or
  a final pass's eof) is keyed role_ref(<anchor uuid>, 0, "turn_close") on the turn's last record carrying a uuid and a
  parseable timestamp before the boundary or eof (it replaces v3's last-assistant key, whose window C-3's outcome would
  read past: the round-2 probe found 18 case cuts where the same key would carry interrupted at a cut and success in
  full), takes event_timestamp and source_ordinal from that anchor, keeps whole-turn counts, gains outcome by the same
  tests over the whole turn, and is emitted only when the turn holds an assistant record and no closing event lies at
  or after its last one (a turn holding no assistant record carries no close, as in v4). A final-pass close whose turn later grows is superseded under a later anchor (the declared reanchored_close). A blocked-and-continued turn
  therefore carries one close per usable Stop, the latest being its current disposition (the observations outcome
  note). Rule DG-5 (record_turn.py): reanchored_close:<type> counts entities whose distinct close rows across the
  cursor's prior set and the pass's emitted union outnumber their close rows in the pass's own end-of-tree parse (so a
  cut-only close, a child-file append after completion evidence and a superseded API-error-frontier synthetic tool
  close all count); multi_close_turns counts turns with more than
  one close row in that parse. So a witness close plus a later boundary close (stop_blocked_then_interrupted, or a
  resume-schedule cut between two witnesses) is multi_close_turns, never reanchored_close, and the resume leg's
  reanchored_close:turn == 0 assertion (tests/fixtures/turn_capture_v3_cases.py check_schedule) keeps holding.
- >-
  4. WT-7, WT-8 (streams.py, witness.py). ROOT stream only, in a non-final parse that record_turn requests with
  parse_tree(..., frontier=True) (direct callers keep frontier=False and today's parse): after _walk, when the root's last turn
  has no later boundary, its frontier is the line of its last closing event, else the line of its first prompt record;
  the root's records after the frontier are dropped (counted frontier_withheld) and the root is walked again over the
  kept records, so stream.hooks, stream.compacts, stream.resumes, turn.recs, turn.prompts, turn.companions and
  turn.last_assistant hold only kept records before _index_tools and _group_responses run (a hook keyed on a tool_use
  past the frontier is then never emitted early with a different parent). Such a turn is closed iff it has a closing
  event. A turn that is not closed emits its turn open row only (built from its first prompt
  record; D-1 still holds the whole stream until its first closed assistant-bearing turn). Sub-agent streams are
  unchanged: they emit on completion evidence, which lies in the root at or before its frontier. A final pass drops
  nothing (unchanged).
- >-
  5. WT-9 (sessions.py). _open_bound = the line of the first closing event of the stream's first closed turn holding an
  assistant record, else that turn's last record line when a boundary or a final pass closed it. Every value the open
  row reads with "at or before the bound" (branch, model_primary, v4's PV-4) reads up to it.
- >-
  6. RW-1..RW-4 (waits.py, runner.py, __main__.py, the shim, settings.json). The shim detaches every Stop and StopFailure
  when capture_allowed holds, with --lock-wait 120, and every UserPromptSubmit with a valid prompt_id without reading the
  switch, with --prompt-id and --lock-wait 120. _cmd_run builds the wait (opt-in; run_pass's wait keyword): Stop: wait
  until the root holds a witness later than both its last prompt record and its last assistant record, poll 0.2 s,
  bound 30 s (witness_seen | witness_wait_timeout), then settle until the root is unchanged for 1 s, bound 5 s
  (settle_timeout). StopFailure: no wait. UserPromptSubmit: wait for a root prompt record carrying --prompt-id, bound
  10 s (prompt_seen | prompt_wait_timeout). The wait runs after run_pass's capture_mode and smoke_ref checks. Then the
  lock, waited up to --lock-wait (lock_waited counted when acquired after waiting; a timeout is outcome busy with no
  diagnostics line, as today), then the pass. A wait timeout still runs the pass. Callers that pass no wait (the
  SessionEnd hook, the operator CLI, in-process tests) are unchanged.
- >-
  7. Contracts: the four notes as their scope rows pin, each with an amendment_log entry dated the build day; ports.yaml
  SA-02. Structural size (Decision 166 contracts class: 500 effective lines, 2,000-character lines;
  telemetry_observations.yaml is at 493): new amendment_log entries take the one-line flow form and notes extend
  existing lines where they can; if a file still exceeds 500, compact its remaining block-form amendment_log entries
  to the one-line form (the git-ops.yaml precedent, #1535), then join older multi-line folded notes into one line each
  under 2,000 characters. The envelope's R7 qualification goes on new physical lines of its folded scalar (line 381 is
  already 1,653 characters), never extending a line past 2,000. Wording never changes; never a budget raise and never
  a split. Run step 9.
- >-
  8. Tests and fixtures: the scope rows' new nodes, modules and sanctioned changes; corpus helpers; the seven new golden
  cases. Run steps 1-4 until green BEFORE regenerating any expected_rows; then regenerate every case's expected_rows from
  record_turn, review the diff by kind (outcome on every turn close; the boundary close re-keyed to the turn's last
  uuid and timestamp record, block index 0, with that record's event_timestamp, source_ordinal and event_id, in the
  existing cases where it is not the last assistant record -- round 3's prototype found 18 of 40, e.g. tool_result_error
  a1 -> r1, hooks_resume_and_compact a2 -> cp3, multiblock a3#2 -> a3#0; close_failed_api_error's turn closed on its
  error record; witness closes and witness process_events in the new cases only) and confirm no other row changed; set the
  registry's v5 entry from the new golden_digest; re-author both derived_golden files by hand (parser_version moves on
  every row; expected moves at pass stop: corpus:resume_after_interrupt's last_event_timestamp moves from 7 to 10
  through WT-8's early turn open row for u3, its state (running) and duration (3) unchanged, the entry's why citing
  WT-8; corpus:subagent_background_with_completion's stop-pass entries lose agent:agent2, whose completion evidence lies
  after the last witness, so its stop tree in derived_golden_rollups.yaml is removed or given a non-empty expect,
  never an empty one, which the harness rejects with a TypeError;
  tests/ducklake_neon_smoke_test/test_lambda_telemetry_golden_gates.py reads the same files and is green once they
  are); run steps 5 and 6.
- >-
  9. Execute the Verification Plan steps 7-12; loop until each passes; on an unrecoverable V3 failure stop and RCA
  (Decision 55).
- >-
  10. Send the coordinator: this build session's root session ref and harness_session_key (its v5 rows are untrusted),
  the VP 8 counts, the note for slice 4 in the context, and the request to start, once the merge lands, a fresh session
  on the merged main to run step 13 in its second turn.
- >-
  11. Closure (implement skill Commit Flows; docs/contracts/git-ops.yaml), each outcome reported separately: the
  readiness check (scripts.session.github_readiness); the coverage diagnostic; set implementation_declared true; rebase
  on origin/main; step 11 (the full tier) on the committed, clean tree, then --verify-head; the postflight evidence file
  and scripts.session.postflight --evidence; push; PR (body: the rules, VP 7/8/12 logs and counts, this session's own
  root session ref and harness_session_key, the contract notes for Benjamin's word); CI green on the head. Merge only
  after code review PROCEED, CI green and Benjamin's own word on the contract notes (fetch his message before merging).
  Squash-merge; no Resolves trailer (rec-4407 closes with PLAN-telemetry-read-side-session-end).
- '12. Step 13 runs in the session the coordinator starts on the merged main and step 14 on the first golden replay after the merge; post both as one counts-only comment on the merged PR.'
- 'Report: what was implemented, verification results (counts), and what PLAN-telemetry-read-side-session-end now builds on.'
