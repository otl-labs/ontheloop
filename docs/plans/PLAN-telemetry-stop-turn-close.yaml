infrastructure_dependencies:
- >-
  Precondition: PLAN-telemetry-capture-producer-fixes's build merged (parser_version 4); this build rebases on it and
  bumps to 5. If it has not merged, stop and tell the coordinator.
- >-
  No Terraform, IAM, Lambda or workflow change; src/turn_capture is excluded from the data-pipeline bundle (registry
  check turn-capture-excluded-from-data-pipeline), so the merge deploys nothing. Outcome on turn closes uses existing
  accepted values and stays optional at write, so the live writer's rules are unchanged (Decision 210).
- >-
  Sessions pick the code up at their next rebase or new session (hooks load from the checkout). Claude Code snapshots
  hook registrations at session start, so a rebased running session prints witnesses at its next Stop but runs no
  prompt pass until a new session starts. The build session's own
  Stop passes run the working-tree producer while it changes; those rows are untrusted, so the build records its root
  session ref and harness_session_key in the PR body and the coordinator handoff for slice 4 to exclude (the v4 build's
  rule).
acceptance_criteria:
- >-
  A turn's rows land at its own Stop: a non-final pass over a tree whose last turn ends in a usable witness emits every
  row of that turn and, for a one-turn tree, the session open row, with no finalization cut (VP 2).
- >-
  A blocked-and-continued turn carries one close per Stop, each keyed on its witness with content from its own window, in
  either hook order; an API-error record closes its own turn with outcome error; a turn with no usable witness after its
  last assistant record closes at its boundary as today (VP 2).
- >-
  An open turn contributes only records up to its frontier, its open row lands once its prompt is on disk, the session
  open row's bound is the first close, and a pass at every witness emits each row once (VP 3, VP 6).
- >-
  The shim prints the witness line first on every path and detaches a pass at every Stop, StopFailure and prompt; the
  Stop pass waits for its own witness, the prompt pass for its prompt, and both wait for the lock (VP 1, VP 4).
- >-
  The golden corpus is regenerated at parser_version 5 with the registry bumped, the graduated turn-capture checks still
  pass, and real transcripts close at their witnesses (VP 5, VP 6, VP 8).
- The amended contracts carry the new rules and the c8 smoke lands witness and error closes on the live smoke writer (VP 9, VP 12).
- >-
  A session started on the merged main lands its first turn at that turn's Stop, and the first golden replay after the
  merge passes on the deployed reader and writer (VP 13, VP 14).
verification_plan:
- step: 1
  phase: pre-deploy
  action: The witness is recognised only in its exact shape, and the shim prints it first on every path and detaches every Stop.
  command: >-
    bin/venv-python -m pytest tests/turn_capture/test_witness.py::test_witness_matches_only_the_capture_shim_line_at_stop
    tests/turn_capture/test_witness.py::test_witness_is_usable_only_when_the_turn_is_at_rest
    tests/turn_capture/test_witness.py::test_closing_events_frontier_and_windows
    tests/turn_capture/test_witness.py::test_close_outcome_branches
    tests/hooks/test_stop_log_turn.py::test_witness_line_is_printed_first_on_every_path
    tests/hooks/test_stop_log_turn.py::test_every_stop_and_prompt_detaches_a_pass_with_its_prompt_id
    tests/hooks/test_stop_log_turn.py::test_prompt_path_detaches_without_reading_the_switch
    tests/hooks/test_stop_log_turn.py::test_the_witness_line_equals_the_parser_constant -q
  expected: Exit 0, every node passes. Red before because witness.py, its test and the shim nodes are absent.
  fix_if: A SubagentStop or non-shim attachment reads as a witness, a pending tool reads at rest, or the shim prints after an import.
  hermetic: true
  graduation: graduate
  graduation_check_id: turn-capture-stop-witness
- step: 2
  phase: pre-deploy
  action: >-
    Turns close at their own Stop: one close per usable witness keyed on the witness, content from its window, API-error
    self-close, boundary close only when no usable witness follows; the last turn lands without a final pass.
  command: >-
    bin/venv-python -m pytest tests/turn_capture/test_witness_closes.py::test_last_turn_lands_at_its_own_stop
    tests/turn_capture/test_witness_closes.py::test_blocked_stop_gives_one_close_per_stop_in_either_hook_order
    tests/turn_capture/test_witness_closes.py::test_witness_close_reads_only_records_before_it
    tests/turn_capture/test_witness_closes.py::test_terminal_tool_stop_closes_at_its_witness
    tests/turn_capture/test_witness_closes.py::test_api_error_record_closes_its_turn
    tests/turn_capture/test_witness_closes.py::test_boundary_close_only_without_a_later_usable_witness
    tests/turn_capture/test_witness_closes.py::test_boundary_close_is_keyed_on_the_turns_last_record
    tests/turn_capture/test_witness_closes.py::test_superseded_closes_are_counted_reanchored
    tests/turn_capture/test_witness_closes.py::test_unusable_witness_waits_for_the_boundary_and_is_counted -q
  expected: Exit 0, every node passes. Red before because test_witness_closes.py is absent.
  fix_if: >-
    Two passes build different content under one close key (a window reading past its witness), a turn ending at rest
    also gets a boundary close, or the last turn emits nothing without a final pass.
  hermetic: true
  graduation: graduate
  graduation_check_id: turn-capture-witness-closes
- step: 3
  phase: pre-deploy
  action: >-
    The frontier, the early open row and the first-close open bound keep every row a prefix-stable function of the tree.
  command: >-
    bin/venv-python -m pytest tests/turn_capture/test_witness_closes.py::test_turn_open_row_lands_with_its_prompt
    tests/turn_capture/test_witness_closes.py::test_session_open_bound_is_the_first_close
    tests/turn_capture/test_witness_closes.py::test_every_witness_schedule_emits_each_row_once
    tests/turn_capture/test_witness_closes.py::test_continuation_hook_rows_wait_for_their_tool
    tests/telemetry_capture/test_smoke.py::test_synthetic_tree_closes_turns_at_witness_and_error_and_opens_the_last
    tests/telemetry_capture/test_smoke.py::test_smoke_fails_when_a_drive_reports_a_wait_timeout -q
  expected: Exit 0, every node passes. Red before because test_witness_closes.py and the smoke node are absent.
  fix_if: >-
    A row is emitted twice or differs between passes (a frontier reading a record after the open turn's last usable
    witness), or the open row's provenance moves after its first close.
  hermetic: true
  graduation: graduate
  graduation_check_id: turn-capture-witness-frontier
- step: 4
  phase: pre-deploy
  action: The runner waits for its own witness or prompt, never waits at StopFailure, and waits for the lock instead of exiting busy.
  command: >-
    bin/venv-python -m pytest tests/telemetry_capture/test_runner_waits.py::test_stop_pass_waits_for_its_own_witness
    tests/telemetry_capture/test_runner_waits.py::test_wait_timeout_still_runs_the_pass_and_is_counted
    tests/telemetry_capture/test_runner_waits.py::test_stop_failure_pass_does_not_wait
    tests/telemetry_capture/test_runner_waits.py::test_prompt_pass_waits_for_its_prompt_record
    tests/telemetry_capture/test_runner_waits.py::test_stop_and_prompt_passes_wait_for_the_lock
    tests/telemetry_capture/test_runner_waits.py::test_a_pass_without_a_wait_is_unchanged
    tests/telemetry_capture/test_runner_waits.py::test_switch_off_pass_returns_off_before_waiting
    tests/telemetry_capture/test_main.py::test_run_builds_the_event_wait_and_passes_the_lock_wait -q
  expected: Exit 0, every node passes. Red before because waits.py, its test and the node are absent.
  fix_if: >-
    A pass exits busy while a lock wait remains, a timeout skips the pass, a StopFailure pass waits, a switch-off pass
    polls, or a caller that passes no wait now waits.
  hermetic: true
  graduation: graduate
  graduation_check_id: capture-runner-waits-for-its-witness
- step: 5
  phase: pre-deploy
  action: >-
    The golden corpus at v5 and the registry: every case matches, the bump is recorded, the hook registration includes
    UserPromptSubmit, and the resume schedules and incremental-equals-full properties hold over every case.
  command: >-
    bin/venv-python -m pytest tests/turn_capture/test_record_turn.py::test_golden_cases_match_expected_rows
    tests/turn_capture/test_record_turn.py::test_finalize_resume_schedules_emit_each_row_once
    tests/turn_capture/test_record_turn.py::test_incremental_equals_full_at_every_line_cut
    tests/turn_capture/test_record_turn.py::test_finalize_equals_virtual_prompt_at_eof
    tests/turn_capture/test_record_turn.py::test_new_cases_are_built_from_their_builders
    tests/turn_capture/test_record_turn.py::test_rows_use_only_caller_known_columns
    tests/hooks/test_capture_hook_registration.py tests/telemetry/test_parser_version_registry.py -q
  expected: Exit 0, every node passes.
  fix_if: >-
    Regenerate expected_rows from record_turn only after steps 1-4 pass; a schedule failure is a purity defect in a WT
    rule (most likely a close window or the frontier reading a later record), never a test to relax.
  hermetic: true
  graduation: waive
  graduation_waiver_reason: >-
    Its nodes are already graduated standing checks (turn-capture-golden-corpus, turn-capture-r7-incremental-equals-full,
    turn-capture-finalize-resume-emits-each-row-once, telemetry-parser-version-registry) or existing fast-tier
    registration nodes; their red state comes from the regenerated corpus and the sanctioned changes, not a new behaviour.
- step: 6
  phase: pre-deploy
  action: The golden harness at v5 -- the re-authored derived_golden files reconcile, the oracle agrees with the verbs.
  command: >-
    bin/venv-python -m pytest tests/telemetry_verify tests/telemetry/test_derived_layer_reconciliation.py -m "not
    integration" -q
  expected: >-
    Exit 0, every node passes, the golden harness's header check, golden reconcile, oracle agreement and mutation nodes
    included.
  fix_if: >-
    Re-derive a failing authored value by hand from the formula, never by copying verb or oracle output. Any golden
    harness file other than the two derived_golden files needing a change means stop and escalate to the coordinator.
  hermetic: false
  graduation: waive
  graduation_waiver_reason: >-
    Its nodes are the golden harness's graduated rows, which the full tier runs; a whole-module run measured above
    validate_vp_replay's 120 s aggregate (the v4 plan's VP 15 precedent, rec-4421).
- step: 7
  phase: pre-deploy
  action: Every golden case loads into a local DuckLake and every FK resolves.
  command: >-
    bin/venv-python -m pytest tests/turn_capture/test_capture_ducklake_integration.py
    tests/telemetry/test_derived_layer_reconciliation.py::test_golden_fixtures_reconcile_on_local_ducklake -m integration -q -rs 2>&1 | tee
    "${TMPDIR:-/tmp}/capture_ducklake.log" && ! grep -Eq "[0-9]+ (skipped|failed|error)" "${TMPDIR:-/tmp}/capture_ducklake.log"
    && grep -Eq "[0-9]+ passed" "${TMPDIR:-/tmp}/capture_ducklake.log"
  expected: Exit 0 with every node passing and none skipped; the log goes in the PR description.
  fix_if: A witness close fails the kernel's type or rule check; fix the producer value, never the rule.
  hermetic: false
  graduation: waive
  graduation_waiver_reason: Needs the pinned ducklake extension download (network), which no CI tier provides until rec-4071.
- step: 8
  phase: pre-deploy
  action: >-
    On this machine's real transcript trees (the build session's own tree carries witnesses once the working-tree shim
    runs), a pass at every usable witness emits each row once and terminal-tool Stops close at their witness.
  command: >-
    bin/venv-python -m pytest tests/turn_capture/test_real_transcript_conformance.py
    tests/turn_capture/test_real_transcript_coverage.py tests/turn_capture/test_real_transcript_schedules.py -m
    integration -q -s
  expected: >-
    Exit 0; the output prints, per schedule kind, the trees and witnesses seen and how many terminal-tool Stops closed at
    their witness; a tree with no witness is reported, never counted as a pass. Counts only; the PR records them.
  fix_if: >-
    A witness schedule emits a row twice or differs from the full parse: a purity defect; fix the rule.
  hermetic: false
  graduation: waive
  graduation_waiver_reason: Needs this machine's real transcripts, which no CI tier has.
- step: 9
  phase: pre-deploy
  action: The amended contract texts carry the new rules and pass the drift, ports and size gates.
  command: >-
    bin/venv-python -m pytest tests/telemetry/test_stop_turn_close_contract_notes.py -q && bin/venv-python -c "from
    scripts.checks.contracts.validate_contract_drift import validate_contract_drift as v;f=[];v(f);assert not f,
    f;print('CONTRACTS_OK')" && bin/venv-python -c "from scripts.checks.contracts.validate_ports_contract import
    validate_ports_contract as v;f=[];v(f);assert not f, f;print('PORTS_OK')" && bin/venv-python -c "from
    scripts.checks.structural.size_limits import validate_structural_size_limits as v;f=[];v(f);assert not f,
    f;print('SIZE_OK')"
  expected: The contract-notes nodes pass, then CONTRACTS_OK, PORTS_OK and SIZE_OK.
  fix_if: >-
    Fix the amendment_log shape or the text the node names; a size failure takes the next relief in execution step 7's
    order, never a budget raise or a split.
  hermetic: true
  graduation: waive
  graduation_waiver_reason: >-
    A one-time text check of the amended contracts plus three standing validators that scripts.validate already runs.
- step: 10
  phase: pre-deploy
  action: Each changed module reaches 100% coverage from its mapped test; lint, imports and the 500-SLOC limit hold.
  command: >-
    bin/venv-python -m scripts.test_coverage_checker --check-tests --check-coverage --files src/turn_capture/witness.py
    src/turn_capture/streams.py src/turn_capture/observations.py src/turn_capture/sessions.py
    src/turn_capture/record_turn.py && bin/venv-python -m pytest tests/telemetry_capture/test_runner_waits.py
    tests/telemetry_capture/test_main.py tests/telemetry_capture/test_smoke.py tests/telemetry_capture/test_runner.py -q
    --cov=scripts/telemetry_capture --cov-report= && bin/venv-python -m coverage report
    --include=scripts/telemetry_capture/waits.py --fail-under=100 && bin/venv-python -m coverage report -m
    --include=scripts/telemetry_capture/runner.py,scripts/telemetry_capture/__main__.py,scripts/telemetry_capture/smoke.py
    && bin/venv-python -m ruff check
    src/turn_capture scripts/telemetry_capture .claude/hooks tests/turn_capture tests/telemetry_capture tests/telemetry
    tests/hooks tests/fixtures && .venv/bin/lint-imports && bin/venv-python -c "from scripts.checks.sloc.sloc_limits
    import validate_sloc_limits as v;f=[];v(f);assert not f, f;print('SLOC_OK')"
  expected: >-
    Exit 0 from each; waits.py at 100%; the -m report shows no line this plan adds to runner.py, __main__.py or smoke.py
    as missed (the checker does not map scripts/telemetry_capture, so this coverage run measures them); then SLOC_OK.
  fix_if: >-
    Cover the new branches in the mirror tests (test_witness.py for witness.py; coverage-only nodes are allowed in
    test_streams.py, test_sessions.py and test_observations.py under 500 SLOC); fix lint at its source; move logic
    into witness.py or waits.py when a module nears 500 SLOC.
  hermetic: false
  graduation: not-applicable
- step: 11
  phase: pre-deploy
  action: Fast tier, then the full tier before handoff.
  command: bin/venv-python -m scripts.validate --pre && bin/venv-python -m scripts.validate
  expected: Exit 0 on a completed full run; a timeout is not a pass (handoff_policy).
  fix_if: Fix the named check; never skip or weaken one.
  hermetic: false
  graduation: not-applicable
- step: 12
  phase: pre-deploy
  action: >-
    Live proof against the smoke-catalog writer: the c8 smoke with the v5 synthetic tree (a fresh synthetic project, so
    the build session's own untrusted rows play no part).
  command: bin/venv-python -m scripts.telemetry_capture.smoke
  expected: >-
    Ends "PC_SMOKE PASS": every table read back at the counts record_turn built from the v5 tree, the blob row delivered,
    the replay inserting 0; the smoke itself fails unless its Stop and prompt drives' diagnostics lines carry
    witness_seen and prompt_seen (a staged tree), never a wait timeout. Counts only.
  fix_if: >-
    Any failure: STOP and RCA (Decision 55); never clear a halt and retry.
  hermetic: false
  graduation: not-applicable
- step: 13
  phase: post-deploy
  action: >-
    A session STARTED on the merged main lands its first turn at that turn's own Stop: run in its second turn, after turn
    1's Stop pass; the first Stop pass sent with witness_seen, and the prompt passes report prompt_seen.
  command: >-
    T="$(ls -t ~/.claude/projects/*/*.jsonl | head -1)" && AWS_PROFILE=agent_platform bin/venv-python -m
    scripts.telemetry_capture status --tree "$T" && AWS_PROFILE=agent_platform bin/venv-python -m scripts.telemetry_capture
    probe --tree "$T" --require telemetry_observations,telemetry_sessions && bin/venv-python -c "import sys,json;from
    pathlib import Path;from scripts.telemetry_capture.state import CaptureState,state_dir;from src.turn_capture.record_turn
    import PARSER_VERSION;t=Path(sys.argv[1]);d=CaptureState(state_dir(t,t.stem)).diagnostics();stops=[x for x in d if
    x.get('event')=='Stop'];print('v',PARSER_VERSION,'prompt_passes',sum(1 for x in d if
    x.get('event')=='UserPromptSubmit'),'prompt_seen',sum(1 for x in d if x.get('event')=='UserPromptSubmit' and
    x.get('diag',{}).get('prompt_seen')),'stop_passes',len(stops),'witness_seen',sum(1 for x in stops if
    x.get('diag',{}).get('witness_seen')),'sent',sum(1 for x in stops if x.get('outcome')=='sent'));assert PARSER_VERSION==5
    and stops and stops[0].get('outcome')=='sent' and stops[0].get('diag',{}).get('witness_seen')" "$T"
  expected: >-
    The status line, the probe's per-table rows above zero with no halt, then one counts line with parser 5 and the first
    Stop pass sent with witness_seen. Counts only.
  fix_if: >-
    The first Stop pass sent nothing or timed out on its witness: compare the tree's witness records with the shim's line
    (a Claude Code change is the likeliest cause); file a rec and fix forward.
  hermetic: false
- step: 14
  phase: post-deploy
  action: >-
    The first telemetry-golden-replay run on a main that contains this merge (its daily schedule, or a dispatch once no
    DuckLake deploy is in flight) replays the v5 golden trees and the re-authored derived_golden files through the
    deployed writer and reader; its job log (mcp__github__get_job_logs) is saved to $REPLAY_LOG and its checkout SHA
    confirmed to contain the merge.
  command: grep -E "GOLDEN_SMOKE trees=[1-9][0-9]* expectations=[1-9][0-9]* .*mismatches=0" "$REPLAY_LOG"
  expected: One matching GOLDEN_SMOKE line from a run that concluded success; report it verbatim.
  fix_if: >-
    A mismatch with the local golden harness green is an engine or transport defect: name the tree and verb, file it
    through the portal and fix forward; never relax an expectation.
  hermetic: false
