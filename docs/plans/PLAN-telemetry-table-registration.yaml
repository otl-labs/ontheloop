schema_version: 5
implementation_declared: true
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: telemetry-table-registration
intent: >-
  Telemetry slice 2a-2, plan 1 of 4 (rec-4024 carrier, T2.36): register the four telemetry event tables and two new SCD2
  dimensions (ops_tenants, ops_projects) in the generated DuckLake table registry so every DuckLake Lambda carries one consistent
  spec, and make every consumer of that registry safe with them -- without creating any table in any catalog. Splits src/common/ducklake_scd2_schema.py
  first (479/500 SLOC, Decision 128) so the registry can grow and the later read layer (2b, feedback-loop #1390's design)
  has a module to extend. The generic write/read verbs refuse all six tables, the production control_health check expects
  counter rows only for tables physically present in the catalog it checks, and the reconcile gate admits a brand-new table.
  Plans 2-4 (writer infra, writer verbs, blob route) build on this; the tables are provisioned only in the isolated ducklake_smoke
  catalog by plan 3. Also folds in three items the operator approved from the feedback-loop review (2026-10-05): per-verb
  read versions in the named-read split (C1), a project purpose marker with a reserved never-auto-registered project_ref
  namespace (C2), and data-driven event-table registration (C3).
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-telemetry-table-registration.yaml
phase: >-
  T2.36 (telemetry re-lands on DuckLake) -- slice 2a-2 plan 1 of rec-4024. Moves T2.36 c1 forward (the field_semantics half:
  tables registered) without meeting it (provisioning and the writer verb are plans 3-4). Builds on 2a-1 (#1405).
scope:
- file: src/common/ducklake_scd2_schema.py
  action: Modify
  purpose: >-
    Becomes a behaviour-preserving facade (Decision 124 precedent: facade module plus extracted sibling modules; Decision
    128 decompose-by-default, no budget raise). Keeps the schema core: constants, the exception classes, WriteIdentity /
    WriteResult, the field-semantics loader, ScdTableSpec, resolve_table_spec, the append-only guard, ops_table_names, the
    DDL and MERGE builders, the status DAG (STATUS_TRANSITIONS and check_rec_status_transition stay here, so validate_ops_rule_source's
    AST read of this file and ops enforcement plan B's edits are unaffected) and schema_gate. Re-exports every name the
    two new modules now own, public and the private names any importer or test touches, so `src.common.ducklake_scd2_schema.<name>`
    and ducklake_runtime's re-exports resolve unchanged. Additions: one shared predicate is_event_table(table, semantics=None)
    -- true iff the ops_tables entry carries table_class: event (append_only ops_smoke_events, which has a merge_key, is
    not one) -- used by resolve_table_spec, control_health, partition_layout and both handlers; resolve_table_spec raises
    a directed SchemaGateError for an event-class entry (today a raw KeyError on the absent merge_key), naming the event
    projection as its spec source; a helper table_write_boundary(table, semantics=None) -> str | None reads an ops_tables
    entry's write_boundary without resolving it; _order_columns carries every physical column -- role input, plus any role:
    derived column outside the SCD2 envelope (ulid, created_timestamp, last_updated_timestamp) -- so a writer-computed attribute
    such as ops_projects.purpose reaches the DDL, the MERGE binding (_write_params' existing record fall-through, plan 3's
    verb supplying the value after schema_gate) and the read projection, while schema_gate still refuses a caller-supplied
    value; this gives SCD2 `role: derived` the event projection's meaning (writer-computed, physical unless derivation.timing
    is read), and no current entry has such a column, so every existing spec's ordered_columns is unchanged; ScdTableSpec
    gains id_scheme ("serial" | "ulid", read as entry.get('id_scheme') or 'serial', since the generator emits null for tables
    without one). Import direction: the two extracted modules have no module-scope import of the facade; the one facade
    use -- ducklake_named_reads.read_version's column projection for SELECT * verbs -- is a function-local deferred import
    (the Decision 124 precedent), and test_no_circular_import also imports each new module first, on its own.
- file: src/common/ducklake_named_reads.py
  action: Create
  purpose: >-
    NamedRead, NAMED_READS, NAMED_READS_VERSION (stays 3, the registry-format version), _params_schema and describe_named_reads,
    moved from ducklake_scd2_schema.py with no verb or SQL change. Adds a per-verb read_version (review item C1): the first
    16 hex of sha256 over the canonical JSON of the verb's definition -- verb, bound table, params, paginable, whitespace-normalised
    SQL and, for the SELECT * verbs (ALL_TABLE_COLUMNS), the bound table's resolved column projection from field_semantics,
    so a column change re-versions them although their SQL text is unchanged. It is computed, never hand-maintained, so
    it cannot be forgotten or lowered, and a revert also changes what a consumer pinned; one verb's change never re-versions
    another. read_version is opaque and compared by equality only (no ordering is implied). describe_named_reads gains a
    read_version key per verb; nothing else in describe changes. The digest's column projection comes through a function-local
    deferred import of the facade (no module-scope import). 2b extends the digest input with classifier rules and adds its
    telemetry verbs here. read_version is computed at call time, never at import (AGENTS.md: no raise at import; the catalog_dr
    bundle carries the facade but not field_semantics.yaml), and SELECT * verbs are detected from the verb's own SQL --
    never by importing ducklake_reader_client.ALL_TABLE_COLUMNS, which no DuckLake manifest bundles.
- file: src/common/ducklake_write_verbs.py
  action: Create
  purpose: WriteVerb, VERB_REGISTRY and describe_write_verbs, moved verbatim -- describe's output is unchanged.
- file: src/common/ducklake_control_health.py
  action: Modify
  purpose: >-
    Catalog-aware and scheme-aware. _writer_keyspace_tables skips event-class entries before resolving (they have no keyspace)
    and includes every id_keyspace=writer table whatever its id_scheme. The expected counter rows are every status-live
    writer-keyspace table (always expected, so a vanished live table and its counter still fail exactly as today) plus each
    non-live writer-keyspace table whose physical history table EXISTS in the catalog under check (one information_schema
    read, Decision 88 egress-cheap); absent non-live tables are reported in a new absent_tables response field, never silently
    dropped. Counter floor per scheme: serial unchanged (current_value >= max allocated numeric id); ulid -> current_value
    >= count(*) of the table's current table. Production (ducklake_ops) therefore keeps expecting exactly one row (ops_recommendations)
    while ops_tenants/ops_projects exist nowhere.
