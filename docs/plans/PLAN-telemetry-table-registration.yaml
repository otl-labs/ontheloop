acceptance_criteria:
- >-
  src/common/ducklake_scd2_schema.py is a facade under 500 SLOC whose names are a superset of the pre-split module's surface
  (exactly the named additions beyond it); the two extracted modules are each under 500 SLOC with 100% mirror coverage;
  describe outputs (named reads and write verbs) and NAMED_READS_VERSION are unchanged except the new per-verb read_version
  key on each named read.
- >-
  config/lambda/ducklake/field_semantics.yaml carries the four telemetry event tables and ops_tenants/ops_projects with
  the sidecar's status, write_boundary and (for the dimensions) id_keyspace writer and id_scheme ulid; the generator's --check
  passes; each event entry builds a kernel EventTableSpec.
- >-
  The generic write verbs (write_ops, update_ops, file_ops, create_ops_tables) refuse all six tables, and the generic read
  verbs refuse them by their table parameter (the query_ops FROM residual declared, owner rec-4024), each with a directed
  error; no code path in this plan creates a table in any catalog.
- >-
  control_health expects counter rows only for writer-keyspace tables present in the catalog under check, reports absent
  ones, applies the ulid floor, and stays green on production after deploy (ControlTableInvariantViolation 0).
- >-
  The six tables are reconcile_scope exempt (pre-production, owner 2c); the reconcile gate's added-column leg follows reconcile_scope
  and reports skipped exempt tables by name; VP5's unit nodes show the leg discriminates, and its --deploy-gate passes.
- >-
  ops_tenants.yaml and ops_projects.yaml are ratified Class A contracts; _joins.yaml declares the dimension joins; ops_entity_counters.yaml,
  project-id.yaml, tenant-id.yaml, ducklake_writer.yaml, ducklake_reader.yaml and read-engine.yaml carry their amendments
  with category-6 amendment_log entries; each new invariant declares its enforcing check or residual owner.
- >-
  The governed deploy of all five DuckLake Lambdas succeeds on the merge commit with the existing smoke gates green.
- >-
  Review items C1-C3: every named read carries a computed, opaque, equality-only read_version that changes only with that
  verb's definition (SELECT * verbs include their column projection) and is stamped on named_read responses and documented
  in the reader contracts; ops_projects declares purpose (from the reserved prefix, immutable) and project-id.yaml the never-auto-registered
  reserved namespace, with a dated annotation on Decision 200; registration is data-driven as far as the registry goes --
  no consumer names the telemetry tables and the projection derives partition_column from the contract -- while a new event
  table still needs a hand edit to the generator's _CONTRACT_TABLE_IDS tuple, a KEY_PLANS entry and the kernel's session_started_at
  partition (generalised by a future journal build).
verification_plan:
- step: 1
  phase: pre-deploy
  action: The schema-file split preserves the surface; each new module is mirror-covered and under budget.
  command: >-
    bin/venv-python -m pytest tests/test_ducklake_scd2_schema.py::test_facade_reexports_pre_split_surface tests/test_ducklake_scd2_schema.py::test_no_circular_import
    tests/test_ducklake_scd2_schema.py::test_order_columns_keeps_writer_derived_columns tests/test_ducklake_named_reads.py
    tests/test_ducklake_write_verbs.py tests/test_ducklake_facade.py tests/checks/contracts/test__manifest.py tests/lambda_manifest/test_bundle_checks.py::test_new_ducklake_modules_track_scd2_schema_membership
    -q && bin/venv-python -c "import pathlib;s={f:len([l for l in pathlib.Path(f).read_text().splitlines() if l.strip()
    and not l.strip().startswith('#')]) for f in ['src/common/ducklake_scd2_schema.py','src/common/ducklake_named_reads.py','src/common/ducklake_write_verbs.py']};print(s);assert
    max(s.values())<500;print('SPLIT_OK')"
  expected: >-
    Exit 0, every node passes, then SPLIT_OK. Red before: the new modules, the surface test and the extended bundle invariant
    are absent.
  fix_if: >-
    A missing re-export -> add it to the facade; a module over 500 SLOC -> move a cohesive block, never raise a budget.
  hermetic: true
  graduation: graduate
  graduation_check_id: ducklake-schema-facade-surface
  expected_literals: []
- step: 2
  phase: pre-deploy
  action: >-
    Every registry consumer is safe with event and dimension entries; the generic verbs refuse all six tables.
  command: >-
    bin/venv-python -m pytest tests/test_ducklake_scd2_schema.py::test_resolve_table_spec_directs_event_tables_elsewhere
    tests/test_ducklake_scd2_schema.py::test_table_write_boundary_reads_entry tests/test_ducklake_partition_layout.py::test_declared_spec_for_event_table_reads_history_partition
    tests/common/test_ducklake_maintenance_scope.py::test_event_entries_classify_as_append_only_history tests/common/test_ducklake_maintenance_scope.py::test_registered_absent_preproduction_status_is_expected
    tests/lambdas/ducklake_writer/handler/test_ops_actions.py::test_generic_verbs_refuse_telemetry_and_registration_tables
    tests/test_ducklake_reader_handler.py::test_generic_reads_refuse_telemetry_and_registration_tables tests/test_ducklake_reader_handler.py::test_named_read_response_carries_read_version
    tests/common/test_ducklake_runtime.py::test_ops_table_names_lists_every_registered_table tests/common/test_ducklake_tables.py::test_history_partition_is_calendar_day_triple
    tests/common/test_ducklake_runtime.py::test_runtime_reexports_registry_helpers -q && ! grep -nE 'telemetry_(sessions|observations|transcripts|agents)'
    src/common/ducklake_scd2_schema.py src/common/ducklake_control_health.py src/common/ducklake_partition_layout.py src/lambdas/ducklake_writer/handler.py
    src/lambdas/ducklake_reader/handler.py && echo NO_HARDCODED_TABLES
  expected: >-
    Exit 0, 11 passed, then NO_HARDCODED_TABLES. Red before: the new nodes are absent and the two updated guards fail on
    the registered event entries.
  fix_if: >-
    A consumer that resolves an event entry through resolve_table_spec -> branch it on write_mode or the event entry, never
    widen ScdTableSpec.
  hermetic: true
  graduation: graduate
  graduation_check_id: telemetry-registry-consumer-safety
  expected_literals: []
- step: 3
  phase: pre-deploy
  action: The six tables are registered and the generated registry is fresh.
  command: >-
    bin/venv-python -m scripts.schema_to_field_semantics --check && bin/venv-python -m pytest tests/test_field_semantics_telemetry_registration.py::test_six_tables_registered
    tests/test_field_semantics_telemetry_registration.py::test_event_entries_build_kernel_specs tests/test_field_semantics_telemetry_registration.py::test_registry_says_what_not_where
    tests/test_field_semantics_telemetry_registration.py::test_partition_column_derived_from_contract tests/test_field_semantics_telemetry_registration.py::test_dimension_specs_carry_every_physical_column
    tests/test_schema_to_field_semantics.py -q
  expected: >-
    Exit 0: the generated file matches; the five nodes and the existing generator module pass. Red before: nodes absent.
  fix_if: >-
    A --check diff -> regenerate with the generator (never hand-edit); a projection gap -> fix the sidecar entry or the
    passthrough.
  hermetic: true
  graduation: graduate
  graduation_check_id: telemetry-tables-registered
  expected_literals: []
- step: 4
