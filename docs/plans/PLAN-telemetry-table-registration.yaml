  command: >-
    bin/venv-python -m scripts.build_lambda --ducklake-only && bin/venv-python -c "from scripts.lambda_manifest import compute_affected_artifacts
    as c;a=set(c(['src/common/ducklake_named_reads.py','src/common/ducklake_write_verbs.py']));print(sorted(a));assert a=={'ducklake_writer','ducklake_reader','ducklake_maintenance','ducklake_maintenance_smoke','ducklake_catalog_dr'},a;print('BUNDLES_OK')"
  expected: >-
    Exit 0; the DuckLake bundles build with their import check; the affected set is exactly the five DuckLake artifact slugs
    (data-pipeline absent because its excludes list the modules); BUNDLES_OK.
  fix_if: >-
    An import error in a bundle -> add the module to that manifest; data-pipeline affected -> add the module to its excludes.
  hermetic: false
  graduation: waive
  graduation_waiver_reason: >-
    Builds real bundles from the working tree; the standing equivalent is the full tier's bundle-completeness check.
  expected_literals: []
- step: 8
  phase: pre-deploy
  action: Full validation tier before handoff.
  command: bin/venv-python -m scripts.validate
  expected: Exit 0.
  fix_if: Fix the named check; never raise a budget or skip a check.
  hermetic: false
  graduation: not-applicable
- step: 9
  phase: post-deploy
  action: >-
    The governed deploy of the merge commit succeeded, each job included: read with mcp__github__actions_list (method=list_workflow_runs,
    workflow_id=deploy-ducklake-lambdas.yml, filtered to head_sha=$MERGE_SHA) and then method=list_workflow_jobs for that
    run, writing the jobs JSON to $DEPLOY_JOBS_JSON (AGENTS.md: GitHub access is the MCP, never gh).
  command: >-
    test -s "$DEPLOY_JOBS_JSON" && bin/venv-python -c "import json,os;j=json.load(open(os.environ['DEPLOY_JOBS_JSON']));jobs={x['name']:x.get('conclusion')
    for x in (j.get('jobs') if isinstance(j,dict) else j)};print(jobs);want=['deploy-maintenance','maintenance-smoke','reconcile-gate','deploy-serving','smoke'];assert
    all(any(n.startswith(w) and c=='success' for n,c in jobs.items()) for w in want),jobs;print('DEPLOY_OK')"
  expected: >-
    Every named job (deploy-maintenance, maintenance-smoke, reconcile-gate, deploy-serving, smoke) concluded success --
    a skipped job fails this step -- then DEPLOY_OK.
  fix_if: >-
    A failed job -> read its log; a smoke or reconcile-gate failure is this plan's to root-cause and fix forward (never
    a re-run to green).
  hermetic: false
  graduation: not-applicable
- step: 10
  phase: post-deploy
  action: The deployed writer and reader refuse the six tables on their generic verbs; describe is unchanged.
  command: >-
    bin/venv-python -c "from scripts.ducklake_smoke import core;w=core._function_url('writer');r=core._function_url('reader');bad=[];[bad.append(('w',t,x.status_code))
    for t in ('telemetry_sessions','ops_projects') for x in [core._sigv4_invoke(w,{'action':'write_ops','table':t,'record':{}})]
    if not (x.status_code==400 and 'write_boundary=' in x.json().get('error',''))];[bad.append(('r',v,t,x.status_code))
    for v in ('read_ops_current','read_ops_history','query_ops') for t in ('telemetry_sessions','ops_tenants') for x in
    [core._sigv4_invoke(r,{'action':v,'table':t})] if not (x.status_code==500 and 'write_boundary=' in x.json().get('error',''))];dv=core._sigv4_invoke(w,{'action':'describe'}).json().get('verbs',{});print(bad,sorted(dv));assert
    not bad and sorted(dv)==['create_ops_tables','file_ops','update_ops','write_ops'];print('REFUSAL_OK')"
  expected: >-
    REFUSAL_OK: every generic write returns 400 and every generic read 500, each with the directed write_boundary message
    (the pre-change bundle answers 'unknown ops table' instead, so a stale deploy fails this step), and describe lists the
    same four write verbs.
  fix_if: >-
    A generic verb accepting a telemetry or dimension table -> the deployed bundle lacks the refusal; root-cause the deploy,
    never relax the check.
  hermetic: false
  graduation: not-applicable
- step: 11
  phase: post-deploy
  action: Production control_health stays green after the deploy (first scheduled run after it).
  command: >-
    test -n "$DEPLOYED_AT" && bin/venv-python -c "import datetime as d,json,os,subprocess; q=subprocess.run(['aws','cloudwatch','get-metric-statistics','--namespace','DuckLakeMaintenance','--metric-name','ControlTableInvariantViolation','--start-time',os.environ['DEPLOYED_AT'],'--end-time',d.datetime.now(d.timezone.utc).isoformat(),'--period','21600','--statistics','Maximum','--profile','agent_platform','--output','json'],capture_output=True,text=True,check=True);
    p=json.loads(q.stdout)['Datapoints'];print(len(p),[x['Maximum'] for x in p]);assert p and max(x['Maximum'] for x in
    p)==0;print('CONTROL_HEALTH_OK')"
  expected: >-
    At least one datapoint since the deploy, every Maximum 0, then CONTROL_HEALTH_OK (run at least one 6 h schedule after
    DEPLOYED_AT).
  fix_if: A violation -> the catalog-aware expected set regressed on production; stop and RCA (Decision 55).
  hermetic: false
  graduation: not-applicable
