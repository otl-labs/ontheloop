    bin/venv-python -m pytest tests/test_ducklake_control_health.py::test_control_health_expects_only_present_writer_keyspace_tables
    tests/test_ducklake_control_health.py::test_control_health_ulid_floor tests/test_ducklake_control_health.py::test_control_health_skips_event_entries
    tests/test_ducklake_control_health.py::test_control_health_asserts_counter_invariants -q
  expected: 'Exit 0, 4 passed. Red before: the three new nodes are absent.'
  fix_if: >-
    A production-shaped catalog demanding a dimension counter row -> the expected set must come from the catalog, not the
    registry alone.
