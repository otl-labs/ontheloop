- step: 6
  phase: pre-deploy
  action: >-
    Index freshness, the category-6 ritual for the amended Class A/B/C contracts, and the contracts size cap.
  command: >-
    bin/venv-python -m scripts.decisions_index --check && bin/venv-python -c "import subprocess,yaml;from scripts.contracts_schema
    import ContractDocument;from scripts.contracts_enforcement import check_amendment_for_diff;base=lambda f:yaml.safe_load(subprocess.run(['git','show','origin/main:docs/contracts/%s.yaml'%f],capture_output=True,text=True,check=True).stdout);head=lambda
    f:yaml.safe_load(open('docs/contracts/%s.yaml'%f,encoding='utf-8'));errs=[];[errs.extend(check_amendment_for_diff(ContractDocument.model_validate(base(f)),ContractDocument.model_validate(head(f))))
    for f in ('ops_entity_counters','project-id','tenant-id','ducklake_writer','ducklake_reader')];[ContractDocument.model_validate(head(f))
    for f in ('ops_tenants','ops_projects')];print(chr(10).join(errs) or 'AMENDMENTS_OK');assert not errs" && bin/venv-python
    -c "from scripts.checks.structural._classify import effective_lines;fs=['docs/contracts/%s.yaml'%f for f in ('ops_tenants','ops_projects','_joins','ops_entity_counters','project-id','tenant-id','ducklake_writer','ducklake_reader','read-engine','data-modeling-standard')]+['config/lambda/ducklake/field_semantics.static.yaml'];big=[(f,effective_lines(open(f).read()))
    for f in fs if effective_lines(open(f).read())>500];print(big);assert not big;print('SIZE_OK')"
  expected: >-
    Exit 0, the index is fresh, AMENDMENTS_OK, SIZE_OK. (read-engine.yaml is a Class D contract, not a ritual document:
    its content is covered by step 12's guards and the full tier's drift gate.)
  fix_if: >-
    A category-6 error -> add the amendment_log entry with a consistent change_class/semantic_break pair; an oversized file
    -> compact its amendment history (Decision 166), never raise.
  hermetic: false
  graduation: waive
  graduation_waiver_reason: >-
    Diff-relative to origin/main by construction (the standing form is scripts.validate's contract drift gate); the guard
    module graduates separately as step 12.
  expected_literals: []
- step: 12
  phase: pre-deploy
  action: >-
    Contract guards: the dimension contracts, identity-contract wording, the writer/reader contract amendments, the status
    vocabulary and the Decision 200 annotation.
  command: bin/venv-python -m pytest tests/checks/contracts/test_telemetry_dimension_contracts.py -q
  expected: 'Exit 0, every node passes. Red before: the module does not exist.'
  fix_if: A failing guard names the missing contract text -- fix the document, not the test.
