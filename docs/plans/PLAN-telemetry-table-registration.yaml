  action: The reconcile gate exempts pre-production tables by reconcile_scope and its deploy gate passes.
  command: >-
    bin/venv-python -m pytest tests/checks/ops_governance/test_validate_reconcile_pending_gate.py::test_preproduction_exempt_table_owes_no_alters_and_is_reported
    tests/checks/ops_governance/test_validate_reconcile_pending_gate.py::test_live_exempt_table_still_owes_alters tests/checks/ops_governance/test_validate_reconcile_pending_gate.py::TestRealRepoIntegration::test_ops_table_ids_real
    tests/checks/ops_governance/test_validate_reconcile_pending_gate.py::test_control_class_needs_no_reconcile_sides -q
    && bin/venv-python -m scripts.checks.ops_governance.validate_reconcile_pending_gate --deploy-gate
