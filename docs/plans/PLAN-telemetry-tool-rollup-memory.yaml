  - "Operator approvals (2026-11-23, project thread): both parts (SQL side scan and CLI halving) chosen on the card, then 'write the plan'."
  - "Plan-time probe (scratch, synthetic tool-shaped Parquet corpus, reader limits, threads 1; scripts kept in the shared project folder tool-rollup-memory/probe): current SQL passes at 300,000 observations (7.2 s, spilling), fails at 450,000 and 600,000 ('failed to offload', the production message); the side scan passes at 450,000 (4.3 s) and 600,000 (6.5 s) and fails at 800,000; identical rows at 300,000; the oracle test file passes with the side scan patched in, and fails 2 nodes with attribution nulled (negative control). So the SQL change is headroom (about 1.5x), and the CLI halving is the guarantee."
  - "Production estimate (one-day reads 2026-11-20): about 18,000 tool calls and 16,000 model calls a day, so roughly 360,000 observations a week; inferred, not measured. tool_use_rollup is the only verb reading metadata (grep of ducklake_event_read_sql.py)."
  - "The sibling probe's earlier finding (rec-5491 plan context) used a corpus with no tool_call rows; its out-of-memory came from the same metadata read, not tool_use_rollup's repeat CTEs."
  - "Deploy order: merging ships the telemetry reader through deploy-ducklake-lambdas once main's full tier passes (Decisions 249, 254). rec-5491's fix went live 2026-11-23 14:41Z and its VP 7 watch runs to about 25 Nov; a second reader deploy inside that watch would not reset it but would confound it, so the merge waits (execution step 1)."
  - "Content reader (Decision 272): packages ducklake_event_read_sql.py but serves no tool_use_rollup; VP 4 proves its stamps unchanged, and VP 10 meets Decision 79 on its next operator-approved deploy, never dispatched by the build (precedent: PLAN-telemetry-repeated-tool-calls VP 7)."
