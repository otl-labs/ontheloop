  - "Shared files (plan_obligations 2026-11-23): src/common/ducklake_event_read_sql.py 482 of 500 SLOC (NEAR_CAP; this edit adds about 5) and tests/test_telemetry_usage.py 474 of 500 are also scoped by unbuilt plans billing-shape-local, merge-annotate-contract-reader, telemetry-claude-p-capture-adapter and telemetry-planning-cost-reads; whichever builds second rebases. Relief: execution step 3."
