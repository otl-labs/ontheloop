  - "Reader error body: a DuckDB out-of-memory answers 500 with error_type unmapped and error_class OutOfMemoryException (ducklake_handler_errors.unmapped); the client does not retry a 500 (_READER_TRANSIENT_STATUS)."
  - "Related-work check (red_overlap, 2026-11-23 on 9d167c64): blocked; rec-5536 and rec-5538 overlap on selector-selected test paths only (no scope file is shared). Deferral rationale for rec-5536: the CI RCA filing-check red in scripts/ci/claude_p_retry.sh, Agents in GitHub's lane, unrelated to the reader. Deferral rationale for rec-5538: the telemetry-arrival red (session_presence.py _walk repeats a deadline-exceeded 7-day read), raised with the coordinator 2026-11-23 for an owner; this plan edits none of its files. Neither red's repair depends on this plan; the build re-runs red_overlap (execution step 2)."
