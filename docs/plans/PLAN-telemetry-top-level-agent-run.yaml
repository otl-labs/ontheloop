      json,os;j=json.load(open(os.environ['DEPLOY2_JOBS_JSON']));jobs={x['name']:x.get('conclusion') for x in
      (j.get('jobs') if isinstance(j,dict) else j)};print(jobs);assert all(jobs.get(w)=='success' for w in
