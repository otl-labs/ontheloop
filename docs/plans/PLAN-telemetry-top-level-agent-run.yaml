schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: telemetry-top-level-agent-run
implementation_declared: true
intent: >-
  Settle, once and in the Class A telemetry contracts, how a top-level agent run is stored (a CI job running claude -p,
  a Fargate task, a Lambda, a local unattended run), so ci-rca, plan review and the executor's producers never invent two
  shapes (T3.22 c5, rec-4416). A top-level run is its root session plus one telemetry_agents open/close pair whose
  session_id is that root, observation_id NULL and entity_ref '<root session entity_ref>/run'; one generic nullable
  column host_run_ref carries the host run identity under an open prefix registry (gha:, ecs:, lambda:, local:); the
  trigger vocabulary is closed and matches what producers write; a read-derived surface classification says how readers
  tell the five run surfaces apart; and a typed omission withheld_by_policy lets a session be captured without its text
  (needed by plan 3 for plan review, Decision 238 cl.1). Because the production writer's MERGE names every declared
  column, the governed deploy now holds the production telemetry writer and reader while a declared column's production
  add is pending, reusing the existing reconcile-pending gate. Plan 1 of 3 for CI agent capture (Benjamin, 2026-10-29
  13:37Z and 14:02Z); telemetry is the learning signal of the self-improvement loop (PROJECT_CONTEXT), and CI agent runs
  mixed with interactive sessions would teach it the wrong lessons.
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-telemetry-top-level-agent-run.yaml
phase: >-
  T3.22 (telemetry producer foundation), exit criterion c5, rec-4416 (Medium). Plan 1 of 3 for CI agent capture: plan 2
  PLAN-claude-p-capture-adapter (ci-rca live, rec-4424) and plan 3 producer admission plus plan-review capture (T3.22 c4,
  T3.20 c9, rec-4420, rec-4415) are planned in their own threads from the briefs in /mnt/project-files/ci-agent-telemetry/.
  V3: config/lambda/ducklake/field_semantics.yaml and the static sidecar change, so the governed deploy channel ships the
  DuckLake functions (active artifacts, Decision 79); the production telemetry functions are held by this plan's own
  mechanism until the operator's production column add.
closes_criteria:
  - T3.22:c5
scope:
  - file: docs/contracts/telemetry_agents.yaml
    action: Modify
    purpose: >-
      (1) New field host_run_ref: type str, iceberg_type string, nullable true, dq_intent {pattern:
      "^(gha:[0-9]{1,20}/[0-9]{1,6}/[A-Za-z0-9_.-]{1,100}/[1-9][0-9]{0,2}|ecs:[A-Za-z0-9_.-]{1,255}/[A-Za-z0-9-]{1,64}|lambda:[A-Za-z0-9-]{1,64}|local:[A-Za-z0-9_.-]{1,64}/[A-Za-z0-9_.-]{1,128})$"};
      description "The host's own identity for a top-level agent run, under an open prefix registry; NULL on a sub-agent
      run (its root's top-level row carries it)." semantics names the per-prefix grammar: gha:<run_id>/<run_attempt>/<job
      id>/<retry ordinal of the claude -p attempt, from 1>, ecs:<cluster>/<task id>, lambda:<request id>, local:<runtime>/<run
      id> (Decision 184: a free-tier local run fits); a new host is a new prefix and a contract widen (Decision 210 cl.3).
      No prefix's character class admits ':' after the prefix, so an ARN cannot match; it never carries an ARN, account
      id or hostname (Decision 101); the per-host typed columns (workflow_run_id,
      lambda_request_id) stay as typed join keys. dq_intent also gains null_or_zero_when {trigger: [subagent_sync,
      subagent_background]}: a sub-agent row's host_run_ref is NULL at write (the additive leg refuses only not_null
      and required_when, so the add still works). populated_by "unproduced: T3.20:c9 (no producer writes it)". No
      required_when here: Decision 222 cl.1's auto-add refuses a column carrying one, so PLAN-claude-p-capture-adapter
      adds required_when {trigger: [<top-level values>]} after the production add. amendment_log field_add entry.
      (2) trigger: dq_intent {accepted_values: {values: [subagent_sync, subagent_background, workflow_run,
      workflow_dispatch, push, schedule, eventbridge, manual, smoke_test]}}; description lists them; semantics: the
      sub-agent values are the claude_code producer's spawn modes; the GitHub Actions values are GITHUB_EVENT_NAME
      verbatim for the event types the capture allow-list admits; eventbridge, manual and smoke_test are the non-Actions
      host triggers; cron_workflow is retired (no producer ever wrote it; GitHub's own name is schedule). The set is closed
      and write-enforced (Decision 210 cl.3); a new value is a contract widen. amendment_log entry semantic_break true,
      change_class accepted_values_narrow (cron_workflow leaves the documented set), migration_story with the census
      token "census: 0 violators (2026-10-29)": the only telemetry_agents writer is the claude_code producer, and every
      version since slice 3a (ffc761ee, src/turn_capture/sessions.py _agent_row) writes subagent_sync or
      subagent_background, so no stored row breaks the rule (source: producer history; no reader verb lists distinct
      trigger values).
      (3) entity_ref: dq_intent_local gains pattern_when [{when: {trigger: [workflow_run, workflow_dispatch, push,
      schedule, eventbridge, manual, smoke_test]}, pattern: "^.+/run$"}]; governance_notes_local names both shapes (the
      spawning tool call's toolUseId on a sub-agent run; '<root session entity_ref>/run' on a top-level run).
      (4) observation_id and session_id governance_notes_local: NULL on a top-level run; session_id is the root itself on
      a top-level run (the CHILD on a sub-agent run). (5) workflow_run_id semantics: filled, with host_run_ref, by the CI
      capture producer (owner stays T3.20:c9). (6) lambda_request_id, findings_count, recs_created and
      queue_entries_written: populated_by "unproduced: rec-4711 (no producer writes it)" -- their owner T3.22:c5 closes
      here. (7) New top-level key run_shapes (scripts/contracts_schema.py RunShape), exactly two entries, pinned:
      sub_agent {session_id: child, observation_id: spawning_tool_call, entity_ref: "<spawning tool call toolUseId>",
      external_ref: "the producer's spawn and close record refs", agent_type: "the producer's registry key
      (claude-code-subagent for claude_code)", triggers: [subagent_sync, subagent_background], host_run_ref: "null",
      rows: "one open row per spawn; one close row per completion notice (rec-4358)"} and top_level {session_id: root,
      observation_id: "null", entity_ref: "<root session entity_ref>/run", external_ref: "'<root session
      entity_ref>/run#0/open' and '<root session entity_ref>/run#0/close'", agent_type: "the source_registry key of the
      agent (e.g. ci_rca)", triggers: [workflow_run, workflow_dispatch, push, schedule, eventbridge, manual, smoke_test],
      host_run_ref: required, rows: "one open row timed at the root's open row and one close row written by the final
      pass, timed at the root's latest close row, outcome from the host's terminal result", one_run_per: "root session
      (a claude -p retry attempt is a new session, so a new run with its own retry ordinal)", state: "root state stays
      derived from the root's own session rows (STATE_CTES, parent_session_id IS NULL); the pair is run provenance, and
      agent_run_state_and_duration and agent_run_token_rollup over the root return it"}. (8) governance_notes: a
      TOP-LEVEL RUN paragraph pointing at run_shapes and telemetry_sessions.surface. (9) realization: host_run_ref under
      unproduced T3.20:c9 (with workflow_run_id); a new owner key rec-4711: [lambda_request_id, findings_count,
      recs_created, queue_entries_written]; the T3.22:c5 key removed. (10) contract-level amendment_log entry naming the
      plan, Decision 199/210/222 and rec-4416. (11) The header comment and contract.description name both run shapes
      (entity_ref the spawning toolUseId and session_id the CHILD on a sub-agent run; the root-session forms on a
      top-level run). contract_version stays 2 (field-level semantic changes are logged per
      field, the corpus precedent).
