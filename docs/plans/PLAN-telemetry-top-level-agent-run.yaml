constraints:
  - >-
    No producer change: src/turn_capture, scripts/telemetry_capture and config/telemetry are untouched; PARSER_VERSION stays
    7 and the golden digest is unchanged. host_run_ref is filled first by PLAN-claude-p-capture-adapter, after the hold
    clears (Decision 222 cl.2: no producer emits a column before its deploy is green).
  - >-
    host_run_ref carries no required_when or not_null leg in this plan, so Decision 222 cl.1's additive leg can add it on
    smoke and in production; the required_when rule is plan 2's, staged after the production add.
  - >-
    Public repository (Decision 101): no ARN, account id, Function URL or hostname in any contract text, test value, log
    marker or PR text; the hold marker names table and column names only.
  - >-
    The hold never reds the run: an expected hold is a green skip with a notice, so ci-rca (which watches failed
    default-branch runs) is not woken; a malformed sidecar is the only red (Decision 55 fail loud).
  - >-
    One predicate: the hold, the ops deploy gate and the merge-time leg share _has_pending_reconcile (the gate module's own
    one-predicate rule); no second copy of the pending logic anywhere, the workflow included.
  - >-
    The admin step runs only on Benjamin's own words in the build thread, under PlatformAdmin, with the exact payload from
    deploy-paths.yaml pasted inline first (CI-first deploy rule, Decision 230 cl.4); everything else uses --profile
    agent_platform.
