bundled_recommendations:
  - rec-4416
followon_recs:
  - rec-4711
  - rec-4713
infrastructure_dependencies:
  - >-
    Lambda gating disposition: compute_affected_artifacts also flags data-pipeline solely because
    docs/ROADMAP-PLATFORM.yaml is a packaged asset in its manifest. The roadmap edit is bookkeeping prose with no handler
    or runtime change, so no build, deploy or smoke step is owed for data-pipeline; the DuckLake functions are covered by
    VP 11-14.
  - >-
    No Terraform and no IAM change. One admin step after merge, named here so it needs only Benjamin's word: the
    production column add, re-running provision_telemetry_catalog under PlatformAdmin, human-directed (Decision 230 cl.4,
    docs/contracts/deploy-paths.yaml provision_telemetry_catalog row). It adds host_run_ref through the owner-login
    additive leg (Decision 222 cl.1 rules: nullable, no not_null or required_when) and is idempotent.
  - >-
    Deploy, first run (merge commit): deploy-maintenance ships the maintenance functions with the new projection; the
    maintenance-smoke owner step adds host_run_ref on the smoke catalog; the twin and serving legs deploy and gate as
    usual; deploy-telemetry holds (pending host_run_ref), so the production writer and reader keep their current code and
    telemetry-smoke skips. The production catalog is unchanged until the admin step. The ducklake_code_drift sensor files
    one High rec for the two held functions while the hold lasts (it is the visible reminder that the admin step is owed)
    and closes it after the second deploy.
  - >-
    Second run (bookkeeping PR merge, after the admin step): host_run_ref moves from pending_reconcile to reconciled with
    the provision response as evidence, the hold clears, deploy-telemetry ships the production writer and reader and
    telemetry-smoke's light gate proves live == declared (TELEMETRY_PROVISION_OK). The old writer keeps working between
    the admin step and this deploy: an extra live nullable column is never named by its MERGE.
  - >-
    Sequencing: while host_run_ref is pending, every production telemetry deploy is held, so the coordinator merges no
    other change to the production telemetry writer or reader in that window (concurrent-applies rule), and
    PLAN-claude-p-capture-adapter's producer merges only after the second run is green.
acceptance_criteria:
  - >-
    telemetry_agents declares exactly two run shapes; a top-level run is the root session plus one open/close pair with
    session_id the root, observation_id NULL, entity_ref '<root session entity_ref>/run', one run per root session (VP 1).
  - >-
    host_run_ref is a nullable column with the four-prefix pattern, write-enforced; trigger is a closed nine-value set
    partitioned between the two shapes and write-enforced; a top-level entity_ref must end in /run at write (VP 1, VP 6).
  - >-
    telemetry_sessions.surface is declared read-derived with its seven values and formula, and a top-level root's
    workflow is its agent's source_registry key (VP 1, VP 4).
  - >-
    withheld_by_policy is an accepted omission reason whose rows store the empty digest and zero bytes, enforced at write
    (VP 1).
  - >-
    The four columns owned by T3.22:c5 move to rec-4711, host_run_ref is unproduced under T3.20:c9, and the realization
    check passes (VP 6).
  - >-
    A telemetry column added without a pending_reconcile entry fails the merge-time gate; while one is pending the
    governed deploy skips the production telemetry writer and reader with a TELEMETRY_PRODUCTION_HOLD notice and stays
    green, and the ops serving deploy is never held by a telemetry column (VP 2, VP 3, VP 11, VP 12).
  - >-
    After the operator's provision_telemetry_catalog re-run lists telemetry_agents.host_run_ref as added and the
    bookkeeping PR clears the hold, the production writer and reader deploy and the light gate passes (VP 13, VP 14).
  - >-
    No claude_code output changes: PARSER_VERSION stays 7 and the golden digest is unchanged (VP 5).
