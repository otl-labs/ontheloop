- file: src/common/ducklake_telemetry_blobstore.py
  action: Modify
  purpose: >-
    PR B. The content_blobs port's read verb, admitted by name by the T2.36 c4 ingestion guard: get_blob(content_uri,
    sha_hex, size, *, offset, length) -> bytes. In order: content_uri must match
    ^[0-9A-HJKMNP-TV-Z]{26}/[0-9A-HJKMNP-TV-Z]{26}/[0-9A-HJKMNP-TV-Z]{26}/[0-9a-f]{64}$ and its last segment must equal
    sha_hex, else BlobIntegrityError(reason "uri_malformed") with no S3 call. Then one head_object with ChecksumMode
    ENABLED: a stored ChecksumSHA256 absent gives "checksum_absent", one not equal to sha256_hex_to_b64(sha_hex) gives
    "checksum_mismatch", and a ContentLength other than size gives "length_mismatch". Then one get_object with
    Range bytes=offset-(offset+length-1) and IfMatch set to the HEAD's ETag, so the bytes come from the object just
    verified with no s3:GetObjectVersion. A 412 gives "changed_during_read", and a returned length other than the
    asked length gives "length_mismatch". A 403 on either call gives "forbidden_or_missing" (the reader has no List,
    so S3 answers 403 for an absent key) and a 404 gives "missing". Throttling, a 5xx or a timeout after botocore's
    retries is BlobStoreUnavailableError. BlobIntegrityError gains a keyword reason attribute from that closed set,
    defaulting to "checksum_mismatch", so the writer's existing raise in ducklake_telemetry_blobs.py stays untouched and
    its typed answers are unchanged. Each error get_blob raises also carries code and status attributes (the botocore
    Error.Code and HTTP status that _error_shape reads; "" and 0 when absent), because the adapter raises from None and
    no cause survives. LazyBlobStore gains a get_blob delegate. The module docstring's "imported only by the telemetry
    writer's bundle" becomes "by the telemetry writer's and the reader's bundles". No function here logs, returns or
    raises a key, URL, digest or exception message.
- file: src/common/ducklake_event_content.py
  action: Create
  purpose: >-
    PR B. The transcript_content verb's work after its registry SQL has resolved the row. It is imported
    function-locally by ducklake_event_reads, and nothing in ducklake_runtime's import closure imports it. It reads the
    stored rows for the exact grain key; zero rows answers zero rows. Duplicates that agree on every compared column
    (compared_versions 1) count as one; when they store one payload differently (one inline, one object, same digest),
    the inline row is served, so storage never flips between pages. Rows that differ under one grain key in any compared column, payload or not
    (compared_versions above 1; reachable through the concurrent-append race, Decision 207), raise
    BlobContentFault(500, "grain_conflict", "differing_rows") and never pick one: a catalog condition with its own
    error_type, so it is never counted as object corruption. Then by storage: (inline) the content column's UTF-8
    bytes; (object) store.get_blob(...); (omitted) no data, length 0 and the content_omitted_reason. An omitted row's
    content_bytes is the raw source size, not a stored length, so the caller stops on storage omitted. offset must be
    below content_bytes (an inline or object row) or 0, else EventReadInputError(param "offset"), which the handler
    answers 400 named_read_input. max_bytes is clamped to 1..MAX_CHUNK_BYTES (3,145,728). The single response row is
    exactly {storage, encoding "base64", offset, length, content_bytes, content_sha256, data, omitted_reason}. The data
    is standard base64, so a multi-byte character split at a chunk edge stays exact bytes. It never echoes content_uri or the bucket. The
    blob store is a module-level LazyBlobStore built on first object read from TELEMETRY_BLOB_ROOT, TELEMETRY_DATA_PATH
    and TELEMETRY_META_SCHEMA (no import-time work). With the root unset it raises BlobContentFault(500,
    "blob_misconfigured", "not_configured"); a root that BlobRoot.from_env refuses (DuckLakeRuntimeError) raises
    BlobContentFault(500, "blob_misconfigured", "root_invalid") instead of the reader's 500 runtime with its message.
    Inline and omitted rows are still served. A grant that did not apply surfaces as S3's 403, so it answers
    blob_integrity "forbidden_or_missing", not blob_misconfigured. Store errors map to
    BlobContentFault: BlobIntegrityError gives (500, "blob_integrity", its reason), "forbidden_or_missing" included;
    BlobStoreUnavailableError gives (503, "blob_unavailable", "store_unavailable"); BlobStoreAccessError gives (500,
    "blob_misconfigured", "store_access"). Each mapped fault copies the store error's code and status into its
    cause_code and cause_status. BlobContentFault subclasses ducklake_handler_errors.TypedFault. Each page
    re-resolves the row on the warm telemetry slot, so an 8 MiB object costs at most three catalog reads (Decision 88
    cl.1). Refusing a conflicted key, rather than serving one flagged version, is this verb's application of Decision
    207's reader rule: each page re-resolves the row, so any per-page choice between differing versions could splice
    two stored versions into one reassembled payload.
