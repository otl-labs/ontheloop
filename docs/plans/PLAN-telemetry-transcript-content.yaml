  action: >-
    Stale-reference sweep for the check PR A retires: it lives only under entries/deprecated/, its replacement exists,
    and no live shard or test names the old nodes or the old assertion.
  command: >-
    test ! -e config/agent/verification_registry/entries/telemetry-infra-pins.yaml && test -f
    config/agent/verification_registry/entries/deprecated/telemetry-infra-pins.yaml && test -f
    config/agent/verification_registry/entries/telemetry-reader-blob-grant-pins.yaml && ! grep -rqE --exclude-dir=__pycache__
    'test_reader_has_no_blob_grant|test_blob_root_only_on_the_writer|test_blob_root_guard_rejects_a_reader_root|test_reader_guard_rejects_a_blob_grant|assert_reader_has_no_blob_grant'
    config/agent/verification_registry/entries/*.yaml tests && echo SWEEP_OK
  expected: Exit 0 and SWEEP_OK.
  expected_literals: []
  fix_if: A live reference to an old node or the old assertion; move it to the replacement, never edit the deprecated copy.
