- step: 10
  phase: post-deploy
  action: >-
    PR A's Terraform applied through the guard with no gated route. Read the terraform-apply-sandbox run for PR A's merge
    commit with mcp__github__actions_list and save its jobs JSON to $TF_APPLY_JOBS_JSON.
  command: >-
    test -s "$TF_APPLY_JOBS_JSON" && bin/venv-python -c "import json,os;j=json.load(open(os.environ['TF_APPLY_JOBS_JSON']));jobs={x['name']:x.get('conclusion')
    for x in (j.get('jobs') if isinstance(j,dict) else j)};print(jobs);assert any(n.startswith('apply-sandbox') and c=='success'
    for n,c in jobs.items()),jobs;assert not any(n.startswith('gated-apply') and c=='success' for n,c in jobs.items()),jobs;print('TF_APPLY_OK')"
  expected: apply-sandbox concluded success, gated-apply did not apply, then TF_APPLY_OK.
  fix_if: >-
    A routed gated apply needs a human reviewer in GitHub Actions; say so to Benjamin once and wait. A red apply is fixed
    forward from its log; PR B never merges before this step passes.
  hermetic: false
- step: 11
  phase: post-deploy
  action: >-
    PR B's governed deploy succeeded, every job included. Read the deploy-ducklake-lambdas run for PR B's merge commit
    and save its jobs JSON to $DEPLOY_JOBS_JSON.
  command: >-
    test -s "$DEPLOY_JOBS_JSON" && bin/venv-python -c "import json,os;j=json.load(open(os.environ['DEPLOY_JOBS_JSON']));jobs={x['name']:x.get('conclusion')
    for x in (j.get('jobs') if isinstance(j,dict) else j)};print(jobs);want=['deploy-maintenance','maintenance-smoke','reconcile-gate','deploy-serving','smoke'];assert
    all(any(n.startswith(w) and c=='success' for n,c in jobs.items()) for w in want),jobs;print('DEPLOY_OK')"
  expected: Every named job concluded success (a skipped job fails this step), then DEPLOY_OK.
  fix_if: A failed or skipped job; read its log and fix forward, never re-run to green without a cause (Decision 55).
  hermetic: false
- step: 12
  phase: post-deploy
  action: The CI smoke job ran the read-back vector and every earlier blob vector. Save the smoke job's log to $SMOKE_LOG_FILE.
  command: >-
    test -s "$SMOKE_LOG_FILE" && for m in TELEMETRY_READS_OK TELEMETRY_BLOB_DELIVERED_OK TELEMETRY_BLOB_SIZE_MISMATCH_OK
    TELEMETRY_BLOB_READBACK_OK blob_read_ms=; do grep -q "$m" "$SMOKE_LOG_FILE" || { echo "missing $m"; exit 1; }; done
    && echo SMOKE_READBACK_OK
  expected: Every marker present, then SMOKE_READBACK_OK.
  fix_if: >-
    A missing marker: the gate names the vector that diverged. A blob_integrity forbidden_or_missing answer on a row the
    gate just delivered means the grant did not apply, and a blob_misconfigured answer means the environment variable did
    not; recheck step 10 in both cases.
  hermetic: false
- step: 13
  phase: post-deploy
  action: An independent live run of the telemetry gate from this session as PlatformDev, so the evidence does not rest on the CI log alone.
  command: >-
    DUCKLAKE_TELEMETRY_WRITER_URL=$(aws ssm get-parameter --profile agent_platform --region eu-west-2 --name
    /agent-platform/ducklake/telemetry_writer_url --query Parameter.Value --output text)
    DUCKLAKE_READER_URL=$(aws ssm get-parameter --profile agent_platform --region eu-west-2 --name
    /agent-platform/ducklake/reader_url --query Parameter.Value --output text) AWS_PROFILE=agent_platform bin/venv-python
    -m scripts.ducklake_neon_smoke_test --lambda-telemetry > "${TMPDIR:-/tmp}/telemetry_readback_gate.out" 2>&1 && grep -q
    TELEMETRY_BLOB_READBACK_OK "${TMPDIR:-/tmp}/telemetry_readback_gate.out" && echo LOCAL_READBACK_OK
  expected: Exit 0, then LOCAL_READBACK_OK.
  fix_if: A proxy block is an environment limit to report with its output, not a pass; any other failure is the reader's or the writer's.
  hermetic: false
- step: 14
  phase: post-deploy
  action: >-
    Between the serving deploy and the end of the CI smoke job (plus one minute for log delivery), no reader named_read
    answered 500, and none of the reader's own JSON log events carries an ARN, an account-shaped run, an s3:// URI or a
    telemetry-blobs key. The window is bounded so unrelated later reader traffic cannot decide the step. Platform lines (START, END, REPORT, INIT_START) are skipped,
    UUID tokens are stripped before the account-id match, and the gate's query_ops isolation probe (an expected 500) is
    excluded by action.
  command: >-
    test -s "$DEPLOY_JOBS_JSON" && bin/venv-python -c "import datetime as d,json,os,re,boto3;b=boto3.Session(profile_name='agent_platform',region_name='eu-west-2');jobs=json.load(open(os.environ['DEPLOY_JOBS_JSON']));jobs=jobs.get('jobs')
    if isinstance(jobs,dict) else jobs;t=d.datetime.fromisoformat([x['completed_at'] for x in jobs if x['name'].startswith('deploy-serving')][0].replace('Z','+00:00'));s=int(t.timestamp()*1000);u=d.datetime.fromisoformat([x['completed_at'] for x in jobs if x['name'].startswith('smoke')][0].replace('Z','+00:00'));e=int(u.timestamp()*1000)+60000;lg=b.client('logs');g='/aws/lambda/agent-platform-ducklake-reader';ev=[e['message'].strip()
    for pg in lg.get_paginator('filter_log_events').paginate(logGroupName=g,startTime=s,endTime=e) for e in pg['events']];nr='\"action\":\"named_read\"';mine=[m
    for m in ev if m.startswith('{') and ('\"event\":\"ducklake_typed_fault\"' in m or '\"event\":\"ducklake_named_read_input\"' in m or (nr
    in m and ('\"event\":\"ducklake_invocation\"' in m or '\"event\":\"ducklake_unmapped_error\"' in m)))];bad=[m for m in mine if
    '\"event\":\"ducklake_invocation\"' in m and '\"status\":500' in m];uu=re.compile(r'[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}');leak=[m
    for m in mine if re.search(r'arn:aws|(?<![0-9])[0-9]{12}(?![0-9])|s3://|telemetry-blobs/',uu.sub('',m))];print(len(ev),len(mine),len(bad),len(leak));assert
    mine,'no reader named_read events';assert not bad,'named_read 500s';assert not leak,'leak shapes';print('READER_LOGS_OK')"
  expected: >-
    Exit 0 and READER_LOGS_OK, with named_read events present (the read-back calls), zero named_read 500s and zero leak
    shapes in the reader's own events.
  fix_if: >-
    A leak-shape hit: find the line that emits it and remove the value, never the check. A named_read 500: read it
    first; blob_integrity means a stored object disagrees with its row, and grain_conflict means two stored rows differ
    under one grain key (Decision 207). The filters key on the compact JSON lines
    ducklake_metrics.log_invocation and ducklake_handler_errors print (event, action, status); the new typed-fault line
    must use the same compact separators.
  hermetic: false
- step: 15
  phase: post-deploy
  action: >-
    The bundled rec closed with the merge (Resolves: rec-4291 in PR B's squash body), and the follow-on recs carry this
    plan's notes. Read rec-4291, rec-4292 and rec-4025 with recs_by_ids and save the JSON to $RECS_JSON.
  command: >-
    test -s "$RECS_JSON" && bin/venv-python -c "import json,os;r={x['id']:x for x in json.load(open(os.environ['RECS_JSON']))['rows']};assert
    r['rec-4291']['status']=='closed',r['rec-4291']['status'];assert all('telemetry-transcript-content' in r[k]['context']
    for k in ('rec-4292','rec-4025'));print('RECS_OK')"
  expected: RECS_OK.
  fix_if: >-
    An open rec-4291 means its acceptance did not pass at the closing commit or the trailer was missing: rerun the
    acceptance, then close through the portal citing the merge commit.
  hermetic: false
- step: 16
