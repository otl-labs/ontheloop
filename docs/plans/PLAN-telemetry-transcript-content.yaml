constraints:
- >-
  The grant is exactly the one Benjamin approved (card cmsg_012XgaFy8VaDQbxP5D8nC958Y8PmcGbr4QEqpzyWc29unE, 2026-10-15):
  s3:GetObject on telemetry-blobs/<meta_schema>/* for the reader. No List, Put, Delete or GetObjectVersion; IfMatch on
  the HEAD's ETag replaces version pinning.
- >-
  No response, log line or error carries content_uri, the bucket, a key, a presigned URL, an exception message, an ARN
  or an account id (Decision 101). Error bodies name a reason from a closed set.
- >-
  No vector this plan adds elicits a 5xx. The reader gate's existing query_ops isolation probe answers an expected 500 on
  purpose (lambda_ec_gates.py), and step 14 excludes it by action. The reader has no paging alarm; adding one is
  rec-4292's, before production.
- >-
  PR A merges only after Benjamin answers the planning thread's card on the widened query_ops residual (cmsg_012XgaFy8VaDQbxP5D8nC958Qs8bbX8DKSdeYD1zPXNgdH). If he accepts
  it until slice 2c (the recommended option), the build proceeds as written. If he chooses to close it first, this plan
  is amended before PR A merges.
- >-
  PR B merges only after PR A's apply is green (IAM before code; terraform/CLAUDE.md). Both merge under the standing rule
  (code review PROCEED and green CI): the IAM change is Benjamin's approved grant, ducklake_reader.yaml is Class B and
  read-engine.yaml and ports.yaml are Class D, and there
  is no spend, Decision text or manual step. Act only on the final hand-back of each gate.
- >-
  The reader handler and tests/test_ducklake_reader_handler.py (494 SLOC) are not edited; typed faults reach the
  existing terminal() path.
- No rescue agents or workaround loops (Decision 55); a red apply, deploy or smoke job is fixed forward from its root cause.
context:
- >-
  Direction: Benjamin's "yes to all, write the plan" (2026-10-14) split get_blob into this plan, and his "Grant it" card
  choice (2026-10-15T16:41Z) approved the reader read grant. Blind consult: /mnt/project-files/telemetry-slice2b/fable-get-blob/.
- >-
  Why paging: blobs reach 8 MiB and the reader's buffered response is capped at 6,000,000 bytes (Python Lambdas cannot
  stream). Base64 avoids double-escaping blow-up and keeps a split multi-byte character exact; 3 MiB chunks give about
  4.19 MB on the wire, so the 8 MiB cap is three calls.
- >-
  Not adopted from the consult. A presigned GET URL: S3's native large-object primitive (Decision 100), but a bearer
  credential carrying the signing key id that moves the boundary out of the verb catalogue. 404 and 409 codes: an
  unknown key answers zero rows like every event verb, and differing rows under one key (rare, reachable through the
  concurrent-append race) are a 500 grain_conflict, a server-side catalog condition the caller cannot fix by changing
  its request. VersionId pinning: it needs s3:GetObjectVersion, beyond the approved
  grant, and IfMatch on the ETag gives the same guarantee. A config-gated describe: PR A applies before PR B deploys. A
  reader paging alarm: rec-4292 owns alarms before production. as_of: stored rows are immutable and the exact grain key
  selects them.
- >-
  Prior verification work this builds on: #1491 (blob route), #1503 (size-mismatch split, every stored blob row's
  content_bytes equals its object's length) and #1496 (reader verbs and the telemetry slot).
- >-
  Overlap: none with the decision notes build. The cache token totals build (#1514) edited ducklake_event_read_sql.py,
  ducklake_event_read_verbs.py, ducklake_reader_client.py and test_ducklake_event_read_verbs.py; it has merged, and this
  plan is rebased on it (ac06ced6).
- >-
  Decision-scout: FLAGS_FOUND. CITE 84, 88, 199, 207, 212, 213, 215, 126, 144, 176. NOTE 143: the widened query_ops
  residual names its owner and exit (rec-4292) and goes to Benjamin as a card. NOTE 100: the presigned-GET rejection
  cites it. Both resolved. RELATED 81, 91, 79, 125, 92, 216, 200, 184, 132, 181, 189, 201, 128, 118, 101, 48, 55.
  Decisions triaged: 171 of 171. Roadmap items intersected: 5; CONFLICT: 0; RELATED: 4.
- >-
  Registry provenance: three graduated checks are retired by git mv and replaced, the registry's own retirement path
  (the cloudtrail-read-only-no-write-verbs precedent). telemetry-infra-pins goes in PR A (two nodes assert the reader
  has no blob grant); telemetry-append-writer-edge and telemetry-blob-writer-edge go in PR B (one packaging node each
  asserts the writer alone bundles a module the reader now bundles). An in-place edit would change a graduated claim
  under an immutable check_id. The contract requires only the git mv. Earlier retirements also recorded a governance
  note in verification-registry.yaml, but that contract is Class A, and Class A text needs Benjamin's word under this
  project's rules; this plan, its commits and the replacements' plan_slug are the record instead.
- 'gates: decision-scout=FLAGS_FOUND (2 NOTEs, resolved); plan-critique=PROCEED (r4, after r1-r3 REVISE; r4 implementation notes folded in)'
