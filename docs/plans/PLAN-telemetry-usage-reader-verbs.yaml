      from scripts.checks.sloc.sloc_limits import validate_sloc_limits as c; f=[]; [x(f) for x in (b, c)];
      print('GUARD_FAILS', len(f)); assert not f, f" && bin/venv-python -m scripts.validate --pre && bin/venv-python -m scripts.validate
    expected: READ_ENGINE_FAILS 0 and GUARD_FAILS 0, then the fast tier and the full tier (Decision 163) each exit 0.
    fix_if: Fix the named contract or decompose the file per scope[0]; never raise a budget. Out-of-scope failures become recs (Decisions 59, 55).
    hermetic: false
    graduation: waive
    graduation_waiver_reason: 'vp-red-before.yaml recursion_refusal: a graduated step may not invoke scripts.validate; the full tier runs post-merge on main in every case.'
