    command: bin/venv-python -m pytest tests/common/test_ducklake_model_usage_rollup.py -q -rs
    expected: exit 0, every node passed, none skipped (a skip means duckdb is missing from the venv; install it, never accept the skip).
    fix_if: Fix the SQL or the oracle against the contract text in execution_steps[2]; never the test or a golden.
    hermetic: false
