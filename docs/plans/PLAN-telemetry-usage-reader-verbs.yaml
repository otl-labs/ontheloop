schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "telemetry-usage-reader-verbs"
intent: >-
  Make three telemetry usage questions answerable in one call each instead of a hand walk of session_tree_rows: how many
  tokens each model used per thread with sub-agents included (rec-4719), which tools and MCP servers sessions actually
  call (rec-4702), and what a session and each sub-agent pays on its first model call (rec-4703). Three agent-facing window
  verbs on the production telemetry reader return per-tree and per-session derived rows; a small CLI sums them across
  threads and walks ranges longer than seven days, failing closed.
plan_type: IMPLEMENTATION
implementation_declared: true
verification_tier: V3
plan_path: docs/plans/PLAN-telemetry-usage-reader-verbs.yaml
phase: >-
  Telemetry read layer, operator-requested (Benjamin 2026-10-29: rec-4719 at 15:38Z, cmsg_012XgaFy8VaDQbxP5D8nC9589WQCqz2rCrYCtuDZTSFGZF;
  rec-4702/rec-4703 queued at 12:44Z, cmsg_012XgaFy8VaDQbxP5D8nC958PyWqjtB1Uoh3NrpKEvsPwY; "write the plan" 18:51Z,
  cmsg_012XgaFy8VaDQbxP5D8nC9589VUV9ZgYRry5A7hoAxNTHF). Soft-warn category ad_hoc_rec: no tier_item criterion names
  these verbs (T3.14 is adjacent and deferred_post_mvp), so closes_criteria is empty.
closes_criteria: []
scope:
  - file: src/common/ducklake_event_read_sql.py
    action: Modify
    purpose: >-
      Three SQL templates composed with compose() (the shared R4 generations, R5a/R5b dedupe and R5c model_call collapse),
      plus one shared tree CTE block written once: MODEL_USAGE_ROLLUP_SQL, TOOL_USE_ROLLUP_SQL, STARTUP_BASELINE_SQL.
      Semantics in execution_steps[1]. SLOC budget: at most 120 added SLOC (349 today, so at most 469 of 500); the three
      templates share the one tree CTE block, so no rule is written twice. Over budget is a STOP and a plan amendment
      (implement-scope-boundary.yaml), never a budget raise (Decision 128).
  - file: src/common/ducklake_event_read_verbs.py
    action: Modify
    purpose: >-
      EVENT_READS gains model_usage_rollup, tool_use_rollup and session_startup_baseline: binding window, params
      (day_from, day_to), max_window_days MAX_WINDOW_DAYS, agent_facing true, not paginable, descriptions built with
      _derived_rows_note naming the grain and "one tree is the rows sharing the root's tenant, project and
      session_started_at" (no description may contain the word "excluded": test_describe.py pins that).
  - file: src/common/event_usage_fields.py
    action: Create
    purpose: >-
      Pure data, no imports, nothing that can raise at import: MODEL_USAGE_FIELDS, TOOL_USE_FIELDS and
      STARTUP_BASELINE_FIELDS, the three verbs' derived output columns in the SQL's order (execution_steps[1]) without
      the stamp columns. A separate module so ducklake_reader_client.py (431 of 500 SLOC) grows by about five lines.
  - file: src/common/ducklake_reader_client.py
    action: Modify
    purpose: >-
      VERB_FIELDS gains the three verbs as (*<tuple from event_usage_fields>, *_STAMP_FIELDS); the existing parity tests
      (test_verb_fields_parity.py, test_ducklake_event_read_verbs.py::test_verb_fields_match_event_verb_output_columns)
      then cover them. Bundled in data-pipeline (src/ wildcard) with the new module; no data-pipeline deploy is owed
      (infrastructure_dependencies).
  - file: scripts/telemetry_verify/derive_usage.py
    action: Create
    purpose: >-
      Independent oracle functions model_usage_rollup, tool_use_rollup and session_startup_baseline over deduped stored
      rows (pure Python, no SQL, written from the contract text in execution_steps[2], never from the SQL), signature
      (tables, projects, day_from, day_to) like derive.sessions_window, reusing dedupe.py and derive.py's helpers by
      import. Column names come from ducklake_reader_client.VERB_FIELDS as derive.py does, never by importing
      src.common.event_usage_fields (outside the oracle allowlist). A sibling, not derive.py (335 SLOC), so neither crosses 500; test_package_boundary.py scans it
      automatically (no reader SQL, duckdb or tests import).
  - file: scripts/telemetry_usage.py
    action: Create
    purpose: >-
      Agent CLI `bin/venv-python -m scripts.telemetry_usage {models|tools|startup} --from YYYY-MM-DD --to YYYY-MM-DD
      [--by-root] [--by-agent] [--max-windows N]` over scripts.telemetry_capture.read_route.TelemetryReader (PlatformDev profile via
      resolve_aws_profile; no committed URL, Decision 101). Behaviour in execution_steps[3]: <=7-day chunking, exact
      client-side sums, fail-closed, typed-413 halving, bounded and printed call count (Decision 88), JSON on stdout.
  - file: docs/contracts/ducklake_telemetry_reader.yaml
    action: Modify
    purpose: >-
      Class B, provisional_v0: one audit invariant giving the three verbs' grain, bounds, columns and conventions (text in
      execution_steps[2]) and one amendment_log entry (change_class field_add, semantic_break false). The served-set and
      paginable wording is unchanged (the served set is EVENT_READS minus transcript_content by construction).
  - file: docs/contracts/read-engine.yaml
    action: Modify
    purpose: >-
      The verbs grouping under telemetry_observations gains model_usage_rollup, tool_use_rollup and
      session_startup_baseline (validate_read_engine_verbs requires the grouping to equal NAMED_READS plus EVENT_READS by
      first table); one amendment_log entry.
  - file: scripts/ducklake_smoke/lambda_telemetry_reader_gates.py
    action: Modify
    purpose: >-
      _check_reads also reads the three verbs over the same two-day window: each answers 200 and every returned row's keys
      equal VERB_FIELDS[verb]; failure text names the verb and a status or error_type only (Decision 101).
  - file: tests/ducklake_neon_smoke_test/test_lambda_telemetry_reader_gates.py
    action: Modify
    purpose: >-
      New node test_reader_gate_reads_the_usage_verbs (wired fake: a 200 with matching rows passes, a non-200 or a row with
      a missing column fails naming the verb, no body echoed); test_happy_path_prints_the_fixed_line's pinned named_read
      verb sequence gains the three verbs after sessions_window.
  - file: tests/common/test_ducklake_model_usage_rollup.py
    action: Create
    purpose: rec-4719 acceptance (whole file). Nodes in execution_steps[4].
  - file: tests/common/test_ducklake_event_read_tool_usage.py
    action: Create
    purpose: rec-4702 acceptance node test_tool_use_counts_by_name_and_server_across_sessions plus the nodes in execution_steps[4].
  - file: tests/common/test_ducklake_event_read_startup_baseline.py
    action: Create
    purpose: rec-4703 acceptance node test_first_model_call_baseline_per_session_and_agent_run plus the nodes in execution_steps[4].
  - file: tests/test_telemetry_usage.py
    action: Create
    purpose: >-
      CLI behaviour over a fake reader (no duckdb, no network) and the registration node; nodes in execution_steps[4].
  - file: docs/contracts/file-router.yaml
    action: Modify
    purpose: >-
      Scope amendment (build discovery, coordinator-approved 2026-10-29): scripts/telemetry_usage.py is a depth-1
      scripts/ entry point, so validate_placement's scripts-root allowlist (RS-01) needs it in
      scripts_root_allowlist.allowed_files, plus the dated additive amendment_log entry (field_add, semantic_break false).
      Same as the scripts/telemetry_content.py precedent.
  - file: tests/test_event_usage_fields.py
    action: Create
    purpose: >-
      Scope amendment (build discovery, coordinator-approved 2026-10-29): direct coverage for src/common/event_usage_fields.py
      (the three column tuples are non-empty, duplicate-free and carry no stamp column).
bundled_recommendations:
  - rec-4719
  - rec-4702
  - rec-4703
followon_recs:
  - rec-4725
  - rec-4733
infrastructure_dependencies:
  - >-
    Lambda gating disposition (Decision 79): compute_affected_artifacts flags ducklake_telemetry_reader (the SQL and verbs
    modules; deployed by deploy-ducklake-lambdas.yml on the merge push, covered by VP 9-10) and data-pipeline (only through
    src/common/ducklake_reader_client.py and the new src/common/event_usage_fields.py, bundled by its src/ wildcard). No
    data-pipeline build, deploy or smoke step is owed: no data-pipeline handler reads VERB_FIELDS, and
    deploy-prod-lambdas.yml's push paths exclude both files (precedent PLAN-telemetry-verification-verbs,
    PLAN-telemetry-top-level-agent-run). No Terraform or IAM change.
acceptance_criteria:
  - "model_usage_rollup returns one row per (tree, model) whose totals equal the oracle's sums over the tree's root and sub-agent model_call rows after R4/R5 dedupe and R5c collapse, for every golden tree."
  - "tool_use_rollup counts each tool_call once per observation (open row), splits error, blocked and interrupted by the observation's current close, and groups by tree, root or sub-agent, agent_name, workflow, tool name, MCP server; it equals the oracle on every golden tree."
  - "session_startup_baseline returns one row per session of each tree with the earliest model_call's model and token classes (1h/5m split included), NULLs and model_call_count 0 for a session with no model_call; it equals the oracle on every golden tree."
  - "All three are agent-facing window verbs (max 7 days), served by the telemetry reader, listed in VERB_FIELDS and read-engine.yaml, and carry the Decision 207 stamps; non-real projects and trees outside the window are excluded."
  - "scripts.telemetry_usage chunks a range into <=7-day calls, sums exactly, halves a chunk on a typed 413 or 504, refuses more than --max-windows initial windows and more than 32 calls in all, and on any other failed chunk prints no total and exits 1 naming the failed window and error_type."
  - "Post-deploy: the governed deploy and the reader smoke gate are green and a live CLI run over a 9-day range answers per-model totals including claude-fable-5-1."
  - "rec-4719, rec-4702 and rec-4703 are closed; rec-4725 (the alarm) stays open."
