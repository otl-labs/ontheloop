    phase: post-deploy
    action: >-
      The merge's governed deploy redeployed the telemetry reader and its smoke gate passed (deploy-ducklake-lambdas.yml
      deploy-telemetry and telemetry-smoke jobs). No data-pipeline deploy is expected (infrastructure_dependencies). If the run shows
      a TELEMETRY_PRODUCTION_HOLD notice, the reader deploy was skipped: stop and report to the coordinator; steps 10-11
      wait until the hold clears and the reader is redeployed.
    command: >-
      Read the merge commit's deploy-ducklake-lambdas.yml run through mcp__github__actions_list (head_sha = the merge SHA)
      and mcp__github__get_job_logs for its deploy-telemetry and telemetry-smoke jobs.
    expected: The run concluded success, deploy-telemetry ran with no TELEMETRY_PRODUCTION_HOLD notice, and the telemetry-smoke log carries LAMBDA_TELEMETRY_READER OK.
    fix_if: A red smoke on a usage verb means the deployed SQL disagrees with production data; diagnose from the error_type and forward-fix (never break-glass).
    hermetic: false
  - step: 10
    phase: post-deploy
    action: The deployed reader describes the three verbs as agent-facing window verbs with a read_version.
    command: >-
      bin/venv-python -c "from scripts.telemetry_capture.read_route import TelemetryReader as R; d = R(profile='agent_platform').describe();
      v = ('model_usage_rollup', 'tool_use_rollup', 'session_startup_baseline');
      print(sorted((n, d[n]['agent_facing'], d[n]['max_window_days'], bool(d[n]['read_version'])) for n in v))"
    expected: "[('model_usage_rollup', True, 7, True), ('session_startup_baseline', True, 7, True), ('tool_use_rollup', True, 7, True)]"
    fix_if: A missing verb means the deploy carried the old bundle; re-check step 9.
    hermetic: false
  - step: 11
    phase: post-deploy
    action: >-
      Live answers over a 9-day range (two calls, so chunking is exercised): per-model totals name claude-fable-5-1 with
      non-null output tokens; tool use names the Artifact tool; the startup baseline has root and sub-agent rows.
    command: >-
      bin/venv-python -m scripts.telemetry_usage models --from 2026-10-21 --to 2026-10-29 > /tmp/usage-models.json &&
      bin/venv-python -m scripts.telemetry_usage tools --from 2026-10-21 --to 2026-10-29 > /tmp/usage-tools.json &&
      bin/venv-python -m scripts.telemetry_usage startup --from 2026-10-21 --to 2026-10-29 > /tmp/usage-startup.json &&
      bin/venv-python -c "import json; m = json.load(open('/tmp/usage-models.json')); t = json.load(open('/tmp/usage-tools.json'));
      s = json.load(open('/tmp/usage-startup.json')); print('calls', m['calls'], 'fable', any(r['model'] == 'claude-fable-5-1' and (r['tokens_output_total'] or 0) > 0 for r in m['rows']),
      'artifact', any(r['tool_name'] == 'Artifact' for r in t['rows']), 'kinds', sorted({r['is_root'] for r in s['rows']}))"
    expected: each command exits 0 with windows=2 on stderr; calls is 2, or more when a typed 413/504 halved a window (correct behaviour); fable True, artifact True, kinds [False, True].
    fix_if: A non-zero exit names the failed window and error_type; diagnose it, never retry into a partial total.
    hermetic: false
  - step: 12
    phase: post-deploy
    action: The bundled recs are closed and the follow-on stays open.
    command: >-
      bin/venv-python -c "from src.common.ducklake_reader_client import make_reader, fetch_recs_by_ids as f;
      rows, _ = f(make_reader(profile='agent_platform'), ['rec-4719', 'rec-4702', 'rec-4703', 'rec-4725']);
