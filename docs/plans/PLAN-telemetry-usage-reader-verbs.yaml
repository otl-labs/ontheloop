execution_steps:
  - >-
    Merge origin/main into the branch (force-push is refused in this environment). Re-read ducklake_telemetry_reader.yaml
    and read-engine.yaml, which the content reader build may have changed, before editing them.
  - >-
    SQL (src/common/ducklake_event_read_sql.py). Window scope as sessions_window; real-purpose projects only (the {projects}
    purpose = 'real' join). One shared CTE block, written once: tree = the deduped rows sharing (tenant_id, project_id,
    session_started_at); per session: is_root = parent_session_id IS NULL, workflow = the first non-null value by
    (event_timestamp, coalesce(source_ordinal, -1), event_id) (the _FIRST rule); per tree:
    root_session_id = min(session_id) over root sessions (NULL if none), roots_in_tree = their count, harness_session_key
    and branch = the root's first non-null values, tree stamps = generations (distinct producer/parser_version structs
    over the tree's sessions, ordered by producer then parser_version), conflicted_grain_keys (the tree's sessions' keys,
    ordered by table_name, producer, event_id, parser_version) and derivation_conflicted (any session conflicted). model_call rows are the R5c-collapsed o rows. A second,
    agents-only CTE, composed only into (b) and (c) (which compose the agents table): for a sub-agent session agent_name
    = the latest non-null telemetry_agents.agent_name of that session_id by the same ordering (NULL for a root). (a) does
    not compose agents and carries no agent_name.
    (a) MODEL_USAGE_ROLLUP_SQL over (observations, sessions): one row per (tree, model) with columns root_session_id,
    harness_session_key, branch, workflow (the root's), session_started_at, last_event_timestamp (tree max over s and o),
    roots_in_tree, model, session_count (sessions with a call on the model), model_call_count, tokens_input_total,
    tokens_output_total, tokens_cache_read_total, tokens_cache_creation_total, cache_creation_1h_total,
    cache_creation_5m_total, usage_missing_count (calls missing tokens_input or tokens_output), generations,
    conflicted_grain_keys, derivation_conflicted; each total NULL when no call carries that count (agent_run_token_rollup's
    rule); a NULL model is its own row; ORDER BY session_started_at, root_session_id, model NULLS LAST.
    (b) TOOL_USE_ROLLUP_SQL over (observations, sessions, agents): tool_call observations; one row per (tree, is_root,
    agent_name, workflow, tool_name, mcp_server, attribution_mcp_server) with columns root_session_id, harness_session_key,
    branch, session_started_at, roots_in_tree, is_root, agent_name, workflow, tool_name (name), mcp_server (the text
    between a leading mcp__ and the next __ of the name, NULL when there is no leading mcp__ or no second __), attribution_mcp_server (the open row's metadata key
    attribution_mcp_server, else NULL), call_count (distinct observation_id among open rows), error_count, blocked_count,
    interrupted_count (by each observation's current disposition: its latest close by event_timestamp, source_ordinal,
    event_id), session_count (distinct sessions with an open row), then the tree stamps; ORDER BY session_started_at,
    root_session_id, is_root DESC, agent_name NULLS FIRST, workflow, tool_name, mcp_server, attribution_mcp_server.
    (c) STARTUP_BASELINE_SQL over (observations, sessions, agents): one row per session of each tree with columns
    session_id, root_session_id, parent_session_id, is_root, harness_session_key, branch, workflow (the session's),
    agent_name, session_started_at, roots_in_tree, model_call_count, first_call_at, model, tokens_input, tokens_cache_read,
    tokens_cache_creation, cache_creation_1h_tokens, cache_creation_5m_tokens, tokens_output, usage_missing, then the
    session's own stamps (STAMPS_SELECT/STAMPS_JOIN); the first call is the earliest model_call by event_timestamp,
    coalesce(source_ordinal, -1), event_id; a session with no model_call has model_call_count 0 and NULL call columns;
    ORDER BY session_started_at, root_session_id, is_root DESC, session_id.
  - >-
    Contract text (docs/contracts/ducklake_telemetry_reader.yaml), appended to audit_invariants verbatim: "Usage verbs
    (PLAN-telemetry-usage-reader-verbs; rec-4719, rec-4702, rec-4703; agent-facing): model_usage_rollup, tool_use_rollup and
    session_startup_baseline take day_from and day_to over at most 7 UTC days and read real-purpose projects only. A tree is
    the R4/R5-deduped rows sharing one root's tenant_id, project_id and session_started_at (Decision 199 cl.2), so each row
    is a derivation over one tree's partition and the verbs never aggregate across trees (Decision 199 cl.1); callers sum
    rows across trees and windows. model_usage_rollup: one row per tree and model over the root and every sub-agent
    session's R5c-collapsed model_call rows, the four token classes and the 1h/5m creation split summed separately (NULL
    when no call carries a count), model_call_count, usage_missing_count and session_count. tool_use_rollup: one row per
    tree, root or sub-agent, agent_name, workflow, tool name, MCP server (the text between a leading mcp__ and the next __ of
    the tool name, NULL when the name has no leading mcp__ or no second __) and the open
    row's attribution_mcp_server metadata key, with call_count over open rows, error, blocked and interrupted counts by each
    call's latest close, and session_count. session_startup_baseline: one row per session of each tree with its earliest
    model_call (event_timestamp, source_ordinal, event_id) and that call's model and token classes, or model_call_count 0
    and NULLs. Every row carries root_session_id, roots_in_tree, harness_session_key and branch for the title join, and the
    Decision 207 stamps; for the two rollups they are tree-level: generations is the distinct (producer, parser_version)
    pairs over the tree's sessions ordered by producer then parser_version, conflicted_grain_keys is every tree session's
    conflicted keys ordered by table_name, producer, event_id, parser_version, and derivation_conflicted is true when any
    tree session is conflicted. No row carries content, cost or a single
    summed token total." amendment_log entry: date, semantic_break false, change_class field_add, summary naming the three
    verbs and recs, migration_story "New verbs only; no existing verb, payload or answer changes; describe lists three more
    agent-facing verbs." The oracle in scripts/telemetry_verify/derive_usage.py implements this text.
  - >-
    CLI (scripts/telemetry_usage.py). Split [from, to] into consecutive windows of at most 7 days; refuse a range needing more than
    --max-windows initial windows (default 9) before any call; halving adds calls under a separate fixed cap of 32 calls
    per invocation, past which the CLI fails closed; print "windows=<n>", each window and the final "calls=<n>" to
    stderr. Call the verb per
    window through TelemetryReader(profile resolved by scripts.aws_profile.resolve_aws_profile). On ResponseTooLargeError
    (413) or ReadDeadlineExceededError (504) halve that window and read the halves, down to 1 day, then fail (the
    contract's "narrow the window"; the same read is never resent). On any other error (ReaderInvokeError after the
    client's own transient retries, a resolve failure) print nothing to stdout and exit 1 with stderr "telemetry_usage FAIL window=<from>..<to>
    error_type=<type>" (no partial total, Decision 215). Output one JSON object on stdout: {verb, from, to, calls,
    conflicted_rows, rows}. models: rows per model with trees, sessions, model_call_count, the six token totals (NULL-aware
    sums), usage_missing_count and cache_read_ratio = cache_read / (input + cache_read + cache_creation), NULL when the
    denominator is NULL or 0; --by-root adds per-tree rows keyed by harness_session_key. tools: rows per (tool_name,
    mcp_server) with call, error, blocked, interrupted, session and tree counts (tree count = distinct tree keys; session_count
    is the sum over verb rows, so a session whose calls of one tool differ in attribution_mcp_server counts once per
    value: the --help text and the JSON key session_row_count say so); --by-root and --by-agent widen the key.
    startup: rows per (day of session_started_at, branch_prefix, is_root) with count and the median, p90 (nearest rank),
    min and max of the first-call input total (tokens_input + cache_read + cache_creation) plus the per-class medians.
    branch_prefix is literal: "claude/project-thread" for a branch starting claude/project-thread-, else the text before
    the first "/", else "(none)".
  - >-
    Tests. test_ducklake_model_usage_rollup.py: test_verb_matches_oracle_on_every_golden_tree (all corpus and verification
    trees loaded as in test_ducklake_event_verification_verbs.py; verb rows == derive_usage.model_usage_rollup rows);
    test_sub_agent_model_rows_sum_into_the_root_tree (a two-model tree: one row per model, sub-agent tokens counted in the
    root's tree); test_totals_are_null_when_no_call_reports_them; test_conflicted_grain_key_marks_the_tree (clone_row);
    test_non_real_projects_and_out_of_window_trees_are_excluded. test_ducklake_event_read_tool_usage.py:
    test_tool_use_counts_by_name_and_server_across_sessions (two trees, root and sub-agent calls, an mcp__github__ tool, an
    error close, and two open rows of the same tool name, one whose metadata carries attribution_mcp_server "github" and
    one without the key: one count per observation, the error split, the server segment, and the two attribution values
    ("github" and NULL) on separate rows; every committed golden stores the key as null, so only this case tells a wrong
    JSON path from a right one); test_verb_matches_oracle_on_every_golden_tree.
    test_ducklake_event_read_startup_baseline.py: test_first_model_call_baseline_per_session_and_agent_run (the earliest
    call wins over a later larger one, the 1h/5m split is carried, a sub-agent row carries its agent_name, a session with
    no call reads 0 and NULLs); test_verb_matches_oracle_on_every_golden_tree. test_telemetry_usage.py (fake reader):
    test_usage_verbs_are_registered_agent_facing_window_verbs (binding window, max_window_days 7, agent_facing, params
    day_from/day_to, VERB_FIELDS present), test_reader_contract_declares_the_usage_verbs (ducklake_telemetry_reader.yaml audit_invariants name all three verbs and the latest amendment_log entry is a field_add naming them), test_twenty_days_make_three_exact_chunks, test_chunk_sums_equal_a_single_window_sum,
    test_a_failed_chunk_prints_no_total_and_exits_1 (a 504 at the 1-day floor and a 503 after the client's transient retries; stderr names the window), test_413_and_504_halve_the_window,
    test_max_windows_refused_before_any_call, test_halving_past_the_call_cap_fails_closed, test_cache_read_ratio_null_on_zero_denominator, test_branch_prefix_literal, test_by_root_and_by_agent_widen_the_key.
    The smoke-gate node per scope.
  - Execute the Verification Plan -- run each pre-deploy step; loop until pass; on an unrecoverable V3 failure stop and RCA (Decision 55).
  - >-
    Commit flow (docs/contracts/git-ops.yaml): write the graduation registry entries for VP 2
    (telemetry-usage-verbs-registered) and VP 3 (telemetry-usage-cli-fails-closed) under
    config/agent/verification_registry/entries/; record VP 8's completed full-tier exit 0 as the handoff evidence (separate
    from the PR's CI verdict); push, open the PR, subscribe_pr_activity and end the turn (never poll); fix CI or review
    findings on the branch. Before merging, message the coordinator that the merge redeploys the telemetry reader through
    the governed channel and wait for its sequencing go-ahead. Squash-merge with "Resolves: rec-4719, rec-4702, rec-4703"
    in the body. Then run the post-deploy steps, and record rec-4703's narrowed scope in its closure note through
    update_rec (surface moved to rec-4713, alarm to rec-4725).
  - 'Report: what was implemented, verification results'
rollback: >-
  Revert the merge commit; the governed deploy redeploys the prior reader bundle. The verbs read only and store nothing, so
  no data needs repair.
