    action: The CLI fails closed on a failed chunk.
    command: bin/venv-python -m pytest tests/test_telemetry_usage.py::test_a_failed_chunk_prints_no_total_and_exits_1 -q
    expected: exit 0. Before the change the node does not exist.
    fix_if: Fix the CLI's error path; a partial total is never printed.
    hermetic: true
    expected_literals:
