  - step: 1
    phase: pre-deploy
    action: CLI behaviour and verb registration (no duckdb, no network).
    command: bin/venv-python -m pytest tests/test_telemetry_usage.py -q
    expected: exit 0 with every node passing. Before the change the file does not exist.
    fix_if: Fix scripts/telemetry_usage.py or the registry entries; never the test.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: Whole-file run of a test file this plan creates, always inside the --pre affected-test selection; step 2 graduates the registration node.
  - step: 2
    phase: pre-deploy
    action: The three verbs are registered as agent-facing 7-day window verbs and the serving contract declares them.
    command: >-
      bin/venv-python -m pytest tests/test_telemetry_usage.py::test_usage_verbs_are_registered_agent_facing_window_verbs
      tests/test_telemetry_usage.py::test_reader_contract_declares_the_usage_verbs -q
    expected: exit 0 with 2 passed. Before the change the nodes do not exist.
    fix_if: Fix the EVENT_READS entries or the contract text; never the test.
    hermetic: true
    expected_literals:
      - passed
    graduation: graduate
    graduation_check_id: telemetry-usage-verbs-registered
  - step: 3
