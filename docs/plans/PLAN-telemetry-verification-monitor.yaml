bundled_recommendations:
- rec-4025
- rec-4101
followon_recs:
- rec-4026
infrastructure_dependencies:
- >-
  No Terraform or IAM: agent-platform-github-ci-branch already invokes the reader Function URL and the ops writer
  (convergence-health files recs with it) and holds lambda:GetFunctionUrlConfig (the deploy smoke uses it).
- >-
  LAMBDA-DEPLOY DEFERRED (CD.16 / Decision 79), per-artifact reasoned disposition: docs/ROADMAP-PLATFORM.yaml is a
  data-pipeline asset; its zip refreshes at the next governed deploy, as PLAN-telemetry-blob-route's same disposition.
  No Lambda-packaged code changes.
- >-
  Residency: the job pulls real session-tree rows onto a GitHub-hosted runner. They are held in the job's memory only
  for the comparison, never written to disk or to an artifact, and the job prints counts only; the reader contract's
  session_tree_rows exception names the CI role's monitor as one of its verification callers (the verification verbs
  plan's text).
acceptance_criteria:
- >-
  Over the golden chain, the monitor reads every root that went quiet on quiet_day, reports rederivation agreement for
  every verb of its per-session set on every tree and window agreement for the read roots, and raises no rederivation,
  window, orphan or coverage class, its silent-check counts equal to what the corpus carries; each planted
  verb defect (the golden harness's tie-order and idle mutations on inputs selected by property, and a sessions_window
  mutation) is reported as rederivation_mismatch for its verb; a tree that grows at any point after the run-level calls
  is counted tree_moved and excluded from every comparison; a verb whose deployed stamp differs from the checkout at
  the start or the end of the run is verb_skew and never alarmed; quiet trees left unread by the budget, and window
  days whose root-session call failed, raise monitor_coverage_incomplete, and a run with --skip-trees set to the first
  run's next_skip reads the remainder; a run that compares no quiet tree raises it too; every call before the closing
  describe leaves the describe's worst case, so it always runs (a failed one ends the run incomplete); a failed tree
  read counts tree_read_failed and a failed per-session verb call counts session_verb_failed (apart from the cap's
  sessions_not_compared), each raising the coverage class and never ending the run; a tree above MAX_TREE_CALLS is
  tree_too_large and the trees after it are still read; a retired generation's
  row never reads as movement; orphans are counted for the read trees' start days and, over a week of runs, every
  window day (VP step 5).
- >-
  A planted orphan in a quiet tree is reported as orphan_quiescent for its join and alarmed; the same orphan inside the
  idle threshold is counted pending and not alarmed; an orphan the independent count finds and the verb does not is
  orphan_undercount; a rootless tree is reported as rootless_trees, never as a verb defect (VP step 6).
- >-
  Each silent-failure check reports its numerator and its parser_version 4 denominator, reports untested when the
  denominator is zero, and fires its class on a minimal planted row; checkout_sha_missing is reported and never filed
  (VP step 3).
- >-
  The completeness module joins on the harness session key (session_ and cse_ prefixes normalised) before classifying,
  judges a day only once it is two days old (the command refuses one before V4_FIRST_JUDGED_DAY, and lists that do
  not reach back to the judged day as lists_short), maps both raw list files and raises on a page without its row
  array, counts unjoinable, out-of-scope and keyless sessions separately,
  and alarms only on the listed rows keyless captures cannot explain (VP steps 4 and 7).
- >-
  Both commands print the pinned grammar only, never a session id, ref, branch or error body, exit by the stated
  contract, and their acceptance commands lint as decidable; the workflow runs daily under the ci-branch role with the
  masked account ID and URLs, the role assumed after setup, a 70-minute timeout, and no apply, deploy or dispatch
  step (VP steps 7 and 8).
- >-
  T3.20 c3 carries the dated re-grounding prefix and its original text whole, Decision 210 carries the dated Update
  naming the discharged rec-4101 residual and the over-28-day residual, and both contract notes name the verb-based
  monitor (VP step 9).
- >-
  After merge, a run dispatched for a quiet_day that held quiet trees completes green and prints one MONITOR line with
  trees_read of at least 1 (VP step 13); the coordinator's first completeness run prints one COMPLETENESS line with
  listed and listed_and_captured each at least 1 (VP step 14); rec-4025 and rec-4101 read closed, rec-4026's
  acceptance and context are narrowed, and the two follow-on recs exist (VP step 15).
verification_plan:
- step: 1
  phase: pre-deploy
  action: >-
    Precondition. The golden harness, verification verbs, in-session source check and producer fixes (parser_version 4)
    builds have merged and are on this branch, the verification verbs deploy is green (the deployed reader serves its verbs at the merged read_version),
    and the branch is on current main.
  command: >-
    git fetch origin main --quiet && git merge-base --is-ancestor origin/main HEAD && test -f
    scripts/telemetry_verify/derive.py && test -f scripts/telemetry_verify/orphans.py && test -f
    scripts/telemetry_verify/rows.py && test -f scripts/telemetry_verify/alarms.py && test -f
    scripts/telemetry_verify/compare.py && test -f scripts/telemetry_verify/stored_ledger.py && test -f
    scripts/telemetry_capture/verify.py && grep -q "session_tree_rows" src/common/ducklake_event_read_verbs.py && grep -q
    "telemetry_root_sessions" src/common/ducklake_event_read_verbs.py && grep -q "canonical_id: telemetry_verify"
    config/agent/data_quality/source_registry.yaml && grep -qE "^PARSER_VERSION = [4-9]" src/turn_capture/record_turn.py
    && AWS_PROFILE=agent_platform bin/venv-python -c "from src.common.ducklake_reader_client import make_reader;from
    src.common import ducklake_event_reads as ev;r=make_reader(profile='agent_platform');d=r._invoke({'action':'describe'})['verbs'];w=ev.describe_all();
    assert all(d[v]['read_version']==w[v]['read_version'] for v in ('session_tree_rows','telemetry_root_sessions','telemetry_orphan_counts'))"
    && echo PRECONDITION_OK
  expected: PRECONDITION_OK.
  fix_if: >-
    The ancestry test failing means main moved: rebase and re-run. A missing file or symbol means a sibling build has
    not merged, and a read_version mismatch means the verbs deploy is not live: stop and wait. A changed shape (a
    renamed helper, verb or private reader method) means escalate to the coordinator for a plan amendment.
  hermetic: false
  graduation: waive
  graduation_waiver_reason: >-
    A sequencing precondition on other plans' builds and deploy, not a behaviour of this change; as a standing guard
