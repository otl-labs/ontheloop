constraints:
- >-
  Alarm, not gate (Decision 210 cl.2): the workflow is never a required check, never applies, deploys or dispatches;
  a finding exits 0. Only a run that could not complete, or whose alarm filing failed, exits 1, which
  loop_liveness_stale's success leg backstops through the schedule.
- >-
  Counts only (Decision 101): the workflow's log, both commands' output and rec text carry counts, class names, verb
  names and join ids; no session id, entity ref, branch name, row value, transcript content, error body or URL host.
  The completeness lists are written only under /mnt/project-files (never the repository) and read only by the
  coordinator's run.
- >-
  Imports: the allow-list as the golden harness, verification verbs and in-session plans left it; the new modules add
  no direct import beyond the package's own modules and the standard library (monitor.py reaches the reader only
  through an injected named callable; __main__.py builds it from src.common.ducklake_reader_client, which the
  allow-list already names).
- >-
  Bounded reads (Decision 84 I-3, Decision 88 egress, Decision 215 cl.4 and its reader-invocations-doubled reversal
  condition). Event verbs are not paged: each call returns all its rows in one response, bounded by the reader's 413.
  Per run: two describe calls; telemetry_root_sessions over 28 days (28 calls at the default one-day window, four at
  seven); one-day telemetry_orphan_counts and sessions_window calls for the quiet trees' start days, plus four rotation
  days of telemetry_orphan_counts; per quiet tree its session_tree_rows pages, the per-session verb set for at most
  MAX_SESSIONS_PER_TREE = 6 sessions (the root and its first five child sessions by their open row's
  event_timestamp, then session_id; the rest counted sessions_not_compared, reported) and one one-row re-read.
  Time: the binding envelope is the CI role session, 3,600 s from the assume step (configure-aws-credentials' default
  duration; the role sets no max_session_duration), which the workflow runs after checkout and the venv install, so
  the session holds MONITOR_BUDGET_S = 2,000 of reads, FILING_RESERVE_S = 1,450 and a 150 s margin; timeout-minutes 70
  adds setup. CALL_WORST_CASE_S = 450 is one reader call's worst case (the client's _invoke: two 5xx attempts at the
  reader's 120 s timeout, its backoff, and a third attempt the client's 180 s request timeout ends without a retry).
  One start gate, checked before every reader call before the closing describe: the call starts only while two
  CALL_WORST_CASE_S of MONITOR_BUDGET_S remain (its own and the describe's), so the describe always runs and no read
  overruns the budget; a call that cannot start, and every call after it, is counted (run_level_days_unread,
  day_level_unread or not_read_budget), never a silent skip, and stops at MAX_READER_CALLS = 800 the same way. The
  tree phase therefore gets every second the run-level and day-level calls leave, minus the 900 s gate; each tree is
  self-contained (its read, its verbs and its re-read), so a stop between trees leaves nothing half-compared. Filing
  then runs inside FILING_RESERVE_S: one shared find_recs read (450 s at worst) and one idempotent file-or-update per
  class (an update being a rec_by_id reader read and a retried writer call, about 1,000 s at worst), so the reserve
  holds the read and one update at their worst cases; a run whose credentials or timeout end it mid-filing is a red
  run whose filed classes stand. A tree too large for one run (more than MAX_TREE_CALLS = 60 calls) is
  tree_too_large and passed, so one oversized tree never stops the trees after it or pins a backfill. Unread quiet
  trees, failed tree reads, failed per-session verb calls (session_verb_failed), oversized trees, unread days and a
  run that compared no quiet
  tree for any reason but verb_skew raise the alarm class monitor_coverage_incomplete; a dispatch for the same
  quiet_day with skip_trees set to the MONITOR line's next_skip reads the remainder in the same stable order. Every
  constant is a starting value that VP step 11's measurement sizes (planning-facts.md: a two-day sessions_window took
  103 s cold; the reader Lambda times out at 120 s). The MONITOR line carries reader_calls, run_level_s, elapsed_s,
  max_call_s and max_response_bytes; the closure report states the first runs' reader_calls, which with the
  in-session check's per-tree caps are the slice's reader budget; no fleet tripwire is claimed, because only the
  reader's own log_invocation lines count fleet invocations. If daily reader invocations reach Decision 215's
  reversal condition, MAX_READER_CALLS, MAX_SESSIONS_PER_TREE and the in-session caps are the levers. The smoke
  catalog only until slice 2c (rec-4292).
- >-
  Defaults decided with notice: cron '<minute> */24 * * *'; a 28-day window in one-day calls; MAX_SESSIONS_PER_TREE =
  6; RUN_LEVEL_WINDOW_DAYS = 1; MONITOR_BUDGET_S = 2,000; CALL_WORST_CASE_S = 450; FILING_RESERVE_S = 1,450;
  MAX_READER_CALLS = 800; MAX_TREE_CALLS = 60; the role assumed after setup; timeout-minutes 70; orphans re-counted daily for the read trees' start days and weekly for
  every window day; completeness judges the day two days back, never before V4_FIRST_JUDGED_DAY; the completeness
  fetch runs in the coordinator's session once a day (approved in step6b-presentation.md Q2), never as a routine;
  alarm priority High. The coverage residuals, one list carried verbatim by T3.20 c3's prefix and the coverage
  follow-on rec, (1) also in the Decision 210 Update and (6) and (7) in the two contract notes: (1) trees whose root started more than 28 days before their quiet day; (2) a quiet day whose scheduled
  run is dropped, until a dispatch backfills it; (3) a backfill's positional next_skip, where a tree entering or
  leaving the quiet set between a run and its backfill can shift trees out of both; (4) child sessions past the
  monitor's per-tree cap; (5) collided trees (roots_in_tree above 1); (6) a parent observation in another session of
  the same tree, which the tree-scoped verb does not flag; (7) which node a process_event parents to, since the verb
  checks only that a parent exists; (8) sessions the in-session source check never compares: no resume and fewer
  than 10 sent passes, past its three checks a day, above its page cap, producer_modified, or never settling.
  Accepted behaviours, not coverage gaps: a permanent orphan re-alarms on each run that re-counts its day until its
  tree ages out of the window; a session on a surface that writes no remote_session_change attachment (a local CLI)
  has no harness key and counts in harness_key_missing, which the rec text names as the first thing to check; a
  listed session that legitimately stores no row (no closed assistant turn yet, or capture without credentials) counts
  in unexplained_not_captured, which the rec text names as the first thing to rule out; a late row carrying an old
  event_timestamp that lands between a day's day-level calls and its tree's read reads as a window or orphan mismatch,
  which a dispatched re-run clears.
