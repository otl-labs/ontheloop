pre_implementation_checklist:
- Branch confirmed not on main and rebased on origin/main; VP step 1 passes
- docs/PROJECT_CONTEXT.md read
- Decisions 210 (cl.2 and Coverage), 62, 83, 181 (cl.1), 199, 205 (cl.3) and 215 read, only the cited clauses
- The golden harness, verification verbs and in-session source check modules read, and .github/workflows/convergence-health.yml and security-detector-liveness.yml read as precedents
- All files in scope located and readable
- Acceptance criteria understood and verifiable
execution_steps:
- >-
  Confirm VP step 1. Read scripts/telemetry_verify (derive, dedupe, orphans, rows, alarms), the three verbs' registry
  entries, .github/workflows/convergence-health.yml and security-detector-liveness.yml with
  tests/test_security_detector_liveness_workflow.py, config/ci_rca_taxonomy.yaml, the account-ID masking guard and
  scripts/checks/ci_guards/_workflow_shell_bodies.py.
- >-
  monitor.py (scope row) with injected named and describe callables. Per-session verb set: the root session gets
  session_state_and_duration (at as_of), session_process_event_rollup, session_friction_rollup and
  model_call_cost_estimate (one call each); each compared child session (the first MAX_SESSIONS_PER_TREE - 1 by
  their open row's event_timestamp, then session_id; every session of a tree shares the root's session_started_at
  pin) gets agent_run_state_and_duration (at as_of) and agent_run_token_rollup. A session whose stamps
  report a Decision 207 conflict compares the three stamps only. A tree with roots_in_tree above 1 is counted
  tree_collision and not compared; a page whose total_rows differs from page 1's, or a re-read that differs from
  the read, is tree_moved, read from the
  monitor's own wrapper of named() (which records each page's total_rows and roots_in_tree), never from read_tree's
  exception class. Orphans: orphan_quiescent:<join_id> is an alarm when the verb reports any quiescent orphan on a
  counted day; orphan_undercount:<join_id> is an alarm when the independent count over the read, unmoved quiet trees
  finds more orphans for a (day, join) than the verb reports; when the verb's trees_quiescent plus trees_pending for a
  day exceed the roots discovered for that day, the difference is rootless_trees (reported, never an alarm, never
  compared); conflicted_keys is reported per day. Window: the sessions_window rows for the read, unmoved roots compared
  with derive's window derivation over those roots (rederivation_mismatch:sessions_window on a difference). Skew:
  deployed_versions from the describe call at the start and the closing one after the last tree, each compared with
  describe_all() at the checkout. Then tests/telemetry_verify/test_monitor.py (VP step 5).
- >-
  silent_checks.py and tests/telemetry_verify/test_silent_checks.py (VP step 3), counts over rows with
  parser_version >= 4 only: harness_key_missing = root telemetry_sessions open rows with harness_session_key null over
  root open rows (alarm when the numerator is above 0); checkout_sha_missing = telemetry_sessions open and resume rows
  with checkout_sha null over those rows (reported only); background_notice_unknown = telemetry_agents close rows whose
  error is notice_status:absent, notice_status:malformed or notice_status:<token> for a token outside
  KNOWN_NOTICE_FAILURE_TOKENS = ("failed", "killed") over background close rows (alarm when above 0);
  resume_without_prior_close = root resume rows with no close row between the previous open or resume and the resume,
  for a segment holding at least one model_call, over root resume rows (alarm when above 0).
- >-
  completeness.py and tests/telemetry_verify/test_completeness.py (VP step 4). Inputs: the captured roots
  (telemetry_root_sessions over the judged day and one day on each side) and the two raw files the coordinator writes,
  thread_sessions.json (list_thread_sessions rows: session_id, created_at, last_activity_at; this project's by
  construction) and sessions.json (list_sessions rows, every page back to the judged day: id, created_at, updated_at
  and session_context.sources[].git_repository.url as the repository). Order: normalise every id to the suffix after
  "session_" or "cse_"; join each listed row created on the judged day with the captured roots by harness_session_key
  normalised the same way (a joined row is listed_and_captured whatever its other fields); then classify only the
  unjoined rows: a sessions row with no repository is listed_scope_unknown, one naming another repository is dropped as
  out of scope, an id that normalises to nothing is listed_unjoinable, and every other unjoined row is
  listed_not_captured. A captured root with a null key is captured_without_key and joins nothing; captured roots of
  the judged day that no listed row joins are captured_not_listed. The alarm counts unexplained_not_captured, the
  listed_not_captured rows beyond captured_without_key; the command refuses a judged day before V4_FIRST_JUDGED_DAY
  (status=before_v4), and compare_sessions itself takes any day. The judged day is at least two days old, so every
  session created on it has had at least one idle threshold to send its first rows. Procedure (the coordinator's,
  owned by the coverage follow-on rec): once a day, in the coordinator session (repository checkout and the
  agent_platform profile), call list_thread_sessions until no next_cursor remains and list_sessions until a page
  holds a row created before 00:00Z on the judged day or has_more is false (never a fixed span, never a since_ts filter
  on last_activity_at), write the raw results as
  thread_sessions.json and sessions.json (each a JSON array of the raw page responses in page order, exactly as the
  tools returned them, rows under "sessions" and under "ccr" then "data") under /mnt/project-files/telemetry-slice4/completeness/<day>/ and copy them to
  completeness/latest/, then run the completeness command with its defaults.
- >-
  __main__.py and tests/telemetry_verify/test_main.py (VP step 7). Pinned grammar, one line each, fields in this order:
  MONITOR quiet_day=<day> window=<day>..<day> roots=<n> quiet=<n> skip_trees=<n> trees_read=<n> tree_moved=<n>
  tree_collision=<n> tree_read_failed=<n> not_read_budget=<n> next_skip=<n> run_level_days_unread=<n>
  day_level_unread=<n> tree_too_large=<n> sessions_not_compared=<n> session_verb_failed=<n>
  verb_skew=<n> agree=<verb>:<agreeing>/<compared>,... window_agree=<agreeing>/<compared> orphan_days=<n>
  orphan_quiescent=<n>/<child_rows>
  orphan_pending=<n> orphan_undercount=<n>/<independent_child_rows> rootless_trees=<n> conflicted_keys=<n>
  silent=<check>:<numerator>/<denominator>,... reader_calls=<n> run_level_s=<n> elapsed_s=<n> max_call_s=<n>
  max_response_bytes=<n> alarms=<classes or none>; COMPLETENESS judged_day=<day> status=<completed, before_v4 or
  lists_short> listed=<n>
  listed_and_captured=<n> listed_not_captured=<n> unexplained_not_captured=<n> captured_not_listed=<n> listed_unjoinable=<n> listed_scope_unknown=<n> captured_without_key=<n> alarms=<classes or
  none>. --assert-zero denominators: rederivation_mismatch:<verb> the sessions compared for that verb;
  orphan_quiescent:<join_id> that join's child_rows over the counted days; orphan_undercount:<join_id> the
  independent child rows over the read trees; a silent check its denominator; monitor_coverage_incomplete (count
  not_read_budget plus tree_read_failed plus tree_too_large plus session_verb_failed plus run_level_days_unread plus
  day_level_unread, plus one when quiet trees
  exist and none was
  compared for any reason but verb_skew) the quiet trees of the day; completeness_listed_not_captured (count
  unexplained_not_captured) the in-scope listed rows of the judged day. next_skip is skip_trees plus the quiet trees
  before the first one that is not_read_budget, tree_read_failed or holds a session_verb_failed call for a transient
  cause (a 5xx or a timeout), or whose root started on a day_level_unread day or on or after the earliest
  run_level_days_unread day; tree_too_large trees and 413-caused failures, which a backfill would only repeat, are
  passed (still counted for the coverage alarm), never a stop; so a backfill re-reads every tree this run did not fully compare.
- >-
  tests/telemetry_verify/test_monitor.py: test_monitor_reports_rederivation_orphan_and_completeness_counts (every
  golden corpus tree loaded into one chain catalog, each under its own register_project project because most share
  one root ref and pin, with as_of past every tree's idle threshold: every verb agrees,
  window rows agree, orphan counts agree, no rederivation, window, orphan or coverage class is raised, and each
  silent check's numerator and denominator equal what the corpus carries (harness_key_missing counting the v4 root
  open rows of trees with no remote_session_change attachment, background_notice_unknown the corpus's unknown
  notices), so the filed classes are exactly those silent ones; a completeness run over a list fixture naming those roots'
  keys reports listed_and_captured equal to their count); test_monitor_reports_a_planted_verb_defect_by_verb (the
  golden harness's tie-order and idle mutations on the inputs that plan selects by property, a close-tie tree at pass
  final and an exact-threshold as_of on a non-terminal session, plus a sessions_window mutation, each reported as
  rederivation_mismatch for its verb); test_a_tree_that_grows_during_the_run_is_tree_moved (growth after the window
  calls as well as between the tree's read and its re-read); test_only_trees_that_went_quiet_on_the_quiet_day_are_read;
  test_budget_overflow_raises_the_coverage_alarm (MAX_READER_CALLS lowered, and separately a time-budget stop on a
  fake clock with non-zero per-call costs: the first run leaves trees unread and raises the class; a second run with --skip-trees at its next_skip
  reads the remainder, and the two runs' compared trees are the quiet set less its moved and collided trees); test_a_failed_run_level_day_is_unread_and_alarmed (a 413 or 5xx on one day's root-session call);
  test_orphan_days_are_the_read_trees_days_plus_the_weekly_rotation (seven consecutive quiet days count every window
  day at least once); test_a_skewed_verb_is_reported_never_alarmed (a stamp that differs at the start, and one that
  changes between the start and the closing describe); test_every_call_leaves_the_closing_describe_its_worst_case
  (a fake clock with non-zero per-call costs, a slow run-level phase included: no call starts without two worst cases
  left, and the closing describe runs); test_a_failed_tree_call_is_counted_never_ends_the_run (a 5xx on
  session_tree_rows and read_tree's final 413 count tree_read_failed (the 413 passed by next_skip, the 5xx a stop), an
  oversized tree costs no page call past the cap, a failed per-session verb counts
  session_verb_failed apart from the cap's sessions_not_compared, each raises monitor_coverage_incomplete and stops
  next_skip, a tree above MAX_TREE_CALLS is tree_too_large and the trees after it are still read, and the run
  completes); test_a_failed_closing_describe_ends_the_run_incomplete (exit 1, no
  filing); test_a_retired_generation_row_never_reads_as_moved (a tree holding a later row at a retired
  parser_version compares as unmoved); test_a_run_that_compares_no_quiet_tree_raises_the_coverage_alarm (every quiet
  tree moved or collided).
  The completeness leg of the first node requires at least one golden root carrying harness_session_key (the producer
  fixes corpus's session_provenance_facts case). Then tests/telemetry/test_parent_observation_orphan_monitor.py (VP step 6).
- >-
  First, file the two follow-on recs of constraints[5] through get_rec_write_guidance() and the portal (export their
  ids as RESULTS_REC and LIVENESS_REC; the coverage rec carries the residual list of constraints[4]); its id is the
  <coverage rec id> below. Then .github/workflows/telemetry-verification.yml, its taxonomy row, the step-body baseline
  entries (from scan_workflow_bodies()) and tests/test_telemetry_verification_workflow.py (VP step 8). Then the
  roadmap re-grounding of T3.20 c3: "[Re-grounded <build day>, PLAN-telemetry-verification-monitor:
  config/agent/data_quality/ops.yaml's DQ runner cannot read the telemetry tables (relationships checks SKIP on
  DuckLake; rec-4101). The orphan side is the reader's telemetry_orphan_counts verb over quiescent trees, covering
  every telemetry join of docs/contracts/_joins.yaml including turn-observation <-> transcript, alarmed daily by the
  telemetry-verification workflow under source telemetry_verify (alarm-not-gate); the coverage side (rows missing
  from the store, a transcript missing for its observation) is the in-session source check's missing_in_store and the
  completeness module's counts. Coverage residuals, owned by <coverage rec id>: <the residual list of
  constraints[4], verbatim>.]" before the original text; the Decision 210 dated Update naming <coverage rec id>; the
  two contract notes: in parent-observation-id.yaml, write_time_validation's clause becomes "the monitor is the
  reader's telemetry_orphan_counts verb, alarmed daily by the telemetry-verification workflow (rec-4101), with the
  reader registry's IDLE_THRESHOLD_SECONDS as its quiescence window; it matches a parent within the tree, so a parent
  in another session of the same tree is a residual owned by <coverage rec id>", and governance_notes' "That monitor
  does not exist yet -- relationships checks SKIP on the DuckLake backend today (scripts/data_quality_execute.py) and
  carry no session or quiescence scoping -- so this text names its owner, follow-on rec-4101, which also owns the
  quiescence window" becomes "That monitor is the reader's telemetry_orphan_counts verb over quiescent trees, alarmed
  daily by the telemetry-verification workflow (rec-4101, closed by PLAN-telemetry-verification-monitor), with the
  reader registry's IDLE_THRESHOLD_SECONDS as its quiescence window, because relationships checks SKIP on the DuckLake
  backend (scripts/data_quality_execute.py); it checks parent existence within the tree, and the same-session case is
  a residual owned by <coverage rec id>"; and telemetry_observations.yaml's phrase as its scope row states; then
  tests/checks/contracts/test_telemetry_verification_contracts.py (VP step 9), whose prefix node pins the residual
  list of constraints[4] item by item.
- Execute VP steps 1-12; loop until each passes.
- Code review (the code-review skill in a fresh context); fix every blocking finding.
- >-
  Closure (implement skill Commit Flows; docs/contracts/git-ops.yaml), each outcome reported separately: the readiness
