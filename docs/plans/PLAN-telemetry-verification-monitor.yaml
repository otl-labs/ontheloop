  follow-on recs were filed at the head of execution_steps[6]). Squash body: Resolves: rec-4025, rec-4101. Merge on code review PROCEED
  and green CI under the standing rule (no deploy, IAM, spend or contract field; the Decision change is a dated
  annotation in the Decision 207 precedent).
- >-
  After the merge: VP step 13 (dispatch the workflow), then the rec-4026 update in constraints[5]; hand the
  completeness procedure to the coordinator
  (send it the procedure of execution_steps[3] and the liveness rec id); run VP step 14 with it, then VP step 15.
- >-
  Report: what was implemented, each VP step's output (steps 11, 13, 14 and 15 verbatim), every alarm class the real
  runs raised and the rec it was filed as, the first runs' reader_calls against the Decision 215 baseline, and the two
