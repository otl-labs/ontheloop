schema_version: 5
implementation_declared: true
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: telemetry-verification-monitor
intent: >-
  Telemetry slice 4's closing plan (rec-4025): a daily verification monitor over the real captured sessions. A
  scheduled GitHub Actions job finds every real root tree of the trailing 28 days that went quiet during the previous
  UTC day, reads each one, re-derives every session-bound verb's answer independently from the stored rows and compares it
  with the deployed reader's (and the window verb's rows for those roots), alarms on orphans in quiescent trees
  (rec-4101; the read trees' start days daily, every window day weekly) and on any orphan the reader under-counts,
  alarms when it could not read every quiet tree, and runs the four stored-row silent-failure checks
  Benjamin asked for on 2026-10-17 (harness session key present, checkout facts present, background notice statuses
  known, every resumed segment closed). A completeness module, run by the project's coordinator with the harness
  session lists only it can fetch, counts sessions listed and captured, listed but not captured, and captured but not
  listed. Counts only in public logs; each alarm class files or updates one rec under telemetry_verify (Decision 210
  cl.2: alarm, not gate). Closes rec-4025 and rec-4101, re-grounds and closes T3.20 c3, re-points the contract notes
  that name rec-4101 as the monitor's owner, narrows rec-4026, and files the follow-on recs for a durable results
  table and for the verification coverage residuals.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-telemetry-verification-monitor.yaml
phase: >-
  rec-4025 (telemetry slice 4, verification): the fourth and last of its four plans (golden harness, verification
  verbs, in-session source check, verification monitor), approved by Benjamin's "write the plan" on 2026-10-17
  (cmsg_012XgaFy8VaDQbxP5D8nC958MdLJawKLhVPEQqyXDX82iS) on the approach in
  /mnt/project-files/telemetry-slice4/step6b-presentation.md (including its re-point of T3.20 c3 to the verb-based
  orphan monitor and the coordinator running the completeness fetch). Closes T3.20:c3 and rec-4025 (with rec-4101).
closes_criteria:
- T3.20:c3
scope:
- file: scripts/telemetry_verify/monitor.py
  action: Create
  purpose: >-
    run_monitor(named, describe, *, quiet_day, as_of, budget, skip_trees=0) returns a MonitorReport of counts, in the
    order of execution_steps[1], every call under the one start gate of constraints[3]: (1) describe, then
    telemetry_root_sessions over the trailing 28 days in RUN_LEVEL_WINDOW_DAYS-day calls (default 1, at most the
    verb's max_window_days of 7), a wider call that fails falling back to one-day calls; a day whose one-day call fails
    (a 413, or a timeout or 5xx after the client's own attempts) or cannot start is counted run_level_days_unread and
    its roots are unread; (2) the quiet set is every root whose tree-wide last_event_timestamp plus
    IDLE_THRESHOLD_SECONDS fell inside quiet_day (a UTC day; default the previous one), so each tree is read once after
    it goes quiet and again after any resume goes quiet, and run-start jitter leaves no gap; quiet trees are taken in a
    stable order (root session_started_at, then session_id, never printed), the first skip_trees of them skipped; (3)
    the day-level calls, one day a call, before any tree is read: telemetry_orphan_counts and sessions_window for each
    distinct start day of the quiet trees to be read, and telemetry_orphan_counts for the window days a whole number
    of weeks before quiet_day (four of the 28, so every window day is re-counted weekly); a day-level call that fails
    or cannot start counts that day in day_level_unread; (4) per quiet tree, self-contained: rows.read_tree, the
    per-session verb set of execution_steps[1] for at most MAX_SESSIONS_PER_TREE sessions compared column by column
    with scripts.telemetry_verify.derive at the same as_of, then one one-row re-read of the tree; the tree is tree_moved
    and excluded from every comparison when the re-read's total_rows or roots_in_tree differs from its read, or when
    its newest event_timestamp over its live rows (dedupe's retire and collapse across the four tables, the basis the
    root-sessions verb computes last_event_timestamp on, so a retired generation's row never reads as movement)
    differs from its run-level last_event_timestamp; a tree whose session_tree_rows read or re-read fails after the
    client's attempts (read_tree's final 413 included) is tree_read_failed, a tree the start gate stops before its
    re-read is not_read_budget, and a tree that would need more than MAX_TREE_CALLS = 60 reader calls is
    tree_too_large, judged from page 1's total_rows (its page count, plus the re-read, plus its at most 14 verb calls)
    before any further page is read, the monitor's named() wrapper refusing any page call beyond the cap, all
    uncompared; a per-session verb call that fails
    after the client's attempts (its 413 included) counts session_verb_failed, apart from the cap's
    sessions_not_compared, and that session is left out of the verb's compared count; no tree-phase failure ends the
    run; (5) describe again: a verb whose deployed
    read_version at the start or at the end differs from the checkout's describe_all() is verb_skew, reported, its
    comparisons skipped, never an alarm, and a describe that fails ends the run as not completed, filing nothing,
    because skew is then unknown; (6) the window and orphan comparisons over the unmoved, re-read trees whose start
    day was not day_level_unread; (7) silent_checks over the compared trees that are neither moved nor collided.
    Counts, class names, verb names and join ids only.
- file: scripts/telemetry_verify/monitor_compare.py
  action: Create
  purpose: >-
    The monitor's pure comparisons over plain rows and verb answers: compare_session(verb, deployed_row, derived_row)
    (column by column, stamps only for a conflicted session), compare_window(deployed_rows, derived_rows, roots) and
    compare_orphans(verb_counts, independent_counts, discovered_roots_by_day) returning the agreement, mismatch,
    undercount and rootless counts monitor.py prints. No I/O.
- file: scripts/telemetry_verify/silent_checks.py
  action: Create
  purpose: >-
    The four stored-row silent-failure checks of execution_steps[2], pure over each tree's live generation (the rows
    scripts.telemetry_verify.dedupe keeps, so a later generation never double-counts), each reporting a numerator and
    its denominator (live rows at parser_version 4 or later, the producer fixes plan's first version), and untested
    when the denominator is zero, never green: harness_key_missing (alarm), checkout_sha_missing (report
    only, never filed), background_notice_unknown (alarm) and resume_without_prior_close (alarm). Columns read by name
    from row dicts; a column absent from a row counts toward untested.
- file: scripts/telemetry_verify/completeness.py
  action: Create
  purpose: >-
    compare_sessions(captured_roots, listed, *, judged_day) per execution_steps[3]: counts listed_and_captured,
    listed_not_captured, captured_not_listed (the lists' blind spot: counted, never an alarm), listed_unjoinable,
    listed_scope_unknown and captured_without_key, and unexplained_not_captured = max(0, listed_not_captured -
    captured_without_key), the count the alarm class completeness_listed_not_captured carries (a keyless capture can be
    any unjoined listed row, and harness_key_missing already alarms on keyless captures). Pure: it takes any judged
    day, so tests run it on the golden corpus's 2026-01-01 roots. V4_FIRST_JUDGED_DAY, a module constant the command
    enforces (scope row __main__.py), is the first UTC day after the day the producer fixes build's PARSER_VERSION 4
    commit reached main, pinned at build time from git log once VP step 1 passes, because a session created before
    that merge runs the parser_version 3 producer and writes no key. load_lists(directory) reads the coordinator's two
    raw files, each a JSON array of the raw page responses in page order: thread_sessions.json pages carry their rows
    under "sessions" (list_thread_sessions: session_id, created_at, last_activity_at) and sessions.json pages under
    "ccr" then "data" (list_sessions: id, created_at, updated_at, session_context.sources[].git_repository.url); a page
    without its recognised row array, or a file that is not such an array, raises, so a misread list never reads as an
    empty day. load_lists also keeps each file's last-page marker (next_cursor, has_more) and lists_cover(lists,
    judged_day) is true only when thread_sessions.json reached its last page (no next_cursor; the project's roster is
    bounded, so it is fetched whole) and sessions.json either reached its last page (has_more false) or holds a row
    created before 00:00Z on the judged day (list_sessions pages run newest first); the command refuses a run whose
    lists do not cover the judged day with status=lists_short, exit 1, nothing filed. Pure apart from that read.
- file: scripts/telemetry_verify/__main__.py
  action: Create
  purpose: >-
    `python -m scripts.telemetry_verify monitor [--quiet-day YYYY-MM-DD] [--skip-trees N] [--no-alarms]
    [--assert-zero <class>]` (quiet_day default the previous UTC day, validated within the last 28 days; skip_trees a
    non-negative integer, default 0, for a backfill that finishes what a budget-limited run left; as_of now) and
    `python -m scripts.telemetry_verify completeness [--lists-dir DIR] [--judged-day YYYY-MM-DD] [--no-alarms]
    [--assert-zero <class>]` (lists-dir default /mnt/project-files/telemetry-slice4/completeness/latest; judged-day
    default two UTC days ago, so every session of that day is at least one idle threshold old; a judged day before
    completeness.V4_FIRST_JUDGED_DAY prints the COMPLETENESS line with status=before_v4, files nothing and exits 2).
    Each prints one line in the grammar of execution_steps[4] (never a row value, session id, ref or branch, because
    the monitor's output lands in public Actions logs). Alarm classes go to scripts.telemetry_verify.alarms.raise_alarms
    (the verification verbs plan's helper) with scope the run's window, alarm_at None, declared the report-only classes,
    rows one scripts.rec_episode.find_recs read of the open telemetry_verify recs shared by every class, file this
    module and acceptance_for(class) the same command with its defaults and --no-alarms --assert-zero <class>
    (static, lint-valid, no literal day). Filing runs after the reads inside the role session's FILING_RESERVE_S share
    (constraints[3]); a job the timeout ends is a red run, and every class already filed stands,
    because each filing is one idempotent file-or-update. Exit 0 when the run completed (whatever the findings); 1 when it did not complete (a failed
    describe or list read included, and a completeness run refused as lists_short) or an alarm filing failed (Decision 84 I-4), printing only the error's class and
    HTTP status, never its message (a reader error body or a URL host); with --assert-zero, 0 only after a completed
    run whose class denominator (execution_steps[4]) is above zero and whose class count is zero, else 2. All logging
    is disabled for the run (logging.disable), because the reader client's and the writer transport's warnings can
    carry an ARN or a Function URL host.
- file: scripts/telemetry_verify/__init__.py
  action: Modify
  purpose: Facade re-exports monitor, monitor_compare, silent_checks and completeness' public surface.
- file: .github/workflows/telemetry-verification.yml
  action: Create
  purpose: >-
    name telemetry-verification (the taxonomy key). A daily cron in the every-N-hours shape ('<minute> */24 * * *', a
    minute no other schedule uses), which scripts/convergence_health/sensor_liveness.py's cron_period_seconds classifies
    as 86,400 s (it raises on the plain 'M H * * *' daily shape, which would blind loop_liveness_stale for every peer),
    plus workflow_dispatch with two optional inputs, quiet_day and skip_trees, passed through env and validated by
    argparse, never inlined into a run body; dispatch runs only on main. One job, timeout-minutes 70 (setup of at
    most ten minutes plus the role session of constraints[3]), permissions contents read and id-token write,
    concurrency group telemetry-verification (no cancel); the steps run checkout and the venv install first, then
    assume agent-platform-github-ci-branch (its 3,600 s session starts there, after setup) with the account-ID masking
    pattern (PLAN-actions-account-id-masking's guard), resolve and mask the reader and writer Function URLs exactly as
    deploy-ducklake-lambdas' smoke job does, masking each URL's bare host as well, then run the monitor command. No apply,
    no deploy, no dispatch of another workflow, never a required check (Decision 83).
- file: config/ci_rca_taxonomy.yaml
  action: Modify
  purpose: >-
    telemetry-verification: tier not_a_gate, ci_rca excluded, owner platform, rationale: it files its own
    telemetry_verify recs, and its schedule puts it under loop_liveness_stale, which backstops a persistent red (the
    security-detector-liveness precedent).
