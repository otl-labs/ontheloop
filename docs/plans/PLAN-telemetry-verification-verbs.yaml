  the governed deploy-ducklake-lambdas run on the merge commit redeploys them and runs their smoke gates; VP steps 13
  and 14 assert the run and the new verbs' read_version. The regenerated projection widens two registry-sourced
  accepted_values lists by one value and adds telemetry_joins, which only the reader reads; no other rule moves. Only
  the reader gains behaviour. No Terraform or IAM: the reader's existing grants read the telemetry catalog, and
  agent-platform-github-ci-branch already invokes the reader and telemetry writer Function URLs and holds
  lambda:GetFunctionUrlConfig (the deploy smoke job uses exactly these).
- >-
  New workflow (not a deploy): telemetry-golden-replay runs after every successful deploy-ducklake-lambdas run on main
  and once a day, writing only synthetic-project rows to the smoke catalog through the deployed writer. Budget: about
  18 tree-passes, each one registration, a few appends, one tree read and up to six verb calls, so on the order of 150
  reader invocations per run and one or two runs a day; GOLDEN_SMOKE reports the call counts, elapsed seconds and the
  largest response, against the job's 30-minute limit and Decision 215's reader-invocations-doubled baseline (the
  closure report states the measured run against that baseline). Residual: each run adds its rows and small files to
  the smoke catalog's 2026-01-01 partition (the corpus timestamps), which the smoke merge does not cover, so reads of
  the telemetry tables there slow as runs accumulate; rec-4411 owns bounding it (trigger: elapsed_s doubling, or a
  data-file threshold), tied to T2.36 c5 and rec-4292.
- >-
  LAMBDA-DEPLOY DEFERRED (CD.16 / Decision 79), per-artifact reasoned disposition: compute_affected_artifacts flags
  data-pipeline through src/common/ducklake_reader_client.py (bundled by its src/ wildcard). No build, deploy or smoke
  test is owed: no data-pipeline handler reads VERB_FIELDS and deploy-prod-lambdas.yml's path triggers exclude the file;
  the same disposition as PLAN-telemetry-reader-verbs and PLAN-telemetry-cache-token-totals.
acceptance_criteria:
- >-
  On every producer golden tree and verification tree loaded through the golden chain, session_tree_rows returns exactly
  the tree's stored rows (every grain key once per stored row, the compared columns plus created_timestamp, never
  content or content_uri), pages reassemble to the same set at any max_rows, total_rows is the tree's row count on
  every page, roots_in_tree is 1 for every tree that stores a row, and an absent or zero-row session answers no rows;
  two co-pinned trees in different projects of
  one catalog stay apart, and two co-pinned roots in one project report roots_in_tree 2 (VP step 3).
- >-
  telemetry_orphan_counts equals scripts.telemetry_verify.orphans over the same rows, reports zero orphans on every
  finalized golden tree, keeps co-pinned trees of different projects apart, and splits a planted orphan into pending
  and quiescent by as_of exactly at and past the idle threshold; the projected telemetry_joins equal the contract's
  telemetry joins as the golden harness's loader reads them (VP step 4).
- >-
  telemetry_root_sessions returns one row per root session of a real-purpose project in the window, with entity_ref,
  harness_session_key (null for a tree written before parser_version 4), branch and the three Decision 207 stamps, a
  conflicted root reported in its stamps, and excludes synthetic and drill projects (VP step 5).
- >-
  The tree binding validates and clamps max_rows and offset, the described non-agent-facing set gains the three verbs,
  importing the registry reads no file, and the orphan verb's stamp moves with a projected join (VP step 6); no
  pre-existing verb's read_version differs from its origin/main value (VP step 18).
- >-
  The golden replay registers one synthetic project per tree and pass, never imports tests/, asserts the sent set and
  every session-bound expectation through the reader, counts window-verb expectations and seam cases as skipped,
  prints counts only, and files one alarm per mismatched verb or one error alarm for a run that could not complete,
  naming only the tree and verb or the failure class (VP step 7); the reader smoke covers the three verbs with
  counts-only failure text (VP step 8); the workflow runs after every successful deploy and daily, never on push,
  under the ci-branch role, and never applies, deploys or dispatches (VP step 9).
- >-
  telemetry_verify is a registered rec source carried by both registry-sourced accepted_values lists and scanned by
  check_source_registry; the alarm helper files or updates one rec per class, never closes, rate-limits each class by
  the caller's own map and never files a declared class (VP step 2).
- >-
  ducklake_reader.yaml names the three verbs and the second raw-row exception, read-engine.yaml groups them, and
  VERB_FIELDS equals each verb's output columns (VP steps 10 and 3).
- >-
  After the governed deploy of the merge commit: every deploy and smoke job is green and the deployed describe and a
  live named_read stamp the merged read_version for each new verb (VP steps 13 and 14); the golden replay run for the
  merge commit prints GOLDEN_SMOKE with mismatches=0 (VP step 15); session_tree_rows over the implementing session's own
  captured tree returns root-session rows whose per-table counts equal the writer's telemetry_probe grain counts for
  its root session ref (VP step 16); rec-4025 and rec-4101 carry this plan's notes (VP step 17).
verification_plan:
- step: 1
  phase: pre-deploy
  action: >-
    Precondition. The golden harness build (PLAN-telemetry-golden-harness) and the column additions build
    (PLAN-telemetry-column-additions) are merged and on this branch, and the branch is on current main.
  command: >-
    git fetch origin main --quiet && git merge-base --is-ancestor origin/main HEAD && test -f
    scripts/telemetry_verify/derive.py && test -f scripts/telemetry_verify/joins.py && test -f
    tests/fixtures/telemetry_golden_chain.py && test -f tests/telemetry/fixtures/derived_golden_state.yaml && test -f
    tests/telemetry/fixtures/derived_golden_rollups.yaml && grep -q "def compose" src/common/ducklake_event_read_sql.py &&
    grep -q "harness_session_key" docs/contracts/telemetry_sessions.yaml && echo PRECONDITION_OK
  expected: PRECONDITION_OK.
  fix_if: >-
    The ancestry test failing means main moved: rebase onto origin/main and re-run. A missing harness file means the
    golden harness build has not merged, and an absent harness_session_key means PLAN-telemetry-column-additions' build
    has not merged: stop and wait (its governed deploy must also be green before this build merges; the sequencing
    context line). A changed shape (a renamed helper or file) means escalate to the coordinator for a plan amendment,
    never adapt the scope inline.
  hermetic: false
  graduation: waive
  graduation_waiver_reason: >-
    A sequencing precondition on another plan's build, not a behaviour of this change; as a standing guard it would only
    re-assert that those files exist.
- step: 2
  phase: pre-deploy
  action: The verification library modules (orphans, rows, alarms), the alarm source registration and the boundary.
  command: >-
    bin/venv-python -m pytest tests/telemetry_verify/test_orphans.py::test_orphans_split_by_quiescence
    tests/telemetry_verify/test_orphans.py::test_co_pinned_trees_in_two_projects_stay_apart
    tests/telemetry_verify/test_orphans.py::test_finalized_golden_trees_have_no_orphans
    tests/telemetry_verify/test_rows.py::test_pages_reassemble_to_every_row_once
    tests/telemetry_verify/test_rows.py::test_a_moving_total_raises
    tests/telemetry_verify/test_rows.py::test_a_413_halves_the_page_until_it_fits
    tests/telemetry_verify/test_alarms.py::test_one_episode_per_alarm_class
    tests/telemetry_verify/test_alarms.py::test_declared_classes_are_counted_never_filed
    tests/telemetry_verify/test_alarms.py::test_a_class_is_rate_limited_by_the_callers_map
    tests/telemetry_verify/test_alarms.py::test_rec_text_carries_counts_classes_and_scope_only
    tests/telemetry_verify/test_alarms.py::test_telemetry_verify_source_is_registered_and_projected
    tests/telemetry_verify/test_package_boundary.py::test_oracle_has_no_direct_reader_sql_duckdb_streams_or_tests_import
    tests/checks/ops_governance/test_check_source_registry.py::TestScannedPaths::test_scanned_paths_includes_portal_and_producer_modules -q
  expected: >-
    Exit 0, all thirteen nodes pass. The first eleven are red before because they are absent; the last is red before
    because SCANNED_PATHS lacks scripts/telemetry_verify/alarms.py.
  expected_literals: []
  fix_if: >-
    An orphan on a finalized golden tree is a producer or oracle defect: decide from _joins.yaml which, file a producer
    defect through the portal, fix an oracle defect here. A boundary failure means a forbidden direct import; the
    allow-list gains exactly scripts.rec_episode and nothing else. A
    source missing from field_semantics.yaml means the projection was not regenerated; regenerate it, never hand-edit it.
    A close call from alarms means one green was read as global; remove it.
  hermetic: true
  graduation: graduate
  graduation_check_id: telemetry-verify-orphans-rows-and-alarms
- step: 3
  phase: pre-deploy
  action: The tree verb returns exactly the stored rows of one tree key, pages cleanly, and VERB_FIELDS matches every verb.
  command: >-
    bin/venv-python -m pytest
    tests/common/test_ducklake_event_verification_verbs.py::test_tree_rows_return_every_stored_row_exactly_once
    tests/common/test_ducklake_event_verification_verbs.py::test_tree_rows_page_to_the_same_set_at_any_page_size
    tests/common/test_ducklake_event_verification_verbs.py::test_co_pinned_trees_stay_apart_and_collisions_are_counted
    tests/common/test_ducklake_event_read_verbs.py::test_verb_fields_match_event_verb_output_columns -q
  expected: Exit 0. The first three are red before because they are absent; the last is red before the fixture change.
  fix_if: >-
    A missing or duplicated row means the tree key or a table branch is wrong; a page set that differs by page size
    means the order is not total; a co-pinned tree of another project in the answer means the key lacks tenant or
    project; fix the SQL. Never relax the exact-set comparison.
  hermetic: false
  graduation: graduate
  graduation_check_id: telemetry-tree-rows-verb-exact
- step: 4
  phase: pre-deploy
  action: The orphan verb agrees with the independent count, and the joins come from the contract through the projection.
  command: >-
    bin/venv-python -m pytest
    tests/common/test_ducklake_event_verification_verbs.py::test_orphan_counts_match_the_independent_count
    tests/test_field_semantics_telemetry_joins.py::test_telemetry_joins_projected_from_the_contract
    tests/common/test_ducklake_event_reads.py::test_telemetry_joins_come_from_the_projection -q && bin/venv-python -m
    scripts.schema_to_field_semantics --check
  expected: Exit 0 from both. The three nodes are red before because they are absent.
  fix_if: >-
    A disagreement decides from _joins.yaml and the quiescence rule which side is wrong; a SQL defect is fixed here, an
    oracle defect in orphans.py. Projection drift means regenerate, never hand-edit.
  hermetic: false
  graduation: graduate
  graduation_check_id: telemetry-orphan-counts-verb-agrees
- step: 5
  phase: pre-deploy
  action: The root-sessions verb returns the join keys and stamps for real-purpose roots only.
  command: >-
    bin/venv-python -m pytest
    tests/common/test_ducklake_event_verification_verbs.py::test_root_sessions_carry_join_keys_and_stamps_for_real_projects_only
    -q
  expected: Exit 0. Red before because the node is absent.
  fix_if: >-
    A synthetic or drill root in the answer means the purpose join is missing; a child row means the root filter is; a
    conflicted root with empty stamps means the stamp CTEs are not joined.
  hermetic: false
  graduation: graduate
  graduation_check_id: telemetry-root-sessions-verb
- step: 6
  phase: pre-deploy
  action: The tree binding and max_rows validation; the described audience set; existing read_versions unchanged.
  command: >-
    bin/venv-python -m pytest tests/common/test_ducklake_event_reads.py::test_tree_binding_validates_and_clamps_max_rows
    tests/common/test_ducklake_event_reads.py::test_event_verbs_are_described_with_their_class_bounds_and_audience
    tests/common/test_ducklake_event_reads.py::test_read_version_moves_with_every_datum_sql_and_column
    tests/common/test_ducklake_event_reads.py::test_orphan_read_version_moves_with_a_projected_join
    tests/common/test_ducklake_event_reads.py::test_registry_import_reads_no_file -q
  expected: Exit 0, all five nodes pass; the first and the last two are red before because they are absent.
  fix_if: >-
    A moved read_version on an existing verb means a shared template changed; revert that part. A described set that
    differs means a verb's agent_facing flag is wrong.
  hermetic: true
  graduation: graduate
  graduation_check_id: telemetry-tree-binding-and-row-cap
- step: 7
  phase: pre-deploy
  action: The golden replay over fakes.
  command: >-
    bin/venv-python -m pytest
    tests/ducklake_neon_smoke_test/test_lambda_telemetry_golden_gates.py::test_replay_registers_one_project_per_tree_and_pass
    tests/ducklake_neon_smoke_test/test_lambda_telemetry_golden_gates.py::test_replay_reports_counts_only_and_skips_window_verbs
    tests/ducklake_neon_smoke_test/test_lambda_telemetry_golden_gates.py::test_a_mismatch_names_tree_and_verb_never_a_value
    tests/ducklake_neon_smoke_test/test_lambda_telemetry_golden_gates.py::test_tree_rows_must_match_the_sent_set_with_one_root
    tests/ducklake_neon_smoke_test/test_lambda_telemetry_golden_gates.py::test_a_run_that_cannot_complete_files_one_error_alarm
    tests/ducklake_neon_smoke_test/test_lambda_telemetry_golden_gates.py::test_never_imports_tests
    tests/ducklake_neon_smoke_test/test_lambda_telemetry_golden_gates.py::test_version_skew_skips_without_alarms
    tests/ducklake_neon_smoke_test/test_lambda_telemetry_golden_gates.py::test_assert_zero_mismatches_parses_and_lints_as_decidable
    -q
  expected: Exit 0, all eight nodes pass. Red before because the module is absent.
  expected_literals: []
  fix_if: A row value in a failure or alarm message is a Decision 101 defect; name the tree and verb only.
  hermetic: false
  graduation: graduate
  graduation_check_id: telemetry-golden-replay-over-fakes
- step: 8
  phase: pre-deploy
  action: The reader smoke checks cover the three verbs, with counts-only failure text.
  command: >-
    bin/venv-python -m pytest
    tests/ducklake_neon_smoke_test/test_lambda_ec_gates.py::test_telemetry_read_checks_cover_the_verification_verbs -q
  expected: Exit 0. Red before because the node is absent.
  expected_literals: []
  fix_if: A planted value or a malformed value echoed in a message is a Decision 101 defect.
  hermetic: true
  graduation: graduate
  graduation_check_id: telemetry-reader-smoke-covers-verification-verbs
- step: 9
  phase: pre-deploy
  action: The golden replay workflow's structure and taxonomy row.
  command: >-
    bin/venv-python -m pytest tests/test_telemetry_golden_replay_workflow.py -q && grep -c "telemetry-golden-replay:"
    config/ci_rca_taxonomy.yaml
  expected: Exit 0, then a count of 1.
  expected_literals: []
  fix_if: >-
    A missing masking pattern fails PLAN-actions-account-id-masking's guard too; follow it. A count of 0 means the
    taxonomy row is missing.
  hermetic: true
  graduation: graduate
  graduation_check_id: telemetry-golden-replay-workflow-structure
- step: 10
  phase: pre-deploy
  action: The reader and read-engine contracts name the three verbs and the second raw-row exception.
  command: >-
    grep -c "session_tree_rows" docs/contracts/ducklake_reader.yaml && grep -c "telemetry_orphan_counts"
    docs/contracts/ducklake_reader.yaml && grep -c "telemetry_root_sessions" docs/contracts/ducklake_reader.yaml && grep
    -c "session_tree_rows" docs/contracts/read-engine.yaml
  expected: Each count is 1 or more.
  expected_literals: []
  fix_if: A count of 0 means the invariant text of execution_steps[3] or the read-engine grouping is missing.
  hermetic: true
  graduation: waive
  graduation_waiver_reason: >-
    Contract prose presence; validate_contract_drift, the contract loader and validate_read_engine_verbs already gate the
    files' structure in both tiers, and a standing grep would pin wording rather than behaviour.
- step: 11
  phase: pre-deploy
  action: >-
    Coverage. Run pytest-cov directly for the scripts/ modules the coverage checker's map does not reach (rec-2641), and
    the checker for the src/ modules it maps.
  command: >-
    bin/venv-python -m pytest tests/telemetry_verify tests/ducklake_neon_smoke_test/test_lambda_telemetry_golden_gates.py
    tests/ducklake_neon_smoke_test/test_lambda_ec_gates.py -m "not integration" --cov=scripts.telemetry_verify.orphans
    --cov=scripts.telemetry_verify.rows --cov=scripts.telemetry_verify.alarms
    --cov=scripts.ducklake_smoke.lambda_telemetry_golden_gates --cov=scripts.ducklake_smoke.lambda_ec_gates
    --cov-report=term-missing --cov-fail-under=0 -q && bin/venv-python -m scripts.test_coverage_checker --check-tests --check-coverage
    --files src/common/ducklake_event_read_sql.py src/common/ducklake_event_read_verbs.py src/common/ducklake_event_reads.py
    src/common/ducklake_reader_client.py scripts/schema_to_field_semantics.py
  expected: >-
    Exit 0 from both; the term-missing report lists no missing line in orphans.py, rows.py, alarms.py or
    lambda_telemetry_golden_gates.py, and no missing line in lambda_ec_gates.py among the lines this plan adds.
  fix_if: A coverage gap needs a direct assertion in the module's test, never a pragma.
  hermetic: false
  graduation: waive
  graduation_waiver_reason: >-
    A whole-directory coverage run needing pytest-cov, which the venv-less fast tier lacks; the src/ half is the full
    tier's standing coverage gate, the scripts/ half is rec-2641's mapping gap.
- step: 12
  phase: pre-deploy
  action: Lint and run the full tier on the committed, clean tree before the push, as the handoff policy requires.
  command: >-
    bin/venv-python -m ruff check src/common scripts/telemetry_verify scripts/ducklake_smoke scripts/schema_to_field_semantics.py
    tests/common tests/telemetry_verify tests/ducklake_neon_smoke_test tests/test_schema_to_field_semantics.py
    tests/test_telemetry_golden_replay_workflow.py && bin/venv-python -m scripts.validate
  expected: Exit 0 from both.
  fix_if: Fix the reported finding at its root (Decision 55); never skip, disable or quarantine a test.
  hermetic: false
  graduation: not-applicable
- step: 13
  phase: post-deploy
  action: >-
    The governed deploy of the merge commit succeeded, every job included. Read with mcp__github__actions_list
    (list_workflow_runs, workflow deploy-ducklake-lambdas.yml, head_sha $MERGE_SHA) then list_workflow_jobs for that run,
    writing the jobs JSON to $DEPLOY_JOBS_JSON.
  command: >-
    test -s "$DEPLOY_JOBS_JSON" && bin/venv-python -c "import json,os;j=json.load(open(os.environ['DEPLOY_JOBS_JSON']));
    jobs={x['name']:x.get('conclusion') for x in (j.get('jobs') if isinstance(j,dict) else j)};print(jobs);
    want=['deploy-maintenance','maintenance-smoke','reconcile-gate','deploy-serving','smoke']; assert all(any(n.startswith(w)
    and c=='success' for n,c in jobs.items()) for w in want),jobs;print('DEPLOY_OK')"
  expected: Every named job concluded success (a skipped job fails this step), then DEPLOY_OK.
  fix_if: >-
    A failed deploy or smoke step is this plan's to root-cause and fix forward, never a re-run to green (Decision 55).
  hermetic: false
  graduation: not-applicable
- step: 14
  phase: post-deploy
  action: The deployed reader serves the merged verbs.
  command: >-
    export DUCKLAKE_READER_URL=$(aws ssm get-parameter --profile agent_platform --region eu-west-2 --name
    /agent-platform/ducklake/reader_url --query Parameter.Value --output text) && AWS_PROFILE=agent_platform bin/venv-python
    -c "import datetime as d;from scripts.ducklake_smoke import core;from src.common import ducklake_event_reads as ev;
    u=core._function_url('reader');desc=core._sigv4_invoke(u,{'action':'describe'}).json()['verbs'];want=ev.describe_all();
    vs=('session_tree_rows','telemetry_orphan_counts','telemetry_root_sessions');
    assert all(desc[v]['read_version']==want[v]['read_version'] and desc[v]['agent_facing'] is False for v in vs),[desc.get(v) for v in vs];
    t=str(d.datetime.now(d.timezone.utc).date());n=d.datetime.now(d.timezone.utc).isoformat();
    o=core._sigv4_invoke(u,{'action':'named_read','verb':'telemetry_orphan_counts','params':{'day_from':t,'day_to':t,'as_of':n}}).json();
    r=core._sigv4_invoke(u,{'action':'named_read','verb':'telemetry_root_sessions','params':{'day_from':t,'day_to':t}}).json();
    assert o['ok'] and r['ok'] and o.get('read_version')==want['telemetry_orphan_counts']['read_version'];
    print({'orphan_rows':o['row_count'],'roots':r['row_count']});print('LIVE_VERBS_OK')"
  expected: One line with the two row counts, then LIVE_VERBS_OK.
  fix_if: >-
    A read_version mismatch means the deployed reader predates the merge; check the deploy run's head SHA, never relax
    the comparison. If describe_all or the stamp key is named differently, use the existing names and say so.
  hermetic: false
  graduation: not-applicable
- step: 15
  phase: post-deploy
  action: >-
    The golden replay ran green for the merge commit. Find the telemetry-golden-replay run with event workflow_run
    created after the deploy run for $MERGE_SHA completed (mcp__github__actions_list list_workflow_runs; never filter
    on head_sha alone, since a workflow_run run's head_sha is main's head when it starts), confirm it by the checkout
    SHA its job logs, and save its job log (mcp__github__get_job_logs) to $REPLAY_LOG.
  command: >-
    grep -E "GOLDEN_SMOKE trees=[1-9][0-9]* expectations=[1-9][0-9]* window_skipped=[0-9]+ reader_calls=[0-9]+
    writer_calls=[0-9]+ elapsed_s=[0-9]+ max_response_bytes=[0-9]+ seam_skipped=[0-9]+ skew=0 mismatches=0" "$REPLAY_LOG"
  expected: >-
    One matching GOLDEN_SMOKE line and a run concluded success. Report the line verbatim (its elapsed_s and call counts
    are the budget's first measurement).
  fix_if: >-
    A mismatch on the deployed engine with the in-memory and local legs green is an engine or transport defect: name the
    tree and verb from the failure line, file it through the portal and fix forward; never relax an expectation for one
    engine. A run that exceeds the job limit means the budget was wrong: report the counts and split the replay by tree
    across a matrix rather than dropping trees. No such run, or skew=1, means main moved or a later deploy overlapped:
    dispatch the workflow on main once the deploys settle and read that run.
  hermetic: false
  graduation: not-applicable
- step: 16
  phase: post-deploy
  action: >-
    session_tree_rows over the implementing session's own captured tree (counts only): take the pin day from the
    capture cursor, find the root through telemetry_root_sessions by its entity_ref (the session's local id,
    CLAUDE_CODE_SESSION_ID), page the tree with rows.read_tree over the reader client's named(), and compare the root
    session's per-table row counts with the writer's telemetry_probe grain counts for the same root ref
    (scripts.telemetry_capture probe). The session must have had at least one Stop pass captured.
  command: >-
    T="$(ls -t ~/.claude/projects/*/*.jsonl | head -1)" && AWS_PROFILE=agent_platform bin/venv-python -m
    scripts.telemetry_capture probe --tree "$T" && AWS_PROFILE=agent_platform bin/venv-python -c "import
    sys,os,datetime as d;from pathlib import Path;from scripts.telemetry_capture.state import CaptureState,state_dir;
    from src.common.ducklake_reader_client import make_reader;from scripts.telemetry_verify import rows;t=Path(sys.argv[1]);
    c=CaptureState(state_dir(t,t.stem)).cursor_on_disk();day=str((d.datetime(1970,1,1,tzinfo=d.timezone.utc)+d.timedelta(milliseconds=c.session_started_at_ms)).date());
    r=make_reader(profile='agent_platform');roots=r.named('telemetry_root_sessions',day_from=day,day_to=day);
    me=[x for x in roots if x['entity_ref']==os.environ['CLAUDE_CODE_SESSION_ID']];assert len(me)==1,len(me);
    pages=rows.read_tree(r.named,me[0]['session_id'],2000);by=rows.decode_rows(pages);
    print({k:len(v) for k,v in by.items()},'pages',len(pages));print({k:sum(1 for x in v if x['session_id']==me[0]['session_id']) for k,v in
    by.items()});print('TREE_READ_OK')" "$T"
  expected: >-
    The probe's per-table rows for the root ref, the tree's per-table counts with the page count, the root session's
    per-table counts, then TREE_READ_OK; the root session's counts equal the probe's per table. Report all three lines.
  fix_if: >-
    A difference is a tree-key defect unless a Stop pass landed between the two reads; re-read after the next pass
    before filing it. A root not found means the root's rows have not landed yet (the first sessions row waits for a
    closed assistant turn); wait for the next pass.
  hermetic: false
  graduation: not-applicable
- step: 17
