schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: telemetry-verification-verbs
intent: >-
  Telemetry slice 4's read-path leg (rec-4025): give verification a bounded way to read what the warehouse actually
  stored, and prove the deployed engine computes what the contracts say. Three non-agent-facing reader verbs (one root
  session tree's stored rows, per-day orphan counts over quiet trees, and the window's root sessions with their join
  keys and conflict stamps) serve the in-session source check, the shadow re-derivation and the completeness check. A
  post-deploy golden replay workflow sends the golden transcript trees through the deployed telemetry writer and reads
  them back through the deployed reader on the smoke catalog, asserting the hand-authored derived values, after every
  successful DuckLake deploy and once a day (so a producer or expectations change is replayed within a day). It also registers the telemetry_verify
  rec source and its one filing helper, which the replay, the in-session source check and the verification monitor
  file their alarms through.
plan_type: IMPLEMENTATION
implementation_declared: true
verification_tier: V3
plan_path: docs/plans/PLAN-telemetry-verification-verbs.yaml
phase: >-
  rec-4025 carrier (telemetry slice 4, verification): the second of its four plans (golden harness, verification verbs,
  in-session source check, verification monitor), approved by Benjamin's "write the plan" on 2026-10-17
  (cmsg_012XgaFy8VaDQbxP5D8nC958MdLJawKLhVPEQqyXDX82iS) on the approach in
  /mnt/project-files/telemetry-slice4/step6b-presentation.md. Related tier items, named in context only: T3.20 and
  T2.36; this plan closes no criterion (the orphan verb is the substrate of T3.20 c3, which the verification monitor
  plan re-grounds and closes once a scheduled job alarms on it), and rec-4025 stays open as the slice's carrier.
closes_criteria: []
scope:
- file: src/common/ducklake_event_read_sql.py
  action: Modify
  purpose: >-
    Three templates. A tree is the rows sharing one (tenant_id, project_id, session_started_at) key, the root's own: every
    row of a tree carries the root's pin (Decision 199 cl.2) and its tenant and project, and a session_id is the pin's
    milliseconds plus a hash over (tenant, project, ref), so the pin alone does not identify a tree. TREE_ROWS_SQL
    resolves the key server-side from the rows whose session_id = $session_id in any of the four tables inside the
    root's calendar-day partition, then returns every stored row with that key, read raw (no generation retirement, no
    dedupe, every parser_version): one UNION ALL branch per table selecting compared_columns(table) plus
    created_timestamp (the dedupe tie-break), so telemetry_transcripts.content and content_uri, representation-only
    columns, never leave; each row as table_name and row_json (to_json of the selected columns), plus total_rows (the
    tree's row count, the same on every page) and roots_in_tree (distinct root session_ids, parent_session_id null,
    among the key's telemetry_sessions rows: above 1 means two roots of one project share a pin millisecond, which a
    caller reports, never merges); ordered by table_name, session_id, producer, event_id, parser_version,
    created_timestamp, row_json; LIMIT $max_rows OFFSET $offset. ORPHAN_COUNTS_SQL carries a {telemetry_joins}
    placeholder that render_sql fills at render time from the projected joins (field_semantics.yaml telemetry_joins),
    never at import, composed with the shared R4/R5 dedupe over a window scope and the real-purpose project filter sessions_window uses; per (day, join_id): child_rows (non-null FK
    values), orphans_quiescent and orphans_pending (child rows whose FK value matches no parent key in the live rows of
    the same tree key, split by the tree's quiescence: as_of minus the tree's last event_timestamp over all four tables
    exceeds {idle_seconds}), trees_quiescent, trees_pending, and conflicted_keys (the day's conflicted grain-key count).
    ROOT_SESSIONS_SQL: over a window, real-purpose projects only, after R4/R5, one row per root session
    (parent_session_id IS NULL): session_id, entity_ref (the producer's root session ref), harness_session_key and
    branch (each the first non-null value by event_timestamp, source_ordinal; harness_session_key is the harness's own
    session id, the join key to its session lists, null on rows written before parser_version 4), session_started_at,
    last_event_timestamp (the TREE's last event across the four tables under the tree key, the quiescence basis the
    verification monitor selects trees by), and the three Decision 207 stamps (generations, conflicted_grain_keys, derivation_conflicted)
    from the same stamp CTEs sessions_window uses, so a conflicted root is reported, never resolved silently; ordered by
    session_started_at, session_id.
- file: src/common/ducklake_event_read_verbs.py
  action: Modify
  purpose: >-
    Registry entries, each with telemetry_sessions first in its tables tuple (read-engine.yaml groups a verb by its first
    table) and a description stating what it returns and that it reads the smoke catalog only until slice 2c:
    session_tree_rows (params session_id, offset, max_rows; binding tree; int_params offset and max_rows; agent_facing
    False), telemetry_orphan_counts (params day_from, day_to, as_of; binding window; max_window_days 7; data
    idle_seconds; agent_facing False) and telemetry_root_sessions (params day_from, day_to; binding window;
    max_window_days 7; agent_facing False). MAX_TREE_ROWS = 2000 is module data used by the tree binding. The joins are
    not registry data (render_data takes scalars) and the module stays pure data with no I/O at import: the joins enter
    only through render_sql's placeholder and event_read_version.
- file: src/common/ducklake_event_reads.py
  action: Modify
  purpose: >-
    bind_values handles binding "tree": session_id validated as today (canonical ULID, partition bounds from its time
    prefix); max_rows validated as an integer of at least 1 and clamped to MAX_TREE_ROWS, as max_bytes is clamped today;
    offset an integer of at least 0. telemetry_joins(semantics=None) returns the projected joins from
    load_field_semantics() (only when called, never at import). render_sql fills a template's {telemetry_joins}
    placeholder from the semantics it is given, and event_read_version adds "joins": telemetry_joins(semantics) to its
    definition only for a verb whose template carries the placeholder, so the orphan verb's stamp moves with the
    contract's joins and no existing verb's digest moves. No other behaviour change.
- file: src/common/ducklake_reader_client.py
  action: Modify
  purpose: >-
    VERB_FIELDS gains the three verbs' output columns in the SQL's order (session_tree_rows: table_name, row_json,
    total_rows, roots_in_tree; telemetry_orphan_counts: day, join_id, child_rows, orphans_quiescent, orphans_pending,
    trees_quiescent, trees_pending, conflicted_keys; telemetry_root_sessions: session_id, entity_ref,
    harness_session_key, branch, session_started_at, last_event_timestamp, generations, conflicted_grain_keys,
    derivation_conflicted).
- file: scripts/schema_to_field_semantics.py
  action: Modify
  purpose: >-
