  The joins projection: scripts/schema_to_field_semantics.py's telemetry_joins key, the regeneration, and the node in
  the new tests/test_field_semantics_telemetry_joins.py (tests/test_schema_to_field_semantics.py, at 499 of 500 SLOC,
  is not modified). Then the verbs: the three templates over the tree key, the tree
  binding and max_rows clamp, telemetry_joins() in ducklake_event_reads.py, VERB_FIELDS, read-engine.yaml's grouping,
  and the two sanctioned test changes (VP step 6).
- >-
  scripts/telemetry_verify/orphans.py, rows.py and alarms.py with their mirror tests (VP step 2).
- >-
  docs/contracts/ducklake_reader.yaml, two audit_invariants appended after the transcript_content entries, and the
  transcript_content exception's "It is the only event verb that does" sentence amended to "It and session_tree_rows
  are the only event verbs that do": (1) "Verification verbs (telemetry slice 4, rec-4025; none agent-facing; smoke
  catalog only until slice 2c, rec-4292): session_tree_rows(session_id, offset, max_rows) returns every stored row of one
  tree, the rows sharing the root's tenant_id, project_id and session_started_at (all four tables, every
  parser_version, no dedupe), as table_name, row_json, total_rows and roots_in_tree, max_rows at most 2000;
  telemetry_orphan_counts(day_from, day_to, as_of) returns per day and telemetry join the child rows, the orphaned
  child rows split by whether their tree is quiescent past the idle threshold, the quiescent and pending tree counts
  and the conflicted grain-key count, over R4/R5-deduped rows of real-purpose projects; telemetry_root_sessions(day_from,
  day_to) returns each real-purpose root session's session_id, entity_ref, harness_session_key, branch,
  session_started_at, last_event_timestamp and its Decision 207 stamps. Windows span at most 7 days." (2) "Exception to
  'Rows are derived, never raw' above: session_tree_rows returns the stored rows of exactly one tree, the compared
  columns plus created_timestamp and never content or content_uri, for verification callers only (the golden replay,
  the in-session source check and the daily verification monitor on the CI role), which hold the rows in memory for the
  comparison and never persist them; a page above the envelope guard answers 413 response_too_large and the caller
  halves max_rows. Its callers print counts only." Plus an amendment_log entry (change_class field_add, semantic_break false, with a migration_story: additive
  verbs, no caller changes), in the shape of the 2026-10-16 transcript_content entry; read-engine.yaml's entry uses the
  same class.
- >-
  tests/common/test_ducklake_event_verification_verbs.py over the golden chain:
  test_tree_rows_return_every_stored_row_exactly_once (every corpus and verification tree, one per catalog: the decoded
  rows equal the stored rows' compared columns plus created_timestamp, by grain key and every column; content and
  content_uri absent; roots_in_tree 1), test_tree_rows_page_to_the_same_set_at_any_page_size (max_rows 1, 7 and 2000),
  test_co_pinned_trees_stay_apart_and_collisions_are_counted (two trees sharing the corpus pin loaded under two projects
  of one catalog: each tree read returns only its own rows; the same two roots under one project report roots_in_tree
  2), test_orphan_counts_match_the_independent_count (finalized trees report zero; a planted child row whose parent is
  absent, inserted directly, reads pending at an exact-threshold as_of and quiescent past it; the verb equals
  orphans.orphan_counts on every case, including the two-project co-pinned catalog), and
