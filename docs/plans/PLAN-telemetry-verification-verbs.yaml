constraints:
- >-
  Counts only (Decision 101): the replay's output and alarm text, the new smoke checks' failure text and every VP output
  carry counts, class names, verb names and join ids; never a row value, transcript content, session id or ref in a
  public log. The tree verb never returns content or content_uri.
- >-
  Named verbs only (Decision 84 I-3): every read is one of the registry's verbs; no caller SQL; no new agent-facing verb.
  The verbs read the smoke catalog only until slice 2c (rec-4292).
- >-
  Clause-1 bound (Decision 199 cl.1 and its 2026-10-16 note): session_tree_rows and telemetry_orphan_counts are not
  clause-1 derivations (state, duration, roll-ups, friction, cost); the tree verb is a bounded raw read and the orphan
  verb is Decision 210 cl.2's DQ-monitor count. Both still honour the clause's bound: each tree's rows are read only
  inside that tree's single day(session_started_at) partition (Decision 199 cl.2), the orphan verb sums per-tree counts
  per day, and both windows are capped at 7 days in the registry. telemetry_root_sessions is a window of per-session
  reads, as sessions_window is.
- >-
  The golden replay is an alarm, not a gate (Decision 210 cl.2): it runs after the deploy, never blocks it, and files
  golden_replay_mismatch and golden_replay_error recs; the deploy smoke is unchanged except for the three reader
  checks.
- >-
  No two DuckLake deploys at once (Benjamin 2026-10-16): this build merges only when no other DuckLake deploy or apply is
  in flight; the coordinator sequences it after PLAN-telemetry-column-additions' governed deploy is green. Once the
  replay workflow exists, a DuckLake merge also waits for an in-flight golden replay to finish (the version guard turns
  an overlap into skew=1, not a false alarm, but the wait keeps the replay meaningful).
- >-
  SLOC: every module under 500 (tests/test_schema_to_field_semantics.py is at 499 and is not modified; the generator's
  node lives in its own new module); src/common/ducklake_reader_client.py stays under its budget (it is at 405); if the
  three templates push ducklake_event_read_sql.py past 450, move them into src/common/ducklake_event_read_sql_verify.py
  re-exported by the existing module, never a budget raise (Decision 128).
