- file: scripts/telemetry_verify/rows.py
  action: Create
  purpose: >-
    read_tree(named, session_id, page_rows) pages session_tree_rows through an injected callable with the reader
    client's named() contract (named(verb, **params) returns the row list) until offset reaches total_rows; on the
    reader's typed 413 (ResponseTooLargeError) it halves the page size and retries the same offset, down to one row,
    then re-raises. decode_rows(pages) returns rows_by_table as plain dicts with timestamps parsed to timezone-aware
    datetimes and integers restored, in the shape scripts.telemetry_verify.dedupe and derive take. A page whose
    total_rows or roots_in_tree differs from the first page's raises (the tree changed mid-read; the caller re-reads).
- file: scripts/telemetry_verify/alarms.py
  action: Create
  purpose: >-
    ALARM_SOURCE = "telemetry_verify". raise_alarms(findings, *, scope, alarm_at, now, portal, file, acceptance_for,
    declared=(), rows=None, reader=None) -> AlarmOutcome (findings maps class -> count; declared is the collection of
    declared class names, counted and never filed; rows and reader pass through to run_episode's find_rec, the test
    seam; AlarmOutcome carries filed, updated, unchanged, rate_limited and declared counts and the per-class actions)
    turns each alarm class with a positive count into one scripts.rec_episode.run_episode call with over_threshold true
    (file when no open rec of the class exists, else update; never close), the class carried in the title ("telemetry
    verification alarm: <class>") and context as finding_class=<class> and matched by sub_key on it as an exact
    delimited token (finding_class=<class> followed by a space, a comma or the end of the context), never a substring,
    so a class that prefixes another never updates its neighbour's rec; scope is the label
    the rec text carries (a commit SHA, a day, a window or a tree's root session ref), alarm_at the caller's own
    per-class map of last-call times, so the rate limit is per class within one caller's state (a tree's verify state;
    None disables it; a class called under ALARM_MIN_INTERVAL_S = 21,600 s ago is skipped and counted rate_limited),
    file the rec's file field and acceptance_for(class) the caller's static,
    lint-valid acceptance command for that class (the scripts/convergence_health/escalate.py precedent). Rec text carries counts, class names, the scope label
    and parser_version only; priority High; the templates are composed against get_rec_write_guidance()'s field
    semantics.
- file: scripts/telemetry_verify/__init__.py
  action: Modify
  purpose: Facade re-exports the public surface of orphans, rows and alarms.
- file: scripts/ducklake_smoke/lambda_telemetry_golden_gates.py
  action: Create
  purpose: >-
    The deployed-engine leg of the golden harness, run by the golden replay workflow (main() with
    `python -m scripts.ducklake_smoke.lambda_telemetry_golden_gates [--no-alarms] [--assert-zero-mismatches]`;
    --assert-zero-mismatches exits 0 only after a completed run with skew=0 and mismatches=0). Version guard, before the
    first append and again after the last read: the deployed reader's describe read_version for every verb the run
    calls equals the checkout's describe_all(), and the reader's and telemetry writer's deploy records
    (deploy-records/ducklake/<function>.json, which the CI role already reads in the deploy smoke) name a source_git_sha
    with no diff against the checkout on deploy-ducklake-lambdas' own push paths (read from that workflow file; git
    diff --quiet); on any difference the run prints GOLDEN_SMOKE with skew=1 and the counts so far, files nothing and
    exits 0, because a replay of one commit against another's deployed code proves nothing. It reads the two derived_golden
    files and the corpus case JSON under tests/fixtures/turn_capture/golden/ as data and builds each tree with
    src.turn_capture.transcript.MemTree; it never imports tests/ (scripts never import tests). A case whose index entry
    carries a test-only seam (full_output_cap_bytes, or the scrubber's secrets fixture) is counted seam_skipped and not
    replayed, since the seams live only in tests/fixtures/turn_capture_corpus.py. For every other tree and pass whose
    tree is "corpus:<file>" (the verification trees are built by a tests/ helper and are not replayed here): mint one synthetic project_ref for that (tree, pass) the way
    lambda_telemetry_gates._check_project_fan_out mints its ref and register it with register_project (so every
    replay's trees are isolated by project and every derived id is fresh, Decision 199 cl.3); run record_turn over the
    case at that pass kind under that ref; send the batches through the deployed telemetry writer on the send path
    lambda_telemetry_blob_gates uses (core._sigv4_invoke for appends with transport.chunk and append_body,
    src.telemetry_client.blob_delivery for rows above the inline threshold); then resolve each expectation's session
    selector (root, or agent:<agentId>) to its deployed session_id with src.telemetry.identity.derive_entity_key over
    register_tenant's tenant_id, register_project's project_id, the case's session ref and its pin, and through the
    deployed reader: session_tree_rows over the root returns exactly the (table, producer, external_ref) set sent, with
    roots_in_tree 1 (a tree that stores no row, such as no_reply_session, answers as an absent session: no rows and no
    roots_in_tree assertion, and the sent set is empty), and every session-bound expectation's asserted columns hold (session_state_and_duration,
    agent_run_state_and_duration, agent_run_token_rollup, session_process_event_rollup, session_friction_rollup,
    model_call_cost_estimate). Window-verb expectations are counted as window_skipped: the smoke catalog is shared and
    sessions_window reads real-purpose projects only, so they are proven by the in-memory and local legs and, on real
    data, by the verification monitor's daily window comparison. URLs come from DUCKLAKE_TELEMETRY_WRITER_URL and
    DUCKLAKE_READER_URL as the deploy smoke resolves them, else from the SSM parameters the capture transport
    (/agent-platform/ducklake/telemetry_writer_url) and the reader client (/agent-platform/ducklake/reader_url) read,
    so an operator can run it from a session. Prints one counts-only line, GOLDEN_SMOKE trees=<n>
    expectations=<n> window_skipped=<n> reader_calls=<n> writer_calls=<n> elapsed_s=<n> max_response_bytes=<n>
    seam_skipped=<n> skew=<0 or 1> mismatches=<n>; on any mismatch (skew=0) it files one golden_replay_mismatch:<verb> alarm per verb, and on
    any failure that stops the run (an unreachable writer or reader, a 5xx, a refused registration), after first
    re-reading the two deploy records from S3 (independent of the failing call; a deploy-path diff against the
    checkout there is skew=1, files nothing and exits 0, because a deploy that landed mid-run explains the failure), one
    golden_replay_error alarm, through alarms.raise_alarms (scope the commit SHA, file this module, acceptance the live
    re-run AWS_PROFILE=agent_platform bin/venv-python -m scripts.ducklake_smoke.lambda_telemetry_golden_gates
    --no-alarms --assert-zero-mismatches, which exits 0 only after a completed run at mismatches=0; unless --no-alarms),
    then exits 1, naming tree and verb or the failure's class only, never a row value or a response body. No boto3
    import at module level.
