execution_steps:
- >-
  Gate: confirm the write-time enforcement Decision is on origin/main (pre_implementation_checklist); rebase onto it and
  resolve N.
- >-
  Write the red tests first (VP steps 1, 2, 3, 5, 6, 7 nodes) and confirm each FAILS on the unchanged tree.
- >-
  Contracts: apply the envelope, transcripts, observations, sessions, lexicon and data-modeling-standard amendments per
  their scope purposes, with field- and contract-level amendment_log entries; compact older amendment_log entries in
  telemetry_observations and telemetry_sessions first, only on fields this plan does not otherwise change (summarise
  several entries of one plan into one shorter entry; never reword an entry into a new one). New dq_intent keys,
  declared on the fields they bind: not_before (a column name), max_after_write_seconds (int), full_output_cap_bytes
  (int), integrity (true), pattern (a regex), representation_of (a list of column names), at_most (a column name),
  null_or_zero_when (a map of column -> values), and write_time_exemptions (a map of rule leg -> {reason, owner});
  exactly_one_of on content lists the three fields. Append the two dated annotations to Decisions 207 and 199, cite the
  write-time Decision as N, and regenerate docs/decisions-index.json.
- >-
  Projection and kernel: extend the projection per its scope purpose, then rules.py, gate.py typed errors, append.py
  prepare/execute and compare_excluded, timestamps.py parse_wire_timestamp. The kernel checks run in this order per row:
  unknown/derived columns, type gate, not-null, required_when, accepted values, exactly-one-of, integrity/threshold/cap
  (honouring declared exemptions), orderings, column bounds, conditional zero, write-time skew (created_timestamp is
  minted once per call, so an identical retry is judged against a LATER created_timestamp and a row that passed once
  passes again -- monotone).
- >-
  Producer v2: session_pin earliest; when a cursor exists, a root record earlier than the cursor's pinned
  session_started_at re-pins if the cursor's consumed prefix builds zero rows, else raises PinOrderError (a
  CursorError); TranscriptTree sidecar_size/sidecar_chunks and streaming Sidecars pins; transcripts per the scope
  purpose (captured tool_output rows scrub BEFORE hashing and sizing, exactly as today; omission rows and every output_*
  value are the RAW bytes' identity, streamed, never decoded or materialised whole); MCP overflow and the
  unmatched-string diagnostic; observations output_* and the model_call reasoning fields; refs full_output_ref;
  FULL_OUTPUT_CAP_BYTES = 8388608 in record_turn.py, passed to transcripts through Ctx; content_truncated false on every
  row; the MCP-overflow tool_result row origin harness. PARSER_VERSION 2.
- >-
  Update every corpus consumer per scope (CASES tuple, the case_cap context manager around every consumer's record_turn
  calls, the test_observations thinking_tokens guards, the test_capture_ducklake_integration bump and victim, the
  purpose set in test_telemetry_event_journal_contracts, _SIDE_EFFECT_KEYS output_sha256 plus its separate assertion,
  the two inverted test_transcripts guards, PinOrderError under the CursorError test, omission rows in the conformance
  suite). Regenerate every golden case's expected_rows from the implementation, review each changed row against the
  pinned rules (never accept generated output unread), add the four new cases, then write the registry's v2 history
  entry with the new digest and its cap.
- >-
  Execute Verification Plan steps 1-10 -- loop until pass (Decision 55).
- >-
  Write the registry rows for graduated steps 1, 2, 3, 5 and 6 (check ids as declared on each step).
- >-
  Portal bookkeeping (get_rec_write_guidance first, Decision 66; fetch-before-update via rec_by_id; prepend a dated
  note, never overwrite): rec-4024 gains '[SLICE 2A-1 DELIVERED <date> via PLAN-telemetry-write-conformance]' naming
  what landed and what remains for 2a-2 (writer verb, registration, dimensions, blob route, the inline-size leg's
  exemption removal, smoke proof); rec-4026 gains a note that its producer items for the tool-result policy, MCP
  overflow and the pin landed here, leaving hooks, cursor persistence, PinOrderError recovery and the capability
  handshake, plus the obligation that the first capture pass never runs before the SessionStart hook records are flushed
  (else a row may be emitted under a later pin and the session halts); rec-4028 gains '[REASONING FIELDS LANDED <date>
  via PLAN-telemetry-write-conformance]' naming reasoning_visibility, reasoning_tokens and their write-time rules (its
  LiteLLM mapping stays open); rec-4064 gains a dated 'R1 delivered via PLAN-telemetry-write-conformance' note
  (R5/R9/R10/R12 stay open). Then run VP step 13.
- >-
  CLOSURE -- separate facts, in order (a)-(e) (implement skill Commit Flows; docs/contracts/git-ops.yaml
  handoff_sequence), each reported on its own. (a) READINESS: bin/venv-python -m scripts.session.github_readiness. (b)
  Set implementation_declared true, commit, git fetch origin main and git rebase origin/main (STOP on conflict). (c) VP
  step 11 on the committed, rebased, clean tree, then bin/venv-python -m scripts.checks.validation_result --verify-head;
  on timeout the disposition is blocked. (d) write a scratchpad JSON holding exactly the
  scripts.session.postflight_evidence.CATEGORIES keys, then bin/venv-python -m scripts.session.postflight --evidence
  <that file>. (e) Push, open the PR, subscribe; on green CI squash-merge with the PR body as commit_message carrying
  'Resolves: rec-4137' in its own trailer block; then run step 12.
