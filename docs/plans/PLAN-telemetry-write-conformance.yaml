acceptance_criteria:
- >-
  Every declared row-local rule of the four telemetry contracts (not-null, accepted values incl. the registry-sourced
  agent_type set, required_when, exactly-one-of, event_timestamp not_before session_started_at, the 300 s write-time
  skew, content integrity and the pattern on content_sha256/output_sha256, the cap leg 'content or content_uri set
  implies content_bytes <= cap' (omission rows are raw identity and not cap-bound), and the 'content_uri implies >
  threshold' leg) is projected by the generator (envelope rules inherited through each table's $ref, never dropped by a
  local override) and rejected by the kernel before any SQL with a GateError naming table, rule and column; the one
  exempted leg ('inline content <= 64 KiB') is declared beside its rule with reason and owner (Decision 210 cl.3) and
  projected as an exemption.
- >-
  rules.py holds no telemetry column name or value (AST scan); _COMPARE_EXCLUDED and _COLLAPSE_IGNORED_COLUMNS are gone,
  replaced by spec.compare_excluded from the projection; _STRUCTURAL_NOT_NULL, _GRAIN_KEY and _ALWAYS_DERIVED remain
  only as from_projection's structural assertions.
- >-
  append.py exposes prepare_batch and a transaction-agnostic execute_prepared; append_events keeps its behaviour; a
  grain conflict raises GrainConflictError; representation-only columns are excluded from the compare.
- >-
  parse_wire_timestamp accepts exactly three fraction digits and rejects every other width and naive input.
- >-
  The producer emits parser_version 2: earliest-timestamp pin (a cursor that has emitted no row re-pins to a
  later-appended earlier record; once a row is emitted under the pin, such a record raises PinOrderError, a
  CursorError), so incremental emission equals a full re-parse at every line cut of every golden case; content_truncated
  false on every row; model-visible tool_result content; tool_output rows or raw-identity omission rows for persisted
  outputs incl. MCP overflow, never materialising an over-cap sidecar; output_* on every tool_call close; every golden
  and real row passes the kernel rules (the exempted inline-size leg aside); the registry carries v2 with the
  regenerated digest and its cap.
- >-
  The contracts, lexicon, the data-modeling-standard grain rule and the two Decision annotations carry the amendments
  with category-6 amendment_log entries; every telemetry contract stays <= 500 effective lines; every Decision citation
  of the write-time enforcement Decision uses its real merged number.
- >-
  model_call rows carry reasoning_visibility (the five accepted values, required on model_call) and reasoning_tokens
  (provider-reported only; NULL when unreported; at_most tokens_output; NULL or 0 when reasoning_visibility is none),
  both projected and enforced by the kernel; the claude_code producer maps every response per the pinned precedence and
  no longer writes metadata.thinking_tokens.
- >-
  rec-4137 closes (stale dedupe_key docstring fixed).
