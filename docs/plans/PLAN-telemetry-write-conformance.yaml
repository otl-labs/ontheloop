schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: telemetry-write-conformance
intent: >-
  Telemetry slice 2a-1 (rec-4024 carrier, T2.36): make the telemetry contracts, the Claude Code producer and the
  plane-neutral write-boundary kernel agree, and enforce every declared row-local contract rule in the kernel before any
  SQL (the write-time enforcement Decision, PLAN-write-time-enforcement-decision) -- including the operator-approved
  tool-result capture policy (store what the model saw, the full output as its own bounded row, a typed omission above
  the cap), the earliest-timestamp session pin a real-transcript probe showed is needed, and the form in which each
  model call's reasoning reached us (reasoning_visibility) with the provider-reported reasoning token count, so withheld
  reasoning is never read as absent (operator-approved 2026-09-29). Clean, complete, contract-bound turn telemetry is
  the learning signal for recursive self-improvement (PROJECT_CONTEXT); an invalid row in an append-only store can never
  be corrected in place. Deploy-inert: the writer verb, registration, dimensions, blob route and smoke proof are slice
  2a-2.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-telemetry-write-conformance.yaml
implementation_declared: true
phase: >-
  T2.36 (telemetry re-lands on DuckLake) -- slice 2a-1 of rec-4024; closes NO exit criterion (c1/c2 need the tables
  provisioned and the writer verb, slice 2a-2). Moves T3.20 c4 forward (tool_call output fields, tool_output purpose) without
  meeting it. Builds on the merged slice-1 kernel (#1286), R8 (#1314) and slice 3a (#1327).
scope:
- file: docs/contracts/telemetry-event-envelope.yaml
  action: Modify
  purpose: >-
    (1) session_started_at: pinned to the EARLIEST parseable record timestamp in the root transcript at pin time (the
    first capture pass), never the first record in file order -- SessionStart hook records are written after an earlier
    queue-operation record yet carry earlier timestamps (probe: 8 rows up to 9.87 s earlier); the value stays
    source-derived, UTC, ms-truncated and pinned once per tree; a record appended later with a timestamp earlier than
    the persisted pin RE-PINS only while the cursor has emitted no row under that pin (its consumed prefix builds zero
    rows, so no row carries the old value); once any row is emitted under the pin, such a record is a producer HALT
    (never re-pinned, never emitted); governance_notes R7's 'incremental emission equals a full re-parse for every row
    already emitted' gains this carve-out in the same words. (2) event_timestamp: dq_intent `not_before:
    session_started_at` (in-row ordering, write-enforced, Decision 210 cl.1) with the cross-clock-domain rule -- a
    producer whose event_timestamp and session_started_at come from different clocks (transcript-less producers,
    rec-4028) declares a skew allowance when it lands, never an exact comparison; and `max_after_write_seconds: 300`
    (event_timestamp later than created_timestamp by more than 300 s is rejected -- the skew bound the field already
    declared without a value). (3) governance_notes: every timestamp column carries its full millisecond value at the
    writer edge (exactly three fraction digits in the wire form), extending the session_started_at every-hop obligation
    to all timestamp columns because event_id's 48-bit prefix depends on event_timestamp the same way. (4)
    parser_version's R1 text gains one clause: a change to a registry-recorded producer input constant
    (full_output_cap_bytes in config/telemetry/parser_versions.yaml) is an output change and bumps even when the golden
    digest repeats, because it changes the output for inputs the goldens do not hold; field-level amendment_log entry,
    semantic_break true. Field- and contract-level amendment_log entries (semantic_break true, CD.25 category 6); the
    pin change's migration_story states it re-keys any session whose earliest timestamp is not its first record in file
    order, and is safe only because no v1 row and no persisted cursor exists anywhere. Stays <= 500 effective lines (389
    today).
- file: docs/contracts/telemetry_transcripts.yaml
  action: Modify
  purpose: >-
    Tool-result capture policy (Fable consult, operator-approved 2026-09-29): (1) `content`'s semantics become the
    payload AS THE MODEL SAW IT -- for a tool_result, the in-context text (including a harness preview and note when the
    harness persisted the output), never the sidecar; (2) purpose gains `tool_output`: the FULL persisted tool output as
    its own row (external_ref '<source_record_id>#<block_index>/full' -- the external_ref and entity_ref governance
    notes gain this grammar; same observation_ref as the tool_result row; origin tool), emitted only when the harness
    persisted the output and the sidecar is readable; (3) new field content_omitted_reason (VARCHAR, nullable, accepted
    [oversize]): set, with content and content_uri both NULL, when the full output exceeds the cap;
    content_sha256/content_bytes of an omission row are the RAW sidecar bytes' identity (streamed, never decoded, never
    materialised whole -- nothing is stored, so there is no scrubbed payload to hash); (4) exactly_one_of widens to
    {fields: [content, content_uri, content_omitted_reason]}; (5) content_truncated redefined as the operator-adopted
    tool-result consult defines it (fable-consult-tool-results/ADVICE.md, 'redefine content_truncated'): true iff the
    stored payload is known to be an incomplete copy of the payload this row claims to hold (a damaged or partially
    readable source); NOT set because the harness showed the model a preview or a pointer (the preview, or the
    MCP-overflow message, IS the complete model-visible payload), NOT set on a tool_output row (it holds the full
    output) and NOT set on an omission row (that is content_omitted_reason); the v2 producer has no path that sets it,
    so every v2 row carries false and DQ alerts on any true; whether the harness persisted the output is the tool_call
    close's output_capture; (6) sizes on content's dq_intent: content_inline_threshold_bytes 65536 (unchanged; also
    slice 2a-2's route threshold) and full_output_cap_bytes 8388608, plus integrity (content_sha256/content_bytes equal
    the sha256 and UTF-8 length of an inline content); the threshold rule's two legs are split -- 'content_uri set
    implies content_bytes > threshold' is enforced now, while 'content set implies content_bytes <= threshold' carries a
    Decision 210 cl.3 exemption beside the rule (write_time: pending_route, reason: the blob route that makes a >64 KiB
    payload storable lands in slice 2a-2, owner rec-4024) and activates when 2a-2 removes the exemption; the cap binds
    the STORED payload only -- 'content or content_uri set implies content_bytes <= cap' is enforced; an omission row's
    content_bytes is the raw identity and is not cap-bound (it may even be <= the cap when decoding and scrubbing a
    non-UTF-8 sidecar grows the storable text past the cap: each invalid byte becomes a 3-byte replacement character;
    that shape is permitted, reason oversize meaning 'the storable payload would exceed the cap'); (7) content and
    content_uri each declare dq_intent representation_of: [content_sha256, content_bytes] -- representation-only
    columns, excluded from the grain's compared content per the data-modeling-standard amendment below. Field- and
    contract-level amendment_log entries (semantic_break true on content, content_truncated, purpose, content_sha256).
    Stays <= 500 effective lines (317 today).
- file: docs/contracts/telemetry_observations.yaml
  action: Modify
  purpose: >-
    tool_call close rows gain four typed columns (typed, not metadata, so the rules are write-enforceable), all
    describing the tool's RAW full output (the sidecar bytes when persisted, else the model-visible text's UTF-8 bytes),
    computed by streaming, never decoded: output_capture (VARCHAR, accepted [not_persisted, captured, omitted_oversize,
    unavailable, no_result], required_when {event_kind: [close], observation_type: [tool_call]}); output_bytes (bigint),
    output_sha256 (VARCHAR; dq_intent pattern '^[0-9a-f]{64}$', the same pattern content_sha256 gains), output_lines
    (bigint, count of LF bytes plus one when the last byte is not LF and the output is non-empty) -- each required_when
    {output_capture: [not_persisted, captured, omitted_oversize]}. no_result = the synthetic interrupted close with no
    tool_result; unavailable = persisted but the sidecar is unreadable. Compact older amendment_log entries, the
    contract-level amendment_log included (relief valve 1, Decision 166), to stay <= 500 effective lines (489 today): a
    compaction entry lives only on fields this plan does NOT otherwise change, so VP step 8 can tell compaction from a
    genuine new entry. model_call rows gain two typed columns (operator-approved 2026-09-29; evidence
    /mnt/project-files/telemetry-reasoning/litellm-reasoning-capture.md): reasoning_visibility (VARCHAR, accepted [full,
    summarized, omitted, redacted, none], required_when {event_kind: [point], observation_type: [model_call]}) -- the
    form in which the provider exposed the call's reasoning: full = the raw reasoning (DeepSeek reasoning_content),
    summarized = a provider-written summary (Claude thinking text), omitted = the model reasoned but the provider
    withheld the text (empty thinking blocks, or provider-reported reasoning tokens > 0 with no reasoning text),
    redacted = only encrypted reasoning blocks, none = no reasoning; one value per call, the first that applies in the
    order full, summarized, redacted, omitted, none; and reasoning_tokens (bigint) -- the PROVIDER-REPORTED reasoning
    token count, a subset of tokens_output and never a fifth billing class, NULL when the provider did not report it,
    never a local estimate; dq_intent at_most: tokens_output and null_or_zero_when: {reasoning_visibility: [none]}. The
    six new fields are recorded in ONE contract-level field_add amendment_log entry dated at implementation (category 6
    binds changed existing fields only; contract-level field_add entries are the repo convention, e.g.
    ops_decisions.yaml), each with a one-line description and semantics; every compacted entry keeps its original date
    and change_class; metadata's description and semantics stay unchanged. A planning-time trial of all six fields with
    the contract-level log compacted to one line per entry measured 493 effective lines.
