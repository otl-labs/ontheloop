- file: src/turn_capture/record_turn.py
  action: Modify
  purpose: >-
    PARSER_VERSION 2 and a new PRODUCER_VERSION; a root record whose timestamp is earlier than the persisted cursor pin
    re-pins when the PERSISTED cursor's consumed prefix (its lines_consumed and finalized as loaded, before any
    parser_version reset(), whose base has empty lines_consumed and would wrongly re-pin and re-key the tree after a
    bump) builds zero rows -- nothing was emitted under the old pin -- and otherwise raises PinOrderError (a CursorError
    subclass, so existing pin-change handling and tests keep their meaning; the producer halt: never re-pinned, never
    emitted -- recovery is a rec-4026 slice-3b residual, since R7 reuses the pin across resets); any other pin mismatch
    stays a plain CursorError; nothing in this slice catches PinOrderError (record_turn has no caller until rec-4026's
    hook, which halts on it); _build_all passes the shared Sidecars to build_observations, and Sidecars caches one
    streamed (size, sha256, line count) digest per sidecar per pass, so a sidecar is streamed once per pass however many
    builders read it; FULL_OUTPUT_CAP_BYTES = 8388608, equal to the registry value and <= the contract's cap (asserted
    by test), read at each record_turn call and passed to transcripts through Ctx (Ctx gains full_output_cap_bytes), so
    a test override of record_turn.FULL_OUTPUT_CAP_BYTES reaches every consumer.
