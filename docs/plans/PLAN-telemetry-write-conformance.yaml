- file: src/telemetry/rules.py
  action: Create
  purpose: >-
    Stdlib-only, table-agnostic contract-derived row rules (Decision 210 cl.1/cl.3), shaped as the generic engine
    rec-4158 can reuse for other writers -- no telemetry column name or value appears in this module (asserted by an AST
    scan in test_rules.py). RowRules (frozen): not_null columns, accepted_values per column, required_when per column
    (column -> {other_column: allowed values}), exactly_one_of groups, orderings (column not_before other column),
    column bounds (column at_most other column, checked when both are non-null), conditional zero (null_or_zero_when:
    the column is NULL or 0 whenever the named columns take the listed values), max_after_write_seconds per column,
    content rules (inline threshold with its per-leg exemption, full-output cap, integrity), and a rule exemption map
    (rule -> reason, owner) honoured exactly as the projection declares it. check_row(table, row, rules,
    created_timestamp) raises its own neutral RowRuleError(ValueError) naming table, rule and column (never a content
    value) -- rules.py imports nothing from gate.py, so rec-4158 can relocate it to a shared module unchanged (the
    rec-4158 thread's request); prepare_batch wraps it into gate.GateError. RowRules.from_projection(columns,
    table_rules) builds them from the generator projection only.
- file: src/telemetry/gate.py
  action: Modify
  purpose: >-
    Add GateError(AppendError) (a row-rule or type rejection) and GrainConflictError(AppendError) (a differing row under an
    existing grain key, in-batch or stored) so callers map by type, not substring; existing raises reclassified; within-
    batch compare honours the spec's compare exclusions.
- file: src/telemetry/append.py
  action: Modify
  purpose: >-
    EventTableSpec gains rules (RowRules) and compare_excluded, both from from_projection (compare_excluded defaults to
    the envelope's structural pair for a directly constructed EventTableSpec, so a producer_version-only resend is never
    a conflict): compare_excluded = the envelope's write-time stamp and provenance-only columns (created_timestamp,
    producer_version -- structural, asserted by from_projection) plus every column the projection marks
    representation_of (content, content_uri for telemetry_transcripts). Literal retirement (AC1): _COMPARE_EXCLUDED here
    and gate.py's _COLLAPSE_IGNORED_COLUMNS retire in favour of spec.compare_excluded; _STRUCTURAL_NOT_NULL, _GRAIN_KEY
    and _ALWAYS_DERIVED STAY as from_projection's structural assertions of the envelope's identity invariants (they
    reject a malformed projection, they are not data rules). Split into prepare_batch (pure: gate, rules, derivation,
    intra-batch collapse; raises GateError/GrainConflictError) and execute_prepared (one MERGE, no BEGIN/COMMIT; caller
    owns the transaction; converts the MERGE ERROR token to GrainConflictError); append_events stays the one-table
    facade (same signature and behaviour otherwise). Docstrings: rec-4137 (it must read 'dedupe_key != [producer,
    event_id, parser_version]'); the module docstring's out-of-scope list drops the skew check (now in scope) and states
    parent existence is not a write-time check under the amended R3 contract.
- file: src/telemetry/timestamps.py
  action: Modify
  purpose: >-
    parse_wire_timestamp(value): the pinned RFC 3339 profile with EXACTLY three fraction digits (rejects none, 1, 2 or
    4-9 digits and naive input, Decision 96 cl.4) -- the writer-edge decoder slice 2a-2 applies to every timestamp column.
    parse_iso8601_utc is unchanged.
- file: scripts/field_semantics_event_projection.py
  action: Modify
  purpose: >-
    Project the rules RowRules consumes: per column accepted_values (from dq_intent.accepted_values.values, whatever its
    DQ `enforced` flag, which keeps its DQ-runner meaning), required_when (existing), not_before,
    max_after_write_seconds, at_most, null_or_zero_when, representation_of, pattern, and any write_time exemption
    (reason, owner); table_rules: exactly_one_of groups and content threshold/cap/integrity. Registry-sourced values:
    resolve_refs nulls $ref (scripts/contracts.py), so the projection re-loads the RAW contract YAML to read each
    field's $ref, resolving it in-module as <_CONTRACTS_DIR>/<table_id>.yaml (a module-level directory the
    fixture_events test contract patches) -- no edit to scripts/schema_to_field_semantics.py; a field whose $ref is
    'source-lineage.yaml#/contract/fields/registry_key' (telemetry_agents.agent_type) gets accepted_values = the
    canonical_id set of the registry named by source-lineage.yaml's top-level allowed_values.registry
    (config/agent/data_quality/source_registry.yaml), read at generation time -- no new file. Envelope rule inheritance:
    scripts/contracts.py _layer_overrides replaces a $ref field's dq_intent WHOLESALE with its dq_intent_local, and
    every Class A contract declares dq_intent_local {not_null: {enforced: true}} on event_timestamp, so the resolved
    spec drops the envelope's new not_before and max_after_write_seconds on all four tables (critique round 5 confirmed
    it by simulation). The projection therefore reads each $ref field's RAW target (the envelope field) and layers the
    target's row-rule keys under the local block: the local block may add a key or tighten not_null, never drop an
    inherited rule, and a rule key both declare with different values fails closed. No edit to scripts/contracts.py or
    to any Class A contract. Fail closed on an unknown rule key, a malformed rule, or an exemption without reason and
    owner.
- file: src/turn_capture/transcript.py
  action: Modify
  purpose: >-
    session_pin returns the EARLIEST parseable record timestamp among the root file's lines (the envelope amendment).
    The TranscriptTree protocol gains sidecar_size(basename) -> int | None and sidecar_chunks(basename) ->
    Iterator[bytes] (64 KiB chunks; FsTree streams the file, MemTree slices its bytes) so no sidecar above the cap is
    ever materialised whole.
- file: src/turn_capture/transcripts.py
  action: Modify
  purpose: >-
    tool_result rows store the model-visible text (the block content as in the transcript); content_truncated is false
    on every row (no v2 path stores a known-incomplete copy); the MCP-overflow tool_result row carries origin harness
    (its whole payload is the harness's saved-output message), while a Bash persisted preview keeps origin tool. A
    persisted output with a readable sidecar: raw size (sidecar_size) above the cap -> a tool_output OMISSION row whose
    content_sha256/content_bytes are the raw bytes' identity (streamed via sidecar_chunks, never decoded, never scrubbed
    -- nothing is stored); otherwise read, scrub, then hash and size the scrubbed text; if the decoded-and-scrubbed text
    exceeds the cap (invalid bytes decode to 3-byte replacement characters; scrub markers grow text) -> an omission row
    with the raw identity and output_capture omitted_oversize, even though the raw size is <= the cap; else a
    tool_output row. Sidecars' cursor pin hashes by streaming (the pin value is unchanged: sha256 of the raw bytes). MCP
    overflow: a tool_result whose toolUseResult is a string naming a saved output file ('Output has been saved to
    <path>') resolves the sidecar by that basename exactly as persistedOutputPath does (today that payload is silently
    lost); a string toolUseResult that names no file is counted in diagnostics (unmatched_string_tool_use_result), so a
    harness wording change surfaces as a count, never silently.
- file: src/turn_capture/observations.py
  action: Modify
  purpose: >-
    tool_call close rows carry output_capture/output_bytes/output_sha256/output_lines per the observations amendment,
    from the RAW full output (sidecar bytes streamed, else the model-visible text's UTF-8 bytes); the synthetic
    interrupted close carries output_capture no_result. model_call rows carry reasoning_visibility and reasoning_tokens,
    per response over the blocks of all its records: any thinking block with non-empty text -> summarized; else any
    redacted_thinking block -> redacted; else any thinking block with empty text, or provider-reported thinking tokens >
    0 -> omitted; else none (this producer never emits full: Claude returns a summary at most; full is rec-4028's
    DeepSeek mapping). reasoning_tokens = the owner record's usage.output_tokens_details.thinking_tokens when an int,
    else NULL; metadata.thinking_tokens is no longer written.
- file: src/turn_capture/refs.py
