- file: scripts/checks/iam_tf/validate_terraform_no_build_artifact_reads.py
  action: Create
  purpose: >-
    A registered check, @registry.register("validate_terraform_no_build_artifact_reads", owner="platform"). Public helper
    find_build_artifact_reads(tf_root, is_ignored) returns sorted findings (relative path, line, reasons), one per (file,
    line), over every *.tf under tf_root, skipping .terraform/, with whole-line # and // comments blanked offset-preserving
    (import _blank_comment_lines from validate_terraform_try). A string literal counts as a filesystem path when it starts
    with ${path.module}, ${path.root}, ${path.cwd}, ./ or ../ anywhere in the file, or when it is the plain first argument
    of a file-family function (file, filemd5, filesha1, filesha256, filesha512, filebase64, filebase64sha256, filebase64sha512,
    templatefile, fileexists, fileset). An s3_key literal such as "lambda-packages/x.zip" is neither and is legitimate.
    Resolution base: every terraform/<root>/ is its own root module with no child modules, so ${path.module}, ${path.root},
    ${path.cwd} and an unprefixed file-function argument all resolve against the file's own directory. Rule (a): a filesystem
    path with lambda-packages as a path segment, (^|/)lambda-packages(/|$), so a directory local such as
    "${path.module}/../../lambda-packages" is caught. Rule (b): a filesystem path that is_ignored reports as ignored once
    resolved, probing both the path and the path with a trailing slash (git check-ignore answers a directory pattern only
    for the slash form when the directory is absent). Rule (c): any source_code_hash argument in terraform/, whatever its
    value, so the "no resource sets source_code_hash" half of the invariant has a standing guard too. This catches direct and bare file-function arguments, templatefile(),
    and indirection through a local or a variable default alike. The registered check passes a `git check-ignore -q` probe run from the
    repo root and treats any exit other than 0 (ignored) or 1 (not ignored) as a finding, so an unanswerable probe fails
    closed. It scans the whole terraform/ tree like validate_terraform_try, calls registry.examined(count, unit="tf_files"),
    and each finding names file:line, the rule and the fix (address code by s3_bucket/s3_key and ship it through the deploy
    channel; docs/contracts/environment-taxonomy.yaml conformance; rec-4243). Declared residual, in the module docstring
    and the contract's coverage line: a path assembled from non-literal parts (format(), a variable value supplied at plan
    time) cannot be resolved statically; none exists today, and review of such inputs is rec-4246's checklist item. No
    import-time work.
- file: scripts/checks/iam_tf/_manifest.py
  action: Modify
  purpose: >-
    One Entry for the check in the validate_terraform_lock_coherence shape: pre=True, pre_globs ("terraform/**/*.tf",
    ".gitignore", "scripts/checks/iam_tf/validate_terraform_no_build_artifact_reads.py", "scripts/checks/iam_tf/validate_terraform_try.py",
    "scripts/checks/_common.py", "scripts/checks/registry.py"), full_segment="full_after_lint". .gitignore is listed
    because rule (b)'s verdict depends on it; validate_terraform_try.py because the check imports its comment blanker.
- file: config/ci_rca_taxonomy.yaml
  action: Modify
  purpose: >-
    function_to_category row validate_terraform_no_build_artifact_reads: environment, in alphabetical position between
    validate_terraform_lock_coherence and validate_terraform_tag_charset.
- file: tests/checks/iam_tf/test_validate_terraform_no_build_artifact_reads.py
  action: Create
  purpose: >-
    Mirror test, 100% line coverage of the new module. test_real_tree_has_no_build_artifact_reads runs the check over
    the real tree with the real git probe and asserts no findings. Red cases on synthetic HCL in tmp_path with an injected
    is_ignored: a direct try(filemd5("${path.module}/../../lambda-packages/x.zip"), null) (flagged once, though both rules
    match); a locals indirection p = "${path.module}/../../lambda-packages/x.zip" then filemd5(local.p) (flagged on the local's
    line); a directory local "${path.module}/../../lambda-packages" (flagged); source_code_hash = "abc" (flagged, rule c); a bare "../../lambda-packages/x.zip" and a "${path.root}/build/out.json" that is ignored (flagged); a templatefile()
    of an ignored path (flagged); a probe that errors (flagged, fail closed); an s3_key = "lambda-packages/x.zip" literal,
    a commented-out read, and a file() of a tracked in-tree file (none flagged). Bare file-function arguments: try(filemd5("lambda-packages/x.zip"),
    null) and file("<an ignored path>") (both flagged). test_check_is_registered_in_pre asserts registry._ALL_ENTRIES holds
    validate_terraform_no_build_artifact_reads with pre True and pre_globs including "terraform/**/*.tf" and ".gitignore".
    Plus the registered check's failure path appending to failed and its pass path, and that it declares examined.
- file: docs/contracts/environment-taxonomy.yaml
  action: Modify
  purpose: >-
    State the invariant once, class-agnostically, at the end of conformance.description (it binds the DuckLake and prod
    classes alike), keeping the phrase "never reads a build artifact" on one physical line: Terraform never reads a build
    artifact; function and layer code is addressed only by s3_bucket/s3_key, no resource sets source_code_hash (the
    ignore_changes block stays as the conformance marker and a backstop), and code ships through the code-deploy channel.
    Because Terraform re-evaluates file functions when it applies a saved plan, and nothing masks a create, no configuration
    file read may name a file a job builds or downloads (rec-4243). Coverage (Decision 181): validate_terraform_no_build_artifact_reads
    enforces it for every literal filesystem path in terraform/ (a prefixed literal anywhere, or a plain literal passed
    to a file-family function) and flags any source_code_hash argument; declared residuals: a path assembled from non-literal
    parts, and a job output written to an untracked but not ignored path (none exists today; rec-4246); job-materialised inputs that are not file reads (the tfvars fetched from Secrets
    Manager, the provider mirror) are recorded in plan.bin itself. In conformance.ducklake_detail, replace the false clause
    "and this decoupling is precisely why a verbatim saved-plan apply never re-evaluates filemd5() against the local tree
    regardless of where that fetch step's working directory lands" with a pointer to that rule, and add the same pointer
    to prod_detail. Add a 2026-10-10 amendment_log entry (semantic_break false; change_class from the contract's allowed
    values) naming the correction and that it retires archived Decision 19's try(filemd5(...), md5(file(...))) fallback
    and its "use the artifact hash to detect changes" rationale (already superseded in substance by Decisions 125/126). No apply-model, guard-classification or typed conformance field changes.
