  the red commit): dispatch terraform-apply-sandbox.yml with acknowledge_red_commit = the red sha, not Reconcile, which
  would re-apply c21ba7da's HCL. The dispatch plans fresh at main HEAD, steps 7 and 8 check that plan and the creation bytes before Benjamin is asked,
