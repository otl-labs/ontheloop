execution_steps:
- >-
  Start from main after this plan's PR has merged (step 4 diffs against the merge base). Write the check module and its
  mirror test first; run step 1 on the unchanged Terraform and record the real-tree node failing on the twelve lines; run
  step 2.
- Register the check (manifest Entry, taxonomy row), then edit the six .tf files, the contract, terraform/CLAUDE.md, AGENTS.md, prose budgets and the two workflow comments; run steps 1-4.
- >-
  Through the ops portal (get_rec_write_guidance first, then update_rec), before the merge: rec-4243's acceptance becomes
  exactly `pytest tests/checks/iam_tf/test_validate_terraform_no_build_artifact_reads.py::test_real_tree_has_no_build_artifact_reads`
  (a bare pytest head with a ::node_id, decidable and junit-routed under Decision 201) and context_v2_json.closure_artifact
  becomes check:validate_terraform_no_build_artifact_reads (Decision 186; the check is pre=True); append that the coalesce/md5(file)
  fallback fails the same check and the heal verb is acknowledge-and-retry. Narrow rec-4245 to the remaining executor
  prompt string in scripts/executor/step_context.py (frozen, Decision 67), noting in its context the stale bootstrap
  comment at terraform/bootstrap/github_ci_apply_policy.tf (layers "compute source_code_hash live", around :511-519,
  admin-tier file), with acceptance
  ! grep -qF "md5(file('module_file.tf'))" scripts/executor/step_context.py && grep -qF 'never reads a build artifact' scripts/executor/step_context.py.
  Write the registry shard; run step 5.
- >-
  Push, open the PR with Resolves rec-4243 in the squash body, drive CI green, run step 6 on the final head's speculative-plan
  comment. Squash-merge, confirm the push run refused with CONVERGENCE_RED, dispatch terraform-apply-sandbox.yml (mcp__github__actions_run_trigger,
  ref main, acknowledge_red_commit c21ba7da56a5640bc7c368af6cb8b50ae92b3e78), run steps 7 and 8, and only then ask
  Benjamin to approve the tf-gated-apply run.
- Execute steps 9-14. Loop until they pass, never weakening an assertion. On an unrecoverable failure stop and RCA (Decision 55).
- 'Report: what landed, the verification results, and that the deploy-wiring plan (to run next) and plan 3 part 1 are unblocked'
rollback: >-
  Before the retry: revert the squash commit (nothing was applied). After it: the function exists; the provider keeps
  recording each function's deployed code hash in state whether or not configuration sets it, so restoring the reads would
  be cosmetic under ignore_changes. Removing the function is PLAN-telemetry-writer-function's rollback.
