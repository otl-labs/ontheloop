  these five addresses, 4 to add, 1 to change, 0 to destroy, and no out-of-band change (rec-4255's context). Any other
  delta is a stop.
- >-
  The merge applies nothing: the push run's convergence precondition refuses on the red record (CONVERGENCE_RED), which
