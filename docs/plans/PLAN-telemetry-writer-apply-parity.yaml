constraints:
- >-
  No local terraform init, validate, plan or apply (Decision 119). CI's terraform-validate and the speculative plan are authoritative;
  never apply locally, even on the red record.
- >-
  In the six .tf files change only source_code_hash arguments, the prod_source_hash local, their attribute groups' alignment
  and the comments the scope rows name (headers, section comments, layer lead-ins and SILENT-FREEZE guards, lifecycle
  comments); no other attribute or resource. Do not change DUCKLAKE_ARTIFACT_NAMES, the build-ducklake-artifacts
  action or any executable workflow line. In the instruction files change only the named sentence or line (plus the contract's
  amendment_log entry), using the verbatim lines so AGENTS.md and terraform/CLAUDE.md shrink (no prose budget raise, Decision
  165). Layer publication (rec-4253) and immutable code references (rec-4254) are not this plan.
- >-
  Dispatch the retry only after the merge and only when step 6 passed; run steps 7 and 8 before asking Benjamin to approve; if
  the dispatch's guard does not route, stop and ask him. His tf-gated-apply approval is the deploy authorization.
- 'Public repository (Decision 101): no account id, ARN or hostname literal anywhere, including PR text and pasted logs.'
- No rescue agents or workaround loops (Decision 55).
