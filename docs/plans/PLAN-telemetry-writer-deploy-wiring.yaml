- >-
  No new job, trigger, permission or role in the workflow; no increased R3 body count (no raise marker); the URL stays masked.
- >-
  The gate never prints the URL or an account id (Decision 101) and never re-runs a failed check into green (Decision 55).
- >-
  Do not touch scripts/ci/ducklake_artifacts.py (the companion plan owns its docstring) or any Terraform.
- The dispatch that deploys the function waits for Benjamin's explicit word (governed DuckLake Lambda deploy).
- No rescue agents or workaround loops (Decision 55).
