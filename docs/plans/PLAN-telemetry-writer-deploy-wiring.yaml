schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: telemetry-writer-deploy-wiring
intent: >-
  Telemetry slice 2a-2 (T2.36, rec-4024 carrier), option D, part 2 of 2. PLAN-telemetry-writer-function creates the telemetry
  writer Lambda (agent-platform-ducklake-telemetry-writer) with a stub handler. This plan puts that function on the governed
  DuckLake code-deploy channel (Decision 125/126) with a post-deploy smoke gate, --lambda-telemetry, run as github_ci_branch.
  The gate proves the function serves only signed Function URL calls on the ducklake_smoke catalog, and on every deploy
  it re-proves that a direct Lambda invoke is denied, which is the live check behind the URL-only invariant the companion
  plan's Decision records. Plan 3 part 1 then adds its verbs and its verb vectors to the same gate module.
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-telemetry-writer-deploy-wiring.yaml
implementation_declared: true
phase: >-
  T2.36 (telemetry re-lands on DuckLake). Deploy-channel groundwork carried by rec-4024; closes no exit criterion.
scope:
- file: docs/contracts/build-lambda.yaml
  action: Modify
  purpose: >-
    deploy_targets.ducklake_function_zip_keys gains agent-platform-ducklake-telemetry-writer: lambda-packages/ducklake-telemetry-writer.zip.
    The deploy_channels.ducklake_functions.governed_channel prose names the telemetry writer in the deploy-serving leg,
    including the "--ducklake-deploy-only for writer/reader/catalog-dr)" clause and the smoke gate list "(--lambda-attach/--lambda-reader)"
    near :157, which gains --lambda-telemetry. An amendment_log entry records both.
- file: scripts/build_lambda_config.py
  action: Modify
  purpose: >-
    _DUCKLAKE_TELEMETRY_WRITER_FUNCTION = "agent-platform-ducklake-telemetry-writer" and its _DUCKLAKE_FUNCTION_ZIP_KEYS entry,
    so the fallback map equals the YAML map (tests/test_build_lambda_config.py anti-drift).
- file: .github/workflows/deploy-ducklake-lambdas.yml
  action: Modify
  purpose: >-
    (1) deploy-serving's deploy_code --ducklake-functions list gains agent-platform-ducklake-telemetry-writer (same line).
    (2) The smoke job's deploy-record freshness loop gains the function (same line). (3) The URL resolution loop becomes
    `for role in writer reader telemetry_writer` and resolves --function-name "agent-platform-ducklake-${role//_/-}", exporting
    DUCKLAKE_TELEMETRY_WRITER_URL (masked, as today); line count unchanged. (4) A new step after lambda-attach, "Smoke test
    -- lambda-telemetry (telemetry writer URL-only proof)", runs `.venv/bin/python -m scripts.ducklake_neon_smoke_test --lambda-telemetry`.
    (5) Every comment, header line and step name in this workflow that enumerates the DuckLake function set, the serving
    set, the smoke gates, the CI invoke grants or the artifact count is brought current, count-free where the sentence
    allows. Known sites: the header's function lists (:3, :6-7); "ALL eight" and "five zips" (:26-27) and "the same eight
    artifacts" (:45), which become nine artifacts and six zips once PLAN-telemetry-writer-function's build adds the telemetry
    writer zip; the serving set "writer + reader + catalog-dr" (:44) and "three serving functions" (:48-49); header item
    5's smoke gate list (:47), which gains --lambda-telemetry; "covering all 7 functions -- the five ducklake + two prod"
    (:53-54), which becomes 8 and six; the smoke grant line (:76-78), which gains TelemetryWriterInvokeCI; the build comment
    (:169); "the writer/reader/catalog-dr records" (:206); the deploy-serving step name and its comment (:331-332), whose
    R3 baseline entry does not move because the step is keyed by its id, deploy_code; the freshness comment (:367); and
    the URL step name "Resolve DuckLake writer + reader Function URLs" (:382) with its comment "Resolve both URLs ... export
    them" (:385-386), which also names TelemetryWriterInvokeCI beside DuckLakeInvokeCI as the source of GetFunctionUrlConfig.
    The smoke OIDC step name at :359 ("...DuckLake writer+reader invoke") stays as is, because docs/contracts/github-actions-evidence.yaml
    selects that step by its exact name (critical_step.name and surface.step.name). That step has no id, so renaming
    it moves its R3 key smoke::resolve-ducklake-writer-reader-function-urls to the new name slug with its count of 11 unchanged.
    No job, trigger, permission or role changes; push paths are unchanged (src/lambdas/ducklake_*/**
    already covers the new directory; src/telemetry/** is plan 3 part 1's).
- file: config/composite_action_body_baseline.yaml
  action: Modify
  purpose: >-
    r3_workflows registers the new smoke step's 1-line body under its name slug. deploy-serving::deploy_code stays as is
    (count 5; that step is keyed by its id, so renaming it moves nothing); the id-less URL step's key moves to its new name
    slug with its count of 11 unchanged (the loop keeps its line count). No count increases, so no raise marker is needed.
- file: scripts/ducklake_smoke/lambda_telemetry_gates.py
  action: Create
  purpose: >-
    lambda_telemetry(*, profile=None, region="eu-west-2"), calling core._function_url and core._sigv4_invoke through the
    module object (Decision 104, the lambda_ops_gates pattern; those two names and boto3.Session are the patch targets the
    tests use). It parses responses with its own status check rather than core._ok_json, because a failure message carries
    only the status code and the body's error_type, never the body text. In order, each a loud SmokeTestFailure (Decision 55) on mismatch: (1) url = core._function_url("telemetry_writer").
    (2) unsigned describe (sign=False) is 403 from the URL authorizer: the body carries no handler error_type (AWS answers
    {"Message":"Forbidden"}); a 403 whose body carries error_type missing_caller_identity means the request reached the
    handler, so the URL is not AWS_IAM, and raises "telemetry writer URL is not AWS_IAM". (3) signed describe is 200 with
    ok true, actions containing describe and attach_check, catalog.meta_schema == core.META_SCHEMA (ducklake_smoke) and catalog.data_path_is_smoke
    true. (4) signed attach_check whose payload also carries decoy keys meta_schema "ducklake_ops" and data_path "s3://example-invalid/ducklake/"
    is 200 with ok true, meta_schema == core.META_SCHEMA, data_path_is_smoke true and catalog_login == "ducklake_telemetry_writer"
    (the scoped login, Decision 213 cl.3): the live proof that the catalog comes from env, never from the event. (5) a signed
    unknown action ("no_such_action") is 400 with error_type unknown_action (the handler's malformed-input path, reachable
    through the dict payload core._sigv4_invoke takes). (6) a direct boto3 lambda invoke of agent-platform-ducklake-telemetry-writer
    with InvocationType DryRun under the same credentials must raise a ClientError with code AccessDeniedException. The
    caller's own InvokeFunction grant is URL-only, so AWS reports the identity-layer denial ("no identity-based policy allows",
    measured 2026-10-09 in PLAN-url-only-invoke-guard step 8), never the boundary: this check proves the principal cannot
    direct-invoke, and the boundary Deny itself is proven by tests/checks/iam_tf/test_url_only_invoke_guard.py on the policy
    text and by the post-apply simulate (Decision 213, as updated). Outcomes: a DryRun success raises "URL-only guard missing:
    direct invoke allowed"; any other code raises "direct-invoke probe inconclusive: <ErrorCode>". The gate never reads,
    prints or raises the error message, nor any ARN, account id or URL (Decision 101); only the botocore error code may
    appear. On success it prints one fixed, URL-free line: "LAMBDA_TELEMETRY OK unsigned=403 describe=200 attach_check=ok
    unknown_action=400 direct_invoke=denied".
    A module docstring says plan 3 part 1 appends its verb vectors here.
- file: scripts/ducklake_neon_smoke_test.py
  action: Modify
  purpose: >-
    Import lambda_telemetry, register "lambda_telemetry" in _LAMBDA_GATES and add the --lambda-telemetry flag ("[post-deploy]
    telemetry writer URL-only proof") to the mutually exclusive group.
- file: scripts/convergence_health/code_drift.py
  action: Modify
  purpose: >-
    DUCKLAKE_SOURCE_PATHSPECS gains "src/lambdas/ducklake_telemetry_writer" so a source change to the new function advances
    its drift reference (the function list is already map-driven). The pre-existing ducklake_maintenance_smoke gap is rec-4208,
    not this plan.
- file: docs/contracts/deploy-paths.yaml
  action: Modify
  purpose: >-
    The DuckLake function set is restated where it is enumerated: deploy_code.description (the DuckLake Lambdas), its recovery
    (the serving deploy is writer/reader/catalog-dr/telemetry-writer) and its status (six DuckLake Lambdas; the merged deploy
    role covers all 8 functions). One amendment_log entry; no channel or role semantics change.
- file: scripts/checks/ops_governance/validate_reconcile_pending_gate.py
  action: Modify
  purpose: >-
    The DEPLOY REFUSED message names the serving deploy as writer/reader/catalog-dr/telemetry-writer, because the telemetry
    writer joins the serving leg the reconcile gate blocks. Logic is unchanged.
- file: tests/checks/ops_governance/test_validate_reconcile_pending_gate.py
  action: Modify
  purpose: The refusal case (near :433) also asserts the message names telemetry-writer (red before).
- file: scripts/build_lambda.py
  action: Modify
  purpose: >-
    Text only, every deployed-function enumeration count-free: the docstring (:122) and --ducklake-functions help (:250);
    the break-glass deploy print "[3b/4] Updating DuckLake Lambda function code (writer + reader + maintenance + maintenance-smoke
    + catalog-dr)" (:202-203); and the deployed-function part of the --ducklake-only help, "+ 5 functions: writer, reader,
    maintenance, maintenance-smoke, catalog-dr" (:233-234). The companion plan owns that help string's zip count and the
    build print (:151); no logic changes here.
- file: scripts/build_lambda_deploy.py
  action: Modify
  purpose: Docstring only (:111, :115), the same count-free wording for the DuckLake deploy map. No logic changes.
- file: .github/workflows/deploy-prod-lambdas.yml
  action: Modify
  purpose: >-
    Header comment only (:23-24): the merged deploy role covers all 8 functions, the two prod plus six DuckLake. No job,
    step or trigger changes.
- file: AGENTS.md
  action: Modify
  purpose: >-
    One word at :37: "the five DuckLake Lambdas' code" becomes "the DuckLake Lambdas' code"; the sentence's facts and links
    are unchanged.
- file: tests/ducklake_neon_smoke_test/test_lambda_telemetry_gates.py
  action: Create
  purpose: >-
    With core._sigv4_invoke, core._function_url and boto3.Session patched: the happy path passes and prints the fixed success
    line. Red cases, each raising SmokeTestFailure: unsigned 200; unsigned 403 whose body carries error_type missing_caller_identity;
    signed describe missing an action; describe on a non-smoke meta schema; data_path_is_smoke false; attach_check not ok;
    attach_check meta_schema not ducklake_smoke (the decoy honoured); catalog_login not ducklake_telemetry_writer (for example
    the shared ops login); unknown action not 400 or with another error_type; DryRun succeeding; DryRun failing with a non-AccessDenied
    code (the inconclusive message). A leak case feeds a ClientError
    whose message carries a 12-digit id, an arn: string and a lambda-url host, and asserts none of the three reaches the
    SmokeTestFailure text or captured stdout and stderr, and a second leak case does the same for a non-200 handler body
    on an HTTP check. The fixture ARN and 12-digit id are composed at runtime from a FAKE_ACCT constant (tests/test_redaction_check.py:27
    pattern), so the never-commit hook does not block the commit. A check-(1) case asserts the gate asks core._function_url
    for "telemetry_writer" and lets its SmokeTestFailure propagate. The URL never appears in any case.
- file: tests/test_build_lambda_config.py
  action: Modify
  purpose: >-
    test_ducklake_function_zip_keys (:46-58) imports _DUCKLAKE_TELEMETRY_WRITER_FUNCTION and asserts its key is lambda-packages/ducklake-telemetry-writer.zip
    (red before: the import fails).
- file: tests/verify_ci_workflow/test_ducklake_deploy_map_wiring.py
  action: Create
  purpose: >-
    The workflow wiring as data, following test_ducklake_row_rules_wiring.py:44-53 (yaml.safe_load of the workflow, then
    jobs). With the --ducklake-functions list parsed from each deploy job's steps and the `for fn in ...; do` set from each
    smoke job's freshness step: deploy-maintenance's list equals maintenance-smoke's freshness set; deploy-serving's list
    equals smoke's freshness set; the two lists are disjoint and their union equals build-lambda.yaml's deploy_targets.ducklake_function_zip_keys;
    within jobs.smoke.steps, the step whose run resolves URLs and names telemetry_writer has a lower index than the step
    whose run invokes --lambda-telemetry, and that step exists in jobs.smoke. The URL step's `for role in ...` list is parsed
    and each "agent-platform-ducklake-" + role.replace("_", "-") is a key of the deploy map; its run uses the ${role//_/-}
    expansion for --function-name and exports DUCKLAKE_${role^^}_URL. Each assertion names the job and the function it
    found missing.
- file: tests/ducklake_neon_smoke_test/test_main_dispatch.py
  action: Modify
  purpose: --lambda-telemetry dispatches to lambda_telemetry with the profile and region.
- file: tests/convergence_health/code_drift/test_ducklake.py
  action: Modify
  purpose: _ALL_DUCKLAKE_FUNCTIONS gains the telemetry writer (the seen == map set assertion); a pathspec case for the new directory.
- file: tests/build_lambda_deploy/test_update_functions.py
  action: Modify
  purpose: >-
    The map-driven all-functions deploy mocks (side effects, call counts, stride, name set) grow by one function, and
    test_only_ducklake_updates_five_functions (:158) is renamed without the count.
- file: tests/build_lambda_deploy/test_function_subset.py
  action: Modify
  purpose: >-
    The map-driven subset fixtures (:76-94) grow by one function, test_omitting_only_functions_deploys_all_five_unchanged
    is renamed without the count and the module docstring's "all-five behaviour" (:4) is reworded; the build-path counts
    were updated by the companion plan.
- file: config/agent/verification_registry/entries/telemetry-writer-smoke-gate.yaml
  action: Create
  purpose: Registry shard for graduated VP step 1 (check_id telemetry-writer-smoke-gate, command_exit_zero, the step's pytest targets).
- file: config/agent/verification_registry/entries/ducklake-deploy-map-coverage.yaml
  action: Create
  purpose: >-
    Registry shard for graduated VP step 2 (check_id ducklake-deploy-map-coverage, command_exit_zero, the step's pytest target),
    so a future DuckLake function added to the map but to no deploy leg fails the registry check.
bundled_recommendations: []
followon_recs: []
infrastructure_dependencies:
- >-
  HARD PREREQUISITES: PLAN-url-only-invoke-guard is fully applied (boundary Denies, scoped login and its secret value, PlatformDev
  URL-only invoke) and PLAN-telemetry-writer-function is merged with its tf-gated-apply run approved and green (the function,
  its URL and github_ci_branch's grant exist live). Without the second, deploy-serving's update-function-code fails on a
  missing function; without the first, gate check (4) fails (no scoped login) check (6) cannot detect a missing boundary: it proves only that the caller cannot direct-invoke.
- >-
  No Terraform change; nothing routes through the apply guard.
- >-
  Deploy: merging this plan touches no push path of deploy-ducklake-lambdas.yml (src/lambdas/ducklake_*/**, src/common/ducklake_*.py,
  config/lambda/ducklake/**, src/row_rules/**), so it deploys nothing by itself. The first governed deploy of the telemetry
  writer is a workflow_dispatch of deploy-ducklake-lambdas.yml, which builds and uploads every artifact, deploys the
  serving leg (now including the telemetry writer) behind the reconcile gate, and runs the smoke job. A governed DuckLake
  Lambda deploy is on the always-ask list, so the dispatch waits for Benjamin's word.
acceptance_criteria:
- >-
  The deploy map (build-lambda.yaml and build_lambda_config.py, equal) names the telemetry writer; deploy-serving deploys
  it; the smoke job checks its deploy-record freshness, resolves its URL into DUCKLAKE_TELEMETRY_WRITER_URL and runs --lambda-telemetry.
- >-
  The --lambda-telemetry gate asserts: unsigned 403; signed describe 200 on ducklake_smoke; signed attach_check ok on ducklake_smoke;
  decoy catalog keys in the event ignored; unknown action 400; a direct DryRun invoke is AccessDenied.
  Every check has a
  red unit case and none prints the URL, an ARN or an account id.
- >-
  code_drift watches src/lambdas/ducklake_telemetry_writer; the R3 workflow-body baseline passes with no raised count.
- >-
  Post-deploy: a dispatched deploy-ducklake-lambdas.yml run is green end to end; the telemetry writer's deploy record carries
  the dispatched commit; the --lambda-telemetry step passed in that run; the same gate also passes from the session as PlatformDev,
  the second grantee.
verification_plan:
- step: 1
  phase: pre-deploy
  action: The gate's behaviour and every red case, the CLI dispatch, the drift pathspec and the map-driven deploy counts.
  command: >-
    bin/venv-python -m pytest tests/ducklake_neon_smoke_test/test_lambda_telemetry_gates.py tests/ducklake_neon_smoke_test/test_main_dispatch.py
    tests/convergence_health/code_drift/test_ducklake.py tests/build_lambda_deploy/test_update_functions.py tests/build_lambda_deploy/test_function_subset.py
    tests/test_build_lambda_config.py tests/checks/ops_governance/test_validate_reconcile_pending_gate.py -q
  expected: >-
    Exit 0. Red before for the gate module (absent), the CLI flag, the config constant and the map-driven counts.
  fix_if: Fix the gate or the wiring; never weaken an assertion.
  hermetic: false
  graduation: graduate
  graduation_check_id: telemetry-writer-smoke-gate
  expected_literals: []
- step: 2
  phase: pre-deploy
  action: >-
    The workflow wiring is consistent: every function in the deploy map is deployed by exactly one leg's --ducklake-functions
    list and checked by that leg's freshness loop, and the telemetry writer's URL is resolved before the --lambda-telemetry
    step runs.
  command: bin/venv-python -m pytest tests/verify_ci_workflow/test_ducklake_deploy_map_wiring.py -q
  expected: Exit 0. Red before (the test module is absent).
  fix_if: >-
    A function in the map but in no list is never deployed (only the drift sensor would notice); a function in two lists
    deploys twice. Fix the workflow lists, never the test.
  hermetic: false
  graduation: graduate
  graduation_check_id: ducklake-deploy-map-coverage
  expected_literals: []
- step: 3
  phase: pre-deploy
  action: >-
    No stale enumeration of the DuckLake function set survives in the surfaces this plan owns: the deploy-paths and build-lambda
    contracts, the reconcile gate's refusal message, the build docstrings, both deploy workflows' comments and AGENTS.md.
    POSIX grep, not ripgrep, because the CI runner that replays this step has no rg (vp-red-before.yaml rg_portability_lint).
  command: >-
    ! grep -n -i -E 'five[[:space:]]ducklake|five-function|deploy[[:space:]]all[[:space:]]five|all[[:space:]]7[[:space:]]functions|writer/reader/catalog-dr\)|5[[:space:]]functions|5[[:space:]]zips|five[[:space:]]zips|all[[:space:]]eight|eight[[:space:]]artifacts|both[[:space:]]URLs'
    docs/contracts/deploy-paths.yaml docs/contracts/build-lambda.yaml scripts/checks/ops_governance/validate_reconcile_pending_gate.py
    scripts/build_lambda.py scripts/build_lambda_deploy.py .github/workflows/deploy-ducklake-lambdas.yml .github/workflows/deploy-prod-lambdas.yml
    AGENTS.md && echo ENUMERATIONS_CURRENT
  expected: Exit 0 and ENUMERATIONS_CURRENT. Red before (each file carries at least one hit today).
  fix_if: Update the named line to the six-function set; never narrow the pattern.
  hermetic: true
  graduation: waive
  graduation_waiver_reason: >-
    Prose counts are not a standing invariant (the next function would make "six" stale too); the deploy-map wiring test
    is the standing check over the function set itself.
  expected_literals: []
- step: 4
  phase: pre-deploy
  action: Fast tier, then the full tier before handoff.
  command: bin/venv-python -m scripts.validate --pre && bin/venv-python -m scripts.validate
  expected: >-
    Exit 0 on a completed full run. handoff_policy.timeout_disposition is blocked, so a timeout is not a pass: resume and
    rerun the full tier from the start.
  fix_if: Fix the named check; never raise a budget or skip a check.
  hermetic: false
  graduation: not-applicable
- step: 5
  phase: post-deploy
  action: >-
    Right after the merge, on Benjamin's word, dispatch deploy-ducklake-lambdas.yml on main (mcp__github__actions_run_trigger)
    and wait for the run to complete. Export RUN_CONCLUSION (the run's conclusion, from mcp__github__actions_get), RUN_SHA
    (its head sha) and SMOKE_LOG_FILE (the smoke job log, saved with mcp__github__get_job_logs(job_id=<the smoke job>, return_content=true,
    tail_lines=5000); confirm the returned content is not truncated by comparing it with original_length before the greps
    run, because the freshness line prints before the long dependency install).
  command: >-
    test "$RUN_CONCLUSION" = success && test -s "$SMOKE_LOG_FILE" && grep -q "OK agent-platform-ducklake-telemetry-writer
    deploy record fresh: $RUN_SHA" "$SMOKE_LOG_FILE" && grep -qF 'LAMBDA_TELEMETRY OK unsigned=403 describe=200 attach_check=ok
    unknown_action=400 direct_invoke=denied' "$SMOKE_LOG_FILE" && echo TELEMETRY_DEPLOY_GREEN
  expected: Exit 0 and TELEMETRY_DEPLOY_GREEN; the run concluded success and the gate printed its success line.
  fix_if: >-
    deploy-serving failed on the telemetry writer: check the function exists (the companion apply). The DryRun check failed
    (a DryRun success): the caller holds an unconditioned InvokeFunction grant and the boundary Deny is missing or bypassed, so stop and tell Benjamin before plan 3 part 1 proceeds. "probe inconclusive":
    read the error code and RCA it. attach_check failed: read the error_type; an S3 or secret AccessDenied is the telemetry
    role's policy (fix by PR, in budget), a Postgres permission error is the scoped login's grant set (an admin step). Never
    re-run into green without a root cause (Decision 55).
- step: 6
  phase: post-deploy
  action: >-
    The telemetry writer's deploy record in S3 carries the dispatched commit and a code hash, read as PlatformDev (the drift
    sensor's source).
  command: >-
    aws s3 cp s3://agent-platform-data-lake/deploy-records/ducklake/agent-platform-ducklake-telemetry-writer.json - --profile
    agent_platform --region eu-west-2 | bin/venv-python -c "import json,os,sys;r=json.load(sys.stdin);assert r['source_git_sha']==os.environ['RUN_SHA']
    and r['code_sha256'] and r['function']=='agent-platform-ducklake-telemetry-writer', r;print('DEPLOY_RECORD_OK')"
  expected: Exit 0 and DEPLOY_RECORD_OK.
  fix_if: >-
    AccessDenied: record that PlatformDev cannot read deploy-records/ and rely on step 5's freshness line. A stale sha: the
    deploy did not run for this function; read the deploy-serving log.
- step: 7
  phase: post-deploy
  action: >-
    The same gate from the session as PlatformDev (the second URL-only grantee), with the URL taken from SSM and never printed.
  command: >-
    DUCKLAKE_TELEMETRY_WRITER_URL=$(aws ssm get-parameter --profile agent_platform --region eu-west-2 --name /agent-platform/ducklake/telemetry_writer_url
    --query Parameter.Value --output text) AWS_PROFILE=agent_platform bin/venv-python -m scripts.ducklake_neon_smoke_test --lambda-telemetry
    > "${TMPDIR:-/tmp}/tw-gate.out" 2>&1 && grep -qF 'LAMBDA_TELEMETRY OK' "${TMPDIR:-/tmp}/tw-gate.out" && echo TELEMETRY_GATE_PLATFORMDEV_OK
  expected: Exit 0 and TELEMETRY_GATE_PLATFORMDEV_OK.
  fix_if: >-
    A DryRun that succeeds for PlatformDev but not for CI means PlatformDev holds an unconditioned grant and the boundary
    is not on its role; stop and report it. Any other failure: compare with step 5's CI run and RCA (Decision 55). Read
    the output file for the failure line; it carries no URL.
test_obligations:
- source: scripts/ducklake_smoke/lambda_telemetry_gates.py
  behavior: Each of the six gate checks raises on mismatch; the URL is never printed.
  verification_step: 1
  test_selector: tests/ducklake_neon_smoke_test/test_lambda_telemetry_gates.py
  red_green_expectation: red before (module absent), green after
- source: scripts/ducklake_neon_smoke_test.py
  behavior: --lambda-telemetry dispatches to the gate.
  verification_step: 1
  test_selector: tests/ducklake_neon_smoke_test/test_main_dispatch.py
  red_green_expectation: red before (flag absent), green after
- source: scripts/convergence_health/code_drift.py
  behavior: The new function's source directory is watched for drift.
  verification_step: 1
  test_selector: tests/convergence_health/code_drift/test_ducklake.py
  red_green_expectation: red before (pathspec and map entry absent), green after
- source: scripts/build_lambda_config.py
  behavior: The fallback deploy map equals the contract map, including the telemetry writer.
  verification_step: 1
  test_selector: tests/test_build_lambda_config.py
  red_green_expectation: red before (the constant is absent, so the extended test's import fails), green after
- source: docs/contracts/build-lambda.yaml
  behavior: The deploy map names the telemetry writer.
  verification_step: 1
  test_selector: tests/convergence_health/code_drift/test_ducklake.py::TestDetectDucklakeCodeDrift::test_reads_all_ducklake_functions
  red_green_expectation: >-
    red before (_ALL_DUCKLAKE_FUNCTIONS names the telemetry writer, the YAML map does not), green after
- source: .github/workflows/deploy-ducklake-lambdas.yml
  behavior: Every mapped function is deployed by exactly one leg and freshness-checked; the URL is resolved before the gate.
  verification_step: 2
  test_selector: tests/verify_ci_workflow/test_ducklake_deploy_map_wiring.py
