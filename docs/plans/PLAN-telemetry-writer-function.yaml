schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: telemetry-writer-function
intent: >-
  Telemetry slice 2a-2 (T2.36, rec-4024 carrier), option D, part 1 of 2. Telemetry write verbs get their own DuckLake Lambda,
  agent-platform-ducklake-telemetry-writer, with its own boundary-carrying execution role and AWS_IAM Function URL (Decision
  143 cl.3, Decision 213). That role reaches S3 only on the isolated ducklake_smoke catalog's data prefix and its fenced blob
  root, connects to the catalog as its own scoped login, and never reaches the production ducklake/ prefix, the shared
  catalog login or any ops_* verb. With PLAN-url-only-invoke-guard's boundary Denies, its requestContext.authorizer.iam
  caller identity is trustworthy, which plan 3 part 1's tenant derivation needs. This plan provisions the function with
  a stub handler (describe, attach_check) and moves the telemetry pins and blob grant off the shared writer. The companion plan PLAN-telemetry-writer-deploy-wiring
  adds the function to the governed deploy channel and its smoke gate once this one is applied. Telemetry is the learning
  signal for recursive self-improvement (PROJECT_CONTEXT).
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-telemetry-writer-function.yaml
implementation_declared: true
phase: >-
  T2.36 (telemetry re-lands on DuckLake). Infrastructure groundwork carried by rec-4024; closes no exit criterion.
scope:
- file: terraform/personal/ducklake_telemetry_writer.tf
  action: Create
  purpose: >-
    The new function, mirroring ducklake_maintenance_smoke.tf (the Decision 143 split precedent) and the writer in
    ducklake_lambdas.tf. A header comment states the apply posture as it is today: role CREATE and any aws_lambda_function_url
    change route to tf-gated-apply (environment-taxonomy.yaml guard_classification), in-budget inline-policy writes and
    Lambda config changes auto-apply, code ships through deploy-ducklake-lambdas.yml (break-glass build_lambda --deploy
    only). Resources: (1) aws_cloudwatch_log_group "/aws/lambda/${local.ducklake_telemetry_writer_function}", 14-day retention.
    (2) aws_iam_role.ducklake_telemetry_writer named agent-platform-ducklake-telemetry-writer, permissions_boundary the
    agent-platform-github-ci-apply-boundary ARN built from var.account_id, assume_role_policy data.aws_iam_policy_document.lambda_assume.json.
    (3) aws_iam_role_policy.ducklake_telemetry_writer "DuckLakeTelemetryWriterRuntime" with exactly these Sids: Logs (CreateLogStream,
    PutLogEvents on the log group ARN :*); TelemetryDsnRead (GetSecretValue on aws_secretsmanager_secret.ducklake_telemetry_writer_dsn
    only, the scoped login's secret that PLAN-url-only-invoke-guard creates; never the shared ducklake-neon-catalog-dsn); TelemetryCatalogDataReadWrite (s3:GetObject, s3:PutObject
    on "${aws_s3_bucket.data_lake.arn}/${local.ducklake_smoke_data_prefix}/*" ONLY, no DeleteObject, never the production
    ducklake/ prefix); TelemetryCatalogDataList (s3:ListBucket, s3:GetBucketLocation on the bucket, StringLike s3:prefix
    ["${local.ducklake_smoke_data_prefix}/*"]); TelemetryBlobReadWrite and TelemetryBlobList moved from the writer and fenced
    to the pinned catalog's blob root (Benjamin 2026-10-08, reversing "no fence until 2c"): Get/Put on "${aws_s3_bucket.data_lake.arn}/${local.telemetry_blob_data_prefix}/${local.ducklake_telemetry_meta_schema}/*"
    and ListBucket conditioned on s3:prefix "${local.telemetry_blob_data_prefix}/${local.ducklake_telemetry_meta_schema}/*"; CloudWatchMetrics (PutMetricData conditioned on cloudwatch:namespace
    "DuckLakeTelemetryWriter"). (4) aws_lambda_function.ducklake_telemetry_writer: function_name local.ducklake_telemetry_writer_function,
    role the new role, python3.12, handler src.lambdas.ducklake_telemetry_writer.handler.handler, x86_64, timeout 120, memory_size
