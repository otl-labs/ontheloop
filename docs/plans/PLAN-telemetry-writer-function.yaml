    TELEMETRY_DSN_SECRET_ID = aws_secretsmanager_secret.ducklake_telemetry_writer_dsn.name.
    DUCKLAKE_DATA_PATH and DUCKLAKE_META_SCHEMA are NOT set. No comment line inside the variables block (terraform fmt, #1163).
