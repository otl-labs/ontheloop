infrastructure_dependencies:
- >-
  HARD PREREQUISITE: PLAN-url-only-invoke-guard is merged and fully applied by the admin agent. It provides the bootstrap
  IAMRolesRead entry for role/agent-platform-ducklake-telemetry-writer (without it the gated apply's own post-create iam:GetRole,
  and every later plan's refresh, AccessDenies), the boundary Denies naming this function (so it is born covered), aws_secretsmanager_secret.ducklake_telemetry_writer_dsn
  with its value written, the scoped login ducklake_telemetry_writer, and PlatformDev's URL-only invoke on this function.
  Its steps 5-9 must all be complete before this plan merges (its own ordering bullet says the same). Two earlier gates
  follow from it: PLAN-url-only-invoke-guard is merged to main and this branch is based on it before VP step 5 and before
  this PR's CI, because the full tier's refresh-read coverage needs its IAMRolesRead entry and terraform-validate needs
  its secret declaration; and this PR's speculative plan is produced (pushed or re-planned) after its bootstrap and governed
  applies, so the reviewed saved plan is exactly 7 to add, 4 to change, 0 to destroy. Implementation may start earlier.
  (Amended 2026-10-10: the reviewed plan showed 5 changes, the fifth being github_ci_pr's policy, whose document is read
  during apply because it references the writer function and the writer had a pending environment change. It would have
  been a no-op.)
- >-
  Lambda deployment (Decision 79): compute_affected_artifacts over this scope returns data-pipeline (active) because of
  the manifest exclude edit. The exclude keeps data-pipeline.zip's contents unchanged, so data-pipeline needs no deploy;
  tests/lambdas/ducklake_telemetry_writer/test_packaging.py proves the exclusion. The telemetry writer (new, active) is
  built in step 3, created from the PR-time zip by the gated apply and proven live in step 7; its governed deploy and
  smoke gate are the companion plan's. The writer and reader (env and policy only) are covered by step 8.
- >-
  Guard routing (environment-taxonomy.yaml guard_classification): aws_iam_role.ducklake_telemetry_writer CREATE and aws_lambda_function_url.ducklake_telemetry_writer
  CREATE route the whole saved plan to the tf-gated-apply Environment; Benjamin approves it in GitHub Actions. The remaining
  changes would auto-apply on their own: the new role's inline policy CREATE and the writer, github_ci_branch and github_ci_planner
  inline-policy UPDATEs are in budget (authority budget v2, agent-platform- prefix, not the apply role); the function reads
  the secret PLAN-url-only-invoke-guard created, by resource reference; the log group, function,
  SSM parameter and alarm creates and the writer environment UPDATE are not IAM-sensitive. reserved_concurrent_executions
  = 5 needs lambda:PutFunctionConcurrency (held on function:agent-platform-*) and enough account headroom: the account's unreserved
  pool must stay above AWS's floor after the reservation. The account quota was raised to 1000 (terraform/personal/ducklake_maintenance.tf:40-46,
  2026-06-08), so 5 here plus the RDS swap thread's planned writer/reader reservations leave ample headroom. The apply role already holds
  CreateRole (boundary-conditioned), PassRole to lambda, function and URL create on function:agent-platform-*, log-group
  and ducklake-* alarm writes and SSM writes on parameter/agent-platform/*. No PlatformDev or PlatformAdmin policy changes
  (Decision 180).
- >-
  Code at creation (amended 2026-10-10, rec-4243): the function sets no source_code_hash, because Terraform reads no
  build artifact (environment-taxonomy.yaml conformance; it re-evaluates file functions when it applies a saved plan). The PR speculative-plan job (build-ducklake-artifacts mode upload-only) uploads ducklake-telemetry-writer.zip
  to the fixed key; the gated apply ('fetch' mode, seven artifacts) leaves that key alone and creates the function from it.
  The stub is therefore live after the apply without the deploy channel. Accepted deviation from Decision 154's reviewed-bytes
  intent (scout SPIRIT note): another PR's upload-only run can overwrite that fixed key during the approval wait; the bytes
  are a stub with no verbs and no caller other than CI, and the companion plan's governed deploy replaces them from the merged
  sha (with a deploy record) before plan 3 part 1 relies on the function. The merge's own push-triggered deploy-ducklake-lambdas.yml
  run also rebuilds and uploads every zip, this one included, to its fixed key during the approval wait; those are the
  merged sha's bytes, so that write is benign. This mirrors the maintenance-smoke creation. Merging touches src/lambdas/ducklake_*/**, so
  deploy-ducklake-lambdas.yml runs on push, but it deploys only its listed functions (the new one is not listed until the
  companion plan), so it cannot race the gated apply.
- >-
  Pipeline (Decision 77 no-TOCTOU): the reviewed saved plan is applied verbatim after approval. A stale saved plan heals
  by the workflow_dispatch acknowledge-and-retry (Decision 183), never a local apply. The deps-layer reproducibility fix
  (#1428) removed the DUCKLAKE_ZIP_MISMATCH class on merge applies; if it recurs, its heal is one re-apply dispatch.
- >-
  Ordering: IAM before code (terraform/CLAUDE.md); this plan's apply precedes the companion plan's deploy and plan 3 part
  1's verbs. The merge is a production IAM change, so it waits for Benjamin's explicit word.
acceptance_criteria:
- >-
  A new function agent-platform-ducklake-telemetry-writer exists with an AWS_IAM Function URL, its own boundary-carrying
  role, the ducklake-deps and ducklake-extensions layers, 3008 MB / 120 s, reserved concurrency 5, ignore_changes on source_code_hash,
  an errors alarm and an SSM endpoint-discovery parameter.
- >-
  Its role grants S3 Get/Put (no Delete) only on the smoke data prefix and the fenced blob root telemetry-blobs/ducklake_smoke/,
  prefix-conditioned List on those two prefixes, GetSecretValue only on the scoped login's secret, logs and metrics in
  its own namespace, and nothing on the production ducklake/ prefix or the shared DSN under IAM-wildcard semantics. Its
  env carries the three TELEMETRY_* pins on ducklake_smoke, TELEMETRY_DSN_SECRET_ID, the extension directory and field-semantics
  path, and neither DUCKLAKE_DATA_PATH nor DUCKLAKE_META_SCHEMA.
- >-
  The shared writer carries no TELEMETRY_* env and no telemetry-blobs grant; its ops statements and env are unchanged. The
  reader keeps its two telemetry pins and has no blob grant.
- >-
  github_ci_branch can invoke the new function (InvokeFunctionUrl and GetFunctionUrlConfig unconditioned, InvokeFunction
  only via the URL); no other CI role holds an invoke-class action on it under IAM-wildcard matching (the planner's Get*/List*
  read and the deploy role's UpdateFunctionCode on function:agent-platform-* are expected; PlatformDev's invoke comes from
  PLAN-url-only-invoke-guard). The planner
  can refresh-read the new role. validate_invoke_implies_resolve covers the new function.
- >-
  The stub handler rejects a request without requestContext.authorizer.iam with 403, never echoes or logs the caller account
  id or ARN, parses only the Function URL body (400 on malformed input), serves describe and attach_check, reads its catalog
  only from env at call time and never from the event.
- >-
  build_lambda builds and uploads ducklake-telemetry-writer.zip; data-pipeline's manifest excludes the new directory and
  a change to it affects only the telemetry writer artifact; the apply-path artifact set (scripts/ci/ducklake_artifacts.py's
  DUCKLAKE_ARTIFACT_NAMES) is unchanged.
- >-
  Post-deploy (amended 2026-10-10, rec-4243): the first gated apply (run 38046095276, c21ba7da) applied three creates and
  three updates and stopped; after PLAN-telemetry-writer-apply-parity's forward fix, the acknowledge-and-retry run applies
  4 added, 1 changed, 0 destroyed and the convergence record is green on it. Together the two runs created exactly the seven
  planned resources and updated exactly the four planned ones, destroying nothing; the SSM parameter resolves; an unsigned URL call is 403; as
  PlatformDev, a SigV4 describe is 200 on ducklake_smoke and attach_check returns ok under the scoped login (the first ATTACH
  under that login), while a direct DryRun invoke is AccessDenied; Decision 213 records why the gate cannot name the boundary; the
  writer and reader smoke gates still pass; a dispatched drift run is clean. The deploy-channel proof is the companion plan's
  gate.
verification_plan:
- step: 1
  phase: pre-deploy
  action: The moved telemetry infra guard passes over the real Terraform tree, with its red cases.
  command: >-
    bin/venv-python -m pytest tests/checks/iam_tf/test_telemetry_infra_pins.py::test_writer_carries_no_telemetry_state tests/checks/iam_tf/test_telemetry_infra_pins.py::test_telemetry_writer_cannot_reach_the_production_prefix
    tests/checks/iam_tf/test_telemetry_infra_pins.py::test_telemetry_writer_reads_only_its_scoped_login tests/checks/iam_tf/test_telemetry_writer_invoke_grants.py
    -q
  expected: >-
    Exit 0. Red before: the three named nodes and the grant module do not exist on the unchanged tree (Decision 189: a graduate
    step must not pass on the plan-only PR). The whole pins module, including the moved predicates and every red case, runs
    in step 5's tiers and in the telemetry-infra-pins registry check, updated in place.
  fix_if: >-
    A predicate failure names the resource and the element. Fix the Terraform, not the guard, unless the guard asserts something
    the acceptance criteria do not require.
  hermetic: true
  graduation: graduate
  graduation_check_id: telemetry-writer-function-pins
  expected_literals: []
- step: 2
  phase: pre-deploy
  action: The stub handler's behaviour, the invoke-implies-resolve extension and the build counts.
  command: >-
    bin/venv-python -m pytest tests/test_ducklake_telemetry_writer_handler.py tests/lambdas/ducklake_telemetry_writer/test_packaging.py
    tests/checks/iam_tf/test_validate_invoke_implies_resolve.py tests/test_build_lambda.py tests/build_lambda_deploy/test_function_subset.py
    tests/build_lambda_deploy/test_canary_layers.py -q
  expected: Exit 0. Red before for the handler and packaging modules (absent) and the new invoke-implies-resolve case.
  fix_if: Fix the handler or the check; never weaken an assertion.
  hermetic: false
  graduation: graduate
  graduation_check_id: telemetry-writer-stub-handler
  expected_literals: []
- step: 3
  phase: pre-deploy
  action: >-
    The new zip builds from its manifest, contains the handler and its includes and no src/telemetry, and stays within the
    size limit. (The data-pipeline exclusion is step 2's packaging test.)
  command: >-
    bin/venv-python -m scripts.build_lambda --ducklake-only --skip-upload && bin/venv-python -c "import zipfile;z=zipfile.ZipFile('lambda-packages/ducklake-telemetry-writer.zip');n=set(z.namelist());assert
    'src/lambdas/ducklake_telemetry_writer/handler.py' in n and 'src/common/ducklake_runtime.py' in n and 'config/lambda/ducklake/field_semantics.yaml'
    in n, sorted(n)[:20];assert not any(x.startswith('src/telemetry/') for x in n);print('TELEMETRY_WRITER_ZIP_OK', len(n))"
  expected: Exit 0 and the marker with the entry count.
  fix_if: >-
    A missing module is an incomplete include list; add it to the manifest (the bundle checks name it). If the local build
    needs network the container lacks, record that and rely on the speculative-plan job's upload-only build log instead.
  hermetic: false
  graduation: waive
  graduation_waiver_reason: >-
    A local build artifact check; the standing equivalents are the manifest bundle checks and the CI build in the speculative-plan
    job.
- step: 4
  phase: pre-deploy
  action: >-
    Scope and safety shape against the merge base, untracked new files included: every changed file is a scope file (or
    this plan file's own bookkeeping); no PlatformDev or PlatformAdmin
    policy touched; no `#` line inside the new file's variables block; no 12-digit literal added; the writer's and reader's
    role and URL blocks are byte-identical to the merge base. (That no other aws_iam_role changes is the speculative plan's
    exact 7/4/0 count, checked at closure.)
  command: >-
    grep -qF '> **Update (2026-10-09):** PLAN-url-only-invoke-guard step 8 measured' docs/DECISIONS.md && bin/venv-python -c "import subprocess,re,pathlib,yaml;
    from tests.fixtures.terraform_hcl_blocks import find_resource_block;
    g=lambda *a:subprocess.run(['git',*a],capture_output=True,text=True,check=True).stdout;
    mb=g('merge-base','origin/main','HEAD').strip();f='terraform/personal/ducklake_lambdas.tf';
    old,new=g('show',mb+':'+f),pathlib.Path(f).read_text(encoding='utf-8');
    errs=[t+'.'+n+'_changed' for t,n in (('aws_iam_role','ducklake_writer'),('aws_iam_role','ducklake_reader'),('aws_lambda_function_url','ducklake_writer'),('aws_lambda_function_url','ducklake_reader')) if find_resource_block(old,t,n)!=find_resource_block(new,t,n)];
    nf=g('ls-files','--others','--exclude-standard').split();ch=g('diff','--name-only',mb).split()+nf;
    pf='docs/plans/PLAN-telemetry-writer-function.yaml';
    sc={e['file'] for e in yaml.safe_load(open(pf,encoding='utf-8'))['scope']}|{pf};
    errs+=[p+':outside_scope' for p in ch if p not in sc];
    errs+=[p+':PlatformDev_or_PlatformAdmin_policy' for p in ch if p in ('terraform/personal/platform_dev_policies.tf','terraform/personal/platform_admin_policies.tf','terraform/personal/platform_admin_data_policies.tf','terraform/personal/platform_roles.tf')];
    add=[l for l in g('diff',mb,'--','terraform/').splitlines() if l.startswith('+')]+[l for q in nf if q.startswith('terraform/') for l in pathlib.Path(q).read_text(encoding='utf-8').splitlines()];
    errs+=['twelve_digit_literal_added' for l in add if re.search(r'\b\d{12}\b',l)];
    w=pathlib.Path('terraform/personal/ducklake_telemetry_writer.tf').read_text(encoding='utf-8');
    errs+=['comment_inside_variables' for _ in [0] if re.search(r'variables\s*=\s*\{[^}]*\n\s*#',w)];
    print(chr(10).join(errs) or 'SHAPE_OK');assert not errs"
  expected: Exit 0 and SHAPE_OK.
  fix_if: Revert any out-of-shape edit; a 12-digit literal becomes interpolation; a comment moves above the block.
  hermetic: false
  graduation: waive
  graduation_waiver_reason: >-
    Diff-relative to the merge base by construction; CI's terraform-validate, the speculative plan's guard verdict and step
    1's graduated guard are the standing equivalents.
- step: 5
  phase: pre-deploy
  action: Fast tier, then the full tier before handoff.
  command: bin/venv-python -m scripts.validate --pre && bin/venv-python -m scripts.validate
  expected: >-
    Exit 0 on a completed full run. handoff_policy.timeout_disposition is blocked, so a timeout is not a pass: resume and
    rerun the full tier from the start.
  fix_if: Fix the named check; never raise a budget or skip a check.
  hermetic: false
  graduation: not-applicable
- step: 6
  phase: post-deploy
  action: >-
    Amended 2026-10-10 (rec-4243; the original single-log 7/4/0 assertion cannot hold after a partial apply). After Benjamin
    approves the tf-gated-apply run of the acknowledge-and-retry dispatch that follows PLAN-telemetry-writer-apply-parity's
    forward fix, the two applies together created and updated exactly the planned resources. Save the first gated-apply job
    log (run 38046095276, its gated-apply job) to $FIRST_APPLY_LOG_FILE and the retry run's apply-job log (gated-apply when routed)
    to $RETRY_APPLY_LOG_FILE with mcp__github__actions_list / mcp__github__get_job_logs; export RETRY_RUN_ID and RETRY_SHA
    (the retry run's id and head sha, which the record write uses as run_id and commit_sha).
  command: >-
    test -n "$RETRY_SHA" && test -n "$RETRY_RUN_ID" && test -s "$FIRST_APPLY_LOG_FILE" && test -s "$RETRY_APPLY_LOG_FILE" && aws s3api
    get-object --bucket agent-platform-data-lake --key convergence/personal/sandbox.json --profile agent_platform "${TMPDIR:-/tmp}/convergence.json"
    > /dev/null && bin/venv-python -c "import json,os,re;c=json.load(open(os.environ.get('TMPDIR','/tmp')+'/convergence.json'));assert
    c['status']=='green' and c['commit_sha']==os.environ['RETRY_SHA'] and str(c['run_id'])==os.environ['RETRY_RUN_ID'], c;rd=lambda
    k:open(os.environ[k],encoding='utf-8',errors='replace').read();first,retry=rd('FIRST_APPLY_LOG_FILE'),rd('RETRY_APPLY_LOG_FILE');assert
    'c21ba7da56a5640bc7c368af6cb8b50ae92b3e78' in first and 'Provider produced inconsistent final plan' in first, 'not the first run';made=('aws_cloudwatch_log_group.ducklake_telemetry_writer','aws_iam_role.ducklake_telemetry_writer','aws_iam_role_policy.ducklake_telemetry_writer','aws_lambda_function.ducklake_telemetry_writer','aws_lambda_function_url.ducklake_telemetry_writer','aws_ssm_parameter.ducklake_telemetry_writer_url','aws_cloudwatch_metric_alarm.ducklake_telemetry_writer_errors');mod=('aws_lambda_function.ducklake_writer','aws_iam_role_policy.ducklake_writer','aws_iam_role_policy.github_ci_branch','aws_iam_role_policy.github_ci_planner');done=lambda
    log,verb:{a for a in made+mod if re.search(re.escape(a)+r': '+verb+' complete',log)};c1,c2,m1,m2=done(first,'Creation'),done(retry,'Creation'),done(first,'Modifications'),done(retry,'Modifications');assert
    c1|c2==set(made) and not c1&c2, (sorted(c1),sorted(c2));assert m1|m2==set(mod) and not m1&m2, (sorted(m1),sorted(m2));assert
    not re.search(r'Destruction complete',first+retry), 'a destroy ran';m=re.search(r'Apply complete! Resources: (\d+) added, (\d+)
    changed, (\d+) destroyed',retry);assert m and m.groups()==('4','1','0'), m and m.group(0);print('APPLY_CONVERGED', m.group(0))"
  expected: >-
    Exit 0. Conjuncts: (1) the record is green with commit_sha RETRY_SHA and run_id RETRY_RUN_ID; (2) the first log is run
    38046095276's (c21ba7da, the rec-4243 error); (3) each of the seven planned creates completed in exactly one of the
    two logs; (4) each of the four planned updates completed in exactly one of the two logs; (5) neither log destroyed
    anything; (6) the retry reports 4 added, 1 changed, 0 destroyed. Step 9's clean drift run then proves all eleven are
    live as declared.
  fix_if: >-
    A red record: read red_cause (Decision 190); DUCKLAKE_ZIP_MISMATCH (rec-4190) heals with one re-apply dispatch, and an
    AccessDenied on iam:GetRole for the new role means the IAMRolesRead pre-stage is missing (stop and tell Benjamin); never
    apply locally. A different retry split: compare it with the forward
    fix's speculative plan and the retry run's own plan; a change from an unrelated merge is reported, not absorbed. If
    the retry applied in apply-sandbox (not routed), use that job's log. A second apply failure: stop, RCA (Decision 55)
    and tell Benjamin.
- step: 7
  phase: post-deploy
  action: >-
    The stub works under the scoped login and only through its URL. As PlatformDev (which holds URL-only invoke from PLAN-url-only-invoke-guard):
    the SSM parameter resolves to a Function URL; an unsigned call is 403; a signed describe is 200 with the ducklake_smoke
    catalog; a signed attach_check is 200 with ok true, meta_schema ducklake_smoke and catalog_login ducklake_telemetry_writer
    (the first in-Lambda ATTACH under the scoped login); a direct DryRun invoke is AccessDenied. PlatformDev's own grant is
    URL-only, so AWS reports the identity-layer denial ("no identity-based policy allows", measured 2026-10-09), never the
    boundary; the boundary Deny itself is proven by the URL-only guard test and the post-apply simulate (Decision 213, updated
    by this plan). Only the outcome is printed; the URL and the error message (which carries ARNs) never are.
  command: >-
    bin/venv-python -c "import json,boto3,requests;from scripts.ducklake_smoke import core;s=boto3.Session(profile_name='agent_platform',region_name='eu-west-2');u=s.client('ssm').get_parameter(Name='/agent-platform/ducklake/telemetry_writer_url')['Parameter']['Value'];assert
    u.startswith('https://') and '.lambda-url.' in u, 'not a function url';assert requests.post(u,data=json.dumps({'action':'describe'}),timeout=60).status_code==403,
    'unsigned not 403';d=core._ok_json(core._sigv4_invoke(u,{'action':'describe'},profile='agent_platform'));assert d['catalog']['meta_schema']=='ducklake_smoke'
    and d['catalog']['data_path_is_smoke'] is True, d;a=core._ok_json(core._sigv4_invoke(u,{'action':'attach_check'},profile='agent_platform'));assert
    a['ok'] is True and a['meta_schema']=='ducklake_smoke' and a['catalog_login']=='ducklake_telemetry_writer', a;print('STUB_LIVE_OK')"
    && ! aws lambda invoke --profile agent_platform --region eu-west-2 --function-name agent-platform-ducklake-telemetry-writer
    --invocation-type DryRun /dev/null 2> "${TMPDIR:-/tmp}/tw-dryrun.err" && grep -q AccessDeniedException "${TMPDIR:-/tmp}/tw-dryrun.err"
    && echo TELEMETRY_URL_ONLY_OK
  expected: Exit 0 with STUB_LIVE_OK and TELEMETRY_URL_ONLY_OK.
  fix_if: >-
    A signed 403: PLAN-url-only-invoke-guard's PlatformDev grant is not applied. attach_check failing: a 500 names its error_type;
    a 502 with no error_type is an unmapped exception (a Postgres permission error from ATTACH, a Secrets Manager ClientError),
    so read the function's log group /aws/lambda/agent-platform-ducklake-telemetry-writer for the exception. A Postgres
    permission error is the scoped login's grant set (fix the migration through the admin, never by widening to
    the shared login), an S3 AccessDenied is this role's policy (fix by PR, in budget). An allowed DryRun means PlatformDev
    holds an unconditioned grant and the boundary Deny is missing or bypassed; stop and tell Benjamin before plan 3 part
    1 relies on the URL-only invariant.
- step: 8
  phase: post-deploy
  action: >-
    No regression for the shared writer and the reader after the writer's env and policy change restarted its containers:
    the same ops smoke gates the governed deploy channel runs.
  command: >-
    export DUCKLAKE_WRITER_URL="$(aws ssm get-parameter --name /agent-platform/ducklake/writer_url --query Parameter.Value
    --output text --profile agent_platform --region eu-west-2)" DUCKLAKE_READER_URL="$(aws ssm get-parameter --name /agent-platform/ducklake/reader_url
    --query Parameter.Value --output text --profile agent_platform --region eu-west-2)" && for g in --lambda-attach --lambda-reader
    --lambda-row-rules; do bin/venv-python -m scripts.ducklake_neon_smoke_test "$g" --profile agent_platform || exit 1;
    done && echo OPS_GATES_OK
  expected: Exit 0 and OPS_GATES_OK from all three gates after the apply; the URLs come from SSM and are never echoed.
  fix_if: >-
    A gate fails: the writer's env or policy edit disturbed the ops path, which should be impossible because no writer code
    reads the removed items. RCA it (Decision 55), report to Benjamin, and revert by a new PR if needed.
- step: 9
  phase: post-deploy
  action: >-
    Independent live-versus-declared read-back: dispatch terraform-drift.yml (mcp__github__actions_run_trigger) after the
    apply and save its drift-check job log to $DRIFT_LOG_FILE. The planner refresh-reads the new role, which also proves
    the oidc.tf entry.
  command: >-
    test -s "$DRIFT_LOG_FILE" && grep -q 'No changes. Your infrastructure matches the configuration' "$DRIFT_LOG_FILE" &&
    echo DRIFT_CLEAN
  expected: Exit 0 and DRIFT_CLEAN.
  fix_if: >-
    AccessDenied on the new role: the planner entry or the bootstrap pre-stage is missing. Drift on these resources: the apply
    did not land as planned, so report it. Unrelated drift: report it and leave the tf_drift rec to its owner.
