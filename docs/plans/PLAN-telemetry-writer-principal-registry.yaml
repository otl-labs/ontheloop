      is examined, and the holder statements found equal the union of the declared grant and exclusion Sids.
      test_undeclared_and_drifted_grants_fail, one red case each on synthetic HCL: an unregistered role with
      InvokeFunctionUrl on the writer; an unregistered role with lambda:* on function:agent-platform-*; a user policy
      with execute-api:Invoke on */POST/*; a declared function_url class with an unconditioned InvokeFunction;
      InvokeAsync on the writer; a NotAction holder; a declared Sid moved to another file; a duplicated declared Sid; a
      renamed identity; a rest_route class gaining InvokeFunctionUrl; PlatformAdmin narrowed to the writer ARN; the
      boundary policy attached as an inline role policy; the boundary attached by its literal ARN in a
      terraform/personal aws_iam_role_policy_attachment; an AWS-managed policy_arn attachment; a missing registry;
      policy = file(...), policy = templatefile(...), heredoc JSON with an Allow on the writer and a dynamic "statement"
      block (one each); github_ci_branch's data.aws_iam_policy_document attached to aws_iam_role.github_ci_pr; the same
      document composed into another role's document through source_policy_documents; an aws_iam_policy_attachment
      with roles = [...] naming a non-class role; a second aws_iam_policy reusing local.agent_session_ducklake_policy_json
      attached to another user; local.agent_session_ducklake_statements reused in a jsonencode policy attached to a
      non-class user; an unregistered role with InvokeFunctionUrl on [aws_lambda_function.ducklake_telemetry_writer.arn];
      an unregistered role with InvokeFunctionUrl on the writer's :live alias ARN. The real tree's policy = local.*_json
      and source_policy_documents = [data....json] forms stay green, as does agent_session_user.tf's concat of
      agent_session_ducklake_statements into agent_session_boundary_policy_json used as aws_iam_user.agent_session's
      permissions_boundary. Exclusion closure red cases: local.platform_admin_ops_policy_json reused in an
      aws_iam_role_policy on another role; an aws_iam_policy built from local.github_ci_apply_boundary_policy_json and
      attached by policy_arn; that local inside a role document's source_policy_documents. A statement object built by
      merge(local.base, {Action = ..., Resource = ...}) with no literal Effect is red. The real tree's
      permissions_boundary = aws_iam_policy.github_ci_apply_boundary.arn uses (never a hard-coded count), AdminOps on platform_admin only, the
      depends_on, import and removed/moved forms and the IAMFull jsondecode precondition stay green.
      test_malformed_contract_is_refused: a class missing from principal_classes, an extra class, a duplicated token, an
      unknown key in a row, an unknown path, a used path with no definition and an admitted_by of "Decision two" each
      fail. test_non_holders_stay_green: a role holding only lambda:Get* on the writer, a role invoking only the -smoke
      twin, a comment naming aws_iam_policy.github_ci_apply_boundary (as github_ci_apply.tf has) and a Deny statement
      whose Resource is the boundary policy (as DenyBoundaryPolicyModification) and an inline role policy whose Allow
      carries the boundary's name as an iam:PermissionsBoundary Condition value (as IAMRoleCreateBounded) examine clean.
    new_imports: [scripts.checks.iam_tf.validate_telemetry_writer_principals]
  - file: scripts/checks/iam_tf/_manifest.py
    action: Modify
    purpose: >-
      Register validate_telemetry_writer_principals (pre=True, full_segment="full_after_lint") with pre_globs
