  - file: scripts/checks/iam_tf/validate_telemetry_writer_principals.py
    action: Create
    purpose: >-
      Registered fast-tier check and the contract's evaluator (owner "platform"; registry.examined(n,
      unit="iam_statements"), Decision 170; an empty parse or a missing or malformed contract fails, never passes). The
      module names "telemetry-writer-principals.yaml" literally (validate_contract_drift's evaluator evidence) and holds
      the body's closed pydantic models (extra forbid; paths a closed Literal set; admitted_by and retire_when match
      "Decision N" or "rec-N"; every used path defined); the class keys must equal ducklake_telemetry_writer.yaml's
      governance.principal_classes in order, read through scripts.contracts.load_contract. Parses every Allow statement
      of every .tf file in terraform/personal and terraform/bootstrap with
      scripts.checks.iam_tf.validate_secret_parameter_grants.parse_statements (imported, never copied), after stripping
      comments and substituting each ${local.NAME} whose NAME the same root assigns one string literal; any other
      interpolation counts as a wildcard. parse_statements returns no Condition, so the module reads each holder's
      Condition from the statement body itself with validate_invoke_implies_resolve._extract_block. A statement is a
      holder when its actions (lower-cased, fnmatch IAM wildcard semantics) cover lambda:InvokeFunctionUrl,
      lambda:InvokeFunction or lambda:InvokeAsync and a resource covers the writer, by one algorithm: normalise each
      remaining ${...} to *, split the resource into its function-name part P and any qualifier after it, and with W the
      unqualified writer ARN (...:function:agent-platform-ducklake-telemetry-writer) count it when fnmatchcase(W, P) is
      true, or, with no qualifier split off, fnmatchcase(W + ":x", P) is true (so :1, :live and *-telemetry-*:live all
      count; the -smoke twin is not the writer); or the resource is not a literal (a bare reference such as
      [aws_lambda_function.ducklake_telemetry_writer.arn], a local or a for expression; fail closed), or cover
      execute-api:Invoke and a resource matches */POST/telemetry/writer or is not a literal; a non-literal action list
      counts as covering. Fails, one line per finding naming file and Sid (or file and attribute), when: a holder's
      (file, Sid) is neither a class row's grant nor an exclusion; a declared Sid is absent from its file or appears
      twice there; a row's identity file lacks the resource with that literal name; a function_url class's holder
      statements carry any action outside lambda:InvokeFunctionUrl, lambda:GetFunctionUrlConfig and
      lambda:InvokeFunction, or carry InvokeFunction without Bool lambda:InvokedViaFunctionUrl "true", or name
      InvokeAsync; a rest_route-only class holds any Lambda invoke on the writer (Decision 256 cl.2); a holder uses
      NotAction or NotResource; the PlatformAdmin exclusion's statement no longer has Resource "*", or any exclusion key
      appears in principal_classes; any policy_arn or managed_policy_arns value in either root is not
      aws_iam_policy.<name>.arn of a policy declared in the same root (an AWS-managed or literal-ARN attachment can carry
      an invoke the statement scan cannot see); the ci_apply_boundary policy, matched by its resource address and by its
      literal policy name, sits in an attachment position -- a policy_arn value, a managed_policy_arns entry, or the
      policy = expression of an aws_iam_role_policy/aws_iam_user_policy that references the boundary's resource address
      or its policy document. Not attachments: permissions_boundary attributes, iam:PermissionsBoundary Condition values
      (Decision 144 cl.1/cl.5's propagation conditions, as in github_ci_apply_policy.tf's IAMRoleCreateBounded and
      IAMRoleWriteBounded), Deny statements naming it as a Resource (DenyBoundaryPolicyModification,
      DenyProtectedPolicyWrite), its own declaration and non-IAM resources (the Decision 202 detector filter). Policy
      sources (fail closed, so the scan cannot be bypassed): any policy-bearing attribute (policy, inline_policy,
      source_json, source_policy_documents, override_policy_documents) whose value is not jsonencode(...), a same-root
      data.aws_iam_policy_document.<x>.json or a same-root local holding a jsonencode fails, as does any dynamic
      "statement" block (file(), templatefile() and heredoc JSON are invisible to parse_statements). Grant attachment,
      by reference closure: start from the innermost local or document that textually holds each class grant's statement
      (a data.aws_iam_policy_document, an aws_iam_policy, a local holding a jsonencode, or a statement-list local in any
      list or concat(...) form, such as agent_session_user.tf's agent_session_ducklake_statements) and follow every
      reference to it through concat, jsonencode, any policy-bearing attribute, source_policy_documents/
      override_policy_documents, another local and any aws_iam_policy built from it; every path must end only in
      attachments to that class's identity.resource (a role/user/group policy's policy = with its role/user, a
      policy_arn attachment's role/user, or a list-form aws_iam_policy_attachment's roles/users/groups) or in a
      permissions_boundary attribute of any identity, which caps and grants nothing (Decision 144 cl.1, the reason the
      ci_apply_boundary exclusion holds). The same closure runs from each exclusion's holding local: LambdaAdminManagement's
      local.platform_admin_ops_policy_json may end only in an aws_iam_role_policy whose role is aws_iam_role.platform_admin,
      and DataPlaneAllow's local.github_ci_apply_boundary_policy_json only in aws_iam_policy.github_ci_apply_boundary and
      from there only in permissions_boundary attributes. Non-policy references are not attachments: lifecycle
      precondition size checks (oidc_persona_verdict_role.tf's, platform_dev_policies.tf's) and precondition for
      expressions over jsondecode(local.X).Statement (platform_admin_policies.tf's IAMFull check), depends_on lists
      (github_settings_apply.tf on aws_iam_role_policy.platform_admin_ops), import to = and removed/moved from = addresses,
      and the Decision 202 detector. Statement objects built without a literal Effect key (merge(...) of a base object)
      are invisible to parse_statements, so any object literal in either root whose own level carries an Action or
      NotAction key (bare or quoted, case-sensitive; lowercase action keys such as aws_lambda_permission's are not statements) but no
      Effect key fails closed, wherever it sits.
      The function_url Condition rule reads both shapes: HCL condition { test = "Bool" variable =
      "lambda:InvokedViaFunctionUrl" values = ["true"] } blocks and JSON Condition = { Bool = {...} } objects. Owned elsewhere, said in the module docstring: resource-based grants (an
      aws_lambda_permission on the writer for another principal, a Function URL with authorization_type NONE) are
      closed at their control points by Decisions 213 cl.1 and 255 cl.2 and their own tests; the URL-only shape is also
      pinned per role by test_url_only_invoke_guard.py and test_persona_verdict_role.py. If the module crosses 500 SLOC
      it becomes a facade package (Decision 128; the Decisions 80/104/124 pattern: models, scan, rules), never a budget
      raise. Predicates take parsed text so red cases run on synthetic HCL. A read-only probe at plan write
      (context) found exactly the four classes' statements and the two exclusions; the critique's probe on main
      ba444e83 found the same nine.
    new_imports: [scripts.contracts, scripts.checks.iam_tf.validate_secret_parameter_grants, scripts.checks.iam_tf.validate_invoke_implies_resolve]
  - file: tests/checks/iam_tf/test_validate_telemetry_writer_principals.py
