    command: bin/venv-python -m scripts.checks.iam_tf.validate_telemetry_writer_principals && test ! -e docs/plans/PLAN-telemetry-producer-admission-plan-review-capture.yaml
    expected: exit 0 with a PASS line naming the statements examined, and the superseded plan absent
    fix_if: vacuous or failing -- fix the examined count or the predicate
    hermetic: false
    graduation: waive
    graduation_waiver_reason: The registered check itself runs in every fast and full tier; VP 1 carries the regression nodes.
