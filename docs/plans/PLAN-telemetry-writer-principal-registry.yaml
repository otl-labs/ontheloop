schema_version: 6
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: telemetry-writer-principal-registry
intent: >-
  Declare every identity allowed to write production telemetry in one machine-readable registry in the writer contract
  (identity, grant statements, open path, project scope, admitting Decision), and hold it with a fail-closed fast-tier
  check that fails when a declared class's grant drifts or when any Terraform identity can invoke the production writer
  without being declared, so the telemetry the feedback loop learns from has a closed, test-bound producer set (NS.5).
  Admits Agents in GitHub's persona-verdict role, granted since #2064 but undeclared. Closes T3.22 c4 (rec-4420) after
  re-grounding its text from URL-only to the two open paths (rec-5177), and hardens the producers test (rec-5198).
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-telemetry-writer-principal-registry.yaml
phase: >-
  T3.22 (in_progress) c4, follow-on mode: c5 is met, c1-c3 stay open and are not touched. Supersedes the unbuilt
  PLAN-telemetry-producer-admission-plan-review-capture (merged #1712), which this plan deletes; its capture half
  (rec-4415, T3.20 c9) is parked into T4.26 on Agents in GitHub's persona lane (rec-4506) by the operator, 2026-11-17.
cites: [dec:136, dec:144, dec:170, dec:181, dec:200, dec:210, dec:213, dec:235, dec:244, dec:246, dec:255, dec:256, dec:263]
introduces: [principal_admission, validate_telemetry_writer_principals]
closes_criteria:
  - "T3.22:c4"
scope:
  - file: docs/contracts/ducklake_telemetry_writer.yaml
    action: Modify
    purpose: >-
      Word for word as docs/plans/approved/telemetry-writer-principal-registry.yaml binds it: principal_classes gains
      github_ci_persona_verdict (taking over Decision 263 cl.4's declaring step; its ports.yaml row stays with the
      verdict-jobs plan); a new governance.principal_admission block (procedure, tenant_scope caller_account,
      scope_enforcement_owner rec-4714 with its reason, the function_url and rest_route path definitions, exclusions
      PlatformAdmin and ci_apply_boundary, four class rows with identity, grant {file, sids}, paths, project_scope,
      project_scope_enforcement, admitted_by, pinned_by and PlatformDev's retire_when rec-5282); the "Declared residual
      (principal classes)" invariant points at the registry and the check and keeps every residual with its owner
      (pre-swap PlatformDev sessions, the PlatformAdmin census, rec-4204); one newest amendment_log row (field_add).
    new_imports: []
  - file: docs/contracts/tenant-id.yaml
    action: Modify
    purpose: >-
      Word for word as the sidecar: the producer identity note names the registry as the home of every admitted
      producer identity (rec-4420), names github_ci_persona_verdict, and ties per-tenant roles to the registry's
      tenant_scope; one amendment_log row appended (this file is oldest-first).
    new_imports: []
  - file: scripts/contracts_schema.py
    action: Modify
    purpose: >-
      Word for word as the sidecar: closed models PrincipalIdentity, PrincipalGrant, PrincipalClassSpec,
      PrincipalExclusion and PrincipalAdmission (extra forbid; paths a closed Literal set; admitted_by and retire_when
      match "Decision N" or "rec-N"); ContractGovernance gains principal_admission and a validator that principal_classes
      equals the class keys with no duplicates and every used path is defined. Bound because the contract cannot load
      without it.
    new_imports: []
  - file: tests/test_contracts_schema.py
    action: Modify
    purpose: >-
      Class TestPrincipalAdmission (additive): the writer contract's registry validates; a class missing from
      principal_classes, an extra class, a duplicated token, an unknown key in a row, an unknown path, a used path with
      no definition and an admitted_by of "Decision two" each raise ValidationError.
    new_imports: []
  - file: scripts/checks/iam_tf/validate_telemetry_writer_principals.py
    action: Create
    purpose: >-
      Registered fast-tier check (owner platform; registry.examined(n, unit="iam_statements"), Decision 170; an empty
      parse or a missing contract registry fails, never passes). Reads the registry via scripts.contracts.load_contract.
      Parses every Allow statement of every .tf file in terraform/personal and terraform/bootstrap with
      scripts.checks.iam_tf.validate_secret_parameter_grants.parse_statements (imported, never copied), after
      substituting each ${local.NAME} whose NAME the same root assigns one string literal; any other interpolation counts
      as a wildcard. A statement is a holder when its actions (lower-cased, fnmatch IAM wildcard semantics) cover
      lambda:InvokeFunctionUrl, lambda:InvokeFunction or lambda:InvokeAsync and a resource matches either production
      writer ARN form (function:agent-platform-ducklake-telemetry-writer and :1; the -smoke twin is not the writer), or
      cover execute-api:Invoke and a resource matches */POST/telemetry/writer or is not a literal; a non-literal action
      list counts as covering. Fails, one line per finding naming file and Sid, when: a holder's (file, Sid) is neither a
      class row's grant nor an exclusion; a declared Sid is absent from its file or appears twice there; a row's
      identity file lacks the resource with that literal name; a function_url class's holder statements carry any action
      outside lambda:InvokeFunctionUrl, lambda:GetFunctionUrlConfig and lambda:InvokeFunction, or carry InvokeFunction
      without Bool lambda:InvokedViaFunctionUrl "true", or name InvokeAsync; a rest_route-only class holds any Lambda
      invoke on the writer (Decision 256 cl.2); a holder uses NotAction or NotResource; the PlatformAdmin exclusion's
      statement no longer has Resource "*", or any exclusion key appears in principal_classes; the ci_apply_boundary
      exclusion's policy resource is referenced anywhere but a permissions_boundary attribute. Predicates take parsed
      text so red cases run on synthetic HCL. A read-only probe at plan write (context) found exactly the four classes'
      statements and the two exclusions.
    new_imports: [scripts.contracts, scripts.checks.iam_tf.validate_secret_parameter_grants, scripts.checks.iam_tf.validate_invoke_implies_resolve]
  - file: tests/checks/iam_tf/test_validate_telemetry_writer_principals.py
    action: Create
    purpose: >-
      The check's mirror test. test_every_declared_principal_class_holds_exactly_its_grant (rec-4420's and rec-5177's
      re-pointed acceptance node): the real tree passes, every registry class and exclusion (counts read from the
      registry, never a fixed number, so an admission or retirement under the registry's procedure needs no test edit)
      is examined, and the holder statements found equal the union of the declared grant and exclusion Sids. test_undeclared_and_drifted_grants_fail, one red case each on synthetic HCL: an unregistered
      role with InvokeFunctionUrl on the writer; an unregistered role with lambda:* on function:agent-platform-*; a user
      policy with execute-api:Invoke on */POST/*; a declared function_url class with an unconditioned InvokeFunction;
      InvokeAsync on the writer; a NotAction holder; a declared Sid moved to another file; a duplicated declared Sid; a
      renamed identity; a rest_route class gaining InvokeFunctionUrl; PlatformAdmin narrowed to the writer ARN; the
      boundary policy attached as an inline role policy; a missing registry. test_non_holders_stay_green: a role holding
      only lambda:Get* on the writer and a role invoking only the -smoke twin examine clean.
    new_imports: [scripts.checks.iam_tf.validate_telemetry_writer_principals]
  - file: scripts/checks/iam_tf/_manifest.py
    action: Modify
    purpose: >-
      Register validate_telemetry_writer_principals (pre=True, full_segment="full_after_lint") with pre_globs
      terraform/personal/**, terraform/bootstrap/**, docs/contracts/ducklake_telemetry_writer.yaml,
      scripts/contracts_schema.py, scripts/contracts.py, scripts/checks/iam_tf/validate_telemetry_writer_principals.py,
      scripts/checks/iam_tf/validate_secret_parameter_grants.py, scripts/checks/iam_tf/validate_invoke_implies_resolve.py,
      so a newly added .tf file selects it in --pre.
    new_imports: []
  - file: tests/checks/iam_tf/test__manifest.py
    action: Modify
    purpose: Mirror row for the new Entry, as the existing rows.
    new_imports: []
  - file: config/ci_rca_taxonomy.yaml
    action: Modify
    purpose: >-
      validate_telemetry_writer_principals: iam_gap. NEAR_CAP (497 of 500 effective lines at plan write, many unbuilt
      plans queued on it): measure on main at build time; if the row would cross the cap, relieve by compaction inside
      the file, never a budget raise (Decisions 128, 166).
    new_imports: []
  - file: tests/checks/contracts/test_telemetry_writer_producers.py
    action: Modify
    purpose: >-
      Word for word as the sidecar (rec-5198): the hard-coded CLASS_IDENTITIES map is gone and
      test_every_declared_class_is_a_signed_identity reads each class's identity from the registry (same node, same
      claim, now for all four classes); class, grant and fence legs key on the registry's rest_route classes; the
      DuckLakeApiInvoke statement is read as a whole brace-balanced object; _name_attr tells a non-literal name from an
      absent one; drift mutations are whitespace-tolerant patterns; new node test_drift_survives_realigned_terraform
      (rec-5198's acceptance) re-aligns the real files' padding and asserts every leg stays green.
    new_imports: [scripts.checks.iam_tf.validate_invoke_implies_resolve]
  - file: tests/checks/contracts/test_tenant_id_producer_identity_model.py
    action: Modify
    purpose: >-
      Word for word as the sidecar: the principal_classes list gains github_ci_persona_verdict and must equal the
      registry's class keys in order; needles gain principal_admission and github_ci_persona_verdict.
    new_imports: []
  - file: config/telemetry/capture.yaml
    action: Modify
    purpose: >-
      The ci_uncaptured row for .github/actions/subagent-plan-review is re-owned from rec-4420 (closed by this plan) to
      rec-4415, reason "claude -p capture in Actions is parked into T4.26's persona lane (rec-4506)" (Decision 181 cl.2: a
      residual names a live owner). Nothing else changes.
    new_imports: []
  - file: config/agent/verification_registry/entries/telemetry-writer-principals.yaml
    action: Create
    purpose: Graduated shard (test_selector) for VP 1's node, guard_target the new check module.
    new_imports: []
  - file: config/agent/verification_registry/entries/contracts-schema-principal-admission.yaml
    action: Create
    purpose: Graduated shard (test_selector) for VP 2's node tests/test_contracts_schema.py::TestPrincipalAdmission.
    new_imports: []
  - file: docs/plans/PLAN-telemetry-producer-admission-plan-review-capture.yaml
    action: Delete
    purpose: >-
      Superseded (Decision 174, retirement by deletion): its registry half is this plan and its capture half is parked
      into T4.26. Its approved IAM text was never applied; provenance stays in git history (#1712).
    new_imports: []
  - file: docs/ROADMAP-PLATFORM.yaml
    action: Modify
    purpose: >-
      Word for word as the sidecar: T3.22 c4 text re-grounded to the declared open paths, adding "no undeclared
      identity holds one" and keeping "each concrete grant stays always-ask", with a dated re-grounding bracket. The
      build then sets c4 status met, met_by telemetry-writer-principal-registry (bookkeeping outside the sidecar).
    new_imports: []
  - file: docs/plans/PLAN-telemetry-writer-principal-registry.yaml
    action: Modify
    purpose: The build sets implementation_declared true.
    new_imports: []
bundled_recommendations: [rec-4420, rec-5177, rec-5198]
followon_recs: []
infrastructure_dependencies:
  - "None: no Terraform, IAM, Lambda, handler or workflow change; the check reads Terraform text only. LAMBDA-DEPLOY NOT OWED (no Lambda-packaged file in scope)."
acceptance_criteria:
  - "T3.22:c4 -- docs/contracts/ducklake_telemetry_writer.yaml carries governance.principal_admission declaring github_ci_branch, PlatformDev, agent-platform-session and github_ci_persona_verdict word for word as the approved sidecar, and principal_classes equals its class keys."
  - "T3.22:c4 -- validate_telemetry_writer_principals is registered pre=True, green on the real tree, and every red case in tests/checks/iam_tf/test_validate_telemetry_writer_principals.py fails it."
  - "rec-5198 -- tests/checks/contracts/test_telemetry_writer_producers.py::test_drift_survives_realigned_terraform passes and the four legs stay green on realigned terraform."
  - "rec-4420, rec-5177 and rec-5198 read closed after the merge; rec-4420 and rec-5177 on their acceptance re-pointed (operator-confirmed with this plan) to tests/checks/iam_tf/test_validate_telemetry_writer_principals.py::test_every_declared_principal_class_holds_exactly_its_grant."
verification_plan:
  - step: 1
    phase: pre-deploy
    action: The registry and every class's grant agree, and every undeclared or drifted holder fails the check.
    command: bin/venv-python -m pytest tests/checks/iam_tf/test_validate_telemetry_writer_principals.py -q
    expected: exit 0; red before (the module and test do not exist).
    fix_if: a real-tree assertion fails -- correct the predicate or report the drift; never edit Terraform (out of scope) or the approved registry words (a plan amendment that goes to the operator)
    hermetic: true
    expected_literals: [" passed"]
    graduation: graduate
    graduation_check_id: telemetry-writer-principals
  - step: 2
    phase: pre-deploy
    action: The governance schema accepts the registry and refuses each malformed one.
    command: bin/venv-python -m pytest tests/test_contracts_schema.py::TestPrincipalAdmission -q
    expected: exit 0; red before (the class does not exist).
    fix_if: an existing contract fails to load -- the model is too strict; fix the model within the sidecar's words or amend the plan
    hermetic: true
    expected_literals: [" passed"]
    graduation: graduate
    graduation_check_id: contracts-schema-principal-admission
  - step: 3
    phase: pre-deploy
    action: The REST-route producer legs and the hardened drift tests pass; neighbouring contract suites stay green.
    command: bin/venv-python -m pytest tests/checks/contracts/test_telemetry_writer_producers.py tests/checks/contracts/test_tenant_id_producer_identity_model.py tests/checks/contracts/test_telemetry_writer_ratification.py tests/checks/iam_tf/test__manifest.py tests/telemetry_capture/test_switch.py -q
    expected: exit 0, including test_drift_survives_realigned_terraform and test_every_declared_class_is_a_signed_identity over four classes.
    fix_if: a node fails -- the edit differs from the sidecar's words or touched more than the scope rows name
    hermetic: true
    expected_literals: [" passed"]
    graduation: waive
    graduation_waiver_reason: >-
      Existing graduated nodes keep their shards (telemetry-writer-session-producer-admitted,
      telemetry-writer-declared-classes-signed, telemetry-ingestion-and-identity-records); the full tier runs these files.
  - step: 4
    phase: pre-deploy
    action: The registered check runs standalone on the real tree (its __main__ block, as validate_secret_parameter_grants), with --pre selecting it through the Entry's pre_globs.
    command: bin/venv-python -m scripts.checks.iam_tf.validate_telemetry_writer_principals
    expected: exit 0 with a PASS line naming the statements examined
    fix_if: vacuous or failing -- fix the examined count or the predicate
    hermetic: false
    graduation: waive
    graduation_waiver_reason: The registered check itself runs in every fast and full tier; VP 1 carries the regression nodes.
  - step: 5
    phase: pre-deploy
    action: Bind the contract, roadmap, schema and test edits to the approved words.
    command: bin/venv-python -m scripts.roadmap.approved_text verify --slug telemetry-writer-principal-registry --base origin/main
    expected: exit 0; every block matches word for word
    fix_if: any word differs -- fix the edit, never the sidecar (operator-approved text)
    hermetic: false
    graduation: waive
    graduation_waiver_reason: PR-relative to origin/main, vacuous once merged; validate_merge_step's approved-text leg enforces the sidecar on the PR.
  - step: 6
    phase: pre-deploy
    action: Full tier, then HEAD attestation, after the build commit and rebase and before the push (handoff_policy); started from the top-level session, backgrounded with a 2 h limit.
    command: bin/venv-python -m scripts.validate && bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: the full tier exits 0 and the validation result attests the current HEAD's tree
    fix_if: any failure -- fix and rerun the full tier from the start
    hermetic: false
    graduation: waive
    graduation_waiver_reason: A whole full-tier run; steps 1-3 carry the durable regression.
  - step: 7
    phase: post-deploy
    action: rec-4420, rec-5177 and rec-5198 are closed by the merge's Resolves trailer.
    command: >-
      bin/venv-python -c "from src.common.ducklake_reader_client import fetch_recs_by_ids, make_reader; rows, _ =
      fetch_recs_by_ids(make_reader(), ['rec-4420', 'rec-5177', 'rec-5198']); print(sorted((r['id'], r['status']) for r in rows))"
    expected: all three closed after the closure job runs on the merge commit; record that run id
    fix_if: still open -- read the closure job's log for the acceptance refusal; fix the cause and re-run the closure route, never a direct status write
    hermetic: false
test_obligations:
  - source: scripts/checks/iam_tf/validate_telemetry_writer_principals.py
    behavior: every production-writer holder is a declared class or exclusion, and each class's statements stay within its path shape
    verification_step: 1
    test_selector: tests/checks/iam_tf/test_validate_telemetry_writer_principals.py::test_undeclared_and_drifted_grants_fail
    red_green_expectation: red before (module absent), green after
  - source: scripts/contracts_schema.py
    behavior: the principal_admission registry validates and malformed registries are refused
    verification_step: 2
    test_selector: tests/test_contracts_schema.py::TestPrincipalAdmission
    red_green_expectation: red before (models absent), green after
  - source: docs/contracts/ducklake_telemetry_writer.yaml
    behavior: the registry declares the four classes and matches the Terraform grants
    verification_step: 1
    test_selector: tests/checks/iam_tf/test_validate_telemetry_writer_principals.py::test_every_declared_principal_class_holds_exactly_its_grant
    red_green_expectation: red before (no registry), green after
  - source: docs/contracts/tenant-id.yaml
    behavior: the producer identity note points at the registry and names the fourth class
    verification_step: 3
    test_selector: tests/checks/contracts/test_tenant_id_producer_identity_model.py::test_producer_identity_model_is_recorded
    red_green_expectation: red before (needles principal_admission and github_ci_persona_verdict absent), green after
  - source: scripts/checks/iam_tf/_manifest.py
    behavior: the new check is registered in the fast tier with terraform-root pre_globs
    verification_step: 3
    test_selector: tests/checks/iam_tf/test__manifest.py
    red_green_expectation: red before (mirror row without Entry), green after
  - source: config/ci_rca_taxonomy.yaml
    behavior: the new check has a failure category
    verification_step: 4
    command: bin/venv-python -m scripts.checks.iam_tf.validate_telemetry_writer_principals
    waiver_reason: A one-row taxonomy mapping whose completeness the existing taxonomy check already enforces for every registered check.
  - source: config/telemetry/capture.yaml
    behavior: the plan-review exemption names a live owning rec
    verification_step: 3
    test_selector: tests/telemetry_capture/test_switch.py
    waiver_reason: An owner and reason re-point on an existing exemption row; no behaviour change, the capture switch reads neither field.
