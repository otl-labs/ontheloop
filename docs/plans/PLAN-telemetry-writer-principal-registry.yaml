  - "PlatformAdmin is never a class (Decision 144 cl.3); it and the CI apply permissions boundary are the only exclusions."
  - "Fail closed (operator ruling 2026-11-17): an undeclared holder fails CI, including identities other workspaces own; a later change that adds or reshapes a writer grant updates its class row in the same PR."
