    expected: exit 0; red before (the module and test do not exist).
    fix_if: a real-tree assertion fails -- correct the predicate or report the drift; never edit Terraform (out of scope) or the approved registry words (a plan amendment that goes to the operator)
    hermetic: true
    expected_literals: [" passed"]
    graduation: graduate
    graduation_check_id: telemetry-writer-principals
  - step: 2
    phase: pre-deploy
    action: The check's contract model accepts the registry and refuses each malformed one.
    command: bin/venv-python -m pytest tests/checks/iam_tf/test_validate_telemetry_writer_principals.py::test_malformed_contract_is_refused -q
    expected: exit 0; red before (the node does not exist).
    fix_if: the real contract is refused -- the model is too strict; fix the model, never the approved contract words
    hermetic: true
    expected_literals: [" passed"]
    graduation: graduate
    graduation_check_id: telemetry-writer-principals-contract
  - step: 3
    phase: pre-deploy
    action: The REST-route producer legs and the hardened drift tests pass; neighbouring contract suites stay green.
    command: bin/venv-python -m pytest tests/checks/contracts/test_telemetry_writer_producers.py tests/checks/contracts/test_tenant_id_producer_identity_model.py tests/checks/contracts/test_telemetry_writer_ratification.py tests/checks/iam_tf/test__manifest.py tests/telemetry_capture/test_switch.py tests/checks/ci_guards/test_validate_claude_p_retry_wrapper.py -q
    expected: exit 0, including test_drift_survives_realigned_terraform and test_every_declared_class_is_a_signed_identity over four classes.
    fix_if: a node fails -- the edit differs from the sidecar's words or touched more than the scope rows name
    hermetic: true
    expected_literals: [" passed"]
    graduation: waive
    graduation_waiver_reason: >-
      Existing graduated nodes keep their shards (telemetry-writer-session-producer-admitted,
      telemetry-writer-declared-classes-signed, telemetry-ingestion-and-identity-records); the full tier runs these files.
      rec-5198's new node test_drift_survives_realigned_terraform is deliberately left ungraduated: it tests the
      producers test's own tolerance, and its file runs in every full tier.
  - step: 4
    phase: pre-deploy
