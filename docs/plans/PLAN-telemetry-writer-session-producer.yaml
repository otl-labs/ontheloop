schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: telemetry-writer-session-producer
intent: >-
  Make the telemetry writer contract true again after the agent access swap: declare agent-platform-session, the
  proxy-held agent session user that has signed every new session's turn capture since 2026-11-14 (Decision 256), as a
  producer, and name both open caller paths (Function URL and the REST API's telemetry/writer route, Decision 255) in
  its caller-identity text, so the telemetry evidence the loop learns from keeps a declared, test-bound producer set
  (NS.5). Closes rec-5153; the admission registry stays rec-4420's.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-telemetry-writer-session-producer.yaml
implementation_declared: true
phase: >-
  ad_hoc_rec (soft-warn exception category): rec-5153, a follow-on owed by PLAN-agent-proxy-signed-access. It touches
  T3.22 c4's subject (producer admission) without closing it; closes_criteria is empty.
closes_criteria: []
scope:
  - file: docs/contracts/ducklake_telemetry_writer.yaml
    action: Modify
    purpose: >-
      Word for word as docs/plans/approved/telemetry-writer-session-producer.yaml blocks writer-description,
      writer-auth-and-classes, describe-403, provision-403, register-tenant-403, register-project-403,
      missing-caller-invariant, principal-residual and governance-notes-and-amendment bind them: principal_classes
      gains agent-platform-session; description, auth_type, the four 403 rows and the missing_caller_identity
      invariant name both open paths; the principal-classes residual names the session user and its route; the
      stale "principal_classes is unchanged" clause goes; a new newest amendment_log row (prose_improvement,
      semantic_break false). Nothing else in the file changes.
    new_imports: []
  - file: docs/contracts/tenant-id.yaml
    action: Modify
    purpose: >-
      Word for word as the sidecar's tenant-producer-note and tenant-amendment blocks: the producer identity note's
      writer invoke set gains agent-platform-session over the REST route; one amendment_log row appended (this file
      is oldest-first). Nothing else changes.
    new_imports: []
  - file: tests/checks/contracts/test_telemetry_writer_producers.py
    action: Create
    purpose: >-
      test_session_user_admitted, binding the contract to the deployed identity, each leg failing on its own defect:
      (a) principal_classes holds agent-platform-session and that token equals the name attribute of
      resource "aws_iam_user" "agent_session" in terraform/bootstrap/agent_session_user.tf; (b) that file's
      DuckLakeApiInvoke statement is execute-api:Invoke over the routes of local.ducklake_api_routes, and
      terraform/bootstrap/agent_ducklake_api.tf maps "telemetry/writer" to local.ducklake_telemetry_writer_function;
      (c) the API resource policy's DenyAllButAgentSession compares aws:PrincipalArn with
      local.ducklake_api_session_user_arn, whose literal ends user/<token>; (d) the one new fact beyond
      tests/lambdas/ducklake_telemetry_writer/test_caller_shapes.py (whose shape tests it does not repeat):
      handler._principal of a REST AWS_PROXY event signed by arn:aws:iam::acct-under-test:user/<token> (a non-numeric placeholder account, as test_caller_shapes.py uses) yields role_name equal
      to the contract token (the C6 caller_role), and the missing-identity refusal is typed missing_caller_identity;
      (e) each of the four 403 rows the sidecar rewrites (describe, provision_telemetry, register_tenant,
      register_project, the rows that name a delivering context) names both "Function URL" and "REST API", and no
      403 row anywhere in the contract still says "Function URL authorizer context"; the two terse rows
      (append_telemetry, begin_blobs: "no signed caller identity") stay path-neutral, naming neither path.
      Text-only terraform reads (the iam_tf convention, never state): legs (b)-(c) call the existing
      tests.checks.iam_tf._agent_ducklake_api_predicates routes_problems and policy_problems on the real files and
      add only the contract-to-identity binding (the token equals the route-granted user's name). Plus test_every_declared_class_is_a_signed_identity: it iterates principal_classes and maps
      each class to a terraform-declared identity (github_ci_branch -> role agent-platform-github-ci-branch,
      terraform/personal/oidc_ci_roles.tf; PlatformDev -> role PlatformDev, terraform/bootstrap/platform_roles.tf;
      agent-platform-session -> user agent-platform-session, terraform/bootstrap/agent_session_user.tf), failing on
      any class with no mapping or whose identity is no longer declared. Each leg is a problem-returning predicate over
      text, and a third node test_admission_legs_fail_on_drift drives every predicate on mutated real text (the class
      dropped, the user renamed, the writer route removed, the API fence widened, a rewritten 403 row reverted) and
      asserts each one reports a problem, as test_agent_ducklake_api.py's _PREDICATES table and
      test_telemetry_writer_ratification.py's test_registry_checks_fail_on_drift do. The module docstring names the
      terraform files it reads as literals (agent_session_user.tf, agent_ducklake_api.tf, oidc_ci_roles.tf,
      platform_roles.tf) so the fast tier's mention channel selects it when they change.
    new_imports: [src.lambdas.ducklake_telemetry_writer.handler, tests.checks.iam_tf._agent_ducklake_api_predicates, tests.checks.iam_tf._platform_security_hcl]
  - file: tests/checks/contracts/test_tenant_id_producer_identity_model.py
    action: Modify
    purpose: >-
      Word for word as the sidecar's identity-model-needles and identity-model-classes blocks: the principal_classes
      assertion becomes ["github_ci_branch", "PlatformDev", "agent-platform-session"]; the
      needle list gains "agent-platform-session" and "Decision 255", and "URL-only" becomes "never a direct invoke"
      (the note's new words for the same fence, Decision 213 as amended by Decision 255).
    new_imports: []
  - file: tests/checks/contracts/test_telemetry_writer_ratification.py
    action: Modify
    purpose: >-
      Word for word as the sidecar's ratification-triple-anchor block: test_contract_is_ratified_with_census reads the
      ratification triple from the amendment_log row whose summary
      starts PLAN-ratify-telemetry-writer-contract (and the two after it) instead of log[:3], and asserts every row
      above it is dated after 2026-10-29, so a later amendment no longer reddens a ratification fact. The triple's
      expected value is unchanged.
    new_imports: []
bundled_recommendations: [rec-5153]
followon_recs: [rec-5177, rec-5178]
infrastructure_dependencies: []
acceptance_criteria:
  - "docs/contracts/ducklake_telemetry_writer.yaml declares principal_classes [github_ci_branch, PlatformDev, agent-platform-session] and its caller-identity text names the Function URL and the REST API's telemetry/writer route, word for word as the approved sidecar."
  - "tests/checks/contracts/test_telemetry_writer_producers.py::test_session_user_admitted passes, and fails when the class, the IAM user name, the route grant, the API's principal fence or the four rewritten 403 rows drift."
  - "rec-5153 is closed by the build's Resolves trailer on its re-pointed acceptance."
verification_plan:
  - step: 1
    phase: pre-deploy
    action: The session user is admitted and bound to its identity and grant.
    command: bin/venv-python -m pytest "tests/checks/contracts/test_telemetry_writer_producers.py::test_session_user_admitted" "tests/checks/contracts/test_telemetry_writer_producers.py::test_admission_legs_fail_on_drift" -q
    expected: exit 0; red before (the contract lacks the class and the 403 prose names only the Function URL); the drift node proves each leg discriminates.
    fix_if: a leg fails -- fix the contract edit back to the sidecar's words or the test's parse; never the terraform (out of scope) and never a contract word beyond the sidecar (a wording change is a plan amendment that goes to the operator first)
    hermetic: true
    expected_literals: [" passed"]
    graduation: graduate
    graduation_check_id: telemetry-writer-session-producer-admitted
  - step: 2
    phase: pre-deploy
    action: Every declared class is still a declared signed identity.
    command: bin/venv-python -m pytest "tests/checks/contracts/test_telemetry_writer_producers.py::test_every_declared_class_is_a_signed_identity" -q
    expected: exit 0
    fix_if: a class names an identity terraform no longer declares
    hermetic: true
    expected_literals: [" passed"]
    graduation: graduate
    graduation_check_id: telemetry-writer-declared-classes-signed
  - step: 3
    phase: pre-deploy
    action: The neighbouring contract suites stay green with the edited assertions.
    command: bin/venv-python -m pytest tests/checks/contracts/test_tenant_id_producer_identity_model.py tests/checks/contracts/test_telemetry_writer_ratification.py tests/lambdas/ducklake_telemetry_writer/test_caller_shapes.py -q
    expected: exit 0
    fix_if: a ratification or identity-model node fails -- the edit touched more than the scope rows name
    hermetic: true
    expected_literals: [" passed"]
    graduation: waive
    graduation_waiver_reason: >-
      Existing nodes whose files the full tier already runs; steps 1 and 2 graduate the new nodes. The ratification
      triple keeps its expected value; the identity-model list grows to three members as the sidecar binds it.
  - step: 4
    phase: pre-deploy
    action: Bind the contract and test edits to the approved words.
    command: bin/venv-python -m scripts.roadmap.approved_text verify --slug telemetry-writer-session-producer --base origin/main
    expected: exit 0; all fourteen blocks match word for word
    fix_if: any word differs; fix the edit, never the sidecar (operator-approved text)
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      PR-relative to origin/main, so vacuous once merged; validate_merge_step's approved-text leg enforces the sidecar
      on every PR declaring this plan.
  - step: 5
    phase: pre-deploy
    action: Full tier, then HEAD attestation, after the build commit and rebase and before the push (handoff_policy); start it from the top-level session, backgrounded with a 2 h limit, and read only the attestation.
    command: bin/venv-python -m scripts.validate && bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: the full tier exits 0 (validate_contract_drift accepts the writer's new prose_improvement row) and the validation result attests the current HEAD's tree
    fix_if: any failure -- fix and rerun the full tier from the start
    hermetic: false
    graduation: waive
    graduation_waiver_reason: A whole full-tier run; graduate steps may not invoke scripts.validate (recursion), and steps 1-2 carry the durable regression.
  - step: 6
    phase: post-deploy
    action: The declared class is the live caller_role of session turn capture.
    command: >-
      bin/venv-python -c "import json, subprocess, time; s=str(int((time.time()-86400)*1000)); o=json.loads(subprocess.run(['aws','logs','filter-log-events','--profile','agent_platform','--region',open('config/aws-region').read().strip(),'--log-group-name','/aws/lambda/agent-platform-ducklake-telemetry-writer','--start-time',s,'--filter-pattern','\"agent-platform-session\"','--output','json'],capture_output=True,text=True,check=True).stdout); rows=[json.loads(m[m.index('{'):]) for m in (e['message'] for e in o['events']) if '{' in m]; print(sum(1 for r in rows if r.get('caller_role')=='agent-platform-session' and r.get('verb')=='append_telemetry' and r.get('status')==200))"
    expected: a count of at least 1 (at plan write, 18 such appends between 12:30Z and 14:15Z on 2026-11-14); record it in the PR body
    fix_if: 0 with sessions running means capture no longer signs as the session user -- stop and report to the coordinator (an access-looking error goes on the coordinator log), never edit the contract to match
    hermetic: false
  - step: 7
    phase: post-deploy
    action: rec-5153 is closed by the merge's Resolves trailer.
    command: >-
      bin/venv-python -c "from src.common.ducklake_reader_client import fetch_recs_by_ids, make_reader; rows, _ =
      fetch_recs_by_ids(make_reader(), ['rec-5153']); print(rows[0]['id'], rows[0]['status'])"
    expected: prints rec-5153 closed after the closure job runs on the merge commit; record that run id.
    fix_if: still open -- read the closure job's log for the acceptance or closure-artifact refusal; fix the cause and re-run the closure route, never a direct status write
    hermetic: false
test_obligations:
  - source: docs/contracts/ducklake_telemetry_writer.yaml
    behavior: the session user is a declared producer bound to its IAM name, route grant and API fence, and the 403 prose names both paths
    verification_step: 1
    test_selector: tests/checks/contracts/test_telemetry_writer_producers.py::test_session_user_admitted
    red_green_expectation: red before (class absent, Function-URL-only prose), green after
  - source: docs/contracts/tenant-id.yaml
    behavior: the producer identity note names the three-member writer invoke set and the amended fence
    verification_step: 3
    test_selector: tests/checks/contracts/test_tenant_id_producer_identity_model.py::test_producer_identity_model_is_recorded
    red_green_expectation: red before (needles agent-platform-session and never a direct invoke absent), green after
