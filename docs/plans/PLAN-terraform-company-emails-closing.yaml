schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: terraform-company-emails-closing
intent: >-
  Last of three plans moving the founder e-mail values in Terraform to company role aliases. With the founder's
  alerts subscription retired (PLAN-terraform-company-emails-forget), the Owner tag in both roots becomes the company
  operations role alias (tfvars write S3, carried by PR 3's saved plan through the tf-gated-apply approval, then the
  bootstrap admin apply A1); PR 3 also returns the company subscription to its pinned address
  aws_sns_topic_subscription.alerts_email with a moved block, removes the transitional company_alerts_email from the
  code and the contract and lands the contract's company-alias wording; S4 drops the transitional tfvars keys; and a
  docs-only closing PR records AWS-07, AWS-10 and AWS-11 as proven. Closes rec-3904 and rec-3950.
implementation_declared: false
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-terraform-company-emails-closing.yaml
phase: >-
  user_explicit_out_of_scope (soft-warn exception category) -- the AWS stage of the company ownership move (Decision
  195, Decision 242), the queue item "personal terraform variables to company values" plus the alerts-mailbox item.
  No tier_item criterion claimed.
closes_criteria: []
scope:
- file: terraform/personal/sns_alerts.tf
  action: Modify
  purpose: >-
    PR 3: the removed block and its comment, the transitional comment, variable "company_alerts_email" and
    aws_sns_topic_subscription.company_alerts_email go; aws_sns_topic_subscription.alerts_email returns (topic
    aws_sns_topic.alerts, protocol email, endpoint var.alerts_email) followed by moved { from =
    aws_sns_topic_subscription.company_alerts_email, to = aws_sns_topic_subscription.alerts_email }; the header and the
    alerts_email description take APPROVED PR 3 TEXT. The moved block stays after the build (like
    ducklake_maintenance_smoke.tf's).
- file: tests/checks/iam_tf/test_alerts_email_subscription.py
  action: Modify
  purpose: >-
    PR 3: test_predecessor_forgotten_not_destroyed is replaced by the standing guard test_subscription_at_pinned_address:
    aws_sns_topic_subscription.alerts_email sits on aws_sns_topic.alerts with protocol email and endpoint
    var.alerts_email, whose variable declares no default; no count or for_each on it; nothing transitional is left (no
    company_alerts_email variable or resource; Terraform itself rejects a removed block beside the restored resource);
    the file carries no at-sign. It pins no comment wording and no subscription count (Decision 244 cl.4)
    (weakening_dispositions).
- file: docs/contracts/terraform-cc-web-operations.yaml
  action: Modify
  purpose: >-
    PR 3: APPROVED PR 3 TEXT's five contract blocks: recoverable_vars back to six, owner_email's source names the
    company operations role alias, the company_alerts_email entry is removed, owner_vs_alerts_email is rewritten, and
    one new amendment_log entry. validate_terraform_cc_web_operations fails if the entry outlives the variable.
- file: docs/runbooks/ducklake-catalog-operations.md
  action: Modify
  purpose: >-
    PR 3: APPROVED PR 3 TEXT's two runbook blocks correct the stale endpoint sentence and the "click the confirmation
    link" instruction; no procedure is added (Decision 127 cl.2: grandfathered runbook, corrections only).
- file: docs/contracts/account-credential-inventory.yaml
  action: Modify
  purpose: >-
    PR 4 (docs-only closing PR, after the live proofs): AWS-07, AWS-10 and AWS-11 flip to proven with owner company,
    AWS-10's location and target and AWS-11's target take the approved text, three evidence_ledger entries and one
    amendment_log entry (APPROVED CLOSING TEXT).
- file: docs/plans/PLAN-terraform-company-emails-closing.yaml
  action: Create
  purpose: This plan; PR 3 flips implementation_declared to true.
bundled_recommendations:
- rec-3904
- rec-3950
followon_recs:
- rec-4895
weakening_dispositions:
- candidate: "[test-removed] tests/checks/iam_tf/test_alerts_email_subscription.py::test_predecessor_forgotten_not_destroyed"
  disposition: planned-change
  cite: "acceptance_criteria[1]"
infrastructure_dependencies:
- >-
  Infrastructure Dependencies table (terraform/personal in scope; pipeline mechanics are environment-taxonomy.yaml's,
  not restated). | order | dependency | timing | owner | -- | 1 | PLAN-terraform-company-emails-forget complete
  (successor-only subscription, its confirmed state persisted, alerts_email = company alias) | before PR 3 opens |
  VP 1 | -- | 2 | PR 3's first trusted plan is NO_CHANGES with no drift line | before S3 | VP 4 | -- | 3 | S3 sets
  owner_email and the transitional previous_owner_email | the operator can approve within the hour | agent, on the
  operator's word | -- | 4 | PR 3's saved plan (Owner tag updates; the move is a no-op) routes to tf-gated-apply at
  merge (aws_iam_role and aws_iam_openid_connect_provider tag updates are out of budget; the merge-time subagent
  review runs on the guard-PASS path only, so the operator's approval is the review) | merge, operator approval
  in the Environment | CI and operator | -- | 5 | bootstrap Owner tags (A1) | after PR 3's apply | human-directed
  admin apply (Decision 126) | -- | 6 | S4 drops the transitional keys | after VP 8 | agent, on the operator's word.
- >-
  Required checks: pr-validate and terraform-validate (terraform/github/repo.tf; Decision 119: no local init, validate
  or plan of terraform/personal, provider-free terraform fmt -check only). The trusted plan job is advisory (Decision
  83): it saves plan.bin, the terraform-plan-digest status and the names-only comment, then its fit_check step fails
  when the reviewer digest is OPAQUE or OVERFLOW, as PR 3's post-S3 plan is expected to (constraints). The bootstrap
  root is planned and applied in an ADMIN session (terraform/bootstrap/CLAUDE.md), never by CI. No scope file is under
  terraform/bootstrap, so no pre-merge bootstrap plan step is owed (deploy-paths.yaml admin_out_of_band); the
  2026-11-04 read-only baseline plan read 42 no-op and 19 Owner-tagged resources.
- >-
  LAMBDA: compute_affected_artifacts(<this plan's scope>) returns {} -- no scope file is Lambda-packaged (Decision 79).
acceptance_criteria:
- >-
  The Owner tag is the company operations role alias on every Owner-tagged resource in both roots (VP 8, VP 9), with
  the convergence record green and the drift plan clean after each terraform/personal change (VP 7).
- >-
  The one e-mail subscription sits at aws_sns_topic_subscription.alerts_email on var.alerts_email, the company alerts
  role alias, and nothing transitional is left in the code (VP 2, VP 4, VP 8).
- >-
  The tfvars parameter holds exactly its six baseline keys again, with company values for owner_email and alerts_email
  and every other value unchanged (VP 10).
- >-
  PR 3's contract and runbook equal their base with APPROVED PR 3 TEXT applied and its sns_alerts.tf blocks are in
  place (VP 3); PR 4 changes the inventory exactly as APPROVED CLOSING TEXT says and nothing else (VP 11); AWS-07, AWS-10 and AWS-11 are proven with owner company; rec-3904 and rec-3950 are
  closed (VP 12).
- >-
  EVIDENCE.md records S3, B3, A1, S4, B4 and O1 by kind and UTC time with no address, id or ARN, and no PR text this
  plan wrote matches the redaction pattern (VP 13).
verification_plan:
- step: 1
  phase: pre-deploy
  action: >-
    Start gate: the session's alias file is valid; the admin chain works; PLAN-terraform-company-emails-forget is
    declared on origin/main and its rows B2, C2 and S2 read pass; the parameter holds the six baseline keys plus
    company_alerts_email, with alerts_email and company_alerts_email both the company alerts role alias and
    owner_email not yet the operations alias; the topic has one e-mail subscription, the company one, confirmed;
    Decision 226's red-main overlap check is clear.
  command: |-
    bin/venv-python - <<'PY' && bin/venv-python -m scripts.ci_rca.red_overlap --plan docs/plans/PLAN-terraform-company-emails-closing.yaml
    import json, os, re, subprocess, boto3, yaml
    F = os.path.join(os.environ.get('TMPDIR', '/tmp'), 'tf-company-emails', 'aliases.json'); A = json.load(open(F))
    assert sorted(A) == ['alerts', 'operations'] and len(set(A.values())) == 2 and all(v.count('@') == 1 for v in A.values()), 'alias file roles'
    parts = {k: v.split('@') for k, v in A.items()}
    assert parts['alerts'][1] == parts['operations'][1] != 'users.noreply.github.com' and os.stat(F).st_mode & 0o077 == 0, 'alias file domain or mode'
    R = open('config/aws-region').read().strip(); B = boto3.Session(profile_name='agent_platform_admin', region_name=R)
    assert 'assumed-role/PlatformAdmin/' in B.client('sts').get_caller_identity()['Arn'], 'admin chain'
    subprocess.run(['git', 'fetch', '-q', 'origin', 'main'], check=True)
    prior = yaml.safe_load(subprocess.run(['git', 'show', 'origin/main:docs/plans/PLAN-terraform-company-emails-forget.yaml'], capture_output=True, text=True, check=True).stdout)
    assert prior['implementation_declared'] is True, 'PLAN-terraform-company-emails-forget not built'
    ev = open('/mnt/project-files/terraform-company-emails/EVIDENCE.md', encoding='utf-8').read()
    assert all(re.search(rf'^\| {r} \|.*\| pass \|$', ev, re.M) for r in ('B2', 'C2', 'S2')), 'plan 2 evidence rows'
    if 'v_s3_before' in json.load(open('/mnt/project-files/terraform-company-emails/build-state.json')):
        print('START_OK resumed after S3'); raise SystemExit(0)
    kv = dict(re.findall(r'^\s*([a-z_]+)\s*=\s*"?([^"\n]*)"?\s*$', B.client('ssm').get_parameter(Name='/secret/agent-platform-terraform-personal-tfvars', WithDecryption=True)['Parameter']['Value'], re.M))
    assert sorted(kv) == ['account_id', 'alerts_email', 'company_alerts_email', 'neon_org_id', 'owner_email', 'platform_admin_external_id', 'platform_dev_external_id'], sorted(kv)
    assert kv['alerts_email'] == kv['company_alerts_email'] == A['alerts'] and kv['owner_email'] != A['operations'], 'tfvars values'
    topic = f"arn:aws:sns:{R}:{B.client('sts').get_caller_identity()['Account']}:agent-platform-alerts"
    subs = [s for s in B.client('sns').list_subscriptions_by_topic(TopicArn=topic)['Subscriptions'] if s['Protocol'] == 'email']
    assert len(subs) == 1 and subs[0]['Endpoint'] == A['alerts'] and subs[0]['SubscriptionArn'] != 'PendingConfirmation', 'subscription'
    print('START_OK')
    PY
  expected: >-
    Prints START_OK (or START_OK resumed after S3, when build-state.json records S3 and VP 5, VP 8 and VP 10 carry the
    live state), then a JSON line whose verdict is clear (exit 0).
  fix_if: >-
    No alias file: write it (PLAN-terraform-company-emails execution_steps, start). Plan 2 not complete: stop. Another
    key set or value: stop and ask the coordinator, who owns the parameter's writer order. A blocked or unavailable
    overlap verdict: hold and tell the coordinator (Decision 226).
  hermetic: false
  graduation: not-applicable
- step: 2
  phase: pre-deploy
  action: >-
    PR 3 subscription shape, the standing guard: the one subscription at the pinned address on var.alerts_email, no
    meta-argument, no company_alerts_email variable or resource, no at-sign in the file.
  command: >-
    bin/venv-python -m pytest -q
    tests/checks/iam_tf/test_alerts_email_subscription.py::test_subscription_at_pinned_address
  expected: One test passes (exit 0).
  expected_literals:
  - 1 passed
  fix_if: >-
    A failure: sns_alerts.tf differs from the PR 3 shape in scope; fix it.
  hermetic: true
  graduation: graduate
  graduation_check_id: alerts-subscription-pinned-address
- step: 3
  phase: pre-deploy
  action: >-
    PR 3 texts: the contract and the runbook equal their words at PR 3's base (the merge-base with origin/main) with
    APPROVED PR 3 TEXT's blocks applied, whole-file and whitespace aside, {{DATE}} the only variance (approved_text
    verify, the check validate_merge_step runs for a sidecar); in sns_alerts.tf, whose code PR 3 also restructures,
    each block's after words are present and its before words gone; where_values_live has no company_alerts_email
    key, and outside docs/plans the name survives only in the contract's amendment_log and the two tests that pin it;
    the contract check passes. The approved text is read from the plan at that base, and PR 3 changes the plan only
    in implementation_declared.
  command: |-
    bin/venv-python - <<'PY'
    import subprocess, yaml
    from pathlib import Path
    from scripts.roadmap import approved_text as at
    from scripts.checks.contracts.validate_terraform_cc_web_operations import validate_terraform_cc_web_operations as vt
    subprocess.run(['git', 'fetch', '-q', 'origin', 'main'], check=True)
    base = subprocess.run(['git', 'merge-base', 'origin/main', 'HEAD'], capture_output=True, text=True, check=True).stdout.strip()
    PL = 'docs/plans/PLAN-terraform-company-emails-closing.yaml'; drop = lambda m: {k: v for k, v in m.items() if k != 'implementation_declared'}
    p = yaml.safe_load(subprocess.run(['git', 'show', f'{base}:{PL}'], capture_output=True, text=True, check=True).stdout)
    assert drop(p) == drop(yaml.safe_load(open(PL, encoding='utf-8'))), 'the plan changed beyond implementation_declared'
    w = yaml.safe_load([s for s in p['execution_steps'] if s.startswith('APPROVED PR 3 TEXT')][0].split('\n', 1)[1])
    TF = 'terraform/personal/sns_alerts.tf'
    bad = at.verify(at.Sidecar(schema_version=1, slug='terraform-company-emails-closing', blocks=[b for b in w['blocks'] if b['file'] != TF]), Path('.'), base)
    norm = lambda t: ' '.join(t.split()); tf = norm(open(TF, encoding='utf-8').read())
    bad += [b['id'] for b in w['blocks'] if b['file'] == TF and (norm(b['after']) not in tf or norm(b['before']) in tf)]
    c = yaml.safe_load(open('docs/contracts/terraform-cc-web-operations.yaml', encoding='utf-8'))
    if 'company_alerts_email' in c['tfvars_and_remote_state_recovery']['where_values_live']:
        bad.append('entry company_alerts_email')
    if 'company_alerts_email' in yaml.safe_dump({k: v for k, v in c.items() if k != 'amendment_log'}):
        bad.append('contract names company_alerts_email outside amendment_log')
    keep = ('docs/contracts/terraform-cc-web-operations.yaml', 'tests/test_materialise_tfvars_delegate.py', 'tests/checks/iam_tf/test_alerts_email_subscription.py')
    bad += [l.split(':')[0] for l in subprocess.run(['git', 'grep', '-n', 'company_alerts_email', '--', '.', ':!docs/plans'], capture_output=True, text=True).stdout.splitlines() if not l.startswith(keep)]
    f = []; vt(f); assert not bad and not f, (bad, f); print('PR3_TEXT_OK', len(w['blocks']))
    PY
  expected: Prints PR3_TEXT_OK 9 (exit 0).
  fix_if: >-
    A missing or stale block: restore the approved text; any other wording, including one a review asks for, goes to
    the coordinator, then the operator, before merge.
  hermetic: false
  graduation: waive
  graduation_waiver_reason: >-
    Moment claim (Decision 244 cl.4): it binds one PR to operator-approved text and goes red by design when a later
    plan edits these files; validate_terraform_cc_web_operations and VP 2's graduated test stay the standing checks.
- step: 4
  phase: pre-deploy
  action: >-
    PR 3 open, before S3: its trusted plan comment for the PR's current head reads NO_CHANGES with zero counts (the moved block is a no-op move),
    carries no drift line (PLAN-terraform-company-emails-forget persisted the confirmed successor), has a saved plan,
    and leaks nothing.
  command: |-
    test -n "$PR_NUMBER" && bin/venv-python - <<'PY'
    import json, os, re, sys, urllib.request
    get = lambda p: json.load(urllib.request.urlopen('https://api.github.com/repos/otl-labs/ontheloop/' + p, timeout=30))
    head = get(f"pulls/{os.environ['PR_NUMBER']}")['head']['sha']
    body = [c['body'] for c in get(f"issues/{os.environ['PR_NUMBER']}/comments?per_page=100") if 'terraform/personal speculative plan (trusted' in c['body'] and f'PR head `{head}`' in c['body']][-1]
    scan = re.sub(r'\b[0-9a-f]{40,64}\b', '', body)
    leaks = [n for n, x in (('at', r'@[a-z0-9-]+\.[a-z]'), ('12-digit', r'(?<!\d)\d{12}(?!\d)'), ('arn', r'\barn:')) if re.search(x, scan)]
    ok = (re.search(r'^State: NO_CHANGES$', body, re.M) and '0 to import, 0 to add, 0 to change, 0 to destroy (0 replaced)' in body
          and 'Drift detected outside Terraform' not in body and 'This saved plan is applied at merge' in body and not leaks)
    print(json.dumps({'no_changes_no_drift': bool(ok), 'leaks': leaks})); sys.exit(0 if ok else 'TRUSTED PLAN STOP')
    PY
  expected: >-
    One JSON line {"no_changes_no_drift": true, "leaks": []}.
  fix_if: >-
    A change on alerts_email's endpoint: S2 of the forget plan has not run or holds another value; stop, never merge
    (a replace AccessDenies through CI). A drift line: some resource changed outside Terraform; do not run S3, because
    the classifier would read the window as out_of_band_drift (an immediate red); triage the drift with the
    coordinator first. A refusal: stop.
  hermetic: false
  graduation: not-applicable
- step: 5
  phase: pre-deploy
  action: >-
    After S3: the version advanced by one; owner_email equals the company operations role alias;
    previous_owner_email equals the owner_email the previous version held; every other line is unchanged. Prints no
    value.
  command: |-
    bin/venv-python - <<'PY'
    import json, os, re, boto3
    A = json.load(open(os.path.join(os.environ.get('TMPDIR', '/tmp'), 'tf-company-emails', 'aliases.json')))
    N = '/secret/agent-platform-terraform-personal-tfvars'; s = json.load(open('/mnt/project-files/terraform-company-emails/build-state.json'))
    ssm = boto3.Session(profile_name='agent_platform_admin', region_name=open('config/aws-region').read().strip()).client('ssm')
    kv = lambda t: dict(re.findall(r'^\s*([a-z_]+)\s*=\s*"?([^"\n]*)"?\s*$', t, re.M))
    p = ssm.get_parameter(Name=N, WithDecryption=True)['Parameter']; new = kv(p['Value'])
    old = kv(ssm.get_parameter(Name=f"{N}:{s['v_s3_before']}", WithDecryption=True)['Parameter']['Value'])
    assert p['Version'] == s['v_s3_before'] + 1, ('another writer touched the parameter', p['Version'])
    assert set(new) == set(old) | {'previous_owner_email'}, 'key set'
    assert new['owner_email'] == A['operations'] and new['previous_owner_email'] == old['owner_email'], 'owner values'
    assert all(new[k] == old[k] for k in old if k != 'owner_email'), 'other lines changed'
    print('S3_OK version', p['Version'])
    PY
  expected: Prints S3_OK with the new version number.
  fix_if: >-
    Another version number or a wrong value: stop and run the S3 rollback on the operator's word.
  hermetic: false
  graduation: not-applicable
- step: 6
  phase: pre-deploy
  action: >-
    PR 3, after its trusted plan is re-run following S3: the comment for the PR's current head is newer than T_S3 and reads CHANGES,
    no import, create, destroy or replace; every row an update whose changed attributes are among tags_all, tags and
    policy; at least one aws_iam_role row; no drift line; the guard predicts BLOCKED (tf-gated-apply at merge); the
    reviewer digest fit is FITS, OPAQUE or OVERFLOW, and every address unknown at plan time is a data source or a row
    whose changed attributes include policy; nothing leaks.
  command: |-
    test -n "$PR_NUMBER" && test -n "$T_S3" && bin/venv-python - <<'PY'
    import json, os, re, sys, urllib.request
    get = lambda p: json.load(urllib.request.urlopen('https://api.github.com/repos/otl-labs/ontheloop/' + p, timeout=30))
    head = get(f"pulls/{os.environ['PR_NUMBER']}")['head']['sha']
    cs = [c for c in get(f"issues/{os.environ['PR_NUMBER']}/comments?per_page=100") if 'terraform/personal speculative plan (trusted' in c['body'] and f'PR head `{head}`' in c['body']]
    c = cs[-1]; body = c['body']; fresh = max(c['created_at'], c['updated_at']) > os.environ['T_S3']
    scan = re.sub(r'\b[0-9a-f]{40,64}\b', '', body)
    leaks = [n for n, x in (('at', r'@[a-z0-9-]+\.[a-z]'), ('12-digit', r'(?<!\d)\d{12}(?!\d)'), ('arn', r'\barn:')) if re.search(x, scan)]
    rows = [r for r in re.findall(r'^\| ([^|]+?) \| ([^|]+?) \| ([^|]*?) \|$', body, re.M) if r[0] != 'Resource' and not set(r[0]) <= set('-')]
    tagonly = bool(rows) and all(r[1] == 'update' and set(x.strip() for x in r[2].split(',')) <= {'tags_all', 'tags', 'policy'} for r in rows)
    counts = re.search(r'^0 to import, 0 to add, \d+ to change, 0 to destroy \(0 replaced\)\.$', body, re.M)
    fit = (re.search(r'^Reviewer digest fit: (\w+)$', body, re.M) or [None, 'MISSING'])[1]
    unknown = re.findall(r'`([^`]+)`', (re.search(r'^Unknown at plan time: (.*)$', body, re.M) or [None, ''])[1])
    policy_rows = {r[0] for r in rows if 'policy' in [x.strip() for x in r[2].split(',')]}
    unknown_ok = all(a.startswith('data.') or a in policy_rows for a in unknown)
    ok = (fresh and 'State: CHANGES' in body and counts and tagonly and any(r[0].startswith('aws_iam_role.') for r in rows)
          and 'Drift detected outside Terraform' not in body and 'Predicted guard verdict: BLOCKED' in body
          and fit in ('FITS', 'OPAQUE', 'OVERFLOW') and unknown_ok and not leaks)
    print(json.dumps({'fresh': fresh, 'updates': len(rows), 'tag_only': tagonly, 'fit': fit, 'unknown_ok': unknown_ok, 'leaks': leaks})); sys.exit(0 if ok else 'TRUSTED PLAN STOP')
    PY
  expected: >-
    One JSON line with fresh true, an update count, tag_only true, fit FITS, OPAQUE or OVERFLOW, unknown_ok true and
    no leaks.
  fix_if: >-
    Not fresh: the re-run has not finished. Any create, destroy, other attribute or drift line: stop; do not merge, and
    restore owner_email (S3 rollback) if the window cannot be kept (constraints, S3 window).
  hermetic: false
  graduation: not-applicable
- step: 7
  phase: post-deploy
  action: >-
    Convergence proof (Decision 190): the apply runs (every terraform-apply-sandbox run for MERGE_SHA, or the one
    heal dispatch APPLY_RUN names) completed with success (for PR 3 that includes the approved gated-apply job), and
    the merge-time review's verdict is printed (none for PR 3, whose routed apply skips that review); the first
    completed terraform-drift run on main created after the later of AFTER (UTC, YYYY-MM-DDTHH:MM:SSZ) and those runs'
    completion succeeded and reads clean or measured converged; the convergence record is green; neither the drift
    log nor the apply logs carry e-mail-shaped text. Run before S3 (AFTER = now), after PR 3's gated
    apply (MERGE_SHA) and after S4 (AFTER). A terraform-drift dispatch is allowed only once no apply for MERGE_SHA is
    still running: it reads the infrastructure but writes the convergence record and may file a tf_drift rec.
  command: |-
    test -n "$AFTER$MERGE_SHA$APPLY_RUN" && bin/venv-python - <<'PY'
    import json, os, re, sys, urllib.request, boto3
    R = 'https://api.github.com/repos/otl-labs/ontheloop/'
    get = lambda p, raw=False: (lambda r: r.read().decode('utf-8', 'replace') if raw else json.load(r))(urllib.request.urlopen(R + p, timeout=60))
    after = os.environ.get('AFTER', ''); alog = ''
    assert not after or re.fullmatch(r'\d{4}-\d\d-\d\dT\d\d:\d\d:\d\dZ', after), 'AFTER must read YYYY-MM-DDTHH:MM:SSZ'
    if os.environ.get('APPLY_RUN') or os.environ.get('MERGE_SHA'):
        ap = [get('actions/runs/' + os.environ['APPLY_RUN'])] if os.environ.get('APPLY_RUN') else get('actions/workflows/terraform-apply-sandbox.yml/runs?head_sha=' + os.environ['MERGE_SHA'])['workflow_runs']
        assert ap and all(r['status'] == 'completed' for r in ap), 'apply run not completed yet'
        alog = ''.join(get(f"actions/jobs/{j['id']}/logs", raw=True) for r in ap for j in get(f"actions/runs/{r['id']}/jobs")['jobs'] if j['conclusion'] != 'skipped')
        print('REVIEWER', re.findall(r'Reviewer verdict: (\w+)', alog))
        assert all(r['conclusion'] == 'success' for r in ap), [(r['id'], r['conclusion']) for r in ap]
