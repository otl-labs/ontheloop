rollback: >-
  Every parameter rollback is key-scoped: the same read-modify-write and version check as the write, restoring only
  the keys that step changed from the version recorded before it, so a later serialised writer's lines survive. S3
  before PR 3's apply: on the operator's word, restore owner_email and drop previous_owner_email (constraints, S3
  window).
  PR 3 after its apply: forward only. The address move reverses with a forward PR that deletes PR 3's moved block (two
  opposite moves form a cycle Terraform rejects) and carries moved { from = aws_sns_topic_subscription.alerts_email, to
  = aws_sns_topic_subscription.company_alerts_email } and the transitional variable (a no-change move; never a plain revert, which would forget the subscription and create a new pending
  one); the Owner tags revert with the S3 rollback carried by a PR's saved plan through the gated approval. A1:
  re-apply bootstrap with the previous owner_email value materialised, on the operator's word. S4: re-add the two
  keys from v_s4_before (main declares neither key, so nothing changes in Terraform). PR 4: revert the PR (docs only). Never move a
  subscription with a replace: it AccessDenies through CI.
