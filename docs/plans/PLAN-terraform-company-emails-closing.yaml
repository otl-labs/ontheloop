execution_steps:
- |-
  Start. Read docs/PROJECT_CONTEXT.md, this plan and the handoff notes the two earlier plans left in /mnt/project-files/terraform-company-emails/. Write the session's alias file as PLAN-terraform-company-emails execution_steps (start) shows, and follow that plan's conventions for every live step (present, wait for the word, verify, one EVIDENCE.md row, times and versions in build-state.json). Run VP 1.
- |
  APPROVED PR 3 TEXT (YAML; PR 3; each block's after replaces its before verbatim, whitespace aside; {{DATE}} is the commit date):
  blocks:
  - id: contract-recoverable-vars
    file: docs/contracts/terraform-cc-web-operations.yaml
    before: >-
      Seven no-default, non-ephemeral vars (`account_id`, `alerts_email`, `owner_email`,
      `platform_dev_external_id`, `platform_admin_external_id`, `neon_org_id`, and the transitional
      `company_alerts_email`) are recoverable;
    after: >-
      Six no-default, non-ephemeral vars (`account_id`, `alerts_email`, `owner_email`,
      `platform_dev_external_id`, `platform_admin_external_id`, `neon_org_id`) are recoverable;
  - id: contract-owner-email-source
    file: docs/contracts/terraform-cc-web-operations.yaml
    before: >-
      the `Owner` resource tag value in the remote state -- the GitHub no-reply role-alias identity (see
      `owner_vs_alerts_email` below; this is never the alerts mailbox).
    after: >-
      the `Owner` resource tag value in the remote state of both roots -- the company operations role alias (see
      `owner_vs_alerts_email` below; never a person and never the alerts mailbox).
  - id: contract-company-alerts-entry-removed
    file: docs/contracts/terraform-cc-web-operations.yaml
    before: >-
      company_alerts_email: declared_in: terraform/personal/sns_alerts.tf source: >- The
      `/secret/agent-platform-terraform-personal-tfvars` SSM parameter; also present as the `endpoint` attribute of
      `aws_sns_topic_subscription.company_alerts_email` in the remote state -- the company alerts role alias.
      Transitional (PLAN-terraform-company-emails): it carries the successor subscription while the founder's is
      retired, and leaves with PLAN-terraform-company-emails-closing, which moves the subscription to
      `aws_sns_topic_subscription.alerts_email`.
    after: ''
  - id: contract-owner-vs-alerts
    file: docs/contracts/terraform-cc-web-operations.yaml
    before: >-
      `owner_email` and `alerts_email` are two different role-alias identities that must never be
      reconciled to the same value: `owner_email` backs the GitHub no-reply identity used for
      resource `Owner` tags (a stable per-repo identifier, never a deliverable mailbox);
      `alerts_email` backs the SNS alerts subscription endpoint (a real, deliverable mailbox that
      must receive and confirm the page-out email). They differ BY DESIGN. Reading the tag-vs-
      subscription-endpoint diff as drift is a misdiagnosis -- the diff is a RECOVERY ARTEFACT of
      two intentionally distinct sources, and "fixing" it would either break alerting (routing
      pages to a no-reply address that cannot receive mail) or pollute the `Owner` tag with a real
      mailbox literal in a public repository (Decision 101).
    after: >-
      `owner_email` and `alerts_email` are two different company role aliases that must never be
      reconciled to the same value: `owner_email` is the company operations role alias used for
      resource `Owner` tags in both roots (whom to contact about a resource: a role, never a person);
      `alerts_email` is the company alerts role alias, the deliverable mailbox that confirms the SNS
      alerts subscription and receives every page. They differ BY DESIGN. Reading the tag-vs-
      subscription-endpoint diff as drift is a misdiagnosis -- the diff is a RECOVERY ARTEFACT of
      two intentionally distinct sources, and "fixing" it would couple two contacts that are
      re-pointed independently (the alerts alias may become an on-call group while the `Owner` tag
      stays the operations role). Neither value is committed: both live in the tfvars parameter,
      every `*_email` tfvars value is masked in CI logs, and plan comments print names only
      (Decision 101, Decision 238).
  - id: contract-amendment-log
    file: docs/contracts/terraform-cc-web-operations.yaml
    before: 'amendment_log:'
    after: |-
      amendment_log:
        - date: "{{DATE}}"
          semantic_break: true
          change_class: correction
          summary: >-
            PLAN-terraform-company-emails-closing (rec-3904, rec-3950): owner_email is the company operations role
            alias and alerts_email the company alerts role alias; owner_vs_alerts_email keeps the two distinct and drops
            "never a deliverable mailbox"; the alerts subscription is back at aws_sns_topic_subscription.alerts_email,
            so the transitional company_alerts_email leaves recoverable_vars and where_values_live.
  - id: sns-header
    file: terraform/personal/sns_alerts.tf
    before: |-
      # Shared personal-account SNS alerts topic (T2.18 FP-B / Decision 39).
      #
      # Decision 39: SNS is the canonical alarm/failure-notification primitive. This module
      # introduces the single shared personal-account SNS topic; both the DuckLake maintenance
      # circuit-breaker alarm and the catalog-DR freshness alarm target this topic.
      #
      # Email subscription endpoint supplied via gitignored terraform.personal.tfvars
      # (alerts_email = "..."). NOT hardcoded -- no email address is committed to source.
      # The subscription is created in PENDING state; the recipient must click the confirmation
      # link in the initial subscription email before alarms can page (VP9 manual step).
      #
      # ---------------------------------------------------------------------------
      # APPLY POSTURE (Decision 35 + 77): HUMAN-GATED via agent_platform_admin.
      # ---------------------------------------------------------------------------
      # aws_sns_topic and aws_sns_topic_subscription are NOT IAM-sensitive resources, but they
      # are created together with the DR Lambda (IAM role + policy), so they ride the same
      # human-gated admin apply for the T2.18 FP-B apply pass.
    after: |-
      # Shared SNS alerts topic (T2.18 FP-B / Decision 39): SNS is the canonical alarm primitive, and every
      # CloudWatch alarm in both roots targets this topic.
      #
      # The one e-mail subscription's endpoint is the company alerts role alias, from the tfvars parameter
      # (alerts_email; never committed). CI may subscribe but never unsubscribe or reconfigure a subscription
      # (terraform/bootstrap/github_ci_apply_policy.tf), so a new endpoint is a successor subscription beside this
      # one: the operator confirms it with authenticate-on-unsubscribe (never by opening the mail's link) and
      # proves a page, a removed block forgets the predecessor and the operator deletes it in the console, then a
      # moved block returns the successor to this address (PLAN-terraform-company-emails, -forget and -closing).
  - id: sns-alerts-email-description
    file: terraform/personal/sns_alerts.tf
    before: |-
      description = "Email address for the shared personal-account SNS alerts subscription. Supplied via gitignored terraform.personal.tfvars."
      type        = string
      # No default: this must be explicitly set in terraform.personal.tfvars.
    after: |-
      description = "Company alerts role alias for the alerts topic's e-mail subscription, from the tfvars parameter (never committed)."
      type        = string
      # No default: the tfvars parameter supplies it.
  - id: runbook-endpoint
    file: docs/runbooks/ducklake-catalog-operations.md
    before: >-
      The SNS email subscription endpoint is set in `terraform/personal/terraform.personal.tfvars`
      (`alerts_email = "..."`). The file is gitignored -- no email address is committed to source.
    after: >-
      The SNS e-mail subscription endpoint is `alerts_email` in the
      `/secret/agent-platform-terraform-personal-tfvars` parameter: the company alerts role alias, never committed
      (the `terraform/personal/sns_alerts.tf` header describes a change of endpoint).
  - id: runbook-confirmation
    file: docs/runbooks/ducklake-catalog-operations.md
    before: >-
      after the first `terraform apply` that creates the SNS resources, AWS
      sends a subscription-confirmation email. The recipient must click the confirmation link before
      the page-out is live.
    after: >-
      after the `terraform apply` that creates a subscription, AWS sends a subscription-confirmation e-mail to the
      company alerts role alias. Do not open its link, which confirms without authentication: confirm with `aws sns
      confirm-subscription --authenticate-on-unsubscribe true` and the token from the link (the
      `terraform/personal/sns_alerts.tf` header). The page-out is live once confirmed.
