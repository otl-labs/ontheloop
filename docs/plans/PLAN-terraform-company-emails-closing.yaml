infrastructure_dependencies:
- >-
  Infrastructure Dependencies table (terraform/personal in scope; pipeline mechanics are environment-taxonomy.yaml's,
  not restated). | order | dependency | timing | owner | -- | 1 | PLAN-terraform-company-emails-forget complete
  (successor-only subscription, its confirmed state persisted, alerts_email = company alias) | before PR 3 opens |
  VP 1 | -- | 2 | PR 3's first trusted plan is NO_CHANGES with no drift beyond the chronic classes | before S3 | VP 4 | -- | 3 | S3 sets
  owner_email and the transitional previous_owner_email | the operator can approve within the hour | operator, a
  CloudShell block (Amendment 1, Decision 256 cl.3) | -- | 4 | PR 3's saved plan (Owner tag updates; the move is a no-op) routes to tf-gated-apply at
  merge (aws_iam_role and aws_iam_openid_connect_provider tag updates are out of budget; the merge-time subagent
  review runs on the guard-PASS path only, so the operator's approval is the review) | merge, operator approval
  in the Environment | CI and operator | -- | 5 | bootstrap Owner tags (A1) | after PR 3's apply | operator, a
  whole-root CloudShell plan and apply (Decisions 126, 256 cl.3, 257) | -- | 6 | S4 drops the transitional keys | after VP 8 and A1 | operator, a CloudShell block.
- >-
  Required checks: pr-validate and terraform-validate (terraform/github/repo.tf; Decision 119: no local init, validate
  or plan of terraform/personal, provider-free terraform fmt -check only). The trusted plan job is advisory (Decision
  83): it saves plan.bin, the terraform-plan-digest status and the names-only comment, then its fit_check step fails
  when the reviewer digest is OPAQUE or OVERFLOW, as PR 3's post-S3 plan is expected to (constraints). The bootstrap
  Owner change (A1) is the operator's whole-root plan and apply in CloudShell (Amendment 1: Decision 256 cl.3, and
  Decision 257, since A1 merges nothing for terraform-bootstrap-apply.yml to apply and its diff touches the protected
  set), never CI or an agent. The preview's IAM Access Analyzer screen (Decision 257, Update 2026-11-16) checks the
  policy documents and trusts a plan changes; A1 changes none (A1_STOP refuses any change outside the Owner tag), so
  that screen has nothing to check and A1's tag-only check stands in for it. No scope file is under
  terraform/bootstrap, so no pre-merge bootstrap plan step is owed (deploy-paths.yaml admin_out_of_band); the
  2026-11-04 read-only baseline plan read 42 no-op and 19 Owner-tagged resources (VP 9 reads the count at run time).
- >-
  LAMBDA: compute_affected_artifacts(<this plan's scope>) returns {} -- no scope file is Lambda-packaged (Decision 79).
acceptance_criteria:
- >-
  The Owner tag is the company operations role alias on every Owner-tagged resource in both roots (VP 8, VP 9), with
  the convergence record green and the drift plan clean after each terraform/personal change (VP 7).
- >-
  The one e-mail subscription sits at aws_sns_topic_subscription.alerts_email on var.alerts_email, the company alerts
  role alias, and nothing transitional is left in the code (VP 2, VP 3's repository sweep, VP 4, VP 8; the name
  survives only in the moved block's from line, the contract's amendment_log and the two tests that pin it).
- >-
  The tfvars parameter holds exactly its six baseline keys again, with company values for owner_email and alerts_email
  and every other value unchanged (VP 10).
- >-
  PR 3's contract and runbook equal their base with APPROVED PR 3 TEXT applied and its sns_alerts.tf blocks are in
  place (VP 3); PR 4 changes the inventory exactly as APPROVED CLOSING TEXT says and nothing else (VP 11); AWS-07, AWS-10 and AWS-11 are proven with owner company; rec-3904 and rec-3950 are
  closed (VP 12).
- >-
  EVIDENCE.md records S3, B3, A1, S4, B4 and O1 by kind and UTC time with no address, id or ARN, and no PR text this
  plan wrote matches the redaction pattern (VP 13).
verification_plan:
- step: 1
  phase: pre-deploy
  action: >-
    Start gate, agent part (Amendment 1: no alias file and no admin chain; the AWS part is VP 17, an operator
    CloudShell block): PLAN-terraform-company-emails-forget is declared on origin/main and its rows B2, C2 and S2 read
    pass; Decision 226's red-main overlap check is clear; build-state.json says whether S3 has run.
  command: |-
    bin/venv-python - <<'PY' && bin/venv-python -m scripts.ci_rca.red_overlap --plan docs/plans/PLAN-terraform-company-emails-closing.yaml
    import json, re, subprocess, yaml
    subprocess.run(['git', 'fetch', '-q', 'origin', 'main'], check=True)
    prior = yaml.safe_load(subprocess.run(['git', 'show', 'origin/main:docs/plans/PLAN-terraform-company-emails-forget.yaml'], capture_output=True, text=True, check=True).stdout)
    assert prior['implementation_declared'] is True, 'PLAN-terraform-company-emails-forget not built'
    ev = open('/mnt/project-files/terraform-company-emails/EVIDENCE.md', encoding='utf-8').read()
    assert all(re.search(rf'^\| {r} \|.*\| pass \|$', ev, re.M) for r in ('B2', 'C2', 'S2')), 'plan 2 evidence rows'
    print('START_OK resumed after S3' if 't_s3' in json.load(open('/mnt/project-files/terraform-company-emails/build-state.json')) else 'START_OK, VP 17 next')
    PY
  expected: >-
    Prints START_OK, VP 17 next (or START_OK resumed after S3, when build-state.json records S3 and VP 5, VP 8 and VP
    10 carry the live state), then a JSON line whose verdict is clear (exit 0).
  fix_if: >-
    Plan 2 not complete: stop. A blocked or unavailable overlap verdict: hold and tell the coordinator (Decision 226).
  hermetic: false
  graduation: not-applicable
- step: 2
  phase: pre-deploy
  action: >-
    PR 3 subscription shape, the standing guard: the one subscription at the pinned address on var.alerts_email, no
    meta-argument, no company_alerts_email variable or resource, no at-sign in the file.
  command: >-
    bin/venv-python -m pytest -q
    tests/checks/iam_tf/test_alerts_email_subscription.py::test_subscription_at_pinned_address
  expected: One test passes (exit 0).
  expected_literals:
  - 1 passed
  fix_if: >-
    A failure: sns_alerts.tf differs from the PR 3 shape in scope; fix it.
  hermetic: true
  graduation: graduate
  graduation_check_id: alerts-subscription-pinned-address
- step: 3
  phase: pre-deploy
  action: >-
    PR 3 texts: the contract and the runbook equal their words at PR 3's base (the merge-base with origin/main) with
    APPROVED PR 3 TEXT's blocks applied, whole-file and whitespace aside, {{DATE}} the only variance (approved_text
    verify, the check validate_merge_step runs for a sidecar); in sns_alerts.tf, whose code PR 3 also restructures,
    each block's after words are present and its before words gone; where_values_live has no company_alerts_email
    key, and outside docs/plans the name survives only in the moved block's from line, the contract's amendment_log and
    the two tests that pin it;
    the contract check passes. The approved text is read from the plan at that base, and PR 3 changes the plan only
    in implementation_declared.
  command: |-
    bin/venv-python - <<'PY'
    import re, subprocess, yaml
    from pathlib import Path
    from scripts.roadmap import approved_text as at
    from scripts.checks.contracts.validate_terraform_cc_web_operations import validate_terraform_cc_web_operations as vt
    subprocess.run(['git', 'fetch', '-q', 'origin', 'main'], check=True)
    base = subprocess.run(['git', 'merge-base', 'origin/main', 'HEAD'], capture_output=True, text=True, check=True).stdout.strip()
    PL = 'docs/plans/PLAN-terraform-company-emails-closing.yaml'; drop = lambda m: {k: v for k, v in m.items() if k != 'implementation_declared'}
    p = yaml.safe_load(subprocess.run(['git', 'show', f'{base}:{PL}'], capture_output=True, text=True, check=True).stdout)
    assert drop(p) == drop(yaml.safe_load(open(PL, encoding='utf-8'))), 'the plan changed beyond implementation_declared'
    w = yaml.safe_load([s for s in p['execution_steps'] if s.startswith('APPROVED PR 3 TEXT')][0].split('\n', 1)[1])
    TF = 'terraform/personal/sns_alerts.tf'
    bad = at.verify(at.Sidecar(schema_version=1, slug='terraform-company-emails-closing', blocks=[b for b in w['blocks'] if b['file'] != TF]), Path('.'), base)
    norm = lambda t: ' '.join(t.split()); tf = norm(open(TF, encoding='utf-8').read())
    bad += [b['id'] for b in w['blocks'] if b['file'] == TF and (norm(b['after']) not in tf or norm(b['before']) in tf)]
    c = yaml.safe_load(open('docs/contracts/terraform-cc-web-operations.yaml', encoding='utf-8'))
    if 'company_alerts_email' in c['tfvars_and_remote_state_recovery']['where_values_live']:
        bad.append('entry company_alerts_email')
    if 'company_alerts_email' in yaml.safe_dump({k: v for k, v in c.items() if k != 'amendment_log'}):
        bad.append('contract names company_alerts_email outside amendment_log')
    raw = open(TF, encoding='utf-8').read()
    bad += [m for m in ('Transitional (PLAN-terraform-company-emails', 'PLAN-terraform-company-emails-forget') if m in raw]
    keep = ('docs/contracts/terraform-cc-web-operations.yaml', 'tests/test_materialise_tfvars_delegate.py', 'tests/checks/iam_tf/test_alerts_email_subscription.py')
    hits = [l.split(':', 2) for l in subprocess.run(['git', 'grep', '-n', 'company_alerts_email', '--', '.', ':!docs/plans'], capture_output=True, text=True).stdout.splitlines()]
    moved = [h for h in hits if h[0] == TF and re.fullmatch(r'\s*from\s*=\s*aws_sns_topic_subscription\.company_alerts_email\s*', h[2])]
    bad += [h[0] for h in hits if h[0] not in keep and h not in moved] + ([] if len(moved) == 1 else ['moved block from line'])
    f = []; vt(f); assert not bad and not f, (bad, f); print('PR3_TEXT_OK', len(w['blocks']))
    PY
  expected: Prints PR3_TEXT_OK 9 (exit 0).
  fix_if: >-
    A file named by the sweep: in a scope file, a transitional reference PR 3 must remove; in any other file, never
    an inline fix (Decision 59): tell the coordinator, who routes a plan amendment or a rec. A missing or stale block: restore the approved text; any other wording, including one a review asks for, goes to
    the coordinator, then the operator, before merge.
  hermetic: false
  graduation: waive
  graduation_waiver_reason: >-
    Moment claim (Decision 244 cl.4): it binds one PR to operator-approved text and goes red by design when a later
    plan edits these files; validate_terraform_cc_web_operations and VP 2's graduated test stay the standing checks.
- step: 4
  phase: pre-deploy
  action: >-
    PR 3 open, before S3: its trusted plan comment for the PR's current head reads NO_CHANGES with zero counts (the moved block is a no-op move),
    carries no refresh drift outside the chronic classes (aws_iam_role and aws_lambda_function addresses, which every recent trusted comment names: role use and the governed Lambda code deploys; rec-4631) (PLAN-terraform-company-emails-forget persisted the confirmed successor),
    has a saved plan, and leaks nothing.
  command: |-
    test -n "$PR_NUMBER" && bin/venv-python - <<'PY'
    import json, os, re, sys, urllib.request
    get = lambda p: json.load(urllib.request.urlopen('https://api.github.com/repos/otl-labs/ontheloop/' + p, timeout=30))
    head = get(f"pulls/{os.environ['PR_NUMBER']}")['head']['sha']
    cs = [c['body'] for c in get(f"issues/{os.environ['PR_NUMBER']}/comments?per_page=100") if 'terraform/personal speculative plan (trusted' in c['body'] and f'PR head `{head}`' in c['body']]
    body = cs[-1] if cs else sys.exit('TRUSTED PLAN NOT POSTED for this head yet')
    scan = re.sub(r'\b[0-9a-f]{40,64}\b', '', body)
    leaks = [n for n, x in (('at', r'@[a-z0-9-]+\.[a-z]'), ('12-digit', r'(?<!\d)\d{12}(?!\d)'), ('arn', r'\barn:')) if re.search(x, scan)]
    CHRONIC = ('aws_iam_role.', 'aws_lambda_function.')
    odd = [a for a in re.findall(r'`([^`]+)`', (re.search(r'^Drift detected outside Terraform: (.*)$', body, re.M) or [None, ''])[1]) if not a.startswith(CHRONIC)]
    ok = (re.search(r'^State: NO_CHANGES$', body, re.M) and '0 to import, 0 to add, 0 to change, 0 to destroy (0 replaced)' in body
          and not odd and 'This saved plan is applied at merge' in body and not leaks)
    print(json.dumps({'no_changes': bool(ok), 'odd_drift': odd, 'leaks': leaks})); sys.exit(0 if ok else 'TRUSTED PLAN STOP')
    PY
  expected: >-
    One JSON line {"no_changes": true, "odd_drift": [], "leaks": []}.
  fix_if: >-
    TRUSTED PLAN NOT POSTED: the trusted plan job has not finished for this head; wait for its check to conclude and
    re-run. A change on alerts_email's endpoint: S2 of the forget plan has not run or holds another value; stop, never merge
    (a replace AccessDenies through CI). An address in odd_drift: some other resource changed outside Terraform; do
    not run S3; triage the drift with the coordinator first. Owner tag updates after an S3 rollback (the head's latest
    comment is still the S3-era plan, whose saved plan must never merge): on the operator's word re-run PR 3's
    trusted plan, then VP 4 again; S3 repeats only once it passes. A refusal: stop.
  hermetic: false
  graduation: not-applicable
- step: 5
  phase: pre-deploy
  action: >-
    Amendment 1: an operator CloudShell block, pasted together with S3's (constraints, CloudShell blocks). After S3:
    the version is FROM (v_s3_before) plus one; owner_email is on the company alerts alias's domain and is not the
    alerts alias (the operations role alias the operator typed, which no session knows); previous_owner_email equals
    FROM's owner_email; every other line equals FROM's. With ROLLBACK=1 (FROM = v_rb_before, ORIG = v_s3_before),
    after the S3 rollback: the version is FROM plus one; owner_email equals ORIG's; previous_owner_email is gone;
    every other line equals FROM's. Prints booleans and the version only.
  command: |-
    FROM=<v_s3_before> python3 - <<'PY'
    import datetime as dt, getpass, json, os, re, subprocess, sys, urllib.request
    R = urllib.request.urlopen('https://raw.githubusercontent.com/otl-labs/ontheloop/main/config/aws-region', timeout=30).read().decode().strip()
    def aws(*a):
        p = subprocess.run(['aws', *a, '--region', R, '--output', 'json'], capture_output=True, text=True)
        if p.returncode: sys.exit('AWS_ERROR ' + ' '.join(a[:2]))
        return json.loads(p.stdout or 'null')
    if subprocess.run(['aws', 'configure', 'get', 'cli_history'], capture_output=True, text=True).stdout.strip() == 'enabled': sys.exit('CLI_HISTORY_ON')
    if not aws('sts', 'get-caller-identity')['Arn'].endswith(':user/platform-breakglass'): sys.exit('ADMIN_CHAIN_ABSENT')
    N = '/secret/agent-platform-terraform-personal-tfvars'; kv = lambda t: dict(re.findall(r'^\s*([a-z_]+)\s*=\s*"?([^"\n]*)"?\s*$', t, re.M))
    par = lambda v=None: aws('ssm', 'get-parameter', '--name', N if v is None else '%s:%s' % (N, v), '--with-decryption')['Parameter']
    p = par(); new = kv(p['Value']); pre = kv(par(os.environ['FROM'])['Value']); dom = new['alerts_email'].split('@')[-1]
    if os.environ.get('ROLLBACK') == '1':
        orig = kv(par(os.environ['ORIG'])['Value'])
        ok = {'version': p['Version'] == int(os.environ['FROM']) + 1, 'key_set': 'previous_owner_email' in pre and set(new) == set(pre) - {'previous_owner_email'},
              'owner_restored': new['owner_email'] == orig['owner_email'], 'others_unchanged': all(new[k] == pre[k] for k in new if k != 'owner_email')}
        print('S3_ROLLBACK_OK version' if all(ok.values()) else 'S3_ROLLBACK_READBACK_FAILED version', p['Version'], json.dumps(ok)); sys.exit(0 if all(ok.values()) else 1)
    ok = {'version': p['Version'] == int(os.environ['FROM']) + 1, 'key_set': set(new) == set(pre) | {'previous_owner_email'},
          'owner_is_company': new['owner_email'].split('@')[-1] == dom and new['owner_email'] != new['alerts_email'], 'previous_is_old_owner': new.get('previous_owner_email') == pre['owner_email'],
          'others_unchanged': all(new[k] == pre[k] for k in pre if k != 'owner_email')}
    print('S3_OK version' if all(ok.values()) else 'S3_READBACK_FAILED version', p['Version'], json.dumps(ok)); sys.exit(0 if all(ok.values()) else 1)
    PY
  expected: >-
    S3_OK version with the new version number and five true values (exit 0); with ROLLBACK=1, S3_ROLLBACK_OK version
    with four true values.
  fix_if: >-
    version false: another writer moved the parameter; stop and tell the coordinator, who owns the writer order, then
    post the key-scoped S3 rollback. Another false value: stop and post the S3 rollback. S3_ROLLBACK_OK missing: stop;
    no acknowledge-and-retry or other dispatch runs until it prints (Decision 55); tell the coordinator and the
    operator.
  hermetic: false
  graduation: not-applicable
- step: 6
  phase: pre-deploy
  action: >-
    PR 3, after its trusted plan is re-run following S3: the comment for the PR's current head is newer than build-state.json's t_s3 (none: stop) and reads CHANGES,
    no import, create, destroy or replace; every row an update whose changed attributes are among tags_all, tags and
    policy; at least one aws_iam_role row; no drift outside the chronic classes; the guard predicts BLOCKED (tf-gated-apply at merge); the
    reviewer digest fit is FITS, OPAQUE or OVERFLOW, and every address unknown at plan time is a data source or a row
    whose changed attributes include policy; nothing leaks.
  command: |-
    test -n "$PR_NUMBER" && bin/venv-python - <<'PY'
    import json, os, re, sys, urllib.request
    T = json.load(open('/mnt/project-files/terraform-company-emails/build-state.json')).get('t_s3') or sys.exit('NO t_s3 in build-state.json: S3 not run, or rolled back')
    get = lambda p: json.load(urllib.request.urlopen('https://api.github.com/repos/otl-labs/ontheloop/' + p, timeout=30))
    head = get(f"pulls/{os.environ['PR_NUMBER']}")['head']['sha']
    cs = [c for c in get(f"issues/{os.environ['PR_NUMBER']}/comments?per_page=100") if 'terraform/personal speculative plan (trusted' in c['body'] and f'PR head `{head}`' in c['body']]
    c = cs[-1] if cs else sys.exit('TRUSTED PLAN NOT POSTED for this head yet'); body = c['body']; fresh = max(c['created_at'], c['updated_at']) > T
    scan = re.sub(r'\b[0-9a-f]{40,64}\b', '', body)
    leaks = [n for n, x in (('at', r'@[a-z0-9-]+\.[a-z]'), ('12-digit', r'(?<!\d)\d{12}(?!\d)'), ('arn', r'\barn:')) if re.search(x, scan)]
    rows = [r for r in re.findall(r'^\| ([^|]+?) \| ([^|]+?) \| ([^|]*?) \|$', body, re.M) if r[0] != 'Resource' and not set(r[0]) <= set('-')]
    tagonly = bool(rows) and all(r[1] == 'update' and set(x.strip() for x in r[2].split(',')) <= {'tags_all', 'tags', 'policy'} for r in rows)
    counts = re.search(r'^0 to import, 0 to add, \d+ to change, 0 to destroy \(0 replaced\)\.$', body, re.M)
    fit = (re.search(r'^Reviewer digest fit: (\w+)$', body, re.M) or [None, 'MISSING'])[1]
    unknown = re.findall(r'`([^`]+)`', (re.search(r'^Unknown at plan time: (.*)$', body, re.M) or [None, ''])[1])
    policy_rows = {r[0] for r in rows if 'policy' in [x.strip() for x in r[2].split(',')]}
    unknown_ok = all(a.startswith('data.') or a in policy_rows for a in unknown)
    CHRONIC = ('aws_iam_role.', 'aws_lambda_function.')
    odd = [a for a in re.findall(r'`([^`]+)`', (re.search(r'^Drift detected outside Terraform: (.*)$', body, re.M) or [None, ''])[1]) if not a.startswith(CHRONIC)]
    ok = (fresh and 'State: CHANGES' in body and counts and tagonly and any(r[0].startswith('aws_iam_role.') for r in rows)
