    assert all({k: r[i][k] for k in f} == f and all(r[i][k] == rb[i][k] for k in rb[i] if k not in f) for i, f in w['rows'].items()), 'row fields'
    n = len(B['evidence_ledger']); new = d['evidence_ledger'][n:]
    assert d['evidence_ledger'][:n] == B['evidence_ledger'] and len(new) == 3, 'ledger is not three appended entries'
    pat = lambda t: re.escape(t).replace(re.escape('<date>'), r'\d{4}-\d{2}-\d{2}').replace(re.escape('<run id>'), r'\d+')
    assert all(any(e['row'] == x['row'] and e['status'] == x['status'] and re.fullmatch(pat(x['evidence']), e['evidence']) and re.fullmatch(r'\d{4}-\d{2}-\d{2}', str(e['date'])) for e in new) for x in w['ledger']), 'ledger entry'
    added = [a for a in d['amendment_log'] if a not in B['amendment_log']]
    assert len(d['amendment_log']) == len(B['amendment_log']) + 1 and len(added) == 1 and norm(added[0]['summary']) == norm(w['inventory_amendment']), 'inventory amendment_log'
    assert re.fullmatch(r'\d{4}-\d{2}-\d{2}', str(added[0].get('date'))) and added[0].get('semantic_break') is False and added[0].get('change_class') == 'correction', 'amendment_log fields'
    assert all(d[k] == B[k] for k in B if k not in ('rows', 'evidence_ledger', 'amendment_log')), 'another section changed'
    assert r['NEON-02']['status'] in ('proven', 'company'), 'NEON-02 (the organisation neon_org_id names) is not the company yet'
    f = []; vi(f); assert not f, f; print('CLOSING_TEXT_OK')
    PY
  red_green_expectation: >-
    Red before: on main the three rows read personal with owner founder and the closing strings are absent
    (AssertionError). Green after PR 4 (with NEON-02 already closed by the Neon plan).
constraints:
- >-
  Approved texts are verbatim: APPROVED PR 3 TEXT (PR 3) and APPROVED CLOSING TEXT (PR 4); context gives the
  approval. Allowed variance: dates, PR numbers, workflow run ids and parameter version numbers. Any other wording
  change, including one critique or code review asks for, goes to the coordinator, then the operator, before merge.
- >-
  Live acts and who runs them. Agent, only after the operator's typed word on the exact command in the build thread,
  one word per mutation (Decision 237 cl.3 read as the Neon T1 precedent): S3, S4, a rollback restore, re-running PR
  3's trusted plan, any terraform-apply-sandbox or terraform-drift dispatch (a drift dispatch writes the convergence
  record), and the A1 bootstrap apply. Operator: the tf-gated-apply approval of PR 3 (O1 is
  PLAN-terraform-company-emails' step; its row must read pass before PR 4).
- >-
  Order is fixed: start (alias file), VP 1, PR 3 open (VP 2, VP 3, VP 15, VP 14), VP 4, VP 7 (AFTER = now),
  merge_overlap CLEAR, S3, VP 5,
  PR 3 re-plan, VP 6, merge, approval, VP 7 (MERGE_SHA), VP 8, VP 12, A1 (VP 9 plan, apply, VP 9 after), S4, VP 10, VP
  7 (AFTER), red_overlap, PR 4 (VP 11, VP 14), VP 13. PR 4 opens only after O1's row reads pass and NEON-02 is
  company-owned.
- >-
  S3 window. S3 creates a tfvars-only diff on main until PR 3's saved plan applies. With the confirmed successor
  persisted (PLAN-terraform-company-emails-forget VP 5; VP 4 shows no drift line), Decision 190 measures it as
  pending_codification (no red) and escalates to red after 2 hours, including while the gated apply waits (rec-4050);
  while rec-4255 is open an exit-2 drift cycle crashes instead (no record change). So: PR 3 is open and green with VP 4
  passing before S3; S3 runs only when the operator can approve tf-gated-apply within the hour; the agent then re-runs
  PR 3's terraform-plan-trusted run (a re-run, never an empty commit), checks VP 6 and merges. Red before PR 3 merges:
  restore owner_email (S3 rollback); main's plan is then a no-op and the empty acknowledge-and-retry heals it; repeat
  S3 later. Red after the merge, before the push run applies: the precondition refuses; restore owner_email, and the
  empty acknowledge-and-retry applies main's plan, which is PR 3's no-op move only (guard PASS, no route, no
  artifact); the Owner change then rides a carrier PR that corrects one comment line in terraform/personal/sns_alerts.tf
  (S3 repeated before its plan). Red during the approval wait: the gated apply still applies and the drift guard
  refuses the green write; the heal is the same empty acknowledge-and-retry (main's plan is then a no-op). Never heal
  with a guard-routed dispatch or reconcile route (ii): both upload plan.bin, which embeds every tfvars value, as a
  public artifact (rec-4230). The coordinator holds every other terraform/personal merge, every merge touching a PR 3
  file (the contract, the runbook, the test, sns_alerts.tf) and every apply, reconcile or drift dispatch by another
  thread from S3 until PR 3's gated apply completes (a terraform/personal merge would make PR 3's saved plan stale,
  and a shared-file merge makes Decision 245's merge gate refuse PR 3); the agent tells the coordinator when it is
  released. Immediately before S3, bin/venv-python -m scripts.session.merge_overlap check --head HEAD must print
  CLEAR (else update the branch first, before S3). If the gate still refuses after S3: update the branch on GitHub,
  wait for the CI-green wake on the new head (its trusted plan re-runs on the push), run VP 6 on the new head's
  comment, then merge.
- >-
  Expected advisory failure: after S3 the re-run trusted plan job concludes failure at its fit_check step (reviewer
  digest OPAQUE for policies unknown at plan time, or OVERFLOW for the tag updates) after saving plan.bin, the digest
  status and the comment. That is not a halt: PR 3 merges on green pr-validate and terraform-validate, VP 6, VP 15
  and code review, and the operator's tf-gated-apply approval reviews the names-only plan. Any other failed step
  halts.
- >-
  Masking: PLAN-terraform-company-emails' *_email arm is on main, so no drift, dispatch or reconcile log prints an
  owner value. S3 adds previous_owner_email (the founder's no-reply value) so the mask also hides the prior value
  every Owner diff prints until PR 3 applies; S4 removes it with company_alerts_email.
- >-
  Parameter writes are read-modify-write with a version check and keep every other line (neon_org_id included); the
  coordinator serialises them with rec-4048 and any other writer. A rec-4048 build that lands first changes the
  bootstrap key list in VP 9 and the baseline key set; stop and re-plan the affected commands through /plan.
- >-
  Expected detector pages (Decision 202 cl.6, never filtered by actor), each evidence, not an incident:
  platform-security-alerts-topic-change on PR 3's topic tag write; platform-security-platform-role-iam-change (and
  platform-security-detector-tamper if its filter covers tag writes) on A1. Each reaches the company inbox, the
  organic second proof of paging. A page outside this list is triaged before the next step. Each tfvars window may
  also file one tf_drift rec (pending_codification), closed by the next clean cycle.
- >-
  No e-mail address (company aliases included), account id, ARN, token or link enters the repository, a PR, memory,
  chat or the shared folder (Decision 101): the build reads the role aliases from the session's alias file at run time
  and prints roles and booleans; evidence is kind and UTC time; bootstrap plan text, which prints tag values, is never
  shown (VP 9 prints names only).
- >-
  A failed or drifted step halts this workstream until root-caused; never a silent retry; no rescue agents or
  workaround loops (Decision 55). Never apply terraform/personal out of band (rec-3189).
