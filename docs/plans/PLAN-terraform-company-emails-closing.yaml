constraints:
- >-
  Approved texts are verbatim: APPROVED PR 3 TEXT (PR 3) and APPROVED CLOSING TEXT (PR 4); context gives the
  approval. Allowed variance: dates, PR numbers, workflow run ids and parameter version numbers. Any other wording change, including one critique or code review asks for, goes to the coordinator, then the operator, before merge. Amendment 1: both texts were approved in chat the day before Decision 246 (cl.1: a chat word alone no longer binds wording), and the runbook-confirmation block's "(for example in CloudShell; the agent's admin role cannot confirm)" went stale with Decision 256, since no agent holds an admin identity. The operator chose on 2026-11-19 (decision card cmsg_017f94mmYqSe3q2p9o6tPW3UMyt8PMQ6VFJa56zn8GmGSQ) to move both texts into a GitHub-approved sidecar (Decision 246): a follow-on plan amendment moves them into docs/plans/approved/terraform-company-emails-closing.yaml with that clause replaced and rebinds VP 3 and VP 11 to it, and the operator approves its approved-text-approval.yml run. Until then they stay word for word as approved, and PR 3 does not open until that sidecar is on main with its recorded approval. With that sidecar passing, PR 3 asks no final-diff word for its sidecar-bound text (Decision 246 cl.4); the operator's tf-gated-apply approval stays its deploy gate.
- >-
  Live acts and who runs them (Amendment 1, Decision 256 cl.3, replacing the agent's admin-chain acts). Operator, in
  AWS CloudShell, each block the agent posts (constraints, CloudShell blocks), the paste being the operator's act and
  word: VP 17, S3 with VP 5, a rollback restore with its read-back, VP 8, VP 9 and the A1 apply, S4 with VP 10, and
  the record read. Operator: the tf-gated-apply approval of PR 3 (O1 is PLAN-terraform-company-emails' step; its row
  must read pass before PR 4). Agent, only after the operator's typed word in the build thread, one word per act:
  re-running PR 3's trusted plan, and any terraform-apply-sandbox or terraform-drift dispatch (a drift dispatch writes
  the convergence record). Agent, no word needed: VP 1 to VP 4, VP 6, VP 7, VP 11 to VP 16 (repository, GitHub and
  warehouse reads).
- >-
  CloudShell blocks (Amendment 1, Decision 256 cl.3). A build session reaches AWS only as the proxy-signed session
  user, which reads CloudWatch metrics and alarms and nothing this plan needs, so every AWS read or write of this plan
  is a block the agent posts and the operator pastes into AWS CloudShell, signed in as the break-glass user, returning
  only the printed lines: VP 17, S3, VP 5, the S3 rollback, VP 8, VP 9, the A1 apply, S4, VP 10 and the record read.
  The python blocks are python3 and the aws CLI only, and their first lines are the same: the region from
  config/aws-region on main, an aws helper that prints only AWS_ERROR with the service and command on a failure (never
  the CLI's message, which can carry an id or ARN), a refusal (CLI_HISTORY_ON) when the AWS CLI's cli_history setting is enabled, since that history keeps each call's parameters and response in the persistent home, a refusal (ADMIN_CHAIN_ABSENT) unless the caller is the break-glass user, and the tfvars parameter reader. The bootstrap blocks (VP 9, the A1 apply) make the same two refusals and keep Terraform's stderr in their temporary folder, kept as /tmp/a1-tf.err (mode 600, outside CloudShell's persistent home) only when the block fails, for the operator to read privately and delete; the next bootstrap block or the end of the CloudShell session removes any earlier copy (Decision 224 cl.2). No build session holds an alias: S3 asks the operator to type the operations role alias twice at a hidden
  prompt (it must share the alerts alias's domain and differ from it), and every other block reads values in AWS;
  blocks print markers, booleans, counts, names and version numbers only, so PLAN-terraform-company-emails' alias file
  and its Decision 224 transcript exception are no longer used. The agent fills each <...> value (a version number
  from build-state.json, the full main SHA, VP 9's digest, or S3's DEADLINE) before posting. Two blocks sent as one
  paste are each wrapped in braces and joined by && ("{ " before the first block's first line, a line "} && { " before
  the second block's first line, and a last line "}"), so bash reads the whole paste before any part runs, the hidden
  prompt reads only what the operator types, and the second block runs only when the first exits 0 (tested 2026-11-19
  in an interactive terminal: without the braces the prompt swallows the pasted second block). The operator never pastes CloudShell output beyond the printed lines. CLI_HISTORY_ON: nothing ran; the operator turns the setting off (aws configure set cli_history disabled), clears ~/.aws/cli/history and pastes the block again. An AWS_ERROR from a write block's put-parameter leaves its outcome unknown and stops the joined read-back: the agent posts that read-back alone (VP 5, VP 5 with ROLLBACK=1 or VP 10) and acts on the version it prints; if the write landed, t_s3 or t_s4 is the time the operator pasted it.
- >-
  Order is fixed (Amendment 1): start, VP 1, VP 17, the approved-text sidecar on main with its recorded approval (constraints, approved texts), PR 3 open (VP 2, VP 3, VP 15, VP 14), VP 4, the operator's word on
  re-running PR 3's trusted plan together with their readiness to approve tf-gated-apply within the hour, VP 7
  (EVENT=clock, AFTER = that word's time), merge_overlap CLEAR, "S3 now", S3 with VP 5 (one paste), PR 3 re-plan, VP
  6, VP 16, merge, approval, VP 7 (MERGE_SHA), VP 8, VP 12, A1 (VP 9 MODE=plan, the A1 apply, VP 9 MODE=after), S4
  with VP 10 (one paste), VP 7 (AFTER = t_s4), red_overlap, PR 4 (VP 11, VP 14), VP 13. PR 4 opens only after O1's row
  reads pass and NEON-02 reads proven.
- >-
  S3 window. S3 creates a tfvars-only diff on main until PR 3's saved plan applies. A drift cycle in that window plans
  exit 2: while rec-4255 is open it crashes in Handle drift (a failed terraform-drift run, no record change; tell the
  coordinator); once rec-4255 is fixed it measures out_of_band_drift (red at once), not pending_codification, because
  every plan carries chronic refresh drift on aws_iam_role and aws_lambda_function addresses (role use and the
  governed Lambda code deploys; rec-4631), including while the gated apply waits; a cycle that happens to carry no
  chronic drift reads pending_codification instead, which turns red PENDING_CODIFICATION_BOUND_HOURS (2.0) after S3
  (scripts/ci/convergence_classify.py), so the window's budget from S3 to the gated apply is at most two hours, and
  only until the first drift tick once rec-4255 is closed; past it the heals below apply. Cadence (Decision 267,
  Amendment 1): the dispatcher starts a drift run on main every hour at minute 17 as the bot
  config/lambda/scheduled_workflow_dispatcher/schedules.yaml names (app.bot_login; observed 2026-11-19: created at
  :17:52, complete within two minutes), and the cron's own schedule-event runs still fire at irregular times (03:36Z
  on 2026-11-19); neither can be held. So S3, and every repeat of it, runs right after a clock tick (either kind)
  completes, which leaves the most room before the next. The operator's word on PR 3's trusted-plan re-run and their
  readiness to approve tf-gated-apply within the hour come first, so waiting for them cannot use up the spacing; then
  VP 7 with EVENT=clock and AFTER = the word's UTC time reads the first clock tick to complete after it; when it has,
  the agent posts "S3 now" with S3's and VP 5's blocks as one paste, V = the latest version a CloudShell read printed
  (VP 17, or a later read-back) and DEADLINE = that tick's printed completion plus 15 minutes; S3 refuses after
  DEADLINE (S3_WINDOW_MISSED, nothing written), and a missed window waits for the next tick, re-running VP 7 with
  AFTER = the missed tick's printed completion time (a dispatched run proves the record green but gives no spacing).
  An irregular schedule-event run can still land in the window; the heals below cover it. And the agent records
  rec-4255's status in build-state.json at S3 (open: a tick in the window crashes; closed: it turns the record red).
  So: PR 3 is open and green with VP 4 passing before S3; S3 runs only when the operator can approve tf-gated-apply
  within the hour; the agent then re-runs PR 3's terraform-plan-trusted run (a re-run, never an empty commit), checks
  VP 6 and VP 16 and merges. In each branch below, restore owner_email means the S3 rollback block with VP 5
  ROLLBACK=1 (one operator paste), valid only while no apply of PR 3's saved plan has started (after one, a revert is
  re-planned: rollback); no acknowledge-and-retry that follows a restore is dispatched until that read-back prints
  S3_ROLLBACK_OK. The empty acknowledge-and-retry is one terraform-apply-sandbox dispatch at main HEAD with no new
  commit, on the operator's word (acknowledge_red_commit = the red commit when the record is red, else blank;
  deploy-paths.yaml heal_verb_selection). After a restore, both holds (the terraform/personal hold and the bootstrap hold below) are released once that heal passes VP 7 (APPLY_RUN = its run), and a repeated S3, PR 3's or a carrier PR's, takes them again; the agent tells the coordinator each time.
  Before any heal below, review the tf_drift rec the red cycle filed (Decision 55; expect the chronic aws_iam_role and
  aws_lambda_function drift and, before the apply, the Owner tag updates), and after the heal's VP 7 reads green close
  it with update_rec, citing the heal run id and that green record (deploy-paths.yaml heal_verb_selection;
  PLAN-terraform-company-emails-forget, merge-to-apply gap). Red before PR 3 merges: restore owner_email; main's plan
  is then a no-op and the empty acknowledge-and-retry heals it; on the operator's word re-run PR 3's trusted plan so
  VP 4 reads NO_CHANGES again (the S3-era saved plan never merges); repeat S3 later. Red after the merge, before the
  push run applies: the precondition refuses; restore owner_email, and the empty acknowledge-and-retry applies main's
  plan, which is PR 3's no-op move only (guard PASS, no route, no artifact); the Owner change then rides a carrier PR
  with a one-line comment change under terraform/personal (S3 repeated before its plan); every comment line PR 3
  places in sns_alerts.tf is APPROVED PR 3 TEXT, so the carrier's line and wording go to the coordinator, then the
  operator, first (constraints, approved texts). Red during the approval wait: the gated apply still applies and the
  drift guard refuses the green write; the heal is the same empty acknowledge-and-retry (main's plan is then a no-op;
  no restore, so it waits for VP 8 instead). Approval declined: restore owner_email; the empty acknowledge-and-retry
  then applies main's plan, PR 3's no-op move only; VP 7 with APPLY_RUN = that run; A1 and S4 do not run, and the
  close-out files the Owner rec, which carries A1, S4 and the company_alerts_email key left in the parameter (declared
  nowhere on main, still masked as a *_email value). Gated apply fails partway: Decision 55 halt; no restore (an apply
  has started) and no heal (main's fresh plan would carry the remaining IAM tag updates and route, rec-4230), so the
  record stays red and the hold stays until a re-planned fix applies; tell the coordinator at once, since a red main
  counts toward Decision 226's repair SLO. Never heal with a guard-routed dispatch or reconcile route (ii): both
  upload plan.bin, which embeds every tfvars value, as a public artifact (rec-4230). The coordinator holds every other
  terraform/personal merge, every merge touching a PR 3 file (the contract, the runbook, the test, sns_alerts.tf) and
  every apply, reconcile or drift dispatch by another thread from S3 until PR 3's gated apply completes (a
  terraform/personal merge would make PR 3's saved plan stale, and a shared-file merge makes Decision 245's merge gate
  refuse PR 3); the agent tells the coordinator when it is released. Amendment 1: the coordinator also holds every
  terraform/bootstrap merge and bootstrap apply from S3 until VP 9 MODE=after passes, since after S3 every bootstrap
  plan carries the Owner diff on the protected set and ends CLOUDSHELL_REQUIRED (Decision 257); A1 is that one
  whole-root CloudShell apply. Immediately before S3, with the local HEAD equal to PR 3's pushed head, git fetch -q
  origin main && bin/venv-python -m scripts.session.merge_overlap check --head HEAD must print CLEAR (else update the
  branch first, before S3: wait for the CI-green wake, bring the local branch to the new head, and re-run VP 3, VP 4
  and VP 15 on it). If the gate still refuses after S3: update the branch on GitHub, wait for the CI-green wake on the
  new head (its trusted plan re-runs on the push), bring the local branch to it, run VP 3 and VP 15, run VP 6 on the
  new head's comment and VP 16, then merge. VP 3 is the only binding of APPROVED PR 3 TEXT (no sidecar binds PR 3), so
  no merge follows a change of head without it.
