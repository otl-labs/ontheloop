  Every parameter rollback is key-scoped: the same read-modify-write and version check as the write, restoring only
  the keys that step changed from the version recorded before it, so a later serialised writer's lines survive. S3
  before PR 3's apply: the S3 rollback block with VP 5 ROLLBACK=1, one operator CloudShell paste (owner_email from
  v_s3_before, previous_owner_email dropped), before any dispatch (constraints, S3 window). PR 3 after its apply:
  forward only. The address move reverses with a forward PR that deletes PR 3's moved block (two opposite moves form a
  cycle Terraform rejects) and carries moved { from = aws_sns_topic_subscription.alerts_email, to =
  aws_sns_topic_subscription.company_alerts_email } and the transitional variable (a no-change move; never a plain
  revert, which would forget the subscription and create a new pending one). The Owner tags revert is re-planned
  through /plan, never the pinned S3 rollback: once any apply of PR 3's saved plan has started, the state holds the
  operations alias, and a write that drops previous_owner_email would leave it unmasked in every drift and heal log
  until the revert applies (Decision 101), and after S4 that key is gone; the re-planned write keeps the operations
  alias in a masked *_email key until the revert PR's gated apply completes. A1: the operator re-applies bootstrap in
  CloudShell with the previous owner_email back in the parameter, re-planned through /plan (the A1 blocks read the
  parameter's current owner_email). S4: an operator CloudShell block, re-planned, re-adds the two keys from
  v_s4_before (main declares neither key, so nothing changes in Terraform). PR 4: revert the PR (docs only). Never
