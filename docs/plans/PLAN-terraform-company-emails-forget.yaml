schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: terraform-company-emails-forget
intent: >-
  Second of three plans moving the founder e-mail values in Terraform to company role aliases. With the company
  successor subscription proven (PLAN-terraform-company-emails), PR 2 forgets the founder's subscription
  aws_sns_topic_subscription.alerts_email with a removed block (destroy = false, since CI may subscribe but never
  unsubscribe), and its saved-plan apply also persists the successor's confirmed state, so no later drift cycle reads
  the confirmation as out-of-band drift. The operator then deletes the founder's subscription in the SNS console, and
  alerts_email in the tfvars parameter takes the company alerts role alias. No contract wording changes.
implementation_declared: false
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-terraform-company-emails-forget.yaml
phase: >-
  user_explicit_out_of_scope (soft-warn exception category) -- the AWS stage of the company ownership move (Decision
  195, Decision 242), the alerts-mailbox item. No tier_item criterion claimed.
closes_criteria: []
scope:
- file: terraform/personal/sns_alerts.tf
  action: Modify
  purpose: >-
    aws_sns_topic_subscription.alerts_email's resource block is replaced by a removed block from that address with
    lifecycle { destroy = false } and the two-line why comment in execution_steps PR 2 (the shape
    terraform/personal/platform_roles.tf already uses). variable "alerts_email" stays declared (the contract table and
    the closing plan's moved block need it); the successor block and its transitional comment are untouched.
- file: tests/checks/iam_tf/test_alerts_email_subscription.py
  action: Modify
  purpose: >-
    test_successor_subscription_beside_predecessor is replaced by test_predecessor_forgotten_not_destroyed: no
    aws_sns_topic_subscription.alerts_email resource block; exactly one removed block from that address, with
    lifecycle destroy = false; the successor block unchanged on aws_sns_topic.alerts, protocol email, endpoint
    var.company_alerts_email, whose variable declares no default; no count, for_each or lifecycle on the successor;
    no at-sign in the file (weakening_dispositions).
- file: docs/plans/PLAN-terraform-company-emails-forget.yaml
  action: Create
  purpose: This plan; PR 2 flips implementation_declared to true.
bundled_recommendations: []
followon_recs:
- rec-4896
weakening_dispositions:
- candidate: "[test-removed] tests/checks/iam_tf/test_alerts_email_subscription.py::test_successor_subscription_beside_predecessor"
  disposition: planned-change
  cite: "acceptance_criteria[0]"
infrastructure_dependencies:
- >-
  Infrastructure Dependencies table (terraform/personal in scope; pipeline mechanics are environment-taxonomy.yaml's,
  not restated). | order | dependency | timing | owner | -- | 1 | PLAN-terraform-company-emails complete (successor
  confirmed and proven to page) | before PR 2 opens | VP 1 | -- | 2 | PR 2's saved plan forgets the predecessor and
  persists the refreshed successor (a forget is no delete, so the guard predicts PASS) | merge | CI | -- | 3 | C2
  deletes the founder's subscription | after VP 5 | operator, SNS console | -- | 4 | S2 sets alerts_email | after
  C2 (main no longer reads alerts_email in any resource) | agent, on the operator's word.
- >-
  Required checks: terraform-validate (Decision 119: no local init, validate or plan of terraform/personal;
  provider-free terraform fmt -check only), the trusted plan job and its digest status, and pr-validate. No scope file
  is under terraform/bootstrap.
- >-
  LAMBDA: compute_affected_artifacts(<this plan's scope>) returns {} -- no scope file is Lambda-packaged (Decision 79).
acceptance_criteria:
- >-
  PR 2's saved plan forgets exactly aws_sns_topic_subscription.alerts_email, guard PASS, nothing else (VP 2, VP 3),
  and its apply persists the confirmed successor in the remote state (VP 5); the convergence record is green after the
  merge (VP 4).
- >-
  The alerts topic's only e-mail subscription is the company alerts role alias, confirmed; the founder's was deleted
  only after PLAN-terraform-company-emails proved the successor pages (VP 1, VP 6).
- >-
  alerts_email in the tfvars parameter equals the company alerts role alias and company_alerts_email; every other
  line is unchanged, and the drift plan stays clean (VP 7, VP 4).
- >-
  EVIDENCE.md records B2, C2 and S2 by kind and UTC time with no address, id or ARN, and no PR text this plan wrote
  matches the redaction pattern (VP 8).
verification_plan:
- step: 1
  phase: pre-deploy
  action: >-
    Start gate: the session's alias file is valid; the admin chain works; PLAN-terraform-company-emails is declared on
    origin/main and its evidence rows S1, B1, C1 and P1 read pass; the parameter holds the six baseline keys plus
    company_alerts_email; both subscriptions are confirmed (VP 6 MODE=two_confirmed, run next); Decision 226's
    red-main overlap check is clear.
  command: |-
    bin/venv-python - <<'PY' && bin/venv-python -m scripts.ci_rca.red_overlap --plan docs/plans/PLAN-terraform-company-emails-forget.yaml
    import json, os, re, subprocess, boto3, yaml
    F = os.path.join(os.environ.get('TMPDIR', '/tmp'), 'tf-company-emails', 'aliases.json'); A = json.load(open(F))
    parts = {k: v.split('@') for k, v in A.items()}
    assert sorted(A) == ['alerts', 'operations'] and all(len(p) == 2 and p[0] == k for k, p in parts.items()), 'alias file roles'
    assert parts['alerts'][1] == parts['operations'][1] != 'users.noreply.github.com' and os.stat(F).st_mode & 0o077 == 0, 'alias file domain or mode'
    B = boto3.Session(profile_name='agent_platform_admin', region_name=open('config/aws-region').read().strip())
    assert 'assumed-role/PlatformAdmin/' in B.client('sts').get_caller_identity()['Arn'], 'admin chain'
    subprocess.run(['git', 'fetch', '-q', 'origin', 'main'], check=True)
    prior = yaml.safe_load(subprocess.run(['git', 'show', 'origin/main:docs/plans/PLAN-terraform-company-emails.yaml'], capture_output=True, text=True, check=True).stdout)
    assert prior['implementation_declared'] is True, 'PLAN-terraform-company-emails not built'
    ev = open('/mnt/project-files/terraform-company-emails/EVIDENCE.md', encoding='utf-8').read()
    assert all(re.search(rf'^\| {r} \|.*\| pass \|$', ev, re.M) for r in ('S1', 'B1', 'C1', 'P1')), 'plan 1 evidence rows'
    t = B.client('ssm').get_parameter(Name='/secret/agent-platform-terraform-personal-tfvars', WithDecryption=True)['Parameter']['Value']
    keys = sorted(re.findall(r'^\s*([a-z_]+)\s*=', t, re.M))
    assert keys == ['account_id', 'alerts_email', 'company_alerts_email', 'neon_org_id', 'owner_email', 'platform_admin_external_id', 'platform_dev_external_id'], keys
    print('START_OK')
    PY
  expected: Prints START_OK, then a JSON line whose verdict is clear (exit 0).
  fix_if: >-
    No alias file: write it (PLAN-terraform-company-emails execution_steps, start). Plan 1 not complete: stop; this
    plan starts only after its successor is proven. Another key set: stop and ask the coordinator, who owns the
    parameter's writer order. A blocked or unavailable overlap verdict: hold and tell the coordinator (Decision 226).
  hermetic: false
  graduation: not-applicable
- step: 2
  phase: pre-deploy
  action: >-
    PR 2 subscription shape: the predecessor is forgotten with destroy = false, never destroyed, and the successor is
    unchanged on its no-default *_email variable.
  command: >-
    bin/venv-python -m pytest -q
    tests/checks/iam_tf/test_alerts_email_subscription.py::test_predecessor_forgotten_not_destroyed
  expected: One test passes (exit 0).
  expected_literals:
  - 1 passed
  fix_if: >-
    A failure: the removed block or the successor block is wrong; fix sns_alerts.tf.
  hermetic: true
  graduation: waive
  graduation_waiver_reason: >-
    Transitional by design: PLAN-terraform-company-emails-closing replaces this test and the removed block it checks
    with the standing guard it graduates.
- step: 3
  phase: pre-deploy
  action: >-
    PR 2 open: its trusted plan comment reads CHANGES with zero counts, exactly one row, the forget of
    aws_sns_topic_subscription.alerts_email, a drift line that names nothing but the successor (its confirmation, C1)
    or no drift line, a PASS guard prediction and a saved plan, and leaks nothing.
  command: |-
    test -n "$PR_NUMBER" && bin/venv-python - <<'PY'
    import json, os, re, sys, urllib.request
    get = lambda p: json.load(urllib.request.urlopen('https://api.github.com/repos/otl-labs/ontheloop/' + p, timeout=30))
    body = [c['body'] for c in get(f"issues/{os.environ['PR_NUMBER']}/comments?per_page=100") if 'terraform/personal speculative plan (trusted' in c['body']][-1]
    scan = re.sub(r'\b[0-9a-f]{40,64}\b', '', body)
    leaks = [n for n, x in (('at', r'@[a-z0-9-]+\.[a-z]'), ('12-digit', r'(?<!\d)\d{12}(?!\d)'), ('arn', r'\barn:')) if re.search(x, scan)]
    rows = [r for r in re.findall(r'^\| ([^|]+?) \| ([^|]+?) \|', body, re.M) if r[0] != 'Resource' and not set(r[0]) <= set('-')]
    drift = re.findall(r'`([^`]+)`', (re.search(r'^Drift detected outside Terraform: (.*)$', body, re.M) or [None, ''])[1])
    ok = ('State: CHANGES' in body and '0 to import, 0 to add, 0 to change, 0 to destroy (0 replaced).' in body
          and rows == [('aws_sns_topic_subscription.alerts_email', 'forget')] and set(drift) <= {'aws_sns_topic_subscription.company_alerts_email'}
          and 'Predicted guard verdict: PASS' in body and 'This saved plan is applied at merge' in body and not leaks)
    print(json.dumps({'one_forget': bool(ok), 'drift': drift, 'leaks': leaks})); sys.exit(0 if ok else 'TRUSTED PLAN STOP')
    PY
  expected: >-
    One JSON line {"one_forget": true, "drift": [...], "leaks": []} where drift is empty or names only the successor.
  fix_if: >-
    Any other row, a delete, a drift line naming another address, or BLOCKED: stop; do not merge, and read the plan
    (another change reached main or the live system, which is triaged before this plan continues).
  hermetic: false
  graduation: not-applicable
- step: 4
  phase: post-deploy
  action: >-
    Convergence proof (Decision 190): with MERGE_SHA set, every terraform-apply-sandbox run for that commit succeeded;
    the first completed terraform-drift run on main created after AFTER succeeded and reads clean or measured
    converged, with no e-mail-shaped text in its log; the convergence record is green. Run after PR 2's merge and after
    S2 (dispatching terraform-drift.yml is allowed: a read-only plan).
  command: |-
    test -n "$AFTER" && bin/venv-python - <<'PY'
    import json, os, re, sys, urllib.request, boto3
    R = 'https://api.github.com/repos/otl-labs/ontheloop/'
    get = lambda p, raw=False: (lambda r: r.read().decode('utf-8', 'replace') if raw else json.load(r))(urllib.request.urlopen(R + p, timeout=60))
    if os.environ.get('MERGE_SHA'):
        ap = get('actions/workflows/terraform-apply-sandbox.yml/runs?head_sha=' + os.environ['MERGE_SHA'])['workflow_runs']
        assert ap and all(r['conclusion'] == 'success' for r in ap), [(r['id'], r['conclusion']) for r in ap]
    runs = sorted((r for r in get('actions/workflows/terraform-drift.yml/runs?branch=main&per_page=50')['workflow_runs'] if r['created_at'] > os.environ['AFTER'] and r['status'] == 'completed'), key=lambda r: r['created_at'])
    assert runs, 'no completed drift run after AFTER yet'
    d = runs[0]; log = ''.join(get(f"actions/jobs/{j['id']}/logs", raw=True) for j in get(f"actions/runs/{d['id']}/jobs")['jobs'])
    clean = re.search(r'Z Drift check: no changes detected \(exit 0\); cycle is clean\.$', log, re.M) or re.search(r'Z Measured verdict this cycle: converged ', log)
    leak = re.search(r'@[a-z0-9-]+\.[a-z]', log)
    s3 = boto3.Session(profile_name='agent_platform_admin', region_name=open('config/aws-region').read().strip()).client('s3')
    rec = json.loads(s3.get_object(Bucket='agent-platform-data-lake', Key='convergence/personal/sandbox.json')['Body'].read())
    print('DRIFT', d['id'], d['event'], d['conclusion'], 'clean' if clean else 'NOT_CLEAN', 'leak' if leak else 'no_leak', 'record', rec['status'])
    sys.exit(0 if d['conclusion'] == 'success' and clean and not leak and rec['status'] == 'green' else 'DRIFT STOP')
    PY
  expected: Prints DRIFT with the run id, event, success, clean, no_leak and record green (exit 0).
  fix_if: >-
    Not clean or red: read the run's measured verdict and stop (Decision 55). Never heal with a guard-routed dispatch,
    whose plan.bin is a public artifact (rec-4230). A leak: stop, tell the coordinator and the operator.
  hermetic: false
  graduation: not-applicable
- step: 5
  phase: post-deploy
  action: >-
    Persisted state, after PR 2's apply: the remote state no longer holds aws_sns_topic_subscription.alerts_email, and
    its company_alerts_email instance records pending_confirmation false with the confirmation_was_authenticated value
    VP 6 read live. Prints booleans only.
  command: |-
    bin/venv-python - <<'PY'
    import json, boto3
    s3 = boto3.Session(profile_name='agent_platform_admin', region_name=open('config/aws-region').read().strip()).client('s3')
    st = json.loads(s3.get_object(Bucket='agent-platform-data-lake', Key='tfstate/personal/sandbox/terraform.tfstate')['Body'].read())
    subs = {r['name']: r['instances'][0]['attributes'] for r in st['resources'] if r.get('mode') == 'managed' and r['type'] == 'aws_sns_topic_subscription'}
    got = {'names': sorted(subs), 'successor_pending': subs.get('company_alerts_email', {}).get('pending_confirmation'), 'successor_authenticated': subs.get('company_alerts_email', {}).get('confirmation_was_authenticated')}
    print('STATE', got); assert got['names'] == ['company_alerts_email'] and got['successor_pending'] is False, got
    PY
  expected: >-
    Prints STATE with names ['company_alerts_email'], successor_pending False and the authenticated flag (exit 0).
  fix_if: >-
    alerts_email still in state: PR 2's apply did not run its forget; stop. successor_pending True: the apply did not
    persist the refresh; stop before C2 and tell the coordinator, since the closing plan's tfvars window depends on it.
  hermetic: false
  graduation: not-applicable
- step: 6
  phase: post-deploy
  action: >-
    Subscription state, by MODE, printing roles only: two_confirmed (before PR 2 and again before C2: both confirmed,
    the successor's ConfirmationWasAuthenticated printed), successor_only (after C2: exactly one e-mail subscription,
    the company alerts role alias, confirmed).
  command: |-
    test -n "$MODE" && bin/venv-python - <<'PY'
    import json, os, sys, boto3
    A = json.load(open(os.path.join(os.environ.get('TMPDIR', '/tmp'), 'tf-company-emails', 'aliases.json')))
    R = open('config/aws-region').read().strip(); B = boto3.Session(profile_name='agent_platform_admin', region_name=R); sns = B.client('sns')
    topic = f"arn:aws:sns:{R}:{B.client('sts').get_caller_identity()['Account']}:agent-platform-alerts"
    subs = [s for s in sns.list_subscriptions_by_topic(TopicArn=topic)['Subscriptions'] if s['Protocol'] == 'email']
    state = lambda s: 'pending' if s['SubscriptionArn'] == 'PendingConfirmation' else 'confirmed'
    succ = [s for s in subs if s['Endpoint'] == A['alerts']]; pred = [s for s in subs if s['Endpoint'] != A['alerts']]
    auth = [sns.get_subscription_attributes(SubscriptionArn=s['SubscriptionArn'])['Attributes'].get('ConfirmationWasAuthenticated') for s in succ if state(s) == 'confirmed']
    got = {'successor': [state(s) for s in succ], 'predecessor': [state(s) for s in pred], 'successor_authenticated': auth}
    want = {'two_confirmed': (['confirmed'], ['confirmed']), 'successor_only': (['confirmed'], [])}[os.environ['MODE']]
    print('SUBS', os.environ['MODE'], got)
    sys.exit(0 if (got['successor'], got['predecessor']) == want else 'SUBSCRIPTION STOP')
    PY
  expected: >-
    Prints SUBS with the mode and the per-role states and exits 0; successor_authenticated reads as PLAN-terraform-company-emails
    row C1 recorded.
  fix_if: >-
    two_confirmed with either side missing: the live system changed since plan 1; stop. successor_only with a
    predecessor left: C2 deleted no row; repeat C2. The company row gone: paging has no subscriber; tell the operator
    at once, who re-subscribes the company alias in the console and confirms it as C1 did, then stop and re-plan.
  hermetic: false
  graduation: not-applicable
- step: 7
  phase: post-deploy
  action: >-
    After S2: the version advanced by one; alerts_email equals the company alerts role alias and company_alerts_email;
    every other line is unchanged. Prints no value.
  command: |-
    bin/venv-python - <<'PY'
    import json, os, re, boto3
    A = json.load(open(os.path.join(os.environ.get('TMPDIR', '/tmp'), 'tf-company-emails', 'aliases.json')))
    N = '/secret/agent-platform-terraform-personal-tfvars'; s = json.load(open('/mnt/project-files/terraform-company-emails/build-state.json'))
    ssm = boto3.Session(profile_name='agent_platform_admin', region_name=open('config/aws-region').read().strip()).client('ssm')
    kv = lambda t: dict(re.findall(r'^\s*([a-z_]+)\s*=\s*"?([^"\n]*)"?\s*$', t, re.M))
    p = ssm.get_parameter(Name=N, WithDecryption=True)['Parameter']; new = kv(p['Value'])
    old = kv(ssm.get_parameter(Name=f"{N}:{s['v_s2_before']}", WithDecryption=True)['Parameter']['Value'])
    assert p['Version'] == s['v_s2_before'] + 1, ('another writer touched the parameter', p['Version'])
    assert set(new) == set(old), 'key set'
    assert new['alerts_email'] == new['company_alerts_email'] == A['alerts'], 'alerts values'
    assert all(new[k] == old[k] for k in new if k != 'alerts_email'), 'other lines changed'
    print('S2_OK version', p['Version'])
    PY
  expected: Prints S2_OK with the new version number.
  fix_if: >-
    Another version number or a wrong value: stop and run the S2 rollback on the operator's word.
  hermetic: false
  graduation: not-applicable
- step: 8
  phase: post-deploy
  action: >-
    Evidence: EVIDENCE.md carries rows B2, C2 and S2 as pass, and neither it nor PR 2's body or comments match the
    redaction pattern.
  command: |-
    test -n "$PR_NUMBER" && bin/venv-python - <<'PY'
    import json, os, re, urllib.request
    ev = open('/mnt/project-files/terraform-company-emails/EVIDENCE.md', encoding='utf-8').read()
    REDACT = r'@|(?<![0-9])[0-9]{12}(?![0-9])|\barn:|[A-Za-z0-9_]{50,}'
    rows = ['B2', 'C2', 'S2']
    assert all(re.search(rf'^\| {r} \|.*\| pass \|$', ev, re.M) for r in rows), [r for r in rows if not re.search(rf'^\| {r} \|.*\| pass \|$', ev, re.M)]
    get = lambda p: json.load(urllib.request.urlopen('https://api.github.com/repos/otl-labs/ontheloop/' + p, timeout=30))
    n = os.environ['PR_NUMBER']
    texts = [ev, get(f'pulls/{n}')['body'] or ''] + [c['body'] for c in get(f'issues/{n}/comments?per_page=100') if 'terraform/personal speculative plan' not in c['body']]
    hits = [i for i, t in enumerate(texts) if re.search(REDACT, re.sub(r'\b[0-9a-f]{40,64}\b', '', t))]
    print('EVIDENCE', len(rows), 'rows pass; redaction hits', hits); assert not hits
    PY
  expected: Prints EVIDENCE 3 rows pass and redaction hits [] (exit 0).
  fix_if: >-
    A hit: edit the text out of the PR body or comment at once and tell the operator (Decision 101); a missing row:
    the step was skipped, stop.
  hermetic: false
  graduation: not-applicable
- step: 9
  phase: pre-deploy
  action: >-
    Before PR 2 opens (handoff_policy): the full tier on the committed, rebased, clean tree, then attest HEAD (Decision
    163 pre-handoff run). Started backgrounded with a 2 h limit from the top-level session.
  command: bin/venv-python -m scripts.validate && bin/venv-python -m scripts.checks.validation_result --verify-head
  expected: Exit 0 on a completed full-tier run, then --verify-head attests HEAD's tree.
  fix_if: >-
    A failing check: fix it on the branch and re-run; a pre-existing red on main is reported, never fixed inline
    (Decision 226). Never read the verdict from a pipe's exit status.
  hermetic: false
  graduation: not-applicable
test_obligations:
- source: terraform/personal/sns_alerts.tf
  behavior: the founder's subscription is forgotten with destroy = false and the successor is unchanged.
  verification_step: 2
  test_selector: tests/checks/iam_tf/test_alerts_email_subscription.py::test_predecessor_forgotten_not_destroyed
  red_green_expectation: >-
    Red before: after PLAN-terraform-company-emails the alerts_email resource block is still declared and no removed
    block exists (assertion_failed). Green after PR 2's removed block.
constraints:
- >-
  Live acts and who runs them. Agent, only after the operator's typed word on the exact command in the build thread,
  one word per mutation (Decision 237 cl.3 read as the Neon T1 precedent): S2 and a rollback restore. Operator, in
  the SNS console under their own sign-in: C2. PlatformAdmin is implicitly denied sns:Unsubscribe (no resource type
  in SNS's IAM model; rec-4896), so Decision 223 cl.4's admin split-apply cannot delete the subscription and C2 is the
  operator's console act, proven by VP 6.
- >-
  Order is fixed: start (alias file), VP 1, VP 6 MODE=two_confirmed, PR 2, VP 4, VP 5, VP 6 MODE=two_confirmed, C2,
  VP 6 MODE=successor_only, S2, VP 7, VP 4, VP 8. C2 runs only after VP 5 passes; nothing old is deleted before
  PLAN-terraform-company-emails proved the successor pages.
- >-
  Why the forget is its own PR: C1 changed the successor's computed attributes without an apply, so every plan until
  one applies carries it as resource_drift, and Decision 190's classifier reads any resource_drift beside a planned
  change as out_of_band_drift (an immediate red). PR 2's apply persists the refreshed state, so the closing plan's
  tfvars window (an Owner diff) measures as pending_codification instead.
- >-
  Parameter writes are read-modify-write with a version check and keep every other line (neon_org_id included); the
  coordinator serialises them with rec-4048 and any other writer.
- >-
  Expected detector pages (Decision 202 cl.5, never filtered by actor), each evidence, not an incident:
  platform-security-alerts-topic-change on C2's deletion. The forget itself makes no AWS call. A page outside this
  list is triaged before the next step.
- >-
  No e-mail address (company aliases included), account id, ARN, token or link enters the repository, a PR, memory,
  chat or the shared folder (Decision 101): the build reads the role aliases from the session's alias file at run time
  and prints roles and booleans; evidence is kind and UTC time.
- >-
  A failed or drifted step halts this workstream until root-caused; never a silent retry; no rescue agents or
  workaround loops (Decision 55). Never apply terraform/personal out of band (rec-3189).
context:
- >-
  Approval: the operator pre-agreed to every blind-consult recommendation on design forks
  (cmsg_017f94mmYqSe3q2p9o6tPW3U7KRAw4mzGP2yMgJoEhb4gf, 2026-11-03); terraform-company-emails/ADVICE.md records the
  consult. This plan changes no contract or Decision wording; its live steps still need the operator's word.
- >-
  Second of three plans (one declaring PR each): PLAN-terraform-company-emails (PR 1, the successor),
  this plan (PR 2), PLAN-terraform-company-emails-closing (PR 3 and a docs-only closing PR). The alerts-mailbox rec
  closes with the closing plan, which bundles it once the subscription is back at its pinned address.
- >-
  Decision-scout FLAGS_FOUND for the three-plan design, NOTEs adopted: Decision 223 cl.4 (console deletion, not an
  admin split-apply; rec-4896 owns the ineffective grant), Decision 237 cl.3 (agent SSM writes on the word). CITE:
  195, 242, 101, 77, 126, 238, 190, 223, 237, 202. No numbered Decision.
- >-
  Probed 2026-11-04 (read-only, PlatformAdmin): the remote state object and SNS subscription attributes are readable;
  removed blocks with destroy = false already pass the trusted-plan screen (terraform/personal/platform_roles.tf).
  UNPROVEN: that Terraform's JSON plan lists the confirmation as resource_drift (VP 3 measures it; either outcome
  passes, and VP 5 proves the persisted state).
- >-
  gates: decision-scout=FLAGS_FOUND (NOTEs adopted); plan-critique in gate_rounds; red_overlap at VP 1.
pre_implementation_checklist:
