  until C2; to manage it again, revert the removed block and re-import it in an ADMIN session (terraform import
  aws_sns_topic_subscription.alerts_email by its subscription ARN, read at run time and never printed; import blocks
  are refused by the trusted-plan screen) on the operator's word, then VP 4. C2: the operator subscribes the old
  address again in the console and confirms it from that inbox (unmanaged; the company subscription keeps paging
  throughout). S2: on the operator's word, put back the version recorded before it (main reads alerts_email in no
  resource, so nothing changes in Terraform).
