    run other than pull_request runs is queued, in progress or waiting, so PR 2's apply starts at once (it takes the
    state lock only at its apply step, after init, the guard and the merge-time review, so the exposed window is that
    whole pre-apply duration); and the convergence record is green,
    so the push apply's precondition does not refuse it. Scheduled ticks are created at
    irregular times (seven in the 48 hours to 2026-11-04 06:35Z, none at the cron minute), so no safe minute exists;
    constraints name the recovery for that residue.
  command: |-
    bin/venv-python - <<'PY'
    import json, sys, urllib.request, boto3
    get = lambda w: json.load(urllib.request.urlopen(f'https://api.github.com/repos/otl-labs/ontheloop/actions/workflows/{w}/runs?per_page=100', timeout=30))['workflow_runs']
    busy = {w: [r['id'] for r in get(w) if r['status'] != 'completed' and r['event'] != 'pull_request'] for w in ('terraform-apply-sandbox.yml', 'reconcile.yml', 'terraform-drift.yml')}
    s3 = boto3.Session(profile_name='agent_platform_admin', region_name=open('config/aws-region').read().strip()).client('s3')
    rec = json.loads(s3.get_object(Bucket='agent-platform-data-lake', Key='convergence/personal/sandbox.json')['Body'].read())['status']
    print('QUIET', json.dumps(busy), 'record', rec); sys.exit(0 if not any(busy.values()) and rec == 'green' else 'NOT QUIET')
