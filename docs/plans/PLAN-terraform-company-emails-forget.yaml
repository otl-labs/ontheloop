- step: 3
  phase: pre-deploy
  action: >-
    Passed 2026-11-06; not re-run (Amendment 1: completed steps keep their rows).
    PR 2 open: its trusted plan comment for the PR's current head reads CHANGES with zero counts, no changed output, exactly one row, the forget of
    aws_sns_topic_subscription.alerts_email, no refresh drift outside the chronic classes (aws_iam_role and aws_lambda_function addresses, which every recent trusted comment names: role use and the governed Lambda code deploys; rec-4631) except the successor (its confirmation,
    C1), a PASS guard prediction and a saved plan, and leaks nothing.
  command: |-
    test -n "$PR_NUMBER" && bin/venv-python - <<'PY'
    import json, os, re, sys, urllib.request
    get = lambda p: json.load(urllib.request.urlopen('https://api.github.com/repos/otl-labs/ontheloop/' + p, timeout=30))
    head = get(f"pulls/{os.environ['PR_NUMBER']}")['head']['sha']
    cs = [c['body'] for c in get(f"issues/{os.environ['PR_NUMBER']}/comments?per_page=100") if 'terraform/personal speculative plan (trusted' in c['body'] and f'PR head `{head}`' in c['body']]
    body = cs[-1] if cs else sys.exit('TRUSTED PLAN NOT POSTED for this head yet')
    scan = re.sub(r'\b[0-9a-f]{40,64}\b', '', body)
    leaks = [n for n, x in (('at', r'@[a-z0-9-]+\.[a-z]'), ('12-digit', r'(?<!\d)\d{12}(?!\d)'), ('arn', r'\barn:')) if re.search(x, scan)]
    rows = [r for r in re.findall(r'^\| ([^|]+?) \| ([^|]+?) \|', body, re.M) if r[0] != 'Resource' and not set(r[0]) <= set('-')]
    CHRONIC = ('aws_iam_role.', 'aws_lambda_function.')
    odd = [a for a in re.findall(r'`([^`]+)`', (re.search(r'^Drift detected outside Terraform: (.*)$', body, re.M) or [None, ''])[1]) if not a.startswith(CHRONIC)]
    ok = ('State: CHANGES' in body and '0 to import, 0 to add, 0 to change, 0 to destroy (0 replaced).' in body
          and rows == [('aws_sns_topic_subscription.alerts_email', 'forget')] and set(odd) <= {'aws_sns_topic_subscription.company_alerts_email'}
          and 'Changed outputs:' not in body and 'Predicted guard verdict: PASS' in body and 'This saved plan is applied at merge' in body and not leaks)
    print(json.dumps({'one_forget': bool(ok), 'odd_drift': odd, 'leaks': leaks})); sys.exit(0 if ok else 'TRUSTED PLAN STOP')
    PY
  expected: >-
    One JSON line {"one_forget": true, "odd_drift": [...], "leaks": []} where odd_drift is empty or names only the
    successor.
  fix_if: >-
    NOT POSTED: the trusted plan job has not commented on this head yet; re-run after its wake. Any other row, a
    delete, another address in odd_drift, or BLOCKED: stop; do not merge, and read the plan
    (another change reached main or the live system, which is triaged before this plan continues).
  hermetic: false
  graduation: not-applicable
- step: 4
  phase: post-deploy
  action: >-
    Convergence proof (Decision 277, which superseded Decision 190 on 2026-11-19 with the same rule; Amendment 1:
    GitHub reads only, no S3 read): the apply runs (every terraform-apply-sandbox run for MERGE_SHA, or the one heal
    dispatch APPLY_RUN names) completed with success, and the merge-time review's verdict is printed; the first
    completed terraform-drift cycle on main created after the later of AFTER (UTC, YYYY-MM-DDTHH:MM:SSZ) and those
    runs' completion succeeded and reads clean or measured converged (cancelled and skipped runs are not cycles); the
    convergence record reads green in the newest completed convergence-health run on main (its HealthVerdict line, the
    hourly direct read of the record, Decision 267), and no record writer has run since that read began: no
    non-pull_request terraform-apply-sandbox or reconcile run (a waiting gated apply included) and no terraform-drift
    run is unfinished or finished after the health run started, except drift runs that succeeded clean with no red or
    pending_codification write, or skipped their cycle for the state lock; neither the selected drift log nor the apply
    logs carry e-mail-shaped text. Passed with MERGE_SHA on 2026-11-07; run after S2 with AFTER = t_s2. A
    terraform-drift dispatch is allowed only once that apply concluded: it reads the infrastructure but writes the
    convergence record and may file a tf_drift rec.
  command: |-
    test -n "$AFTER$MERGE_SHA$APPLY_RUN" && bin/venv-python - <<'PY'
    import functools, json, os, re, sys, urllib.request
    R = 'https://api.github.com/repos/otl-labs/ontheloop/'
    get = lambda p, raw=False: (lambda r: r.read().decode('utf-8', 'replace') if raw else json.load(r))(urllib.request.urlopen(R + p, timeout=60))
    after = os.environ.get('AFTER', ''); alog = ''
    assert not after or re.fullmatch(r'\d{4}-\d\d-\d\dT\d\d:\d\d:\d\dZ', after), 'AFTER must read YYYY-MM-DDTHH:MM:SSZ'
    if os.environ.get('APPLY_RUN') or os.environ.get('MERGE_SHA'):
        ap = [get('actions/runs/' + os.environ['APPLY_RUN'])] if os.environ.get('APPLY_RUN') else get('actions/workflows/terraform-apply-sandbox.yml/runs?head_sha=' + os.environ['MERGE_SHA'])['workflow_runs']
        assert ap and all(r['status'] == 'completed' for r in ap), 'apply run not completed yet'
        alog = ''.join(get(f"actions/jobs/{j['id']}/logs", raw=True) for r in ap for j in get(f"actions/runs/{r['id']}/jobs")['jobs'] if j['conclusion'] != 'skipped')
        print('REVIEWER', re.findall(r'Reviewer verdict: (\w+)', alog))
        assert all(r['conclusion'] == 'success' for r in ap), [(r['id'], r['conclusion']) for r in ap]
        after = max([after] + [r['updated_at'] for r in ap])
    done = [r for r in get('actions/workflows/terraform-drift.yml/runs?branch=main&per_page=100')['workflow_runs'] if r['status'] == 'completed' and r['conclusion'] not in ('cancelled', 'skipped')]
    dl = functools.lru_cache(None)(lambda i: ''.join(get(f"actions/jobs/{j['id']}/logs", raw=True) for j in get(f'actions/runs/{i}/jobs')['jobs'] if j['conclusion'] != 'skipped'))
    skip = lambda l: re.search(r'Z (?:##\[notice\]|::notice::)Lock held by an in-flight apply', l)
    clean = lambda l: bool(re.search(r'Z Drift check: no changes detected \(exit 0\); cycle is clean\.$', l, re.M) or re.search(r'Z Measured verdict this cycle: converged ', l))
    wrote = lambda l: re.search(r'Z (?:Wrote red convergence record|pending_codification \w+): ', l)
    cycles = lambda rs: ((d, dl(d['id'])) for d in rs if not skip(dl(d['id'])))
    d, log = next(cycles(sorted((r for r in done if r['created_at'] > after), key=lambda r: r['created_at'])), (None, ''))
    assert d, 'no completed drift cycle after the apply or AFTER yet (lock-skip runs are not cycles)'
    h = max((r for r in get('actions/workflows/convergence-health.yml/runs?branch=main&per_page=20')['workflow_runs'] if r['status'] == 'completed'), key=lambda r: r['created_at'])
    hj = json.loads((re.search(r'Z \[convergence_health\] HealthVerdict: (\{.*\})\s*$', dl(h['id']), re.M) or [None, '{}'])[1])
    hv = 'green' if hj.get('status') == 'green' and hj.get('pending_gated') is None else '%s%s' % (hj.get('status', 'missing'), '' if hj.get('pending_gated') is None else '+pending_gated')
    late = lambda w: [r for q in ('', '&status=queued', '&status=in_progress', '&status=waiting', '&status=requested', '&status=pending') for r in get(f'actions/workflows/{w}/runs?per_page=100{q}')['workflow_runs'] if r['event'] != 'pull_request' and (r['status'] != 'completed' or r['updated_at'] > h['run_started_at'])]
    benign = lambda r: r['status'] == 'completed' and r['conclusion'] == 'success' and (skip(dl(r['id'])) or (clean(dl(r['id'])) and not wrote(dl(r['id']))))
    writers = sorted({r['id'] for w in ('terraform-apply-sandbox.yml', 'reconcile.yml') for r in late(w)} | {r['id'] for r in late('terraform-drift.yml') if not benign(r)})
    record = 'green' if hv == 'green' and not writers else 'UNPROVEN'
    leak = re.search(r'@[a-z0-9-]+\.[a-z]', log + alog)
    print('DRIFT', d['id'], d['event'], d['conclusion'], 'clean' if clean(log) else 'NOT_CLEAN', 'leak' if leak else 'no_leak', 'record', record, json.dumps({'health_run': h['id'], 'health': hv, 'writers_since': writers}))
    sys.exit(0 if d['conclusion'] == 'success' and clean(log) and not leak and record == 'green' else 'DRIFT STOP')
    PY
  expected: >-
    With an apply run selected, prints REVIEWER ['PROCEED']; then DRIFT with the run id, event, success, clean,
    no_leak, record green and a JSON tail naming the health run read, health green (status green with no pending_gated marker) and writers_since [] (exit 0).
    Run live read-only 2026-11-19 (AFTER 12:00Z, record green; against an older health run, two later clean drift ticks read as benign); a fake run list also read UNPROVEN, naming the writer, for a tick that crashed after the health read, an apply created before it that finished after it, and an old gated apply still waiting. A drift run that skipped its cycle because the state lock was held is passed over, never
    read as a cycle, and every log match is anchored after the log timestamp, because every log also echoes its
    printed run script.
  fix_if: >-
    A failed apply run: REVIEWER names the merge-time review's verdict; follow constraints (merge-time reviewer). A
    cycle that planned another thread's merged change before its apply ran crashes while rec-4255 is open, or reads
    out_of_band_drift through the chronic drift (rec-4631): tell the coordinator, whose thread it is; wait for that
    apply and its heal, then re-run with AFTER = its completion. Record UNPROVEN with writers_since non-empty or health
    missing: re-run once the next convergence-health tick (hourly at minute 37) starts after those writers finish.
    Health red or unknown, or UNPROVEN twice: ask the operator for VP 12 (CloudShell record read) and stop on anything
    but RECORD green; RECORD green stands in for the record clause only, so the drift cycle must still read success,
    clean and no_leak. Otherwise not clean: read the run's measured verdict and stop (Decision 55). Never heal with a
    guard-routed dispatch, whose plan.bin is a public artifact (rec-4230). A leak: stop, tell the coordinator and the
    operator.
  hermetic: false
  graduation: not-applicable
- step: 5
  phase: post-deploy
  action: >-
    Passed 2026-11-07; not re-run (Amendment 1: completed steps keep their rows; this command
    used the pre-Decision-256 admin chain, which no build session holds now).
    Persisted state and hold release, after PR 2's apply: the apply runs (every terraform-apply-sandbox run for
    MERGE_SHA, or the one heal dispatch APPLY_RUN names) completed with success and the convergence record is green;
    the remote state no longer holds aws_sns_topic_subscription.alerts_email, and its company_alerts_email instance
    records pending_confirmation false (its confirmation_was_authenticated flag is printed for the row). Prints run
    ids, the record status and booleans only. The state also holds the catalog logins (Decision 238 cl.4); the read
    is the ADMIN tier's (cl.1 binds PR, agent and PlatformDev identities); the parsed object is filtered to the
    subscriptions at once, and nothing else is kept or printed.
  command: |-
    test -n "$MERGE_SHA$APPLY_RUN" && bin/venv-python - <<'PY'
    import json, os, urllib.request, boto3
    get = lambda p: json.load(urllib.request.urlopen('https://api.github.com/repos/otl-labs/ontheloop/' + p, timeout=60))
    ap = [get('actions/runs/' + os.environ['APPLY_RUN'])] if os.environ.get('APPLY_RUN') else get('actions/workflows/terraform-apply-sandbox.yml/runs?head_sha=' + os.environ['MERGE_SHA'])['workflow_runs']
    assert ap and all(r['status'] == 'completed' and r['conclusion'] == 'success' for r in ap), [(r['id'], r['status'], r['conclusion']) for r in ap]
    s3 = boto3.Session(profile_name='agent_platform_admin', region_name=open('config/aws-region').read().strip()).client('s3')
    rec = json.loads(s3.get_object(Bucket='agent-platform-data-lake', Key='convergence/personal/sandbox.json')['Body'].read())['status']
    st = [r for r in json.loads(s3.get_object(Bucket='agent-platform-data-lake', Key='tfstate/personal/sandbox/terraform.tfstate')['Body'].read())['resources'] if r.get('mode') == 'managed' and r['type'] == 'aws_sns_topic_subscription']
    subs = {r['name']: r['instances'][0]['attributes'] for r in st}
    got = {'names': sorted(subs), 'successor_pending': subs.get('company_alerts_email', {}).get('pending_confirmation'), 'successor_authenticated': subs.get('company_alerts_email', {}).get('confirmation_was_authenticated')}
    print('STATE', got, 'apply_runs', [r['id'] for r in ap], 'record', rec); assert got['names'] == ['company_alerts_email'] and got['successor_pending'] is False and rec == 'green', got
    PY
  expected: >-
    Prints STATE with names ['company_alerts_email'], successor_pending False and the authenticated flag, the apply
    run ids and record green (exit 0). Only then is the hold released.
  fix_if: >-
    An apply run not completed: wait for it and re-run. An apply run failed: the hold stays; read the run and follow
    constraints (merge-time reviewer); stop. The record not green after a successful apply: a drift cycle landed in
    the gap; the hold stays; follow constraints (merge-to-apply gap), whose heal ends in VP 5 and VP 4 with APPLY_RUN. alerts_email still in state: PR 2's apply did not
    run its forget; read the apply run and follow constraints (merge-time reviewer); stop. successor_pending True: the apply did not
    persist the refresh; stop before C2 and tell the coordinator, since the closing plan's tfvars window depends on it.
  hermetic: false
  graduation: not-applicable
- step: 6
  phase: pre-deploy
  action: >-
    Subscription state, a live read, printing roles and states only (confirmed: an ARN; pending; deleted: SNS's
    Deleted row, unsubscribed and awaiting purge; other). Its two_confirmed runs passed under the admin chain (before
    PR 2 on 2026-11-06 and before C2 on 2026-11-07, successor authenticated). Amendment 1: the remaining run,
    successor_only after C2, is an operator CloudShell block (constraints, CloudShell blocks): the company alerts role
    alias, read in CloudShell as the parameter's company_alerts_email, is confirmed with ConfirmationWasAuthenticated
    true, and the founder's row is gone or deleted; it also prints the parameter version, which S2 checks.
  command: |-
    python3 - <<'PY'
    import datetime as dt, getpass, json, os, re, subprocess, sys, urllib.request
    R = urllib.request.urlopen('https://raw.githubusercontent.com/otl-labs/ontheloop/main/config/aws-region', timeout=30).read().decode().strip()
    def aws(*a):
        p = subprocess.run(['aws', *a, '--region', R, '--output', 'json'], capture_output=True, text=True)
        if p.returncode: sys.exit('AWS_ERROR ' + ' '.join(a[:2]))
        return json.loads(p.stdout or 'null')
    if subprocess.run(['aws', 'configure', 'get', 'cli_history'], capture_output=True, text=True).stdout.strip() == 'enabled': sys.exit('CLI_HISTORY_ON')
    if not aws('sts', 'get-caller-identity')['Arn'].endswith(':user/platform-breakglass'): sys.exit('ADMIN_CHAIN_ABSENT')
    N = '/secret/agent-platform-terraform-personal-tfvars'; kv = lambda t: dict(re.findall(r'^\s*([a-z_]+)\s*=\s*"?([^"\n]*)"?\s*$', t, re.M))
    par = lambda v=None: aws('ssm', 'get-parameter', '--name', N if v is None else '%s:%s' % (N, v), '--with-decryption')['Parameter']
