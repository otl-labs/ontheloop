execution_steps:
- |-
  Start. Read docs/PROJECT_CONTEXT.md, this plan and the handoff notes PLAN-terraform-company-emails left in /mnt/project-files/terraform-company-emails/. Write the session's alias file as PLAN-terraform-company-emails execution_steps (start) shows, and follow that plan's conventions for every live step (present, wait for the word, verify, one EVIDENCE.md row, times and versions in build-state.json). Run VP 1, then VP 6 with MODE=two_confirmed.
- |-
  PR 2 (declares this plan). In sns_alerts.tf replace the aws_sns_topic_subscription.alerts_email resource block with:
    # CI cannot unsubscribe (github_ci_apply_policy.tf): forget the founder's subscription and let the operator
    # delete it in the console once the company successor pages (PLAN-terraform-company-emails-forget).
    removed {
      from = aws_sns_topic_subscription.alerts_email

      lifecycle {
        destroy = false
      }
    }
  Replace the test with test_predecessor_forgotten_not_destroyed. Flip implementation_declared to true. Run VP 2, terraform fmt -check terraform/personal (provider-free; Decision 119), bin/venv-python -m scripts.validate --pre, VP 9 and code review. Open the PR titled 'feat(terraform-company-emails-forget): forget the founder's alerts subscription' (no Resolves trailer: bundled_recommendations is empty). Run VP 3 on its trusted plan comment. Squash-merge on code-review PROCEED, VP 3 and green CI. Then VP 4 with AFTER = the merge time and MERGE_SHA, and VP 5. Row B2 (PR number, merge SHA, run ids). Report readiness, validator verdicts, postflight evidence, review and the real push and PR outcome separately (implement skill, Commit Flows).
- |-
  C2, delete the founder's subscription (operator, SNS console, in the region config/aws-region names), only after VP 5 passes. The agent first re-runs VP 6 with MODE=two_confirmed. Then: Amazon SNS > Topics > agent-platform-alerts > Subscriptions: select the e-mail subscription whose endpoint is not on the company domain (the founder's; the company row must stay), Delete, confirm. Then VP 6 with MODE=successor_only; row C2.
- |-
  S2, alerts value (agent, on the operator's word on this command). Record v_s2_before, present, wait for the word, run, then VP 7 and VP 4 with AFTER = the write time (main reads alerts_email in no resource now, so the plan is unchanged), row S2:
  bin/venv-python - <<'PY'
  import json, os, re, boto3
  A = json.load(open(os.path.join(os.environ.get('TMPDIR', '/tmp'), 'tf-company-emails', 'aliases.json')))
  N = '/secret/agent-platform-terraform-personal-tfvars'
  ssm = boto3.Session(profile_name='agent_platform_admin', region_name=open('config/aws-region').read().strip()).client('ssm')
  p = ssm.get_parameter(Name=N, WithDecryption=True)['Parameter']; t = p['Value']
  m = re.search(r'^\s*alerts_email\s*=.*$', t, re.M); assert m, 'no alerts_email line'
  t = t[:m.start()] + 'alerts_email = "' + A['alerts'] + '"' + t[m.end():]
  assert ssm.get_parameter(Name=N)['Parameter']['Version'] == p['Version'], 'parameter changed since read'
  print('TFVARS_WRITTEN', p['Version'], '->', ssm.put_parameter(Name=N, Value=t, Type='SecureString', Overwrite=True)['Version'])
  PY
- |-
  Close out: VP 8 with PR_NUMBER = PR 2. Write handoff notes for the coordinator: the founder's subscription is gone and alerts_email holds the company alias; PLAN-terraform-company-emails-closing can start; rec-4896 open.
- |-
  Execute Verification Plan: each VP step in its place in the order above; loop until pass; on an unrecoverable V3 failure stop and root-cause (Decision 55); a failed or drifted live step halts this workstream until root-caused, never a silent retry.
- |-
  Report: what was implemented, verification results, the evidence path, and every item still waiting on the operator.
rollback: >-
