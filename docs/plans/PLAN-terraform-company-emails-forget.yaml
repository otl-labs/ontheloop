constraints:
- >-
  Live acts and who runs them. Agent, only after the operator's typed word on the exact command in the build thread,
  one word per mutation (Decision 237 cl.3 read as the Neon T1 precedent): S2, a rollback restore, and any
  terraform-apply-sandbox or terraform-drift dispatch (a drift dispatch writes the convergence record), and PR 2's
  squash-merge (Decisions 77 and 126 let a guard-PASS apply run without a word, but the forget is forward-only:
  managing the predecessor again needs a break-glass import). Operator, in
  the SNS console under their own sign-in: C2. PlatformAdmin is implicitly denied sns:Unsubscribe (no resource type
  in SNS's IAM model; rec-4896), so Decision 223 cl.4's admin split-apply cannot delete the subscription and C2 is the
  operator's console act, proven by VP 6.
- >-
  Order is fixed: start (alias file), VP 1, VP 6 MODE=two_confirmed, PR 2 (VP 2, VP 9, open, VP 3, VP 10, merge), VP
  5 with MERGE_SHA as soon as the apply run concludes (the hold is released when it passes), VP 4, VP 6 MODE=two_confirmed, C2, VP 6 MODE=successor_only, S2, VP 7, VP 4, VP 8. C2
  runs only after VP 5 and VP 4 pass; nothing old is deleted before PLAN-terraform-company-emails proved the successor pages.
- >-
  Why the forget is its own PR: the founder's deletion (C2) must come after the forget and before the closing plan's
  move. PR 2's apply also persists the refreshed state (the trusted plan refreshes fully), so the successor's confirmed
  attributes are in state before the closing plan (VP 5). It does not make the closing plan's tfvars window measure
  pending_codification: every plan carries chronic refresh drift (aws_iam_role and aws_lambda_function addresses;
  rec-4631), so an exit-2 drift cycle reads out_of_band_drift, or crashes while rec-4255 is open; the closing plan's
  constraints handle that window.
- >-
  Merge-to-apply gap. Drift serialises with apply only through the S3 state lock (terraform-drift.yml), so a drift
  cycle that plans a terraform/personal merge commit before its apply takes the lock sees that change beside the
  chronic refresh drift (and C1's) and red-flips, or crashes in Handle drift while rec-4255 is open (no record
  change). That is true of every merge; the hold keeps every other apply out of PR 2's window, so PR 2's saved plan
  cannot go stale and its gap is the only one. So: the coordinator holds every other terraform/personal merge and
  every terraform-apply-sandbox, reconcile or terraform-drift dispatch by another thread from
  PLAN-terraform-company-emails C1 until VP 5 passes (expected the same day; the agent tells the coordinator when it
  is released); PR 2 merges only on VP 10; and a drift dispatch waits for the MERGE_SHA apply (VP 4). If a cycle
  still lands in the gap: review its tf_drift rec (Decision 55; it names the chronic aws_iam_role and
  aws_lambda_function drift, and the successor if PR 2 has not applied), then on the operator's word dispatch terraform-apply-sandbox's acknowledge-and-retry
  (acknowledge_red_commit = the red commit; deploy-paths.yaml heal_verb_selection). Its fresh plan at main HEAD is the
  forget or nothing, which the guard passes, so nothing routes and no plan.bin artifact is uploaded (rec-4230 concerns
  routed dispatches only). Then VP 5 with APPLY_RUN = that dispatch run's id (the hold stays until it passes,
  whichever step runs first), then VP 4 with the same APPLY_RUN and no MERGE_SHA (a refused push run for the merge commit stays failed). The gap cycle's tf_drift rec is closed with update_rec, citing the
  heal run id and VP 4's green record as evidence.
- >-
  Merge-time reviewer: after the guard passes, terraform-apply-sandbox's Subagent plan review (T2.39; an LLM given
  only the names-only digest, never this plan) gates the apply. PR 2's digest lists one entry, the forget, rendered
  actions=[forget], which it has likely never been shown: the only earlier forgets (#1540, PLAN-platform-iam-personal-release)
  were IAM-sensitive and routed to tf-gated-apply, whose gated-apply job has no Subagent plan review step
  (terraform-apply-sandbox.yml), and the chain renders a forget as the "other" bucket (plan_names_core.py
  action_bucket), a "forget" row (terraform_personal_plan_report.py) and actions=[forget] (terraform_plan_digest.py);
  VP 4 prints the verdict. On REVISE the apply is skipped and
  the record turns red; on STARVED the apply is skipped and the record is left as it was (Decision 55), though the
  next drift cycle then reads the pending forget beside the chronic drift and red-flips it (or crashes while rec-4255
  is open). A stale saved plan at merge
  (PLAN_STALE_CONCURRENT_WRITER, if an apply slipped past the hold and VP 10) turns it red too; the same heal applies. Either way the predecessor is
  still in state, so C2 must not run, and the failed push run files a ci_rca rec (Decision 226): tell the coordinator
  at once, since past its repair SLO it blocks every thread's dispatch. Once that rec and the REVISE reason are
  reviewed, the heal on the operator's word is one terraform-apply-sandbox dispatch (acknowledge_red_commit = the red
  commit when the record is red, else blank; terraform/personal at main HEAD is still PR 2's under the hold, and its fresh plan is the same
  guard-PASS forget, reviewed afresh), then VP 5 and VP 4 with APPLY_RUN = that dispatch run's id (the hold stays
  until VP 5 passes). A second REVISE, or a reason naming a real
  defect: stop; a revert PR restores the resource block (its trusted plan reads NO_CHANGES, since the subscription
  never left state, with the chronic and C1 drift on its drift line, which a no-change apply does not persist) and
  merges, an acknowledged dispatch writes the record green, and a rec records the reviewer's
  judgement (Decision 55) before this plan is re-planned.
- >-
  Waiting (git-ops never_poll): a CI-green or merge wait is event-driven only (subscribe_pr_activity and the
  CI-green comment wake, git-ops.yaml wake_signals); for a drift run (VP 4) arm a Monitor until-loop bounded at two
  hours, or end the turn with a send_later wake; never a foreground sleep or polling loop. "Loop until pass" in the
  execution steps means re-run after the awaited event, never a polling loop.
- >-
  Masking hand-off: PLAN-terraform-company-emails' "Masking first" says the later plans' holds block other threads'
  reconcile dispatches across their windows; this plan's hold ends at VP 5, before S2, and that is safe: reconcile
  reads the red commit from the convergence record and runs from its checkout, the record is green before C2 (VP 4),
  and every commit after PR 1's merge masks every *_email value. S2 also stays after VP 5 for masking: until the forget
  is applied, a drift cycle or heal dispatch runs a plain terraform plan that renders the pending forget, endpoint
  included (inferred from Terraform's renderer, not checked), and the *_email mask hides that founder value only while
  the parameter's alerts_email still holds it; so no reorder of S2 before VP 5 is safe, and the rollback undoes S2
  before restoring the block for the same reason.
- >-
  Parameter writes are read-modify-write with a version check and keep every other line (neon_org_id included); the
  coordinator serialises them with rec-4048 and any other writer.
- >-
  Expected detector pages (Decision 202 cl.6, never filtered by actor), each evidence, not an incident:
  platform-security-alerts-topic-change on C2's deletion, the first page after the founder's subscription is gone:
  the operator says in row C2 whether it reached the company inbox (evidence the alias alone pages). The page's
  latency is CloudTrail delivery plus the alarm's period, so if the operator has not seen it the agent reads the
  alarm's history and the topic's delivery metrics since T_C2: T_C2=<from build-state.json> bin/venv-python -c "import
  datetime as d, os, boto3; cw = boto3.Session(profile_name='agent_platform_admin',
  region_name=open('config/aws-region').read().strip()).client('cloudwatch'); t =
  d.datetime.fromisoformat(os.environ['T_C2'].replace('Z', '+00:00')); n = d.datetime.now(d.timezone.utc); h =
  cw.describe_alarm_history(AlarmName='platform-security-alerts-topic-change', HistoryItemType='StateUpdate',
  StartDate=t, EndDate=n)['AlarmHistoryItems']; m = lambda x: sum(p['Sum'] for p in
  cw.get_metric_statistics(Namespace='AWS/SNS', MetricName=x, Dimensions=[{'Name': 'TopicName', 'Value':
  'agent-platform-alerts'}], StartTime=t, EndTime=n, Period=60, Statistics=['Sum'])['Datapoints']); print('C2_PAGE',
  {'to_alarm': sum('to ALARM' in x['HistorySummary'] for x in h), 'delivered': m('NumberOfNotificationsDelivered'),
  'failed': m('NumberOfNotificationsFailed')})". No ALARM transition yet: wait for the alarm's next evaluation and re-read
  (a Monitor or send_later wake, never a sleep). An ALARM transition with delivered 0 or failed above 0: the alias did
  not page; stop before S2 and tell the operator at once (the successor is now the only subscriber). The forget itself makes no AWS call. A page outside this
  list is triaged before the next step.
- >-
  No contact address of the founder or the company (role aliases included), account id, ARN, token or link enters the repository, a PR, memory,
  chat or the shared folder (Decision 101): the build reads the role aliases from the session's alias file at run time
  and prints roles and booleans; evidence is kind and UTC time. The build transcript's copy of the aliases is
  PLAN-terraform-company-emails' Decision 224 exception (its constraints; rec-4897).
- >-
  A failed or drifted step halts this workstream until root-caused; never a silent retry; no rescue agents or
  workaround loops (Decision 55). Never apply terraform/personal out of band (rec-3189).
