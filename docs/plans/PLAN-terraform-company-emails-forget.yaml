schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: terraform-company-emails-forget
intent: >-
  Second of three plans moving the founder e-mail values in Terraform to company role aliases. With the company
  successor subscription proven (PLAN-terraform-company-emails), PR 2 forgets the founder's subscription
  aws_sns_topic_subscription.alerts_email with a removed block (destroy = false, since CI may subscribe but never
  unsubscribe), and its saved-plan apply also persists the successor's confirmed state, so no later drift cycle reads
  the confirmation as out-of-band drift. The operator then deletes the founder's subscription in the SNS console, and
  alerts_email in the tfvars parameter takes the company alerts role alias. No contract wording changes.
implementation_declared: true
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-terraform-company-emails-forget.yaml
phase: >-
  user_explicit_out_of_scope (soft-warn exception category) -- the AWS stage of the company ownership move (Decision
  195, Decision 242), the alerts-mailbox item. No tier_item criterion claimed.
closes_criteria: []
scope:
- file: terraform/personal/sns_alerts.tf
  action: Modify
  purpose: >-
    aws_sns_topic_subscription.alerts_email's resource block is replaced by a removed block from that address with
    lifecycle { destroy = false } and the two-line why comment in execution_steps PR 2 (the shape
    terraform/personal/platform_roles.tf already uses). variable "alerts_email" stays declared (the contract table and
    the closing plan's restored resource, whose endpoint is var.alerts_email, need it); the successor block and its transitional comment are untouched.
- file: tests/checks/iam_tf/test_alerts_email_subscription.py
  action: Modify
  purpose: >-
    test_successor_subscription_beside_predecessor is replaced by test_predecessor_forgotten_not_destroyed (the removed
    block parsed with tests/checks/iam_tf/_platform_security_hcl.py's _mask, _block_body and _strip_comments, the
    helpers test_platform_iam_admin_root_only.py's _removed_blocks builds on; never an import of that test module; the
    absence read as the same module's _resource_body(text, 'aws_sns_topic_subscription', 'alerts_email') is None, never
    tests.fixtures.terraform_hcl_blocks.find_resource_block, which raises on a missing block and reads comments): no
    aws_sns_topic_subscription.alerts_email resource block; exactly one removed block from that address, with
    lifecycle destroy = false; the successor block unchanged on aws_sns_topic.alerts, protocol email, endpoint
    var.company_alerts_email, whose variable declares no default; no count, for_each or lifecycle on the successor;
    no at-sign in the file (weakening_dispositions).
- file: docs/plans/PLAN-terraform-company-emails-forget.yaml
  action: Create
  purpose: This plan; PR 2 flips implementation_declared to true.
bundled_recommendations: []
followon_recs:
- rec-4896
weakening_dispositions:
- candidate: "[test-removed] tests/checks/iam_tf/test_alerts_email_subscription.py::test_successor_subscription_beside_predecessor"
  disposition: planned-change
  cite: "acceptance_criteria[0]"
infrastructure_dependencies:
- >-
  Infrastructure Dependencies table (terraform/personal in scope; pipeline mechanics are environment-taxonomy.yaml's,
  not restated). | order | dependency | timing | owner | -- | 1 | PLAN-terraform-company-emails complete (successor
  confirmed and proven to page) | before PR 2 opens | VP 1 | -- | 2 | PR 2's saved plan forgets the predecessor and
  persists the refreshed successor (a forget is no delete, so the guard predicts PASS; the merge-time subagent plan
  review then gates the apply and has likely never seen a forget: constraints) | merge, on
  the operator's word | CI | -- | 3 | C2
  deletes the founder's subscription | after VP 5 and VP 4 pass | operator, SNS console | -- | 4 | S2 sets alerts_email | after
  C2 (main no longer reads alerts_email in any resource) | agent, on the operator's word.
- >-
  Required checks: pr-validate and terraform-validate (terraform/github/repo.tf; Decision 119: no local init, validate
  or plan of terraform/personal, provider-free terraform fmt -check only); the advisory trusted plan job (Decision 83)
  must also pass, since VP 3 reads its comment and the merge applies its saved plan. No scope file
  is under terraform/bootstrap.
- >-
  LAMBDA: compute_affected_artifacts(<this plan's scope>) returns {} -- no scope file is Lambda-packaged (Decision 79).
acceptance_criteria:
- >-
  PR 2's saved plan forgets exactly aws_sns_topic_subscription.alerts_email, guard PASS, nothing else (VP 2, VP 3),
  and its apply persists the confirmed successor in the remote state (VP 5); the convergence record is green after the
  merge (VP 4).
- >-
  The alerts topic's only live e-mail subscription (SNS may list a Deleted row until it purges it) is the company
  alerts role alias, confirmed; the founder's was deleted
  only after PLAN-terraform-company-emails proved the successor pages (VP 1, VP 6).
- >-
  alerts_email in the tfvars parameter equals the company alerts role alias and company_alerts_email; every other
  key is unchanged, and the drift plan stays clean (VP 7, VP 4).
- >-
  EVIDENCE.md records B2, C2 and S2 by kind and UTC time with no e-mail address, AWS account id or ARN (PR numbers,
  merge SHAs and run ids are allowed), and no PR text this plan wrote matches the redaction pattern (VP 8).
verification_plan:
- step: 1
  phase: pre-deploy
  action: >-
    Start gate: the session's alias file is valid; the admin chain works; PLAN-terraform-company-emails is declared on
    origin/main and its evidence rows S1, B1, C1 and P1 read pass; the parameter holds the six baseline keys plus
    company_alerts_email; both subscriptions are confirmed (VP 6 MODE=two_confirmed, run next); Decision 226's
    red-main overlap check is clear.
  command: |-
    bin/venv-python - <<'PY' && bin/venv-python -m scripts.ci_rca.red_overlap --plan docs/plans/PLAN-terraform-company-emails-forget.yaml
    import json, os, re, subprocess, boto3, yaml
    F = os.path.join(os.environ.get('TMPDIR', '/tmp'), 'tf-company-emails', 'aliases.json'); A = json.load(open(F))
    assert sorted(A) == ['alerts', 'operations'] and len(set(A.values())) == 2 and all(v.count('@') == 1 for v in A.values()), 'alias file roles'
    parts = {k: v.split('@') for k, v in A.items()}
    assert parts['alerts'][1] == parts['operations'][1] != 'users.noreply.github.com' and os.stat(F).st_mode & 0o077 == 0, 'alias file domain or mode'
    B = boto3.Session(profile_name='agent_platform_admin', region_name=open('config/aws-region').read().strip())
    from scripts.aws_identity import caller_arn
    assert 'assumed-role/PlatformAdmin/' in caller_arn('agent_platform_admin'), 'admin chain (the proxy re-signs project-region STS calls, so read the real caller)'
    subprocess.run(['git', 'fetch', '-q', 'origin', 'main'], check=True)
    prior = yaml.safe_load(subprocess.run(['git', 'show', 'origin/main:docs/plans/PLAN-terraform-company-emails.yaml'], capture_output=True, text=True, check=True).stdout)
    assert prior['implementation_declared'] is True, 'PLAN-terraform-company-emails not built'
    ev = open('/mnt/project-files/terraform-company-emails/EVIDENCE.md', encoding='utf-8').read()
    assert all(re.search(rf'^\| {r} \|.*\| pass \|$', ev, re.M) for r in ('S1', 'B1', 'C1', 'P1')), 'plan 1 evidence rows'
    t = B.client('ssm').get_parameter(Name='/secret/agent-platform-terraform-personal-tfvars', WithDecryption=True)['Parameter']['Value']
    keys = sorted(re.findall(r'^\s*([a-z_]+)\s*=', t, re.M))
    assert keys == ['account_id', 'alerts_email', 'company_alerts_email', 'neon_org_id', 'owner_email', 'platform_admin_external_id', 'platform_dev_external_id'], keys
    print('START_OK')
    PY
  expected: Prints START_OK, then a JSON line whose verdict is clear (exit 0).
  fix_if: >-
    No alias file: write it (PLAN-terraform-company-emails execution_steps, start). The admin-chain assertion fails:
    stop and ask the coordinator for an ADMIN session (this container's agent_platform_admin chain). Plan 1 not complete: stop; this
    plan starts only after its successor is proven. Another key set: stop and ask the coordinator, who owns the
    parameter's writer order. A blocked or unavailable overlap verdict: hold and tell the coordinator (Decision 226).
  hermetic: false
  graduation: not-applicable
- step: 2
  phase: pre-deploy
  action: >-
    PR 2 subscription shape: the predecessor is forgotten with destroy = false, never destroyed, and the successor is
    unchanged on its no-default *_email variable.
  command: >-
    bin/venv-python -m pytest -q
    tests/checks/iam_tf/test_alerts_email_subscription.py::test_predecessor_forgotten_not_destroyed
  expected: One test passes (exit 0).
  expected_literals:
  - 1 passed
  fix_if: >-
    A failure: the removed block or the successor block is wrong; fix sns_alerts.tf.
  hermetic: true
  graduation: waive
  graduation_waiver_reason: >-
    Transitional by design: PLAN-terraform-company-emails-closing replaces this test and the removed block it checks
    with the standing guard it graduates.
- step: 3
  phase: pre-deploy
  action: >-
    PR 2 open: its trusted plan comment for the PR's current head reads CHANGES with zero counts, no changed output, exactly one row, the forget of
    aws_sns_topic_subscription.alerts_email, no refresh drift outside the chronic classes (aws_iam_role and aws_lambda_function addresses, which every recent trusted comment names: role use and the governed Lambda code deploys; rec-4631) except the successor (its confirmation,
    C1), a PASS guard prediction and a saved plan, and leaks nothing.
  command: |-
    test -n "$PR_NUMBER" && bin/venv-python - <<'PY'
    import json, os, re, sys, urllib.request
    get = lambda p: json.load(urllib.request.urlopen('https://api.github.com/repos/otl-labs/ontheloop/' + p, timeout=30))
    head = get(f"pulls/{os.environ['PR_NUMBER']}")['head']['sha']
    cs = [c['body'] for c in get(f"issues/{os.environ['PR_NUMBER']}/comments?per_page=100") if 'terraform/personal speculative plan (trusted' in c['body'] and f'PR head `{head}`' in c['body']]
    body = cs[-1] if cs else sys.exit('TRUSTED PLAN NOT POSTED for this head yet')
    scan = re.sub(r'\b[0-9a-f]{40,64}\b', '', body)
    leaks = [n for n, x in (('at', r'@[a-z0-9-]+\.[a-z]'), ('12-digit', r'(?<!\d)\d{12}(?!\d)'), ('arn', r'\barn:')) if re.search(x, scan)]
    rows = [r for r in re.findall(r'^\| ([^|]+?) \| ([^|]+?) \|', body, re.M) if r[0] != 'Resource' and not set(r[0]) <= set('-')]
    CHRONIC = ('aws_iam_role.', 'aws_lambda_function.')
    odd = [a for a in re.findall(r'`([^`]+)`', (re.search(r'^Drift detected outside Terraform: (.*)$', body, re.M) or [None, ''])[1]) if not a.startswith(CHRONIC)]
    ok = ('State: CHANGES' in body and '0 to import, 0 to add, 0 to change, 0 to destroy (0 replaced).' in body
          and rows == [('aws_sns_topic_subscription.alerts_email', 'forget')] and set(odd) <= {'aws_sns_topic_subscription.company_alerts_email'}
          and 'Changed outputs:' not in body and 'Predicted guard verdict: PASS' in body and 'This saved plan is applied at merge' in body and not leaks)
    print(json.dumps({'one_forget': bool(ok), 'odd_drift': odd, 'leaks': leaks})); sys.exit(0 if ok else 'TRUSTED PLAN STOP')
    PY
  expected: >-
    One JSON line {"one_forget": true, "odd_drift": [...], "leaks": []} where odd_drift is empty or names only the
    successor.
  fix_if: >-
    NOT POSTED: the trusted plan job has not commented on this head yet; re-run after its wake. Any other row, a
    delete, another address in odd_drift, or BLOCKED: stop; do not merge, and read the plan
    (another change reached main or the live system, which is triaged before this plan continues).
  hermetic: false
  graduation: not-applicable
- step: 4
  phase: post-deploy
  action: >-
    Convergence proof (Decision 190): the apply runs (every terraform-apply-sandbox run for MERGE_SHA, or the one
    heal dispatch APPLY_RUN names) completed with success, and the merge-time review's verdict is printed; the first
    completed terraform-drift run on main created after the later of AFTER (UTC, YYYY-MM-DDTHH:MM:SSZ) and those
    runs' completion succeeded and reads clean or measured converged; the convergence record is green; neither the
    drift log nor the apply logs carry e-mail-shaped text. Run after PR 2's apply (MERGE_SHA) and after S2 (AFTER). A
    terraform-drift dispatch is allowed only once that apply concluded: it reads the infrastructure but writes the
    convergence record and may file a tf_drift rec.
  command: |-
    test -n "$AFTER$MERGE_SHA$APPLY_RUN" && bin/venv-python - <<'PY'
    import json, os, re, sys, urllib.request, boto3
    R = 'https://api.github.com/repos/otl-labs/ontheloop/'
    get = lambda p, raw=False: (lambda r: r.read().decode('utf-8', 'replace') if raw else json.load(r))(urllib.request.urlopen(R + p, timeout=60))
    after = os.environ.get('AFTER', ''); alog = ''
    assert not after or re.fullmatch(r'\d{4}-\d\d-\d\dT\d\d:\d\d:\d\dZ', after), 'AFTER must read YYYY-MM-DDTHH:MM:SSZ'
    if os.environ.get('APPLY_RUN') or os.environ.get('MERGE_SHA'):
        ap = [get('actions/runs/' + os.environ['APPLY_RUN'])] if os.environ.get('APPLY_RUN') else get('actions/workflows/terraform-apply-sandbox.yml/runs?head_sha=' + os.environ['MERGE_SHA'])['workflow_runs']
        assert ap and all(r['status'] == 'completed' for r in ap), 'apply run not completed yet'
        alog = ''.join(get(f"actions/jobs/{j['id']}/logs", raw=True) for r in ap for j in get(f"actions/runs/{r['id']}/jobs")['jobs'] if j['conclusion'] != 'skipped')
        print('REVIEWER', re.findall(r'Reviewer verdict: (\w+)', alog))
        assert all(r['conclusion'] == 'success' for r in ap), [(r['id'], r['conclusion']) for r in ap]
        after = max([after] + [r['updated_at'] for r in ap])
    runs = sorted((r for r in get('actions/workflows/terraform-drift.yml/runs?branch=main&per_page=50')['workflow_runs'] if r['created_at'] > after and r['status'] == 'completed'), key=lambda r: r['created_at'])
    dlog = lambda d: ''.join(get(f"actions/jobs/{j['id']}/logs", raw=True) for j in get(f"actions/runs/{d['id']}/jobs")['jobs'] if j['conclusion'] != 'skipped')
    d, log = next(((d, l) for d, l in ((d, dlog(d)) for d in runs) if not re.search(r'Z (?:##\[notice\]|::notice::)Lock held by an in-flight apply', l)), (None, ''))
    assert d, 'no completed drift cycle after the apply or AFTER yet (lock-skip runs are not cycles)'
    clean = re.search(r'Z Drift check: no changes detected \(exit 0\); cycle is clean\.$', log, re.M) or re.search(r'Z Measured verdict this cycle: converged ', log)
    leak = re.search(r'@[a-z0-9-]+\.[a-z]', log + alog)
    s3 = boto3.Session(profile_name='agent_platform_admin', region_name=open('config/aws-region').read().strip()).client('s3')
    rec = json.loads(s3.get_object(Bucket='agent-platform-data-lake', Key='convergence/personal/sandbox.json')['Body'].read())
    print('DRIFT', d['id'], d['event'], d['conclusion'], 'clean' if clean else 'NOT_CLEAN', 'leak' if leak else 'no_leak', 'record', rec['status'])
    sys.exit(0 if d['conclusion'] == 'success' and clean and not leak and rec['status'] == 'green' else 'DRIFT STOP')
    PY
  expected: >-
    With an apply run selected, prints REVIEWER ['PROCEED']; then DRIFT with the run id, event, success, clean,
    no_leak and record green (exit 0). A drift run that skipped its cycle because the state lock was held is passed
    over, never read as a cycle (the match is anchored after the log timestamp, because every drift log also echoes
    the notice inside its printed run script).
  fix_if: >-
    A failed apply run: REVIEWER names the merge-time review's verdict; the predecessor is still in state, so C2 must
    not run; follow constraints (merge-time reviewer). A cycle that planned another thread's merged change before its
    apply ran (possible once VP 5 releases the hold, and after S2) crashes while rec-4255 is open, or reads
    out_of_band_drift through the chronic drift (rec-4631): tell the coordinator, whose thread it is; wait for that
    apply and its heal, then re-run with AFTER = its completion. Otherwise not clean or red: read the run's measured verdict and stop
    (Decision 55); the only heal is constraints' merge-to-apply gap. Never heal with a guard-routed dispatch, whose plan.bin is a public artifact (rec-4230). A
    leak: stop, tell the coordinator and the operator.
  hermetic: false
  graduation: not-applicable
- step: 5
  phase: post-deploy
  action: >-
    Persisted state and hold release, after PR 2's apply: the apply runs (every terraform-apply-sandbox run for
    MERGE_SHA, or the one heal dispatch APPLY_RUN names) completed with success and the convergence record is green;
    the remote state no longer holds aws_sns_topic_subscription.alerts_email, and its company_alerts_email instance
    records pending_confirmation false (its confirmation_was_authenticated flag is printed for the row). Prints run
    ids, the record status and booleans only. The state also holds the catalog logins (Decision 238 cl.4); the read
    is the ADMIN tier's (cl.1 binds PR, agent and PlatformDev identities); the parsed object is filtered to the
    subscriptions at once, and nothing else is kept or printed.
  command: |-
    test -n "$MERGE_SHA$APPLY_RUN" && bin/venv-python - <<'PY'
    import json, os, urllib.request, boto3
    get = lambda p: json.load(urllib.request.urlopen('https://api.github.com/repos/otl-labs/ontheloop/' + p, timeout=60))
    ap = [get('actions/runs/' + os.environ['APPLY_RUN'])] if os.environ.get('APPLY_RUN') else get('actions/workflows/terraform-apply-sandbox.yml/runs?head_sha=' + os.environ['MERGE_SHA'])['workflow_runs']
    assert ap and all(r['status'] == 'completed' and r['conclusion'] == 'success' for r in ap), [(r['id'], r['status'], r['conclusion']) for r in ap]
    s3 = boto3.Session(profile_name='agent_platform_admin', region_name=open('config/aws-region').read().strip()).client('s3')
    rec = json.loads(s3.get_object(Bucket='agent-platform-data-lake', Key='convergence/personal/sandbox.json')['Body'].read())['status']
    st = [r for r in json.loads(s3.get_object(Bucket='agent-platform-data-lake', Key='tfstate/personal/sandbox/terraform.tfstate')['Body'].read())['resources'] if r.get('mode') == 'managed' and r['type'] == 'aws_sns_topic_subscription']
    subs = {r['name']: r['instances'][0]['attributes'] for r in st}
    got = {'names': sorted(subs), 'successor_pending': subs.get('company_alerts_email', {}).get('pending_confirmation'), 'successor_authenticated': subs.get('company_alerts_email', {}).get('confirmation_was_authenticated')}
    print('STATE', got, 'apply_runs', [r['id'] for r in ap], 'record', rec); assert got['names'] == ['company_alerts_email'] and got['successor_pending'] is False and rec == 'green', got
    PY
  expected: >-
    Prints STATE with names ['company_alerts_email'], successor_pending False and the authenticated flag, the apply
    run ids and record green (exit 0). Only then is the hold released.
  fix_if: >-
    An apply run not completed: wait for it and re-run. An apply run failed: the hold stays; read the run and follow
    constraints (merge-time reviewer); stop. The record not green after a successful apply: a drift cycle landed in
    the gap; the hold stays; follow constraints (merge-to-apply gap), whose heal ends in VP 5 and VP 4 with APPLY_RUN. alerts_email still in state: PR 2's apply did not
    run its forget; read the apply run and follow constraints (merge-time reviewer); stop. successor_pending True: the apply did not
    persist the refresh; stop before C2 and tell the coordinator, since the closing plan's tfvars window depends on it.
  hermetic: false
  graduation: not-applicable
- step: 6
  phase: pre-deploy
  action: >-
    Subscription state, a live read run three times (tagged by its first run, which gates PR 2), by MODE, printing
    roles and states only (confirmed: an ARN; pending; deleted: SNS's Deleted row, unsubscribed and awaiting purge;
    other): two_confirmed (before PR 2 and again before C2: both confirmed,
    the successor's ConfirmationWasAuthenticated printed), successor_only (after C2: the company alerts role alias
    confirmed, and the founder's row gone or deleted).
  command: |-
    test -n "$MODE" && bin/venv-python - <<'PY'
    import json, os, sys, boto3
    A = json.load(open(os.path.join(os.environ.get('TMPDIR', '/tmp'), 'tf-company-emails', 'aliases.json')))
    R = open('config/aws-region').read().strip(); B = boto3.Session(profile_name='agent_platform_admin', region_name=R); sns = B.client('sns')
    topic = f"arn:aws:sns:{R}:{B.client('sts').get_caller_identity()['Account']}:agent-platform-alerts"
    subs = [s for s in sns.list_subscriptions_by_topic(TopicArn=topic)['Subscriptions'] if s['Protocol'] == 'email']
    state = lambda s: 'confirmed' if s['SubscriptionArn'].startswith('arn:') else {'PendingConfirmation': 'pending', 'Deleted': 'deleted'}.get(s['SubscriptionArn'], 'other')
    succ = [s for s in subs if s['Endpoint'] == A['alerts']]; pred = [s for s in subs if s['Endpoint'] != A['alerts']]
    auth = [sns.get_subscription_attributes(SubscriptionArn=s['SubscriptionArn'])['Attributes'].get('ConfirmationWasAuthenticated') for s in succ if state(s) == 'confirmed']
    got = {'successor': [state(s) for s in succ], 'predecessor': [state(s) for s in pred], 'successor_authenticated': auth}
    want = {'two_confirmed': [(['confirmed'], ['confirmed'])], 'successor_only': [(['confirmed'], []), (['confirmed'], ['deleted'])]}[os.environ['MODE']]
    auth_ok = os.environ['MODE'] != 'two_confirmed' or auth == ['true'] or os.environ.get('C1_FALLBACK') == '1'
    print('SUBS', os.environ['MODE'], got, 'fallback' if os.environ.get('C1_FALLBACK') == '1' else '')
    sys.exit(0 if (got['successor'], got['predecessor']) in want and auth_ok else 'SUBSCRIPTION STOP')
    PY
  expected: >-
    Prints SUBS with the mode and the per-role states and exits 0; two_confirmed exits 0 only when
    successor_authenticated reads ['true'], or with C1_FALLBACK=1 set when PLAN-terraform-company-emails row C1
    records the fallback.
  fix_if: >-
    two_confirmed with either side missing, deleted or other: the live system changed since plan 1 (a deleted founder
    row means someone unsubscribed it); stop. successor_only with the founder's row still confirmed: C2 deleted no
    row; repeat C2 (a deleted founder row is C2 done; SNS purges it later). The company row gone or deleted: paging has
    no subscriber; tell the operator at once, who re-subscribes the company alias in the console and confirms it as C1
    did, then stop and re-plan.
  hermetic: false
  graduation: not-applicable
- step: 7
  phase: post-deploy
  action: >-
    After S2: the version advanced by one; alerts_email equals the company alerts role alias and company_alerts_email;
    every other line is unchanged. Prints no value.
  command: |-
    bin/venv-python - <<'PY'
    import json, os, re, boto3
    A = json.load(open(os.path.join(os.environ.get('TMPDIR', '/tmp'), 'tf-company-emails', 'aliases.json')))
    N = '/secret/agent-platform-terraform-personal-tfvars'; s = json.load(open('/mnt/project-files/terraform-company-emails/build-state.json'))
    ssm = boto3.Session(profile_name='agent_platform_admin', region_name=open('config/aws-region').read().strip()).client('ssm')
    kv = lambda t: dict(re.findall(r'^\s*([a-z_]+)\s*=\s*"?([^"\n]*)"?\s*$', t, re.M))
    p = ssm.get_parameter(Name=N, WithDecryption=True)['Parameter']; new = kv(p['Value'])
    old = kv(ssm.get_parameter(Name=f"{N}:{s['v_s2_before']}", WithDecryption=True)['Parameter']['Value'])
    assert p['Version'] == s['v_s2_before'] + 1, ('another writer touched the parameter', p['Version'])
    assert set(new) == set(old), 'key set'
    assert new['alerts_email'] == new['company_alerts_email'] == A['alerts'], 'alerts values'
    assert all(new[k] == old[k] for k in new if k != 'alerts_email'), 'other lines changed'
    print('S2_OK version', p['Version'])
    PY
  expected: Prints S2_OK with the new version number.
  fix_if: >-
    Another version number: someone else wrote the parameter; stop, restore nothing and tell the coordinator, who owns
    the writer order. A wrong value at the expected version: stop and run the S2 rollback on the operator's word.
  hermetic: false
  graduation: not-applicable
- step: 8
  phase: post-deploy
  action: >-
    Evidence: EVIDENCE.md carries rows B2, C2 and S2 as pass, and neither it nor PR 2's body or comments match the
    redaction pattern.
  command: |-
    test -n "$PR_NUMBER" && bin/venv-python - <<'PY'
    import json, os, re, urllib.request
    ev = open('/mnt/project-files/terraform-company-emails/EVIDENCE.md', encoding='utf-8').read()
    REDACT = r'@|(?<![0-9])[0-9]{12}(?![0-9])|\barn:|[A-Za-z0-9_]{50,}'
    rows = ['B2', 'C2', 'S2']
    assert all(re.search(rf'^\| {r} \|.*\| pass \|$', ev, re.M) for r in rows), [r for r in rows if not re.search(rf'^\| {r} \|.*\| pass \|$', ev, re.M)]
    get = lambda p: json.load(urllib.request.urlopen('https://api.github.com/repos/otl-labs/ontheloop/' + p, timeout=30))
    n = os.environ['PR_NUMBER']
    texts = [ev, get(f'pulls/{n}')['body'] or ''] + [c['body'] for c in get(f'issues/{n}/comments?per_page=100') if 'terraform/personal speculative plan' not in c['body']]
    hits = [i for i, t in enumerate(texts) if re.search(REDACT, re.sub(r'\b[0-9a-f]{40,64}\b|\bcmsg_[A-Za-z0-9]+|(?<![\w.])@[A-Za-z0-9-]+(?![\w.@-])', '', t))]
    print('EVIDENCE', len(rows), 'rows pass; redaction hits', hits); assert not hits
    PY
  expected: Prints EVIDENCE 3 rows pass and redaction hits [] (exit 0).
  fix_if: >-
    A hit: edit the text out of the PR body or comment at once and tell the operator (Decision 101); a missing row:
    the step was skipped, stop.
  hermetic: false
  graduation: not-applicable
