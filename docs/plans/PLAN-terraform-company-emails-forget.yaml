ith MERGE_SHA; tell the coordinator the hold is released; then VP 4 with MERGE_SHA and no AFTER (the step takes the apply's completion time). Row B2 (PR number, merge SHA, the merge word's message id, workflow run ids; never job ids or job URLs, whose 12 digits trip VP 8's account-id clause). Report readiness, validator verdicts, postflight evidence, review and the real push and PR outcome separately (implement skill, Commit Flows).
