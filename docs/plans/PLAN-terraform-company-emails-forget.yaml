  V=<v_s2_before> python3 - <<'PY'
  import datetime as dt, getpass, json, os, re, subprocess, sys, urllib.request
  R = urllib.request.urlopen('https://raw.githubusercontent.com/otl-labs/ontheloop/main/config/aws-region', timeout=30).read().decode().strip()
  def aws(*a):
      p = subprocess.run(['aws', *a, '--region', R, '--output', 'json'], capture_output=True, text=True)
      if p.returncode: sys.exit('AWS_ERROR ' + ' '.join(a[:2]))
      return json.loads(p.stdout or 'null')
  if subprocess.run(['aws', 'configure', 'get', 'cli_history'], capture_output=True, text=True).stdout.strip() == 'enabled': sys.exit('CLI_HISTORY_ON')
  if not aws('sts', 'get-caller-identity')['Arn'].endswith(':user/platform-breakglass'): sys.exit('ADMIN_CHAIN_ABSENT')
  N = '/secret/agent-platform-terraform-personal-tfvars'; kv = lambda t: dict(re.findall(r'^\s*([a-z_]+)\s*=\s*"?([^"\n]*)"?\s*$', t, re.M))
  par = lambda v=None: aws('ssm', 'get-parameter', '--name', N if v is None else '%s:%s' % (N, v), '--with-decryption')['Parameter']
  p = par(); t = p['Value']; old = kv(t)
  if p['Version'] != int(os.environ['V']): sys.exit('PARAMETER_CHANGED_SINCE_V %s' % p['Version'])
  if sorted(old) != ['account_id', 'alerts_email', 'company_alerts_email', 'neon_org_id', 'owner_email', 'platform_admin_external_id', 'platform_dev_external_id']: sys.exit('KEYSET_CHANGED ' + ' '.join(sorted(old)))
  if old['alerts_email'] == old['company_alerts_email']: sys.exit('S2_ALREADY_DONE version %s' % p['Version'])
  m = re.search(r'^[ \t]*alerts_email[ \t]*=.*$', t, re.M); new = t[:m.start()] + 'alerts_email = "' + old['company_alerts_email'] + '"' + t[m.end():]
  if aws('ssm', 'get-parameter', '--name', N)['Parameter']['Version'] != p['Version']: sys.exit('PARAMETER_CHANGED_SINCE_READ')
  v = aws('ssm', 'put-parameter', '--name', N, '--value', new, '--type', 'SecureString', '--overwrite')['Version']
  print('S2_WRITTEN', p['Version'], '->', v, 't_s2', dt.datetime.now(dt.timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ'))
  PY
  S2_WRITTEN prints the two versions and t_s2 (UTC); record v_s2_after and t_s2 in build-state.json. S2_ALREADY_DONE: an earlier paste wrote it, so nothing is written; VP 7 with FROM one below the printed version proves it. PARAMETER_CHANGED_SINCE_V, KEYSET_CHANGED or PARAMETER_CHANGED_SINCE_READ: another writer moved the parameter; nothing was written; stop and tell the coordinator, who owns the writer order. Then VP 4 with AFTER = t_s2 (main reads alerts_email in no resource, so the plan is unchanged), row S2.
