acceptance_criteria:
- >-
  Every *_email tfvars value is masked in the drift, dispatch, reconcile and trusted plan logs, and the trusted PR
  comment's assert-clean covers alerts_email (VP 4); rec-3975 is closed (VP 21).
- >-
  The alerts topic's only e-mail subscription is the company alerts role alias at
  aws_sns_topic_subscription.alerts_email, confirmed with authenticated unsubscribe, and an alarm page reached it
  while the predecessor still existed (VP 9, 10); the founder's mailbox subscription is deleted (VP 9).
- >-
  The Owner tag is the company operations role alias on every Owner-tagged resource in both roots (VP 14, 15), with
  the convergence record green and the drift plan clean after each terraform/personal change (VP 8).
- >-
  The tfvars parameter holds exactly its six keys again, with company values for owner_email and alerts_email and
  every other value unchanged (VP 20).
- >-
  PR 1's contract and sns_alerts.tf wording equals the approved sidecar (VP 6, validate_merge_step), and PR 3's
  contract, inventory and sns_alerts.tf texts equal APPROVED CLOSING TEXT (VP 17, 18); AWS-07, AWS-10 and AWS-11 are
  proven with owner company; rec-3904 and rec-3950 are closed (VP 21).
- >-
  EVIDENCE.md records every step by kind and UTC time with no address, id or ARN, including O1's answer (VP 22).
verification_plan:
- step: 1
  phase: pre-deploy
  action: >-
    Start gate: the admin chain works, the three inventory rows still read personal on origin/main, the tfvars
    parameter already carries neon_org_id (the Neon build's T1 is done) and none of this plan's keys, and Decision
    226's red-main overlap check is clear.
  command: >-
    bin/venv-python -m scripts.aws_identity caller-arn --profile agent_platform_admin 2>/dev/null | grep -q
    'assumed-role/PlatformAdmin/' && echo ADMIN_CHAIN_OK && git fetch -q origin main && git show
    origin/main:docs/contracts/account-credential-inventory.yaml | bin/venv-python -c "import sys,yaml;
    r={x['id']:x['status'] for x in yaml.safe_load(sys.stdin)['rows']}; assert all(r[k]=='personal' for k in
    ('AWS-07','AWS-10','AWS-11')), r; print('ROWS_OK')" && aws ssm get-parameter --name
    /secret/agent-platform-terraform-personal-tfvars --with-decryption --profile agent_platform_admin --query
    Parameter.Value --output text | bin/venv-python -c "import re,sys;
    k=sorted(re.findall(r'^\s*([a-z_]+)\s*=', sys.stdin.read(), re.M)); assert k==sorted(['account_id','alerts_email','neon_org_id','owner_email','platform_admin_external_id','platform_dev_external_id']),
    k; print('KEYS_OK')" && bin/venv-python -m scripts.ci_rca.red_overlap --plan docs/plans/PLAN-terraform-company-emails.yaml
  expected: Prints ADMIN_CHAIN_OK, ROWS_OK and KEYS_OK, then a JSON line whose verdict is clear (exit 0).
  fix_if: >-
    No ADMIN_CHAIN_OK: this session lacks the admin tier every live step needs; stop and ask the coordinator for an
    ADMIN session. A row already moved, or another key set (rec-4048 retired the ExternalIds, or another writer added
    a key): stop and ask the coordinator, who owns the parameter's writer order. A blocked or unavailable overlap
    verdict: hold and tell the coordinator (Decision 226).
  hermetic: false
  graduation: not-applicable
- step: 2
  phase: pre-deploy
  action: >-
    Baseline, written once: build-state.json in the project folder gets t0 and the parameter version, EVIDENCE.md
    gets its header, and the live starting point is read without printing a value: owner_email has the GitHub
    no-reply shape and equals the Owner tag on the data-lake bucket, the alerts topic and the CI apply role;
    alerts_email is off the company domain; the topic has exactly one e-mail subscription, confirmed, on
    alerts_email. A re-run keeps the stored baseline.
  command: |-
    bin/venv-python - <<'PY'
    import datetime as dt, json, os, re, boto3
    D = '/mnt/project-files/terraform-company-emails/'; S, E = D + 'build-state.json', D + 'EVIDENCE.md'
    N = '/secret/agent-platform-terraform-personal-tfvars'
    B = boto3.Session(profile_name='agent_platform_admin', region_name='eu-west-2'); ssm = B.client('ssm')
    p = ssm.get_parameter(Name=N, WithDecryption=True)['Parameter']
    kv = dict(re.findall(r'^\s*([a-z_]+)\s*=\s*"?([^"\n]*)"?\s*$', p['Value'], re.M))
    acct = B.client('sts').get_caller_identity()['Account']; topic = f'arn:aws:sns:eu-west-2:{acct}:agent-platform-alerts'
    tag = lambda tags: {t.get('Key'): t.get('Value') for t in tags}.get('Owner')
    owners = [tag(B.client('s3').get_bucket_tagging(Bucket='agent-platform-data-lake')['TagSet']),
              tag(B.client('sns').list_tags_for_resource(ResourceArn=topic)['Tags']),
              tag(B.client('iam').list_role_tags(RoleName='agent-platform-github-ci-apply')['Tags'])]
    subs = [s for s in B.client('sns').list_subscriptions_by_topic(TopicArn=topic)['Subscriptions'] if s['Protocol'] == 'email']
    facts = {'owner_noreply_shape': kv['owner_email'].endswith('@users.noreply.github.com'), 'owner_tags_equal': owners == [kv['owner_email']] * 3,
             'alerts_off_company_domain': not kv['alerts_email'].endswith('@otl-labs.com'),
             'one_confirmed_sub_on_alerts_email': len(subs) == 1 and subs[0]['SubscriptionArn'] != 'PendingConfirmation' and subs[0]['Endpoint'] == kv['alerts_email']}
    assert all(facts.values()), facts
    if os.path.exists(S):
        s = json.load(open(S)); print('BASELINE_KEPT', s['t0'], s['tfvars_version_before']); raise SystemExit(0)
    s = {'t0': dt.datetime.now(dt.timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ'), 'tfvars_version_before': p['Version']}
    json.dump(s, open(S, 'w'), indent=1)
    if not os.path.exists(E):
        open(E, 'w', encoding='utf-8').write('# Terraform company e-mails evidence (kinds and UTC times only)\n\n| step | what | UTC time | evidence kind | result |\n|---|---|---|---|---|\n')
    print('BASELINE', s['t0'], s['tfvars_version_before'], facts)
    PY
  expected: Prints BASELINE with t0, the version number and four true facts, or BASELINE_KEPT on a re-run.
  fix_if: >-
    A false fact: the live system is not where this plan starts (another change, or the subscription moved by hand);
    stop and tell the coordinator before any write.
  hermetic: false
  graduation: not-applicable
- step: 3
  phase: pre-deploy
  action: >-
    After S1: the parameter version advanced by exactly one, it holds the six baseline keys plus company_alerts_email,
    that key equals the company alerts role alias, and every other line is unchanged. Prints no value.
  command: |-
    bin/venv-python - <<'PY'
    import json, re, boto3
    N = '/secret/agent-platform-terraform-personal-tfvars'; S = '/mnt/project-files/terraform-company-emails/build-state.json'
    ssm = boto3.Session(profile_name='agent_platform_admin', region_name='eu-west-2').client('ssm'); s = json.load(open(S))
    kv = lambda t: dict(re.findall(r'^\s*([a-z_]+)\s*=\s*"?([^"\n]*)"?\s*$', t, re.M))
    p = ssm.get_parameter(Name=N, WithDecryption=True)['Parameter']; new = kv(p['Value'])
    old = kv(ssm.get_parameter(Name=f"{N}:{s['tfvars_version_before']}", WithDecryption=True)['Parameter']['Value'])
    assert p['Version'] == s['tfvars_version_before'] + 1, ('another writer touched the parameter', p['Version'])
    assert set(new) == set(old) | {'company_alerts_email'} and all(new[k] == old[k] for k in old), 'other lines changed'
    assert new['company_alerts_email'] == '@'.join(('alerts', 'otl-labs.com')), 'not the company alerts role alias'
    print('S1_OK version', p['Version'])
    PY
  expected: Prints S1_OK with the new version number (tfvars_version_before + 1).
  fix_if: >-
    Another version number: someone else wrote the parameter; stop, restore nothing, tell the coordinator. A wrong
    value: run the S1 rollback on the operator's word.
  hermetic: false
  graduation: not-applicable
- step: 4
  phase: pre-deploy
  action: >-
    PR 1 masking and scrub tests: every *_email tfvars value is masked by materialise_tfvars.sh in both modes under
    the literal composite argv, redaction_check scrubs and asserts on the alerts value, and trusted_plan_env exports
    _ALERTS.
  command: >-
    bin/venv-python -m pytest -q
    tests/test_materialise_tfvars_delegate.py::test_masks_every_email_value
    tests/test_redaction_check.py::test_alerts_email_is_scrubbed
    tests/test_trusted_plan_env.py::test_exports_alerts_scrub_variable
  expected: Three tests pass (exit 0).
  expected_literals:
  - 3 passed
  fix_if: >-
    A failing test: fix the script on the branch, never the test's placeholder values; a test that passes before the
