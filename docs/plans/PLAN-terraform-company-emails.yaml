  command: >-
    bin/venv-python -c "from scripts.checks.contracts.validate_terraform_cc_web_operations import
    validate_terraform_cc_web_operations as v; f=[]; v(f); assert not f, f; print('CONTRACT_OK')" && git fetch -q
    origin main && bin/venv-python -m scripts.roadmap.approved_text verify --slug terraform-company-emails --base
