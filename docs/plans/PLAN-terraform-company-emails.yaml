    "account_id | platform_dev_external_id | platform_admin_external_id | *_email)"), so the drift job, the dispatch
    fresh plan and reconcile never print an e-mail value; the header gains one sentence naming the *_email arm. No
    other behaviour changes.
- file: scripts/ci/redaction_check.py
  action: Modify
  purpose: >-
    PR 1 (rec-3975): _SCRUB_SPECS gains ("_ALERTS", "[ALERTS_EMAIL]") and _placeholder_label returns "[ALERTS_EMAIL]"
    for index 4 (a string literal, as the CodeQL note requires); the module docstring names alerts_email beside
    owner_email.
- file: scripts/ci/trusted_plan_env.sh
  action: Modify
  purpose: >-
    PR 1 (rec-3975): exports _ALERTS from the alerts_email tfvars key beside _OWNER; the header names five scrub
    variables. The *_email ::add-mask:: arm is unchanged.
