constraints:
- >-
  Approved texts are verbatim: the sidecar (PR 1) and APPROVED CLOSING TEXT (PR 3); context gives the approval.
  Allowed variance: dates, PR numbers, workflow run ids and parameter version numbers. Any other wording change,
  including one critique or code review asks for, goes to the coordinator, then the operator, before merge.
- >-
  Live acts and who runs them. Agent, each only after the operator's typed word on the exact command in the build
  thread, one word per mutation (Decision 237 cl.3 read as the Neon T1 precedent, PLAN-neon-org-company-assignment):
  the SSM writes S1, S2, S4 and S5, a rollback restore, the A1 bootstrap apply, and re-running PR 2's trusted plan.
  Operator, in the AWS console or CloudShell under their own sign-in: C1 confirmation, P1 alarm state, the
  tf-gated-apply approval of PR 2, C2 deletion and O1. PlatformAdmin is denied sns:ConfirmSubscription,
  sns:Unsubscribe, sns:Publish and cloudwatch:SetAlarmState (iam simulate, 2026-11-04), so none of these can be an
  agent step; Decision 223 cl.4's admin split-apply cannot run the Unsubscribe for the same reason (no resource type
  in SNS's IAM model, github_ci_apply_policy.tf), so C2 is the operator's console act, proven by VP 9.
- >-
  Order is fixed: VP 1, VP 2, O1, S1, PR 1, C1, P1, S2, PR 2, A1, C2, S4, PR 3, S5. Successor first: nothing old is
  removed before VP 9 two_confirmed and VP 10 pass; PR 2 (forget) merges only after P1; C2 runs only after VP 14.
- >-
  Registry shards kept: trusted-plan-env (node id tests/test_trusted_plan_env.py) keeps selecting the whole file, so
  PR 1's added test joins it with no shard edit.
- >-
  Unbuilt plans sharing scope files (plan_obligations, 2026-11-04): account-id-out-of-session-output,
  neon-key-out-of-pr-plans, retire-github-pat-secret, secrets-to-ssm-retire and trusted-plan-cutover. Whichever
  builds second rebases onto the first and re-runs this plan's VP 4 to VP 6.
- >-
  red_overlap at planning (2026-11-04): blocked on repair SLO only (rec-4872, rec-4888, rec-4890; no shared files).
  VP 1 re-runs it at the build's start; the plan PR merges only after the operator answers the unrelated-CI card.
- >-
  S2 window. S2 creates a tfvars-only diff on main until PR 2's saved plan applies. Decision 190 measures it as
  pending_codification (no red) and escalates to red after 2 hours, including while the gated apply waits (rec-4050);
  while rec-4255 is open an exit-2 drift cycle crashes instead (no record change). So: PR 2 is open and green before
  S2; S2 runs only when the operator can approve tf-gated-apply within the hour; the agent then re-runs PR 2's
  terraform-plan-trusted run (a re-run, never an empty commit), checks VP 12 and merges. If the record turns red
  before PR 2's push run, its precondition refuses: restore owner_email (S2 rollback), heal with the
  acknowledge-and-retry dispatch, whose fresh plan then holds only the forget (guard PASS, no route, no artifact),
  and carry the Owner change on PR 3 instead (S2 repeated before PR 3's plan). Never heal with a guard-routed
  dispatch or reconcile route (ii): both upload plan.bin, which embeds every tfvars value, as a public artifact
  (rec-4230). If the drift red lands during the approval wait, the gated apply still applies and the drift guard
  refuses the green write; the heal is the same empty acknowledge-and-retry (main's plan is then a no-op).
- >-
  Masking order: PR 1 merges before S2 and S4, so no drift, dispatch or reconcile log prints an owner or alerts
  value. S2 adds previous_owner_email (the founder's no-reply value) so the *_email mask also hides the prior value
  every Owner diff prints until PR 2 applies; S4 removes it. The personal mailbox value is a current tfvars value
  (masked) until S4, and no state holds it after PR 2's forget.
- >-
  Parameter writes are read-modify-write with a version check and keep every other line (neon_org_id included); the
  coordinator serialises them with rec-4048 and any other writer. A rec-4048 build that lands first changes the
  bootstrap key list in VP 15 and the baseline key set; stop and re-plan the affected commands through /plan.
- >-
  Expected detector pages (Decision 202 cl.5, never filtered by actor), each evidence, not an incident:
  platform-security-alerts-topic-change on PR 1's Subscribe, C1's confirmation, PR 2's topic tag write and C2's
  deletion; platform-security-platform-role-iam-change (and platform-security-detector-tamper if its filter covers
  tag writes) on A1; the smoke alarm's ALARM and OK mails in P1. A page outside this list is triaged before the next
  step.
- >-
  No e-mail address (company aliases included), account id, ARN, token or confirmation link enters the repository,
  a PR, memory, chat or the shared folder (Decision 101): commands compose role aliases at run time and print roles
  and booleans; evidence is kind and UTC time; screenshots are checked in the thread and never saved.
- >-
  A failed or drifted step halts this workstream until root-caused; never a silent retry; no rescue agents or
  workaround loops (Decision 55). Never apply terraform/personal out of band (rec-3189).
