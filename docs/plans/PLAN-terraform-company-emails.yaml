- step: 7
  phase: pre-deploy
  action: >-
    PR 1 open: its trusted plan comment (Decision 238) reads CHANGES with exactly one create, the successor
    subscription, a PASS guard prediction and a saved plan, and leaks nothing.
  command: |-
    test -n "$PR_NUMBER" && bin/venv-python - <<'PY'
    import json, os, re, sys, urllib.request
    get = lambda p: json.load(urllib.request.urlopen('https://api.github.com/repos/otl-labs/ontheloop/' + p, timeout=30))
    body = [c['body'] for c in get(f"issues/{os.environ['PR_NUMBER']}/comments?per_page=100") if 'terraform/personal speculative plan (trusted' in c['body']][-1]
    scan = re.sub(r'\b[0-9a-f]{40,64}\b', '', body)
    leaks = [n for n, x in (('at', r'@[a-z0-9-]+\.[a-z]'), ('12-digit', r'(?<!\d)\d{12}(?!\d)'), ('arn', r'\barn:')) if re.search(x, scan)]
    rows = re.findall(r'^\| ([^|]+?) \| ([^|]+?) \|', body, re.M)[1:]
    ok = ('State: CHANGES' in body and '0 to import, 1 to add, 0 to change, 0 to destroy (0 replaced).' in body
          and [r for r in rows if r[0] != 'Resource' and not set(r[0]) <= set('-')] == [('aws_sns_topic_subscription.company_alerts_email', 'create')]
          and 'Predicted guard verdict: PASS' in body and 'This saved plan is applied at merge' in body and not leaks)
    print(json.dumps({'one_create': bool(ok), 'leaks': leaks})); sys.exit(0 if ok else 'TRUSTED PLAN STOP')
    PY
  expected: >-
    One JSON line {"one_create": true, "leaks": []}.
  fix_if: >-
    Any other change or a refusal category: stop; do not merge. A missing value error means S1 has not run or the
    key is misspelt.
  hermetic: false
  graduation: not-applicable
- step: 8
  phase: post-deploy
  action: >-
    Convergence proof (Decision 190): with MERGE_SHA set, every terraform-apply-sandbox run for that commit succeeded
    (for PR 2 that includes the approved gated-apply job); the first completed terraform-drift run on main created
    after AFTER succeeded and reads clean or measured converged; the convergence record is green. Run after each
    PR's merge and after S4 and S5 (dispatching terraform-drift.yml is allowed: a read-only plan).
  command: |-
    test -n "$AFTER" && bin/venv-python - <<'PY'
    import json, os, re, sys, urllib.request, boto3
    R = 'https://api.github.com/repos/otl-labs/ontheloop/'
    get = lambda p, raw=False: (lambda r: r.read().decode('utf-8', 'replace') if raw else json.load(r))(urllib.request.urlopen(R + p, timeout=60))
    if os.environ.get('MERGE_SHA'):
        ap = get('actions/workflows/terraform-apply-sandbox.yml/runs?head_sha=' + os.environ['MERGE_SHA'])['workflow_runs']
        assert ap and all(r['conclusion'] == 'success' for r in ap), [(r['id'], r['conclusion']) for r in ap]
    runs = sorted((r for r in get('actions/workflows/terraform-drift.yml/runs?branch=main&per_page=50')['workflow_runs'] if r['created_at'] > os.environ['AFTER'] and r['status'] == 'completed'), key=lambda r: r['created_at'])
    assert runs, 'no completed drift run after AFTER yet'
    d = runs[0]; log = ''.join(get(f"actions/jobs/{j['id']}/logs", raw=True) for j in get(f"actions/runs/{d['id']}/jobs")['jobs'])
    clean = re.search(r'Z Drift check: no changes detected \(exit 0\); cycle is clean\.$', log, re.M) or re.search(r'Z Measured verdict this cycle: converged ', log)
    leak = re.search(r'@[a-z0-9-]+\.[a-z]', log)
    rec = json.loads(boto3.Session(profile_name='agent_platform_admin', region_name='eu-west-2').client('s3').get_object(Bucket='agent-platform-data-lake', Key='convergence/personal/sandbox.json')['Body'].read())
    print('DRIFT', d['id'], d['event'], d['conclusion'], 'clean' if clean else 'NOT_CLEAN', 'leak' if leak else 'no_leak', 'record', rec['status'])
    sys.exit(0 if d['conclusion'] == 'success' and clean and not leak and rec['status'] == 'green' else 'DRIFT STOP')
    PY
  expected: Prints DRIFT with the run id, event, success, clean, no_leak and record green (exit 0).
  fix_if: >-
    Not clean or red: read the run's measured verdict and stop (Decision 55). Never heal with a guard-routed dispatch,
    whose plan.bin is a public artifact (rec-4230); constraints name the only heals. A leak: an unmasked value reached
    a public log; stop, tell the coordinator and the operator, and do not continue to the next step.
  hermetic: false
  graduation: not-applicable
- step: 9
  phase: post-deploy
  action: >-
    Subscription state, by MODE, printing roles only: pending_successor (after PR 1's apply: the predecessor
    confirmed, the successor on the company alerts role alias pending), two_confirmed (after C1: both confirmed, the
    successor's ConfirmationWasAuthenticated read and printed), successor_only (after C2: exactly one e-mail
    subscription, the company alerts role alias, confirmed).
  command: |-
    test -n "$MODE" && bin/venv-python - <<'PY'
    import os, sys, boto3
    B = boto3.Session(profile_name='agent_platform_admin', region_name='eu-west-2'); sns = B.client('sns')
    topic = f"arn:aws:sns:eu-west-2:{B.client('sts').get_caller_identity()['Account']}:agent-platform-alerts"
    company = '@'.join(('alerts', 'otl-labs.com'))
