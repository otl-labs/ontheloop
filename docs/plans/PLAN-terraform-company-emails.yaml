  | before PR 1 opens: PR 1 declares the variable with no default, and main ignores an undeclared tfvars key (a
  warning that names the key only) | agent, on the operator's word | -- | 2 | PR 1 trusted plan creates the successor
  subscription (sns:Subscribe is granted to the apply role, Decision 143) | merge, guard PASS | CI | -- | 3 | S2 sets
  owner_email and the transitional previous_owner_email | after PR 1's masking is on main and PR 2 is open and green |
  agent, on the operator's word | -- | 4 | PR 2's saved plan (tag updates and one forget) routes to tf-gated-apply at
  merge (aws_iam_role and aws_iam_openid_connect_provider tag updates are out of budget) | merge, operator approval
  in the Environment | CI and operator | -- | 5 | bootstrap Owner tags | after PR 2's apply | human-directed admin
  apply (Decision 126) | -- | 6 | PR 3's saved plan moves the successor to the pinned address (no change) | after S4
  | CI.
