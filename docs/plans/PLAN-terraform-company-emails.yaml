schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: terraform-company-emails
intent: >-
  Move the two founder e-mail values the Terraform roots still carry to company role aliases on the company domain:
  the provider default_tags Owner value (owner_email, today the founder's GitHub no-reply identity) becomes the
  operations role alias in terraform/personal and terraform/bootstrap, and the agent-platform-alerts SNS e-mail
  subscription moves from the founder's personal mailbox to the alerts role alias make-before-break: a successor
  subscription is created through CI, confirmed with authenticated unsubscribe and proven to receive a page before
  the predecessor is forgotten, deleted by the operator and the successor moved back to the pinned address. Every
  *_email tfvars value is masked in every CI log first (rec-3975).
implementation_declared: false
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-terraform-company-emails.yaml
phase: >-
  user_explicit_out_of_scope (soft-warn exception category) -- the AWS stage of the company ownership move (Decision
  195, Decision 242), the queue item "personal terraform variables to company values" plus the alerts-mailbox item.
  No tier_item criterion claimed.
closes_criteria: []
