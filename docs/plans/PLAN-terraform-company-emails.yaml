execution_steps:
- |-
  Start gate (VP 1). Read docs/PROJECT_CONTEXT.md, this plan and /mnt/project-files/terraform-company-emails/HANDOFF-implementation.md (written when this plan merged; if absent, ask the coordinator). Conventions for every live step: present the exact step or command and its expected result in the thread; for an operator step wait for the operator's typed word that it is done, for an agent mutation wait for the operator's typed word on that exact command, one word per mutation; then verify with the VP step named and append one row to /mnt/project-files/terraform-company-emails/EVIDENCE.md: | step | what | UTC time as YYYY-MM-DDTHH:MMZ | evidence kind | pass |. Record every time and version the VP steps read (t_*, v_*_before, run ids) in build-state.json. Then run VP 2 (baseline, once).
- |-
  O1, billing notifications (operator, read-only, any time before PR 3): in the AWS console open Billing and Cost Management > Budgets (each budget's alert recipients), Cost Anomaly Detection > Alert subscriptions (recipients) and AWS User Notifications > Delivery channels (e-mail contacts). Say in the thread, without any address, how many recipients each holds and whether any is off the company domain. Expected: none, or only company role aliases. If one is personal, the operator replaces it with the billing role alias in the console, and the agent files a rec (get_rec_write_guidance, then file_rec) to bring that resource under Terraform (a console-created resource is drift, AGENTS.md). Row O1.
- |-
  S1, successor key (agent, on the operator's word on this command). Record v_s1_before = the current version, present the command, wait for the word, run it, then VP 3, row S1:
  bin/venv-python - <<'PY'
  import re, boto3
  N = '/secret/agent-platform-terraform-personal-tfvars'
  ssm = boto3.Session(profile_name='agent_platform_admin', region_name='eu-west-2').client('ssm')
  p = ssm.get_parameter(Name=N, WithDecryption=True)['Parameter']
  assert not re.search(r'^\s*company_alerts_email\s*=', p['Value'], re.M), 'key already present'
  assert ssm.get_parameter(Name=N)['Parameter']['Version'] == p['Version'], 'parameter changed since read'
  v = ssm.put_parameter(Name=N, Value=p['Value'].rstrip('\n') + '\ncompany_alerts_email = "' + '@'.join(('alerts', 'otl-labs.com')) + '"\n', Type='SecureString', Overwrite=True)['Version']
  print('TFVARS_WRITTEN', p['Version'], '->', v)
  PY
  Expected: TFVARS_WRITTEN with the old and new version numbers; nothing changes in Terraform (main does not declare the key).
- |-
  PR 1 (declares this plan). Apply the scope edits for PR 1: the masking arm in both loops of materialise_tfvars.sh, the _ALERTS spec, label and docstring in redaction_check.py, the _ALERTS export and header in trusted_plan_env.sh, the three new tests, the new test module with test_successor_subscription_beside_predecessor, and the sidecar docs/plans/approved/terraform-company-emails.yaml verbatim in terraform-cc-web-operations.yaml and sns_alerts.tf (amendment_log date = the commit date). Flip implementation_declared to true. Graduate VP 4 through the implement skill's graduation flow (registry row config/agent/verification_registry/entries/terraform-email-tfvars-masking.yaml, slot test_selector, guard_target .github/actions/materialise-tfvars/materialise_tfvars.sh). Run VP 4, VP 5, VP 6, terraform fmt -check terraform/personal (provider-free; Decision 119), bin/venv-python -m scripts.validate --pre, VP 23 and code review. Open the PR titled 'feat(terraform-company-emails): mask every e-mail tfvars value and add the company alerts subscription' with 'Resolves: rec-3975' in the implementation commit and the squash body. Run VP 7 on its trusted plan comment. Squash-merge on code-review PROCEED, VP 7 and green CI. Then VP 8 with AFTER = the merge time and MERGE_SHA, VP 9 with MODE=pending_successor, and VP 21 with RECS=rec-3975. Row B1 (PR number, merge SHA, run ids). Report readiness, validator verdicts, postflight evidence, review and the real push and PR outcome separately (implement skill, Commit Flows).
- |-
  C1, confirm (operator, the same day as PR 1's apply). The confirmation mail reaches the company inbox through the alerts alias. Do not open its link: opening it confirms without authentication. Copy the link address, take the value after "Token=" up to the next "&", and in AWS CloudShell (eu-west-2) run:
  T=$(aws sns list-topics --query "Topics[?ends_with(TopicArn, ':agent-platform-alerts')].TopicArn" --output text); read -rsp 'Token: ' K; echo; aws sns confirm-subscription --topic-arn "$T" --token "$K" --authenticate-on-unsubscribe true --query 'length(SubscriptionArn)' --output text; unset K
  Expected: one number (the ARN's length; the ARN itself is not printed). Then the agent runs VP 9 with MODE=two_confirmed; row C1. Fallback: if the link was opened (by a person or a mail scanner) VP 9 reads successor_authenticated ['false']; continue, record it in row C1 and file a Low rec to re-subscribe with authentication later (the predecessor has the same property today).
- |-
  P1, paging proof (operator, CloudShell, after VP 9 two_confirmed). The agent records T_P1 (UTC now) in build-state.json, then the operator runs:
  aws cloudwatch set-alarm-state --alarm-name ducklake-telemetry-writer-smoke-errors --state-value ALARM --state-reason "company alerts paging proof"
  The alarm only notifies (no consumer reads its state) and returns to OK at its next 15-minute evaluation. The operator says in the thread when the ALARM page and the OK page reached the company inbox. Then VP 10; row P1.
- |-
  PR 2 (forget the predecessor; carries the Owner change). Before S2: apply PR 2's sns_alerts.tf edit (removed block with lifecycle { destroy = false } and the why comment "CI cannot unsubscribe; the operator deletes it after the successor is proven"), replace the test with test_predecessor_forgotten_not_destroyed, run VP 13, --pre, VP 23 and code review, open the PR titled 'feat(terraform-company-emails): forget the founder's alerts subscription and move the Owner tag to the operations alias' and wait for green CI (its first trusted plan shows the forget only; do not merge). Then S2, right after VP 8 reads the record green and only when the operator can approve tf-gated-apply within the hour (constraints, S2 window). Record v_s2_before, present the command, wait for the word, run it, then VP 11, record T_S2, row S2:
  bin/venv-python - <<'PY'
  import re, boto3
  N = '/secret/agent-platform-terraform-personal-tfvars'
  ssm = boto3.Session(profile_name='agent_platform_admin', region_name='eu-west-2').client('ssm')
  p = ssm.get_parameter(Name=N, WithDecryption=True)['Parameter']; t = p['Value']
  m = re.search(r'^\s*owner_email\s*=\s*"?([^"\n]*)"?\s*$', t, re.M)
  assert m and not re.search(r'^\s*previous_owner_email\s*=', t, re.M), 'unexpected owner lines'
  new = t[:m.start()] + 'owner_email = "' + '@'.join(('operations', 'otl-labs.com')) + '"' + t[m.end():]
  new = new.rstrip('\n') + '\nprevious_owner_email = "' + m.group(1) + '"\n'
  assert ssm.get_parameter(Name=N)['Parameter']['Version'] == p['Version'], 'parameter changed since read'
  print('TFVARS_WRITTEN', p['Version'], '->', ssm.put_parameter(Name=N, Value=new, Type='SecureString', Overwrite=True)['Version'])
  PY
  Then, on the operator's word, re-run PR 2's latest terraform-plan-trusted run (GitHub Actions re-run of that run id), run VP 12, squash-merge on VP 12 and green CI, and tell the operator the tf-gated-apply approval is waiting (names-only plan in the PR comment: Owner tag updates, policies unknown at plan time whose documents only name tag-changed resources, one forget). After the approval: VP 8 with AFTER = the gated-apply completion and MERGE_SHA, then VP 14. Row B2 (PR number, merge SHA, apply and gated-apply run ids).
- |-
  A1, bootstrap Owner tags (agent in an ADMIN session; Decision 126 human-directed apply). Run VP 15 with MODE=plan and present its summary (counts and addresses only, never plan text, which prints old and new tag values). On the operator's word on that summary, run: AWS_PROFILE=agent_platform_admin terraform -chdir=terraform/bootstrap apply -input=false "${TMPDIR:-/tmp}/tf-company-emails/owner.tfplan" > /dev/null && echo A1_APPLIED. Then VP 15 with MODE=after. Row A1.
- |-
