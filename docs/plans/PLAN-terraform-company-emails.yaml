schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: terraform-company-emails
intent: >-
  First of three plans moving the two founder e-mail values in Terraform to company role aliases. This plan masks
  every *_email tfvars value in every CI log (rec-3975) and adds the company alerts subscription beside the founder's:
  a successor e-mail subscription on the agent-platform-alerts topic, created through CI from a transitional
  company_alerts_email tfvars value, confirmed by the operator with authenticated unsubscribe and proven to receive an
  alarm page while the founder's subscription still pages. PLAN-terraform-company-emails-forget then retires the
  founder's subscription, and PLAN-terraform-company-emails-closing moves the Owner tag and returns the subscription to
  its pinned address.
implementation_declared: false
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-terraform-company-emails.yaml
phase: >-
  user_explicit_out_of_scope (soft-warn exception category) -- the AWS stage of the company ownership move (Decision
  195, Decision 242), the queue item "personal terraform variables to company values" plus the alerts-mailbox item.
  No tier_item criterion claimed.
closes_criteria: []
scope:
- file: .github/actions/materialise-tfvars/materialise_tfvars.sh
  action: Modify
  purpose: >-
    Both mask loops (--stdout mode and file mode) also mask every key matching *_email (case arm "account_id |
    platform_dev_external_id | platform_admin_external_id | *_email)"), so the drift job, the dispatch fresh plan and
    reconcile never print an e-mail value; the header gains one sentence naming the *_email arm, and the mask block's
    comment ("emit ::add-mask:: for account_id and both ExternalId trust secrets") names it too. No other behaviour
    changes.
- file: scripts/ci/redaction_check.py
  action: Modify
  purpose: >-
    rec-3975: _SCRUB_SPECS gains ("_ALERTS", "[ALERTS_EMAIL]") and _placeholder_label returns "[ALERTS_EMAIL]" for
    index 4 (a string literal, as the CodeQL note requires); the module docstring names alerts_email beside
    owner_email.
- file: scripts/ci/trusted_plan_env.sh
  action: Modify
  purpose: >-
    rec-3975: exports _ALERTS from the alerts_email tfvars key beside _OWNER; the header names five scrub variables.
    The *_email ::add-mask:: arm is unchanged.
- file: tests/test_materialise_tfvars_delegate.py
  action: Modify
  purpose: >-
    New TestDelegateBehaviour::test_masks_every_email_value: under GITHUB_ACTIONS both modes print ::add-mask:: for
    owner_email, alerts_email and company_alerts_email placeholder values (on stderr in --stdout mode), and print no
    ::add-mask:: line on either stream with GITHUB_ACTIONS unset; run under the literal composite argv bash --noprofile --norc -e -o pipefail
    (Decision 162 R2) with the existing fake aws shim. Planned change to TestDelegateBehaviour::test_masks_under_github_actions:
    its mask count becomes five, its two "never masked" assertions on the owner and alerts placeholders become
    "masked" assertions, and the comment above them ("NOT in the protected-key set -- never masked") says they are
    masked (weakening_dispositions).
- file: tests/test_redaction_check.py
  action: Modify
  purpose: >-  # pragma: allowlist secret
    New test_alerts_email_is_scrubbed: redact replaces the _ALERTS value with [ALERTS_EMAIL], and assert-clean exits
    non-zero naming [ALERTS_EMAIL] when the value survives in a body. Planned change to
    test_helpers_ignore_unset_secrets: it also unsets _ALERTS and expects five empty scrub pairs
    (weakening_dispositions).
- file: tests/test_trusted_plan_env.py
  action: Modify
  purpose: >-
    New test_exports_alerts_scrub_variable: the wrapped command sees _ALERTS equal to the alerts_email tfvars
    placeholder, and --scrub-only exports it without any TF_VAR_* value.
- file: terraform/personal/sns_alerts.tf
  action: Modify
  purpose: >-
    The approved transitional variable company_alerts_email (no default) and aws_sns_topic_subscription.company_alerts_email
    on the alerts topic, exactly as the sidecar block sns-successor-subscription reads (no count or for_each, which
    the trusted-plan screen refuses, and no lifecycle by design). The predecessor block is untouched.
- file: tests/checks/iam_tf/test_alerts_email_subscription.py
  action: Create
  purpose: >-
    One module over sns_alerts.tf's text (pytestmark unit; resource blocks sliced with
    tests.fixtures.terraform_hcl_blocks.find_resource_block, the no-default variable read with
    validate_terraform_cc_web_operations._declared_no_default_variables): test_successor_subscription_beside_predecessor (both
    subscriptions on aws_sns_topic.alerts, protocol email, endpoints var.alerts_email and var.company_alerts_email,
    company_alerts_email declares no default, neither block has count, for_each or lifecycle, and the file carries no
    at-sign). PLAN-terraform-company-emails-forget replaces the test; the module carries no e-mail address.
- file: docs/contracts/terraform-cc-web-operations.yaml
  action: Modify
  purpose: >-
    The sidecar's three contract blocks verbatim: recoverable_vars names seven, company_alerts_email joins
    where_values_live, and one new amendment_log entry. validate_terraform_cc_web_operations fails without them (the
    table is bidirectional). The owner_email and owner_vs_alerts_email wording moves with
    PLAN-terraform-company-emails-closing, when the values do.
- file: docs/plans/approved/terraform-company-emails.yaml
  action: Create
  purpose: >-
    Plan PR: the operator-approved sidecar binding PR 1's contract and sns_alerts.tf wording (validate_merge_step
    reads it at PR 1's base). Never edited by a build PR.
- file: docs/plans/PLAN-terraform-company-emails.yaml
  action: Create
  purpose: This plan; PR 1 flips implementation_declared to true.
bundled_recommendations:
- rec-3975
followon_recs:
- rec-4894
- rec-4897
weakening_dispositions:
- candidate: "[assertion-changed] tests/test_materialise_tfvars_delegate.py::TestDelegateBehaviour::test_masks_under_github_actions"
  disposition: planned-change
  cite: "acceptance_criteria[0]"
- candidate: "[assertion-changed] tests/test_redaction_check.py::test_helpers_ignore_unset_secrets"
  disposition: planned-change
  cite: "acceptance_criteria[0]"
infrastructure_dependencies:
- >-
  Infrastructure Dependencies table (terraform/personal in scope; pipeline mechanics are environment-taxonomy.yaml's,
  not restated). | order | dependency | timing | owner | -- | 1 | S1: the tfvars parameter carries company_alerts_email
  | before PR 1 opens: PR 1 declares the variable with no default, and main ignores an undeclared tfvars key (a
  warning that names the key only) | agent, on the operator's word | -- | 2 | PR 1's saved plan creates the successor
  subscription (sns:Subscribe is granted to the apply role, Decision 143) | merge, guard PASS, then the merge-time
  subagent plan review (constraints) | CI | -- | 3 | C1 and
  P1 | the same day as PR 1's apply | operator.
- >-
  Required checks: pr-validate and terraform-validate (terraform/github/repo.tf; Decision 119: no local init, validate
  or plan of terraform/personal, provider-free terraform fmt -check only); the advisory trusted plan job (Decision 83)
  must also pass, since VP 7 reads its comment and the merge applies its saved plan. No scope file
  is under terraform/bootstrap, so no pre-merge bootstrap plan step is owed (deploy-paths.yaml admin_out_of_band).
- >-
  LAMBDA: compute_affected_artifacts(<this plan's scope>) returns {} -- no scope file is Lambda-packaged, so no build,
  deploy or smoke step is owed (Decision 79).
- >-
  Not in Terraform and denied to PlatformAdmin's reads (probed 2026-11-04): AWS Budgets, Cost Anomaly Detection
  subscriptions and AWS User Notifications; step O1 is the operator's read-only console check of their recipients.
acceptance_criteria:
- >-
  Every *_email tfvars value is masked in the drift, dispatch, reconcile and trusted plan logs, and the trusted PR
  comment's assert-clean covers alerts_email (VP 4); rec-3975 is closed (VP 11).
- >-
  The alerts topic carries the company successor subscription beside the founder's, both confirmed, the successor
  with authenticated unsubscribe unless the recorded C1 fallback was taken (VP 9), and an alarm page reached the
  company inbox while the founder's subscription still existed (VP 10).
- >-
  PR 1's contract and sns_alerts.tf wording equals the approved sidecar (VP 6, validate_merge_step); its trusted plan
  creates exactly the successor and nothing else (VP 7); the convergence record is green after the merge (VP 8).
- >-
  The tfvars parameter holds the six baseline keys plus company_alerts_email, every baseline value unchanged (VP 3).
- >-
  EVIDENCE.md records S1, B1, C1, P1 and O1 by kind and UTC time with no address, id or ARN, and no PR text this plan
  wrote matches the redaction pattern (VP 12).
verification_plan:
- step: 1
  phase: pre-deploy
  action: >-
    Start gate: the admin chain works; the session's alias file (execution_steps, start) holds the operations and
    alerts role aliases on one domain with mode 600; the three inventory rows still read personal on origin/main; the
    tfvars parameter holds exactly the six baseline keys (the Neon build's neon_org_id included), or those plus
    company_alerts_email when build-state.json records S1 (a resumed build); Decision 226's red-main overlap check is
    clear.
  command: |-
    bin/venv-python - <<'PY' && bin/venv-python -m scripts.ci_rca.red_overlap --plan docs/plans/PLAN-terraform-company-emails.yaml
    import json, os, re, subprocess, boto3, yaml
    F = os.path.join(os.environ.get('TMPDIR', '/tmp'), 'tf-company-emails', 'aliases.json'); A = json.load(open(F))
    assert sorted(A) == ['alerts', 'operations'] and len(set(A.values())) == 2 and all(v.count('@') == 1 for v in A.values()), 'alias file roles'
    parts = {k: v.split('@') for k, v in A.items()}
    assert parts['alerts'][1] == parts['operations'][1] != 'users.noreply.github.com' and os.stat(F).st_mode & 0o077 == 0, 'alias file domain or mode'
    B = boto3.Session(profile_name='agent_platform_admin', region_name=open('config/aws-region').read().strip())
    from scripts.aws_identity import caller_arn
    assert 'assumed-role/PlatformAdmin/' in caller_arn('agent_platform_admin'), 'admin chain (the proxy re-signs project-region STS calls, so read the real caller)'
    subprocess.run(['git', 'fetch', '-q', 'origin', 'main'], check=True)
    inv = yaml.safe_load(subprocess.run(['git', 'show', 'origin/main:docs/contracts/account-credential-inventory.yaml'], capture_output=True, text=True, check=True).stdout)
    rows = {x['id']: x['status'] for x in inv['rows']}; assert all(rows[k] == 'personal' for k in ('AWS-07', 'AWS-10', 'AWS-11')), 'rows moved'
    t = B.client('ssm').get_parameter(Name='/secret/agent-platform-terraform-personal-tfvars', WithDecryption=True)['Parameter']['Value']
    keys = sorted(re.findall(r'^\s*([a-z_]+)\s*=', t, re.M)); S = '/mnt/project-files/terraform-company-emails/build-state.json'
    base = ['account_id', 'alerts_email', 'neon_org_id', 'owner_email', 'platform_admin_external_id', 'platform_dev_external_id']
    resumed = os.path.exists(S) and 'v_s1_before' in json.load(open(S))
    assert keys == base or (resumed and keys == sorted(base + ['company_alerts_email'])), keys
    print('START_OK', 'resumed' if resumed else 'fresh')
    PY
  expected: Prints START_OK fresh (or resumed), then a JSON line whose verdict is clear (exit 0).
  fix_if: >-
    No admin chain: this session lacks the admin tier every live step needs; stop and ask the coordinator for an ADMIN
    session. No alias file: write it (execution_steps, start). A row already moved, or another key set (rec-4048
    retired the ExternalIds, or another writer added a key): stop and ask the coordinator, who owns the parameter's
    writer order. A blocked or unavailable overlap verdict: hold and tell the coordinator (Decision 226).
  hermetic: false
  graduation: not-applicable
- step: 2
  phase: pre-deploy
  action: >-
    Baseline, written once for all three plans: build-state.json in the project folder gets t0 and the parameter
    version, EVIDENCE.md gets its header, and the live starting point is read without printing a value: owner_email
    has the GitHub no-reply shape and equals the Owner tag on the data-lake bucket, the alerts topic and the CI apply
    role; alerts_email is off the company domain; the topic has exactly one e-mail subscription, confirmed, on
    alerts_email. A re-run keeps the stored baseline and reads nothing live (the live system has moved on by then).
  command: |-
    bin/venv-python - <<'PY'
    import datetime as dt, json, os, re, boto3
    D = '/mnt/project-files/terraform-company-emails/'; S, E = D + 'build-state.json', D + 'EVIDENCE.md'
    A = json.load(open(os.path.join(os.environ.get('TMPDIR', '/tmp'), 'tf-company-emails', 'aliases.json'))); dom = '@' + A['alerts'].split('@')[1]
    if os.path.exists(S):
        s = json.load(open(S)); print('BASELINE_KEPT', s['t0'], s['tfvars_version_before']); raise SystemExit(0)
    N = '/secret/agent-platform-terraform-personal-tfvars'; R = open('config/aws-region').read().strip()
    B = boto3.Session(profile_name='agent_platform_admin', region_name=R); ssm = B.client('ssm')
    p = ssm.get_parameter(Name=N, WithDecryption=True)['Parameter']
    kv = dict(re.findall(r'^\s*([a-z_]+)\s*=\s*"?([^"\n]*)"?\s*$', p['Value'], re.M))
    acct = B.client('sts').get_caller_identity()['Account']; topic = f'arn:aws:sns:{R}:{acct}:agent-platform-alerts'
    tag = lambda tags: {t.get('Key'): t.get('Value') for t in tags}.get('Owner')
    owners = [tag(B.client('s3').get_bucket_tagging(Bucket='agent-platform-data-lake')['TagSet']),
              tag(B.client('sns').list_tags_for_resource(ResourceArn=topic)['Tags']),
              tag(B.client('iam').list_role_tags(RoleName='agent-platform-github-ci-apply')['Tags'])]
    subs = [s for s in B.client('sns').list_subscriptions_by_topic(TopicArn=topic)['Subscriptions'] if s['Protocol'] == 'email']
    facts = {'owner_noreply_shape': kv['owner_email'].endswith('@users.noreply.github.com'), 'owner_tags_equal': owners == [kv['owner_email']] * 3,
             'alerts_off_company_domain': not kv['alerts_email'].endswith(dom),
             'one_confirmed_sub_on_alerts_email': len(subs) == 1 and subs[0]['SubscriptionArn'] != 'PendingConfirmation' and subs[0]['Endpoint'] == kv['alerts_email']}
    assert all(facts.values()), facts
    s = {'t0': dt.datetime.now(dt.timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ'), 'tfvars_version_before': p['Version']}
    json.dump(s, open(S, 'w'), indent=1)
    if not os.path.exists(E):
        open(E, 'w', encoding='utf-8').write('# Terraform company e-mails evidence (kinds and UTC times only)\n\n| step | what | UTC time | evidence kind | result |\n|---|---|---|---|---|\n')
    print('BASELINE', s['t0'], s['tfvars_version_before'], facts)
    PY
  expected: Prints BASELINE with t0, the version number and four true facts, or BASELINE_KEPT on a re-run.
  fix_if: >-
    A false fact: the live system is not where this plan starts (another change, or the subscription moved by hand);
    stop and tell the coordinator before any write.
  hermetic: false
  graduation: not-applicable
- step: 3
  phase: pre-deploy
  action: >-
    After S1: the parameter version advanced by exactly one, it holds the six baseline keys plus company_alerts_email,
    that key equals the company alerts role alias, and every other line is unchanged. Prints no value.
  command: |-
    bin/venv-python - <<'PY'
    import json, os, re, boto3
    A = json.load(open(os.path.join(os.environ.get('TMPDIR', '/tmp'), 'tf-company-emails', 'aliases.json')))
    N = '/secret/agent-platform-terraform-personal-tfvars'; s = json.load(open('/mnt/project-files/terraform-company-emails/build-state.json'))
    ssm = boto3.Session(profile_name='agent_platform_admin', region_name=open('config/aws-region').read().strip()).client('ssm')
    kv = lambda t: dict(re.findall(r'^\s*([a-z_]+)\s*=\s*"?([^"\n]*)"?\s*$', t, re.M))
    p = ssm.get_parameter(Name=N, WithDecryption=True)['Parameter']; new = kv(p['Value'])
    old = kv(ssm.get_parameter(Name=f"{N}:{s['tfvars_version_before']}", WithDecryption=True)['Parameter']['Value'])
    assert p['Version'] == s['tfvars_version_before'] + 1, ('another writer touched the parameter', p['Version'])
    assert set(new) == set(old) | {'company_alerts_email'} and all(new[k] == old[k] for k in old), 'other lines changed'
    assert new['company_alerts_email'] == A['alerts'], 'not the company alerts role alias'
    print('S1_OK version', p['Version'])
    PY
  expected: Prints S1_OK with the new version number (tfvars_version_before + 1).
  fix_if: >-
    Another version number: someone else wrote the parameter; stop, restore nothing, tell the coordinator. A wrong
    value: run the S1 rollback on the operator's word.
  hermetic: false
  graduation: not-applicable
- step: 4
  phase: pre-deploy
  action: >-
    PR 1 masking and scrub tests: every *_email tfvars value is masked by materialise_tfvars.sh in both modes under
    the literal composite argv, redaction_check scrubs and asserts on the alerts value, and trusted_plan_env exports
    _ALERTS. The graduated selector is the materialise test alone (the registry slot holds one node id); the other
    two run in the full tier's pytest suite.
  command: >-
    bin/venv-python -m pytest -q
    tests/test_materialise_tfvars_delegate.py::TestDelegateBehaviour::test_masks_every_email_value
    tests/test_redaction_check.py::test_alerts_email_is_scrubbed
    tests/test_trusted_plan_env.py::test_exports_alerts_scrub_variable
  expected: Three tests pass (exit 0).
  expected_literals:
  - 3 passed
  fix_if: >-
    A failing test: fix the script on the branch, never the test's placeholder values; a test that passes before the
    script change is not discriminating and is rewritten.
  hermetic: true
  graduation: graduate
  graduation_check_id: terraform-email-tfvars-masking
- step: 5
  phase: pre-deploy
  action: >-
    PR 1 subscription shape: the successor subscription sits beside the predecessor with no meta-argument, on a
    no-default *_email variable, and sns_alerts.tf carries no at-sign.
  command: >-
    bin/venv-python -m pytest -q
    tests/checks/iam_tf/test_alerts_email_subscription.py::test_successor_subscription_beside_predecessor
  expected: One test passes (exit 0).
  expected_literals:
  - 1 passed
  fix_if: A failure means sns_alerts.tf differs from the sidecar block; restore the approved text.
  hermetic: true
  graduation: waive
  graduation_waiver_reason: >-
    Transitional by design: PLAN-terraform-company-emails-forget replaces this test with the shape it checks, so it
    cannot stand as a regression guard; PLAN-terraform-company-emails-closing graduates the standing guard.
- step: 6
  phase: pre-deploy
  action: >-
    PR 1 wording: the contract's bidirectional variable table passes with seven entries, and every file the sidecar
    binds carries exactly the approved words (the same check validate_merge_step runs in pr-validate).
  command: >-
    bin/venv-python -c "from scripts.checks.contracts.validate_terraform_cc_web_operations import
    validate_terraform_cc_web_operations as v; f=[]; v(f); assert not f, f; print('CONTRACT_OK')" && git fetch -q
    origin main && bin/venv-python -m scripts.roadmap.approved_text verify --slug terraform-company-emails --base
    origin/main
  expected: Prints CONTRACT_OK, then approved_text verify exits 0 with no ERROR line.
  fix_if: >-
    A word difference: restore the sidecar text; any wording change, including one a review asks for, goes to the
    coordinator and the operator before merge (constraints).
  hermetic: false
  graduation: waive
  graduation_waiver_reason: >-
    Moment claim (Decision 244 cl.4): approved_text verify binds PR 1 to its base and goes red by design at the
    closing plan's contract edit; validate_terraform_cc_web_operations already stands in scripts.validate.
- step: 7
  phase: pre-deploy
  action: >-
    PR 1 open: its trusted plan comment (Decision 238) for the PR's current head reads CHANGES with exactly one create, the successor
    subscription, no drift line, a PASS guard prediction and a saved plan, and leaks nothing.
  command: |-
    test -n "$PR_NUMBER" && bin/venv-python - <<'PY'
    import json, os, re, sys, urllib.request
    get = lambda p: json.load(urllib.request.urlopen('https://api.github.com/repos/otl-labs/ontheloop/' + p, timeout=30))
    head = get(f"pulls/{os.environ['PR_NUMBER']}")['head']['sha']
    cs = [c['body'] for c in get(f"issues/{os.environ['PR_NUMBER']}/comments?per_page=100") if 'terraform/personal speculative plan (trusted' in c['body'] and f'PR head `{head}`' in c['body']]
    body = cs[-1] if cs else sys.exit('TRUSTED PLAN NOT POSTED for this head yet')
    scan = re.sub(r'\b[0-9a-f]{40,64}\b', '', body)
    leaks = [n for n, x in (('at', r'@[a-z0-9-]+\.[a-z]'), ('12-digit', r'(?<!\d)\d{12}(?!\d)'), ('arn', r'\barn:')) if re.search(x, scan)]
    rows = [r for r in re.findall(r'^\| ([^|]+?) \| ([^|]+?) \|', body, re.M) if r[0] != 'Resource' and not set(r[0]) <= set('-')]
    ok = ('State: CHANGES' in body and '0 to import, 1 to add, 0 to change, 0 to destroy (0 replaced).' in body
          and rows == [('aws_sns_topic_subscription.company_alerts_email', 'create')] and 'Drift detected outside Terraform' not in body
          and 'Predicted guard verdict: PASS' in body and 'This saved plan is applied at merge' in body and not leaks)
    print(json.dumps({'one_create': bool(ok), 'leaks': leaks})); sys.exit(0 if ok else 'TRUSTED PLAN STOP')
    PY
  expected: >-
    One JSON line {"one_create": true, "leaks": []}.
  fix_if: >-
    TRUSTED PLAN NOT POSTED: the trusted plan job has not finished for this head; wait for its check to conclude and
    re-run. Any other change, a drift line or a refusal category: stop; do not merge. A missing value error means S1
    has not run or the key is misspelt.
  hermetic: false
  graduation: not-applicable
- step: 8
  phase: post-deploy
  action: >-
    Convergence proof (Decision 190): the apply runs (every terraform-apply-sandbox run for MERGE_SHA, or the one
    heal dispatch APPLY_RUN names) completed with success, and the merge-time review's verdict is printed; the first
    completed terraform-drift run on main created after the later of AFTER (UTC, YYYY-MM-DDTHH:MM:SSZ) and those
    runs' completion succeeded and reads clean or measured converged; the convergence record is green; neither the
    drift log nor the apply logs carry e-mail-shaped text. A terraform-drift dispatch is allowed only once that apply
    concluded: it reads the infrastructure but writes the convergence record and may file a tf_drift rec.
  command: |-
    test -n "$AFTER$MERGE_SHA$APPLY_RUN" && bin/venv-python - <<'PY'
    import json, os, re, sys, urllib.request, boto3
    R = 'https://api.github.com/repos/otl-labs/ontheloop/'
    get = lambda p, raw=False: (lambda r: r.read().decode('utf-8', 'replace') if raw else json.load(r))(urllib.request.urlopen(R + p, timeout=60))
    after = os.environ.get('AFTER', ''); alog = ''
    assert not after or re.fullmatch(r'\d{4}-\d\d-\d\dT\d\d:\d\d:\d\dZ', after), 'AFTER must read YYYY-MM-DDTHH:MM:SSZ'
    if os.environ.get('APPLY_RUN') or os.environ.get('MERGE_SHA'):
        ap = [get('actions/runs/' + os.environ['APPLY_RUN'])] if os.environ.get('APPLY_RUN') else get('actions/workflows/terraform-apply-sandbox.yml/runs?head_sha=' + os.environ['MERGE_SHA'])['workflow_runs']
        assert ap and all(r['status'] == 'completed' for r in ap), 'apply run not completed yet'
        alog = ''.join(get(f"actions/jobs/{j['id']}/logs", raw=True) for r in ap for j in get(f"actions/runs/{r['id']}/jobs")['jobs'] if j['conclusion'] != 'skipped')
        print('REVIEWER', re.findall(r'Reviewer verdict: (\w+)', alog))
        assert all(r['conclusion'] == 'success' for r in ap), [(r['id'], r['conclusion']) for r in ap]
        after = max([after] + [r['updated_at'] for r in ap])
    runs = sorted((r for r in get('actions/workflows/terraform-drift.yml/runs?branch=main&per_page=50')['workflow_runs'] if r['created_at'] > after and r['status'] == 'completed'), key=lambda r: r['created_at'])
    dlog = lambda d: ''.join(get(f"actions/jobs/{j['id']}/logs", raw=True) for j in get(f"actions/runs/{d['id']}/jobs")['jobs'] if j['conclusion'] != 'skipped')
    d, log = next(((d, l) for d, l in ((d, dlog(d)) for d in runs) if not re.search(r'Z (?:##\[notice\]|::notice::)Lock held by an in-flight apply', l)), (None, ''))
    assert d, 'no completed drift cycle after the apply or AFTER yet (lock-skip runs are not cycles)'
    clean = re.search(r'Z Drift check: no changes detected \(exit 0\); cycle is clean\.$', log, re.M) or re.search(r'Z Measured verdict this cycle: converged ', log)
    leak = re.search(r'@[a-z0-9-]+\.[a-z]', log + alog)
    s3 = boto3.Session(profile_name='agent_platform_admin', region_name=open('config/aws-region').read().strip()).client('s3')
    rec = json.loads(s3.get_object(Bucket='agent-platform-data-lake', Key='convergence/personal/sandbox.json')['Body'].read())
    print('DRIFT', d['id'], d['event'], d['conclusion'], 'clean' if clean else 'NOT_CLEAN', 'leak' if leak else 'no_leak', 'record', rec['status'])
    sys.exit(0 if d['conclusion'] == 'success' and clean and not leak and rec['status'] == 'green' else 'DRIFT STOP')
    PY
  expected: >-
    With an apply run selected, prints REVIEWER ['PROCEED']; then DRIFT with the run id, event, success, clean,
    no_leak and record green (exit 0). A drift run that skipped its cycle because the state lock was held is passed
    over, never read as a cycle (the match is anchored after the log timestamp, because every drift log also echoes
    the notice inside its printed run script).
  fix_if: >-
    A failed apply run: REVIEWER names the merge-time review's verdict; follow constraints (merge-time reviewer).
    Not clean or red: read the run's measured verdict and stop (Decision 55); constraints (C1 drift window) name the
    only heal. Never heal with a guard-routed dispatch, whose plan.bin is a public artifact (rec-4230). A leak: an unmasked value reached a public log; stop, tell the
    coordinator and the operator, and do not continue to the next step.
  hermetic: false
  graduation: not-applicable
- step: 9
  phase: post-deploy
  action: >-
    Subscription state, by MODE, printing roles and states only (confirmed: an ARN; pending; deleted: SNS's Deleted
    row, unsubscribed and awaiting purge; other): pending_successor (after PR 1's apply: the predecessor
    confirmed, the successor on the company alerts role alias pending), two_confirmed (after C1: both confirmed, the
    successor's ConfirmationWasAuthenticated read and printed).
  command: |-
    test -n "$MODE" && bin/venv-python - <<'PY'
    import json, os, sys, boto3
    A = json.load(open(os.path.join(os.environ.get('TMPDIR', '/tmp'), 'tf-company-emails', 'aliases.json')))
    R = open('config/aws-region').read().strip(); B = boto3.Session(profile_name='agent_platform_admin', region_name=R); sns = B.client('sns')
    topic = f"arn:aws:sns:{R}:{B.client('sts').get_caller_identity()['Account']}:agent-platform-alerts"
    subs = [s for s in sns.list_subscriptions_by_topic(TopicArn=topic)['Subscriptions'] if s['Protocol'] == 'email']
    state = lambda s: 'confirmed' if s['SubscriptionArn'].startswith('arn:') else {'PendingConfirmation': 'pending', 'Deleted': 'deleted'}.get(s['SubscriptionArn'], 'other')
    succ = [s for s in subs if s['Endpoint'] == A['alerts']]; pred = [s for s in subs if s['Endpoint'] != A['alerts']]
    auth = [sns.get_subscription_attributes(SubscriptionArn=s['SubscriptionArn'])['Attributes'].get('ConfirmationWasAuthenticated') for s in succ if state(s) == 'confirmed']
    got = {'successor': [state(s) for s in succ], 'predecessor': [state(s) for s in pred], 'successor_authenticated': auth}
    want = {'pending_successor': (['pending'], ['confirmed']), 'two_confirmed': (['confirmed'], ['confirmed']), 'successor_only': (['confirmed'], [])}[os.environ['MODE']]
    auth_ok = os.environ['MODE'] != 'two_confirmed' or auth == ['true'] or os.environ.get('C1_FALLBACK') == '1'
    print('SUBS', os.environ['MODE'], got, 'fallback' if os.environ.get('C1_FALLBACK') == '1' else '')
    sys.exit(0 if (got['successor'], got['predecessor']) == want and auth_ok else 'SUBSCRIPTION STOP')
    PY
  expected: >-
    Prints SUBS with the mode and the per-role states and exits 0; two_confirmed exits 0 only when
    successor_authenticated reads ['true'], or with C1_FALLBACK=1 set once row C1 records the fallback.
  fix_if: >-
    pending_successor with no successor: PR 1's apply did not create it, read the apply run. two_confirmed with
    successor [] after a pending_successor pass: the unconfirmed subscription expired before C1 (SNS's retention is
    UNPROVEN) and the next drift cycle measures out_of_band_drift; stop (Decision 55) and tell the coordinator; once
    its tf_drift rec is reviewed, the heal is the operator-worded acknowledge-and-retry dispatch (constraints, C1 drift
    window), which re-creates the subscription and re-sends the confirmation mail; then VP 8 with APPLY_RUN, VP 9
    MODE=pending_successor, and C1 again. Any deleted or other row:
    someone unsubscribed it (a deleted successor leaves the founder as the only subscriber); stop and tell the
    coordinator. two_confirmed still pending: the confirmation token expired or was mistyped; the operator repeats C1 (the console's Request
    confirmation button re-sends the mail).
  hermetic: false
  graduation: not-applicable
- step: 10
  phase: post-deploy
  action: >-
    Paging proof P1, with T_P1 the UTC time the agent recorded just before the operator's command: the
    ducklake-telemetry-writer-smoke-errors alarm history has a StateUpdate to ALARM after T_P1, the alerts topic
    delivered at least four notifications since T_P1 (ALARM and OK to two subscriptions) and failed none, and the
    operator has said in the thread that the pages reached the company inbox through the alerts alias.
  command: |-
    test -n "$T_P1" && bin/venv-python - <<'PY'
    import datetime as dt, os, sys, boto3
    B = boto3.Session(profile_name='agent_platform_admin', region_name=open('config/aws-region').read().strip()); cw = B.client('cloudwatch')
    t = dt.datetime.fromisoformat(os.environ['T_P1'].replace('Z', '+00:00')); now = dt.datetime.now(dt.timezone.utc)
    h = cw.describe_alarm_history(AlarmName='ducklake-telemetry-writer-smoke-errors', HistoryItemType='StateUpdate', StartDate=t, EndDate=now)['AlarmHistoryItems']
    to_alarm = [x for x in h if 'to ALARM' in x['HistorySummary']]
    m = lambda n: sum(p['Sum'] for p in cw.get_metric_statistics(Namespace='AWS/SNS', MetricName=n, Dimensions=[{'Name': 'TopicName', 'Value': 'agent-platform-alerts'}], StartTime=t, EndTime=now, Period=60, Statistics=['Sum'])['Datapoints'])
    got = {'alarm_transitions': len(to_alarm), 'delivered': m('NumberOfNotificationsDelivered'), 'failed': m('NumberOfNotificationsFailed')}
    print('P1', got); sys.exit(0 if got['alarm_transitions'] >= 1 and got['delivered'] >= 4 and got['failed'] == 0 else 'PAGING STOP')
    PY
  expected: Prints P1 with at least one alarm transition, delivered at least 4 and failed 0 (exit 0).
  fix_if: >-
    No transition: the operator's command did not run against this alarm. Delivered below 4: wait for the metric (up
    to 15 minutes) and the alarm's return to OK, then re-run. Failed above 0, or the operator saw no page: stop; the
    predecessor stays and nothing is retired (successor first).
  hermetic: false
  graduation: not-applicable
- step: 11
  phase: post-deploy
  action: Rec closure after PR 1's merge -- rec-3975 reads closed in the warehouse.
  command: >-
    AWS_PROFILE=agent_platform bin/venv-python -c "from src.common.ducklake_reader_client import make_reader,
    fetch_recs_by_ids; rows,missing=fetch_recs_by_ids(make_reader(profile='agent_platform'), ['rec-3975']);
    st={r['id']:r['status'] for r in rows}; print('RECS', st, missing); assert not missing and st=={'rec-3975':'closed'}"
  expected: Prints RECS with rec-3975 closed and no missing id (exit 0).
  fix_if: >-
    Still open after the closure job: read ci.yml's trailer-closure run; a refused acceptance verdict is fixed forward,
    never by editing the acceptance after the fact (Decision 201).
  hermetic: false
  graduation: not-applicable
- step: 12
  phase: post-deploy
  action: >-
    Evidence: EVIDENCE.md carries rows S1, B1, C1, P1 and O1 as pass, and neither it nor PR 1's body or comments match
    the redaction pattern.
  command: |-
    test -n "$PR_NUMBER" && bin/venv-python - <<'PY'
    import json, os, re, urllib.request
    ev = open('/mnt/project-files/terraform-company-emails/EVIDENCE.md', encoding='utf-8').read()
    REDACT = r'@|(?<![0-9])[0-9]{12}(?![0-9])|\barn:|[A-Za-z0-9_]{50,}'
    rows = ['S1', 'B1', 'C1', 'P1', 'O1']
    assert all(re.search(rf'^\| {r} \|.*\| pass \|$', ev, re.M) for r in rows), [r for r in rows if not re.search(rf'^\| {r} \|.*\| pass \|$', ev, re.M)]
    get = lambda p: json.load(urllib.request.urlopen('https://api.github.com/repos/otl-labs/ontheloop/' + p, timeout=30))
    n = os.environ['PR_NUMBER']
    texts = [ev, get(f'pulls/{n}')['body'] or ''] + [c['body'] for c in get(f'issues/{n}/comments?per_page=100') if 'terraform/personal speculative plan' not in c['body']]
    hits = [i for i, t in enumerate(texts) if re.search(REDACT, re.sub(r'\b[0-9a-f]{40,64}\b|\bcmsg_[A-Za-z0-9]+|(?<![\w.])@[A-Za-z0-9-]+(?![\w.@-])', '', t))]
    print('EVIDENCE', len(rows), 'rows pass; redaction hits', hits); assert not hits
    PY
  expected: Prints EVIDENCE 5 rows pass and redaction hits [] (exit 0).
  fix_if: >-
    A hit: edit the text out of the PR body or comment at once and tell the operator (Decision 101); a missing row:
    the step was skipped, stop.
  hermetic: false
  graduation: not-applicable
- step: 13
  phase: pre-deploy
  action: >-
    Before PR 1 opens (handoff_policy): the full tier on the committed, rebased, clean tree, then attest HEAD (Decision
    163 pre-handoff run). Started backgrounded with a 2 h limit from the top-level session.
  command: bin/venv-python -m scripts.validate && bin/venv-python -m scripts.checks.validation_result --verify-head
  expected: Exit 0 on a completed full-tier run, then --verify-head attests HEAD's tree.
  fix_if: >-
