  false); a pending successor then expires unconfirmed (UNPROVEN timing) and a confirmed one is deleted by the
  operator in the SNS console. The predecessor pages throughout, so paging is never at risk. The masking change
  reverts with a partial revert of its three files and their tests (a full revert of PR 1 would also drop the
  successor block, whose destroy AccessDenies through CI). Before S1 it re-exposes nothing; after S1 it would unmask
  company_alerts_email in drift, dispatch and reconcile logs (only the trusted job masks every *_email key itself),
  so it then waits for the successor's forget and S1's rollback. PR 1 merged but not applied (a merge-time review
  REVISE or STARVED): nothing was created; constraints (merge-time reviewer) name the heal and the removal PR. C1
  and P1 change no configuration.
