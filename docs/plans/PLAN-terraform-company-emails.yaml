constraints:
- >-
  Approved text is verbatim: the sidecar binds PR 1; context records the operator's approval of it by message id and
  date before the plan PR merges. Allowed variance: the amendment_log
  date. Any other wording change, including one critique or code review asks for, goes to the coordinator, then the
  operator, before merge.
- >-
  Live acts and who runs them. Agent, only after the operator's typed word on the exact command in the build thread,
  one word per mutation (Decision 237 cl.3 read as the Neon T1 precedent, PLAN-neon-org-company-assignment): S1, a
  rollback restore, and any terraform-apply-sandbox or terraform-drift dispatch (a drift dispatch writes the
  convergence record). Operator, in the AWS console or CloudShell under their own sign-in: O1, C1 and P1. PlatformAdmin
  is denied sns:ConfirmSubscription, sns:Unsubscribe, sns:Publish and cloudwatch:SetAlarmState (iam simulate,
  2026-11-04), so C1 and P1 cannot be agent steps.
- >-
  Code-owned paths: PR 1 edits three paths CODEOWNERS lists as the trusted plan job's main-only surface
  (.github/actions/materialise-tfvars/, scripts/ci/trusted_plan_env.sh, scripts/ci/redaction_check.py; rec-4637,
  Decision 238 cl.2). It merges only on the operator's typed code-owner word on the final diff in the build thread,
  then the admin-bypass squash-merge while PRs are authored as the operator (rec-2827; PLAN-trusted-plan-cutover PR 3
  precedent). Code review PROCEED is not that word.
- >-
  C1 drift window: C1 changes the successor's computed attributes without an apply, so from C1 until
  PLAN-terraform-company-emails-forget's apply persists them (its VP 5), any terraform/personal change waiting to
  apply sits beside resource_drift and Decision 190 reads it as out_of_band_drift (a red that refuses later applies,
  PR 2's included). So before C1 the agent asks the coordinator to hold every other terraform/personal merge and every
  terraform-apply-sandbox, reconcile or terraform-drift dispatch by another thread until that VP 5 passes, and plan 2
  starts right after P1 (the same day). If a red lands anyway: stop and tell the coordinator; once its tf_drift rec
  is reviewed (Decision 55), the only heal is the operator-worded empty acknowledge-and-retry while main's plan is
  guard PASS (no route, no artifact), never a guard-routed dispatch or reconcile route (ii) (rec-4230); then VP 8
  with APPLY_RUN = that dispatch run's id.
- >-
  Merge-time reviewer: after the guard passes, terraform-apply-sandbox's Subagent plan review (T2.39; an LLM given
  only the names-only digest, never this plan) gates the apply; PR 1's digest lists one create, and VP 8 prints the
  verdict. On REVISE the apply is skipped and the record turns red (nothing was created); on STARVED the apply is
  skipped and the record is left as it was (Decision 55). The same heal covers a stale saved plan at merge
  (PLAN_STALE_CONCURRENT_WRITER: another terraform/personal apply landed between PR 1's trusted plan and its merge,
  since the hold starts only at C1), which also turns the record red. Either way the failed push run files a ci_rca rec (Decision
  226): tell the coordinator at once, since past its repair SLO it blocks every thread's dispatch. Once that rec and
  the REVISE reason are reviewed, the heal on the operator's word is one terraform-apply-sandbox dispatch while
  main's plan is guard PASS (acknowledge_red_commit = the red commit when the record is red, else blank; a fresh
  review of the same change), then VP 8 with APPLY_RUN. A second REVISE, or a reason naming a real defect: stop; a
  PR removes the successor resource block only (the variable and its contract entry stay, so no wording changes; its
  trusted plan reads NO_CHANGES, since nothing was created) and merges, an acknowledged dispatch writes the record green, and a rec records the reviewer's judgement
  (Decision 55) before this plan is re-planned.
- >-
  Order is fixed: start (alias file), VP 1, VP 2, S1 (VP 3), PR 1 (VP 4, VP 5, VP 6, VP 13, open, VP 7, code-owner
  word, merge, VP 8, VP 9, VP 11), the coordinator hold, C1 (VP 9), P1 (VP 10), the start note, then VP 12; O1 runs
  any time before VP 12 and never delays the start note. Successor first: nothing old is retired here;
  PLAN-terraform-company-emails-forget starts only after VP 9 two_confirmed and VP 10 pass, on the start note.
- >-
  Masking first: PR 1 merges before any write of an owner or alerts value (the later plans' S2 and S3), so no drift,
  dispatch or reconcile log prints one. ::add-mask:: masks Actions logs only, never a PR comment body; the trusted
  comment is names-only and VP 7 scans it. _SCRUB_SPECS covers alerts_email and owner_email, not the transitional
  keys, which no plan text prints (accepted defence-in-depth gap).
- >-
  deploy-paths.yaml's admin-loop step says to recover the six no-default tfvars; from PR 1 until the closing plan's
  S4 there are seven (company_alerts_email). The contract's recoverable_vars is the authority and names seven; the
  step defers to it, so a break-glass recovery reads the contract.
- >-
  Registry shards kept: trusted-plan-env (node id tests/test_trusted_plan_env.py) keeps selecting the whole file, so
  PR 1's added test joins it with no shard edit.
- >-
  Plans sharing scope files (plan_obligations, 2026-11-04): account-id-out-of-session-output is unbuilt; whichever
  of it and PR 1 builds second rebases onto the first and re-runs this plan's VP 4 to VP 6.
  neon-key-out-of-pr-plans (#1654) and trusted-plan-cutover (#1728, #1735, #1736) read as unbuilt only because their
  plans predate implementation_declared; both are on main.
- >-
  Waiting (git-ops never_poll): for a drift run (VP 8) or the alarm's OK evaluation (VP 10), arm a Monitor until-loop
  bounded at two hours, or end the turn with a send_later wake; never a foreground sleep or polling loop.
- >-
  red_overlap at planning (2026-11-04): blocked on repair SLO only (rec-4872, rec-4888, rec-4890; no shared files).
  VP 1 re-runs it at the build's start; the plan PR merges only after the operator answers the unrelated-CI card.
- >-
  Parameter writes are read-modify-write with a version check and keep every other line (neon_org_id included); the
  coordinator serialises them with rec-4048 and any other writer. A rec-4048 build that lands first changes the
  baseline key set in VP 1 and VP 3; stop and re-plan the affected commands through /plan.
- >-
  Expected detector pages (Decision 202 cl.6, never filtered by actor), each evidence, not an incident:
  platform-security-alerts-topic-change on PR 1's Subscribe and on C1's confirmation; the smoke alarm's ALARM and OK
  mails in P1. A page outside this list is triaged before the next step.
- >-
  No contact address of the founder or the company (role aliases included), account id, ARN, token or confirmation link enters the repository,
  a PR, memory, chat or the shared folder (Decision 101): the build reads the role aliases from the session's alias
  file at run time and prints roles and booleans; evidence is kind and UTC time; screenshots are checked in the
  thread and never saved. Exception to Decision 224 cl.1-2 (an e-mail is a private value, never in a log or
  telemetry), pending the operator's acceptance: each build session's own transcript holds the two aliases, which
  reach it from the operator's 2026-11-03 message and again as the start step's arguments, and src/sensitive_values
  has no e-mail scrub class (rec-4897), so a captured transcript is both stored and served with them (Decision 239
  cl.2's content reader masks through read_masked, which has the same gap). Context records the acceptance by message id and date before the plan PR
  merges; without it the plan does not merge.
- >-
  A failed or drifted step halts this workstream until root-caused; never a silent retry; no rescue agents or
  workaround loops (Decision 55). Never apply terraform/personal out of band (rec-3189).
