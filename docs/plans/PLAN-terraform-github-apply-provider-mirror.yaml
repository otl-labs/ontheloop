constraints:
  - "Fail-open (Decision 55): no mirror state can fail either job; the mirror step only ever adds a TF_CLI_CONFIG_FILE line or nothing, and adds it only for a package whose sha256 the lockfile already lists."
  - "Integrity unchanged: both inits keep -lockfile=readonly, so the mirror package is checked against the committed lockfile hashes."
  - "No terraform output and no AWS error text reaches a log (the workflow already hides terraform's; Decision 101)."
  - "The bootstrap apply is human-directed in an ADMIN session (Decision 248 cl.6); the operator never hand-applies; no -target."
  - "Never loosen an existing assertion (Decision 235); no existing test node changes (the apply-script suite's COPIED tuple gains one file, which is setup)."
context:
  - "Decision-scout verdict FLAGS_FOUND (round 1). CITE: 248 (cl.4 widened by a dated Update line; cl.6 human-directed bootstrap apply; cl.9 names the guard as coverage), 246 (approved text; {{DATE}} keeps the approval; final-diff word kept for IAM and CODEOWNERS paths), 177 (an Update line legally widens a ratified clause), 120 (the mirror; fail-open to the pre-mirror path), 126 (agents never self-direct an apply), 101 (no AWS error text or account specifics in logs or comments), 128 (guard NEAR_CAP: facade, never a raise), 162 (one-line steps calling a testable script), 235 (the guard's exact grant set widens only by this human-approved IAM change; no existing node changes). CONTRADICT: 238 NOTE (cl.3 'init is hermetic' binds the PR-as-data speculative plan job, not this main-only preview; see the next line). SPIRIT: 55 NOTE (a silent green DEGRADED hides a persistent gap) -- adopted: each degradation is also a ::warning:: annotation on the run page. RELATED: 55, 119, 77, 144, 223, 150, 167, 226, 245, 132, 48. Decisions triaged: 202 of 202. Roadmap items intersected: 6; CONFLICT: 0; RELATED: 6. Serves: NS.9 2/5."
  - "Decision 238 cl.3 ('init is hermetic from the S3 provider mirror') governs the PR-data speculative plan job. This preview runs only main's code on push or dispatch, and provider integrity rests on -lockfile=readonly's check of the package against main's committed, code-owned lockfile hashes (zh for integrations/github 6.12.1), not on the mirror's write controls (tf-provider-mirror/ is writable by bucket-wide writers, Decision 120). So a direct-fetch fallback keeps the same integrity."
  - "Root cause and PR 1: see PLAN-terraform-validate-github-provider-mirror context (run 42468562354 preview init failed on both attempts; the S3 mirror holds integrations/github 6.12.1, seeded by #1894). This plan does not depend on PR 1's build: it has its own script, so either can build first."
