schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: terraform-github-apply-provider-mirror
intent: >-
  Stop a github.com provider-asset outage from failing terraform-github-apply's preview and apply jobs (2026-11-08:
  github.com answered 504 for the integrations/github SHA256SUMS and the preview failed init on both attempts, run
  42468562354) by copying the exact locked integrations/github package from the S3 provider mirror and installing it
  from there, falling back to today's direct fetch whenever the package is missing or unreadable, and by naming the
  class of an init failure (provider install, backend or other) without printing terraform's output.
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-terraform-github-apply-provider-mirror.yaml
phase: >-
  hotfix follow-on (PR 2 of the operator's two-PR choice for the 2026-11-08 red main; PR 1 is
  PLAN-terraform-validate-github-provider-mirror); no tier_item is targeted and no exit criterion is closed, so
  closes_criteria is empty.
closes_criteria: []
scope:
  - file: terraform/bootstrap/github_settings_apply.tf
    action: Modify
    purpose: >-
      IAM wording pasted to the operator at planning and bound at build by his final-diff word (not sidecar-bound:
      the guard's exact grant set rejects the new Sid until the build updates it, so the wording check cannot place
      it). A new local github_settings_mirror_arn =
      "arn:aws:s3:::agent-platform-data-lake/tf-provider-mirror/registry.terraform.io/integrations/github/*" beside
      github_settings_state_arn, and one new statement in each role's inline policy, after its last existing one:
      Sid ProviderMirrorGithubRead, Effect Allow, Action ["s3:GetObject"], Resource [local.github_settings_mirror_arn].
      No s3:ListBucket (the script copies one known key), no write, no other prefix; every other statement, the
      trusts, the boundary, the key policy and both 10,240 B preconditions are unchanged. terraform fmt may realign
      the locals' equals signs (whitespace only). The header comment's role descriptions (lines 6-8: the preview
      "reads terraform/github's state only", the apply reads and writes state and lock) each gain "and the
      integrations/github provider packages in the S3 provider mirror", inside the same final-diff wording.
    new_imports: []
  - file: scripts/ci/terraform_github_apply_mirror.sh
    action: Create
    purpose: >-
      Mode 100755, `set -uo pipefail` (never -e), every path ends in an explicit `exit 0`; env read guard-then-use
      (`${VAR:-}` tested, the plain name written, `if ...; then ...; fi` never a trailing `[ ] && ...`). Two modes.
      `fetch`: degrade unless MIRROR_PREFIX, RUNNER_TEMP and GITHUB_ENV are all set and `uname -sm` is `Linux x86_64`;
      resolve the lockfile from the script's own directory ("$HERE/../../terraform/github/.terraform.lock.hcl", so
      the result never depends on cwd) and parse GITHUB_VERSION from its registry.terraform.io/integrations/github
      block (the awk PR 1's gate uses); KEY=registry.terraform.io/integrations/github/terraform-provider-github_${GITHUB_VERSION}_linux_amd64.zip;
      `timeout 120 aws s3 cp "${MIRROR_PREFIX}${KEY}" "$RUNNER_TEMP/tf-github-mirror/$KEY" --only-show-errors` with
      stdout and stderr sent to /dev/null (an AWS error names an ARN with the account id: never printed, Decision
      101); then the file must be a non-empty regular file whose sha256 (sha256sum), as "zh:<hex>", is one of the
      lockfile's integrations/github hashes; a mismatch deletes the file and degrades (reason "hash mismatch"), so a
      corrupt or tampered mirror package falls back to a direct fetch instead of failing init on -lockfile=readonly.
      On success it writes "$RUNNER_TEMP/tf-github-mirror.tfrc"
      (filesystem_mirror path "$RUNNER_TEMP/tf-github-mirror", include ["registry.terraform.io/integrations/github"];
      direct exclude the same one address), and only once that write succeeds appends TF_CLI_CONFIG_FILE=<that path>
      to $GITHUB_ENV (a failed tfrc write degrades, reason "tfrc write failed"; a failed append degrades too, reason
      "GITHUB_ENV write failed", so ACTIVE prints only after both writes succeed) and prints
      `provider-mirror: ACTIVE (integrations/github ${GITHUB_VERSION})`. Every degradation (an unset variable, another
      OS or CPU, an unparsed version, a copy error or timeout (exit 124), an empty file, a hash mismatch, a failed tfrc write, a failed GITHUB_ENV write) prints `provider-mirror:
      DEGRADED -- <reason> -- falling back to a direct fetch` and the same reason as one `::warning::` annotation (so a
      persistent degradation shows on every run page, Decision 55), writes no GITHUB_ENV line and exits 0. It never fails
      the job. `classify LOG`: prints exactly one line `init failure class: provider_install`, `backend` or `other`,
      chosen by fixed greps over LOG (backend first: Error loading state, Failed to get existing workspaces, error
      configuring S3 Backend, Error acquiring the state lock; else provider_install: Failed to install provider, Failed
      to query available provider packages, could not query provider registry, Gateway Timeout, 502 Bad Gateway,
      checksum; backend wins when both match, so an S3-backend gateway error is not labelled provider_install), never
      any LOG text; an unreadable LOG is `other`; exit 0.
    new_imports: []
  - file: .github/workflows/terraform-github-apply.yml
    action: Modify
    purpose: >-
      Each job gains one step right after its Configure AWS credentials step (preview: before the plan App token is
      minted): name "Fetch the GitHub provider from the S3 provider mirror (fail-open)", id mirror, env MIRROR_PREFIX:
      s3://agent-platform-data-lake/tf-provider-mirror/, run `bash scripts/ci/terraform_github_apply_mirror.sh fetch`.
      The preview plan step's init line keeps its shape and line count, its failure branch becoming `|| { bash
      "$GITHUB_WORKSPACE/scripts/ci/terraform_github_apply_mirror.sh" classify "$RUNNER_TEMP/tf.log"; echo
      "::error::TF_GITHUB_PREVIEW_FAILED init"; exit 1; }`. The header's preview parenthetical (line 6, "state read only") and the preview credentials step name ("state read
      only") become "state and mirror read only". The header comment gains one sentence: both jobs install
      integrations/github from the S3 provider mirror when its locked package is there, else fetch it directly. No
      trigger, permission, Environment, role, if or other step changes (#1917 and PLAN-terraform-github-apply-push-neutral
      also edit this file: expect a rebase).
    new_imports: []
  - file: scripts/ci/terraform_github_apply.sh
    action: Modify
    purpose: >-
      terraform_step, on a failed step named init, runs `bash "$HERE/terraform_github_apply_mirror.sh" classify "$LOG"`
      before its existing TF_GITHUB_APPLY_TERRAFORM_FAILED line. Nothing else changes; the init command inherits
      TF_CLI_CONFIG_FILE from the job env when the mirror step exported it.
    new_imports: []
  - file: config/composite_action_body_baseline.yaml
    action: Modify
    purpose: >-
      Two new r3_workflows entries at 1, ".github/workflows/terraform-github-apply.yml::preview::mirror" and
      "...::apply::mirror" (one-line bodies; no marker needed). The preview::plan entry stays 10: its one behavioural edit (the classify call inside the existing init failure
      branch) keeps the line count, and extracting the step would move the governed preview's plan body out of the
      code-owned workflow mid-hotfix; accepted knowingly under the baseline's touch-it rule.
    new_imports: []
  - file: scripts/checks/ci_guards/validate_github_settings_apply.py
    action: Modify
    purpose: >-
      Kept within its 24 SLOC of headroom by moving the new wiring check out (next row): it gains only the import of
      _github_settings_mirror, _APPLY_GRANTS and _PREVIEW_GRANTS each gaining ("ProviderMirrorGithubRead",
      {s3:GetObject}, {MIRROR_ARN}) with MIRROR_ARN imported from that module, so any widening (tf-provider-mirror/*, another namespace), an added
      action or a missing statement fails h. OWNED gains scripts/ci/terraform_github_apply_mirror.sh and scripts/checks/ci_guards/_github_settings_mirror.py.
      check_workflow(wf, apply_script: str | None = None) appends _github_settings_mirror.check_mirror_wiring(jobs,
      apply_script) as predicate n (None reads APPLY_SCRIPT under _common.ROOT; _load_tree, run_all and the 6-tuple Tree
      keep their shape, so existing nodes stay byte-identical). The module docstring's predicate list gains (n) and its
      (h) text gains the mirror read; the `PASS: predicates (a)-(m)` line becomes (a)-(n). Registered check unchanged.
      Re-measure at build (bin/venv-python -m scripts.roadmap.plan_obligations --plan <this plan>); if the import, grants,
      OWNED and docstring lines would still pass 500, move more into the new module, never a budget raise (Decision 128).
    new_imports: [scripts.checks.ci_guards._github_settings_mirror]
  - file: scripts/checks/ci_guards/_github_settings_mirror.py
    action: Create
    purpose: >-
      Code-owned helper (CODEOWNERS sidecar block and OWNED, so the guard cannot be weakened unseen through it): MIRROR_ARN,
      MIRROR_PREFIX (s3://agent-platform-data-lake/tf-provider-mirror/), the mirror run and classify literals, and
      check_mirror_wiring(jobs, apply_script) -> list[str], predicate n: in each job,
      the step with id mirror runs exactly `bash scripts/ci/terraform_github_apply_mirror.sh fetch` with env
      MIRROR_PREFIX equal to the literal prefix, comes after that job's configure-aws-credentials step and before the
      first other step whose run names terraform (the mirror step itself excluded; today the tfver step), and in the
      preview job before the app_token step; the preview plan step's run names `terraform_github_apply_mirror.sh"
      classify` inside its init failure branch, before TF_GITHUB_PREVIEW_FAILED init; and the apply script's
      terraform_step body names `terraform_github_apply_mirror.sh" classify`. Failure messages follow the guard's style:
      one "n: ..." line per job's mirror step, however many placement faults it has, plus one per missing classify call. Imports only from scripts.checks._common and validate_trusted_plan_environment (e.g. its
      step helpers), never from validate_github_settings_apply, which imports it (no cycle). No I/O at import; under 150
      SLOC.
    new_imports: []
  - file: scripts/checks/ci_guards/_manifest.py
    action: Modify
    purpose: >-
      The validate_github_settings_apply Entry's pre_globs gain "scripts/checks/ci_guards/_github_settings_mirror.py"
      after the guard's own path, so a change to the helper re-runs the guard in --pre. Nothing else changes.
    new_imports: []
  - file: tests/checks/ci_guards/test_validate_github_settings_apply.py
    action: Modify
    purpose: >-
      New nodes: test_h_the_mirror_grant_is_exact (parametrized over both roles: statement removed, resource widened to
      tf-provider-mirror/*, resource moved to kislerdm/*, s3:PutObject added, s3:ListBucket added; each fails h) and
      test_n_check_workflow_appends_the_mirror_wiring (plumbing only: a synthetic apply_script without the classify call
      makes check_workflow return an "n: ..." line; predicate n's cases live in the helper's own test file). Headroom:
      427 of 500 SLOC at planning; re-measure at build and decompose by subject if it would pass 500 (Decision 128). test_i_codeowners_line_missing covers the new OWNED entry by its existing
      parametrization. Every existing node stays byte-identical (test_h_a_fourth_apply_statement still fails: an
      Extra statement still breaks the exact set).
    new_imports: []
  - file: tests/checks/ci_guards/test__github_settings_mirror.py
    action: Create
    purpose: >-
      The helper's mirror test file (validate_test_coverage maps the helper here and requires 100% coverage from this file
      alone). Calls check_mirror_wiring(jobs, apply_script) directly on the real workflow's jobs and the real apply script
      text (both green), then test_n_each_job_fetches_the_mirror_before_init (parametrized; mirror step missing, before
      the credentials step, a terraform-naming step inserted ahead of it, another run line and MIRROR_PREFIX changed, each
      for the preview and the apply job; preview only: moved after app_token; classify dropped from the preview plan step's init
      failure branch; classify call dropped from the apply script; each returns exactly one "n: " line, because the helper
      reports all placement faults of one job's mirror step as a single line).
    new_imports: []
  - file: tests/test_terraform_github_apply_script.py
    action: Modify
    purpose: >-
      The real apply script now calls the mirror script on a failed init, so COPIED gains
      "terraform_github_apply_mirror.sh" (without it the copied script exits 127 under set -euo pipefail and
      test_a_terraform_failure_stops_and_revokes[init] fails). New node test_a_failed_init_prints_its_class_only:
      TF_STUB_FAIL=init with the terraform stub's error text; exactly one `init failure class: ` line, before the
      TF_GITHUB_APPLY_TERRAFORM_FAILED line, and no stub error text in stdout or stderr. The COPIED addition is test
      setup; no existing assertion changes.
    new_imports: []
  - file: tests/test_terraform_github_apply_mirror.py
    action: Create
    purpose: >-
      Runs the real script as the workflow does, `bash -e -c 'bash scripts/ci/terraform_github_apply_mirror.sh fetch'`,
      from a temp repo copy holding the real terraform/github/.terraform.lock.hcl, with a fake aws (records argv; per
      STUB_MODE writes the destination zip, exits 1, exits 124 (the code `timeout` returns, so the
      timeout branch runs without waiting), writes an empty file, writes a zip whose sha256 the lockfile lacks, or
      prints an AccessDenied line naming a synthetic 12-digit account ARN to stderr) and a fake uname and sha256sum on PATH (per SHA_MODE the fake sha256sum prints one of the real lockfile's zh
      hashes, or a 64-hex value the lockfile lacks for the hash-mismatch case). Nodes:
      test_fetch_active_writes_a_mirror_only_tfrc (exit 0; argv is `s3 cp <prefix><KEY> <dest> --only-show-errors`
      with the version read from the real lockfile; GITHUB_ENV holds TF_CLI_CONFIG_FILE; the tfrc's filesystem_mirror
      include and direct exclude are each exactly ["registry.terraform.io/integrations/github"]; the ACTIVE line names
      the locked version); test_fetch_degrades_and_exits_zero (parametrized: copy error, timeout, empty file,
      hash mismatch (the zip is also deleted), tfrc write failed (RUNNER_TEMP's tfrc path made a directory),
      GITHUB_ENV write failed (GITHUB_ENV pointing at a directory), unparseable lockfile, MIRROR_PREFIX unset, RUNNER_TEMP unset, GITHUB_ENV unset, uname aarch64; each exits 0,
      writes no TF_CLI_CONFIG_FILE line, prints one DEGRADED line and one ::warning:: line); test_fetch_never_prints_aws_error_text (the
      account digits and the ARN appear nowhere in stdout or stderr); test_classify_names_a_class_and_never_the_log
      (parametrized logs: a 504 provider install, a backend lock error, both (backend wins), neither, a
      missing file; exactly one line, the expected class, no log line echoed).
    new_imports: []
  - file: docs/DECISIONS.md
    action: Modify
    purpose: >-
      Approved text (sidecar block decision-248-update), word for word: one "> **Update (DATE):**" line appended to
      Decision 248 after its reversal-conditions block, recording clause 4's read-only mirror widening. No other
      Decision changes; no new number.
    new_imports: []
  - file: .github/CODEOWNERS
    action: Modify
    purpose: >-
      Approved text (sidecar block codeowners-mirror-script): `/scripts/checks/ci_guards/_github_settings_mirror.py
      @benjamin-blake` and `/scripts/ci/terraform_github_apply_mirror.sh @benjamin-blake` after the
      terraform_github_apply_gate.py line, so the trusted-plan guard's (h) and the settings guard's OWNED accept the
      script the preview job executes, and the guard cannot be weakened through its helper unseen.
    new_imports: []
bundled_recommendations: [rec-5005]
followon_recs: []
infrastructure_dependencies:
  - >-
    aws_iam_role_policy.github_settings_apply and aws_iam_role_policy.github_settings_preview (terraform/bootstrap):
    one added read-only statement each (ProviderMirrorGithubRead), applied post-merge by the human-directed bootstrap
    apply of VP 13 (Decision 248 cl.6; deploy-paths.yaml admin_out_of_band.github_settings_apply_provisioning). Before
    it, the mirror step degrades (AccessDenied) and both jobs fetch directly as today, so merge order against the apply
    never breaks a run.
acceptance_criteria:
  - "With the grant live and the locked package in the mirror, both jobs export TF_CLI_CONFIG_FILE to a tfrc serving only integrations/github from the mirror and init installs it with no github.com fetch; the preview job is observed live (VP 14), the apply job by the same step and guard n (it runs only when there is something to apply)."
  - "A missing grant, a missing or unreadable package, an unparsed lockfile, an unset variable, another OS or CPU, a copy timeout, a package whose hash the lockfile lacks or a failed tfrc or GITHUB_ENV write each degrade to today's direct fetch with a printed reason and exit 0; the mirror step never fails a job."
  - "A failed init prints one named class (provider_install, backend or other) and never terraform's output; the mirror step never prints AWS error text."
  - "Each role gains exactly s3:GetObject on tf-provider-mirror/registry.terraform.io/integrations/github/* and nothing else; the bootstrap apply changes only those two inline policies."
  - "The Decision 248 update and the CODEOWNERS line ship word for word as the operator approved them (Decision 246); the two policy statements match the IAM wording the operator approved at planning, confirmed by his final-diff word."
  - "rec-5005's acceptance passes and rec-5005 closes from the build's Resolves trailer."
verification_plan:
  - step: 1
    phase: pre-deploy
    action: The fetch activates a mirror-only tfrc from the exact locked package.
    command: bin/venv-python -m pytest "tests/test_terraform_github_apply_mirror.py::test_fetch_active_writes_a_mirror_only_tfrc" -q
    expected: exit 0; red before (file absent).
    fix_if: TF_CLI_CONFIG_FILE is not exported, the key names another version or OS/CPU target, or the tfrc routes another address
    hermetic: true
    expected_literals: [" passed"]
    graduation: graduate
    graduation_check_id: tf-github-apply-mirror-active
  - step: 2
    phase: pre-deploy
    action: Every degradation falls back to a direct fetch and exits 0 under the workflow's bash -e shell.
    command: bin/venv-python -m pytest "tests/test_terraform_github_apply_mirror.py::test_fetch_degrades_and_exits_zero" -q
    expected: exit 0; red before (file absent).
    fix_if: a case exports TF_CLI_CONFIG_FILE, exits non-zero, prints no reason, or a hash mismatch leaves the zip in place
    hermetic: true
    expected_literals: [" passed"]
    graduation: graduate
    graduation_check_id: tf-github-apply-mirror-fail-open
  - step: 3
    phase: pre-deploy
    action: The fetch never prints AWS error text (public log; Decision 101).
    command: bin/venv-python -m pytest "tests/test_terraform_github_apply_mirror.py::test_fetch_never_prints_aws_error_text" -q
    expected: exit 0; red before (file absent).
    fix_if: the synthetic account digits or ARN reach stdout or stderr
    hermetic: true
    expected_literals: [" passed"]
    graduation: graduate
    graduation_check_id: tf-github-apply-mirror-no-aws-text
  - step: 4
    phase: pre-deploy
    action: A failed init is classified by name, never echoed.
    command: bin/venv-python -m pytest "tests/test_terraform_github_apply_mirror.py::test_classify_names_a_class_and_never_the_log" -q
    expected: exit 0; red before (file absent).
    fix_if: a wrong class, more than one line, or any log text in the output
    hermetic: true
    expected_literals: [" passed"]
    graduation: graduate
    graduation_check_id: tf-github-apply-init-failure-class
  - step: 5
    phase: pre-deploy
    action: The guard pins each role's mirror grant to the exact one-namespace read.
    command: bin/venv-python -m pytest "tests/checks/ci_guards/test_validate_github_settings_apply.py::test_h_the_mirror_grant_is_exact" -q
    expected: exit 0; red before (node absent; the pre-change guard has no mirror grant).
    fix_if: a widened, added-to or missing statement passes h
    hermetic: true
    expected_literals: [" passed"]
    graduation: graduate
    graduation_check_id: github-settings-mirror-grant-exact
  - step: 6
    phase: pre-deploy
    action: The guard pins each job's mirror step before init and both classify calls (the preview plan step's and the apply script's).
    command: bin/venv-python -m pytest "tests/checks/ci_guards/test__github_settings_mirror.py::test_n_each_job_fetches_the_mirror_before_init" -q
    expected: exit 0; red before (node absent).
    fix_if: a misplaced or missing mirror step, or either dropped classify call, passes n
    hermetic: true
    expected_literals: [" passed"]
    graduation: graduate
    graduation_check_id: github-settings-mirror-step-wiring
  - step: 7
    phase: pre-deploy
    action: The touched and neighbouring suites in full.
    command: bin/venv-python -m pytest tests/test_terraform_github_apply_mirror.py tests/checks/ci_guards/test__github_settings_mirror.py tests/test_terraform_github_apply_script.py tests/checks/ci_guards/test_validate_github_settings_apply.py tests/checks/ci_guards/test_validate_trusted_plan_environment.py tests/test_terraform_github_apply_gate.py tests/checks/ci_guards/test__workflow_shell_bodies.py -q
    expected: exit 0
    fix_if: a pre-existing node fails (fix the code, never the node; Decision 235)
    hermetic: true
    expected_literals: [" passed"]
    graduation: waive
    graduation_waiver_reason: Whole-file re-runs of suites already in the --pre pytest_diff set and graduated elsewhere (the new apply-script node rides the existing whole-file shard terraform-github-apply-script); steps 1-6 carry the other new durable regressions. test_n_check_workflow_appends_the_mirror_wiring is not graduated; it runs in --pre whenever the guard or helper changes, and the real-tree green path is graduated through github-settings-apply-guard-ci.
  - step: 8
    phase: pre-deploy
    action: The registered guards that read these files pass, the bootstrap root is formatted, and the build's always-ask edits match the approved sidecar.
    command: >-
      bin/venv-python -c "from scripts.checks.ci_guards.validate_github_settings_apply import validate_github_settings_apply as f; failed=[]; f(failed); raise SystemExit(1 if failed else 0)" && bin/venv-python -c "from scripts.checks.ci_guards.validate_trusted_plan_environment import validate_trusted_plan_environment as f; failed=[]; f(failed); raise SystemExit(1 if failed else 0)" && bin/venv-python -c "from scripts.checks.ci_guards.validate_composite_action_shell_bodies import validate_composite_action_shell_bodies as f; failed=[]; f(failed); raise SystemExit(1 if failed else 0)" && terraform fmt -check -recursive terraform/bootstrap && bin/venv-python -m scripts.roadmap.approved_text verify --slug terraform-github-apply-provider-mirror --base origin/main && bin/venv-python -c "from scripts.checks.deps.validate_pre_glob_closure import validate_pre_glob_closure as f; failed=[]; f(failed); raise SystemExit(1 if failed else 0)"
    expected: >-
      exit 0; the trusted-plan guard's (h) accepts the new script because it is code-owned; approved_text verify
      reports every block applied word for word; validate_pre_glob_closure passes (the helper the guard imports is
      in its Entry's pre_globs).
    fix_if: a guard fails (fix the code to the plan), fmt differs (run terraform fmt), or verify names a differing block (match the sidecar, never edit it)
    hermetic: false
    graduation: waive
    graduation_waiver_reason: Registered fast-tier guards plus the merge-step approved-text verify; nothing here is a new regression to graduate.
  - step: 9
    phase: pre-deploy
    action: ADMIN credential check (deploy-paths.yaml admin_out_of_band.pre_merge_live_plan ENVIRONMENT CHECK).
    command: bin/venv-python -m scripts.aws_identity caller-arn --profile agent_platform_admin 2>/dev/null | grep -q 'assumed-role/PlatformAdmin/' && echo ADMIN_CHAIN_OK || echo ADMIN_CHAIN_ABSENT
    expected: ADMIN_CHAIN_OK; on ADMIN_CHAIN_ABSENT the PR waits at CI-green for an ADMIN session to run steps 10-11.
    fix_if: ADMIN_CHAIN_ABSENT in a session expected to hold admin credentials; report it, never widen
    hermetic: false
    graduation: not-applicable
  - step: 10
    phase: pre-deploy
    action: >-
      Pre-merge read-only ADMIN plan of terraform/bootstrap at the PR's CI-green head (export PR_HEAD_SHA=<the PR
      head sha from pull_request_read> first; the bootstrap backend names no profile, so the step runs on the ADMIN
      session's ambient admin credential chain), compared with main's own plan:
      the head's state-changing rows must be exactly the two inline-policy updates, each adding only
      ProviderMirrorGithubRead in the planned shape with every other statement equal by Sid; main's plan must be
      empty. Plan files are deleted in the step; the two rendered policies are kept for step 11. Errors go to a local
      log, never posted.
    command: >-
      set -o pipefail; R=$(tr -d '[:space:]' < config/aws-region); E="${TMPDIR:-/tmp}/gsm-evidence"; ok=0;
      CHK="import json,sys; d,h=sys.argv[1],sys.argv[2]; L=lambda v: v if isinstance(v, list) else [v]; S=lambda s: {x.get('Sid'): {k: (sorted(L(v)) if k in ('Action', 'Resource') else v) for k, v in x.items()} for x in L(json.loads(s or '{}').get('Statement', []))}; rows=lambda p: sorted(r['address']+':'+'/'.join(r['change']['actions'])+(':import' if r['change'].get('importing') is not None else '')+(':moved' if r.get('previous_address') else '') for r in p.get('resource_changes', []) if r['change']['actions'] != ['no-op'] or r['change'].get('importing') is not None or r.get('previous_address')); m=json.load(open(d+'/origin-main.json')); p=json.load(open(d+'/'+h+'.json')); want=['aws_iam_role_policy.github_settings_apply:update', 'aws_iam_role_policy.github_settings_preview:update']; G='ProviderMirrorGithubRead'; NEW={'Sid': G, 'Effect': 'Allow', 'Action': ['s3:GetObject'], 'Resource': ['arn:aws:s3:::agent-platform-data-lake/tf-provider-mirror/registry.terraform.io/integrations/github/*']}; ch={r['address']: r for r in p.get('resource_changes', []) if r['address'] in ('aws_iam_role_policy.github_settings_apply', 'aws_iam_role_policy.github_settings_preview')}; ok=all(S(r['change']['after']['policy']).get(G) == NEW and {k: v for k, v in S(r['change']['after']['policy']).items() if k != G} == S(r['change']['before']['policy']) for r in ch.values()) and len(ch) == 2; [open(d+'/'+a.split('.')[1]+'.policy.json', 'w').write(r['change']['after']['policy']) for a, r in ch.items()]; print('HEAD_ROWS', rows(p)); print('MAIN_ROWS', len(rows(m)), rows(m)); print('SID_CHECK_OK' if ok and rows(p) == want and not rows(m) else 'SID_CHECK_MISMATCH')";
