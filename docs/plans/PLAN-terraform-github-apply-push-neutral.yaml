  - 'red_overlap (2026-11-08, 6d1d1f14): {"verdict": "clear", "slo_hours": 4, "reds": []}'
gate_rounds:
  - {gate: decision-scout, round: 1, verdict: FLAGS_FOUND}
  - {gate: plan-critique, round: 1, verdict: REVISE, blocking: 3, nits: 6}
pre_implementation_checklist:
  - Branch confirmed not on main
  - docs/PROJECT_CONTEXT.md read
  - Decisions 77, 235 and 248 sections read
  - All files in scope located and readable
  - Acceptance criteria understood and verifiable
execution_steps:
  - "Gate: add event_name to preview() and --event-name to the preview subparser; the push-neutral branch; docstring text from context. Tests in TestPreview and TestCli as the scope row lists; run VP 1, 2 and 4."
  - "Workflow: EVENT_NAME env and the argument on the existing --github-output line; header text from context. Fence predicate (m) and its docstring line; test_m_gate_step_event_wiring; run VP 3, 4 and 5."
  - "Add the registry shards for VP 1-3 (check ids as named); run VP 6, then VP 7 (the full tier) from the top-level session, reading only its --verify-head attestation."
  - "Open the PR (body names rec-4980 and the deferred CLAUDE.md follow-on); merge on code review PROCEED, green CI and the operator's final-diff word, squash body carrying Resolves: rec-4980; then VP 8 and VP 9."
  - "Report: what was implemented, verification results"
rollback: Revert the build PR; the push run returns to failing on an unnamed gate change, which is safe (fail closed).
