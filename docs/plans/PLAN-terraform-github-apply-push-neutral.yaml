schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: terraform-github-apply-push-neutral
intent: >-
  Stop the terraform-github-apply push run from putting a false red X on main whenever a merge changes a gate
  resource (rec-4980): a push run's preview now ends neutral, with a warning naming the addresses to dispatch with,
  while a dispatch run keeps failing closed and the apply's own refusal is unchanged, so main's status reads true
  without loosening the one-tap apply gate (Decision 248).
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-terraform-github-apply-push-neutral.yaml
phase: >-
  ad_hoc_rec (rec-4980), a false-alarm fix on the Decision 248 CI apply; no tier_item is targeted and no exit
  criterion is closed, so closes_criteria is empty.
closes_criteria: []
scope:
  - file: scripts/ci/terraform_github_apply_gate.py
    action: Modify
    purpose: >-
      preview() takes event_name (default ""); the preview subparser gains --event-name (default "", no choices, so a
      bad value keeps exit 1 with the marker rather than argparse's exit 2). When event_name == "push" and
      dispatched_input is false, an unnamed gate row returns exit 0 and stdout of the table, then the line
      `TF_GITHUB_APPLY_PREVIEW verdict=<verdict> rows=<n> has_changes=false`, then as the last line
      `::warning::TF_GITHUB_APPLY_GATE_CHANGE_UNNAMED <a,b> push run ends without applying; a dispatch of
      terraform-github-apply with gate_change=<a,b> is owed` (the same comma-joined list twice), with GITHUB_OUTPUT text
      exactly "has_changes=false\n" (no reviewed=). Every other event value (workflow_dispatch, "", anything else)
      keeps today's exit 1, marker line and empty output. check(), rows(), Unreadable handling and the probe paths are
      unchanged. Docstring lines 10-11 replaced with the text in context (Fable item 6).
    new_imports: []
  - file: .github/workflows/terraform-github-apply.yml
    action: Modify
    purpose: >-
      The preview job's gate step gains env `EVENT_NAME: ${{ github.event_name }}` and passes `--event-name
      "$EVENT_NAME"` placed on the existing `--github-output "$GITHUB_OUTPUT"` continuation line, so the run body stays
      at its 12 effective lines (config/composite_action_body_baseline.yaml preview::gate, no ceiling change). Header
      comment lines 9-10 replaced with the text in context. No other job, trigger, permission or step changes.
    new_imports: []
  - file: scripts/checks/ci_guards/validate_github_settings_apply.py
    action: Modify
    purpose: >-
      New predicate (m) and its docstring line: the preview job's step with id gate declares env EVENT_NAME exactly
      `${{ github.event_name }}` and its run body contains `--event-name "$EVENT_NAME"`; a missing step, env entry or
      argument is a violation. Called from check_workflow alongside the step predicates; the PASS line (:533) reads
      predicates (a)-(m). Must stay under the 500
      effective-SLOC cap (468 of 500 at 6d1d1f14, unregistered in config/sloc_budgets.yaml); adds no import.
    new_imports: []
  - file: tests/test_terraform_github_apply_gate.py
    action: Modify
    purpose: >-
      Add to TestPreview: test_a_push_run_with_an_unnamed_gate_change_ends_neutral (the rec's acceptance node; push,
      dispatched false, the five gate-row cases of test_an_unnamed_gate_row_stops_before_asking: rc 0, gh exactly
      "has_changes=false\n", last line the warning naming the address twice, preceded by the TF_GITHUB_APPLY_PREVIEW line with has_changes=false); test_a_push_run_with_mixed_rows_skips_the_apply
      (an unnamed gate row plus _repo_update: rc 0, has_changes=false); test_a_non_push_run_with_an_unnamed_gate_change_fails_closed
      parametrized over workflow_dispatch, "", pull_request and PUSH, each with dispatched_input False (so only
      event_name can keep it closed; rc 1, gh "", marker line unchanged);
      test_a_push_run_with_a_dispatch_input_fails_closed (push plus dispatched_input True: rc 1). Add to TestCli:
      test_a_push_preview_writes_only_has_changes_false (--event-name push: rc 0, file text exactly "has_changes=false\n",
      stdout holds the warning) and test_an_unreadable_plan_on_push_still_fails (rc 1, TF_GITHUB_APPLY_PLAN_UNREADABLE).
      Existing nodes, test_an_unnamed_gate_row_stops_before_asking and test_preview_writes_no_output_when_it_stops
      included, stay byte-identical (Decision 235).
  - file: tests/checks/ci_guards/test_validate_github_settings_apply.py
    action: Modify
    purpose: >-
      test_m_gate_step_event_wiring, parametrized mutations of the real-tree wf fixture: the EVENT_NAME env entry
      dropped, set to `${{ inputs.gate_change }}`, the --event-name argument dropped, and the gate step id renamed; each
      yields exactly one "m:" violation. The real-tree green nodes stay unchanged and now cover (m).
bundled_recommendations: [rec-4980]
followon_recs: [rec-5002]
infrastructure_dependencies: []
acceptance_criteria:
  - "A push-event preview with an unnamed gate change exits 0, prints the ::warning:: line naming the addresses and the gate_change to dispatch with, and writes only has_changes=false, so the apply job is skipped."
  - "A workflow_dispatch preview (inputs empty or not), an empty event name and any other event value keep exit 1, the TF_GITHUB_APPLY_GATE_CHANGE_UNNAMED marker and no GITHUB_OUTPUT, exactly as before."
  - "check(), Unreadable handling and every pre-existing test node are unchanged; the push path never writes reviewed=."
  - "The workflow passes the event through env (fence (m) pins it), preview::gate stays at 12 effective lines, and the fence stays under 500 effective SLOC."
  - "The merge's push run of terraform-github-apply succeeds with its TF_GITHUB_APPLY_PREVIEW verdict line (printed on both the ordinary and the neutral path) and a skipped apply; rec-4980 is closed by the Resolves trailer."
verification_plan:
  - step: 1
    phase: pre-deploy
    action: The rec's acceptance node.
    command: bin/venv-python -m pytest "tests/test_terraform_github_apply_gate.py::TestPreview::test_a_push_run_with_an_unnamed_gate_change_ends_neutral" -q
    expected: exit 0; red before (node absent, pytest exit 4).
    fix_if: rc is 1, GITHUB_OUTPUT holds reviewed= or has_changes=true, or the warning line does not name the address
    hermetic: true
    expected_literals: [" passed"]
    graduation: graduate
    graduation_check_id: terraform-github-apply-push-neutral
  - step: 2
    phase: pre-deploy
    action: Fail-closed cases for every non-push event and for push with a dispatch input.
    command: bin/venv-python -m pytest "tests/test_terraform_github_apply_gate.py::TestPreview::test_a_non_push_run_with_an_unnamed_gate_change_fails_closed" "tests/test_terraform_github_apply_gate.py::TestPreview::test_a_push_run_with_a_dispatch_input_fails_closed" -q
    expected: exit 0; red before (nodes absent).
    fix_if: any non-push event, a case variant of push, or push with a dispatch input ends neutral
    hermetic: true
    expected_literals: [" passed"]
    graduation: graduate
    graduation_check_id: terraform-github-apply-dispatch-fails-closed
  - step: 3
    phase: pre-deploy
    action: Fence predicate (m) on mutations of the real workflow.
    command: bin/venv-python -m pytest "tests/checks/ci_guards/test_validate_github_settings_apply.py::test_m_gate_step_event_wiring" -q
    expected: exit 0; red before (node absent).
    fix_if: a mutation yields no m violation, or more than one
    hermetic: true
    expected_literals: [" passed"]
    graduation: graduate
    graduation_check_id: github-settings-apply-event-wiring
  - step: 4
    phase: pre-deploy
    action: Both touched suites in full, the real-tree fence and CLI cases included.
    command: bin/venv-python -m pytest tests/test_terraform_github_apply_gate.py tests/checks/ci_guards/test_validate_github_settings_apply.py tests/test_terraform_github_apply_script.py -q
    expected: exit 0
    fix_if: a pre-existing node fails (fix the code, never the node; Decision 235)
    hermetic: false
    graduation: waive
    graduation_waiver_reason: Whole-file re-runs of suites already in the --pre pytest_diff set; their graduated shards terraform-github-apply-gate, terraform-github-apply-script, github-settings-apply-guard and github-settings-apply-guard-ci are kept unchanged.
  - step: 5
    phase: pre-deploy
    action: The run-body ratchet still passes with no baseline change.
    command: bin/venv-python -c "from scripts.checks.ci_guards.validate_composite_action_shell_bodies import validate_composite_action_shell_bodies as f; failed=[]; f(failed); raise SystemExit(1 if failed else 0)" && git diff --exit-code origin/main -- config/composite_action_body_baseline.yaml
    expected: exit 0; the baseline file is unchanged against origin/main.
    fix_if: preview::gate GREW past 12 effective lines (move the argument onto an existing line; never raise the ceiling)
    hermetic: false
    graduation: waive
    graduation_waiver_reason: The ratchet is already a registered fast-tier check (validate_composite_action_shell_bodies); this step only confirms this diff leaves its baseline alone.
  - step: 6
    phase: pre-deploy
    action: Fence size stays under the cap.
    command: bin/venv-python -m scripts.roadmap.plan_obligations --plan docs/plans/PLAN-terraform-github-apply-push-neutral.yaml
    expected: the scripts/checks/ci_guards/validate_github_settings_apply.py row reads below 500 of 500 SLOC (a NEAR_CAP tag above 475 is advisory and acceptable; OVER_CAP is not)
    fix_if: the fence is at or over its cap (tighten the predicate; decompose before any raise, Decision 128)
    hermetic: false
    graduation: not-applicable
  - step: 7
    phase: pre-deploy
    action: Full tier, then HEAD attestation, before the build commit and push (handoff_policy); start it from the top-level session, backgrounded with a 2 h limit, and read only the attestation.
    command: bin/venv-python -m scripts.validate && bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: the full tier exits 0 and the validation result attests the current HEAD's tree
    fix_if: any failure -- fix and rerun the full tier from the start
    hermetic: false
    graduation: waive
    graduation_waiver_reason: A whole full-tier run; graduate steps may not invoke scripts.validate (recursion), and steps 1-3 carry the durable regressions.
  - step: 8
    phase: post-deploy
    action: Read the merge's push run of terraform-github-apply (the build PR touches the workflow and gate paths).
    command: mcp__github__actions_list(owner=otl-labs, repo=ontheloop, method=list_workflow_runs, resource_id=terraform-github-apply.yml), pick the push run on the merge SHA, then mcp__github__actions_list(method=list_workflow_jobs, resource_id=<run id>) and mcp__github__get_job_logs on its preview job, grepping 'TF_GITHUB_APPLY_PREVIEW verdict=' and 'TF_GITHUB_APPLY_GATE_CHANGE_UNNAMED'
    expected: >-
      conclusion success; the preview log carries TF_GITHUB_APPLY_PREVIEW verdict=NO_CHANGES (or, if main's plan holds
      an unnamed gate change, the ::warning:: line); the apply job is skipped and no approval was requested. Record
      the run id.
    fix_if: the preview fails on argument parsing (the --event-name wiring) or the apply job waits for approval; fix on a new branch. Never manufacture a gate change to exercise the neutral branch.
    hermetic: false
  - step: 9
    phase: post-deploy
    action: rec-4980 closed by the squash-merge Resolves trailer.
    command: bin/venv-python -c "from src.common import ducklake_reader_client as c; rows,_=c.fetch_recs_by_ids(c.make_reader(),['rec-4980']); print(rows[0]['status'], rows[0].get('resolution'))"
    expected: status closed; the resolution names the merge SHA.
    fix_if: still open after ci.yml's closure job ran (read that job's log; the trailer must be in the squash body)
    hermetic: false
test_obligations:
  - source: scripts/ci/terraform_github_apply_gate.py
    behavior: a push run's unnamed gate change ends neutral with has_changes=false only; every other event fails closed
    verification_step: 1
    test_selector: tests/test_terraform_github_apply_gate.py::TestPreview::test_a_push_run_with_an_unnamed_gate_change_ends_neutral
    red_green_expectation: red before (node absent; the code it exercises returns exit 1), green after
  - source: .github/workflows/terraform-github-apply.yml
    behavior: the gate step passes github.event_name through env to --event-name
    verification_step: 3
    test_selector: tests/checks/ci_guards/test_validate_github_settings_apply.py::test_m_gate_step_event_wiring
    red_green_expectation: red before (node absent), green after; the real-tree fence node fails if the wiring is removed
  - source: scripts/checks/ci_guards/validate_github_settings_apply.py
    behavior: predicate (m) flags a missing or wrong EVENT_NAME env entry or --event-name argument
    verification_step: 3
    test_selector: tests/checks/ci_guards/test_validate_github_settings_apply.py::test_m_gate_step_event_wiring
    red_green_expectation: red before (node absent), green after
constraints:
  - "Apply authorization is unchanged (Decisions 77, 248): only a dispatch naming the gate change, past the tf-gated-apply approval, applies; check() is untouched."
  - "Never loosen or edit an existing test node to get green (Decision 235). No existing assertion changes; if validate_weakening_candidates lists one, its disposition is planned-change citing acceptance criterion 2 (dispatch and check() still fail closed), never weakening."
  - "No run-body ceiling raise and no SLOC budget raise."
  - "The workflow, gate and fence are CODEOWNERS / fenced security code, so the build PR merges only on code review PROCEED, green CI and the operator's final-diff word."
  - "No rescue agents or workaround loops (Decision 55)."
