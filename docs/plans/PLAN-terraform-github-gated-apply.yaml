schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: terraform-github-gated-apply
intent: >-
  Give terraform/github (the repository's ruleset, Environments and Actions settings) a CI apply path behind one
  operator approval, so the root is CI-applied like every other root (Decision 126). The operator had already judged
  this best practice and deferred it; a harness change that stopped agent sessions applying the root brings it
  forward, and its first run creates the merged approved-text Environment (Decision 246, rec-4769).
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-terraform-github-gated-apply.yaml
phase: >-
  ad_hoc_rec (soft-warn exception category) -- rec-4964, filed at planning: the operator chose a gated CI apply on
  2026-11-06 (thread "Roll out approved-wording GitHub approvals") after a harness change stopped agent sessions
  applying terraform/github; it unblocks rec-4769's VP 11-14.
scope:
  - file: terraform/bootstrap/github_settings_apply.tf
    action: Create
    purpose: >-  # pragma: allowlist secret -- names a Secrets Manager entry, not a value
      PR 1. data.aws_secretsmanager_secret.github_apply_app (name agent-platform-terraform-github-apply-app; metadata
      only, the platform_dev_policies.tf precedent; no value read, Decision 237 cl.3) and
      local.github_settings_workflow_refs = ["otl-labs/ontheloop/.github/workflows/terraform-github-apply.yml@refs/heads/main"].
      aws_iam_role.github_settings_apply (name github-settings-apply, outside the agent-platform-* family so no CI
      identity's IAM grant reaches it; permissions_boundary aws_iam_policy.github_ci_apply_boundary.arn; trust ONE
      statement, StringEquals only: aud sts.amazonaws.com, sub
      flatten([for repo in local.github_repos : ["repo:${repo}:environment:${local.github_settings_gate_env}"]]) with
      local.github_settings_gate_env = "tf-gated-apply" until rec-4965, job_workflow_ref
      local.github_settings_workflow_refs). aws_iam_role_policy.github_settings_apply: AppKeyRead
      (secretsmanager:GetSecretValue on the data source's arn), TfstateGithubObject (s3:GetObject, s3:PutObject on
      tfstate/github/terraform.tfstate), TfstateGithubLock (s3:GetObject, s3:PutObject, s3:DeleteObject on its .tflock);
      no s3:ListBucket (the backend needs none: probe in context, re-proven pre-merge by VP 6), no iam: action, nothing
      else. aws_iam_role.github_settings_preview (name github-settings-preview, same boundary; trust ONE statement,
      StringEquals only: aud, sub environment:tf-trusted-plan, job_workflow_ref the same local) and
      aws_iam_role_policy.github_settings_preview (TfstateGithubRead: s3:GetObject on tfstate/github/terraform.tfstate
      only; the preview plans -lock=false). Each inline policy carries the lifecycle precondition holding its minified
      form under 10,240 B (validate_iam_policy_size). aws_secretsmanager_secret_policy.github_settings_apply_key on the
      data source's arn: one Deny statement, Principal "*", NotAction [secretsmanager:DescribeSecret,
      secretsmanager:GetResourcePolicy, secretsmanager:ListSecretVersionIds], Resource "*", ArnNotLike aws:PrincipalArn
      [role/github-settings-apply, role/PlatformAdmin, user/platform-breakglass, the account root] built from
      var.account_id; block_public_policy true; no Allow statement; depends_on aws_iam_role_policy.platform_admin_ops,
      whose new statement lets PlatformAdmin put and delete it. The header cites Decision {{N}}.
  - file: terraform/bootstrap/platform_admin_policies.tf
    action: Modify
    purpose: >-  # pragma: allowlist secret -- names a Secrets Manager entry, not a value
      PR 1 (critique round 2 B1: PlatformAdmin's live identity is refused secretsmanager:PutResourcePolicy and
      DeleteResourcePolicy, so it could neither create nor remove the key policy). AdminOps gains one statement, Sid
      GithubApplyKeyResourcePolicy: Allow secretsmanager:PutResourcePolicy and secretsmanager:DeleteResourcePolicy on
      "arn:aws:secretsmanager:${var.aws_region}:${var.account_id}:secret:agent-platform-terraform-github-apply-app-??????"
      only: the exact-suffix literal (six characters, never -*), not the data source, so a plan or recovery of AdminOps
      never depends on the entry existing; predicate (h) pins it (the adoption test's -* scan covers other files).
      SecretsManagerAdmin, IAMFull and both preconditions are unchanged (tests/test_secret_parameters_bootstrap.py
      pins SecretsManagerAdmin); the existing 10,240 B precondition covers the statement (AdminOps measured 4,464 B
      minified live at planning). The header's zero-diff-import line gains that this statement was added after adoption
      (Decision {{N}}). Its graduated shards platform-iam-bootstrap-owns-roles-and-policies, platform-iam-admin-root-only
      and secret-parameters-bootstrap-grants are kept unchanged.
  - file: scripts/checks/ci_guards/validate_github_settings_apply.py
    action: Create
    purpose: >-
      Standing guard (fast tier); predicates over parsed workflows and Terraform text so red cases run on synthetic
      input. PR 1 lands (a), (g) and (h); PR 2 adds the rest. (a) No workflow or composite action except
      terraform-github-apply.yml names github-settings-apply, github-settings-preview, the apply App secret name or
      scripts/ci/terraform_github_apply.sh. (b) Its on: keys are exactly push (branches [main]) and workflow_dispatch.
      (c) The apply job declares a literal environment equal to GATE_ENV and is the only job assuming
      github-settings-apply; the preview job declares exactly tf-trusted-plan, assumes only github-settings-preview and
      is the only job that reads the plan App key. (d) Both jobs' if require refs/heads/main and apply needs preview.
      (e) Every checkout takes no ref or repository and sets persist-credentials false. (f) Every non-local uses: in
      both jobs is a 40-hex SHA. (g) Each role's trust has exactly one statement, StringEquals only, sub values only of
      the environment:<GATE_ENV> form (the preview role: environment:tf-trusted-plan) and job_workflow_ref exactly
      local.github_settings_workflow_refs, which is the one main ref. (h) The apply role's policy has no iam: action
      and no resource outside the three named; the preview role's policy is exactly its one GetObject; both carry the
      size precondition; the secret policy is one Deny with exactly the three metadata verbs as NotAction and exactly
      the four principals excepted, Resource "*", a Condition holding only ArnNotLike on aws:PrincipalArn, and
      depends_on AdminOps; AdminOps' GithubApplyKeyResourcePolicy grants exactly the two resource-policy verbs on the
      exact-suffix literal ARN of the apply App entry and nothing else. (i) .github/CODEOWNERS covers the
      workflow, both scripts, scripts/ci/quiet_run.sh (the apply job runs it with the token in its environment), the
      reporter, its plan_names_core.py and this file. (j) No inputs.* or needs.* expression appears inside a run:
      body. (k) The tf_github_apply Environment is main-only with can_admins_bypass false and prevent_destroy. (l)
      Every resource type declared under terraform/github is in the gate's GATE_TYPES or NON_GATE_TYPES, read from
      scripts/ci/terraform_github_apply_gate.py by path, so a new type needs a deliberate classification.
      registry.examined(n, unit="invariants"). Reuses validate_trusted_plan_environment's parsing helpers by import;
      estimate under 400 SLOC (its nine-predicate sibling is 432).
    new_imports: [scripts.checks.ci_guards.validate_trusted_plan_environment]
  - file: scripts/checks/ci_guards/_manifest.py
    action: Modify
    purpose: >-
      PR 1. Entry validate_github_settings_apply, pre=True, pre_globs .github/workflows/**, .github/actions/**,
      .github/CODEOWNERS, terraform/bootstrap/github_settings_apply.tf, terraform/bootstrap/platform_admin_policies.tf,
      terraform/github/*.tf, scripts/ci/terraform_github_apply*, scripts/ci/quiet_run.sh, the check file, scripts/checks/ci_guards/validate_trusted_plan_environment.py
      (its import), scripts/verify_ci_workflow/**, scripts/checks/_common.py, scripts/checks/registry.py; full_segment
      full_after_lint.
  - file: tests/checks/ci_guards/test_validate_github_settings_apply.py
    action: Create
    purpose: >-
      PR 1 (extended in PR 2). One red case per predicate on synthetic input, the manifest registration, and the real
      tree green; plus pins that the ci_rca_taxonomy rows exist, deploy-paths.yaml
      admin_out_of_band.github_settings_apply_provisioning names both roles (PR 1), secret-material-handling.yaml
      domains names the apply App entry and its resource policy (PR 1), and environment-taxonomy.yaml
      axis_a.github.apply_gating names terraform-github-apply.yml while keeping the NEVER auto-apply and
      terraform-github-plan.yml words test_taxonomy_row reads (PR 2).
  - file: config/ci_rca_taxonomy.yaml
    action: Modify
    purpose: >-
      PR 1: one row for validate_github_settings_apply beside validate_trusted_plan_environment. PR 2: a workflows: row
      terraform-github-apply {tier: not_a_gate, ci_rca: excluded, owner: platform}, rationale: operator-gated apply
      dispatched or pushed from main; waiting, rejected and cancelled runs and a preview that stops on an unnamed gate
      change are expected states read by the dispatching agent, like approved-text-approval. NEAR_CAP: measure against
      main at each build and compact an existing row's wording (words unchanged) if a row does not fit.
  - file: tests/checks/iam_tf/test_platform_role_metadata_admin_scope.py
    action: Modify
    purpose: PR 1. Scan terraform/bootstrap/github_settings_apply.tf too (Decision 225 cl.5 names a bootstrap CI identity other than the apply role as an unenforced residual), and add it to test_scanned_set_is_non_empty_and_every_expected_file_present. Its graduated shard platform-admin-absent-from-ci-write-patterns is kept unchanged.
  - file: .github/CODEOWNERS
    action: Modify
    purpose: >-
      PR 1: /scripts/checks/ci_guards/validate_github_settings_apply.py. PR 2: /scripts/ci/terraform_github_apply.sh,
      /scripts/ci/terraform_github_apply_gate.py and /scripts/ci/terraform_github_plan_report.py
      (/scripts/ci/plan_names_core.py and /scripts/ci/quiet_run.sh are already owned, so predicate (i) only pins them;
      the workflow is covered by /.github/workflows/terraform-*.yml, the roles by /terraform/bootstrap/).
  - file: docs/DECISIONS.md
    action: Modify
    purpose: PR 1. Insert the approved Decision (W1); number filled at implementation per decision-entry.yaml number_assignment; regenerate docs/decisions-index.json.
  - file: docs/contracts/deploy-paths.yaml
    action: Modify
    purpose: >-
      PR 1. admin_out_of_band.github_settings_apply_provisioning (W3) plus a new amendment_log entry. NEAR_CAP (492 of
