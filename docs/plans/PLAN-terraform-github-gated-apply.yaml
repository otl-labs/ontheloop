    command: >-  # pragma: allowlist secret -- names a Secrets Manager entry, not a value
      set -o pipefail; R=$(tr -d '[:space:]' < config/aws-region); E="${TMPDIR:-/tmp}/gsa-evidence"; ok=0;
      CHK="import json,sys; p=json.load(sys.stdin); rc=p.get('resource_changes', []); S=lambda s: {x.get('Sid'): x for x in (lambda t: t if isinstance(t, list) else [t])(json.loads(s or '{}').get('Statement', []))}; G='GithubApplyKeyResourcePolicy'; AO='aws_iam_role_policy.platform_admin_ops'; done=any(r['address'] == AO and r['change']['actions'] == ['no-op'] and G in S(r['change']['after']['policy']) for r in rc); w=sorted({x for x in sys.argv[1].split(',') if x} | (set() if done else {AO + ':update'})); ch=[r for r in rc if r['change']['actions'] != ['no-op'] or r['change'].get('importing') or r.get('previous_address')]; got=sorted(r['address']+':'+'/'.join(r['change']['actions'])+(':import' if r['change'].get('importing') else '')+(':moved' if r.get('previous_address') else '') for r in ch); ok=all(set(S(r['change']['after']['policy'])) - set(S(r['change']['before']['policy'])) == {G} and {k: v for k, v in S(r['change']['after']['policy']).items() if k != G} == S(r['change']['before']['policy']) for r in ch if r['address'] == AO); sys.exit(3 if not got and not w else 0 if got == w and ok else 1)";
      WB5="aws_iam_role.github_settings_apply:create,aws_iam_role_policy.github_settings_apply:create,aws_iam_role.github_settings_preview:create,aws_iam_role_policy.github_settings_preview:create,aws_secretsmanager_secret_policy.github_settings_apply_key:create"; test -n "$PR_HEAD_SHA" && rm -rf "${E:?}" && mkdir -p "$E" && git fetch origin main "$PR_HEAD_SHA" -q && ok=1 &&
