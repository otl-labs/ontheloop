bundled_recommendations: [rec-4964]
followon_recs: [rec-4965, rec-4966, rec-4967, rec-4968]
infrastructure_dependencies:
  - "terraform/bootstrap (PR 1): AdminOps' key-scoped resource-policy statement, the apply and preview roles, their inline policies and the key's resource policy (ordered after AdminOps by depends_on), applied post-merge untargeted from checked saved plans by a human-directed admin apply (Decision {{N}} cl.6); pre-merge read-only ADMIN plan and exact-policy probes required (deploy-paths.yaml admin_out_of_band.pre_merge_live_plan)."
  - "Secrets Manager: no value change; the existing operator-created entry gains a resource policy."
  - "GitHub (PR 2): no new App, secret or variable. The first approved dispatch creates approved-text and tf-github-apply with their main-only policies, gated by tf-gated-apply; rec-4965 then moves the workflow and the apply role's trust to tf-github-apply."
  - "Ordering: PR 1 merges, then VP 7's bootstrap apply; PR 2 merges only after VP 7 passes. PR 2's push run is expected to stop at the preview on its four unnamed gate creates; the approved dispatch of VP 13 applies them."
acceptance_criteria:
  - The gate passes every synthetic red/green case, including unnamed gate creates refused and probe-verdict parity, and no non-allowlisted plan value reaches stdout or GITHUB_OUTPUT (VP 8).
  - validate_github_settings_apply passes on the real tree and fails each predicate on a synthetic red case (VP 1); the apply script behaves as specified under stubs on every exit path (VP 9); touched suites stay green with no weakened assertion (VP 2, VP 10).
  - The pre-merge read-only ADMIN plan of terraform/bootstrap at PR 1's CI-green head adds exactly the two roles, their inline policies and the secret policy, updates only AdminOps, and changes nothing main's own plan does not, with main's own plan empty (MAIN_ROWS 0, imports and moved addresses counted) and VP 7's row check accepting the head's real plan (CHK_PREVIEW_OK); each rendered role policy, as a session policy, can init and read terraform/github's state, the apply policy grants the lock, the rendered AdminOps grants the two resource-policy verbs on the key and on no other secret, and the rendered key policy still allows PlatformAdmin and user/platform-breakglass and denies other roles (VP 4-6).
