      L=$(aws iam simulate-custom-policy --profile $P --policy-input-list "$(cat "$E/github_settings_apply.policy.json")" --action-names s3:GetObject s3:PutObject s3:DeleteObject --resource-arns arn:aws:s3:::agent-platform-data-lake/tfstate/github/terraform.tfstate.tflock --query 'EvaluationResults[].EvalDecision' --output text);
