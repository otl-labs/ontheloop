constraints:
  - Never print the apply App key, an installation token, a non-allowlisted plan value, an account id or an ARN (Decision 101); posted evidence is counts, names and allowlisted values only. No step reads the key's value into a session.
  - The apply App key is reachable only from the operator-approved apply job of main's workflow; no ungated job reads it.
  - No sidecar -- the approved-text Environment Decision 246 records approvals in does not exist until PR 2's first approved dispatch, so the always-ask wording (W1-W5) is approved inline in the planning thread, and the operator's final-diff word on each build PR binds it (Decision 246 cl.4; that word is needed anyway for IAM, CODEOWNERS paths and security code).
  - The bootstrap apply runs only on the operator's explicit word (Decision {{N}} cl.6), never self-directed.
  - No rescue agents or workaround loops (Decision 55); a refused gate is fixed in code, never bypassed.
