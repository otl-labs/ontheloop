rollback: >-
  Revert PR 2 except its two tf_github_apply Environment blocks, which stay (or become removed blocks with lifecycle
  destroy = false), since prevent_destroy guards only a block still in config. Then remove PR 1's bootstrap resources
  by two human-directed untargeted admin applies (Decision 223 cl.2): first a PR deleting the key policy, the roles,
  their policies, guard predicates (g) and (h) and the admin-scope scan entry (PlatformAdmin's scoped grant deletes
  the key policy), then one removing AdminOps' statement, so the grant outlives the policy it removes. If
  PlatformAdmin is ever refused on the key, the account root and user/platform-breakglass stay excepted for the
  operator's break-glass lane. The CloudShell lane in terraform/github/CLAUDE.md stays usable throughout.
