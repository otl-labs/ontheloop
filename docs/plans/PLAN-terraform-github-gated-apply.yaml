      kp role/PlatformAdmin allowed && kp user/platform-breakglass allowed && kp role/agent-platform-github-ci-apply explicitDeny && kp role/PlatformDev explicitDeny && echo KEY_POLICY_PREVIEW_OK || echo KEY_POLICY_PREVIEW_MISMATCH; rm -f "${E:?}"/*.policy.json
    expected: >-
