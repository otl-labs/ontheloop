      bin/venv-python -c "import json,sys; e,t=sys.argv[1],sys.argv[2]; p=json.load(open(e+'/p.json')); rc=p.get('resource_changes', []); json.dump(sorted([r['address'], '/'.join(r['change']['actions'])+(':import' if r['change'].get('importing') else '')+(':moved' if r.get('previous_address') else '')] for r in rc if r['change']['actions'] != ['no-op'] or r['change'].get('importing') or r.get('previous_address')), open(e+'/'+t+'.json','w')); keep={'aws_iam_role_policy.github_settings_apply': 'github_settings_apply', 'aws_iam_role_policy.github_settings_preview': 'github_settings_preview', 'aws_iam_role_policy.platform_admin_ops': 'platform_admin_ops', 'aws_secretsmanager_secret_policy.github_settings_apply_key': 'key'}; [open(e+'/'+keep[r['address']]+'.policy.json','w').write(r['change']['after']['policy']) for r in rc if t != 'origin-main' and r['address'] in keep]" "$E" "$tag" &&
      { [ "$tag" = origin-main ] || { bin/venv-python -I -c "$CHK" "$WB5" < "$E/p.json" && echo CHK_PREVIEW_OK || echo CHK_PREVIEW_MISMATCH; }; }; } || ok=0;
      rm -f "${E:?}/p.json"; git worktree remove --force "$W"; [ "$ok" = 1 ] || break; done;
      [ "$ok" = 1 ] && bin/venv-python -c "import json,sys; d,h=sys.argv[1],sys.argv[2].replace('/','-'); m={tuple(x) for x in json.load(open(d+'/origin-main.json'))}; n={tuple(x) for x in json.load(open(d+'/'+h+'.json'))}; print('NEW', sorted(n-m)); print('GONE', sorted(m-n)); print('MAIN_ROWS', len(m), sorted(a for a, _ in m))" "$E" "$PR_HEAD_SHA" || echo PLAN_FAILED
    expected: >-
      NEW lists exactly aws_iam_role.github_settings_apply, aws_iam_role_policy.github_settings_apply,
      aws_iam_role.github_settings_preview, aws_iam_role_policy.github_settings_preview and
      aws_secretsmanager_secret_policy.github_settings_apply_key, each create, plus aws_iam_role_policy.platform_admin_ops
      update; GONE is empty; MAIN_ROWS 0, imports and moved addresses counted (step 7's apply is untargeted, so any
      pending row of main's own plan would stop it); CHK_PREVIEW_OK (step 7's row check, run on the head's real plan JSON, accepts exactly these rows and an
      AdminOps change of only GithubApplyKeyResourcePolicy); plan files are deleted in the step and the four policy
