      CHK="import json,sys; p=json.load(sys.stdin); rc=p.get('resource_changes', []); S=lambda s: {x.get('Sid'): x for x in (lambda t: t if isinstance(t, list) else [t])(json.loads(s or '{}').get('Statement', []))}; G='GithubApplyKeyResourcePolicy'; AO='aws_iam_role_policy.platform_admin_ops'; done=any(r['address'] == AO and r['change']['actions'] == ['no-op'] and G in S(r['change']['after']['policy']) for r in rc); w=sorted({x for x in sys.argv[1].split(',') if x} | (set() if done else {AO + ':update'})); ch=[r for r in rc if r['change']['actions'] != ['no-op'] or r['change'].get('importing') or r.get('previous_address')]; got=sorted(r['address']+':'+'/'.join(r['change']['actions'])+(':import' if r['change'].get('importing') else '')+(':moved' if r.get('previous_address') else '') for r in ch); ok=all(set(S(r['change']['after']['policy'])) - set(S(r['change']['before']['policy'])) == {G} and {k: v for k, v in S(r['change']['after']['policy']).items() if k != G} == S(r['change']['before']['policy']) for r in ch if r['address'] == AO); sys.exit(3 if not got and not w else 0 if got == w and ok else 1)";
      RB="aws_iam_role.github_settings_apply aws_iam_role_policy.github_settings_apply aws_iam_role.github_settings_preview aws_iam_role_policy.github_settings_preview aws_secretsmanager_secret_policy.github_settings_apply_key";
      pass() { n="$1"; : > "$D/tf.err"; SL=$($T state list 2>> "$D/tf.err") || { echo "${n}_STATE_FAILED"; return 1; }; WB=$(for a in $RB; do grep -qxF -- "$a" <<< "$SL" || printf '%s:create,' "$a"; done);
      if ! $T plan -input=false -var-file=terraform.bootstrap.tfvars -out="$D/bs.bin" > /dev/null 2>> "$D/tf.err"; then echo "${n}_PLAN_FAILED"; return 1; fi; $T show -json "$D/bs.bin" | bin/venv-python -I -c "$CHK" "$WB"; c=$?;
      if [ "$c" = 3 ]; then echo "${n}_ALREADY"; s=0; elif [ "$c" = 0 ]; then if $T apply -input=false -no-color "$D/bs.bin" 2>> "$D/tf.err" | grep '^Apply complete!'; then echo "${n}_OK"; s=0; else echo "${n}_APPLY_FAILED"; s=2; fi; else echo "${n}_STOPPED"; s=1; fi; rm -f "${D:?}/bs.bin"; return $s; };
      git fetch -q origin main && { git worktree remove --force "$W" 2> /dev/null; rm -rf "${W:?}"; git worktree prune; git worktree add --detach "$W" "$MERGE_SHA" -q; } &&
      { git merge-base --is-ancestor "$MERGE_SHA" origin/main && test -f "$W/terraform/bootstrap/github_settings_apply.tf" && grep -q GithubApplyKeyResourcePolicy "$W/terraform/bootstrap/platform_admin_policies.tf" || { echo MERGE_SHA_WRONG; false; }; } &&
      cp terraform/bootstrap/terraform.bootstrap.tfvars "$W/terraform/bootstrap/" && $T init -input=false -backend-config="region=$R" > /dev/null 2>> "$D/tf.err" &&
      { pass PASS_1; r=$?; if [ "$r" = 2 ] && grep -q 'secretsmanager:PutResourcePolicy' "$D/tf.err"; then pass PASS_2; r=$?; fi; [ "$r" = 0 ]; } && APPLIED=1 || echo APPLY_STOPPED;
