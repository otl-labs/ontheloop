    command: >-  # pragma: allowlist secret -- names a Secrets Manager entry, not a value
      set -o pipefail; R=$(tr -d '[:space:]' < config/aws-region); P=agent_platform_admin; N=agent-platform-terraform-github-apply-app; APPLIED=0;
