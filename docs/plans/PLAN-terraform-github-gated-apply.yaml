    fix_if: >-
      PLAN_FAILED (read the local tf.err), any other NEW row, a GONE row, or CHK_PREVIEW_MISMATCH: fix on the branch
      and re-run at the new head. MAIN_ROWS above 0: main carries someone else's unapplied bootstrap change or drift;
      STOP and report before merge, never fold it into this apply
    hermetic: false
    graduation: not-applicable
  - step: 6
    phase: pre-deploy
    action: >-
