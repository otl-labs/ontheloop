      if [ -z "$J" ]; then echo "ASSUME_FAILED $role"; else
      ( export AWS_ACCESS_KEY_ID=$(echo "$J" | jq -r .Credentials.AccessKeyId) AWS_SECRET_ACCESS_KEY=$(echo "$J" | jq -r .Credentials.SecretAccessKey) AWS_SESSION_TOKEN=$(echo "$J" | jq -r .Credentials.SessionToken); unset AWS_PROFILE;
