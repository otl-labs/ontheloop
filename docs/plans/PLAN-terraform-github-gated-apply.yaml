  - file: docs/contracts/secret-material-handling.yaml
    action: Modify
    purpose: PR 1. domains gains the apply App key line (W5) plus a new amendment_log entry.
  - file: .github/workflows/terraform-github-apply.yml
    action: Create
    purpose: >-
      PR 2. on: push (branches [main]; paths terraform/github/**, this workflow, scripts/ci/terraform_github_apply*,
      scripts/ci/terraform_github_plan_report.py, scripts/ci/plan_names_core.py) and workflow_dispatch with inputs
      gate_change (string, default empty) and approval_probe_run_id (string, default empty); top-level permissions
      contents read; concurrency group terraform-github-apply, cancel-in-progress false. Every job's if requires
      github.ref == 'refs/heads/main'. Job preview (environment tf-trusted-plan, the main-only no-reviewer Environment,
      so the plan App key reaches it as a repository secret today and as an Environment secret after rec-4638;
      id-token write; timeout 15): the read-only plan as terraform-github-plan.yml does it (github-settings-preview by
      its tf-trusted-plan subject, role-session-name terraform-github-preview, the read-only plan App token,
      -lock=false, every python call -I), the names-only reporter and the gate's preview to the step summary, and the
      gate's preview outputs reviewed and has_changes; the gate's preview exits 1 on an unnamed gate change, so the
      apply job never asks; plan files deleted always. Job apply (needs preview; if has_changes; environment the
      GATE_ENV literal, tf-gated-apply until rec-4965; id-token write; timeout 20): assumes github-settings-apply with
      role-session-name terraform-github-apply and runs scripts/ci/terraform_github_apply.sh with REVIEWED,
      GATE_CHANGE and PROBE_RUN_ID through env, never interpolated into run:. Every checkout takes no ref and sets
      persist-credentials false; every non-local uses: in both jobs is pinned to a 40-hex commit SHA with a version
      comment; run: bodies stay thin (logic in scripts/ci/).
  - file: scripts/ci/terraform_github_apply.sh
    action: Create
    purpose: >-  # pragma: allowlist secret -- names a Secrets Manager entry, not a value
      PR 2. The apply job's single process, so the installation token never leaves a shell variable
      (secret-material-handling.yaml provider_credential_ephemeral_input). set -euo pipefail. Reads the apply App entry
      (JSON app_id, installation_id, private_key) into a variable; signs an RS256 JWT with openssl from a process
      substitution, iat backdated 60 s and exp at most iat + 600; POST /app/installations/{id}/access_tokens with
      repositories [ontheloop] and permissions administration write, metadata read, actions read (no Deployments
      permission); ::add-mask:: the token; unsets the key; curl always reads the Authorization header from stdin
      (-H @-), never from argv; trap EXIT revokes the token (DELETE /installation/token) and deletes plan files.
      Probe leg, if PROBE_RUN_ID is set (must match ^[0-9]+$, else exit 1 before any call): GET that run's
      pending_deployments, which must succeed and name the deployment-approval-probe Environment (else
      APPLY_APP_PROBE_INCONCLUSIVE, exit 1); POST an approval for that Environment, keeping the status, message and
      the x-ratelimit-remaining, x-accepted-github-permissions and x-github-request-id headers; the gate's
      probe-verdict classifies them as scripts/session/deployment_approval_probe.py's _CLASSIFIERS do (APPROVED:
      APPLY_APP_APPROVAL_ACCEPTED, exit 1; TOKEN_LACKS_PERMISSION or NOT_REVIEWER: APPLY_APP_APPROVAL_REFUSED; every
      other verdict, a rate-limited 403 included, or the pending entry gone on a re-read: APPLY_APP_PROBE_INCONCLUSIVE,
      exit 1). Then: reviewer ids into a variable;
      every terraform call through scripts/ci/quiet_run.sh with logs under RUNNER_TEMP never printed; init
      -lockfile=readonly; plan -out=plan.bin; show -json; the gate's check against REVIEWED (a refusal exits before
      apply); the gate's applied summary to the step summary; terraform apply plan.bin (the plan this job checked,
      Decision 158 cl.3); TF_GITHUB_APPLY_APPLIED add=<n> change=<n> import=<n> from the checked counts; then plan
      -detailed-exitcode, failing unless 0 (TF_GITHUB_APPLY_CONVERGED on 0). Prints only machine lines, counts and
      allowlisted values; never another plan value, the key, the token, an id or an ARN.
  - file: scripts/ci/terraform_github_apply_gate.py
    action: Create
    purpose: >-
      PR 2. Stdlib-only, run with python3 -I by path; loads terraform_github_plan_report.py the way that file loads
      plan_names_core.py and reuses classify(). A row is {address, actions, changed, values}, where values holds the
      after-values of ALLOWLIST (type, attribute) pairs only: environment, branch_pattern, can_admins_bypass,
      prevent_self_review, protected_branches, custom_branch_policies, enforcement, and reviewer_count (the length of
      reviewers[0].users, never the ids). GATE_TYPES (today's four, named in the banner): github_repository_environment,
      github_repository_environment_deployment_policy, github_actions_repository_permissions,
      github_workflow_repository_permissions; NON_GATE_TYPES: github_repository and github_repository_ruleset (refused
      outright by (c)). A gate row is any row whose type is not in NON_GATE_TYPES, so a type added later must be named
      until it is classified (fail closed; guard predicate (l)). preview, on the read-only plan: a Markdown table
      (address, action, changed names, allowlisted values) with a GATE CHANGE banner for every gate row; reviewed (sorted compact
      JSON of rows) and has_changes (false for NO_CHANGES and VISIBILITY_GATED_ONLY, true on a dispatch with either
      input set) to GITHUB_OUTPUT; when a non-no-op gate row (create, update or import) is not in GATE_CHANGE it
      writes the table, prints TF_GITHUB_APPLY_GATE_CHANGE_UNNAMED and exits 1 without writing GITHUB_OUTPUT. check, on the admin plan against the
      reviewed set, refuses with its own marker and exit 1: (a) TF_GITHUB_APPLY_UNREVIEWED a row with no reviewed row
      of the same address and actions whose changed names are a superset and whose allowlisted values are equal; (b)
      TF_GITHUB_APPLY_DESTRUCTIVE any destroy or replace; (c) TF_GITHUB_APPLY_RULESET_REFUSED any github_repository_ruleset
      row that is not no-op (the provider resends only modelled keys, rec-4624); (d) TF_GITHUB_APPLY_GATE_CHANGE_UNNAMED
      any non-no-op gate row, creates and imports included, whose address is not in GATE_CHANGE
      (comma-separated exact addresses); (e) TF_GITHUB_APPLY_GATE_CHANGE_STALE a GATE_CHANGE address with no such row;
      (f) TF_GITHUB_APPLY_PLAN_UNREADABLE a missing or unparseable plan or reviewed set. Otherwise
      TF_GITHUB_APPLY_CHECKED add=<n> change=<n> import=<n>, or TF_GITHUB_APPLY_NOTHING with exit 0 when the admin plan
      has no rows (the script then skips apply). probe-verdict maps (status, message, the three headers, can_approve,
      pending-after) to ACCEPTED, REFUSED or INCONCLUSIVE in _CLASSIFIERS order, rate limit before permission.
  - file: terraform/github/environments.tf
    action: Modify
