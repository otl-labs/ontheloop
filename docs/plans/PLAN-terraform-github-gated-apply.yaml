constraints:
  - Never print the apply App key, an installation token, a non-allowlisted plan value, an account id or an ARN (Decision 101); posted evidence is counts, names and allowlisted values only.
  - The apply App key is reachable only from the operator-approved apply job of main's workflow; no ungated job reads it.
  - No sidecar -- the approved-text Environment that Decision 246 records approvals in is created by this plan's first run, so the always-ask wording (W1-W5) is approved inline in the planning thread, and the build needs the operator's final-diff word anyway (IAM, CODEOWNERS paths, security code).
  - The bootstrap apply runs only on the operator's explicit word (Decision {{N}} cl.6), never self-directed.
  - No rescue agents or workaround loops (Decision 55); a refused gate is fixed in code, never bypassed.
