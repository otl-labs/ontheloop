      G=$(aws iam simulate-custom-policy --profile $P --policy-input-list "$(cat "$E/platform_admin_ops.policy.json")" --action-names secretsmanager:PutResourcePolicy secretsmanager:DeleteResourcePolicy --resource-arns "$S" --query 'EvaluationResults[].EvalDecision' --output text);
