schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: terraform-github-org-rekey-closure
intent: >-
  Close rec-4355 once PLAN-terraform-github-org-rekey's live walk has passed: one PR records phases.prove gate 2 and
  gate 1's code-owner review in docs/contracts/github-org-transfer.yaml's evidence_ledger (the unproven non-owner part
  named, rec-4625), sets identity.phase proven with staged_phase cleared, flips GH-08 and GH-09 to proven in the
  credential inventory, and closes rec-4355 by its Resolves trailer. The coordinator is told the moment main reads
  proven, because the AWS account build waits on it (operator, 2026-10-25).
plan_type: IMPLEMENTATION
verification_tier: V1
plan_path: docs/plans/PLAN-terraform-github-org-rekey-closure.yaml
phase: >-
  ad_hoc_rec (soft-warn exception category) -- resolves rec-4355 (High), the second of two plans (the build and the
  live walk are PLAN-terraform-github-org-rekey's); no tier_item criterion claimed. Records phases.prove gate 2
  (breakage_map.terraform_github_root) and gate 1's code-owner review and sets identity.phase proven
  (tracking.executed_by rec-4355).
closes_criteria: []
scope:
  - file: docs/contracts/github-org-transfer.yaml
    action: Modify
    purpose: >-
      Two evidence_ledger rows, identity.phase proven with staged_phase removed, one amendment_log row. Exact text:
      execution_steps step 2, bound by VP step 1.
  - file: docs/contracts/account-credential-inventory.yaml
    action: Modify
    purpose: >-
      GH-08 and GH-09 to proven (owner_today company; GH-09 gains rec-4355), one amendment_log row and two
      evidence_ledger rows (stage_rule). Exact text: execution_steps step 3, bound by VP step 1.
bundled_recommendations:
  - rec-4355
followon_recs: []
infrastructure_dependencies:
  - >-
    None live: the PR writes only the two contract files. Its evidence is the build plan's walk, read from
    /mnt/project-files/rec-4355/EVIDENCE.md and the TERRAFORM GITHUB RE-KEY EVIDENCE comment on the build PR.
acceptance_criteria:
  - >-
    The contract and inventory changes equal the operator-approved texts of execution_steps steps 2 and 3, with
    variance only in dates, PR numbers and the <E0> and <E2> slots (VP step 1).
  - >-
    main's contract reads identity.phase proven with no staged_phase and the two rec-4355 prove rows; GH-08 and GH-09
    read proven with owner_today company and one proven ledger entry each; both real-tree checks pass (VP step 2).
  - rec-4355 is closed by the closure PR's Resolves trailer with its acceptance holding at the closing sha (VP step 6).
  - main reads proven and the coordinator is told at once (VP step 7).
  - >-
    No account id, ARN, secret value, e-mail address, token or ExternalId appears in either changed file or the PR body
    (Decision 101; VP step 3).
verification_plan:
  - step: 1
    phase: pre-deploy
    action: >-
      The closure PR's contract and inventory changes are exactly the approved diffs (added and removed lines; the
      placeholders filled from EVIDENCE.md), by a copy of the build plan's VP step 5 script that reads this file.
    command: |-
      bin/venv-python - closure <<'PY'
      import re, subprocess, sys, yaml
      mark = sys.argv[1]
      plan = yaml.safe_load(open("docs/plans/PLAN-terraform-github-org-rekey-closure.yaml", encoding="utf-8"))
      PH = {"YYYY-MM-DD": r"\d{4}-\d{2}-\d{2}", "#NNNN": r"#\d+",
          "<E0>": r"(?:\d+ to import, \d+ to add, \d+ to change, \d+ to destroy|a plan error)",
            "<E2>": r"(?:1 to change, the ruleset's bypass_actors \(visibility-gated\)|No changes)"}
      token = re.compile("|".join(map(re.escape, PH)))
      def pattern(text):
          parts, last = [], 0
          for m in token.finditer(text):
              parts += [re.escape(text[last:m.start()]), PH[m.group()]]
              last = m.end()
          return re.compile("".join(parts) + re.escape(text[last:]))
      blocks = [s.partition("\n\n") for s in plan["execution_steps"] if s.startswith(f"APPROVED DIFF {mark} ")]
      assert blocks, f"no APPROVED DIFF {mark} block"
      bad = []
      for head, _, body in blocks:
          path = head.split()[3]
          want = [(line[0], pattern(line[1:])) for line in body.splitlines() if line.startswith(("+", "-"))]
          diff = subprocess.run(["git", "diff", "origin/main", "--", path], capture_output=True, text=True, check=True).stdout
          got = [line for line in diff.splitlines() if line.startswith(("+", "-")) and not line.startswith(("+++ ", "--- "))]
          for line in got:
              hit = next((w for w in want if w[0] == line[0] and w[1].fullmatch(line[1:])), None)
              if hit is None:
                  bad.append(f"{path}: unapproved {line[:100]}")
              else:
                  want.remove(hit)
          bad += [f"{path}: missing {sign}{rx.pattern[:100]}" for sign, rx in want]
          print("APPROVED_DIFF", mark, path, len(got))
      for path in {"build": ["docs/contracts/account-credential-inventory.yaml"], "closure": []}[mark]:
          if subprocess.run(["git", "diff", "--quiet", "origin/main", "--", path]).returncode:
              bad.append(f"{path}: changed in the {mark} PR")
      assert not bad, bad
      print("APPROVED_DIFF_OK", mark)
      PY
    expected: >-
      Prints APPROVED_DIFF closure for both files with their changed-line counts, then APPROVED_DIFF_OK closure.
    fix_if: >-
      An unapproved or missing line is a wording change: restore the approved text of execution_steps steps 2 and 3
      (variance: dates, PR numbers, <E0> and <E2> only). If main changed the same lines since, stop and escalate to the
      planning thread through the coordinator; never re-word to fit.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      A one-time binding of the PR's diff against origin/main to the operator-approved text; it depends on origin/main
      at build time, so it cannot be a standing check.
  - step: 2
    phase: pre-deploy
    action: The flipped structure holds and the transfer and inventory checks pass on the real tree.
    command: >-
      bin/venv-python -c "import yaml; c=yaml.safe_load(open('docs/contracts/github-org-transfer.yaml',encoding='utf-8'));
      i=yaml.safe_load(open('docs/contracts/account-credential-inventory.yaml',encoding='utf-8')); idn=c['identity'];
      assert idn['phase']=='proven' and 'staged_phase' not in idn, idn.get('phase');
      g=[r['gate'] for r in c['evidence_ledger'] if r.get('phase')=='prove' and r.get('evidence_path')=='rec-4355/EVIDENCE.md'];
      assert g==['phases.prove gate 2 (breakage_map.terraform_github_root)','phases.prove gate 1 (code-owner review)'], g;
      rows={r['id']:r for r in i['rows'] if r.get('id') in ('GH-08','GH-09')};
      assert all(r['status']=='proven' and r['owner_today']=='company' for r in rows.values()) and 'rec-4355' in rows['GH-09']['rec'], rows;
      assert sum(1 for e in i['evidence_ledger'] if e.get('row') in ('GH-08','GH-09') and e.get('status')=='proven')==2;
      print('CLOSURE_OK')"
      && bin/venv-python -m pytest tests/checks/contracts/test_validate_github_org_transfer.py::TestValidateGithubOrgTransfer::test_green_on_the_real_tree
      tests/checks/contracts/test_validate_account_credential_inventory.py::TestValidateAccountCredentialInventory::test_green_on_the_real_tree -q
    expected: CLOSURE_OK, then both real-tree tests pass.
    fix_if: >-
      Restore the approved texts. If the inventory's key names differ from rows and evidence_ledger, read the file and
      adapt only this assertion, never the approved text.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      The two real-tree tests are already standing members of their suites; the CLOSURE_OK assertion checks this one
      PR's flip and would be redundant once the phase reads proven.
  - step: 3
    phase: pre-deploy
    action: >-
      Public-boundary sweep of every added line and of the PR body (Decision 101); save the closure PR body into
      $CLOSURE_PR_BODY first.
    command: >-
      test -s "$CLOSURE_PR_BODY" && ! { git diff origin/main -- docs/contracts/github-org-transfer.yaml docs/contracts/account-credential-inventory.yaml
      | grep '^+' | grep -v '^+++' | cut -c2-; cat "$CLOSURE_PR_BODY"; }
      | grep -Eq '(^|[^0-9a-f])[0-9]{12}([^0-9a-f]|$)|arn:aws|[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[a-z]{2,}|ghp_|github_pat_|ghs_|PRIVATE KEY|ExternalId'
    expected: Exit 0 (no match), with $CLOSURE_PR_BODY a non-empty file.
    fix_if: A match is a Decision 101 breach; remove it. Evidence links are workflow-run URLs, never job URLs.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: The never-commit hook and secret scanning are the standing guards; this is the plan's one-time diff sweep.
  - step: 4
    phase: pre-deploy
    action: Fast presubmit tier (validate_github_org_transfer, validate_account_credential_inventory, size limits, merge step).
    command: bin/venv-python -m scripts.validate --pre
    expected: Exit 0.
    fix_if: >-
      Fix the named check's finding in the changed files only. A size-limit failure on github-org-transfer.yaml (main
      added contract lines since the build): stop and route a layout-only compaction to the operator.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: scripts.validate is the aggregate presubmit entrypoint; graduating it would recurse the harness.
  - step: 5
    phase: pre-deploy
    action: Full tier, then HEAD attestation, before the commit and push (handoff_policy).
    command: bin/venv-python -m scripts.validate && bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: >-
      The full tier exits 0 and the validation result attests the current HEAD's tree. Run it in the background with a
      timeout of at least 30 minutes; a timeout is a block, never a pass.
    fix_if: Fix the named check's finding in the changed files only and rerun from the start; never push on a partial or timed-out run.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: The full tier cannot graduate (recursion refusal) and depends on the whole tree at HEAD; it is the handoff gate.
  - step: 6
    phase: post-deploy
    action: rec-4355 closed by the closure PR's Resolves trailer, with its acceptance holding at the closing sha.
    command: >-
      AWS_PROFILE=agent_platform bin/venv-python -c "from scripts.ops_data_portal import _fetch_rec_from_reader as f; r=f('rec-4355');
      print((r or {}).get('status')); assert r and r['status']=='closed', (r or {}).get('status')"
      && grep -Eq 'default += "otl-labs"' terraform/github/variables.tf && grep -Eq 'default += "ontheloop"' terraform/github/variables.tf
    expected: Prints closed; both greps hold on main.
    fix_if: >-
      Still open: wait for the trailer-closure job to conclude and read its log (docs/contracts/git-ops.yaml
      resolves_trailer, Decision 201 as updated 2026-10-30). A trailer that merge_step readback found missing:
      bin/venv-python -m scripts.session.merge_step recover (it closes only with a verdict record), never the manual
      route. A transport failure or a merge-leg refusal: the manual scripts.ops_data_portal --update-rec rec-4355
      --status closed route is sanctioned, citing the closure merge sha and the E2 run URL. An acceptance-verdict
      refusal: any manual close is forbidden; fix forward with a PR whose trailer names rec-4355, or, if the acceptance
      itself is wrong, strengthen it with update_rec (never weaken it without the operator's word, Decision 235),
      confirm it holds at the merge sha with scripts.rec_trailer_acceptance census and evaluate, and re-run the merge
      commit's ci.yml push run.
  - step: 7
    phase: post-deploy
    action: >-
      main reads proven; tell the coordinator at once (the AWS account build waits on it, operator 2026-10-25,
      cmsg_017f94mmYqSe3q2p9o6tPW3U2ojCiQzf5eCSJQPDHjc5Hn).
    command: >-
      git fetch -q origin main && git show origin/main:docs/contracts/github-org-transfer.yaml
      | bin/venv-python -c "import sys,yaml; i=yaml.safe_load(sys.stdin)['identity']; assert i['phase']=='proven' and 'staged_phase' not in i, i.get('phase'); print('PHASE_PROVEN_ON_MAIN')"
    expected: PHASE_PROVEN_ON_MAIN, then a mcp__hearthbot__message_coordinator message naming the closure merge sha.
    fix_if: The closure has not merged or main was reverted; merge the closure PR first, never message early.
  - step: 8
    phase: post-deploy
    action: OPERATOR, AWS CloudShell -- remove the working directory (state backup, provider cache) once step 6 passes.
    command: rm -rf ~/tfgithub && test ! -e ~/tfgithub && echo CLEANED
    expected: The operator reports CLEANED.
    fix_if: Re-run it; nothing depends on the directory after closure.
test_obligations:
  - source: docs/contracts/github-org-transfer.yaml
    behavior: identity.phase proven with staged_phase cleared and the two prove rows keep the transfer check green on the real tree.
    verification_step: 2
    test_selector: tests/checks/contracts/test_validate_github_org_transfer.py::TestValidateGithubOrgTransfer::test_green_on_the_real_tree
    red_green_expectation: >-
      Red if phase proven lands with staged_phase kept, or with the terraform/github defaults still on the old
      identity; green after execution_steps step 2 on top of the build plan's merge.
  - source: docs/contracts/account-credential-inventory.yaml
    behavior: GH-08 and GH-09 flip to proven with owner_today company and one evidence_ledger entry each (stage_rule).
    verification_step: 2
    test_selector: tests/checks/contracts/test_validate_account_credential_inventory.py::TestValidateAccountCredentialInventory::test_green_on_the_real_tree
    red_green_expectation: >-
      Red if a row flips without its ledger entry or with owner_today founder (stage_rule); green after execution_steps
      step 3.
constraints:
  - >-
    Always-ask text is approved verbatim (context: approval). Allowed variance: dates, PR numbers, the <E0> and <E2>
    slots. Any other wording change, including one critique or code review asks for, goes to the coordinator, then the
    operator, before merge.
  - >-
    Never opened before the build plan's VP step 20 has passed; never touches terraform/github or its state (the
    re-key is the build plan's, Decision 126).
  - >-
    Evidence is counts, dates, PR numbers and workflow-run URLs only (Decision 101): never plan text, state content,
    user ids, the S3 version id or any credential.
  - No rescue agents or workaround loops (Decision 55).
context:
  - 'gates: decision-scout=FLAGS_FOUND (inherited from the build plan); red_overlap={"verdict": "clear", "reds": []}; plan-critique=PROCEED (round 1, over both plans: PROCEED with 7 nits, applied; round 2, confirming: PROCEED with 3 nits, applied)'
  - >-
    Decision-scout: inherited from PLAN-terraform-github-org-rekey, whose scope contains this plan's
    (/mnt/project-files/rec-4355/scout-report.md: FLAGS_FOUND, CITE 218, 172, 126, 77, 119, 83, 101, 201; the
    2026-10-30 sweep adds 238; 237 and 239 do not change the closure).
  - >-
    Approval: the closure texts were approved verbatim with the build plan ("yes to all and write the plan",
    cmsg_017f94mmYqSe3q2p9o6tPW3UA8nvZJGPJ3jHgH8DR31f9D, 2026-10-25) and moved here unchanged; the re-grounded counts:
    @@REGROUND_APPROVAL@@; the split: @@SPLIT_APPROVAL@@.
  - >-
    The two amendment_log summaries name PLAN-terraform-github-org-rekey on purpose: they record that plan's live
    walk and cite its VP steps, and the approved text moved verbatim (the split changes no approved sentence).
  - >-
    Why a second plan: git-ops.yaml v9 resolves_trailer TRANSPORT (#1762) has the PR that flips implementation_declared
    carry its plan's Resolves trailer, and the build plan's graduation rows must land in the build PR, so rec-4355,
    whose title is the state re-key, closes here, after the live walk, not at the build merge.
  - >-
    Approved text stays inline, not in a docs/plans/approved/<slug>.yaml sidecar: the sidecar allows only number and
    date placeholders, while these texts carry <E0>, <E2> and PR-number slots.
pre_implementation_checklist:
  - Branch confirmed not on main
  - The build plan's VP step 20 passed (EVIDENCE.md is non-empty and the build PR has the TERRAFORM GITHUB RE-KEY EVIDENCE comment)
  - No open critical ci_rca rec (ducklake-reads ci_rca_open)
execution_steps:
  - >-
    Start gate: PLAN-terraform-github-org-rekey's VP step 20 passed, checked from a fresh session as test -s
    /mnt/project-files/rec-4355/EVIDENCE.md plus one comment headed TERRAFORM GITHUB RE-KEY EVIDENCE on the build PR
    (mcp__github__pull_request_read get_comments); main's github-org-transfer.yaml
    reads identity.phase transferred with staged_phase proven; no open critical ci_rca rec; any wording variant the
    build plan routed (E1's ruleset row no-op, or a fresh-PR E1) has the operator's word on its new text. Otherwise wait
    and tell the coordinator. Restart the harness branch from origin/main and set implementation_declared true in this
    plan.
  - |-
    APPROVED DIFF closure docs/contracts/github-org-transfer.yaml -- operator-approved wording (context: approval); VP
    step 1 binds the closure PR's added and removed lines to these. Variance: YYYY-MM-DD (the date of the event each
    row records), #NNNN (the build PR), <E0> (the build plan's VP step 9 counts as "I to import, A to add, C to change,
    D to destroy", or "a plan error") and <E2> (the build plan's VP step 19 variant). If E1's ruleset row read no-op or
    E1 ran on a fresh PR (the build plan's VP step 14), the gate-2 row needs the operator's word on new text first. The
    amendment_log row goes at the end of amendment_log (the last row), the ledger rows at the end of evidence_ledger.

    +  - {date: "YYYY-MM-DD", semantic_break: false, change_class: governance_note_add, summary: "PLAN-terraform-github-org-rekey (rec-4355): phases.prove gate 2 and gate 1's code-owner review recorded in evidence_ledger, the latter with its unproven part named (rec-4625); identity.phase proven and staged_phase cleared."}
    -  phase: transferred
    -  staged_phase: proven
    +  phase: proven
    +  - {date: "YYYY-MM-DD", phase: prove, gate: "phases.prove gate 2 (breakage_map.terraform_github_root)", observation: "Re-key (rec-4355) with the terraform/github apply App from AWS CloudShell. Before it the PR-time terraform/github plan on #NNNN read <E0>, the state still keyed on theseus. After the #NNNN merge: state rm of the five name-keyed addresses; the PR-time plan, re-run on otl-labs/ontheloop, read 8 to import (the five, plus three resources for the tf-trusted-plan and deployment-approval-probe environments added since, rec-4636 and rec-4695), 0 to add, 0 to change, 0 to destroy, the ruleset's import also updating bypass_actors alone, which the plan App cannot read; the import-only apply under the App read 8 imported, 0 added, 0 changed, 0 destroyed and its re-plan read No changes; the state then held the eight keyed on ontheloop with the ruleset's bypass_actors and the repository's security_and_analysis. The PR-time plan then read <E2>.", evidence_path: "rec-4355/EVIDENCE.md"}
    +  - {date: "YYYY-MM-DD", phase: prove, gate: "phases.prove gate 1 (code-owner review)", observation: "On otl-labs/ontheloop the main-protection ruleset requires code-owner review (the apply App's No changes plan), the CODEOWNERS errors API is empty, and GitHub's rule-suite insights evaluated the pull_request rule on the merge of #NNNN, a terraform/github change: pass, not bypass, with no review recorded, because a pull request authored by the sole code owner needs none; the operator approved its head in the project thread before the merge. Not proven on the new path: that a pull request by anyone else on a code-owner path waits for the code owner's review (rec-4625).", evidence_path: "rec-4355/EVIDENCE.md"}
  - |-
    APPROVED DIFF closure docs/contracts/account-credential-inventory.yaml -- operator-approved wording (stage_rule
    flips; context: approval); VP step 1 binds these. Variance: YYYY-MM-DD and #NNNN (the closure PR in the
    amendment_log row, the build PR in GH-09's ledger row). The amendment_log row goes at the end of amendment_log; the
    ledger rows at the end of evidence_ledger.

    +  - date: "YYYY-MM-DD"
    +    semantic_break: false
    +    change_class: correction
    +    summary: >-
    +      PLAN-terraform-github-org-rekey (rec-4355, PR #NNNN): GH-08 and GH-09 flip to proven (owner_today company) on
    +      the re-key evidence in github-org-transfer.yaml evidence_ledger; GH-09 gains rec-4355.
    -  - {id: GH-08, provider: GitHub, item: terraform/github admin PAT, kind: classic PAT (Secrets Manager entry; name operator-held), location: AWS Secrets Manager, owner_today: founder, target: "org-owned terraform/github apply App (transfer_credentials)", stage: github_transfer, rec: [rec-4537, rec-4355], status: pre-staged, ref: "docs/contracts/github-org-transfer.yaml#breakage_map.terraform_github_root"}
    -  - {id: GH-09, provider: GitHub, item: terraform/github plan App installation, kind: GitHub App installation, location: "repository secret TF_GITHUB_PLAN_APP_PRIVATE_KEY, variable TF_GITHUB_PLAN_APP_CLIENT_ID", owner_today: founder, target: "Installed on otl-labs, made private, key rotated", stage: github_transfer, rec: [rec-4537, rec-4538], status: pre-staged, ref: "docs/contracts/github-org-transfer.yaml#breakage_map.terraform_github_plan_app"}
    +  - {id: GH-08, provider: GitHub, item: terraform/github admin PAT, kind: classic PAT (Secrets Manager entry; name operator-held), location: AWS Secrets Manager, owner_today: company, target: "org-owned terraform/github apply App (transfer_credentials)", stage: github_transfer, rec: [rec-4537, rec-4355], status: proven, ref: "docs/contracts/github-org-transfer.yaml#breakage_map.terraform_github_root"}
    +  - {id: GH-09, provider: GitHub, item: terraform/github plan App installation, kind: GitHub App installation, location: "repository secret TF_GITHUB_PLAN_APP_PRIVATE_KEY, variable TF_GITHUB_PLAN_APP_CLIENT_ID", owner_today: company, target: "Installed on otl-labs, made private, key rotated", stage: github_transfer, rec: [rec-4537, rec-4538, rec-4355], status: proven, ref: "docs/contracts/github-org-transfer.yaml#breakage_map.terraform_github_plan_app"}
    +  - {date: "YYYY-MM-DD", row: GH-08, status: proven, evidence: "rec-4355 (docs/plans/PLAN-terraform-github-org-rekey.yaml VP 13-16): the org-owned terraform/github apply App re-keyed the root on otl-labs/ontheloop from AWS CloudShell, an import-only apply (8 imported, 0 changed) and a No changes re-plan (github-org-transfer.yaml evidence_ledger); the classic PAT stays as rollback until phases.predecessor_removal"}
    +  - {date: "YYYY-MM-DD", row: GH-09, status: proven, evidence: "rec-4355 (docs/plans/PLAN-terraform-github-org-rekey.yaml VP 14): the PR-time terraform/github plan on PR #NNNN authenticated through the otl-labs installation and read the moved repository; uninstalling it from the personal account, making it private and rotating its key stay with rec-4538"}
  - >-
    Closure PR sequence (implement skill IMPLEMENTATION Commit Flow; docs/contracts/git-ops.yaml), each outcome
    reported separately: bin/venv-python -m scripts.session.github_readiness; commit the start gate's
    implementation_declared flip with "Resolves: rec-4355" in the commit message (resolves_trailer TRANSPORT and
    PLACEMENT); draft the PR body into $CLOSURE_PR_BODY (repeating the trailer) and run VP step 3 (its diff part is
    empty here, so it sweeps the body); push and open the PR (title: record the terraform/github re-key and flip
    identity.phase to proven, rec-4355) to learn its number, which the inventory amendment_log row's #NNNN names (the
    #1607 precedent). That declaration push is docs/plans-only, exempt under git-ops.yaml
    handoff_evidence_gate.exempt_path_globs, so VP step 5 precedes the only non-exempt push. Then apply execution_steps
    steps 2 and 3 with every placeholder filled from EVIDENCE.md and that number; VP steps 1 to 4; commit; VP step 5 on
    the committed clean tree; postflight evidence per the implement skill; push; write the final body with the VP table
    into $CLOSURE_PR_BODY, re-run VP step 3 and update the PR body (mcp__github__update_pull_request);
    subscribe_pr_activity; code review. On code review PROCEED and green CI, Commit Flow step 4: merge_step premerge
    --slug terraform-github-org-rekey-closure --message-file <the squash message, whose trailer block holds Resolves:
    rec-4355 above the Co-Authored-By and Claude-Session lines>, merge_pull_request with that commit_message and the
    expectedHeadSha premerge printed, then merge_step readback. Then VP steps 6 and 7 (message the coordinator the
    moment main reads proven), and hand the operator VP step 8.
  - >-
    Report: readiness, the validator verdicts (VP steps 1-5), postflight evidence, the code review verdict, the push
    and PR outcome, then the closure merge sha, rec-4355 closed, and the coordinator told.
rollback: >-
  Revert the closure PR: identity.phase returns to transferred with staged_phase proven and the rows go; the live state
  stays re-keyed (it is right for the moved repository). rec-4355 reopens through update_rec on the operator's word.
gate_rounds:
  - {gate: decision-scout, round: 1, verdict: FLAGS_FOUND}
  - {gate: plan-critique, round: 1, verdict: PROCEED, blocking: 0, nits: 7}
  - {gate: plan-critique, round: 2, verdict: PROCEED, blocking: 0, nits: 3}
