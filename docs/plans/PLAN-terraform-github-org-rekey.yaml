constraints:
  - >-
    Always-ask text is approved verbatim (context: approval). Allowed variance: dates, PR numbers, the <E0> and <E2>
    slots. Any other wording change, including one critique or code review asks for, goes to the coordinator, then the
    operator, before merge.
  - >-
    No agent runs terraform apply, state rm, state push or import for terraform/github (Decision 126). The operator runs
    pastes 0, A, B (and R if needed) in AWS CloudShell. The agent's only possible live write is the rollback S3 version
    restore, and only on the operator's word on the exact command.
  - terraform/github is never added to any workflow that applies (Decision 77); the PR-time plan job stays read-only and advisory.
  - >-
    A Claude Code cloud session cannot plan this root. Never author a local terraform init, validate or plan step for
    it (Decision 119); verification reads the S3 state object, the proxy-served API and the PR-time CI plan.
  - >-
    The App key stays inside a paste's own bash process: read from Secrets Manager into an unexported shell variable,
    piped to openssl to sign a ten-minute JWT, then unset; never an environment variable, a Terraform variable, a file,
    a saved plan, a log or chat. Terraform sees only the minted installation token, scoped to ontheloop, as the
    ephemeral TF_VAR_github_token, which each paste revokes on exit. Every paste starts with set +x and unsets
    GITHUB_TOKEN, GITHUB_OWNER, GITHUB_ORGANIZATION, TF_VAR_github_token, TF_LOG and TF_LOG_PROVIDER.
  - >-
    Evidence is counts, dates, the merge sha, workflow-run URLs and marker lines only (Decision 101): never plan text,
    state content, user ids, the S3 version id or any credential.
  - >-
    No apply of terraform/github by anyone between the build PR merge and E2 other than paste B, and no update of the
