schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: terraform-github-org-rekey
intent: >-
  Re-key terraform/github onto otl-labs/ontheloop with the org-owned apply App and execute the live part of the
  transfer contract's last prove gates: the defaults flip, github_token turns ephemeral so the apply App's installation token, minted from the
  App key outside Terraform by each paste, never lands in a saved plan or state, the transfer check evaluates
  breakage_map.terraform_github_root per phase, and the operator re-keys the state from AWS CloudShell (state rm of the
  five, then an import-only apply under the App of the eight now declared), proven by the PR-time CI plan. Its
  sibling plan, PLAN-terraform-github-org-rekey-closure, then records phases.prove gate 2 and gate 1's code-owner
  review, flips identity.phase to proven and GH-08 and GH-09 to proven, and closes rec-4355 (one plan per declaring
  PR: git-ops.yaml resolves_trailer TRANSPORT); the AWS account build waits on that flip (operator, 2026-10-25).
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-terraform-github-org-rekey.yaml
phase: >-
  ad_hoc_rec (soft-warn exception category) -- the build and live walk for rec-4355 (High), which
  PLAN-terraform-github-org-rekey-closure bundles and closes; no tier_item criterion claimed. Executes the live part
  of docs/contracts/github-org-transfer.yaml phases.prove gate 2 (breakage_map.terraform_github_root) and gate 1's
  code-owner review; the closure plan records both and sets identity.phase proven (tracking.executed_by rec-4355).
closes_criteria: []
scope:
  - file: terraform/github/variables.tf
    action: Modify
    purpose: >-
      github_owner and repository_name defaults to otl-labs and ontheloop (rec-4355's acceptance); github_token stays
      required and sensitive and gains ephemeral = true and a non-empty validation (amendment 2026-10-26: no app_auth
      lane). Exact text: execution_steps step 2. CI keeps TF_VAR_github_token unchanged.
  - file: terraform/github/main.tf
    action: Modify
    purpose: >-
      Header comment only: the stale Apply comment names the one ephemeral token lane and why there is no app_auth
      block; the provider block is unchanged. Exact text: execution_steps step 3.
  - file: terraform/github/repo.tf
    action: Modify
    purpose: >-
      Comments only, no plan diff: the code-owner paragraph states the rule-suite finding (owner-authored PRs pass with
      no review; rec-4625), and a comment above pull_request names the two keys provider 6.12.1 does not model and
      says not to update the ruleset until it does (rec-4624, T4.21 c10), and the stale fork-approval note names the
      organisation's default since the transfer. Exact text: execution_steps step 4.
  - file: scripts/checks/contracts/validate_github_org_transfer.py
    action: Modify
    purpose: >-
      New row evaluator _evaluate_terraform_github_root registered for terraform_github_root; PENDING_STATIC_ROWS
      becomes empty, so invariant (2) is fully evaluated. Behaviour: execution_steps step 5.
  - file: tests/checks/contracts/test_validate_github_org_transfer.py
    action: Modify
    purpose: >-
      New class TestTerraformGithubRootRow (phase matrix and red cases); the two existing interface asserts updated for
      the new evaluator and the empty pending map. Spec: execution_steps step 6.
  - file: tests/checks/iam_tf/test_terraform_github_provider_auth.py
    action: Create
    purpose: >-
      Static guard of the token lane over the real terraform/github tree and the PR-time plan workflow, each predicate
      with a red case on synthetic text. Spec: execution_steps step 7.
  - file: config/agent/verification_registry/entries/github-org-transfer-terraform-github-root-row.yaml
    action: Create
    purpose: Graduation record for VP step 1 (exact text in execution_steps step 8).
  - file: config/agent/verification_registry/entries/terraform-github-provider-auth-lane.yaml
    action: Create
    purpose: Graduation record for VP step 2 (exact text in execution_steps step 8).
  - file: docs/contracts/github-org-transfer.yaml
    action: Modify
    purpose: >-
      Build PR: identity.staged_phase proven, the planned_evaluator wording for the new evaluator, the
      breakage_map.terraform_github_root fix sentence for the token lane, one amendment_log row, and the 2026-10-20
      rec-3902 amendment_log row compacted onto one line with the same words (the file is at 500 of 500 effective
      lines; execution_steps step 9). Operator-approved text, bound by VP step 5. The closure's ledger rows, phase flip
      and inventory rows are PLAN-terraform-github-org-rekey-closure's.
bundled_recommendations: []
followon_recs:
  - rec-4624
  - rec-4625
infrastructure_dependencies:
  - >-
    The terraform/github state object (S3 agent-platform-data-lake, key tfstate/github/terraform.tfstate, versioning
    Enabled, use_lockfile; the five instances keyed on theseus under the old owner, ADMIN reads 2026-10-25 and 2026-10-30) is written
    only by the operator's CloudShell paste A (state rm) and paste B (import apply), or by a rollback on the
    operator's word. Every state write is post-merge.
  - >-
    Three resources landed on main after planning with import blocks but are not in state:
    github_repository_environment.tf_trusted_plan and github_repository_environment_deployment_policy.tf_trusted_plan_main
    (rec-4636) and github_repository_environment.deployment_approval_probe (rec-4695). Their plans defer adoption to
    this re-key, so the import-only apply adopts eight: the five re-keyed and these three. The PR-time plan on #1709
    (2026-10-29) read all three as no-op imports under the plan App.
  - >-
    The org-owned terraform/github apply App (Administration and Actions read and write, Metadata read; installed on
    otl-labs with All repositories): one JSON Secrets Manager entry, agent-platform-terraform-github-apply-app
    (eu-west-2; keys app_id, installation_id, private_key; PLAN-github-transfer-credential-prestage). First used by
    paste 0. Each paste mints an installation token scoped to the ontheloop repository (a ten-minute JWT signed by
    openssl inside the paste's bash process, then POST /app/installations/{id}/access_tokens) and revokes it on exit;
    a token lives at most one hour. Narrowing the installation itself is rec-4538's.
  - >-
    The read-only otl-labs plan App installation behind .github/workflows/terraform-github-plan.yml (unchanged; it
    still passes TF_VAR_github_token). Its runs on the build PR give E0, E1 (a re-run after paste A) and E2 (a re-run
    after paste B); it cannot read the ruleset's bypass_actors.
  - >-
    AWS CloudShell (eu-west-2) with HTTPS to releases.hashicorp.com, registry.terraform.io, github.com and
    api.github.com, signed in as an operator identity that can read the apply App secret and Get/Put/Delete
    tfstate/github/*. The classic admin PAT lane (TF_VAR_github_token) stays as rollback; this walk never uses it.
  - >-
    GitHub-side writes: none to the repository (each paste only mints and revokes its own installation token). An
    import-only apply issues GitHub reads only and no step updates the ruleset (its two
    unmodelled pull_request keys, rec-4624). The agent reads through the cloud-session proxy (ruleset, CODEOWNERS
    errors, rule suites) and the read-only ADMIN profile (the S3 state object).
acceptance_criteria:
  - >-
    validate_github_org_transfer evaluates breakage_map.terraform_github_root: the two defaults equal identity.current
    before the governing phase reaches proven and identity.target from it on, the provider owner and import ids are
    variable references, and no sensitive variable has a non-null default; PENDING_STATIC_ROWS is empty; the new
    class's phase matrix and red cases pass and the real tree is green (VP steps 1 and 3).
  - >-
    The provider has no app_auth block and one credential input, var.github_token, which is sensitive and ephemeral
    with no default and rejects an empty value; no variable carries App key material; the PR-time plan workflow keeps
    TF_VAR_github_token and sets no App variable (VP step 2).
  - rec-4355's acceptance (the two defaults) holds on the build PR (VP step 4); the closure plan closes it.
  - >-
    The contract change equals the operator-approved text of execution_steps step 9, with variance only in the date,
    and the build leaves the inventory untouched (VP step 5).
  - >-
    Before merge, paste 0 at the CI-green build PR head, under the apply App on a local copy of the state, reads 8 to
    import, 0 to add, 0 to change, 0 to destroy and shows the App reading the ruleset's bypass_actors and the
    repository's security_and_analysis (VP step 10).
  - >-
    After merge: E1 reads import=8 add=0 change=0 destroy=0 replace=0 with seven rows no-op and the ruleset row no-op or
    an update of bypass_actors alone; paste B applies 8 imported, 0 added, 0 changed, 0 destroyed and re-plans exit 0;
    the S3 state holds the eight keyed on ontheloop under otl-labs with bypass_actors and security_and_analysis; the two
    unmodelled ruleset keys read the same before and after; E2 reads NO_CHANGES or VISIBILITY_GATED_ONLY (VP steps
    11-19).
  - >-
    The build PR's merge to main has a rule suite whose main-protection pull_request rule evaluated pass, the
    CODEOWNERS errors API is empty and no review is recorded on the build PR (VP steps 17 and 18).
  - >-
    The walk ends with EVIDENCE.md and the TERRAFORM GITHUB RE-KEY EVIDENCE comment (VP step 20), the start gate of
    PLAN-terraform-github-org-rekey-closure.
  - >-
    No account id, ARN, secret value, e-mail address, token or ExternalId appears in any changed file, PR body,
    evidence comment or EVIDENCE.md (Decision 101; VP steps 6 and 20).
verification_plan:
  - step: 1
    phase: pre-deploy
    action: The new terraform_github_root evaluator's phase matrix and red cases.
    command: bin/venv-python -m pytest tests/checks/contracts/test_validate_github_org_transfer.py::TestTerraformGithubRootRow -q
    expected: All tests in the class pass.
    expected_literals:
      - passed
    fix_if: >-
      A failing matrix row names its phase and defaults: fix the evaluator to execution_steps step 5, never the matrix.
      A red case passing means its predicate is vacuous; fix the evaluator or the case.
    hermetic: true
    graduation: graduate
    graduation_check_id: github-org-transfer-terraform-github-root-row
  - step: 2
    phase: pre-deploy
    action: Static guard of the credential lanes (provider block, variables, PR-time workflow), with red cases.
    command: bin/venv-python -m pytest tests/checks/iam_tf/test_terraform_github_provider_auth.py::TestTerraformGithubProviderAuth -q
    expected: All tests in the class pass.
    expected_literals:
      - passed
    fix_if: >-
      A real-tree failure names the predicate: restore main.tf or variables.tf to execution_steps steps 2 and 3, never
      relax the predicate. A red case passing means the predicate is vacuous; fix the test.
    hermetic: true
    graduation: graduate
    graduation_check_id: terraform-github-provider-auth-lane
  - step: 3
    phase: pre-deploy
    action: >-
      The whole transfer-check and import-block suites on the real tree (staged_phase proven with the otl-labs
      defaults; the existing interface asserts as updated).
    command: >-
      bin/venv-python -m pytest tests/checks/contracts/test_validate_github_org_transfer.py
      tests/checks/iam_tf/test_terraform_github_import_blocks.py -q
    expected: Exit 0, all tests pass.
    fix_if: >-
      test_green_on_the_real_tree failing on terraform_github_root: the defaults, staged_phase or import ids disagree
      with execution_steps steps 2 and 9. Any other failure: fix the changed file it names.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      Whole-file re-runs of suites this plan's scope modifies (hermetic rule (v)); their classes are already graduated
      (github-org-transfer-evaluator-tests, terraform-github-import-blocks) or graduate here (steps 1 and 2).
  - step: 4
    phase: pre-deploy
    action: rec-4355's acceptance oracle, plus repo.tf's two rec citations.
    command: >-
      grep -Eq 'default += "otl-labs"' terraform/github/variables.tf && grep -Eq 'default += "ontheloop"'
      terraform/github/variables.tf && grep -q 'rec-4624' terraform/github/repo.tf && grep -q 'rec-4625' terraform/github/repo.tf
      && echo REKEY_DEFAULTS_OK
    expected: Prints REKEY_DEFAULTS_OK.
    expected_literals: []
    fix_if: Re-apply execution_steps steps 2 and 4 verbatim.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      rec-4355's own acceptance is evaluated at closure under Decision 201 and the evaluator (step 1) is the standing
      guard on the defaults; a standing grep would duplicate it.
  - step: 5
    phase: pre-deploy
    action: >-
      The build PR's contract change is exactly the operator-approved diff (added and removed lines; placeholders
      only as listed in the script), and the build PR leaves the inventory untouched. The closure plan runs the same
      script over its own file with the mark closure.
    command: |-
      bin/venv-python - build <<'PY'
      import re, subprocess, sys, yaml
      mark = sys.argv[1]
      plan = yaml.safe_load(open("docs/plans/PLAN-terraform-github-org-rekey.yaml", encoding="utf-8"))
      PH = {"YYYY-MM-DD": r"\d{4}-\d{2}-\d{2}", "#NNNN": r"#\d+",
          "<E0>": r"(?:\d+ to import, \d+ to add, \d+ to change, \d+ to destroy|a plan error)",
            "<E2>": r"(?:1 to change, the ruleset's bypass_actors \(visibility-gated\)|No changes)"}
      token = re.compile("|".join(map(re.escape, PH)))
      def pattern(text):
          parts, last = [], 0
          for m in token.finditer(text):
              parts += [re.escape(text[last:m.start()]), PH[m.group()]]
              last = m.end()
          return re.compile("".join(parts) + re.escape(text[last:]))
      blocks = [s.partition("\n\n") for s in plan["execution_steps"] if s.startswith(f"APPROVED DIFF {mark} ")]
      assert blocks, f"no APPROVED DIFF {mark} block"
      bad = []
      for head, _, body in blocks:
          path = head.split()[3]
          want = [(line[0], pattern(line[1:])) for line in body.splitlines() if line.startswith(("+", "-"))]
          diff = subprocess.run(["git", "diff", "origin/main", "--", path], capture_output=True, text=True, check=True).stdout
          got = [line for line in diff.splitlines() if line.startswith(("+", "-")) and not line.startswith(("+++ ", "--- "))]
          for line in got:
              hit = next((w for w in want if w[0] == line[0] and w[1].fullmatch(line[1:])), None)
              if hit is None:
                  bad.append(f"{path}: unapproved {line[:100]}")
              else:
                  want.remove(hit)
          bad += [f"{path}: missing {sign}{rx.pattern[:100]}" for sign, rx in want]
          print("APPROVED_DIFF", mark, path, len(got))
      for path in {"build": ["docs/contracts/account-credential-inventory.yaml"], "closure": []}[mark]:
          if subprocess.run(["git", "diff", "--quiet", "origin/main", "--", path]).returncode:
              bad.append(f"{path}: changed in the {mark} PR")
      assert not bad, bad
      print("APPROVED_DIFF_OK", mark)
      PY
    expected: Prints APPROVED_DIFF build docs/contracts/github-org-transfer.yaml with its changed-line count, then APPROVED_DIFF_OK build.
    fix_if: >-
      An unapproved or missing line is a wording change: restore the approved text of execution_steps step 9. If main
      changed the same lines since planning, stop and escalate to the planning thread through the coordinator; never
      re-word to fit.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      A one-time binding of the PR's diff against origin/main to the operator-approved text; it depends on origin/main
      at build time, so it cannot be a standing check.
  - step: 6
    phase: pre-deploy
    action: Public-boundary sweep of every added line (Decision 101); the never-commit hook is the backstop, not the check.
    command: >-
      ! git diff origin/main -- terraform/github scripts/checks/contracts/validate_github_org_transfer.py
      tests/checks/contracts/test_validate_github_org_transfer.py tests/checks/iam_tf/test_terraform_github_provider_auth.py
      config/agent/verification_registry/entries docs/contracts/github-org-transfer.yaml
      docs/contracts/account-credential-inventory.yaml | grep '^+' | grep -v '^+++' | cut -c2-
      | grep -Eq '[0-9]{12}|arn:aws|[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[a-z]{2,}|ghp_|github_pat_|ghs_|BEGIN [A-Z ]*PRIVATE KEY|ExternalId'
    expected: Exit 0 (no match).
    expected_literals: []
    fix_if: >-
      A match is a Decision 101 breach; remove it. Evidence links are workflow-run URLs (/actions/runs/N, 11 digits
      today), never job URLs; if a run id ever reaches 12 digits, cite the run by its PR comment link instead.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: The never-commit hook and secret scanning are the standing guards; this is the plan's one-time diff sweep.
  - step: 7
    phase: pre-deploy
    action: Fast presubmit tier (validate_github_org_transfer, plan documents, verification registry, size limits).
    command: bin/venv-python -m scripts.validate --pre
    expected: Exit 0.
    fix_if: Fix the named check's finding in the changed files only.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: scripts.validate is the aggregate presubmit entrypoint; graduating it would recurse the harness.
  - step: 8
    phase: pre-deploy
    action: Full tier, then HEAD attestation, before each commit and push of the build PR (handoff_policy).
    command: bin/venv-python -m scripts.validate && bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: >-
      The full tier exits 0 and the validation result attests the current HEAD's tree. Run it in the background with a
      timeout of at least 30 minutes; a timeout is a block, never a pass.
    fix_if: Fix the named check's finding in the changed files only and rerun from the start; never push on a partial or timed-out run.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: The full tier cannot graduate (recursion refusal) and depends on the whole tree at HEAD; it is the handoff gate.
  - step: 9
    phase: pre-deploy
    action: >-
      E0, recorded: the build PR's own terraform-github-plan run at its CI-green head, against state still keyed on
      theseus. Its counts never gate; its VISIBILITY line, when present, does. Fetch its job log with
      mcp__github__get_job_logs into $E0_LOG and its report comment with mcp__github__pull_request_read (get_comments)
      into $E0_COMMENT.
    command: >-
      { grep -o 'TF_GITHUB_PLAN_REPORT [A-Za-z0-9=_. -]*' "$E0_LOG" | tail -1 | grep . || grep -o '\*\*FAILED\*\* at head' "$E0_COMMENT"; }
      && { ! grep -q 'VISIBILITY: ' "$E0_COMMENT" || grep -oE 'VISIBILITY: security_and_analysis=visible [a-z_=]*' "$E0_COMMENT"; }
      && echo E0_RECORDED
    expected: >-
      A report line or the FAILED comment, the VISIBILITY line if the plan got that far, then E0_RECORDED. Any counts or
      a plan error are expected here: the provider reads the old-keyed objects under otl-labs, misses them and plans
      adds (or fails); the job may go red, and it is advisory. Record the report line (or "a plan error") and the
      VISIBILITY line with the workflow-run URL in EVIDENCE.md; the counts are the closure's <E0>. The gates are this
      step's visibility read, paste 0 (step 10) and E1 (step 14).
    fix_if: >-
      No run on the PR although terraform/github changed: read the workflow's paths filter and the run list, then
      escalate through the coordinator; never merge without E0 recorded. A VISIBILITY line without
      security_and_analysis=visible: stop before merge and escalate to the planning thread, since E1 needs the plan App
      to import github_repository.this with security_and_analysis as a no-op. No VISIBILITY line (the plan errored
      before the probe): proceed; E1 is the gate and the rollback field covers it.
    hermetic: false
    graduation: not-applicable
  - step: 10
    phase: pre-deploy
    action: >-
      PRE-MERGE, OPERATOR, AWS CloudShell, nothing shared written -- paste 0 (Terraform, an installation token minted
      from the apply App's key, and the dry run of the state rm and import plan on a local copy of the state) at the
      CI-green build PR head. Exact text: execution_steps step 11 (the agent fills HEAD_SHA). The agent saves the operator's reported
      lines into $PASTE0_REPORT (the latest run only). A new head that changes terraform/github re-runs it.
    command: >-
      for l in TERRAFORM_OK TOKEN_OK INIT_OK PLAN_NO_TOKEN DRYRUN_IMPORT_ONLY APP_SEES_BYPASS APP_SEES_SAN; do
      printf '%s\n' "$PASTE0_REPORT" | grep -qxF "$l" || exit 1; done && echo PASTE0_OK
    expected: >-
      PASTE0_OK: the seven lines reported. PLAN_NO_TOKEN means the saved dry plan does not hold the token (it is
      ephemeral). DRYRUN_IMPORT_ONLY means the dry plan read COUNTS import=8 add=0 change=0
      destroy=0 under the App (the five and the three resources added since planning); APP_SEES_BYPASS and APP_SEES_SAN mean its import read the ruleset's one bypass actor and
      the repository's security_and_analysis. TOKEN_REVOKED should close the paste; if it is missing, record it (the
      token expires within the hour).
    fix_if: >-
      Checksum mismatch: stop, do not run the binary. AccessDenied on the secret or the state: the operator chooses
      another identity (any IAM grant is always-ask). No TOKEN_OK (a jq error on the secret, an openssl key error, or an
      HTTP 401, 404 or 422 from the token request): stop and report the error line; never fall back to the PAT lane,
      since the contract wants the App proven. TOKEN_IN_PLAN: stop; the saved plan held the token (Terraform did not
      treat github_token as ephemeral), so the amendment's premise failed; escalate to the planning thread. A "DRYRUN COUNTS ..."
      line: stop, do not merge; an update row is a config gap for the planning thread (a plan amendment), never an
      apply. DRYRUN_IMPORT_ONLY without both APP_SEES lines: stop and escalate to the planning thread before merge.
      Any other plan or provider error after INIT_OK: stop, report the error line, and escalate to the planning
      thread before merge.
    hermetic: false
    graduation: not-applicable
  - step: 11
    phase: post-deploy
    action: >-
      ADMIN, read-only -- preconditions for the live walk and the rollback point. MERGE_SHA is the build PR's
      squash-merge sha. If the first command prints nothing (no ADMIN chain), hand steps 11 and 16 to an ADMIN session
      and wait.
    command: >-
      bin/venv-python -m scripts.aws_identity caller-arn --profile agent_platform_admin 2>/dev/null | grep -q 'assumed-role/PlatformAdmin/'
      && echo ADMIN_CHAIN_OK && R=/tmp/tfgithub-rekey && mkdir -p "$R" && test -n "$MERGE_SHA"
      && git fetch -q origin main && git merge-base --is-ancestor "$MERGE_SHA" origin/main
      && git show origin/main:.github/workflows/terraform-github-plan.yml > "$R/plan-workflow.yml"
      && git show origin/main:terraform/personal/oidc_pipeline_roles.tf > "$R/planner-roles.tf"
      && grep -qE '^  pull_request:' "$R/plan-workflow.yml" && ! grep -q 'pull_request_target' "$R/plan-workflow.yml"
      && grep -qF '"repo:${repo}:pull_request",' "$R/planner-roles.tf" && grep -qE 'sid += "TfstateGithubRead"' "$R/planner-roles.tf"
      && test "$(git grep -l 'backend "s3"' origin/main -- terraform/github)" = "origin/main:terraform/github/main.tf"
      && echo PR_PLAN_CHANNEL_OK
      && ! aws s3api head-object --bucket agent-platform-data-lake --key tfstate/github/terraform.tfstate.tflock --profile agent_platform_admin >/dev/null 2>&1
      && aws s3api head-object --bucket agent-platform-data-lake --key tfstate/github/terraform.tfstate --profile agent_platform_admin --query VersionId --output text > "$R/rollback-version"
      && test -s "$R/rollback-version"
      && aws s3 cp s3://agent-platform-data-lake/tfstate/github/terraform.tfstate "$R/state-before.json" --profile agent_platform_admin --only-show-errors
      && bin/venv-python -c "import json,sys; w=sys.argv[1]; s=json.load(sys.stdin); K={('github_repository','this'):'name',('github_repository_ruleset','main_protection'):'repository',('github_actions_repository_permissions','this'):'repository',('github_workflow_repository_permissions','this'):'repository',('github_repository_environment','tf_gated_apply'):'repository'}; I={('github_repository','this'):w,('github_actions_repository_permissions','this'):w,('github_workflow_repository_permissions','this'):w,('github_repository_environment','tf_gated_apply'):w+':tf-gated-apply'}; F={(r['type'],r['name']):r['instances'][0]['attributes'] for r in s.get('resources',[]) if r.get('mode')=='managed' and (r['type'],r['name']) in K}; ok=[k for k,a in F.items() if a.get(K[k])==w and a.get('id')==I.get(k,a.get('id'))]; m=sum(1 for r in s.get('resources',[]) if r.get('mode')=='managed'); print('STATE_KEYED',w,'count=%d'%len(ok),'resources=%d'%len(F),'managed=%d'%m); assert len(ok)==5 and len(F)==5 and m==5" theseus < "$R/state-before.json"
      && git show origin/main:terraform/github/variables.tf > "$R/variables.tf"
