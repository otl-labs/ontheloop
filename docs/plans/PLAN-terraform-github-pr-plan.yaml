schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: terraform-github-pr-plan
intent: 'Give terraform/github a live, read-only terraform plan on every PR that touches it, so the root''s first live provider
  contact happens before merge (the #1316 failure class) instead of at the operator''s hand apply. A new path-filtered workflow
  authenticates to GitHub with a short-lived token from a read-only otl-labs App and reads state through the planner role
  (grant landed by PLAN-terraform-github-plan-state-grant), and posts counts, actions and changed attribute names, never values.
  The root is recorded in environment-taxonomy.yaml as CI-planned and operator-applied, not admin-only. Satisfies github-org-transfer.yaml
  prerequisites.terraform-github-pr-time-plan; prerequisite for the rec-3136 state fix and every migration change under terraform/github.
  Closes rec-4335.'
implementation_declared: true
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-terraform-github-pr-plan.yaml
phase: ad_hoc_rec (soft-warn exception category) -- resolves rec-4335 (Medium), a prerequisite named by docs/contracts/github-org-transfer.yaml
  (Decision 218). No tier_item criterion claimed.
scope:
- file: tests/test_terraform_github_pr_plan.py
  action: Modify
  purpose: 'Add classes TestPlanReport and TestWorkflowAndTaxonomy (cases in execution_steps[4]) to the file PLAN-terraform-github-plan-state-grant
    creates with TestPlannerStateGrant. Pure functions of repository text and fixture dicts: no network, terraform or AWS.
    If the file would pass 500 SLOC, move test helpers to tests/fixtures/terraform_github_plan_fixtures.py (next scope row);
    never raise a budget.'
- file: tests/fixtures/terraform_github_plan_fixtures.py
  action: Create
  purpose: 'Only if the test file would pass 500 SLOC: test helpers for this plan''s classes -- plan-JSON builders first,
    then the HCL and workflow parsing helpers -- imported by the test file (tests/fixtures is the shared-helper home; precedent
    tests/fixtures/terraform_hcl_blocks.py). The three classes stay in the test file. Not created otherwise.'
- file: .github/workflows/terraform-github-plan.yml
  action: Create
  purpose: 'The WORKFLOW block in execution_steps[0], verbatim. Allowed variance: comment wording and step display names (keep
    the baseline keys in step with them). Any change to triggers, the job if, permissions, the role, the session name, the
    token permissions, the plan flags, the visibility probe or the file-deletion step goes back to the planner.'
- file: scripts/ci/terraform_github_plan_report.py
  action: Create
  purpose: 'The stdlib-only reporter specified in execution_steps[1]: raw counts, verdict, per-resource address, action and
    changed attribute names, drift addresses, the VISIBILITY line, a VISIBILITY CONFLICT line, the machine line, and verdict/destructive
    outputs. Never prints a value. Well under 500 SLOC.'
- file: config/composite_action_body_baseline.yaml
  action: Modify
  purpose: 'Register every inline run body of the new workflow under r3_workflows (Decision 162 R3 workflow leg: a body with
    no entry fails), each at exactly its measured effective-line count from scripts.checks.ci_guards._workflow_shell_bodies.scan_workflow_bodies(),
    sorted with the existing keys, no marker (new entries are ceilings, not raises). No other entry changes.'
- file: config/ci_rca_taxonomy.yaml
  action: Modify
  purpose: 'Add the workflows-map row for the new workflow''s name, beside security-detector-liveness, verbatim: terraform-github-plan:
    {tier: not_a_gate, ci_rca: excluded, owner: platform, rationale: "PR-only advisory plan of terraform/github (rec-4335).
    ci-rca watches main only, and this workflow never runs there; a failure surfaces on the PR itself as a red check and a
    report comment."} (block style like its neighbours). No ci-rca.yml change.'
- file: docs/contracts/environment-taxonomy.yaml
  action: Modify
  purpose: Insert the APPROVED_ROW block (execution_steps[2]) as axis_a.github directly after axis_a.bootstrap, and prepend
    the APPROVED_AMENDMENT entry to amendment_log, verbatim; allowed variance the amendment date only. No other line changes.
- file: terraform/github/CLAUDE.md
  action: Modify
  purpose: Insert the APPROVED_SECTION pointer (execution_steps[3]) verbatim as a new section directly before "## tf-gated-apply
    Environment". No other line changes and no prose-budget change (137 of 140 bytes of headroom); the detail lives in the
    workflow's header comment.
- file: config/agent/verification_registry/entries/terraform-github-plan-report-classifier.yaml
  action: Create
  purpose: 'Graduation record for VP step 1: check_id == filename stem == graduation_check_id, primitive_slot test_selector,
    guard_target scripts/ci/terraform_github_plan_report.py, guard_symbol classify, plan_slug terraform-github-pr-plan, graduated_at
    the implementation date, graduated_by implement-agent, check_spec.node_id "tests/test_terraform_github_pr_plan.py::TestPlanReport".'
- file: config/agent/verification_registry/entries/terraform-github-plan-workflow-wiring.yaml
  action: Create
  purpose: 'Graduation record for VP step 2: check_id == filename stem == graduation_check_id, primitive_slot test_selector,
    guard_target .github/workflows/terraform-github-plan.yml, guard_symbol null, plan_slug terraform-github-pr-plan, graduated_at
    the implementation date, graduated_by implement-agent, check_spec.node_id "tests/test_terraform_github_pr_plan.py::TestWorkflowAndTaxonomy".'
bundled_recommendations:
- rec-4335
followon_recs:
- rec-4348
- rec-4349
- rec-4350
infrastructure_dependencies:
- 'PLAN-terraform-github-plan-state-grant implemented, merged and verified (its VP steps 3-4) before the workflow PR is pushed:
  the workflow''s terraform init reads state through that grant.'
- 'Operator console, before the workflow PR is pushed: the otl-labs plan App created and installed, its key and the two repository
  variables stored (context: OPERATOR STEPS). Without them its job fails at CONFIG_MISSING.'
- No terraform/github apply, no state write, no change to any trust policy or OIDC subject.
acceptance_criteria:
- The workflow PR's own terraform-github-plan run completes the plan (terraform exit 0 or 2) reading state through the planner
  role, posts the report with a VISIBILITY line and the TF_GITHUB_PLAN_REPORT machine line, and leaves no plan file, plan
  text or variable value in the log, the comment or an artifact.
- The reporter's counts are raw, its VISIBILITY-GATED label fires only on the exact bypass_actors-only ruleset update while
  the probe says hidden, it flags a VISIBILITY CONFLICT instead of trusting a 'visible' probe that the refreshed state contradicts,
  and it never prints a value (TestPlanReport).
- environment-taxonomy.yaml carries axis_a.github verbatim; validate_admin_root_premerge_gate still derives terraform/bootstrap
  and not terraform/github.
- rec-4335's decidable acceptance (three class nodes; repaired 2026-10-15) passes at the merge, and the squash merge's Resolves
  trailer closes rec-4335.
verification_plan:
- step: 1
  phase: pre-deploy
  action: The reporter's counts, verdict, gating rule, VISIBILITY CONFLICT flag, drift section, fail-closed paths and never-a-value
    guarantee
  command: bin/venv-python -m pytest "tests/test_terraform_github_pr_plan.py::TestPlanReport" -q
  expected: every test passes; before the change the class does not exist (exit 4, red)
  fix_if: a masking case labels a real change as gated, or a sentinel value reaches the output -- fix the reporter
  hermetic: true
  graduation: graduate
  graduation_check_id: terraform-github-plan-report-classifier
- step: 2
  phase: pre-deploy
  action: the workflow's triggers, guards, permissions, credentials, plan flags and cleanup; the taxonomy row; the CLAUDE.md
    pointer
  command: bin/venv-python -m pytest "tests/test_terraform_github_pr_plan.py::TestWorkflowAndTaxonomy" -q
  expected: every test passes; before the change the class does not exist (exit 4, red)
  fix_if: a shape assertion fails -- restore the planned workflow or approved text; never loosen the test
  hermetic: true
  graduation: graduate
  graduation_check_id: terraform-github-plan-workflow-wiring
- step: 3
  phase: pre-deploy
  action: approved text landed verbatim (taxonomy row and amendment, CLAUDE.md section) and the workflow matches the planned
    block apart from comments and step names
  command: 'bin/venv-python -c "import yaml,textwrap; p=yaml.safe_load(open(''docs/plans/PLAN-terraform-github-pr-plan.yaml''))[''execution_steps''];
    cut=lambda t,a,b: textwrap.dedent(t.split(a+''\n'',1)[1].split(''\n''+b,1)[0] if b else t.split(a+''\n'',1)[1]); tax=yaml.safe_load(open(''docs/contracts/environment-taxonomy.yaml''));
    assert tax[''axis_a''][''github'']==yaml.safe_load(cut(p[2],''APPROVED_ROW:'',''APPROVED_AMENDMENT:''))[''github''], ''row'';
    want=yaml.safe_load(cut(p[2],''APPROVED_AMENDMENT:'',''''))[0]; got=tax[''amendment_log''][0]; assert {k:v for k,v in
    got.items() if k!=''date''}=={k:v for k,v in want.items() if k!=''date''}, ''amendment''; sec=cut(p[3],''APPROVED_SECTION:'','''').strip();
    assert sec in open(''terraform/github/CLAUDE.md'').read(), ''section''; strip=lambda d: {**d, ''jobs'': {j: {**v, ''steps'':
    [{k:x for k,x in s.items() if k!=''name''} for s in v[''steps'']]} for j,v in d[''jobs''].items()}}; assert strip(yaml.safe_load(open(''.github/workflows/terraform-github-plan.yml'')))==strip(yaml.safe_load(cut(p[0],''WORKFLOW:'',''''))),
    ''workflow''; print(''APPROVED TEXT VERBATIM'')"'
  expected: exit 0, APPROVED TEXT VERBATIM printed
  fix_if: any assertion names a block -- restore the approved text; a needed wording change goes back to the operator
  hermetic: true
  graduation: waive
  graduation_waiver_reason: Binds to this plan's historical approved blocks, which later amendments may legitimately change;
    step 2 graduates the structural shape.
- step: 4
  phase: pre-deploy
  action: rec-4335's live acceptance is decidable, so the trailer-closure job can evaluate it at the merge (critique M2)
  command: AWS_PROFILE=agent_platform bin/venv-python -c "from scripts.ops_data_portal import _fetch_rec_from_reader as f;
    from scripts.executor.acceptance_lint import lint_acceptance_command as l; a=f('rec-4335')['acceptance']; ok=l(a, require_discrimination=True,
    require_decidable=True); print('ACCEPTANCE_LINT', ok); assert ok==(True, None) and '::TestPlanReport' in a and '::TestWorkflowAndTaxonomy'
    in a and '::TestPlannerStateGrant' in a, a; print('REC_4335_ACCEPTANCE_DECIDABLE')"
  expected: ACCEPTANCE_LINT (True, None) and REC_4335_ACCEPTANCE_DECIDABLE (the planning thread set the three-class-node form
    on 2026-10-15)
  fix_if: the acceptance was changed back to a whole-file pytest -- call get_rec_write_guidance(), then one update_rec restoring
    the three-class-node form (equivalent, never weaker)
  hermetic: false
  graduation: not-applicable
- step: 5
  phase: pre-deploy
  action: Fast tier before push
  command: bin/venv-python -m scripts.validate --pre
  expected: exit 0; validate_prose_limits and validate_prose_budget_raises PASS with no budget change; validate_composite_action_shell_bodies,
    validate_ci_rca_adjudication, validate_graduation_completeness, validate_contract_drift, validate_actions_account_id_masking
    and validate_admin_root_premerge_gate PASS
  fix_if: any failure -- fix on the branch
  hermetic: false
  graduation: waive
  graduation_waiver_reason: A whole fast-tier run over diff-relative state; graduate steps may not invoke scripts.validate
    (recursion), and steps 1 and 2 carry the durable regressions.
- step: 6
  phase: pre-deploy
  action: Full tier, then HEAD attestation, before each commit and push (handoff_policy)
  command: bin/venv-python -m scripts.validate && bin/venv-python -m scripts.checks.validation_result --verify-head
  expected: the full tier exits 0 and the validation result attests the current HEAD's tree
  fix_if: any failure -- fix and rerun the full tier from the start; never push on a partial or timed-out run
  hermetic: false
  graduation: waive
  graduation_waiver_reason: The full tier cannot graduate (recursion refusal) and depends on the whole tree at HEAD; it is
    the handoff gate, not a regression check.
- step: 7
  phase: pre-deploy
  action: Live proof -- the workflow PR's own terraform-github-plan run, the root's first live plan
  command: 'echo ''VIA MCP: mcp__github__actions_list(method="list_workflow_runs", owner="benjamin-blake", repo="theseus",
    workflow_id="terraform-github-plan.yml") for the workflow PR head sha, then mcp__github__get_job_logs for the plan job,
    and mcp__github__pull_request_read(method="get_comments") for the report comment'''
  expected: 'The job is green: CONFIG_OK, REVIEWERS_RESOLVED, terraform exit 2 (or 0), the report comment present. Expected
    content (rec-3136''s run-1 evidence, not acted on here): verdict CHANGES with about five in-place updates on the resources
    still keyed on the old repository name, destroy=0, replace=0, and a VISIBILITY line for both fields. The log carries no
    plan diff text (no "will be updated in-place" line) and no reviewer id. Record the machine line, the VISIBILITY line and
    the run URL in /mnt/project-files/terraform-github-pr-plan/evidence-first-run.md (counts and names only). The job''s own
    report comment on the PR is the V3 evidence artifact (context ''V3 resolution:'').'
  fix_if: 'CONFIG_MISSING -- an operator console step is not done; tell the operator which name. A failure, destroy or replace
    confined to the five resources still keyed on the old repository name (the known rec-3136 drift) is not a build defect:
    post the counts, keep the PR open, and tell the coordinator so the rec-3136 state fix (operator state rm and import, its
    own plan) runs while this PR is open; then re-run this PR''s job when only state changed, or update the PR from main when
    code changed, as the proof, which must then read 0 to change apart from visibility-gated rows. A VISIBILITY CONFLICT is
    recorded in the evidence, not a stop (bypass_actors visibility stays unproven and the operator''s plan authoritative).
    Any other plan exit 1 or a 403 ''Resource not accessible by integration'' -- stop, never widen the App or retry blind,
    and send the diagnostic to the planner through the coordinator (Decision 55).'
  hermetic: false
  graduation: not-applicable
- step: 8
  phase: post-deploy
  action: Closure -- rec-4335 closed by the workflow PR's squash merge
  command: AWS_PROFILE=agent_platform bin/venv-python -c "from scripts.ops_data_portal import _fetch_rec_from_reader as f;r=f('rec-4335');assert
    r and r['status']=='closed',(r or {}).get('status');print('REC_4335_CLOSED')"
  expected: 'Exit 0 and REC_4335_CLOSED printed, after ci.yml''s closure job runs on the squash merge carrying "Resolves:
    rec-4335"'
  fix_if: 'still open -- read the trailer-closure job log: an out_of_grammar or refused acceptance verdict means the live
    acceptance is not the decidable three-class-node form (rerun step 4''s repair, then use only the log''s printed close_proposed
    command); otherwise the acceptance pytest must pass at main. Never close it around the gate.'
  hermetic: false
  graduation: not-applicable
test_obligations:
- source: scripts/ci/terraform_github_plan_report.py
  behavior: raw counts, the strict gating rule, drift kept separate, fail-closed input handling, no value ever printed
  verification_step: 1
  test_selector: tests/test_terraform_github_pr_plan.py::TestPlanReport
  red_green_expectation: red before (module and class absent), green after
- source: .github/workflows/terraform-github-plan.yml
  behavior: PR-only path-filtered trigger, same-repo non-Dependabot guard, planner PR-sub with a non-reserved session, read-only
    narrowed App token, read-only plan with text discarded, files deleted, no apply or upload
  verification_step: 2
  test_selector: tests/test_terraform_github_pr_plan.py::TestWorkflowAndTaxonomy
  red_green_expectation: red before (workflow and class absent), green after
- source: docs/contracts/environment-taxonomy.yaml
  behavior: axis_a.github records the CI-planned operator-applied root and is not derived as admin-only
  verification_step: 2
  test_selector: tests/test_terraform_github_pr_plan.py::TestWorkflowAndTaxonomy
  red_green_expectation: red before (row absent), green after
- source: terraform/github/CLAUDE.md
  behavior: the directory rules point at the PR-time plan workflow
  verification_step: 2
  test_selector: tests/test_terraform_github_pr_plan.py::TestWorkflowAndTaxonomy
  red_green_expectation: red before (pointer absent), green after
- source: config/composite_action_body_baseline.yaml
  behavior: every inline run body of the new workflow has an r3_workflows ceiling
  verification_step: 5
  command: bin/venv-python -m scripts.validate --pre
  red_green_expectation: red before (R3-workflow reports each unregistered body), green after
- source: config/ci_rca_taxonomy.yaml
