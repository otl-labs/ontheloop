- source: config/agent/verification_registry/entries/terraform-github-plan-report-classifier.yaml
  behavior: step 1's graduated check is admitted under this plan's slug
  verification_step: 5
  command: bin/venv-python -m scripts.validate --pre
  red_green_expectation: red before (a graduate step with no registry row fails validate_graduation_completeness), green after
- source: config/agent/verification_registry/entries/terraform-github-plan-workflow-wiring.yaml
  behavior: step 2's graduated check is admitted under this plan's slug
  verification_step: 5
  command: bin/venv-python -m scripts.validate --pre
  red_green_expectation: red before (a graduate step with no registry row fails validate_graduation_completeness), green after
constraints:
- 'Approved text is verbatim: APPROVED_ROW, APPROVED_AMENDMENT (variance: date only) and APPROVED_SECTION (the CLAUDE.md pointer).
  The WORKFLOW block is planner-owned and verbatim too (variance: comments and step display names). Anything else goes back
  to the operator through the planner.'
- 'No IAM change here: the planner''s state read is PLAN-terraform-github-plan-state-grant''s, and the workflow PR is pushed
  only after that grant is applied and verified.'
- No terraform/github .tf change, no apply of any root by an agent, no state write; the workflow never applies, imports or
  touches state beyond the plan's read.
- 'Public repo (Decision 101): no account id, ARN, numeric user id, token or plan value in any file, log line, comment, artifact
  or evidence; plan text goes to /dev/null; plan.bin and plan.json are deleted in-job and never uploaded (rec-4230).'
- 'Not a required check (Decision 83): never add terraform-github-plan to repo.tf''s required_status_checks or to ci.yml''s
  signal-green needs in this plan.'
- Never widen the App beyond Metadata, Administration and Actions read, and never add ignore_changes on bypass_actors, to
  silence a diff (github-org-transfer.yaml breakage_map.terraform_github_root).
- 'Files outside scope stay untouched, notably ci.yml, terraform-apply-sandbox.yml, the shared composite actions, deploy-paths.yaml
  (open IAM-refactor PR #1500 edits it) and github-org-transfer.yaml.'
- No rescue agents or workaround loops (Decision 55).
context:
- 'Decision-scout verdict: FLAGS_FOUND -- SPIRIT NOTE 205 (secrets in a pull_request job: operator chose F1-A, residual below);
  162 R3 -> baseline in scope; 101 -> plan text to /dev/null; 126 cl.1 -> row worded as a carve-out; 190 -> drift kept separate.
  CITE: Decision 218, 198, 77, 92, 144, 126, 83, 101, 119, 162, 48. Decisions triaged: 171 of 171. Roadmap items intersected:
  3; CONFLICT: 0; RELATED: 3'
- 'gates: decision-scout=FLAGS_FOUND; plan-critique=PROCEED after 4 round(s); round 4 autonomous'
- 'V3 resolution: the workflow PR''s own report comment for its head (run URL, machine line, VISIBILITY line) is the V3 evidence
  the implement V3 Merge Gate and code-review V3 check require; VP step 8 is post-merge closure, not a merge precondition.'
- 'Step 6b (Benjamin, 2026-10-15, thread message cmsg_017f94mmYqSe3q2p9o6tPW3UXPtLoJDpYr4dee7sinLKwW, ''happy with your recommendations.
  write the plan''): F1-A, F2-A, F3-A; APPROVED_ROW and APPROVED_AMENDMENT verbatim (variance: date). APPROVED_SECTION is
  a 137-byte pointer (critique r2 M1: prose budget), detail in the workflow header: approved, option A (2026-10-15, cmsg_017f94mmYqSe3q2p9o6tPW3UHsVLA16FUKfiLpjaFwnyur).
  Evidence: /mnt/project-files/terraform-github-pr-plan/.'
- 'OPERATOR STEPS (console, always-ask, before the workflow PR): (1) create an otl-labs GitHub App, public until the transfer,
  webhook off, repository permissions Metadata, Administration, Actions read-only only; (2) generate a key; (3) install it
  on the personal account, this repository only; (4) secret TF_GITHUB_PLAN_APP_PRIVATE_KEY, variables TF_GITHUB_PLAN_APP_CLIENT_ID
  and TF_GITHUB_GATED_APPLY_REVIEWER_LOGINS (comma-separated). No running cost.'
- 'Sequencing: PLAN-terraform-github-plan-state-grant''s PR (the IAM grant) merges and applies first; this plan''s single
  workflow PR follows, and its own run is the live proof. Split at critique round 1 (M1): one plan per PR (rec-3139 convention).
  The workflow PR needs the operator''s code-owner approval (CODEOWNERS covers /.github/workflows/terraform-*.yml and /terraform/github/).'
- rec-3136 (state fix) starts after this PR merges. State keys all five resources on the old name; provider v6.12.1 source
  (read 2026-10-15) has no ForceNew on repository for the ruleset, permissions or environment (rename-aware diff), so the
  run should read about five in-place updates, no replace -- rec-3136's run 1. If it does not, VP step 7's fix_if lets the
  state fix run while this PR is open.
- 'Visibility (GitHub docs and provider v6.12.1 source, 2026-10-15): bypass_actors reaches only ruleset-write callers (phantom
  +1 actor when hidden); security_and_analysis only admins (provider skips it: no diff; ghas-probe.yml is the live control).
  terraform show -json prints sensitive variables, so plan.json (holding the App token) never leaves the runner.'
- 'Accepted residual (Decision 205 note, F1-A): a same-repo PR author can read the App key -- the principals who already hold
  the planner''s PR-sub writes; the App is read-only on one repository, the token narrowed at mint. Rotate the key when the
  App goes private.'
- 'After the transfer no workflow edit is needed: the token action finds the installation from the repository path.'
- 'Overlap (2026-10-15): the telemetry-capture stream touches .claude/hooks and settings; IAM refactor PR #1500 touches terraform/bootstrap
  and deploy-paths.yaml; no shared file. The workflow is new. No open critical CI-RCA rec at plan start.'
- Land before the OIDC pre-stage build PR merges, its freeze point (github-org-transfer.yaml pre_stage lists this prerequisite;
  operator freeze rule 2026-10-15).
- 'Deferred at the operator''s request (same message): rec-4348 typed pre_merge_live_contact field (Fable Q4), rec-4349 deploy-paths.yaml
  pointer (Fable Q4), rec-4350 evidence_ledger probe entry (Fable Q8).'
- create-github-app-token@v3's client-id input read from the v3 tag's action.yml, 2026-10-15.
- 'rec-4335''s acceptance was repaired by the planning thread on 2026-10-15 to the three class nodes (critique M2: a whole-file
  pytest is not require_decidable, so the trailer gate would refuse it); only this plan''s squash body carries ''Resolves:
  rec-4335''.'
pre_implementation_checklist:
- Branch confirmed not on main
- docs/PROJECT_CONTEXT.md read
- only the plan-cited decision sections
- All files in scope located and readable
- Acceptance criteria understood and verifiable
- The operator's console steps (context OPERATOR STEPS) are done before the workflow PR is pushed
execution_steps:
- |-
  .github/workflows/terraform-github-plan.yml -- create it with the WORKFLOW block below, verbatim (allowed variance: scope row). Every inline run body gets an r3_workflows ceiling (scope row for config/composite_action_body_baseline.yaml).
  WORKFLOW:
    name: terraform-github-plan

    # PR-time read-only plan of terraform/github (rec-4335; docs/contracts/github-org-transfer.yaml
    # prerequisites.terraform-github-pr-time-plan). The root is applied by hand by the operator and never
    # auto-applies (Decision 77); this job gives every PR that touches it a live provider contact BEFORE
    # merge (the #1316 failure class). Advisory: NOT a required check (Decision 83). It never applies. The
    # plan's own text never reaches the public log (stdout discarded); plan.bin and plan.json never leave
    # the runner -- both carry variable values, the App token included, in plain text (rec-4230).
    #
    # Credentials: AWS through OIDC as agent-platform-github-ci-planner under its PR-sub trust with a
    # NON-reserved role-session-name (Decision 92 pt2), whose only grant on this root's state is
    # s3:GetObject on tfstate/github/terraform.tfstate; GitHub through a short-lived installation token
    # from the read-only otl-labs plan App (Metadata, Administration and Actions read), scoped to this
    # repository, narrowed at mint time and revoked at job end. Same-repo, non-Dependabot PRs only: forks
    # and Dependabot runs receive no repository secrets. Accepted residual (Decision 205's
    # secrets-in-a-pull_request-job note): a same-repo PR author can edit this file and read the App key;
    # the App is read-only and installed on this one repository.
    #
    # Reading the report (terraform/github/CLAUDE.md points here): this job is the root's pre-merge live
    # provider contact; agent sessions cannot plan this root themselves. Read its PR comment before
    # merging. It posts counts, per-resource actions and changed attribute names on the PR, never values.
    # Its VISIBILITY line says whether the App can see security_and_analysis and the ruleset's
    # bypass_actors; while either is hidden, the operator's own plan is authoritative for that field. The
    # job fails on a plan error and on any destroy or replace. The operator still applies the merged change by hand (terraform/github/CLAUDE.md runbook).
    # Configuration: repository secret TF_GITHUB_PLAN_APP_PRIVATE_KEY; repository variables
    # TF_GITHUB_PLAN_APP_CLIENT_ID and TF_GITHUB_GATED_APPLY_REVIEWER_LOGINS (the reviewers' logins,
    # resolved to ids at run time).

    on:
      pull_request:
        paths:
          - 'terraform/github/**'
          - '.github/workflows/terraform-github-plan.yml'
          - 'scripts/ci/terraform_github_plan_report.py'

    permissions:
      contents: read

    concurrency:
      group: terraform-github-plan-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: true

    jobs:
      plan:
        if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' }}
        runs-on: ubuntu-latest
        timeout-minutes: 15
        permissions:
          id-token: write       # OIDC for the planner role (PR-sub, non-reserved session)
          contents: read
          pull-requests: write  # post the plan report comment
        env:
          TF_IN_AUTOMATION: "1"
          TF_INPUT: "0"
          WORKDIR: terraform/github
          MASK_AWS_ROLE_ID_ACCOUNT_PART: ${{ secrets.AWS_ROLE_ID_ACCOUNT_PART }}

        steps:
          - uses: actions/checkout@v7

          - name: Check plan configuration
            env:
              APP_CLIENT_ID: ${{ vars.TF_GITHUB_PLAN_APP_CLIENT_ID }}
              APP_PRIVATE_KEY_SET: ${{ secrets.TF_GITHUB_PLAN_APP_PRIVATE_KEY != '' }}
              REVIEWER_LOGINS: ${{ vars.TF_GITHUB_GATED_APPLY_REVIEWER_LOGINS }}
            run: |
              missing=""
              [ -n "$APP_CLIENT_ID" ] || missing="$missing variable:TF_GITHUB_PLAN_APP_CLIENT_ID"
              [ "$APP_PRIVATE_KEY_SET" = "true" ] || missing="$missing secret:TF_GITHUB_PLAN_APP_PRIVATE_KEY"
              [ -n "$REVIEWER_LOGINS" ] || missing="$missing variable:TF_GITHUB_GATED_APPLY_REVIEWER_LOGINS"
              if [ -n "$missing" ]; then
                echo "::error::CONFIG_MISSING${missing} (terraform/github/CLAUDE.md, PR-time plan)"
                exit 1
              fi
              echo "CONFIG_OK"

          - name: Configure AWS credentials (OIDC -- planner role, PR-sub, non-reserved session)
            uses: aws-actions/configure-aws-credentials@v6
            with:
              role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/agent-platform-github-ci-planner
              role-session-name: terraform-github-plan-pr
              aws-region: eu-west-2

          - name: Mint the read-only plan App token (this repository only)
            id: app_token
            uses: actions/create-github-app-token@v3
            with:
              client-id: ${{ vars.TF_GITHUB_PLAN_APP_CLIENT_ID }}
              private-key: ${{ secrets.TF_GITHUB_PLAN_APP_PRIVATE_KEY }}
              permission-metadata: read
              permission-administration: read
              permission-actions: read

          - name: Resolve reviewer ids (kept out of the log)
            # The ids go to a runner-temp file, never to an env block or GITHUB_ENV, both of which the
            # public log echoes. Logins are public (CODEOWNERS); the variable holds logins, never ids.
            env:
              GH_TOKEN: ${{ steps.app_token.outputs.token }}
              REVIEWER_LOGINS: ${{ vars.TF_GITHUB_GATED_APPLY_REVIEWER_LOGINS }}
            run: |
              ids=""
              for login in ${REVIEWER_LOGINS//,/ }; do
                id=$(gh api "users/${login}" --jq .id) || { echo "::error::REVIEWER_LOOKUP_FAILED ${login}"; exit 1; }
                ids="${ids:+${ids},}${id}"
              done
              [ -n "$ids" ] || { echo "::error::REVIEWER_LOOKUP_FAILED no login resolved"; exit 1; }
              printf '[%s]' "$ids" > "$RUNNER_TEMP/reviewer_ids"
              echo "REVIEWERS_RESOLVED"

          - name: Read pinned Terraform version
            id: tfver
            run: echo "version=$(cat config/terraform-version)" >> "$GITHUB_OUTPUT"

          - name: Setup Terraform
            uses: hashicorp/setup-terraform@v4
            with:
              terraform_version: ${{ steps.tfver.outputs.version }}
              terraform_wrapper: false

          - name: Setup Python 3.12
            uses: actions/setup-python@v7
            with:
              python-version: '3.12'

          - name: Terraform init (S3 backend, lock file read-only)
            working-directory: ${{ env.WORKDIR }}
            run: terraform init -input=false -lockfile=readonly

          - name: Terraform plan (read-only, -lock=false, text never logged)
            id: plan
            working-directory: ${{ env.WORKDIR }}
            env:
              TF_VAR_github_token: ${{ steps.app_token.outputs.token }}
            run: |
              TF_VAR_gated_apply_reviewer_user_ids="$(cat "$RUNNER_TEMP/reviewer_ids")"
              export TF_VAR_gated_apply_reviewer_user_ids
              set +e
              terraform plan -lock=false -input=false -no-color -detailed-exitcode -out=plan.bin > /dev/null
              rc=$?
              set -e
              echo "exit_code=${rc}" >> "$GITHUB_OUTPUT"
              if [ "$rc" -ne 0 ] && [ "$rc" -ne 2 ]; then
                echo "::error::TF_GITHUB_PLAN_FAILED terraform plan exited ${rc} (diagnostics above)"
                exit 1
              fi
              terraform show -json plan.bin > plan.json
              rm -f plan.bin

          - name: Probe what the plan App can see
            # The two fields GitHub returns only to admin or ruleset-write callers
            # (github-org-transfer.yaml breakage_map.terraform_github_root): true / false / unknown each.
            # A null security_and_analysis reads as hidden; a "visible" bypass_actors that the refreshed
            # state contradicts is flagged by the report as a VISIBILITY CONFLICT, never trusted.
            env:
              GH_TOKEN: ${{ steps.app_token.outputs.token }}
              REPO: ${{ github.repository }}
            run: |
              set +e
              san=$(gh api "repos/${REPO}" --jq '.security_and_analysis != null' 2>/dev/null)
              [ -n "$san" ] || san=unknown
              bypass=unknown
              rid=$(gh api "repos/${REPO}/rulesets" --jq '.[] | select(.name == "main-protection") | .id' 2>/dev/null)
              if [ -n "$rid" ]; then
                bypass=$(gh api "repos/${REPO}/rulesets/${rid}" --jq 'has("bypass_actors")' 2>/dev/null)
                [ -n "$bypass" ] || bypass=unknown
              fi
              printf '{"security_and_analysis": "%s", "ruleset_bypass_actors": "%s"}\n' "$san" "$bypass" > "$RUNNER_TEMP/visibility.json"
              cat "$RUNNER_TEMP/visibility.json"

          - name: Report (counts and attribute names only, never values)
            id: report
            working-directory: ${{ env.WORKDIR }}
            env:
              HEAD_SHA: ${{ github.event.pull_request.head.sha }}
              RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
              PLAN_EXIT: ${{ steps.plan.outputs.exit_code }}
            run: |
              python3 "$GITHUB_WORKSPACE/scripts/ci/terraform_github_plan_report.py" \
                --plan-json plan.json --visibility "$RUNNER_TEMP/visibility.json" --plan-exit-code "$PLAN_EXIT" \
                --head-sha "$HEAD_SHA" --run-url "$RUN_URL" --github-output "$GITHUB_OUTPUT" > "$RUNNER_TEMP/report.md"
              cat "$RUNNER_TEMP/report.md" >> "$GITHUB_STEP_SUMMARY"
              cat "$RUNNER_TEMP/report.md"

          - name: Post the report on the PR
            if: always() && steps.plan.outcome != 'skipped'
            env:
              GH_TOKEN: ${{ github.token }}
              REPO: ${{ github.repository }}
              PR_NUM: ${{ github.event.pull_request.number }}
              HEAD_SHA: ${{ github.event.pull_request.head.sha }}
              RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
              PLAN_OUTCOME: ${{ steps.plan.outcome }}
              REPORT_OUTCOME: ${{ steps.report.outcome }}
            run: |
              if [ "$REPORT_OUTCOME" = "success" ]; then
                body=$(cat "$RUNNER_TEMP/report.md")
              else
                body="### terraform/github PR-time plan (rec-4335)"$'\n\n'"**FAILED** at head \`${HEAD_SHA}\` (plan step: ${PLAN_OUTCOME}, report step: ${REPORT_OUTCOME}). Read the run log: ${RUN_URL}"
              fi
              gh pr comment "$PR_NUM" --repo "$REPO" --body "$body" || true

          - name: Fail on destroy or replace
            if: steps.report.outputs.destructive == 'true'
            run: |
              echo "::error::TF_GITHUB_PLAN_DESTRUCTIVE the plan destroys or replaces a resource; read the PR comment before any apply"
              exit 1

          - name: Delete plan files (never persisted or uploaded)
            if: always()
            working-directory: ${{ env.WORKDIR }}
            run: rm -f plan.bin plan.json
- |-
  scripts/ci/terraform_github_plan_report.py, per this spec:
  scripts/ci/terraform_github_plan_report.py -- stdlib only (argparse, json, sys, pathlib, typing, __future__); invoked by
  path with python3 (never `-m scripts.`, no third-party import), so validate_workflow_dependency_install needs no install step.
  CLI: --plan-json PATH --visibility PATH --plan-exit-code {0,2} --head-sha SHA --run-url URL [--github-output PATH]
  Writes the markdown report to stdout and exits 0. Exits 2 (one line on stderr, nothing on stdout) when the plan JSON is
  missing, unreadable, not an object, or has no resource_changes list (fail closed). A missing or unreadable visibility file
  is not an error: every field is then "unknown". With --github-output, appends `verdict=<v>`,
  `destructive=<true|false>` and `conflict=<true|false>` lines to that file.

  Public functions (tested directly):
    load_visibility(path) -> dict[str, str]  # per field "visible" | "hidden" | "unknown"; only the JSON string "false"
                                             # maps to hidden and "true" to visible
    classify(plan: dict, visibility: dict[str, str]) -> Report  # pure
    render(report, head_sha, run_url, plan_exit_code) -> str     # pure

  Per resource_changes[] entry rc (mode == "data" ignored):
    actions = rc["change"]["actions"]; importing = bool(rc["change"].get("importing"))
    - importing -> import += 1 (["no-op"] + importing is import only)
    - ["create"] -> add += 1; ["update"] -> change += 1; ["delete"] -> destroy += 1;
      ["delete","create"] or ["create","delete"] -> replace += 1, add += 1, destroy += 1 (terraform's own summary counting)
    - ["no-op"] or ["read"] without importing -> not listed
    - changed attribute NAMES: treat a null change.before (create) or change.after (delete) as {}; over the keys of
      before, after and after_unknown, the sorted keys k with before.get(k) != after.get(k), plus keys whose
      after_unknown[k] holds a literal true anywhere (recursive -- after_unknown nests lists and maps of false)
    - row label VISIBILITY-GATED iff ALL hold: rc["type"] == "github_repository_ruleset"; actions == ["update"]; not
      importing; visibility["ruleset_bypass_actors"] == "hidden"; changed names == ["bypass_actors"]; and
      change.before.get("bypass_actors") in (None, []).
    Counts are RAW: a gated row still counts in change (the classifier never subtracts). Nothing else is ever labelled.
    VISIBILITY CONFLICT iff visibility["ruleset_bypass_actors"] == "visible" and some github_repository_ruleset update row's
      changed names == ["bypass_actors"] with change.before.get("bypass_actors") in (None, []): the probe says visible but
      the refreshed state holds no actor, so the visibility claim is unproven. The row stays ungated; conflict = true.
  Per resource_drift[] entry (Decision 190: kept separate from resource_changes; terraform omits the key when empty, so an absent resource_drift reads as []): drift += 1; address listed by name only.

  verdict: NO_CHANGES when no row is listed; VISIBILITY_GATED_ONLY when every listed row is gated; otherwise CHANGES.
  destructive: true when destroy + replace > 0. conflict: true when a VISIBILITY CONFLICT fired.

  render (exact first lines; table rows sorted by address):
    ### terraform/github PR-time plan (rec-4335)
    PR head `<sha>` - [run](<url>) - read-only and advisory: it never applies.
    **<verdict>**: <i> to import, <a> to add, <c> to change, <d> to destroy (<r> replaced, <g> visibility-gated, <x> drifted; terraform exit <e>)
    VISIBILITY: security_and_analysis=<v> ruleset_bypass_actors=<v>
    then: when security_and_analysis is not visible, "Secret-scanning fields are UNVERIFIED by this plan (the App cannot
    read them); ghas-probe.yml is the live control."; when any row is gated, "Visibility-gated rows change only a field
    the App cannot read; the operator's own plan is authoritative for it (github-org-transfer.yaml
    breakage_map.terraform_github_root)."; when conflict, "VISIBILITY CONFLICT: the probe reports bypass_actors visible
    but the refreshed state has none; its visibility is UNPROVEN and this run proves nothing about it."; when destructive, "DESTROY OR REPLACE present: this job fails; do not apply
    without reading this."; a table | Resource | Action | Changed attributes | per listed row (gated rows marked
    "(visibility-gated)") or "No changes."; a "Drift detected outside Terraform:" line naming drifted addresses when drift
    > 0; last line, machine-readable:
    TF_GITHUB_PLAN_REPORT verdict=<v> import=<i> add=<a> change=<c> destroy=<d> replace=<r> gated=<g> drift=<x> conflict=<0|1> exit=<e>
  Never prints any value from change.before / change.after / after_unknown, nor variables, prior_state, configuration,
  planned_values or output_changes.
- |-
  docs/contracts/environment-taxonomy.yaml -- insert APPROVED_ROW as axis_a.github directly after the axis_a.bootstrap row (two-space indent as shown), and prepend APPROVED_AMENDMENT as the first amendment_log entry. Allowed variance: the amendment date only.
  APPROVED_ROW:
    github:
      money_real: "N/A (GitHub repository settings: ruleset, Environments, Actions permissions, secret scanning)"
      code_vs_infra: "terraform/github/ only"
      apply_gating: >-
        operator hand apply only (classic admin PAT), NEVER auto-apply (Decision 77), a recorded
        carve-out from Decision 126's CI-applies infra trigger; not admin-only: its pre-merge live
        provider contact is the read-only PR-time CI plan (terraform-github-plan.yml, rec-4335), so
        deploy-paths.yaml admin_out_of_band.pre_merge_live_plan does not apply to it
      account: "GitHub repository settings; state in the current personal account"
  APPROVED_AMENDMENT:
    - date: "2026-10-15"
      semantic_break: false
      change_class: field_add
      summary: >-
        PLAN-terraform-github-pr-plan (rec-4335): axis_a gains a github row recording terraform/github's
        existing operator hand apply and its new read-only PR-time CI plan, the root's pre-merge live
        provider contact. The row is not admin-only, so validate_admin_root_premerge_gate still derives
        only terraform/bootstrap. No apply-model or guard-classification field changed.
- |-
  terraform/github/CLAUDE.md -- insert APPROVED_SECTION verbatim, followed by one blank line, directly before the line "## tf-gated-apply Environment" (137 bytes: the file's prose budget has 140 bytes of headroom, so no budget change).
  APPROVED_SECTION:
  ## PR-time plan (rec-4335)

  Every PR touching this root runs `.github/workflows/terraform-github-plan.yml`; its header holds the rules.
- |-
  tests/test_terraform_github_pr_plan.py -- add two classes beside TestPlannerStateGrant (fixtures inline; if the file would pass 500 SLOC, move test helpers to tests/fixtures/terraform_github_plan_fixtures.py -- the plan-JSON builders first, then the HCL and workflow parsing helpers (tests/fixtures/terraform_hcl_blocks.py is the precedent); the three classes stay in this file, since rec-4335's acceptance and the registry node ids pin them; no cross-test imports):
  TestPlanReport (imports scripts.ci.terraform_github_plan_report): a no-op plan with no resource_drift key is NO_CHANGES with all counts 0 and destructive false; a ruleset update whose only changed key is bypass_actors (before [], after one actor) with the probe hidden is labelled visibility-gated, still counts change=1 (raw), verdict VISIBILITY_GATED_ONLY; the same row with the probe visible, and with it unknown, is not gated (verdict CHANGES); bypass_actors plus any other changed key is not gated; a non-empty before bypass_actors is not gated; a bypass_actors-only update with before [] while the probe says visible raises the VISIBILITY CONFLICT line, conflict=1 and conflict=true, and is not gated; one gated row plus another update is verdict CHANGES with gated=1; an import-only row counts import=1, change=0; ["delete","create"] counts replace=1, add=1, destroy=1 and destructive true; ["delete"] is destructive; after_unknown holding only nested false adds no changed name and a nested true does; resource_drift entries count in drift only and are listed by address; mode "data" rows are ignored; sentinel strings placed in before, after, after_unknown, variables, prior_state and configuration never appear in the rendered output; load_visibility maps "false" to hidden, "true" to visible, anything else and a missing file to unknown; main() with an unreadable or non-object plan JSON exits 2 with empty stdout; main() with --github-output appends verdict=, destructive= and conflict= lines; the last stdout line starts "TF_GITHUB_PLAN_REPORT verdict="; the module imports only stdlib modules (ast walk against an allowlist).
  TestWorkflowAndTaxonomy (yaml.safe_load; the "on" key loads as True): triggers are exactly pull_request with paths ['terraform/github/**', '.github/workflows/terraform-github-plan.yml', 'scripts/ci/terraform_github_plan_report.py'] and nothing else (no push, schedule, workflow_dispatch, pull_request_target, workflow_run); the job if requires head.repo.full_name == github.repository and github.actor != 'dependabot[bot]'; top-level permissions are exactly contents: read and job permissions exactly id-token: write, contents: read, pull-requests: write; the configure-aws-credentials step's role-to-assume references secrets.AWS_ACCOUNT_ID and ends role/agent-platform-github-ci-planner, its role-session-name is terraform-github-plan-pr and differs from local.convergence_writer_session_name read from terraform/personal/oidc.tf, and it has no continue-on-error; the create-github-app-token step's with keys are exactly client-id, private-key, permission-metadata, permission-administration, permission-actions, every permission value is read, and no owner or repositories input is set; the plan step's run carries -lock=false, -detailed-exitcode and "> /dev/null"; the probe step tests security_and_analysis with '!= null' and bypass_actors with has("bypass_actors"); no run body anywhere in the file contains "terraform apply", "terraform import", "state rm", "state mv", "state push", "force-unlock", "aws s3", or writes GITHUB_ENV, and no step uses actions/upload-artifact; an if: always() step removes plan.bin and plan.json; no step env value names reviewer ids (the ids flow only through the runner-temp file); "terraform-github-plan" does not appear in terraform/github/repo.tf; environment-taxonomy.yaml axis_a.github exists, its code_vs_infra names terraform/github, its apply_gating names terraform-github-plan.yml and "NEVER auto-apply" and does not start with "admin-only"; scripts.checks.verification.validate_admin_root_premerge_gate._derive_admin_only_roots on the real taxonomy returns no error and includes terraform/bootstrap but not terraform/github; terraform/github/CLAUDE.md contains ".github/workflows/terraform-github-plan.yml".
  Create the step 1 and step 2 registry entries. Register the workflow's inline bodies in config/composite_action_body_baseline.yaml r3_workflows at their measured counts.
- 'Sequence and closure (implement skill Commit Flows; docs/contracts/git-ops.yaml), each outcome reported separately. Start
  only after PLAN-terraform-github-plan-state-grant is merged and verified (its VP steps 3-4) and the operator confirms the
  console steps (context OPERATOR STEPS). Restart the harness branch from main and implement execution_steps[0]-[4]. Closure:
  bin/venv-python -m scripts.session.github_readiness, implementation_declared true in this plan, rebase on origin/main, VP
  steps 1-5, VP step 6 on the committed clean tree then --verify-head, then write /tmp/implementation-retrospective.json with
  the ten scripts.session.postflight_evidence.CATEGORIES keys and run bin/venv-python -m scripts.session.postflight --evidence
  /tmp/implementation-retrospective.json, push, the PR, subscribe_pr_activity on it. The PR''s own terraform-github-plan run
  is VP step 7 (wait for its event, never poll): write the evidence file, post the counts-only result in the build thread,
  and follow step 7''s fix_if for any failure. Then dispatch code review (the code-review skill in a fresh context) with the
  context ''V3 resolution:'' line quoted in its prompt, so its V3 Post-Deploy Evidence check reads the run''s report comment;
  fix every blocking finding. Squash-merge only when code review is PROCEED, CI is green on the head and the operator has
  approved the PR on GitHub as code owner, with "Resolves: rec-4335" in a Key: value block of the squash body; then VP step
  8 from the trailer-closure job''s event (never poll), and tell the coordinator so the rec-3136 build can start.'
- Execute the Verification Plan in step order; loop until each step passes; on an unrecoverable V3 failure stop and RCA (Decision
  55).
- Report each closure outcome separately (readiness, implementation_declared, rebase, VP results, full tier and --verify-head,
  postflight evidence, push, PR, CI, merge, closure job), plus the run's machine line, VISIBILITY line, report comment URL
  and the evidence file path.
rollback: 'Revert the PR; nothing live changes (the workflow only reads). Console: uninstall the App and delete its secret
  and variables. No terraform/github state or setting is ever written by this plan.'
