      && { echo "$L" | grep -qE 'verdict=NO_CHANGES import=0 add=0 change=0 destroy=0 replace=0 gated=0 .*conflict=0'
      || { echo "$L" | grep -qE 'verdict=VISIBILITY_GATED_ONLY import=0 add=0 change=1 destroy=0 replace=0 gated=1 .*conflict=0'
