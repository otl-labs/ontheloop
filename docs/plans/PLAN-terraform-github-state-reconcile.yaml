constraints:
  - >-
    Always-ask text is approved verbatim (see context for the approval messages). Allowed variance: dates, run URLs, the
    follow-on rec id, and the clean or visibility-gated variant of the closure ledger text as E2 observed. Any other
    wording change, including one critique or code review asks for, goes to the coordinator, then the operator, before
    merge.
  - >-
    No agent runs terraform apply, state rm, state push or import for terraform/github (Decision 126). The operator runs
    pastes 0, A, B (and R if needed) in AWS CloudShell. The agent's only live write is the rollback S3 version restore,
    and only on the operator's word on the exact command.
  - terraform/github is never added to any workflow that applies (Decision 77); the PR-time plan job stays read-only and advisory.
  - >-
    A Claude Code cloud session cannot plan this root (the proxy replaces the PAT; 403 on Actions settings). Never author
    a local terraform init, validate or plan step for it (Decision 119); verification reads the S3 state object
    directly and the PR-time CI plan.
  - >-
    Evidence is counts, dates, the merge sha and workflow-run URLs only (Decision 101): never post plan text, state
    content, the PAT secret name, user ids or the S3 version id.
  - >-
    No apply of terraform/github by anyone between the build PR merge and E2 other than paste B. If any plan in the walk
    shows a non-identity change: stop, never apply to converge, escalate for a plan amendment. Pre-authorized by the
    2026-10-16 amendment (no new plan amendment needed): E0's default_workflow_permissions row (VP step 6) and VP step
    9's routes for it, including that step's own escalations; any other non-identity change still stops.
  - >-
    Build start gate: Order A, rec-4335's workflow PR merged with its job live; Order B, the coordinator says the
    workflow PR is held open for this state fix (see infrastructure_dependencies). Closure-PR contract edits wait for
    the OIDC pre-stage build to merge (coordinator file-ownership note, 2026-10-15); rebase onto it. This plan never
    touches terraform/personal or terraform/bootstrap.
  - Both PRs touch terraform/github/, which .github/CODEOWNERS assigns to the operator; each needs the operator's code-owner approval.
  - No rescue agents or workaround loops (Decision 55).
