schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: terraform-github-state-reconcile
intent: >-
  Re-key terraform/github's Terraform state from the pre-rename repository name (agent-platform) to the live one
  (theseus) with a state rm and an import-only apply run by the operator in AWS CloudShell, proven by the PR-time
  terraform/github plan reading 0 to change. This gives the GitHub organisation transfer the zero-diff baseline its
  contract requires (prerequisites.terraform-github-state-reconciled, Decision 218), makes a routine terraform/github
  apply safe again, and closes rec-3136.
implementation_declared: true
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-terraform-github-state-reconcile.yaml
phase: >-
  ad_hoc_rec (soft-warn exception category) -- resolves rec-3136 (High). No tier_item criterion claimed. Satisfies
  docs/contracts/github-org-transfer.yaml prerequisites.terraform-github-state-reconciled (Decision 218), which blocks
  the transfer contract's pre_staged phase.
closes_criteria: []
scope:
  - file: terraform/github/imports.tf
    action: Create
    purpose: >-
      Five import blocks, one per resource this root manages, ids derived from var.repository_name (the ruleset id also
      from var.main_protection_ruleset_id). Inert while an address is in state; after a state rm they re-key it under
      the current name with GitHub reads only. Kept after use so a later rename or transfer re-keys by changing the
      variable defaults. Exact text: execution_steps step 2.
  - file: terraform/github/variables.tf
    action: Modify
    purpose: >-
      Append variable main_protection_ruleset_id (number, default the live ruleset id), and in
      gated_apply_reviewer_user_ids' description replace the `gh api /user --jq .id` hint the runbook no longer uses.
      Exact text in execution_steps step 3. No plan diff (descriptions and a new defaulted variable only).
  - file: terraform/github/repo.tf
    action: Modify
    purpose: >-
      Add ignore_vulnerability_alerts_during_read to github_repository.this's lifecycle.ignore_changes (exact text in
      execution_steps step 3). Provider v6.12.1 declares it deprecated with Default false and neither Read nor Import
      ever sets it, so after state rm plus import it is null and the plan would otherwise show an update (a repository
      PATCH). No plan diff today: live state holds false, equal to the default. Also add the four merge-commit message
      fields (merge_commit_message, merge_commit_title, squash_merge_commit_message, squash_merge_commit_title): the
      config never sets them, so they plan to the provider defaults, and the PR-time plan's first run (#1523,
      2026-10-16) read them as differing and planned a reset. Live values equal the defaults (admin read, 2026-10-16),
      so the entries change nothing live; they keep the merge-method settings unmanaged like the allow_* entries.
  - file: terraform/github/CLAUDE.md
    action: Modify
    purpose: >-
      Build PR: the approved wording (execution_steps step 4) -- CloudShell as the by-hand venue, the corrected AWS
      prerequisite, TF_VAR_github_token, --region and curl in the runbook, the duplicated NEVER paragraph removed for
      the 5253-byte prose budget, and a State reconcile section replacing First-time import (rec-3136's acceptance).
      Closure PR: no change (the 2026-10-20 amendment dropped the dated result line, which no longer fits the budget;
      the result lives in the contract's evidence_ledger rows, execution_steps step 12 item 2).
  - file: tests/checks/iam_tf/test_terraform_github_import_blocks.py
    action: Create
    purpose: >-
      Static guard over the real terraform/github tree (behaviour in execution_steps step 5): every managed resource has
      exactly one import block unless named in an explicit exemption set (empty today), each id is the exact expected
      expression for its resource type, no literal owner or repository name, the ruleset id comes from a declared number
      variable; each predicate has its own red case on synthetic HCL.
  - file: config/agent/verification_registry/entries/terraform-github-import-blocks.yaml
    action: Create
    purpose: >-
      Graduation record for VP step 1 (filename == check_id == graduation_check_id): primitive_slot test_selector,
      guard_target terraform/github/imports.tf, guard_symbol null, plan_slug terraform-github-state-reconcile,
      graduated_at the implementation date, graduated_by implement-agent, check_spec.node_id
      tests/checks/iam_tf/test_terraform_github_import_blocks.py::TestTerraformGithubImportBlocks.
  - file: scripts/checks/contracts/_retired_identity.py
    action: Modify
    purpose: >-
      Conditional, build PR only, on evidence: only if the literal sweep's identity readiness build (which creates this
      file and makes validate_github_org_transfer refuse new files naming the retired identity) has merged and
      scripts.validate --pre actually flags tests/checks/iam_tf/test_terraform_github_import_blocks.py, add one
      SURVIVOR_PINS entry for it with the reason "rec-3136 import-block guard". The test reads its names from the
      contract, so this should not be needed; otherwise this file is not touched.
  - file: scripts/checks/contracts/validate_github_org_transfer.py
    action: Modify
    purpose: >-
      Closure PR only, conditional: the OIDC pre-stage build creates this check with PENDING_STATIC_ROWS mapping
      terraform_github_root -> rec-3136. When the closure moves the contract row to rec-4355, change that one mapping
      value to rec-4355 in the same change (no other edit; the agreed extension of the check for this row now belongs
      to rec-4355). Not touched if the file or the mapping is absent.
  - file: tests/checks/contracts/test_validate_github_org_transfer.py
    action: Modify
    purpose: >-
      Closure PR only, conditional: if this test pins the terraform_github_root -> rec-3136 mapping value, change it to
      rec-4355 with the check. Not touched otherwise.
  - file: docs/contracts/github-org-transfer.yaml
    action: Modify
    purpose: >-
      Closure PR only, after the OIDC pre-stage build merges: two evidence_ledger rows for
      prerequisites.terraform-github-state-reconciled, breakage_map.terraform_github_root rec pointer moved to the
      post-transfer re-key follow-on rec, one amendment_log row. Exact text: execution_steps step 12.
bundled_recommendations:
  - rec-3136
followon_recs:
  - rec-4355
infrastructure_dependencies:
  - >-
    rec-4335's two plans (PLAN-terraform-github-plan-state-grant, then PLAN-terraform-github-pr-plan): the planner's
    GetObject on tfstate/github/terraform.tfstate is applied, and the PR-time plan job
    (.github/workflows/terraform-github-plan.yml) runs on same-repo PRs touching terraform/github/**, can be re-run, and
    reports "TF_GITHUB_PLAN_REPORT verdict= import= add= change= destroy= replace= gated= drift= conflict= exit=" (raw
    counts: a visibility-gated row also counts in change) plus "VISIBILITY: security_and_analysis= ruleset_bypass_actors=".
    Order A (expected): the workflow PR's first run is clean (about five in-place updates) and merges; this build starts
    after it. Order B: that first run fails, or shows destroy or replace only on the five old-keyed resources; the
    workflow PR stays open, the coordinator starts this build, and the workflow PR's runs give E0 and E2.
  - >-
    The terraform/github state object (S3 agent-platform-data-lake, key tfstate/github/terraform.tfstate, versioning
    Enabled, use_lockfile) is written only by the operator's CloudShell paste A (state rm) and paste B (import apply),
    or by a rollback on the operator's word. Pre-merge vs post-deploy: every state write is post-merge.
  - >-
    AWS CloudShell (eu-west-2) with outbound HTTPS to releases.hashicorp.com, registry.terraform.io, github.com and
    api.github.com, signed in as an operator identity that can read the terraform/github admin PAT secret and
    Get/Put/Delete tfstate/github/*. Unproven until VP step 9 runs.
  - >-
    The classic terraform/github admin PAT (repo, admin:repo_hook, read:org; Secrets Manager, name supplied by the
    operator at build time) is valid and sees security_and_analysis. If it is gone or expired, a replacement is an
    always-ask credential mint and the live walk waits.
  - >-
    No GitHub-side write: an import-only apply issues GitHub reads only; the only write is the S3 state object. One
    exception, only if VP step 9 reads LIVE_WORKFLOW_DEFAULT=write and on the operator's word: the operator's own UI
    restore of the repository's default workflow permission to read-only, before paste A.
acceptance_criteria:
  - >-
    terraform/github/imports.tf holds exactly one import block per managed resource in terraform/github (none exempt
    today), each id is the exact expected expression for its resource type, and no import id carries a literal owner
    or repository name; the static test passes on the real tree and fails on each synthetic red case.
  - >-
    terraform/github/CLAUDE.md carries the approved wording exactly, rec-3136's acceptance holds (it contains
    'state rm github_repository.this' and 'reconcil'), and the file stays within its config/prose_budgets.yaml budget.
  - >-
    E0, before the reconcile. Order A: the PR-time plan on the build PR reads import=0 add=0 change=5 destroy=0
    replace=0 and the five changed addresses are exactly the five name-keyed resources. Order B: the workflow PR's
    first run (failed, or with destroy or replace) names no address outside the five.
  - >-
    Before merge, paste 0 reports LIVE_WORKFLOW_DEFAULT=read and its dry run at the build PR head, on a local copy of
    the state, reads 5 to import, 0 to add, 0 to change, 0 to destroy; the operator's applied plan was import-only (Apply complete with 5 imported, 0 added, 0
    changed, 0 destroyed) and the CloudShell re-plan exits 0 (No changes).
  - >-
    After the reconcile, the live S3 state keys all five instances on theseus with no agent-platform string left in
    their identity attributes, and a fresh PR-time plan run (E2) reads import=0 add=0 destroy=0 replace=0 conflict=0 and either change=0
    gated=0 (verdict NO_CHANGES) or change=1 gated=1 (verdict VISIBILITY_GATED_ONLY) with ruleset_bypass_actors=hidden.
  - >-
    The closure PR lands the approved evidence_ledger rows, rec pointer and amendment_log row;
    rec-3136 is closed and its acceptance holds at the closing sha (Decision 201).
  - >-
    No account id, ARN, secret name or value, e-mail address, token or ExternalId appears in any changed file, PR body or
    the evidence comment (Decision 101; VP steps 4, 14 and 15).
verification_plan:
  - step: 1
    phase: pre-deploy
    action: Static import-block guard over the real terraform/github tree, with its synthetic red cases.
    command: bin/venv-python -m pytest tests/checks/iam_tf/test_terraform_github_import_blocks.py::TestTerraformGithubImportBlocks -q
    expected: All tests in the class pass.
    expected_literals:
      - passed
    fix_if: >-
      A real-tree failure names the predicate: a resource without an import block (add one, or, only for a resource
      whose remote object does not exist yet, list it in the test's exemption set with a reason), an id that differs
      from its type's expected expression, a literal name, or a missing or non-number ruleset variable -- fix
      imports.tf or variables.tf to the execution_steps text. A red case passing means the predicate is vacuous; fix
      the test.
    hermetic: true
    graduation: graduate
    graduation_check_id: terraform-github-import-blocks
  - step: 2
    phase: pre-deploy
    action: rec-3136's acceptance plus the approved wording's markers in terraform/github/CLAUDE.md.
    command: >-
      grep -q 'state rm github_repository.this' terraform/github/CLAUDE.md && grep -q 'reconcil' terraform/github/CLAUDE.md
      && grep -q 'from AWS CloudShell' terraform/github/CLAUDE.md && ! grep -q 'profile agent_platform' terraform/github/CLAUDE.md
      && ! grep -q 'First-time import' terraform/github/CLAUDE.md
    expected: Exit 0.
    expected_literals: []
    fix_if: A missing or surviving marker means execution_steps step 4 was not applied verbatim; re-apply it. Never reword approved text.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      rec-3136's own acceptance oracle is evaluated at closure under Decision 201; a standing grep on prose would pin
      wording the post-transfer literal sweep (rec-3903) must later rewrite.
  - step: 3
    phase: pre-deploy
    action: The build PR's CLAUDE.md change is exactly the approved diff (added and removed lines), nothing more.
    command: >-
      bin/venv-python -c "import subprocess,yaml; p=yaml.safe_load(open('docs/plans/PLAN-terraform-github-state-reconcile.yaml',encoding='utf-8'));
      want=p['execution_steps'][3].split(chr(10)*2,1)[1]; pick=lambda d: [l for l in d.splitlines() if l.startswith(('+','-')) and not l.startswith(('+++','---'))];
      got=subprocess.run(['git','diff','origin/main','--','terraform/github/CLAUDE.md'],capture_output=True,text=True,check=True).stdout;
      assert pick(want)==pick(got), 'CLAUDE.md differs from the approved diff'; print('CLAUDE_MD_APPROVED', len(pick(got)))"
    expected: Prints CLAUDE_MD_APPROVED followed by the changed-line count (build PR only; the closure PR changes no CLAUDE.md file).
    fix_if: >-
      Any difference is an unapproved wording change: restore the approved text. If main changed the same lines since
      planning, stop and escalate to the planning thread through the coordinator; never re-word to fit.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      A one-time binding of the build PR's diff to the operator-approved text; it depends on origin/main at build time,
      so it cannot be a standing check.
  - step: 4
    phase: pre-deploy
    action: Public-boundary sweep of every added line (Decision 101); the never-commit hook is the backstop, not the check.
    command: >-
      ! git diff origin/main -- terraform/github tests/checks/iam_tf/test_terraform_github_import_blocks.py
      config/agent/verification_registry/entries/terraform-github-import-blocks.yaml docs/contracts/github-org-transfer.yaml
      | grep '^+' | grep -v '^+++' | cut -c2- | grep -Eq '[0-9]{12}|arn:aws|[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[a-z]{2,}|ghp_|github_pat_|ExternalId|secret-id [a-z]'
    expected: Exit 0 (no match).
    expected_literals: []
    fix_if: >-
      A match is a Decision 101 breach (or a real PAT secret name where the runbook keeps a placeholder); remove it.
      Evidence links are workflow-run URLs (/actions/runs/N, 11 digits today), never job URLs; if a run id ever reaches
      12 digits, cite the run by its PR comment link instead.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: The never-commit hook and secret scanning are the standing guards; this is the plan's one-time diff sweep.
  - step: 5
    phase: pre-deploy
    action: Fast presubmit tier (includes validate_prose_limits for the CLAUDE.md budget and the verification-registry checks).
    command: bin/venv-python -m scripts.validate --pre
    expected: Exit 0.
    fix_if: Fix the named check's finding in the changed files only.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: scripts.validate is the aggregate presubmit entrypoint; graduating it would recurse the harness.
  - step: 6
    phase: pre-deploy
    action: >-
      E0 drift evidence. Order A: the PR-time plan run on this build PR's head. Fetch its job log with
      mcp__github__get_job_logs into $E0_LOG and its report comment body with mcp__github__pull_request_read
      (get_comments) into $E0_COMMENT, then check. Order B: see fix_if.
    command: >-
      grep -o 'TF_GITHUB_PLAN_REPORT [A-Za-z0-9=_. -]*' "$E0_LOG" | tail -1 | grep -E 'import=0 add=0 change=5 destroy=0 replace=0'
      && for a in github_repository.this github_repository_ruleset.main_protection github_actions_repository_permissions.this
      github_workflow_repository_permissions.this github_repository_environment.tf_gated_apply; do grep -qF "$a" "$E0_COMMENT" || exit 1; done
      && echo E0_OK
    expected: >-
      The report line reads import=0 add=0 change=5 destroy=0 replace=0 and all five addresses are listed as updates:
      github_repository.this on name, the other four on repository (bypass_actors may also be listed on the ruleset
      only when the VISIBILITY line says ruleset_bypass_actors=hidden; default_workflow_permissions may also be listed
      on github_workflow_repository_permissions.this, as on the workflow PR's first run (#1523, 2026-10-16), and paste
      0's LIVE_WORKFLOW_DEFAULT line decides it (step 9); computed attributes shown as known after apply are fine).
      Then E0_OK. Post the counts, head sha and the workflow-run URL on the PR (counts only).
    fix_if: >-
      Any other count or address, or any other changed argument, is pre-existing drift: STOP, do not merge, and escalate
      to the planning thread through the coordinator; config is reconciled to live by a plan amendment, never by an
      apply. If the job did not run on this PR, escalate the same way. Order B (the coordinator relays it): E0 is the
      workflow PR's first run, which may have failed or shown destroy or replace; accept it only if every address it
      names is one of the five, record its counts and run URL on this PR (a run that planned and then failed at the
      destroy or replace gate has counts; only a run that could not plan records BASELINE_PLAN_FAILED), set
      E0_COUNTS_RE for step 9 (the counts in the paste format, COUNTS import=I add=A change=C destroy=D with a replace
      counted in both add and destroy; or the failed-E0 pattern in step 9's expected), and skip this command. An Order B
      E0 with destroy or replace has no approved closure wording: escalate to the planning thread before the closure PR.
    hermetic: false
    graduation: not-applicable
  - step: 7
    phase: pre-deploy
    action: Full tier, then HEAD attestation, before each commit and push of each PR (build and closure; handoff_policy).
    command: bin/venv-python -m scripts.validate && bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: >-
      The full tier exits 0 and the validation result attests the current HEAD's tree. Run it in the background with a
      timeout of at least 30 minutes; a timeout is a block, never a pass.
    fix_if: Fix the named check's finding in the changed files only and rerun from the start; never push on a partial or timed-out run.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: The full tier cannot graduate (recursion refusal) and depends on the whole tree at HEAD; it is the handoff gate.
  - step: 8
    phase: post-deploy
    action: >-
      ADMIN, read-only -- preconditions for the live walk and the rollback point. MERGE_SHA is the build PR's
      squash-merge sha. If the first command prints nothing (no ADMIN chain), hand steps 8 and 12 to an ADMIN session and
      wait.
    command: >-
      aws sts get-caller-identity --profile agent_platform_admin --query Arn --output text 2>/dev/null | grep -q 'assumed-role/PlatformAdmin/'
      && echo ADMIN_CHAIN_OK && R="${TMPDIR:-/tmp}/tfgithub-reconcile" && mkdir -p "$R" && test -n "$MERGE_SHA"
      && git fetch -q origin main && git merge-base --is-ancestor "$MERGE_SHA" origin/main
      && ! aws s3api head-object --bucket agent-platform-data-lake --key tfstate/github/terraform.tfstate.tflock --profile agent_platform_admin >/dev/null 2>&1
      && aws s3api head-object --bucket agent-platform-data-lake --key tfstate/github/terraform.tfstate --profile agent_platform_admin --query VersionId --output text > "$R/rollback-version"
      && test -s "$R/rollback-version"
      && aws s3 cp s3://agent-platform-data-lake/tfstate/github/terraform.tfstate "$R/state-before.json" --profile agent_platform_admin --only-show-errors
      && bin/venv-python -c "import json,sys; w=sys.argv[1]; s=json.load(sys.stdin); K={('github_repository','this'):'name',('github_repository_ruleset','main_protection'):'repository',('github_actions_repository_permissions','this'):'repository',('github_workflow_repository_permissions','this'):'repository',('github_repository_environment','tf_gated_apply'):'repository'}; I={('github_repository','this'):w,('github_actions_repository_permissions','this'):w,('github_workflow_repository_permissions','this'):w,('github_repository_environment','tf_gated_apply'):w+':tf-gated-apply'}; F={(r['type'],r['name']):r['instances'][0]['attributes'] for r in s.get('resources',[]) if r.get('mode')=='managed' and (r['type'],r['name']) in K}; ok=[k for k,a in F.items() if a.get(K[k])==w and a.get('id')==I.get(k,a.get('id'))]; st=w!='agent-platform' and any('agent-platform' in str(v) for a in F.values() for k2,v in a.items() if k2 in ('id','name','repository','full_name') or k2.endswith('_url')); print('STATE_KEYED',w,'count=%d'%len(ok),'resources=%d'%len(F),'stale' if st else 'clean'); assert len(ok)==5 and len(F)==5 and not st" agent-platform < "$R/state-before.json"
      && git show origin/main:terraform/github/variables.tf > "$R/variables.tf"
      && bin/venv-python -c "import json,re,sys; s=json.load(open(sys.argv[1])); rid=[r['instances'][0]['attributes']['id'] for r in s['resources'] if r.get('mode')=='managed' and r['type']=='github_repository_ruleset'][0]; d=re.search(r'main_protection_ruleset_id.*?default\s*=\s*(\d+)', open(sys.argv[2]).read(), re.S).group(1); assert rid==d, 'ruleset id in state differs from the variable default'; print('RULESET_ID_MATCH')" "$R/state-before.json" "$R/variables.tf"
    expected: >-
      Prints ADMIN_CHAIN_OK, STATE_KEYED agent-platform count=5 resources=5 clean, and RULESET_ID_MATCH: the merge is on
      main, no lock object exists, the current state version is saved as the rollback point (never printed or posted),
      the state is still in the pre-reconcile shape, and the ruleset import id the variable will produce matches the
      live ruleset.
    fix_if: >-
      No ADMIN_CHAIN_OK: run steps 8 and 12 from an ADMIN session, never with the PlatformDev profile. A lock object:
      someone is mid-operation; wait and ask the operator. count below 5: the state changed since E0; stop and RCA
      before any paste. RULESET_ID_MATCH fails: the ruleset was recreated; escalate for a plan amendment of the default.
  - step: 9
    phase: pre-deploy
    action: >-
      PRE-MERGE, OPERATOR, AWS CloudShell, read-only for shared state -- paste 0 (readiness, baseline, and a dry run of
      the state rm and import plan on a local copy of the state) at the CI-green build PR head, so the import blocks meet
      the live API before merge. The agent fills HEAD_SHA, the operator fills PAT_SECRET_ID; the exact text is
      execution_steps step 8. The agent saves the operator's reported lines into $PASTE0_REPORT, holding only the latest
      run's lines (a re-run replaces them). A new head that changes terraform/github re-runs it. When E0 listed
      default_workflow_permissions and PASTE0_OK holds, take E0b before merge: Order A, re-run this build PR's
      terraform-github-plan run at the same head (mcp__github__actions_run_trigger rerun_workflow_run); Order B, ask the
      coordinator for a re-run of the workflow PR's run. Save the re-run attempt's job log (job id from
      mcp__github__actions_list) into $E0B_LOG (the job log carries the whole report, never plan text) and require
      grep -q 'TF_GITHUB_PLAN_REPORT verdict=' "$E0B_LOG" && grep -qF github_workflow_repository_permissions.this "$E0B_LOG"
      && ! grep -qF default_workflow_permissions "$E0B_LOG" && echo E0B_OK, plus in Order A the report line matching
      'import=0 add=0 change=5 destroy=0 replace=0'. A re-run that cannot start, or whose log has no report line: escalate through the coordinator.
    command: >-
      for l in TERRAFORM_OK PAT_ADMIN_VISIBLE LIVE_WORKFLOW_DEFAULT=read INIT_OK DRYRUN_IMPORT_ONLY; do
      printf '%s\n' "$PASTE0_REPORT" | grep -qxF "$l" || exit 1; done
      && test "$(printf '%s\n' "$PASTE0_REPORT" | grep -c '^LIVE_WORKFLOW_DEFAULT=')" = 1
      && printf '%s\n' "$PASTE0_REPORT" | grep -qxE "${E0_COUNTS_RE:-COUNTS import=0 add=0 change=5 destroy=0}" && echo PASTE0_OK
    expected: >-
      PASTE0_OK: the operator reported TERRAFORM_OK, PAT_ADMIN_VISIBLE, LIVE_WORKFLOW_DEFAULT=read (the live default
      GITHUB_TOKEN permission, read with the admin PAT, equals the config's read), INIT_OK, a baseline line matching
      E0_COUNTS_RE (Order A default: COUNTS import=0 add=0 change=5 destroy=0; Order B: E0's counts, or, when E0
      failed, "COUNTS import=0 add=0 change=5 destroy=0|BASELINE_PLAN_FAILED", since the admin PAT may plan where the
      App could not) and DRYRUN_IMPORT_ONLY. Nothing shared is written (plan -lock=false; the dry run uses a local copy).
    fix_if: >-
      Checksum mismatch: stop, do not run the binary. PAT_ADMIN_VISIBLE missing: the PAT is invalid or lacks admin;
      a new admin PAT is an always-ask credential mint, park it and wait. AccessDenied: the console identity cannot read
      the secret or the state; the operator chooses another identity (any IAM grant is always-ask). Baseline not
      matching, or no DRYRUN_IMPORT_ONLY: stop and escalate; never continue to paste A. A dry run that shows an import
      plus an update on another defaulted attribute that Read never sets (the known one, ignore_vulnerability_alerts_during_read, is
      already in ignore_changes) is a config gap: the fix is an explicit argument
      or ignore_changes entry through a plan amendment from the planning thread, never an apply.
      LIVE_WORKFLOW_DEFAULT=write (the dry run then also fails, change=1 on github_workflow_repository_permissions.this):
      the live default GITHUB_TOKEN permission drifted to read-write against the config's read. STOP before paste A and
      put it to the operator (always-ask security setting): restore Read repository contents and packages permissions in
      the repository's Settings > Actions > General > Workflow permissions, then re-run paste 0. First re-run the check
      that every workflow job declares explicit permissions, so none relies on the default (none did on 2026-10-16):
      bin/venv-python -c "import yaml,pathlib; m=[f'{p.name}:{j}' for p in pathlib.Path('.github/workflows').glob('*.y*ml')
      for w in [yaml.safe_load(p.read_text(encoding='utf-8'))] for j,s in (w.get('jobs') or {}).items()
      if 'permissions' not in w and 'permissions' not in s]; print('JOBS_WITHOUT_PERMISSIONS', m); assert not m"
      A non-empty list: name those jobs to the operator and escalate to the planning thread through the coordinator;
      the restore waits until they declare explicit permissions. Whenever E0 listed default_workflow_permissions, add the
      line "default_workflow_permissions found non-read at E0 <YYYY-MM-DD>; restored <YYYY-MM-DD>" (or "; read at paste 0"
      when no restore was needed) to step 14's evidence comment, ask the operator whether they changed the setting, and
      file a rec on how a Terraform-managed security setting drifted, carrying their answer (get_rec_write_guidance, then
      file_rec; Decision 55). Never reconcile config to write and never add
      default_workflow_permissions to ignore_changes. E0b still lists default_workflow_permissions with
      LIVE_WORKFLOW_DEFAULT=read: CI and the admin PAT disagree on a security setting (or it changed between E0 and paste
      0); escalate before merge, since E2 would list it again after the state change.
    hermetic: false
    graduation: not-applicable
  - step: 10
    phase: post-deploy
    action: >-
      OPERATOR, AWS CloudShell, state mutation -- paste A (backup, state rm of the five, saved plan asserted
      import-only). Exact text: execution_steps step 9. Run only after steps 8 and 9 passed. The agent saves the
      reported lines into $PASTEA_REPORT.
    command: >-
      printf '%s\n' "$PASTEA_REPORT" | grep -cxE 'BACKUP_OK|COUNTS import=5 add=0 change=0 destroy=0|PLAN_IMPORT_ONLY'
      | grep -qx 3 && echo PASTEA_OK
    expected: >-
      PASTEA_OK: the operator reported BACKUP_OK, Successfully removed 5 resource instance(s), COUNTS import=5 add=0
      change=0 destroy=0, PLAN_IMPORT_ONLY and five "will be imported" address lines, and stopped there to review.
    fix_if: >-
      No PLAN_IMPORT_ONLY (or the paste stopped early): do NOT run paste B. Run paste R (execution_steps step 10) or, on
      the operator's word on the exact command, the agent's S3 version restore (rollback field); confirm with step 8's
      shape check (agent-platform); then escalate.
  - step: 11
    phase: post-deploy
    action: >-
      OPERATOR, AWS CloudShell, state mutation -- paste B (apply exactly the reviewed saved plan, then re-plan). Exact
      text: the second block of execution_steps step 9. Run only after reviewing paste A's output. The agent saves the
      reported lines into $PASTEB_REPORT.
    command: >-
      printf '%s\n' "$PASTEB_REPORT" | grep -qF 'Resources: 5 imported, 0 added, 0 changed, 0 destroyed.'
      && printf '%s\n' "$PASTEB_REPORT" | grep -qx 'POST_PLAN_EXIT=0' && echo PASTEB_OK
    expected: PASTEB_OK -- Apply complete! Resources 5 imported, 0 added, 0 changed, 0 destroyed, and POST_PLAN_EXIT=0.
    fix_if: >-
      An apply error: stop; state may hold some of the five. Run step 12's check against theseus and against
      agent-platform to see which, restore the rollback version on the operator's word if mixed, and RCA (Decision 55);
      never retry blindly. POST_PLAN_EXIT=2: a live diff appeared after import; do not apply, escalate.
  - step: 12
    phase: post-deploy
    action: ADMIN, read-only -- verify from the live state object, not from the operator's report.
    command: >-
      aws s3 cp s3://agent-platform-data-lake/tfstate/github/terraform.tfstate - --profile agent_platform_admin --only-show-errors
      | bin/venv-python -c "import json,sys; w=sys.argv[1]; s=json.load(sys.stdin); K={('github_repository','this'):'name',('github_repository_ruleset','main_protection'):'repository',('github_actions_repository_permissions','this'):'repository',('github_workflow_repository_permissions','this'):'repository',('github_repository_environment','tf_gated_apply'):'repository'}; I={('github_repository','this'):w,('github_actions_repository_permissions','this'):w,('github_workflow_repository_permissions','this'):w,('github_repository_environment','tf_gated_apply'):w+':tf-gated-apply'}; F={(r['type'],r['name']):r['instances'][0]['attributes'] for r in s.get('resources',[]) if r.get('mode')=='managed' and (r['type'],r['name']) in K}; ok=[k for k,a in F.items() if a.get(K[k])==w and a.get('id')==I.get(k,a.get('id'))]; st=w!='agent-platform' and any('agent-platform' in str(v) for a in F.values() for k2,v in a.items() if k2 in ('id','name','repository','full_name') or k2.endswith('_url')); print('STATE_KEYED',w,'count=%d'%len(ok),'resources=%d'%len(F),'stale' if st else 'clean'); assert len(ok)==5 and len(F)==5 and not st" theseus
    expected: >-
      Prints STATE_KEYED theseus count=5 resources=5 clean: every one of the five instances keyed on theseus with the
      expected ids, and no agent-platform string left in them.
    fix_if: 'Anything else: restore the rollback version on the operator''s word and escalate.'
  - step: 13
    phase: post-deploy
    action: >-
      E2 -- a PR-time plan run whose commit contains the merged build PR (after import, repo.tf's ignore_changes entries
      are load-bearing). Order A: re-run the build PR's run (mcp__github__actions_run_trigger rerun_workflow_run); its
      merge commit carries the build. Order B: never a bare re-run of the workflow PR's original run (it predates the
      build); ask the coordinator to have the workflow PR updated from main so the push starts a fresh run, or use E3
      (the closure PR's own run,
      step 15). If main has since changed other terraform/github config, use E3 or a fresh PR touching terraform/github.
      Fetch the new job log into $E2_LOG and check it.
    command: >-
      L="$(grep -o 'TF_GITHUB_PLAN_REPORT [A-Za-z0-9=_. -]*' "$E2_LOG" | tail -1)" && echo "$L"
      && { echo "$L" | grep -qE 'verdict=NO_CHANGES import=0 add=0 change=0 destroy=0 replace=0 gated=0 .*conflict=0'
      || { echo "$L" | grep -qE 'verdict=VISIBILITY_GATED_ONLY import=0 add=0 change=1 destroy=0 replace=0 gated=1 .*conflict=0'
      && grep -q 'ruleset_bypass_actors=hidden' "$E2_LOG"; }; } && echo E2_OK
    expected: >-
      E2_OK: verdict NO_CHANGES with every count 0, or verdict VISIBILITY_GATED_ONLY with change=1 gated=1 (raw counts:
      the one gated row is the ruleset's bypass_actors) and ruleset_bypass_actors=hidden; conflict=0 either way. The
      operator's step 11 re-plan, which sees bypass_actors and security_and_analysis, is authoritative for both fields.
    fix_if: >-
      Any other change: compare its attribute names with step 11 (the PAT re-plan). A change the PAT plan does not show
      is an App visibility gap: escalate unless it is the declared bypass_actors row. A change both show: escalate;
      never apply to converge. A re-run that fails to start or to check out its commit: use E3 or a fresh PR touching
      terraform/github.
