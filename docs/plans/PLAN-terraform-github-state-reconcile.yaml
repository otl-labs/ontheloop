      && ! cat "$EVIDENCE_COMMENT" "$BUILD_PR_BODY" | grep -Eq '(^|[^0-9a-f])[0-9]{12}([^0-9a-f]|$)|arn:aws|[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[a-z]{2,}|ghp_|github_pat_|ExternalId'
