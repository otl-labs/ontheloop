schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
implementation_declared: true
slug: "terraform-personal-cd-split"
intent: >-
  Split docs/contracts/terraform-cc-web-operations.yaml (499 of Decision 166's 500 effective lines) into two Class D
  contracts by concern, so the five merged plans that add text to it can land (one, the opaque-IAM check, is built as
  PR #1740 and held for this split). The kept file holds what a
  CC-web or ADMIN session does by hand around terraform/personal (provider-mirror init, tfvars and remote-state
  recovery, the operator-only break-glass loop); the new docs/contracts/terraform-personal-cd.yaml holds the GitHub
  Actions CD pipeline's wiring (speculative plan + apply-the-saved-plan, alarm-only drift detection, the convergence
  anchor), moved verbatim. Benjamin asked for the split 2026-10-30 13:25Z.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-terraform-personal-cd-split.yaml
phase: >-
  ad_hoc_rec (soft-warn category; no tier_item claimed, so the Tier Item Freshness Gate is skipped). Unblocks
  PLAN-admin-terraform-assets-session-hook (#1737), PLAN-pr-plan-opaque-iam-policy-check (#1733),
  PLAN-secrets-to-ssm-cutover (#1738), PLAN-secrets-to-ssm-retire and PLAN-trusted-plan-cutover PR 4. Closes no
  roadmap criterion.
closes_criteria: []
scope:
  - file: docs/contracts/terraform-cc-web-operations.yaml
    action: Modify
    purpose: >-
      Remove the five top-level blocks sticky_and_observed, concurrency_tradeoff,
      speculative_plan_and_apply_the_saved_plan, alarm_only_scheduled_drift_detection and convergence_anchor (each block
      runs from its key line to the line before the next top-level key). Replace the header comment with T1 and
      contract.description with T2; apply T3 in provider_init_and_mirror.ci_delegation_still_authoritative; add T4 as
      the new top amendment_log entry. referenced_repo_paths loses .github/workflows/terraform-drift.yml,
      scripts/checks/iam_tf/validate_convergence_writer_isolation.py, terraform/bootstrap/github_ci_apply.tf and
      terraform/personal/oidc.tf (cited only by the moved blocks) and gains docs/contracts/terraform-personal-cd.yaml,
      kept sorted. Every other byte of provider_init_and_mirror, tfvars_and_remote_state_recovery and
      operator_only_break_glass (apply_posture included, Fork 1A) and every existing amendment_log entry stays as on
      origin/main. contract id, subject, evaluator, status and contract_version are unchanged. About 324 effective lines.
  - file: docs/contracts/terraform-personal-cd.yaml
    action: Create
    purpose: >-
      New Class D contract: header comment T5, contract block T6, amendment_log with the one entry T7, a two-line comment
      "# Every repo-relative path this contract names, verified to exist by" / "# validate_terraform_personal_cd
      (scripts/checks/contracts/validate_terraform_personal_cd.py).", referenced_repo_paths (T7's seven paths, sorted),
      then the five moved blocks byte-for-byte in their origin/main order. About 206 effective lines.
  - file: scripts/checks/contracts/validate_terraform_personal_cd.py
    action: Create
    purpose: >-
      Evaluator for the new contract, in validate_terraform_cc_web_operations.py's shape (Fork 3A). Module constants
      _CONTRACT_REL_PATH = "docs/contracts/terraform-personal-cd.yaml" (the literal resolve_evaluator needs),
      _SIBLING_REL_PATH = "docs/contracts/terraform-cc-web-operations.yaml", _TERRAFORM_CLAUDE_MD_REL_PATH =
      "terraform/CLAUDE.md". @registry.register("validate_terraform_personal_cd", owner="platform"), signature
      (failed: list[str], *, repo_root: Path | None = None) -> None. Legs: (1) terraform/CLAUDE.md contains
      _CONTRACT_REL_PATH; (2) the contract parses and its referenced_repo_paths is a non-empty list whose every entry
      exists; (3) no top-level key other than contract, amendment_log and referenced_repo_paths appears in both this
      contract and the sibling (the split boundary; Decision 86 one subject per file). A missing contract or CLAUDE.md
      appends a failure and calls registry.skipped(); a missing sibling skips leg 3 with a printed SKIP line.
      registry.examined(len(named_paths), unit="named paths") (Decision 170 accounting). Prints a PASS line when all
      legs hold. Every failure message starts "terraform-personal-cd contract:".
  - file: tests/checks/contracts/test_validate_terraform_personal_cd.py
    action: Create
    purpose: >-
      tmp_path fixtures in test_validate_terraform_cc_web_operations.py's _write_repo shape. Nodes:
      test_pointer_paths_and_disjoint_sections_pass, test_contract_missing_fails,
      test_terraform_claude_md_missing_pointer_fails, test_named_path_that_does_not_exist_fails,
      test_empty_referenced_repo_paths_fails, test_section_in_both_contracts_fails,
      test_missing_sibling_skips_the_boundary_leg, test_live_repository_passes (repo_root=None against the real tree).
      Module-level test functions (the node ids VP 1 names), not the template's test classes.
  - file: scripts/checks/contracts/_manifest.py
    action: Modify
    purpose: >-
      One Entry(name="validate_terraform_personal_cd", module="scripts.checks.contracts.validate_terraform_personal_cd",
      attr="validate_terraform_personal_cd", pre=True, pre_globs=None, full_segment="full_after_lint") directly after
      validate_terraform_cc_web_operations's entry.
  - file: config/ci_rca_taxonomy.yaml
    action: Modify
    purpose: "function_to_category gains `validate_terraform_personal_cd: schema_drift` beside validate_terraform_cc_web_operations."
  - file: terraform/CLAUDE.md
    action: Modify
    purpose: >-
      Lines 23-27 (the "Read `docs/contracts/terraform-cc-web-operations.yaml` before touching" paragraph) become T8.
      The file must stay at or under its 10264-byte prose budget (T8 makes it 10259) and keep matching
      terraform-stub-serves-routine-loop's grep `read .{0,60}terraform-cc-web-operations`. No other line changes.
  - file: docs/contracts/file-router.yaml
    action: Modify
    purpose: >-
      T9 and T10: the terraform-cc-web-operations route's description narrows, a terraform-personal-cd route follows it,
      a new top amendment_log entry, and the four 2026-09-01 to 2026-09-07 one-line entries become one compacted entry
      with every summary's words unchanged. 497 to 498 effective lines; longest line about 1,230 characters.
      prose_allowlist and every other route are untouched.
  - file: docs/plans/PLAN-pr-plan-opaque-iam-policy-check.yaml
    action: Modify
    purpose: >-
      Re-point (Fork 4A, execution step 8a): every docs/contracts/terraform-cc-web-operations.yaml becomes
      docs/contracts/terraform-personal-cd.yaml; the fold sentences the split makes false are replaced; the approved
      contract sentence and amendment summary are unchanged. Its open build, PR #1740, merges main after this and follows
      the re-pointed plan.
  - file: docs/plans/PLAN-secrets-to-ssm-retire.yaml
    action: Modify
    purpose: >-
      Re-point (Fork 4A, execution step 8b): its three docs/contracts/terraform-cc-web-operations.yaml mentions become
      docs/contracts/terraform-personal-cd.yaml (scope row, test-obligation source, the heading line of N1's texts).
      Texts T4, T4b, T4c and the amendment summary are unchanged.
  - file: docs/plans/PLAN-trusted-plan-cutover.yaml
    action: Modify
    purpose: >-
      Re-point (Fork 4A, execution step 8c): one sentence appended to the existing terraform-cc-web-operations scope
      row, one new scope row for docs/contracts/terraform-personal-cd.yaml (PR 4), and one new test-obligation row for
      it. PR 1 and PR 3 history (including their obligation row on the kept file) and every approved text are unchanged.
bundled_recommendations: []
followon_recs: []
infrastructure_dependencies: []
acceptance_criteria:
  - >-
    The five CD blocks load in terraform-personal-cd.yaml exactly as on origin/main and are absent from the kept file;
    the kept file's three remaining blocks load exactly as on origin/main except T3's one cross-reference; its
    amendment_log is T4 followed by origin/main's entries unchanged; both files are at most 500 effective lines with no
    line over 2,000 characters; the referenced_repo_paths lists are as scoped.
  - >-
    validate_terraform_personal_cd passes on the tree, fails when terraform/CLAUDE.md drops its pointer, when a named
    path is missing, when the list is empty, when the contract is missing, and when a top-level section is in both
    contracts; it is registered, sequenced in both tiers, has a ci_rca_taxonomy row, and resolves as the new contract's
    evaluator (validate_contract_drift green).
  - >-
    terraform/CLAUDE.md names both contracts in T8's words, stays within its 10264-byte budget, and still matches the
    stub registry grep; file-router.yaml routes the new file with topic equal to its subject, holds T9 and T10, keeps
    the four compacted summaries' words, and is at most 500 effective lines.
  - >-
    The three re-pointed plans differ from origin/main only as execution step 8 states; the other two in-flight plans
    (admin setup, SSM cutover) are untouched; every graduated registry entry that names either contract passes except
    tfvars-recovery-table-covers-module, which is red on origin/main already (rec-4753).
  - "`bin/venv-python -m scripts.validate --pre` and the full tier pass."
verification_plan:
  - step: 1
    phase: pre-deploy
    action: New check behaviour, all three legs.
    command: bin/venv-python -m pytest -q tests/checks/contracts/test_validate_terraform_personal_cd.py
    expected: >-
      exit 0; exactly these eight module-level tests pass: test_pointer_paths_and_disjoint_sections_pass,
      test_contract_missing_fails, test_terraform_claude_md_missing_pointer_fails,
      test_named_path_that_does_not_exist_fails, test_empty_referenced_repo_paths_fails,
      test_section_in_both_contracts_fails, test_missing_sibling_skips_the_boundary_leg, test_live_repository_passes.
      Each fails before the change (the module does not exist).
    fix_if: Fix the check or the contract, never the assertion.
    hermetic: true
    expected_literals: []
    graduation: graduate
    graduation_check_id: terraform-personal-cd-evaluator
  - step: 2
    phase: pre-deploy
    action: The split moved text verbatim against origin/main and both files fit.
    command: |
      bin/venv-python - <<'EOF'
      import subprocess, yaml
      from scripts.checks.structural._classify import effective_lines
      K = "docs/contracts/terraform-cc-web-operations.yaml"; N = "docs/contracts/terraform-personal-cd.yaml"
      base = yaml.safe_load(subprocess.run(["git", "show", "origin/main:" + K], capture_output=True, text=True, check=True).stdout)
      kt = open(K).read(); nt = open(N).read(); k = yaml.safe_load(kt); n = yaml.safe_load(nt)
      moved = ["sticky_and_observed", "concurrency_tradeoff", "speculative_plan_and_apply_the_saved_plan",
               "alarm_only_scheduled_drift_detection", "convergence_anchor"]
      left = [".github/workflows/terraform-drift.yml", "scripts/checks/iam_tf/validate_convergence_writer_isolation.py",
              "terraform/bootstrap/github_ci_apply.tf", "terraform/personal/oidc.tf"]
      new_paths = sorted(left + [".github/workflows/terraform-apply-sandbox.yml", "docs/contracts/environment-taxonomy.yaml", K])
      norm = lambda s: " ".join(str(s).split())
      bad = []
      bad += [f"moved block changed: {s}" for s in moved if n.get(s) != base.get(s)]
      bad += [f"moved block still in kept file: {s}" for s in moved if s in k]
      bad += [f"kept block changed: {s}" for s in ("tfvars_and_remote_state_recovery", "operator_only_break_glass") if k.get(s) != base.get(s)]
      kp, bp = dict(k["provider_init_and_mirror"]), dict(base["provider_init_and_mirror"])
      want = norm(bp.pop("ci_delegation_still_authoritative")).replace(
          "described in `speculative_plan_and_apply_the_saved_plan` below (Decision 77 / Decision 92).",
          "described in `docs/contracts/terraform-personal-cd.yaml` (`speculative_plan_and_apply_the_saved_plan`; Decision 77 / Decision 92).")
      if norm(kp.pop("ci_delegation_still_authoritative")) != want or kp != bp: bad.append("provider_init_and_mirror differs beyond T3")
      if k["amendment_log"][1:] != base["amendment_log"]: bad.append("kept amendment history changed")
      if len(n["amendment_log"]) != 1: bad.append("new file must start with one amendment entry")
      if sorted(k["referenced_repo_paths"]) != sorted(set(base["referenced_repo_paths"]) - set(left) | {N}): bad.append("kept paths")
      if sorted(n["referenced_repo_paths"]) != new_paths: bad.append("new paths")
      c = n["contract"]
      if (c["id"], c["subject"], c["class"], c["status"], c["evaluator"].get("check")) != (
              "terraform-personal-cd", "terraform-personal-cd", "D", "ratified", "validate_terraform_personal_cd"): bad.append("new contract block")
      kc, bc = k["contract"], base["contract"]
      if [kc[x] for x in ("id", "subject", "class", "status", "contract_version", "evaluator")] != [
              bc[x] for x in ("id", "subject", "class", "status", "contract_version", "evaluator")]: bad.append("kept contract block changed beyond T2")
      for name, t in ((K, kt), (N, nt)):
          if effective_lines(t) > 500 or max(len(x) for x in t.splitlines()) > 2000: bad.append(f"size: {name}")
      print(bad or "SPLIT_OK"); raise SystemExit(1 if bad else 0)
      EOF
    expected: exit 0, prints SPLIT_OK.
    fix_if: >-
      Re-cut from origin/main by whole blocks; never retype a moved block. A size failure means a block went to the
      wrong file.
    hermetic: false
    expected_literals: []
    graduation: waive
    graduation_waiver_reason: >-
      One-time proof of a verbatim move against the pre-split main; after merge the comparison has no base. The new
      check's disjoint-sections leg (step 1) and the structural size check stay as the standing guards.
  - step: 3
    phase: pre-deploy
    action: Approved texts T1-T10 are present (key fragments) and the CLAUDE.md and file-router edits hold.
    command: |
      set -e
      test "$(wc -c < terraform/CLAUDE.md)" -le 10264
      grep -qiE "read .{0,60}terraform-cc-web-operations" terraform/CLAUDE.md
      bin/venv-python - <<'EOF'
      import re, subprocess
      from scripts.checks.structural._classify import effective_lines
      K, N, R = ("docs/contracts/terraform-cc-web-operations.yaml", "docs/contracts/terraform-personal-cd.yaml",
                 "docs/contracts/file-router.yaml")
      norm = lambda s: " ".join(s.replace("#", " ").split())
      want = {K: ["narrowed by PLAN-terraform-personal-cd-split", "Boundary with docs/contracts/terraform-personal-cd.yaml",
                  "The CD pipeline's wiring is terraform-personal-cd.yaml's.",
                  "PLAN-terraform-personal-cd-split: sticky_and_observed, concurrency_tradeoff"],
              N: ["Boundary with docs/contracts/terraform-cc-web-operations.yaml", 'ratified_via: "PLAN-terraform-personal-cd-split"',
                  "Decision 238 cl.6 names that file's speculative_plan_job row, which now lives here."],
              "terraform/CLAUDE.md": ["and `docs/contracts/terraform-personal-cd.yaml` (the speculative-plan"],
              R: ["- topic: terraform-personal-cd", "CC-web terraform/personal hand-run procedure:",
                  "Four entries compacted (PLAN-terraform-personal-cd-split)."]}
      missing = [f"{p}: {w}" for p, ws in want.items() for w in ws if norm(w) not in norm(open(p).read())]
      if missing: raise SystemExit(f"TEXT_MISSING {missing}")
      base = subprocess.run(["git", "show", "origin/main:" + R], capture_output=True, text=True, check=True).stdout
      head = open(R).read()
      old = re.findall(r'^  - \{date: "2026-09-0[127]", .*summary: "(.*)"\}$', base, re.M)
      line = next(x for x in head.splitlines() if "Four entries compacted (PLAN-terraform-personal-cd-split)." in x)
      bad = [s[:60] for s in old if s not in line]
      if len(old) != 4 or bad or effective_lines(head) > 500: raise SystemExit(f"FILE_ROUTER_BAD {len(old)} {bad}")
      print("TEXTS_OK")
      EOF
    expected: exit 0, prints TEXTS_OK.
    fix_if: Restore the approved text from execution step 7; the compacted entry must keep each old summary's words.
    hermetic: false
    expected_literals: []
    graduation: waive
    graduation_waiver_reason: >-
      A registry row would pin approved prose that later approved amendments may legitimately change; the size, prose
      budget and placement checks it leans on are already standing checks.
  - step: 4
    phase: pre-deploy
    action: >-
      In-flight plans re-pointed exactly as execution step 8 states, and only while their builds have not landed (PR
      #1740 and trusted-plan PR 4 still unmerged); the admin setup and SSM cutover plans untouched.
    command: |
      bin/venv-python - <<'EOF'
      import subprocess
      OLD, NEW = "docs/contracts/terraform-cc-web-operations.yaml", "docs/contracts/terraform-personal-cd.yaml"
      norm = lambda s: " ".join(s.split())
      main = lambda p: norm(subprocess.run(["git", "show", "origin/main:" + p], capture_output=True, text=True, check=True).stdout)
      head = lambda p: norm(open(p).read())
      bad = []
      kept = subprocess.run(["git", "show", "origin/main:" + OLD], capture_output=True, text=True, check=True).stdout
      if "reviewer-digest fit check" in kept: bad.append("RE-GROUND step 8a: PR #1740 (opaque-IAM build) landed before the split")
      if norm(kept).count("until rec-4637's last PR removes it") != 2: bad.append("RE-GROUND step 8c: trusted-plan PR 4 landed before the split")
      counts = {"docs/plans/PLAN-pr-plan-opaque-iam-policy-check.yaml": 4, "docs/plans/PLAN-secrets-to-ssm-retire.yaml": 3}
      for p, n in counts.items():
          if main(p).count(OLD) != n: bad.append(f"RE-GROUND step 8: {p} names the old path {main(p).count(OLD)} times on main, planned for {n}")
      for p in ("docs/plans/PLAN-admin-terraform-assets-session-hook.yaml", "docs/plans/PLAN-secrets-to-ssm-cutover.yaml"):
          if main(p) != head(p): bad.append("touched: " + p)
      p = "docs/plans/PLAN-secrets-to-ssm-retire.yaml"
      if main(p).count("validate_terraform_cc_web_operations its structure") != 1: bad.append("RE-GROUND step 8b waiver anchor")
      b = main(p).replace(OLD, NEW).replace("validate_terraform_cc_web_operations its structure", "validate_terraform_personal_cd its structure")
      if b != head(p): bad.append(p)
      p = "docs/plans/PLAN-pr-plan-opaque-iam-policy-check.yaml"
      b = main(p).replace(OLD, NEW)
      for a in ("This adds 5 effective lines", "(folding amendment history to stay at most 500)", "for check in (a, b, c, d, e):",
                "import validate_terraform_cc_web_operations as d", "Prose only; validate_terraform_cc_web_operations checks"):
          if b.count(a) != 1: bad.append("RE-GROUND step 8a anchor: " + a)
      start = b.index("This adds 5 effective lines"); end = b.index("Never raise; never touch the approved sentence.", start)
      b = b[:start] + "This adds 5 effective lines (step 1, amendment entry 4 with the summary as one double-quoted line) to a file of about 206 after PLAN-terraform-personal-cd-split, so no history fold is needed. " + b[end:]
      b = b.replace("(folding amendment history to stay at most 500)", "(at most 500 effective lines)")
      d = "import validate_terraform_cc_web_operations as d"
      b = b.replace(d, d + " from scripts.checks.contracts.validate_terraform_personal_cd import validate_terraform_personal_cd as f")
      b = b.replace("for check in (a, b, c, d, e):", "for check in (a, b, c, d, e, f):")
      b = b.replace("Prose only; validate_terraform_cc_web_operations checks", "Prose only; validate_terraform_personal_cd checks")
      if b != head(p): bad.append(p)
      p = "docs/plans/PLAN-trusted-plan-cutover.yaml"
      b = main(p)
      row = "A dated amendment_log row per PR. validate_terraform_cc_web_operations stays green."
      ob = "waiver_reason: Contract prose; validate_terraform_cc_web_operations in --pre checks its structure and referenced paths."
      if b.count(row) != 1 or b.count(ob) != 1: bad.append("RE-GROUND step 8c anchors")
      b = b.replace(row, row + " After PLAN-terraform-personal-cd-split, the sections PR 3 and PR 4 edit live in"
          " docs/contracts/terraform-personal-cd.yaml (next row). - file: docs/contracts/terraform-personal-cd.yaml action: Modify"
          " purpose: >- PR 4: deletes the two \"until rec-4637's last PR removes it\" clauses (APPROVED, as in the row above)"
          " and adds a dated amendment_log row. validate_terraform_personal_cd stays green.")
      b = b.replace(ob, ob + " - source: docs/contracts/terraform-personal-cd.yaml behavior: PR 4's two clause deletions"
          " verification_step: 9 command: bin/venv-python -m scripts.validate --pre waiver_reason: Contract prose;"
          " validate_terraform_personal_cd in --pre checks its structure and referenced paths.")
      if b != head(p): bad.append(p)
      print(bad or "REPOINT_OK"); raise SystemExit(1 if bad else 0)
      EOF
    expected: exit 0, prints REPOINT_OK.
    fix_if: >-
      Re-apply execution step 8 from origin/main's text; change nothing else in those plans (Decision 181: a re-point
      never weakens a step). A RE-GROUND line means a plan amendment landed on main first: stop and return to the
      planner, never re-point the new text by guesswork. A "landed before the split" line means the merge order below
      was not kept: stop and return to the planner.
    hermetic: false
    expected_literals: []
    graduation: waive
    graduation_waiver_reason: One-time plan amendment; after merge the comparison has no base and the plans are history.
  - step: 5
    phase: pre-deploy
    action: Every graduated registry entry that names either contract still passes (rec-4753's known red excluded by name).
    command: |
      bin/venv-python - <<'EOF'
      import pathlib, subprocess, yaml
      KNOWN_RED = {"tfvars-recovery-table-covers-module"}  # red on origin/main since 2026-10-26, rec-4753
      ran, bad = 0, []
      for f in sorted(pathlib.Path("config/agent/verification_registry/entries").glob("*.yaml")):
          t = f.read_text()
          if not any(s in t for s in ("terraform-cc-web-operations", "terraform-personal-cd", "validate_terraform_cc_web_operations")):
              continue
          d = yaml.safe_load(t); spec = d.get("check_spec") or {}
          if d["check_id"] in KNOWN_RED:
              continue
          cmd = spec.get("command") or ["bin/venv-python", "-m", "pytest", "-q", spec["node_id"]]
          ran += 1
          if subprocess.run(cmd, capture_output=True, text=True, timeout=600).returncode:
              bad.append(d["check_id"])
      print(f"ran={ran}", bad or "REGISTRY_OK"); raise SystemExit(1 if bad or ran < 8 else 0)
      EOF
    expected: exit 0, prints ran=8 (or more) and REGISTRY_OK.
    fix_if: >-
      A failing entry reads a moved section from the kept file: stop and return to the planner (re-pointing a graduated
      entry is out of this plan's scope).
    hermetic: false
    expected_literals: []
    graduation: waive
    graduation_waiver_reason: The entries it runs are themselves the standing checks.
  - step: 6
    phase: pre-deploy
    action: Fast tier.
    command: bin/venv-python -m scripts.validate --pre
    expected: >-
      exit 0, including validate_contract_drift (new Class D shape, evaluator resolution, topic equals subject, an
      amendment entry on every changed contract), validate_placement, the structural size and prose budget checks,
      validate_check_accounting, both contract evaluators and the plan validators.
    fix_if: Fix the cause; never raise a budget or add a marker.
    hermetic: false
    expected_literals: []
    graduation: not-applicable
  - step: 7
    phase: pre-deploy
    action: Full tier before handoff.
    command: bin/venv-python -m scripts.validate
    expected: exit 0.
    fix_if: >-
      The handoff stays blocked until exit 0. In-scope failure: fix on the branch; never skip a test, relax an assertion
      or add a baseline. Out-of-scope or pre-existing red: a rec via scripts.ops_data_portal (Decision 59), recovered
      under red-main-recovery (Decision 226); the handoff still waits for exit 0.
    hermetic: false
    expected_literals: []
    graduation: not-applicable
test_obligations:
  - source: scripts/checks/contracts/validate_terraform_personal_cd.py
    behavior: Pointer, path and disjoint-sections legs.
    verification_step: 1
    test_selector: tests/checks/contracts/test_validate_terraform_personal_cd.py
    red_green_expectation: red before (module absent), green after
  - source: scripts/checks/contracts/_manifest.py
    behavior: The new check is sequenced in both tiers.
