execution_steps:
  - "Script: create scripts/ci/provider_mirror_gate.sh from the ci.yml mirror_gate body, with gate 3 over the MIRRORED table and the namespace-filtered sync; tests/test_provider_mirror_gate.py; run VP 1 and 2."
