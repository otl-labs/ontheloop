    behavior: activates the mirror only when every mirrored provider's exact locked package is present
    verification_step: 1
    test_selector: tests/test_provider_mirror_gate.py::test_active_when_every_locked_provider_is_mirrored
    red_green_expectation: red before (file absent), green after
  - source: scripts/ci/provider_mirror_gate.sh
    behavior: a missing or wrong-version package for either provider degrades fail-open with a named reason
    verification_step: 2
    test_selector: tests/test_provider_mirror_gate.py::test_a_missing_or_wrong_version_provider_degrades
    red_green_expectation: red before (file absent), green after; red if gate 3 checks neon alone
  - source: scripts/ci/provider_mirror_gate.sh
    behavior: every branch, an unset RUNNER_TEMP or GITHUB_ENV included, writes exactly one active= line and exits 0 (Decision 162 SPIRIT note)
    verification_step: 5
    test_selector: tests/test_provider_mirror_gate.py::test_every_branch_writes_active_and_exits_zero
    red_green_expectation: red before (file absent), green after; red if any branch aborts under bash -e or set -u
  - source: config/terraform/cc-web.tfrc
    behavior: the mirror serves registry.terraform.io/integrations/* with direct excluding it symmetrically
    verification_step: 3
    test_selector: tests/test_ci_provider_mirror_acceptance.py::TestTfrcSymmetry::test_mirror_serves_terraform_github_provider
    red_green_expectation: red before (kislerdm-only include), green after
  - source: .github/workflows/ci.yml
    behavior: mirror_gate passes OIDC_FAILED (steps.mirror_oidc.outcome != 'success') by env and delegates to the script in one line (the standing guard is the re-pointed shard's delegation grep, VP 7)
    verification_step: 6
    test_selector: tests/test_ci_provider_mirror_acceptance.py::TestGateChainFailOpen::test_gate_step_delegates_to_the_script
    red_green_expectation: red before (inline body), green after
  - source: config/composite_action_body_baseline.yaml
    behavior: the mirror_gate ceiling matches the one-line body
