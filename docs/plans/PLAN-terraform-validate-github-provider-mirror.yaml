schema_version: 5
implementation_declared: true
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: terraform-validate-github-provider-mirror
intent: >-
  Stop a github.com provider-asset outage from redding the required terraform-validate check (2026-11-08: github.com
  answered 504 for the integrations/github provider's SHA256SUMS, so every runner's terraform/github init failed) by
  serving integrations/github from the S3 provider mirror the way kislerdm/neon already is, with the same fail-open
  version gate, so main's required check depends on github.com only when the mirror itself is unavailable.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-terraform-validate-github-provider-mirror.yaml
phase: >-
  hotfix (red main 2026-11-08, an upstream github.com outage on the integrations/github provider checksum); no
  tier_item is targeted and no exit criterion is closed, so closes_criteria is empty.
closes_criteria: []
scope:
  - file: config/terraform/cc-web.tfrc
    action: Modify
    purpose: >-
      filesystem_mirror include and direct exclude both become ["registry.terraform.io/kislerdm/*",
      "registry.terraform.io/integrations/*"] (kept symmetric, each list on one line: both include parsers read a
      single line). Header comment: the mirror now serves
      registry.terraform.io/kislerdm/neon (terraform/personal) and registry.terraform.io/integrations/github
      (terraform/github), naming both addresses literally (rec-5007's acceptance greps the literal integrations/github);
      hashicorp/* still resolves direct. Both consumers pick it up with no
      code change of their own: terraform-validate renders it, and bin/sync-terraform-assets.sh derives its S3 include
      filters and per-namespace non-empty check from this include list.
    new_imports: []
  - file: scripts/ci/provider_mirror_gate.sh
    action: Create
    purpose: >-
      Committed with mode 100755 like every scripts/ci/*.sh. The terraform-validate gate chain moved out of ci.yml's inline mirror_gate body (touch-it-fix-it, Decision 162
      R3), unchanged in shape and generalised in gate 3. `set -uo pipefail` (never -e: every degradation exits 0).
      Reads env OIDC_FAILED, RUNNER_TEMP, GITHUB_ENV, GITHUB_OUTPUT, GITHUB_STEP_SUMMARY guard-then-use, so an unset
      variable degrades and never aborts under -u: tested as `${VAR:-}`, then written as the plain name, e.g. `if [ -n
      "${GITHUB_STEP_SUMMARY:-}" ]; then echo ... >> "$GITHUB_STEP_SUMMARY"; fi` (the literal $GITHUB_STEP_SUMMARY and
      $GITHUB_ENV stay in the text). An unset GITHUB_ENV or GITHUB_OUTPUT on the success path degrades (reason: cannot export
      TF_CLI_CONFIG_FILE, or cannot write active=true so the fail-closed invariant step could not run), active=false
      where it can be written; run from the repo root. Gate 1/3: degrades unless "${OIDC_FAILED:-}" equals exactly false (so unset, empty or true all degrade).
      Gate 2/3: an empty RUNNER_TEMP degrades; zero namespaces parsed from the tfrc include line degrades with reason
      "no mirror namespaces parsed from cc-web.tfrc" (as bin/sync-terraform-assets.sh does); else `mkdir -p "$MIRROR_DIR"`
      (kept from today's body) and `aws s3 sync s3://agent-platform-data-lake/tf-provider-mirror/
      "$MIRROR_DIR" --exclude "*" --include <ns>... --only-show-errors` (MIRROR_DIR="$RUNNER_TEMP/tf-provider-mirror"),
      the includes parsed from config/terraform/cc-web.tfrc's include line exactly as bin/sync-terraform-assets.sh
      parses it (so the 150 MB hashicorp/aws zip is no longer downloaded), wrapped in `timeout 300` so a hung S3 call
      cannot burn the job's 15-minute limit; a sync error or timeout (exit 124) degrades with its own reason, then the whole tree
      must be non-empty (the existing `[ -z "$(ls -A "$MIRROR_DIR" 2>/dev/null)" ]` check, kept literally) and then every
      included namespace directory must be non-empty. Gate 3/3 spells each provider out literally, no table or loop:
      NEON_VERSION is parsed by the existing awk from terraform/personal/.terraform.lock.hcl's
      registry.terraform.io/kislerdm/neon block and `ls
      "$MIRROR_DIR/registry.terraform.io/kislerdm/neon/terraform-provider-neon_${NEON_VERSION}_"*.zip` must match
      (today's check, byte-identical); then GITHUB_VERSION by the same awk from terraform/github/.terraform.lock.hcl's
      registry.terraform.io/integrations/github block and `ls
      "$MIRROR_DIR/registry.terraform.io/integrations/github/terraform-provider-github_${GITHUB_VERSION}_"*.zip` must
      match. An unparsed version or a missing package degrades with a reason naming that address and version. Every
      degradation runs `echo "provider-mirror: DEGRADED -- ${reason}"` to stdout and the same line to
      $GITHUB_STEP_SUMMARY (when set), writes active=false to $GITHUB_OUTPUT (when set), and exits 0. Every guarded
      write uses `if [ -n ... ]; then ...; fi` (never a trailing `[ ] && ...`, whose status 1 would fail the bash -e
      step), and the script ends with an explicit `exit 0` on every path, ACTIVE included. Success renders
      the tfrc (sed of __TF_MIRROR_DIR__) to "$RUNNER_TEMP/cc-web.tfrc", appends TF_CLI_CONFIG_FILE=<that path> to
      $GITHUB_ENV, writes active=true, and prints `provider-mirror: ACTIVE (kislerdm/neon ${NEON_VERSION},
      integrations/github ${GITHUB_VERSION})` to stdout and the summary. No other output (public log). Every literal
      TestGateChainFailOpen asserts today (aws s3 sync, the ls -A check, the neon filename regex, gate 1/3, 2/3, 3/3,
      $GITHUB_STEP_SUMMARY, echo "provider-mirror: DEGRADED, provider-mirror: ACTIVE, TF_CLI_CONFIG_FILE, $GITHUB_ENV,
      set -uo pipefail, .terraform.lock.hcl, kislerdm, neon) appears in the script.
    new_imports: []
  - file: .github/workflows/ci.yml
    action: Modify
    purpose: >-
      terraform-validate's mirror_gate step keeps its name, id, position and no-if, gains `env: OIDC_FAILED: ${{
      steps.mirror_oidc.outcome != 'success' }}` (the comparison stays in the job's YAML, where
      validate_oidc_failopen_guards requires a negative-branch classifier on steps.mirror_oidc.outcome; a bare
      outcome value fails that guard), and its run body becomes the one line `bash scripts/ci/provider_mirror_gate.sh`; the
      step's comment block is rewritten to say the gates now cover every provider the mirror serves (kislerdm/neon and
      integrations/github), naming the script, and noting activation is all-or-nothing (a missing package for either provider sends both to
      direct fetch). The job's header comment (L412-430) gains "and terraform/github's
      integrations/github" where it names the neon mirror. The mirror_oidc step, the fail-closed invariant step and every
      other job are unchanged.
    new_imports: []
  - file: config/composite_action_body_baseline.yaml
    action: Modify
    purpose: >-
      The r3_workflows entry ".github/workflows/ci.yml::terraform-validate::mirror_gate" (enforced by
      _workflow_shell_bodies.check_workflow_bodies) lowers from 37 to 1 (a decrease, always allowed; no marker).
    new_imports: []
  - file: tests/test_provider_mirror_gate.py
    action: Create
    purpose: >-
      Stubbed runs of the real script driven exactly as the step runs it, `bash -e -c 'bash
      scripts/ci/provider_mirror_gate.sh'` (the workflow's default `bash -e {0}`), from a temp repo copy (the real tfrc and both real lockfiles copied
      in; a fake aws on PATH that records argv and populates the destination per STUB_MODE). Nodes:
      test_active_when_every_locked_provider_is_mirrored (both locked zips present: exit 0, GITHUB_ENV holds
      TF_CLI_CONFIG_FILE pointing at a rendered tfrc whose path line names the mirror dir and whose include names both
      namespaces, GITHUB_OUTPUT active=true, the ACTIVE line names both versions read from the real lockfiles);
      test_a_missing_or_wrong_version_provider_degrades (parametrized: github zip absent, github zip of another version,
      neon zip absent; each exits 0, no GITHUB_ENV line, active=false, a gate 3/3 reason naming that address);
      test_oidc_failure_degrades_without_calling_aws (OIDC_FAILED true, empty and unset; aws never invoked);
      test_sync_failure_and_empty_namespace_degrade (aws exit 1; a sync that fills only kislerdm: gate 2/3);
      test_sync_downloads_only_included_namespaces (argv carries --exclude * and exactly one --include per entry of the
      HCL-aware include list, parsed by a regex local to this test file (never imported from
      tests/test_ci_provider_mirror_acceptance.py; Decision 131 forbids cross-test imports), so not hashicorp, and a multi-line rewrite of the list turns it red); test_gate_providers_match_tfrc_includes_and_lockfiles (the providers the script checks literally,
      kislerdm/neon and integrations/github, each fall under a tfrc include pattern; every include pattern covers at
      least one checked provider; and no tracked terraform/*/.terraform.lock.hcl locks a provider under an included
      namespace that the script does not check);
      test_every_branch_writes_active_and_exits_zero (parametrized over every degradation above plus an unparseable
      lockfile, RUNNER_TEMP unset (the script reads ${RUNNER_TEMP:-} and degrades at gate 2/3), GITHUB_ENV unset with
      every package present (degrades), GITHUB_STEP_SUMMARY unset with every package present (goes ACTIVE, exit 0), GITHUB_OUTPUT unset with every
      package present (degrades: exit 0, no GITHUB_ENV line, DEGRADED printed; exempt from the one-active=-line
      assertion, since there is no output file), and RUNNER_TEMP set to a path that does not exist (not a degradation: mkdir -p
      creates it and, with packages present, the run goes ACTIVE): GITHUB_OUTPUT holds exactly one active= line and the exit is 0).
  - file: tests/test_ci_provider_mirror_acceptance.py
    action: Modify
    purpose: >-
      TestGateChainFailOpen's _gate_script() reads scripts/ci/provider_mirror_gate.sh instead of the inline run body;
      every assertion that reads it keeps its text byte-identical (the script carries each literal; see the script
      row), so those are refactor dispositions citing the script and tests/test_provider_mirror_gate.py. The one
      assertion whose subject moves, test_gate_chain_checks_oidc_outcome_first, asserts the step's env OIDC_FAILED
      carries `steps.mirror_oidc.outcome != 'success'` and the script tests OIDC_FAILED (refactor disposition, same
      claim: the outcome is still checked first). test_gate_chain_keys_activation_on_exact_locked_version_not_directory_emptiness gains
      `re.search(r"terraform-provider-github_\$\{?GITHUB_VERSION\}?_", script)` and the integrations/github address
      beside the unchanged neon assertions. New test_gate_step_delegates_to_the_script (run body is exactly the one bash
      line). New TestTfrcSymmetry node test_mirror_serves_terraform_github_provider (include holds
      registry.terraform.io/integrations/* and the file text contains integrations/github).
      test_filesystem_mirror_include_matches_direct_exclude and the invariant tests stay byte-identical.
  - file: tests/test_sync_terraform_assets.py
    action: Modify
    purpose: >-
      AWS_STUB's populate keeps writing "$dest/registry.terraform.io/kislerdm/neon/p.zip" and, only when its argv
      carries `--include registry.terraform.io/integrations/*`, also writes
      "$dest/registry.terraform.io/integrations/github/p.zip" (today it fills kislerdm/neon only, which would turn every
      ok-mode node red once the real tfrc includes integrations/*). It never fills any other namespace, so
      test_sync_fetches_only_the_namespaces_the_tfrc_routes_through_the_mirror's acme run still returns 1 and its
      assertions hold unchanged. dirs_only creates the same directories with no file. A new stub mode kislerdm_only
      fills kislerdm/neon alone. Existing assertions unchanged (planned-change disposition on the fixture, citing
      acceptance criterion 3). New node test_mirror_sync_needs_every_included_namespace (the real tfrc with mode
      kislerdm_only: exit 1, WARNING EMPTY_MIRROR, no resolved tfrc written); unlike the acme node it proves the
      committed tfrc's integrations/* include is enforced.
  - file: config/agent/verification_registry/entries/ci-terraform-validate-provider-mirror-contract.yaml
    action: Modify
    purpose: >-
      check_spec becomes the six-grep chain VP 7 runs verbatim: the three ci.yml greps it carries today ('id:
      mirror_gate', 'Provider-mirror fail-closed consistency invariant', and the event-conditional
      agent-platform-github-ci-pr role) unchanged; the neon exact-version filename grep kept verbatim but pointed at
      scripts/ci/provider_mirror_gate.sh, where that check now lives; plus a grep anchored to the one-line run: delegation in ci.yml (a comment naming the script cannot satisfy it)
      and a grep for the github exact-version filename in the script. Same claim, re-pointed, plus the new provider.
      guard_target stays .github/workflows/ci.yml (Decision 244: guard_target does not list a check's inputs).
bundled_recommendations: [rec-5007]
followon_recs: [rec-5005, rec-5006]
infrastructure_dependencies: []
acceptance_criteria:
  - "With both locked provider packages in the mirror, the gate exports TF_CLI_CONFIG_FILE to a rendered tfrc that serves kislerdm/* and integrations/* from the mirror, and terraform-validate's terraform/github init installs integrations/github from the mirror (terraform prints it as (unauthenticated), never signed by a HashiCorp partner)."
  - "config/terraform/cc-web.tfrc names registry.terraform.io/integrations/github literally, so rec-5007's acceptance (grep -qF integrations/github and grep -q filesystem_mirror on that file) passes, and rec-5007 closes from the build's Resolves trailer."
  - "A missing or wrong-version package for either provider, an OIDC failure, a failed sync or an empty included namespace each degrades to direct fetch with a printed gate reason and exit 0; the required check never fails because of the mirror."
  - "ADMIN-session sync (bin/sync-terraform-assets.sh) needs every included namespace non-empty before it writes the resolved tfrc, so a session never excludes integrations/* from direct with nothing to serve it."
  - "The mirror_gate run body is one line and its baseline ceiling is lowered to match; no ceiling or budget is raised."
  - "On the merge's main CI run, terraform-validate prints provider-mirror: ACTIVE naming both providers and its terraform/github init installs integrations/github (unauthenticated) without a registry retry."
verification_plan:
  - step: 1
    phase: pre-deploy
    action: The gate activates the mirror for both providers.
    command: bin/venv-python -m pytest "tests/test_provider_mirror_gate.py::test_active_when_every_locked_provider_is_mirrored" -q
    expected: exit 0; red before (file absent).
    fix_if: TF_CLI_CONFIG_FILE is not exported, the rendered tfrc omits integrations/*, or the ACTIVE line omits a provider
    hermetic: true
    expected_literals: [" passed"]
    graduation: graduate
    graduation_check_id: provider-mirror-gate-active-both-providers
  - step: 2
    phase: pre-deploy
    action: A missing or wrong-version package for either provider degrades, exit 0.
    command: bin/venv-python -m pytest "tests/test_provider_mirror_gate.py::test_a_missing_or_wrong_version_provider_degrades" -q
    expected: exit 0; red before (file absent). Each case exports nothing, writes active=false and names the address in a gate 3/3 reason.
    fix_if: any case exports TF_CLI_CONFIG_FILE (that would wedge init with no direct fallback) or exits non-zero
    hermetic: true
    expected_literals: [" passed"]
    graduation: graduate
    graduation_check_id: provider-mirror-gate-version-miss-degrades
  - step: 3
    phase: pre-deploy
    action: The tfrc serves terraform/github's provider from the mirror.
    command: bin/venv-python -m pytest "tests/test_ci_provider_mirror_acceptance.py::TestTfrcSymmetry::test_mirror_serves_terraform_github_provider" -q
    expected: exit 0; red before (node absent; the pre-change tfrc includes kislerdm/* only).
    fix_if: the include list lacks registry.terraform.io/integrations/*
    hermetic: true
    expected_literals: [" passed"]
    graduation: graduate
    graduation_check_id: cc-web-tfrc-serves-integrations-github
  - step: 4
    phase: pre-deploy
    action: ADMIN-session sync refuses a mirror missing an included namespace.
    command: bin/venv-python -m pytest "tests/test_sync_terraform_assets.py::test_mirror_sync_needs_every_included_namespace" -q
    expected: exit 0; red before (node absent).
    fix_if: a resolved tfrc is written while integrations/* is empty
    hermetic: true
    expected_literals: [" passed"]
    graduation: graduate
    graduation_check_id: sync-terraform-assets-every-namespace
  - step: 5
    phase: pre-deploy
    action: Every gate branch writes exactly one active= line and exits 0 under the workflow's bash -e shell.
    command: bin/venv-python -m pytest "tests/test_provider_mirror_gate.py::test_every_branch_writes_active_and_exits_zero" -q
    expected: exit 0; red before (file absent).
    fix_if: a branch exits non-zero, writes no or two active= lines, or exports TF_CLI_CONFIG_FILE while degrading
    hermetic: true
    expected_literals: [" passed"]
    graduation: graduate
    graduation_check_id: provider-mirror-gate-every-branch-fail-open
  - step: 6
    phase: pre-deploy
    action: All three touched suites in full (the re-pointed structural nodes, the session sync, the gate script).
    command: bin/venv-python -m pytest tests/test_provider_mirror_gate.py tests/test_ci_provider_mirror_acceptance.py tests/test_sync_terraform_assets.py -q
    expected: exit 0
    fix_if: a pre-existing node fails (fix the code, never the node; Decision 235)
    hermetic: true
    expected_literals: [" passed"]
    graduation: waive
    graduation_waiver_reason: Whole-file re-runs of suites already in the --pre pytest_diff set; sync-terraform-assets-behaviour keeps covering the session file and steps 1-5 carry the new durable regressions.
  - step: 7
    phase: pre-deploy
    action: The re-pointed registry contract holds on the new tree.
    command: >-
      grep -q 'id: mirror_gate' .github/workflows/ci.yml && grep -q 'Provider-mirror fail-closed consistency invariant' .github/workflows/ci.yml && grep -q "github.event_name == 'pull_request' && 'agent-platform-github-ci-pr'" .github/workflows/ci.yml && grep -qE '^ +run: bash scripts/ci/provider_mirror_gate[.]sh$' .github/workflows/ci.yml && grep -q 'terraform-provider-neon_${NEON_VERSION}_' scripts/ci/provider_mirror_gate.sh && grep -q 'terraform-provider-github_${GITHUB_VERSION}_' scripts/ci/provider_mirror_gate.sh
    expected: exit 0; red before (the script is absent).
    fix_if: a grep misses (fix the code to the plan, never the grep)
    hermetic: true
    expected_literals: []
    graduation: waive
    graduation_waiver_reason: This is byte-for-byte the ci-terraform-validate-provider-mirror-contract shard's re-pointed check_spec script (in scope, run by the shard as bash -c); a second shard would duplicate it.
  - step: 8
    phase: pre-deploy
    action: The run-body ratchet passes with the lowered ceiling, and the OIDC fail-open guard still finds terraform-validate's negative-branch classifier.
    command: bin/venv-python -c "from scripts.checks.ci_guards.validate_composite_action_shell_bodies import validate_composite_action_shell_bodies as f; failed=[]; f(failed); raise SystemExit(1 if failed else 0)" && bin/venv-python -c "from scripts.checks.ci_guards.validate_oidc_failopen_guards import validate_oidc_failopen_guards as f; failed=[]; f(failed); raise SystemExit(1 if failed else 0)" && git diff origin/main -- config/composite_action_body_baseline.yaml | grep -c '^[-+] ' | grep -qx 2
    expected: exit 0; both guards pass and the baseline diff is the one mirror_gate line, 37 down to 1.
    fix_if: either guard fails (an OIDC guard miss means the outcome comparison left the job YAML), or any other baseline line changed
    hermetic: false
    graduation: waive
    graduation_waiver_reason: Both guards are already registered fast-tier checks; this step only confirms the decrease and names the OIDC guard as a consumer of the edit.
  - step: 9
    phase: pre-deploy
    action: Full tier, then HEAD attestation, after the build commit and rebase and before the push (handoff_policy); start it from the top-level session, backgrounded with a 2 h limit, and read only the attestation.
    command: bin/venv-python -m scripts.validate && bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: the full tier exits 0 and the validation result attests the current HEAD's tree
    fix_if: any failure -- fix and rerun the full tier from the start
    hermetic: false
    graduation: waive
    graduation_waiver_reason: A whole full-tier run; graduate steps may not invoke scripts.validate (recursion), and steps 1-5 carry the durable regressions.
  - step: 10
    phase: post-deploy
    action: The build PR's own CI and then the merge's main CI run the real job against the real mirror.
    command: >-
      mcp__github__actions_list(owner=otl-labs, repo=ontheloop, method=list_workflow_runs, resource_id=ci.yml), pick the push run on the merge SHA, then mcp__github__actions_list(method=list_workflow_jobs, resource_id=<run id>) and mcp__github__get_job_logs on its terraform-validate job, grepping 'provider-mirror: ' and '=== Terraform init [terraform/github] ===' through the next '==='
    expected: >-
      the job succeeds; its log carries 'provider-mirror: ACTIVE (kislerdm/neon 0.13.0, integrations/github 6.12.1)' (the
      versions the lockfiles pin at merge); the terraform/github init section carries 'Installed integrations/github
      v6.12.1 (unauthenticated)' (a mirror install; a direct install says signed by a HashiCorp partner) and no
      'transient registry error' line. Record the PR run id and the main run id.
    fix_if: the log shows DEGRADED (read the reason; a mirror miss means re-dispatch terraform-provider-mirror-seed.yml, a code defect means a fix on a new branch), or init still retries against the registry
    hermetic: false
  - step: 11
    phase: post-deploy
    action: >-
      An ADMIN session syncs the wider mirror and inits terraform/github from it. The implementing session runs it if it
      is a CC-web ADMIN session (terraform and the admin profile present); otherwise it reports the step NOT RUN and the
      coordinator runs it in an ADMIN thread. Never an operator step; the proving check is this command's exit 0.
    command: bash bin/sync-terraform-assets.sh && ls "$HOME/.terraform-mirror/registry.terraform.io/integrations/github" && TF_CLI_CONFIG_FILE="$HOME/.terraform-mirror.tfrc" terraform -chdir=terraform/github init -backend=false -input=false -lockfile=readonly && git status --short terraform/github
    expected: mirror-sync OK, the integrations/github package listed, init succeeds with no github.com fetch, and no tracked file changes (.terraform/ is gitignored).
    fix_if: >-
      EMPTY_MIRROR (the S3 mirror lost integrations/github: re-dispatch the seed workflow) or init tries a direct fetch (the tfrc did not resolve)
    hermetic: false
  - step: 12
    phase: post-deploy
    action: The bundled red rec-5007 is closed by the merge's Resolves trailer.
    command: >-
      AWS_PROFILE=agent_platform bin/venv-python -c "from src.common.ducklake_reader_client import fetch_recs_by_ids,
      make_reader; rows, _ = fetch_recs_by_ids(make_reader(), ['rec-5007']); print(rows[0]['id'], rows[0]['status'])"
    expected: prints rec-5007 with a closed status after ci.yml's closure job runs on the merge commit; record that run id.
    fix_if: >-
      still open (check the squash body carries Resolves: rec-5007 and the closure job's log; never close it by hand
      without the acceptance passing)
    hermetic: false
