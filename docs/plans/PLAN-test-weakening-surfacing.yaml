schema_version: 5
implementation_declared: true
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: test-weakening-surfacing
intent: >-
  Narrow the scope-boundary CONTENT invariant's sole residual (rec-3357: an assertion or numeric tolerance weakened in
  an in-scope file) honestly instead of claiming it closed: an added skip/xfail must cite a rec or declare itself an
  environment guard (mechanical, exceptionless), the listed syntactic weakening candidates are surfaced to the
  independent code-review gate, an implement PR must record that review's disposition for every listed candidate
  (mechanical, exceptionless), and the part no check can decide (whether a disposition is right: the test-oracle
  problem) stays a residual, narrowed and re-owned by rec-4413.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-test-weakening-surfacing.yaml
phase: >-
  ad_hoc_rec (soft-warn category): rec-3357, the Decision 181 point 2 residual owner. No tier_item is claimed and no
  exit criterion is closed.
scope:
- file: scripts/checks/hygiene/validate_test_skip_citations.py
  action: Create
  purpose: >-
    Registered check validate_test_skip_citations. Its base ref is _common.status_diff_base(root), the ref
    get_status_aware_diff diffs against (Decision 159: no second resolver); None -> registry.skipped("diff base
    unreachable"). Its ADDED sites come from the shared _weakening_ast.added_skip_sites (one definition for both
    checks), taken for every added, untracked ("??") or modified tests/**/*.py file in the diff; each must carry a token
    matching \brec-\d+\b anywhere in its reason, or a reason starting with "env: " (an environment guard). No waiver, marker or grandfather (Decision 163
    point 1); sites already on the base ref are never re-judged. One failure per violation naming path:line, the site
    kind and the fix (cite a rec filed through the ops portal, or label a real environment guard "env: <condition>";
    for an added unittest expectedFailure, which takes no reason, convert it to pytest.mark.xfail(reason=...)). An
    unparseable head file is a reported failure, never a raise; otherwise registry.examined(<test files read>,
    unit="test_files"). Both the registered function and main(argv) print one "ADDED-SKIP path:line kind -- reason"
    line per judged added site, so a quarter of merges can be sampled. main(argv) accepts --base REF and --head REF
    (base omitted = _common.status_diff_base(root), and None prints one SKIP line and exits 0; head omitted = working
    tree) and exits 1 on any failure, else 0.
- file: scripts/checks/hygiene/_manifest.py
  action: Modify
  purpose: >-
    One Entry for validate_test_skip_citations: pre=True, pre_globs=("tests/**",
    "scripts/checks/hygiene/validate_test_skip_citations.py", "scripts/checks/_weakening_ast.py",
    "scripts/checks/_common.py", "scripts/checks/registry.py") widened only where validate_pre_glob_closure names a
    missing import,
    full_segment="full_after_lint" (the validate_test_count_coupling shape).
- file: tests/checks/hygiene/test_validate_test_skip_citations.py
  action: Create
  purpose: >-
    Mirror test driving the check through injected base/head sources (fixtures are string literals, never real skip
    decorators or calls, so this file adds no skip site of its own). Class TestAddedSkipsMustCiteOrDeclare: each site
    kind added without a rec token or env: label fails naming path:line; with either it passes. Class
    TestOnlyAddedSitesAreJudged: a site already on the base passes unchanged; a changed reason is judged as added; a
    removed site passes; an existing skip carried into a new file by a rename or decomposition is not judged, but a
    module-level skipif carried from a deleted file into a pre-existing test file fails uncited; a bare uncalled
    @pytest.mark.skip, a pytestmark = pytest.mark.xfail without a call, a mark alias and an item.add_marker skip each
    count as sites; each import-alias form (import pytest as X, from pytest import skip and mark, import unittest as
    X, from unittest import skip) and self.skipTest, raise unittest.SkipTest and raise pytest.skip.Exception each count
    as sites; an importorskip whose only string is the module name fails as uncited; an untracked ("??")
    test file is judged like an added one; an added expectedFailure's failure names the pytest.mark.xfail conversion;
    one ADDED-SKIP line prints per judged site. Plus: an unparseable head file fails, an unreachable base skips, examined() counts files read,
    and main() exits 1 on a violation and 0 when clean, including main(["--base", REF, "--head", REF]) over a fixture
    repository.
- file: scripts/checks/_weakening_ast.py
  action: Create
  purpose: >-
    Shared pure AST helpers for both domains' checks (the _marker_guard placement), no I/O, never raising on bad input
    (unparseable source -> empty result). skip_sites(source) -> list of SkipSite(kind, line, reason, scope). A SKIP SITE
    is a skip, skipif or xfail mark in any position (decorator, module- or class-level pytestmark,
    pytest.param(..., marks=...), an alias assignment such as x = pytest.mark.skipif(...), or an
    item.add_marker(...) argument), called or bare (a bare @pytest.mark.skip has an empty reason); a unittest skip,
    skipIf, skipUnless or expectedFailure decorator; a pytest.skip, pytest.xfail or pytest.importorskip call
    anywhere; or a self.skipTest(...) call, a raise unittest.SkipTest(...) or a raise pytest.skip.Exception(...).
    Names resolve through the module's imports first: import pytest as X, from pytest import skip, xfail, importorskip
    or mark, import unittest as X, and from unittest import skip, skipIf, skipUnless, expectedFailure or SkipTest. Its REASON is the reason= keyword, else the first positional
    string (the second for the skipif and xfail marks and the skipIf and skipUnless decorators, whose first is the
    condition; the pytest.skip and pytest.xfail calls take the reason first); for pytest.importorskip only reason= or
    the third positional counts (the first is the module name, never a reason); an f-string contributes its constant
    parts. Its SCOPE is the enclosing test
    key ("func" or "Class::func") for a site on or inside a test, "Class" for a class-level site, and "*" for a
    module-level site or one inside a fixture or helper. added_skip_sites(files) -> {path: [SkipSite]} over every
    changed test file at once (files maps path -> (base_source or None, head_source or None)), the single home both
    checks use: per file, the head's sites minus the base's (a multiset keyed by scope, kind and reason), less any
    site CARRIED from another file. A site is carried only when it matches (scope, kind and reason) a site the same
    diff removed from another changed or deleted test file AND its scope did not exist in the destination file at
    the base (a new file, a class new to that file, or a test key new to that file). A rename or decomposition that
    moves an existing skip with its tests therefore adds none, while a skip carried onto tests that already existed
    in the destination is added. applicable_skip_sites(source, key) -> the sites that apply to test key: its own scope, its class's and
    the module's "*". test_functions(source) -> {key: node} for module-level test*
    functions and test* methods of top-level Test* classes. assertions(node) -> Counter of normalized ast.dump for
    every assert statement's test and every call whose callee name starts with "assert" or is raises, warns, approx or
    isclose, with a display string (first source line) per element. tolerances(node) -> numeric-literal values of the
    rel, abs, rel_tol, abs_tol, rtol, atol and delta keywords on approx, isclose, assertAlmostEqual, allclose and
    assert_allclose calls, keyed by (callee, keyword, occurrence). numeric_constants(source) -> module-level UPPER_CASE
    names bound to an int or float literal (unary minus allowed, bool excluded).
- file: scripts/checks/verification/validate_weakening_candidates.py
  action: Create
  purpose: >-
    REPORT-ONLY registered check validate_weakening_candidates (the validate_diff_coverage shape): it never appends to
    failed. find_candidates(changed, read_base, read_head) -> sorted list of Candidate(category, path, node, detail),
    pure over injected (status, path) pairs and readers. Categories: assertion-removed (a pre-existing test, same key
    in a modified test file, whose assertion count fell; detail names a lost assertion); assertion-changed (an
    assertion lost while the count held or rose; detail names the lost assertion); test-removed (a key present at base
    in a modified OR deleted test file and absent at head whose bare name is added in no changed test file);
    test-moved-weaker (that bare name added elsewhere in the diff with a lost assertion -- assertions(base) minus
    assertions(head) non-empty -- or a gained skip site: the destination's applicable_skip_sites minus the source's,
    keyed by (kind, reason), non-empty, so a move into a file under a module-level skip, or one that swaps one skip for
    another, counts, including a move out of a deleted file); test-file-deleted (a deleted
    tests/**/*.py file; detail the count of its tests not found at head, each of which is also its own test-removed
    candidate); skip-added (a site skip_sites finds in a modified
    tests/**/*.py file at head that its base lacks, per added_skip_sites; node is the site's scope; detail its kind
    and reason); tolerance-widened (a
    tolerance keyword's absolute value rose); constant-changed (a module-level UPPER_CASE numeric constant whose value
    changed in a modified scripts/**/*.py or src/**/*.py file; detail old -> new). node is the test key, a class name,
    the constant name, or "*" (a deleted file, or a module-level or fixture skip); key(candidate) ->
    "[category] path::node", the disposition key. find_candidates returns exactly one Candidate per key: items
    sharing a key (two skips in one scope, two widened tolerances in one test) merge, their details joined with "; "
    and cut to 160 characters.
    The registered function reads the diff through _common.get_status_aware_diff and base contents at
    _common.status_diff_base(root), the same ref, head from the working tree, over every changed file (not only
    implement-leg diffs: code review runs before implementation_declared flips); prints per item one
    "CANDIDATE [category] path::node -- detail" line followed by one stub line
    '  - {candidate: "[category] path::node", disposition: <label>, cite: "<reference>"}', then each of the contract's
    invariants.content.review_dispositions keys with its rule, read from the contract (no second copy); SKIPs via registry.skipped when status_diff_base is None; declares
    registry.examined(<changed .py files read>, unit="changed_files"). main(argv) accepts --base REF and --head REF
    (base omitted = _common.status_diff_base(root), and None prints one SKIP line; head omitted = working tree),
    prints the same lines and always exits 0.
- file: scripts/checks/verification/_manifest.py
  action: Modify
  purpose: >-
    Two Entries, validate_weakening_candidates and validate_weakening_dispositions: pre=True, pre_globs=None (ungated;
    each reads only the diff and its plans), full_segment="full_after_lint".
- file: tests/checks/test__weakening_ast.py
  action: Create
  purpose: >-
    Mirror test, class TestWeakeningAst: each helper's contract, including every skip-site position and scope (module
    and class pytestmark, pytest.param marks, a fixture's pytest.skip, importorskip's reason= and third positional but
    never its module name), each import-alias form and the skipTest/SkipTest/skip.Exception forms, added_skip_sites'
    multiset and applicable_skip_sites' three scopes, unparseable source,
    unary minus and bool exclusion.
- file: tests/checks/verification/test_validate_weakening_candidates.py
  action: Create
  purpose: >-
    Mirror test. Class TestCandidates drives find_candidates with in-memory base/head sources: one positive case per
    category, including skip-added for a module-level pytestmark skip, a module-level importorskip and a fixture's
    pytest.skip added to a pre-existing file, test-moved-weaker for a moved test that gained a skip and for one moved
    into a new file under a module-level pytestmark skip, and one merged Candidate for two sites in one scope; out of a
    deleted file, a moved test that gained a skip, one with a lost assertion, and one removed outright (test-removed);
    a test moved into a new file that swaps one skip for another yields test-moved-weaker;
    an existing skip carried by a rename yields no skip-added, while a module-level skip carried into a
    pre-existing test file yields skip-added for that file's "*" scope; negatives (an
    added test, a strengthened assertion, a reformatted but equal assertion, an unchanged constant, a test moved with
    equal assertions and skips, a non-numeric constant) yield nothing. Class TestReportOnly: the
    registered function prints every candidate and the disposition keys and leaves failed empty. Plus the
    origin/main-unreachable skip, examined(), and main()'s exit 0.
- file: scripts/checks/verification/validate_weakening_dispositions.py
  action: Create
  purpose: >-
    BLOCKING registered check validate_weakening_dispositions (the validate_graduation_completeness implement-leg
    shape). base = _common.status_diff_base(root); None -> registry.skipped("diff base unreachable"). resolved =
    _common.resolve_declared_plans(changed, root, base); none -> one PASS no-op line and
    registry.examined(0, unit="declared_plans"). Otherwise the candidates are validate_weakening_candidates.find_candidates
    over the same diff, and the recorded dispositions are the union of the resolved plans' weakening_dispositions,
    read with raw yaml. One failure per item: a candidate key with no recorded entry (naming the key and the plan, and
    the fix: copy code review's filled-in stub into the plan's weakening_dispositions); a key recorded twice; a
    recorded key matching no current candidate (stale: re-run code review on the current diff); a disposition that is
    not a key of the contract's invariants.content.review_dispositions (read from the contract, no second copy); a
    disposition of weakening (restore the check, or route it to a recommendation via the ops portal; never inline); a
    cite that does not resolve (its referent must resolve; whether it justifies the label stays review's judgement,
    Decision 165's existence-versus-authorization distinction). Cite rules:
    refactor and growth-safe-pin need a "<file>.py::<name>[::<name>]" token whose file exists in the working tree and
    whose last name is a def or class in it; planned-change needs "acceptance_criteria[N]" or "test_obligations[N]"
    with N a valid 0-based index in a resolved plan as it stood at the diff base (at head only when the plan is
    net-new at the base), so an implement diff cannot append an obligation and cite it; retirement needs a path deleted in the diff, or a
    "<file>.py::<name>" whose name is defined at the base and not in the working tree, and that is neither the
    candidate's own path nor its own path::node (the contract asks for the deleted tested subject, not the test);
    owned-skip is valid only on a skip-added candidate, or on a test-moved-weaker candidate that gained a skip site and
    lost no assertion,
    and needs a rec-NNNN token or an "env: " label that appears in the reason of one of that candidate's added (or, for
    a moved test, gained) skip sites. No marker, waiver or grandfather. Then
    registry.examined(len(resolved), unit="declared_plans"). main() runs it against the working tree and exits 1 on
    any failure, else 0.
- file: tests/checks/verification/test_validate_weakening_dispositions.py
  action: Create
  purpose: >-
    Mirror test (the plan-obligations mirror path) over an injected git fixture repository built by fixtures inside
    this file (a base commit, a plan flipping implementation_declared, test files and a contract copy; no new
    conftest.py). Class TestDispositionsRequired: on a diff that flips implementation_declared, a candidate with no
    entry fails naming its key and plan; a duplicate, a stale, an unknown disposition and a weakening entry each fail;
    for each of the five non-weakening dispositions an unresolvable cite fails and a resolving cite passes; a
    retirement cite naming the candidate's own path or path::node fails; owned-skip passes on a skip-added candidate
    and on a test-moved-weaker one that gained a skip and lost no assertion (including a swap of one skip for
    another), and fails on any other category or on a moved test with a lost assertion; a planned-change index valid
    only at head fails; two sites in one scope need one entry; a complete, resolving record passes. Class
    TestImplementLegOnly: a diff with no flip is a no-op with examined(0) even when candidates exist; an unreachable
    base skips. Cases are parametrized over one fixture builder to stay under 500 SLOC; if it would still exceed it,
    STOP and amend this plan's scope first (the contract's two-act procedure), never split it into an undeclared file.
- file: scripts/checks/_common.py
  action: Modify
  purpose: >-
    Extract status_diff_base(root) -> str | None from get_status_aware_diff: push_context_base(root), else the
    merge-base of origin/main and HEAD, else None. get_status_aware_diff calls it and keeps its behaviour, including
    its local HEAD fallback; base resolution keeps its single home here (Decision 159).
- file: tests/checks/_common/test_primitives.py
  action: Modify
  purpose: >-
    New class TestStatusDiffBase: the push base wins; the merge-base is the fallback; None when neither resolves.
    test_get_status_aware_diff_full_pass stays green unchanged.
- file: scripts/checks/hygiene/validate_root_scoped_diff_base.py
  action: Modify
  purpose: >-
    Add "status_diff_base" to _TARGET_PRIMITIVES, so a root-taking caller that calls it bare is flagged like
    push_context_base, and update the module docstring's "three primitives" to name all four.
- file: tests/checks/hygiene/test_validate_root_scoped_diff_base.py
  action: Modify
  purpose: >-
    New TestScanFile::test_bare_status_diff_base_call_is_flagged; test_live_tree_reports_zero_violations stays green
    (every new caller forwards root).
- file: scripts/roadmap/plan_document.py
  action: Modify
  purpose: >-
    New model WeakeningDisposition (extra="forbid"): candidate, a str matching ^\[[a-z-]+\] \S+::\S+$ (the key
    validate_weakening_candidates prints before " -- "); disposition, Literal["refactor", "planned-change",
    "retirement", "growth-safe-pin", "owned-skip", "weakening"]; cite, a str with min_length 1. PlanDocument gains
    weakening_dispositions: list[WeakeningDisposition] defaulting to empty, valid on every schema_version with no
    version bump (the fallback_reevaluation and implementation_declared precedent).
- file: tests/roadmap/plan_document/test_optional_fields.py
  action: Modify
  purpose: >-
    New class TestWeakeningDispositions: a valid entry parses; an omitted field defaults to []; an unknown
    disposition, a malformed candidate key, an empty cite and an extra key are each rejected.
- file: config/ci_rca_taxonomy.yaml
  action: Modify
  purpose: >-
    Rows validate_test_skip_citations, validate_weakening_candidates and validate_weakening_dispositions, each
    code_regression (the validate_diff_coverage and validate_graduation_completeness class).
- file: docs/contracts/implement-scope-boundary.yaml
  action: Modify
  purpose: >-
    APPROVED_CONTRACT (execution_steps), verbatim: invariants.content gains
    review_dispositions before enforcement_coverage; the added-skip and recorded-disposition mechanical rows are
    inserted before the residual row; the residual row is replaced; sanction_rows.implementing_plan_bookkeeping's
    permitted_field_edits gains weakening_dispositions last; sanction_row_eligibility.ineligible's owner clause
    changes; one amendment_log entry is appended last. No other line changes.
- file: tests/test_scope_boundary_contract.py
  action: Modify
  purpose: >-
    Every existing assertion stays. New contract pins live in a new class TestWeakeningSurfacingContract: the added-skip row is mechanical with enforced_by
    validate_test_skip_citations; the recorded-disposition row is mechanical with enforced_by
    validate_weakening_dispositions; the single residual row is owned by rec-4413 and its note keeps "DOMINANT" and
    names validate_weakening_candidates, validate_weakening_dispositions, the test-oracle problem and
    review_dispositions; review_dispositions has exactly the six keys refactor, planned-change, retirement,
    growth-safe-pin, owned-skip, weakening, and the five non-weakening values name their cite form; implementing_plan_bookkeeping's permitted_field_edits includes weakening_dispositions (the
    followon_recs pin's shape); the Literal on scripts.roadmap.plan_document.WeakeningDisposition.disposition equals
    the contract's review_dispositions keys (typing.get_args; Decision 169's derive-and-assert); ineligible cites
    rec-4413 and still rec-3357; exactly one amendment_log entry names test-weakening-surfacing. New
    TestProseSurfacesPointAtContract::test_code_review_skill_requires_weakening_dispositions: inside the skill's
    "### 3. Testing" section, the bullet beginning "- **Weakening candidates**" (through its continuation line) names
    scripts.checks.verification.validate_weakening_candidates, review_dispositions and "High" -- asserted on that
    bullet alone, since "High" already appears elsewhere in the section -- and the Output Format carries a
    "### Weakening Dispositions" section naming weakening_dispositions.
- file: .claude/skills/code-review/SKILL.md
  action: Modify
  purpose: >-
    APPROVED_SKILL (execution_steps), verbatim: the Weakening candidates
    bullet after the Test obligations bullet and the Weakening Dispositions output section after Test Completeness,
    funded inside the 12,609-byte prose budget by deleting the two stale recs-log mentions (Decision 215: no recs
    log), repointing the stale Mock Exhaustion bullet to tests/CLAUDE.md, deleting the Docker bullet (no Docker file
    exists in the repo) and merging a duplicated no-edit sentence. Ends at 12,601 bytes.
bundled_recommendations:
- rec-3357
followon_recs:
- rec-4413
infrastructure_dependencies: []
acceptance_criteria:
- >-
  A skip/xfail/importorskip site added in tests/** fails validate_test_skip_citations unless its reason cites a rec id
  or starts with "env: "; sites already on the base ref are not judged; the branch's own diff passes.
- >-
  validate_weakening_candidates lists every category on a constructed diff and on real history (8107c227
  assertion-changed, 2bb9846d constant-changed, f44647cb test-removed), lists nothing for a control commit (72fb926e),
  never fails a run, and reports a 25-file commit in under 2.5 seconds per run.
- The code-review skill requires a disposition per listed item, raises High for a weakening or a missing one, and returns the dispositions in a fixed line format, within its prose budget.
- >-
  On a diff that flips implementation_declared, validate_weakening_dispositions fails any candidate without exactly
  one recorded disposition in the resolved plans' weakening_dispositions, any stale, unknown or weakening entry, and
  any cite that does not resolve under its disposition's rule; other diffs are not gated; plan documents accept the
  field and reject malformed entries.
- >-
  The contract's CONTENT map carries the two new mechanical rows and exactly one residual row, owned by rec-4413, with the
  approved text; Decision 181's text is unchanged.
- >-
  rec-3357 is superseded with the approved resolution; rec-4413 is open with the approved re-measure context
  (APPROVED_REC4413_UPDATE, which names validate_test_skip_citations).
verification_plan:
- step: 1
  phase: pre-deploy
  action: Every added skip-site kind without a rec citation or env label fails; with either it passes.
  command: bin/venv-python -m pytest tests/checks/hygiene/test_validate_test_skip_citations.py::TestAddedSkipsMustCiteOrDeclare -q
  expected: Exit 0, every node passes. Red before because the file does not exist.
  expected_literals: []
  fix_if: A kind passes uncited -> fix the site finder or reason reader, never the test.
  hermetic: true
  graduation: graduate
  graduation_check_id: test-skip-citation-required
- step: 2
  phase: pre-deploy
  action: Only added sites are judged.
  command: bin/venv-python -m pytest tests/checks/hygiene/test_validate_test_skip_citations.py::TestOnlyAddedSitesAreJudged -q
  expected: Exit 0, every node passes.
  expected_literals: []
  fix_if: A base-ref site is flagged -> fix the head-minus-base multiset.
  hermetic: true
  graduation: waive
  graduation_waiver_reason: >-
    The negative half of step 1's class; the standing invariant worth a registry row is step 1, and this class runs in
    every --pre that touches tests/** or the module.
- step: 3
  phase: pre-deploy
  action: The branch's own diff carries no uncited added skip.
  command: bin/venv-python -m scripts.checks.hygiene.validate_test_skip_citations
  expected: Exit 0 with no failure line.
  expected_literals: []
  fix_if: A site in a new test file is flagged -> it is a real decorator or call, not a string fixture; rewrite the fixture.
  hermetic: false
  graduation: waive
  graduation_waiver_reason: Depends on this branch's diff; the registered check runs the same on every PR.
- step: 4
  phase: pre-deploy
  action: Each candidate category is found and the negatives yield nothing.
  command: bin/venv-python -m pytest tests/checks/verification/test_validate_weakening_candidates.py::TestCandidates -q
  expected: Exit 0, every node passes. Red before because the file does not exist.
  expected_literals: []
  fix_if: A category is missed or a negative listed -> fix find_candidates or _weakening_ast.
  hermetic: true
  graduation: graduate
  graduation_check_id: weakening-candidates-discriminate
- step: 5
  phase: pre-deploy
  action: The AST helpers return the scoped facts and empty results on unparseable source.
  command: bin/venv-python -m pytest tests/checks/test__weakening_ast.py::TestWeakeningAst -q
  expected: Exit 0, every node passes. Red before because the file does not exist.
  expected_literals: []
  fix_if: A helper misreads a node or a skip site -> fix scripts/checks/_weakening_ast.py.
  hermetic: true
  graduation: waive
  graduation_waiver_reason: >-
    Helper-level contract under step 4's graduated discrimination row, which fails if any helper regresses in a way
    that changes a candidate.
- step: 6
  phase: pre-deploy
  action: The report never fails a run.
  command: bin/venv-python -m pytest tests/checks/verification/test_validate_weakening_candidates.py::TestReportOnly -q
  expected: Exit 0, every node passes. Red before because the file does not exist.
  expected_literals: []
  fix_if: failed is non-empty -> the check must only print.
  hermetic: true
  graduation: graduate
  graduation_check_id: weakening-candidates-report-only
- step: 7
  phase: pre-deploy
  action: Replay real history -- three known candidates and one clean control.
  command: >-
    bash -c 'M=scripts.checks.verification.validate_weakening_candidates;
    bin/venv-python -m $M --base 8107c227^ --head 8107c227 | grep -q "CANDIDATE \[assertion-changed\] .*TestDataLakeLifecycleGoverned::test_rule_status_is_enabled" &&
    bin/venv-python -m $M --base 2bb9846d^ --head 2bb9846d | grep -q "CANDIDATE \[constant-changed\] .*::NON_TEST_BUDGET_SECONDS" &&
    bin/venv-python -m $M --base f44647cb^ --head f44647cb | grep -q "CANDIDATE \[test-removed\] .*test_blob_root_only_on_the_writer" &&
    ! bin/venv-python -m $M --base 72fb926e^ --head 72fb926e | grep -q "^CANDIDATE"'
  expected: >-
    Exit 0 (each grep asserts its item; the control asserts none). Run 1 lists an assertion-changed item for TestDataLakeLifecycleGoverned::test_rule_status_is_enabled; run 2
