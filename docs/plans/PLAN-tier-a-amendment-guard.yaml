schema_version: 5
implementation_declared: true
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: tier-a-amendment-guard
intent: >-
  Make Decision 243 cl.6 and Decision 196 cl.3 mechanical: a registered check refuses any change to a Tier A entry of
  docs/contracts/north-star.yaml (the mission, an NS.n, the partial order, the semantics block) unless the key carries
  a marker citing a Decision whose text, added in the same change, names it, so direction changes only through new
  human-approved text (NS.8, NS.9). It binds the shared marker mechanism as a new kind, never a copy (Decision 165,
  Decision 187 cl.7), and is the record floor under the human gate, not the gate (NS.9).
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-tier-a-amendment-guard.yaml
phase: >-
  T4.36 (in_progress; follow-on plan mode). Closes c3 only; c1-c2 are met by north-star-tier-a, c4-c7 belong to the
  grammar, scout-lane, orient and journal plans.
closes_criteria:
  - T4.36:c3
scope:
  - file: scripts/checks/_marker_guard.py
    action: Modify
    purpose: >-
      Three opt-in RegistrySpec fields appended after gates_deletion, each documented in the class docstring, with
      defaults that leave every incumbent binding's behaviour unchanged: fresh_mention (bool, False), boundary_match
      (bool, False), transition_label (str, "weakening"). (1) boundary_match: _mentions_any gains a keyword `bounded`;
      when True a candidate matches only where no character of [A-Za-z0-9_-] sits immediately before or after it
      (re.escape per candidate); authorization_failure gains a keyword-only `bounded: bool = False` passed to both of
      its _mentions_any calls (the direct body and the one supersession hop). (2) fresh_mention, in check_state_diff
      only: read docs/DECISIONS.md and docs/DECISIONS_ARCHIVE.md once through the same base_reader (None from either
      prints the loud SKIP line and returns [], as the unreachable-base branch does; "" is an empty corpus), parse
      them with a private _bodies_from_text(text) helper extracted from load_decision_bodies' loop (load_decision_bodies
      then calls it; its output is unchanged). After a gated transition's marker passes the stale-marker rule and
      head authorization, it is fresh only when difflib.SequenceMatcher over the cited Decision's base body lines
      (absent number: no lines) and head body lines yields no replace or delete opcode and the inserted lines name a
      candidate (the same candidate list and `bounded` flag authorization uses; no supersession hop). Otherwise
      append "<key>: <token> marker cites <dec>, but no text added to it in this change names this entry (a mention
      the base already carried is spent; an in-place rewrite never authorizes)." check_present_markers never applies
      freshness (scout NOTE 165). (3) transition_label replaces the literal word "weakening" in check_state_diff's
      two violation messages. (4) rec-3736, landed as its own commit with TestReasonRequired before the options and
      the guard (Benjamin's "Commit"): when spec.reason_required is True, check_state_diff and
      check_present_markers treat a marker whose reason is None or blank as no marker. check_diff and __all__ are
      unchanged (rec-3027 stays out of scope; validate_marker_grammar_exports stays green). Measured 410 of 500 SLOC;
      the change is about 45 lines. If the build measures it past 500, stop and raise a plan amendment (Decision 128
      decomposition), never a budget raise.
    new_imports: []
  - file: tests/checks/test__marker_guard_state_options.py
    action: Create
    purpose: >-
      The options' tests, beside tests/checks/test__marker_guard.py (498 of 500 SLOC, so not extended). Fixture
      corpora under tmp_path with _common.ROOT monkeypatched and _marker_guard._decision_bodies_cache cleared per test,
      and an in-memory base_reader dict ({rel_path: text}, "" for absent). TestBoundaryMatch: NS.1 not named by a body
      saying only NS.10 or only the range NS.1-NS.9 (nor NS.9 by it); mission not named by permission or
      mission-critical; NS.1 named by "(NS.1)", "NS.1," and end of body; with the
      default False a substring still authorizes (incumbent behaviour pinned). TestFreshMention: a Decision absent at
      base naming the key authorizes; a dated note appended to an existing body naming the key authorizes; a body
      that already named the key at base does not (spent), even when a further note repeats it; a body whose base
      line is rewritten does not, even when the new text names the key; a None corpus read skips loudly with [];
      check_present_markers on the same spec ignores freshness; default False keeps head-only authorization.
      TestTransitionLabel: the label replaces "weakening" in both messages; the default is "weakening".
      TestReasonRequired (rec-3736's new acceptance): a reasonless head marker on a reason_required spec is no
      marker in check_state_diff and is skipped by check_present_markers; with reason_required False it still counts.
  - file: scripts/checks/contracts/validate_tier_a_amendment_guard.py
    action: Create
    purpose: >-
      Registered check validate_tier_a_amendment_guard(failed, root=None), owner platform. TOKEN =
      "tier-a-amendment-approved"; _REL = "docs/contracts/north-star.yaml". (a) Base: _common.status_diff_base(root)
      (Decision 159); None prints a SKIP line, calls registry.skipped and skips the diff legs. One `git cat-file
      --batch` at that base for _REL, docs/DECISIONS.md and docs/DECISIONS_ARCHIVE.md (the schedule-removal reader
      shape: blob text, "" for a missing path, None when the subprocess fails, which skips loudly). (b) Keys: mission,
      partial_order, semantics and every principles[].id at base or head. State per key: json.dumps(parsed value,
      sort_keys=True) of the raw yaml.safe_load node (not the Pydantic model, so a shape defect still compares), None
      when absent. A YAML parse failure at base or head is a PARSE violation (fail closed). (c) Spans from
      yaml.compose marks: mission, partial_order and semantics from their key line to the line before the next
      top-level key; each principles item from its dash line to the line before the next item or the end of the
      sequence. Marker regex `#\s*tier-a-amendment-approved:\s*dec-(\d+)\s*(.*)$`; a blank reason is no marker; more
      than one marker on one span is a SPAN violation ("replace the old marker, never add a second"). (d) REMOVED leg: a key present
      at base and absent at head fails with "removed -- retire by status: retired with a marker; removal has no
      marker escape"; removed keys are left out of the spec so they are not reported twice. (e) DIFF leg, skipped
      when the head text equals the base text byte for byte (Decision 182): _marker_guard.check_state_diff over one
      RegistrySpec whose state_extractor always emits every key in the universe (absent = None, the schedule-removal
      precedent), weakened = base != head, gates_deletion always True, mention_candidates = lambda k: [k],
      reason_required=True, fresh_mention=True, boundary_match=True, transition_label="change". (f) RETRO leg:
      check_present_markers on the same spec, every run. (g) CARRIED leg, every run: every present marker on the
      mission or an NS.n cites a Decision number in that entry's head carried_by ("<key>: marker cites <dec>, which is
      not in its carried_by; a Decision that changes an entry carries it -- add it in the same change"); a marker on
      partial_order or semantics cites the Decision that contract.ratified_via names at the diff base (at head when
      there is no base), parsed with validate_north_star's own `Decision (\d+)` rule ("<key>: marker cites <dec>, not
      the ratifying Decision <n>; record the change as a dated note on it"). Reading ratified_via at the base keeps a
      same-change edit of the contract block from moving the authorizer (Decision 187 cl.1). (h) POINTER leg, every run: every present marker's reason
      matches `approval:\s+\S+\s+\d{4}-\d{2}-\d{2}` ("<key>: marker reason carries no `approval: <ref>
      <YYYY-MM-DD>` pointer"); presence and shape only. (i) LOG leg, diff only: each key whose state changed and is
      present at head needs an amendment_log row present at head and absent at base whose json.dumps text names the
      key under the boundary rule ("<key>: changed with no new amendment_log row naming it"). (j) OWNERSHIP leg: each
      path of _PROTECTED (the guard module and its test, scripts/checks/_marker_guard.py,
      tests/checks/test__marker_guard.py, tests/checks/test__marker_guard_state_options.py and
      docs/contracts/north-star.yaml) is code-owned in .github/CODEOWNERS (_owned from
      scripts/checks/ci_guards/validate_trusted_plan_environment, already imported cross-domain by
      sensitive_value_detectors) and covered by a config/agent/executor/capabilities.yaml boundary_patterns entry at
      head (the sensitive_value_detectors ownership_violations idiom). registry.examined(<keys in the universe>,
      unit="tier_a_entries"). Failure label "Tier A amendment guard". The module docstring names Decision 243 cl.6,
      Decision 196 cl.3 and marker-grammar.yaml's token row, and restates no mechanics.
    new_imports:
      - scripts.checks._marker_guard
      - scripts.checks.ci_guards.validate_trusted_plan_environment
  - file: tests/checks/contracts/test_validate_tier_a_amendment_guard.py
    action: Create
    purpose: >-
      Mirror tests in a temporary git repository (the tests/checks/contracts/test_validate_north_star.py pattern: the
      real north-star.yaml copied, a fixture DECISIONS.md with Decision 243 and a Decision 86 body naming NS.4 (86 is
      in NS.4's carried_by), the capabilities and CODEOWNERS rows), committed as main with origin/main pointing at it,
      then head edits in the working tree. Unless a node says otherwise, an authorized change also adds the citing
      Decision to carried_by, a reason with an approval pointer and an amendment_log row naming the key, so each node
      fails for one cause. Nodes: test_authorization_shaped_binds_marker_guard_at_check_name_level (rec-3959's
      acceptance: an NS.4 detail edit with a marker citing a new Decision naming NS.4 passes; the same marker citing a
      new Decision naming only NS.40, the range NS.1-NS.9, scripts/checks or the file path fails; a spy on
      _marker_guard.check_state_diff proves the binding); test_unmarked_change_fails; test_spent_mention_fails (cites
      86); test_appended_note_authorizes (a dated note on 86); test_in_place_rewrite_never_authorizes;
      test_addition_needs_a_fresh_marker (NS.10); test_retirement_needs_a_fresh_marker;
      test_removal_has_no_marker_escape; test_mission_partial_order_and_semantics_are_gated;
      test_cited_decision_outside_carried_by_fails; test_block_keys_need_a_dated_note_on_the_ratifying_decision (a
      semantics edit citing a fresh note on another Decision that says "field semantics" fails; a fresh dated note on
      243 naming semantics passes); test_ratified_via_is_read_at_the_base; test_marker_without_approval_pointer_fails;
      test_change_without_a_log_row_naming_the_key_fails; test_marker_on_another_entry_does_not_authorize;
      test_two_markers_on_one_entry_fail; test_reasonless_marker_is_no_marker;
      test_header_comment_amendment_log_and_reflow_are_free; test_unchanged_file_runs_only_the_retroactive_leg;
      test_retroactive_scan_flags_an_unauthorized_present_marker; test_push_to_main_rechecks_the_merged_commit
      (GITHUB_EVENT_NAME=push, HEAD~1 base); test_no_diff_base_skips_loudly_and_records_a_skip;
      test_parse_failure_fails_closed; test_ownership_rows_required (a missing CODEOWNERS row and a missing
      boundary_patterns row each fail); test_registered_ungated_in_both_tiers; test_real_tree_is_clean.
  - file: scripts/checks/contracts/_manifest.py
    action: Modify
    purpose: >-
      One Entry for validate_tier_a_amendment_guard after validate_north_star: pre=True, pre_globs left unset (ungated,
      with a one-line comment: a glob-gated guard is one glob edit from not running on the diff that edits it,
      Decision 187 cl.6), full_segment="full_after_lint".
  - file: config/ci_rca_taxonomy.yaml
    action: Modify
    purpose: >-
      Row "validate_tier_a_amendment_guard: code_regression" after validate_north_star's (the marker-guard rows'
      category). The file is at 487 of 500 effective lines; one line fits.
  - file: docs/contracts/marker-grammar.yaml
    action: Modify
    purpose: >-
      Sidecar blocks grammar-log, grammar-token and grammar-mechanics of docs/plans/approved/tier-a-amendment-guard.yaml,
      verbatim with {{DATE}} filled with the build date: a new amendment_log entry (newest first), the
      tier-a-amendment-approved token row after detector-loosening-approved, and state_diff_mechanics points (5)-(8).
  - file: docs/contracts/north-star.yaml
    action: Modify
    purpose: >-
      Sidecar blocks north-star-header and north-star-log, verbatim with {{DATE}} filled: the header names the guard,
      and a new amendment_log entry (newest first). No mission, NS.n, partial_order or semantics line changes, so the
      build PR needs no marker.
  - file: config/agent/executor/capabilities.yaml
    action: Modify
    purpose: >-
      Sidecar block boundary-rows verbatim: the Tier A block's comment names the amendment guard and gains
      scripts/checks/contracts/validate_tier_a_amendment_guard and tests/checks/contracts/test_validate_tier_a_amendment_guard;
      a new block "Shared marker-authorization mechanism ..." holds scripts/checks/_marker_guard.py and
      tests/checks/test__marker_guard (a substring, so both marker-guard test files).
  - file: .github/CODEOWNERS
    action: Modify
    purpose: >-
      Sidecar block codeowners-rows verbatim, appended after the last row: north-star.yaml, the guard and its test,
      scripts/checks/_marker_guard.py and tests/checks/test__marker_guard*.py, marked "Procedural until rec-2827" like
      the sensitive-value rows (agent PRs are authored as the sole code owner, terraform/github/repo.tf).
  - file: docs/ROADMAP-PLATFORM.yaml
    action: Modify
    purpose: >-
      /implement's bookkeeping walk, on the verified VP pass: T4.36 c3 status met with met_by: tier-a-amendment-guard,
      and T4.36 files_in_scope gains scripts/checks/contracts/validate_tier_a_amendment_guard.py.
  - file: docs/plans/approved/tier-a-amendment-guard.yaml
    action: Create
    purpose: The approved-text sidecar (git-ops.yaml approved_text_binding), merged with this plan; the build never edits it.
  - file: docs/plans/PLAN-tier-a-amendment-guard.yaml
    action: Create
    purpose: This plan artefact.
bundled_recommendations:
  - rec-3959
  - rec-3736
followon_recs: []
infrastructure_dependencies: []
acceptance_criteria:
  - >-
    T4.36:c3 -- validate_tier_a_amendment_guard is registered ungated in --pre and the full tier and fails an edited,
    added or retired mission, NS.n, partial_order or semantics unless the key's own lines carry one
    tier-a-amendment-approved marker whose reason has an approval pointer, citing a Decision whose text added in the
    change names the key exactly (for the mission or an NS.n, a Decision in its carried_by), with a new amendment_log
    row naming the key; a removed entry always fails; comment, amendment_log and reflow edits are free; the real tree
    passes. VP 4, 5, 6, 7.
  - >-
    rec-3959 -- its acceptance node passes at the moved path (file and acceptance re-pointed by update_rec at plan
    time). VP 5.
  - >-
    The shared module gains fresh_mention, boundary_match and transition_label with defaults that keep every incumbent
    binding's behaviour, and its exports are unchanged; the incumbent bindings' suites pass unchanged. VP 2, 8.
  - rec-3736 -- check_state_diff and check_present_markers honour reason_required. VP 3.
  - >-
    marker-grammar.yaml, north-star.yaml, capabilities.yaml and CODEOWNERS carry the sidecar text verbatim; T4.36 c3
    is met. VP 6, 9, 10.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: Precondition -- the plan and its sidecar are on origin/main and the branch contains origin/main.
    command: >-
      git fetch origin main --quiet && git cat-file -e origin/main:docs/plans/PLAN-tier-a-amendment-guard.yaml && git
      cat-file -e origin/main:docs/plans/approved/tier-a-amendment-guard.yaml && git merge-base --is-ancestor origin/main
      HEAD && echo PRECONDITION_OK
    expected: Prints PRECONDITION_OK.
    fix_if: >-
      A missing file means the plan PR has not merged: stop (the build must never carry the sidecar). A failing
      ancestry test means the branch is stale: merge origin/main first.
    hermetic: false
    graduation: not-applicable
  - step: 2
    phase: pre-deploy
    action: The shared options' suite (boundary match, fresh mention, transition label).
    command: bin/venv-python -m pytest -q tests/checks/test__marker_guard_state_options.py
    expected: Exit 0, every node passes. Red before -- the file does not exist (pytest exit 4).
    expected_literals:
      - passed
    fix_if: Fix _marker_guard.py, never the assertion.
    hermetic: true
    graduation: graduate
    graduation_check_id: marker-guard-state-options
  - step: 3
    phase: pre-deploy
    action: rec-3736's acceptance node (re-pointed by update_rec at plan time).
    command: bin/venv-python -m pytest -q tests/checks/test__marker_guard_state_options.py::TestReasonRequired
    expected: Exit 0, every node passes. Red before -- the file does not exist (pytest exit 4).
    expected_literals:
      - passed
    fix_if: Fix check_state_diff or check_present_markers, never the assertion.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      rec-3736's filed acceptance command, which ci.yml's trailer-acceptance job runs at the squash merge; VP 2's
      graduated shard already runs the same class.
  - step: 4
    phase: pre-deploy
    action: The guard's mirror suite.
    command: bin/venv-python -m pytest -q tests/checks/contracts/test_validate_tier_a_amendment_guard.py
    expected: Exit 0, every node passes. Red before -- the file does not exist (pytest exit 4).
    expected_literals:
      - passed
    fix_if: Fix the guard, never the assertion or the fixture.
    hermetic: true
    graduation: graduate
    graduation_check_id: tier-a-amendment-guard-rules
  - step: 5
    phase: pre-deploy
    action: rec-3959's acceptance node (re-pointed by update_rec at plan time).
    command: >-
      bin/venv-python -m pytest tests/checks/contracts/test_validate_tier_a_amendment_guard.py::test_authorization_shaped_binds_marker_guard_at_check_name_level
      -q
    expected: Exit 0, one node passes. Red before -- the file does not exist (pytest exit 4).
    expected_literals:
      - 1 passed
    fix_if: Fix the guard, never the assertion.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      rec-3959's filed acceptance command, which ci.yml's trailer-acceptance job runs at the squash merge; VP 4's
      graduated shard runs the same node.
  - step: 6
    phase: pre-deploy
    action: >-
      The real tree passes the guard, validate_north_star, validate_marker_grammar_exports and validate_ci_rca_taxonomy,
      and the guard is sequenced in both tiers.
    command: >-
      bin/venv-python -c "from scripts.checks import registry; from scripts.checks.contracts.validate_tier_a_amendment_guard
      import validate_tier_a_amendment_guard as g; from scripts.checks.contracts.validate_north_star import
      validate_north_star as n; from scripts.checks.contracts.validate_marker_grammar_exports import
      validate_marker_grammar_exports as m; from scripts.checks.ci_guards.validate_ci_rca_taxonomy import
      validate_ci_rca_taxonomy as x; f=[]; g(f); n(f); m(f); x(f); assert not f, f; name='validate_tier_a_amendment_guard';
      assert name in [s.name for s in registry.pre_sequence()] and name in [s.name for s in registry.full_sequence()];
      print('GUARD_OK')"
    expected: Exit 0 and prints GUARD_OK. Red before -- the module does not exist (exit 1).
    fix_if: >-
      An OWNERSHIP finding means a capabilities.yaml or CODEOWNERS row is missing; a PARSE or DIFF finding on the real tree means the
      guard misreads the sidecar edits (header comment and amendment_log must be free); a missing sequence name means
      the manifest Entry is absent or gated.
    hermetic: false
    graduation: not-applicable
  - step: 7
    phase: pre-deploy
    action: >-
      End to end in a scratch worktree of HEAD with the real git base. One NS.4 change (a detail edit, the probe
      Decision added to its carried_by, an amendment_log row naming NS.4) is written three ways: unmarked fails; a
      marker citing Decision 86 (in carried_by, whose base body names NS.4) fails as spent; a marker citing the probe
      Decision added in the change passes.
    command: >-
      T=$(mktemp -d)/t && git worktree add -q --detach "$T" HEAD && ln -s "$PWD/.venv" "$T/.venv" && (cd "$T" &&
      bin/venv-python -c "import re, pathlib; from scripts.checks.contracts.validate_tier_a_amendment_guard import
      validate_tier_a_amendment_guard as v; d=pathlib.Path('docs/DECISIONS.md'); dt=d.read_text(encoding='utf-8');
      n=max(int(x) for x in re.findall(r'^## Decision (\d+):', dt, re.M))+1; d.write_text(dt.replace('# Decisions\n',
      '# Decisions\n\n## Decision %d: Probe amends NS.4 (Decided)\n\nProbe body naming NS.4.\n\n---\n' % n, 1),
      encoding='utf-8'); p=pathlib.Path('docs/contracts/north-star.yaml'); t=p.read_text(encoding='utf-8');
      t2=t.replace('Why: maintaining anything', 'Why: probe. Maintaining anything', 1).replace('carried_by: [86, 127,
      128, 211]', 'carried_by: [86, 127, 128, 211, %d]' % n, 1).replace('amendment_log:\n', 'amendment_log:\n  - date:
      \"2026-11-03\"\n    semantic_break: false\n    change_class: prose_improvement\n    summary: \"probe NS.4\"\n', 1);
      assert 'Why: probe.' in t2 and ', %d]' % n in t2 and 'probe NS.4' in t2; tag=lambda k: t2.replace('  - id:
      NS.4\n', '  - id: NS.4  # tier-a-amendment-approved: dec-%s probe; approval: probe-ref 2026-11-03\n' % k, 1);
      runs=[]; [(p.write_text(x, encoding='utf-8'), runs.append(v(f := []) or bool(f))) for x in (t2, tag(86),
      tag(n))]; assert runs == [True, True, False], runs; print('E2E_OK')"); rc=$?; git worktree remove --force "$T";
      exit $rc
    expected: Exit 0 and prints E2E_OK (unmarked fails, spent fails, fresh passes).
    fix_if: >-
      [False, ...] means an unmarked change passed: the DIFF leg does not run or the state ignores detail. A second
      True-to-False mismatch means freshness is not applied in the diff leg. A third True means the new Decision is
      not read from the working tree, the base resolves to HEAD (check status_diff_base and the cat-file reader), or
      the CARRIED, POINTER or LOG leg misreads the probe (print f to see which).
    hermetic: false
    graduation: not-applicable
  - step: 8
    phase: pre-deploy
    action: The incumbent bindings' suites and validate_north_star's suite pass unchanged (500 nodes passed on main 0b5e5327 for the first thirteen paths).
    command: >-
      bin/venv-python -m pytest -q tests/checks/test__marker_guard.py tests/checks/verification/test_validate_tier_demotion_markers.py
      tests/checks/ci_guards/test_validate_schedule_removal_markers.py tests/checks/misc/test_sensitive_value_detectors.py
      tests/checks/sloc/test_validate_sloc_budget_raises.py tests/checks/prose/test_prose_budget_raises.py
      tests/checks/structural/test_budget_raises.py tests/checks/misc/test_coverage_baseline.py
      tests/checks/typing/test_mypy_baseline.py tests/checks/deps/validate_pre_glob_closure tests/checks/contracts/test__ratchet.py
      tests/checks/ci_guards/test_validate_composite_action_shell_bodies.py tests/checks/ci_guards/test__workflow_shell_bodies.py
      tests/checks/contracts/test_validate_north_star.py tests/checks/contracts/test_validate_marker_grammar_exports.py
    expected: Exit 0; every node passes and none fails (the count is not pinned).
    fix_if: A failure means a default changed an incumbent's behaviour; fix _marker_guard.py, never an incumbent test.
    hermetic: false
    graduation: not-applicable
  - step: 9
    phase: pre-deploy
    action: The contract words equal the approved sidecar, read at the base.
    command: bin/venv-python -m scripts.roadmap.approved_text verify --slug tier-a-amendment-guard --base origin/main
    expected: Exit 0.
    fix_if: Restore the sidecar's words exactly (only {{DATE}} may vary); any other wording needs Benjamin's new approval.
    hermetic: false
    graduation: not-applicable
  - step: 10
    phase: pre-deploy
    action: The roadmap bookkeeping walk landed.
    command: >-
      bin/venv-python -c "import yaml; d=yaml.safe_load(open('docs/ROADMAP-PLATFORM.yaml', encoding='utf-8')); t=[x for
      x in d['tier_items'] if x['id']=='T4.36'][0]; c=[x for x in t['exit_criteria'] if x['id']=='c3'][0]; assert
      c['status']=='met' and c['met_by']=='tier-a-amendment-guard', c; assert
      'scripts/checks/contracts/validate_tier_a_amendment_guard.py' in t['files_in_scope']; print('ROADMAP_OK')"
    expected: Exit 0 and prints ROADMAP_OK.
    fix_if: Apply the bookkeeping walk (docs/contracts/tier-item-lifecycle.yaml bookkeeping_walk).
    hermetic: false
    graduation: not-applicable
  - step: 11
    phase: pre-deploy
    action: Lint and format the changed Python files.
    command: >-
      bin/venv-python -m ruff check scripts/checks/_marker_guard.py scripts/checks/contracts/validate_tier_a_amendment_guard.py
      scripts/checks/contracts/_manifest.py tests/checks/test__marker_guard_state_options.py
      tests/checks/contracts/test_validate_tier_a_amendment_guard.py && bin/venv-python -m ruff format --check
