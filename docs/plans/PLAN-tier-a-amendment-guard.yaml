acceptance_criteria:
  - >-
    T4.36:c3 -- validate_tier_a_amendment_guard is registered ungated in --pre and the full tier and fails an edited,
    added or retired mission, NS.n, partial_order or semantics unless the key's own lines carry one
    tier-a-amendment-approved marker whose reason has an approval pointer, citing a Decision whose text added in the
    change names the key exactly (for the mission or an NS.n, a Decision in its carried_by; for partial_order or
    semantics, a dated note on the Decision ratified_via names at the base, a second change taking two PRs), with a new
    amendment_log row naming the key; a removed entry always fails; header and contract-block comments, amendment_log
    rows and reflows are free, while any other text inside an entry's span, a comment
    included, is a change and a marker is never added or reworded alone; the real tree passes. VP 4, 5, 6, 7.
  - >-
    rec-3959 -- its acceptance node passes at the moved path (file and acceptance re-pointed by update_rec at plan time; read
    back with fetch_recs_by_ids 2026-11-03, both open, acceptance equal to VP 5 and VP 3). VP 5.
  - >-
    The shared module gains fresh_mention, boundary_match and transition_label with defaults that keep every incumbent
    binding's behaviour, and its exports are unchanged; the incumbent bindings' suites pass unchanged. VP 2, 8.
  - rec-3736 -- check_state_diff and check_present_markers honour reason_required. VP 3.
  - >-
    marker-grammar.yaml, north-star.yaml, capabilities.yaml and CODEOWNERS carry the sidecar text verbatim; T4.36 c3 is
    met and its graduated shard reads it. VP 6, 9, 10.
