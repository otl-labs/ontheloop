schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: tier-a-amendment-guard
intent: >-
  Make Decision 243 cl.6 and Decision 196 cl.3 mechanical: a registered check refuses any change to a Tier A entry of
  docs/contracts/north-star.yaml (the mission, an NS.n, the partial order, the semantics block) unless the key carries
  a marker citing a Decision whose text, added in the same change, names it, so direction changes only through new
  human-approved text (NS.8, NS.9). It binds the shared marker mechanism as a new kind, never a copy (Decision 165,
  Decision 187 cl.7), and is the record floor under the human gate, not the gate (NS.9).
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-tier-a-amendment-guard.yaml
phase: >-
  T4.36 (in_progress; follow-on plan mode). Closes c3 only; c1-c2 are met by north-star-tier-a, c4-c7 belong to the
  grammar, scout-lane, orient and journal plans.
closes_criteria:
  - T4.36:c3
scope:
  - file: scripts/checks/_marker_guard.py
    action: Modify
    purpose: >-
      Three opt-in RegistrySpec fields appended after gates_deletion, each documented in the class docstring, with
      defaults that leave every incumbent binding's behaviour unchanged: fresh_mention (bool, False), boundary_match
      (bool, False), transition_label (str, "weakening"). (1) boundary_match: _mentions_any gains a keyword `bounded`;
      when True a candidate matches only where no character of [A-Za-z0-9_-] sits immediately before or after it
      (re.escape per candidate); authorization_failure gains a keyword-only `bounded: bool = False` passed to both of
      its _mentions_any calls (the direct body and the one supersession hop), and all three callers (check_diff,
      check_state_diff and check_present_markers) pass bounded=spec.boundary_match, False by default so incumbents are
      unchanged. (2) fresh_mention, in check_state_diff only: read docs/DECISIONS.md and docs/DECISIONS_ARCHIVE.md once
      through the same base_reader (None from either prints the loud SKIP line and returns [], as the unreachable-base
      branch does; "" for docs/DECISIONS.md is a violation, "Decision corpus absent at the base", never an empty corpus;
      "" for the archive is an empty archive), parse them with a private _bodies_from_text(text) helper extracted from
      load_decision_bodies' loop (load_decision_bodies then calls it; its output is unchanged). After a gated
      transition's marker passes the stale-marker rule and head authorization, it is fresh only when the cited
      Decision's base body lines (absent number: none) form an in-order subsequence of its head body lines (a greedy
      left-to-right match; a base line missing or out of order is a rewrite, Decision 177) and the head lines the match
      leaves over, the added text, name a candidate (the same candidate list and `bounded` flag authorization uses; no
      supersession hop). Otherwise append "<key>: <token> marker cites <dec>, but no text added to it in this change
      names this entry (a mention the base already carried is spent; an in-place rewrite never authorizes)."
      check_present_markers never applies freshness (scout NOTE 165). (3) transition_label replaces the literal word
      "weakening" in check_state_diff's unauthorized-transition message (the one message that carries it). (4) rec-3736,
      landed as its own commit with TestReasonRequired before the options and the guard (Benjamin's "Commit"): when
      spec.reason_required is True, check_state_diff and check_present_markers treat a marker whose reason is None or
      blank as no marker, and the RegistrySpec reason_required docstring ("The actual gate is enforced by the
      extractor") is rewritten to say the shared helpers honour it on state-shaped specs too. check_diff gains only that
      bounded pass-through and __all__ is unchanged (rec-3027 stays out of scope; validate_marker_grammar_exports stays
      green). The RegistrySpec docstring names the helpers that honour each field: boundary_match all three;
      fresh_mention and transition_label check_state_diff only; reason_required check_state_diff and
      check_present_markers. Measured 410 of 500 SLOC; the change is about 45 lines. If the build measures it past 500,
      stop and raise a plan amendment (Decision 128 decomposition), never a budget raise.
    new_imports: []
  - file: tests/checks/test__marker_guard_state_options.py
    action: Create
    purpose: >-
      The options' tests, beside tests/checks/test__marker_guard.py (498 of 500 SLOC, so not extended). Fixture corpora
      under tmp_path with _common.ROOT monkeypatched and _marker_guard._decision_bodies_cache cleared per test, and an
      in-memory base_reader dict ({rel_path: text}, "" for absent). TestBoundaryMatch: NS.1 not named by a body saying
      only NS.10 or only the range NS.1-NS.9 (nor NS.9 by it); mission not named by permission or mission-critical; NS.1
      named by "(NS.1)", "NS.1," and end of body; with the default False a substring still authorizes (incumbent
      behaviour pinned); the NS.10-only body leaves a present NS.1 marker unauthorized through check_present_markers,
      and a check_diff spec with boundary_match honours it too. TestFreshMention: a Decision absent at base naming the
      key authorizes; a dated note appended to an existing body naming the key authorizes, even when the base body
      already named it (the note is added text); a body that named the key at base does not (spent) when the change adds
      no text naming it; a body whose base line is rewritten or reordered does not, even when the new text names the
      key; an interleaved pure insertion (base A,B,C,D,E; head B,C,D,A,x1,B,x2,C,x3,D,x4,E with x2 naming the key)
      authorizes; a None corpus read skips loudly with []; a "" DECISIONS.md at a reachable base is a violation;
      check_present_markers on the same spec ignores freshness; default False keeps head-only authorization.
      TestTransitionLabel: the label replaces "weakening" in the message; the default is "weakening". TestReasonRequired
      (rec-3736's new acceptance): a reasonless head marker on a reason_required spec is no marker in check_state_diff
      and is skipped by check_present_markers; with reason_required False it still counts.
  - file: scripts/checks/contracts/validate_tier_a_amendment_guard.py
    action: Create
    purpose: >-
      Registered check validate_tier_a_amendment_guard(failed, root=None), owner="platform". TOKEN =
      "tier-a-amendment-approved"; _REL = "docs/contracts/north-star.yaml". (a) Base: _common.status_diff_base(root)
      (Decision 159); None prints a SKIP line, calls registry.skipped and skips the diff legs, and skipped() is the
      run's final accounting call (Decision 170: the last call wins, so examined() never follows it). One `git cat-file
      --batch` at that base for _REL, docs/DECISIONS.md, docs/DECISIONS_ARCHIVE.md, this module, .github/CODEOWNERS and
      config/agent/executor/capabilities.yaml (the schedule-removal reader shape: blob text, "" for a missing path, None
      when the subprocess fails, which skips loudly). (b) Keys: mission, partial_order, semantics and every
      principles[].id at base or head. State per key: json.dumps({"value": the raw parsed node, "comments": the span's
      comments}, sort_keys=True, default=str), None when absent; parsed with a yaml.SafeLoader subclass that refuses
      duplicate keys (the scripts/session/rebase_resolve._duplicate_key_loader shape, not the Pydantic model, so a shape
      defect still compares). A duplicate key or any YAML error at head is a PARSE violation (fail closed): PyYAML's
      last-wins would otherwise let a shadowed line change the text agents read with no state change. At the base it is
      a loud SKIP of the diff legs, as for an unreachable base (skipped() stays the final accounting call), so the
      forward fix of a broken main can land (Decision 226; every other PR stays red on its head, and
      validate_north_star._base_ids also skips an unparseable base). "comments" lists, in order, every YAML comment
      inside the key's span other than a tier-a-amendment-approved marker: the text from a "#" at line start or after
      whitespace that lies outside every scalar node's start_mark..end_mark range from yaml.compose (a "#" inside a
      block or quoted scalar is content). So a comment added or edited inside an entry is a change; the header comment,
      the contract block and amendment_log lie outside every span and stay free, as does a reflow that leaves the parsed
      value equal. (c) Spans from yaml.compose marks: mission, partial_order and semantics from their key line to the
      line before the next top-level key; each principles item from its dash line to the line before the next item or
      the end of the sequence. Marker regex `#\s*tier-a-amendment-approved:\s*dec-(\d+)\s*(.*)$`; a blank reason is no
      marker; more than one marker on one span is a SPAN violation ("replace the old marker, never add a second"). (d)
      REMOVED leg: a key present at base and absent at head fails with "removed -- retire by status: retired with a
      marker; removal has no marker escape"; removed keys are left out of the spec so they are not reported twice. (e)
      DIFF leg, skipped when the head text equals the base text byte for byte (Decision 182):
      _marker_guard.check_state_diff over one RegistrySpec whose state_extractor always emits every key in the universe
      (absent = None, the schedule-removal precedent), weakened = base != head, gates_deletion always True,
      mention_candidates = lambda k: [k], reason_required=True, fresh_mention=True, boundary_match=True,
      transition_label="change". (f) RETRO leg: check_present_markers on the same spec, every run. (g) CARRIED leg, diff
      only, for each key whose state changed and is present at head: the head marker on its span cites a Decision number
      in that entry's head carried_by (mission, NS.n: "<key>: marker cites <dec>, which is not in its carried_by; a
      Decision that changes an entry carries it -- add it in the same change"), or the Decision that
      contract.ratified_via names at the diff base (partial_order, semantics; parsed with validate_north_star's own
      `Decision (\d+)` rule: "<key>: marker cites <dec>, not the ratifying Decision <n>; record the change as a dated
      note on it"). Diff-time only, so a later ratified_via or carried_by edit never reddens a persisted marker, and
      reading ratified_via at the base keeps a same-change contract-block edit from moving the authorizer (Decision 187
      cl.1). A later change can never cite the base marker's own Decision (state_diff_mechanics (3)): an entry cites
      another of its carriers, while partial_order and semantics, which have one authorizer, take two PRs, one removing
      the old marker (free: a marker is not state), then the change with a fresh dated note and a new marker; the guard
      appends that path to check_state_diff's violation when the head marker repeats the base marker's Decision. (h)
      POINTER leg, every run: every present marker's reason matches `approval:\s+\S+\s+\d{4}-\d{2}-\d{2}` ("<key>:
      marker reason carries no `approval: <ref> <YYYY-MM-DD>` pointer"); presence and shape only. (i) LOG leg, diff
      only: each key whose state changed and is present at head needs a new amendment_log row whose
      json.dumps(sort_keys=True, default=str) text names the key under the boundary rule ("<key>: changed with no new
      amendment_log row naming it"). New rows are the head rows beyond the base multiset (collections.Counter of those
      texts), counted only when every base row survives unchanged, so an edited old row is never a new row. (j)
      OWNERSHIP leg: each path of PROTECTED (the guard module and its test, scripts/checks/_marker_guard.py,
      tests/checks/test__marker_guard.py, tests/checks/test__marker_guard_state_options.py and
      docs/contracts/north-star.yaml) is code-owned in .github/CODEOWNERS and covered by a
      config/agent/executor/capabilities.yaml boundary_patterns entry at head, and, diff only, no PROTECTED path,
      CODEOWNERS line or boundary_patterns entry that covered one at the base is dropped (Decision 187 cl.1): both by
      calling scripts/checks/misc/sensitive_value_detectors' public ownership_violations and narrowing_violations, never
      a copy; the constant is named PROTECTED because base_protected parses that name. Estimate about 250 SLOC; past
      500, stop and raise a plan amendment (Decision 128), never a budget raise. registry.examined(<keys in the
      universe>, unit="tier_a_entries"). Failure label "Tier A amendment guard". The module docstring names Decision 243
      cl.6, Decision 196 cl.3 and marker-grammar.yaml's token row, and restates no mechanics.
    new_imports:
      - scripts.checks._marker_guard
      - scripts.checks.misc.sensitive_value_detectors
  - file: tests/checks/contracts/test_validate_tier_a_amendment_guard.py
    action: Create
    purpose: >-
      Mirror tests in a temporary git repository (the tests/checks/contracts/test_validate_north_star.py pattern: the
      real north-star.yaml copied, a fixture DECISIONS.md with Decision 243 and a Decision 86 body naming NS.4 (86 is in
      NS.4's carried_by), the capabilities and CODEOWNERS rows), committed as main with origin/main pointing at it, then
      head edits in the working tree. Unless a node says otherwise, an authorized change also adds the citing Decision
      to carried_by, a reason with an approval pointer and an amendment_log row naming the key, so each node fails for
      one cause. Every node clears _marker_guard._decision_bodies_cache before each guard run (load_decision_bodies
      caches per _common.ROOT, and base and head runs share the process). Nodes:
      test_authorization_shaped_binds_marker_guard_at_check_name_level (rec-3959's acceptance: an NS.4 detail edit with
      a marker citing a new Decision naming NS.4 passes; the same marker citing a new Decision naming only NS.40, the
      range NS.1-NS.9, scripts/checks or the file path fails; a spy on _marker_guard.check_state_diff proves the
      binding); test_unmarked_change_fails; test_spent_mention_fails (cites 86); test_appended_note_authorizes (a dated
      note on 86); test_in_place_rewrite_never_authorizes; test_addition_needs_a_fresh_marker (NS.10);
      test_retirement_needs_a_fresh_marker; test_removal_has_no_marker_escape;
      test_mission_partial_order_and_semantics_are_gated; test_cited_decision_outside_carried_by_fails;
      test_block_keys_need_a_dated_note_on_the_ratifying_decision (a semantics edit citing a fresh note on another
      Decision that says "field semantics" fails; a fresh dated note on 243 naming semantics passes);
      test_ratified_via_is_read_at_the_base; test_ratified_via_edit_does_not_red_persisted_markers;
      test_second_change_to_a_block_key_takes_two_prs (same-PR re-cite of 243 fails with the two-PR hint; marker removal
      alone passes; the next change with a fresh note passes); test_duplicate_key_fails_closed;
      test_unquoted_date_does_not_crash; test_comment_inside_an_entry_is_a_change;
      test_hash_inside_a_block_scalar_is_content; test_edited_log_row_is_not_a_new_row;
      test_marker_without_approval_pointer_fails; test_change_without_a_log_row_naming_the_key_fails;
      test_marker_on_another_entry_does_not_authorize; test_two_markers_on_one_entry_fail;
      test_reasonless_marker_is_no_marker; test_header_comment_amendment_log_and_reflow_are_free;
      test_unchanged_file_runs_only_the_retroactive_leg; test_retroactive_scan_flags_an_unauthorized_present_marker;
      test_push_to_main_rechecks_the_merged_commit (GITHUB_EVENT_NAME=push, HEAD~1 base);
      test_no_diff_base_skips_loudly_and_records_a_skip (skipped() is the final accounting call);
      test_head_parse_failure_fails_closed; test_unparseable_base_skips_the_diff_legs_loudly;
      test_ownership_rows_required (a missing CODEOWNERS row and a missing boundary_patterns row each fail);
      test_narrowing_protected_with_its_rows_fails (one change drops a PROTECTED path and its CODEOWNERS row);
      test_registered_ungated_in_both_tiers; test_real_tree_is_clean. Size: precedents measure 32 nodes in 244 SLOC
      (schedule-removal) and 46 in 497 (tier-demotion), so about 36 nodes lands near 350; past 500, stop and raise a
      plan amendment, since CODEOWNERS names this exact path and a split file needs newly approved text (Decision 128).
  - file: scripts/checks/contracts/_manifest.py
    action: Modify
    purpose: >-
      One Entry for validate_tier_a_amendment_guard after validate_north_star: pre=True, pre_globs left unset (ungated,
      with a one-line comment: a glob-gated guard is one glob edit from not running on the diff that edits it,
      Decision 187 cl.6), full_segment="full_after_lint".
  - file: config/ci_rca_taxonomy.yaml
    action: Modify
    purpose: >-
      Row "validate_tier_a_amendment_guard: code_regression" after validate_north_star's (the marker-guard rows'
      category). NEAR_CAP relief step: measure effective lines against main at build time (487 of 500 on caebb40f, and
      eight unbuilt plans also add rows); if the row would cross 500, apply the config class relief valve (compact
      resolved or duplicate rows, every mapping preserved) or stop in amendment mode; never a budget raise.
  - file: docs/contracts/marker-grammar.yaml
    action: Modify
    purpose: >-
      Sidecar blocks grammar-log, grammar-token and grammar-mechanics of docs/plans/approved/tier-a-amendment-guard.yaml,
      verbatim with {{DATE}} filled with the build date: a new amendment_log entry (newest first), the
      tier-a-amendment-approved token row after detector-loosening-approved, and state_diff_mechanics points (5)-(8).
  - file: docs/contracts/north-star.yaml
    action: Modify
    purpose: >-
      Sidecar blocks north-star-header and north-star-log, verbatim with {{DATE}} filled: the header names the guard,
      and a new amendment_log entry (newest first). No mission, NS.n, partial_order or semantics line changes, so the
      build PR needs no marker.
  - file: config/agent/executor/capabilities.yaml
    action: Modify
    purpose: >-
      Sidecar block boundary-rows verbatim: the Tier A block's comment names the amendment guard and gains
      scripts/checks/contracts/validate_tier_a_amendment_guard and tests/checks/contracts/test_validate_tier_a_amendment_guard;
      a new block "Shared marker-authorization mechanism ..." holds scripts/checks/_marker_guard.py and
      tests/checks/test__marker_guard (a substring, so both marker-guard test files).
  - file: .github/CODEOWNERS
    action: Modify
    purpose: >-
      Sidecar block codeowners-rows verbatim, appended after the last row: north-star.yaml, the guard and its test,
      scripts/checks/_marker_guard.py and tests/checks/test__marker_guard*.py, marked "Procedural until rec-2827" like
      the sensitive-value rows (agent PRs are authored as the sole code owner, terraform/github/repo.tf).
  - file: docs/ROADMAP-PLATFORM.yaml
    action: Modify
    purpose: >-
      /implement's bookkeeping walk, on the verified VP pass: T4.36 c3 status met with met_by: tier-a-amendment-guard,
      and T4.36 files_in_scope gains scripts/checks/contracts/validate_tier_a_amendment_guard.py.
  - file: docs/plans/approved/tier-a-amendment-guard.yaml
    action: Create
    purpose: The approved-text sidecar (git-ops.yaml approved_text_binding), merged with this plan; the build never edits it.
  - file: docs/plans/PLAN-tier-a-amendment-guard.yaml
    action: Create
    purpose: This plan artefact.
bundled_recommendations:
  - rec-3959
  - rec-3736
followon_recs:
  - rec-4868
infrastructure_dependencies: []
acceptance_criteria:
  - >-
    T4.36:c3 -- validate_tier_a_amendment_guard is registered ungated in --pre and the full tier and fails an edited,
    added or retired mission, NS.n, partial_order or semantics unless the key's own lines carry one
    tier-a-amendment-approved marker whose reason has an approval pointer, citing a Decision whose text added in the
    change names the key exactly (for the mission or an NS.n, a Decision in its carried_by), with a new amendment_log
    row naming the key; a removed entry always fails; header and contract-block comments, amendment_log rows and reflows are
    free, while a comment inside an entry's span is a change; the real tree passes. VP 4, 5, 6, 7.
  - >-
    rec-3959 -- its acceptance node passes at the moved path (file and acceptance re-pointed by update_rec at plan
    time). VP 5.
  - >-
    The shared module gains fresh_mention, boundary_match and transition_label with defaults that keep every incumbent
    binding's behaviour, and its exports are unchanged; the incumbent bindings' suites pass unchanged. VP 2, 8.
  - rec-3736 -- check_state_diff and check_present_markers honour reason_required. VP 3.
  - >-
    marker-grammar.yaml, north-star.yaml, capabilities.yaml and CODEOWNERS carry the sidecar text verbatim; T4.36 c3
    is met. VP 6, 9, 10.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: Precondition -- the plan and its sidecar are on origin/main and the branch contains origin/main.
    command: >-
      git fetch origin main --quiet && git cat-file -e origin/main:docs/plans/PLAN-tier-a-amendment-guard.yaml && git
      cat-file -e origin/main:docs/plans/approved/tier-a-amendment-guard.yaml && git merge-base --is-ancestor origin/main
      HEAD && echo PRECONDITION_OK
    expected: Prints PRECONDITION_OK.
    fix_if: >-
      A missing file means the plan PR has not merged: stop (the build must never carry the sidecar). A failing
      ancestry test means the branch is stale: merge origin/main first.
    hermetic: false
    graduation: not-applicable
  - step: 2
    phase: pre-deploy
    action: The shared options' suite (boundary match, fresh mention, transition label).
    command: bin/venv-python -m pytest -q tests/checks/test__marker_guard_state_options.py
    expected: Exit 0, every node passes. Red before -- the file does not exist (pytest exit 4).
    expected_literals:
      - passed
    fix_if: Fix _marker_guard.py, never the assertion.
    hermetic: true
    graduation: graduate
    graduation_check_id: marker-guard-state-options
  - step: 3
    phase: pre-deploy
    action: rec-3736's acceptance node (re-pointed by update_rec at plan time).
    command: bin/venv-python -m pytest -q tests/checks/test__marker_guard_state_options.py::TestReasonRequired
    expected: Exit 0, every node passes. Red before -- the file does not exist (pytest exit 4).
    expected_literals:
      - passed
    fix_if: Fix check_state_diff or check_present_markers, never the assertion.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      rec-3736's filed acceptance command, which ci.yml's trailer-acceptance job runs at the squash merge; VP 2's
      graduated shard already runs the same class.
  - step: 4
    phase: pre-deploy
    action: The guard's mirror suite.
    command: bin/venv-python -m pytest -q tests/checks/contracts/test_validate_tier_a_amendment_guard.py
    expected: Exit 0, every node passes. Red before -- the file does not exist (pytest exit 4).
    expected_literals:
      - passed
    fix_if: Fix the guard, never the assertion or the fixture.
    hermetic: true
    graduation: graduate
    graduation_check_id: tier-a-amendment-guard-rules
  - step: 5
    phase: pre-deploy
    action: rec-3959's acceptance node (re-pointed by update_rec at plan time).
    command: >-
      bin/venv-python -m pytest
      tests/checks/contracts/test_validate_tier_a_amendment_guard.py::test_authorization_shaped_binds_marker_guard_at_check_name_level
      -q
    expected: Exit 0, one node passes. Red before -- the file does not exist (pytest exit 4).
    expected_literals:
      - 1 passed
    fix_if: Fix the guard, never the assertion.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      rec-3959's filed acceptance command, which ci.yml's trailer-acceptance job runs at the squash merge; VP 4's
      graduated shard runs the same node.
  - step: 6
    phase: pre-deploy
    action: >-
      The real tree passes the guard, validate_north_star, validate_marker_grammar_exports and validate_ci_rca_taxonomy,
      and the guard is sequenced in both tiers.
    command: >-
      bin/venv-python -c "from scripts.checks import registry; from scripts.checks.contracts.validate_tier_a_amendment_guard
      import validate_tier_a_amendment_guard as g; from scripts.checks.contracts.validate_north_star import
      validate_north_star as n; from scripts.checks.contracts.validate_marker_grammar_exports import
      validate_marker_grammar_exports as m; from scripts.checks.ci_guards.validate_ci_rca_taxonomy import
      validate_ci_rca_taxonomy as x; f=[]; g(f); n(f); m(f); x(f); assert not f, f; name='validate_tier_a_amendment_guard';
      assert name in [s.name for s in registry.pre_sequence()] and name in [s.name for s in registry.full_sequence()];
      print('GUARD_OK')"
    expected: Exit 0 and prints GUARD_OK. Red before -- the module does not exist (exit 1).
    fix_if: >-
      An OWNERSHIP finding means a capabilities.yaml or CODEOWNERS row is missing; a PARSE or DIFF finding on the real
      tree means the guard misreads the sidecar edits (header comment and amendment_log must be free); a missing
      sequence name means the manifest Entry is absent or gated.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      Reads the live tree and the registry sequences, which VP 4's graduated shard pins in its own nodes
      (test_real_tree_is_clean, test_registered_ungated_in_both_tiers); the four checks it runs are registered in
      every tier.
  - step: 7
    phase: pre-deploy
    action: >-
      End to end in a scratch worktree of HEAD (the committed build) with the real git base. One NS.4 change (a detail
      edit, the probe Decision added to its carried_by, an amendment_log row naming NS.4) is written three ways:
      unmarked fails; a marker citing Decision 86 (in carried_by, whose base body names NS.4) fails as spent; a marker
      citing the probe Decision added in the change passes.
    command: >-
      T=$(mktemp -d)/t && git worktree add -q --detach "$T" HEAD && ln -s "$PWD/.venv" "$T/.venv" && (cd "$T" &&
      bin/venv-python -c "import re, pathlib; from scripts.checks.contracts.validate_tier_a_amendment_guard import
      validate_tier_a_amendment_guard as v; d=pathlib.Path('docs/DECISIONS.md'); dt=d.read_text(encoding='utf-8');
      n=max(int(x) for x in re.findall(r'^## Decision (\d+):', dt, re.M))+1; d.write_text(dt.replace('# Decisions\n',
      '# Decisions\n\n## Decision %d: Probe amends NS.4 (Decided)\n\nProbe body naming NS.4.\n\n---\n' % n, 1),
      encoding='utf-8'); p=pathlib.Path('docs/contracts/north-star.yaml'); t=p.read_text(encoding='utf-8');
      t2=t.replace('Why: maintaining anything', 'Why: probe. Maintaining anything', 1).replace('carried_by: [86, 127,
      128, 211]', 'carried_by: [86, 127, 128, 211, %d]' % n, 1).replace('amendment_log:\n', 'amendment_log:\n  - date:
      \"2026-11-03\"\n    semantic_break: false\n    change_class: prose_improvement\n    summary: \"probe NS.4\"\n', 1);
      assert 'Why: probe.' in t2 and ', %d]' % n in t2 and 'probe NS.4' in t2; tag=lambda k: t2.replace('  - id:
      NS.4\n', '  - id: NS.4  # tier-a-amendment-approved: dec-%s probe; approval: probe-ref 2026-11-03\n' % k, 1);
      runs=[]; [(p.write_text(x, encoding='utf-8'), runs.append(v(f := []) or bool(f))) for x in (t2, tag(86),
      tag(n))]; assert runs == [True, True, False], runs; print('E2E_OK')"); rc=$?; git worktree remove --force "$T";
      exit $rc
    expected: Exit 0 and prints E2E_OK (unmarked fails, spent fails, fresh passes).
    fix_if: >-
      [False, ...] means an unmarked change passed: the DIFF leg does not run or the state ignores detail. A second
      True-to-False mismatch means freshness is not applied in the diff leg. A third True means the new Decision is
      not read from the working tree, the base resolves to HEAD (check status_diff_base and the cat-file reader), or
      the CARRIED, POINTER or LOG leg misreads the probe (print f to see which). ModuleNotFoundError for
      validate_tier_a_amendment_guard, or a result that ignores a fix, means HEAD lacks the build or the fix: commit it
      (execution steps), then re-run.
