schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: tier-a-amendment-guard
intent: >-
  Make Decision 243 cl.6 and Decision 196 cl.3 mechanical: a registered check refuses any change to a Tier A entry of
  docs/contracts/north-star.yaml (the mission, an NS.n, the partial order, the semantics block) unless the key carries
  a marker citing a Decision whose text, added in the same change, names it, so direction changes only through new
  human-approved text (NS.8, NS.9). It binds the shared marker mechanism as a new kind, never a copy (Decision 165,
  Decision 187 cl.7), and is the record floor under the human gate, not the gate (NS.9).
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-tier-a-amendment-guard.yaml
phase: >-
  T4.36 (in_progress; follow-on plan mode). Closes c3 only; c1-c2 are met by north-star-tier-a, c4-c7 belong to the
  grammar, scout-lane, orient and journal plans.
closes_criteria:
  - T4.36:c3
scope:
  - file: scripts/checks/_marker_guard.py
    action: Modify
    purpose: >-
      Three opt-in RegistrySpec fields appended after gates_deletion, with defaults that leave every incumbent binding's
      behaviour unchanged: fresh_mention (bool, False), boundary_match (bool, False), transition_label (str,
      "weakening"). Every new branch lives in scripts/checks/_marker_guard_state_options.py (next row): this module
      gains only unconditional calls into it, with no new if, loop or early return of its own, so
      tests/checks/test__marker_guard.py, the one suite validate_test_coverage runs for this file (map_source_to_test),
      keeps it at 100% with the fields at their defaults (100.0% today, 55 passed). The calls: _mentions_any delegates
      to the sibling's mentions(body, candidates, bounded); authorization_failure gains a keyword-only `bounded: bool =
      False` for both of its _mentions_any calls (the direct body and the one supersession hop), and all three callers
      (check_diff, check_state_diff, check_present_markers) pass bounded=spec.boundary_match; check_state_diff and
      check_present_markers read every base and head entry's marker through the sibling's effective_marker (rec-3736);
      check_state_diff's existing `if authorization_failure(...)` line becomes one call into the sibling that receives
      the authorization result and returns the transition's failure message or None (the incumbent "does not authorize"
      text unchanged, else the freshness message), so no line is added on the authorized path, which the mirror suite
      never takes (branch 471->444; no new continue or else); and its unauthorized-transition message (the one that
      carries the word) uses spec.transition_label in place of the literal "weakening"; load_decision_bodies keeps its
      output and runs its loop through the sibling's bodies_from_text, so iter_decision_sections leaves this module's
      import for the sibling's (ruff F401; rg finds no caller of _marker_guard.iter_decision_sections), while
      extract_superseded_by keeps the decisions_md import line and the surface comment then names one re-exported name.
      check_diff gains only the bounded pass-through and __all__ is unchanged (rec-3027 stays out of scope;
      validate_marker_grammar_exports stays green). The RegistrySpec docstring gives each new field one terse line
      naming the helpers that honour it (boundary_match all three; fresh_mention and transition_label check_state_diff
      only), and its reason_required line ("The actual gate is enforced by the extractor") now says check_state_diff and
      check_present_markers honour it too. Measured 410 of 500 SLOC; about 20 lines are added.
    new_imports:
      - scripts.checks._marker_guard_state_options
  - file: scripts/checks/_marker_guard_state_options.py
    action: Create
    purpose: >-
      The options' private helpers, measured at 100% through their own mirror,
      tests/checks/test__marker_guard_state_options.py (map_source_to_test). No module-level import of _marker_guard (no
      cycle; annotations under TYPE_CHECKING), so import never raises. (1) mentions(body, candidates, bounded): the
      incumbent substring test, or with bounded a candidate counts only where no character of [A-Za-z0-9_-] sits
      immediately before or after it (re.escape per candidate). (2) effective_marker(spec, entry): None when
      spec.reason_required and the entry's reason is None or blank, on base and head entries alike (so a reasonless base
      marker never makes a head marker stale), else the entry's marker (rec-3736; landed as its own commit with
      TestReasonRequired before the other options and the guard, Benjamin's "Commit"). (3) bodies_from_text(text): the
      load_decision_bodies loop, moved unchanged with its iter_decision_sections import. (4) Freshness, which reads and
      adds nothing unless spec.fresh_mention: docs/DECISIONS.md and docs/DECISIONS_ARCHIVE.md are read once per
      check_state_diff call through its base_reader (None from either prints one loud SKIP line and adds no freshness
      violation, while check_state_diff's other violations stand; "" for docs/DECISIONS.md is a violation, "Decision
      corpus absent at the base", never an empty corpus; "" for the archive is an empty archive). A transition's marker
      is fresh only when the cited Decision's base body lines (absent number: none) form an in-order subsequence of its
      head body lines (a greedy left-to-right match; a base line missing or out of order is a rewrite, Decision 177) and
      the head lines the match leaves over, less any that copies a base body line verbatim (a copied mention is still
      spent), the added text, name a candidate (the same candidate list and bounded flag authorization uses; no
      supersession hop). Otherwise "<key>: <token> marker cites <dec>, but no text added to it in this change names this
      entry (a mention the base already carried is spent; an in-place rewrite never authorizes)." check_present_markers
      never applies freshness (scout NOTE 165). Estimate about 90 SLOC; past 500, stop and amend (Decision 128).
    new_imports:
      - scripts.decisions_md
  - file: tests/checks/test__marker_guard_state_options.py
    action: Create
    purpose: >-
      The sibling module's mirror, so validate_test_coverage measures scripts/checks/_marker_guard_state_options.py
      through it; tests/checks/test__marker_guard.py (498 of 500 SLOC) is not extended. Nodes drive the helpers through
      check_state_diff, check_present_markers and check_diff and call the sibling directly where a branch needs it.
      Fixture corpora under tmp_path with _common.ROOT monkeypatched and _marker_guard._decision_bodies_cache cleared
      per test, and an in-memory base_reader dict ({rel_path: text}, "" for absent). TestBoundaryMatch: NS.1 not named
      by a body saying only NS.10 or only the range NS.1-NS.9 (nor NS.9 by it); mission not named by permission or
      mission-critical; NS.1 named by "(NS.1)", "NS.1," and end of body; with the default False a substring still
      authorizes (incumbent behaviour pinned); the NS.10-only body leaves a present NS.1 marker unauthorized through
      check_present_markers, and a check_diff spec with boundary_match honours it too. TestFreshMention: a Decision
      absent at base naming the key authorizes; a dated note appended to an existing body naming the key authorizes,
      even when the base body already named it (the note is added text); a body that named the key at base does not
      (spent) when the change adds no text naming it, nor when it only repeats a base line that names it; a body whose
      base line is rewritten or reordered does not, even when the new text names the key; an interleaved pure insertion
      (base A,B,C,D,E; head B,C,D,A,x1,B,x2,C,x3,D,x4,E with x2 naming the key) authorizes; a None corpus read prints
      one SKIP line and adds no freshness violation while an unauthorized transition still fails; a "" DECISIONS.md at a
      reachable base is a violation; check_present_markers on the same spec ignores freshness; default False keeps
      head-only authorization. TestTransitionLabel: the label replaces "weakening" in the message; the default is
      "weakening". TestReasonRequired (rec-3736's new acceptance): a reasonless head marker on a reason_required spec is
      no marker in check_state_diff and is skipped by check_present_markers; with reason_required False it still counts.
      Estimate about 250 SLOC; past 500, stop and amend, since map_source_to_test admits one mirror file and a split
      would leave the sibling unmeasured.
  - file: scripts/checks/contracts/validate_tier_a_amendment_guard.py
    action: Create
    purpose: >-
      Registered check validate_tier_a_amendment_guard(failed), with no root parameter, owner="platform". TOKEN =
      "tier-a-amendment-approved"; _REL = "docs/contracts/north-star.yaml". (a) Base:
      _common.status_diff_base(_common.ROOT) (Decision 159); None prints a SKIP line, calls registry.skipped and skips
      the diff legs, and skipped() is the run's final accounting call (Decision 170: the last call wins, so examined()
      never follows it). One `git cat-file --batch` at that base for _REL, this module, .github/CODEOWNERS and
      config/agent/executor/capabilities.yaml, and a second for docs/DECISIONS.md and docs/DECISIONS_ARCHIVE.md only
      when the DIFF leg calls check_state_diff's base_reader, so a run whose north-star.yaml equals the base reads no
      corpus (Decision 182). The schedule-removal reader shape, but taking the ref (its _batched_base_reader hardcodes
      origin/main, so importing it would bypass Decision 159; rec-4881 shares one reader later): blob text, "" for a
      missing path, None when the subprocess fails, which skips loudly, and every object body skipped by its declared
      size whatever its type (rec-3733's desync). Every path resolves under _common.ROOT, which the shared helpers read
      too, so the guard's reads and theirs never diverge; the mirror tests patch _common.ROOT. (b) Keys: mission,
      partial_order, semantics and every principles[].id at base or head. State per key: json.dumps({"value": the raw
      parsed node, "text": the span's text}, sort_keys=True, default=str), None when absent; parsed with a
      yaml.SafeLoader subclass that refuses duplicate keys (the scripts/session/rebase_resolve._duplicate_key_loader
      shape, not the Pydantic model, so a shape defect still compares). A duplicate key, any YAML error, or a valid-YAML
      shape defect (principles not a list, an item not a mapping, a missing or non-string id, two items with one id, or
      any anchor, alias or explicit tag, which the contract never uses and through which one entry's text could change
      another's value) at head is a PARSE violation (fail closed), never an exception: PyYAML's last-wins would
      otherwise let a shadowed line change the text agents read with no state change. At the base it is a loud SKIP of
      the diff legs, as for an unreachable base (skipped() stays the final accounting call), so the forward fix of a
      broken main can land (Decision 226; every other PR stays red on its head, and validate_north_star._base_ids also
      skips an unparseable base). "text" is default-deny: every non-whitespace character on the span's lines except the
      entry's one marker (below), as one string (each line stripped, the non-blank lines joined by one space). So any
      comment, anchor or tag name, a comment on a block scalar's indicator line, or prose anywhere in an entry is a
      change by construction, with no list of channels to keep complete; only whitespace (a reflow, a re-indent, a blank
      line) is free. The header comment, the contract block and amendment_log lie outside every span and stay free. (c)
      Spans from yaml.compose marks: mission, partial_order and semantics from their key line to the line before the
      next top-level key; each principles item from its dash line (the first item from the principles: key line) to the
      line before the next item (the last item to the line before the next top-level key), so every line from
      principles: to the next top-level key lies in some entry's span. A marker is comment text (from a "#" at line
      start or after whitespace to the line end) outside every scalar node's content range from yaml.compose, which is
      start_mark..end_mark except that a block scalar's (style | or >) range starts on the line after its indicator
      line, since YAML lets that line end in a comment, and that matches the marker regex
      `#\s*tier-a-amendment-approved:\s*dec-(\d+)\s*(.*)$` with re.match from its own leading "#", never searched, so
      prose before the token stays text; a blank reason is no marker (it stays text), and marker-shaped content inside a
      block or quoted scalar stays text. Markers are read from the entry's own lines only (its dash or key line to the
      line before the next sibling, the last item to the sequence's end, as the token row says), so a marker on
      principles: or after the last item is text of that entry, never its marker. SPAN leg: more than one marker on one
      span fails ("replace the old marker, never add a second"); and, diff only, a key whose state did not change
      carries its base marker unchanged or none, so a head marker absent at the base, or whose dec-id or reason differs
      from the base marker's, fails ("a marker records a change in the same PR; it is never added or reworded alone"),
      while removing a marker stays free. A head PARSE violation short-circuits every span-based leg (DIFF, RETRO,
      CARRIED, POINTER, LOG), since no extractor can run; OWNERSHIP still runs. (d) REMOVED leg: a key present at base
      and absent at head fails with "removed -- removal has no marker escape (retire an NS.n by status: retired with a
      marker; the mission, partial_order and semantics are never removed)"; removed keys are left out of the spec so it
      does not report them twice (validate_north_star's IDS leg also reports a removed NS id, a distinct guarantee). (e)
      DIFF leg, skipped when the head text equals the base text byte for byte (Decision 182):
      _marker_guard.check_state_diff over one RegistrySpec whose state_extractor always emits every key in the universe
      (absent = None, the schedule-removal precedent), weakened = base != head, gates_deletion always True,
      mention_candidates = lambda k: [k], reason_required=True, fresh_mention=True, boundary_match=True,
      transition_label="change"; extractor is the MarkerEntry projection of the same state (the schedule-removal
      _marker_entries_view_for precedent) that check_present_markers reads, with gated_direction="down",
      gates_new_entry=lambda _v: False and label "Tier A amendment guard". (f) RETRO leg: check_present_markers on the
      same spec, every run. (g) CARRIED leg, diff only, for each key whose state changed and is present at head: the
      head marker on its span cites a Decision number in that entry's head carried_by (mission, NS.n: "<key>: marker
      cites <dec>, which is not in its carried_by; a Decision that changes an entry carries it -- add it in the same
      change"), or the Decision that contract.ratified_via names at the diff base (partial_order, semantics; parsed with
      the `Decision (\d+)` regex validate_north_star.py uses inline, replicated rather than imported: "<key>: marker
      cites <dec>, not the ratifying Decision <n>; record the change as a dated note on it"). Diff-time only, so a later
      ratified_via or carried_by edit never reddens a persisted marker, and reading ratified_via at the base keeps a
      same-change contract-block edit from moving the authorizer (Decision 187 cl.1). A later change can never cite the
      base marker's own Decision (state_diff_mechanics (3)): an entry cites another of its carriers, while partial_order
      and semantics, which have one authorizer, take two PRs, one removing the old marker (free: a marker is not state),
      then the change with a fresh dated note and a new marker; the guard appends that path to check_state_diff's
      violation when the head marker repeats the base marker's Decision. (h) POINTER leg, every run: every present
      marker's reason matches `approval:\s+\S+\s+\d{4}-\d{2}-\d{2}` ("<key>: marker reason carries no `approval: <ref>
      <YYYY-MM-DD>` pointer"); presence and shape only. (i) LOG leg, diff only: each key whose state changed and is
      present at head needs a new amendment_log row whose json.dumps(sort_keys=True, default=str) text names the key
      under the boundary rule ("<key>: changed with no new amendment_log row naming it"). New rows are the head rows
      beyond the base multiset (collections.Counter of those texts), counted only when every base row survives
      unchanged, so an edited old row is never a new row. (j) OWNERSHIP leg: each path of PROTECTED (the guard module
      and its test, scripts/checks/_marker_guard.py, scripts/checks/_marker_guard_state_options.py,
      tests/checks/test__marker_guard.py, tests/checks/test__marker_guard_state_options.py and
      docs/contracts/north-star.yaml) is code-owned in .github/CODEOWNERS and covered by a
      config/agent/executor/capabilities.yaml boundary_patterns entry at head, and, whenever a diff base is reachable
      (whatever north-star.yaml's diff; the validate_detector_ratchet precedent), no PROTECTED path, CODEOWNERS line or
      boundary_patterns entry that covered one at the base is dropped (Decision 187 cl.1): both by calling
      scripts/checks/misc/sensitive_value_detectors' public ownership_violations and narrowing_violations, never a copy;
      the constant is named PROTECTED because base_protected parses that name. Estimate about 250 SLOC; past 500, stop
      and raise a plan amendment (Decision 128), never a budget raise. registry.examined(<keys in the universe>,
      unit="tier_a_entries"), the unit reading "tier_a_entries (freshness skipped: Decision corpus unreadable at the
      base)" when the guard's corpus reader returned None (the sensitive-value guard's base-ref unit precedent, Decision
      170). Failure label "Tier A amendment guard". The module docstring names Decision 243 cl.6, Decision 196 cl.3 and
      marker-grammar.yaml's token row, and restates no mechanics.
    new_imports:
      - scripts.checks._marker_guard
      - scripts.checks.misc.sensitive_value_detectors
  - file: tests/checks/contracts/test_validate_tier_a_amendment_guard.py
    action: Create
    purpose: >-
      Mirror tests in a temporary git repository (the tests/checks/contracts/test_validate_north_star.py pattern: the
      real north-star.yaml copied, a fixture DECISIONS.md with Decision 243 and a Decision 86 body naming NS.4 (86 is in
      NS.4's carried_by), the capabilities and CODEOWNERS rows), committed as main with origin/main pointing at it, then
      head edits in the working tree. Unless a node says otherwise, an authorized change also adds the citing Decision
      to carried_by, a reason with an approval pointer and an amendment_log row naming the key, so each node fails for
      one cause. Every node clears _marker_guard._decision_bodies_cache before each guard run (load_decision_bodies
      caches per _common.ROOT, and base and head runs share the process). Nodes:
      test_authorization_shaped_binds_marker_guard_at_check_name_level (rec-3959's acceptance: an NS.4 detail edit with
      a marker citing a new Decision naming NS.4 passes; the same marker citing a new Decision naming only NS.40, the
      range NS.1-NS.9, scripts/checks or the file path fails; a spy on _marker_guard.check_state_diff proves the
      binding); test_unmarked_change_fails; test_spent_mention_fails (cites 86); test_appended_note_authorizes (a dated
      note on 86); test_in_place_rewrite_never_authorizes; test_addition_needs_a_fresh_marker (NS.10);
      test_retirement_needs_a_fresh_marker; test_removal_has_no_marker_escape;
      test_mission_partial_order_and_semantics_are_gated; test_cited_decision_outside_carried_by_fails;
      test_block_keys_need_a_dated_note_on_the_ratifying_decision (a semantics edit citing a fresh note on another
      Decision that says "field semantics" fails; a fresh dated note on 243 naming semantics passes);
      test_ratified_via_is_read_at_the_base; test_ratified_via_edit_does_not_red_persisted_markers;
      test_second_change_to_a_block_key_takes_two_prs (same-PR re-cite of 243 fails with the two-PR hint; marker removal
      alone passes; the next change with a fresh note passes); test_duplicate_key_fails_closed;
      test_unquoted_date_does_not_crash; test_comment_inside_an_entry_is_a_change;
      test_comment_on_a_block_scalar_indicator_line_is_a_change (a marker there counts as the entry's marker);
      test_comment_before_the_first_principle_is_a_change;
      test_hash_inside_a_block_scalar_is_content; test_edited_log_row_is_not_a_new_row;
      test_marker_without_approval_pointer_fails; test_change_without_a_log_row_naming_the_key_fails;
      test_marker_on_another_entry_does_not_authorize; test_two_markers_on_one_entry_fail;
      test_reasonless_marker_is_no_marker (it never authorizes,
      and adding one alone is a text change that fails); test_marker_added_or_reworded_alone_fails (a new marker,
      and a reason edit, on an unchanged entry each fail; removing one alone passes);
      test_prose_before_the_marker_token_is_text; test_anchor_alias_or_tag_fails_closed;
      test_corpus_read_failure_is_named_in_the_examined_unit;
      test_duplicate_principle_id_fails_closed; test_header_comment_amendment_log_and_reflow_are_free (a
      re-wrapped folded scalar, a re-indent and a blank line each pass);
      test_unchanged_file_runs_only_the_every_run_legs (RETRO,
      POINTER, SPAN's count, OWNERSHIP with its narrowing); test_retroactive_scan_flags_an_unauthorized_present_marker;
      test_push_to_main_rechecks_the_merged_commit (GITHUB_EVENT_NAME=push, HEAD~1 base);
      test_no_diff_base_skips_loudly_and_records_a_skip (skipped() is the final accounting call);
      test_head_parse_failure_fails_closed; test_unparseable_base_skips_the_diff_legs_loudly;
      test_base_reader_failure_skips_loudly; test_missing_head_file_reports_every_key_removed;
      test_ownership_rows_required (a missing CODEOWNERS row and a missing boundary_patterns row each fail);
      test_narrowing_protected_with_its_rows_fails (one change
      drops a PROTECTED path and its CODEOWNERS row, north-star.yaml byte-equal);
      test_registered_ungated_in_both_tiers; test_real_tree_is_clean. Size: precedents measure 32 nodes in 244 SLOC
      (schedule-removal) and 46 in 497 (tier-demotion), so about 44 nodes lands near 410; past 500, stop and raise a
      plan amendment, since CODEOWNERS names this exact path and a split file needs newly approved text (Decision 128).
