  - >-
    This plan's own closure, in the build PR: run the graduation walk for VP 2 and VP 4 (shards
    marker-guard-state-options and tier-a-amendment-guard-rules under config/agent/verification_registry/entries/),
    then set implementation_declared: true, then --pre, then commit so VP 12's full tier starts on a clean, committed
    tree. The implementation commit and merge_pull_request's explicit commit_message carry "Resolves: rec-3959,
    rec-3736".
  - >-
    Closure evidence, recorded as four SEPARATE facts (implement skill Commit Flows): GitHub readiness state
    (scripts.session.github_readiness); parent validator evidence (VP 12 full-tier PASS plus --verify-head exit 0 for the
    pushed HEAD); structured postflight evidence (write the scripts.session.postflight_evidence.CATEGORIES JSON in the
    scratchpad, then bin/venv-python -m scripts.session.postflight --evidence <file>); the real outcome - push, build PR,
    CI green by event-driven wake (never polled), Commit Flow step 4 (premerge, squash-merge with the explicit
    commit_message and expectedHeadSha, readback), merge SHA. Then VP 13.
  - "Report: what was implemented, verification results."
rollback: Revert the implement PR; the shared defaults keep every other binding unaffected either way.
