schema_version: 7
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: tracked-background-validate
intent: >-
  AGENTS.md tells agents to launch the full tier, and any other long validate run, as the Bash tool's own tracked
  background task (run_in_background true, timeout 7200000) and never shell-detached, because a detached run dies
  unseen when the idle CC-web container is reclaimed and the thread stalls (rec-5691). A drift-guard node pins the rule.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-tracked-background-validate.yaml
phase: >-
  ad_hoc_rec (soft-warn exception category): operator-requested fix from the 2026-11-26 background-validation death
  analysis. No tier_item is claimed and no exit criterion is closed.
closes_criteria: []
cites: [dec:279, dec:246, dec:281]
scope:
  - file: AGENTS.md
    action: Modify
    purpose: >-
      Exactly the approved-text sidecar's two blocks under Git-ops procedure: drop the Presubmit tier bullet, which only
      points at the table beneath it, and replace the full-tier paragraph under the table with the tracked-launch rule.
      The file shrinks, so the S1 entry in config/prose_budgets.yaml is lowered to the new measured size in the same
      commit (prose_budgets_ratchet_down sanction row).
    new_imports: []
  - file: tests/test_agents_md_rules.py
    action: Modify
    purpose: >-
      Add test_full_tier_launch_is_a_tracked_background_task (rec-5691's acceptance node). It takes the AGENTS.md
      paragraph that names the 10-min foreground cap, collapses its whitespace to single spaces (the sidecar wraps
      "never" and the backticked list onto two lines), and asserts it contains the literals `run_in_background: true`,
      `timeout: 7200000` and never `&`/`nohup`/`setsid` as whole substrings (never a per-token check for a bare
      ampersand); it also asserts "with a 2 h limit" is absent from AGENTS.md. No other node changes.
    new_imports: []
bundled_recommendations: [rec-5691]
followon_recs: []
infrastructure_dependencies: []
acceptance_criteria:
  - "AGENTS.md equals main with the sidecar's blocks applied (approved_text verify passes)."
  - "The new node passes on the build tree and fails on main."
  - "config/prose_budgets.yaml's S1 entry equals the new measured root ambient load set."
  - "rec-5691 is closed by the merge's Resolves trailer, its acceptance node passing."
verification_plan:
  - step: 1
    phase: pre-deploy
    action: The new node passes.
    command: bin/venv-python -m pytest tests/test_agents_md_rules.py::test_full_tier_launch_is_a_tracked_background_task -q
    expected: exit 0 with 1 passed; on main the node does not exist
    fix_if: an assertion fails; read which literal is missing from the paragraph
    hermetic: true
    expected_literals: ["1 passed"]
    graduation: waive
    graduation_waiver_reason: The graduated shard agents-md-hook-canary-marker already runs every node in this file (file-level node_id), so a second shard would duplicate it.
  - step: 2
    phase: pre-deploy
    action: AGENTS.md carries exactly the approved words and the rest of the file's nodes pass.
    command: >-
      bin/venv-python -m scripts.roadmap.approved_text verify --slug tracked-background-validate --base origin/main &&
      bin/venv-python -m pytest tests/test_agents_md_rules.py -q && bin/venv-python -c "from scripts.checks.prose.prose_limits
      import validate_prose_limits as v; f = []; v(f); raise SystemExit(1 if f else 0)"
    expected: verify exits 0, the file's nodes pass, and validate_prose_limits reports no failure (S1 equals the measured bytes)
    fix_if: verify names a difference (make AGENTS.md match the sidecar, never the reverse), or prose limits name S1 (re-measure and set it)
    hermetic: false
    graduation: waive
    graduation_waiver_reason: Reads origin/main, so it is not hermetic; the file-level shard already guards the nodes.
  - step: 3
    phase: pre-deploy
    action: >-
      Full tier, then HEAD attestation, after the build commit and rebase and before the push (handoff_policy). Launch
      it as the new rule says: from the top-level session, a Bash call with run_in_background true and timeout 7200000,
      the validate command itself, no shell detachment; say it started and end the turn.
    command: bin/venv-python -m scripts.validate && bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: the full tier exits 0 and the validation result attests the current HEAD's tree
    fix_if: any failure; fix and rerun the full tier from the start
    hermetic: false
    graduation: waive
    graduation_waiver_reason: A whole full-tier run; graduate steps may not invoke scripts.validate (recursion).
  - step: 4
    phase: post-deploy
    action: rec-5691 is closed by the merge's Resolves trailer.
    command: >-
      AWS_PROFILE=agent_platform bin/venv-python -c "from src.common.ducklake_reader_client import fetch_recs_by_ids,
      make_reader; rows, _ = fetch_recs_by_ids(make_reader(profile='agent_platform'), ['rec-5691']); print([(r['id'],
      r['status']) for r in rows])"
    expected: rec-5691 closed, after the closure job runs on the merge commit
    fix_if: rec-5691 still open; read the closure job log for the refusal marker and fix its cause, never a direct status write
    hermetic: false
test_obligations:
  - source: tests/test_agents_md_rules.py
    behavior: AGENTS.md names the tracked background launch for long validate runs and forbids shell detachment
    verification_step: 1
    test_selector: tests/test_agents_md_rules.py::test_full_tier_launch_is_a_tracked_background_task
    red_green_expectation: red before (the node does not exist on main, and main's paragraph lacks the literals), green after
constraints:
  - "AGENTS.md is gated (docs/contracts/approval-routing.yaml): the build changes only the sidecar's words."
  - "S1 has zero headroom (config/prose_budgets.yaml); the sidecar shrinks AGENTS.md, so no raise is needed."
  - "No existing assertion in tests/test_agents_md_rules.py is changed or loosened (Decision 235)."
  - "No rescue agents or workaround loops (Decision 55)."
context:
  - "Evidence (2026-11-26 analysis, rec-5691 context): 6 validate runs in 5 of 23 build threads died 11-24..26, all shell-detached; a tracked 40-min run_in_background task held the container with an untracked heartbeat beside it, and with nothing tracked the heartbeat died about 3 min after the turn ended."
  - "Byte cap: S1 root_ambient_load_set is 16676 with zero headroom, so the operator's longer draft was reshaped to fit (prose_budgets.yaml relief valve: trim the surface); the redundant Presubmit tier bullet goes."
  - "rec-3039 (open) prescribes the opposite pattern (setsid nohup ... & disown, its acceptance greps overseer-dispatch.yaml for setsid). Not bundled: a different surface (dispatch briefs of the retiring overseer); its owner reconciles it with this rule before any build, flagged to the operator."
  - "Decision-scout verdict FLAGS_FOUND (round 2, after main added Decision 289 and moved north_star; same verdict as round 1). CITE: 279, 246, 281. CONTRADICT: none. SPIRIT: 163 [WARN] (a universal rule ships as prose; the node pins wording, not the launch; dispositioned to rec-5695). RELATED: 254, 76, 127, 86, 139, 181, 203, 235, 132, 201, 55, 288. Decisions triaged: 238 of 238. Roadmap items intersected: 2; CONFLICT: 0; RELATED: 2 (T2.54, T4.23). Serves: NS.4 3/5."
  - "Decision 163 WARN disposition: the structural guard is rec-5695 (a PreToolUse refusal of a shell-detached or untracked scripts.validate launch, Decision 203 hook pattern; depends on rec-5691), its own plan later, a different risk class (hook code). The operator chose 'Separate rec for a hook guard' on the decision card at 2026-11-26 22:35Z. It is a separate rec, not followon_recs, which holds only a half deferred at build time (planning skill Step 8)."
  - "Wording check r1 PASS on base 4ff6cc19 (scratch worktree of origin/main holding only the sidecar's AGENTS.md edits; the check lowered S1 itself)."
  - "Approval: Benjamin wrote approved, please proceed in this thread at 2026-11-26 20:04Z, after the proof results (counts as write the plan). The byte-cap reshape of his draft words comes back to him on the approval run, with the sidecar's exact words."
  - "red_overlap verdict clear (no reds), 2026-11-26."
  - "Unbuilt plans also scoping AGENTS.md (agent-proxy-signed-access, bootstrap-ci-gated-apply, hook-canary-evidence; the last also scopes tests/test_agents_md_rules.py): no shared words with this sidecar; whichever builds second rebases."
  - "Plan owner: this planning session (thread Stop background validation runs dying); send scope gaps or amendments here."
