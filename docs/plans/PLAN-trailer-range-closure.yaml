slug: trailer-range-closure
intent: >-
  rec-4874 build plan 2b (closes rec-5106; Decision 254 cl.4): make the Decision 201 trailer gate range-aware before
  main-validate batching starts (rec-5107). The push run whose full tier covers a merge (its covering run) censuses that
  merge's still-open junit-routed recs and binds their junit verdict to the merge commit (closing_sha); a run whose own
  full tier did not start binds no junit verdict and leaves those recs open for the covering run instead of refusing
  them; the implement closeout waits for the covering run instead of taking the fallback or recover. Serves NS.6: a rec
  closed by trailer stays proven by the run that measured a tree containing its merge once one run covers several
  merges. Behaviour is unchanged (entries gain only closing_sha = HEAD) wherever HEAD's own full tier started and
  HEAD^'s main-validate ran it.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-trailer-range-closure.yaml
phase: >-
  rec-4874 (ad_hoc_rec; no tier_item names it). Build plan 2b of rec-4874's design (#1946): plan 1 merged #1998
  (Decision 254), plan 2a merged #2184 (66949dda, rec-4900 closed). Closes no exit criterion; closes rec-5106.
closes_criteria: []
cites: [dec:177, dec:186, dec:201, dec:246, dec:254]
scope:
  - file: scripts/ci/trailer_range.py
    action: Create
    purpose: >-
      The range walk and covering logic for the trailer gate (both trailer modules sit near their budgets, and their
      coverage home tests/test_rec_trailer_acceptance.py is at 500 of 500 SLOC). Standard library plus
      scripts.ci.last_green, scripts.ci.deploy_gate (Git, GithubApi, GateError) and scripts.ci_rca.range_context
      (compute_range, so the trailer gate and ci-rca read one range by one read order); it does not import
      scripts.rec_trailer: the trailer parser is passed in as parse_trailer (so validate_full_tier_range's manifest
      pre_globs, which cover scripts/ci/** and scripts/ci_rca/**, stay complete); no module-level I/O, api, git and
      reader injected. Constants DEFERRED_MARKER =
      "TRAILER-RANGE DEFERRED", UNREADABLE_MARKER = "TRAILER-RANGE UNREADABLE", ANNOTATION_TITLE = "trailer-range".
      (1) run_covers(api, head) -> True | False | None: last_green.full_tier_state(api, head) == "started"; None on a
      GateError. (2) range_merges(api, git, head, *, parse_trailer) -> {prev, range_status, merges}:
      range_context.compute_range(api, git, head, "ci") with no recorded_range (rec-5107 passes one when it lands),
      taking its prev and range_status (resolved, widened or unresolved) and ignoring its prs (compute_range reads one commits/<sha>/pulls per range commit; harmless at today's ranges,
      a rate-limit cost only on a widened 50-commit range); merges: its commits
      with head dropped, newest first, keeping only those whose full_tier_state is not "started" (all of them when
      resolved, by resolve_prev's definition; in a widened range a merge that ran its own full tier covered itself;
      a GateError on a state read makes range_status "unresolved" and merges []) and whose message parse_trailer
      finds ids in, each as {sha, ids}; unresolved yields merges []. (3) extend_census(head, ids, entries, *,
      census_fn, parse_trailer, reader, api, git) -> the census document {ids,
      entries, sha: head, covers, prev, range_status}: covers = run_covers(api, head); only when covers is True,
      range_merges(api, git, head, parse_trailer=parse_trailer) is walked: for each merge newest first, its ids not in ids and not taken already
      are read through reader.named("rec_by_id", id=...), rows whose status is not "open" dropped, then
      census_fn(kept_ids, rows=kept_rows, closing_sha=merge sha) and only entries whose route is junit kept; their
      rec ids are appended to ids. When covers is not True, prev is None and range_status is "not_walked". It prints
      one line "[trailer_range] covers=<c> prev=<p> range_status=<s> range_recs=<ids>" and, for range_status
      unresolved, the workflow command "::error title=trailer-range::range unresolved; earlier merges' junit recs
      not censused". (4) close_groups(census_doc, head) -> [(closing_sha, ids)]: when census_doc's covers is
      False (or None), every junit-routed entry's rec id is held and prints one line per rec, "TRAILER-RANGE
      DEFERRED: <rec> left OPEN -- run <head> did not run the full tier; its covering run binds it" (or
      "TRAILER-RANGE UNREADABLE: <rec> left OPEN -- full-tier state of <head> unreadable; re-run trailer-census"),
      mirrored to $GITHUB_STEP_SUMMARY when set; a document without a covers key reads as True (today's documents).
      The remaining ids are grouped by their entry's closing_sha (an id with no census entry -- a rec the reader did
      not return -- goes with head, as today), the head group first, then the others in census order, empty groups
      dropped. (5) CLI covering --sha M (read-only; GH_TOKEN optional, public reads): M must be on origin/main's
      first-parent history, else "COVERING not-on-main" exit 2; walks M and its first-parent descendants on
      origin/main oldest first and prints "COVERING <sha>" for the first whose full_tier_state is "started" (a started
      run that later ends cancelled or timed out reads not started, so asking again names the next one), else
      "COVERING pending", exit 0; "COVERING unreadable <error>" exit 2 on a GateError.
    new_imports: [scripts.ci.last_green, scripts.ci.deploy_gate, scripts.ci_rca.range_context]
  - file: scripts/rec_trailer_acceptance.py
    action: Modify
    purpose: >-
      Thin delegations only (its coverage home is at its SLOC cap; the branching lives in trailer_range): census()
      gains a keyword closing_sha (default None) carried on every entry. cmd_census: head = _current_sha(ROOT);
      entries = census(ids, repo_root=ROOT, closing_sha=head) when HEAD carries a trailer, else []; the document is
      trailer_range.extend_census(head, ids, entries, census_fn=<census bound to repo_root=ROOT>,
      parse_trailer=<the module's existing Resolves parser>, reader=_make_reader(), api=GithubApi(), git=Git(str(ROOT))); the no-op message prints when the document's ids
      are empty; the document is written as today. rejoin(): the synthetic report_unavailable record's sha is its
      entry's closing_sha, falling back to the census sha as today. cmd_close: after rejoin, for each (closing_sha,
      group_ids) in trailer_range.close_groups(census_doc, commit_sha), call close_recs_from_trailer(group_ids,
      closing_sha, run_url, recs_cache, acceptance_verdicts=..., require_acceptance_verdict=True) and return the
      largest exit code; recs_cache is read for every id in the document as today. With prev = HEAD^ and covers True
      the head group is today's single call, byte for byte.
    new_imports: [scripts.ci.trailer_range, scripts.ci.deploy_gate]
  - file: scripts/rec_trailer_acceptance_junit.py
    action: Modify
    purpose: >-
      junit_verdict(): each record's sha is its census entry's closing_sha when the entry carries one, else the run
      sha as today. Nothing else changes; the module stays stdlib-only (validate_sandbox_runner_test_deps M2).
  - file: .github/workflows/ci.yml
    action: Modify
    purpose: >-
      trailer-census: needs [main-validate] with if always() && github.event_name == 'push' (so its own run's
      full-tier state is final when it reads it; an earlier run's is final only once rec-5107 serialises main-validate), permissions gain actions: read, checkout fetch-depth 0,
      and the census step's env gains GITHUB_TOKEN: github.token. trailer-closure: checkout fetch-depth 0 (changed_files
      of an earlier range merge needs its parent). trailer-acceptance-evaluate: if becomes always() &&
      github.event_name == 'push' && needs.trailer-census.result == 'success' (whether GitHub would skip evaluate
      transitively when main-validate fails is not proven and need not be: always() plus the census-success guard runs
      evaluate exactly when the census succeeded either way, so static recs close as today). Its permissions and trailer-junit-verdict's are unchanged (still
      {contents: read}, no id-token, the junit download names no run-id). No run: body, step name or step id changes
      (config/composite_action_body_baseline.yaml rows stay); the census job's header comment names the range,
      PLAN-trailer-range-closure and the DECLARED COST (closure latency grows by the census and evaluate jobs' time,
      which now start after main-validate).
  - file: docs/contracts/full-tier-range.yaml
    action: Modify
    purpose: >-
      Approved text (docs/plans/approved/trailer-range-closure.yaml f01, f02): a new amendment_log entry and a new
      trailer_census section (covering_run, census, binding, run_that_does_not_cover, markers). Decision 246.
  - file: docs/contracts/git-ops.yaml
    action: Modify
    purpose: >-
      Approved text (g02-g04), in place and line-neutral except one new non-breaking amendment_log row (g02;
      contract_version unchanged): trailer_acceptance_gate's PROVENANCE sentence (the report is the covering run's, whose range holds each
      entry's closing_sha) and resolves_trailer's FALLBACK sentence (never for a TRAILER-RANGE rec, which waits for the
      covering run's trailer-closure job). 496 of 500 effective lines at plan time, 497 after.
  - file: .claude/skills/implement/SKILL.md
    action: Modify
    purpose: >-
      Approved text (s01): Commit Flow step 5's closeout tail (from "route, a Decision 186 refusal" to "anything else
      waits.") names the TRAILER-RANGE line, which waits, and no longer reads as "a non-refusal per-rec log line" that
      permits the fallback. It leaves the line holding the `git-ops.yaml::resolves_trailer` pointer untouched.
      Byte-neutral (247 to 247 B; config/prose_budgets.yaml pins the file at 33216 B with 0 headroom).
  - file: .claude/commands/implement.md
    action: Modify
    purpose: Approved text (i01) -- the post-merge closeout sentence sends a TRAILER-RANGE rec to its covering run's job.
  - file: docs/DECISIONS.md
    action: Modify
    purpose: >-
      Approved text (d01): a trailing dated blockquote Update on Decision 254, after its Related line
      (decision-entry.yaml amendment_forms; Decision 177 append-only; trailing annotations sit outside the
      per_entry_size_norm span tests/checks/decisions/test_last_green_decision_records.py pins at 6144 B, 6045 B today):
      cl.9's cl.4 row is split; rec-5106 built cl.2's resolver and cl.4's consumers, and the three dormant legs are
      rec-5107's.
  - file: scripts/checks/ci_guards/validate_full_tier_range.py
    action: Modify
    purpose: >-
      Derive-and-assert (Decision 168): the contract's trailer_census.markers.deferred and .unreadable equal
      trailer_range.DEFERRED_MARKER and UNREADABLE_MARKER; a missing trailer_census section is drift. Its manifest
      pre_globs already include scripts/ci/** and the contract.
    new_imports: [scripts.ci.trailer_range]
  - file: tests/ci/test_range_aware_consumers.py
    action: Create
    purpose: >-
      rec-5106's acceptance and the end-to-end cases over a real temp git repo (main chain of merge commits with
      Resolves trailers) and a fake GitHub API (runs and jobs per sha) and fake reader, driving the real cmd_census and
      cmd_close (scripts.ops_data_portal.update_rec patched to record calls); ROOT points at the temp repo, which also
      holds rec-A's and rec-B's test files so census's pytest_node_exists sees their nodes and routes them junit, not
      EXPECTED_FAIL_MISSING_NODE static; scripts.ops_portal.ci_rca_lifecycle.ROOT (close_recs_from_trailer's
      changed_files) also points at the temp repo, and M1 and M2 change files outside docs/plans/ so the merge-leg
      gate admits them. test_three_merge_batch_files_one_rec_and_closes_two_junit_recs:
      M0 ran its full tier; M1 (Resolves rec-A, junit node) and M2 (Resolves rec-B, junit node) did not (cancelled,
      plans-only-free); M3 is head and ran it. ci-rca's range_context.compute_range(api, git, M3, "ci") is one range [M1, M2, M3]
      with three PR rows (the test asserts the single range; its docstring states that one range means one ci-rca
      diagnosis and one rec as inferred, compute_range being ci-rca's only range source); M3's census holds rec-A with closing_sha M1 and rec-B with M2;
      with both nodes passed in M3's junit report, update_rec closes rec-A at M1 and rec-B at M2, each verdict
      record's sha equal to its closing sha. Also: test_parent_ran_full_tier_is_todays_census_and_close (prev = HEAD^:
      document entries equal HEAD's census, one close call with HEAD's sha and ids); test_run_without_full_tier_defers_junit_and_walks_no_range
      (covers False: DEFERRED lines, no closure call for junit recs, a static-route rec still closes under HEAD, no
      range read); test_unreadable_state_marks_unreadable; test_closed_rec_in_range_is_not_censused;
      test_widened_range_skips_merges_that_ran_their_own_full_tier; test_unresolved_range_censuses_head_alone_with_error_annotation;
      test_ci_yml_trailer_jobs_shape (trailer-census needs main-validate, always() && push, actions: read, fetch-depth 0,
      GITHUB_TOKEN on the census step; trailer-acceptance-evaluate's if is exactly always() && push &&
      needs.trailer-census.result == 'success'; trailer-closure fetch-depth 0; trailer-junit-verdict permissions exactly
      {contents: read}); test_static_recs_close_when_main_validate_failed (a census document from a run whose
      main-validate failed before its full-tier step: covers False (a red full tier reads started, so covers True), the static-route rec still closes under HEAD, junit recs DEFERRED).
  - file: tests/ci/test_trailer_range.py
    action: Create
    purpose: >-
      Unit tests on fakes: run_covers True/False/None; range_merges newest first, trailerless commits dropped,
      widened and unresolved arms, GateError -> unresolved; extend_census takes a rec once (HEAD wins, then the newest
      merge), drops non-junit and non-open rows, walks nothing when covers is not True; close_groups head group first,
      ids without entries go with head, holds and markers, step-summary mirror; covering: first started commit,
      moves past a started-then-cancelled one when asked again, pending, not-on-main exit 2, unreadable exit 2.
  - file: tests/test_rec_trailer_acceptance.py
    action: Modify
    purpose: >-
      Net-zero SLOC (500 of 500): one autouse fixture patches scripts.rec_trailer_acceptance's trailer_range seams to
      today's behaviour (extend_census returns {ids, entries}; close_groups returns [(commit_sha, ids)]) and its
      GithubApi/Git/_make_reader construction and _current_sha in cmd_census (so closing_sha asserts are hermetic), offset by compacting existing tests without changing any
      assertion's meaning; plus closing_sha asserted in the existing census and absent-junit rejoin cases. Every
      changed line of scripts/rec_trailer_acceptance.py is covered from this file alone (validate_test_coverage).
  - file: tests/test_rec_trailer_acceptance_junit.py
    action: Modify
    purpose: test_record_sha_is_entry_closing_sha (an entry with closing_sha binds its record to it; one without keeps the run sha).
  - file: tests/checks/ci_guards/test_validate_full_tier_range.py
    action: Modify
    purpose: test_trailer_census_marker_drift_fails and test_missing_trailer_census_fails over _tree edits; the real tree still passes.
