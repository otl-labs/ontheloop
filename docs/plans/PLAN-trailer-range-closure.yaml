test_obligations:
  - source: scripts/ci/trailer_range.py
    behavior: range walk, covers, census extension, close grouping, holds and the covering CLI
    verification_step: 4
    test_selector: tests/ci/test_trailer_range.py
    red_green_expectation: red before (module and test absent), green after
  - source: scripts/rec_trailer_acceptance.py
    behavior: the covering run censuses its range's open junit recs and closes each at its own merge; neutral when the parent ran the full tier
    verification_step: 1
    test_selector: tests/ci/test_range_aware_consumers.py::test_three_merge_batch_files_one_rec_and_closes_two_junit_recs
    red_green_expectation: red before (test absent; today's census reads HEAD only), green after
  - source: scripts/rec_trailer_acceptance_junit.py
    behavior: a record's sha is its entry's closing_sha
    verification_step: 5
    test_selector: tests/test_rec_trailer_acceptance_junit.py::test_record_sha_is_entry_closing_sha
    red_green_expectation: red before (node absent), green after
  - source: .github/workflows/ci.yml
    behavior: trailer-census waits for main-validate with actions read and full history; trailer-closure has full history; junit job credential-free
    verification_step: 6
    test_selector: tests/ci/test_range_aware_consumers.py::test_ci_yml_trailer_jobs_shape
    red_green_expectation: red before (test absent), green after
  - source: scripts/checks/ci_guards/validate_full_tier_range.py
    behavior: marker drift and a missing trailer_census section fail the check
    verification_step: 7
    test_selector: tests/checks/ci_guards/test_validate_full_tier_range.py::test_trailer_census_marker_drift_fails
    red_green_expectation: red before (node absent), green after
  - source: docs/contracts/full-tier-range.yaml
    behavior: trailer_census markers equal the live constants
    verification_step: 7
    test_selector: tests/checks/ci_guards/test_validate_full_tier_range.py::test_missing_trailer_census_fails
    red_green_expectation: red before (node absent), green after
constraints:
  - "Behaviour-neutral where HEAD's own full tier started and HEAD^'s main-validate ran the full tier: covers is True, the range minus head is empty, the census document's entries equal today's plus closing_sha = HEAD (the document also gains sha, covers, prev and range_status) and trailer-closure makes today's single call."
  - "DECLARED COST (accepted by this plan): trailer-census and trailer-acceptance-evaluate now start after main-validate, so closure latency grows by their run time (trailer-closure already waited for main-validate through trailer-junit-verdict); ci.yml's census header comment states it."
  - "Graduated node ids keep their names: tests/test_rec_trailer_acceptance.py TestCliStages::test_close_requires_acceptance_verdict, TestCloseReadsLiveRows, TestJunitRouting, TestVerdictMapping and TestCensus::test_undecidable_acceptance_is_out_of_grammar; compaction never renames, merges or moves them."
  - "No second closure path (Decision 201; git-ops.yaml resolves_trailer LATE CLOSURE): one census document, the existing three jobs, rejoin's refusal logic unchanged (only the synthetic record's sha follows closing_sha; its two-source refusal still holds; range entries are junit-only and never reach evaluate's probe)."
  - "Same-run provenance holds: the junit download step keeps no run-id input (validate_rec_autoclose_trailer_gate); trailer-junit-verdict and trailer-acceptance-evaluate keep {contents: read} only (Decision 143)."
  - "A deferred rec is never passed to update_rec, so Decision 201's require_acceptance_verdict refusal and Decision 186's closure obligation are untouched; a DEFERRED line is not an acceptance-verdict refusal and permits no manual fallback (Decision 235: a rec held open is not a weakened check)."
  - "Each group closes under its own closing_sha, so the merge-leg gate (merge_leg_refuses over changed_files) and Decision 186's fixed_by_sha read the merge that named the rec; fetch-depth 0 on trailer-closure makes an earlier merge's diff resolvable."
  - "scripts/rec_trailer_acceptance.py stays thin (delegations only) and tests/test_rec_trailer_acceptance.py stays at or under 500 SLOC: compact, never raise (Decision 128). The covering verb lives in trailer_range, not merge_step.py (tests/test_session_merge_step.py 490 of 500); merge_step.py is not edited."
  - "Governed wording lands word for word as docs/plans/approved/trailer-range-closure.yaml binds it (Decision 246), {{DATE}} filled with the build date; the implement SKILL edit is byte-neutral and git-ops.yaml grows by the one amendment_log line only (497 of 500)."
  - "ci.yml: no run: body, step name or step id changes (Decision 162 R3 baseline rows stay); the census step gains env only."
  - "Out of scope, rec-5107: main-validate's concurrency group, the prev step and the recorded range (when it lands, extend_census reads the recorded range first, per full-tier-range.yaml read_order -- a rec-5107 change); push_context_base on prev; ci-rca's anchor and manifest on the culprit."
  - "Declared residual (Decision 181 cl.2, owner rec-5107): while main-validate runs in parallel, an earlier merge's run aborted after a later run's census read it as started leaves its deferred recs with no covering census; trailer_census.missed sends them to the operator, never the fallback. An unresolved range (past resolve_prev's 50-commit cap and no last-green) does the same, with the census's ::error annotation as the signal."
  - "No rescue agents or workaround loops (Decision 55)."
