  - docs/PROJECT_CONTEXT.md read
  - Decisions 177, 186, 201, 246 and 254 sections read
  - docs/plans/reports/REPORT-last-green-batched-full-tier-design.md section 3.8 and docs/contracts/full-tier-range.yaml read
  - All files in scope located and readable
  - Acceptance criteria understood and verifiable
execution_steps:
  - "Ownership record (Decision 181 cl.2): read rec-5107 through recs_by_ids; if it is closed or already names this, note that and go on. Else call get_rec_write_guidance(), then update_rec on rec-5107 appending to its CONTEXT only (acceptance untouched): once its serialised main-validate and recorded range land, scripts/ci/trailer_range.py extend_census reads the recorded range first (full-tier-range.yaml read_order), which closes PLAN-trailer-range-closure's declared residual (trailer_census.missed: an earlier run aborted after the covering run's census). Read rec-5107 back and cite the returned text in the build report. A write that fails stops the build (Decision 84 I-4)."
  - "Run bin/venv-python -m scripts.ci_rca.red_overlap --plan docs/plans/PLAN-trailer-range-closure.yaml; on blocked, stop and report (the reds' owners repair first)."
  - "Governed text: place sidecar blocks f01, f02, g02-g04, s01, i01 and d01 by hand word for word ({{DATE}} = the build date); VP 9."
  - "Create scripts/ci/trailer_range.py and tests/ci/test_trailer_range.py; VP 4."
  - "Wire scripts/rec_trailer_acceptance.py (thin) and scripts/rec_trailer_acceptance_junit.py; the autouse fixture and compaction in tests/test_rec_trailer_acceptance.py, the junit node; VP 5, VP 8, VP 10 (coverage)."
  - "ci.yml trailer-census and trailer-closure edits; tests/ci/test_range_aware_consumers.py; VP 1, 2, 3, 6."
  - "Evaluator arms and their tests; VP 7."
  - "Live check: VP 11."
  - "Graduate VP 1-7 into config/agent/verification_registry/entries/ with their graduation_check_id slugs."
  - "CLOSURE (implement skill Commit Flows; docs/contracts/git-ops.yaml): set implementation_declared: true; commit with the trailer 'Resolves: rec-5106'; git fetch origin main && git rebase origin/main; VP 9; VP 12 (full tier backgrounded from the top-level session, then --verify-head; a timeout is BLOCKED, no push); push; open the PR; subscribe; code review; merge on green under standing authorisation (validate_merge_step reads the sidecar's approval), merge_pull_request with an explicit commit_message carrying the trailer and expectedHeadSha; merge_step premerge and readback."
  - "Closure evidence, recorded as four SEPARATE facts (implement skill Commit Flows): GitHub readiness state (scripts.session.github_readiness); parent validator evidence (VP 12 plus --verify-head for the pushed HEAD); structured postflight evidence (scripts.session.postflight --evidence); the real outcome -- push, build PR, CI green by event-driven wake, merge SHA."
  - "Report: what was implemented, verification results, merge SHA, each closure fact separately; VP 13 and VP 14 after the merge commit's trailer jobs concluded."
rollback: Revert the build PR; nothing is stored, deployed or migrated, and census documents are one-day artifacts, so no data or infrastructure rollback exists. A rec closed by a range binding stays closed and names its merge.
