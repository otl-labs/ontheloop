schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "trusted-plan-cutover"
intent: >-
  Move the terraform/personal PR-time speculative plan off the PR-run job and onto main's trusted workflow
  (terraform-plan-trusted.yml on pull_request_target, under agent-platform-github-ci-trusted-plan), so unreviewed agent
  code never runs beside Terraform state, saved plans or secret values. The PR's Terraform is screened as data before
  it is evaluated, init is hermetic, secrets stay in process environment, and the PR sees names only. Slice S3 of the
  trusted plan executor (rec-4637), realising Decision 238 cl.3-cl.5 for terraform/personal.
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-trusted-plan-cutover.yaml
phase: >-
  ad_hoc_rec (soft-warn category; no tier_item claimed, so the Tier Item Freshness Gate is skipped). Executes rec-4637.
scope:
  # ---------------------------------------------------------------- PR 1: providers.tf (terraform/personal, no-op plan)
  - file: terraform/personal/providers.tf
    action: Create
    purpose: >-
      PR 1. Holds, moved verbatim with their comments: the terraform {} block (required_version, required_providers aws
      and neon, backend "s3") and provider "aws" from main.tf, provider "neon" from neon_ducklake_catalog.tf, and the
      four variables a provider block reads (aws_region, aws_profile, owner_email, neon_api_key) from variables.tf, so
      a PR can change neither their defaults nor their validations. Header comment: this file is main-only; the trusted plan
      (terraform-plan-trusted.yml) never takes it from a PR, and no other file in this root may declare a terraform,
      provider or backend block (Decision 238 cl.3, enforced by scripts/ci/terraform_hcl_screen.py). The neon_api_key
      description drops the "PR speculative plans pass a stub and run -refresh=false" clause (true before and after
      the cutover without it). The plan is a no-op: moving blocks between files changes nothing Terraform tracks.
  - file: terraform/personal/main.tf
    action: Modify
    purpose: >-
      PR 1. Remove the terraform {} block and provider "aws" (now in providers.tf); keep the header comment, add one line
      pointing at providers.tf. Every resource and local stays.
  - file: terraform/personal/neon_ducklake_catalog.tf
    action: Modify
    purpose: >-
      PR 1. Remove provider "neon" and point its comment block at providers.tf; drop that comment's "PR speculative
      plans pass a stub with -refresh=false" clause. Resources unchanged. SSM plans also edit this file: rebase if
      they land first.
  - file: terraform/personal/variables.tf
    action: Modify
    purpose: PR 1. Remove variables aws_region, aws_profile, owner_email and neon_api_key (now in providers.tf). Other variables unchanged.
  - file: docs/contracts/secret-material-handling.yaml
    action: Modify
    purpose: >-
      PR 1: the domains line "Neon provider API key -- terraform/personal/neon_ducklake_catalog.tf (...)" names
      terraform/personal/providers.tf instead (rest of the line unchanged). PR 3: in
      patterns.provider_credential_ephemeral_input replace "PR plans receive a stub and skip refresh." with "The
      PR-time plan runs in main's trusted workflow (Decision 238) and receives the key the same way." Each PR adds a
      dated amendment_log row (prose_improvement for PR 1, governance_note_add for PR 3). Wording APPROVED by
      Benjamin 2026-10-29 22:39Z (context: Approvals).
  # ---------------------------------------------------------------- PR 2: screen, overlay, wrapper, report (scripts only)
  - file: scripts/ci/terraform_hcl_screen.py
    action: Create
    purpose: >-
      PR 2. Stdlib-only static screen of a Terraform root, run by path with python3 -I (appends the repo root to
      sys.path, so the stdlib always wins; never insert at 0). Pure functions over {relative path: text} so tests run on
      synthetic trees; two CLI verbs. Policy constants live in this module (code-owned): MAIN_ONLY_FILES =
      {providers.tf, .terraform.lock.hcl, backend-sandbox.hcl}; ALLOWED_DATA_TYPES = {aws_iam_policy_document}
      (no secret-version or SecureString-reading type ever, Decision 237 cl.3); ALLOWED_RESOURCE_TYPES = the 27 types
      main declares today (aws_cloudwatch_event_rule ... neon_role, listed explicitly); ALLOWED_FUNCTIONS = the pure
      functions main calls today (jsonencode, jsondecode, yamldecode, flatten, try, can, length, regex, format, ceil,
      plus file under the path rule) and any further pure built-ins the build lists explicitly (never a file-family
      function other than file, never templatefile, never provider::*, never timestamp/uuid); ALLOWED_FILE_PATHS =
      {"${path.module}/../../config/feature_flags.yaml", "${path.module}/../../config/lambda/ducklake/version.yaml"}.
      Lexer (purpose-built, AGENTS.md safety rule; never eval): tokenises double-quoted templates (with one level of
      ${ } interpolation, whose content is lexed as expression tokens), # and // line comments, identifiers, numbers
      and punctuation; strings are tokenised before comments, so the 55 "/*" ARN wildcards inside strings on main stay
      strings. Refusals (each a rule id): any byte outside printable ASCII plus \n and \t; a heredoc (<< outside a
      string); a block comment (/* outside a string); a template directive (%{ anywhere); ${ nested inside an
      interpolation; an unterminated string or unbalanced brace; a top-level block keyword outside {resource, data,
      locals, variable, output, moved, removed} (so terraform, provider, backend, module, import, check, ephemeral
      are refused); a data or resource type outside its allowlist; a function call outside ALLOWED_FUNCTIONS; file()
      whose single argument is not exactly one ALLOWED_FILE_PATHS template; anything the lexer cannot classify.
      Data-dependent shape rules (Decision 238 cl.4 keeps plan shape to a few bits; main uses none of these forms
      today, so they cost nothing): refuse the count and for_each meta-arguments and dynamic blocks; refuse the
      conditional operator and every comparison and logical operator outside lifecycle precondition/postcondition
      blocks and variable validation blocks; refuse a for-expression if clause; allow regex and can only inside a
      variable validation block; allow try only in the fixed form try(yamldecode(file(<ALLOWED_FILE_PATHS
      entry>))<index or attribute>, <literal>). Each rule has its own rule id and red test. Tree
      rules: refuse *.tf.json, override.tf, *_override.tf, terraform.tfvars, *.auto.tfvars(.json), any file not ending
      .tf except the MAIN_ONLY_FILES and README/CLAUDE.md, and a MAIN_ONLY_FILES entry declared outside its own name.
      Verb "screen --root DIR": prints PASS or one "REFUSED <rule> <file>:<line>" line per finding (the screen reads
      only public PR text, so locations are safe to print) and exits 1 on any refusal. Verb "backstop --plan-json F":
      after plan, from plan JSON's configuration section (Terraform's own parser), require provider_config keys
      exactly {aws, neon} with no alias, no module_calls, every resource and data type allowlisted, no
      resource_changes entry with importing, and no checks entry whose address kind is check (resource preconditions
      and variable validations also appear under checks and are allowed, since main has them); prints only
      "BACKSTOP_OK" or "BACKSTOP_REFUSED <rule>" (no address, no expression). If the module would exceed 500 SLOC, split the lexer into
      scripts/ci/terraform_hcl_lexer.py rather than raising a budget (Decision 128).
  - file: scripts/ci/trusted_plan_overlay.py
    action: Create
    purpose: >-
      PR 2. Stdlib, python3 -I, git via subprocess with fixed argv (no shell). Inputs PR_NUMBER and HEAD_SHA from env.
      Fetches +refs/pull/<n>/merge from origin (public read, no credential) into a local ref; fails closed with a fixed
      message if it is absent (unmergeable PR), if its second parent is not HEAD_SHA, or if its first parent is not
      an ancestor of (or equal to) the checked-out main commit. Lists terraform/personal in the merge tree with git
      ls-tree -z and, before printing anything, refuses any entry whose name is outside ^[A-Za-z0-9._-]+$ (no
      separator, whitespace, control or markup character can reach the log or the comment), any subtree (040000),
      and any entry whose mode is not 100644 (symlinks 120000, gitlinks 160000, executables). Refuses
      when the PR's own change (git diff --name-only <first parent> <merge>) touches a MAIN_ONLY_FILES entry or
      either ALLOWED_FILE_PATHS target (Benjamin F4-A: those two config files come from main, and a PR changing them
      gets no saved plan). Then replaces terraform/personal in the working tree with the merge tree's copy (rm the
      directory, git checkout <merge> -- terraform/personal) and restores every MAIN_ONLY_FILES entry from HEAD (the
      checked-out main, which can be newer than the merge's first parent; Decision 238 cl.3). Never runs anything
      from the PR. Prints one line: OVERLAY_OK, or OVERLAY_REFUSED <rule> [<path>] (a path is printed only after it
      passed the name rule).
  - file: scripts/ci/trusted_plan_env.sh
    action: Create
    purpose: >-
      PR 2. Usage: trusted_plan_env.sh [--scrub-only] -- CMD [ARGS...]. Reads the tfvars through materialise_tfvars.sh
      --stdout into a shell variable (a pipe, never a file; that script's masks arrive on stderr, which the runner
      reads, see below); for each "key = value" line (first-'=' split, same parse as the masking loop) with key
      matching ^[a-z_][a-z0-9_]*$ and no newline in the value, emits ::add-mask:: for owner_email (the others are
      masked upstream) on stderr before CMD starts (the runner processes workflow commands on both streams; a $( )
      caller captures stdout only), exports _ACCT/_DEV/_ADM/_OWNER for
      scripts/ci/redaction_check.py and, unless --scrub-only, TF_VAR_<key>; any other line shape fails closed with a
      fixed message (no line text). Then exec CMD. --scrub-only is for the comment step: the report process never
      holds a TF_VAR_* value. Writes nothing to disk, GITHUB_ENV or GITHUB_OUTPUT and prints no value (Decision 238 cl.4,
      secret-material-handling provider_credential_ephemeral_input). Decision 162 R2: tested under the literal
      bash --noprofile --norc -e -o pipefail argv.
  - file: .github/actions/materialise-tfvars/materialise_tfvars.sh
    action: Modify
    purpose: >-
      PR 2. Add a --stdout mode: same fetch and empty-secret check; the ::add-mask:: loop writes to stderr (so a
      caller's $( ) capture never swallows the masks and the runner still registers them); then print the tfvars to
      stdout instead of moving a file into place (no mktemp, no file). The default (no argument) behaviour is
      unchanged for every existing caller. Keeps one fetch implementation, so the SSM cutover (PLAN-secrets-to-ssm-cutover) switches
      the trusted job's source with every other caller; whichever lands second rebases.
  - file: scripts/ci/quiet_run.sh
    action: Create
    purpose: >-
      PR 2. Usage: quiet_run.sh LOG [--stdout FILE] -- CMD [ARGS...]. The innermost wrapper of the trusted plan: runs
      CMD with stderr redirected to LOG and stdout to FILE when given (else to LOG too), both under $RUNNER_TEMP, and
      exits with CMD's status, printing nothing. Innermost, so
      the masks the outer wrappers (trusted_plan_env.sh, neon_api_key.sh run) emit reach the runner and only
      Terraform's own output goes to the file. Refuses a LOG outside $RUNNER_TEMP. Decision 162 R2 argv.
  - file: scripts/ci/plan_names_core.py
    action: Create
    purpose: >-
      PR 2. Stdlib root-agnostic core extracted from terraform_github_plan_report.py: action counting
      (add/change/destroy/replace/import), changed top-level attribute NAMES (schema names, never values), drift rows,
      and a new normalise_address() that strips every [..] instance key and index from an address (module path
      included) so no for_each key or count index -- which can be a value (SPLIT.md threat-model gap 2) -- is ever
      printed. Never reads before/after values except to compare them.
  - file: scripts/ci/terraform_github_plan_report.py
    action: Modify
    purpose: >-
      PR 2. Imports the shared pieces from plan_names_core.py (sys.path append of the repo root, since it runs by path);
      its rendered output is byte-identical for the existing fixtures (tests/test_terraform_github_pr_plan.py passes
      unedited). Its own address rendering is unchanged in S3 (S5, rec-4638, decides it).
  - file: scripts/ci/terraform_personal_plan_report.py
    action: Create
    purpose: >-
      PR 2. Stdlib, python3 -I. Renders the names-only PR comment for terraform/personal: header "terraform/personal
      speculative plan (trusted, Decision 238)"; PR head sha; run link; a state line "State: <STATE>" (CHANGES, NO_CHANGES, or one fixed
      failure category: OVERLAY_REFUSED, SCREEN_REFUSED, ASSUME_FAILED, INIT_FAILED, PLAN_FAILED, BACKSTOP_REFUSED,
      GUARD_ERROR, PERSIST_FAILED); for a refusal, the screen's or overlay's rule lines verbatim (public PR text only);
      predicted guard verdict PASS or BLOCKED (BLOCKED = routes to tf-gated-apply at merge); counts; a table of
      normalised addresses with actions and the union of changed attribute names (no instance-count column: with
      count and for_each refused it is always 1); changed output NAMES; drifted normalised addresses; the reviewer
      digest fit as one word, FITS or OVERFLOW (from terraform_plan_digest.py --fit-report, never its byte counts); the
      plan.bin sha256; and the saved-plan note (or, on any failure, "No saved plan: after merge, apply by a blank
      workflow_dispatch of terraform-apply-sandbox"). Never prints a value, an instance key, or terraform or provider
      diagnostic text. --github-output writes state= and verdict=. A --refusal mode for the pre-credential
      categories (OVERLAY_REFUSED, SCREEN_REFUSED, ASSUME_FAILED) reads only the overlay and screen output files,
      needs no tfvars, and self-validates its body against a closed grammar (fixed header, the head sha and run link lines, the state
      line, and "REFUSED <rule-id> <path>:<line>" lines whose path passed the overlay name rule) before printing it; any other
      line fails closed.
  # ---------------------------------------------------------------- PR 3: cutover
  - file: .github/workflows/terraform-plan-trusted.yml
    action: Modify
    purpose: >-
      PR 3. Delete claims-probe, claims-probe-no-env and live-assume (the no-env probe answered: the pull_request
      subject). Keep on: pull_request_target {types [opened, synchronize, reopened], paths [terraform/personal/**]}
      and drop workflow_dispatch (the plan needs a PR); top-level permissions {}; per-PR concurrency, cancel-in-progress.
      One job, plan: if github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == 'main'; environment tf-trusted-plan; runs-on ubuntu-latest; timeout 30;
      permissions {contents: read, id-token: write, pull-requests: write, statuses: write}; job env PR_NUMBER and
      HEAD_SHA from the event and TF_VAR_aws_profile "" (event values only in env, never in a run body, predicate e);
      every non-local action pinned to a full commit SHA. Steps, in order: (1) actions/checkout, no ref/repository,
      persist-credentials false (main's commit); (2) ./.github/actions/aws-region; (3) step name "Overlay the PR's
      Terraform": python3 -I scripts/ci/trusted_plan_overlay.py; (4) step name "Screen the PR's Terraform": python3 -I
      scripts/ci/terraform_hcl_screen.py screen --root terraform/personal -- both BEFORE any credential; (5) step name
      "Assume the trusted plan role": aws-actions/configure-aws-credentials,
      role agent-platform-github-ci-trusted-plan, role-session-name tf-trusted-plan, MASK_AWS_ROLE_ID_ACCOUNT_PART
      in step env, no continue-on-error; (6) hashicorp/setup-terraform with config/terraform-version, wrapper off;
      (7) aws s3 sync of tf-provider-mirror/ into $RUNNER_TEMP/tf-mirror; (8) ./.github/actions/terraform-init-retry
      with plugin-dir $RUNNER_TEMP/tf-mirror (hermetic: -plugin-dir, -get=false, -lockfile=readonly) -- its Neon key
      preflight now runs; (9) plan: bash "$GITHUB_WORKSPACE/scripts/ci/trusted_plan_env.sh" -- bash
      "$GITHUB_WORKSPACE/scripts/ci/neon_api_key.sh" run -- bash "$GITHUB_WORKSPACE/scripts/ci/quiet_run.sh"
      "$RUNNER_TEMP/tf-plan.log" -- terraform plan -lock=false -input=false -out=plan.bin (full refresh, no
      -refresh=false, no -var-file; only Terraform's output goes to the never-printed log, so every mask the
      wrappers emit reaches the runner); then terraform show -json plan.bin through quiet_run.sh
      "$RUNNER_TEMP/tf-show.log" --stdout "$RUNNER_TEMP/plan.json" (stdout only reaches plan.json); (10) backstop: python3 -I scripts/ci/terraform_hcl_screen.py backstop; (11) guard: python3
      -I scripts/terraform_apply_guard.py on plan.json with output to a file, exit code mapped to PASS / BLOCKED /
      ERROR; (12) persist plan.bin to the data-lake bucket's tfplan/personal/<pr>/<head sha>.bin; (13) post the
      terraform-plan-digest commit status (python3 -I scripts/ci/plan_digest.py emit, then gh api with --field
      context=terraform-plan-digest in the run body, as today) on HEAD_SHA, context and description shape unchanged
      (Decision 77, fetch-saved-plan unchanged); (13b) if PLAN-pr-plan-opaque-iam-policy-check has merged: its
      plan-time policy check, python3 -I scripts/ci/plan_time_policy_check.py "$RUNNER_TEMP/plan.json", with the
      digest step's exact if: and no continue-on-error (validate_plan_time_policy_check_wiring requires this in every
      job that posts the digest; its output is a fixed line plus key-stripped addresses, so names-only holds); (14a) refusal comment, if: always() and
      the overlay step ran and the assume step did not succeed (a job that fails before the overlay posts no comment):
      python3 -I scripts/ci/terraform_personal_plan_report.py --refusal with the category (OVERLAY_REFUSED,
      SCREEN_REFUSED or ASSUME_FAILED), no credential and no tfvars, body self-validated
      by the closed grammar, then gh pr comment; (14b) plan comment, if: always() and the assume step succeeded: BODY=$(
      bash trusted_plan_env.sh --scrub-only -- python3 -I scripts/ci/terraform_personal_plan_report.py ...) with the
      category of the first failing step or the plan result, then printf the body into python3 -I
      scripts/ci/redaction_check.py assert-clean (which prints nothing on success), and only on exit 0 gh pr comment
      --body "$BODY" (today's build-assert-post order, terraform-apply-sandbox.yml:731-736). Steps 12-13 run when 9-10
      succeed, whatever the guard's verdict (PASS, BLOCKED or ERROR), as today: the guard step maps its exit code and
      never fails, a BLOCKED plan is persisted and its digest posted, and the merge-time guard re-run on the saved
      plan is authoritative. No plan text, plan JSON or log file is
      uploaded as an artifact or printed. The job fails (red, advisory, never a
      required check, Decision 83) on any refusal or error. Header comment: Decision 238, the PR is data, names only;
      no LLM runs here (Decision 205 cl.2); provider or lockfile changes and new resource types apply by dispatch.
      Stays under the 500-effective-line ci_workflows default (Decision 166).
