  - "Contract wording is the approved text (speculative_plan_job row) or, once Benjamin gives his word, the Addendum text; allowed variance is whitespace, YAML folding and amendment_log row fields"
  - No rescue agents or workaround loops (Decision 55); out-of-scope bugs become recs via scripts.ops_data_portal
