  - IMPLEMENTATION only (Decision 67); four PRs in order (1, then 2, then 3, then 4); PR 2 may open while PR 1 waits for a merge window
  - "PRs 2 and 3 touch nothing under terraform/personal (no saved plan could exist for them); PR 1 and PR 4 are the only terraform/personal PRs"
  - "ADMIN container never bypasses CI deploys; the only admin-credential use is VP 16's read-only get-role-policy probe"
  - No LLM in the trusted workflow (Decision 205 cl.2, Decision 238 cl.3); the advisory reviewer is deferred to rec-4728
  - "The trusted job never executes PR content, never prints a value, instance key, plan text or diagnostic text, and never stores plan JSON (Decision 238 cl.4, Decision 101)"
