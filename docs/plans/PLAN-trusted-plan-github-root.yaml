infrastructure_dependencies:
  - "S3 landed (#1764, 531c2394): the screen, lexer, overlay, quiet_run.sh, plan_names_core and the tf-trusted-plan environment (main-only policy, no reviewers) exist."
  - "Provider mirror: tf-provider-mirror/ holds aws and neon only today; PR 1's seed dispatch adds integrations/github 6.12.1 (terraform/github/.terraform.lock.hcl). The dispatch is CI on main under the apply role and writes only public provider files."
  - "terraform/bootstrap (PR 2): admin-only root; pre-merge read-only ADMIN plan (deploy-paths.yaml admin_out_of_band.pre_merge_live_plan), then a human-directed admin apply on Benjamin's word on the exact command. Never merged-but-unapplied alongside another bootstrap change (project rule, 2026-10-26)."
  - "terraform/personal (PR 3): the role CREATE routes to tf-gated-apply (Decision 144 cl.4); Benjamin approves the environment gate. PR 5's policy-only removal auto-applies under the guard (Decision 92 pt 5)."
  - "GitHub (operator, UI): before PR 4 merges, a new plan App private key stored as tf-trusted-plan environment secret TF_GITHUB_PLAN_APP_PRIVATE_KEY; after PR 5's canary is green, the repository secret of that name and the old App key are deleted. Secret values are out-of-band (Decision 237)."
  - "terraform/github is never applied by this plan: PR 1's token move and PR 5's description edit change no state."
  - "approved-text Environment (Decision 246): declared on main by #1876 (terraform/github/environments.tf), live only after the operator's terraform/github hand apply; probe 2026-11-06 (approved_text_github approvals on the three green approval runs of that day): no approval recorded, so it has no required reviewer yet. Before PR 5 starts, a plan amendment adds the sidecar and Benjamin approves it on that gate; if the gate is still not live, PR 5 waits."
acceptance_criteria:
  - "A same-repo terraform/github PR gets its PR-time plan only from main's terraform-github-plan.yml on pull_request_target in tf-trusted-plan, under agent-platform-github-ci-trusted-github-plan"
  - "The PR's terraform/github files are screened before any credential exists; main.tf and the lockfile always come from main; a refused PR gets a names-only refusal and no plan"
  - "The new role can read only tfstate/github/terraform.tfstate and the provider mirror (plus a list scoped to the mirror prefix); it reaches no secret value, no tfplan/ and no terraform/personal state"
  - "Init is hermetic from the mirror with main's lockfile; the plan's output and diagnostics stay in a private runner log; the PR comment carries names only, and every body (refusal or plan) is built, checked by terraform_github_plan_comment.py assert-clean, then posted"
  - "The plan App key is readable only by jobs in the tf-trusted-plan environment; no repository secret of that name remains (on the operator's word, VP 17: a re-run cannot prove absence, because an environment secret shadows a repository secret of the same name); no forward-standing contract text places the key in a repository secret (VP 25)"
  - "agent-platform-github-ci-trusted-plan holds no tfstate/github grant; its dormant terraform-github-plan.yml trust entry is pinned and handed to rec-4640 (hand-off read back from rec-4640's context, 2026-11-06)"
  - "The planner's TfstateGithubRead has no consumer after PR 4 and is handed to rec-4640 for removal with the PR-sub trust statement (read back from rec-4640's context, 2026-11-06); it stays pinned exactly by TestPlannerStateGrant until then"
  - "PR 5 carries the Decision 238 Update and the four contract edits (three contracts) exactly as the approved-text sidecar binds them, and rec-4638 is closed by PR 5's Resolves trailer (VP 22, VP 23)"
verification_plan:
  - step: 1
    phase: pre-deploy
    action: The per-root screen accepts both roots on main and refuses every banned construct, including each import shape
    command: bin/venv-python -m pytest tests/test_terraform_hcl_screen.py::TestGithubRoot -q
    expected: all pass (red before, the TestGithubRoot class is absent); the whole file stays green; real tree green for both roots
    fix_if: a real-tree failure -- fix the policy row or lexer, never loosen a refusal rule without the planner
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      Duplicate: the standing graduated check trusted-plan-screen already runs the whole file
      tests/test_terraform_hcl_screen.py, so TestGithubRoot is guarded once it lands; a narrower row under that id would
      weaken it (Decision 235).
  - step: 2
