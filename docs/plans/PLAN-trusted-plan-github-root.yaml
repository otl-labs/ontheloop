    action: Create
    purpose: >-
      PR 4. Stdlib-only, code-owned comment gate for the github job, run by path with python3 -I (no repo imports, so
      nothing to resolve). `refusal --category CAT --head-sha SHA --run-url URL --overlay-file F --screen-file F`: CAT
      must be one of the eleven categories (else a fixed message, exit 2, nothing printed); the body is a fixed header
