schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "trusted-plan-github-root"
intent: >-
  Move the terraform/github PR-time plan (terraform-github-plan.yml) off the planner's PR-sub session and the PR's own
  workflow text onto main's trusted workflow on pull_request_target, the pattern S3 built for terraform/personal. The PR's
  terraform/github files are screened as data before any credential exists, init is hermetic from the provider mirror,
  the job runs under a new per-root role that can read only this root's state and the mirror, the plan App key moves to a
  tf-trusted-plan environment secret, and the PR sees names only. Slice S5 of the trusted plan executor (rec-4638),
  realising Decision 238 cl.1-cl.4 for terraform/github.
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-trusted-plan-github-root.yaml
phase: >-
  ad_hoc_rec (soft-warn category; no tier_item claimed, so the Tier Item Freshness Gate is skipped). Executes rec-4638.
scope:
  # ---------------------------------------------------------------- PR 1: per-root screen and overlay, token move, mirror seed
  - file: scripts/ci/terraform_hcl_screen_policy.py
    action: Create
    purpose: >-
      PR 1. Stdlib-only, code-owned policy table keyed by root path, the one place each root's screen constants live.
      Row terraform/personal holds today's constants moved verbatim from terraform_hcl_screen.py (MAIN_ONLY_FILES,
      ALLOWED_DATA_TYPES, ALLOWED_RESOURCE_TYPES, ALLOWED_FUNCTIONS, VALIDATION_ONLY_FUNCTIONS, ALLOWED_FILE_PATHS,
      TOP_LEVEL_BLOCKS), plus backstop_providers {aws, neon}, imports_allowed False and config_files (the overlay's two
      config YAMLs). Row terraform/github: main_only_files {main.tf, .terraform.lock.hcl}; data types none; resource types
      exactly the github_* types main declares at build time (six on 2026-11-06: github_repository,
      github_repository_ruleset, github_actions_repository_permissions, github_workflow_repository_permissions,
      github_repository_environment, github_repository_environment_deployment_policy; re-derive from main), never
      github_actions_variable, github_actions_secret, github_actions_environment_secret, github_actions_environment_variable,
      github_repository_webhook or github_repository_deploy_key; functions the minimum main uses (the type constructor
      `list` and validation-only `length`), no file() and no file paths; TOP_LEVEL_BLOCKS plus `import`;
      backstop_providers {github}; imports_allowed True; config_files none. An unknown root has no row and is refused.
  - file: scripts/ci/terraform_hcl_screen.py
    action: Modify
    purpose: >-
      PR 1. Every rule reads its constants from the policy row of the root being screened (screen --root DIR selects the
      row by DIR's repo-relative path; an unknown root prints REFUSED unknown_root and exits 1). New import rule, applied
      only where imports_allowed: an `import` block has exactly `to` and `id`; `to` names an allowlisted resource type of
      the row; `id` is a string literal or a template whose interpolations are only `var.<name>` references, contains
      `var.repository_name`, never names `var.github_token`, and calls no function (refusal rule import_shape). Backstop
      gains an optional `--root DIR` (default terraform/personal, so terraform-plan-trusted.yml needs no edit): the
      provider_config set is the row's backstop_providers, and the `importing` refusal applies only where imports_allowed is
      False; where imports are allowed, an importing resource change must target an allowlisted type. Module stays under its
      SLOC budget (Decision 128): the constants leave this file.
    new_imports: [scripts.ci.terraform_hcl_screen_policy]
  - file: scripts/ci/trusted_plan_overlay.py
    action: Modify
    purpose: >-
      PR 1. The overlaid root comes from env OVERLAY_ROOT (default terraform/personal); it must name a policy row, else
      OVERLAY_REFUSED unknown_root. PERSONAL and CONFIG_FILES become the row's path, main_only_files and config_files.
      Every other rule (merge-ref parents, base ancestry, flat tree, file names, modes, .git files, main-only files changed)
      is unchanged and applies per root.
  - file: scripts/checks/ci_guards/validate_trusted_plan_screen.py
    action: Modify
    purpose: >-
      PR 1. Screens every policy row's root on main (terraform/personal and terraform/github), so main always passes its
      own screen for both roots; failure lines name the root. registry.examined counts files across both roots.
    new_imports: [scripts.ci.terraform_hcl_screen_policy]
  - file: scripts/checks/ci_guards/_manifest.py
    action: Modify
    purpose: >-
      PR 1. validate_trusted_plan_screen's pre_globs gain terraform/github/** and scripts/ci/terraform_hcl_screen_policy.py.
      PR 4: validate_trusted_plan_environment's pre_globs gain scripts/ci/terraform_github_plan_report.py and
      scripts/ci/provider_mirror_seed.sh if absent.
  - file: terraform/github/main.tf
    action: Modify
    purpose: >-
      PR 1. Receives variable "github_token" moved verbatim from variables.tf (sensitive, ephemeral, its validation and
      description), so a PR cannot drop ephemeral = true or change its validation; header gains one line: this file is
      main-only for the trusted PR-time plan (terraform-github-plan.yml), and no other file in this root may declare a
      terraform, provider or backend block (Decision 238 cl.3). No resource changes: the old job's plan is a no-op.
  - file: terraform/github/variables.tf
    action: Modify
    purpose: PR 1. Remove variable "github_token" (now in main.tf). github_owner, repository_name and every other variable stay.
  - file: scripts/checks/contracts/validate_github_org_transfer.py
    action: Modify
    purpose: >-
      PR 1. Its terraform_github_root evaluation keeps reading main.tf, variables.tf and imports.tf (_TFG_FILES); the
      "no credential variable defaults non-null" clause covers variable blocks in main.tf too. No other predicate changes.
  - file: scripts/ci/provider_mirror_seed.sh
    action: Create
    purpose: >-
      PR 1. The seed workflow's mirror, assert and publish logic as one script (touch-it-fix-it: the three inline bodies
      cannot grow without a raise marker, composite_action_body_baseline.yaml header). set -euo pipefail. Args: mirror
      dir, S3 prefix. Runs terraform providers mirror (linux_amd64 only, as today) for terraform/personal and the same for
      terraform/github into the SAME dir (no init needed for providers mirror), asserts a package file exists under both
      registry.terraform.io/kislerdm/neon and registry.terraform.io/integrations/github (MIRROR_MISSING_NEON /
      MIRROR_MISSING_GITHUB, exit 1, nothing published), then one `aws s3 sync DIR s3://<bucket>/<prefix>/ --delete`.
      Prints the mirrored file list (public provider bytes).
  - file: .github/workflows/terraform-provider-mirror-seed.yml
    action: Modify
    purpose: >-
      PR 1. The three inline steps (mirror, assert, publish) become one step that runs
      `bash scripts/ci/provider_mirror_seed.sh "$MIRROR_DIR" "$MIRROR_PREFIX"`; the init step stays (terraform/personal's
      backend init is harmless and keeps the existing proven shape); header names both roots. Trigger, role and
      permissions unchanged.
  - file: config/composite_action_body_baseline.yaml
    action: Modify
    purpose: >-
      PR 1: the seed workflow's mirror/assert/publish entries are removed and the one new step registered at its measured
      count (a decrease). PR 4: every terraform-github-plan.yml entry is replaced by the rewritten job's measured entries
      (new keys registered without markers; none may exceed its measured count). Edit entries by key, never by line.
  - file: .github/CODEOWNERS
    action: Modify
    purpose: >-
      PR 1. Add /scripts/ci/terraform_hcl_screen_policy.py, /scripts/ci/terraform_github_plan_report.py and
      /scripts/ci/provider_mirror_seed.sh beside the rec-4637 block, under a "rec-4638" comment line. If PR #1888
      (terraform-github-gated-apply) has added the reporter line first, keep one line.
  - file: tests/test_terraform_hcl_screen.py
    action: Modify
    purpose: >-
      PR 1. Existing personal cases unchanged (the personal row is a verbatim move). New: terraform/github real tree green;
      github red cases for a non-allowlisted github type, each excluded secret-bearing type, a data block, a provider or
      terraform block outside main.tf, file(), each import_shape violation (function call in id, id without
      var.repository_name, id naming var.github_token, `to` of a non-allowlisted type, an extra argument), and an unknown
      root; backstop red cases for a github plan whose provider_config is not {github}, and for an importing change of a
      non-allowlisted type; personal backstop still refuses any importing change.
  - file: tests/test_trusted_plan_overlay.py
    action: Modify
    purpose: >-
      PR 1. Existing cases unchanged with OVERLAY_ROOT unset. New: OVERLAY_ROOT=terraform/github overlays only that root,
      restores main.tf and the lockfile from main, refuses a PR that changes main.tf (main_only_file_changed), and an
      unknown root is refused.
  - file: tests/checks/ci_guards/test_validate_trusted_plan_screen.py
    action: Modify
    purpose: PR 1. Real tree green over both roots; a synthetic terraform/github red case fails the check naming that root.
  - file: tests/test_provider_mirror_seed.py
    action: Create
    purpose: >-
      PR 1. Static and stubbed-run guards: bash -n; set -euo pipefail; both roots mirrored into the one dir before the
      single --delete sync; the sync never runs when either assert fails (stub terraform and aws on PATH, assert the aws
      stub is not called and the exit is 1 with the MIRROR_MISSING_* line); the workflow's step calls the script with the
      two env values.
  - file: tests/checks/contracts/test_validate_github_org_transfer.py
    action: Modify
    purpose: >-
      PR 1. A red case where main.tf declares a credential variable with a non-null default; the real tree stays green
      with github_token in main.tf. Graduated shards github-org-transfer-evaluator-tests and
      github-org-transfer-terraform-github-root-row are kept unchanged (their classes keep their names).
  # ---------------------------------------------------------------- PR 2: bootstrap IAMRolesRead pre-add (admin root)
  - file: terraform/bootstrap/github_ci_apply_reads.tf
    action: Modify
    purpose: >-
      PR 2. IAMRolesRead gains role/agent-platform-github-ci-trusted-github-plan beside the trusted-plan entry, with the
      same "pre-staged ahead of the role's own creation" comment (Decision 98 pt 4 order: this applies before PR 3 merges).
      Nothing else in the file changes.
  - file: tests/checks/iam_tf/test_trusted_github_plan_identity.py
    action: Create
    purpose: >-
      PR 2 creates it with the bootstrap pre-add case (IAMRolesRead names the new role); PR 3 adds the role cases (see the
      PR 3 row). Named mirror of S2's test_trusted_plan_identity.py.
  # ---------------------------------------------------------------- PR 3: the per-root role (terraform/personal, tf-gated-apply)
  - file: terraform/personal/oidc_trusted_github_plan_role.tf
    action: Create
    purpose: >-
      PR 3. aws_iam_role.github_ci_trusted_github_plan, name agent-platform-github-ci-trusted-github-plan, permissions
      boundary agent-platform-github-ci-apply-boundary (Decision 144 cl.3). Trust ONE statement, StringEquals only: aud
      sts.amazonaws.com; sub flatten over local.github_repos of "repo:<repo>:environment:tf-trusted-plan" (reuse
      local.trusted_plan_environment); job_workflow_ref exactly
      ["otl-labs/ontheloop/.github/workflows/terraform-github-plan.yml@refs/heads/main"]. Inline policy from
      data.aws_iam_policy_document.github_ci_trusted_github_plan, three statements and no source documents:
      TfstateGithubRead (s3:GetObject on tfstate/github/terraform.tfstate), ProviderMirrorRead (s3:GetObject on
      tf-provider-mirror/*), BucketListScoped (s3:ListBucket on the data-lake bucket, StringLike s3:prefix
      ["tf-provider-mirror/*"], for the mirror sync only; reading this root's state needs no list). Lifecycle precondition: minified policy <= 10,240 B (rec-2793 pattern).
      Header: Decision 238 and its rec-4638 Update; the CREATE routes to tf-gated-apply (Decision 144 cl.4); later trust
      edits are admin split-applies (Decision 223 cl.4).
  - file: terraform/personal/oidc.tf
    action: Modify
    purpose: >-
      PR 3. The ci_full_refresh_read IAM role-read list (beside the trusted-plan ARN, :189-190) gains
      role/agent-platform-github-ci-trusted-github-plan, so the planner and the trusted plan role can refresh the new role.
      The role-map comment at :11 gains one line for the new role.
  - file: scripts/checks/iam_tf/validate_policy_document_plan_time_refs.py
    action: Modify
    purpose: PR 3. REQUIRED_DOCUMENTS gains github_ci_trusted_github_plan.
  - file: tests/checks/iam_tf/test_trusted_github_plan_identity.py
    action: Modify
    purpose: >-
      PR 3. Real-HCL cases: exactly one trust statement with exactly the three keys and values above (no StringLike, no
      pull_request or refs/pull or ref sub); boundary set; the policy holds exactly the three statements, no secretsmanager:,
      ssm:, tfplan/, tfstate/personal or Put/Delete action; ListBucket carries the prefix condition; the role is in the
      ci_full_refresh_read role list. Red cases on synthetic text for each.
  - file: tests/checks/iam_tf/test_trusted_plan_identity.py
    action: Modify
    purpose: >-
      PR 3. Pins agent-platform-github-ci-trusted-plan's job_workflow_ref list as exactly the two current values (F2-A: the
      terraform-github-plan.yml entry stays until rec-4640's admin split-apply, which must edit this pin). No assertion is
      loosened. Graduated shard trusted-plan-identity is kept unchanged.
  - file: docs/DECISIONS.md
    action: Modify
    purpose: >-
      PR 3. Append the approved dated Update to Decision 238 (exact text in context: Approved wording), dated the build
      date; regenerate docs/decisions-index.json. No clause text changes.
  - file: docs/decisions-index.json
    action: Modify
    purpose: PR 3. Regenerated by the repo's index generator after the Decision 238 Update.
  # ---------------------------------------------------------------- PR 4: cutover (workflows, checks, contracts)
  - file: .github/workflows/terraform-github-plan.yml
    action: Modify
    purpose: >-
      PR 4. Rewritten on the terraform-plan-trusted.yml pattern. on: pull_request_target, types [opened, synchronize,
      reopened], paths ['terraform/github/**'] only (the workflow and reporter self-paths go: under pull_request_target they
      run main's text). permissions: {} at top; concurrency per PR, cancel-in-progress. Job plan: if same-repo head AND base
      main AND github.actor != 'dependabot[bot]'; environment tf-trusted-plan; permissions contents read, id-token write,
      pull-requests write; timeout 15. Steps, every non-local uses: pinned to a 40-hex SHA with a version comment:
      checkout (no ref, persist-credentials false); aws-region; config check (APP_CLIENT_ID, key set, reviewer logins;
      CONFIG_MISSING names only); overlay (OVERLAY_ROOT=terraform/github, python3 -I by path, tee to RUNNER_TEMP);
      screen (screen --root terraform/github); assume agent-platform-github-ci-trusted-github-plan, role-session-name
      tf-trusted-github-plan, fails loudly; mint the plan App token (create-github-app-token, owner and
      repositories: the running repository's name, the three read permissions; the key is the tf-trusted-plan
      environment secret TF_GITHUB_PLAN_APP_PRIVATE_KEY); reviewer ids to a RUNNER_TEMP file (as today); terraform
      version; setup-terraform; mirror sync (aws s3 sync of tf-provider-mirror/ to RUNNER_TEMP); init via
      terraform-init-retry with plugin-dir and the region backend config (the composite's backend-config input or a
      RUNNER_TEMP file holding region=<config/aws-region>); plan -lock=false -input=false -out=plan.bin through
      quiet_run.sh into a private RUNNER_TEMP log, token and reviewer ids as process env only; show -json through
      quiet_run.sh into RUNNER_TEMP/plan.json; backstop --root terraform/github; visibility probe (booleans only, as
      today); report (terraform_github_plan_report.py, names only); one post step choosing the refusal category
      (OVERLAY_REFUSED, SCREEN_REFUSED, ASSUME_FAILED, INIT_FAILED, PLAN_FAILED, BACKSTOP_REFUSED) or the report, never
      diagnostic text; fail on destroy or replace; delete plan files always. No step persists plan.bin or plan.json, no
      tfvars wrapper (this root has none), no apply. No `${{ github.event.pull_request.* }}` inside any run body (env
      only). Header rewritten: Decision 238 and rec-4638, the role, the environment secret, no LLM, never workflow_call,
      the residual about a same-repo PR reading the App key removed, the stale "plan.bin carries the App token" claim
      removed (the token is ephemeral). Keep the reporter's CLI and classify() interface unchanged (PR #1888's gate
      imports it).
  - file: scripts/checks/ci_guards/validate_trusted_plan_environment.py
    action: Modify
    purpose: >-
      PR 4. terraform-github-plan.yml becomes a governed pull_request_target file under predicates (d)-(i) like
      terraform-plan-trusted.yml. New predicate (j) role partition: terraform-github-plan.yml names only
      agent-platform-github-ci-trusted-github-plan and never agent-platform-github-ci-trusted-plan or the planner;
      terraform-plan-trusted.yml never names the github role; no other workflow names either trusted role. New predicate
      (k): terraform-github-plan.yml reads TF_GITHUB_PLAN_APP_PRIVATE_KEY only in a job that declares tf-trusted-plan.
      Module docstring lists (j) and (k). If the module passes its SLOC budget, split predicates into a sibling module
      behind the same check (Decision 128), never raise.
    new_imports: []
  - file: tests/checks/ci_guards/test_validate_trusted_plan_environment.py
    action: Modify
    purpose: >-
      PR 4. Red cases for (j) (each wrong-role pairing) and (k) (key read in a job without the environment); the real tree
      green with the rewritten workflow. Graduated shard trusted-plan-environment-fence is kept unchanged.
  - file: tests/checks/ci_guards/test_terraform_github_plan_trusted.py
    action: Create
    purpose: >-
      PR 4. rec-4638's acceptance target. test_real_github_plan_workflow_has_the_trusted_shape asserts on the real file:
      trigger pull_request_target with the three types and paths ['terraform/github/**'] only; top-level permissions {};
      the job if carries the same-repo, base-main and Dependabot gates; environment tf-trusted-plan; the step order
      overlay -> screen -> assume -> mint -> init -> plan -> show -> backstop -> report; the assumed role and session
      name; repositories: on the token mint; plan and show wrapped by quiet_run.sh; no step uploads, copies to S3 or
      runs apply; every uses: SHA-pinned. Plus red cases on synthetic workflow text for each shape rule.
  - file: tests/test_terraform_github_plan_workflow.py
    action: Create
    purpose: >-
      PR 4 (SLOC relief: tests/test_terraform_github_pr_plan.py is at 499 of 500). Receives class TestWorkflowAndTaxonomy
      moved from tests/test_terraform_github_pr_plan.py and rewritten for the pull_request_target shape (Decision 235
      named rewrites, listed in context): test_triggers_exact (pull_request -> pull_request_target, self-paths dropped), test_guard_and_permissions
      (adds environment and the Dependabot gate), test_aws_credentials_step (planner PR-sub -> the new role),
      test_app_token_step (adds repositories:), test_plan_and_probe_flags (quiet_run.sh wrapper);
      test_nothing_mutating_or_persisted, test_reviewer_ids_never_in_step_env, test_not_a_required_check,
      test_taxonomy_row (gains an assertion on "rec-4638"), test_admin_root_gate_does_not_derive_github and
      test_claude_md_pointer keep their assertions.
  - file: tests/test_terraform_github_pr_plan.py
    action: Modify
    purpose: >-
      PR 4: TestWorkflowAndTaxonomy and its now-unused imports and constants move out (to
      tests/test_terraform_github_plan_workflow.py). PR 5: see the PR 5 row. TestPlannerStateGrant and TestPlanReport are
