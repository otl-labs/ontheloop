schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "trusted-plan-github-root"
intent: >-
  Move the terraform/github PR-time plan (terraform-github-plan.yml) off the planner's PR-sub session and the PR's own
  workflow text onto main's trusted workflow on pull_request_target, the pattern S3 built for terraform/personal. The PR's
  terraform/github files are screened as data before any credential exists, init is hermetic from the provider mirror,
  the job runs under a new per-root role that can read only this root's state and the mirror, the plan App key moves to a
  tf-trusted-plan environment secret, and the PR sees names only. Slice S5 of the trusted plan executor (rec-4638),
  realising Decision 238 cl.1-cl.4 for terraform/github.
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-trusted-plan-github-root.yaml
phase: >-
  ad_hoc_rec (soft-warn category; no tier_item claimed, so the Tier Item Freshness Gate is skipped). Executes rec-4638.
scope:
  # ---------------------------------------------------------------- PR 1: per-root screen and overlay, token move, mirror seed
  - file: scripts/ci/terraform_hcl_screen_policy.py
    action: Create
    purpose: >-
      PR 1. Stdlib-only, code-owned policy table keyed by root path, the one place each root's screen constants live.
      Row terraform/personal holds today's constants moved verbatim from terraform_hcl_screen.py (MAIN_ONLY_FILES,
      ALLOWED_DATA_TYPES, ALLOWED_RESOURCE_TYPES, ALLOWED_FUNCTIONS, VALIDATION_ONLY_FUNCTIONS, ALLOWED_FILE_PATHS,
      TOP_LEVEL_BLOCKS), plus backstop_providers {aws, neon}, imports_allowed False, import_id_vars empty and config_files (the overlay's two
      config YAMLs). Row terraform/github: main_only_files {main.tf, .terraform.lock.hcl}; data types none; resource types
      exactly the github_* types main declares at build time (six on 2026-11-06: github_repository,
      github_repository_ruleset, github_actions_repository_permissions, github_workflow_repository_permissions,
      github_repository_environment, github_repository_environment_deployment_policy; re-derive from main), never
      github_actions_variable, github_actions_secret, github_actions_environment_secret, github_actions_environment_variable,
      github_repository_webhook or github_repository_deploy_key; functions the minimum main uses (the type constructor
      `list` and validation-only `length`), no file() and no file paths; TOP_LEVEL_BLOCKS plus `import`;
      backstop_providers {github}; imports_allowed True; import_id_vars {repository_name, main_protection_ruleset_id,
      tf_trusted_plan_main_policy_id} (re-derived from main's imports.tf); config_files none. An unknown root has no row
      and is refused.
  - file: scripts/ci/terraform_hcl_screen.py
    action: Modify
    purpose: >-
      PR 1. Every rule reads its constants from a policy row. `screen --root DIR` gains `--policy ROW` (default
      terraform/personal, so terraform-plan-trusted.yml and the existing CLI test need no edit; screen_root(path,
      policy=...) the same); an unknown ROW prints REFUSED unknown_root and exits 1. The module keeps module-level aliases
      of the personal row's constants (MAIN_ONLY_FILES, ALLOWED_FILE_PATHS and the rest; DOC_FILES stays here, shared),
      so trusted_plan_overlay.py and the existing tests keep resolving them. New import rule, applied only where
      imports_allowed: an `import` block has exactly `to` and `id`; `to` names an allowlisted resource type of the row;
      `id` is a bare `var.repository_name` reference, a string literal, or a template that contains
      `var.repository_name` and whose interpolations are only references to the row's import_id_vars, exactly the
      variables main's imports.tf interpolates (repository_name, main_protection_ruleset_id and
      tf_trusted_plan_main_policy_id on 2026-11-06; re-derive from main); it calls no function, and a job-fed variable
      (github_token, gated_apply_reviewer_user_ids, or any variable the workflow sets through TF_VAR_) is never in that
      set (refusal rule import_shape; main's imports.tf uses the bare form and the template form). A string literal is
      safe because PR-authored text carries no job value; only an interpolation of a job-fed variable could pull one into
      an import-read request, hence the closed name set (the policy row gains import_id_vars). Backstop gains the same optional `--policy ROW` (`backstop --plan-json F --policy ROW`, default
      terraform/personal; one selector flag for both subcommands): the provider_config set is the row's backstop_providers, and the
      `importing` refusal applies only where imports_allowed is False; where imports are allowed, an importing resource
      change must target an allowlisted type. Module stays under its SLOC budget (Decision 128): the constants leave this
      file, the aliases are one line each.
    new_imports: [scripts.ci.terraform_hcl_screen_policy]
  - file: scripts/ci/trusted_plan_overlay.py
    action: Modify
    purpose: >-
      PR 1. The overlaid root comes from env OVERLAY_ROOT (default terraform/personal); it must name a policy row, else
      OVERLAY_REFUSED unknown_root. PERSONAL and CONFIG_FILES become the row's path, main_only_files and config_files.
      Every other rule (merge-ref parents, base ancestry, flat tree, file names, modes, .git files, main-only files changed)
      is unchanged and applies per root.
  - file: scripts/checks/ci_guards/validate_trusted_plan_screen.py
    action: Modify
    purpose: >-
      PR 1. Screens every policy row's root on main (terraform/personal and terraform/github), so main always passes its
      own screen for both roots; failure lines name the root. registry.examined counts files across both roots.
    new_imports: [scripts.ci.terraform_hcl_screen_policy]
  - file: scripts/checks/ci_guards/_manifest.py
    action: Modify
