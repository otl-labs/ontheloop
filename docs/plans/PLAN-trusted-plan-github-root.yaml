  - file: docs/contracts/github-org-transfer.yaml
    action: Modify
    purpose: >-
      PR 4. breakage_map.terraform_github_plan_app.locations: "repository secrets (App private key)" becomes
      "tf-trusted-plan environment secret (App private key)". Dated amendment_log row (governance_note_add).
  - file: docs/contracts/account-credential-inventory.yaml
    action: Modify
    purpose: >-
      PR 4. GH-09 location: "repository secret TF_GITHUB_PLAN_APP_PRIVATE_KEY" becomes "tf-trusted-plan environment secret
      TF_GITHUB_PLAN_APP_PRIVATE_KEY". Dated amendment_log row (governance_note_add).
  - file: config/agent/verification_registry/entries/terraform-github-plan-workflow-wiring.yaml
    action: Modify
    purpose: PR 4. node_id re-pointed from tests/test_terraform_github_pr_plan.py::TestWorkflowAndTaxonomy to tests/test_terraform_github_plan_workflow.py::TestWorkflowAndTaxonomy (the class moved); check_id unchanged.
  # ---------------------------------------------------------------- PR 5: canary and the shared role's grant removal
  - file: terraform/github/variables.tf
    action: Modify
    purpose: >-
      PR 5 (canary). One description edit on a non-main-only variable (for example main_protection_ruleset_id's "Re-read it
