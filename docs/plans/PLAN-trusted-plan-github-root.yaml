  - file: scripts/ci/provider_mirror_seed.sh
    action: Create
    purpose: >-
      PR 1. The seed workflow's mirror, assert and publish logic as one script (touch-it-fix-it: the three inline bodies
      cannot grow without a raise marker, composite_action_body_baseline.yaml header). set -euo pipefail. Args: mirror
      dir, S3 prefix. The prefix must equal tf-provider-mirror exactly (the seed role holds bucket-wide DeleteObject, so a
      --delete sync to any other prefix could erase tfstate/ or tfplan/); any other value, or a missing or extra argument,
      exits 2 with SEED_BAD_ARGS before any terraform or aws call. Runs terraform providers mirror (linux_amd64 only, as
      today) for terraform/personal (initialized by the workflow's existing init step) and, after `terraform
      -chdir=terraform/github init -backend=false -input=false -lockfile=readonly` (providers mirror reads the lock file
      only in an initialized directory, and readonly fails rather than rewrite it), the same for terraform/github into
      the SAME dir, asserts that a linux_amd64 package of the
      exact locked version exists for every provider either root's .terraform.lock.hcl names (today hashicorp/aws and
      kislerdm/neon from terraform/personal, integrations/github from terraform/github; read from the lockfiles, never a
      hardcoded list), else `MIRROR_MISSING <address> <version>`, exit 1, nothing published (this also closes the
      pre-existing gap that a missing aws package was never asserted before the --delete sync), then one `aws s3 sync DIR
      s3://agent-platform-data-lake/tf-provider-mirror/ --delete`. Prints the mirrored file list (public provider bytes).
