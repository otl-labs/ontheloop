      both grammar-checked), "State: CAT", and for OVERLAY_REFUSED or SCREEN_REFUSED only the file lines that fully
      match the overlay grammar `OVERLAY_REFUSED <rule> [<path>]` or the screen grammar `REFUSED <rule> <file>:<line>`
      (re-rendered from the matched groups, the same grammar as terraform_personal_plan_report.py's refusal mode); every
      other line is dropped; the finished body is validated against a closed line grammar before printing (fail
      closed). `assert-clean --values-file F`: reads the body on stdin; exit 1 with a fixed message naming only the
      rule if the body holds a GitHub token shape (gh[pousr]_ or github_pat_ prefixes), a PEM marker, the App client id
      (env APP_CLIENT_ID), the AWS account id (env AWS_ACCOUNT_ID, exact value), the role-id account part (env
      AWS_ROLE_ID_ACCOUNT_PART, exact value) or any reviewer id from F's JSON list, each as a whole token; else exit 0, printing nothing. F absent means no ids were resolved yet (every refusal
      before the reviewer-ids step), so the id list is empty; this is safe because the ids exist only in that file. F
      present but unreadable or not a JSON list of integers exits 1 (fail closed). An empty APP_CLIENT_ID or
      AWS_ACCOUNT_ID or AWS_ROLE_ID_ACCOUNT_PART value is skipped for that rule only. This
      replaces redaction_check.py assert-clean, whose scrub pairs come from terraform/personal's tfvars, which this role
      cannot read (its empty-account guard would always fail). Under 150 SLOC.
