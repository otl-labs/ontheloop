constraints:
  - IMPLEMENTATION only (Decision 67); five PRs in order (1, 2, 3, 4, 5); PR 2 never merged-but-unapplied beside another terraform/bootstrap change
  - "PR 4 touches nothing under terraform/github (no plan job would produce a plan for it); PR 1 and PR 5 are the only terraform/github PRs, PR 3 and PR 5 the only terraform/personal PRs"
  - "ADMIN container never bypasses CI deploys; admin credentials only for VP 7 and VP 20 (identity check and read-only plan), VP 8 (the bootstrap apply, on Benjamin's word on the exact command), VP 11 and VP 16 (read-only)"
  - No LLM in the trusted workflow (Decision 205 cl.2, Decision 238 cl.3)
  - "The trusted job never executes PR content, never prints a value, id, plan text or diagnostic text, and never stores plan.bin or plan.json (Decision 238 cl.4, Decision 101)"
  - "No trust edit on an existing role (Decision 223 cl.4); the shared role's dormant terraform-github-plan.yml entry leaves in rec-4640's admin split-apply"
  - "Wording (the Decision 238 Update, the four contract edits and their amendment_log rows) ships only in PR 5 and exactly as docs/plans/approved/trusted-plan-github-root.yaml binds it, a sidecar added by plan amendment and approved on the approved-text gate before PR 5 starts; allowed variance: whitespace, line wrapping and the filled {{DATE}} (Decision 246 cl.2). The build never adds or edits the sidecar"
  - "implementation_declared flips only in PR 5 (the declaring PR carries the sidecar-bound text and the Resolves trailer; validate_merge_step reads the sidecar at PR 5's base); PRs 1-4 never set it"
  - No rescue agents or workaround loops (Decision 55); out-of-scope bugs become recs via scripts.ops_data_portal
