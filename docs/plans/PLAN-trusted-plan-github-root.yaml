    action: The overlay takes only the selected root from the merge tree and refuses main-only changes per root
    command: bin/venv-python -m pytest tests/test_trusted_plan_overlay.py::TestGithubRoot -q
    expected: all pass; the whole file stays green
    fix_if: fix the overlay script
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      Duplicate: the standing graduated check trusted-plan-overlay already runs the whole file
      tests/test_trusted_plan_overlay.py, which holds the new TestGithubRoot class.
  - step: 3
    phase: pre-deploy
    action: Main passes its own screen for both roots, and the check's globs cover the github root
    command: >-
      bin/venv-python -m pytest
      tests/checks/ci_guards/test_validate_trusted_plan_screen.py::test_real_tree_is_green
      tests/checks/ci_guards/test_validate_trusted_plan_screen.py::test_github_root_red_case_names_the_root
      tests/checks/ci_guards/test_validate_trusted_plan_screen.py::test_manifest_pre_globs_cover_both_roots -q
    expected: all pass (red before, the two new node ids are absent)
    fix_if: extend the github row to what main declares (re-derive from main), or fix the check's root loop
    hermetic: false
    graduation: graduate
    graduation_check_id: trusted-plan-screen-main
  - step: 4
    phase: pre-deploy
    action: The mirror seed script mirrors both roots and never publishes an incomplete mirror
    command: bin/venv-python -m pytest tests/test_provider_mirror_seed.py -q
    expected: exit 0 (the file runs bash -n on the script); red before (test file absent)
    fix_if: fix the script; never drop an assert
    hermetic: true
    expected_literals: [" passed"]
    graduation: graduate
    graduation_check_id: provider-mirror-seed-both-roots
  - step: 5
    phase: pre-deploy
    action: PR 1 is a no-op for terraform/github (old job) and the org-transfer evaluator still passes
    command: >-
      bin/venv-python -m pytest tests/checks/contracts/test_validate_github_org_transfer.py -q &&
      test "$(grep -lE '^variable "github_token"' terraform/github/*.tf)" = "terraform/github/main.tf" &&
      ! grep -q '^variable "github_token"' terraform/github/variables.tf
    expected: >-
      all pass; then on the PR, the old terraform-github-plan comment's rows are only main's baseline: NO_CHANGES, or
      create rows for resources main already declared before the PR's base that the operator has not yet hand-applied
      (on 2026-11-06 at most github_repository_environment.approved_text and
      github_repository_environment_deployment_policy.approved_text_main, from #1876), or the visibility-gated ruleset row
      main already shows
    fix_if: >-
      any row outside that baseline, or any update, replace or delete row -- the move was not verbatim; restore and redo.
      A baseline create row is not this PR's (the operator's hand apply removes it)
    hermetic: false
    graduation: not-applicable
  - step: 6
    phase: post-deploy
    action: After PR 1 merges, dispatch the seed on main and confirm the github provider landed in the mirror
    command: >-
      M=s3://agent-platform-data-lake/tf-provider-mirror/registry.terraform.io;
      before=$(aws s3 ls --profile agent_platform "$M/" --recursive | grep -cE '(kislerdm/neon|hashicorp/aws)/.*linux_amd64');
      then mcp__github__actions_run_trigger(owner=otl-labs, repo=ontheloop, method=run_workflow,
      workflow_id=terraform-provider-mirror-seed.yml, ref=main) and read the run's conclusion; then
      after=$(aws s3 ls --profile agent_platform "$M/" --recursive | grep -cE '(kislerdm/neon|hashicorp/aws)/.*linux_amd64');
      echo "before=$before after=$after github=$(aws s3 ls --profile agent_platform "$M/integrations/github/" --recursive | grep -c linux_amd64)"
    expected: run conclusion success; before equals after (the aws and neon packages survive the --delete sync); github >= 1
    fix_if: a failed run (read step conclusions only) or a missing package -- fix the script, never hand-upload
    hermetic: false
