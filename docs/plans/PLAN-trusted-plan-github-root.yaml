  - file: tests/checks/iam_tf/test_terraform_github_provider_auth.py
    action: Modify
    purpose: >-
      PR 4. test_plan_workflow_keeps_the_token_lane and test_workflow_red_cases follow the rewritten workflow (token from
      the tf-trusted-plan environment secret into TF_VAR_github_token as process env); no assertion loosened. Graduated
      shard terraform-github-provider-auth-lane is kept unchanged (the class keeps its name).
  - file: docs/contracts/environment-taxonomy.yaml
    action: Modify
    purpose: >-
      PR 4. axis_a.github.apply_gating: "(terraform-github-plan.yml, rec-4335)" becomes "(terraform-github-plan.yml,
      rec-4335; main's copy on pull_request_target since rec-4638, Decision 238)"; nothing else on the row changes. Dated
      amendment_log row (governance_note_add). If PR #1888 has rewritten this row first, add the same parenthetical to its
