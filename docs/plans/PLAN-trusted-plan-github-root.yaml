acceptance_criteria:
  - "A same-repo terraform/github PR gets its PR-time plan from main's terraform-github-plan.yml on pull_request_target in tf-trusted-plan, under agent-platform-github-ci-trusted-github-plan, and no pull_request-triggered job plans it (PR #1888's tf-trusted-plan preview job, if it lands, is that plan's own and outside this criterion). This holds for branches based on post-PR-4 main: a branch that predates PR 4 still carries the old pull_request file, which runs its own definition (the planner's PR-sub role and, until VP 17, the repository secret) until it is rebased, within Decision 238 cl.6's accepted interim risk until rec-4640"
  - "The PR's terraform/github files are screened before any credential exists; main.tf and the lockfile always come from main; a refused PR gets a names-only refusal and no plan"
  - "The new role can read only tfstate/github/terraform.tfstate and the provider mirror (plus a list scoped to the mirror prefix); it reaches no secret value, no tfplan/ and no terraform/personal state"
  - "Init is hermetic from the mirror with main's lockfile; the plan's output and diagnostics stay in a private runner log; the PR comment carries names only, and every body (refusal or plan) is built, checked by terraform_github_plan_comment.py assert-clean, then posted"
  - "The plan App key is readable only by jobs in the tf-trusted-plan environment; no repository secret of that name remains (VP 17: the operator's names-only read in the GitHub UI, confirmed in words and recorded with its message id on the merged PR, because a run cannot prove absence: an environment secret shadows a repository secret of the same name); no forward-standing contract text places the key in a repository secret (VP 25)"
  - "agent-platform-github-ci-trusted-plan holds no tfstate/github grant; its unused but still matchable terraform-github-plan.yml trust entry is pinned and handed to rec-4640 (hand-off read back from rec-4640's context, 2026-11-06)"
  - "The planner's TfstateGithubRead has no consumer after PR 4 and is handed to rec-4640 for removal with the PR-sub trust statement (read back from rec-4640's context, 2026-11-06); it stays pinned exactly by TestPlannerStateGrant until then"
  - "PR 5 carries the Decision 238 Update, the five contract edits (three contracts), their log rows and the org-transfer log reflow exactly as the approved-text sidecar binds them, and rec-4638 is closed by PR 5's Resolves trailer (VP 22, VP 23)"
