    phase: post-deploy
    action: >-
      PR 2 admin apply from a saved plan at the merge sha (deploy-paths.yaml admin_out_of_band procedure: plan, present,
      accept, apply), Benjamin's word on the exact apply command, then a read-only check that the ARN is live
    command: >-
      set -o pipefail; git fetch origin main -q && E=$(mktemp -d "${TMPDIR:-/tmp}/s5-apply.XXXXXX") && W="$E/wt" &&
      git worktree add --detach "$W" origin/main -q && echo "planned_sha=$(git -C "$W" rev-parse HEAD)" && cp terraform/bootstrap/terraform.bootstrap.tfvars "$W/terraform/bootstrap/" &&
      TF_CLI_CONFIG_FILE=$HOME/.terraform-mirror.tfrc terraform -chdir="$W/terraform/bootstrap" init -input=false > "$E/init.log" 2>&1 &&
      TF_CLI_CONFIG_FILE=$HOME/.terraform-mirror.tfrc terraform -chdir="$W/terraform/bootstrap" plan -input=false -var-file=terraform.bootstrap.tfvars -out="$E/apply.bin" > "$E/plan.log" 2>&1 &&
      terraform -chdir="$W/terraform/bootstrap" show -json "$E/apply.bin" | bin/venv-python -c "import json,sys; p=json.load(sys.stdin); print(sorted([r['address'], '/'.join(r['change']['actions'])] for r in p.get('resource_changes', []) if r['change']['actions'] != ['no-op']))";
      check planned_sha equals PR 2's squash-merge sha, or that main moved past it with no terraform/bootstrap change
      (`git -C "$W" diff --quiet <merge sha> HEAD -- terraform/bootstrap`; else stop), present those rows and planned_sha
      to Benjamin and wait for his word on the next command, exactly:
      TF_CLI_CONFIG_FILE=$HOME/.terraform-mirror.tfrc terraform -chdir="$W/terraform/bootstrap" apply -input=false "$E/apply.bin" > "$E/apply.log" 2>&1; rc=$?;
      grep -oE 'Apply complete! Resources: [0-9]+ added, [0-9]+ changed, [0-9]+ destroyed' "$E/apply.log"; rm -f "$E/apply.bin"; git worktree remove --force "$W"; echo "apply_rc=$rc";
      aws iam get-policy-version --profile agent_platform_admin --policy-arn "$(aws iam list-policies --profile agent_platform_admin --scope Local --query "Policies[?PolicyName=='agent-platform-github-ci-apply-reads'].Arn" --output text)" --version-id "$(aws iam list-policies --profile agent_platform_admin --scope Local --query "Policies[?PolicyName=='agent-platform-github-ci-apply-reads'].DefaultVersionId" --output text)" --query 'PolicyVersion.Document' --output json | grep -c 'agent-platform-github-ci-trusted-github-plan'
    expected: >-
      the plan rows are exactly aws_iam_policy.github_ci_apply_reads update (the same as VP 20's NEW); after his word the
      grep prints Apply complete! Resources: 0 added, 1 changed, 0 destroyed, apply_rc=0, and the policy count is 1. The
      saved plan applies with no prompt; the logs stay in the private temp dir; the session's own checkout never leaves
      its branch (a throwaway worktree, as VP 20). Post the counts and the merge sha only.
    fix_if: >-
      any other plan row (stop before the apply; another bootstrap change is merged-but-unapplied or main drifted), an
      init or plan error, apply_rc not 0, or count 0 -- stop and report; never widen in place
    hermetic: false
