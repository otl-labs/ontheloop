  - file: .github/workflows/terraform-github-plan.yml
    action: Modify
    purpose: >-
      PR 4. Rewritten on the terraform-plan-trusted.yml pattern. on: pull_request_target, types [opened, synchronize,
      reopened], paths ['terraform/github/**'] only (the workflow and reporter self-paths go: under pull_request_target they
      run main's text). permissions: {} at top; concurrency per PR, cancel-in-progress. Job plan: if same-repo head AND base
      main AND github.actor != 'dependabot[bot]'; environment tf-trusted-plan; permissions contents read, id-token write,
      pull-requests write; timeout 15. Steps, every non-local uses: pinned to a 40-hex SHA with a version comment:
      checkout (no ref, persist-credentials false); aws-region; config check (step name "Config check": APP_CLIENT_ID, key set, reviewer logins;
      CONFIG_MISSING names only); overlay (OVERLAY_ROOT=terraform/github, python3 -I by path, tee to RUNNER_TEMP);
      screen (screen --root terraform/github --policy terraform/github); assume
      agent-platform-github-ci-trusted-github-plan, role-session-name tf-trusted-github-plan, fails loudly; mint the plan
      App token (create-github-app-token, owner and repositories: the running repository's name, the three read
      permissions; the key is the tf-trusted-plan environment secret TF_GITHUB_PLAN_APP_PRIVATE_KEY); reviewer ids to a
      RUNNER_TEMP file (as today); terraform version; setup-terraform; mirror sync of this root's one provider (`aws s3
      sync "s3://agent-platform-data-lake/tf-provider-mirror/" "$RUNNER_TEMP/tf-mirror" --exclude "*" --include
      "registry.terraform.io/integrations/github/*" --only-show-errors`, the one aws s3 call, a download; the lockfile
      names only integrations/github); a DIRECT init step, not terraform-init-retry (its second step is the Neon preflight, which
      reads an SSM parameter this role cannot read, and it echoes init output to the public log): `bash
      "$GITHUB_WORKSPACE/scripts/ci/quiet_run.sh" "$RUNNER_TEMP/tf-init.log" -- terraform -chdir=terraform/github init
      -input=false -plugin-dir="$RUNNER_TEMP/tf-mirror" -get=false -lockfile=readonly -backend-config="region=$AWS_REGION"`
      (hermetic, no registry contact, so no retry loop); plan -lock=false -input=false -detailed-exitcode -out=plan.bin
      through quiet_run.sh into a private RUNNER_TEMP log, token and reviewer ids as process env only, with the exit code
      captured into the step output exit_code as today (`rc=0; ... || rc=$?`, the step fails unless rc is 0 or 2) so the
      reporter's --plan-exit-code still receives 0 or 2; show -json through quiet_run.sh into RUNNER_TEMP/plan.json;
      backstop --plan-json "$RUNNER_TEMP/plan.json" --policy terraform/github; visibility probe (booleans only, as today);
      report (terraform_github_plan_report.py, names only, written to $RUNNER_TEMP/report.md and printed nowhere before
      the check); one post step "Post the comment" (if: `!cancelled() && steps.checkout.outcome == 'success'`, so a
      CONFIG_MISSING refusal is posted too; the step reads no PR file) that chooses the category (CONFIG_MISSING, OVERLAY_REFUSED,
      SCREEN_REFUSED, ASSUME_FAILED, MINT_FAILED, REVIEWER_LOOKUP_FAILED, MIRROR_FAILED, INIT_FAILED, PLAN_FAILED,
      BACKSTOP_REFUSED, REPORT_FAILED: the first failed step in that order, else OK) from step outcomes only, then BUILDS
      the body (`BODY=$(python3 -I "$GITHUB_WORKSPACE/scripts/ci/terraform_github_plan_comment.py" refusal --category
      "$category" --head-sha "$HEAD_SHA" --run-url "$RUN_URL" --overlay-file "$RUNNER_TEMP/overlay.txt" --screen-file
      "$RUNNER_TEMP/screen.txt")` on a refusal, else `BODY=$(<"$RUNNER_TEMP/report.md")`), CHECKS it (`printf '%s'
      "$BODY" | python3 -I "$GITHUB_WORKSPACE/scripts/ci/terraform_github_plan_comment.py" assert-clean --values-file
      "$RUNNER_TEMP/reviewer_ids"`, APP_CLIENT_ID and the AWS account-id secret the assume step uses in env), then POSTS (`gh pr comment`, and only then appends the
      checked body to the step summary), in that order; a failed check posts nothing and fails the step. Log rule: no
      step other than the quiet_run.sh-wrapped init, plan and show names tf-init.log, tf-plan.log or tf-show.log;
      `terraform show` runs only with -json; cat, head and tail appear only as `cat config/terraform-version`, the plan
      step's read of reviewer_ids into process env, and the visibility probe's print of its booleans file (S3's output
      rule, adapted); fail on destroy or replace; delete plan files always. No step persists plan.bin or plan.json, no
      tfvars wrapper (this root has none), no apply. No `${{ github.event.pull_request.* }}` inside any run body (env
      only). Header rewritten: Decision 238 and rec-4638, the role, the environment secret, no LLM, never workflow_call,
      the residual about a same-repo PR reading the App key reworded to end at the repository-secret deletion (VP 17),
      not removed, the stale "plan.bin carries the App token" claim
      removed (the token is ephemeral). Keep the reporter's CLI and classify() interface unchanged (PR #1888's gate
      imports it).
  - file: scripts/ci/terraform_github_plan_comment.py
    action: Create
    purpose: >-
      PR 4. Stdlib-only, code-owned comment gate for the github job, run by path with python3 -I (no repo imports, so
      nothing to resolve). `refusal --category CAT --head-sha SHA --run-url URL --overlay-file F --screen-file F`: CAT
      must be one of the eleven categories (else a fixed message, exit 2, nothing printed); the body is a fixed header
      "### terraform/github speculative plan (trusted, Decision 238)", the head line (40-hex sha and an Actions run URL,
      both grammar-checked), "State: CAT", and for OVERLAY_REFUSED or SCREEN_REFUSED only the file lines that fully
      match the overlay grammar `OVERLAY_REFUSED <rule> [<path>]` or the screen grammar `REFUSED <rule> <file>:<line>`
      (re-rendered from the matched groups, the same grammar as terraform_personal_plan_report.py's refusal mode); every
      other line is dropped; the finished body is validated against a closed line grammar before printing (fail
      closed). `assert-clean --values-file F`: reads the body on stdin; exit 1 with a fixed message naming only the
      rule if the body holds a GitHub token shape (gh[pousr]_ or github_pat_ prefixes), a PEM marker, the App client id
      (env APP_CLIENT_ID), the AWS account id (env AWS_ACCOUNT_ID, exact value) or any reviewer id from F's JSON list,
      each as a whole token; else exit 0, printing nothing. F absent means no ids were resolved yet (every refusal
      before the reviewer-ids step), so the id list is empty; this is safe because the ids exist only in that file. F
      present but unreadable or not a JSON list of integers exits 1 (fail closed). An empty APP_CLIENT_ID or
      AWS_ACCOUNT_ID is skipped for that rule only. This
      replaces redaction_check.py assert-clean, whose scrub pairs come from terraform/personal's tfvars, which this role
      cannot read (its empty-account guard would always fail). Under 150 SLOC.
  - file: tests/test_terraform_github_plan_comment.py
    action: Create
