    expected: ADMIN_CHAIN_OK; on ADMIN_CHAIN_ABSENT PR 2 waits at CI-green for an ADMIN session to run step 20
    fix_if: ADMIN_CHAIN_ABSENT in a session expected to hold admin credentials; report it, never widen
    hermetic: false
