      k = "token.actions.githubusercontent.com:"
      wf = ["otl-labs/ontheloop/.github/workflows/" + f + "@refs/heads/main" for f in ("terraform-plan-trusted.yml", "terraform-github-plan.yml")]
      doc = {"Version": "2012-10-17", "Statement": [{"Effect": "Allow", "Principal": {"Federated": "arn:aws:iam::" + "1" * 12 + ":oidc-provider/token.actions.githubusercontent.com"}, "Action": "sts:AssumeRoleWithWebIdentity", "Condition": {"StringEquals": {k + "aud": "sts.amazonaws.com", k + "sub": ["repo:" + r + ":environment:tf-trusted-plan" for r in repos], k + "job_workflow_ref": wf}}}]}
      print("LEN", len(json.dumps(doc, separators=(",", ":"))))
      aa = boto3.Session(profile_name="agent_platform_admin", region_name="eu-west-2").client("accessanalyzer")
      f = aa.validate_policy(policyDocument=json.dumps(doc), policyType="RESOURCE_POLICY", validatePolicyResourceType="AWS::IAM::AssumeRolePolicyDocument")["findings"]
      print("FINDINGS", sorted((x["findingType"], x["issueCode"]) for x in f))
      assert not [x for x in f if x["findingType"] in ("ERROR", "SECURITY_WARNING")], f
      print("TRUST_DOC_VALID")
      EOF
    expected: >-
      a LEN line under 2048, a FINDINGS line with no ERROR or SECURITY_WARNING, then TRUST_DOC_VALID. The document must
      mirror PR 3's HCL (same segments, same values; update the literals here if VP 10 changed the job_workflow_ref
      form); the placeholder account id is twelve 1s built in code (the never-commit hook blocks any 12-digit literal), never the real one
    fix_if: >-
      an ERROR naming the condition key -- AWS does not accept job_workflow_ref in a trust document: stop before merge
      and return to the planner (the binding fork reopens); a permissions error on the admin profile -- ask Benjamin to
      allow this read-only call
    hermetic: false
    graduation: not-applicable
  - step: 16
    phase: pre-deploy
    action: Full tier, then HEAD attestation, before each commit and push (handoff_policy)
    command: bin/venv-python -m scripts.validate && bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: the full tier exits 0 and the validation result attests the current HEAD's tree
    fix_if: any failure -- fix and rerun the full tier from the start
    hermetic: false
    graduation: waive
    graduation_waiver_reason: A whole full-tier run; graduate steps may not invoke scripts.validate (recursion), and steps 1-3 carry the durable regressions.
  - step: 20
    phase: pre-deploy
    action: PR 2. terraform/github's import blocks stay whole with the deployment policy's variable-derived id
    command: bin/venv-python -m pytest tests/checks/iam_tf/test_terraform_github_import_blocks.py -q
    expected: all pass, including the new red case
    fix_if: the real tree fails -- fix imports.tf or variables.tf, never the expected-id rule
    hermetic: false
    graduation: waive
    graduation_waiver_reason: The test module is already graduated as terraform/github's import-block guard; this plan only adds an expected-id type and a case.
  - step: 21
    phase: pre-deploy
    action: PR 3. AC7 -- the Decision, its two amendment annotations and its size are present on the branch
    command: |-
      bin/venv-python - <<'EOF'
      import re
      t = open("docs/DECISIONS.md", encoding="utf-8").read()
      heads = list(re.finditer(r"^## Decision (\d+):", t, re.M))
      new = [m for m in heads if "No agent-controlled identity reads Terraform state" in t[m.start():m.start() + 200]]
      assert len(new) == 1, "Decision heading missing or duplicated"
      n = new[0].group(1)
      i = heads.index(new[0])
      body = t[new[0].start():heads[i + 1].start() if i + 1 < len(heads) else len(t)]
      print("DECISION", n, "BYTES", len(body.encode()))
      assert len(body.encode()) < 6144
      for d in ("92", "144"):
          m = re.search(r"^## Decision " + d + r":", t, re.M)
          nxt = re.search(r"^## Decision \d+:", t[m.end():], re.M)
          seg = t[m.start():m.end() + (nxt.start() if nxt else len(t))]
          assert "> **Amended by Decision " + n + " (" in seg, "annotation missing on " + d
      print("AC7_OK")
      EOF
    expected: one DECISION line with BYTES under 6144, then AC7_OK
    fix_if: >-
      the size is over -- stop and ask Benjamin which clause to compress; a missing annotation -- add it under that
      Decision's existing annotations (Decision 177), never edit either body
    hermetic: false
    graduation: waive
    graduation_waiver_reason: validate_decisions_size already guards the size in --pre; heading and annotation presence is a one-time landing fact, not a regression surface.
