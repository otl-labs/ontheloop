  - file: .github/workflows/terraform-plan-trusted.yml
    action: Create
    purpose: >-
      PR 2. Claims-only skeleton under the FINAL filename (job_workflow_ref carries the path; S3 replaces the body).
      on: pull_request_target {types [opened, synchronize, reopened], paths [terraform/personal/**]} and
      workflow_dispatch; never workflow_call. Top-level permissions: {}. concurrency group per PR number (or run id on
      dispatch), cancel-in-progress true. Jobs, each runs-on ubuntu-latest, timeout-minutes 5, permissions {contents:
      read, id-token: write}, defaults.run.shell bash (pipefail, so the live-assume pipe cannot mask a failure), the
      default actions/checkout with NO ref:, repository: or path: input (under both triggers that is main's
      github.sha) and persist-credentials false, never the PR head or merge ref, and no github.event.pull_request.*
      or github.head_ref expression inside any run: body:
      (1) claims-probe: environment tf-trusted-plan; job-level if: github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository (written without enclosing parentheses); one-line run delegate python3 -I
      scripts/ci/oidc_claims_probe.py --audience sts.amazonaws.com --require job_workflow_ref (-I, isolated mode: neither
      scripts/ci/ nor the cwd joins sys.path, so an unreviewed scripts/ci/json.py cannot shadow a stdlib import while the
      token-request variables are in the environment; the runner's python3 is 3.12).
      (2) claims-probe-no-env: TEMPORARY (S3 deletes it); no environment; if github.event_name == 'pull_request_target'
      && the same-repo condition; same isolated delegate without --require. Answers whether a bare pull_request_target token
      carries ref:refs/heads/main.
      (3) live-assume: environment tf-trusted-plan; if github.event_name == 'workflow_dispatch'; after the checkout, the
      ./.github/actions/aws-region step (validate_project_region R4); aws-actions/
      configure-aws-credentials (the repo's pinned version) with role-to-assume
      arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/agent-platform-github-ci-trusted-plan, role-session-name
      tf-trusted-plan, aws-region ${{ env.AWS_REGION }}, step env MASK_AWS_ROLE_ID_ACCOUNT_PART: ${{
      secrets.AWS_ROLE_ID_ACCOUNT_PART }} (step or job env, never workflow env; validate_actions_account_id_masking R3/R5),
      the same pinned action version as dedup-probe.yml; NO continue-on-error; then exactly one run line: aws sts
      get-caller-identity --query Arn --output text | sed -E 's#^arn:aws:sts::[0-9]+:##' (prints
      assumed-role/<role>/<session> only; the command strips the account id itself, never relying on masking; no
      region literal anywhere under .github/, validate_project_region R2; a GitHub runner is not behind the agent
      proxy, so no STS host pinning is needed).
  - file: scripts/ci/oidc_claims_probe.py
    action: Create
    purpose: >-
      PR 2. Stdlib only. Fetches the OIDC token itself from ACTIONS_ID_TOKEN_REQUEST_URL (+ &audience=...) with
      ACTIONS_ID_TOKEN_REQUEST_TOKEN, so the token never enters a shell variable or log; base64url-decodes the payload
      segment only (never the signature) and prints one "claim=value" line per ALLOWLISTED claim in a fixed order: sub,
      ref, ref_type, base_ref, head_ref, event_name, environment, job_workflow_ref, workflow_ref, repository_id,
      repository_owner_id, runner_environment. Never prints aud, jti, iat/exp/nbf, actor fields or the raw token.
      --require NAME exits 1 naming a missing or empty claim. Non-zero with a fixed message (no token text) on a
      fetch error or a malformed token. Pure functions (decode, select) separated from the fetch so tests run offline.
  - file: tests/test_oidc_claims_probe.py
    action: Create
    purpose: >-
      PR 2. Offline tests over a fabricated unsigned JWT: prints exactly the allowlisted claims in order; a token whose
      payload carries aud, jti and a secret-looking extra claim prints none of them; the raw token and its signature
      segment never appear in stdout or stderr; --require job_workflow_ref fails when absent and when empty; a malformed
      token exits non-zero without echoing input; the fetch builds the audience query correctly (stubbed urlopen).
  - file: scripts/checks/ci_guards/validate_trusted_plan_environment.py
    action: Create
    purpose: >-
      PR 2. Registered fast-tier check (Decision 170 examined/skipped counts). TRUSTED_WORKFLOWS =
      {terraform-plan-trusted.yml, terraform-github-plan.yml}; ENV = "tf-trusted-plan"; TEMP_NO_ENV_JOBS =
      {("terraform-plan-trusted.yml", "claims-probe-no-env")} with a comment that S3 (rec-4637) removes the entry.
      Over .github/workflows/*.yml (parse via scripts.verify_ci_workflow's loader): (a) only TRUSTED_WORKFLOWS reference
      ENV (string or {name:} form, any job), and no workflow names an environment by expression (any ${{ in an
      environment name is red); (b) only TRUSTED_WORKFLOWS combine a pull_request_target trigger with
      a token-minting job (effective permissions, defined under (d)); (c) no TRUSTED_WORKFLOWS file declares workflow_call, and
      every TRUSTED_WORKFLOWS file exists; (d) in TRUSTED_WORKFLOWS, every token-minting job that can run on
      pull_request_target declares environment ENV (except TEMP_NO_ENV_JOBS) and a job-level if guarded per disjunct:
      strip ${{ }} and balanced enclosing parentheses, normalise whitespace and quote style, split on || outside parentheses, then split each disjunct on && outside parentheses; every
      disjunct must carry github.event_name == 'workflow_dispatch' or github.event.pull_request.head.repo.full_name ==
      github.repository as one of its own top-level conjuncts (a substring match would pass "... || true"). A job "can
      run on pull_request_target" when its workflow has that trigger and some disjunct lacks the dispatch conjunct (no
      if at all counts as one unguarded disjunct). So claims-probe (dispatch || same-repo) and claims-probe-no-env
      (pull_request_target && same-repo) pass, live-assume (dispatch only) is excluded, and any "|| true" form is red.
      Token-minting means EFFECTIVE permissions: the job's permissions if present, else the workflow's; the string
      write-all or a mapping with id-token: write counts (predicates b, d, g and h all use this); (e) in TRUSTED_WORKFLOWS no run: body contains "github.event.pull_request." or "github.head_ref"
      inside a ${{ }} expression; (f) terraform/github declares github_repository_environment with environment = ENV,
      can_admins_bypass = false, no reviewers block, protected_branches = false, custom_branch_policies = true and
      prevent_destroy = true, exactly one github_repository_environment_deployment_policy for ENV with branch_pattern =
      "main" (no tag_pattern, no other policy for ENV), plus an import block for each; (g) every actions/checkout step
      in TRUSTED_WORKFLOWS has no ref or repository input and sets persist-credentials false; (h) every local path a
      token-minting job in TRUSTED_WORKFLOWS executes (each uses: ./... action directory and each scripts/... path a run
      body names) matches a .github/CODEOWNERS pattern (leading-slash anchored; a trailing slash matches the subtree;
      otherwise exact or fnmatch), so cl.2's code-owner premise is checked, not hand-kept; and every python or python3
      invocation in such a job's run bodies carries -I (a bare python3 scripts/... or python3 -m scripts... is red,
      because the script directory or cwd would join sys.path and an un-owned sibling module could shadow an import).
      (g) and (h) apply to every id-token job (d) governs, including TEMP_NO_ENV_JOBS, and to every job that declares
      ENV, so terraform-github-plan.yml (its checkout has no persist-credentials false
      today) stays vacuous until S5 moves it. S3 amends (g) when it adds the PR-HCL overlay and inherits (h) for its
      scripts. terraform-github-plan.yml (pull_request today) passes every predicate vacuously
      until S5. Each predicate takes parsed data so red cases run on synthetic input.
