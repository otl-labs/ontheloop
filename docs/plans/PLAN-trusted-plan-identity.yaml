      terraform/github/CLAUDE.md), run the policy read command below and paste its one-line result." Set the variable
      default from it, then re-run the terraform-github-plan check on PR 2. Policy read command, quoted to him verbatim
      from the plan context line "VP 8 policy read".'
    expected: >-
      Benjamin replies with exactly one policy, name main, type branch. Tell him in the same ask, and in PR 2's body,
      that from PR 2's merge until the CloudShell adoption every terraform/github PR's advisory plan is red on these
      two imports (not a required check, Decision 83), so he can adopt promptly or accept the window knowingly. While var.repository_name still defaults to
      theseus (until rec-4355's re-key), the re-run GitHub-root plan errors on the repository-keyed imports: that error
      is the expected outcome, so record the imports as unproven on PR 2 and have Benjamin confirm the settings in
