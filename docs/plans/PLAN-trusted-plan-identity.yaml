schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "trusted-plan-identity"
intent: >-
  Give the speculative Terraform plan a trusted identity that no agent can obtain without review: a dedicated role,
  agent-platform-github-ci-trusted-plan, trusting only the GitHub Environment tf-trusted-plan AND a job_workflow_ref naming
  one of the two trusted workflow files on main. Adds the Environment (adopted into terraform/github), a claims-only
  skeleton of the trusted workflow that measures the real OIDC claims, a repo check fencing pull_request_target and the
  Environment, and the new Decision. Slice S2 of the trusted plan executor (rec-4636); the workflow that uses the identity
  is S3 (rec-4637). Root cause it serves: unreviewed agent code must never open Terraform state or saved plans.
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-trusted-plan-identity.yaml
phase: >-
  ad_hoc_rec (soft-warn category; no tier_item claimed, so the Tier Item Freshness Gate is skipped). Executes rec-4636.
scope:
  - file: terraform/bootstrap/github_ci_apply_reads.tf
    action: Modify
    purpose: >-
      PR 1. In IAMRolesRead, add "arn:aws:iam::${var.account_id}:role/agent-platform-github-ci-trusted-plan" with a
      two-line comment naming the pre-stage precedent (the telemetry-writer entries below it): without it the gated
      apply's own iam:GetRole after the create in PR 3, and every later refresh, fail closed. Insert it after the
      agent-platform-github-ci-deploy line, leaving that line and its newline intact (test_platform_role_metadata_admin_scope
      anchors on it). Admin-only root: pre-merge read-only ADMIN plan, then the admin apply on Benjamin's word.
  - file: terraform/github/environments.tf
    action: Modify
    purpose: >-
      PR 2. Add resource "github_repository_environment" "tf_trusted_plan": repository = github_repository.this.name,
      environment = "tf-trusted-plan", can_admins_bypass = false, no reviewers block, no wait timer,
      deployment_branch_policy { protected_branches = false, custom_branch_policies = true }, lifecycle { prevent_destroy
      = true }; plus resource "github_repository_environment_deployment_policy" "tf_trusted_plan_main": repository =
      github_repository.this.name, environment = github_repository_environment.tf_trusted_plan.environment,
      branch_pattern = "main" (the only policy on the Environment; GitHub matches it against GITHUB_REF, which is
      refs/heads/main under pull_request_target). Never "protected branches only": GitHub defines it by classic branch
      protection rules, this repo protects main by a ruleset, and with no classic rule every branch can deploy. Header
      comment: no reviewer gates this Environment; its safety is the main-only policy plus the trusted role's
      job_workflow_ref binding and validate_trusted_plan_environment (the Decision PR 3 lands, cl.2). Keep the
      tf_gated_apply resource untouched.
  - file: terraform/github/imports.tf
    action: Modify
    purpose: >-
      PR 2. Add import { to = github_repository_environment.tf_trusted_plan, id = "${var.repository_name}:tf-trusted-plan" }
      (same shape as tf_gated_apply's; test_terraform_github_import_blocks requires one block per managed resource) and
      import { to = github_repository_environment_deployment_policy.tf_trusted_plan_main, id =
      "${var.repository_name}:tf-trusted-plan:${var.tf_trusted_plan_main_policy_id}" } (the provider's
      repository:environment:id form; confirm it against the pinned 6.12.1 provider docs before writing).
  - file: terraform/github/variables.tf
    action: Modify
    purpose: >-
      PR 2. Add variable "tf_trusted_plan_main_policy_id" (type number, used only by its import block), same shape as
      main_protection_ruleset_id: description says to re-read it from the API after a transfer; default is the id
      Benjamin reports at VP 8 (a numeric GitHub object id, not a secret), set before PR 2 merges.
  - file: tests/checks/iam_tf/test_terraform_github_import_blocks.py
    action: Modify
