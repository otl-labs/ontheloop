      t, p = "agent-platform-github-ci-trusted-plan", "agent-platform-github-ci-planner"
      got = (
          d(t, "s3:GetObject", b + "tfplan/personal/1/probe.bin"),
          d(t, "s3:PutObject", b + "tfplan/personal/1/probe.bin"),
          d(t, "s3:GetObject", b + "tfstate/personal/sandbox/terraform.tfstate"),
