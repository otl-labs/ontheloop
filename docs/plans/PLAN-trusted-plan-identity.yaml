bundled_recommendations:
  - rec-4636
followon_recs:
  - rec-4651
infrastructure_dependencies:
  - "PR 1 (terraform/bootstrap): admin-only root; read-only ADMIN pre-merge plan, then the admin apply on Benjamin's word on the exact command, BEFORE PR 3 merges."
  - "PR 2 (terraform/github): human-gated CloudShell root; the Environment is created by Benjamin in the GitHub UI at build time (he asked to be told when and how), and the import block is adopted at the next CloudShell apply (rec-4355's re-key, or -var repository_name=ontheloop). No agent applies terraform/github."
  - "PR 3 (terraform/personal): a new IAM role plus trust routes to tf-gated-apply (guard exit 2); Benjamin approves the gated-apply job in Actions."
  - "Order: S1 (rec-4632) has merged and applied before PR 3 opens (S1 lands first and alone); PR 1 applied and PR 2 merged before PR 3 merges (PR 3's own open triggers the probe from PR 2)."
acceptance_criteria:
  - tf-trusted-plan exists in the repository with no reviewers, a single main-only deployment branch policy, admin bypass off, and terraform/github declares it and its policy with prevent_destroy on the Environment and an import block for each
  - terraform-plan-trusted.yml is on main as a claims-only skeleton; its pull_request_target run on PR 3 printed the allowlisted claims and no token
  - agent-platform-github-ci-trusted-plan exists live with the boundary and a single environment- and job_workflow_ref-bound trust statement; its live grants match the four Sids plus the shared refresh-read surface
  - the live-assume dispatch on main succeeds, and a dispatch from a non-main ref is refused by the Environment
  - the planner can no longer s3:GetObject tfplan/personal/*
  - validate_trusted_plan_environment and test_trusted_plan_identity are green in the fast tier
  - the approved Decision is in docs/DECISIONS.md with dated annotations on Decisions 92 and 144 (VP 21); the two github-org-transfer.yaml rows match the approved text
  - rec-4636 is closed
verification_plan:
  - step: 1
    phase: pre-deploy
    action: The trusted role's trust and grants and the planner narrowing hold (rec-4636 acceptance)
    command: bin/venv-python -m pytest tests/checks/iam_tf/test_trusted_plan_identity.py -q
    expected: all pass, including the red cases on synthetic HCL
    fix_if: a real-tree assertion fails -- fix the HCL, never the assertion
    hermetic: false
    graduation: graduate
    graduation_check_id: trusted-plan-identity
  - step: 2
    phase: pre-deploy
    action: The pull_request_target and Environment fence holds on the real tree and reddens on each synthetic breach
    command: bin/venv-python -m pytest tests/checks/ci_guards/test_validate_trusted_plan_environment.py -q
    expected: all pass
    fix_if: the real tree fails a predicate -- fix the workflow or terraform/github, never the predicate
    hermetic: false
    graduation: graduate
    graduation_check_id: trusted-plan-environment-fence
  - step: 3
    phase: pre-deploy
    action: The claims probe prints only allowlisted claims and never the token
    command: bin/venv-python -m pytest tests/test_oidc_claims_probe.py -q
    expected: all pass
    fix_if: any test shows a token segment or a non-allowlisted claim in output -- fix the script
    hermetic: false
    graduation: graduate
    graduation_check_id: trusted-plan-oidc-claims-probe
  - step: 4
    phase: pre-deploy
    action: Provider-free formatting on the three touched roots (init, validate and plan are CI's and the gate's job, Decision 119)
    command: terraform fmt -check terraform/github && terraform fmt -check terraform/personal && terraform fmt -check terraform/bootstrap
    expected: exit 0
    fix_if: run terraform fmt on the touched files only
    hermetic: false
    graduation: waive
    graduation_waiver_reason: The required terraform-validate CI job enforces fmt; a registry row would duplicate it.
  - step: 5
    phase: pre-deploy
    action: ENVIRONMENT CHECK -- PR 1's gate and admin apply need the ADMIN chain
    command: >-
      bin/venv-python -m scripts.aws_identity caller-arn --profile agent_platform_admin 2>/dev/null | grep -q
      'assumed-role/PlatformAdmin/' && echo ADMIN_CHAIN_OK || echo ADMIN_CHAIN_ABSENT
    expected: ADMIN_CHAIN_OK in this project's ADMIN environment
    fix_if: ADMIN_CHAIN_ABSENT -- PR 1 waits at CI-green and steps 6-7 go to an ADMIN session through the coordinator
    hermetic: false
    graduation: not-applicable
  - step: 6
    phase: pre-deploy
    action: >-
      PRE-MERGE GATE (ADMIN), PR 1 -- read-only plan of terraform/bootstrap at the CI-green PR head: one in-place update
      of the apply role's reads policy, nothing created or destroyed
    command: |-
      test -n "$PR_HEAD_SHA" && M="${TMPDIR:-/tmp}/trusted-plan-gate" && (umask 077 && mkdir -p "$M") && aws secretsmanager get-secret-value --secret-id agent-platform-terraform-personal-tfvars --profile agent_platform_admin --query SecretString --output text | grep -E '^[[:space:]]*(account_id|owner_email|platform_dev_external_id|platform_admin_external_id|agent_service_account_user_name)[[:space:]]*=' > "$M/bootstrap.tfvars" && W="$M/wt" && git fetch origin "$PR_HEAD_SHA" && git worktree add --detach "$W" "$PR_HEAD_SHA" > /dev/null && rc=0 && { terraform -chdir="$W/terraform/bootstrap" init -input=false > /dev/null && terraform -chdir="$W/terraform/bootstrap" plan -input=false -lock=false -var-file="$M/bootstrap.tfvars" -out="$M/head.tfplan" > /dev/null && terraform -chdir="$W/terraform/bootstrap" show -json "$M/head.tfplan" > "$M/head.json"; } || rc=1; git worktree remove --force "$W"; rm -f "$M/head.tfplan" "$M/bootstrap.tfvars"; test $rc -eq 0 || rm -f "$M/head.json"; test $rc -eq 0 && M="$M" bin/venv-python - <<'EOF'
      import json, os, sys
      m = os.environ["M"]
      rc = json.load(open(f"{m}/head.json")).get("resource_changes", [])
      os.remove(f"{m}/head.json")
      moving = sorted((r["type"], tuple(r["change"]["actions"])) for r in rc if r["change"]["actions"] not in (["no-op"], ["read"]))
      out = {"add": sum("create" in a for _, a in moving), "change": sum(a == ("update",) for _, a in moving), "destroy": sum("delete" in a for _, a in moving), "types": sorted({t for t, _ in moving})}
      print(json.dumps(out))
      sys.exit(0 if out == {"add": 0, "change": 1, "destroy": 0, "types": ["aws_iam_policy"]} else "PRE-MERGE PLAN STOP")
      EOF
    expected: >-
      one counts-only JSON line {"add": 0, "change": 1, "destroy": 0, "types": ["aws_iam_policy"]} (the IAMRolesRead edit only), posted on PR 1 with
      $PR_HEAD_SHA; a new head re-runs it. If the reads document is an inline aws_iam_role_policy rather than a managed
      policy, the type differs: stop and return to the planner rather than editing the expectation alone.
    fix_if: >-
      any other count, or a plan error -- stop and RCA (Decision 55); if live already differs from main (another
      bootstrap plan applied or pending, e.g. S1b or Plan D plan 1), show Benjamin the counts and wait; never apply to
      make the plan match
    hermetic: false
    graduation: not-applicable
  - step: 7
    phase: post-deploy
    action: HUMAN-DIRECTED ADMIN APPLY of terraform/bootstrap from main for PR 1, after Benjamin's word on the exact command
    command: >-
      echo 'ADMIN, after PR 1 merges: present the exact command -- terraform -chdir=terraform/bootstrap plan -input=false
      -var-file=<scratch bootstrap.tfvars> -out=<scratch>/apply.tfplan then terraform -chdir=terraform/bootstrap apply
      <scratch>/apply.tfplan -- with the counts line from the same plan; run it only after Benjamin replies naming PR 1;
      delete the tfvars and plan files in the same step'
    expected: Benjamin's own message approving the command (id in the merged-PR comment); apply exits 0 with 0 added, 1 changed, 0 destroyed
    fix_if: the post-merge plan differs from the gate's counts -- stop and show him; an apply error -- stop and RCA, never retry with -target
    hermetic: false
  - step: 8
    phase: pre-deploy
    action: >-
      ENVIRONMENT CREATION, PR 2 -- when PR 2 is CI-green except the GitHub-root plan, ask Benjamin in the thread to
      create the Environment now, with the exact settings; nothing references it until PR 2 merges
    command: >-
      echo 'ASK BENJAMIN: "PR 2 is ready. Please create the tf-trusted-plan environment now: repository Settings >
      Environments > New environment > name tf-trusted-plan; Required reviewers: none; Wait timer: off; Deployment
      branches and tags: Selected branches and tags, then Add deployment branch or tag rule > Ref type Branch > name
      pattern main (no other rule); untick Allow administrators to bypass configured protection rules; no secrets or
