    action: Fast tier on each PR head (advisory locally; PR CI is authoritative, Decision 73)
    command: bin/venv-python -m scripts.validate --pre
    expected: exit 0
    fix_if: diagnose and fix on the branch; never skip or weaken a check
    hermetic: false
    graduation: waive
    graduation_waiver_reason: A whole fast-tier run; graduate steps may not invoke scripts.validate (recursion), and steps 1-3 carry the durable regressions.
  - step: 10
