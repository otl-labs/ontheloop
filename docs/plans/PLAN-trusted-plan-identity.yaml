          d(t, "secretsmanager:GetSecretValue", sm + "neon-api-key-AbCdEf"),
          d(p, "s3:GetObject", b + "tfplan/personal/1/probe.bin"),
      )
      doc = iam.get_role(RoleName=t)["Role"]["AssumeRolePolicyDocument"]
      st = doc["Statement"]
      keys = sorted({k for x in st for c in x.get("Condition", {}).values() for k in c})
      print("TRUST", len(st), sorted({op for x in st for op in x.get("Condition", {})}), keys)
      assert len(st) == 1 and list(st[0]["Condition"]) == ["StringEquals"], st
      assert keys == ["token.actions.githubusercontent.com:aud", "token.actions.githubusercontent.com:job_workflow_ref", "token.actions.githubusercontent.com:sub"], keys
      print("LIVE", got)
      assert got == ("implicitDeny", "allowed", "allowed", "implicitDeny", "implicitDeny", "implicitDeny", "allowed", "allowed", "implicitDeny"), got
      print("TRUSTED_PLAN_GRANTS_LIVE_OK")
      EOF
    expected: >-
