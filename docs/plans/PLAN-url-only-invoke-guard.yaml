constraints:
- >-
  This plan is implemented and applied from the ADMIN container with the agent_platform_admin profile. Every terraform
  apply (bootstrap, and the PlatformDev target) follows plan -> PRESENT -> Benjamin's explicit acceptance -> apply, never
  self-directed (Decision 126). Never approve the gated-apply run for the PlatformDev policy.
- >-
  Public repository (Decision 101): no account id, ARN with a real id, hostname, DSN or password in code, plan, PR text,
