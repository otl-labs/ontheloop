- file: src/lambdas/ducklake_maintenance/ducklake_telemetry_writer_role.sql
  action: Create
  purpose: >-
    Idempotent, password-free SQL run by the ducklake_ops owner login against the ducklake_ops database, on Neon now and
    on RDS after the swap's restore. It lives beside the verb that applies it, ducklake_maintenance's provision_telemetry_login
    (below), because no CC-web container, ADMIN included, has TCP/5432 egress (docs/SESSION_LOG.md "No Neon 5432 egress";
    direct_gates refuses direct gates for the same reason). Living under src/lambdas/ducklake_maintenance/ means an edit
    to it triggers the governed deploy (push paths) and the drift sensor (code_drift pathspecs) like any maintenance source,
    so a re-run never applies stale SQL. A header in the migrations/ducklake_ops_schema.sql style says what it is, why
    (Decision 213 cl.3) and how it is applied. Body: a DO block creating role ducklake_telemetry_writer if absent; ALTER
    ROLE ducklake_telemetry_writer LOGIN NOINHERIT NOCREATEDB NOCREATEROLE CONNECTION LIMIT 10 (REPLICATION and BYPASSRLS
    are left at their NO defaults and not named, since a non-superuser owner may not set them); ALTER ROLE ... SET statement_timeout
    = '60s'; GRANT CONNECT ON DATABASE ducklake_ops; GRANT USAGE ON SCHEMA ducklake_smoke; GRANT SELECT, INSERT, UPDATE,
    DELETE ON ALL TABLES IN SCHEMA ducklake_smoke; GRANT USAGE, SELECT, UPDATE ON ALL SEQUENCES IN SCHEMA ducklake_smoke;
    ALTER DEFAULT PRIVILEGES FOR ROLE ducklake_ops IN SCHEMA ducklake_smoke GRANT the same table and sequence privileges.
    No CREATE on any schema, nothing on the ducklake_ops schema, nothing on public. The password is set separately by the
    provisioning verb from the role's secret. CONNECTION LIMIT 10
    is twice the function's reserved concurrency of 5, pending the per-container session measurement in plan 3 part 1's
    gate.
- file: src/lambdas/ducklake_maintenance/login_actions.py
  action: Create
  purpose: >-
    action_provision_telemetry_login(event, _con), a closed, human-invoked operational verb with no caller-supplied SQL,
    role or secret name. It refuses (rt.DuckLakeRuntimeError, the catalog_reinit refusal shape) unless event confirm equals
    "ducklake_telemetry_writer". In order: (1) as the owner login (rt.fetch_dsn(), psycopg2 over rt.libpq_conninfo, the
    _drop_meta_schema pattern) it records owner_is_neon_superuser_member (None where no such role exists, as on RDS), then
    executes the SQL file read from Path(__file__).with_name("ducklake_telemetry_writer_role.sql") with no parameters
    (so a % in a comment stays literal) and commits, recording migration_sha256 of the file bytes; (2) it reads the scoped
    secret agent-platform-ducklake-telemetry-writer-dsn and refuses unless its username is ducklake_telemetry_writer, its
    host and dbname equal the owner DSN's and its sslmode is require; (3) it runs ALTER ROLE ducklake_telemetry_writer PASSWORD
    %s with the secret's password as a psycopg2-bound parameter over the owner's TLS session. Neon accepts only plaintext
    here ("Hashed passwords are not supported", Neon's role docs), so no verifier is computed; the platform never logs,
    returns or prints the password, and the residual is that the server and its statement statistics see the statement,
    visible only to the owner tier that can already alter the role. (4) It connects as the scoped login and returns only
    ok, migration_applied, migration_sha256, password_set, owner_is_neon_superuser_member, scope {smoke_usage, ops_usage,
    smoke_create, ops_create, public_create, database_create, connection_limit} and metadata_readable (SELECT count(*) from
    ducklake_smoke.ducklake_metadata). Every psycopg2.Error is re-raised as rt.DuckLakeRuntimeError carrying only the exception
    class name and its SQLSTATE, never its message, because a connect error names the host. Idempotent: a re-run (rotation,
    the RDS swap) re-applies the migration and sets the secret's current password. The DuckLake ATTACH proof stays with
    the telemetry writer's own runtime (PLAN-telemetry-writer-function step 7), since this function's role is scoped to
    the production data prefix. Under 200 SLOC.
