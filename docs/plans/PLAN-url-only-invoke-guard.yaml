infrastructure_dependencies:
- >-
  Who applies what. terraform/bootstrap is applied by hand under agent_platform_admin (terraform/bootstrap/CLAUDE.md), never
  by CI. In terraform/personal, the PlatformDev inline policy is CI-unexecutable by design (Decision 180), so it takes the
  SPLIT-APPLY step of docs/contracts/deploy-paths.yaml#admin_out_of_band.procedure: a targeted out-of-band apply of aws_iam_role_policy.platform_dev_runtime
  first, then the governed path for the rest, and the pending gated-apply run covering the same resource is rejected, never
  approved. The CI-role policy updates (github_ci_branch, github_ci_pr, github_ci_planner) are in budget and the secret
  container is a metadata create under the agent-platform-* secret name prefix, so the governed path auto-applies them.
- >-
  Admin container prerequisites: agent_platform_admin credentials; local terraform init for terraform/bootstrap (hashicorp-only,
  always works) and for terraform/personal (needs the Decision 120 provider filesystem mirror; if it is not synced, stop
  and tell Benjamin, because the PlatformDev split-apply has no other path); the five no-default personal tfvars recovered
  per docs/contracts/terraform-cc-web-operations.yaml. The container has no TCP/5432 egress, so no step connects to Postgres
  directly: the migration, the password set and the reach check all run inside ducklake_maintenance (Decision 204's human-directed
  shape).
- >-
  Lambda deployment (Decision 79): ducklake_maintenance (active) gains the provisioning verb. Merging touches src/lambdas/ducklake_maintenance/**,
  so the push-triggered deploy-ducklake-lambdas.yml run builds it, deploys it in the ungated maintenance leg, checks its
  deploy record and runs the maintenance-smoke gates; step 6 confirms that run and the record, and step 7's invoke is
  the live proof of the verb. LAMBDA-DEPLOY DEFERRED for data-pipeline: affected only through the docs/ROADMAP-PLATFORM.yaml
  asset; no packaged code changes, and the asset refreshes on that artifact's next governed deploy.
- >-
  Ordering: all of steps 5-9 (bootstrap apply, PlatformDev and governed applies, the scoped login with its secret value,
  the live URL-only check and the detection check) complete before PLAN-telemetry-writer-function merges, because that
  plan's gated apply needs the role read and the secret, and its step 7 runs attach_check under the scoped login. PRE-APPLY drain check (deploy-paths.yaml):
  the new Denies narrow the apply role's AddPermission surface on the three functions; confirm no in-flight terraform/personal
  plan adds a permission to them (none exists on main).
- >-
  Side effects to expect: the Decision 202 detectors fire on the boundary policy version change (platform-security-platform-role-iam-change),
  on the PlatformDev inline-policy write and on the trail's PutEventSelectors (platform-security-detector-tamper). Each
  is expected; the report names them so nobody treats them as an incident. CloudTrail data events cost about 0.10 USD per
  100,000 events; the three functions see a few thousand invocations a day at most.
acceptance_criteria:
- >-
  The boundary denies, to every bounded principal: lambda:InvokeFunction / InvokeAsync on the writer, reader and telemetry
  writer unless the call comes through the Function URL; lambda:AddPermission / RemovePermission on them; and Create/UpdateEventSourceMapping
  targeting them. Live: a DryRun direct invoke of the writer and of the reader as PlatformDev is AccessDenied with a message
  that names a permissions boundary (the phrase the telemetry writer's checks rely on), and SigV4 describe through each
  URL is still 200.
- >-
  Every identity grant of lambda:InvokeFunction on those functions in terraform/personal carries Bool lambda:InvokedViaFunctionUrl
  = true, with lambda:InvokeFunctionUrl kept unconditioned; PlatformDev additionally holds both actions on the telemetry
  writer. PlatformAdmin is unchanged.
- >-
  The trail logs Lambda data events for the three functions; a denied direct-invoke record for the writer or reader is
  found in the trail's log group and its shape (eventName, errorCode, the field that marks a URL call) is recorded for
  rec-4204's alarm. If CloudTrail does not record denied DryRun invokes, that finding and the URL-call record shape are
  recorded on rec-4204 instead, and this criterion is met by the record.
- >-
  The bootstrap IAMRolesRead lists the telemetry writer role; the telemetry DSN secret container exists and, after the admin
  steps, holds host, dbname, username ducklake_telemetry_writer, password and sslmode require (the provisioning verb refuses
  any other sslmode).
- >-
  The scoped login exists with the migration's attributes and grants, as reported by provision_telemetry_login: it can
  read the smoke catalog's metadata schema, has no USAGE on the ducklake_ops schema, no CREATE on ducklake_smoke, ducklake_ops,
  public or the database, and connection limit 10. Whether the owner login is a neon_superuser member is measured and
  recorded. The first DuckLake ATTACH under the login is proven by PLAN-telemetry-writer-function step 7, in the function
  that will use it; a Postgres permission error there triggers Decision 213's scoped-login-blocks-verbs condition.
- >-
  The simulate gate passes with the new rows; Decision 213 is in DECISIONS.md with annotations on Decisions 81, 91 and 126;
  T2.36's c2 and intent name the telemetry writer boundary; the standing guard and its red cases pass.
verification_plan:
- step: 1
  phase: pre-deploy
  action: The standing URL-only guard over the real tree, with its red cases.
  command: bin/venv-python -m pytest tests/checks/iam_tf/test_url_only_invoke_guard.py -q
  expected: Exit 0. Red before (module absent; then the boundary, grant, trail and migration predicates fail on the unchanged tree).
  fix_if: Fix the Terraform or the SQL, not the guard, unless the guard asserts something the acceptance criteria do not require.
  hermetic: true
  graduation: graduate
  graduation_check_id: url-only-invoke-guard
  expected_literals: []
- step: 2
  phase: pre-deploy
  action: >-
    The simulate runner carries a boolean context key, the fixture with the new rows parses and passes its shape check,
    and the provisioning verb behaves as specified.
  command: >-
    bin/venv-python -m pytest tests/test_iam_simulate.py tests/checks/contracts/test_validate_iam_simulate_fixture_shape.py
    tests/lambdas/ducklake_maintenance/test_login_actions.py tests/checks/iam_tf/test_platform_role_iam_change_alarms.py -q
  expected: >-
    Exit 0. Red before for the boolean context test, the url-only fixture rows test, the provisioning verb (module absent)
    and the alarm test's new data-selector-first red case (absent).
  fix_if: Fix the runner or the fixture rows; never loosen validate_iam_simulate_fixture_shape.
  hermetic: true
  graduation: waive
  graduation_waiver_reason: >-
    tests/test_iam_simulate.py is already a standing suite, validate_iam_simulate_fixture_shape is a registered check, and
    the new tests/lambdas/ducklake_maintenance/test_login_actions.py becomes standing through full-tier pytest collection;
    this step re-runs them as evidence for the new behaviour.
  expected_literals: []
- step: 3
  phase: pre-deploy
  action: >-
    Scope and safety shape against the merge base, untracked new files included: only this plan's scope files (and the
    plan file's own bookkeeping) changed; no 12-digit literal added anywhere; no aws_secretsmanager_secret_version resource
    added; PlatformAdmin's policy files untouched. (The no-bracket-in-Action-array-comment
    rule is a constraint the implementer reads from the boundary file's own warning; terraform validate in CI parses the
    result. The three plans reach main in one plan PR before implementation, so the sibling plan files are never in this
    diff.)
  command: >-
    bin/venv-python -c "import subprocess,re,yaml,pathlib;g=lambda *a:subprocess.run(['git',*a],capture_output=True,text=True,check=True).stdout;mb=g('merge-base','origin/main','HEAD').strip();new=g('ls-files','--others','--exclude-standard').split();ch=g('diff','--name-only',mb).split()+new;pf='docs/plans/PLAN-url-only-invoke-guard.yaml';sc={e['file']
    for e in yaml.safe_load(open(pf,encoding='utf-8'))['scope']}|{pf};add=[l for l in g('diff',mb).splitlines() if l.startswith('+') and not l.startswith('+++')]+[l
    for f in new for l in pathlib.Path(f).read_text(encoding='utf-8',errors='replace').splitlines()];errs=[p+' outside scope' for p in ch if p not in sc];errs+=[p+' touched'
    for p in ch if p in ('terraform/personal/platform_admin_policies.tf','terraform/personal/platform_admin_data_policies.tf')];errs+=['12-digit
    literal' for l in add if re.search(r'\b\d{12}\b',l)];errs+=['secret version added' for l in add if re.search(r'resource\s+\"aws_secretsmanager_secret_version\"',l)];print(chr(10).join(errs)
    or 'SHAPE_OK');assert not errs"
  expected: Exit 0 and SHAPE_OK.
  fix_if: >-
    Revert the out-of-shape edit; a 12-digit literal becomes interpolation; a secret value never enters Terraform. A file
    outside scope is reverted; if a check forces it, stop and re-plan rather than widening the PR.
  hermetic: false
  graduation: waive
  graduation_waiver_reason: Diff-relative to the merge base by construction; step 1's graduated guard and the secret-material check are the standing equivalents.
- step: 4
  phase: pre-deploy
  action: Fast tier, then the full tier before handoff.
  command: bin/venv-python -m scripts.validate --pre && bin/venv-python -m scripts.validate
  expected: >-
    Exit 0 on a completed full run. handoff_policy.timeout_disposition is blocked, so a timeout is not a pass: resume and
    rerun the full tier from the start.
  fix_if: Fix the named check; never raise a budget or skip a check.
  hermetic: false
  graduation: not-applicable
- step: 5
  phase: post-deploy
  action: >-
    After Benjamin's explicit "merge" and the squash-merge: plan terraform/bootstrap, PRESENT the plan, and apply only after
    Benjamin explicitly accepts it. The plan must show exactly three in-place updates (aws_iam_policy.github_ci_apply_boundary,
    aws_iam_policy.github_ci_apply_reads, aws_cloudtrail.platform_security) and nothing else; stop on any replace or destroy.
    Save the apply output to $BOOTSTRAP_APPLY_LOG, then run the standing simulate gate.
  command: >-
    test -s "$BOOTSTRAP_APPLY_LOG" && grep -q 'Apply complete! Resources: 0 added, 3 changed, 0 destroyed' "$BOOTSTRAP_APPLY_LOG"
    && bin/venv-python -m scripts.ci.iam_simulate --profile agent_platform_admin --fixture docs/contracts/iam-simulate-fixture.yaml
  expected: Exit 0; the apply summary is exactly 0 added, 3 changed, 0 destroyed; the simulate gate reports zero mismatches.
  fix_if: >-
    A mismatch on a new row means the boundary statement is wrong; fix the HCL and re-apply through the same human gate. A
    mismatch on an old row is a regression: stop and report it. Never edit the fixture to match the live result. If PutEventSelectors
    rejects the telemetry writer's ARN because the function does not exist yet (the two policies may already have applied;
    a re-plan then shows only the trail): stop and tell Benjamin. The fallback is a follow-up PR that names only the writer
    and reader in the selector and in the guard's predicate (c), with the telemetry writer added by a bootstrap apply after
    PLAN-telemetry-writer-function creates it, tracked on rec-4204.
- step: 6
  phase: post-deploy
  action: >-
    PlatformDev split-apply (deploy-paths.yaml SPLIT-APPLY): from merged main, terraform/personal plan -target=aws_iam_role_policy.platform_dev_runtime,
    PRESENT it, apply on Benjamin's explicit acceptance, save the output to $PERSONAL_TARGET_LOG. Then reject (never approve)
    the pending tf-gated-apply run for the merge commit and let the governed path apply the remainder (the three CI role
    policies, the maintenance role policy and the secret container), via the acknowledge-and-retry dispatch the contract
    names if the record latched; save that run's apply log to $GOVERNED_APPLY_LOG. Confirm the merge commit's push-triggered
    deploy-ducklake-lambdas.yml run concluded success (export DEPLOY_CONCLUSION) and that ducklake_maintenance's deploy
    record carries the merge commit (export MERGE_SHA).
  command: >-
    test -s "$PERSONAL_TARGET_LOG" && grep -q 'Apply complete! Resources: 0 added, 1 changed, 0 destroyed' "$PERSONAL_TARGET_LOG"
    && test -s "$GOVERNED_APPLY_LOG" && grep -q 'aws_secretsmanager_secret.ducklake_telemetry_writer_dsn: Creation complete' "$GOVERNED_APPLY_LOG"
    && for r in github_ci_branch github_ci_pr github_ci_planner ducklake_maintenance; do grep -q "aws_iam_role_policy.$r: Modifications complete"
    "$GOVERNED_APPLY_LOG" || exit 1; done && test "$DEPLOY_CONCLUSION" = success && aws s3 cp s3://agent-platform-data-lake/deploy-records/ducklake/agent-platform-ducklake-maintenance.json
    - --profile agent_platform_admin | bin/venv-python -c "import json,os,sys;r=json.load(sys.stdin);assert r['source_git_sha']==os.environ['MERGE_SHA'],
    'maintenance deploy record stale';print('MAINTENANCE_DEPLOYED')" && aws s3 cp s3://agent-platform-data-lake/convergence/personal/sandbox.json - --profile agent_platform_admin
    | bin/venv-python -c "import json,sys;c=json.load(sys.stdin);assert c['status']=='green', c.get('red_cause');print('CONVERGED')"
    && echo PERSONAL_APPLIED
  expected: Exit 0, MAINTENANCE_DEPLOYED, CONVERGED and PERSONAL_APPLIED. (If the maintenance role policy resource is named
    differently, assert the same set from the speculative-plan comment and record it.)
  fix_if: >-
    No provider mirror locally: stop and tell Benjamin (no other path exists for the PlatformDev policy). A red record: read
    red_cause (Decision 190) and follow the contract's heal; never approve the gated run for PlatformDev.
- step: 7
  phase: post-deploy
  action: >-  # pragma: allowlist secret -- names Secrets Manager API fields and a generated value, no credential
    The scoped login, under Decision 213 cl.5 and deploy-paths.yaml's scoped_login_provisioning procedure: present each
    mutation and run it only after Benjamin accepts it. Mutation 1, presented and run exactly as written (host and dbname
    from the owner DSN, sslmode require, a fresh generated password; nothing but SECRET_WRITTEN is printed and the password
    is never displayed, logged or written to disk): AWS_DEFAULT_REGION=eu-west-2 bin/venv-python -c "import json,secrets,boto3;from src.common import ducklake_runtime as rt;o=rt.fetch_dsn(profile='agent_platform_admin');v={'host':o['host'],'dbname':o['dbname'],'sslmode':'require','username':'ducklake_telemetry_writer'};v['pass'+'word']=secrets.token_urlsafe(32);boto3.Session(profile_name='agent_platform_admin',region_name='eu-west-2').client('secretsmanager').put_secret_value(SecretId='agent-platform-ducklake-telemetry-writer-dsn',SecretString=json.dumps(v));print('SECRET_WRITTEN')". Mutation 2 is this step's invoke, which applies the SQL,
    sets the password from the secret and reports the login's reach; the command then checks the result, status first,
    then the deployed SQL's hash against the merged file.
  command: >-
    P="${TMPDIR:-/tmp}/provision.json" && AWS_MAX_ATTEMPTS=1 aws lambda invoke --profile agent_platform_admin --region eu-west-2
    --cli-read-timeout 300 --function-name agent-platform-ducklake-maintenance --cli-binary-format raw-in-base64-out --payload
    '{"action":"provision_telemetry_login","confirm":"ducklake_telemetry_writer"}' "$P" > /dev/null && bin/venv-python -c "import
    json,sys,hashlib;r=json.load(open(sys.argv[1]));assert 'body' in r, 'FunctionError '+str(r.get('errorType'));b=json.loads(r['body']);print('PROVISION',r['statusCode'],b.get('error_type'),b.get('scope'),'neon_superuser_member=',b.get('owner_is_neon_superuser_member'));assert
    r['statusCode']==200 and b['ok'] is True, 'provision refused';sha=hashlib.sha256(open('src/lambdas/ducklake_maintenance/ducklake_telemetry_writer_role.sql','rb').read()).hexdigest();assert
    b.get('migration_sha256')==sha, 'deployed SQL differs from the merged file';assert b['metadata_readable'] is True and b['scope']=={'smoke_usage':True,'ops_usage':False,'smoke_create':False,'ops_create':False,'public_create':False,'database_create':False,'connection_limit':10};print('SCOPED_LOGIN_OK')"
    "$P"
  expected: >-
    PROVISION 200 with the expected scope, and SCOPED_LOGIN_OK. The neon_superuser measurement for the owner login is recorded
    in the report as a boolean (checked against Decision 107's "scoped non-owner role" control; the project thread files
    a rec if it is true).
  fix_if: >-
    "provision refused" (a 500, or a 400 if the verb is not deployed yet): read error_type and error (a confirm or secret mismatch names itself; a database error
    names only its class and SQLSTATE). "FunctionError <type>": an exception escaped the dispatcher (for example a Secrets
    Manager ClientError); report the errorType only and never paste errorMessage or the output file, which can carry ARNs;
    read the function's log group for the cause. USAGE on ducklake_ops or CREATE granted: the role inherited a privilege (check NOINHERIT and memberships)
    or a default privilege leaked; fix the SQL by PR, whose merge redeploys ducklake_maintenance through the governed channel,
    confirm its deploy record carries that merge, then re-run mutation 2; never widen the check. metadata_readable false:
    the table grant is missing; fix the SQL the same way. migration_sha256 differs: the deployed maintenance code is stale;
    dispatch deploy-ducklake-lambdas.yml and confirm the record before re-running. TooManyRequestsException: reserved concurrency
    1 is held by a scheduled merge_ops, gc_ops or control_health run; wait for it and re-run on Benjamin's word. A timeout or lost response:
    the verb is idempotent, so read the function's log group before deciding to re-run, and re-run only on Benjamin's word.
    Never print the DSN or password.
- step: 8
  phase: post-deploy
  action: >-
    URL-only holds live for PlatformDev. If the agent_platform profile exists in this container: DryRun direct invoke of
    the writer and the reader is AccessDenied and the error names a permissions boundary (only the classification is printed,
    never the message, which carries ARNs), and SigV4 describe through each URL is 200. If the profile is absent, say so;
    the project thread runs the same check.
  command: >-
    for fn in writer reader; do ! aws lambda invoke --profile agent_platform --region eu-west-2 --function-name agent-platform-ducklake-$fn
    --invocation-type DryRun /dev/null 2> "${TMPDIR:-/tmp}/dry-$fn.err" && grep -q AccessDeniedException "${TMPDIR:-/tmp}/dry-$fn.err"
    && grep -qi 'explicit deny in a permissions boundary' "${TMPDIR:-/tmp}/dry-$fn.err" && echo "$fn BOUNDARY_DENIED" || exit 1; done
    && bin/venv-python -c "import boto3;from scripts.ducklake_smoke import core;[core._ok_json(core._sigv4_invoke(boto3.Session(profile_name='agent_platform',region_name='eu-west-2').client('ssm').get_parameter(Name='/agent-platform/ducklake/'+r+'_url')['Parameter']['Value'],{'action':'describe'},profile='agent_platform'))
    for r in ('writer','reader')];print('URL_ONLY_LIVE_OK')"
  expected: Exit 0 and URL_ONLY_LIVE_OK. The URLs are never printed.
  fix_if: >-
    A DryRun that succeeds: the boundary Deny is not in force; compare the live policy version with step 5. AccessDenied
    without the boundary phrase while step 5's simulate rows report explicitDeny: Lambda's message does not name the policy
    type, so stop and tell Benjamin before either telemetry-writer plan merges, because their checks assert the phrase
    and must be re-planned. A URL 403: the
    PlatformDev split or the boundary broke the URL path; restore URL access first (re-apply the previous PlatformDev policy
    through the same gate), then RCA.
- step: 9
  phase: post-deploy
  action: >-
    Detection: after step 8's DryRun attempts, the trail's CloudWatch log group (platform-security-cloudtrail) holds a Lambda
    data event for them within about 15 minutes. Record the record shape (eventName, errorCode, and which field distinguishes
    an InvokeFunctionUrl call) in the report for the follow-on alarm.
  command: >-
    aws logs filter-log-events --profile agent_platform_admin --region eu-west-2 --log-group-name platform-security-cloudtrail
    --start-time $(( ($(date +%s) - 3600) * 1000 )) --filter-pattern '{ ($.eventSource = "lambda.amazonaws.com") && ($.eventCategory
    = "Data") && ($.errorCode = "AccessDenied*") }' --max-items 5 --query 'events[].message' --output text | grep -Eq 'agent-platform-ducklake-(writer|reader)"'
    && echo DENIED_INVOKE_LOGGED
  expected: Exit 0 and DENIED_INVOKE_LOGGED; the record's eventName, errorCode and URL-marking field are written into the report (no ARN).
  fix_if: >-
    No denied record after 30 minutes: rerun the filter without the errorCode term. If step 8's URL calls appear but the
    denied DryRun does not, CloudTrail does not record denied DryRun invokes; record that on rec-4204 (its alarm then needs
    a non-DryRun probe). No data events at all: confirm the selectors with aws cloudtrail get-event-selectors; if InvokeFunctionUrl
    events need an advanced selector, record it on rec-4204 rather than widening this plan.
