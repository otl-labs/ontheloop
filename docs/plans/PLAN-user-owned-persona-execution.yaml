schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: user-owned-persona-execution
intent: >-
  Record Decision 234 (operator-confirmed 2026-10-23). The default local persona_compute_host adapter is a per-run git
  clone plus Anthropic's open-source sandbox-runtime wrapping the whole persona process for any model, proven by a
  deterministic cross-OS conformance suite against the port's one oracle; on user-owned substrate the planning,
  implementation and consult personas default to it and the verdict personas default to GitHub Actions. A subscription
  runs only work its owner initiated, and a subscription-backed verdict job runs only on its owner's own pull requests
  (amending Decision 206 clause 2). The non-GitHub hedge amends Decision 212 clause 5: a forge candidate order, an
  accepted pull-request coupling while the repository bootstraps, local model servers through LiteLLM with
  billing_shape local, and a licence-sensitivity note on Decision 194. The adapter is a deferred_post_mvp tier item.
  Governance, contract and roadmap encoding only: no code, workflow, terraform, IAM, spend or deploy.
plan_type: IMPLEMENTATION
implementation_declared: true
amends: ['dec:206#2', 'dec:212#5']
introduces: [T4.34]
verification_tier: V1
plan_path: docs/plans/PLAN-user-owned-persona-execution.yaml
phase: >-
  Platform T4, post-MVP free-tier substrate. Creates deferred_post_mvp T4.34 (the local sandboxed persona host,
  depending on live T4.32, with deferred T4.27 blocking only its c7 and c8) and annotates T4.27 c10 and c11 and T4.19
  c6; cites T4.15 c10, T4.32 c1, T4.23 c6 and T4.24 c11 without changing them. Overseer run otl-product-direction: implemented after Decisions 232/233
  (product-surface-and-open-core) and before Decision 235 (verification-weakening-earned-autonomy).
scope:
- file: docs/DECISIONS.md
  action: Modify
  purpose: >-
    New Decision 234 (STEP 1 holds the authoritative text, about 6,074 bytes once dated, under the 6,144 cap): bare yaml
    envelope amends [206, 212], significance numbered_decision, five clauses, a monitored reversal stanza and a
    Coverage line. STEP 2 appends dated lines: '> **Amended by Decision 234 (DATE):**' to Decisions 206 and 212 and
    '> **Update (DATE):**' to Decision 194. No existing body line is edited (Decision 177).
- file: docs/decisions-index.json
  action: Modify
  purpose: Regenerated by scripts.decisions_index --write after the DECISIONS.md edit, never hand-edited.
- file: docs/contracts/ports.yaml
  action: Modify
  purpose: >-
    persona_compute_host gains two pending adapters, sandbox_runtime (supported) and sandbox_runtime_windows
    (experimental), owned by T4.34:c1; its oracle stays local_container and run_image stays the provisional verb. A new
    coupling finding (PC-09 at drafting; ports work_item_storage, orchestration_host and change_surface) records every
    specified pull-request identifier as ACCEPTED, held by Decision 234. One amendment_log row. No port and no
    change_surface adapter is added.
- file: docs/contracts/inference-provider.yaml
  action: Modify
  purpose: >-
    Local-model rows only: model_id_formats.litellm_local_servers with ollama and vllm (reached through LiteLLM, filling
    no tier role, their calls carrying billing_shape local per Decision 234 clause 4, the vocabulary change owned by
    rec-4561), decisions_cited gains Decision-234, one amendment_log row. tier_model, billing_shape_vocabulary,
    litellm_tier_models and the vocabulary block (where the sibling product-surface-and-open-core adds a row) are not
    touched.
- file: docs/ROADMAP-PLATFORM.yaml
  action: Modify
  purpose: >-
    New deferred_post_mvp tier item T4.34 (about 55 lines) after the last T4 item; dated bracketed amendments on T4.27
    c10 and c11 plus 234 in T4.27's related_decisions; and a dated bracketed amendment on T4.19 c6 (the owner of Decision 234
    clause 4's change-id rule for loop identifiers) plus 234 in T4.19's related_decisions.
bundled_recommendations: []
followon_recs: [rec-4561, rec-4566]
infrastructure_dependencies:
- >-
  LAMBDA-DEPLOY DEFERRED (CD.16 / Decision 79), per-artifact disposition. compute_affected_artifacts(<this plan's scope>)
  returns {'data-pipeline': ['docs/ROADMAP-PLATFORM.yaml']}: the live roadmap is a packaged asset of the active
  data-pipeline artifact. No build, deploy or smoke test is owed: the change is data only (one tier item and one
  bracket, no packaged code); its sole runtime reader, src/data/handlers/scheduled_agent_handler.py, puts the raw text
  into a prompt behind a disabled schedule, and the asset refreshes with the artifact's next governed deploy. No other
  scope file is Lambda-packaged and no .tf file is in scope. Precedent: PLAN-persona-first-migration; the standing gap
  between Decision 79's letter and this practice is open rec-3846.
acceptance_criteria:
- >-
  Exactly one Decision whose title starts 'User-owned persona execution' exists, at or under 6,144 bytes, with a bare
  yaml envelope (number N, amends [206, 212], value numbered_decision), title amends edges [206, 212] and no other body
  amends/supersedes edge, clauses 1-5 as STEP 1 drafts them, the Options-considered line, a monitored reversal stanza
  (srt-preview-ends, confinement-fails, forge-or-local-versioning) and a Coverage line citing rec-4561, and no
  public-boundary token (VP 1 size check, VP 2).
- >-
  Decisions 206 and 212 each carry a dated Amended-by line naming N, and Decision 194 a dated Update line naming N, each
  after its Related paragraph; every original body is intact (VP 3, VP 8). docs/decisions-index.json is fresh (VP 4).
- >-
  ports.yaml registers sandbox_runtime and sandbox_runtime_windows as persona_compute_host adapters, keeps
  local_container the oracle, records the forge-neutral coupling row Decision 234 cites (its census naming every
  specified pull-request identifier: the work-item record, the persona and loop identifiers of T4.31, T4.2, T4.1,
  T4.9a, T4.9, CD.38 and T4.16, the plan projection of T4.5, and telemetry_sessions.pr_url as a pointer), and passes
  validate_ports_contract (VP 5); at merge the adapters are pending with
  tiers supported and experimental and owner T4.34:c1, change_surface still has only its github adapter, the row is
  accepted and owned by dec-N, and the open-coupling count equals origin/main's (VP 9).
- >-
  inference-provider.yaml carries litellm_local_servers rows ollama and vllm that fill no tier role and name
  billing_shape local, with no tier row selecting them, and passes validate_inference_provider_registry (VP 6); at
  merge both rows cite rec-4561 (VP 9).
- >-
  T4.34 exists with depends_on including T4.32, criteria c1-c8 as STEP 6 drafts them and Decision 234 in
  related_decisions; T4.27 c10, T4.27 c11 and T4.19 c6 carry their dated Decision 234 brackets and both items list 234
  (VP 7); at merge T4.34 is deferred_post_mvp, depends exactly on [T4.32], has every criterion open with c6 blocked_by
  T4.24, c7 by T4.24 and T4.27 and c8 by T4.27, and no live item depends on it (VP 9).
- >-
  rec-4561 is open (VP 11) and rec-4566 is open after merge (VP 12). The full presubmit tier passes on the committed,
  rebased tree (VP 1); after merge dec-N is in ops_decisions (VP 10).
verification_plan:
- step: 1
  phase: pre-deploy
  action: >-
    Full tier on the committed, rebased, clean tree, then attest HEAD (git-ops handoff_sequence). Decision-entry
    conformance, the per-entry size cap on the new entry, supersession annotations, reversal stanzas, currency, index
    freshness, the roadmap schema, Decision 93, liveness, the ports and inference-provider checks and graduation
    completeness gate here.
  command: bin/venv-python -m scripts.validate && bin/venv-python -m scripts.checks.validation_result --verify-head
  expected: Exit 0 on a completed full-tier run, then --verify-head attests HEAD's committed tree.
  fix_if: >-
    A validate_decisions_size FAIL on the new entry means tighten its prose, never raise the cap. WARN-only accretion
    lines for Decisions 206, 212 and 194 are expected (each is over 6,144 bytes after its line) and are not failures. A
    liveness FAIL means an edge into the toxic set: drop it, never grow the baseline.
  hermetic: false
  graduation: not-applicable
- step: 2
  phase: pre-deploy
  action: >-
    THE DECISION EXISTS, IS ENVELOPED, CARRIES EVERY CLAUSE, CITES THE FORGE-NEUTRAL COUPLING ROW AND STAYS INSIDE THE
    PUBLIC-CONTENT BOUNDARY. Located by title, so it survives renumbering; its size is left to validate_decisions_size
    (VP 1), and the edge and token asserts read only the pre-annotation body (split at the first '> **' or bare
    '[Amendment' trailer), so a later sanctioned dated line never falsifies the shard (rec-4390's defect class; VP 9
    checks the body is whole at merge). Red on origin/main.
  command: &vp2cmd >-
    bin/venv-python -c "import re,pathlib,yaml; from scripts.decisions_md import extract_amends_edges as ae;
    t=pathlib.Path('docs/DECISIONS.md').read_text(encoding='utf-8'); es=[m for m in re.finditer(r'^## Decision (\d+):
    (.*?)\n(.*?)(?=^## Decision |\Z)', t, re.M|re.S) if m.group(2).startswith('User-owned persona execution')];
    assert len(es)==1, ('expected exactly one user-owned persona execution Decision', [e.group(1) for e in es]);
    n=es[0].group(1); b=es[0].group(0); assert re.search('^'+chr(96)*3+r'yaml\s*\nnumber: '+n+r'\b', b, re.M), 'no bare
    yaml envelope carrying number '+n; assert 'value: numbered_decision' in b and chr(10)+'amends: [206, 212]'+chr(10) in
    b, 'envelope amends list'; assert ae(es[0].group(2))==[206, 212], ('title amends edges', ae(es[0].group(2)));
    core=re.split(r'\n> \*\*|\n\[Amendment ', b)[0]; edges=re.findall(r'(?:amends|Amends|supersedes|Supersedes)
    Decision (\d+)', core); assert edges==['206'], ('unexpected amends/supersedes edges', edges); assert 'dec-'+n+' (per
    Decision 84' in b and 'decision: '+n+chr(10) in b, 'Warehouse ID or stanza number drift'; bad=[w for w in
    ['Theseus','Guerdon','arn:',chr(36),chr(163),chr(8364)] if w in core]+re.findall(r'\b\d{12}\b', core); assert not
    bad, ('public-boundary token', bad);
    p=yaml.safe_load(open('docs/contracts/ports.yaml')); pc=re.search(r'ports\.yaml (PC-\d+)', b); assert pc and
    pc.group(1) in [c['id'] for c in p['coupling_findings']], ('cited coupling row absent from ports.yaml', pc and
    pc.group(1)); need=['per-run git clone plus
    Anthropic','sandbox-runtime (srt; Apache-2.0; research preview)','WHOLE persona process (Decision 206 clause
    5)','for any persona_backend','sandbox_runtime (macOS, Linux, WSL2) is supported','sandbox_runtime_windows (alpha
    upstream) experimental (Decision 212 clause 7)','pinned to an exact version','write-scoping plus network control,
    not containment','reads are not isolated across sandboxed sessions','OS-TLS tools cannot make HTTPS
    calls','Decision 205 clause 2 keeps GitHub work in the shell','in-persona package restore is an experimental
    limit','containers (local_container) and remote hosts stay the stronger tiers','the planning, implementation and
    consult personas default here','verdict personas default to GitHub Actions and may be configured here, still
    posting a check run','one gating suite against its local_container oracle','a write outside the workspace is
    denied','a direct egress connection is denied','Linux, macOS and Windows runners','alarm-not-gate while
    experimental','T4.15 c10','A pin bump runs the suite','run_image verb generalises to a pinned runtime
    reference','suite, not the one-digest rule','T4.32 c1','A subscription runs only work its owner initiated','own
    unattended queue included','action triggers','runs only on a pull request its owner authored','the thin shell
    checks the pull request','and the run','triggering actor against the subscription owner','team API key (byok) through
    LiteLLM or the verdict fails, never skips (Decision 205 clause 2)','per-run state signed in by a credential passed
    by name','setup-token), never the owner','terms of service still apply','Decision 184 clause 4','Forgejo or Gitea','then
    GitLab, then bare git','Decision 184 clause 3 and Decision 205 clause 2 re-decided (coupling PC-02)','Decision 212
    clause 7','Core surfaces specified after this Decision reference a generic change id, never a pull request
    number','accepted while the repository bootstraps','change-id rule -- T4.19 c6, unenforced','validate_ports_contract and
    the graduated shards','A linked worktree -- rejected','shared .git','Ollama,
    vLLM','Decision 212 clause 6','billing_shape local','Decision 199 clause 1, Decision 217 clause
    4','rec-4561','T4.34, Decision 93','Claude Code on the web as persona compute -- parked','a vendor may restrict such
    a lane at scale','never load-bearing','yaml
    reversal-conditions','srt-preview-ends','confinement-fails','forge-or-local-versioning','fully local product work
    starts in earnest','demand forces local versioning','Coverage (Decision 181 cl.2)','T4.34 c1-c8','saved-login
    contract rows -- rec-4566']; miss=[x for x in need if x not
    in b]; assert not miss, ('Decision text missing', miss); print('DEC_USER_OWNED_PERSONA_OK', n,
    len(b.encode('utf-8')))"
  expected: Prints the marker, the number and the entry's byte size (about 6,074).
  fix_if: >-
    A missing phrase means a clause was paraphrased: restore STEP 1's text. An extra edge means a body phrase reads
    'amends/supersedes Decision N': reword it. A public-boundary token means remove it; never waive.
  hermetic: true
  graduation: graduate
  graduation_check_id: user-owned-persona-execution-decision-recorded
  expected_literals: []
- step: 3
  phase: pre-deploy
  action: >-
    DECISIONS 206 AND 212 CARRY A DATED AMENDED-BY LINE NAMING N, AND 194 A DATED UPDATE LINE NAMING N, each after its
    Related paragraph, the first such line carrying this plan's phrases (later sanctioned lines naming N may follow);
    each original body survives (Decision 177). Red on origin/main, where no line cites the new Decision.
  command: >-
    bin/venv-python -c "import re,pathlib; t=pathlib.Path('docs/DECISIONS.md').read_text(encoding='utf-8'); es=[m for m
