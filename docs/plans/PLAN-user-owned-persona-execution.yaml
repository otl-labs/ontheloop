    pat={'206':r'> \*\*Amended by Decision '+n+D,'212':r'> \*\*Amended by Decision '+n+D,'194':r'> \*\*Update'+D};
    need={'206':['Clause 2','a subscription runs only work its owner initiated','own unattended queue','triggering
