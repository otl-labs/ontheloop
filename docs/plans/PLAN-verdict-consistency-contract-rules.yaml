    verification_step: 1
    test_selector: tests/persona_backends/test_verdict_consistency.py::test_real_code_reviewer_contradiction_is_schema_invalid
    red_green_expectation: red before (no rule; the nodes are absent), green after.
  - source: docs/contracts/personas/plan_critic.yaml
    behavior: The rule gives REVISE for a blocking finding and PROCEED for nits only.
    verification_step: 1
    test_selector: tests/persona_backends/test_verdict_consistency.py::test_real_contract_rules
    red_green_expectation: red before (no rule; the node is absent), green after.
  - source: docs/contracts/personas/decision_scout.yaml
    behavior: The rule's three ordered outcomes, each FLAGS_FOUND condition (contradictions, spirit, a CONFLICT roadmap.rows lane) deciding on its own.
    verification_step: 1
    test_selector: tests/persona_backends/test_verdict_consistency.py::test_real_contract_rules
    red_green_expectation: red before (no rule; the node is absent), green after.
  - source: docs/contracts/executor-personas.yaml
    behavior: The field is declared and required of every verdict persona; a verdict contract without a rule is refused.
    verification_step: 2
    test_selector: tests/checks/contracts/test_validate_persona_contracts.py::test_verdict_contract_without_rule_is_refused
    red_green_expectation: red before (the rule is optional, so the fixture without one passes), green after.
  - source: scripts/checks/contracts/validate_persona_contracts.py
    behavior: A non-mapping properties or a mixed-type verdict enum yields a failure, never an exception (rec-5321).
    verification_step: 2
    test_selector: tests/checks/contracts/test_validate_persona_contracts_malformed_schema.py
    red_green_expectation: red before (a whole-tree "missing or unreadable" abort or a TypeError), green after.
