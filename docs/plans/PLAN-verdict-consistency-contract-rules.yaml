schema_version: 6
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: verdict-consistency-contract-rules
intent: >-
  Plan 2b of the run_persona litellm backend series (T4.32 c1, backend leg; rec-5052): the three verdict persona
  contracts (code_reviewer, plan_critic, decision_scout) each gain a verdict_consistency rule, their prose verdict rule
  as data in plan 2a's closed grammar, and go to contract_version 2 with re-rendered prompts and a widened
  schema_invalid meaning; executor-personas.yaml declares the field, requires it of every verdict persona and names the
  verdict check in run_persona.result and failure_envelope. With plan 2a's evaluator on main (#2160), a verdict that
  contradicts the persona's own findings costs one repair turn and then schema_invalid, never a contradictory success.
  Bundles rec-5320 (a parity test of the two rule shape checks) and rec-5321 (the validator's verdict-enum read never
  raises). Serves NS.9: a verdict posted as a GitHub check cannot contradict its own findings.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-verdict-consistency-contract-rules.yaml
phase: >-
  T4.32 c1 (backend leg, part); closes no criterion. T4.32 is in_progress; plan 1 built as #2132 and plan 2a
  (PLAN-run-persona-verdict-consistency) built as #2160 (2573cc06). Contracts, prompts and tests deploy nothing; the
  validator is a CI check (V2). closes_criteria is []: this is a partial c1 leg, so naming T4.32:c1 would falsely mark it
  met (plan 1, 2a and 4 precedent).
closes_criteria: []
cites: [dec:206, dec:235, dec:246]
scope:
  - file: docs/contracts/executor-personas.yaml
    action: Modify
    purpose: >-
      Approved text only (sidecar docs/plans/approved/verdict-consistency-contract-rules.yaml blocks i01-i05): an
      amendment_log row; run_persona.result checks a success's verdict against the contract's verdict_consistency rule
      (anchored on the sentence before "and a run past max_revisions", which plan 4 rewrites from); the
      persona_contract.fields.verdict_consistency grammar text; required_for_verdict [skill_tether,
      verdict_consistency]; failure_envelope.required_ids.schema_invalid widened.
  - file: docs/contracts/personas/code_reviewer.yaml
    action: Modify
    purpose: >-
      Approved text c01-c04: contract_version 2; verdict_consistency (REVISE when any findings[].severity in [Critical,
      High], otherwise PROCEED) between output_schema and capabilities; the widened schema_invalid meaning; the new
      rendered_prompt_sha256.
  - file: docs/contracts/personas/plan_critic.yaml
    action: Modify
    purpose: >-
      Approved text p01-p04: contract_version 2; verdict_consistency (REVISE when any findings[].severity in
      [blocking], otherwise PROCEED); the widened schema_invalid meaning; the new rendered_prompt_sha256.
  - file: docs/contracts/personas/decision_scout.yaml
    action: Modify
    purpose: >-
      Approved text d01-d04: contract_version 2; verdict_consistency (BLOCK when any contradictions[].severity in
      [BLOCK]; FLAGS_FOUND when any contradictions element, any spirit element or any roadmap.rows[].lane in
      [CONFLICT]; otherwise NO_FLAGS); the widened schema_invalid meaning; the new rendered_prompt_sha256.
  - file: docs/contracts/personas/rendered/code_reviewer.txt
    action: Modify
    purpose: Approved text rc01-rc02, regenerated with `bin/venv-python -m scripts.persona_contracts.render --write code_reviewer`.
  - file: docs/contracts/personas/rendered/plan_critic.txt
    action: Modify
    purpose: Approved text rp01-rp02, regenerated with `bin/venv-python -m scripts.persona_contracts.render --write plan_critic`.
  - file: docs/contracts/personas/rendered/decision_scout.txt
    action: Modify
    purpose: Approved text rd01-rd02, regenerated with `bin/venv-python -m scripts.persona_contracts.render --write decision_scout`.
  - file: tests/persona_backends/test_verdict_consistency.py
    action: Modify
    purpose: >-
      test_real_contract_rules (rec-5052's acceptance node), parametrized over the cases of AC1, each loading the real
      contract with src.persona_backends.contract.load and evaluating src.persona_backends.verdict.expected on a partial
      value (the evaluator needs only the rule's arrays). test_real_code_reviewer_contradiction_is_schema_invalid: a run
      through the fake transport on the real code_reviewer contract (fakes.drive with contract= the real path), with a
      materialised input holding every field code_reviewer's input_schema requires (head_sha 40 lower-case hex;
      fakes.good_input() would end in input_incomplete) and max_revisions + 1 scripted terminal turns, each a
      schema-valid success with verdict PROCEED and one High finding, ends in schema_invalid with the repair message
      naming REVISE. test_index_declares_and_requires_rule: executor-personas.yaml persona_contract.fields carries
      verdict_consistency and required_for_verdict lists it (the Decision 86 scout note: the declaration and its check
      land together).
  - file: tests/checks/contracts/test_validate_persona_contracts.py
    action: Modify
    purpose: >-
      test_verdict_contract_without_rule_is_refused: the fixture tree's verdict contract with verdict_consistency popped
      (re-rendered) fails with "missing required field(s)", since the fixture tree copies the real index.
  - file: scripts/checks/contracts/validate_persona_contracts.py
    action: Modify
    purpose: >-
      rec-5321: one helper, _verdict_enum(output_schema) -> list | None, reads output_schema's properties and the
      verdict property only when each is a mapping and returns the enum only when it is a list, else None; it never
      raises. Both verdict-enum reads use it: _tether_failures (today line 241, which runs first) and
      _verdict_rule_failures (today line 317), which compares the rule's verdicts with the enum as multisets
      (collections.Counter) instead of sorted(), so a non-mapping properties, a non-mapping verdict property or a
      mixed-type enum yields that check's own verdict-enum failure, never an AttributeError (which the outer except
      turns into a whole-tree "missing or unreadable" abort) or a TypeError. The module docstring's "an optional
      verdict_consistency rule" becomes "a verdict_consistency rule (required of a verdict persona by the index's
      required_for_verdict)". The mirror suite's existing nodes execute every changed line.
  - file: tests/checks/contracts/test_validate_persona_contracts_malformed_schema.py
    action: Create
    purpose: >-
      rec-5321's acceptance node test_malformed_output_schema_yields_failure_not_exception (acceptance re-pointed to this
      path 2026-11-17, read back), parametrized over a list properties, a non-mapping verdict property and a verdict enum
      mixing a string and an integer: end to end on the fixture tree (build_tree, edit_contract with rerender=True,
      validate_persona_contracts), the failures hold a verdict-enum failure naming fixture_verdict and none containing
      "missing or unreadable", and nothing raises. The path is under the executor boundary prefix
      tests/checks/contracts/test_validate_persona_contract (capabilities.yaml boundary_patterns), as the validator's
      tests must be.
  - file: tests/persona_backends/test_verdict_rule_shape_parity.py
    action: Create
    purpose: >-
      rec-5320's acceptance node test_both_shape_checks_agree_on_generated_rules: from the fixture RULE, generate every
      one-step variant (drop each key at every level; replace each value at every level with None, 5, "x", [], {} and a
      one-element list of it; add an extra key at every level) plus MALFORMED_RULES, and assert the validator's
      _malformed_rule and the loader's _rule_malformed give the same answer on each (at least 60 variants, both answers
      seen).
bundled_recommendations: [rec-5052, rec-5320, rec-5321]
followon_recs: []
infrastructure_dependencies: []
acceptance_criteria:
  - >-
    On the real contracts, verdict.expected gives: code_reviewer PROCEED with Medium findings only and REVISE with one
    High; plan_critic PROCEED with nits only and REVISE with one blocking; decision_scout FLAGS_FOUND with only a WARN
    contradiction, FLAGS_FOUND with only a spirit flag, FLAGS_FOUND with only a CONFLICT roadmap row, BLOCK with a
    BLOCK contradiction plus a CONFLICT row, NO_FLAGS with only CITE and RELATED rows, and NO_FLAGS with roadmap
    unavailable and no rows (test_real_contract_rules).
  - >-
    A litellm run on the real code_reviewer contract whose every terminal turn says PROCEED with a High finding returns
    schema_invalid, never the success.
  - >-
    The three contracts and three rendered prompts, and executor-personas.yaml, carry exactly the sidecar's 23 blocks
    (approved_text verify exits 0); validate_persona_contracts and the render check pass on the real tree; a verdict
    contract without a rule is refused.
  - >-
    The validator's and the loader's rule shape checks agree on every generated variant (rec-5320), and
    validate_persona_contracts reports a verdict-enum failure, never an exception or a whole-tree abort, on a
    non-mapping properties, a non-mapping verdict property or a mixed-type enum (rec-5321).
  - rec-5052, rec-5320 and rec-5321 read closed after the build's squash-merge.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: The real contracts' rules on partial values, the real code_reviewer run, and the index declaration.
    command: >-
      bin/venv-python -m pytest tests/persona_backends/test_verdict_consistency.py::test_real_contract_rules
      tests/persona_backends/test_verdict_consistency.py::test_real_code_reviewer_contradiction_is_schema_invalid
      tests/persona_backends/test_verdict_consistency.py::test_index_declares_and_requires_rule -q
    expected: >-
      Exit 0, every node passes. Red before: the three nodes are absent (pytest exit 4, target_absent), so the plan PR's
      red-before replay never sees plan 2a's passing nodes (Decision 189 cl.1; scout r1 WARN).
    expected_literals: []
    fix_if: >-
      A case gives the wrong verdict: fix the contract's rule only if it differs from the sidecar (approved text), else
      STOP to this planning thread; never change a case's expectation.
    hermetic: true
    graduation: graduate
    graduation_check_id: verdict-consistency-contract-rules
  - step: 2
    phase: pre-deploy
    action: The validator suites, the fixture trees, the two bundled-rec nodes and plan 1 and 2a's backend suites.
    command: >-
      bin/venv-python -m pytest tests/checks/contracts/test_validate_persona_contracts.py
      tests/checks/contracts/test_validate_persona_contracts_malformed_schema.py
      tests/persona_backends/test_verdict_rule_shape_parity.py
      tests/persona_contracts tests/persona_backends -q
    expected: Exit 0, every node passes, test_verdict_contract_without_rule_is_refused and the two bundled-rec nodes included.
    fix_if: A regression in plan 1 or 2a behaviour; fix the change, never loosen an assertion (Decision 235).
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      Existing and new mirror suites the full tier and the diff-selected --pre run execute; a shard would duplicate them.
  - step: 3
    phase: pre-deploy
    action: The contract files carry exactly the approved words, the render check holds and the contract checks pass.
    command: >-
      bin/venv-python -m scripts.roadmap.approved_text verify --slug verdict-consistency-contract-rules --base origin/main
      && bin/venv-python -m scripts.persona_contracts.render --check && bin/venv-python -c "from
      scripts.checks.contracts.validate_persona_contracts import validate_persona_contracts as a; from
      scripts.checks.contracts.validate_persona_contract_binding import validate_persona_contract_binding as b;
      f=[];a(f);b(f);print(*f,sep='\n');print(f'contract checks: {len(f)} failures');assert not f"
    expected: >-
      approved_text verify exits 0 with all 23 blocks matching, the render check prints RENDER-CHECK OK 5, and the last
      line reports 0 failures.
    fix_if: >-
      A word differs from the sidecar: fix the edit, never the sidecar (operator-approved text). A hash mismatch:
      re-render with --write and copy the printed hash, which must equal the sidecar's.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      PR-relative to origin/main, so vacuous once merged; validate_merge_step's approved-text leg enforces the sidecar on
      the PR, and the two contract checks and the render rule run in every tier.
  - step: 4
    phase: pre-deploy
    action: No Lambda artifact bundles a changed path and no PROD or DUCKLAKE source pathspec watches one (Decision 249 clause 2).
    command: >-
      bin/venv-python -c "import subprocess;from scripts.convergence_health.code_drift import PROD_SOURCE_PATHSPECS as P,DUCKLAKE_SOURCE_PATHSPECS as D;from scripts.lambda_manifest import compute_affected_artifacts as ca;import fnmatch;run=lambda a:subprocess.run(a,capture_output=True,text=True,check=True).stdout.split();mb=subprocess.run(['git','merge-base','HEAD','origin/main'],capture_output=True,text=True,check=True).stdout.strip();ch=sorted(set(run(['git','diff','--name-only',mb]))|set(run(['git','ls-files','--others','--exclude-standard'])));hit=lambda f,g:f==g or f.startswith(g.rstrip('/')+'/') or fnmatch.fnmatch(f,g);hits=sorted({f for f in ch for g in P+D if hit(f,g)});aff=ca(ch);print('changed',len(ch),'hits',hits,'affected',aff);assert 'docs/contracts/personas/code_reviewer.yaml' in ch;assert not hits and aff == {};print('NO_DEPLOY_TRIGGER_OK')"
    expected: >-
      Exit 0; the change list holds docs/contracts/personas/code_reviewer.yaml, no changed path matches a PROD or
      DUCKLAKE source pathspec, affected is empty, and the last line is NO_DEPLOY_TRIGGER_OK.
    fix_if: An artifact is affected or a pathspec hits; STOP to this planning thread, never deploy from this plan.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      It reads this branch's transient diff against the merge-base, which is empty on main.
  - step: 5
    phase: pre-deploy
    action: Pre-handoff full tier on the committed, rebased tree (Decision 163), read through its evidence file.
    command: bin/venv-python -m scripts.validate; bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: The verify-head read reports the full tier passed on HEAD's tree (validate_test_coverage included).
    fix_if: >-
      Any failure; fix and re-run both from the start (timeout_disposition blocked). Main reds owned elsewhere (rec-5247,
      rec-5276) are deferred, never fixed here.
    hermetic: false
    graduation: not-applicable
  - step: 6
    phase: post-deploy
    action: rec-5052, rec-5320 and rec-5321 are closed by the build's squash-merge (its Resolves trailer and ci.yml's closure job).
    command: >-
      bin/venv-python -c "from src.common import ducklake_reader_client as c;ids=['rec-5052','rec-5320','rec-5321'];rows,missing=c.fetch_recs_by_ids(c.make_reader(),ids);
      s={r['id']:r['status'] for r in rows};print(s,missing);assert all(s.get(i)=='closed' for i in ids);print('RECS_CLOSED')"
    expected: All three rows read status closed and the last line is RECS_CLOSED.
    fix_if: >-
      Still open after the merge: check ci.yml's closure job on the merge commit and the Resolves trailer; if the job did
      not run, close each through update_rec naming the merge SHA.
    hermetic: false
    graduation: not-applicable
