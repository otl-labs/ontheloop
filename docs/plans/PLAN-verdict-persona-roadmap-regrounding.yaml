schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "verdict-persona-roadmap-regrounding"
intent: >-
  Put the verdict personas' move to GitHub Actions on a grounded roadmap: re-ground the criteria text, edges,
  files_in_scope and decomposition_hints of T4.2's persona children against the audit PR #1861 landed
  (audits/verdict-personas-on-actions-66ab746e.yaml, findings VPA-01 to VPA-14) and ten recs, and record the
  operator's five WP-00 rulings (credential delivery, image registry, model selection, draft-PR pushes, spend
  ceiling) in criteria text, so each work package's own plan reads its scope, order and rulings from the roadmap.
  Roadmap text, one new test file and one test pin only, the roadmap text and the pin bound word for word by an
  approved-text sidecar the operator approves on GitHub: no code, contract, terraform, workflow, IAM, spend or deploy.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-verdict-persona-roadmap-regrounding.yaml
phase: >-
  ad_hoc_rec (soft-warn category: the ten bundled recs and the PR #1861 audit findings; no tier_item claimed, so the
  Tier Item Freshness Gate is skipped). Re-grounds T4.2, T4.10a, T4.13, T4.15, T4.17, T4.25, T4.26 and T4.28-T4.32
  and closes no criterion. T4.2 is CD.27-gated, so the fallback_reevaluation block is carried.
closes_criteria: []
implementation_declared: false
scope:
  - file: docs/ROADMAP-PLATFORM.yaml
    action: Modify
    purpose: >-
      Operator-approved text: blocks e01-e38, e40 and e41 of
      docs/plans/approved/verdict-persona-roadmap-regrounding.yaml (STEP 1), +83 lines (8,738 -> 8,821 of the
      10,000-line cap), no status change.
      T4.2: c8 names the main-side context the shell materialises (VPA-13); the four verdict-chain paths leave
      files_in_scope for T4.32's behind one pointer entry (rec-4499); the plan_agent and implement_agent slugs move
      to T4.31 and T4.15 (rec-4497). T4.10a: c1 rescoped to T4.2's five personas with the input_schema rule, c5
      renders the quoted-content clause from the first prompt, c6 gains read_input, c7 is met by its declaration
      (VPA-09, VPA-11, VPA-13); two atomic plans. T4.13 c3 bracket (stays open; depends_on stays [T4.2]); T4.17
      depends_on [T4.2] -> [T4.32] (rec-4498); T4.25 c4 names all three flips, met_by staying T4.28 (rec-4502);
      T4.26 c5 points the rca contract at T4.10 c1. T4.28-T4.30: CAPTURE brackets name rec-4028 (VPA-08); DUAL-RUN
      brackets add the reset, disagreement and window-validity rules (VPA-12, VPA-05); FLIP brackets read the flag
      through T4.32 c5 (rec-4945), T4.28 c6 adding the draft-push ruling (rec-4943); T4.28 files_in_scope gains
      capabilities.yaml, git-ops.yaml and handoff_evidence.py, and its related_decisions gain 163, 203 and 235; each
      flip item's files_in_scope gains project-configuration.yaml for its row, T4.30's also project-alignment.yaml for
      the pr_flow carrier; one
      atomic plan per add, flip and remove step, each plan-PR step following the scout's matching step.
      T4.32: a START and SPEND annotation; c1 the credential leg, model record and wake (VPA-02, VPA-03, VPA-05,
      VPA-06, VPA-14); c2 the image channel (VPA-10); c3 the fixture run's wake, injection and input proofs; c4
      north-star.yaml and the main-amendment re-scout (rec-4916, rec-4946); new c5 GATE CONSUMERS FLAG-AWARE
      (VPA-01, VPA-07; before any persona item's add step; both merge tools, the narrowing recorded in that plan's
      own Decision), c6 HUMAN OVERRIDE
      (rec-4944) and c7 EGRESS (rec-4947); files_in_scope gains the five consumer files; related_decisions gains 83,
      217, 224, 233, 237, 245, 246, 247, 248 and 249; decomposition_hints re-cut to eight atomic plans.
  - file: tests/roadmap/test_verdict_persona_criteria.py
    action: Create
    purpose: >-
      STEP 2: 23 tests pinning the text, edges, scope and hints each finding and rec needs, never a status. It holds
      the five rec acceptance nodes: rec-4943 test_t4_28_flip_names_handoff_gate_interaction, rec-4944
      test_verdict_override_path_is_specified, rec-4945 test_flip_items_scope_coordinator_and_capabilities, rec-4946
      test_t4_32_c4_rescouts_on_main_amendment, rec-4947 test_verdict_runtime_declares_egress_policy.
  - file: tests/provider_agnostic_tier_model/test_role_based_tier_model.py
    action: Modify
    purpose: >-
      Operator-approved text: sidecar block e39 (STEP 1), the T4.17 depends_on pin (line 202) following rec-4498's
      edge, ["T4.2"] -> ["T4.32"]; it stays an exact-list pin (planned change, weakening_dispositions). The graduated
      shard inference-tier-rows-role-and-billing-shape, which names another node of this file
      (test_tier_rows_are_role_keyed_with_billing_shape), is kept unchanged.
fallback_reevaluation:
  reevaluated_on: "2026-11-09"
  substrate_status: CD.27 pending; executor substrate unratified; T4.2 not built; no persona has run and the T4.15 spike has not run.
  verdict: continue_on_current_substrate
  basis: >-
    Criteria, edge and hint text only: the verdict personas' Actions path (T4.32, T4.28-T4.30) and its rulings read
    the same under every candidate layer-2 substrate, and no edit touches CD.27, T4.1, a fallback_spec or T4.15's
    substrate criteria (T4.15 gains one hint slug). Forms no substrate evidence and pre-empts no T4.15 ruling.
bundled_recommendations: [rec-4497, rec-4498, rec-4499, rec-4502, rec-4916, rec-4943, rec-4944, rec-4945, rec-4946, rec-4947]
followon_recs: [rec-5037, rec-5038]
infrastructure_dependencies:
  - >-
    LAMBDA-DEPLOY DEFERRED (CD.16 / Decision 79), per-artifact reasoned disposition: compute_affected_artifacts(<this
    plan's scope>) returns {'data-pipeline': ['docs/ROADMAP-PLATFORM.yaml']} because the roadmap is a packaged asset
    of the active data-pipeline artifact. No build, deploy or smoke test is owed: the change is tier-item text and
    edges with no packaged code. deploy-prod-lambdas.yml does not path-trigger on the roadmap (PROD_SOURCE_PATHSPECS
    omits it), so the asset refreshes at the next deploy a watched path starts. No other scope file is
    Lambda-packaged and no .tf file is in scope (precedent: PLAN-persona-first-migration).
weakening_dispositions:
  - candidate: '[assertion-changed] tests/provider_agnostic_tier_model/test_role_based_tier_model.py::test_provider_variable_tier_item_and_transport_criterion'
    disposition: planned-change
    cite: acceptance_criteria[2]
acceptance_criteria:
  - >-
    T4.10a can complete on contract text alone, before any backend exists: c1 names T4.2's five personas with the
    input_schema rule, c5 the
    quoted-content clause, c6 read_input and c7 is met by its declaration; T4.32's intent says work may start once
    T4.10a is in_progress and depends_on orders completion; T4.13 c3 and T4.26 c5 carry their pointers (VP 3).
  - >-
    T4.32 carries the credential leg, model record and wake (c1), the image channel (c2), the fixture-run proofs (c3),
    north-star.yaml and the main-amendment re-scout on a push-to-main trigger (c4), and new c5 GATE CONSUMERS
    FLAG-AWARE, c6 HUMAN OVERRIDE and c7 EGRESS; the five rulings are dated, and no model id appears anywhere in the
    item, its notes and scope included (VP 3-5).
  - >-
    T4.17 depends on T4.32; T4.2's files_in_scope holds none of the verdict chain's paths; every PLAN- decomposition
    hint of T4.2, T4.10a, T4.15 and T4.28-T4.32 resolves to exactly one parent and none follows a plan of an item
    that depends on its own, so T4.32's gate-consumer plan precedes the persona add plans; T4.25 c4 names all three
    flips with met_by T4.28 (VP 3-5).
  - >-
    T4.28-T4.30's CAPTURE, DUAL-RUN and FLIP criteria carry rec-4028, the reset and window-validity rules and the
    flag read through T4.32 c5; T4.28 c6 carries the draft-push ruling, with git-ops.yaml, handoff_evidence.py and
    capabilities.yaml in T4.28's scope; each flip item's scope holds project-configuration.yaml, and T4.30's
    project-alignment.yaml (VP 3-4).
  - >-
    No graduated check guarding docs/ROADMAP-PLATFORM.yaml newly fails versus origin/main, and both tiers pass (VP
    6-8).
  - The ten bundled recs close through the merge's Resolves trailer (VP 9).
  - >-
    The roadmap edits and the T4.17 pin are exactly the approved sidecar's 41 blocks at its approved digest, on a
    branch that contains origin/main with the plan and sidecar merged (VP 1-2).
verification_plan:
  - step: 1
    phase: pre-deploy
    action: "Precondition: plan and sidecar merged, branch current."
    command: >-
      git fetch origin main --quiet && git cat-file -e
      origin/main:docs/plans/PLAN-verdict-persona-roadmap-regrounding.yaml && git cat-file -e
      origin/main:docs/plans/approved/verdict-persona-roadmap-regrounding.yaml && git merge-base --is-ancestor
      origin/main HEAD && echo PRECONDITION_OK
    expected: Prints PRECONDITION_OK.
    fix_if: >-
      A missing plan or sidecar means the plan PR has not merged: stop (validate_merge_step fails a build PR that adds
      the sidecar). A failed ancestry test means a stale branch: merge origin/main first.
    hermetic: false
    graduation: not-applicable
  - step: 2
    phase: pre-deploy
    action: The roadmap edits and the T4.17 pin are exactly the approved sidecar, at the approved digest.
    command: >-
      bin/venv-python -m scripts.roadmap.approved_text verify --slug verdict-persona-roadmap-regrounding --base
      origin/main --expect e55d1acd877ad05200cb34758c740edb2ec22ded66b8f0eb4e45f39c4c946e92
    expected: Exit 0, printing APPROVED-TEXT OK. Red before STEP 1, because the head words still equal the base words.
    fix_if: >-
      A word mismatch means an edit drifted from the approved text: restore that block's after text exactly, never
      edit the sidecar. A digest mismatch means the sidecar on origin/main is not the approved one: stop and ask the
      operator.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      A base-relative, one-time binding of this build's diff to its sidecar; validate_merge_step enforces the same
      binding on the build PR's fast tier.
  - step: 3
    phase: pre-deploy
    action: >-
      The re-grounding's acceptance file, whole: 23 tests pinning each finding's and rec's criterion text, edges,
      scope and hints (statuses never pinned, so a later build may flip a criterion to met).
    command: bin/venv-python -m pytest tests/roadmap/test_verdict_persona_criteria.py -q
    expected: >-
      Exit 0; 23 passed. Red before: the file is absent on main, and run against origin/main's roadmap all 23 tests
      fail (asserted during planning on a scratch tree).
    fix_if: Fix the roadmap edit the failing test names, never the assertion.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      The created file is itself the standing guard: the --pre affected set selects it whenever
      docs/ROADMAP-PLATFORM.yaml changes (its quoted path) and the full tier runs it on main; a registry row would
      duplicate it.
  - step: 4
    phase: pre-deploy
    action: The five recs' named acceptance nodes (rec-4943 to rec-4947) and the T4.17 pin that follows rec-4498's edge.
    command: >-
      bin/venv-python -m pytest -q
      tests/roadmap/test_verdict_persona_criteria.py::test_t4_28_flip_names_handoff_gate_interaction
      tests/roadmap/test_verdict_persona_criteria.py::test_verdict_override_path_is_specified
      tests/roadmap/test_verdict_persona_criteria.py::test_flip_items_scope_coordinator_and_capabilities
      tests/roadmap/test_verdict_persona_criteria.py::test_t4_32_c4_rescouts_on_main_amendment
      tests/roadmap/test_verdict_persona_criteria.py::test_verdict_runtime_declares_egress_policy
      tests/provider_agnostic_tier_model/test_role_based_tier_model.py::test_provider_variable_tier_item_and_transport_criterion
    expected: >-
      Exit 0; six tests pass. Red before: the five criteria nodes fail because the file is absent on main. The T4.17
      pin node passes on origin/main, where T4.17 depends_on is [T4.2], and is red only between block e14 (T4.17's
      edge) and block e39 (the pin), so STEP 1 places the two together.
    fix_if: Fix the roadmap edit, never the assertion; a missing node (exit 4) means a test was renamed -- restore its name.
    hermetic: true
    expected_literals:
      - 6 passed
    graduation: waive
    graduation_waiver_reason: Nodes of the two standing test files VP 3 and the tiers already run; a registry row would duplicate them.
  - step: 5
    phase: pre-deploy
    action: >-
      The shell acceptances of rec-4497, rec-4498, rec-4499, rec-4502 and rec-4916, verbatim from each rec, chained.
    command: >-
      test "$(awk '/^  - id: /{i=($3=="T4.2")} i' docs/ROADMAP-PLATFORM.yaml | grep -cE -- '- .PLAN-persona-(plan|implement)-agent -- ')" -eq 0
      && awk '/^  - id: /{i=($3=="T4.17")} i && /^    depends_on:/' docs/ROADMAP-PLATFORM.yaml | grep -E 'T4\.32' | grep -vqE 'T4\.2[],]'
      && test "$(awk '/^  - id: /{i=($3=="T4.2")} i' docs/ROADMAP-PLATFORM.yaml | grep -cE '^      - (scripts/llm/client[.]py|scripts/personas/|[.]github/workflows/persona-verdict)')" -eq 0
      && test "$(awk '/^  - id: /{i=($3=="T4.25")} i && /^      - id: /{c=($3=="c4")} i && c' docs/ROADMAP-PLATFORM.yaml | grep -oE 'T4[.](28|29|30)' | sort -u | wc -l)" -eq 3
      && grep "SCOUT-INPUT FINGERPRINT (Decision 229" docs/ROADMAP-PLATFORM.yaml | grep -q "north-star.yaml"
    expected: Exit 0. Red before (each of the five legs fails on origin/main's roadmap, asserted leg by leg during planning).
    fix_if: Fix the roadmap edit the failing leg reads; never edit a rec's acceptance.
    hermetic: true
    expected_literals: []
    graduation: waive
    graduation_waiver_reason: Each rec's own one-time acceptance; VP 3's standing tests pin the same text (T4.2 hints and scope, T4.17's edge, T4.25 c4, T4.32 c4).
  - step: 6
    phase: pre-deploy
    action: >-
      Every graduated registry check guarding docs/ROADMAP-PLATFORM.yaml runs on the branch and on an origin/main
      worktree (each side with its own registry); the branch's failing set must be a subset of main's. At planning, 4
      of the 69 such checks were already red on main and stayed red (known red, owner rec-4871, in
      config/agent/verification_registry/known_red.yaml); the other 65 stayed green.
    command: >-
      bin/venv-python -c "from scripts.verification_graduation import load_entries, materialize_check_in_tree, git_worktree;
      from scripts.verification_checks import CheckStatus; g=lambda root: {r['check_id'] for r in load_entries(root) if
      'ROADMAP-PLATFORM' in str(r.get('guard_target','')) and materialize_check_in_tree(r, root).run().status is not
      CheckStatus.PASS}; import atexit; head=g(None); wt=git_worktree('origin/main'); w=wt.__enter__();
      atexit.register(wt.__exit__, None, None, None); main=g(w); new=sorted(head-main); assert not new, new;
      print('NO_NEW_GRADUATED_RED', len(head))"
    expected: Exit 0 and NO_NEW_GRADUATED_RED printed; the count is main's pre-existing reds.
    fix_if: Restore the pinned phrase the named check reads; never edit a graduated registry entry to pass (Decision 235). A check red on both sides is known red, owned by rec-4871 (config/agent/verification_registry/known_red.yaml).
    hermetic: false
    graduation: waive
    graduation_waiver_reason: Base-relative to origin/main; meaningless once the build merges.
  - step: 7
    phase: pre-deploy
    action: Fast tier, including the roadmap schema and graph, liveness, the plan checks and the weakening-candidate gate.
    command: bin/venv-python -m scripts.validate --pre
    expected: Exit 0.
    fix_if: Diagnose and fix on the branch; never edit a graduated registry entry to pass (Decision 235).
    hermetic: false
    graduation: waive
    graduation_waiver_reason: Invokes scripts.validate (recursion hazard, vp-red-before.yaml recursion_refusal); it is the fast-tier gate itself, not a regression guard.
  - step: 8
    phase: pre-deploy
    action: Full presubmit tier on the committed, rebased tree, then attest HEAD (git-ops.yaml handoff_sequence).
    command: bin/venv-python -m scripts.validate && bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: Exit 0 on a completed full-tier run, then --verify-head attests HEAD's tree.
    fix_if: Diagnose the named failing check (Decision 55); a failure outside this scope becomes a rec, not an inline patch.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: Invokes scripts.validate (recursion hazard, vp-red-before.yaml recursion_refusal); it is the handoff gate itself, not a regression guard.
  - step: 9
    phase: post-deploy
    action: The ten bundled recs are closed by the merge's Resolves trailer.
    command: >-
      bin/venv-python -c "from src.common.ducklake_reader_client import fetch_recs_by_ids, make_reader; ids=['rec-4497',
      'rec-4498', 'rec-4499', 'rec-4502', 'rec-4916', 'rec-4943', 'rec-4944', 'rec-4945', 'rec-4946', 'rec-4947'];
      rows, missing = fetch_recs_by_ids(make_reader(profile='agent_platform'), ids); s = {r['id']: r['status'] for r
      in rows}; print(s, missing); assert not missing and set(s.values()) == {'closed'}, s"
    expected: All ten statuses closed.
    fix_if: Follow git-ops.yaml resolves_trailer's fallback; never close by hand without the acceptance verdict.
    hermetic: false
    graduation: not-applicable
test_obligations:
  - source: docs/ROADMAP-PLATFORM.yaml
    behavior: >-
      The re-grounded criteria text, edges, files_in_scope and decomposition_hints of T4.2, T4.10a, T4.13, T4.15,
      T4.17, T4.25, T4.26 and T4.28-T4.32, and the five dated rulings.
    verification_step: 3
    test_selector: tests/roadmap/test_verdict_persona_criteria.py
    red_green_expectation: Red before (23 of 23 fail against origin/main's roadmap), green after.
constraints:
  - Roadmap text and two test files only; no Decision, contract, skill, command, AGENTS.md, workflow, terraform or code edit. Each work package's build is its own plan.
  - >-
    Every docs/ROADMAP-PLATFORM.yaml edit and the T4.17 pin is operator-approved text: the build places the
    sidecar's words exactly, fills only {{DATE}}, and never edits them (git-ops.yaml approved_text_binding; Decision
    246); a needed change is an approved_text plan defect (implement-scope-boundary.yaml
    deviation_trigger.escalation) routed to this plan's owning planning session, "Plan the PR #1861 findings".
  - >-
    The sidecar is not grandfathered (Decision 246 cl.3): the operator approves its approval run
    (approved-text-approval run 42602291584, or a later run for the same approved-words digest) on GitHub before the
    plan PR merges; the plan PR's approved-text check reads that approval.
  - >-
    This build merges under the approve-once standing_authorisation item: its only always_ask content is the
    sidecar-bound text (the roadmap edits and the T4.17 pin), so it merges on code review PROCEED + green CI with no
    second operator word once validate_merge_step is green. No scope file is a CODEOWNERS path, and the new test file
    adds assertions without loosening any.
  - Annotations and brackets are append-only (the roadmap's dated [Amendment ...] form adds words beside a criterion and never rewrites them); every phrase a graduated shard pins stays (Decision 181); no graduated registry entry is edited (Decision 235).
  - No model identifier enters the roadmap (Decision 173); the model ruling is a pointer to inference-provider.yaml and the audit's WP-00 option A.
  - No status changes; the plan closes no criterion.
  - T4.13 depends_on stays [T4.2], T4.10a's [T1.12], T4.26's [T4.2] and T4.32's [T4.10a]; T4.25 c4 met_by stays T4.28 (pinned by graduated shards).
  - The main-amendment re-scout is a push-to-main trigger, never a schedule (Decision 205 cl.1); no session is called a loop host (Decision 185 cl.1).
  - No rescue agents or workaround loops (Decision 55).
