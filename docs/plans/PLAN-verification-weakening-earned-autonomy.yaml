slug: verification-weakening-earned-autonomy
intent: 'Record Decision 235 (design now, build later -- the Decision 197 clause 8 pattern): a change that weakens verification (removing a check, demoting
  it to a weaker tier, loosening an assertion) is human-gated at entry and earns autonomy on one lane of the review ladder behind three safeguards -- a
  shadow step (blocking, shadow, removed; a unique catch restores the check and resets the lane), redundancy evidence computed by deterministic code outside
  the loop''s edit scope (a clean history alone is never evidence), and an irreducible floor derived at the base ref (the judge, secret scanning, the ladder''s
  own checks). It amends Decision 181 clause 1 and Decision 187 clauses 3-5 by append-only Amended-by lines, records a design_only governance note in docs/contracts/implement-scope-boundary.yaml,
  converts T3.4 and T4.4 criteria to structured form verbatim and adds the lane''s criteria (T3.4 c3, T4.4 c7) plus rec-4192''s coverage-floor criterion
  (T4.4 c8), and puts the removal rung on deferred T3.7 (c8) with dated brackets on T3.7 c4 and CD.29. Governance, contract and roadmap encoding only --
  no enforcement code, check, test, workflow, terraform, IAM, spend or deploy; the build waits for rec-4413''s re-measure and an evidence producer outside
  the edit scope.'
plan_type: IMPLEMENTATION
implementation_declared: true
verification_tier: V1
plan_path: docs/plans/PLAN-verification-weakening-earned-autonomy.yaml
phase: 'Platform governance, design only (Decision 197 cl.8): no tier_item is claimed and no exit criterion is closed. Adds open criteria to T3.4 (c3) and
  T4.4 (c7, c8) -- both live, not_started, strategic -- after converting their bare-string criteria verbatim (validate_platform_roadmap rule ii, Decision
  136), and to deferred T3.7 (c8); adds no depends_on or blocked_by edge from a live item to a parked one (Decision 93). T4.4 is CD.27-gated, so this plan
  carries the fallback_reevaluation block.'
