  - "Decision-scout verdict FLAGS_FOUND (round 1). CITE: 148, 189, 201, 226, 246. CONTRADICT: 235 NOTE (fewer post-merge replays near a red check): accepted as a measurement correction (Decision 159 framing) -- the newly excluded steps are vacuous or wrong once HEAD is an ancestor of origin/main, PR-time replay is unchanged, and the operator's write the plan plus the sidecar approval are the human gate if a reviewer reads it as in-class. SPIRIT: 226 NOTE (a recurring class closed by enumeration): the authoring-time warning lint goes to the operator as a follow-up rec. RELATED: 159, 132, 244, 187, 181, 186, 163, 128, 168, 254, 55, 215, 84. Decisions triaged: 220 of 220. Roadmap items intersected: 2; CONFLICT: 0; RELATED: 2 (T2.54 and T4.23, path-prefix matches only). Serves: NS.6 3/5 -- keeping the GREEN-AFTER replay discriminating protects the evidence plane."
