  - "Census 2026-11-18 of hermetic pre-deploy steps naming origin/main that today's regex misses, outside this plan: 15 (re-measured during plan critique). Eight in other plans become PR-relative: the six unbuilt ones above plus PLAN-governance-and-work-item-boundary 16 and PLAN-persona-verdict-override 5 (already built); this plan's own step 3 is a ninth. Not matched on purpose: four where origin/main is only assertion-message text (PLAN-executor-two-plane-roadmap-encoding 2, 3, 8, 9), two push_context_base() or 'origin/main' fallbacks (resolved at run time), and one git rev-parse origin/main compared with a pinned sha (PLAN-raises-discrimination-guard-advisory 4; not PR-relative)."
  - "contract.description's parenthetical '(diffs/shows against origin/main)' is left as is: editing contract.description needs its own prose_improvement entry under validate_contract_drift category 6 (scripts/contracts_enforcement.py:91-124), and the description already points to implement_leg_partition for the rule."
