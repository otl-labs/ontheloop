  - "Approval: the operator wrote write the plans in this plan's thread 2026-11-18T14:25Z after the alignment presentation, covering this plan, the rec-5364 acceptance re-key and the two follow-up recs. The contract wording is bound by the sidecar's own approval run (Decision 246)."
  - "Graduated shards kept unchanged: vp-replay-failed-step-reports-duration, vp-replay-green-leg-labels-missing-tool-unmeasurable, vp-replay-pr-relative-excluded-on-base-collapse, vp-replay-pr-relative-replayed-at-pr-time, and the two that guard _is_pr_relative directly: vp-replay-pr-relative-predicate-population (asserts at least 9 matches, so widening keeps it green) and vp-replay-predicate-recognises-rec3845-step (the git show shape is unchanged)."
