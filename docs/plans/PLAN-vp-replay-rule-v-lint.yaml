schema_version: 7
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: vp-replay-rule-v-lint
intent: >-
  Enforce hermetic authoring rule (v) at plan-PR time: validate_vp_replay refuses a hermetic: true pre-deploy step of a
  diff-ADDED plan that re-runs a whole test file or directory the plan's own scope creates or modifies, or runs a ruff
  check/format phase, so a step like the one that reddened main in run 45254801937 is caught on its plan PR, not at its
  implement merge (rec-5547).
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-vp-replay-rule-v-lint.yaml
phase: >-
  ci_rca (soft-warn exception category: rec-5547, Critical, source ci_rca; the preventive half of the red whose
  corrective half was amendment #2414). No tier_item is claimed, so the Tier Item Freshness Gate is skipped;
  closes_criteria is empty.
closes_criteria: []
cites: [dec:128, dec:148, dec:189]
amends: []
introduces: []
scope:
  - file: scripts/checks/verification/_vp_replay_rule_v.py
    action: Create
    purpose: >-
      The rule (v) lint, a submodule beside _vp_replay_budget.py and _vp_replay_classify.py (Decision 128
      decompose-by-default: validate_vp_replay.py is unregistered in config/sloc_budgets.yaml, so it stays under 500
      SLOC by adding only a call). Static and non-executing. (1) step_rule_v_scan(command, scope_files, root) splits the
      command on shell control operators (reuse _vp_replay_classify._SHELL_SEGMENT_SPLIT_RE) and shlex-splits each
      segment. It finds the pytest marker the way the sibling carve-out (iii) enforcer
      validate_hermetic_fast_tier_collectability._pytest_selectors does: the first token whose basename is pytest, or
      a "pytest" token preceded by "-m". So any prefix before the marker (a leading "!", NAME=value assignments, an
      env wrapper with its options and assignments, interpreter flags such as -I or -X dev, a timeout wrapper) is
      skipped rather than misread as the head. A ruff phase is found the same way (a token with basename ruff, or
      "ruff" after "-m") followed by check or format. A segment whose head basename is sh or bash with a -c argument
      is scanned again on that argument's string (one level). A pytest target is a token after the marker that
      contains no "::", is not an option, and is not the value of a value-taking option: a superset of the sibling's
      _VALUE_OPTIONS (--deselect, --ignore, --ignore-glob, -k, -m, -p, -c, -o, --rootdir, --cov, --cov-report) plus
      --basetemp, --confcutdir and --junitxml, also in --opt=value form. A target is normalised with
      os.path.normpath relative to root (a leading "./", a trailing "/", ".." and an absolute path under root all
      resolve; a target outside root is ignored); a target holding a glob metacharacter (* ? [) is expanded against
      root in sorted order and each match is evaluated (5 hermetic pytest segments on main use one). A target is IN
      SCOPE when it equals a scope[].file whose action is Create or Modify, or is a directory prefix of one (target +
      "/"). A target is a DIRECTORY target when (root / target).is_dir(). A -k expression never exempts a whole-file
      or whole-directory target (only node and class selectors are rule (v)'s carve-out). It fails OPEN on a segment
      shlex cannot parse and reports that it did. (2) plan_rule_v_findings(doc, root) returns (step id, reason) for
      each phase pre-deploy, hermetic: true step with an in-scope target or a ruff phase; a step whose every pytest
      target carries "::" is never a finding. (3) rule_v_pre_pass(plan_files, root, added, resolved, failed) loads
      each diff plan with _common.load_plan (ImportError reddens, any other load error prints SKIP, mirroring
      _rg_portability_pre_pass). For a plan in added it appends one failed[] entry per finding, prefixed
      "vp-hermetic-rule-v <plan>:<step>:" (never a "vp-replay" or "vp-red-before-lint" prefix: the first suppresses
      the implement leg's PASS line, the second is asserted absent by negated-sweep tests), naming the in-scope
      targets, saying a -k filter does not exempt a whole target, and giving both fixes in this order: first rewrite
      to pytest node or class selectors (keeps hermetic: true and proves the node exists, Decision 148 point 3), then
      hermetic: false for a step that genuinely needs the whole file or directory. For a plan in resolved but not
      added it never fails: it prints one counted ADVISORY line naming the plan and steps (an implementer cannot flip
      hermetic, implement-scope-boundary.yaml implementing_plan_bookkeeping). It prints a WARN line, never a
      failed[] entry, for an added plan's hermetic step naming two or more directory targets (in scope or not).
      Plans in neither set are skipped with one counted EXCLUDED line; unparseable segments print one counted
      EXCLUDED line.
    new_imports: []
  - file: scripts/checks/verification/validate_vp_replay.py
    action: Modify
    purpose: >-
      Call _vp_replay_rule_v.rule_v_pre_pass right after _rg_portability_pre_pass in validate_vp_replay, passing the
      added-plan set (_added_plan_paths, computed once and passed into _compute_eligible_plans, whose signature gains
      that parameter; it has no external caller) and the resolved set. The file is NEAR_CAP (488 of 500 SLOC,
      unregistered in config/sloc_budgets.yaml), so the change is the import, the added-set line, the call and the
      _compute_eligible_plans signature (about 3-4 SLOC); the pre-pass's description lives in the submodule's docstring,
      not here. Relief if VP 2's plan_obligations reports a crossing: move _segment_invokes_rg and
      _rg_portability_pre_pass into _vp_replay_rule_v.py (both are static plan pre-passes) and re-export both names
      from this module, since tests import _segment_invokes_rg from it; never a budget raise (Decision 128). No change
      to either leg, the budget or the accounting declaration.
    new_imports: [scripts.checks.verification._vp_replay_rule_v]
  - file: docs/contracts/vp-red-before.yaml
    action: Modify
    purpose: >-
      Add key rule_v_lint (population, detection, carve-outs, advisory and fail-open lines, residuals: merely MODIFIED
      plans and already-merged unbuilt plans are not refused; execution_steps prose is not parsed, the scope table is
      the declared set; a -k filter does not exempt a whole target), name the sibling carve-out (iii) enforcer
      validate_hermetic_fast_tier_collectability beside it, point hermetic_authoring (v) at it in one clause, append an amendment_log entry, and bump
      contract_version 9 -> 10 (this file's convention).
  - file: tests/checks/verification/test_vp_replay_rule_v_lint.py
    action: Create
    purpose: >-
      rec-5547's acceptance file (its name is pinned by the rec). Nodes:
      test_hermetic_whole_directory_in_scope_step_is_refused (an added plan shaped like PLAN-ci-rca-step-extraction
      step 2 at 9d167c64: one pytest over a whole in-scope directory and whole files, hermetic true; refused with the
      vp-hermetic-rule-v prefix and the step id, and the text names the selector fix before hermetic: false);
      test_contract_names_the_rule_v_lint (read with yaml: the contract has a rule_v_lint key, hermetic_authoring
      names it, contract.contract_version is at least 10, and an amendment_log entry names rule_v_lint); and the
      end-to-end node test_validate_vp_replay_runs_the_rule_v_pre_pass, through validate_vp_replay with the existing
      validate_vp_replay/conftest.py _RedBeforeFixture (its fixture scope is scripts/dummy.py, so a hermetic step
      "bin/venv-python -m pytest scripts/ -q" is an in-scope directory target).
    new_imports: [scripts.checks.verification._vp_replay_rule_v]
  - file: tests/checks/verification/test__vp_replay_rule_v.py
    action: Create
    purpose: >-
      The coverage mirror validate_test_coverage requires for the new submodule (check_test_file_exists names this
      path; precedent _vp_replay_budget.py -> test__vp_replay_budget.py); it must bring the submodule to the per-file
      coverage the check demands. Unit nodes calling the submodule directly on tmp_path plan files with explicit
      added/resolved sets (no git): test_hermetic_whole_file_in_scope_step_is_refused; test_ruff_phase_is_refused;
      test_prefixed_invocations_are_detected (NAME=value assignments, env with -u and assignments, python -I -m pytest,
      timeout 60 pytest, sh -c "pytest <in-scope file>"); test_glob_dotdot_and_absolute_targets_resolve (a glob
      matching an in-scope file, a ../ form and an absolute path under root are refused; a path outside root is
      ignored); test_selectors_out_of_scope_and_non_hermetic_steps_pass (node selector, class selector, an
      out-of-scope whole file, hermetic: false, a post-deploy step); test_k_filter_does_not_exempt_a_whole_target;
      test_option_values_are_never_targets (--ignore, --deselect, -k, --cov and --cov-report values, space and =
      forms, that name in-scope paths); test_value_options_cover_the_sibling_set (the submodule's set is a superset of
      validate_hermetic_fast_tier_collectability._VALUE_OPTIONS); test_resolved_plan_prints_advisory_and_never_fails;
      test_modified_plan_is_excluded_and_announced; test_several_directory_targets_warn_and_never_fail;
      test_unparseable_segment_fails_open_and_is_announced; test_import_error_reddens; test_load_error_skips.
    new_imports: [scripts.checks.verification._vp_replay_rule_v]
bundled_recommendations: [rec-5547]
followon_recs: []
infrastructure_dependencies: []
acceptance_criteria:
  - "bin/venv-python -m pytest tests/checks/verification/test_vp_replay_rule_v_lint.py::test_hermetic_whole_directory_in_scope_step_is_refused -q passes (rec-5547's acceptance) and fails before the change (file absent)."
  - "Every node in tests/checks/verification/test_vp_replay_rule_v_lint.py and tests/checks/verification/test__vp_replay_rule_v.py passes, and every existing node under tests/checks/verification/validate_vp_replay/ passes unchanged."
  - "Run against the real incident, the lint flags step 2 of PLAN-ci-rca-step-extraction as approved at 9d167c64 and does not flag step 2 of the amended plan on main (VP 3)."
  - "A rule (v) finding on a resolved-not-added plan, a several-directory warning, or an unparseable segment never appends to failed[]."
  - "docs/contracts/vp-red-before.yaml carries rule_v_lint, hermetic_authoring (v) points at it, and contract_version is 10 with a matching amendment_log entry."
  - "rec-5547 is closed by the build's squash-merge Resolves trailer once its acceptance holds (Decision 201)."
verification_plan:
  - step: 1
    phase: pre-deploy
    action: rec-5547's acceptance node passes.
    command: bin/venv-python -m pytest tests/checks/verification/test_vp_replay_rule_v_lint.py::test_hermetic_whole_directory_in_scope_step_is_refused -q
    expected: exit 0 with 1 passed; before the change the file does not exist and pytest exits non-zero
    fix_if: the node fails; the detector misses a whole in-scope directory or the failure text lacks the prefix or step id
    hermetic: true
    expected_literals: ["1 passed"]
    graduation: graduate
    graduation_check_id: vp-hermetic-rule-v-whole-directory-refused
  - step: 2
    phase: pre-deploy
    action: Every new node passes, every existing vp-replay node passes, and the scope files stay under their SLOC caps.
    command: >-
      bin/venv-python -m pytest tests/checks/verification/test_vp_replay_rule_v_lint.py
      tests/checks/verification/test__vp_replay_rule_v.py tests/checks/verification/validate_vp_replay/ tests/checks/verification/test__vp_replay_budget.py
      tests/checks/verification/test__vp_replay_classify.py -q &&
      bin/venv-python -m scripts.roadmap.plan_obligations --plan docs/plans/PLAN-vp-replay-rule-v-lint.yaml
    expected: pytest exits 0 with no failure; plan_obligations reports no SLOC crossing for a scope file
    fix_if: a node fails, or a scope file crosses its cap (decompose, never a raise, Decision 128)
    hermetic: false
    graduation: waive
    graduation_waiver_reason: Whole-file and whole-directory re-run of in-scope and standing suites (rule (v)); the full tier runs them and step 1 graduates the acceptance node.
  - step: 3
    phase: pre-deploy
    action: The lint flags the real incident step and not its amended form.
    command: >-
      d=$(mktemp -d) && git show 9d167c64:docs/plans/PLAN-ci-rca-step-extraction.yaml > "$d/PLAN-ci-rca-step-extraction.yaml"
      && bin/venv-python -c "import sys; from pathlib import Path; from scripts.roadmap.plan_document import load;
      from scripts.checks.verification._vp_replay_rule_v import plan_rule_v_findings as f;
      old = [s for s, _ in f(load(sys.argv[1]), Path('.'))];
      new = [s for s, _ in f(load('docs/plans/PLAN-ci-rca-step-extraction.yaml'), Path('.'))];
      assert 2 in old and 2 not in new, (old, new); print('incident step refused; amended step passes')"
      "$d/PLAN-ci-rca-step-extraction.yaml"
    expected: Prints "incident step refused; amended step passes" and exits 0.
    fix_if: the assertion fails; the detector misses the incident shape or flags the node-selector form
    hermetic: false
    graduation: waive
    graduation_waiver_reason: Reads git history (commit 9d167c64), which a shallow CI checkout may lack; step 1's fixture carries the same shape as a standing guard.
  - step: 4
    phase: pre-deploy
    action: Full tier, then HEAD attestation, after the build commit and rebase and before the push (handoff_policy); start it backgrounded from the top-level session with a 2 h limit.
    command: bin/venv-python -m scripts.validate && bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: the full tier exits 0 and the validation result attests the current HEAD's tree
    fix_if: any failure; fix and rerun the full tier from the start
    hermetic: false
    graduation: waive
    graduation_waiver_reason: A whole full-tier run; graduate steps may not invoke scripts.validate (recursion).
  - step: 5
    phase: post-deploy
    action: rec-5547 closed by the build's squash-merge Resolves trailer once its acceptance holds.
    command: >-
      bin/venv-python -c "from src.common import ducklake_reader_client as c; r,_=c.fetch_recs_by_ids(c.make_reader(),
      ['rec-5547']); print(r[0]['id'], r[0]['status'])"
    expected: Prints rec-5547 closed.
    fix_if: Still open after the closure job ran; read ci.yml's closure job log and report to the plan owner.
    hermetic: false
test_obligations:
  - source: scripts/checks/verification/_vp_replay_rule_v.py
    behavior: a hermetic pre-deploy step of an added plan re-running a whole in-scope test directory is refused
    verification_step: 1
    test_selector: tests/checks/verification/test_vp_replay_rule_v_lint.py::test_hermetic_whole_directory_in_scope_step_is_refused
    red_green_expectation: red before (file absent), green after
  - source: scripts/checks/verification/validate_vp_replay.py
    behavior: validate_vp_replay runs the rule (v) pre-pass over the diff's added plans
    verification_step: 2
    test_selector: tests/checks/verification/test_vp_replay_rule_v_lint.py::test_validate_vp_replay_runs_the_rule_v_pre_pass
    red_green_expectation: red before (file absent), green after
  - source: docs/contracts/vp-red-before.yaml
    behavior: the contract names the enforcer of rule (v)
    verification_step: 2
    test_selector: tests/checks/verification/test_vp_replay_rule_v_lint.py::test_contract_names_the_rule_v_lint
    red_green_expectation: red before (key absent), green after
