scope:
  - file: scripts/checks/verification/_vp_replay_rule_v.py
    action: Create
    purpose: >-
      The rule (v) lint, a submodule beside _vp_replay_budget.py and _vp_replay_classify.py (Decision 128
      decompose-by-default: validate_vp_replay.py is unregistered in config/sloc_budgets.yaml, so it stays under 500
      SLOC by adding only a call). Static and non-executing. Governing rule (operator's escalation choice, critique
      round 2), stated as a CLOSED definition: a segment is examined only when it is PLAIN; every segment whose raw
      text contains "pytest" or "ruff" and is not PLAIN is counted EXCLUDED as "not plain" (one counted line,
      sub-reasons optional), never silently passed and never refused.
      (1) Splitting. step_rule_v_scan(command, scope_files, root) splits the command into segments with a
      QUOTE-AWARE tokenizer (for example shlex.shlex(posix=True, punctuation_chars=True) with newline kept as a
      token): &&, ||, ;, | and newline separate segments only outside quotes, so the inside of a quoted string is
      never a segment (the shared _vp_replay_classify._SHELL_SEGMENT_SPLIT_RE is not changed). A quoted token that
      contains the word pytest or ruff (regex \bpytest\b or \bruff\b) is code, not argv: its segment is counted
      EXCLUDED (sh -c, bash -c, python -c and pytest.main all land here, whatever separators they hold inside). Heredocs: a segment
      holding a heredoc operator (<<WORD, <<-WORD, <<'WORD', <<"WORD", << WORD) is scanned up to the operator, and the
      following lines up to the line equal to WORD are a heredoc body, never scanned; <<< is a here-string, not a
      heredoc; a heredoc with no terminating line counts the rest of the command EXCLUDED "unterminated heredoc".
      (2) PLAIN. A segment is PLAIN when all hold: shlex parses it; a marker is found (the first token whose basename
      is pytest, or a "pytest" token preceded by "-m"; likewise ruff followed by check or format), as the sibling
      carve-out (iii) enforcer validate_hermetic_fast_tier_collectability._pytest_selectors finds it; every token
      before the marker is from the recognised prefix set ("!", NAME=value, env with options other than -C/--chdir
      and with assignments, a python, python3 or venv-python interpreter path with flags such as -I, -X VALUE, -W
      VALUE, -u, -B, -O, -E, -s, then "-m", and "timeout" with its options and duration); no token holds any of $ `
      ( ) { } < >, except a recognised redirection (>, >>, 2>, &>, 2>&1, alone or with its target joined), which is
      removed with its target before target collection; no token is --pyargs, starts with @ (an argument file) or is a
      PYTEST_ADDOPTS= assignment; and no earlier segment of the same step holds a cd or pushd token or a { or (
      grouping token anywhere in it (unknown cwd). So $( ), backticks, subshells, xargs pytest, env -C, python -c "...pytest.main(...)" and sh -c all fall
      in the counted complement. For a ruff phase only the marker, the prefix and the cwd conditions apply: rule (v)
      refuses a ruff check/format phase whatever its targets, so $ or parentheses among ruff's arguments do not
      make it not-plain.
      (3) Targets (pytest arm). A target is a token after the marker that contains no "::", is not an option, and is
      not the value of a value-taking option: a superset of the sibling's _VALUE_OPTIONS (--deselect, --ignore,
      --ignore-glob, -k, -m, -p, -c, -o, --rootdir, --cov, --cov-report) plus --basetemp, --confcutdir, --junitxml,
      --cov-config, --log-file, --report-log and --html, also in --opt=value form. A target is normalised with
      os.path.normpath relative to root (a leading "./", a trailing "/", ".." and an absolute path under root all
      resolve; a target outside root is ignored). A target holding a glob metacharacter (* ? [) is matched both
      against root with glob(recursive=True) and against the scope file set with fnmatch (a Create row does not
      exist on disk at plan-PR time), and every match is evaluated. A pytest marker with no target, or the target
      ".", re-runs every collected test, so it is treated as the root directory. A target is IN SCOPE when it equals
      a scope[].file whose action is Create or Modify, or is a directory prefix (target + "/", the root for a
      no-target or "." run) of such a file that is a test file (basename test_*.py, *_test.py or conftest.py), since
      rule (v) names test files; a directory holding only non-test in-scope files is not a finding. A target is a
      DIRECTORY target when (root / target).is_dir(). A -k expression never exempts a whole-file or
      whole-directory target (only node and class selectors are rule (v)'s carve-out). The equality branch
      deliberately covers ANY in-scope file, test or not (a whole-file run of an in-scope source, e.g. with
      --doctest-modules, is the same replay cost); only the directory-prefix branch filters for test files. A
      --collect-only whole-file run is refused like any other: it still spends the non-test half, and node selectors
      are the fix.
      (4) plan_rule_v_findings(doc, root) returns (step id, reason) for each phase pre-deploy, hermetic: true step
      with an in-scope target on a PLAIN pytest segment or a PLAIN ruff phase; a pytest segment whose every target
      carries "::" is never a finding on the pytest arm.
      (5) rule_v_pre_pass(plan_files, root, added, resolved, failed) loads each diff plan with _common.load_plan
      (ImportError reddens, any other load error prints SKIP, mirroring _rg_portability_pre_pass). For a plan in
      added it appends one failed[] entry per finding, prefixed "vp-hermetic-rule-v <plan>:<step>:" (never a
      "vp-replay" or "vp-red-before-lint" prefix: the first suppresses the implement leg's PASS line, the second is
      asserted absent by negated-sweep tests), naming the in-scope targets, saying a -k filter does not exempt a
      whole target, and giving both fixes in this order: first rewrite to pytest node or class selectors (keeps
      hermetic: true and proves the node exists, Decision 148 point 3), then hermetic: false for a step that
      genuinely needs the whole file or directory. For a plan in resolved but not added it never fails: it prints one
      counted ADVISORY line naming the plan and steps (an implementer cannot flip hermetic, implement-scope-boundary.yaml
      implementing_plan_bookkeeping). It prints a WARN line, never a failed[] entry, for an added plan's hermetic step
      naming two or more directory targets (in scope or not). Plans in neither set are skipped with one counted
      EXCLUDED line; not-plain segments print one counted EXCLUDED line.
    new_imports: []
  - file: scripts/checks/verification/validate_vp_replay.py
    action: Modify
    purpose: >-
      Call _vp_replay_rule_v.rule_v_pre_pass right after _rg_portability_pre_pass in validate_vp_replay, passing the
      added-plan set (_added_plan_paths, computed once and passed into _compute_eligible_plans, whose signature gains
      that parameter; it has no external caller) and the resolved set. The file is NEAR_CAP (488 of 500 SLOC,
      unregistered in config/sloc_budgets.yaml), so the change is the import, the added-set line, the call and the
      _compute_eligible_plans signature (about 3-4 SLOC); the pre-pass's description lives in the submodule's docstring,
      not here. Relief if VP 2's plan_obligations reports a crossing: move _segment_invokes_rg and
      _rg_portability_pre_pass into _vp_replay_rule_v.py (both are static plan pre-passes) and re-export both names
      from this module, since tests import _segment_invokes_rg from it; never a budget raise (Decision 128). No change
      to either leg, the budget or the accounting declaration.
    new_imports: [scripts.checks.verification._vp_replay_rule_v]
  - file: docs/contracts/vp-red-before.yaml
    action: Modify
    purpose: >-
      Add key rule_v_lint (population, detection, carve-outs, advisory and fail-open lines, residuals: merely MODIFIED
      plans and already-merged unbuilt plans are not refused; the closed PLAIN definition over a quote-aware split,
      whose complement (every segment naming pytest or ruff that is not PLAIN, and every quoted string naming either)
      is counted EXCLUDED, never examined; the equality branch covers any in-scope file; --collect-only is refused; a ruff phase is refused
      whatever its targets; execution_steps prose is not parsed, the scope
      table is the declared set; a -k filter does not exempt a whole target), name the sibling carve-out (iii) enforcer
      validate_hermetic_fast_tier_collectability beside it, point hermetic_authoring (v) at it in one clause, append an amendment_log entry, and bump
      contract_version 9 -> 10 (this file's convention).
  - file: tests/checks/verification/test_vp_replay_rule_v_lint.py
    action: Create
    purpose: >-
      rec-5547's acceptance file (its name is pinned by the rec). Nodes:
      test_hermetic_whole_directory_in_scope_step_is_refused (an added plan shaped like PLAN-ci-rca-step-extraction
      step 2 at 9d167c64: one pytest over a whole in-scope directory and whole files, hermetic true; refused with the
      vp-hermetic-rule-v prefix and the step id, and the text names the selector fix before hermetic: false);
      test_contract_names_the_rule_v_lint (read with yaml: the contract has a rule_v_lint key, hermetic_authoring
      names it, contract.contract_version is at least 10, and an amendment_log entry names rule_v_lint); and the
      end-to-end node test_validate_vp_replay_runs_the_rule_v_pre_pass, through validate_vp_replay with the existing
      validate_vp_replay/conftest.py _RedBeforeFixture (its fixture scope is scripts/dummy.py, a non-test file, so the
      hermetic step "bin/venv-python -m pytest scripts/dummy.py -q" is an in-scope whole-file target; a directory
      target would not be, under the test-file rule).
    new_imports: [scripts.checks.verification._vp_replay_rule_v]
  - file: tests/checks/verification/test__vp_replay_rule_v.py
    action: Create
    purpose: >-
      The coverage mirror validate_test_coverage requires for the new submodule (check_test_file_exists names this
      path; precedent _vp_replay_budget.py -> test__vp_replay_budget.py); it must bring the submodule to the per-file
      coverage the check demands. Unit nodes calling the submodule directly on tmp_path plan files with explicit
      added/resolved sets (no git): test_hermetic_whole_file_in_scope_step_is_refused; test_ruff_phase_is_refused;
      test_prefixed_invocations_are_detected (NAME=value assignments, env with -u and assignments, python -I -m pytest,
      timeout 60 pytest); test_newline_and_heredoc_commands_split (a newline-separated pytest-then-git-diff step whose
      later line names an in-scope file is not refused; a pytest on line 2 over an in-scope whole file is refused; a
      heredoc body naming pytest and an in-scope file is never scanned); test_not_plain_forms_are_counted_excluded
      (one case per family: $( )-wrapped pytest, a backtick target, a subshell "(cd tests && pytest test_x.py)",
      env -C, xargs pytest, --pyargs, an @argsfile, PYTEST_ADDOPTS= with a node target, python -c
      "...pytest.main(...)", sh -c, bash -c 'x; bin/venv-python -m pytest <in-scope file>' (inner separator), a brace
      group "{ cd tests; pytest test_x.py; }", a cd before pytest, an unterminated heredoc; none refused, each counted
      on the EXCLUDED line); test_ruff_phase_with_substituted_args_is_refused;
      test_no_target_and_dot_target_are_the_root; test_glob_matches_a_create_row_absent_on_disk;
      test_pytest_dash_c_value_is_not_code (pytest -c pytest.ini over an in-scope file is refused, not excluded);
      test_here_string_is_not_a_heredoc; test_directory_with_only_non_test_in_scope_members_passes; test_glob_dotdot_and_absolute_targets_resolve (a glob
      matching an in-scope file, a ** glob, a ../ form and an absolute path under root are refused; a path outside
      root is ignored); test_selectors_out_of_scope_and_non_hermetic_steps_pass (node selector, class selector, an
      out-of-scope whole file, hermetic: false, a post-deploy step); test_k_filter_does_not_exempt_a_whole_target;
      test_option_values_are_never_targets (--ignore, --deselect, -k, --cov, --cov-report, --cov-config and
      --junitxml values, space and = forms, that name in-scope paths); test_value_options_cover_the_sibling_set (the submodule's set is a superset of
      validate_hermetic_fast_tier_collectability._VALUE_OPTIONS); test_resolved_plan_prints_advisory_and_never_fails;
      test_modified_plan_is_excluded_and_announced; test_several_directory_targets_warn_and_never_fail;
      test_unparseable_segment_fails_open_and_is_announced; test_import_error_reddens; test_load_error_skips.
    new_imports: [scripts.checks.verification._vp_replay_rule_v]
