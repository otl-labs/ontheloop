intent: >-
  Enforce hermetic authoring rule (v) at plan-PR time: validate_vp_replay refuses a hermetic: true pre-deploy step of a
  diff-ADDED plan that re-runs a whole test file or directory the plan's own scope creates or modifies, or runs a ruff
  check/format phase, so a step like the one that reddened main in run 45254801937 is caught on its plan PR, not at its
  implement merge (rec-5547).
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-vp-replay-rule-v-lint.yaml
phase: >-
  ci_rca (soft-warn exception category: rec-5547, Critical, source ci_rca; the preventive half of the red whose
  corrective half was amendment #2414). No tier_item is claimed, so the Tier Item Freshness Gate is skipped;
  closes_criteria is empty.
closes_criteria: []
cites: [dec:128, dec:148, dec:189]
amends: []
