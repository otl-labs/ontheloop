  - "Both shapes rule (v) names are refused (whole in-scope file and whole in-scope directory), plus the ruff check/format phase; rule (v)'s text is not weakened (consult Q1 = A)."
  - "No change to the replay legs, MAX_AGGREGATE_SECONDS, MAX_REPLAYED_STEPS, the warn band or the accounting declaration; no existing test or assertion is loosened (Decisions 181, 235)."
  - "No existing plan is edited; the five directory-shaped unbuilt plans are rec-5601's, modified-plan coverage is rec-5602's."
  - "No rescue agents or workaround loops (Decision 55)."
