schema_version: 5
slug: "w1-allow-list-transport"
intent: >-
  Stage, for the operator, the design of telemetry-feedback-loop W1 component 8 (allow-list transport: what
  telemetry metadata may cross from the customer-owned data plane to the control plane, and how; Decision 209
  clause 5(i), carried by rec-4141) without building or writing anything: prove with executable evidence that
  62 of the 140 telemetry contract columns hold caller-controlled strings and none of the 15 vocabularies is
  enforced, that a deny-list leaks where an explicit allow-list does not, and that derived ids plus tenancy ids
  confirm guessable refs; stage a deterministic egress assembled from a per-column allow-list; split the design
  into settled, contested and open rows; and author the component's one CD.45 pilot item in the Decision 197
  clause-3 grain. Nothing is implemented, filed, updated, closed or flipped.
plan_type: REPORT-ONLY
verification_tier: V1
plan_path: docs/plans/PLAN-w1-allow-list-transport.yaml
phase: >-
  CD.45 pilot (telemetry-feedback-loop design stream, W1), component 8 of the seed list. Touches T2.36
  (depends_on edge) by id only; closes no criterion.
scope:
  - file: docs/plans/PLAN-w1-allow-list-transport.yaml
    action: Create
    purpose: >-
      The planning artefact: executable evidence for the staging (VP), the fork record (context) and the gating
      constraints.
  - file: docs/plans/reports/REPORT-w1-allow-list-transport.md
    action: Create
    purpose: >-
      The REPORT-ONLY deliverable (Decision 86 cl.2; file-router.yaml report-deliverables route): verdict,
      evidence table, the field inventory, the identity-oracle probe, the allow-list, the egress templates with
      vectors and mutants, the canary probe, the transport comparison, the settled/contested/risk/open split,
      the register as authored, boundary notes for W2 and staged candidate decision text for W3.
  - file: docs/work-item-pilot/telemetry-feedback-loop.yaml
    action: Modify
    purpose: >-
      Add the one pilot item pwi-allow-list-transport (kind task), its three open criteria and one id-only edge
      (depends_on T2.36), in the canonical layout validate_work_item_pilot enforces.
bundled_recommendations: []
followon_recs: []
infrastructure_dependencies: []
acceptance_criteria:
  - >-
    On live code, the pilot Plane literal is data_plane and control_plane, the four telemetry contracts carry 15
    accepted_values blocks of which none is enforced, and no file under src/ or scripts/ other than the pilot
    model names control_plane (VP step 1).
  - >-
    The inventory block in report section 1.1 matches the four telemetry Class A contracts column for column
    and in order, with each column's type and its mechanical class (closed enum with its vocabulary, derived
    id, tenancy id, timestamp, number, boolean) and the stated open-vocabulary and content-hash judgment; the
    class counts quoted in sections 0 and 1 recompute from it (VP step 2).
  - All seven open W1 items, read at their pinned branch heads, declare planes data_plane only (VP step 3).
  - >-
    The egress assembled from the report's inventory, allow-list and templates passes every vector in report
    section 2.4 on DuckDB, ten of them by refusing with the stated message, including a valid tenancy id carrying a
    suffix, a trailing newline, a trailing space or a first character above 7 (VP step 4).
  - >-
    On the canary probe, the 12-column deny-list leaks 65 of 77 non-tenancy string columns, the staged allow-list
    leaks none, and the withheld counters equal the injected out-of-vocabulary values (VP step 5).
  - >-
    Given tenant_id, project_id and one derived event_id, the identity kernel recovers the producing ref from a
    100,000-candidate space with an exact time prefix (VP step 6).
  - >-
    The pilot fixture carries exactly one item for this component, keeps its three-line CD.45 header, and
    validate_work_item_pilot passes all six legs (VP step 7).
  - The plan validates against the PlanDocument schema (VP step 8).
  - >-
    The branch diff against origin/main is exactly the plan, the report and the fixture, with no code, roadmap,
    contract, config, rec or DECISIONS edit (VP step 9).
verification_plan:
  - step: 1
    phase: pre-deploy
    action: Probe the pilot Plane literal, the telemetry vocabularies' enforcement and any runtime plane reader
    command: >-
      bin/venv-python -c "import pathlib,typing,yaml; from scripts.checks.roadmap import _work_item_pilot_model as M;
      G=lambda o,k: sum(([v] if a==k else G(v,k) for a,v in o.items()),[]) if isinstance(o,dict) else sum((G(v,k) for v in o),[]) if isinstance(o,list) else [];
      V=[v for t in ('sessions','observations','agents','transcripts') for v in G(yaml.safe_load(open('docs/contracts/telemetry_%s.yaml' % t,encoding='utf-8')),'accepted_values')];
      R=sorted(str(p) for d in ('src','scripts') for p in pathlib.Path(d).rglob('*.py') if p.name!='_work_item_pilot_model.py' and 'control_plane' in p.read_text(encoding='utf-8',errors='replace'));
      print('planes=%s telemetry_vocabularies=%d enforced=%d control_plane_readers=%d' % (','.join(typing.get_args(M.Plane)),len(V),sum(bool(v.get('enforced')) for v in V),len(R)))"
    expected: >-
      One line: the two planes; 15 telemetry vocabularies, 0 enforced; no runtime file names control_plane.
    fix_if: >-
      An enforced count above 0 means a contract closed an enum at write: update e2, O1 and k1's open-vocabulary
      note. control_plane_readers above 0 means an egress or plane reader landed: read it and update e1, s2 and
      the transport comparison.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Red-before evidence for the build: true only until a vocabulary is enforced or a plane reader lands; a
      standing guard would pin the gap the design asks to close.
    expected_literals: ["planes=data_plane,control_plane telemetry_vocabularies=15 enforced=0 control_plane_readers=0"]
  - step: 2
    phase: pre-deploy
    action: Re-derive the report's field inventory from the four telemetry contracts and count its classes
    command: >-
      bin/venv-python -c "import re,yaml,collections; from src.telemetry.identity import KEY_PLANS; F=chr(96)*3; T=open('docs/plans/reports/REPORT-w1-allow-list-transport.md',encoding='utf-8').read(); I={k:v for b in re.findall(F+'yaml\n(.*?)'+F,T,re.S) for k,v in yaml.safe_load(b).items()}['inventory'];
      L=lambda n: yaml.safe_load(open('docs/contracts/'+n,encoding='utf-8')); Z=lambda f: (lambda r: dict(Z(L(r[0])['fields'][r[1].split('/')[-1]]),**{k:v for k,v in f.items() if k!='\$ref'}))(f['\$ref'].split('#')) if '\$ref' in f else f;
      AV=lambda r: next((r[d]['accepted_values']['values'] for d in ('dq_intent_local','dq_intent') if (r.get(d) or {}).get('accepted_values')),None); TY={'str':'VARCHAR','int':'BIGINT','float':'DOUBLE','datetime':'TIMESTAMPTZ','bool':'BOOLEAN','list[str]':'VARCHAR[]'};
      M=lambda t,k,r,v: v[0]==TY[r['type']] and (v[1]=='closed_enum')==(AV(r) is not None) and (AV(r) is None or v[2]==AV(r)) and (v[1]=='derived_id')==(k=='event_id' or k in KEY_PLANS[t]) and (v[1]=='tenancy_id')==(k in ('tenant_id','project_id')) and (v[1]=='timestamp')==(r['type']=='datetime') and (v[1]=='number')==(r['type'] in ('int','float')) and (v[1]=='boolean')==(r['type']=='bool') and (v[1]=='open_vocab')==(k in OV) and (v[1]=='content_hash')==(k in ('content_sha256','output_sha256')) and (v[1]!='free_text' or r['type'] in ('str','list[str]')); OV={'producer','workflow','severity','provider','model','model_primary','agent_type','trigger','ci_outcome'};
      C={t:{k:Z(f) for k,f in L(t+'.yaml')['fields'].items()} for t in I}; ok=sum(list(C[t])==list(I[t]) for t in I); fid=sum(M(t,k,C[t][k],v) for t in I for k,v in I[t].items() if k in C[t]); K=collections.Counter(v[1] for t in I for v in I[t].values());
      print('tables=%d columns=%d per_table=%s order_match=%d/4 fidelity=%d/%d classes=%s caller_strings=%d' % (len(I),sum(map(len,I.values())),'/'.join(str(len(I[t])) for t in I),ok,fid,sum(map(len,I.values())),','.join('%s:%d' % kv for kv in K.most_common()),K['free_text']+K['open_vocab']+K['closed_enum']+K['content_hash']))"
    expected: >-
      One line: four tables, 140 columns (38/43/32/27), column order matching 4 of 4, all 140 classifications
      consistent with the contracts, the nine class counts, and 62 caller-controlled string columns.
    fix_if: >-
      A fidelity or order shortfall means a contract changed or the block was mis-copied: re-copy the changed
      columns and update section 1.2, the verdict, s3 and the allow-list if a crossing column moved class.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Design evidence over a frozen copy of four contracts; the build's allow-list check (criterion c1 and k5)
      is the standing guard.
    expected_literals: ["tables=4 columns=140 per_table=38/43/32/27 order_match=4/4 fidelity=140/140 classes=number:41,free_text:30,derived_id:15,closed_enum:15,open_vocab:15,timestamp:12,tenancy_id:8,boolean:2,content_hash:2 caller_strings=62"]
  - step: 3
    phase: pre-deploy
    action: Read the planes of the seven open W1 items at their pinned branch heads
    command: >-
      bin/venv-python -c "import re,subprocess as S,yaml; F=chr(96)*3; T=open('docs/plans/reports/REPORT-w1-allow-list-transport.md',encoding='utf-8').read(); H=[x['head'] for x in {k:v for b in re.findall(F+'yaml\n(.*?)'+F,T,re.S) for k,v in yaml.safe_load(b).items()}['siblings']];
      G=lambda h: (S.run(['git','fetch','--quiet','--depth','1','origin',h],check=True), yaml.safe_load(S.run(['git','show',h+':docs/work-item-pilot/telemetry-feedback-loop.yaml'],check=True,capture_output=True,text=True).stdout))[1];
      P=[w['extension']['consideration_register']['planes'] for h in H for w in G(h)['work_items']]; print('heads=%d items=%d data_plane_only=%d' % (len(H),len(P),sum(p==['data_plane'] for p in P)))"
    expected: One line, heads=7 items=7 data_plane_only=7; each head is fetched by sha, so a later push does not change it.
    fix_if: >-
      A fetch failure means a sha is unreachable (branch deleted after squash-merge): read the item from main. A
      lower data_plane_only count means a sibling now declares control_plane: read its egress need into section 5.
    hermetic: false
    graduation: not-applicable
  - step: 4
    phase: pre-deploy
    action: Assemble the egress from the report's blocks and run every vector on DuckDB
    command: |
      bin/venv-python -c "import re,datetime,duckdb,yaml; F=chr(96)*3; T=open('docs/plans/reports/REPORT-w1-allow-list-transport.md',encoding='utf-8').read(); Y={k:v for b in re.findall(F+'yaml\n(.*?)'+F,T,re.S) for k,v in yaml.safe_load(b).items()}; I,A,E,V=Y['inventory'],Y['allow_list'],Y['egress'],Y['vectors'];
      q=lambda v: ', '.join(\"'%s'\" % x for x in v); R=lambda s,**k: [s:=s.replace('{'+a+'}',b) for a,b in k.items()][-1]; X=lambda t,c: I[t][c][2] if I[t][c][1]=='closed_enum' else [];
      B=lambda t,al: [c for c in al['tables'][t] if I[t][c][1] not in al['crossing_classes'] and (_ for _ in ()).throw(ValueError('not a crossing class: %s.%s' % (t,c)))] or (R(E['structural'],table=t,classified=q(I[t])), R(E['select'],keys=', '.join([R(E['key'],c=c) for c in al['key']]+[R(E['day'],c=al['day_from'])]),dims=', '.join(R(E['dim'],c=c,vocab=q(X(t,c))) for c in al['tables'][t] if I[t][c][1]=='closed_enum'),measures=', '.join(R(E['measure'][I[t][c][1]],c=c,vocab=q(X(t,c))) for c in al['tables'][t]),table=t));
      N=lambda e: datetime.date.fromisoformat(e) if isinstance(e,str) and re.fullmatch(r'\d{4}-\d\d-\d\d',e) else e;
      def G(v):
        c=duckdb.connect(); c.execute(\"SET TimeZone='%s'\" % V['timezone']); t=v['table']; c.execute('CREATE TABLE %s (%s)' % (t,', '.join('%s %s' % e for e in [(k,x[0]) for k,x in I[t].items()]+[tuple(e) for e in v.get('extra_columns',[])])))
        [c.execute('INSERT INTO %s (%s) VALUES (%s)' % (t,','.join(r),','.join('?'*len(r))),list(r.values())) for r in [dict(V['defaults'],**r) for r in v['rows']]]
        try: s,x=B(t,dict(A,tables=dict(A['tables'],**v.get('allow_list_patch',{})))); c.execute(s).fetchall(); o=c.execute(x); n=[d[0] for d in o.description]; rows=o.fetchall()
        except Exception as ex: return v['expected']=='error' and v['raises'] in str(ex)
        return v['expected']!='error' and n==v.get('columns',n) and all(k in n for k in v['select']) and sorted(str([r[n.index(k)] for k in v['select']]) for r in rows)==sorted(str([N(e) for e in row]) for row in v['expected'])
      P=[G(v) for v in V['cases']]; print('vectors=%d pass=%d/%d raises=%d failed=%s' % (len(P),sum(P),len(P),sum(v['expected']=='error' for v in V['cases']),[v['id'] for v,p in zip(V['cases'],P) if not p]))"
    expected: >-
      One line: 22 vectors, 22 of 22 passing (ten, e01-e10, by refusing with their stated message), and an empty
      failed list. A refusal with another message counts as a failure.
    fix_if: >-
      A failing vector means the templates, the allow-list or the assembly rule diverge from the guard table in
      report section 2.3: fix the template or the vector that encodes the wrong intent, and say which in the report.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Design evidence for the staged egress; the production verb carries its own vector test (criterion c1).
    expected_literals: ["vectors=22 pass=22/22 raises=10 failed=[]"]
  - step: 5
    phase: pre-deploy
    action: Seed a canary in every string column of the four tables and compare the deny-list with the allow-list
    command: |
      bin/venv-python -c "import re,collections,duckdb,yaml; F=chr(96)*3; T=open('docs/plans/reports/REPORT-w1-allow-list-transport.md',encoding='utf-8').read(); Y={k:v for b in re.findall(F+'yaml\n(.*?)'+F,T,re.S) for k,v in yaml.safe_load(b).items()}; I,A,E,P=Y['inventory'],Y['allow_list'],Y['egress'],Y['probe'];
      q=lambda v: ', '.join(\"'%s'\" % x for x in v); R=lambda s,**k: [s:=s.replace('{'+a+'}',b) for a,b in k.items()][-1]; X=lambda t,c: I[t][c][2] if I[t][c][1]=='closed_enum' else [];
      B=lambda t: (R(E['structural'],table=t,classified=q(I[t])), R(E['select'],keys=', '.join([R(E['key'],c=c) for c in A['key']]+[R(E['day'],c=A['day_from'])]),dims=', '.join(R(E['dim'],c=c,vocab=q(X(t,c))) for c in A['tables'][t] if I[t][c][1]=='closed_enum'),measures=', '.join(R(E['measure'][I[t][c][1]],c=c,vocab=q(X(t,c))) for c in A['tables'][t]),table=t));
      W=lambda t,c,v,i: (P['tenants'][i%2] if c=='tenant_id' else P['project']) if v[1]=='tenancy_id' else '2026-10-01 10:00:%02d.123+00' % (i%60) if v[1]=='timestamp' else (float('nan') if v[0]=='DOUBLE' and i%10==0 else i) if v[1]=='number' else i%2==0 if v[1]=='boolean' else v[2][i%len(v[2])] if v[1]=='closed_enum' and i%2==0 else (lambda s: [s] if v[0]=='VARCHAR[]' else s)('CNRY:%s:%s:%d' % (t,c,i));
      c=duckdb.connect(); D,Z,H,N=set(),set(),0,0
      for t,K in I.items():
        c.execute('CREATE TABLE %s (%s)' % (t,', '.join('%s %s' % (k,v[0]) for k,v in K.items()))); [c.execute('INSERT INTO %s VALUES (%s)' % (t,','.join('?'*len(K))),[W(t,k,v,i) for k,v in K.items()]) for i in range(P['rows_per_table'])]
        d=str(c.execute('SELECT * EXCLUDE (%s) FROM %s' % (', '.join(x for x in P['deny_list'] if x in K),t)).fetchall()); D|={(t,k) for k in K if 'CNRY:%s:%s:' % (t,k) in d}
        s,x=B(t); c.execute(s).fetchall(); o=c.execute(x); n=[z[0] for z in o.description]; rows=o.fetchall(); a=str(rows); Z|={(t,k) for k in K if 'CNRY:%s:%s:' % (t,k) in a}|({(t,'?')} if 'CNRY' in a else set()); N+=len(rows)
        H+=sum(v for r in rows for k,v in zip(n,r) if k.startswith('withheld_') and I[t][k[9:]][1]=='closed_enum')
      J=sum(P['rows_per_table']//2*sum(I[t][k][1]=='closed_enum' for k in A['tables'][t]) for t in I); S=sum(v[0].startswith('VARCHAR') and v[1]!='tenancy_id' for K in I.values() for v in K.values()); C=collections.Counter(I[t][k][1] for t,k in D);
      print('string_columns=%d denied=%d leaked_deny=%d by_class=%s leaked_allow=%d egress_rows=%d withheld_enum=%d/%d crossing_columns=%d' % (S,sum(k in P['deny_list'] for K in I.values() for k in K),len(D),','.join('%s:%d' % kv for kv in sorted(C.items())),len(Z),N,H,J,sum(map(len,A['tables'].values()))))"
    expected: >-
      One line: 77 non-tenancy string columns, 12 denied, 65 leaking through the deny-list by class, 0 through
      the staged allow-list, 55 egress rows, 300 of 300 injected out-of-vocabulary values counted as withheld,
      48 crossing columns.
    fix_if: >-
      leaked_allow above 0 means a guard or the membership lets text cross: find the column, fix the template or
      the allow-list, and re-run VP 4. A changed deny-list count means the inventory changed: re-run VP 2 first.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Design evidence for s3 and k1; the production canary is the failure_signal and criterion c2 carries the
      build's test.
    expected_literals: ["string_columns=77 denied=12 leaked_deny=65 by_class=closed_enum:15,content_hash:2,derived_id:15,free_text:18,open_vocab:15 leaked_allow=0 egress_rows=55 withheld_enum=300/300 crossing_columns=48"]
  - step: 6
    phase: pre-deploy
    action: Use the identity kernel to recover a low-entropy ref from one derived event_id and the tenancy ids
    command: >-
      bin/venv-python -c "import re,yaml,datetime; from src.telemetry import identity as K; F=chr(96)*3; T=open('docs/plans/reports/REPORT-w1-allow-list-transport.md',encoding='utf-8').read(); O={k:v for b in re.findall(F+'yaml\n(.*?)'+F,T,re.S) for k,v in yaml.safe_load(b).items()}['oracle'];
      ts=datetime.datetime.fromisoformat(O['event_timestamp']); seen=K.derive_event_id(O['table'],O['tenant_id'],O['project_id'],O['true_ref'],ts); tb=K.decode_time_prefix(seen);
      H=[r for r in (O['candidate_template'].replace('{n}',str(n)) for n in range(O['candidates'])) if K.derive_event_id(O['table'],O['tenant_id'],O['project_id'],r,tb)==seen];
      print('candidates=%d time_prefix_exact=%s matches=%d recovered=%s' % (O['candidates'],tb==ts,len(H),H==[O['true_ref']]))"
    expected: One line, candidates=100000 time_prefix_exact=True matches=1 recovered=True; runs in a few seconds.
    fix_if: >-
      recovered=False means the identity spec gained a secret or the time prefix changed: re-read the envelope's
      identity spec and update section 1.3, e7, e8, k2 and O2.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Red-before evidence for k2 and O2; true only while the identity hash takes no secret.
    expected_literals: ["candidates=100000 time_prefix_exact=True matches=1 recovered=True"]
  - step: 7
    phase: pre-deploy
    action: Prove the fixture carries this component's one item and the pilot evaluator passes
    command: >-
      bin/venv-python -c "import yaml; from scripts.checks.roadmap.validate_work_item_pilot import validate_work_item_pilot as v;
      d=yaml.safe_load(open('docs/work-item-pilot/telemetry-feedback-loop.yaml',encoding='utf-8'));
      n=sum(i['id']=='pwi-allow-list-transport' for i in d['work_items']); f=[]; v(f); h=open('docs/work-item-pilot/telemetry-feedback-loop.yaml',encoding='utf-8').read().split('fixture:')[0].splitlines();
      print('component_items=' + str(n) + ' evaluator_failed=' + str(f) + ' header_lines=' + str(len(h)) + ' header_kept=' + str(len(h)==3 and h[0].startswith('# CD.45 pilot fixture (provisional_v0). NOT A ROADMAP')))"
    expected: >-
      Six PASS leg lines, then one line reporting one component item, an empty failure list and the fixture's
      three-line CD.45 header kept above fixture: (validate_work_item_pilot ignores comments, so this step pins it).
    fix_if: >-
      A failing leg names the row; fix it in the fixture using the canonical layout (render(parsed)). A textual
      merge conflict with another W1 PR (all append to the same item lists) is resolved by merging main,
      re-rendering with render(parsed) and re-running this step.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      validate_work_item_pilot is already a registered check run by both tiers; a per-plan row duplicates it.
    expected_literals: ["component_items=1 evaluator_failed=[] header_lines=3 header_kept=True"]
  - step: 8
    phase: pre-deploy
    action: Validate this plan against the PlanDocument schema
    command: bin/venv-python -m scripts.roadmap.plan_document docs/plans/PLAN-w1-allow-list-transport.yaml
    expected: The validator reports the plan valid and exits 0.
    fix_if: Fix the reported field (unknown key, missing graduation companion, backtick literal in expected).
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      validate_plan_documents already schema-checks every docs/plans/PLAN-*.yaml in both tiers; a per-plan row
      duplicates it.
  - step: 9
    phase: pre-deploy
    action: Confirm the change is exactly the plan, report and fixture files
    command: git fetch --quiet origin main && git diff --name-only origin/main...HEAD
    expected: >-
      Exactly three paths: docs/plans/PLAN-w1-allow-list-transport.yaml,
      docs/plans/reports/REPORT-w1-allow-list-transport.md and docs/work-item-pilot/telemetry-feedback-loop.yaml.
    fix_if: Any other path means scope leaked; revert it.
    hermetic: false
    graduation: not-applicable
  - step: 10
    phase: pre-deploy
    action: Run the fast presubmit tier over the branch
    command: bin/venv-python -m scripts.validate --pre
    expected: Exits 0; PR CI's --pre run is the authoritative gate (Decision 73).
    fix_if: Address the reported issue in the plan, report or fixture.
    hermetic: false
    graduation: not-applicable
constraints:
  - >-
    No tier-item or criterion status flip, no closes_criteria entry, no ratification (charter never-list). The
    fixture's three criteria are pilot rows with status open, never roadmap criteria.
  - >-
    No recommendation filed, updated, closed or read for content (Decision 67); rec-4141 is named only because
    Decision 209 clause 5(i) names it. Observations O1 and O2 are named for their owners in the report, not filed.
  - >-
    No contract, config, code, IAM or Terraform edit: the egress verb, the allow-list's home, any vocabulary
    enforcement, any identity-hash change and any transport are build-time changes for their owners.
    docs/DECISIONS.md and its archive untouched; the candidate text in report section 6 is staged for W3, not filed.
  - >-
    k1-k4 touch security or IAM and are always-ask: parked with a recommendation, never decided by this thread
    or the Step 6b stand-in. Nothing that spends.
  - >-
    CD.45 binds while pending: one fixture only, sized by item count (this component spends 1 of 12), edges id-only
    into ROADMAP-PLATFORM, never read by /orient, preflight or a pick surface (Decision 108).
  - >-
    The egress (report section 2) is not to be built by a delegate before k1-k4 are answered by the operator, a
    consumer is named (q2), and the allow-list has a home (k5).
  - No new INTENT or standing prose doc (Decision 86).
context:
