schema_version: 5
slug: "w1-back-validation"
intent: >-
  Stage, for the operator, the design of telemetry-feedback-loop W1 component 6 (back-validation: a
  telemetry delta proves a fix, roadmap T3.4) without building or writing anything: prove with executable
  evidence that the repo's verdict layer admits a telemetry verdict but has no route that can say "not yet"
  (the static sandbox resolves a telemetry acceptance to fails at merge), that the existing ci_rca
  back-validation reads recurrence without exposure, that a naive post-fix delta proves most no-op fixes
  while an exposure-normalised, fixed-sample Fisher rule does not, and where the verdict, the fix link and
  the record live; split the design into settled, contested and open rows; and author the component's one
  CD.45 pilot item in the Decision 197 clause-3 grain. Nothing is implemented, filed, updated, closed or
  flipped.
plan_type: REPORT-ONLY
verification_tier: V1
plan_path: docs/plans/PLAN-w1-back-validation.yaml
phase: >-
  CD.45 pilot (telemetry-feedback-loop design stream, W1), component 6 of the seed list. Touches T3.4
  (part_of edge) and T2.36 (depends_on edge) by id only; closes no criterion of either.
scope:
  - file: docs/plans/PLAN-w1-back-validation.yaml
    action: Create
    purpose: >-
      The planning artefact: executable evidence for the staging (VP), the fork record (context) and the gating
      constraints.
  - file: docs/plans/reports/REPORT-w1-back-validation.md
    action: Create
    purpose: >-
      The REPORT-ONLY deliverable (Decision 86 cl.2; file-router.yaml report-deliverables route): verdict,
      evidence table, the null-effect simulation, the verdict SQL with its params and vectors, the
      settled/contested/risk/open split, the register as authored, boundary notes for W2 and staged candidate
      decision text for W3.
  - file: docs/work-item-pilot/telemetry-feedback-loop.yaml
    action: Modify
    purpose: >-
      Add the one pilot item pwi-back-validation (kind task), its three open criteria and two id-only edges
      (part_of T3.4, depends_on T2.36), in the canonical layout validate_work_item_pilot enforces.
bundled_recommendations: []
followon_recs: []
infrastructure_dependencies: []
acceptance_criteria:
  - >-
    On live code, a filer acceptance carrying a --assert-holds contract is decidable, buckets probeable and
    routes static, where an offline run resolves fails; update_rec's verdict predicate admits a holds record
    with source telemetry keyed to a fix sha and refuses an unmeasurable one; ci_rca back-validation's inputs
    are the rec cache, a window and a clock (VP step 1).
  - >-
    The verdict SQL and the params and vectors blocks in report section 2, read from the report itself, pass
    every vector on DuckDB across four verdicts, seven reasons and four actions, four by raising (VP step 2).
  - >-
    The seeded null-effect simulation in report section 2, decided by the same SQL, shows the naive delta
    proving 44% to 79% of no-op fixes and the staged rule at most 3.0%, with its power on a 75% reduction,
    its fails share on real fixes and its verdicts on real 50% and 30% reductions (VP step 3).
  - >-
    telemetry_sessions carries no commit column but carries branch and rec_ids; the trailer gate declares only
    static and junit verdict sources; fixed_by_sha is stamped only on close; no telemetry verdict source is
    registered; the stale_no_recurrence waiver exists (VP step 4).
  - >-
    The pilot fixture carries exactly one item for this component and validate_work_item_pilot passes all six
    legs (VP step 5).
  - The plan validates against the PlanDocument schema (VP step 6).
  - >-
    The branch diff against origin/main is exactly the plan, the report and the fixture, with no code,
    roadmap, contract, config, rec or DECISIONS edit (VP step 7).
verification_plan:
  - step: 1
    phase: pre-deploy
    action: Probe the existing verdict machinery with a filer acceptance and a telemetry verdict record
    command: >-
      bin/venv-python -c "import hashlib,inspect,json,unittest; from scripts.backlog_health.census import classify_command as C; from scripts.backlog_health import probe as P; from scripts.rec_trailer_acceptance import verdict_for as V; from scripts.rec_trailer_acceptance_junit import classify_grammar as G; from scripts.executor.acceptance_lint import lint_acceptance_command as L; from scripts.ops_portal import closure_gate as Z; from scripts.ci_rca.back_validation import find_preventive_regressions as B;
      a='bin/venv-python -m scripts.telemetry.back_validate --rec rec-100 --assert-holds'; g=G(a); r=lambda v: {'rec_id':'rec-100','sha':'abc1234','acceptance_sha256':hashlib.sha256(a.encode()).hexdigest(),'verdict':v,'source':'telemetry','arm':'proven'};
      k=Z.assert_acceptance_verdict('open','closed','rec-100',a,'abc1234',r('holds')) is None; u=unittest.TestCase().assertRaises(Z.AcceptanceVerdictRefused,Z.assert_acceptance_verdict,'open','closed','rec-100',a,'abc1234',r('unmeasurable')) is None;
      q=[{'id':'rec-1','source':'ci_rca','status':'closed','file':'scripts/x.py','context_v2_json':json.dumps({'preventive_action':'guard'}),'last_updated_timestamp':'2026-09-01T00:00:00Z'}];
      print('bucket=%s route=%s arm=%s decidable=%s offline_verdict=%s verdicts=%s telemetry_holds_accepted=%s unmeasurable_refused=%s ci_rca_bv_inputs=%s quiet_flags=%d' % (C(a), g.route, g.arm, L(a,require_decidable=True,require_discrimination=True)[0], V(C(a),P.FAIL), ','.join(sorted(Z.ACCEPTANCE_VERDICTS)), k, u, ','.join(inspect.signature(B).parameters), len(B(q))))"
    expected: >-
      One line: the acceptance buckets probeable, routes static (arm selector_flag, the known python -m
      misread), is decidable, and an offline FAIL resolves fails; the vocabulary is the four Decision 201
      values; a holds record with source telemetry keyed to the fix sha is accepted and an unmeasurable one
      refused; ci_rca back-validation takes cache_rows, window_days and now, and a closed rec with no
      recurrence yields no flag. No portal, reader or network call is made.
    fix_if: >-
      route=junit or a new route means the census gained an arm: re-read it and update e4, k1 and R7.
      telemetry_holds_accepted=False means the predicate now checks source: k1 (a) needs that source
      registered; update e3 and s1. offline_verdict other than fails means the probe map changed: update e5.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Red-before evidence for the build: true only until a telemetry verdict source is routed; a standing
      guard would pin the routing gap the design asks to close.
    expected_literals: ["bucket=probeable route=static arm=selector_flag decidable=True offline_verdict=fails verdicts=fails,holds,out_of_grammar,unmeasurable telemetry_holds_accepted=True unmeasurable_refused=True ci_rca_bv_inputs=cache_rows,window_days,now quiet_flags=0"]
  - step: 2
    phase: pre-deploy
    action: Run the report's verdict SQL over every vector in the report on DuckDB
    command: >-
      bin/venv-python -c "import re,functools,unittest,duckdb,yaml; F=chr(96)*3; T=open('docs/plans/reports/REPORT-w1-back-validation.md',encoding='utf-8').read(); S=re.findall(F+'sql\n(.*?)'+F,T,re.S); Y=[yaml.safe_load(b) for b in re.findall(F+'yaml\n(.*?)'+F,T,re.S)]; P,V=Y[0],Y[1]['vectors'];
      q=functools.reduce(lambda s,k: s.replace('{'+k+'}',str(P[k])),[k for k in P if k!='params_version'],S[0]).replace('{candidates}','c').replace('{sessions}','s');
      D=['CREATE TABLE c (rec_id VARCHAR, fix_day BIGINT, chain_len INT, decide_day BIGINT)','CREATE TABLE s (rec_id VARCHAR, session_id VARCHAR, day BIGINT, producer VARCHAR, parser_version INT, classifier_version INT, exposed BOOLEAN, affected BOOLEAN, addressed BOOLEAN)'];
      X=lambda v: [[r[0],'%s-%s-%d' % (r[0],r[9] if len(r)>9 else j,i)]+r[1:5]+[i<r[6],i<r[7],i<r[8]] for j,r in enumerate(v['sessions']) for i in range(max(r[5],r[7]))];
      E=lambda f: (unittest.TestCase().assertRaises(duckdb.Error,f),True)[1];
      G=lambda c,v: ([c.execute(x) for x in D],[c.execute('INSERT INTO c VALUES (?,?,?,?)',r) for r in v['candidates']],[c.execute('INSERT INTO s VALUES (?,?,?,?,?,?,?,?,?)',r) for r in X(v)],E(lambda: c.execute(q).fetchall()) if v['expected']=='error' else sorted(map(tuple,c.execute(q).fetchall()))==sorted(map(tuple,v['expected'])))[-1];
      R=[G(duckdb.connect(),v) for v in V]; O=[e for v in V if v['expected']!='error' for e in v['expected']];
      print('sql_blocks=%d vectors=%d pass=%d/%d raises=%d verdicts=%d reasons=%d actions=%d' % (len(S),len(V),sum(R),len(V),sum(v['expected']=='error' for v in V),len({e[1] for e in O}),len({e[2] for e in O}),len({e[3] for e in O})))"
    expected: >-
      One line: two SQL blocks, 28 vectors, 28 of 28 passing on rec_id, verdict, reason and action (four of
      them, v22-v24 and v27, by raising as expected), four verdicts, seven reasons and four actions exercised.
    fix_if: >-
      A lower pass count means the SQL diverges from the action table in report section 2: fix the SQL or the
      vector that encodes the wrong intent, and say which in the report.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Design evidence for settled row s2; the production verdict carries its own vector test (criterion c1),
      which is the standing guard.
    expected_literals: ["sql_blocks=2 vectors=28 pass=28/28 raises=4 verdicts=4 reasons=7 actions=4"]
  - step: 3
    phase: pre-deploy
    action: Run the report's seeded null-effect simulation through the same verdict SQL
    command: >-
      bin/venv-python -c "import re,functools,duckdb,yaml; F=chr(96)*3; T=open('docs/plans/reports/REPORT-w1-back-validation.md',encoding='utf-8').read(); S=re.findall(F+'sql\n(.*?)'+F,T,re.S); Y=[yaml.safe_load(b) for b in re.findall(F+'yaml\n(.*?)'+F,T,re.S)]; P,Z=Y[0],Y[2]['simulation'];
      R=lambda s,d: functools.reduce(lambda a,k: a.replace('{'+k+'}',str(d[k])),[k for k in d if k not in ('params_version','scenarios')],s); q=R(S[0],P).replace('{candidates}','sim_candidates').replace('{sessions}','sim_sessions');
      G=lambda c,p,r: (c.execute(R(R(S[1],dict(Z,p0=p,r=r)),P)), c.execute('SELECT n.naive_holds, v.verdict FROM sim_naive n JOIN ('+q+') v USING (rec_id)').fetchall())[1];
      O={(p,r): G(duckdb.connect(),p,r) for p,r in Z['scenarios']}; B=sorted({p for p,r in Z['scenarios'] if r==0.75}); M=[(p,r) for p,r in Z['scenarios'] if r not in (0.0,0.75)]; A=lambda p,r,f: '%.3f' % (sum(map(f,O[(p,r)]))/len(O[(p,r)]));
      print('scenarios=%d filed_min=%d naive_null=%s staged_null=%s staged_fix=%s unmeasurable_fix=%s fails_fix=%s partial=%s' % (len(O), min(map(len,O.values())), '/'.join(A(p,0.0,lambda x: x[0]) for p in B), '/'.join(A(p,0.0,lambda x: x[1]=='holds') for p in B), '/'.join(A(p,0.75,lambda x: x[1]=='holds') for p in B), '/'.join(A(p,0.75,lambda x: x[1]=='unmeasurable') for p in B), '/'.join(A(p,0.75,lambda x: x[1]=='fails') for p in B), ','.join('p%sr%s:%s/%s/%s' % (p,r,A(p,r,lambda x: x[1]=='holds'),A(p,r,lambda x: x[1]=='fails'),A(p,r,lambda x: x[1]=='unmeasurable')) for p,r in M)))"
    expected: >-
      One line over twelve scenarios (base rates 0.02, 0.05, 0.1 and 0.2, each with no fix effect and with a
      75% reduction, plus 50% and 30% reductions at 0.1 and 0.2; at least 999 filed findings each): the naive
      delta proves 0.791, 0.472, 0.442 and 0.464 of no-op fixes; the staged rule proves 0.022, 0.025, 0.030 and
      0.025 of them; on a real 75% reduction it proves 0.132, 0.699, 0.866 and 0.932, returns unmeasurable on
      0.866, 0.248, 0.064 and 0.008 and fails 0.002, 0.053, 0.070 and 0.060; partial lists holds/fails/
      unmeasurable for the 50% and 30% reductions. Draws are md5 over the seed, so the line is identical on
      every run.
    fix_if: >-
      Different numbers with unchanged SQL and simulation blocks mean DuckDB changed md5, lgamma or window
      semantics: re-run, update section 1's tables, s2, k4 and the fixture rows. A staged_null above 0.05 means the
      rule no longer holds alpha: fix the rule before anything else.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Design evidence for s2 and k4 under stated simplifications; the production signal is false_proof_rate
      (failure_signal), not a simulation.
    expected_literals: ["scenarios=12 filed_min=999 naive_null=0.791/0.472/0.442/0.464 staged_null=0.022/0.025/0.030/0.025 staged_fix=0.132/0.699/0.866/0.932 unmeasurable_fix=0.866/0.248/0.064/0.008 fails_fix=0.002/0.053/0.070/0.060 partial=p0.1r0.5:0.415/0.433/0.152,p0.1r0.3:0.154/0.759/0.087,p0.2r0.5:0.502/0.488/0.010,p0.2r0.3:0.180/0.815/0.005"]
  - step: 4
    phase: pre-deploy
    action: Re-derive the session, trailer-source, stamping and waiver facts the design depends on
    command: >-
      bin/venv-python -c "import yaml; from scripts.ops_portal.closure_gate import WAIVER_CATEGORIES as W; f=yaml.safe_load(open('docs/contracts/telemetry_sessions.yaml',encoding='utf-8'))['fields'];
      g=yaml.safe_load(open('docs/contracts/git-ops.yaml',encoding='utf-8'))['trailer_acceptance_gate']; L=' '.join(yaml.safe_load(open('docs/contracts/ci-rca-lifecycle.yaml',encoding='utf-8'))['auto_close']['fix_linked']['trigger'].split());
      s={e['canonical_id'] for e in yaml.safe_load(open('config/agent/data_quality/source_registry.yaml',encoding='utf-8'))['entries']};
      print('session_code_cols=%s branch=%s rec_ids=%s verdict_sources=%s stamp_on_close_only=%s telemetry_verdict_source=%s stale_waiver=%s' % (sorted(k for k in f if 'sha' in k or 'commit' in k), 'branch' in f, 'rec_ids' in f, ','.join(sorted(g['sources'])), 'on closing' in L, sorted(x for x in s if 'back_valid' in x or 'telemetry_verdict' in x), 'stale_no_recurrence' in W))"
    expected: >-
      One line: telemetry_sessions has no sha or commit column, has branch and rec_ids; the trailer gate's
      sources are junit and static; fixed_by_sha is stamped on closing only; no telemetry verdict source is
      registered; stale_no_recurrence is a waiver category.
    fix_if: >-
      A session commit column changes R4 and q2 (ancestry becomes possible); a telemetry source in the gate or
      the registry means k1 started: re-read it; a stamp on open recs changes k1's option (a).
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      True only until the build adds the telemetry source and the fix-attempt stamp; a standing guard would
      block that sanctioned change.
    expected_literals: ["session_code_cols=[] branch=True rec_ids=True verdict_sources=junit,static stamp_on_close_only=True telemetry_verdict_source=[] stale_waiver=True"]
  - step: 5
    phase: pre-deploy
    action: Prove the fixture carries this component's one item and the pilot evaluator passes
    command: >-
      bin/venv-python -c "import yaml; from scripts.checks.roadmap.validate_work_item_pilot import validate_work_item_pilot as v;
      d=yaml.safe_load(open('docs/work-item-pilot/telemetry-feedback-loop.yaml',encoding='utf-8'));
      n=sum(i['id']=='pwi-back-validation' for i in d['work_items']); f=[]; v(f); print('component_items=' + str(n) + ' evaluator_failed=' + str(f))"
    expected: Six PASS leg lines, then one line reporting one component item and an empty failure list.
    fix_if: >-
      A failing leg names the row; fix it in the fixture using the canonical layout (render(parsed)). A count
      other than 1 means a concurrent W1 thread touched this item; reconcile before merging. A textual merge
      conflict with another W1 PR (all append to the same item lists) is resolved by merging main,
      re-rendering with render(parsed) and re-running this step.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      validate_work_item_pilot is already a registered check run by both tiers; a per-plan row duplicates it.
    expected_literals: ["component_items=1 evaluator_failed=[]"]
  - step: 6
    phase: pre-deploy
    action: Validate this plan against the PlanDocument schema
    command: bin/venv-python -m scripts.roadmap.plan_document docs/plans/PLAN-w1-back-validation.yaml
    expected: The validator reports the plan valid and exits 0.
    fix_if: Fix the reported field (unknown key, missing graduation companion, backtick literal in expected).
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      validate_plan_documents already schema-checks every docs/plans/PLAN-*.yaml in both tiers; a per-plan row
      duplicates it.
  - step: 7
    phase: pre-deploy
    action: Confirm the change is exactly the plan, report and fixture files
    command: git fetch --quiet origin main && git diff --name-only origin/main...HEAD
    expected: >-
      Exactly three paths: docs/plans/PLAN-w1-back-validation.yaml,
      docs/plans/reports/REPORT-w1-back-validation.md and docs/work-item-pilot/telemetry-feedback-loop.yaml.
    fix_if: Any other path means scope leaked; revert it.
    hermetic: false
    graduation: not-applicable
  - step: 8
    phase: pre-deploy
    action: Run the fast presubmit tier over the branch
    command: bin/venv-python -m scripts.validate --pre
    expected: Exits 0; PR CI's --pre run is the authoritative gate (Decision 73).
    fix_if: Address the reported issue in the plan, report or fixture.
    hermetic: false
    graduation: not-applicable
constraints:
  - >-
    No tier-item or criterion status flip, no closes_criteria entry, no ratification (charter never-list). The
    fixture's three criteria are pilot rows with status open, never roadmap criteria.
  - >-
    No recommendation filed, updated, closed or read for content (Decision 67). Every rec operation in the
    report is a description of what a future build would do.
  - >-
    No contract, config or code edit: the telemetry verdict source (git-ops.yaml trailer_acceptance_gate), the
    fix-attempt stamp, the back-validation verb and module, the session commit column and any registry entry
    are build-time changes for their owners. docs/DECISIONS.md and its archive untouched; the candidate
    decision text in report section 5 is staged for W3, not filed.
  - >-
    No LLM judgment anywhere in the verdict (Decision 55); nothing that spends.
  - >-
    CD.45 binds while pending: one fixture only, sized by item count (this component spends 1 of 12), edges
    id-only into ROADMAP-PLATFORM, never read by /orient, preflight or a pick surface (Decision 108).
  - >-
    The verdict (report section 2) is not to be built by a delegate before the rec-filing filer exists, k1-k5
    are decided, each detector declares its exposure predicate (q1), and the c3 verdict review has a named
    reviewer.
  - No new INTENT or standing prose doc (Decision 86).
