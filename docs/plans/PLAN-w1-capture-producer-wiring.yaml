schema_version: 5
slug: "w1-capture-producer-wiring"
intent: >-
  Stage, for the operator, the design of telemetry-feedback-loop W1 component 1 (capture producer wiring:
  record_turn -> writer, rec-4026 slice 3b) without building anything: prove with executable evidence that
  record_turn has no caller and the writer has no telemetry verb, measure the per-pass cost a hook-driven
  runner would pay, split the design into settled, contested and open rows, and author the component's one
  CD.45 pilot item in the Decision 197 clause-3 grain. Nothing is implemented, filed, closed or flipped.
plan_type: REPORT-ONLY
verification_tier: V1
plan_path: docs/plans/PLAN-w1-capture-producer-wiring.yaml
phase: >-
  CD.45 pilot (telemetry-feedback-loop design stream, W1), component 1 of the seed list. Touches T3.20 (part_of
  edge) and T2.36 (depends_on edge) by id only; closes no criterion of either.
scope:
  - file: docs/plans/PLAN-w1-capture-producer-wiring.yaml
    action: Create
    purpose: >-
      The planning artefact: executable evidence for the staging (VP), the fork record (context) and the gating
      constraints.
  - file: docs/plans/reports/REPORT-w1-capture-producer-wiring.md
    action: Create
    purpose: >-
      The REPORT-ONLY deliverable (Decision 86 cl.2; file-router.yaml report-deliverables route): verdict and
      boundary, evidence table, measured per-pass cost, runner shape, settled/contested/open split, the
      register as authored, and boundary notes for W2 synthesis.
  - file: docs/work-item-pilot/telemetry-feedback-loop.yaml
    action: Modify
    purpose: >-
      Add the one pilot item pwi-capture-producer-wiring (kind task), its three open criteria and two id-only
      edges (part_of T3.20, depends_on T2.36), in the canonical layout validate_work_item_pilot enforces.
bundled_recommendations: []
followon_recs: []
infrastructure_dependencies: []
acceptance_criteria:
  - >-
    The wiring is shown absent: no Stop, SubagentStop or SessionEnd hook is configured and nothing under
    .claude/, scripts/ or src/lambdas/ calls record_turn (VP step 1).
  - >-
    The writer half is shown absent: none of the ducklake_writer actions is a telemetry verb and the writer
    transport sends one record per call (VP step 2).
  - >-
    The per-pass cost claim is reproduced: a warm pass emitting the same one new turn costs at least 4x more on
    an 8x longer synthetic tree (VP step 3).
  - >-
    The pilot fixture carries exactly one item for this component and validate_work_item_pilot passes all six
    legs (VP step 4).
  - The plan validates against the PlanDocument schema (VP step 5).
  - >-
    The failure_signal's producer gap is shown: a finalized tree yields no root close row today, so the
    close row in report section 2 step 7 is a 3b obligation (VP step 7).
  - >-
    R2 is shown from the repo alone: a finalized, resumed, Stop-then-SessionEnd session loses its resumed
    segment's last turn under the sticky finalized flag (VP step 8).
  - >-
    The branch diff against origin/main is exactly the plan, the report and the fixture, with no code,
    roadmap, contract, rec or DECISIONS edit (VP step 6).
verification_plan:
  - step: 1
    phase: pre-deploy
    action: Prove no capture hook is configured and nothing calls record_turn
    command: >-
      bin/venv-python -c "import json,pathlib,re; s=json.load(open('.claude/settings.json')).get('hooks',{});
      C=[p for r in ('.claude','scripts','src/lambdas') for p in pathlib.Path(r).rglob('*.py') if re.search(r'\brecord_turn\b',p.read_text(encoding='utf-8',errors='ignore'))];
      print('capture_events=' + (','.join(sorted(e for e in s if e in ('Stop','SessionEnd','SubagentStop'))) or 'none') + ' record_turn_callers=' + str(len(C)))"
    expected: One line reporting no capture hook events and zero record_turn callers.
    fix_if: >-
      A listed event or a non-zero caller count means slice 3b (or part of it) landed after this plan was
      drafted -- stop and re-read rec-4026 before keeping report section 2.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Red-before evidence for a future implementation, true only until the runner lands; a standing guard would
      block the sanctioned fix.
    expected_literals: ["capture_events=none record_turn_callers=0"]
  - step: 2
    phase: pre-deploy
    action: Prove the writer has no telemetry verb and its transport is single-record
    command: >-
      bin/venv-python -c "import re,pathlib; h=pathlib.Path('src/lambdas/ducklake_writer/handler.py').read_text(encoding='utf-8');
      A=re.findall(r'\"([a-z_]+)\":',re.search(r'_ACTIONS[^=]*= \{(.*?)\}',h,re.S).group(1));
      t=pathlib.Path('scripts/ops_portal/writer_transport.py').read_text(encoding='utf-8');
      print('telemetry_actions=' + str(sum(('telemetry' in a) or ('append' in a) or ('event' in a) for a in A)) + ' transport_single_record=' + str('\"record\": _project_ops_record(table, record)' in t))"
    expected: One line reporting zero telemetry actions and a single-record transport.
    fix_if: >-
      A non-zero count means rec-4024's writer verb landed -- the depends_on T2.36 edge may be satisfiable;
      re-check T2.36 c1/c2 and report section 0's BLOCKED line.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      True only until rec-4024 slice 2 lands; the writer's own tests guard its action set.
    expected_literals: ["telemetry_actions=0 transport_single_record=True"]
  - step: 3
    phase: pre-deploy
    action: Reproduce the linear warm-pass cost on synthetic trees (no real transcript read)
    command: >-
      bin/venv-python -c "import json,pathlib,tempfile,time; from src.turn_capture.record_turn import record_turn; from src.turn_capture.transcript import FsTree;
      S='aaaaaaaa-0000-4000-8000-000000000001'; B={'sessionId':S,'cwd':'/w','version':'2.1.0'}; T=lambda n: '2026-01-01T%02d:%02d:%02d.000Z' % (n//3600%24,n//60%60,n%60);
      U=lambda t,j,k: [dict(B,type='assistant',uuid='a'+k,timestamp=T(t*30+2*j+1),message={'id':'m'+k,'model':'m','role':'assistant','stop_reason':'tool_use','usage':{'input_tokens':1,'output_tokens':1},'content':[{'type':'tool_use','id':k,'name':'Bash','input':{'command':'ls'}}]}),dict(B,type='user',uuid='r'+k,promptId='p%d'%t,timestamp=T(t*30+2*j+2),toolUseResult={'interrupted':False},message={'role':'user','content':[{'type':'tool_result','tool_use_id':k,'content':'x'*2000}]})];
      R=lambda t: [dict(B,type='user',uuid='u%d'%t,promptId='p%d'%t,timestamp=T(t*30),message={'role':'user','content':'go'})]+[x for j in range(10) for x in U(t,j,'tu%d_%d'%(t,j))]+[dict(B,type='assistant',uuid='z%d'%t,timestamp=T(t*30+25),message={'id':'mz%d'%t,'model':'m','role':'assistant','stop_reason':'end_turn','usage':{'input_tokens':1,'output_tokens':1},'content':[{'type':'text','text':'ok'}]})];
      W=lambda p,ts,m: p.open(m).write(''.join(json.dumps(x)+chr(10) for t in ts for x in R(t)));
      P=lambda n: pathlib.Path(tempfile.mkdtemp())/(S+'.jsonl');
      warm=lambda n: (p:=P(n), W(p,range(n),'w'), c:=record_turn(FsTree(p),None,project_ref='p').next_cursor, W(p,[n],'a'), t0:=time.perf_counter(), r:=record_turn(FsTree(p),c,project_ref='p'), (time.perf_counter()-t0, sum(len(b) for _,b in r.batches)))[-1];
      (a,ra),(b,rb)=warm(50),warm(400); print('warm_rows=%d/%d linear=%s' % (ra,rb,b/a>=4)); print('ratio=%.1f warm_s=%.2f/%.2f' % (b/a,a,b))"
    expected: >-
      Two lines: the first reports 55 rows emitted at both sizes and linear=True (an 8x longer tree costs at
      least 4x more for the same one new turn); the second prints the measured ratio and seconds (about 8.7 and
      0.35/3.03 at b5554a29), informational.
    fix_if: >-
      linear=False means the warm pass became sub-linear (for example a cached prior-emission set) -- contested
      row k1 option (c) landed or the parser changed; re-measure and update report section 1 and k1. Different
      row counts mean the emission rules changed; re-read src/turn_capture/record_turn.py.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      A timing ratio, so not a deterministic standing guard; it backs one contested design row and is re-run
      only when that row is reopened.
    expected_literals: ["warm_rows=55/55 linear=True"]
  - step: 4
    phase: pre-deploy
    action: Prove the fixture carries this component's one item and the pilot evaluator passes
    command: >-
      bin/venv-python -c "import yaml; from scripts.checks.roadmap.validate_work_item_pilot import validate_work_item_pilot as v;
      d=yaml.safe_load(open('docs/work-item-pilot/telemetry-feedback-loop.yaml',encoding='utf-8'));
      n=sum(i['id']=='pwi-capture-producer-wiring' for i in d['work_items']); f=[]; v(f); print('component_items=' + str(n) + ' evaluator_failed=' + str(f))"
    expected: Six PASS leg lines, then one line reporting one component item and an empty failure list.
    fix_if: >-
      A failing leg names the row; fix it in the fixture using the canonical layout (render(parsed)). A count
      other than 1 means a concurrent W1 thread touched this item -- reconcile before merging.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      validate_work_item_pilot is already a registered check run by both tiers; a per-plan row duplicates it.
    expected_literals: ["component_items=1 evaluator_failed=[]"]
  - step: 5
    phase: pre-deploy
    action: Validate this plan against the PlanDocument schema
    command: bin/venv-python -m scripts.roadmap.plan_document docs/plans/PLAN-w1-capture-producer-wiring.yaml
    expected: The validator reports the plan valid and exits 0.
    fix_if: Fix the reported field (unknown key, missing graduation companion, backtick literal in expected).
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      validate_plan_documents already schema-checks every docs/plans/PLAN-*.yaml in both tiers; a per-plan row
      duplicates it.
  - step: 6
    phase: pre-deploy
    action: Confirm the change is exactly the plan, report and fixture files
    command: >-
      git fetch --quiet --deepen=200 origin main:refs/remotes/origin/main claude/w1-capture-producer-wiring
      && git diff --name-only origin/main...HEAD
    expected: >-
      Exactly three paths: docs/plans/PLAN-w1-capture-producer-wiring.yaml,
      docs/plans/reports/REPORT-w1-capture-producer-wiring.md and docs/work-item-pilot/telemetry-feedback-loop.yaml.
    fix_if: Any other path means scope leaked; revert it.
    hermetic: false
    graduation: not-applicable
  - step: 7
    phase: pre-deploy
    action: Prove record_turn emits no root close row today, even for a finalized tree (the failure_signal's producer gap)
    command: >-
      bin/venv-python -c "import json,pathlib,tempfile; from src.turn_capture.record_turn import record_turn; from src.turn_capture.transcript import FsTree;
      S='aaaaaaaa-0000-4000-8000-000000000001'; B={'sessionId':S,'cwd':'/w','version':'2.1.0'};
      r=[dict(B,type='user',uuid='u1',promptId='p1',timestamp='2026-01-01T00:00:01.000Z',message={'role':'user','content':'go'}),dict(B,type='assistant',uuid='z1',timestamp='2026-01-01T00:00:02.000Z',message={'id':'m1','model':'m','role':'assistant','stop_reason':'end_turn','usage':{'input_tokens':1,'output_tokens':1},'content':[{'type':'text','text':'ok'}]})];
      p=pathlib.Path(tempfile.mkdtemp())/(S+'.jsonl'); p.write_text(''.join(json.dumps(x)+chr(10) for x in r));
      s=dict(record_turn(FsTree(p),None,project_ref='p',session_final=True).batches)['telemetry_sessions'];
      print('final_session_kinds=' + ','.join(sorted(x['event_kind'] for x in s)) + ' close_rows=' + str(sum(x['event_kind']=='close' for x in s)))"
    expected: One line reporting that a finalized one-turn tree yields only the open row and zero close rows.
    fix_if: >-
      close_rows=1 means a root close row landed (runner step 7 of the report); the failure_signal's producer
      gap is closed, so drop the PARSER_VERSION note in report section 2 step 7.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Red-before evidence for the 3b close-row rule, true only until it lands; a standing guard would block
      the sanctioned change.
    expected_literals: ["final_session_kinds=open close_rows=0"]
  - step: 8
    phase: pre-deploy
    action: Reproduce R2, the sticky finalized flag dropping a resumed-after-finalize segment's last turn
    command: >-
      bin/venv-python -c "import json,pathlib,tempfile; from src.turn_capture.record_turn import record_turn; from src.turn_capture.transcript import FsTree;
      S='aaaaaaaa-0000-4000-8000-000000000001'; B={'sessionId':S,'cwd':'/w','version':'2.1.0'}; T=lambda n: '2026-01-01T00:%02d:%02d.000Z' % (n//60%60,n%60);
      U=lambda t: [dict(B,type='user',uuid='u%d'%t,promptId='p%d'%t,timestamp=T(t*10),message={'role':'user','content':'go'}),dict(B,type='assistant',uuid='z%d'%t,timestamp=T(t*10+2),message={'id':'mz%d'%t,'model':'m','role':'assistant','stop_reason':'end_turn','usage':{'input_tokens':1,'output_tokens':1},'content':[{'type':'text','text':'ok'}]})];
      H=dict(B,type='attachment',uuid='rs',timestamp=T(300),attachment={'type':'hook_success','hookName':'SessionStart:resume','hookEvent':'SessionStart','command':'x','exitCode':0,'durationMs':5});
      p=pathlib.Path(tempfile.mkdtemp())/(S+'.jsonl'); W=lambda rs: p.open('a').write(''.join(json.dumps(x)+chr(10) for x in rs));
      C=lambda r: sum(x['external_ref'].endswith('/turn_close') for x in r.observations);
      W([x for t in (1,2,3) for x in U(t)]); r=record_turn(FsTree(p),None,project_ref='p',session_final=True); n=C(r); c=r.next_cursor;
      W([H]+[x for t in (11,12) for x in U(t)]); r=record_turn(FsTree(p),c,project_ref='p'); n+=C(r); r=record_turn(FsTree(p),r.next_cursor,project_ref='p',session_final=True); n+=C(r);
      print('resume_after_finalize_stop_turn_closes=%d/5 cursor_finalized_sticky=%s' % (n, r.next_cursor.finalized))"
    expected: >-
      One line: 4 of 5 turn_close rows across finalize, resume, Stop pass, SessionEnd (the resumed segment's last
      turn is never emitted) and a sticky finalized cursor flag.
    fix_if: >-
      5/5 means the turn-capture owner fixed record_turn.py:149 -- R2 is closed; drop the s3 precondition in the
      report and fixture. Any other count means the emission rules moved; re-read record_turn.py.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Red-before evidence for the turn-capture owner's own fix, true only until it lands; a standing guard
      would block that sanctioned fix.
    expected_literals: ["resume_after_finalize_stop_turn_closes=4/5 cursor_finalized_sticky=True"]
  - step: 9
    phase: pre-deploy
    action: Run the fast presubmit tier over the branch
    command: bin/venv-python -m scripts.validate --pre
    expected: Exits 0; PR CI's --pre run is the authoritative gate (Decision 73).
    fix_if: Address the reported issue in the plan, report or fixture.
    hermetic: false
    graduation: not-applicable
constraints:
  - >-
    No tier-item or criterion status flip, no closes_criteria entry, no ratification (charter never-list). The
    fixture's three criteria are pilot rows with status open, never roadmap criteria.
  - >-
    No recommendation filed, updated or closed (Decision 67). rec-4026, rec-4024, rec-4101 and rec-4147 are
    named as owners only; the note report section 6 would add to rec-4026 is the operator's call.
  - >-
    CD.45 binds while pending: one fixture only, sized by item count (this component spends 1 of 12), edges
    id-only into ROADMAP-PLATFORM, never read by /orient, preflight or a pick surface (Decision 108).
  - >-
    The runner (report section 2) is not to be built by a delegate: it depends on T2.36's unbuilt writer verb and
    on contested rows k1-k2, and it writes production rows only after T2.36 c5, rec-4101 and T3.20 c8.
  - >-
    The R2 defect in src/turn_capture/record_turn.py:149 is recorded, not fixed. Every src/turn_capture rule
    change (the R2 fix and the close-row rule alike) is owned by rec-4026 and ships in slice 3b's PR, routed by
    the operator; no rec is filed here (Decision 67).
  - No new INTENT or standing prose doc (Decision 86); docs/DECISIONS.md and its archive untouched.
context:
  - >-
    Dispatch: coordinator brief 2026-10-02 (W1 component 1, after W0 #1343 merged at b5554a29). Gates requested
    by the brief, in order: zero-context verification, then plan-critique; the PR waits for the operator.
    Decision-scout was not in the requested sequence (W0 precedent: plan-critique only); offered on hand-back.
  - >-
    Measurement (report section 1): synthetic trees of 25-1000 turns (10 tool calls with 2 KB results per
    turn); warm one-new-turn pass 0.17 s at 550 lines to 8.80 s at 22,000 lines, about 0.4 ms per line of the
    whole tree; about 52 KB of wire rows per turn. A real-transcript run was declined by the session's
    permission classifier, so no real transcript was read.
  - >-
    Boundary challenge (report section 0): the seed "record_turn -> writer" spans two owners. Kept as one
    producer-side item; the writer half is T2.36 / rec-4024 by depends_on edge, never a second pilot item.
  - "fork: one item vs split runner/transport | chosen: one task item | class: consistency-only | precedent: CD.45 item-count cap 12 across about ten components; Decision 197 cl.3 grain (one row per work item) | precedent_kind: contract | reversible: yes | persisted: fixture"
  - "fork: who owns gate/precommit signatures on rec-4026's handed-on list | chosen: recommended read-side (rec-4032), nothing moved | class: asked | precedent: PLAN-telemetry-turn-capture-core.yaml:636-639 names both homes | precedent_kind: none | reversible: yes | persisted: report P1, /mnt/project-files/gates/w1-c1-parked-forks.md, PARKED for the operator"
  - "fork: cursor-loss pin recovery (k2) | chosen: none; option (b) recommended, contract amendment option (a) is always-ask | class: asked | precedent: none | precedent_kind: none | reversible: yes | persisted: report k2, PARKED for the operator"
  - "fork: sync vs detached Stop pass (k1) | chosen: none; option (a) recommended | class: asked | precedent: none | precedent_kind: none | reversible: yes | persisted: report k1, PARKED for the operator"
  - >-
    gates: zero-context verification r1 (-4d1a8e63) REVISE, F1 hook-count metric blind to final-turn loss ->
    latest-lifecycle-row metric; r2 (-8b3f6c12) REVISE, G1 resumed sessions + close identity, G2 sticky
    finalized flag -> per-finalization close row, risk R2 recorded (VP 8), detector in c2; r3 (-c5a07d39)
    PROCEED, minors H1-H5 folded in (resume-boundary cut schedule, close-last tie rule, fixture s3 precondition,
    q1 SessionEnd note, wording). Reports: /mnt/project-files/gates/w1-capture-producer-wiring-zero-context-verification-r{1,2,3}-*.md.
    plan-critique r1 (-3d9a6f52) REVISE: B1 single-turn lost session invisible -> scope corrected, blind spot in
    fixture source and q1; M1 close outcome never from hook input; M2 SessionEnd waits for the lock; M3 hook
    timeout; M4 deferral count; M5 widened selectors; M6 k2 pin rule; M7 one owner; M8 T3.20 c3; M9 VP 6 depth;
    M10 contract dependency. All text-only. plan-critique r2 (-62e0b7d4) REVISE: C1 SessionEnd budget re-verified
    (1.5 s shared, raisable to 60 s) and k1/step 2/c1/q2 re-grounded; C2 top-rung trigger requires the q1
    denominator; C3 per-obligation chained selectors (probe: thin file exits 5); C4-C8 VP 6 refspec, owner,
    outcome derivation, q1 reference, OS lock. All text-only. plan-critique r3 (-4b8c1e70) PROCEED; folded D1 k2(b)
    pin rule keyed on the pin hook's command and grammar, D2 VP 6 --deepen, D3 warm-shaped SessionEnd parse cost,
    D4 runner writes nothing to stdout.
  - >-
    check_accounting: no registered check is added or removed; the hygiene stream's baseline is untouched.
