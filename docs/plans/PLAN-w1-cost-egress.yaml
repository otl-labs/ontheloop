schema_version: 5
slug: "w1-cost-egress"
intent: >-
  Stage, for the operator, the design of telemetry-feedback-loop W1 component 10 (the cost and egress budget:
  a register of cost lines in physical units with an owner, a cadence, a measure (flow or stock) and a seed
  envelope each, a daily ledger with per-component attribution, and a daily verdict priced at read) without building, provisioning
  or paying for anything: prove with executable evidence what the nine sibling components hand to this
  component and that none of them declares an envelope or a price; prove that the repository's cost surface
  (the roadmap projection, the monthly reconciliation's triggers and thresholds, its telemetry leg, Terraform,
  the hooks) budgets none of the loop's lines; model from the siblings' own measurements which line breaches
  first at three scales under two egress models; stage a deterministic daily verdict over the register, the
  ledger and the attribution with vectors and mutants; split the design into settled, contested and open
  rows; and author the component's one CD.45 pilot item in the Decision 197 clause-3 grain. Nothing is
  implemented, filed, updated, closed, flipped, provisioned or spent.
plan_type: REPORT-ONLY
verification_tier: V1
plan_path: docs/plans/PLAN-w1-cost-egress.yaml
phase: >-
  CD.45 pilot (telemetry-feedback-loop design stream, W1), component 10 of the seed list (cost and egress
  budget). Touches T2.36 (depends_on edge) by id only; closes no criterion.
scope:
  - file: docs/plans/PLAN-w1-cost-egress.yaml
    action: Create
    purpose: >-
      The planning artefact: executable evidence for the staging (VP), the fork record (context) and the gating
      constraints.
  - file: docs/plans/reports/REPORT-w1-cost-egress.md
    action: Create
    purpose: >-
      The REPORT-ONLY deliverable (Decision 86 cl.2; file-router.yaml report-deliverables route): verdict,
      evidence table, the sibling cost inventory at pinned heads, the repository cost-surface probe, the line
      register, the cost model with its SQL and parameters, the verdict SQL with vectors and mutants, the
      settled/contested/risk/open split, the register as authored, boundary notes for W2 and staged candidate
      decision text for W3.
  - file: docs/work-item-pilot/telemetry-feedback-loop.yaml
    action: Modify
    purpose: >-
      Add the one pilot item pwi-loop-cost-egress-budget (kind task), its three open criteria and one id-only
      edge (depends_on T2.36), in the canonical layout validate_work_item_pilot enforces.
bundled_recommendations: []
followon_recs: []
infrastructure_dependencies: []
acceptance_criteria:
  - >-
    Read at their pinned heads, the nine sibling W1 items and reports show 7 of 9 reports handing cost or
    egress to this component in their W2 boundary notes, 1 of 9 failure_signals or triggers naming egress, 2
    of 9 items with a criterion naming egress, 1 of 9 naming a budget of its own and 0 naming a price, and 8
    of 9 data-plane only (VP step 1).
  - >-
    The repository's cost surface budgets none of the loop's lines: the roadmap's 5 re-evaluation triggers
    and the reconciliation's 6 thresholds name no egress, Neon, Lambda, catalog or review line; the telemetry
    cost leg returns None; no contract names est_cost_usd; the roadmap block says "Not a budget" and its Neon
    egress line is TBD; Terraform declares no budget or cost-anomaly resource and no catalog_stats schedule;
    the reconciliation runs monthly; Terraform declares no S3 bucket metrics configuration, inventory or Storage
    Lens, so neither S3 line has a free per-prefix meter; the hooks file wires no Stop or SessionEnd hook (VP
    step 2).
  - >-
    The cost model assembled from the report's block runs on DuckDB and reproduces the seven scenario lines
    of report section 2.3: catalog egress 1,576,200,000 bytes a month at 5 sessions a day under the touched
    model and 27,621,000,000 under whole_catalog; 3, 5 and 7 lines over their seed envelopes at 5, 20 and
    100 sessions; 18,544,800,000 at 20 sessions with one merge window a day (VP step 3).
  - >-
    The verdict SQL assembled from the report passes all 146 vectors on DuckDB with one row per line (a
    label and two flags; 61 of the vectors written by verification rounds 1-4), 37 by raising with the stated
    message; each of 276 mutants (52 named plus a rule sweep over guards and their arms, comparisons, windows,
    boundaries, rounding, aggregates, dispatch, joins, calendar, operands, params, DISTINCT, flags and WHEN
    order) replaces exactly one site and fails at least one vector; each of the 32 equivalent mutants replaces
    one site and passes every vector (VP step 4).
  - >-
    The pilot fixture carries exactly one item for this component, keeps its three-line CD.45 header, and
    validate_work_item_pilot passes all six legs (VP step 5).
  - The plan validates against the PlanDocument schema (VP step 6).
  - >-
    The branch diff against origin/main is exactly the plan, the report and the fixture, with no code, roadmap,
    contract, config, Terraform, rec or DECISIONS edit (VP step 7).
verification_plan:
  - step: 1
    phase: pre-deploy
    action: Read the nine sibling items and reports at their pinned heads and count what they hand to this component
    command: |
      bin/venv-python -c "import re,subprocess as S,yaml; F=chr(96)*3; T=open('docs/plans/reports/REPORT-w1-cost-egress.md',encoding='utf-8').read(); Y={k:v for b in re.findall(F+'yaml\n(.*?)'+F,T,re.S) for k,v in yaml.safe_load(b).items()}
      G=lambda h,p: (S.run(['git','fetch','--quiet','--depth','1','origin',h],check=True), S.run(['git','show',h+':'+p],check=True,capture_output=True,text=True).stdout)[1]
      X=re.compile(r'\b(cost|egress|bytes|budget|spend|price|usd)\b',re.I); H=re.compile('cost/egress|cost and egress|component 10',re.I); n=dict(heads=0,items=0,signal_or_trigger_names_cost=0,criteria_naming_cost=0,reports_handing_to_component_10=0,data_plane_only=0,items_naming_a_budget=0,items_naming_a_price=0)
      for x in Y['siblings']:
        d=yaml.safe_load(G(x['head'],'docs/work-item-pilot/telemetry-feedback-loop.yaml')); n['heads']+=1; w=[i for i in d['work_items'] if i['id']==x['item']]; n['items']+=len(w); c=w[0]['extension']['consideration_register']; r=G(x['head'],'docs/plans/reports/REPORT-w1-%s.md' % x['slug']); t=yaml.safe_dump(w[0])
        n['signal_or_trigger_names_cost']+=bool(X.search(' '.join(c['failure_signal'].values())+' '+' '.join(q['trigger']['metric'] for q in c['maturity']['transitions']))); n['criteria_naming_cost']+=any(X.search(k['text']) for k in d['work_item_criteria'] if k['work_item']==x['item']); n['reports_handing_to_component_10']+=bool(H.search(r.split('## 5.')[1].split('## 6.')[0])); n['data_plane_only']+=(c['planes']==['data_plane']); n['items_naming_a_budget']+=bool(re.search(r'\bbudget\b',t,re.I)); n['items_naming_a_price']+=bool(re.search(r'\b(price|usd|dollar)\b',t,re.I))
      print(' '.join('%s=%d' % kv for kv in n.items()))"
    expected: >-
      One line: nine heads and items; 1 failure_signal or trigger naming a cost or egress term (#1399); 2 items
      with a criterion naming one (#1390 c3, #1399 c1-c2); 7 reports whose section 5 hands to this component;
      8 items data-plane only; 1 item naming a budget of its own (#1396's per-run filing cap); 0 naming a price;
      exactly: heads=9 items=9 signal_or_trigger_names_cost=1 criteria_naming_cost=2
      reports_handing_to_component_10=7 data_plane_only=8 items_naming_a_budget=1 items_naming_a_price=0.
      Each head is fetched by sha, so a later push to a sibling does not change it.
    fix_if: >-
      A changed count means a sibling changed at a new head or the siblings block is mis-pinned: re-pin the head
      and re-read; a changed count changes e1, e2, s2 and the verdict. A fetch failure means a sibling branch was
      deleted after squash-merge: read the item from main.
    hermetic: false
    graduation: not-applicable
  - step: 2
    phase: pre-deploy
    action: Probe the repository's cost surface for any line that budgets the loop
    command: >-
      bin/venv-python -c "import json,pathlib,re,yaml; from scripts.cost_reconciliation import load_telemetry_cost as L; R=yaml.safe_load(open('docs/ROADMAP-PLATFORM.yaml',encoding='utf-8'))['cost_projection']; T=R['reevaluation_triggers']; C=yaml.safe_load(open('config/agent/cost_reconciliation.yaml',encoding='utf-8'))['thresholds']; X=re.compile('egress|neon|lambda|catalog|review|telemetry',re.I); F=[p for p in pathlib.Path('terraform').rglob('*.tf')]; K=list(pathlib.Path('docs/contracts').glob('*.yaml')); J=json.dumps(R);
      print('triggers=%d triggers_on_loop_lines=%d thresholds=%d thresholds_on_loop_lines=%d telemetry_cost_leg=%s contracts_est_cost_usd=%d contracts_cost_usd=%d roadmap_not_a_budget=%s neon_egress_tbd=%s tf_budget_resources=%d tf_s3_metric_or_inventory=%d tf_catalog_stats_lines=%d reconciliation_cron=%s hook_events=%s' % (len(T),sum(bool(X.search(t)) for t in T),len(C),sum(bool(re.search('egress|neon|lambda|catalog|review',k)) for k in C),L('2026-09'),sum('est_cost_usd' in p.read_text(encoding='utf-8') for p in K),sum('cost_usd' in p.read_text(encoding='utf-8') for p in K),'Not a budget' in R['notes'],bool(re.search(r'\"neon_catalog_egress\": \"TBD',J)),sum(len(re.findall('aws_budgets_budget|aws_ce_anomaly',p.read_text(encoding='utf-8'))) for p in F),sum(len(re.findall('aws_s3_bucket_metric|aws_s3_bucket_inventory|storage_lens',p.read_text(encoding='utf-8'))) for p in F),sum(1 for p in F for l in p.read_text(encoding='utf-8').splitlines() if 'catalog_stats' in l and not l.strip().startswith('#')),re.findall(r'cron: \"([^\"]+)\"',open('.github/workflows/cost-reconciliation.yml',encoding='utf-8').read()),sorted(json.load(open('.claude/settings.json',encoding='utf-8'))['hooks'])))"
    expected: >-
      One line: five triggers and six thresholds, none naming a loop line; the telemetry cost leg None; no
      contract naming est_cost_usd and two naming cost_usd; the roadmap block "Not a budget" with its Neon
      egress line TBD; no Terraform budget resource, no S3 bucket metrics configuration, inventory or Storage
      Lens, and no catalog_stats schedule line; a monthly cron; two hook events, neither Stop nor SessionEnd.
    fix_if: >-
      A trigger or threshold above 0 means a loop line was budgeted elsewhere: read it and update e3, e4, s3, k2
      and the verdict. A telemetry leg other than None means T2.36's cost column landed: update e5, O1 and O4.
      A catalog_stats line above 0 means the Decision 88 clause 2 path was scheduled: update e6, O3 and q1.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Red-before evidence for the build; true only until a loop line is budgeted or measured, so a standing guard
      would pin the gap the design asks to close.
    expected_literals: ["triggers=5 triggers_on_loop_lines=0 thresholds=6 thresholds_on_loop_lines=0 telemetry_cost_leg=None contracts_est_cost_usd=0 contracts_cost_usd=2 roadmap_not_a_budget=True neon_egress_tbd=True tf_budget_resources=0 tf_s3_metric_or_inventory=0 tf_catalog_stats_lines=0 reconciliation_cron=['0 6 4 * *'] hook_events=['PreToolUse', 'SessionStart']"]
  - step: 3
    phase: pre-deploy
    action: Run the cost model from the report's block on DuckDB at three scales under both egress models
    command: |
      bin/venv-python -c "import re,duckdb,yaml; F=chr(96)*3; T=open('docs/plans/reports/REPORT-w1-cost-egress.md',encoding='utf-8').read(); Y={k:v for b in re.findall(F+'yaml\n(.*?)'+F,T,re.S) for k,v in yaml.safe_load(b).items()}; M=Y['cost_model']; P=M['params']; E=M['envelopes_month']; X=M['prices_external']
      def run(scales,merges,models):
        q=M['sql']
        for k,v in dict(P,scales=str(scales),merges=str(merges),models='['+','.join(models)+']').items(): q=q.replace('{'+k+'}',str(v))
        r=duckdb.connect().execute(q); cols=[d[0] for d in r.description]; return [dict(zip(cols,row)) for row in r.fetchall()]
      S=P['scales_sessions_per_day']; W=[P['merge_windows_per_day']]*len(S)
      for r in run(S,W,[\"'touched'\"]*len(S))+run(S,W,[\"'whole_catalog'\"]*len(S))+run([20],[1],[\"'touched'\"]):
        usd=r['lambda_gb_seconds']*X['lambda_per_gb_second_usd']+(r['writer_requests']+r['reader_requests'])/1e6*X['lambda_per_million_requests_usd']+r['s3_puts']/1000*X['s3_put_per_thousand_usd']+r['s3_gets']/1000*X['s3_get_per_thousand_usd']+r['s3_storage_bytes']/2**30*X['s3_storage_per_gb_month_usd']
        print('s=%d m=%d %s egress=%d share=%.3f files=%d over=%d usd_ex_egress=%.2f' % (r['sessions'],r['merge_windows'],r['egress_model'],r['catalog_egress_bytes'],r['detector_share'],r['files_today'],sum(r[k]>E[k] for k in E),usd))"
    expected: >-
      Seven lines, one per scenario of report section 2.3: sessions a day, merge windows a day, egress model,
      catalog egress bytes a month, the detectors' share of it, files live at a read today, the number of seed
      envelopes exceeded, and the list-price monthly cost of the Lambda and S3 lines excluding egress.
    fix_if: >-
      A changed line means a parameter, the SQL or the envelope seeds in the report block changed: the table in
      section 2.3, e8-e10, s2's model claims and the verdict must follow. A DuckDB error means the block's
      placeholders and the params disagree.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Design evidence over a parameterised model; the build measures each line from its named source (criterion c2)
      and the first measured month replaces every seed.
    expected_literals: ["s=5 m=4 touched egress=1576200000 share=0.834 files=116 over=3 usd_ex_egress=0.90", "s=20 m=4 touched egress=5779200000 share=0.352 files=416 over=5 usd_ex_egress=3.54", "s=100 m=4 touched egress=96595200000 share=0.061 files=2016 over=7 usd_ex_egress=23.33", "s=5 m=4 whole_catalog egress=27621000000 share=0.516 files=116 over=3 usd_ex_egress=0.90", "s=20 m=4 whole_catalog egress=71136000000 share=0.211 files=416 over=5 usd_ex_egress=3.54", "s=100 m=4 whole_catalog egress=371616000000 share=0.051 files=2016 over=7 usd_ex_egress=23.33", "s=20 m=1 touched egress=18544800000 share=0.222 files=1604 over=5 usd_ex_egress=4.61"]
  - step: 4
    phase: pre-deploy
    action: Assemble the verdict SQL from the report, run every vector on DuckDB, then every mutant and the equivalent one
    command: |
      bin/venv-python -c "import re,datetime as D,duckdb,yaml; F=chr(96)*3; T=open('docs/plans/reports/REPORT-w1-cost-egress.md',encoding='utf-8').read(); Y={k:v for b in re.findall(F+'yaml\n(.*?)'+F,T,re.S) for k,v in yaml.safe_load(b).items()}; V,Q=Y['vectors'],Y['verdict']; t0=D.date.fromisoformat(V['defaults']['today'])
      def A(q,P,t):
        for k,v in dict(Q['params'],**P,today=\"DATE '%s'\" % t,budget='budget',ledger='ledger',attribution='attribution').items(): q=q.replace('{'+k+'}',str(v))
        return q
      def G(v,q):
        t=D.date.fromisoformat(v['params']['today']) if 'today' in v.get('params',{}) else t0; N=lambda o: None if o is None else t+D.timedelta(o)
        c=duckdb.connect(); c.execute('CREATE TABLE budget (line VARCHAR, unit VARCHAR, owner VARCHAR, cadence VARCHAR, measure VARCHAR, envelope DOUBLE, warn_share DOUBLE)'); c.execute('CREATE TABLE ledger (line VARCHAR, day DATE, value DOUBLE)'); c.execute('CREATE TABLE attribution (line VARCHAR, day DATE, component VARCHAR, value DOUBLE)')
        [c.execute('INSERT INTO budget VALUES (?,?,?,?,?,?,?)',[r[k] for k in ('line','unit','owner','cadence','measure','envelope','warn_share')]) for r in (dict(V['defaults']['budget_row'],**x) for x in v.get('budget',[]))]
        [c.execute('INSERT INTO ledger VALUES (?,?,?)',[s['line'],N(o),s['value']]) for s in v.get('ledger',[]) for o in (range(s['from'],s['to']+1) if s.get('from') is not None else [None])]
        [c.execute('INSERT INTO attribution VALUES (?,?,?,?)',[a['line'],N(a['day']),a['component'],a['value']]) for a in v.get('attribution',[])]
        try: rows=c.execute(A(q,{k:x for k,x in v.get('params',{}).items() if k!='today'},t)).fetchall(); g={r[0]:r[1] for r in rows}; f={r[0]:[r[2],r[3]] for r in rows}
        except Exception as ex: return v['expected']=='error' and v['raises'] in str(ex)
        return v['expected']!='error' and len(rows)==len(g) and g==v['expected'] and ('flags' not in v or f==v['flags'])
      P=[G(v,Q['sql']) for v in V['cases']]; print('vectors=%d pass=%d/%d raises=%d failed=%s' % (len(P),sum(P),len(P),sum(v['expected']=='error' for v in V['cases']),[v['id'] for v,p in zip(V['cases'],P) if not p]))
      M=Y['mutants']; K=[any(not G(v,Q['sql'].replace(m['old'],m['new'])) for v in V['cases']) for m in M]
      print('mutants=%d unique_site=%d killed=%d survivors=%s equivalent=%d equivalent_pass_all=%d' % (len(M),sum(Q['sql'].count(m['old'])==1 for m in M),sum(K),[m['id'] for m,k in zip(M,K) if not k],len(Y['equivalent']),sum(Q['sql'].count(m['old'])==1 and all(G(v,Q['sql'].replace(m['old'],m['new'])) for v in V['cases']) for m in Y['equivalent'])))"
    expected: >-
      Two lines: 146 vectors, 146 of 146 passing (37 by raising with their stated message: e01-e21, n05, n08,
      n10, g01-g11, r01, r08), each returning one row per line (label, dark_flag, unattributed_flag) under its
      own params override if it carries one, with the flags compared where the vector pins them, and an empty
      failed list; then 276 mutants (52 named, 224 from the rule sweep of report section 2.6), each replacing
      exactly one site of the SQL, all 276 killed, no survivors, and the 32 equivalent mutants each replacing
      one site and passing every vector. A refusal with another message, or a repeated line row, counts as a
      failure. Takes 15-20 minutes on 4 cores.
    fix_if: >-
      A failing vector means the SQL and the verdict rules in report section 2.4 disagree: fix the one that
      encodes the wrong intent and say which in the report. A survivor means a vector is missing: add one that
      kills it and list it in section 2.6. An equivalent mutant that fails a vector is not equivalent: move it
      to the mutants block.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Design evidence for the staged verdict; the production SQL carries its own vector test (criterion c1).
    expected_literals: ["vectors=146 pass=146/146 raises=37 failed=[]", "mutants=276 unique_site=276 killed=276 survivors=[] equivalent=32 equivalent_pass_all=32"]
  - step: 5
    phase: pre-deploy
    action: Prove the fixture carries this component's one item and the pilot evaluator passes
    command: >-
      bin/venv-python -c "import yaml; from scripts.checks.roadmap.validate_work_item_pilot import validate_work_item_pilot as v;
      d=yaml.safe_load(open('docs/work-item-pilot/telemetry-feedback-loop.yaml',encoding='utf-8'));
      n=sum(i['id']=='pwi-loop-cost-egress-budget' for i in d['work_items']); f=[]; v(f); h=open('docs/work-item-pilot/telemetry-feedback-loop.yaml',encoding='utf-8').read().split('fixture:')[0].splitlines();
      print('component_items=' + str(n) + ' evaluator_failed=' + str(f) + ' header_lines=' + str(len(h)) + ' header_kept=' + str(len(h)==3 and h[0].startswith('# CD.45 pilot fixture (provisional_v0). NOT A ROADMAP')))"
    expected: >-
      Six PASS leg lines, then one line reporting one component item, an empty failure list and the fixture's
      three-line CD.45 header kept above fixture: (validate_work_item_pilot ignores comments, so this step pins it).
    fix_if: >-
      A failing leg names the row; fix it in the fixture using the canonical layout (render(parsed)). A textual
      merge conflict with another W1 PR (all append to the same item lists) is resolved by merging main,
      re-rendering with render(parsed) and re-running this step.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      validate_work_item_pilot is already a registered check run by both tiers; a per-plan row duplicates it.
    expected_literals: ["component_items=1 evaluator_failed=[] header_lines=3 header_kept=True"]
  - step: 6
    phase: pre-deploy
    action: Validate this plan against the PlanDocument schema
    command: bin/venv-python -m scripts.roadmap.plan_document docs/plans/PLAN-w1-cost-egress.yaml
    expected: The validator reports the plan valid and exits 0.
    fix_if: Fix the reported field (unknown key, missing graduation companion, backtick literal in expected).
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      validate_plan_documents already schema-checks every docs/plans/PLAN-*.yaml in both tiers; a per-plan row
      duplicates it.
  - step: 7
    phase: pre-deploy
    action: Confirm the change is exactly the plan, report and fixture files
    command: git fetch --quiet origin main && git diff --name-only origin/main...HEAD
    expected: >-
      Exactly three paths: docs/plans/PLAN-w1-cost-egress.yaml, docs/plans/reports/REPORT-w1-cost-egress.md and
      docs/work-item-pilot/telemetry-feedback-loop.yaml.
    fix_if: Any other path means scope leaked; revert it.
    hermetic: false
    graduation: not-applicable
  - step: 8
    phase: pre-deploy
    action: Run the fast presubmit tier over the branch
    command: bin/venv-python -m scripts.validate --pre
    expected: Exits 0; PR CI's --pre run is the authoritative gate (Decision 73).
    fix_if: Address the reported issue in the plan, report or fixture.
    hermetic: false
    graduation: not-applicable
constraints:
  - >-
    No tier-item or criterion status flip, no closes_criteria entry, no ratification (charter never-list). The
    fixture's three criteria are pilot rows with status open, never roadmap criteria.
  - >-
    No recommendation filed, updated, closed or read for content (Decision 67); rec-4031 is named only as the
    price table Decision 199 names, rec-2113 only as the restore drill Decision 88 clause 4 names. Observations
    O1-O5 are named for their owners in the report, not filed.
  - >-
    No spend, no IAM, no Terraform, no config, contract, code, workflow or evaluator edit: the register block,
    the ledger and attribution tables, the verdict SQL, any schedule, any CloudWatch read and any price table
    are build-time changes for their owners, and every envelope here is a seed that gates nothing.
    docs/DECISIONS.md and its archive untouched; the candidate text in report section 6 is staged for W3, not
    filed; the roadmap's stale Neon line (O2) is named, not edited.
  - >-
    k1-k9 weigh credible alternatives with no admissible precedent: parked as asked, never decided by this
    thread or the Step 6b stand-in. k4 (b) would need a Neon API credential in the data plane and is named as
    always-ask if ever proposed; it is not proposed. k8 (b) and (c) for either S3 line (S3 request metrics,
    access logs, Inventory or Storage Lens, and a LIST over the prefix, priced per request) need a Terraform
    change, a billed metric or spend: named always-ask, not chosen, not staged; the staged sources count what
    the loop's own code and catalog already know, and Lambda metrics are read with GetMetricStatistics inside
    the CloudWatch API free tier. The staged k8 (a) and k5 (a) change writer and reader Lambda code, which
    ships through the governed code-deploy channel: a governed deploy is always-ask, so that build step is
    named as such (plan-critique r1 N1); nothing here deploys. None decides spend: the model's list prices are external, unverified and never stored as measured
    dollars (Decision 101).
  - >-
    CD.45 binds while pending: one fixture only, sized by item count (this component spends 1 of 12), edges id-only
    into ROADMAP-PLATFORM, never read by /orient, preflight or a pick surface (Decision 108).
  - >-
    The register, ledger and verdict (report section 2) are not to be built by a delegate before k1-k3 are
    answered by the operator and q1 (a measured catalog_stats reading) exists to replace the seed envelopes.
  - No new INTENT or standing prose doc (Decision 86).
context:
  - >-
    Dispatch: coordinator brief 2026-10-03 (W1 slice 10, the cost and egress budget), with components 1-9 open
    at #1384, #1390, #1394-#1400, cited as unmerged evidence, not precedent. The brief applies the SUBAGENT
    CONTEXT header of docs/contracts/overseer-dispatch.yaml#subagent_detection, so gates are GATE_REQUESTed,
    never run inline; the PR waits for the operator. Step 0: ci_rca_open returned 0 rows at the start of the
    thread and again before the r3 fold. Zero-context verification r1 (6a1d3f85), r2 (2e7c94b0) and r3
