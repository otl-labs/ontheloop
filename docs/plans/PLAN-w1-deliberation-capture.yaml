  - >-
    CD.45 binds while pending: one fixture only, sized by item count (this component spends 1 of 12), edges
    id-only into ROADMAP-PLATFORM, never read by /orient, preflight or a pick surface (Decision 108).
  - >-
    The verb and monitor (report section 2) are not to be built by a delegate before the telemetry writer
    verb (rec-4024 slice 2a-2) applies the 2a-1 row-rule kernel to every write (src/telemetry/rules.py, merged
    in #1405, which projects all four reasoning-field rules: accepted set, conditional requiredness,
    reasoning_tokens <= tokens_output, none implies zero or NULL; Decision 210 cl.1), the Class A contracts declare
    the derived fields with derivation.timing read and a derived_by verb that returns each (report section 2:
