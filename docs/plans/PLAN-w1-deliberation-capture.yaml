schema_version: 5
slug: "w1-deliberation-capture"
intent: >-
  Stage, for the operator, the design of telemetry-feedback-loop W1 component 4 (deliberation capture)
  without building anything: re-verify the operator-chosen producer facts (reasoning_visibility and
  reasoning_tokens on model_call rows, rec-4028 and the 2a-1 plan) against the live producer, the
  contracts, LiteLLM 1.102.1 and the providers' primary docs; stage the read side the choice left open
  (which metrics derive at read, and a visibility-versus-text drift rule as the failure signal), proven
  as one SQL statement over hand-written vectors; split the design into settled, contested and open rows;
  and author the component's one CD.45 pilot item in the Decision 197 clause-3 grain. Nothing is
  implemented, filed, closed or flipped.
plan_type: REPORT-ONLY
verification_tier: V1
plan_path: docs/plans/PLAN-w1-deliberation-capture.yaml
phase: >-
  CD.45 pilot (telemetry-feedback-loop design stream, W1), component 4 of the seed list. Touches T3.20
  (part_of edge) and T2.36 (depends_on edge) by id only; closes no criterion of either and forms no
  executor-substrate verdict.
scope:
  - file: docs/plans/PLAN-w1-deliberation-capture.yaml
    action: Create
    purpose: >-
      The planning artefact: executable evidence for the staging (VP), the fork record (context) and the gating
      constraints.
  - file: docs/plans/reports/REPORT-w1-deliberation-capture.md
    action: Create
    purpose: >-
      The REPORT-ONLY deliverable (Decision 86 cl.2; file-router.yaml report-deliverables route): verdict,
      evidence table, primary-doc facts with their fetch date, local measurements, the read-side design with
      its verified SQL and vectors, the settled/contested/risk/open split, the register as authored, and
      boundary notes for W2 synthesis.
  - file: docs/work-item-pilot/telemetry-feedback-loop.yaml
    action: Modify
    purpose: >-
      Add the one pilot item pwi-deliberation-capture (kind task), its three open criteria and two id-only
      edges (part_of T3.20, depends_on T2.36), in the canonical layout
      validate_work_item_pilot enforces.
bundled_recommendations: []
followon_recs: []
infrastructure_dependencies: []
acceptance_criteria:
  - >-
    The merged parser_version 2 producer's deliberation facts are shown on a synthetic transcript: each
    model_call carries reasoning_visibility by block shape (omitted, summarized, redacted, none) and the reported
    count as reasoning_tokens, metadata no longer holds thinking_tokens, only a non-empty thinking block becomes
    a thinking row, a redacted_thinking block is a diagnostic only, and provider is unset (VP step 1).
  - >-
    The contract carries reasoning_visibility and reasoning_tokens and the write-time row-rule kernel projects
    all four of their rules, claude_code is at parser_version 2, thinking is an accepted transcript purpose,
    tier 1 still names the retired DeepSeek ids, and the repo does not opt into thinking summaries (VP step 2).
  - >-
    Against a mocked transport, LiteLLM 1.102.1 surfaces reasoning_content and reasoning_tokens, echoes
    returned reasoning back, injects a single-space placeholder only when thinking is passed explicitly,
    and marks deepseek-chat non-reasoning (VP step 3).
  - >-
    The SQL block and the vectors block in report section 2, read from the report itself, pass every vector
    on DuckDB (VP step 4).
  - >-
    The pilot fixture carries exactly one item for this component and validate_work_item_pilot passes all six
    legs (VP step 5).
  - The plan validates against the PlanDocument schema (VP step 6).
  - >-
    The branch diff against origin/main is exactly the plan, the report and the fixture, with no code,
    roadmap, contract, settings, rec or DECISIONS edit (VP step 7).
verification_plan:
  - step: 1
    phase: pre-deploy
    action: Show which deliberation facts the merged parser_version 2 producer stores, on a synthetic transcript built from the committed corpus helpers
    command: >-
      bin/venv-python -c "import json; from collections import Counter; from src.turn_capture.observations import build_observations as B; from src.turn_capture.transcripts import build_transcripts as T, Sidecars as S; from src.turn_capture.record_turn import PARSER_VERSION as V; from tests.fixtures.turn_capture_corpus import prompt as P, assistant as A, thinking_block as K, text_block as X, parse_records as PR, make_ctx as C, mem_tree as M, make_files as F;
      u=lambda n: {'input_tokens':10,'output_tokens':90,'output_tokens_details':{'thinking_tokens':n}};
      R=[P('u1',1,'p1','go'),A('a1',2,'m1',[K(''),X('one')],usage=u(52)),A('a2',3,'m2',[K('a summary'),X('two')],usage=u(40)),A('a3',4,'m3',[{'type':'redacted_thinking','data':'enc'},X('three')],usage=u(31)),A('a4',5,'m4',[X('four')]),P('u2',6,'p2','next')];
      d=Counter(); o=B(PR(R),C(),d,S(M(F(R)),None)); t=T(PR(R),C(),S(M(F(R)),None),d); mc=[r for r in o if r['observation_type']=='model_call'];
      print('parser_version=%d visibility=%s reasoning_tokens=%s metadata_thinking=%s provider=%s thinking_rows=%s diag=%s' % (V,[r.get('reasoning_visibility') for r in mc],[r.get('reasoning_tokens') for r in mc],[json.loads(r.get('metadata') or '{}').get('thinking_tokens') for r in mc],sorted({str(r.get('provider')) for r in mc}),[(r['observation_ref'],r['origin'],r['content_bytes']) for r in t if r['purpose']=='thinking'],dict(d)))"
    expected: >-
      One line: parser_version 2; visibility omitted (empty signed block), summarized (text), redacted
      (redacted_thinking) and none (no reasoning); reasoning_tokens 52, 40, 31 and NULL; no thinking_tokens left
      in metadata; provider unset; one thinking row (m2, origin agent, 9 bytes) for the summarized block only; one
      unknown_block_type:redacted_thinking diagnostic.
    fix_if: >-
      A different visibility or token value means the claude_code mapping moved after 2a-1 (#1405): re-read
      observations.py and update e2, s1 and the vectors' claude_code rows. A thinking row for the empty block
      means k1 was decided or the transcript builder changed: update k1 and e3.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Characterises the producer at one parser_version for this design; the producer's own golden corpus and
      parser-version registry (config/telemetry/parser_versions.yaml) are the standing guard.
    expected_literals: ["parser_version=2 visibility=['omitted', 'summarized', 'redacted', 'none'] reasoning_tokens=[52, 40, 31, None] metadata_thinking=[None, None, None, None] provider=['None'] thinking_rows=[('m2', 'agent', 9)] diag={'unknown_block_type:redacted_thinking': 1}"]
  - step: 2
    phase: pre-deploy
    action: Re-derive the contract, row-rule kernel, settings and registry facts the report rests on
    command: >-
      bin/venv-python -c "import json,yaml; from tests.fixtures.turn_capture_ducklake import load_specs; L=lambda p: yaml.safe_load(open('docs/contracts/'+p,encoding='utf-8')); o=L('telemetry_observations.yaml')['fields']; t=L('telemetry_transcripts.yaml')['fields']; i=L('inference-provider.yaml'); s=json.load(open('.claude/settings.json',encoding='utf-8')); v=yaml.safe_load(open('config/telemetry/parser_versions.yaml',encoding='utf-8')); r=load_specs()['telemetry_observations'].rules;
      print('token_columns=%s reasoning_fields=%s kernel_accepted=%s kernel_required_when=%s kernel_at_most=%s kernel_null_or_zero_when=%s claude_code_parser_version=%s metadata_names_thinking=%s thinking_purpose=%s tier_1=%s show_thinking_summaries=%s' % (sorted(k for k in o if k.startswith('tokens_')), sorted(k for k in o if 'reason' in k or 'think' in k), sorted(r.accepted_values['reasoning_visibility']), {k: sorted(x) for k, x in sorted(r.required_when['reasoning_visibility'].items())}, r.at_most['reasoning_tokens'], {k: sorted(x) for k, x in r.null_or_zero_when['reasoning_tokens'].items()}, v['producers']['claude_code']['current'], 'thinking' in o['metadata']['semantics'], 'thinking' in t['purpose']['dq_intent']['accepted_values']['values'], i['model_id_formats']['litellm_tier_models']['tier_1']['models'], s.get('showThinkingSummaries')))"
    expected: >-
      One line: the four token columns plus reasoning_tokens and reasoning_visibility; the row-rule kernel holds
      the five accepted values, required on model_call points, reasoning_tokens at most tokens_output and NULL or
      zero when none; claude_code at parser_version 2; the metadata semantics do not name thinking; thinking is
      an accepted purpose; tier 1 lists deepseek-chat and deepseek-reasoner; no thinking-summaries setting.
    fix_if: >-
      A changed kernel rule or accepted set means the 2a-1 contract moved: update the writer-side paragraph, k4
      and the build gate. A changed tier 1 means T4.2 refreshed the ids: drop R4. A thinking-summaries setting
      means k1 was decided: update k1 and the vectors' expectations.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      True only until T4.2 refreshes tier 1 or k1 is decided; the kernel's own tests (tests/telemetry/test_rules.py)
      guard the rules, and a standing guard here would block each sanctioned change.
    expected_literals: ["token_columns=['tokens_cache_creation', 'tokens_cache_read', 'tokens_input', 'tokens_output'] reasoning_fields=['reasoning_tokens', 'reasoning_visibility'] kernel_accepted=['full', 'none', 'omitted', 'redacted', 'summarized'] kernel_required_when={'event_kind': ['point'], 'observation_type': ['model_call']} kernel_at_most=tokens_output kernel_null_or_zero_when={'reasoning_visibility': ['none']} claude_code_parser_version=2 metadata_names_thinking=False thinking_purpose=True tier_1=['deepseek/deepseek-chat', 'deepseek/deepseek-reasoner'] show_thinking_summaries=None"]
  - step: 3
    phase: pre-deploy
    action: Show how LiteLLM 1.102.1 surfaces and re-sends DeepSeek reasoning, against a mocked transport that refuses any other host
    command: >-
      LITELLM_LOCAL_MODEL_COST_MAP=True bin/venv-python -c "import sys,json,httpx,litellm; from importlib.metadata import version as V; from litellm.utils import supports_reasoning as SR; from litellm.llms.custom_httpx.http_handler import HTTPHandler; B=[];
      h=lambda r: (r.url.host=='mock.invalid' or sys.exit('refused non-mock host '+r.url.host), B.append(json.loads(r.content)), httpx.Response(200,json={'id':'x','object':'chat.completion','created':1,'model':'deepseek-flash','choices':[{'index':0,'finish_reason':'tool_calls','message':{'role':'assistant','content':'','reasoning_content':'list files first','tool_calls':[{'id':'c1','type':'function','function':{'name':'ls','arguments':'{}'}}]}}],'usage':{'prompt_tokens':16,'completion_tokens':40,'total_tokens':56,'completion_tokens_details':{'reasoning_tokens':31}}}))[2];
      K=dict(client=HTTPHandler(client=httpx.Client(transport=httpx.MockTransport(h))),api_key='k',api_base='http://mock.invalid',tools=[{'type':'function','function':{'name':'ls','parameters':{'type':'object','properties':{}}}}]); C=lambda m,**x: litellm.completion(model='deepseek/deepseek-flash',messages=m,**K,**x);
      r=C([{'role':'user','content':'hi'}]); m=r.choices[0].message; H=lambda a: [{'role':'user','content':'hi'},a,{'role':'tool','tool_call_id':'c1','content':'a.py'}]; S=lambda: B[-1]['messages'][1].get('reasoning_content');
      C(H(m.model_dump())); s1=S(); a={'role':'assistant','content':'','tool_calls':m.model_dump()['tool_calls']}; C(H(a),thinking={'type':'enabled'}); s2=S(); C(H(a)); s3=S();
      print('litellm=%s reasoning_content=%r reasoning_tokens=%d echo_returned=%r echo_stripped_explicit=%r echo_stripped_default=%r supports_reasoning_deepseek_chat=%s deepseek_flash=%s' % (V('litellm'),m.reasoning_content,r.usage.completion_tokens_details.reasoning_tokens,s1,s2,s3,SR(model='deepseek-chat',custom_llm_provider='deepseek'),SR(model='deepseek-flash',custom_llm_provider='deepseek')))" 2>/dev/null
    expected: >-
      One line: LiteLLM 1.102.1; the response's reasoning_content and 31 reasoning tokens surface; the returned
      message echoes its reasoning; a stripped history gets a single space with explicit thinking and nothing
      under DeepSeek's default; deepseek-chat reads non-reasoning, deepseek-flash reasoning.
    fix_if: >-
      An exit naming a refused non-mock host means LiteLLM tried to reach a real endpoint: stop, the probe is no longer
      hermetic. A different version line means the pin moved: re-run and update section 1, R3 and R4. Changed
      echo values mean LiteLLM changed its pass-back fill: update R3 for T4.2.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Characterises a third-party library at one pinned version for T4.2 and rec-4028; the LiteLLM producer's own
      tests (rec-4028's acceptance node) are the standing guard.
    expected_literals: ["litellm=1.102.1 reasoning_content='list files first' reasoning_tokens=31 echo_returned='list files first' echo_stripped_explicit=' ' echo_stripped_default=None supports_reasoning_deepseek_chat=False deepseek_flash=True"]
  - step: 4
    phase: pre-deploy
    action: Run the report's SQL over every vector in the report on DuckDB
    command: >-
      bin/venv-python -c "import re,duckdb,yaml; F=chr(96)*3; T=open('docs/plans/reports/REPORT-w1-deliberation-capture.md',encoding='utf-8').read(); S=re.findall(F+'sql\n(.*?)'+F,T,re.S); V=[yaml.safe_load(b) for b in re.findall(F+'yaml\n(.*?)'+F,T,re.S) if 'vectors:' in b][0]['vectors']; c=duckdb.connect(); q=S[0].replace('{calls}','calls').replace('{thinking}','thinking');
      L=lambda v: [c.execute('CREATE OR REPLACE TABLE calls (observation_id VARCHAR, producer VARCHAR, parser_version INTEGER, model VARCHAR, tokens_output BIGINT, reasoning_tokens BIGINT, reasoning_visibility VARCHAR)'), c.execute('CREATE OR REPLACE TABLE thinking (observation_id VARCHAR, purpose VARCHAR)')]+[c.execute('INSERT INTO calls VALUES (?,?,?,?,?,?,?)',r) for r in v['calls']]+[c.execute('INSERT INTO thinking VALUES (?,?)',r) for r in v['thinking']];
      P=[(L(v), sorted(tuple(map(str,x)) for x in c.execute(q).fetchall())==sorted(tuple(map(str,e)) for e in v['expected']))[1] for v in V]; print('sql_blocks=%d vectors=%d pass=%d/%d' % (len(S),len(V),sum(P),len(V)))"
    expected: One line reporting one SQL block and 16 vectors, 16 of 16 passing.
    fix_if: >-
      A lower pass count means the sketch diverges from the rule stated in report section 2: fix the sketch or
      the vector that encodes the wrong intent, and say which in the report.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Design evidence for settled row s3; the production verb and monitor carry their own vector tests
      (criteria c1 and c2), which are the standing guard.
    expected_literals: ["sql_blocks=1 vectors=16 pass=16/16"]
  - step: 5
    phase: pre-deploy
    action: Prove the fixture carries this component's one item and the pilot evaluator passes
    command: >-
      bin/venv-python -c "import yaml; from scripts.checks.roadmap.validate_work_item_pilot import validate_work_item_pilot as v;
      d=yaml.safe_load(open('docs/work-item-pilot/telemetry-feedback-loop.yaml',encoding='utf-8'));
      n=sum(i['id']=='pwi-deliberation-capture' for i in d['work_items']); f=[]; v(f); print('component_items=' + str(n) + ' evaluator_failed=' + str(f))"
    expected: Six PASS leg lines, then one line reporting one component item and an empty failure list.
    fix_if: >-
      A failing leg names the row; fix it in the fixture using the canonical layout (render(parsed)). A count
      other than 1 means a concurrent W1 thread touched this item; reconcile before merging. A textual merge
      conflict with another W1 PR (all append to the same item lists) is resolved by merging main,
      re-rendering with render(parsed) and re-running this step.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      validate_work_item_pilot is already a registered check run by both tiers; a per-plan row duplicates it.
    expected_literals: ["component_items=1 evaluator_failed=[]"]
  - step: 6
    phase: pre-deploy
    action: Validate this plan against the PlanDocument schema
    command: bin/venv-python -m scripts.roadmap.plan_document docs/plans/PLAN-w1-deliberation-capture.yaml
    expected: The validator reports the plan valid and exits 0.
    fix_if: Fix the reported field (unknown key, missing graduation companion, backtick literal in expected).
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      validate_plan_documents already schema-checks every docs/plans/PLAN-*.yaml in both tiers; a per-plan row
      duplicates it.
  - step: 7
    phase: pre-deploy
    action: Confirm the change is exactly the plan, report and fixture files
    command: git fetch --quiet origin main && git diff --name-only origin/main...HEAD
    expected: >-
      Exactly three paths: docs/plans/PLAN-w1-deliberation-capture.yaml,
      docs/plans/reports/REPORT-w1-deliberation-capture.md and docs/work-item-pilot/telemetry-feedback-loop.yaml.
    fix_if: Any other path means scope leaked; revert it.
    hermetic: false
    graduation: not-applicable
  - step: 8
    phase: pre-deploy
    action: Run the fast presubmit tier over the branch
    command: bin/venv-python -m scripts.validate --pre
    expected: Exits 0; PR CI's --pre run is the authoritative gate (Decision 73).
    fix_if: Address the reported issue in the plan, report or fixture.
    hermetic: false
    graduation: not-applicable
constraints:
