schema_version: 5
slug: "w1-friction-classifier"
intent: >-
  Stage, for the operator, the design of telemetry-feedback-loop W1 component 3 (the friction classifier)
  without building anything: prove with executable evidence what friction facts the producer stores today
  (one process_event per hook attachment, passes included, tool errors only as tool_call outcomes, no gate or
  pre-commit signature), that read-time classification is one SQL statement over those facts passing a set
  of hand-written vectors on which the ratified formula disagrees, and which of the five retired
  transcript-review patterns stored facts can carry; split the design into settled, contested and open
  rows; and author the component's one CD.45 pilot item in the Decision 197 clause-3 grain. Nothing is
  implemented, filed, closed or flipped.
plan_type: REPORT-ONLY
verification_tier: V1
plan_path: docs/plans/PLAN-w1-friction-classifier.yaml
phase: >-
  CD.45 pilot (telemetry-feedback-loop design stream, W1), component 3 of the seed list. Touches T3.20
  (part_of edge) and T2.36 (depends_on edge) by id only; closes no criterion of either.
scope:
  - file: docs/plans/PLAN-w1-friction-classifier.yaml
    action: Create
    purpose: >-
      The planning artefact: executable evidence for the staging (VP), the fork record (context) and the gating
      constraints.
  - file: docs/plans/reports/REPORT-w1-friction-classifier.md
    action: Create
    purpose: >-
      The REPORT-ONLY deliverable (Decision 86 cl.2; file-router.yaml report-deliverables route): verdict,
      evidence table, local measurements, the rules-as-data design with its verified SQL and vectors, the
      mapping of the five retired patterns, the settled/contested/risk/open split, the register as authored,
      and boundary notes for W2 synthesis.
  - file: docs/work-item-pilot/telemetry-feedback-loop.yaml
    action: Modify
    purpose: >-
      Add the one pilot item pwi-friction-classifier (kind task), its three open criteria and two id-only
      edges (part_of T3.20, depends_on T2.36), in the canonical layout validate_work_item_pilot enforces.
bundled_recommendations: []
followon_recs: []
infrastructure_dependencies: []
acceptance_criteria:
  - >-
    The producer's friction facts are shown on a synthetic transcript: a hook pass and a hook block share
    one process_event name and differ only in severity; tool errors and blocks appear only as tool_call close
    outcomes; no gate or pre-commit signature and no attempt value is emitted (VP step 1).
  - >-
    The SQL sketch and the two YAML blocks in report section 2 (rules, vectors), read from the report
    itself, pass every vector on DuckDB comparing ref, label and class, with zero wildcard signatures, and
    the literal contract formula disagrees with the intended label count on 11 of the 17 vectors (VP step 2).
  - >-
    The five pattern ids of the retired transcript-review prompt are reproduced from git history, and the
    prompt is absent at HEAD (VP step 3).
  - >-
    The observation row shape carries no content column, the scope guard is a registered PreToolUse hook,
    and exactly one registered hook falls back to a hookName signature (VP step 4).
  - >-
    The ratified rework_total and exception_total derivations read only name and observation_type, and the
    rec-4032 labels contract file does not exist (VP step 5).
  - >-
    The pilot fixture carries exactly one item for this component and validate_work_item_pilot passes all six
    legs (VP step 6).
  - The plan validates against the PlanDocument schema (VP step 7).
  - >-
    The branch diff against origin/main is exactly the plan, the report and the fixture, with no code,
    roadmap, contract, rec or DECISIONS edit (VP step 8).
verification_plan:
  - step: 1
    phase: pre-deploy
    action: Show which friction facts the producer stores, on a synthetic transcript built from the committed corpus helpers
    command: >-
      bin/venv-python -c "from collections import Counter; from src.turn_capture.observations import build_observations as B; from tests.fixtures.turn_capture_corpus import prompt as P, assistant as A, tool_use_block as U, tool_result as R, hook as H, parse_records as PR, make_ctx as C;
      g='python .claude/hooks/never_on_main.py'; E=dict(pid='p1',is_error=True);
      rows=B(PR([P('u1',1,'p1','go'),A('a1',2,'m1',[U('t1','Edit',{})]),H('h1',2.1,'PreToolUse:Edit',tool_use_id='t1',command=g),R('r1',3,'t1','ok',pid='p1'),
      A('a2',4,'m2',[U('t2','Edit',{})]),H('h2',4.1,'PreToolUse:Edit',tool_use_id='t2',command=g,exit_code=2,a_type='hook_blocking_error'),R('r2',5,'t2','blocked',**E),
      A('a3',6,'m3',[U('t3','Bash',{'command':'bin/venv-python -m scripts.validate --pre'})]),R('r3',7,'t3','FAIL validate_scope_boundary',**E),A('a4',8,'m4',[U('t4','Bash',{})]),R('r4',9,'t4','ok',pid='p1')]),C(),Counter());
      pe=[(r['name'],r['severity']) for r in rows if r['observation_type']=='process_event']; tc=[(r['name'],r['outcome']) for r in rows if r['observation_type']=='tool_call' and r['event_kind']=='close'];
      print('process_events=%s tool_closes=%s gate_or_precommit_names=%d attempt_populated=%d' % (pe,tc,sum(str(r.get('name')).startswith(('gate:','precommit:')) for r in rows),sum('attempt' in r for r in rows)))"
    expected: >-
      One line: the two never_on_main process_events at severity info and error under the same name; tool
      closes Edit success, Edit blocked, Bash error (the gate failure), Bash success; zero gate or pre-commit
      names; zero attempt values.
    fix_if: >-
      A gate: or precommit: name, or a tool-error process_event, means rec-4026 slice 3b changed the producer:
      re-read observations.py and update e3-e5, k2 and k3. A hook pass with no process_event means the
      producer now skips passes: R1 shrinks to the formula half; update k2.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Red-before evidence for a future change, true only until slice 3b or a k2 resolution lands; a standing
      guard would block the sanctioned producer change.
    expected_literals: ["process_events=[('hook:never_on_main', 'info'), ('hook:never_on_main', 'error')] tool_closes=[('Edit', 'success'), ('Edit', 'blocked'), ('Bash', 'error'), ('Bash', 'success')] gate_or_precommit_names=0 attempt_populated=0"]
  - step: 2
    phase: pre-deploy
    action: Run the report's rules SQL over every vector in the report on DuckDB, and count where the literal contract formula disagrees
    command: >-
      bin/venv-python -c "import re,duckdb,yaml; F=chr(96)*3; T=open('docs/plans/reports/REPORT-w1-friction-classifier.md',encoding='utf-8').read(); S=re.findall(F+'sql\n(.*?)'+F,T,re.S); Y=[yaml.safe_load(b) for b in re.findall(F+'yaml\n(.*?)'+F,T,re.S)]; R,V=Y[0],Y[1]['vectors']; C={r['label']:r['class'] for r in R['rules']}; C[R['run_rule']['label']]=R['run_rule']['class']; c=duckdb.connect(); K=('rule_id','observation_type','signature','disposition','label','class');
      c.execute('CREATE TABLE rules (rule_id VARCHAR, observation_type VARCHAR, signature VARCHAR, disposition VARCHAR, label VARCHAR, class VARCHAR)'); c.executemany('INSERT INTO rules VALUES (?,?,?,?,?,?)',[[r[k] for k in K] for r in R['rules']]);
      q=S[0].replace('{obs}','obs').replace('{rules}','rules').replace('{repeat_threshold}',str(R['repeat_threshold'])).replace('{run_label}',R['run_rule']['label']).replace('{run_class}',R['run_rule']['class']); G={r['signature'] for r in R['rules'] if r['signature']};
      L=lambda v: [c.execute('CREATE OR REPLACE TABLE obs (observation_id VARCHAR, observation_type VARCHAR, event_kind VARCHAR, name VARCHAR, severity VARCHAR, outcome VARCHAR, parent_observation_id VARCHAR, event_timestamp BIGINT, source_ordinal BIGINT)')]+[c.execute('INSERT INTO obs VALUES (?,?,?,?,?,?,?,?,?)',r+[r[7]]) for r in v['rows']];
      P=[(L(v), sorted(tuple(x) for x in c.execute(q).fetchall())==sorted((e[0],e[1],C[e[1]]) for e in v['expected']))[1] for v in V]; M=[sum(r[1]=='process_event' and r[3] in G for r in v['rows'])!=len(v['expected']) for v in V];
      print('sql_blocks=%d rules=%d specific=%d wildcard_signatures=%d vectors=%d pass=%d/%d literal_formula_mismatch=%d/%d' % (len(S),len(R['rules']),len(G),sum(any(ch in s for ch in '*%?[') for s in G),len(V),sum(P),len(V),sum(M),len(V)))"
    expected: >-
      One line: one SQL block, 9 rules of which 4 are specific, zero wildcard signatures, 17 vectors, 17 of 17
      passing on ref, label and class (the run label's class from the rules block's run_rule), and the
      literal formula disagreeing on 11 of 17.
    fix_if: >-
      A lower pass count means the sketch diverges from the rules stated in report section 2: fix the sketch
      or the vector that encodes the wrong intent, and say which in the report. A changed mismatch count means
      a vector was added or changed: re-run and update section 1 and k2.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Design evidence for settled row s2; the production verb carries its own DuckLake vector test (criterion
      c1), which is the standing guard.
    expected_literals: ["sql_blocks=1 rules=9 specific=4 wildcard_signatures=0 vectors=17 pass=17/17 literal_formula_mismatch=11/17"]
  - step: 3
    phase: pre-deploy
    action: Reproduce the retired transcript-review prompt's five pattern ids from git history
    command: >-
      git fetch --quiet --depth=2 origin 7b67e21d70f733f7137875195a16e71f59822a9c &&
      git show 7b67e21d70f733f7137875195a16e71f59822a9c^:.github/prompts/scheduled/transcript-review.prompt.md | grep -o '"repeated-tool-failure".*"missing-gotcha"' &&
      test ! -e .github/prompts/scheduled/transcript-review.prompt.md && echo retired_at_head=True
    expected: >-
      Two lines: the quoted pattern enumeration repeated-tool-failure, scope-creep, context-confusion,
      workaround, missing-gotcha, then retired_at_head=True.
    fix_if: >-
      A fetch refusal is an environment defect (network or proxy), not a pass; retry once. A different
      enumeration means the wrong commit: re-locate the deletion with git log --diff-filter=D on that path.
    hermetic: false
    graduation: not-applicable
  - step: 4
    phase: pre-deploy
    action: Show the observation row shape holds no content, the scope guard is a registered hook, and which registered hook has no script signature
    command: >-
      bin/venv-python -c "import json; from src.turn_capture.observations import OBSERVATION_COLUMNS as O, hook_name as N; d=json.load(open('.claude/settings.json',encoding='utf-8'));
      H=[(e,h['command']) for e,a in d['hooks'].items() for m in a for h in m['hooks']]; S=[N({'command':c,'hookName':e+':Bash'}) for e,c in H];
      print('content_columns=%s registered_hooks=%d edit_scope_guard_pretooluse=%s hookname_fallbacks=%s' % ([c for c in O if c.split('_')[0] in ('content','input','tool','path','file','text','command')], len(H), any(e=='PreToolUse' and s=='hook:edit_scope_guard' for (e,_),s in zip(H,S)), [s for (e,_),s in zip(H,S) if s=='hook:'+e+'.Bash']))"
    expected: >-
      One line: no content column, 13 registered hooks, the scope guard registered as a PreToolUse hook, and
      one hookName fallback, hook:PreToolUse.Bash (the quoted handoff_evidence_gate.sh command).
    fix_if: >-
      A content column means the observation shape changed: re-read e9 and k3. A different hook count or
      fallback list means .claude/settings.json or hook_name changed: update e10 and R3 (an empty fallback
      list means the quoting defect was fixed).
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      True only until R3 is fixed or hooks change; a standing guard would block the sanctioned fix.
    expected_literals: ["content_columns=[] registered_hooks=13 edit_scope_guard_pretooluse=True hookname_fallbacks=['hook:PreToolUse.Bash']"]
  - step: 5
    phase: pre-deploy
    action: Re-derive the ratified friction derivations and the missing rec-4032 contract
    command: >-
      bin/venv-python -c "import os,yaml; f=yaml.safe_load(open('docs/contracts/telemetry_sessions.yaml',encoding='utf-8'))['fields'];
      print(' '.join('%s_inputs=%s' % (k,','.join(f[k]['derivation']['inputs'])) for k in ('rework_total','exception_total')), 'derived_by=%s' % f['rework_total']['derivation']['derived_by'], 'rec4032_contract_exists=%s' % os.path.exists('docs/contracts/telemetry_friction_labels.yaml'))"
    expected: >-
      One line: both derivations take telemetry_observations.name and observation_type only, derived by
      session_friction_rollup, and the rec-4032 contract file is absent.
    fix_if: >-
      Changed inputs mean the contract was amended: re-read telemetry_sessions.yaml and update e1, k2 (an
      amendment along option (a) settles k2). A present labels contract means rec-4032 progressed: re-read it
      and update k1.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      True only until k1 or k2 is decided; a standing guard would block the amendment the report recommends.
    expected_literals: ["rework_total_inputs=telemetry_observations.name,telemetry_observations.observation_type exception_total_inputs=telemetry_observations.name,telemetry_observations.observation_type derived_by=reader_verb:session_friction_rollup rec4032_contract_exists=False"]
  - step: 6
    phase: pre-deploy
    action: Prove the fixture carries this component's one item and the pilot evaluator passes
    command: >-
      bin/venv-python -c "import yaml; from scripts.checks.roadmap.validate_work_item_pilot import validate_work_item_pilot as v;
      d=yaml.safe_load(open('docs/work-item-pilot/telemetry-feedback-loop.yaml',encoding='utf-8'));
      n=sum(i['id']=='pwi-friction-classifier' for i in d['work_items']); f=[]; v(f); print('component_items=' + str(n) + ' evaluator_failed=' + str(f))"
    expected: Six PASS leg lines, then one line reporting one component item and an empty failure list.
    fix_if: >-
      A failing leg names the row; fix it in the fixture using the canonical layout (render(parsed)). A count
      other than 1 means a concurrent W1 thread touched this item; reconcile before merging. A textual merge
      conflict with another W1 PR (all append to the same item lists) is resolved by merging main,
      re-rendering with render(parsed) and re-running this step.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      validate_work_item_pilot is already a registered check run by both tiers; a per-plan row duplicates it.
    expected_literals: ["component_items=1 evaluator_failed=[]"]
  - step: 7
    phase: pre-deploy
    action: Validate this plan against the PlanDocument schema
    command: bin/venv-python -m scripts.roadmap.plan_document docs/plans/PLAN-w1-friction-classifier.yaml
    expected: The validator reports the plan valid and exits 0.
    fix_if: Fix the reported field (unknown key, missing graduation companion, backtick literal in expected).
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      validate_plan_documents already schema-checks every docs/plans/PLAN-*.yaml in both tiers; a per-plan row
      duplicates it.
  - step: 8
    phase: pre-deploy
    action: Confirm the change is exactly the plan, report and fixture files
    command: git fetch --quiet origin main && git diff --name-only origin/main...HEAD
    expected: >-
      Exactly three paths: docs/plans/PLAN-w1-friction-classifier.yaml,
      docs/plans/reports/REPORT-w1-friction-classifier.md and docs/work-item-pilot/telemetry-feedback-loop.yaml.
    fix_if: Any other path means scope leaked; revert it.
    hermetic: false
    graduation: not-applicable
  - step: 9
    phase: pre-deploy
    action: Run the fast presubmit tier over the branch
    command: bin/venv-python -m scripts.validate --pre
    expected: Exits 0; PR CI's --pre run is the authoritative gate (Decision 73).
    fix_if: Address the reported issue in the plan, report or fixture.
    hermetic: false
    graduation: not-applicable
constraints:
  - >-
    No tier-item or criterion status flip, no closes_criteria entry, no ratification (charter never-list). The
    fixture's three criteria are pilot rows with status open, never roadmap criteria.
  - >-
    No recommendation filed, updated or closed (Decision 67). rec-4024, rec-4025, rec-4026, rec-4032 and
    rec-4141 are named as owners only; R3 and R4 are named for rec-4026's slice 3b, not filed.
  - >-
    No contract edit: the telemetry_sessions friction derivations (k1 pointer, k2 formula) are a ratified
    Class A semantic change parked for the operator; docs/DECISIONS.md and its archive untouched.
  - >-
    No producer change: k3's signatures, R3's quote stripping and R4's denial prefixes are rec-4026 slice 3b
    rules with a PARSER_VERSION bump, owned there.
  - >-
    No LLM classification run, sized or designed beyond naming rec-4032's trigger: it spends (charter
    never-list).
  - >-
    CD.45 binds while pending: one fixture only, sized by item count (this component spends 1 of 12), edges
    id-only into ROADMAP-PLATFORM, never read by /orient, preflight or a pick surface (Decision 108).
  - >-
    The rules and verb (report section 2) are not to be built by a delegate before the reader-verb mechanism
    (W1-2's item, rec-4024) exists, k1 and k2 are decided, and the c3 label review has a named reviewer (q2).
  - No new INTENT or standing prose doc (Decision 86).
