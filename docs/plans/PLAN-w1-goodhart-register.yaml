schema_version: 5
slug: "w1-goodhart-register"
intent: >-
  Stage, for the operator, the design of telemetry-feedback-loop W1 component 9 (the Goodhart register: for
  every loop detector, how would we know its failure_signal improved without the work improving) without
  building or writing anything: prove with executable evidence that every W1 failure_signal is
  lower-is-better and promotes its own item, that few of them carry a companion or a seeded known-positive,
  and that for each a stated cheap path lowers the signal as far as a real improvement while a register
  counter separates the two; stage a deterministic daily verdict over the register, the signal series and a
  drill log; split the design into settled, contested and open rows; and author the component's one CD.45
  pilot item in the Decision 197 clause-3 grain. Nothing is implemented, filed, updated, closed or flipped.
plan_type: REPORT-ONLY
verification_tier: V1
plan_path: docs/plans/PLAN-w1-goodhart-register.yaml
phase: >-
  CD.45 pilot (telemetry-feedback-loop design stream, W1), component 9 of the seed list (Goodhart register).
  Touches T2.36 (depends_on edge) by id only; closes no criterion.
scope:
  - file: docs/plans/PLAN-w1-goodhart-register.yaml
    action: Create
    purpose: >-
      The planning artefact: executable evidence for the staging (VP), the fork record (context) and the gating
      constraints.
  - file: docs/plans/reports/REPORT-w1-goodhart-register.md
    action: Create
    purpose: >-
      The REPORT-ONLY deliverable (Decision 86 cl.2; file-router.yaml report-deliverables route): verdict,
      evidence table, the failure_signal inventory at pinned sibling heads, the register rows, the cheap-path
      scenarios, the verdict SQL with vectors and mutants, the settled/contested/risk/open split, the
      register as authored, boundary notes for W2 and staged candidate decision text for W3.
  - file: docs/work-item-pilot/telemetry-feedback-loop.yaml
    action: Modify
    purpose: >-
      Add the one pilot item pwi-goodhart-register (kind task), its three open criteria and one id-only edge
      (depends_on T2.36), in the canonical layout validate_work_item_pilot enforces.
bundled_recommendations: []
followon_recs: []
infrastructure_dependencies: []
acceptance_criteria:
  - >-
    Read at their pinned heads, the eight sibling W1 items carry eight failure_signals; the report's register
    has one row per item whose metric equals that item's failure_signal.metric verbatim; 4 of 8 name a
    companion read beside them, 1 of 8 a seeded known-positive; 7 of 8 top-rung triggers name the item's own
    metric and 0 of 8 name a recall or a drill (VP step 1).
  - >-
    No file under src/ or scripts/ other than the pilot model and its evaluator names failure_signal or
    goodhart, and the six telemetry contracts carry no synthetic or drill marker (VP step 2).
  - >-
    In each of the eight cheap-path scenarios built from the report's blocks, the cheap path lowers the primary
    at least as far as a real halving of failures (within 0.001), the row's counter falls under its floor on
    the cheap path and holds on the real improvement; two declared companions are computable and one of them
    moves (VP step 3).
  - >-
    The verdict SQL assembled from the report passes all 159 vectors on DuckDB with one row per detector, 49
    by raising with the stated message; each of 246 mutants (named plus a rule sweep) replaces exactly one
    site and fails at least one vector; and on both sides of every boundary grid it reads 520 recall pairs
    and 9,800 exact-eps moves correctly (VP step 4).
  - >-
    The pilot fixture carries exactly one item for this component, keeps its three-line CD.45 header, and
    validate_work_item_pilot passes all six legs (VP step 5).
  - The plan validates against the PlanDocument schema (VP step 6).
  - >-
    The branch diff against origin/main is exactly the plan, the report and the fixture, with no code, roadmap,
    contract, config, rec or DECISIONS edit (VP step 7).
verification_plan:
  - step: 1
    phase: pre-deploy
    action: Read the eight sibling failure_signals at their pinned heads and check the register against them
    command: >-
      bin/venv-python -c "import re,subprocess as S,yaml; F=chr(96)*3; T=open('docs/plans/reports/REPORT-w1-goodhart-register.md',encoding='utf-8').read(); Y={k:v for b in re.findall(F+'yaml\n(.*?)'+F,T,re.S) for k,v in yaml.safe_load(b).items()};
      G=lambda h: (S.run(['git','fetch','--quiet','--depth','1','origin',h],check=True), yaml.safe_load(S.run(['git','show',h+':docs/work-item-pilot/telemetry-feedback-loop.yaml'],check=True,capture_output=True,text=True).stdout))[1];
      C={x['item']:w['extension']['consideration_register'] for x in Y['siblings'] for w in G(x['head'])['work_items'] if w['id']==x['item']}; R={r['detector']:r for r in Y['register']}; J=lambda c: ' '.join(c['failure_signal'].values()); N=lambda c: re.match('[a-z_]+',c['failure_signal']['metric']).group(); P=lambda c: c['maturity']['transitions'][2]['trigger']['metric'];
      print('heads=%d items=%d register_rows=%d metric_fidelity=%d/%d companions_beside=%d seeded_positive=%d top_trigger_reads_own_metric=%d top_trigger_checks_recall=%d' % (len(Y['siblings']),len(C),len(R),sum(R.get(i,{}).get('metric')==c['failure_signal']['metric'] for i,c in C.items()),len(C),sum('beside' in J(c) for c in C.values()),sum(bool(re.search('seed|canary|drill|inject',J(c))) for c in C.values()),sum(N(c) in P(c) for c in C.values()),sum(bool(re.search('recall|drill',P(c))) for c in C.values())))"
    expected: >-
      One line: eight heads and items, eight register rows, metric fidelity 8/8, four companions read beside,
      one seeded known-positive, seven top-rung triggers naming their own metric and none naming a recall or a
      drill, exactly: heads=8 items=8 register_rows=8 metric_fidelity=8/8 companions_beside=4 seeded_positive=1
      top_trigger_reads_own_metric=7 top_trigger_checks_recall=0. Each head is fetched by sha, so a later push to
      a sibling does not change it.
    fix_if: >-
      A fidelity shortfall means a sibling changed its metric at a new head or the row was mis-copied: re-pin the
      head in the siblings block and re-copy the metric. A changed count changes e2, e3, s3 and the verdict.
      A fetch failure means a sibling branch was deleted after squash-merge: read the item from main.
    hermetic: false
    graduation: not-applicable
  - step: 2
    phase: pre-deploy
    action: Probe for any runtime reader of failure_signal or a register, and for a drill marker in the telemetry contracts
    command: >-
      bin/venv-python -c "import pathlib,re; P=[p for d in ('src','scripts') for p in pathlib.Path(d).rglob('*.py') if p.name not in ('_work_item_pilot_model.py','validate_work_item_pilot.py')]; R=lambda w: sum(w in p.read_text(encoding='utf-8',errors='replace').lower() for p in P); K=sorted(pathlib.Path('docs/contracts').glob('telemetry*.yaml'));
      print('failure_signal_readers=%d goodhart_readers=%d telemetry_contracts=%d drill_markers=%d' % (R('failure_signal'),R('goodhart'),len(K),sum(len(re.findall(r'(?im)^\\s+\\w*(?:synthetic|drill|seed)\\w*:\\s*$',p.read_text(encoding='utf-8'))) for p in K)))"
    expected: One line, no runtime reader of either name, six telemetry contracts, and no contract field whose name marks a synthetic, seeded or drill row (field keys only; a prose mention, such as the synthetic interrupt in an output_capture value's semantics, is not a marker).
    fix_if: >-
      A reader above 0 means a ladder, register or signal consumer landed: read it and update e5, s1 and the
      boundary notes. A marker above 0 means a contract gained a drill or synthetic field: update k2, R3 and O3.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Red-before evidence for the build; true only until a reader or a drill marker lands, so a standing guard
      would pin the gap the design asks to close.
    expected_literals: ["failure_signal_readers=0 goodhart_readers=0 telemetry_contracts=6 drill_markers=0"]
  - step: 3
    phase: pre-deploy
    action: Run every cheap-path scenario three ways (baseline, cheap path, real improvement) on DuckDB
    command: |
      bin/venv-python -c "import re,duckdb,yaml; F=chr(96)*3; T=open('docs/plans/reports/REPORT-w1-goodhart-register.md',encoding='utf-8').read(); Y={k:v for b in re.findall(F+'yaml\n(.*?)'+F,T,re.S) for k,v in yaml.safe_load(b).items()}; S,R=Y['scenarios'],{r['detector']:r for r in Y['register']}; P=S['params'];
      def E(s,c,b):
        d=duckdb.connect(); d.execute('CREATE TABLE u AS '+s['world'].replace('{cheap}',str(c)).replace('{better}',str(b))); q=lambda x: d.execute(x).fetchone()[0]; return q(s['primary']),q(s['counter']),q(s['declared']['series']) if s['declared'] else None
      X=[]
      for s in S['cases']:
        f=R[s['detector']]['counter_floor']; b,g,r=E(s,0,0),E(s,1,0),E(s,0,1); w=s['declared'] and {'higher':1,'lower':-1}[s['declared']['worse_if']]
        X.append((b[1]>=f, g[0]<b[0], g[0]<=r[0]+P['as_good_as_real_tolerance'], g[1]<f, r[0]<b[0], r[1]>=f, bool(s['declared']), bool(w) and w*(g[2]-b[2])>P['declared_tolerance']))
      print('scenarios=%d registered=%d baseline_counter_ok=%d cheap_primary_improves=%d cheap_as_good_as_real=%d cheap_counter_flags=%d real_primary_improves=%d real_counter_holds=%d declared_series=%d declared_flags=%d' % (len(X),sum(s['detector'] in R for s in S['cases']),*(sum(x[i] for x in X) for i in range(8))))"
    expected: >-
      One line: eight scenarios, all registered; every baseline counter at or above its floor; the cheap path
      lowering the primary in 8, by at least as much as the real improvement in 8, and pushing the counter under
      its floor in 8; the real improvement lowering the primary in 8 with the counter held in 8; two computable
      declared companions, one moving.
    fix_if: >-
      A counter that does not fall on the cheap path, or falls on the real improvement, means the counter does
      not separate the two worlds: change the counter (section 2.2) and its world, never the floor. A changed
      declared count changes s3 and the verdict.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Design evidence over constructed worlds; the build replays each cheap path on the real metric (criterion c2).
    expected_literals: ["scenarios=8 registered=8 baseline_counter_ok=8 cheap_primary_improves=8 cheap_as_good_as_real=8 cheap_counter_flags=8 real_primary_improves=8 real_counter_holds=8 declared_series=2 declared_flags=1"]
  - step: 4
    phase: pre-deploy
    action: Assemble the verdict SQL from the report, run every vector on DuckDB, then every mutant, then the boundary grids
    command: |
      bin/venv-python -c "import re,datetime as D,duckdb,yaml; F=chr(96)*3; T=open('docs/plans/reports/REPORT-w1-goodhart-register.md',encoding='utf-8').read(); Y={k:v for b in re.findall(F+'yaml\n(.*?)'+F,T,re.S) for k,v in yaml.safe_load(b).items()}; V,Q=Y['vectors'],Y['verdict']; t=D.date.fromisoformat(V['defaults']['today']); N=lambda o: None if o is None else t+D.timedelta(o)
      A=lambda q,P={}: [q:=q.replace('{'+k+'}',str(v)) for k,v in dict(Q['params'],**P,today=\"DATE '%s'\" % t,register='register',signal='signal',drills='drills').items()][-1]
      def G(v,q):
        c=duckdb.connect(); c.execute('CREATE TABLE register (detector VARCHAR, threshold DOUBLE, counter_floor DOUBLE, drill_min INTEGER, drill_recall_min DOUBLE, upstream VARCHAR[])'); c.execute('CREATE TABLE signal (detector VARCHAR, day DATE, primary_value DOUBLE, counter_value DOUBLE)'); c.execute('CREATE TABLE drills (detector VARCHAR, day DATE, injected INTEGER, detected INTEGER)')
        [c.execute('INSERT INTO register VALUES (?,?,?,?,?,?)',[r[k] for k in ('detector','threshold','counter_floor','drill_min','drill_recall_min','upstream')]) for r in (dict(V['defaults']['register_row'],**x) for x in v['register'])]
        [c.execute('INSERT INTO signal VALUES (?,?,?,?)',[s['detector'],N(o),s['primary'],s['counter']]) for s in v['signal'] for o in (range(s['from'],s['to']+1) if s['from'] is not None else [None])]
        [c.execute('INSERT INTO drills VALUES (?,?,?,?)',[d['detector'],N(d['day']),d['injected'],d['detected']]) for d in v['drills']]
        try: rows=c.execute(A(q,v.get('params',{}))).fetchall(); g=dict(rows)
        except Exception as ex: return v['expected']=='error' and v['raises'] in str(ex)
        return v['expected']!='error' and len(rows)==len(g) and g==v['expected']
      P=[G(v,Q['sql']) for v in V['cases']]; print('vectors=%d pass=%d/%d raises=%d failed=%s' % (len(P),sum(P),len(P),sum(v['expected']=='error' for v in V['cases']),[v['id'] for v,p in zip(V['cases'],P) if not p]))
      M=Y['mutants']; K=[any(not G(v,Q['sql'].replace(m['old'],m['new'])) for v in V['cases']) for m in M]
      print('mutants=%d unique_site=%d killed=%d survivors=%s equivalent=%d' % (len(M),sum(Q['sql'].count(m['old'])==1 for m in M),sum(K),[m['id'] for m,k in zip(M,K) if not k],len(Y['equivalent'])))
      c=duckdb.connect(); E=c.execute; L=\"CAST(split_part(substr(detector,2),'_',1) AS INTEGER)\"; R=\"CAST(split_part(detector,'_',2) AS INTEGER)\"; H=\"(upper(detector[1])=detector[1])::INTEGER\"
      E(\"CREATE TABLE register AS SELECT x||k||'_'||n AS detector,1.0::DOUBLE AS threshold,0.0::DOUBLE AS counter_floor,1 AS drill_min,k/100 AS drill_recall_min,[]::VARCHAR[] AS upstream FROM range(1,101) a(k),range(1,101) b(n),(VALUES ('r'),('R')) v(x) WHERE k*n%100=0 UNION ALL SELECT x||p||'_'||q,1.0,0.0,1,0.5,[]::VARCHAR[] FROM range(2,100) a(p),range(2,100) b(q),(VALUES ('e'),('E')) v(x) UNION ALL SELECT x||p||'_45',1.0,0.0,1,0.5,[]::VARCHAR[] FROM range(2,100) a(p),(VALUES ('p'),('P')) v(x) UNION ALL SELECT x||'45_'||q,1.0,0.0,1,0.5,[]::VARCHAR[] FROM range(2,100) a(q),(VALUES ('c'),('C')) v(x)\")
      E(\"CREATE TABLE drills AS SELECT detector,DATE '%s'-1 AS day,CASE WHEN lower(detector[1])='r' THEN %s ELSE 1 END AS injected,CASE WHEN lower(detector[1])='r' THEN CAST(%s*%s/100 AS INTEGER)-%s ELSE 1 END AS detected FROM register\" % (t,R,L,R,H))
      E(\"CREATE TABLE signal AS SELECT detector,DATE '%s'+d::INTEGER AS day,CASE WHEN lower(detector[1])='r' THEN 0.5 WHEN lower(detector[1])='c' THEN (45-5*(d>-14)::INTEGER)/100 ELSE (%s-(d>-14)::INTEGER)/100-1e-8*(d>-14)::INTEGER*%s END AS primary_value,CASE WHEN lower(detector[1])='r' THEN 0.5 WHEN lower(detector[1])='p' THEN (45-5*(d>-14)::INTEGER)/100 ELSE (%s-(d>-14)::INTEGER)/100-1e-8*(d>-14)::INTEGER*%s END AS counter_value FROM register,range(-27,1) w(d)\" % (t,L,H,R,H))
      g=E(A(Q['sql'])).fetchall(); B=lambda p: [x for d,x in g if d[0]==p]
      print('grid recall_boundary=%d blind=%d near_blind=%d eps_both=%d diverging=%d near=%d eps_primary_only=%d diverging=%d near=%d eps_counter_only=%d diverging=%d near=%d' % (len(B('r')),B('r').count('blind'),B('R').count('blind'),len(B('e')),B('e').count('diverging'),B('E').count('diverging'),len(B('p')),B('p').count('diverging'),B('P').count('diverging'),len(B('c')),B('c').count('diverging'),B('C').count('diverging')))"
    expected: >-
      Three lines: 159 vectors, 159 of 159 passing (49, e01-e49, by raising with their stated message), each
      returning one row per detector under its own params override if it carries one, and an empty failed
      list; then 246 mutants (34 named, the rest the rule sweep of report section 2.6), each replacing exactly
      one site of the SQL, all 246 killed, no survivors, and the three equivalent mutants listed apart; then the boundary grids of report section 2.4, each with a
      far side and a near side: 520 exact recall boundaries with none read blind and, one detected fewer,
      all 520 read blind; exact-eps falls on both series (9,604), on the primary alone (98) and on the counter
      alone (98) with none read diverging and, 1e-8 further, all read diverging. A refusal with another
      message, or a repeated detector row, counts as a failure. Takes 15-25 minutes on 4 cores.
    fix_if: >-
      A failing vector means the SQL and the verdict table in report section 2.4 disagree: fix the one that
      encodes the wrong intent and say which in the report. A survivor means a vector is missing: add one that
      kills it and list it in section 2.6.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Design evidence for the staged verdict; the production SQL carries its own vector test (criterion c1).
    expected_literals: ["vectors=159 pass=159/159 raises=49 failed=[]", "mutants=246 unique_site=246 killed=246 survivors=[] equivalent=3", "grid recall_boundary=520 blind=0 near_blind=520 eps_both=9604 diverging=0 near=9604 eps_primary_only=98 diverging=0 near=98 eps_counter_only=98 diverging=0 near=98"]
  - step: 5
    phase: pre-deploy
    action: Prove the fixture carries this component's one item and the pilot evaluator passes
    command: >-
      bin/venv-python -c "import yaml; from scripts.checks.roadmap.validate_work_item_pilot import validate_work_item_pilot as v;
      d=yaml.safe_load(open('docs/work-item-pilot/telemetry-feedback-loop.yaml',encoding='utf-8'));
      n=sum(i['id']=='pwi-goodhart-register' for i in d['work_items']); f=[]; v(f); h=open('docs/work-item-pilot/telemetry-feedback-loop.yaml',encoding='utf-8').read().split('fixture:')[0].splitlines();
      print('component_items=' + str(n) + ' evaluator_failed=' + str(f) + ' header_lines=' + str(len(h)) + ' header_kept=' + str(len(h)==3 and h[0].startswith('# CD.45 pilot fixture (provisional_v0). NOT A ROADMAP')))"
    expected: >-
      Six PASS leg lines, then one line reporting one component item, an empty failure list and the fixture's
      three-line CD.45 header kept above fixture: (validate_work_item_pilot ignores comments, so this step pins it).
    fix_if: >-
      A failing leg names the row; fix it in the fixture using the canonical layout (render(parsed)). A textual
      merge conflict with another W1 PR (all append to the same item lists) is resolved by merging main,
      re-rendering with render(parsed) and re-running this step.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      validate_work_item_pilot is already a registered check run by both tiers; a per-plan row duplicates it.
    expected_literals: ["component_items=1 evaluator_failed=[] header_lines=3 header_kept=True"]
  - step: 6
    phase: pre-deploy
    action: Validate this plan against the PlanDocument schema
    command: bin/venv-python -m scripts.roadmap.plan_document docs/plans/PLAN-w1-goodhart-register.yaml
    expected: The validator reports the plan valid and exits 0.
    fix_if: Fix the reported field (unknown key, missing graduation companion, backtick literal in expected).
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      validate_plan_documents already schema-checks every docs/plans/PLAN-*.yaml in both tiers; a per-plan row
      duplicates it.
  - step: 7
    phase: pre-deploy
    action: Confirm the change is exactly the plan, report and fixture files
    command: git fetch --quiet origin main && git diff --name-only origin/main...HEAD
    expected: >-
      Exactly three paths: docs/plans/PLAN-w1-goodhart-register.yaml,
      docs/plans/reports/REPORT-w1-goodhart-register.md and docs/work-item-pilot/telemetry-feedback-loop.yaml.
    fix_if: Any other path means scope leaked; revert it.
    hermetic: false
    graduation: not-applicable
  - step: 8
    phase: pre-deploy
    action: Run the fast presubmit tier over the branch
    command: bin/venv-python -m scripts.validate --pre
    expected: Exits 0; PR CI's --pre run is the authoritative gate (Decision 73).
    fix_if: Address the reported issue in the plan, report or fixture.
    hermetic: false
    graduation: not-applicable
constraints:
  - >-
    No tier-item or criterion status flip, no closes_criteria entry, no ratification (charter never-list). The
    fixture's three criteria are pilot rows with status open, never roadmap criteria.
  - >-
    No recommendation filed, updated, closed or read for content (Decision 67); rec-4025 is named only because
    the #1390 report names it as the shadow-harness candidate. Observations O1-O3 are named for their owners in
    the report, not filed.
  - >-
    No contract, config, code, evaluator, IAM or Terraform edit: the register table, the verdict SQL, drills, any
    drill marker and any FailureSignal field are build-time changes for their owners. docs/DECISIONS.md and its
    archive untouched; the candidate text in report section 6 is staged for W3, not filed.
  - >-
    k1-k6 weigh credible alternatives with no admissible precedent: parked as asked, never decided by this
    thread or the Step 6b stand-in. None touches IAM, security or a governed deploy, and none decides spend: k2 (a)
    and the reviewer drill carry recurring cost owned by the cost/egress component (report R4). Nothing here spends.
  - >-
    CD.45 binds while pending: one fixture only, sized by item count (this component spends 1 of 12), edges id-only
    into ROADMAP-PLATFORM, never read by /orient, preflight or a pick surface (Decision 108).
  - >-
    The verdict and drills (report section 2) are not to be built by a delegate before k1-k3 are answered by the
    operator and the out-of-band counts of q1 have homes, nor, if the breach leg stays (k1 (v)), before #1398 q3
    (the ladder's AOQL target) is answered.
  - No new INTENT or standing prose doc (Decision 86).
