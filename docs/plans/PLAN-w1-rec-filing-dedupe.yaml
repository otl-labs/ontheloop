schema_version: 5
slug: "w1-rec-filing-dedupe"
intent: >-
  Stage, for the operator, the design of telemetry-feedback-loop W1 component 5 (rec filing with dedupe
  against open recs) without building or writing anything: prove with executable evidence that the repo's
  existing rec dedupe primitives mis-handle a telemetry filer (source-only keying merges subjects, a
  declined head re-files, a quiet detector auto-closes, templated titles read as duplicates while a
  paraphrased known issue is missed), that a ci_rca-style fingerprint chain generalised to findings decides
  every case in one SQL statement over hand-written vectors, and where the identity can live without a new
  column; split the design into settled, contested and open rows; and author the component's one CD.45
  pilot item in the Decision 197 clause-3 grain. Nothing is implemented, filed, updated, closed or flipped.
plan_type: REPORT-ONLY
verification_tier: V1
plan_path: docs/plans/PLAN-w1-rec-filing-dedupe.yaml
phase: >-
  CD.45 pilot (telemetry-feedback-loop design stream, W1), component 5 of the seed list. Touches T3.3
  (part_of edge) and T2.36 (depends_on edge) by id only; closes no criterion of either.
scope:
  - file: docs/plans/PLAN-w1-rec-filing-dedupe.yaml
    action: Create
    purpose: >-
      The planning artefact: executable evidence for the staging (VP), the fork record (context) and the gating
      constraints.
  - file: docs/plans/reports/REPORT-w1-rec-filing-dedupe.md
    action: Create
    purpose: >-
      The REPORT-ONLY deliverable (Decision 86 cl.2; file-router.yaml report-deliverables route): verdict,
      evidence table, live measurements, the filing decision with its verified SQL, params and vectors, the
      settled/contested/risk/open split, the register as authored, and boundary notes for W2 synthesis.
  - file: docs/work-item-pilot/telemetry-feedback-loop.yaml
    action: Modify
    purpose: >-
      Add the one pilot item pwi-rec-filing-dedupe (kind task), its three open criteria and two id-only edges
      (part_of T3.3, depends_on T2.36), in the canonical layout validate_work_item_pilot enforces.
bundled_recommendations: []
followon_recs: []
infrastructure_dependencies: []
acceptance_criteria:
  - >-
    The shared episode primitive's behaviour for a filer is shown on live code with injected rows: a second
    subject on one source updates the first subject's rec, a fingerprint sub_key files instead, a quiet
    detector closes the open rec, and a declined head re-files (VP step 1).
  - >-
    The SQL sketch and the two YAML blocks in report section 2 (params, vectors), read from the report
    itself, pass every vector on DuckDB across ten actions plus the collapsed listing, and DuckDB's sha256 over the salted key equals
    Python's hashlib (VP step 2).
  - >-
    The relevance evaluator reads two templated filer titles for distinct findings as duplicates (Jaccard
    0.82) and misses a paraphrased known issue (0.00) (VP step 3).
  - >-
    The open_recs read projects no source or context_v2_json, ops_recommendations has no fingerprint
    column and an unvalidated context_v2_json, ci_rca keeps its fingerprint there, no filer source is
    registered, and the non-automatable soft cap is 250 (VP step 4).
  - >-
    The pilot fixture carries exactly one item for this component and validate_work_item_pilot passes all six
    legs (VP step 5).
  - The plan validates against the PlanDocument schema (VP step 6).
  - >-
    The branch diff against origin/main is exactly the plan, the report and the fixture, with no code,
    roadmap, contract, config, rec or DECISIONS edit (VP step 7).
verification_plan:
  - step: 1
    phase: pre-deploy
    action: Run the shared episode primitive over injected rows to show how it treats a multi-subject filer source
    command: >-
      bin/venv-python -c "import json; from scripts.rec_episode import run_episode as E;
      S='telemetry-feedback'; fp=lambda r: json.loads(r['context_v2_json'] or '{}').get('fingerprint'); W=[]; P=lambda a,f: W.append(a) or 'rec-new';
      A={'id':'rec-1','source':S,'status':'open','context_v2_json':json.dumps({'fingerprint':'fpA'})}; D={'id':'rec-2','source':S,'status':'declined','context_v2_json':json.dumps({'fingerprint':'fpB'})};
      k=dict(source=S,build_fields=lambda:{},build_update=lambda e:{'x':1},build_close=lambda e:{},portal_caller=P);
      a=E(over_threshold=True,rows=[A],**k); b=E(over_threshold=True,rows=[A],sub_key=lambda r: fp(r)=='fpB',sub_key_fields=('context_v2_json',),**k); c=E(over_threshold=False,rows=[A],sub_key=lambda r: fp(r)=='fpA',sub_key_fields=('context_v2_json',),**k); d=E(over_threshold=True,rows=[D],sub_key=lambda r: fp(r)=='fpB',sub_key_fields=('context_v2_json',),**k);
      print('source_key_subject_B=%s:%s fingerprint_key_subject_B=%s under_threshold=%s:%s declined_head=%s writes=%s' % (a['action'],a['rec_id'],b['action'],c['action'],c['rec_id'],d['action'],W))"
    expected: >-
      One line: keyed on source alone, subject B updates subject A's rec-1; keyed on a fingerprint sub_key it
      files; below threshold the open rec-1 is closed; a declined head is invisible, so it files; the captured
      portal writes are update, file, close, file. No real portal call is made (portal_caller is a capture).
    fix_if: >-
      A different action means scripts/rec_episode.py changed: re-read it and update e2-e4, s1 and s3. A
      declined_head of none or update means find_recs now sees non-open heads: k2's option (a) may be met by
      the primitive; update k2.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Red-before evidence for the build: true only until a filer stops routing through rec_episode's
      source-keyed truth table; a standing guard would pin behaviour the design deliberately avoids.
    expected_literals: ["source_key_subject_B=update:rec-1 fingerprint_key_subject_B=file under_threshold=close:rec-1 declined_head=file writes=['update', 'file', 'close', 'file']"]
  - step: 2
    phase: pre-deploy
    action: Run the report's filing decision SQL over every vector in the report on DuckDB, with fingerprint parity
    command: >-
      bin/venv-python -c "import re,hashlib,functools,unittest,duckdb,yaml; F=chr(96)*3; T=open('docs/plans/reports/REPORT-w1-rec-filing-dedupe.md',encoding='utf-8').read(); S=re.findall(F+'sql\n(.*?)'+F,T,re.S); Y=[yaml.safe_load(b) for b in re.findall(F+'yaml\n(.*?)'+F,T,re.S)]; P,V=Y[0],Y[1]['vectors'];
      q=functools.reduce(lambda s,k: s.replace('{'+k+'}',str(P[k])),('salt','min_sessions','min_events','file_budget'),S[0]); H=lambda d,s: hashlib.sha256(chr(0).join((P['salt'],d,s)).encode()).hexdigest();
      D=['CREATE TABLE f (detector_id VARCHAR, detector_version INT, subject_key VARCHAR, window_start BIGINT, window_end BIGINT, sessions BIGINT, events BIGINT)','CREATE TABLE h (rec_id VARCHAR, fingerprint VARCHAR, status VARCHAR, covered_by VARCHAR, closed_at BIGINT, last_seen_end BIGINT, created BIGINT)','CREATE TABLE t (rec_id VARCHAR, status VARCHAR, closed_at BIGINT)'];
      G=lambda v,c: ([c.execute(x) for x in D],[c.execute('INSERT INTO f VALUES (?,?,?,?,?,?,?)',r) for r in v['findings']],[c.execute('INSERT INTO h VALUES (?,?,?,?,?,?,?)',[r[0],H(r[1],r[2])]+r[3:]) for r in v['heads']],[c.execute('INSERT INTO t VALUES (?,?,?)',r) for r in v['targets']],(lambda Q: E(lambda: c.execute(Q).fetchall()) if v['expected']=='error' else sorted(map(tuple,c.execute(Q).fetchall()))==sorted(map(tuple,v['expected'])))(q.replace('{findings}','f').replace('{heads}','h').replace('{targets}','t')))[-1]; E=lambda f: (unittest.TestCase().assertRaises(duckdb.Error,f),True)[1];
      R=[G(v,duckdb.connect()) for v in V]; c=duckdb.connect();
      print('sql_blocks=%d vectors=%d pass=%d/%d raises=%d actions=%d fingerprint_parity=%s' % (len(S),len(V),sum(R),len(V),sum(v['expected']=='error' for v in V),len({e[2] for v in V if v['expected']!='error' for e in v['expected']}),c.execute('SELECT sha256(? || chr(0) || ? || chr(0) || ?)',[P['salt'],'friction','tool_error:Bash']).fetchone()[0]==H('friction','tool_error:Bash')))"
    expected: >-
      One line: one SQL block, 34 vectors, 34 of 34 passing on detector_id, subject_key, action and ref (one
      of them, v33, by raising as expected), eleven distinct expected actions, and DuckDB's sha256 equal to Python's hashlib over the same salted key.
    fix_if: >-
      A lower pass count means the sketch diverges from the action table in report section 2: fix the sketch or
      the vector that encodes the wrong intent, and say which in the report. fingerprint_parity=False means the
      in-code key and the SQL key disagree (separator or encoding): fix the sketch before anything else.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Design evidence for settled row s2; the production filer carries its own vector test (criterion c1),
      which is the standing guard.
    expected_literals: ["sql_blocks=1 vectors=34 pass=34/34 raises=1 actions=11 fingerprint_parity=True"]
  - step: 3
    phase: pre-deploy
    action: Run the relevance evaluator's open-duplicate signal on templated filer titles and on a paraphrased known issue
    command: >-
      bin/venv-python -c "from scripts.rec_relevance import evaluate_rec_relevance as R, _title_jaccard as J;
      T='Telemetry friction: {} on {} above the filing threshold';
      a={'id':'rec-1','title':T.format('tool_error','Bash'),'file':None}; b={'id':'rec-2','title':T.format('tool_error','Edit'),'file':None};
      h={'id':'rec-3','title':'Strip quotes from hook command paths so handoff_evidence_gate gets its own signature','file':'src/turn_capture/observations.py'};
      f={'id':'rec-4','title':T.format('unmapped_block','PreToolUse.Bash'),'file':None};
      print('distinct_subjects=%s:%.2f known_issue=%s:%.2f' % (R(a,open_recs=[a,b])[0], J(a['title'],b['title']), R(f,open_recs=[f,h])[0], J(f['title'],h['title'])))"
    expected: >-
      One line: two filer titles for distinct findings score 0.82 and read as duplicate; the filer title for
      the quoted-hook-path finding against a title for its fix scores 0.00 and is not matched. That second
      title is constructed for the probe, not a live rec; the nearest live open rec on the same hook
      (rec-4118) scores 0.03, so the miss holds on live data too.
    fix_if: >-
      A different verdict or score means rec_relevance's open-duplicate rule changed: re-read it and update e5,
      k1 (b) and R1. A non-duplicate first verdict with a fingerprint-aware evaluator means R1's fix landed.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      True only until R1's evaluator fix lands; a standing guard would block the fix the report names.
    expected_literals: ["distinct_subjects=duplicate:0.82 known_issue=unknown:0.00"]
  - step: 4
    phase: pre-deploy
    action: Re-derive the read projection, identity home, source registry and soft cap the design depends on
    command: >-
      bin/venv-python -c "import re,yaml; from src.common.ducklake_scd2_schema import NAMED_READS as N; from scripts.preflight._common import _NON_AUTOMATABLE_SOFTCAP as C;
      cols=re.search(r'SELECT (.*?) FROM',N['open_recs'].sql,re.S).group(1).replace(' ','').split(',');
      f=yaml.safe_load(open('docs/contracts/ops_recommendations.yaml',encoding='utf-8'))['fields']; L=yaml.safe_load(open('docs/contracts/ci-rca-lifecycle.yaml',encoding='utf-8'));
      s={e['canonical_id'] for e in yaml.safe_load(open('config/agent/data_quality/source_registry.yaml',encoding='utf-8'))['entries']};
      print('open_recs_cols=%s fingerprint_column=%s context_v2_unvalidated=%s ci_rca_fingerprint_in_context_v2=%s filer_source=%s transcript_review_registered=%s softcap=%d' % (','.join(cols), 'fingerprint' in f, 'unvalidated' in f['context_v2_json']['semantics'], 'context_v2_json' in L['description'], sorted(x for x in s if 'feedback' in x or 'friction' in x), 'transcript-review' in s, C))"
    expected: >-
      One line: open_recs projects id, title, context, created_timestamp and automatable only; no fingerprint
      column; context_v2_json unvalidated; ci_rca's fingerprint rides in context_v2_json; no feedback or
      friction source registered; transcript-review registered; soft cap 250.
    fix_if: >-
      A projected source column changes R4; a fingerprint column or a validated context_v2_json changes s1 and
      k1's home; a registered filer source means the build started: re-read it; a different cap updates k3.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      True only until the build registers the filer source and its lifecycle contract; a standing guard would
      block that sanctioned change.
    expected_literals: ["open_recs_cols=id,title,context,created_timestamp,automatable fingerprint_column=False context_v2_unvalidated=True ci_rca_fingerprint_in_context_v2=True filer_source=[] transcript_review_registered=True softcap=250"]
  - step: 5
    phase: pre-deploy
    action: Prove the fixture carries this component's one item and the pilot evaluator passes
    command: >-
      bin/venv-python -c "import yaml; from scripts.checks.roadmap.validate_work_item_pilot import validate_work_item_pilot as v;
      d=yaml.safe_load(open('docs/work-item-pilot/telemetry-feedback-loop.yaml',encoding='utf-8'));
      n=sum(i['id']=='pwi-rec-filing-dedupe' for i in d['work_items']); f=[]; v(f); print('component_items=' + str(n) + ' evaluator_failed=' + str(f))"
    expected: Six PASS leg lines, then one line reporting one component item and an empty failure list.
    fix_if: >-
      A failing leg names the row; fix it in the fixture using the canonical layout (render(parsed)). A count
      other than 1 means a concurrent W1 thread touched this item; reconcile before merging. A textual merge
      conflict with another W1 PR (all append to the same item lists) is resolved by merging main,
      re-rendering with render(parsed) and re-running this step.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      validate_work_item_pilot is already a registered check run by both tiers; a per-plan row duplicates it.
    expected_literals: ["component_items=1 evaluator_failed=[]"]
  - step: 6
    phase: pre-deploy
    action: Validate this plan against the PlanDocument schema
    command: bin/venv-python -m scripts.roadmap.plan_document docs/plans/PLAN-w1-rec-filing-dedupe.yaml
    expected: The validator reports the plan valid and exits 0.
    fix_if: Fix the reported field (unknown key, missing graduation companion, backtick literal in expected).
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      validate_plan_documents already schema-checks every docs/plans/PLAN-*.yaml in both tiers; a per-plan row
      duplicates it.
  - step: 7
    phase: pre-deploy
    action: Confirm the change is exactly the plan, report and fixture files
    command: git fetch --quiet origin main && git diff --name-only origin/main...HEAD
    expected: >-
      Exactly three paths: docs/plans/PLAN-w1-rec-filing-dedupe.yaml,
      docs/plans/reports/REPORT-w1-rec-filing-dedupe.md and docs/work-item-pilot/telemetry-feedback-loop.yaml.
    fix_if: Any other path means scope leaked; revert it.
    hermetic: false
    graduation: not-applicable
  - step: 8
    phase: pre-deploy
    action: Run the fast presubmit tier over the branch
    command: bin/venv-python -m scripts.validate --pre
    expected: Exits 0; PR CI's --pre run is the authoritative gate (Decision 73).
    fix_if: Address the reported issue in the plan, report or fixture.
    hermetic: false
    graduation: not-applicable
constraints:
  - >-
    No tier-item or criterion status flip, no closes_criteria entry, no ratification (charter never-list). The
    fixture's three criteria are pilot rows with status open, never roadmap criteria.
  - >-
    No recommendation filed, updated or closed (Decision 67). Every rec operation in the report is a
    description of what a future build would do. Reads only: count_by_status, open_recs, recs_by_title_prefix,
    rec_by_id and two source-scoped current_state reads, counts reported, no rec content reproduced.
  - >-
    No contract or config edit: the filer source registration (source_registry.yaml), its priority mapping, a
    filer lifecycle contract (the k1 covered_by key), the generalised write-time backstop
    (ops_data_portal.py) and R1's fingerprint-aware duplicate rule are build-time changes for their owners.
    docs/DECISIONS.md and its archive untouched.
  - >-
    No LLM dedupe judge run, sized or designed beyond naming rec-2591's shape: it spends (charter never-list)
    and breaks Decision 55's dedup-in-code rule.
  - >-
    CD.45 binds while pending: one fixture only, sized by item count (this component spends 1 of 12), edges
    id-only into ROADMAP-PLATFORM, never read by /orient, preflight or a pick surface (Decision 108).
  - >-
    The filer (report section 2) is not to be built by a delegate before the friction classifier's verb and
    the reader-verb mechanism exist, k1-k3 are decided, back-validation answers q1, and the c3 proposal review
    has a named reviewer.
  - No new INTENT or standing prose doc (Decision 86).
