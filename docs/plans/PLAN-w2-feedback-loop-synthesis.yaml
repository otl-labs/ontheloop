    docs/contracts/overseer-dispatch.yaml#subagent_detection, so gates are GATE_REQUESTed, never run inline.
    Gates: zero-context verification, then plan-critique; the PR waits for the operator. Step 0: ci_rca_open
    read through the reader's named verb returned 0 rows at 2026-10-04T08:47:45Z.
  - >-
    Inputs read: the ten component reports and plans at the pinned heads (every verdict, fork and boundary
