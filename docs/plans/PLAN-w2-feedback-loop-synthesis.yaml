schema_version: 5
slug: "w2-feedback-loop-synthesis"
intent: >-
  Stage, for the operator, the synthesis step (W2) of the telemetry-feedback-loop design stream without
  building, merging or flipping anything: read the ten component designs at pinned heads, fix a build order
  that respects the writer, the unmerged write-conformance plan and the two parked ownership splits, stage
  one cross-component maturity ladder (one rule family, per-component seeds, a rung ceiling by dependency)
  in place of the ten dialects, and catalogue the contradictions between components with the settled rows
  separated from the contested ones; prove with executable evidence that the ten items merge into one
  fixture under the frozen caps with the staged edge list, that the build order is a forward ordering of
  the data graph, and that every contested row is parked. Nothing is implemented, filed, updated, closed,
  merged or flipped; every fork weighing unmerged or unanswered work is parked as asked.
plan_type: REPORT-ONLY
verification_tier: V1
plan_path: docs/plans/PLAN-w2-feedback-loop-synthesis.yaml
phase: >-
  CD.45 pilot (telemetry-feedback-loop design stream, W2 synthesis over the ten W1 components). Touches
  T2.36, T3.3, T3.4 and T3.20 by id only, in a staged edge list the merging threads apply; closes no criterion
  and edits no fixture.
scope:
  - file: docs/plans/PLAN-w2-feedback-loop-synthesis.yaml
    action: Create
    purpose: >-
      The planning artefact: executable evidence for the synthesis (VP), the fork record (context) and the
      gating constraints.
  - file: docs/plans/reports/REPORT-w2-feedback-loop-synthesis.md
    action: Create
    purpose: >-
      The REPORT-ONLY deliverable (Decision 86 cl.2; file-router.yaml report-deliverables route): verdict,
      pinned inputs, the data graph and prerequisites, the four-wave build order, the merge order and staged
      pilot edge list, the ten maturity blocks as eight dialects and the one staged ladder family with seeds, the settled and contested
      contradiction register, this report's own parked forks, staged text for W3 and the evidence table.
bundled_recommendations: []
followon_recs: []
infrastructure_dependencies: []
acceptance_criteria:
  - >-
    Read at their pinned heads, the ten inputs each carry exactly one pilot item with a failure_signal; two
    are marked not final; every item reaches T2.36 by an edge today; nine are data-plane only and one names
    both planes (VP step 1).
  - >-
    The dialect table in the report equals the table re-derived from the ten maturity blocks, with four
    distinct first-rung counts, five distinct second-rung windows, six zero-defect and four since-overturned
    second-rung readings, two top-rung day counts and one rate, and eight distinct whole tuples (VP step 2).
  - >-
    Every item is placed in exactly one build wave; thirteen of the fourteen data edges run from an earlier
    wave to a later one and the remaining one stays inside wave 1; the staged edge list carries at most three
    edges per item, every target resolves, every item still reaches T2.36, the ladder seeds name the same
    upstreams as the data graph, and build gates sit on two waves and capability gates on three (VP step 3).
  - >-
    The ten items, their thirty criteria and the twenty-five staged edges, merged into one fixture rendered in
    the canonical layout, pass evaluator legs 1, 2, 4 and 5 at 405 effective lines against the 420 ceiling;
    the same merge with the filer-to-budget edge that F13 (b) implies fails leg 1 with one error (VP step 4).
  - >-
    The contradiction register has unique ids, five settled and twenty-two contested rows, every row naming
    items from the inputs, and every contested row carrying a resolution and a park reference to one of the
    fourteen W2 forks, a W1 fork or the operator (VP step 5).
  - The plan validates against the PlanDocument schema (VP step 6).
  - >-
    The branch diff against origin/main is exactly the plan and the report, with no fixture, code, roadmap,
    contract, config, rec or DECISIONS edit (VP step 7).
  - The fast presubmit tier passes on the branch (VP step 8).
verification_plan:
  - step: 1
    phase: pre-deploy
    action: Read the ten inputs at their pinned heads and check items, edges, planes and signals
    command: >-
      bin/venv-python -c "import re,subprocess as S,yaml; F=chr(96)*3; T=open('docs/plans/reports/REPORT-w2-feedback-loop-synthesis.md',encoding='utf-8').read(); Y={k:v for b in re.findall(F+'yaml\n(.*?)'+F,T,re.S) for k,v in yaml.safe_load(b).items()};
      G=lambda h: (S.run(['git','fetch','--quiet','--depth','1','origin',h],check=False), yaml.safe_load(S.run(['git','show',h+':docs/work-item-pilot/telemetry-feedback-loop.yaml'],check=True,capture_output=True,text=True).stdout))[1];
      FX={x['item']:G(x['head']) for x in Y['inputs']}; W={i:[w for w in f['work_items'] if w['id']==i] for i,f in FX.items()}; E={i:[(e['kind'],e['to']) for e in f['work_item_edges']] for i,f in FX.items()}; P={i:W[i][0]['extension']['consideration_register']['planes'] for i in W};
      print('heads=%d items_found=%d not_final=%d single_item_fixtures=%d edges_now=%d reach_T2_36=%d data_plane_only=%d both_planes=%d signals=%d' % (len(Y['inputs']),sum(len(v)==1 for v in W.values()),sum(not x['final'] for x in Y['inputs']),sum(len(f['work_items'])==1 for f in FX.values()),sum(len(v) for v in E.values()),sum(any(t=='T2.36' for _,t in v) for v in E.values()),sum(p==['data_plane'] for p in P.values()),sum(sorted(p)==['control_plane','data_plane'] for p in P.values()),sum('failure_signal' in W[i][0]['extension']['consideration_register'] for i in W)))"
    expected: >-
      One line: ten heads, ten items found, two not final, ten single-item fixtures, sixteen edges today, all
      ten reaching T2.36, nine data-plane only, one on both planes, ten failure signals, exactly: heads=10
      items_found=10 not_final=2 single_item_fixtures=10 edges_now=16 reach_T2_36=10 data_plane_only=9
      both_planes=1 signals=10. Each head is fetched by sha, so a later push to a component branch does not
      change it.
    fix_if: >-
      A missing item means a head was mis-pinned or its branch deleted after a squash-merge: re-pin from the PR
      or read the item from main and update the inputs block. A changed edge or plane count changes S1, S2 and
      section 2.4.
    hermetic: false
    graduation: not-applicable
  - step: 2
    phase: pre-deploy
    action: Re-derive the trigger dialects (eight distinct tuples) from the ten maturity blocks and compare with the report's table
    command: |
      bin/venv-python -c "import re,subprocess as S,yaml; F=chr(96)*3; T=open('docs/plans/reports/REPORT-w2-feedback-loop-synthesis.md',encoding='utf-8').read(); Y={k:v for b in re.findall(F+'yaml\n(.*?)'+F,T,re.S) for k,v in yaml.safe_load(b).items()};
      G=lambda h: (S.run(['git','fetch','--quiet','--depth','1','origin',h],check=False), yaml.safe_load(S.run(['git','show',h+':docs/work-item-pilot/telemetry-feedback-loop.yaml'],check=True,capture_output=True,text=True).stdout))[1];
      def D(i,h):
        t=[w for w in G(h)['work_items'] if w['id']==i][0]['extension']['consideration_register']['maturity']['transitions']; c=t[1]['trigger']['comparator']; m=t[2]['trigger']['metric']
        return {'item':i,'first_n':t[0]['trigger']['threshold'],'second_window':t[1]['trigger']['threshold'] if c=='>=' else int(re.search('last ([0-9]+)',t[1]['trigger']['metric']).group(1)),'second_comparator':c,'third_days':t[2]['trigger']['threshold'] if re.match('(provisional: )?(consecutive days|days in a row)',m) else 'rate'}
      R=[D(x['item'],x['head']) for x in Y['inputs']]; d=Y['dialects']
      print('rows=%d derived_equal_report=%s first_n_distinct=%d second_window_distinct=%d second_zero_defects=%d second_since_overturned=%d third_day_values=%d third_rate=%d tuples_distinct=%d' % (len(R),R==d,len({r['first_n'] for r in R}),len({r['second_window'] for r in R}),sum(r['second_comparator']=='==' for r in R),sum(r['second_comparator']=='>=' for r in R),len({r['third_days'] for r in R if r['third_days']!='rate'}),sum(r['third_days']=='rate' for r in R),len({(r['first_n'],r['second_window'],r['second_comparator'],r['third_days']) for r in R})))"
    expected: >-
      One line: ten rows, the derived table equal to the report's, four distinct first-rung counts, five
      distinct second-rung windows, six zero-defect and four since-overturned readings, two top-rung day values
      and one rate, and eight distinct whole tuples (the dialects), exactly: rows=10 derived_equal_report=True
      first_n_distinct=4 second_window_distinct=5 second_zero_defects=6 second_since_overturned=4
      third_day_values=2 third_rate=1 tuples_distinct=8.
    fix_if: >-
      derived_equal_report False means a component changed a trigger at a new head or a row was mis-copied:
      re-pin and re-copy. A changed distinct count changes section 3.1 and X6.
    hermetic: false
    graduation: not-applicable
  - step: 3
    phase: pre-deploy
    action: Check the build order is a forward ordering of the data graph and the staged edges obey the cap
    command: |
      bin/venv-python -c "import re,yaml; from collections import Counter; F=chr(96)*3; T=open('docs/plans/reports/REPORT-w2-feedback-loop-synthesis.md',encoding='utf-8').read(); Y={k:v for b in re.findall(F+'yaml\n(.*?)'+F,T,re.S) for k,v in yaml.safe_load(b).items()};
      I=[x['item'] for x in Y['inputs']]; WV={i:w['wave'] for w in Y['build_order'] for i in w['items']}; DE=Y['data_edges']; SE=Y['pilot_edges_staged']; C=Counter(e['from'] for e in SE)
      def reach(i,seen=()):
        return any(e['to']=='T2.36' or (e['to'] in I and e['to'] not in seen and reach(e['to'],seen+(i,))) for e in SE if e['from']==i)
      U={i:sorted(e['to'] for e in DE if e['from']==i) for i in I}; LS={r['item']:sorted(r['upstreams']) for r in Y['ladder_seeds']}; SW=[(e['from'],e['to']) for e in DE if WV[e['to']]==WV[e['from']]]
      print('items=%d placed_once=%d waves=%d data_edges=%d edges_forward=%d same_wave=%s staged_edges=%d max_out=%d targets_resolve=%d reach_T2_36=%d seed_upstreams_match=%d build_gated_waves=%d capability_gated_waves=%d' % (len(I),sum(sum(i in w['items'] for w in Y['build_order'])==1 for i in I),len(Y['build_order']),len(DE),sum(WV[e['to']]<WV[e['from']] for e in DE),SW,len(SE),max(C.values()),sum(e['to'] in I or e['to'] in ('T2.36','T3.3','T3.4','T3.20') for e in SE),sum(reach(i) for i in I),sum(U[i]==LS[i] for i in I),sum(bool(w['gates']) for w in Y['build_order']),sum(bool(w['capability_gates']) for w in Y['build_order'])))"
    expected: >-
      One line: ten items each placed once across five waves (wave 0 empty), fourteen data edges of which
      thirteen run forward and the one same-wave edge is the reader reading capture, twenty-five staged edges
      with at most three per item, all targets resolving, all ten items reaching T2.36, the ladder seeds naming
      the data upstreams, build gates on two waves and capability gates on three.
    fix_if: >-
      An edge running backward means the build order contradicts the data graph: move the item or the edge and
      re-read sections 2.1 and 2.3. max_out above 3 means the staged list breaks MAX_EDGES_FROM_ITEM. A seed
      mismatch means section 3.3 and section 2.1 disagree.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      A consistency check between blocks of one report; true only for this report's text, so a standing guard
      would guard nothing once the merging threads apply the staged list.
    expected_literals: ["items=10 placed_once=10 waves=5 data_edges=14 edges_forward=13 same_wave=[('pwi-telemetry-reader-verbs', 'pwi-capture-producer-wiring')] staged_edges=25 max_out=3 targets_resolve=25 reach_T2_36=10 seed_upstreams_match=10 build_gated_waves=2 capability_gated_waves=3"]
  - step: 4
    phase: pre-deploy
    action: Simulate the ten items merged into one fixture with the staged edges and run the evaluator legs
    command: >-
      PYTHONPATH=. bin/venv-python -c "import re,subprocess as S,yaml; from scripts.checks.roadmap import _work_item_pilot_model as M, validate_work_item_pilot as V; from scripts.checks.structural._classify import effective_lines; F=chr(96)*3; T=open('docs/plans/reports/REPORT-w2-feedback-loop-synthesis.md',encoding='utf-8').read(); Y={k:v for b in re.findall(F+'yaml\n(.*?)'+F,T,re.S) for k,v in yaml.safe_load(b).items()};
      X=[(S.run(['git','fetch','--quiet','--depth','1','origin',x['head']],check=False), S.run(['git','show',x['head']+':docs/work-item-pilot/telemetry-feedback-loop.yaml'],check=True,capture_output=True,text=True).stdout)[1] for x in Y['inputs']]; D=[yaml.safe_load(t) for t in X];
      m={'fixture':D[0]['fixture'],'work_items':[w for d in D for w in d['work_items']],'work_item_criteria':[c for d in D for c in d['work_item_criteria']],'work_item_edges':Y['pilot_edges_staged']}; t=chr(10).join(X[0].splitlines()[:3])+chr(10)+M.render(M.Fixture.model_validate(m)); e1,fx=V._leg1_schema(t); c=V._Context();
      v=dict(m,work_item_edges=Y['pilot_edges_staged']+[{'from':'pwi-rec-filing-dedupe','to':'pwi-loop-cost-egress-budget','kind':'depends_on'}]); ev,_=V._leg1_schema(chr(10).join(X[0].splitlines()[:3])+chr(10)+M.render(M.Fixture.model_validate(v)));
      print('items=%d criteria=%d edges=%d effective_lines=%d ceiling=%d leg1=%d leg2=%d leg4=%d leg5=%d f13b_variant_leg1=%d' % (len(fx.work_items),len(fx.work_item_criteria),len(fx.work_item_edges),effective_lines(t),M.HEADER_LINE_CEILING+M.PER_ITEM_LINE_CEILING*len(fx.work_items),len(e1),len(V._leg2_cap_and_layout(t,fx)),len(V._leg4_resolution(c,fx)),len(V._leg5_header(fx)),len(ev)))"
    expected: >-
      One line: ten items, thirty criteria, twenty-five edges, 405 effective lines against a ceiling of 420,
      zero errors from legs 1, 2, 4 and 5, and exactly one leg-1 error once the filer-to-budget edge that
      F13 (b) implies is appended (the filer at four edges), exactly: items=10 criteria=30 edges=25
      effective_lines=405 ceiling=420 leg1=0 leg2=0 leg4=0 leg5=0 f13b_variant_leg1=1. Leg 3 (single instance) and leg 6 (sunset) read the repository,
      not the fixture text, and are covered by the registered check on main. The simulation renders in memory
      and writes no file.
    fix_if: >-
      A leg error names the row: a schema error means a component changed its item shape at a new head; a
      layout error means render changed; a leg-4 error means a staged edge target left ROADMAP-PLATFORM or a
      component item was renamed. Lines above the ceiling mean the merge needs the Decision 165/166 path.
    hermetic: false
    graduation: not-applicable
  - step: 5
    phase: pre-deploy
    action: Check the contradiction register's ids, statuses, item names and park references
    command: >-
      bin/venv-python -c "import re,yaml; F=chr(96)*3; T=open('docs/plans/reports/REPORT-w2-feedback-loop-synthesis.md',encoding='utf-8').read(); Y={k:v for b in re.findall(F+'yaml\n(.*?)'+F,T,re.S) for k,v in yaml.safe_load(b).items()};
      I={x['item'] for x in Y['inputs']}; C=Y['contradictions']; ids=[r['id'] for r in C]; K=[r for r in C if r['status']=='contested']; FK=set(re.findall(r'^- (F[0-9]+) \(asked\)',T,re.M)); W1=re.compile(r'^#1(384|390|394|395|396|397|398|399|400|401) k[0-9]');
      print('rows=%d unique_ids=%s settled=%d contested=%d items_resolve=%d contested_with_resolution=%d contested_parked=%d parked_on_w2_fork=%d parked_on_w1_fork=%d parked_on_operator=%d w2_forks_listed=%d' % (len(C),len(set(ids))==len(ids),sum(r['status']=='settled' for r in C),len(K),sum(r['items']=='all' or set(r['items'])<=I for r in C),sum(bool(r.get('resolution')) for r in K),sum(bool(r.get('park')) for r in K),sum(r['park'] in FK for r in K),sum(bool(W1.match(r['park'])) for r in K),sum(r['park'].startswith('operator') for r in K),len(FK)))"
    expected: >-
      One line: twenty-seven rows with unique ids, five settled and twenty-two contested, every row naming
      input items, every contested row with a resolution and a park reference, fourteen parked on a W2 fork,
      six on a W1 fork and two on the operator, fourteen W2 forks listed in section 5.
    fix_if: >-
      A contested row without a park reference is a decision this report must not make: add the fork to
      section 5 or cite the W1 fork that holds it. An item name outside the inputs is a typo.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      A consistency check over one report's own register; nothing in the repository reads it, so a standing
      guard would pin prose.
    expected_literals: ["rows=27 unique_ids=True settled=5 contested=22 items_resolve=27 contested_with_resolution=22 contested_parked=22 parked_on_w2_fork=14 parked_on_w1_fork=6 parked_on_operator=2 w2_forks_listed=14"]
  - step: 6
    phase: pre-deploy
    action: Validate this plan against the PlanDocument schema
    command: bin/venv-python -m scripts.roadmap.plan_document docs/plans/PLAN-w2-feedback-loop-synthesis.yaml
    expected: The validator reports the plan valid and exits 0.
    fix_if: Fix the reported field (unknown key, missing graduation companion, backtick literal in expected).
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      validate_plan_documents already schema-checks every docs/plans/PLAN-*.yaml in both tiers; a per-plan row
      duplicates it.
  - step: 7
    phase: pre-deploy
    action: Confirm the change is exactly the plan and the report
    command: git fetch --quiet origin main && git diff --name-only origin/main...HEAD
    expected: >-
      Exactly two paths: docs/plans/PLAN-w2-feedback-loop-synthesis.yaml and
      docs/plans/reports/REPORT-w2-feedback-loop-synthesis.md. The fixture is not among them.
    fix_if: Any other path means scope leaked; revert it.
    hermetic: false
    graduation: not-applicable
  - step: 8
    phase: pre-deploy
    action: Run the fast presubmit tier over the branch
    command: bin/venv-python -m scripts.validate --pre
    expected: Exits 0; PR CI's --pre run is the authoritative gate (Decision 73).
    fix_if: Address the reported issue in the plan or report.
    hermetic: false
    graduation: not-applicable
constraints:
  - >-
    No tier-item or criterion status flip, no closes_criteria entry, no ratification (charter never-list). The
    staged ladder, the staged edge list and the W3 text in report section 6 are recommendations; nothing is
    applied to the fixture, the roadmap or docs/DECISIONS.md by this plan.
  - >-
    No recommendation filed, updated, closed or read for content (Decision 67); recs are named only where a
    component report names them.
  - >-
    No contract, config, code, evaluator, IAM or Terraform edit; the pilot schema change (P7) and the evaluator
    cap are named for their owners, not changed. The two ownership splits with the Telemetry project (P3, P4)
    are not decided here.
  - >-
    F1-F14 weigh credible alternatives against unmerged PRs and unanswered forks: parked as asked, never decided
    by this thread or the Step 6b stand-in. None touches IAM, security, a governed deploy or spend.
  - >-
    CD.45 binds while pending: one fixture only, sized by item count (the ten items spend 10 of 12; this plan
    spends none), edges id-only into ROADMAP-PLATFORM or to pilot items, never read by /orient, preflight or
    a pick surface (Decision 108). The staged edge list is applied only by the merging thread of each wave,
    after a merge from main and a re-render.
  - >-
    #1384 and #1390 are read as not final; every claim about them is pinned to the inputs block and is re-read
    when they settle. Nothing here is to be built by a delegate before P1-P4 are answered.
  - No new INTENT or standing prose doc (Decision 86).
