    the Fable fork consults of 2026-10-03 (/mnt/project-files/reports/design-fork-consults-2026-10-03.md),
    scripts/checks/roadmap/_work_item_pilot_model.py and validate_work_item_pilot.py, T2.36, T3.3, T3.4, T3.20,
    T2.52, T2.19, T2.26, and the Telemetry project's answers of 2026-10-04 as relayed by the coordinator.
  - >-
    Industry practice applied: topological ordering of a data-dependency graph with external roots pinned
