schema_version: 5
slug: "w3-feedback-loop-staging"
intent: >-
  Stage, for the operator, the W3 step of the telemetry-feedback-loop design stream without filing,
  applying, merging or flipping anything: criteria text for T3.3 and T3.4 that fills the F-035 gap (a
  formula, a denominator, a source and a home for T3.3's false-positive threshold) and re-grounds the
  other three criteria on the pilot items that realize them; the pending candidate decisions the designs
  need, four restating the W2 synthesis's staged text and two the component designs need (a seventh,
  the breach route, retired into the budget row by the operator's 2026-10-04 ruling), in the
  candidate_decisions[] shape with their significance routing, every always-ask fork left blank and the
  operator's 2026-10-04 rulings recorded on every row; and one consolidated list of every parked question only the
  operator can answer, ordered by effect, with the design's recommendation and the consult's verdict on
  every row and both positions shown wherever a consult differs. Prove with executable evidence that the
  inputs are the pinned ones, that the criteria text quoted is the roadmap's and every status stays open,
  that the candidate-decision rows validate and none is on main, that the list covers every parked fork
  and every consult row, and that every consult departure is present. Nothing is ratified, filed, applied,
  merged or flipped; every fork weighing unmerged or unanswered work is parked as asked.
plan_type: REPORT-ONLY
verification_tier: V1
plan_path: docs/plans/PLAN-w3-feedback-loop-staging.yaml
phase: >-
  CD.45 pilot (telemetry-feedback-loop design stream, W3 staging over the W2 synthesis and the ten W1
  components). Touches T3.3 and T3.4 by staged text only (operator-applied; NOT applied here); closes no
  criterion, files no decision and edits no fixture.
scope:
  - file: docs/plans/PLAN-w3-feedback-loop-staging.yaml
    action: Create
    purpose: >-
      The planning artefact: executable evidence for the staging (VP), the fork record (context) and the
      gating constraints.
  - file: docs/plans/reports/REPORT-w3-feedback-loop-staging.md
    action: Create
    purpose: >-
      The REPORT-ONLY deliverable (Decision 86 cl.2; file-router.yaml report-deliverables route): verdict,
      pinned inputs, the staged criteria text for T3.3 and T3.4, the six staged candidate-decision rows
      with their routing and rulings, the ninety-six-row consolidated list of parked questions with the
      operator's ruling on each, the answered questions and the consult-row mapping, the consult departures with both positions, this report's own
      forks, the boundary and the evidence table.
bundled_recommendations: []
followon_recs: []
infrastructure_dependencies: []
acceptance_criteria:
  - >-
    The synthesis head is fetched by sha and its inputs block names the same ten component heads and final
    flags as this report's, with two components not final; the synthesis plan exists at that head; and,
    where the shared folder is mounted, all sixteen consult, parked-forks, rulings and decision-sheet files
    hash to their pinned sha256 prefixes (VP step 1).
  - >-
    The four staged criteria rows quote the roadmap's T3.3 and T3.4 criterion text verbatim, every row is
    open today and open as staged, the T3.3 c2 row is the F-035 gap and its staged text carries the formula
    vocabulary (rejected_share, per detector, 30 days, loop record journal, a home and a number), and no
    Decision on main names MED-9 (VP step 2).
  - >-
    The six staged candidate-decision rows (CD.46, CD.47, CD.48, CD.50, CD.51, CD.52; CD.49 retired by the
    operator's 2026-10-04 q2 ruling, its id left unused) validate against CandidateDecision, every row is
    pending, none of the ids is on main whose highest row is CD.45, and the cd_routing block names the same
    ids in the same order with only numbered_decision and field_semantics as significance keys (VP step 3).
  - >-
    The parked list has ninety-six rows with unique ids and ranks 1 to 96; its first row is the capture
    session denominator, then F1 to F12, then F13 and F14 as one row that covers F14, then the three
    ownership calls; groups and, inside each wave, binds_at values are in the stated order; every row
    carries a design, a consult and a ruling column (sixty-four rows operator-accepted under pass 1,
    nineteen ruled by a numbered question, thirteen open); and, where the shared folder is mounted, every fork row of the
    ten W1 parked-forks tables, every open question their prose names, and every F row of the W2 file is
    a row, an answered question or covered by one, and the
    consult_rows mapping equals the set of fork cells in the two consults' recommendation tables for the
    ten component PRs (VP step 4). The one answered question (#1395 q1) is a relayed fact now on main;
    #1396 q1 stays parked because its answer rests on unmerged #1397.
  - >-
    The consult_departures block carries six consult-differs rows, exactly the rows the 2026-10-03 and c10
    consult tables mark differs, the two synthesis departures F4 and F13-F14, the converged faults-list row
    and three refinements, and every non-converged row names a parked-list id (VP step 5).
  - The plan validates against the PlanDocument schema (VP step 6).
  - >-
    The branch diff against origin/main is exactly the plan and the report, with no roadmap, decisions,
    fixture, contract or code change (VP step 7).
  - The fast presubmit tier passes on the branch (VP step 8).
  - >-
    No staged criterion text and no CD title or detail carries a contested resolution phrase (one rec
    writer, the ladder owning the envelope, a consult refinement's wording) in a clause that names
    neither the fork, an option, a consult position, a ruling nor a parked marker (VP step 9).
verification_plan:
  - step: 1
    phase: pre-deploy
    action: Fetch the synthesis head and check the pinned inputs against it and against the shared folder
    command: |
      PYTHONPATH=. bin/venv-python -c "import re,subprocess as S,yaml,hashlib,os; F=chr(96)*3; T=open('docs/plans/reports/REPORT-w3-feedback-loop-staging.md',encoding='utf-8').read(); Y={k:v for b in re.findall(F+'yaml\n(.*?)'+F,T,re.S) for k,v in yaml.safe_load(b).items()}
      I=Y['inputs']; h=I['synthesis']['head']; S.run(['git','fetch','--quiet','--depth','1','origin',h],check=False); R=S.run(['git','show',h+':'+I['synthesis']['report']],check=True,capture_output=True,text=True).stdout
      Z={k:v for b in re.findall(F+'yaml\n(.*?)'+F,R,re.S) for k,v in yaml.safe_load(b).items()}; SI={x['item']:(x['head'],x['final']) for x in Z['inputs']}; CI={x['item']:(x['head'],x['final']) for x in I['components']}
      P=S.run(['git','cat-file','-e',h+':'+I['synthesis']['plan']],check=False).returncode==0; root='/mnt/project-files'; sf=I['shared_folder_files']
      sh=('%d/%d' % (sum(hashlib.sha256(open(os.path.join(root,x['path']),'rb').read()).hexdigest()[:16]==x['sha256_16'] for x in sf),len(sf))) if os.path.isdir(root) else 'skipped'
      print('synthesis_pr=%d components=%d heads_and_finals_equal_synthesis=%s not_final=%d plan_at_head=%s shared_files=%d shared_hash_match=%s' % (I['synthesis']['pr'],len(CI),SI==CI,sum(not f for _,f in CI.values()),P,len(sf),sh))"
    expected: >-
      One line: the synthesis PR, ten components, the heads and final flags equal to the synthesis's own
      inputs block, two not final, the synthesis plan present at that head, sixteen shared-folder files all
      hashing as pinned (or shared_hash_match=skipped where /mnt/project-files is not mounted, as in CI),
      exactly: synthesis_pr=1402 components=10 heads_and_finals_equal_synthesis=True not_final=2
      plan_at_head=True shared_files=16 shared_hash_match=16/16.
    fix_if: >-
      heads_and_finals_equal_synthesis False means a component was re-pinned after dcdfe783 or this report's
      inputs block was mis-copied: re-copy from the synthesis. A hash mismatch means a consult or parked-forks
      file was edited after pinning: re-read it and re-pin, and re-check sections 4 and 5 against it.
    hermetic: false
    graduation: not-applicable
  - step: 2
    phase: pre-deploy
    action: Check the staged criteria rows quote the roadmap verbatim, stay open, and fill F-035
    command: |
      PYTHONPATH=. bin/venv-python -c "import re,yaml; F=chr(96)*3; T=open('docs/plans/reports/REPORT-w3-feedback-loop-staging.md',encoding='utf-8').read(); Y={k:v for b in re.findall(F+'yaml\n(.*?)'+F,T,re.S) for k,v in yaml.safe_load(b).items()}
      R=yaml.safe_load(open('docs/ROADMAP-PLATFORM.yaml',encoding='utf-8')); IT={t['id']:t for t in R['tier_items']}
      def C(item,cid):
          c=IT[item]['exit_criteria'][int(cid[1:])-1]; return (c,'open') if isinstance(c,str) else (c['text'],c.get('status','open'))
      rows=Y['staged_criteria']; eq=sum(C(r['item'],r['criterion'])==(r['text_today'],r['status_today']) for r in rows); op=sum(r['status_today']=='open' and r['status_staged']=='open' for r in rows)
      t33=[r for r in rows if r['item']=='T3.3' and r['criterion']=='c2'][0]['text_staged']; tok=['rejected_share','per detector','30 days','loop record','journal','Home:','Number:']
      D=open('docs/DECISIONS.md',encoding='utf-8').read()
      print('rows=%d items=%s text_today_equal_roadmap=%d statuses_open_both=%d t33_c2_gap=%s f035_tokens=%d/%d decisions_name_med9=%s' % (len(rows),sorted({r['item'] for r in rows}),eq,op,[r['gap'] for r in rows if r['item']=='T3.3' and r['criterion']=='c2'][0],sum(t in t33 for t in tok),len(tok),'MED-9' in D))"
    expected: >-
      One line: four rows over T3.3 and T3.4, all four text_today values equal to the roadmap's criterion
      text, all four open before and after, the T3.3 c2 row carrying gap F-035, all seven formula tokens
      present in its staged text, and no MED-9 in docs/DECISIONS.md.
    fix_if: >-
      text_today_equal_roadmap below 4 means the roadmap changed under the report or a quote was mis-copied:
      re-copy from docs/ROADMAP-PLATFORM.yaml. statuses_open_both below 4 is a flip and is never fixed by
      editing the roadmap. decisions_name_med9 True means the anchor flag in the T3.4 c2 row is stale.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      A consistency check between one report's quoted text and the roadmap; once the operator applies the
      staged edit the text_today values are superseded by design, so a standing guard would guard nothing.
    expected_literals: ["rows=4 items=['T3.3', 'T3.4'] text_today_equal_roadmap=4 statuses_open_both=4 t33_c2_gap=F-035 f035_tokens=7/7 decisions_name_med9=False"]
  - step: 3
    phase: pre-deploy
    action: Validate the staged candidate-decision rows against the CandidateDecision model and against main
    command: |
      PYTHONPATH=. bin/venv-python -c "import re,yaml; from scripts.platform_roadmap_models import CandidateDecision; F=chr(96)*3; T=open('docs/plans/reports/REPORT-w3-feedback-loop-staging.md',encoding='utf-8').read(); Y={k:v for b in re.findall(F+'yaml\n(.*?)'+F,T,re.S) for k,v in yaml.safe_load(b).items()}
      R=yaml.safe_load(open('docs/ROADMAP-PLATFORM.yaml',encoding='utf-8')); M={c['id'] for c in R['candidate_decisions']}; cds=[CandidateDecision.model_validate(r) for r in Y['staged_candidate_decisions']]; ids=[c.id for c in cds]; rt=[r['id'] for r in Y['cd_routing']]
      print('rows=%d validated=%d pending=%d ids=%s on_main=%d max_main=%s routing_ids_equal=%s routing_keys=%s' % (len(cds),len(cds),sum(c.state=='pending' for c in cds),ids,len(M&set(ids)),max(M,key=lambda s:int(s.split('.')[1])),ids==rt,sorted({r['significance'] for r in Y['cd_routing']})))"
    expected: >-
      One line: six rows, six validated, six pending, ids CD.46, CD.47, CD.48, CD.50, CD.51 and CD.52 (CD.49
      retired), none on main, the highest row on main CD.45, the routing block's ids equal and in order, and
      the routing keys limited to field_semantics and numbered_decision.
    fix_if: >-
      A validation error names the field (extra keys are forbidden by the model: routing lives in cd_routing,
      never on the row). on_main above 0 means a CD was filed since; re-number the placeholders. max_main
      above CD.45 means the same.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      True only for this report's staged rows; once the operator files them the ids are reassigned and the
      check is void.
    expected_literals: ["rows=6 validated=6 pending=6 ids=['CD.46', 'CD.47', 'CD.48', 'CD.50', 'CD.51', 'CD.52'] on_main=0 max_main=CD.45 routing_ids_equal=True"]
  - step: 4
    phase: pre-deploy
    action: Check the parked list's order and coverage of every parked fork and every consult row
    command: |
      PYTHONPATH=. bin/venv-python -c "import re,yaml,os,glob; F=chr(96)*3; T=open('docs/plans/reports/REPORT-w3-feedback-loop-staging.md',encoding='utf-8').read(); Y={k:v for b in re.findall(F+'yaml\n(.*?)'+F,T,re.S) for k,v in yaml.safe_load(b).items()}
      P=Y['parked_questions']; ids=[r['id'] for r in P]; G=['whole_loop','ownership','wave_1','wave_2','wave_3','wave_4']; B=['build','read_all_run','promotion','close','text','measurement']
      gi=[G.index(r['group']) for r in P]; bi=[(G.index(r['group']),B.index(r['binds_at'])) for r in P]; wave=[x for x in bi if x[0]>=2]
      first=ids[:17]==['capture-q1']+['F%d'%i for i in range(1,13)]+['F13-F14','call-1','call-2','call-3']; f14=any('F14' in r.get('covers',[]) for r in P if r['id']=='F13-F14')
      cls=sorted({r['class'] for r in P}); rec=sum(bool(r.get('design')) and bool(r.get('consult')) for r in P); RU=[r.get('ruling','') for r in P]; ru_filled=sum(bool(x) for x in RU); ru_acc=sum(x.startswith('operator-accepted') for x in RU); ru_q=sum(x.startswith('operator ruling') for x in RU); ru_open=sum(x.startswith('open') or x.startswith('pass 1 (2026-10-04) carries no') for x in RU)
      root='/mnt/project-files'; sf=Y['inputs']['shared_folder_files']; PRS={x['pr'] for x in Y['inputs']['components']}
      ANS={r['ref'] for r in Y['answered_questions']}
      def covered(key):
          return key in ANS or any(r['source']==key or any(c==key or c.startswith(key+' ') for c in r.get('covers',[])) for r in P)
      if os.path.isdir(root):
          keys=[]
          for x in sf:
              if not x['path'].startswith('gates/w1-'): continue
              for ln in open(os.path.join(root,x['path']),encoding='utf-8'):
                  if ln.startswith('| ') and not ln.startswith('| id') and not ln.startswith('| ---'): keys.append('#%d %s' % (x['pr'],ln.split('|')[1].strip()))
          pq=[]
          for x in sf:
              if not x['path'].startswith('gates/w1-'): continue
              prose=chr(10).join(l for l in open(os.path.join(root,x['path']),encoding='utf-8').read().splitlines() if not l.startswith('|'))
              pq+=['#%d %s' % (x['pr'],q) for q in sorted({m.group(1) for m in re.finditer(r'(?<![\w#-])(?<!rec-filing )(?<!back-validation )(?<!#\d{4} )(q[1-9])\b',prose)})]
          fk=sorted({m.group(1) for m in re.finditer(r'^- (F\d+) ',open(os.path.join(root,'gates/w2-parked-forks.md'),encoding='utf-8').read(),re.M)})
          unc=[k for k in keys if not covered(k)]+[f for f in fk if f not in ids and not any(r['source']==f or f in r.get('covers',[]) for r in P)]
          cells=set()
          for ln in open(os.path.join(root,'reports/design-fork-consults-2026-10-03.md'),encoding='utf-8'):
              m=re.match(r'\| #(\d+) \| ([^|]+) \|',ln)
              if m and int(m.group(1)) in PRS: cells.add(('2026-10-03',int(m.group(1)),m.group(2).strip()))
          for ln in open(os.path.join(root,'reports/design-fork-consults-w1-c10-2026-10-04.md'),encoding='utf-8'):
              m=re.match(r'\| ([^|]+) \| [^|]+ \| (stays|refined|differs|agrees|n/a)',ln)
              if m: cells.add(('2026-10-04-c10',1401,m.group(1).strip()))
          cr={(r['consult'],r['pr'],r['cell']) for r in Y['consult_rows']}; rows_ok=all(r['row'] in ids or r['row']=='answered' for r in Y['consult_rows'])
          shared='w1_fork_keys=%d w2_forks=%d uncovered=%s prose_q_keys=%d prose_q_uncovered=%s consult_cells=%d consult_rows=%d cells_equal=%s consult_rows_resolve=%s' % (len(keys),len(fk),unc,len(pq),[k for k in pq if not covered(k)],len(cells),len(cr),cells==cr,rows_ok)
      else: shared='shared_folder=skipped'
      print('rows=%d unique_ids=%s ranks_1_to_n=%s groups_monotone=%s binds_monotone_in_waves=%s first_17=%s f14_covered=%s classes=%s design_and_consult_filled=%d rulings_filled=%d accepted_pass1=%d ruled_by_question=%d open=%d %s' % (len(P),len(set(ids))==len(ids),[r['rank'] for r in P]==list(range(1,len(P)+1)),gi==sorted(gi),wave==sorted(wave),first,f14,cls,rec,ru_filled,ru_acc,ru_q,ru_open,shared))"
    expected: >-
      One line: ninety-six rows, unique ids, ranks 1 to 96, groups monotone, binds_at monotone inside each
      wave, the first seventeen ids as stated, F14 covered by the F13-F14 row, classes always-ask and asked
      only, all ninety-six rows carrying design and consult, and where the shared folder is mounted:
      sixty-five W1 fork keys and fourteen W2 forks with an empty uncovered list, twenty-three prose open
      questions with an empty uncovered list, sixty-seven consult cells equal to sixty-seven consult_rows,
      every consult_rows row resolving to a list id or to answered, exactly: rows=96 unique_ids=True
      ranks_1_to_n=True groups_monotone=True binds_monotone_in_waves=True first_17=True f14_covered=True
      classes=['always-ask', 'asked'] design_and_consult_filled=96 rulings_filled=96 accepted_pass1=64
      ruled_by_question=19 open=13 w1_fork_keys=65 w2_forks=14 uncovered=[] prose_q_keys=23
      prose_q_uncovered=[] consult_cells=67 consult_rows=67 cells_equal=True consult_rows_resolve=True (the
      shared-folder half reads shared_folder=skipped in CI). The ruling counts: every row carries the
      operator's 2026-10-04 answer; 64 accepted under pass 1, 19 ruled by a numbered question, 13 open (the
      four always-ask rows and nine rows whose design carries no option to accept).
    fix_if: >-
      A non-empty uncovered or prose_q_uncovered list names a fork or open question the list lost: add the
      row, the covers entry or the answered entry. cells_equal
      False means a consult table cell was mis-copied or a consult was edited after pinning (VP 1 catches the
      edit): re-copy the cell text exactly. An order failure means a row's group or binds_at is out of
      sequence: move the row and re-rank.
    hermetic: false
    graduation: not-applicable
  - step: 5
    phase: pre-deploy
    action: Check every consult departure is present with both positions and names a list row
    command: |
      PYTHONPATH=. bin/venv-python -c "import re,yaml,os; F=chr(96)*3; T=open('docs/plans/reports/REPORT-w3-feedback-loop-staging.md',encoding='utf-8').read(); Y={k:v for b in re.findall(F+'yaml\n(.*?)'+F,T,re.S) for k,v in yaml.safe_load(b).items()}
      D=Y['consult_departures']; ids={r['id'] for r in Y['parked_questions']}; CR={(r['consult'],r['pr'],r['cell']):r['row'] for r in Y['consult_rows']}
      dif=[r['row'] for r in D if r['kind'].startswith('consult_differs')]; syn=[r['row'] for r in D if r['kind']=='synthesis_departs_from_consult']; conv=[r['row'] for r in D if r['kind']=='converged']
      named=all(r['row'] in ids for r in D if r['kind']!='converged'); root='/mnt/project-files'; PRS={x['pr'] for x in Y['inputs']['components']}
      if os.path.isdir(root):
          tab=[]
          for ln in open(os.path.join(root,'reports/design-fork-consults-2026-10-03.md'),encoding='utf-8'):
              c=[x.strip() for x in ln.split('|')]
              if len(c)>5 and re.match(r'#[0-9]+\Z',c[1]) and int(c[1][1:]) in PRS and c[4].startswith('differs'): tab.append(CR.get(('2026-10-03',int(c[1][1:]),c[2])))
          for ln in open(os.path.join(root,'reports/design-fork-consults-w1-c10-2026-10-04.md'),encoding='utf-8'):
              c=[x.strip() for x in ln.split('|')]
              if len(c)>4 and c[3].startswith('differs'): tab.append(CR.get(('2026-10-04-c10',1401,c[1])))
          shared='consult_table_differs=%d all_in_departures=%s' % (len(tab),sorted(tab)==sorted(dif))
      else: shared='shared_folder=skipped'
      print('departures=%d consult_differs=%d synthesis_departs=%s converged=%s refines=%d rows_named=%s %s' % (len(D),len(dif),syn,conv,sum(r['kind']=='consult_refines' for r in D),named,shared))"
    expected: >-
      One line: twelve departure rows, six consult-differs rows, the synthesis departures F4 and F13-F14,
      the converged CD.47 row, three refinements, every non-converged row naming a list id, and where the
      shared folder is mounted the consult tables' six differs rows mapping to exactly the six
      consult-differs rows, exactly: departures=12 consult_differs=6 synthesis_departs=['F4', 'F13-F14']
      converged=['CD.47'] refines=3 rows_named=True consult_table_differs=6 all_in_departures=True.
    fix_if: >-
      all_in_departures False means a consult differs row has no departure entry or the consult_rows mapping
      sends it to the wrong id: add the entry or fix the mapping. rows_named False means a departure cites an
      id section 4 does not carry.
    hermetic: false
    graduation: not-applicable
  - step: 6
    phase: pre-deploy
    action: Validate this plan against the PlanDocument schema
    command: bin/venv-python -m scripts.roadmap.plan_document docs/plans/PLAN-w3-feedback-loop-staging.yaml
    expected: The validator reports the plan valid and exits 0.
    fix_if: Fix the reported field (unknown key, missing graduation companion, backtick literal in expected).
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      validate_plan_documents already schema-checks every docs/plans/PLAN-*.yaml in both tiers; a per-plan row
      duplicates it.
  - step: 7
    phase: pre-deploy
    action: Confirm the change is exactly the plan and the report
    command: git fetch --quiet origin main && git diff --name-only origin/main...HEAD
    expected: >-
      Exactly two paths: docs/plans/PLAN-w3-feedback-loop-staging.yaml and
      docs/plans/reports/REPORT-w3-feedback-loop-staging.md. The roadmap, docs/DECISIONS.md and the fixture
      are not among them.
    fix_if: Any other path means scope leaked; revert it.
    hermetic: false
    graduation: not-applicable
  - step: 8
    phase: pre-deploy
    action: Run the fast presubmit tier over the branch
    command: bin/venv-python -m scripts.validate --pre
    expected: Exits 0; PR CI's --pre run is the authoritative gate (Decision 73).
    fix_if: Address the reported issue in the plan or report.
    hermetic: false
    graduation: not-applicable
  - step: 9
    phase: pre-deploy
    action: Guard the staged criteria and CD rule text against contested resolution phrases stated as fact
    command: |
      PYTHONPATH=. bin/venv-python -c "import re,yaml; F=chr(96)*3; T=open('docs/plans/reports/REPORT-w3-feedback-loop-staging.md',encoding='utf-8').read(); Y={k:v for b in re.findall(F+'yaml\n(.*?)'+F,T,re.S) for k,v in yaml.safe_load(b).items()}
      X={'one rec writer':'F13','one writer':'F13','files every loop rec':'F13','two rec writers':'F13','minimum-cell':'#1399 k4','included egress':'seeds','gone quiet':'#1397 k2','typed budget':'#1401 k9','shadow mode':'#1401 k1','effective-dated':'#1401 k3','registered_from':'#1400 k2','fail closed':'#1400 k1 (iv)','standing approval':'#1398 k3','ladder owns the review':'F4','ladder owns the envelope':'F4'}
      M=('consult','refinement','not adopted','option','(a)','(b)','presum','differ','F13','F4','W3-','parked','picks','ruling','ruled','RULINGS','operator')
      texts=[('criteria '+r['item']+' '+r['criterion'],r['text_staged']) for r in Y['staged_criteria']]+[(c['id'],c['title']+'. '+c['detail']) for c in Y['staged_candidate_decisions']]
      hits=[]
      for name,t in texts:
          for sent in re.split(r'(?<=[.])\s+(?=[A-Z])|\s->\s',' '.join(t.split())):
              lead=any(m in sent[:40] for m in ('CONSULT REFINEMENTS','Option (a)','Option (b)','consult','RULINGS','BREACH','NOT RULED'))
              for cl in sent.split('; '):
                  for ph in X:
                      if ph in cl and not lead and not any(m in cl for m in M): hits.append((name,ph))
      print('texts=%d phrases=%d denylist_hits=%s' % (len(texts),len(X),hits))"
