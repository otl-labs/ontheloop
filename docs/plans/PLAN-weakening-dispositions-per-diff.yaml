schema_version: 6
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: weakening-dispositions-per-diff
intent: >-
  Make the weakening-disposition gate judge every PR that introduces a weakening candidate, not only the PR that flips a
  plan's implementation_declared, and stop re-matching entries already on the base, so no build escapes the gate by
  never flipping and a late-closure PR (git-ops.yaml resolves_trailer LATE CLOSURE) no longer fails on its plan's
  build-time entries (rec-5441).
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-weakening-dispositions-per-diff.yaml
phase: >-
  ad_hoc_rec (soft-warn exception category: rec-5441, filed by the rec-5382 planner; no tier_item claimed, so the Tier
  Item Freshness Gate is skipped). No exit criterion closed. A behaviour-changing Python check with no Lambda-packaged
  file and no deploy: V2.
cites: [dec:181, dec:226, dec:235, dec:246, dec:254]
scope:
  - file: scripts/checks/verification/validate_weakening_dispositions.py
    action: Modify
    purpose: >-
      Re-key the gate from the plan flip to the diff. run_check(failed, *, root, base, status_changed, read_base,
      read_head, head=None) derives plans = _common.plan_paths_from_changed over the status_changed paths with status A,
      M or ?? that exist at the head (the working tree when head is None, else the head ref); resolve_declared_plans is
      no longer called by this module. Rules: (1) candidates =
      find_candidates(status_changed, ...) as today; (2) candidates and no touched plan: if every changed path
      (any status) starts with tests/, print a NOTE naming rec-4442 and pass (Decision 226 fast lane, report-only);
      otherwise append one failure naming the candidate keys and the remedy "record each in the build's plan
      weakening_dispositions in this PR (a revert PR: in the reverted build's plan)"; (3) each candidate must match
      exactly one entry across the touched plans' weakening_dispositions at head (missing, unknown, weakening and
      unresolvable-cite rules and messages unchanged; planned-change cites index the touched plans as today); the
      duplicate rule ("has N recorded entries") applies only to this diff's candidate keys and to new or changed
      entries, so two touched plans sharing a base-only key with no candidate pass (16 of 461 recorded keys sit in
      2-5 plans today); (4) stale rule: an entry is checked only when it is new or changed, meaning its mapping is not in that
      plan's weakening_dispositions at base (net-new plan: every entry is new); such an entry naming no candidate
      fails as stale, unless every changed path starts with docs/plans/ (a plan or amendment PR may pre-record
      planned dispositions). Entries already on the base are never re-matched. validate_weakening_dispositions:
      skip on an unreachable base as today; status_changed = _common.get_status_aware_diff(root); no candidates and
      no touched plan prints PASS and declares examined(0); otherwise registry.examined(len(plans),
      unit="touched_plans"). Batched ranges (Decision 254 cl.1/cl.4): when _common.push_context_base(root) returns
      a base and base..HEAD holds more than one first-parent commit, each first-parent commit C is judged alone
      against C^ (its own name-status diff, readers at C^ and C, plan and cite reads at C), so rules written for
      one PR never mix two merges; run_check therefore takes a head ref (None = working tree) used for every plan and
      cite read (the review_dispositions vocabulary is still read from the checkout's contract). The module docstring is rewritten to the new trigger (the "SAME diff ... flips"
      wording goes).
  - file: tests/checks/verification/test_validate_weakening_dispositions_late_closure.py
    action: Create
    purpose: >-
      rec-5441's acceptance file. Real git fixture repos (tmp_path, one base commit, then working-tree edits; local
      helpers, never imported from a test_ module), the contract's review_dispositions written into the fixture, the
      module-level validate_weakening_dispositions called with root=<fixture> and status_diff_base patched to the base
      sha. Nodes: test_late_closure_flip_passes (base plan holds one entry for a candidate its build introduced
      earlier; the diff flips implementation_declared only; red before: stale); test_late_closure_with_registry_shard_passes
      (same plus an added config/agent/verification_registry/entries/<id>.yaml); test_unflipped_build_without_plan_fails
      (a src file and a test assertion change, no plan touched; red before: no flip, no-op);
      test_unflipped_build_missing_entry_fails (plan touched by an unrelated field edit, candidate with no entry;
      red before); test_unflipped_build_with_entry_passes; test_added_entry_naming_no_candidate_fails (a code diff
      adds an entry for a key it does not produce); test_plan_only_diff_may_prerecord_entries (a net-new plan with an
      entry and no other changed file passes); test_base_entries_never_rematched (base holds an entry whose candidate
      is not in the diff; the diff adds a correct second entry for its own candidate; passes);
      test_tests_only_planless_diff_is_report_only (passes, the NOTE names rec-4442, examined declared);
      test_duplicate_entry_across_touched_plans_fails (one candidate key recorded in two touched plans);
      test_shared_base_key_without_candidate_passes (two touched plans share a base-only key, no candidates);
      test_push_range_judges_each_merge_alone (push context patched,
      base..HEAD = a tests-only planless merge then a plan-only pre-record merge: passes, where one merged diff
      would fail on both rules).
  - file: tests/checks/verification/test_validate_weakening_dispositions.py
    action: Modify
    purpose: >-
      Follow run_check's new signature (no resolved= argument; the plan path comes from status_changed) and the
      dropped resolve_declared_plans seam. TestDispositionsRequired keeps its class name (registry shard
      weakening-dispositions-recorded pins it); test_stale_entry_fails, which passes status_changed=[] today, gains a
      non-plan changed path in its fixture so the docs/plans/** exemption does not swallow it, and keeps its
      assertion. TestImplementLegOnly::test_no_flip_is_noop_even_with_candidates is
      replaced by a node pinning the new no-plan rule on a non-tests path. Every existing assertion on a rule this
      plan keeps (missing, duplicate, unknown, weakening, cite resolution, unreachable base) keeps its assertion.
  - file: scripts/checks/verification/validate_weakening_candidates.py
    action: Modify
    purpose: >-
      Docstring only: "the implement-PR leg that makes recording a disposition mandatory" becomes "the gate that makes
      recording a disposition mandatory on every diff with candidates". No code change.
  - file: docs/contracts/implement-scope-boundary.yaml
    action: Modify
    purpose: >-
      Place docs/plans/approved/weakening-dispositions-per-diff.yaml's three blocks: the validate_weakening_dispositions
      CONTENT row's surface label and note restated for the per-diff trigger and stale rule, the residual row's
      "mandatory on implement PRs" pointer restated to match, and one semantic_break amendment_log row (exempt from
      keep_full). Nothing else in the file changes.
  - file: docs/plans/approved/weakening-dispositions-per-diff.yaml
    action: Create
    purpose: Approved-text sidecar binding the contract row wording (Decision 246); approved on the approved-text Environment gate.
  - file: docs/plans/PLAN-weakening-dispositions-per-diff.yaml
    action: Create
    purpose: This plan.
bundled_recommendations: [rec-5441]
followon_recs: []
infrastructure_dependencies: []
acceptance_criteria:
  - A diff that only flips a plan's implementation_declared (with or without its graduated registry shards) passes the gate when the plan's entries were recorded before it; PR #2270's failure class is gone.
  - A diff with weakening candidates that touches no plan fails, unless every changed path is under tests/ (the Decision 226 fast lane stays report-only, rec-4442).
  - A diff that touches a plan is judged against that plan's entries whether or not it flips implementation_declared; missing, duplicate, unknown, weakening and unresolvable-cite entries fail exactly as before.
  - An entry a diff adds or changes that names no candidate in the diff fails as stale, except on a diff that changes only docs/plans/**; entries already on the base are never re-matched.
  - implement-scope-boundary.yaml stays at or under 500 effective lines after the blocks are placed.
  - The implement-scope-boundary.yaml row carries the approved words exactly (validate_merge_step's approved-text leg green), and rec-5441 is closed by the build's merge.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: "rec-5441's acceptance file (red before: the file is absent; with the file and today's module, the late-closure and unflipped-build nodes fail)."
    command: bin/venv-python -m pytest tests/checks/verification/test_validate_weakening_dispositions_late_closure.py -q
    expected: exit 0, every node passed, none failed
    fix_if: a late-closure node reports stale (base entries still re-matched) or an unflipped-build node passes (the flip is still the trigger)
    hermetic: true
    expected_literals: [" passed"]
    graduation: graduate
    graduation_check_id: weakening-dispositions-per-diff
  - step: 2
    phase: pre-deploy
    action: The existing mirror test and the contract-shape tests.
    command: bin/venv-python -m pytest tests/checks/verification/test_validate_weakening_dispositions.py tests/checks/verification/test_validate_weakening_candidates.py tests/test_scope_boundary_contract.py -q
    expected: exit 0, no failures
    fix_if: an existing node fails on a rule this plan keeps (fix the code, never loosen the assertion, Decision 235)
    hermetic: false
    graduation: waive
    graduation_waiver_reason: Re-run of standing mirror and contract tests already guarded by weakening-dispositions-recorded and the scope-boundary contract suite; adds no new guard.
  - step: 3
    phase: pre-deploy
    action: >-
      Real-repo proof of PR #2270's shape: a detached worktree of origin/main with only
      PLAN-actions-sha-pin-non-codeowners flipped to implementation_declared true, judged by this branch's module with
      root pointed at the worktree (red before: today's module reports the recorded entry stale). Then the build
      replays the gate with a scratch script over the last 200 first-parent merges (flip or not, plan touched,
      candidates, old and new verdict) and puts the table in its report.
    command: >-
      W=$(mktemp -d) && git worktree add -q --detach "$W" origin/main
      && printf 'implementation_declared: true\n' >> "$W/docs/plans/PLAN-actions-sha-pin-non-codeowners.yaml"
      && bin/venv-python -c "import sys; from pathlib import Path; from scripts.checks.verification.validate_weakening_dispositions import validate_weakening_dispositions as v; f=[]; v(f, root=Path(sys.argv[1])); print('FAILURES', f); sys.exit(1 if f else 0)" "$W";
      rc=$?; git worktree remove --force "$W"; exit $rc
    expected: exit 0 and "FAILURES []" (the replay table is reported by the build per execution_steps, not checked by this command)
    fix_if: >-
      the worktree run reports a stale entry (base entries still re-matched); a flip merge that passed before fails
      now (a regression on the gated path). If the plan is already declared on main when the build runs, flip any
      other built, undeclared plan with recorded entries instead and say which.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: A one-time measurement on main's real history and today's plan files; step 1 holds the standing guard for the same property.
  - step: 4
    phase: pre-deploy
    action: The approved words are placed exactly.
    command: bin/venv-python -m scripts.roadmap.approved_text verify --slug weakening-dispositions-per-diff --base origin/main
    expected: "APPROVED-TEXT OK"
    fix_if: APPROVED-TEXT MISMATCH (re-place the blocks from the sidecar byte for byte; never edit the sidecar in the build)
    hermetic: false
    graduation: waive
    graduation_waiver_reason: Base-relative to origin/main, so it reads the sidecar as already placed once merged; validate_merge_step's approved-text leg is the standing guard.
  - step: 7
    phase: pre-deploy
    action: The contract stays inside its 500-effective-line cap after the blocks are placed (predicted 492, or 493 if #2071 lands first).
    command: >-
      bin/venv-python -c "from pathlib import Path; from scripts.checks.structural._classify import effective_lines;
      n=effective_lines(Path('docs/contracts/implement-scope-boundary.yaml').read_text(encoding='utf-8')); print('EFFECTIVE', n); assert n <= 500"
    expected: exit 0 and EFFECTIVE at most 500
    fix_if: >-
      over 500: stop; a compaction outside the bound blocks would fail approved_text verify, so the planner routes a
      re-approval carrying an amendment_log compaction block (plan amendment), never a raise
    hermetic: false
    graduation: waive
    graduation_waiver_reason: The structural size gate (validate_structural_size_limits, contracts class) is the standing guard; this step only proves headroom at build time.
  - step: 5
    phase: pre-deploy
    action: >-
      Fast tier, then the full tier before handoff (handoff_policy): bin/venv-python -m scripts.validate --pre in the
      foreground (exit 0), then this command as its own backgrounded run with a 2 h limit from the top-level session.
    command: bin/venv-python -m scripts.validate && bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: "--pre exited 0 first; this command exits 0 for HEAD"
    fix_if: >-
      a failure in this plan's files is fixed at root and the full tier rerun; a failure only in another project's open
      red goes to the operator as the implement skill's go/no-go, and without his word the build waits for that red's
      repair (red-main-recovery.yaml); it never hands off on a non-green full tier by default
    hermetic: false
    graduation: not-applicable
  - step: 6
    phase: post-deploy
    action: Confirm rec-5441 closed after the squash merge (Resolves trailer).
    command: >-
      bin/venv-python -c "from src.common.ducklake_reader_client import make_reader;
      r=make_reader(profile='agent_platform').named('recs_by_ids', ids='rec-5441')[0]; print(r['status']); assert r['status']=='closed'"
    expected: rec-5441 status closed
    fix_if: still open after ci.yml's closure job ran; close it with update_rec citing the merge SHA
    hermetic: false
test_obligations:
  - source: scripts/checks/verification/validate_weakening_dispositions.py
    behavior: A flip-only diff whose plan recorded its entries earlier passes; base entries are never re-matched.
    verification_step: 1
    test_selector: tests/checks/verification/test_validate_weakening_dispositions_late_closure.py::test_late_closure_flip_passes
    red_green_expectation: red before (the recorded entry reads stale), green after.
  - source: scripts/checks/verification/validate_weakening_dispositions.py
    behavior: A diff with candidates that touches no plan and changes a non-test path fails.
    verification_step: 1
    test_selector: tests/checks/verification/test_validate_weakening_dispositions_late_closure.py::test_unflipped_build_without_plan_fails
    red_green_expectation: red before (no flip, so the gate is a no-op), green after.
  - source: scripts/checks/verification/validate_weakening_dispositions.py
    behavior: A tests-only diff with no plan stays report-only and names rec-4442.
    verification_step: 1
    test_selector: tests/checks/verification/test_validate_weakening_dispositions_late_closure.py::test_tests_only_planless_diff_is_report_only
    red_green_expectation: red before (today's module prints the no-flip no-op PASS, not the NOTE naming rec-4442), green after.
  - source: scripts/checks/verification/validate_weakening_dispositions.py
    behavior: An entry a code diff adds that names no candidate in the diff fails as stale (the named Decision 235 boundary).
    verification_step: 1
    test_selector: tests/checks/verification/test_validate_weakening_dispositions_late_closure.py::test_added_entry_naming_no_candidate_fails
    red_green_expectation: red before (no flip, so the gate is a no-op), green after.
  - source: scripts/checks/verification/validate_weakening_dispositions.py
    behavior: A docs/plans/**-only diff may pre-record entries with no candidate.
    verification_step: 1
    test_selector: tests/checks/verification/test_validate_weakening_dispositions_late_closure.py::test_plan_only_diff_may_prerecord_entries
    waiver_reason: Green before and after (today a plan PR flips nothing, so it passes); it pins the plan-PR exemption so the new stale rule cannot swallow it.
  - source: scripts/checks/verification/validate_weakening_dispositions.py
    behavior: Two touched plans sharing a base-only key with no candidate pass (duplicate rule scoped to candidates and new entries).
    verification_step: 1
    test_selector: tests/checks/verification/test_validate_weakening_dispositions_late_closure.py::test_shared_base_key_without_candidate_passes
    waiver_reason: Green before and after (no flip today, so no-op); it pins the scoped duplicate rule against a regression to the old all-entries scan.
  - source: scripts/checks/verification/validate_weakening_dispositions.py
    behavior: In push context a multi-merge range is judged one first-parent commit at a time.
    verification_step: 1
    test_selector: tests/checks/verification/test_validate_weakening_dispositions_late_closure.py::test_push_range_judges_each_merge_alone
    red_green_expectation: red before (the test-only merge and plan-only merge are merged into one no-flip diff and skipped, so the node's assertion that each merge was examined fails), green after.
  - source: scripts/checks/verification/validate_weakening_candidates.py
    behavior: Docstring names the per-diff gate.
    verification_step: 2
    test_selector: tests/checks/verification/test_validate_weakening_candidates.py
    waiver_reason: Docstring-only edit with no behaviour; the existing mirror test re-runs to prove nothing moved.
  - source: docs/contracts/implement-scope-boundary.yaml
    behavior: The CONTENT rows carry the approved words exactly.
    verification_step: 4
    command: bin/venv-python -m scripts.roadmap.approved_text verify --slug weakening-dispositions-per-diff --base origin/main
    red_green_expectation: red before (the words are not placed), green after.
constraints:
  - Every fail rule the gate has today (missing, unknown, weakening, unresolvable cite) keeps its condition and message; the trigger changes, and the stale and duplicate rules reach only this diff's candidates and new or changed entries (Decision 235 cl.1 loosening, confirmed by the operator 2026-11-20).
  - The diff-with-candidates-and-no-plan rule fails closed; its only exception is a diff whose every changed path is under tests/ (Decision 226 fast lane, rec-4442). No marker, waiver or env switch.
  - The contract row is placed from the sidecar byte for byte; the build never edits the sidecar (Decision 246). A wording change after approval needs a new approval run.
  - No edit to git-ops.yaml, _implementation_merge.py, validate_merge_step.py, validate_graduation_completeness.py or red-main-recovery.yaml (rec-5057 and rec-2837 own those files).
  - The build's own test edits produce weakening candidates; code review records them in this plan's weakening_dispositions in the build PR (planned-change citing test_obligations or acceptance_criteria), which the new gate then judges.
  - No rescue agents or workaround loops (Decision 55); never skip or loosen a test to get green (Decision 235).
