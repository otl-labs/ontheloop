schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: wording-approval-routing
intent: >-
  Finish the north-star tier's follow-through (Decision 243 cl.8, rec-5137): the operator keeps a per-change approval
  run only for a declared gated set -- north stars, the decision corpus (a direction entry whole, a mechanism entry's
  Intent line), text that defines a gate, root and CLAUDE.md files and the map itself -- and other wording in
  docs, skills, config and agent prompts is notice class, posted to one GitHub issue he reads in full for seven days,
  then one in five. One new direction
  Decision (amends 83, 165, 187, 243, 246), a new Class D contract docs/contracts/approval-routing.yaml, its check
  validate_approval_routing, a marker-guard kind rule, a kind-blind gate row and a notice-digest workflow. Two build
  PRs: PR 1 is code, inert until the map exists at the diff base; PR 2 carries every sidecar-bound word and flips the
  lane to sampled at its merge.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-wording-approval-routing.yaml
phase: >-
  user_explicit_out_of_scope (operator request 2026-11-12, rec-5137; the follow-through of T4.36, which is complete).
  PR 2 creates tier item T4.38 with c1-c3 met by this plan; no existing criterion is closed.
scope:
  # ---------------------------------------------------------------- PR 1: code, inert until the map exists at the base
  - file: scripts/roadmap/approval_routing.py
    action: Create
    purpose: >-
      PR 1. The routing library (stdlib, yaml and git subprocess only; total, never raises on bad input). load_map(root,
      ref) -> the parsed docs/contracts/approval-routing.yaml at a git ref, or None when absent or unparseable (an
      unparseable map at the ref is reported as a reason, never treated as absent). active(map) -> lane.rung ==
      "sampled". gated_changes(map, root, base, head, changed) -> sorted (file, reason) pairs (head a git ref, or None
      for the working tree; text_at(root, ref, rel) is the shared reader) for changed files
      in the gated set: gated.files entries are exact paths or "**/<name>" (basename at any depth, root included) and
      any change counts; gated.yaml_keys compares each listed top-level key's parsed value at base and head (a file
      that does not parse on either side, or a key present on one side only, counts as changed: fail closed);
      gated.md_sections compares the text from a listed heading to the next heading of the same or higher level, or for
      an entry ending in "." the list item it starts (up to the next numbered item or heading); a section missing on one
      side counts as changed; demoted files (demotions.rows[].file plus reverted_files) count on any change. exempt(map,
      file, base_text, head_text) -> True only when the parsed change is an append to approval-routing.yaml
      demotions.rows or to config/agent/executor/capabilities.yaml boundary_patterns (every base entry kept, in order).
      in_surfaces(map, file) -> True when the file starts with a notice.surfaces prefix and its name ends in one of
      notice.wording_suffixes (so .claude/hooks/*.py and *.sh and .claude/settings.json are not). notice_changes(map,
      root, base, head, changed) -> the changed files not gated and in_surfaces (code, settings, tests and workflows are
      neither class). reverted_files(map, root,
      base) -> the non-gated files, code included (operator 2026-11-12), changed by any commit reachable from base since
      lane.sampled_since whose
      subject starts with "revert" (case-insensitive; this repo's squash reverts, e.g. eb752615) or whose body carries
      "This reverts commit", minus files listed in demotions.restorations; a git failure returns a reason (the caller
      fails closed in pull-request CI). bound_files(root, ref, slug) -> the files docs/plans/approved/<slug>.yaml binds
      at ref (empty when absent). declared_plan(root, sha) -> the slug whose docs/plans/PLAN-<slug>.yaml
      implementation_declared turns true in that commit, else None. parse_map(text) -> the map dict or None (the
      --map-file seam). kind_floor(map) -> int lane.kind_floor or None. No I/O beyond git show, git log and git
      diff-tree under root and reading a given map file. Stays under 300 SLOC.
    new_imports: []
  - file: tests/test_approval_routing.py
    action: Create
    purpose: >-
      Unit nodes over a temp git repo fixture (module-scoped): load_map absent, unparseable and present; parse_map;
      active per rung; each selector (exact path, **/CLAUDE.md at root and at depth, a yaml key value change, a
      comment-only edit outside the key reading notice, a key added on one side, an unparseable head, an md section
      change, a change outside the section reading notice, the "12p." list item, a missing section); exempt for a
      demotions append, a boundary_patterns append, a boundary_patterns removal (not exempt), a reorder (not exempt), a
      demotions append riding with a lane.kind_floor change (not exempt) and a boundary_patterns append riding with a
      removal of another entry (not exempt); notice_changes leaves out scripts/x.py, a tests/ file, a workflow,
      .claude/hooks/x.py, .claude/hooks/x.sh and .claude/settings.json and keeps .claude/skills/x/SKILL.md and a
      config/ yaml; reverted_files for a "revert: ..." subject, a
      "This reverts commit" body, a reverted .py (listed), a reverted gated file (not listed: already gated), a
      restoration and a revert before sampled_since;
      bound_files present and absent; declared_plan for a flipping commit and a non-flipping one; kind_floor. Also a
      node pinning that config/agent/executor/capabilities.yaml boundary_patterns lists
      docs/contracts/approval-routing.yaml, approval_routing and notice_digest (red before the capabilities edit).
  - file: scripts/checks/roadmap/validate_approval_routing.py
    action: Create
    purpose: >-
      PR 1. @register'd check validate_approval_routing(failed, root=None, base=None, changed=None, event=None) (seams
      for fixtures). Push context (_common.push_context_base) calls registry.skipped("push context") and returns (Decision
      170 accounting). changed defaults to every path of _common.get_status_aware_diff(root) (deleted rows kept,
      --no-renames, so a deleted or renamed gated file, the map included, is a change; get_changed_files drops
      deletions). base = status_diff_base or
      origin/main; the map is read AT THE BASE (approval_routing.load_map); absent or not active prints "inert: lane not
      on sampled at <base>" and registry.examined(0). Leg P: each gated change with no plan in
      _common.resolve_declared_plans(changed, root, base) whose base sidecar (approved_text.load_sidecar_at) has a block
      on that file is a finding naming the file and selector: "gated text changed with no declared plan's base sidecar
      binding it; route it through /plan and a sidecar, or the operator merges in the GitHub UI (Decision 83)". Leg B:
      for each sidecar docs/plans/approved/<slug>.yaml in changed whose approved_text.sidecar_state is added or changed
      (where the operator's reading mode is set; a build PR or an amendment that leaves a sidecar approved before the
      switch untouched is not re-judged), each drafted Decision in that head sidecar
      (plan_decision_drafts.drafted_entries) whose kind is mechanism is a finding when any of these holds: the sidecar
      drafts more than one Decision (one blind row cannot speak for two drafts; a label only escalates); the plan
      docs/plans/PLAN-<slug>.yaml has no gate_rounds row with gate kind-blind, or its last one reads direction; its amends list names an entry whose
      kind at the base (scripts.decisions_md) is direction or missing. A reverted_files git failure is a finding (fail
      closed). Findings
      fail only when GITHUB_EVENT_NAME is pull_request; elsewhere each prints ADVISORY and nothing fails (the
      validate_merge_step pattern). Reads the map basename literal docs/contracts/approval-routing.yaml through its
      one-hop import (Decision 168 evidence leg). Stays under 250 SLOC.
    new_imports: [scripts.roadmap.approval_routing, scripts.roadmap.plan_decision_drafts]
  - file: scripts/checks/roadmap/_manifest.py
    action: Modify
    purpose: >-
      PR 1. One Entry: name validate_approval_routing, module scripts.checks.roadmap.validate_approval_routing, attr
      validate_approval_routing, pre=True with pre_globs None (always in --pre: a demoted file can be any path, and the
      check is a handful of git reads), full_segment full_after_lint.
    new_imports: []
  - file: tests/checks/roadmap/test__manifest.py
    action: Modify
    purpose: "One node: the validate_approval_routing Entry is pre with no pre_globs and full_segment full_after_lint. Existing nodes unchanged."
  - file: tests/checks/roadmap/test_validate_approval_routing.py
    action: Create
    purpose: >-
      Temp-repo fixture with a map on sampled at the base: a gated-file change with no plan -> FAIL under
      event=pull_request and ADVISORY (no failure) under event=None; the same change with a declared plan whose base
      sidecar binds the file -> PASS; a plan whose sidecar binds another file -> FAIL; a notice-class change -> PASS;
      a map at read_all -> inert; no map -> inert; a map only at HEAD (this build's PR 2 shape) -> inert; push context ->
      registry.skipped; a code-only change -> PASS; a deleted gated file and the deleted map -> FAIL; a demoted file, a
      reverted wording file and a reverted .py -> FAIL without a sidecar; a reverted_files git failure -> FAIL under
      pull_request; leg B:
      a mechanism draft with no kind-blind row, with a row reading direction, amending a direction entry, and beside a
      second draft with a row reading mechanism -> FAIL; a sole draft with a row reading mechanism amending a mechanism
      entry -> PASS; a build PR whose unchanged pre-switch sidecar drafts a mechanism entry with no row -> PASS; a
      direction draft needs no row; an appended demotion row alone -> PASS.
  - file: scripts/checks/_marker_guard.py
    action: Modify
    purpose: >-
      PR 1. Unconditional calls only, so every token's guard (check_diff, check_state_diff, check_present_markers)
      inherits the kind rule through authorization_failure and the module stays at 100% under its own mirror: the two
      success returns (the cited body, and the supersession hop target) return
      _marker_guard_state_options.kind_failure(number, body, _common.ROOT) instead of False, and the existing import
      from that module gains kind_failure. __all__ and the nine-name binding surface are unchanged. About 4 SLOC (429
      today, headroom 71). tests/checks/test__marker_guard.py is not edited (2 SLOC headroom); its nodes still reach
      both returns.
    new_imports: []
  - file: scripts/checks/_marker_guard_state_options.py
    action: Modify
    purpose: >-
      PR 1. The kind rule as an opt-in branch, where this module's docstring puts every such branch (no new module; every
      pre_glob naming _marker_guard.py already names this file). kind_failure(number, body, root) -> bool reads
      root/docs/contracts/approval-routing.yaml from the working tree with yaml, never a subprocess (Decision 153's
      composite-guard budget; a change to the map is itself gated, so a PR cannot loosen the floor without an approved
      sidecar), memoized per (root, the file's mtime_ns). Absent, or lane.rung not sampled -> False (inert). Present
      but unparseable, or on sampled without an int lane.kind_floor -> True only when the body's envelope kind is
      mechanism (fail closed on the stricter side). Int floor -> True when number > floor and the envelope kind
      (scripts.decisions_md.extract_entry_envelope, this module's existing import source) is not direction; an entry
      with no kind reads as direction (decision-kind.yaml consumer_contract). When it returns True it prints one line,
      "kind rule: Decision <n> is above kind_floor <floor> and is not direction (approval-routing.yaml); cite a
      direction entry", so the callers' "does not authorize (mention ...)" line is not read as a missing mention. About
      30 SLOC.
    new_imports: []
  - file: tests/checks/test__marker_guard_state_options.py
    action: Modify
    purpose: >-
      Two new nodes only (VP 4 names them). test_kind_failure_reads_the_floor, over tmp_path roots: a map at sampled with kind_floor 300 -> a mechanism body numbered 301 fails;
      301 direction passes; 301 with no kind passes; 300 mechanism passes (at the floor); a map at read_all passes; no
      map passes; an unparseable map -> mechanism 250 fails, direction passes; a map on sampled without an int
      kind_floor -> mechanism fails, direction passes; the refusal prints the kind-rule line; an edited map is re-read
      (mtime).
      test_kind_rule_through_authorization_failure, through _marker_guard.authorization_failure with _common.ROOT monkeypatched to the tmp root: a 301 mechanism body naming
      the key fails, a 301 direction body naming it passes, and the supersession hop to a mechanism target above the
      floor fails. Existing nodes unchanged.
  - file: scripts/roadmap/plan_gate_rounds.py
    action: Modify
    purpose: >-
      PR 1. _GATE_VERDICTS gains "kind-blind": {mechanism, direction} and the gate Literal gains "kind-blind"; the
      existing non-wording-check rule already refuses digest, base and selection on it, and a new rule refuses a
      kind-blind row with blocking or nits above 0 or escalated true. Docstring
      names it: the verdict a fresh subagent gave, shown only plan_obligations --blind-drafts output (planning SKILL.md 8b).
    new_imports: []
  - file: tests/test_plan_gate_rounds.py
    action: Modify
    purpose: "One new node, test_kind_blind_rows (VP 5 names it): a kind-blind row with each verdict parses; an unknown verdict, a digest and a blocking count are rejected. Existing nodes unchanged."
  - file: scripts/roadmap/plan_decision_drafts.py
    action: Modify
    purpose: >-
      PR 1. Two public functions beside the report: drafted_entries(plan_path, root) -> one dict per drafted Decision in
      the plan's sidecar blocks on docs/DECISIONS.md (keys title, kind (the value or None), amends, block), reusing
      _sidecar_contents and extract_entry_envelope; amends is the envelope's amends list, else
      scripts.decisions_md.extract_amends_edges(title) (the parse_decisions_md order, so a title-only "(amends Decision
      N)" still counts). blind_text(block) -> the block with the envelope's kind mapping (key, value and justification
      lines) removed and nothing else changed. The module stays total; its docstring's "nothing here feeds a gate
      verdict" becomes: the report is advisory, and validate_approval_routing's leg B reads drafted_entries.
    new_imports: []
  - file: tests/test_plan_decision_drafts.py
    action: Modify
    purpose: "One new node, test_drafted_entries_and_blind_text (VP 5 names it): drafted_entries on a fixture plan with one mechanism and one direction draft, and amends taken from a title when the envelope has none; blind_text drops exactly the kind mapping and keeps significance, amends and the body. Existing nodes unchanged."
  - file: scripts/roadmap/plan_obligations.py
    action: Modify
    purpose: >-
      PR 1. A third mutually exclusive CLI option --blind-drafts <plan>: prints each drafted Decision through
      plan_decision_drafts.blind_text, separated by a line "---", and nothing else (no findings, no kind); exit 0.
    new_imports: []
  - file: tests/test_plan_obligations.py
    action: Modify
    purpose: >-
      One new node, test_blind_drafts_cli (VP 5 names it; this file is plan_obligations.py's coverage mirror, 25 SLOC
      headroom): the CLI on a fixture plan prints both drafts without the word "kind:" and with their Intent lines, and
      the option excludes --plan and --decision-draft. Existing nodes unchanged.
  - file: scripts/ci/notice_digest.py
    action: Create
    purpose: >-
      PR 1. CLI --before SHA --after SHA [--map-file PATH] [--dry-run]. For each commit in before..after (oldest first;
      an all-zero before reads only after): the map at the commit's parent (approval_routing.load_map), or the one
      --map-file map for every commit (approval_routing.parse_map; the replay seam). A commit whose map is absent or
      not on sampled prints "inert: lane not on sampled at <parent sha>" and adds no row. One row per commit with
      notice changes (approval_routing.notice_changes, so only wording surfaces): "PR #<n from the subject's (#n)>
      <subject> | plan <slug>: <first sentence of its intent, 200 chars max> | notice: <files, first 10, then +k> |
      tripwires: <gated files the declared plan's sidecar at the parent does not bind, demoted files, or none> | sample:
      <yes when int(sha, 16) % 5 == 0>"; the plan is approval_routing.declared_plan(sha), its sidecar
      approval_routing.bound_files(root, parent, slug), else "none" and every gated file is a tripwire. Without
      --dry-run it posts each row as its own comment (one comment per merged commit, as the map's notice.digest says)
      with gh: the open issue labelled notice-digest (gh issue list),
      creating the label and the issue (title "Notice digest (wording approval lane)") when absent; body passed by
      file, never interpolated into a shell. With no rows it prints "no notice-class changes". Imports only stdlib,
      yaml and scripts.roadmap.approval_routing (the workflow installs pyyaml alone). Stays under 250 SLOC.
    new_imports: [scripts.roadmap.approval_routing]
  - file: tests/ci/test_notice_digest.py
    action: Create
    purpose: >-
      Temp-repo fixture: an inert line and no row with no map and on read_all; --map-file overrides the parent's map;
      one row for a notice-class commit with the plan's intent; nothing for a code-only or gated-only commit; tripwires
      for an unbound gated file and a demoted file; the sample flag follows int(sha, 16) % 5 for two fixed shas;
      posting with subprocess.run and subprocess.Popen both mocked: an existing issue gets gh issue comment with
      --body-file; a missing issue creates label then issue first; --dry-run calls no gh. Also parses
      .github/workflows/notice-digest.yml: on push to main only; permissions exactly contents read and issues write;
      no concurrency key (GitHub cancels a pending run in a shared group, which would drop its rows); fetch-depth 0; no
      workflow_dispatch; the pyyaml pin equals requirements.txt's; the map step precedes setup-python and every later step
      carries its present condition; before and
      after reach run text only through env, never through ${{ }}.
  - file: .github/workflows/notice-digest.yml
    action: Create
    purpose: >-
      PR 1. name: notice-digest (the ci_rca_taxonomy key); on push branches [main]; permissions contents read, issues
      write; no concurrency group (each run digests
      only its own push's range, so runs never share work, and a shared group would cancel a pending run and lose its
      rows); one job, ubuntu-latest, timeout 10 min: actions/checkout@v7 fetch-depth 0; a shell step (id map) that
      writes present=false to GITHUB_OUTPUT when git cat-file finds docs/contracts/approval-routing.yaml at neither
      BEFORE (when not all zeros) nor AFTER, else present=true; every later step has if: steps.map.outputs.present ==
      'true', so an inert push installs nothing; actions/setup-python@v7 3.12; python -m pip install pyyaml at requirements.txt's pin
      (pyyaml==6.0.3 today); then python -m scripts.ci.notice_digest --before "$BEFORE" --after "$AFTER" with
      BEFORE/AFTER and GH_TOKEN (github.token) in env. No AWS credentials, no secrets, no workflow_dispatch (nothing
      for the dispatcher plan's bot guard to cover).
  - file: config/ci_rca_taxonomy.yaml
    action: Modify
    purpose: >-
      PR 1. function_to_category gains validate_approval_routing: schema_drift; workflows gains notice-digest as one
      flow-style line (tier not_a_gate, ci_rca watched, owner `platform` as every row's value, rationale: a failed run means the operator's
      notice read misses rows); validate_ci_rca_taxonomy requires every workflow name in that map. NEAR_CAP (498 of 500
      effective lines on main b4004297, so the two lines reach 500 exactly, and other unbuilt plans add rows): measure
      at build time; if the two lines
      would pass 500, compact existing multi-line rationale scalars to one line each (Decision 166 relief valve,
      prose only, no key or value changed) until it fits; never a raise.
    new_imports: []
  - file: config/agent/executor/capabilities.yaml
    action: Modify
    purpose: >-
      PR 1. boundary_patterns gains one commented group (Decision 235 cl.5 floor; PLAN-wording-approval-routing):
      docs/contracts/approval-routing.yaml, approval_routing (the library, the check and their tests), notice_digest
      (the CLI and its test). scripts/checks/_marker_guard and tests/checks/test__marker_guard already cover the kind
      rule and its test file; .github/workflows/ covers the workflow. Append only.
    new_imports: []
  # ---------------------------------------------------------------- PR 2: the wording and the switch (all sidecar-bound text)
