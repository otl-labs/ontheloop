rollback: >-
  Before PR 2 merges, revert PR 1 alone (nothing reads its code). After PR 2, the fast rollback is a new rollback plan
  (this plan is already declared, so an amendment to it can never satisfy leg P) whose sidecar and build set lane.rung
  to read_all (every reader goes inert and the old always-ask reading returns, Decision {{N}}
  on_trigger); that plan also re-words coordinator.yaml always_ask, which otherwise still says other wording needs
  no word, so it is one sidecar covering both files. A full revert of PR 2 then PR 1 follows the same route. The
  operator's GitHub-UI merge is the valve if the check itself wedges, and the immediate route for an urgent rollback.
