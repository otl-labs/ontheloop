    action: Modify
    purpose: >-
      PR 2. Exactly the sidecar's blocks decision-new (the new Decision, inserted newest first), decision-83-note,
      decision-165-note, decision-187-note, decision-243-note and decision-246-note. {{N}} is the next free Decision
