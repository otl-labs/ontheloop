constraints:
  - "Build order: PR 1 merges first; PR 2 starts from a base containing PR 1 (VP 9). No PR 1 marker or budget raise may cite this plan's Decision, which exists only from PR 2."
  - "PR 1 is inert by construction: every new reader reads the map at the diff base, and the map exists only from PR 2's merge. PR 2's own check run reads no map at its base, so the switch cannot block itself."
  - "All sidecar-bound words land in PR 2, which flips implementation_declared (validate_merge_step verifies a declared plan's sidecar only in that PR, and verify binds whole files); PR 1 edits no file the sidecar binds."
  - "The Decision, contract, skill, roadmap and test-pin text is operator-approved; place it exactly, never re-word; a moved anchor is a plan-defect report. {{N}} is VP 9's next_decision; {{DATE}} the build date UTC. A tool renumber after that follows coordinator.yaml approvals (clean renumber)."
  - "No git-ops.yaml edit (one line of headroom; approved_text_binding stays the mechanism the map points to). No plan-critique SKILL.md edit (0 bytes headroom; the blind label is the separate kind-blind subagent). No edit to docs/contracts/personas/plan_critic.yaml (Agents in GitHub)."
  - "The workflow posts only to an issue in this repository with the job token; no AWS role, no secret, no workflow_dispatch. Workflow and hook-adjacent code is a CODEOWNERS path: PR 1 merges with the operator's word on the final diff besides code review PROCEED and green CI."
  - "Existing tests change only by the two sidecar-approved blocks; tests/checks/test__marker_guard.py is not edited. The plan declares no weakening disposition: if validate_weakening_candidates lists any candidate, stop and send a plan-defect report (Decision 235)."
  - "Never edit CI Reform's tests/checks/decisions/test_sit_decision_records.py."
  - No rescue agents or workaround loops (Decision 55).
