    PLAN-persona-trigger-policy disposition: the deploy gate's watched paths exclude the roadmap and its one runtime
    reader runs only from the disabled scheduled-agent dispatcher): no build, deploy or smoke step. The workflow uses
    only the job's GITHUB_TOKEN (contents read, issues write), no AWS role, no secret, no spend.
acceptance_criteria:
  - rec-5137's acceptance (tests/checks/contracts/test_approval_routing_contract.py::test_kind_routes_wording_approvals) exits 0.
  - With the map on sampled at the base, validate_approval_routing fails in pull-request CI a PR that changes, deletes or renames gated text (the map included) no declared plan's base sidecar binds, a demoted or reverted file without a sidecar, and, in a PR that adds or changes a sidecar, a drafted mechanism Decision that is not its plan's only draft, has no kind-blind row reading mechanism, or amends a direction entry; it is inert with no map or on read_all, advisory outside pull-request CI and skipped on a push.
  - The shared marker guard refuses, for every token, a cited entry numbered above the map's kind_floor unless its kind is direction; dec-250's existing marker still authorizes (250 is below the floor).
  - notice-digest.yml posts one comment per merged commit with notice-class changes to the open issue labelled notice-digest, one run per push with no shared concurrency group, and posts nothing while the lane is absent or on read_all.
  - Replayed over real main history with the sidecar's map, the classifier marks every changed gated.files path and every changed gated yaml_keys file whose listed key moved as gated, lists as notice only files under the notice surfaces with a wording suffix, and the revert detector's count on that window is printed (VP 7).
  - The Decision, notes and contracts carry exactly the sidecar's 25 blocks (approved_text verify exits 0) and every existing test passes with no assert line changed outside the two sidecar-approved test blocks.
  - After PR 2 merges, rec-5137 reads closed, T4.38 reads complete, and the coordinator's shared copy matches coordinator.yaml at the merge commit.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: PR 1 premises on the build's base, before any edit.
    command: >-
      bin/venv-python -c "import pathlib, yaml; c=yaml.safe_load(open('docs/contracts/coordinator.yaml', encoding='utf-8'));
      k=pathlib.Path('docs/contracts/decision-kind.yaml').read_text(encoding='utf-8');
      g=pathlib.Path('scripts/checks/_marker_guard.py').read_text(encoding='utf-8');
      print('map_absent=' + str(not pathlib.Path('docs/contracts/approval-routing.yaml').exists())
      + ' coordinator_v4=' + str(c['contract']['contract_version'] == 4) + ' kind_inert=' + str('kind grants and gates nothing' in k)
      + ' guard_surface=' + str(g.count('def authorization_failure(') == 1)
      + ' library_absent=' + str(not pathlib.Path('scripts/roadmap/approval_routing.py').exists()))"
    expected: One line, every field True.
    fix_if: A False means a premise moved (another plan edited these files first); stop and send a plan-defect report.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: Red-before premise evidence this build itself makes false; steps 2-6 are the standing guards.
  - step: 2
    phase: pre-deploy
    action: PR 1. The routing library's unit tests.
    command: bin/venv-python -m pytest tests/test_approval_routing.py -q
    expected: exit 0, all nodes pass; red before (module absent).
    fix_if: a selector reads a gated change as notice, an unparseable side reads unchanged, or a removal reads exempt
    hermetic: true
    expected_literals: [" passed"]
    graduation: graduate
    graduation_check_id: approval-routing-selectors
  - step: 3
    phase: pre-deploy
    action: PR 1. The check's legs and its manifest entry.
    command: bin/venv-python -m pytest tests/checks/roadmap/test_validate_approval_routing.py tests/checks/roadmap/test__manifest.py -q
    expected: exit 0, all nodes pass; red before (check absent).
    fix_if: an unbound gated change passes in pull-request CI, the check fails outside it, or a map only at HEAD activates it
    hermetic: true
    expected_literals: [" passed"]
    graduation: graduate
    graduation_check_id: approval-routing-check-legs
  - step: 4
    phase: pre-deploy
    action: PR 1. The marker kind rule, through the shared guard; the existing guard suites stay green unedited.
    command: >-
      bin/venv-python -m pytest tests/checks/test__marker_guard_state_options.py::test_kind_failure_reads_the_floor
      tests/checks/test__marker_guard_state_options.py::test_kind_rule_through_authorization_failure
      tests/checks/test__marker_guard.py -q
    expected: exit 0, all nodes pass; red before (the two named nodes are absent).
    fix_if: a mechanism entry above the floor authorizes, an entry at or below it is refused, or an existing node fails
    hermetic: true
    expected_literals: [" passed"]
    graduation: graduate
    graduation_check_id: marker-guard-kind-floor
  - step: 5
    phase: pre-deploy
    action: PR 1. The kind-blind gate row, the draft helpers and the --blind-drafts CLI.
    command: >-
      bin/venv-python -m pytest tests/test_plan_obligations.py::test_blind_drafts_cli
      tests/test_plan_gate_rounds.py::test_kind_blind_rows tests/test_plan_decision_drafts.py::test_drafted_entries_and_blind_text -q
    expected: exit 0, all nodes pass; red before (the three named nodes are absent).
    fix_if: blind_text leaves a kind line or drops anything else, or a kind-blind row accepts a digest
    hermetic: true
    expected_literals: [" passed"]
    graduation: graduate
    graduation_check_id: kind-blind-gate-row
  - step: 6
    phase: pre-deploy
    action: PR 1. The digest composer, poster and workflow shape.
    command: bin/venv-python -m pytest tests/ci/test_notice_digest.py -q
    expected: exit 0, all nodes pass; red before (module and workflow absent).
    fix_if: a line appears while inert, the body reaches a shell, or the workflow gains a permission or a dispatch trigger
    hermetic: true
    expected_literals: [" passed"]
    graduation: graduate
    graduation_check_id: notice-digest-composer
  - step: 7
    phase: pre-deploy
    action: >-
      PR 1. Live replay on real data with the approved map (the sidecar's routing-contract block, placeholders filled):
      classify the last 40 commits of origin/main and check each against an independent reading of gated.files and
      yaml_keys; print the revert detector's result over 2026; then a digest dry-run of the newest commit through
      --map-file.
    command: >-
      M=$(mktemp) && bin/venv-python -c "import pathlib, subprocess, yaml; from scripts.roadmap import approval_routing as r;
      sc=yaml.safe_load(open('docs/plans/approved/wording-approval-routing.yaml', encoding='utf-8'));
      text=next(b['after'] for b in sc['blocks'] if b['id'] == 'routing-contract').replace('{{N}}', '9999').replace('{{DATE}}', '2026-01-01');
      pathlib.Path('$M').write_text(text, encoding='utf-8'); m=r.parse_map(text); root=pathlib.Path('.');
      run=lambda *a: subprocess.run(['git', *a], capture_output=True, text=True).stdout;
      key=lambda ref, f, k: (yaml.safe_load(run('show', ref + ':' + f) or '{}') or {}).get(k);
      rows=[(s, f, {x for x, _ in r.gated_changes(m, root, s + '^', s, f)}, set(r.notice_changes(m, root, s + '^', s, f)))
      for s in run('rev-list', '--max-count=40', 'origin/main').split() for f in [run('diff-tree', '--no-commit-id', '--name-only', '-r', s).split()]];
      want=lambda s, f: {x for x in f if x in m['gated']['files'] or pathlib.PurePosixPath(x).name == 'CLAUDE.md'}
      | {x for x in f if x in m['gated']['yaml_keys'] and any(key(s + '^', x, k) != key(s, x, k) for k in m['gated']['yaml_keys'][x])};
      [print(s[:8], 'gated', len(g), 'notice', len(n), 'ok', want(s, f) <= g and all(x.startswith(tuple(m['notice']['surfaces'])) and x.endswith(tuple(m['notice']['wording_suffixes'])) for x in n))
      for s, f, g, n in rows]; print('reverted', r.reverted_files(m, root, 'origin/main'))"
      && bin/venv-python -m scripts.ci.notice_digest --before origin/main~1 --after origin/main --map-file "$M" --dry-run
    expected: >-
      40 lines each ending ok True, with a mix of gated and notice counts across the window; one "reverted" line (record
      its file count in the build report: the measured recall of the revert leg); then the dry-run prints either one
      row in the documented shape or "no notice-class changes", never an inert line (the map file is on sampled).
    fix_if: >-
      ok False (a selector misses a gated file or key, or a file outside the wording surfaces or suffixes reads as
      notice), every commit all-gated or all-notice,
      a reason string on the reverted line, or the dry-run errors or prints inert
    hermetic: false
    graduation: waive
    graduation_waiver_reason: Reads real main history, which moves; steps 2, 3 and 6 graduate the same behaviour hermetically.
  - step: 8
    phase: pre-deploy
    action: >-
      PR 1 and PR 2, each before handoff (handoff_policy): fast tier, then the full tier as one backgrounded Bash call
      with a 2 h limit from the top-level session.
    command: >-
      bin/venv-python -m scripts.validate --pre && bin/venv-python -m scripts.validate &&
      bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: exit 0; --verify-head reads the full tier's recorded verdict for HEAD, never the backgrounded run's own exit status
    fix_if: >-
      a failure in this plan's files is fixed at root and the full tier rerun from the start; a failure only in another
      open red's tests is not this build's to fix: log it and follow the implement skill's go/no-go
    hermetic: false
    graduation: not-applicable
  - step: 9
    phase: pre-deploy
    action: PR 2 premises on the build's base, before any edit; prints {{N}}.
    command: >-
      bin/venv-python -c "import pathlib, re; t=pathlib.Path('docs/DECISIONS.md').read_text(encoding='utf-8');
      nums=[int(n) for n in re.findall(r'^## Decision (\\d+):', t, re.M)];
      print('next_decision=' + str(max(nums) + 1) + ' pr1_merged=' + str(pathlib.Path('scripts/roadmap/approval_routing.py').exists()
      and 'kind_failure' in pathlib.Path('scripts/checks/_marker_guard.py').read_text(encoding='utf-8')
      and 'def kind_failure(' in pathlib.Path('scripts/checks/_marker_guard_state_options.py').read_text(encoding='utf-8')
      and pathlib.Path('.github/workflows/notice-digest.yml').exists())
      + ' map_absent=' + str(not pathlib.Path('docs/contracts/approval-routing.yaml').exists()))"
    expected: One line, next_decision=<number> (that is {{N}}), pr1_merged=True, map_absent=True.
    fix_if: pr1_merged=False means PR 1 has not merged (wait); map_absent=False means a premise moved (plan-defect report)
    hermetic: false
    graduation: waive
    graduation_waiver_reason: Red-before premise evidence this build itself makes false; step 10 binds the words.
  - step: 10
    phase: pre-deploy
    action: PR 2. Bind the Decision, notes, contracts, skill and the two test pins to the approved words (T4.38 is outside the sidecar).
    command: >-
      bin/venv-python -m scripts.roadmap.approved_text verify --slug wording-approval-routing --base origin/main
      --expect 5bff863a54b7f059288ba94ca6cabbf5a404c18683e599353e097d2e601ada8f
    expected: exit 0; all twenty-five blocks match
    fix_if: any word differs from the sidecar; fix the edit, never the sidecar (operator-approved text)
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      PR-relative to origin/main, so vacuous once merged; validate_merge_step's approved-text leg enforces the sidecar on
      every PR declaring this plan.
  - step: 11
    phase: pre-deploy
    action: PR 2. The new contract test (rec-5137's acceptance) over the real map, the two pinned suites, and the check's fixture suite on the PR 2 tree.
    command: >-
      bin/venv-python -m pytest tests/checks/contracts/test_approval_routing_contract.py
      tests/checks/contracts/test_coordinator_contract.py tests/test_scope_boundary_contract.py
      tests/checks/roadmap/test_validate_approval_routing.py -q
    expected: exit 0, all nodes pass; test_approval_routing_contract.py is red before (map absent).
    fix_if: a map entry names a missing file, key or heading (fix the placement or send a plan-defect report; never the sidecar)
    hermetic: true
    expected_literals: [" passed"]
    graduation: graduate
    graduation_check_id: approval-routing-map-integrity
  - step: 12
    phase: pre-deploy
    action: >-
      PR 2, when its PR opens and before it merges: name the unbuilt plans the switch reaches -- plan_lint's unbuilt set
      (added in the last 30 days, schema_version 4 or later, implementation_declared not true) whose scope edits a file
      in the new gated set that its own sidecar does not bind.
    command: >-
      bin/venv-python -c "import pathlib, yaml; from scripts.roadmap.plan_lint.headroom import _recent_plan_paths;
      m=yaml.safe_load(open('docs/contracts/approval-routing.yaml', encoding='utf-8'));
      g=set(m['gated']['files']) | set(m['gated']['yaml_keys']) | set(m['gated']['md_sections']);
      hit=lambda f: f in g or pathlib.PurePosixPath(f).name == 'CLAUDE.md';
      load=lambda p: (yaml.safe_load(p.read_text(encoding='utf-8')) if p.exists() else None) or {};
      [print(rel, sorted(miss)) for rel in _recent_plan_paths(pathlib.Path('.')) for d in [load(pathlib.Path(rel))]
      if isinstance(d.get('schema_version'), int) and d['schema_version'] >= 4 and d.get('implementation_declared') is not True
      and not rel.endswith('PLAN-wording-approval-routing.yaml')
      for sc in [load(pathlib.Path('docs/plans/approved') / (pathlib.PurePosixPath(rel).stem.removeprefix('PLAN-') + '.yaml'))]
      for miss in [{s.get('file', '') for s in d.get('scope') or [] if hit(s.get('file', ''))} - {b.get('file') for b in sc.get('blocks') or []}]
      if miss]; from scripts.roadmap.plan_decision_drafts import drafted_entries;
      [print(rel, 'leg B on its next sidecar change: mechanism draft', e['title'][:60]) for rel in _recent_plan_paths(pathlib.Path('.'))
      if not rel.endswith('PLAN-wording-approval-routing.yaml') and load(pathlib.Path(rel)).get('implementation_declared') is not True
      for e in drafted_entries(pathlib.Path(rel), pathlib.Path('.')) if e['kind'] == 'mechanism']"
    expected: >-
      Zero or more lines "<plan> [files]" (about 14 plans were in the unbuilt set at planning time), then zero or more
      "leg B on its next sidecar change" lines (PLAN-persona-verdict-credential's mechanism draft at planning time: its
      build passes, since leg B runs only where a sidecar is added or changed). Send them to the coordinator before PR 2
      merges, so it can sequence the switch: each listed plan needs a sidecar amendment before
      its build reaches PR CI, or builds before PR 2 merges (a yaml_keys file counts here even when the build would
      touch only notice keys, so a line is a prompt to check, not a defect).
    fix_if: the command errors (fix the command per the map's shape, never the map)
    hermetic: false
    graduation: waive
    graduation_waiver_reason: Informational routing list over a moving set of unbuilt plans; no pass/fail to graduate.
  - step: 13
    phase: post-deploy
    action: >-
      After PR 2's squash merge, confirm the rec closed, T4.38 complete and the digest inert for the merge itself (the
      map is absent at the merge's parent); then read the notice-digest.yml run for that merge commit through
      mcp__github__actions_list (workflow runs, head_sha the merge commit) and record its run id and conclusion. The
      first real comment, with the job token creating the label and issue, stays UNPROVEN until the first notice-class
      merge after the switch; the build report says so.
    command: >-
      git fetch -q origin main && M=$(git log origin/main --diff-filter=A --format=%H -- docs/contracts/approval-routing.yaml | tail -1)
      && bin/venv-python -c "import subprocess, yaml; from src.common.ducklake_reader_client import make_reader, fetch_recs_by_ids;
      r=yaml.safe_load(subprocess.run(['git', 'show', 'origin/main:docs/ROADMAP-PLATFORM.yaml'], capture_output=True, text=True, check=True).stdout);
      item=next(i for i in r['tier_items'] if i['id'] == 'T4.38');
      print(item['status'], sorted((x['id'], x['status']) for x in fetch_recs_by_ids(make_reader(profile='agent_platform'), ['rec-5137'])[0]))"
      && bin/venv-python -m scripts.ci.notice_digest --before "$M~1" --after "$M" --dry-run
    expected: >-
      prints complete [('rec-5137', 'closed')], then one line "inert: lane not on sampled at <the merge's parent sha>"
      and no row; the notice-digest run for the merge commit concluded success (its map step found the map at AFTER, and
      the digest printed the same inert line)
    fix_if: >-
      rec still open after the closure job: read its log; a Decision 186 or 201 refusal routes per git-ops
      resolves_trailer (merge_step recover), never a hand close; T4.38 absent means the bookkeeping block was dropped
    hermetic: false
  - step: 14
    phase: post-deploy
    action: Refresh the coordinator's shared copy (coordinator.yaml surfaces.delivery) and prove it current.
    command: >-
      bin/venv-python -m scripts.session.coordinator_copy write /mnt/project-files/coordinator/ &&
      bin/venv-python -m scripts.session.coordinator_copy check /mnt/project-files/coordinator/
    expected: exit 0 from both; the copy's header names the merge commit
    fix_if: >-
      the shared store is not mounted on this surface: record it and ask the coordinator to have a worker run it; a stale
      check after write is a coordinator_copy defect (file a rec)
    hermetic: false
