  - "Report: what was implemented, verification results, the four closure-evidence facts, both merge SHAs, VP 7, 12 and 13 results."
rollback: >-
  Before PR 2 merges, revert PR 1 alone (nothing reads its code). After PR 2, the fast rollback is a sidecar-bound plan
  amendment setting lane.rung to read_all (every reader goes inert and the old always-ask reading returns, Decision {{N}}
  on_trigger); a full revert of PR 2 then PR 1 follows the same route. The operator's GitHub-UI merge is the valve if
  the check itself wedges.
