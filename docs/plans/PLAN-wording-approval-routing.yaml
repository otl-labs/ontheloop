  - "PR 2 (after PR 1 merges, from a fresh base): run VP 9 for {{N}}; place the sidecar's 25 blocks exactly; add T4.38 per its scope row; write tests/checks/contracts/test_approval_routing_contract.py; regenerate docs/decisions-index.json; settle prose ratchet companions; set implementation_declared: true."
