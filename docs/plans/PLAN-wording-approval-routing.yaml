      for p in sorted(pathlib.Path('docs/plans').glob('PLAN-*.yaml')) for d in [yaml.safe_load(p.read_text(encoding='utf-8')) or {}]
      if not d.get('implementation_declared') and p.name != 'PLAN-wording-approval-routing.yaml'
      for sc in [pathlib.Path('docs/plans/approved') / (p.stem.removeprefix('PLAN-') + '.yaml')]
      for b in [{x['file'] for x in (yaml.safe_load(sc.read_text(encoding='utf-8'))['blocks'] if sc.exists() else [])}]
