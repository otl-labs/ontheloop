schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: wording-approval-routing
intent: >-
  Finish the north-star tier's follow-through (Decision 243 cl.8, rec-5137): the operator keeps a per-change approval
  run only for a declared gated set -- north stars, the decision corpus (a direction entry whole, a mechanism entry's
  Intent line), text that defines a gate, root and CLAUDE.md files and the map itself -- and all other wording is
  notice class, posted to one GitHub issue he reads in full for seven days, then one in five. One new direction
  Decision (amends 83, 165, 187, 243, 246), a new Class D contract docs/contracts/approval-routing.yaml, its check
  validate_approval_routing, a marker-guard kind rule, a kind-blind gate row and a notice-digest workflow. Two build
  PRs: PR 1 is code, inert until the map exists at the diff base; PR 2 carries every sidecar-bound word and flips the
  lane to sampled at its merge.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-wording-approval-routing.yaml
phase: >-
  user_explicit_out_of_scope (operator request 2026-11-12, rec-5137; the follow-through of T4.36, which is complete).
  PR 2 creates tier item T4.38 with c1-c3 met by this plan; no existing criterion is closed.
scope:
  # ---------------------------------------------------------------- PR 1: code, inert until the map exists at the base
  - file: scripts/roadmap/approval_routing.py
    action: Create
    purpose: >-
      PR 1. The routing library (stdlib, yaml and git subprocess only; total, never raises on bad input). load_map(root,
      ref) -> the parsed docs/contracts/approval-routing.yaml at a git ref, or None when absent or unparseable (an
      unparseable map at the ref is reported as a reason, never treated as absent). active(map) -> lane.rung ==
      "sampled". gated_changes(map, root, base, head, changed) -> sorted (file, reason) pairs (head a git ref, or None
      for the working tree; text_at(root, ref, rel) is the shared reader) for changed files
      in the gated set: gated.files entries are exact paths or "**/<name>" (basename at any depth, root included) and
      any change counts; gated.yaml_keys compares each listed top-level key's parsed value at base and head (a file
      that does not parse on either side, or a key present on one side only, counts as changed: fail closed);
      gated.md_sections compares the text from a listed heading to the next heading of the same or higher level, or for
      an entry ending in "." the list item it starts (up to the next numbered item or heading); a section missing on one
      side counts as changed; demoted files (demotions.rows[].file plus reverted_files) count on any change. exempt(map,
      file, base_text, head_text) -> True only when the parsed change is an append to approval-routing.yaml
      demotions.rows or to config/agent/executor/capabilities.yaml boundary_patterns (every base entry kept, in order).
      reverted_files(map, root, base) -> files changed by any commit reachable from base since lane.sampled_since whose
      message carries "This reverts commit <sha>", minus files listed in demotions.restorations; a git failure returns a
      reason (the caller fails closed in pull-request CI). notice_changes(...) -> the changed files not gated. kind_floor(map)
      -> int lane.kind_floor or None. No I/O beyond git show, git log and git diff-tree under root. Stays under 300 SLOC.
    new_imports: []
  - file: tests/roadmap/test_approval_routing.py
    action: Create
    purpose: >-
      Unit nodes over a temp git repo fixture (module-scoped): load_map absent, unparseable and present; active per rung;
      each selector (exact path, **/CLAUDE.md at root and at depth, a yaml key value change, a comment-only edit outside
      the key reading notice, a key added on one side, an unparseable head, an md section change, a change outside the
      section reading notice, the "12p." list item, a missing section); exempt for a demotions append, a boundary_patterns
      append, a boundary_patterns removal (not exempt) and a reorder (not exempt); reverted_files for a revert commit,
      a restoration and a revert before sampled_since; kind_floor. Also a node pinning that
      config/agent/executor/capabilities.yaml boundary_patterns lists docs/contracts/approval-routing.yaml,
      approval_routing and notice_digest (red before the capabilities edit).
  - file: scripts/checks/roadmap/validate_approval_routing.py
    action: Create
    purpose: >-
      PR 1. @register'd check validate_approval_routing(failed, root=None, base=None, changed=None, event=None) (seams
      for fixtures). Push context (_common.push_context_base) prints SKIP and returns. base = status_diff_base or
      origin/main; the map is read AT THE BASE (approval_routing.load_map); absent or not active prints "inert: lane not
      on sampled at <base>" and registry.examined(0). Leg P: each gated change with no plan in
      _common.resolve_declared_plans(changed, root, base) whose base sidecar (approved_text.load_sidecar_at) has a block
      on that file is a finding naming the file and selector: "gated text changed with no declared plan's base sidecar
      binding it; route it through /plan and a sidecar, or the operator merges in the GitHub UI (Decision 83)". Leg B:
      for each docs/plans/PLAN-*.yaml in changed, each drafted Decision in its head sidecar
      (plan_decision_drafts.drafted_entries) whose kind is mechanism is a finding unless the plan's last gate_rounds row
      with gate kind-blind reads mechanism, and is a finding if its amends list names an entry whose kind at the base
      (scripts.decisions_md) is direction or missing. A reverted_files git failure is a finding (fail closed). Findings
      fail only when GITHUB_EVENT_NAME is pull_request; elsewhere each prints ADVISORY and nothing fails (the
      validate_merge_step pattern). Reads the map basename literal docs/contracts/approval-routing.yaml through its
      one-hop import (Decision 168 evidence leg). Stays under 250 SLOC.
    new_imports: [scripts.roadmap.approval_routing, scripts.roadmap.plan_decision_drafts]
  - file: scripts/checks/roadmap/_manifest.py
    action: Modify
    purpose: >-
      PR 1. One Entry: name validate_approval_routing, module scripts.checks.roadmap.validate_approval_routing, attr
      validate_approval_routing, pre=True with pre_globs None (always in --pre: a demoted file can be any path, and the
      check is a handful of git reads), full_segment full_after_lint.
    new_imports: []
  - file: tests/checks/roadmap/test__manifest.py
    action: Modify
    purpose: "One node: the validate_approval_routing Entry is pre with no pre_globs and full_segment full_after_lint. Existing nodes unchanged."
  - file: tests/checks/roadmap/test_validate_approval_routing.py
    action: Create
    purpose: >-
      Temp-repo fixture with a map on sampled at the base: a gated-file change with no plan -> FAIL under
      event=pull_request and ADVISORY (no failure) under event=None; the same change with a declared plan whose base
      sidecar binds the file -> PASS; a plan whose sidecar binds another file -> FAIL; a notice-class change -> PASS;
      a map at read_all -> inert; no map -> inert; a map only at HEAD (this build's PR 2 shape) -> inert; push context ->
      SKIP; a demoted file and a reverted file -> FAIL without a sidecar; leg B: a mechanism draft with no kind-blind
      row, with a row reading direction, and amending a direction entry -> FAIL; with a row reading mechanism and
      amending a mechanism entry -> PASS; a direction draft needs no row; an appended demotion row alone -> PASS.
  - file: scripts/checks/_marker_guard.py
    action: Modify
    purpose: >-
      PR 1. The kind rule, in this module so every token's guard (check_diff, check_state_diff, check_present_markers)
      inherits it through authorization_failure. A private _kind_floor() reads docs/contracts/approval-routing.yaml
      through default_base_reader (origin/main), memoized per _common.ROOT like load_decision_bodies: None when absent,
      not on sampled, or the root is not a git checkout (inert); the sentinel "unreadable" when the map is present but
      does not parse or is on sampled without an int lane.kind_floor. A private _kind_failure(number, body) is True when
      the floor is an int, number > floor and the body's envelope kind (scripts.decisions_md.extract_entry_envelope,
      already this module's dependency) is not direction, or when the floor is "unreadable" and the kind is mechanism
      (fail closed on the stricter side); an entry with no kind reads as direction (decision-kind.yaml
      consumer_contract). authorization_failure returns True when _kind_failure holds for the cited body, and the
      supersession hop applies the same rule to the hop target. __all__ and the nine-name binding surface are
      unchanged; no new module (the ci_guards and verification manifests' pre_globs already name this file). About 35
      SLOC: stays under 500 (429 today, headroom 71).
    new_imports: []
  - file: tests/checks/test__marker_guard_kind.py
    action: Create
    purpose: >-
      A second test file for scripts/checks/_marker_guard.py (its mirror test__marker_guard.py has 2 SLOC of headroom
      and is not edited). Temp-repo fixture with origin/main carrying a map at sampled and kind_floor 300: a mechanism body numbered 301 ->
      failure; 301 direction -> pass; 301 with no kind -> pass; 300 mechanism -> pass (at the floor); map at read_all ->
      pass; no map -> pass; unparseable map -> mechanism 250 fails, direction passes; through authorization_failure a
      301 mechanism body naming the key fails and a 301 direction body naming it passes; the supersession hop to a
      mechanism target above the floor fails. tests/checks/test__marker_guard.py is not edited (2 SLOC headroom).
  - file: scripts/roadmap/plan_gate_rounds.py
    action: Modify
    purpose: >-
      PR 1. _GATE_VERDICTS gains "kind-blind": {mechanism, direction} and the gate Literal gains "kind-blind"; a
      kind-blind row carries no digest, base, selection, blocking or nits (the existing non-wording-check rule). Docstring
      names it: the verdict a fresh subagent gave, shown only plan_obligations --blind-drafts output (planning SKILL.md 8b).
    new_imports: []
  - file: tests/test_plan_gate_rounds.py
    action: Modify
    purpose: "New nodes: a kind-blind row with each verdict parses; an unknown verdict, a digest and a blocking count are rejected. Existing nodes unchanged."
  - file: scripts/roadmap/plan_decision_drafts.py
    action: Modify
    purpose: >-
      PR 1. Two public functions beside the report: drafted_entries(plan_path, root) -> one record per drafted Decision in
      the plan's sidecar blocks on docs/DECISIONS.md (title, kind value or None, amends list, raw block), reusing
      _sidecar_contents and extract_entry_envelope; blind_text(block) -> the block with the envelope's kind mapping (key,
      value and justification lines) removed and nothing else changed. Advisory module stays total.
    new_imports: []
  - file: tests/test_plan_decision_drafts.py
    action: Modify
    purpose: "New nodes: drafted_entries on a fixture plan with one mechanism and one direction draft; blind_text drops exactly the kind mapping and keeps significance, amends and the body. Existing nodes unchanged."
  - file: scripts/roadmap/plan_obligations.py
    action: Modify
    purpose: >-
      PR 1. A third mutually exclusive CLI option --blind-drafts <plan>: prints each drafted Decision through
      plan_decision_drafts.blind_text, separated by a line "---", and nothing else (no findings, no kind); exit 0.
    new_imports: []
  - file: tests/roadmap/plan_obligations/test_blind_drafts.py
    action: Create
    purpose: The CLI on a fixture plan prints both drafts without the word "kind:" and with their Intent lines; the option excludes --plan and --decision-draft.
  - file: scripts/ci/notice_digest.py
    action: Create
    purpose: >-
      PR 1. CLI --before SHA --after SHA [--map-ref REF] [--dry-run]. For each commit in before..after (oldest first; an
      all-zero before reads only after): the map at the commit's parent (or --map-ref, the replay seam); inert and
      silent unless active. One line per commit with notice changes: "PR #<n from the subject's (#n)> <subject> |
      plan <slug>: <first sentence of its intent, 200 chars max> | notice: <files, first 10, then +k> | tripwires:
      <gated files no declared plan's sidecar binds, demoted files, or none> | sample: <yes when n % 5 == 0>"; the plan
      is the one whose implementation_declared flips in the commit, else "none". Without --dry-run it posts the lines
      as one comment with gh: the open issue labelled notice-digest (gh issue list), creating the label and the issue
      (title "Notice digest (wording approval lane)") when absent; body passed by file, never interpolated into a shell.
      Prints what it posted. Stays under 250 SLOC.
    new_imports: [scripts.roadmap.approval_routing, scripts.checks._common]
  - file: tests/ci/test_notice_digest.py
    action: Create
    purpose: >-
      Temp-repo fixture: inert with no map and on read_all; one line for a notice-class commit with the plan's intent;
      tripwires for an unbound gated file and a demoted file; sample yes for #2010 and no for #2011; nothing for a
      gated-only commit; posting with subprocess.run and subprocess.Popen both mocked: an existing issue gets
      gh issue comment with --body-file; a missing issue creates label then issue first. Also parses
      .github/workflows/notice-digest.yml: on push to main only, permissions exactly contents read and issues write,
      fetch-depth 0, no workflow_dispatch, the digest step passes before and after through env, never through ${{ }} in
      run text.
  - file: .github/workflows/notice-digest.yml
    action: Create
    purpose: >-
      PR 1. on push branches [main]; permissions contents read, issues write; concurrency group notice-digest,
      cancel-in-progress false; one job, ubuntu-latest, timeout 10 min: actions/checkout@v7 fetch-depth 0,
      actions/setup-python@v7 3.12, venv + requirements.txt (the rec-autoclose.yml pattern), then .venv/bin/python -m
      scripts.ci.notice_digest --before "$BEFORE" --after "$AFTER" with BEFORE/AFTER and GH_TOKEN (github.token) in env.
      No AWS credentials, no secrets, no workflow_dispatch (nothing for the dispatcher plan's bot guard to cover).
  - file: config/ci_rca_taxonomy.yaml
    action: Modify
    purpose: >-
      PR 1. function_to_category gains validate_approval_routing: schema_drift; workflows gains notice-digest as one
      flow-style line (tier not_a_gate, ci_rca watched, owner platform, rationale: a failed run means the operator's
      notice read misses rows); validate_ci_rca_taxonomy requires every workflow name in that map. NEAR_CAP (497 of 500
      effective lines on main fb642ec9, and other unbuilt plans add rows): measure at build time; if the two lines
      would pass 500, compact existing multi-line rationale scalars to one line each (Decision 166 relief valve,
      prose only, no key or value changed) until it fits; never a raise.
    new_imports: []
  - file: config/agent/executor/capabilities.yaml
    action: Modify
    purpose: >-
      PR 1. boundary_patterns gains one commented group (Decision 235 cl.5 floor; PLAN-wording-approval-routing):
      docs/contracts/approval-routing.yaml, approval_routing (the library, the check and their tests), notice_digest
      (the CLI and its test). scripts/checks/_marker_guard and tests/checks/test__marker_guard already cover the kind
      rule and its test file; .github/workflows/ covers the workflow. Append only.
    new_imports: []
  # ---------------------------------------------------------------- PR 2: the wording and the switch (all sidecar-bound text)
  - file: docs/DECISIONS.md
    action: Modify
    purpose: >-
      PR 2. Exactly the sidecar's blocks decision-new (the new Decision, inserted newest first), decision-83-note,
      decision-165-note, decision-187-note, decision-243-note and decision-246-note. {{N}} is the next free Decision
      number on the build's base (VP 9), {{DATE}} the build date UTC.
  - file: docs/decisions-index.json
    action: Modify
    purpose: PR 2. Regenerated by its own generator after the DECISIONS.md edit (companion, never hand-edited).
  - file: docs/contracts/approval-routing.yaml
    action: Create
    purpose: >-
      PR 2. Exactly the sidecar's block routing-contract: Class D, ratified via Decision {{N}}, evaluator
      validate_approval_routing (built by PR 1), lane wording_approval on sampled with sampled_since {{DATE}} and
      kind_floor {{N}}, the gated set, decision_entries, notice, demotions. Its amendment_log entry is its creation row.
  - file: tests/checks/contracts/test_approval_routing_contract.py
    action: Create
    purpose: >-
      PR 2 (notice class, outside the sidecar). rec-5137's acceptance node test_kind_routes_wording_approvals:
      decision-kind.yaml semantics names approval-routing.yaml and no longer says "kind grants and gates nothing", the
      map's lane reads sampled with rung in rungs, and kind_floor equals the number of the DECISIONS.md entry whose
      title starts "Wording approval follows a declared gated set". Map integrity nodes: every gated.files entry is an
      exact existing path or "**/<name>"; every yaml_keys file parses with each listed top-level key; every md_sections
      heading occurs exactly once in its file; demotions.rows and restorations are lists; the coordinator.yaml
      always_ask line and the planning skill 8b paragraph name approval-routing.yaml.
  - file: docs/contracts/decision-kind.yaml
    action: Modify
    purpose: PR 2. Exactly the sidecar's blocks kind-semantics and kind-log (its new amendment_log entry).
  - file: docs/contracts/coordinator.yaml
    action: Modify
    purpose: >-
      PR 2. Exactly the sidecar's blocks coordinator-version (4 -> 5), coordinator-log (its new amendment_log entry), coordinator-presentation,
      coordinator-write-the-plan, coordinator-always-ask, coordinator-relaxing, coordinator-approvals-first and
      coordinator-approvals-covers.
  - file: tests/checks/contracts/test_coordinator_contract.py
    action: Modify
    purpose: >-
      PR 2. Exactly the sidecar's block test-coordinator-version (the version pin 4 -> 5 plus two growth-safe always_ask
      phrase pins). The coordinator-log block inserts this plan's entry before the 2026-11-08 harness-profile entry, out
      of date order (no check reads order), so tests/checks/contracts/test_coordinator_harness_profile.py, which reads the
      last entry, stays unedited whichever of this plan and PLAN-gate-consumers-flag-aware builds first.
  - file: docs/contracts/implement-scope-boundary.yaml
    action: Modify
    purpose: PR 2. Exactly the sidecar's blocks scope-escalation and scope-log (its new amendment_log entry, one flow-style line; 485 of 500 effective lines today, so it adds one).
  - file: tests/test_scope_boundary_contract.py
    action: Modify
    purpose: PR 2. Exactly the sidecar's block test-scope-escalation (the pinned phrase follows the approved escalation text).
  - file: docs/contracts/marker-grammar.yaml
    action: Modify
    purpose: PR 2. Exactly the sidecar's blocks marker-kind-rule and marker-log (its new amendment_log entry).
  - file: .claude/skills/planning/SKILL.md
    action: Modify
    purpose: >-
      PR 2. Exactly the sidecar's blocks planning-8b and planning-amendment (net -2 bytes; the file is at its 42996-byte
      budget, so the build lowers config/prose_budgets.yaml only if the ratchet asks, never raises).
  - file: docs/ROADMAP-PLATFORM.yaml
    action: Modify
    purpose: |-
      PR 2 (notice class, outside the sidecar: its met_by needs this plan file, which the wording check's scratch tree
      cannot hold). Insert tier item T4.38 right after T4.36's completed_at line, before the T5 comment, with exactly this
      text ({{N}} and {{DATE}} filled as for the Decision):
        - id: T4.38
          tier: T4
          name: Wording approval follows a declared gated set -- the routing map, its check, the marker kind rule and the notice digest (Decision {{N}})
          intent: "Decision {{N}}: docs/contracts/approval-routing.yaml names the wording that keeps the operator's per-change approval; other wording is notice class on the sampled rung of one wording lane, read through a CI digest. The lane moves onto Decision 221 cl.7's controller when CD.46 ratifies (reversal condition controller)."
          depends_on: [T4.36]
          files_in_scope: []
          exit_criteria:
            - id: c1
              text: "docs/contracts/approval-routing.yaml names the gated set as paths, YAML keys and Markdown sections; validate_approval_routing fails, in pull-request CI, a PR changing gated text that no declared plan's base sidecar binds, and a drafted mechanism Decision with no blind kind row reading mechanism or amending a direction entry (wording-approval-routing)"
              status: met
              met_by: wording-approval-routing
            - id: c2
              text: "The shared marker guard refuses a cited entry numbered above the map's kind_floor unless its kind is direction, for every token (wording-approval-routing)"
              status: met
              met_by: wording-approval-routing
            - id: c3
              text: "notice-digest.yml posts one comment per merged commit with notice-class changes to the open issue labelled notice-digest, and a demotion row or a revert of a notice-class change makes that file gated (wording-approval-routing)"
              status: met
              met_by: wording-approval-routing
          related_decisions: [83, 165, 187, 221, 235, 243, 246]
          effort: L
          strategic: false
          status: complete
          completed_at: "{{DATE}}"
  - file: config/prose_budgets.yaml
    action: Modify
    purpose: "PR 2. Companion only: the prose ratchet's lowered entries for the edited skill and contracts, as the wording check settles them; no raise."
bundled_recommendations:
  - rec-5137
followon_recs:
  - rec-5139
  - rec-5140
infrastructure_dependencies:
  - >-
    None. No .tf file is in scope and no Lambda-packaged file (scope is scripts/roadmap, scripts/checks, scripts/ci,
    tests, docs, config/ci_rca_taxonomy.yaml, config/agent/executor/capabilities.yaml, config/prose_budgets.yaml and one
    workflow); the workflow uses only the job's GITHUB_TOKEN (contents read, issues write), no AWS role, no secret, no
    spend.
acceptance_criteria:
  - rec-5137's acceptance (tests/checks/contracts/test_approval_routing_contract.py::test_kind_routes_wording_approvals) exits 0.
  - With the map on sampled at the base, validate_approval_routing fails in pull-request CI a PR that changes gated text no declared plan's base sidecar binds, a demoted or reverted file without a sidecar, and a drafted mechanism Decision with no kind-blind row reading mechanism or amending a direction entry; it is inert with no map or on read_all, advisory outside pull-request CI and skipped on a push.
  - The shared marker guard refuses, for every token, a cited entry numbered above the map's kind_floor unless its kind is direction; dec-250's existing marker still authorizes (250 is below the floor).
  - notice-digest.yml posts one comment per merged commit with notice-class changes to the open issue labelled notice-digest, and is silent while the lane is absent or on read_all.
  - Replayed over real main history with the sidecar's map, the classifier marks every commit touching docs/DECISIONS.md, AGENTS.md or a gated contract key as gated and the rest notice (VP 7).
  - The Decision, notes and contracts carry exactly the sidecar's 25 blocks (approved_text verify exits 0) and every existing test passes with no assert line changed outside the two sidecar-approved test blocks.
  - After PR 2 merges, rec-5137 reads closed, T4.38 reads complete, and the coordinator's shared copy matches coordinator.yaml at the merge commit.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: PR 1 premises on the build's base, before any edit.
    command: >-
      bin/venv-python -c "import pathlib, yaml; c=yaml.safe_load(open('docs/contracts/coordinator.yaml', encoding='utf-8'));
      k=pathlib.Path('docs/contracts/decision-kind.yaml').read_text(encoding='utf-8');
      g=pathlib.Path('scripts/checks/_marker_guard.py').read_text(encoding='utf-8');
      print('map_absent=' + str(not pathlib.Path('docs/contracts/approval-routing.yaml').exists())
      + ' coordinator_v4=' + str(c['contract']['contract_version'] == 4) + ' kind_inert=' + str('kind grants and gates nothing' in k)
      + ' guard_surface=' + str(g.count('def authorization_failure(') == 1)
      + ' library_absent=' + str(not pathlib.Path('scripts/roadmap/approval_routing.py').exists()))"
    expected: One line, every field True.
    fix_if: A False means a premise moved (another plan edited these files first); stop and send a plan-defect report.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: Red-before premise evidence this build itself makes false; steps 2-6 are the standing guards.
  - step: 2
    phase: pre-deploy
    action: PR 1. The routing library's unit tests.
    command: bin/venv-python -m pytest tests/roadmap/test_approval_routing.py -q
    expected: exit 0, all nodes pass; red before (module absent).
    fix_if: a selector reads a gated change as notice, an unparseable side reads unchanged, or a removal reads exempt
    hermetic: true
    expected_literals: [" passed"]
    graduation: graduate
    graduation_check_id: approval-routing-selectors
  - step: 3
    phase: pre-deploy
    action: PR 1. The check's legs and its manifest entry.
    command: bin/venv-python -m pytest tests/checks/roadmap/test_validate_approval_routing.py tests/checks/roadmap/test__manifest.py -q
    expected: exit 0, all nodes pass; red before (check absent).
    fix_if: an unbound gated change passes in pull-request CI, the check fails outside it, or a map only at HEAD activates it
    hermetic: true
    expected_literals: [" passed"]
    graduation: graduate
    graduation_check_id: approval-routing-check-legs
  - step: 4
    phase: pre-deploy
    action: PR 1. The marker kind rule, through the shared guard; the existing guard suites stay green unedited.
    command: >-
      bin/venv-python -m pytest tests/checks/test__marker_guard_kind.py tests/checks/test__marker_guard.py
      tests/checks/test__marker_guard_state_options.py -q
    expected: exit 0, all nodes pass; the kind nodes are red before (rule absent).
    fix_if: a mechanism entry above the floor authorizes, an entry at or below it is refused, or an existing node fails
    hermetic: true
    expected_literals: [" passed"]
    graduation: graduate
    graduation_check_id: marker-guard-kind-floor
  - step: 5
    phase: pre-deploy
    action: PR 1. The kind-blind gate row, the draft helpers and the --blind-drafts CLI.
    command: >-
      bin/venv-python -m pytest tests/test_plan_gate_rounds.py tests/test_plan_decision_drafts.py
      tests/roadmap/plan_obligations/ tests/roadmap/plan_document/test_gate_rounds.py -q
    expected: exit 0, all nodes pass; the new nodes are red before.
    fix_if: blind_text leaves a kind line or drops anything else, or a kind-blind row accepts a digest
    hermetic: true
    expected_literals: [" passed"]
    graduation: graduate
    graduation_check_id: kind-blind-gate-row
  - step: 6
    phase: pre-deploy
    action: PR 1. The digest composer, poster and workflow shape.
    command: bin/venv-python -m pytest tests/ci/test_notice_digest.py -q
    expected: exit 0, all nodes pass; red before (module and workflow absent).
    fix_if: a line appears while inert, the body reaches a shell, or the workflow gains a permission or a dispatch trigger
    hermetic: true
    expected_literals: [" passed"]
    graduation: graduate
    graduation_check_id: notice-digest-composer
  - step: 7
    phase: pre-deploy
    action: >-
      PR 1. Live replay on real data: classify the last 40 commits of origin/main with the approved map (the sidecar's
      routing-contract block, placeholders filled) and print, per commit, the gated and notice file counts; then a
      digest dry-run over the newest commit with the same map.
    command: >-
      bin/venv-python -c "import pathlib, subprocess, tempfile, yaml; from scripts.roadmap import approval_routing as r;
      sc=yaml.safe_load(open('docs/plans/approved/wording-approval-routing.yaml', encoding='utf-8'));
      text=next(b['after'] for b in sc['blocks'] if b['id'] == 'routing-contract').replace('{{N}}', '9999').replace('{{DATE}}', '2026-01-01');
      m=yaml.safe_load(text); run=lambda *a: subprocess.run(['git', *a], capture_output=True, text=True, check=True).stdout;
      shas=run('rev-list', '--max-count=40', 'origin/main').split();
      rows=[(s, f, {x for x, _ in r.gated_changes(m, pathlib.Path('.'), s + '^', s, f)}) for s in shas
      for f in [run('diff-tree', '--no-commit-id', '--name-only', '-r', s).split()]];
      [print(s[:8], 'gated', len(g), 'notice', len(f) - len(g), 'decisions_gated', ('docs/DECISIONS.md' in f) <= ('docs/DECISIONS.md' in g)) for s, f, g in rows]"
      && bin/venv-python -m scripts.ci.notice_digest --before origin/main~1 --after origin/main --map-ref HEAD --dry-run
    expected: >-
      40 lines, each ending decisions_gated True (a commit touching docs/DECISIONS.md is always gated), with a mix of
      gated and notice counts across the window; then the dry-run prints either one digest line in the documented shape or
      "no notice-class changes".
    fix_if: >-
      decisions_gated False (the corpus selector misses), every commit all-gated or all-notice (a selector misreads), or
      the dry-run errors
    hermetic: false
    graduation: waive
    graduation_waiver_reason: Reads real main history, which moves; steps 2, 3 and 6 graduate the same behaviour hermetically.
  - step: 8
    phase: pre-deploy
    action: >-
      PR 1 and PR 2, each before handoff (handoff_policy): fast tier, then the full tier as one backgrounded Bash call
      with a 2 h limit from the top-level session.
    command: >-
      bin/venv-python -m scripts.validate --pre && bin/venv-python -m scripts.validate &&
      bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: exit 0; --verify-head reads the full tier's recorded verdict for HEAD, never the backgrounded run's own exit status
    fix_if: >-
      a failure in this plan's files is fixed at root and the full tier rerun from the start; a failure only in another
      open red's tests is not this build's to fix: log it and follow the implement skill's go/no-go
    hermetic: false
    graduation: not-applicable
  - step: 9
