    phase: pre-deploy
    action: rec-5633's acceptance node.
    command: bin/venv-python -m pytest -q tests/test_wording_check_clone.py::test_the_clone_index_mirrors_the_tree_index
    expected: exit 0; the node passes. Red before (the node is absent on main, and on main's _carry its status lists differ).
    fix_if: Fix _carry in wording_check_clone.py, never an assertion.
    hermetic: true
    expected_literals: ["passed"]
    graduation: graduate
    graduation_check_id: wording-check-clone-mirrors-the-tree-index
  - step: 2
    phase: pre-deploy
    action: The clone file's other nodes and the wording-check suites, unchanged.
    command: >-
      bin/venv-python -m pytest -q tests/test_wording_check_clone.py tests/test_plan_wording_check.py
      tests/test_wording_check_pending.py tests/test_wording_check_baseline.py tests/test_plan_decision_projection.py
    expected: exit 0; every test passes and none fails (the count is not pinned).
    fix_if: Fix the code, never the assertion.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      A whole-suite re-run that duplicates VP 1's graduated shard and the existing wording-check-rehearses-on-a-plan-pr-clone,
      wording-check-baseline-companion and wording-check-plan-created-evaluator shards (node ids unchanged).
  - step: 3
