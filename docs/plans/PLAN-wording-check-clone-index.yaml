acceptance_criteria:
  - >-
    rec-5633: the rehearsal clone's index and working tree mirror the planner tree's: a staged delete is staged in
    the clone and git ls-files omits it, a staged add is tracked, an unstaged change stays unstaged and a partly staged
    file keeps both halves. VP step 1.
  - The rec-5626 nodes and every wording-check suite keep passing unchanged (VP step 2), and rec-5633 is closed after merge (VP step 5).
