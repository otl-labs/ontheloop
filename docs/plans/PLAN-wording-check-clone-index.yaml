    behavior: >-
      The clone carries the tree's index diff with git apply --index and its worktree diff without it, so the clone's
      status equals the tree's for staged, unstaged, partly staged and untracked changes.
    verification_step: 1
    test_selector: tests/test_wording_check_clone.py::test_the_clone_index_mirrors_the_tree_index
    red_green_expectation: red before (main's _carry leaves a staged delete unstaged and a staged add untracked), green after.
