  - {gate: plan-critique, round: 1, verdict: PROCEED, blocking: 0, nits: 5, findings: [{id: PCR-01, severity: nit, origin: judgement, anchor: "scope[0].purpose", subject: "status equality is false for an intent-to-add entry", disposition: applied-wording}, {id: PCR-02, severity: nit, origin: judgement, anchor: "scope[1].purpose", subject: "fixture does not pin binary or mode carry", disposition: applied-wording}, {id: PCR-03, severity: nit, origin: judgement, anchor: "scope[1].purpose", subject: "the sidecar-path filter is a no-op that could hide a regression", disposition: applied-wording}, {id: PCR-04, severity: nit, origin: mechanical, anchor: "constraints[2]", subject: "no-shard-change wording reads as forbidding VP 1's new shard", disposition: applied-wording}, {id: PCR-05, severity: nit, origin: judgement, anchor: "verification_plan", subject: "end-to-end proof lies outside the plan", disposition: applied-wording}]}
