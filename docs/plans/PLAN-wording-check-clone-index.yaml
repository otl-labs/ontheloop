slug: "wording-check-clone-index"
intent: >-
  Make the wording check's rehearsal clone (scripts/roadmap/wording_check_clone.py, rec-5626) mirror the planner
  tree's index as well as its working tree. Today _carry applies the tree's whole HEAD-to-worktree diff to the clone's
  working tree only, so a staged delete in the tree is an unstaged delete in the clone (git ls-files still lists the
  file) and a staged add is untracked. Any sidecar that retires a file with git rm then fails in the clone where the
  build would pass; the Decision 126 consolidation (PR #2448) is held on it.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-wording-check-clone-index.yaml
phase: >-
  ad_hoc_rec (soft-warn exception category; no tier_item claimed, so the Tier Item Freshness Gate is skipped):
  rec-5633 (High, S), a follow-up to rec-5626. Closes no roadmap criterion.
closes_criteria: []
cites: [dec:235, dec:246]
amends: []
introduces: []
scope:
  - file: scripts/roadmap/wording_check_clone.py
    action: Modify
    purpose: >-
      rec-5633. _carry carries the tree in two diffs with the same pathspec (`-- . ':(exclude)docs/plans/PLAN-{slug}.yaml'`
      and --binary --no-renames): first the index diff, `git -C <tree> diff --cached HEAD`, applied in the clone by
      `git apply --index --binary --whitespace=nowarn`, so the clone's index and working tree both take it; then the
      index-to-worktree diff, `git -C <tree> diff` (no revision), applied by `git apply --binary --whitespace=nowarn`
      to the clone's working tree only. Each apply is skipped when its diff is empty. The untracked-file copy, the
      .venv handling and every other step are unchanged. The clone's `git status --porcelain` then equals the tree's
      for every carried path, including a partly staged file, binary and mode changes, except an intent-to-add entry
      (tree " A", clone "??"), which get_status_aware_diff reads as added either way. About +4 SLOC (146 of 500 now).
  - file: tests/test_wording_check_clone.py
    action: Modify
    purpose: >-
      rec-5633's acceptance node, added beside the six rec-5626 nodes, which stay unchanged:
      test_the_clone_index_mirrors_the_tree_index. Its own git fixture (the file's existing helpers). The tree holds,
      against its HEAD: a staged delete (git rm), a staged add, an unstaged delete, an unstaged modify, a partly staged
      file (one staged change and a further unstaged change), a staged binary change, a staged chmod +x, and an
      untracked file. Inside rehearsal_clone(...) with plan_text None: the clone's full `git status --porcelain` lines
      equal the tree's as a sorted list, with no path filtered; `git ls-files -s` gives the same blob id and mode
      100755 for the binary and chmod paths in tree and clone; `git ls-files` in the clone omits the staged-deleted path and lists the staged-added path; and
      `git diff --cached` in the clone shows the partly staged file's staged change only. Red before: on main the
      staged delete reads " D" and the staged add "??". About +30 SLOC (302 of 500 now).
constraints:
  - >-
    No gate changes: validate_weakening_dispositions, _plan_rescout_barrier, scripts/validate.py, the hooks tests and
    the workflows keep their rules. The fix changes only how the rehearsal clone carries the tree.
  - The planner's tree and refs are never written; the temp clone is removed on every path (rec-5626's contract).
  - >-
    No rec-5626 node, assertion or registry shard changes; the new node is additive, so weakening_dispositions stays
    empty. The build adds VP 1's own shard, config/agent/verification_registry/entries/wording-check-clone-mirrors-the-tree-index.yaml,
    as the graduated_registry_shard companion.
  - No rescue agents or workaround loops (Decision 55).
context:
  - "Reported 2026-11-25 by the Decision 126 plan thread: the D126 wording check on the clone harness (#2462, squash e574c847), sidecar digest 4662a488 at base e574c847, gets past the weakening gate and the re-scout barrier but fails round 2 on tests/hooks/test_settings_tool_denies.py::TestContextTrimDenies::test_no_workflow_surface_names_a_denied_tool with FileNotFoundError on config/agent/verification_registry/entries/decision-north-star-promoted-appends.yaml, the record its sidecar retires into deprecated/ (gen.py applies an empty after-text with git rm)."
  - "Measured 2026-11-25 on a fixture: with merged _carry the clone's status shows the staged delete as ' D' and the staged add as '??' while the tree shows 'D ' and 'A '; with the two-diff carry the clone's status equals the tree's line for line. tests/test_wording_check_clone.py and tests/test_plan_wording_check.py pass with the change (71 passed)."
  - "Measured end to end 2026-11-25 with the two-diff carry patched in locally: the D126 sidecar regenerated by its gen.py at base e574c847 (--wording; identical to #2448's sidecar but for base_sha) on a fresh worktree of e574c847, then plan_wording_check --plan with #2448's plan: WORDING-CHECK verdict=PASS, selection=complete, base=e574c847, plan line counting 2 weakening_dispositions entries. With main's _carry the D126 thread reports the round-2 FAIL above (not re-measured here)."
  - "A single `git apply --index` of the whole HEAD diff would also stage the tree's unstaged changes, so an unstaged delete would vanish from the clone's index where the tree still lists it; the two-diff carry is the faithful mirror."
  - "Why mirror the tree rather than stage everything in the clone (critique Q1): the wording check's fast tier stood in the planner tree itself before rec-5626, so mirroring its index keeps the view every gate already had, and the measured D126 PASS is on this shape. Staging everything would track an unstaged delete the way the build's commit does, but it changes the untracked shape rec-5626's nodes read and no gate is known to need it; a hand-made unstaged delete in a tree stays a known gap, closed for good by committing the placed blocks (rec-5480)."
  - "End-to-end proof is the D126 measurement above, and #2448's re-run after this build merges; the hermetic node is the regression guard (critique PCR-05)."
  - "Related, not bundled: rec-5480 (commit the placed blocks; CI Reform's) and rec-5319 (companion test files)."
  - "Decision-scout round 1: NO_FLAGS (Decisions triaged: 231 of 231; Roadmap items intersected: 1; CONFLICT: 0; RELATED: 1). CITE: 235, 246. Related: 279, 189, 244, 176, 181, 55, 59, 128, 247. Serves: NS.9 3/5."
