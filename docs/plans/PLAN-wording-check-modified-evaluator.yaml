schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "wording-check-modified-evaluator"
intent: >-
  Let the wording check (scripts/roadmap/plan_wording_check.py) PASS a plan whose new Class D contract names an
  existing evaluator check that the same plan's build extends to read it (rec-4854), as it already does for an
  evaluator the build creates. Fail closed as today: only the missing reading is tolerated, a missing registration or
  module stays FAIL, and the build's own fast tier still runs validate_contract_drift unchanged. Unblocks
  PLAN-decision-serves-kind-grammar (PR #1683), whose docs/contracts/decision-kind.yaml is read by an extended
  validate_decision_entry_conformance.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-wording-check-modified-evaluator.yaml
phase: >-
  ad_hoc_rec (soft-warn category; no tier_item claimed and no criterion closed, so the Tier Item Freshness Gate is
  skipped). rec-4854's t4-36 tag names its downstream consumer: PLAN-decision-serves-kind-grammar (T4.36 c4).
closes_criteria: []
scope:
  - file: scripts/roadmap/wording_check_pending.py
    action: Modify
    purpose: >-
      rec-4854. (1) pending_pairs keeps its Create rule and gains a Modify rule: for a sidecar Class D contract
      docs/contracts/<name>.yaml with evaluator check X and no pending Create row, the pair is pending when the plan's
      scope has a Modify row whose file starts with scripts/checks/ and is named X.py, T has that file, T registers X
      in it (scripts.checks.contracts._population._find_check_module(X, T) == T / file, the static decorator scan
      resolve_evaluator itself uses), and neither that module nor its one-hop scripts/ imports contain <name>.yaml in
      executable context (_population.module_contains_literal over [module,
      *_population.one_hop_scripts_imports(module, T)], the evidence leg of Decision 168 clause 2). Delete rows never
      count. Pair becomes (basename, check, module, action) with action "create" or "modify". (2) The kind travels
      explicitly to the sub-run: attribute passes a create pair as NAME.yaml:CHECK (unchanged) and a modify pair as
      NAME.yaml:CHECK:modify; a --pending argument is exactly two or three ":"-separated non-empty fields, the third
      only "modify", and any other shape is malformed (exit 2). A tree whose wording_check_pending predates this build
      reads CHECK:modify as a check name, stands nothing in and stays red, so the skew fails closed. (3)
      stand_in(pairs, modified=()) keeps today's whole stand-in for pairs (detail "stood in: the plan creates check
      <X>"); for a modified (basename, check) pair it
      covers the evidence leg only: it calls the original resolve_evaluator with _population.module_contains_literal
      answering True for that contract basename, restored in a finally, so registration, sequencing and the module
      lookup are still checked in T and a red there stays red; the detail on success reads "stood in: the plan
      modifies check <X> to read it". (4) attribute takes the 4-tuple; the module docstring, the CLI line in it and
      attribute's two reason strings say plan-built (created or modified) instead of plan-created. The _population
      import stays function-scope.
  - file: tests/test_wording_check_pending.py
    action: Modify
    purpose: >-
      rec-4854's acceptance node, a module-level test_pending_pairs_admits_a_modified_evaluator, asserts the admission
      and its narrowness in one node, so rec-4854's acceptance command and its graduated shard prove both: a tmp tree
      holds the zz-probe contract and, at the Modify row's path, a module that registers validate_zz_probe through
      @registry.register("validate_zz_probe") and does not name the contract (only its docstring may), and
      pending_pairs returns ("zz-probe.yaml", validate_zz_probe, the module, "modify"); then, each in a fresh tree,
      nothing is paired when T lacks the module, when T registers the check in another file or not at all, when the
      module names the basename in executable context, when a one-hop scripts/ import names it, and for a Delete row.
      A module-level stand-in node, test_a_modified_evaluator_stand_in_still_checks_registration_and_sequencing, holds
      five assertions on stand_in([], modified=[pair]) calling the wrapped _population.resolve_evaluator with the
      registered_checks, sequenced_names and check_module_resolver keyword arguments resolve_evaluator already
      accepts, over a tmp module that does not name the contract: unregistered stays (False, "... not a registered
      check ..."), registered but unsequenced stays (False, "... not sequenced ..."), a check_module_resolver returning
      None stays (False, "could not resolve a source module ..."), both present resolves with the "modifies" detail,
      and module_contains_literal is the original again after the call and after an exception.
      TestCli gains test_a_modify_suffix_is_a_modified_pair_and_other_shapes_exit_two: a :modify argument reaches
      stand_in as a modified pair, and NAME.yaml:CHECK:other, NAME.yaml:CHECK:modify:x or a trailing empty field
      exits 2; TestAttribute gains: a modify pair is passed with its :modify suffix. Changed: the Create pair assertion
      and the _PAIRS input take the 4-tuple; the test
      test_a_modify_row_an_absent_row_and_no_plan_are_not_pending is renamed
      test_a_modify_row_t_lacks_an_absent_row_and_no_plan_are_not_pending (body unchanged: its tree has no module, so
      its Modify assertion still holds); the module docstring says plan-built.
  - file: scripts/roadmap/plan_wording_check.py
    action: Modify
    purpose: >-
      _render only: the summary line reads "fast tier red only on N plan-built evaluator(s); clean with them stood in",
      and each pair line reads "pending: docs/contracts/<name> evaluator <X> (the plan creates <module>)" or "(the plan
      modifies <module>)" from the pair's action. The WORDING-CHECK line, the row and pending_evaluators are unchanged.
  - file: tests/test_plan_wording_check.py
    action: Modify
    purpose: >-
      Inside TestPlanCreatedEvaluator (its class node id is the graduated wording-check-plan-created-evaluator registry
      shard, so the class keeps its name): the Create pair assertion takes the 4-tuple and the summary assertion the
      plan-built wording (the "(the plan creates ...)" assertion is unchanged); the Modify test is renamed
      test_a_modify_row_whose_module_is_absent_stays_a_fail_as_today (body unchanged); and a new
      test_a_modify_row_on_an_unread_existing_check_is_an_attributed_pass writes a registering module into the repo
      fixture, commits it, updates refs/remotes/origin/main to that commit and only then adds its own worktree (the
      baseline_tree pattern, since the tree fixture predates the commit), runs with a Modify row, and asserts an
      attributed PASS with the 4-tuple pair, a sub-run command carrying
      zz-probe.yaml:validate_zz_probe:modify (the argument the narrowing depends on) and the "(the plan modifies ...)"
      line. Outside it, TestRender.test_an_attributed_row_parses_with_its_count's _render input pair becomes a
      4-tuple (its assertion is unchanged). NEAR_CAP (478 of 500 SLOC), so the relief is unconditional: first compact
      TestRefusals.test_head_not_on_main's 13-line `_git(tree, "-c", ...)` commit call to
      `_git(tree, "commit", "-q", "-m", "x")` (the worktree shares the repo config the repo fixture sets; probed
      2026-11-03 in a scratch worktree: the node passes and the file drops to 466 SLOC), which removes no assertion and
      keeps plan_wording_check.py's coverage from this file at 100%. Forecast after the build: about 484 of 500 SLOC
      (critique r4 scratch draft); landing above 500 is a plan defect for amendment mode, never a raise.
implementation_declared: true
weakening_dispositions:
  - candidate: "[assertion-changed] tests/test_plan_wording_check.py::TestPlanCreatedEvaluator::test_a_drift_only_red_is_an_attributed_pass"
    disposition: planned-change
    cite: "acceptance_criteria[1]"
  - candidate: "[assertion-changed] tests/test_plan_wording_check.py::TestPlanCreatedEvaluator::test_the_attributed_pass_prints_the_count_the_line_and_the_row_field"
    disposition: planned-change
    cite: "acceptance_criteria[1]"
  - candidate: "[assertion-changed] tests/test_wording_check_pending.py::TestPendingPairs::test_a_created_evaluator_module_is_pending"
    disposition: planned-change
    cite: "acceptance_criteria[1]"
  - candidate: "[test-removed] tests/test_plan_wording_check.py::TestPlanCreatedEvaluator::test_a_modify_row_has_no_pending_pair_and_a_red_stays_a_fail_as_today"
    disposition: refactor
    cite: "tests/test_plan_wording_check.py::TestPlanCreatedEvaluator::test_a_modify_row_whose_module_is_absent_stays_a_fail_as_today"
  - candidate: "[test-removed] tests/test_wording_check_pending.py::TestPendingPairs::test_a_modify_row_an_absent_row_and_no_plan_are_not_pending"
    disposition: refactor
    cite: "tests/test_wording_check_pending.py::TestPendingPairs::test_a_modify_row_t_lacks_an_absent_row_and_no_plan_are_not_pending"
bundled_recommendations: [rec-4854]
followon_recs: []
infrastructure_dependencies: []
acceptance_criteria:
  - >-
    rec-4854: a sidecar that creates a Class D contract whose evaluator is an existing check, registered in the module
    the plan's scope Modifies, whose module and one-hop scripts/ imports do not yet name the contract, PASSes the
    wording check with pending_evaluators recorded when the only red is that evaluator: the sub-run stands in only the
    missing reading, and the drift check and the failing test files pass with it. It stays FAIL when T lacks the
    module, when T registers the check in another file or nowhere, when the check is unregistered or unsequenced in T
    (the sub-run still checks both), and under every existing rule (another check red, still red with the stand-in, no
    nameable failing test file). This widens PLAN-wording-check-gate-gaps' named tolerance from plan-created to
    plan-built evaluators by exactly the reading a Modify row adds (Decision 235 clause 1: the human gate is
    Benjamin's confirmation of this plan); the build's own --pre still runs validate_contract_drift unchanged. VP
    steps 1, 2, 3, 4.
  - >-
    The Create rule and its whole stand-in, attribute's admissibility and the NAME.yaml:CHECK argument for a create
    pair behave as before; a modify pair travels as NAME.yaml:CHECK:modify, so a scratch tree without this build stands
    it in nowhere and stays FAIL; the pair carries its kind and the printed lines say "plan-built", "the plan creates" or
    "the plan modifies", so they stay true for both kinds. VP steps 3, 4, 5; the pre-build half (no stand-in in a tree
    without this build) rests on the critique r3 skew probe in context, re-confirmed by critique r5 at 977a9db8.
  - >-
    The stand-in stays reachable only from the wording check's sub-run (the existing TestIsolation pin), restores every
    patched function on exit and on exception, and the sub-run changes no file in the scratch tree. VP steps 2, 4, 5.
  - Every changed test file's whole suite passes (VP step 5), and rec-4854 is closed after merge (VP step 8).
verification_plan:
  - step: 1
    phase: pre-deploy
    action: rec-4854's acceptance node (the Modify rule in pending_pairs).
    command: bin/venv-python -m pytest -q tests/test_wording_check_pending.py::test_pending_pairs_admits_a_modified_evaluator
    expected: exit 0; the node passes. Red before (node absent on main).
    fix_if: Fix pending_pairs, never the assertion.
    hermetic: true
    expected_literals: ["passed"]
    graduation: graduate
    graduation_check_id: wording-check-modified-evaluator
  - step: 2
    phase: pre-deploy
    action: >-
      The evidence-only stand-in still checks registration, sequencing and the module lookup, and restores what it
      patches. The one node holds all five assertions: unregistered, unsequenced and module-less each stay unresolved,
      all present resolves with the modifies detail, and module_contains_literal is the original after the call and
      after an exception.
    command: >-
      bin/venv-python -m pytest -q
      tests/test_wording_check_pending.py::test_a_modified_evaluator_stand_in_still_checks_registration_and_sequencing
    expected: exit 0; the node passes. Red before (node absent on main).
    fix_if: Fix stand_in, never the assertion.
    hermetic: true
    expected_literals: ["passed"]
    graduation: graduate
    graduation_check_id: wording-check-modified-evaluator-stand-in
  - step: 3
    phase: pre-deploy
    action: The orchestration node for a Modify row and the render wording, through plan_wording_check.run.
    command: >-
      bin/venv-python -m pytest -q
      tests/test_plan_wording_check.py::TestPlanCreatedEvaluator::test_a_modify_row_on_an_unread_existing_check_is_an_attributed_pass
      tests/test_plan_wording_check.py::TestPlanCreatedEvaluator::test_the_attributed_pass_prints_the_count_the_line_and_the_row_field
    expected: exit 0; both nodes pass. Red before (the first node is absent on main; the second asserts the new wording).
    fix_if: Fix run or _render, never the assertion.
    hermetic: true
    expected_literals: ["passed"]
    graduation: waive
    graduation_waiver_reason: >-
      Both nodes sit in TestPlanCreatedEvaluator, whose class node id is already the graduated
      wording-check-plan-created-evaluator registry shard, so they run as a standing guard without a second row.
  - step: 4
    phase: pre-deploy
    action: >-
      Run after the build is committed at HEAD. The Modify rule and the evidence-only stand-in against the real tree,
      the real registry and the real drift check, in a scratch worktree of HEAD. A new Class D probe names the existing,
      sequenced validate_decision_entry_conformance: pending_pairs with a Modify row on its module returns the modify
      pair, and returns nothing for decision-entry.yaml (which that module already reads); the sub-run without the pair
      exits 1 with the evaluator label, with it as a :modify pair exits 0, and the worktree status is unchanged. A
      second probe names validate_terraform_try, registered but sequenced in no tier: with both as :modify pairs the
      sub-run still exits 1 and reports it not sequenced (the narrowing a whole stand-in would hide).
    command: >-
      T=$(mktemp -d)/t && git worktree add -q --detach "$T" HEAD && ln -s "$PWD/.venv" "$T/.venv" &&
      probe() { printf 'contract:\n  id: %s\n  class: D\n  contract_version: 1\n  status: ratified\n  ratified_via: "PLAN-wording-check-modified-evaluator"\n  description: probe\n  subject: %s\n  evaluator:\n    check: %s\namendment_log:\n  - {date: "2026-11-03", semantic_break: false, change_class: field_add, summary: probe}\n' "$1" "$1" "$2" > "$T/docs/contracts/$1.yaml"; } &&
      probe zz-modify-probe validate_decision_entry_conformance &&
      bin/venv-python -c "import sys; from pathlib import Path; from types import SimpleNamespace as N; from scripts.roadmap.wording_check_pending import pending_pairs; t = Path(sys.argv[1]); m = 'scripts/checks/decisions/validate_decision_entry_conformance.py'; plan = N(scope=[N(file=m, action='Modify')]); c = 'docs/contracts/'; assert pending_pairs(t, {c + 'zz-modify-probe.yaml'}, plan) == [('zz-modify-probe.yaml', 'validate_decision_entry_conformance', m, 'modify')]; assert pending_pairs(t, {c + 'decision-entry.yaml'}, plan) == []; print('PAIRS-OK')" "$T" &&
      (cd "$T" && S0=$(git status --porcelain) && { bin/venv-python -m scripts.roadmap.wording_check_pending -- > ../red.txt 2>&1; [ $? -eq 1 ]; } &&
      grep -q "evaluator does not resolve" ../red.txt &&
      bin/venv-python -m scripts.roadmap.wording_check_pending --pending zz-modify-probe.yaml:validate_decision_entry_conformance:modify -- > /dev/null 2>&1 &&
      [ "$S0" = "$(git status --porcelain)" ]) &&
      probe zz-unsequenced-probe validate_terraform_try &&
      (cd "$T" && { bin/venv-python -m scripts.roadmap.wording_check_pending --pending zz-modify-probe.yaml:validate_decision_entry_conformance:modify zz-unsequenced-probe.yaml:validate_terraform_try:modify -- > ../uns.txt 2>&1; [ $? -eq 1 ]; } &&
      grep -q "not sequenced" ../uns.txt) && echo MODIFY-STAND-IN-OK;
      rc=$?; git worktree remove --force "$T"; rm -rf "$(dirname "$T")"; exit $rc
    expected: >-
      exit 0; prints PAIRS-OK then MODIFY-STAND-IN-OK. About 70 s or more (three drift-only sub-runs, about 22 s each
      as measured by critique r2 on a scratch worktree; no test files).
    fix_if: >-
      An AssertionError before PAIRS-OK means the Modify rule misses the real module (compare
      _population._find_check_module's return with T / the scope path) or pairs a module that already reads its
      contract. An exit other than 1 without the pair means the CLI crashed (read ../red.txt). Green without the pair
      means the probe is not a new Class D contract (check its shape against docs/contracts/contract-population.yaml);
      red with the pair means the evidence patch does not reach resolve_evaluator's module_contains_literal call (read
      the label); a status change means the sub-run writes into the tree. Green with both pairs means the stand-in still
      replaces the whole resolution; if ../uns.txt shows validate_terraform_try is now sequenced, rerun with any check
      in registry.all_checks() minus _population._default_sequenced_check_names().
    hermetic: false
    graduation: not-applicable
  - step: 5
    phase: pre-deploy
    action: >-
      Whole suites of both changed test files, plus
      tests/test_plan_decision_projection.py (its registry shard wording-check-reports-overflowing-annotation guards
      plan_wording_check.run and reads the echo).
    command: >-
      bin/venv-python -m pytest -q tests/test_wording_check_pending.py tests/test_plan_wording_check.py
      tests/test_plan_decision_projection.py
    expected: exit 0; every test passes and none fails (the count is not pinned).
    fix_if: Fix the code, never the assertion.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      A whole-suite re-run that duplicates the graduated VP 1 and 2 shards and the existing
      wording-check-plan-created-evaluator, wording-check-baseline-companion and
      wording-check-reports-overflowing-annotation shards (all node ids unchanged); a registry row would add no new assertion.
  - step: 6
    phase: pre-deploy
    action: Lint and format on the changed Python files.
    command: >-
      bin/venv-python -m ruff check scripts/roadmap/wording_check_pending.py scripts/roadmap/plan_wording_check.py
      tests/test_wording_check_pending.py tests/test_plan_wording_check.py && bin/venv-python -m ruff format --check
      scripts/roadmap/wording_check_pending.py scripts/roadmap/plan_wording_check.py tests/test_wording_check_pending.py
      tests/test_plan_wording_check.py
    expected: exit 0.
    fix_if: Run ruff format and fix lint.
    hermetic: false
    graduation: not-applicable
  - step: 7
    phase: pre-deploy
    action: >-
      Discharge the handoff obligation with a full-tier run to completion, run as its own backgrounded run with a 2 h
      limit from the top-level session.
    command: bin/venv-python -m scripts.validate && bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: >-
      The full tier completes and validation_result --verify-head exits 0, attesting HEAD's tree (the verdict, never
      the backgrounded run's own exit status).
    fix_if: >-
      A failure in scope is fixed on the branch; never skip a test, relax an assertion or add a baseline. A failure
      outside scope becomes a rec via scripts.ops_data_portal (Decisions 55, 59).
    hermetic: false
    graduation: not-applicable
  - step: 8
    phase: post-deploy
    action: Confirm rec-4854 is closed (the squash-merge Resolves trailer closes it).
    command: >-
      bin/venv-python -c "from src.common.ducklake_reader_client import fetch_recs_by_ids, make_reader;
      r,m=fetch_recs_by_ids(make_reader(profile='agent_platform'), ['rec-4854']); print(sorted((x['id'], x['status']) for x in r), m)"
    expected: Prints rec-4854 with status closed and an empty missing list.
    fix_if: Still open - read the ci.yml closure job log and close it with update_rec (Decision 84 I-4).
    hermetic: false
    graduation: not-applicable
test_obligations:
  - source: scripts/roadmap/wording_check_pending.py
    behavior: >-
      A Modify row pairs an existing evaluator only when T registers it in that module and nothing in the module or
      its one-hop scripts/ imports reads the contract; every other Modify shape and a Delete row stay unpaired.
    verification_step: 1
    test_selector: tests/test_wording_check_pending.py::test_pending_pairs_admits_a_modified_evaluator
    red_green_expectation: red before (node absent on main), green after.
  - source: scripts/roadmap/wording_check_pending.py
    behavior: >-
      For a modified (:modify) pair, the stand-in covers only the missing reading: unregistered, unsequenced and module-less
      checks stay unresolved, and the patched function is restored after the call and on an exception.
    verification_step: 2
    test_selector: tests/test_wording_check_pending.py::test_a_modified_evaluator_stand_in_still_checks_registration_and_sequencing
    red_green_expectation: red before (node absent on main), green after.
  - source: scripts/roadmap/plan_wording_check.py
    behavior: A Modify-row evaluator flows through run to an attributed PASS, and the printed lines name each pair's kind.
    verification_step: 3
    test_selector: tests/test_plan_wording_check.py::TestPlanCreatedEvaluator::test_a_modify_row_on_an_unread_existing_check_is_an_attributed_pass
    red_green_expectation: red before (node absent on main; on main a Modify row yields no pair and the run FAILs), green after.
  - source: scripts/roadmap/wording_check_pending.py
    behavior: >-
      The --pending CLI reads NAME.yaml:CHECK:modify as a modified pair and exits 2 on any other third field, a fourth
      field or an empty field, so the kind cannot be mistaken (acceptance_criteria[1]).
    verification_step: 5
    test_selector: tests/test_wording_check_pending.py::TestCli::test_a_modify_suffix_is_a_modified_pair_and_other_shapes_exit_two
    red_green_expectation: red before (node absent on main), green after.
constraints:
  - >-
    No new check, tier or workflow runs in CI (only the new test nodes and their two graduated shards), and no
    production check changes: validate_contract_drift (on Decision 235 clause 5's floor),
    scripts/validate.py and the workflows keep their rules and tiers; the stand-in lives only in the wording check's
    sub-run (Decisions 168, 235).
  - >-
    Fail closed: only the missing reading of an existing, registered and sequenced evaluator joins the tolerance; any
    other red or shape stays FAIL with its reason. No human override or waiver is added (Decision 163).
  - No governed contract, Decision, skill, AGENTS.md or CLAUDE.md text changes; no sidecar.
  - No SLOC or prose budget raise (Decision 128); every changed file stays under 500 SLOC.
  - No rescue agents or workaround loops (Decision 55).
context:
  - "Origin: rec-4854 (filed 2026-11-03 by the grammar planning thread). Benjamin chose 'Fix the tool first' on that thread's decision card (2026-11-03), whose text names this case ('one whose existing script the build extends'); alignment sign-off 'write the plan' (Benjamin, msg cmsg_01PCtd8o8287wUrLv1SCjZEuK1HbBWzRy1N8T3fbz3gDhs, 2026-11-03 13:02Z), given on /mnt/project-files/rec-4854/step6b-presentation.md, whose 'Named tolerance' section is what acceptance_criteria[0] carries (Decision 235 clause 1)."
  - "Decision-scout r1 FLAGS_FOUND (/mnt/project-files/rec-4854/decision-scout-r1.md). Decisions triaged: 195 of 195. Roadmap items intersected: 1; CONFLICT: 0; RELATED: 1. CITE: 168, 235, 181, 128, 163. NOTE 235 cl.1 answered: this change has no sidecar and is not red; the motivating red is a plan-time forecast false positive, and the build's --pre still runs the drift check. SPIRIT NOTE 168 adopted: the stand-in for a modified evaluator covers only the evidence leg, so registration and sequencing still run in T (VP 2, VP 4)."
  - "Supersedes in part PLAN-wording-check-gate-gaps (plan #1797, build #1798): its note 'Only Create rows count (Decision 168: an evaluator whose existing module would gain the basename, or one missing only a registration, stays FAIL)' and acceptance_criteria[0]'s 'when the evaluator is a Modify row'. Only the gain-the-basename half changes; a missing registration, now also a missing sequencing, still FAILs."
  - "Probe on main a7fb3bc9: _population._find_check_module('validate_decision_entry_conformance', .) returns scripts/checks/decisions/validate_decision_entry_conformance.py in 0.44 s; neither it nor its four one-hop imports name decision-kind.yaml, so the grammar case pairs; it already names decision-entry.yaml, so that contract does not. validate_terraform_try is the one registered check no tier sequences (resolve_evaluator: 'registered but not sequenced'), VP 4's negative probe."
