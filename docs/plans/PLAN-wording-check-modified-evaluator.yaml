    scratchpad (outside the tree), then bin/venv-python -m scripts.session.postflight --evidence <file>. (6) The real
    outcome: push (git push -u origin HEAD as its own call, --force-with-lease when the branch was already pushed), the
    build PR citing rec-4854, CI green by event-driven wake, fresh-context code review PROCEED (a fix for a review
    finding repeats (3)-(5)), squash merge with the PR body (carrying Resolves: rec-4854) as the commit message, the
    merge SHA, then VP 8.
