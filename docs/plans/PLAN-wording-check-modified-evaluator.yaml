    CLOSURE, in this order, each outcome reported separately (implement skill Commit Flows; docs/contracts/git-ops.yaml
    handoff_sequence and rebase_phase_distinction.commit_flow_time): (1) GitHub readiness (bin/venv-python -m
    scripts.session.github_readiness; unknown is never PASS). (2) The graduation walk writes the registry rows for
    wording-check-modified-evaluator and wording-check-modified-evaluator-stand-in; flip implementation_declared and
    record the weakening_dispositions context names; commit. (3) git fetch origin main && bin/venv-python -m
    scripts.session.rebase_resolve (STOP on a non-mechanical conflict). (4) Parent validator evidence: VP 7 full tier
    on that committed clean tree, backgrounded with a 2 h limit, then bin/venv-python -m
    scripts.checks.validation_result --verify-head for that HEAD. Any tracked write after VP 7 voids it and needs a
