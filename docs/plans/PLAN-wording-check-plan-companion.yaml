schema_version: 7
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "wording-check-plan-companion"
intent: >-
  Make the wording check (scripts/roadmap/plan_wording_check.py) rehearse a sidecar the way its build's diff-keyed
  fast-tier gates will meet it: the fast tier runs in a private throwaway clone whose own origin/main already holds the plan PR (the sidecar and the
  plan), with the sidecar's blocks and the plan's recorded weakening_dispositions as the uncommitted diff. Diff-keyed
  gates then judge the build's shape: validate_weakening_dispositions reads the plan's records and the re-scout
  barrier sees a modified plan, so a sidecar that retargets a test or edits DECISIONS.md can PASS with no gate
  changed or excused. The implement-only gates that the build's implementation_declared flip arms stay outside the
  rehearsal, so a PASS is not build-CI parity. Unblocks PLAN-consolidate-decision-126-chain (PR #2448) and the chain
  consolidations after it.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-wording-check-plan-companion.yaml
phase: >-
  ad_hoc_rec (soft-warn exception category; no tier_item claimed, so the Tier Item Freshness Gate is skipped):
  rec-5626 (High; effort M after the 2026-11-24 reword). Closes no roadmap criterion.
closes_criteria: []
cites: [dec:235, dec:246]
amends: []
introduces: []
scope:
  - file: scripts/roadmap/wording_check_clone.py
    action: Create
    purpose: >-
      rec-5626. The clone and every plan-handling rule, so plan_wording_check.py gains wiring only. (a)
      rehearsal_clone(tree, base, slug, sidecar_text, plan_text) is a context manager yielding a clone path: it makes
      a temp dir and runs `git clone -q --shared --no-checkout <tree>`, then `git checkout -q --detach <base>`, so
      HEAD is never a branch (push_context_base treats branch main as push context); writes the sidecar text at
      docs/plans/approved/{slug}.yaml and, when plan_text is given, strip_dispositions(plan_text) at
      docs/plans/PLAN-{slug}.yaml, and commits them with `--allow-empty` under `-c user.name=plan-wording-check
      -c user.email=plan-wording-check@localhost -c commit.gpgsign=false -c core.hooksPath=<empty temp dir>`; runs
      `git update-ref refs/remotes/origin/main HEAD` in the clone only (never a fetch or push); carries the tree's
      changes over with `git -C <tree> diff --binary --no-renames HEAD -- . ':(exclude)docs/plans/PLAN-{slug}.yaml'` applied by `git apply --binary` in the clone,
      then copies each `git ls-files --others --exclude-standard` file byte for byte, skipping .venv and
      docs/plans/PLAN-{slug}.yaml; writes plan_text verbatim at docs/plans/PLAN-{slug}.yaml; appends .venv to the
      clone's .git/info/exclude and symlinks .venv to ROOT's; and removes the temp dir in a finally. (b)
      strip_dispositions(plan_text) removes only the top-level weakening_dispositions block by text and fails closed
      (WordingCloneError) unless yaml.safe_load of the result equals the original mapping minus that key; text
      without the key is returned unchanged. (c) plan_text_for(source, slug, loaded) returns None when no plan loaded or the
      file is unreadable (no name check then), and otherwise raises WordingCloneError "plan file <name> does not
      match --slug <slug>" when the name is not PLAN-{slug}.yaml, else returns the source's text. (d) admitted_plan(tree, slug, plan_text, changed)
      returns {docs/plans/PLAN-{slug}.yaml} when the tree changes that path (untracked or tracked-modified) with
      bytes identical to plan_text, raises
      WordingCloneError "the scratch tree's docs/plans/PLAN-{slug}.yaml differs from the loaded plan; remove it or
      pass --plan" when they differ, and returns an empty set otherwise. (e) plan_line(slug, plan_text) returns
      "plan: rehearsed on a clone whose main holds the plan PR (docs/plans/PLAN-{slug}.yaml; weakening_dispositions
      entries in the diff: N)" or "plan: none loaded; the clone's main holds the sidecar only". (f)
      stale_hint(output) returns "; plan-time weakening_dispositions may name only candidates the sidecar's blocks
      create; record build-code candidates at build" when output names "matches no current candidate", else "".
      Every git failure raises WordingCloneError naming the command. About 150 SLOC.
  - file: scripts/roadmap/plan_wording_check.py
    action: Modify
    purpose: >-
      rec-5626, wiring only (every branch lives in wording_check_clone.py). run() keeps every tree-side step as today;
      _check_scope also admits wording_check_clone.admitted_plan(...); after the baseline settle and pending pairs it
      reads the sidecar text and plan_text_for(...), opens rehearsal_clone(tree, base, slug, ...) and runs
      `scripts.validate --pre` and, when pairs exist, wording_check_pending.attribute with the clone as cwd;
      WordingCloneError is caught beside CheckFailure in the existing except. Result.base stays the tree's HEAD (the
      real main sha); _selection_status reads the clone's manifest and compares its sha with the clone's HEAD.
      Result gains plan (plan_line's text), which _render prints after the WORDING-CHECK line; the fast-tier FAIL
      reason appends stale_hint(output). The pasted gate_rounds row is unchanged. Module docstring updated.
      Forecast about 275 of 500 SLOC.
  - file: tests/test_wording_check_clone.py
    action: Create
    purpose: >-
      rec-5626's acceptance file (the mirror home of wording_check_clone.py). Its own git fixture (a main repo with
      refs/remotes/origin/main and a scratch worktree); it never touches ROOT's git state. Nodes:
      test_the_clone_main_holds_the_plan_pr_and_the_diff_holds_the_rest (inside the clone: HEAD detached; origin/main
      is base plus one commit; `git show origin/main:` gives the sidecar and the plan minus its weakening_dispositions;
      the working plan equals plan_text byte for byte; `git diff --name-status origin/main` lists the plan as M plus
      a modified block file, a staged deletion and an untracked file; .venv is not listed);
      test_the_planner_tree_and_refs_are_untouched (the tree's refs/remotes/origin/main, HEAD and status are unchanged
      and the temp dir is gone after the block, also after an exception inside it, and a failing git step raises
      WordingCloneError); test_strip_dispositions_removes_only_that_key (comments, a pragma line and the key mid-file
      survive byte for byte; no key: unchanged; an unsafe shape: WordingCloneError);
      test_plan_rules_refuse_and_report (plan_text_for, admitted_plan, plan_line and stale_hint, every branch,
      including a tracked-modified identical plan that is admitted and carried without a git apply conflict);
      test_a_retargeted_test_passes_the_real_weakening_gate_in_the_clone (through plan_wording_check.run, the fixture
      holding docs/contracts/implement-scope-boundary.yaml copied from ROOT, which run_check reads review_dispositions
      from, and a minimal schema-valid plan written by the test so _load_plan loads it, with a fake runner whose
      validate leg runs the real validate_weakening_dispositions.run_check over
      _common.get_status_aware_diff(cwd): PASS and the plan line; with no plan: FAIL "touches no plan");
      test_the_rescout_barrier_skips_the_plan_with_a_decisions_edit (synthetic inputs only, no live ROOT plan or
      Decision: a fixture docs/DECISIONS.md with one Decision, a minimal docs/ROADMAP-PLATFORM.yaml that
      plan_edges.load_roadmap accepts, and a schema-valid plan written by the test that cites that Decision, carries a
      decision-scout row and one weakening_dispositions entry; the block is a one-word edit inside that Decision's
      body. The real _plan_rescout_barrier.barrier over the clone's status-aware diff has ("M", the plan) in its
      entries, examined == 1 and compared == 0; over the planner-tree shape with the plan untracked, examined == 1
      and compared == 1).
  - file: tests/test_plan_wording_check.py
    action: Modify
    purpose: >-
      One assertion: TestFastTier.test_pass_with_complete_selection's `assert all(cwd == tree for _, cwd in
      runner.calls)` becomes "the measure and index calls ran in the tree, and scripts.validate --pre ran in a
      different directory that no longer exists" (planned-change, acceptance_criteria[1]; the build records it in
      weakening_dispositions). FakeRunner resolves a manifest sha of "SELF" against the HEAD of the cwd it is called
      with, at write time, and test_selection_is_degraded drops its own tree-HEAD resolution, so the fallback, capped
      and deferred cases share the clone HEAD that test_pass_with_complete_selection reads as complete and degrade
      for their own condition, not for a sha mismatch (critique PCR-01). The other nodes keep passing and cover the
      new wiring lines. NEAR_CAP (482 of 500 SLOC); the change is about 5 lines, re-measured after the edit
      (execution_steps), and landing above 500 is a plan defect for amendment mode, never a raise.
constraints:
  - >-
    No gate changes: validate_weakening_dispositions, _plan_rescout_barrier, validate_plan_documents,
    scripts/validate.py and the workflows keep their rules and tiers. The fix changes only the tree the rehearsal runs
    in (operator ruling 2026-11-24 21:09Z: fix the harness, no waiver; pick 21:34Z: the main-after-plan clone).
  - >-
    The planner's clone and scratch tree are never written by the clone step: no ref update, fetch or push outside
    the temp clone, and the temp clone is removed on every exit path.
  - >-
    The plan reaches the clone's working tree verbatim. The only projection is the clone's base copy without its
    weakening_dispositions key, a field the build itself may edit (implement-scope-boundary.yaml
    permitted_field_edits) and the fingerprint excludes. implementation_declared is never flipped in the rehearsal.
  - The gate_rounds row shape is unchanged; the new information is one rendered line only.
  - Committing the blocks for range-diff gates (rec-5480, CI Reform's) is not done here; the clone keeps its base ref apart from HEAD so it can be added later.
  - No rescue agents or workaround loops (Decision 55).
