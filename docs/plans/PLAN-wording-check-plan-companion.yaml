acceptance_criteria:
  - >-
    rec-5626: the wording check runs the fast tier in a throwaway clone whose origin/main holds the sidecar and the
    plan minus its weakening_dispositions, with the blocks and the verbatim plan uncommitted, on a detached HEAD; a
    sidecar that retargets a test the plan records passes the real weakening gate, and a DECISIONS.md block no longer
    trips the re-scout barrier; without a plan the gate still refuses. VP steps 1, 3.
  - >-
    The rehearsal is faithful and contained: the recorded base is the real main sha, selection is read against the
    clone's own HEAD, the planner's tree and refs are unchanged, the clone is removed on every path, a differing
    hand-placed plan or a mismatched plan file name is refused, and a stale plan-time entry still fails with the
    hint. VP steps 1, 2.
  - Every wording-check suite passes (VP step 2), and rec-5626 is closed after merge (VP step 6).
verification_plan:
  - step: 1
    phase: pre-deploy
    action: rec-5626's acceptance file (the clone's shape, containment, strip_dispositions and the two real gates).
    command: >-
      bin/venv-python -m pytest -q
      tests/test_wording_check_clone.py::test_the_clone_main_holds_the_plan_pr_and_the_diff_holds_the_rest
      tests/test_wording_check_clone.py::test_the_planner_tree_and_refs_are_untouched
      tests/test_wording_check_clone.py::test_strip_dispositions_removes_only_that_key
      tests/test_wording_check_clone.py::test_plan_rules_refuse_and_report
      tests/test_wording_check_clone.py::test_a_retargeted_test_passes_the_real_weakening_gate_in_the_clone
      tests/test_wording_check_clone.py::test_the_rescout_barrier_skips_the_plan_with_a_decisions_edit
    expected: exit 0; every node passes. Red before (the file and module are absent on main).
    fix_if: Fix wording_check_clone.py, never an assertion.
    hermetic: true
    expected_literals: ["passed"]
    graduation: graduate
    graduation_check_id: wording-check-rehearses-on-a-plan-pr-clone
  - step: 2
    phase: pre-deploy
    action: The wording-check suites, including the changed TestFastTier nodes and FakeRunner in tests/test_plan_wording_check.py.
    command: >-
      bin/venv-python -m pytest -q tests/test_plan_wording_check.py tests/test_wording_check_pending.py
      tests/test_wording_check_baseline.py tests/test_plan_decision_projection.py
    expected: exit 0; every test passes and none fails (the count is not pinned).
    fix_if: Fix the code, never the assertion.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      A whole-suite re-run that duplicates VP 1's graduated shard and the existing wording-check-baseline-companion,
      wording-check-plan-created-evaluator and wording-check-reports-overflowing-annotation shards (node ids
      unchanged); a registry row would add no new assertion.
  - step: 3
    phase: pre-deploy
    action: >-
      Real-repo rehearsal after the build is committed: a scratch worktree of origin/main, a synthetic sidecar that
      swaps the operands of one equality assertion in tests/test_plan_wording_check.py (the node still passes), and
      this plan copied to a temp dir with one refactor entry for that node; the build head's tool runs with --plan.
      The worktree's fast tier is main's own, so this proves the clone satisfies the real gates end to end, that
      selection stays complete, and that the recorded base is origin/main's sha.
    command: >-
      T=$(mktemp -d)/t && D=$(mktemp -d) && trap 'git worktree remove --force "$T" 2>/dev/null; rm -rf "$(dirname "$T")" "$D"' EXIT &&
      git fetch -q origin main && git worktree add -q --detach "$T" origin/main &&
      bin/venv-python -c "import sys; from pathlib import Path; import yaml; from scripts.roadmap.wording_check_clone import strip_dispositions; t, d = Path(sys.argv[1]), Path(sys.argv[2]); f = 'tests/test_plan_wording_check.py'; node = f + '::TestRefusals::test_head_not_on_main'; q = chr(34) * 2; b = '        assert result.digest and result.selection == ' + q + '\n'; a = '        assert result.digest and ' + q + ' == result.selection\n'; x = (t / f).read_text(encoding='utf-8'); assert x.count(b) == 1; (t / f).write_text(x.replace(b, a), encoding='utf-8'); (d / 'sidecar.yaml').write_text(yaml.safe_dump({'schema_version': 1, 'slug': 'wording-check-plan-companion', 'blocks': [{'id': 'b1', 'file': f, 'before': b, 'after': a}]}), encoding='utf-8'); p = strip_dispositions(Path('docs/plans/PLAN-wording-check-plan-companion.yaml').read_text(encoding='utf-8')); (d / 'PLAN-wording-check-plan-companion.yaml').write_text(p.rstrip('\n') + '\nweakening_dispositions:\n  - candidate: ' + chr(34) + '[assertion-changed] ' + node + chr(34) + '\n    disposition: refactor\n    cite: ' + chr(34) + node + chr(34) + '\n', encoding='utf-8'); print('VP3-SETUP-OK')" "$T" "$D" &&
      bin/venv-python -m scripts.roadmap.plan_wording_check --slug wording-check-plan-companion --tree "$T"
      --sidecar "$D/sidecar.yaml" --plan "$D/PLAN-wording-check-plan-companion.yaml" > "$D/out.txt" 2>&1;
      cat "$D/out.txt"; grep -q "verdict=PASS" "$D/out.txt" && grep -q "selection=complete" "$D/out.txt" &&
      grep -q "base=$(git rev-parse origin/main)" "$D/out.txt" &&
      grep -q "weakening_dispositions entries in the diff: 1)" "$D/out.txt"
    expected: >-
      exit 0 after about 10 to 15 minutes (one fast-tier run in the clone), so run it with run_in_background and a
      30-minute limit, never in the 10-minute foreground; the EXIT trap removes the worktree and temp dirs on every
      path. It prints VP3-SETUP-OK, then a PASS verdict
      with selection complete, base equal to origin/main's sha, and the plan line counting one entry in the diff.
    fix_if: >-
      "touches no plan" means the plan did not reach the clone's diff; "matches no current candidate" means the
      candidate key differs from the entry (read the gate's line); selection degraded means the manifest sha is
      compared with the wrong HEAD; "re-scout required" means the plan reads as added in the clone; any other red is
      read from the echo and, if not this plan's, filed as a rec.
    hermetic: false
    graduation: not-applicable
  - step: 4
    phase: pre-deploy
    action: Lint and format on the changed Python files.
    command: >-
      bin/venv-python -m ruff check scripts/roadmap/wording_check_clone.py scripts/roadmap/plan_wording_check.py
      tests/test_wording_check_clone.py tests/test_plan_wording_check.py && bin/venv-python -m ruff format --check
      scripts/roadmap/wording_check_clone.py scripts/roadmap/plan_wording_check.py tests/test_wording_check_clone.py
      tests/test_plan_wording_check.py
    expected: exit 0.
    fix_if: Run ruff format and fix lint.
    hermetic: false
    graduation: not-applicable
  - step: 5
    phase: pre-deploy
    action: >-
      Discharge the handoff obligation with a full-tier run to completion, as its own backgrounded run with a 2 h
      limit from the top-level session.
    command: bin/venv-python -m scripts.validate && bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: >-
      The full tier completes and validation_result --verify-head exits 0, attesting HEAD's tree (the verdict, never
      the backgrounded run's own exit status).
    fix_if: >-
      A failure in scope is fixed on the branch; never skip a test, relax an assertion or add a baseline. A failure
      outside scope becomes a rec via scripts.ops_data_portal (Decisions 55, 59).
    hermetic: false
    graduation: not-applicable
  - step: 6
    phase: post-deploy
    action: Confirm rec-5626 is closed (the squash-merge Resolves trailer closes it).
    command: >-
      bin/venv-python -c "from src.common.ducklake_reader_client import fetch_recs_by_ids, make_reader;
      r,m=fetch_recs_by_ids(make_reader(profile='agent_platform'), ['rec-5626']); print(sorted((x['id'], x['status']) for x in r), m)"
    expected: Prints rec-5626 with status closed and an empty missing list.
    fix_if: Still open - read the ci.yml closure job log and close it with update_rec (Decision 84 I-4).
    hermetic: false
    graduation: not-applicable
