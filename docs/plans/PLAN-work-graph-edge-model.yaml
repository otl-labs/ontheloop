  STEP 2 -- docs/contracts/work-item-edges.yaml (Create) -- the Class D edge-model contract, verbatim between the markers. Its evaluator is validate_plan_documents, which STEP 8 makes read the work-item-edges.yaml basename in executable context (contract-population evaluator_kinds.check).
  <<<NEW
  # Work-item edge model (Decision 232, amending Decision 197 clauses 3 and 5). The columns, the
  # target-ref, asserting_artefact and badge grammars and the per-kind rules live here; the writer
  # authority, closed-ness and orphan rule's rationale live in the Decision (Decision 86). No table
  # exists yet: Decision 197 clause 8 migrates once post-MVP and T4.23 c6/c17-c19 carry the build.
  # Read by scripts/checks/roadmap/validate_plan_documents.py (target_refs.namespaces.dec.plan_time_sources).
  contract:
    id: work-item-edges
    class: D
    contract_version: 1
    status: ratified
    ratified_via: "Decision 232 / PLAN-work-graph-edge-model"
    description: >-
      Class D mechanism contract: the work_item_edges edge-state event columns, the closed edge
      vocabulary with its per-kind target namespaces, the typed target-ref grammar and its version
      binding, the asserting_artefact grammar and the per-edge badge grammar (Decision 232). The
      plan-time arm of target existence (PlanDocument.amends decision refs, rec-4517) reads
      target_refs.namespaces.dec.plan_time_sources.
    subject: work-item-edges
    evaluator:
      check: validate_plan_documents

  amendment_log:
    - {date: "2026-10-20", semantic_break: false, change_class: field_add, summary: "Initial authoring (Decision 232 / PLAN-work-graph-edge-model)."}

  grain: >-
    One row per edge-STATE event, append-only (Decision 232 cl.1). The current state of an edge is
    its latest event; nothing is updated in place.

  states:
    - {state: proposed, writer: "ETL projection of plan-PR events and of filing a discovered child", gates: "only the asserting item (Decision 232 cl.2)"}
    - {state: confirmed, writer: "ONLY the implementation merge that consumes the exact merged plan (Decision 205 cl.5)", gates: "every reader"}
    - {state: retracted, writer: "plan PR closed unmerged, a plan revision that drops the edge, or the operator", gates: "nothing"}

  derived_at_read:
    suspect: >-
      Never stored. An edge is suspect when its target's current version differs from the
      target_version it bound (an amendment changed the decision, clause or criterion it names).

  columns:
    - {name: from, type: str, meaning: "the asserting work item, a wi: ref (the one stored direction)"}
    - {name: to, type: str, meaning: "the target, a typed ref per target_refs below"}
    - {name: kind, type: str, meaning: "one of kinds[].kind; closed, validated"}
    - {name: state, type: str, meaning: "one of states[].state"}
    - {name: asserted_at, type: timestamp, meaning: "stamped by the writer at the write boundary, never caller-supplied; excluded from the content compare"}
    - {name: asserting_artefact, type: str, meaning: "per asserting_artefact below"}
    - {name: rationale, type: "str | null", meaning: "why the edge holds; required for gating kinds"}
    - {name: evidence_ref, type: "str | null", meaning: "a pointer to the evidence (PR, check run, criterion attempt)"}
    - {name: target_version, type: str, meaning: "the bound version of the target per target_refs.version_binding"}

  no_confidence_column: >-
    Deliberate: a state is checkable, a score is not (Decision 232 Options considered).

  identity:
    walk_input_key: [from, to, kind, state, asserting_artefact]
    status: >-
      A clause-8 design_time_walk input (T4.23 c14, c17), not a settled merge key; a departure
      re-opens design_time_walk step 8. Walk note (plan-critique r1): under this key and the
      idempotent re-send rule, an operator:<id> or scout:<check_run> proposed -> retracted ->
      proposed sequence turns the second proposed into a no-op and the latest event reads
      retracted; plan revisions dodge it (each sha is a distinct artefact). The walk should add an
      event ULID to the grain key or exclude state from the dedupe key.
    resend_rule: >-
      A re-send under the key with the same content is idempotent; with different rationale,
      evidence_ref or target_version it is rejected loudly (Decision 207).

  partition:
    walk_input: "year/month/day(asserted_at)"
    note: >-
      Decision 137; recorded beside T4.23 c14's year/month/day(created_timestamp) for the clause-8
      walk to reconcile -- the walk may rename the column.

  kinds:
    - {kind: depends_on, family: gating, to_namespaces: [wi], rationale_required: true}
    - {kind: part_of, family: structural, to_namespaces: [wi], rationale_required: false}
    - {kind: split_from, family: structural, to_namespaces: [wi], rationale_required: false}
    - {kind: supersedes, family: structural, to_namespaces: [wi], rationale_required: false}
    - {kind: discovered_from, family: informational, to_namespaces: [wi], rationale_required: false}
    - {kind: related_to, family: informational, to_namespaces: [wi, dec, crit], rationale_required: false}
    - {kind: serves, family: intent, to_namespaces: [ns], rationale_required: false}
    - {kind: governed_by, family: intent, to_namespaces: [dec], rationale_required: false}
    - {kind: realizes, family: intent, to_namespaces: [dec], rationale_required: false}

  not_edges: >-
    Completion gates are criteria (work_item_criteria rows), never edges; closure is evidence
    against a criterion. kind on a work item is an SCD2 attribute, never id-derived; decomposition
    is a new item version with kind epic plus child part_of and discovered_from edges; a deferral
    is discovered_from plus depends_on without part_of.

  orphan_rule: >-
    Every epic carries at least one serves edge, directly or through part_of; a task with no
    part_of carries serves or governed_by. A cross-row rule: the orphan_set verb and a DQ monitor
    read it, never a write reject (Decision 210 cl.2).

  target_refs:
    grammar: "<namespace>:<body>"
    namespaces:
      wi:
        shape: "wi:<work-item-id>"
        existence: write boundary (same store)
      crit:
        shape: "crit:<work-item-id>:<criterion-id>@<criterion_version_ulid>"
        existence: write boundary (same store); the ulid is the writer-minted criterion version (T4.23 c13)
      dec:
        shape: "dec:<number>[#<clause-id>]"
        post_split_shape: "dec:<slug>[#<clause-id>] -- reserved, admitted only after Decision 217 cl.5's per-file split"
        existence: plan time against the git tree, plus a DQ monitor (ops_decisions is backfilled after merge)
        plan_time_sources: [docs/DECISIONS.md, docs/DECISIONS_ARCHIVE.md]
        clause_resolution: "a #clause-id is recorded but resolves to the whole decision until the split"
      ns:
        shape: "ns:<id>"
        alias_of: dec
        kind_check: north_star
        existence: >-
          Resolves to a kind: north_star entry of the one decision corpus (Decision 196 cl.3); until
          those entries exist, today's roadmap NS rows are the pending binding and no plan-time check runs.
    reserved_prefixes: >-
      Decision 196 cl.6's Tier B / Tier C decision id prefixes are reserved inside the dec: and ns:
      bodies; they arrive by amendment of this grammar.
    version_binding: >-
      A dec: or ns: target binds the decision's content_hash until the split, then the clause's
      content hash; clause ids are authored, stable and never renumbered. A crit: target binds its
      criterion_version_ulid. An amendment never mutates an edge row; it changes the target's
      version, which makes the edge suspect at read.

  asserting_artefact:
    grammar: "plan:<repo-path>@<sha> | merge:<sha> | operator:<id> | scout:<check_run>"
    forms:
      - {form: "plan:<repo-path>@<sha>", writes: [proposed, retracted]}
      - {form: "merge:<sha>", writes: [confirmed]}
      - {form: "operator:<id>", writes: [proposed, retracted]}
      - {form: "scout:<check_run>", writes: [proposed]}
    child_filing_note: >-
      A child filed mid-run asserts its discovered_from (and any depends_on) under the asserting
      run's plan:<repo-path>@<sha>.
    principal_note: >-
      operator:<id> is a public handle or role token, never an email address (exit-criteria-ledger
      plan_principal's rule).

  badges:
    grammar: "<prefix>:<link>"
    prefixes:
      - {prefix: "plan:", links_to: "the plan PR or plan file at its sha"}
      - {prefix: "scout:", links_to: "the decision-scout check run"}
      - {prefix: "merge:", links_to: "the implementation merge commit"}
    rule: >-
      Each edge shown on a supervision surface carries exactly the badge of its latest event's
      asserting_artefact form (T4.18's content level explain_edge).

