  def _known_decision_numbers(root: Path) -> tuple[set[int] | None, str]:
      """Decision numbers headed in the edge contract's dec plan_time_sources, or (None, reason) fail-closed."""
      from scripts.decisions_md import decision_header_numbers  # noqa: PLC0415

      contract = root.joinpath(*_EDGE_CONTRACT_PARTS)
