schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: work-graph-edge-model
intent: 'Decide the work-item edge model before T4.23 and T4.32 build on it, so the in-flight graph is visible without breaking merge-authored
  edges: a new Decision amending Decision 197 clauses 3 and 5 makes work_item_edges one row per edge-state event (proposed / confirmed / retracted,
  only the implementation merge confirms, suspect derived at read), fixes a closed vocabulary, binds edges to north stars and decision clauses
  through typed target refs, and adds the orphan rule. Field semantics go in a new Class D contract (docs/contracts/work-item-edges.yaml), the
  twelve graph read verbs join work_item_storage as provisional, T4.23 gains c17-c19, and rec-4517''s plan-time amends existence check ships as
  the contract''s evaluator. No table, adapter or verb implementation is built (Decision 197 cl.8).'
plan_type: IMPLEMENTATION
implementation_declared: false
verification_tier: V2
plan_path: docs/plans/PLAN-work-graph-edge-model.yaml
phase: T4.23 (deferred_post_mvp; forward-work criteria c17-c19 and a c6 bracket only -- no criterion closes). Slice 2 of overseer run work-graph-edge-problem.
  Names no CD.27-gated item, so no fallback_reevaluation block is owed.
amends:
- dec:197#3
- dec:197#5
introduces:
- work-item-edges
- ready_set
- blockers_of
- dependents_of
- intent_rdeps
- suspect_set
- orphan_set
- changed_since
- subgraph
- why_blocked
- explain_edge
- edge_history
- longest_open_chain
scope:
- file: docs/DECISIONS.md
  action: Modify
  purpose: New Decision 232 (seven clauses, 5,129 B at drafting, envelope amends [197]) above Decision 231 (STEP 1.1); one dated Amended-by line
    on Decision 197 inside its awk range (STEP 1.2); no existing body line edited.
- file: docs/decisions-index.json
  action: Modify
  purpose: Regenerated by scripts.decisions_index --write (STEP 10), never hand-edited.
- file: docs/contracts/work-item-edges.yaml
  action: Create
  purpose: 'Class D contract (STEP 2): edge-state event columns, states and writers, the closed kinds with target namespaces, identity and partition
    as clause-8 walk inputs, target-ref grammar with version binding and dec plan_time_sources, asserting_artefact and badge grammars, orphan
    rule; evaluator validate_plan_documents.'
- file: docs/contracts/ports.yaml
  action: Modify
  purpose: work_item_storage required_verbs gain the twelve graph read verbs, verbs_status stays provisional; one amendment_log row (STEP 3).
- file: docs/contracts/file-router.yaml
  action: Modify
  purpose: work-item-edges route (topic equals subject, Decision 168 cl.4) and its amendment_log row, paid for under the Decision 166 500-line
    limit by joining two route descriptions onto one line (STEP 4).
- file: docs/contracts/exit-criteria-ledger.yaml
  action: Modify
  purpose: 'plan_amends semantics points the dec: grammar at the new contract; governance_notes record existence as enforced (rec-4517); field-level
    prose_improvement amendment_log row (STEP 5).'
- file: docs/ROADMAP-PLATFORM.yaml
  action: Modify
  purpose: 'T4.23 only: dated bracket on c6, new open criteria c17-c19, related_decisions += the minted number (STEP 6); +9 lines at drafting.'
- file: scripts/checks/roadmap/_manifest.py
  action: Modify
  purpose: validate_plan_documents Entry pre_globs add docs/DECISIONS_ARCHIVE.md, docs/contracts/work-item-edges.yaml and scripts/decisions_md.py,
    its new closure inputs (STEP 7).
- file: scripts/checks/roadmap/validate_plan_documents.py
  action: Modify
  purpose: 'rec-4517: resolve each PlanDocument.amends dec:<number> against the ''## Decision N:'' headers of the files the contract''s dec plan_time_sources
    lists, fail-closed when unreadable; #clause resolves to the whole decision (STEP 8). 165 -> about 202 lines, under the 500 limit.'
- file: tests/checks/roadmap/test__manifest.py
  action: Modify
  purpose: Three _CLOSURE_INPUTS rows for validate_plan_documents (STEP 9.1).
- file: tests/checks/roadmap/test_validate_plan_documents.py
  action: Modify
  purpose: 'TestPlanAmendsExistence: source resolution, fail-closed branches, #clause handling and per-plan failure wiring -- the mirror test
    carrying 100% coverage (STEP 9.2).'
- file: tests/checks/roadmap/test_plan_amends_existence.py
  action: Create
  purpose: rec-4517's two acceptance tests (STEP 9.3).
bundled_recommendations:
- rec-4517
followon_recs: []
infrastructure_dependencies:
- 'LAMBDA-DEPLOY DEFERRED (CD.16 / Decision 79), per-artifact reasoned disposition. compute_affected_artifacts(<this plan''s scope>) returns {''data-pipeline'':
  [''docs/ROADMAP-PLATFORM.yaml'']}: the live roadmap is a packaged asset of the active data-pipeline artifact. No build, deploy or smoke test
  is owed: the change to that asset is data only (T4.23''s criteria text; no packaged code), its sole runtime reader feeds raw text to a prompt
  behind a disabled schedule, and the asset refreshes with the artifact''s next governed deploy. No other scope file is Lambda-packaged and no
  .tf file is in scope. Standing gap: rec-3846 (no new rec). Precedent: PLAN-persona-eval-lane.'
acceptance_criteria:
- Exactly one Decision titled 'Work-item edges are edge-state events ...' exists, at or under 6,144 bytes when added, with a bare yaml envelope
  (amends [197], significance numbered_decision naming the rejected contract and amendment_forms homes), a title whose only amends edge is 197,
  seven clauses (edge-state events and writers; proposed gates only its asserter; closed vocabulary; intent binding; orphan rule; existence; plan
  fields and provisional verbs), a monitored reversal stanza and a Coverage line (VP 4).
- Decision 197 carries one dated Amended-by line naming the minted number inside its awk range, its clause 3 grain sentence, clause 5 opening
  and T4.23:c14 annotation intact; decisions-index.json is fresh (VP 5-6).
- docs/contracts/work-item-edges.yaml is a ratified Class D contract whose evaluator validate_plan_documents resolves, routed in file-router.yaml
  (topic equals subject), carrying the columns, states, kinds, identity and partition walk inputs, target-ref, asserting_artefact and badge grammars
  and the orphan rule; exit-criteria-ledger plan_amends points at it and no longer reads UNENFORCED (VP 7, VP 10).
- ports.yaml work_item_storage lists file_rec, update_rec, pick_work_item plus the twelve graph read verbs, verbs_status provisional, conformance
  suite owned by T4.23:c16 (VP 8).
- T4.23 carries a dated c6 bracket and open c17-c19, related_decisions names the minted number, c8-c16 and every existing pin unchanged, roadmap
  growth within 70 lines (VP 9, 11, 12).
- 'validate_plan_documents refuses a PlanDocument.amends dec:<number> with no ''## Decision N:'' header in DECISIONS.md or DECISIONS_ARCHIVE.md,
  accepts a known one with or without #clause, fails closed on an unreadable contract source list, and its Entry''s pre_globs cover its new closure
  inputs (VP 2-3, VP 10).'
- The full tier passes (VP 1); after merge the Decision row reaches the warehouse and rec-4517 is closed (VP 13-14).
verification_plan:
- step: 1
  phase: pre-deploy
  action: Full tier on the committed, rebased, clean tree, then attest HEAD (git-ops handoff_sequence; Decision 163 pre-handoff run). Contract
    drift and the population census, the per-entry size cap, supersession annotations, index freshness, the pre-glob closure audit, structural
    size, the registry differential, graduation completeness, scope boundary and the replay all gate here.
  command: bin/venv-python -m scripts.validate && bin/venv-python -m scripts.checks.validation_result --verify-head
  expected: Exit 0 on a completed full-tier run, then --verify-head attests HEAD's tree. Decision 197's accretion WARN (about 8,157 B) is expected,
    WARN tier only.
  fix_if: 'validate_decisions_size FAIL on the new entry: tighten its prose, never raise the cap. A registry differential rejection: the graduated
    step is tautological on origin/main -- fix the step, never the gate.'
  hermetic: false
  graduation: not-applicable
- step: 2
  phase: pre-deploy
  action: 'rec-4517 ACCEPTANCE: a PlanDocument.amends ref naming no ''## Decision N:'' header is refused by validate_plan_documents; a known ref
    (with and without a #clause) is accepted. Red on 722f0865: the unknown ref passes (the existence check does not exist).'
  command: bin/venv-python -m pytest tests/checks/roadmap/test_plan_amends_existence.py::test_unknown_decision_ref_is_refused tests/checks/roadmap/test_plan_amends_existence.py::test_known_decision_ref_is_accepted
    -q
  expected: Both tests pass, exit 0.
  fix_if: 'The unknown ref is accepted: STEP 8''s _amends_existence_failures is not wired into the per-plan loop. Never widen the regex or drop
    the assertion.'
  hermetic: true
  graduation: graduate
  graduation_check_id: plan-amends-existence-refuses-unknown
  expected_literals:
  - 2 passed
- step: 3
  phase: pre-deploy
  action: 'Resolver branches and the widened --pre gate: live and archived headers resolve from the contract''s plan_time_sources, an unreadable
    or empty source list fails closed (once per amending plan), a #clause resolves to the whole decision, and the validate_plan_documents Entry''s
    pre_globs cover decisions_md.py, DECISIONS_ARCHIVE.md and work-item-edges.yaml. Red on 722f0865: the TestPlanAmendsExistence class and the
    three new _CLOSURE_INPUTS rows fail.'
  command: bin/venv-python -m pytest tests/checks/roadmap/test_validate_plan_documents.py::TestPlanAmendsExistence tests/checks/roadmap/test__manifest.py
    -q
  expected: Every selected test passes, exit 0; 100% line coverage of validate_plan_documents.py from its mirror test is VP 1's coverage gate.
  fix_if: 'A closure row fails: STEP 7''s pre_globs are missing a path. A branch test fails: align STEP 8 with STEP 9.2''s expectations.'
  hermetic: true
  graduation: waive
  graduation_waiver_reason: Branch coverage that rides the coverage gate and both tiers' diff-aware test selection; VP 2 graduates instead because
    it is rec-4517's acceptance pin.
  expected_literals:
  - passed
