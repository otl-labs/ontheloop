  > **Amended by Decision 232 (2026-10-20):** Clauses 3 and 5 -- work_item_edges is one row per edge-state event (proposed / confirmed / retracted; suspect derived at read); only the implementation merge writes confirmed, so the 2026-09-28 update's "the plan merge writes no edges" reads "no confirmed edges"; the identity key is a clause-8 walk input; vocabulary, target refs and the orphan rule per Decision 232 and docs/contracts/work-item-edges.yaml.

