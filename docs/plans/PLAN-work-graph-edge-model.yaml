  The canonical corpus of ratified architectural and operational decisions, and the sole ETL source for the `ops_decisions` warehouse table (Decision 84). Fully-superseded entries move to `docs/DECISIONS_ARCHIVE.md` per the archival policy in Decision 146.

  ## Decision 232: Work-item edges are edge-state events -- proposed, confirmed and retracted rows over a closed vocabulary, bound to intent by typed target refs (amends Decision 197 clauses 3 and 5) (Decided)

  ```yaml
  number: 232
  status: Decided
  decided_date: "2026-10-20"
  amends: [197]
  significance:
    value: numbered_decision
    justification: >-
      Writer authority, a closed vocabulary and an intent-binding rule for the edge table T4.23 and
      T4.32 c4 build on. Not a contract note: work-item-edges.yaml holds the columns and grammars,
      not who may write which state. Not amendment_forms: an annotation on 197 cannot add states,
      kinds or the orphan rule.
  ```

  **Status:** Decided
  **Date:** 2026-10-20
  **Warehouse ID:** dec-232 (per Decision 84 backfill)

  **Problem:** Decision 197 cl.3/cl.5 store one row per edge, written only at the implementation
  merge, so an edge a plan or a mid-run discovery asserts is invisible until X merges -- yet X
  cannot merge until its new prerequisite is done. Edges carry no rationale or provenance, the
  pilot vocabulary is depends_on/part_of only, and nothing links an item to the north star or
  decision it serves, so orphans and intent drift cannot be computed.

  **Decision:**
  1. **Edge-state events.** work_item_edges holds one row per edge-STATE event, append-only;
     states are proposed, confirmed and retracted. Proposed rows are projected by ETL from
     plan-PR events and from filing a discovered child; ONLY the implementation merge that
     consumes the exact merged plan writes confirmed (Decision 205 cl.5 -- the plan merge still
     writes no confirmed edge); retracted follows a plan PR closed unmerged, a plan revision that
     drops the edge, or the operator. Suspect is derived at read, never stored. The current state
     is the latest event; the identity key is a clause-8 walk input (T4.23 c14), not settled
     here, and a re-send under it with different content is rejected loudly (Decision 207).
  2. **Proposed gates only its asserter.** A proposed depends_on blocks only the item that
     asserted it; nothing else reads a proposed edge as gating.
  3. **Closed vocabulary, one stored direction.** Gating: depends_on. Structural: part_of,
     split_from, supersedes. Informational: discovered_from, related_to. Intent: serves (to a
     north star), governed_by and realizes (to a decision clause). Completion gates are
     criteria, never edges. kind is an SCD2 attribute of the item, never id-derived;
     decomposition is a new version with kind epic, children part_of it plus discovered_from.
     Gating kinds require a rationale.
  4. **Intent binding.** A target is a typed ref (grammar: docs/contracts/work-item-edges.yaml).
     A decision target binds to the whole decision and its content_hash until Decision 217
     cl.5's split, then to an authored, never-renumbered clause id and its content hash; the
     slug form exists only after the split. A north-star ref resolves to a kind: north_star
     entry of the one decision corpus (Decision 196 cl.3). An amendment never mutates an edge;
     it changes the bound version, which is what makes a dependent suspect.
  5. **Orphan rule.** Every epic serves at least one north star, directly or through part_of; a
     task with no part_of carries serves or governed_by. It is a cross-row rule read by the
     orphan_set verb and a DQ monitor, never a write reject (Decision 210 cl.2).
  6. **Existence.** In-store refs (wi:, crit:) are checked at the write boundary; decision and
     north-star refs are checked at plan time against the git tree and by a DQ monitor, since
     ops_decisions is backfilled after merge.
  7. **Plan fields.** A plan declares edges through PlanDocument amends and introduces; T4.32
     c4's single extractor reads them. Graph reads are named work_item_storage verbs, provisional
     (Decision 84 I-3, Decision 212).

  **Rationale:** An event grain keeps the merge as the only confirming writer while making the
  in-flight graph visible; merge-authored-edges-lossy stays untripped because proposed rows are
  never the durable record of a confirmed edge.

  **Options considered:** Plan-merge-authored edges -- rejected: Decision 205 cl.5. A mutable
  state column -- rejected: append-only lakehouse. A confidence column -- rejected: a state is
  checkable, a score is not. A write-time decision-existence check -- rejected: arrival-order
  dependent (Decision 210 cl.2).

  ```yaml reversal-conditions
  decision: 232
  review_by: 2027-06-30
  on_trigger: "re-decide via /plan"
  conditions:
    - id: proposed-edges-noise
      kind: manual
      description: "Retracted events outnumber confirmed ones over a quarter: proposed projection is noise; re-decide clause 1."
    - id: vocabulary-pressure
      kind: manual
      description: "A real edge fits no closed kind three times: reopen clause 3 rather than overloading related_to."
  ```

  **Coverage (Decision 181 cl.2):** cl.6 plan-time decision existence -- validate_plan_documents
  (rec-4517); cl.1-5 and cl.6 write/DQ arms -- T4.23 c17-c19 (none enforced today).

  **Related:** Decisions 84, 86, 87, 93, 136, 137, 168, 181, 196, 197, 199, 205, 207, 210, 212,
  217, 229; rec-4517.

