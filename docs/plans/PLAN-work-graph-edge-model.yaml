    while the entry is new. Red on 722f0865 (no entry carries the title).'
  command: 'bin/venv-python -c "import re,pathlib; from scripts.decisions_md import extract_amends_edges as ae; t=pathlib.Path(''docs/DECISIONS.md'').read_text(encoding=''utf-8'');
    es=[m for m in re.finditer(r''^## Decision (\d+): (.*?)\n(.*?)(?=^## Decision |\Z)'', t, re.M|re.S) if ''Work-item edges are edge-state events''
    in m.group(2)]; assert len(es)==1, (''expected exactly one edge-model Decision entry'', [m.group(1) for m in es]); n=es[0].group(1); b=es[0].group(0);
    assert int(n)>=232, n; assert re.search(r''^number: ''+n+r''\b'', b, re.M) and ''value: numbered_decision'' in b and chr(10)+''amends: [197]''+chr(10)
    in b, ''envelope''; assert set(ae(es[0].group(2)))=={197}, ae(es[0].group(2)); cl=re.findall(r''^(\d)\. \*\*'', b, re.M); assert cl==[str(i)
    for i in range(1,8)], cl; need=[''Edge-state events'',''one row per edge-STATE event'',''proposed, confirmed and retracted'',''ONLY the implementation
    merge that'',''consumes the exact merged plan writes confirmed'',''Decision 205 cl.5'',''writes no confirmed edge'',''Suspect is derived at
    read, never stored'',''clause-8 walk input (T4.23 c14)'',''rejected loudly (Decision 207)'',''Proposed gates only its asserter'',''Closed
    vocabulary, one stored direction'',''Gating: depends_on'',''part_of, split_from, supersedes'',''discovered_from, related_to'',''serves (to
    a north star)'',''governed_by and realizes'',''Completion gates are criteria, never edges'',''SCD2 attribute'',''kind epic'',''Gating kinds
    require a rationale'',''docs/contracts/work-item-edges.yaml'',''content_hash until Decision 217 cl.5'',''never-renumbered clause id'',''slug
    form exists only after the split'',''kind: north_star'',''Decision 196 cl.3'',''never mutates an edge'',''Orphan rule'',''Every epic serves
    at least one north star'',''serves or governed_by'',''orphan_set verb and a DQ monitor, never a write reject (Decision 210 cl.2)'',''In-store
    refs (wi:, crit:)'',''checked at plan time against the git tree'',''PlanDocument amends and introduces'',''T4.32 c4'',''work_item_storage
    verbs, provisional'',''merge-authored-edges-lossy'',''A confidence column -- rejected'',''yaml reversal-conditions'',''proposed-edges-noise'',''vocabulary-pressure'',''Coverage
    (Decision 181 cl.2)'',''validate_plan_documents'',''rec-4517'']; bb='' ''.join(b.split()); miss=[p for p in need if p not in bb]; assert not
    miss, (''edge-model Decision text missing'', miss); edges=re.findall(r''(?:amends|Amends|supersedes|Supersedes) Decision (\d+)'', b); assert
    edges and set(edges)<={''197''}, edges; print(''DEC_EDGE_MODEL_OK'', n, len(b.encode(''utf-8'')))"'
  expected: Prints the marker, the minted number (232 at drafting) and the entry's byte size (5,129 at drafting).
  fix_if: A missing phrase means a clause was dropped or paraphrased -- restore STEP 1.1's text.
  hermetic: true
  graduation: graduate
  graduation_check_id: work-item-edge-decision-recorded
  expected_literals: []
- step: 5
