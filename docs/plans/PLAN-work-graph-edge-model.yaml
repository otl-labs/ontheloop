  def _edge_root(tmp_path: Path, contract_text: str) -> Path:
      root = tmp_path / "root"
      (root / "docs" / "contracts").mkdir(parents=True)
      (root / "docs" / "contracts" / "work-item-edges.yaml").write_text(contract_text, encoding="utf-8")
      (root / "docs" / "DECISIONS.md").write_text("## Decision 7: Live\n", encoding="utf-8")
      (root / "docs" / "DECISIONS_ARCHIVE.md").write_text("## Decision 3: Archived\n", encoding="utf-8")
      return root


  _SOURCES = "target_refs:\n  namespaces:\n    dec:\n      plan_time_sources: [docs/DECISIONS.md, docs/DECISIONS_ARCHIVE.md]\n"


  class TestPlanAmendsExistence:
      """rec-4517 (Decision 232 cl.6): amends refs resolve against the edge contract's plan_time_sources."""

      def test_live_and_archived_headers_resolve_from_the_contract_sources(self, tmp_path: Path) -> None:
          known, reason = module._known_decision_numbers(_edge_root(tmp_path, _SOURCES))
          assert known == {3, 7} and reason == ""  # count-coupling-ok: two-header fixture

      def test_repository_contract_names_both_decision_files(self) -> None:
          known, reason = module._known_decision_numbers(module._common.ROOT)
          assert reason == "" and known is not None and 197 in known

      def test_unreadable_contract_fails_closed(self, tmp_path: Path) -> None:
          known, reason = module._known_decision_numbers(tmp_path)
          assert known is None and "unreadable (FileNotFoundError)" in reason

      def test_missing_sources_key_fails_closed(self, tmp_path: Path) -> None:
          known, reason = module._known_decision_numbers(_edge_root(tmp_path, "target_refs: {}\n"))
          assert known is None and "unreadable (KeyError)" in reason

      def test_empty_sources_fail_closed(self, tmp_path: Path) -> None:
          text = "target_refs:\n  namespaces:\n    dec:\n      plan_time_sources: []\n"
          known, reason = module._known_decision_numbers(_edge_root(tmp_path, text))
          assert known is None and "non-empty list of paths" in reason

      def test_clause_suffix_resolves_to_the_whole_decision(self, tmp_path: Path) -> None:
          doc = type("Doc", (), {"amends": ["dec:7#zz", "dec:3", "dec:8"]})()
          failures = module._amends_existence_failures(tmp_path / "PLAN-x.yaml", doc, {3, 7})
          assert len(failures) == 1 and failures[0].startswith("PLAN-x.yaml: amends 'dec:8' names no")

