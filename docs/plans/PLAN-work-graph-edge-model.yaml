    edge-model Decision entry'', len(es)); n=es[0].group(1); b=re.search(r''^## Decision 197:.*?(?=^## Decision |\Z)'', t, re.M|re.S).group(0);
    a=[l for l in b.splitlines() if re.match(r''> \*\*Amended by Decision ''+n+r'' \(\d{4}-\d{2}-\d{2}\):\*\*'', l)]; assert len(a)==1 and all(w
