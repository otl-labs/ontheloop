  - "yaml_parse_spy.py: replace inspect.stack() in _scripts_frames with the sys._getframe/f_back walk and the lru_cache path helper. Post: VP 1 green; then VP 2 and 3."
  - "Add the graduated shard config/agent/verification_registry/entries/yaml-parse-spy-frame-walk.yaml for VP 1, pinning both VP 1 nodes (test_records_scripts_frames_without_inspect_stack and test_frames_are_innermost_first)."
  - "CLOSURE (implement skill Commit Flows): commit with Resolves: rec-5355; rebase; VP 4; push; PR titled build(yaml-parse-spy-frame-walk); code review in a fresh context; merge on PROCEED and green CI with Resolves: rec-5355 in the squash body; then VP 5 and 6."
