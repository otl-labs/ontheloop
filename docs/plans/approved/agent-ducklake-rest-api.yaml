slug: agent-ducklake-rest-api
tldr: 'One IAM-authorised REST API, applied by you from terraform/bootstrap, fronts the DuckLake reader, writer,
  telemetry reader and telemetry writer, so agents reach them on an amazonaws.com host the proxy signs. Its policy
  refuses every caller but the agent session user; each Lambda permission names one exact route; no bounded role may
  write API Gateway. Timeout 120 s by quota. An alarm watches API and permission edits. Decision 213 now allows the
  Function URL or the named route.'
