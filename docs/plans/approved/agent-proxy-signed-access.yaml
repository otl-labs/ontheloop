schema_version: 1
slug: agent-proxy-signed-access
tldr: 'Agent sessions reach AWS as one new IAM user whose key only the environment proxy holds and which signs every call
  itself: no session assumes a role or holds an AWS key, grants shrink to what sessions use (the four DuckLake Function
  URLs, endpoint lookup, logs and metrics, IAM role reads except the two ExternalId trust documents, no S3), the user
  keeps every PlatformDev Deny and explicitly denies minting and IAM writes, an IAM-change alarm watches the user and
  its policies from the first apply, admin work runs from operator CloudShell blocks until a follow-on admin
  environment lands, and keys stay long-lived with 90-day rotation.'
blocks:
- id: decision-new
  file: docs/DECISIONS.md
  before: |
