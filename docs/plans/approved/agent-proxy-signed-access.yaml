- id: agents-portal-line
  file: AGENTS.md
  before: |
    Portal calls require the `agent_platform` (PlatformDev) assume-role profile to reach the reader/writer Function URLs. If unreachable, confirm the chain with `bin/venv-python -m scripts.aws_identity caller-arn --profile agent_platform` (the session-start hook `.claude/hooks/session_start_aws.sh` reports this each session); a rotated `agent_static` key is updated in the environment's AWS network secret. There is no SSO login in the static-key model.
  after: |
    Agent sessions reach the reader/writer API routes via the `agent_platform` profile, signed by the proxy as user agent-platform-session (Decision {{N}}); CI uses the Function URLs; no session assumes a role. If unreachable, check `bin/venv-python -m scripts.aws_identity caller-arn --profile agent_platform` (the session-start hook `.claude/hooks/session_start_aws.sh` reports it each session); a rotated key goes in the environment's network secret.
- id: deploy-paths-session-identity
  file: docs/contracts/deploy-paths.yaml
  before: |2
      pre_merge_live_plan:
        description: >-
          Standing rule (incident #1316, fixed by #1323) for any plan whose scope changes a non-Markdown
  after: |2
      agent_session_identity:
        description: >-
          Decision {{N}}: agent sessions reach AWS as the proxy-held user agent-platform-session (terraform/bootstrap
          agent_session_user.tf); no session assumes a role. Every admin step is the operator's (Decision {{N}} cl.3): a
          block an agent prepares and the operator runs in AWS CloudShell as
          user/platform-breakglass, returning only the printed lines, or the IAM console where a secret is shown (the
          key below).
        procedure:
          - "Key: in the IAM console (Users, agent-platform-session, Security credentials) create one access key and paste its two values straight into each agent environment's AWS network secret, never into a chat, a shell, a file or the repo; rotate every 90 days the same way: create the new key, update every environment, open a fresh session that passes the check below, then deactivate the old key and delete it after 7 days. Each key creation, deactivation and deletion matches platform-security-agent-session-iam-change: its email is expected and acknowledged, never silenced."
          - "Hosts: the secret allows exactly sts, ssm, logs and monitoring in the project region, iam.amazonaws.com and the DuckLake REST API's execute-api host printed from /agent-platform/ducklake/api_url/ops/reader; never a wildcard, never an on.aws Function URL host (the proxy cannot sign one) and never an S3 host, so presigned telemetry uploads pass unsigned."
          - "Container: the environment's setup field is bin/setup-cloud-env.sh's header template, and its env-var field sets OTL_OPS_VERBS_TRANSPORT=execute_api and no AWS_PROFILE."
          - "Check: a fresh session prints OK: user/agent-platform-session from .claude/hooks/session_start_aws.sh."
      pre_merge_live_plan:
        description: >-
          Standing rule (incident #1316, fixed by #1323) for any plan whose scope changes a non-Markdown
