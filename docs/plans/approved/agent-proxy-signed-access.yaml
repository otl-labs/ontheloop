- id: agents-portal-line
  file: AGENTS.md
  before: |
    Portal calls require the `agent_platform` (PlatformDev) assume-role profile to reach the reader/writer Function URLs. If unreachable, confirm the chain with `bin/venv-python -m scripts.aws_identity caller-arn --profile agent_platform` (the session-start hook `.claude/hooks/session_start_aws.sh` reports this each session); a rotated `agent_static` key is updated in the environment's AWS network secret. There is no SSO login in the static-key model.
  after: |
    Portal calls reach the reader/writer Function URLs through the `agent_platform` profile, which the proxy signs as the agent-platform-session user (Decision {{N}}); no session assumes a role. If unreachable, check with `bin/venv-python -m scripts.aws_identity caller-arn --profile agent_platform` (the session-start hook `.claude/hooks/session_start_aws.sh` reports it each session); a rotated key goes in the environment's AWS network secret.
- id: deploy-paths-session-identity
  file: docs/contracts/deploy-paths.yaml
  before: |2
      pre_merge_live_plan:
        description: >-
          Standing rule (incident #1316, fixed by #1323) for any plan whose scope changes a non-Markdown
  after: |2
      agent_session_identity:
        description: >-
          Decision {{N}}: agent sessions reach AWS as the proxy-held user agent-platform-session (terraform/bootstrap
          agent_session_user.tf); no session assumes a role. Until Decision {{N}} cl.4's admin environment lands, every
          admin step, this one's included, is a block an agent prepares and the operator runs in AWS CloudShell as
          user/platform-breakglass, returning only the printed lines.
        procedure:
          - "Key: in the IAM console (Users, agent-platform-session, Security credentials) create one access key and paste its two values straight into each agent environment's AWS network secret, never into a chat, a shell, a file or the repo; rotate every 90 days the same way: create the new key, update every environment, open a fresh session that passes the check below, then deactivate the old key and delete it after 7 days. Each key creation emails platform-security-agent-session-iam-change once: expected, acknowledged, never silenced."
          - "Hosts: the secret allows exactly sts, ssm, logs and monitoring in the project region, iam.amazonaws.com and the four Function URL hosts printed from /agent-platform/ducklake/{reader,writer,telemetry_reader,telemetry_writer}_url; never a wildcard and never an S3 host, so presigned telemetry uploads pass unsigned."
          - "Container: the environment's setup field is bin/setup-cloud-env.sh's header template, and its env-var field sets no AWS_PROFILE."
          - "Check: a fresh session prints OK: user/agent-platform-session from .claude/hooks/session_start_aws.sh."
      pre_merge_live_plan:
        description: >-
          Standing rule (incident #1316, fixed by #1323) for any plan whose scope changes a non-Markdown
