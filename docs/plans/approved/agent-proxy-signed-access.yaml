schema_version: 1
slug: agent-proxy-signed-access
tldr: 'Agent sessions reach AWS as one new IAM user whose key only the environment proxy holds; the proxy signs each
  call, so no session assumes a role or holds a key. The user has its own boundary and only what sessions use: the four
  DuckLake API routes, endpoint lookup, logs, metrics and role reads (not the two ExternalId trust documents), and no S3.
  It keeps every PlatformDev Deny and denies minting and IAM writes; an IAM-change alarm watches it. Admin work stays in
  your CloudShell. Keys rotate every 90 days.'
