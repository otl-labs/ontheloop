    ## Decision {{N}}: An amendment_log over its full-row limit shrinks on touch -- a change that adds a row also compacts one more row the compaction tool can select, and an old row changes only by a lossless compaction (amends Decision 275) (Decided)

    ```yaml
    number: {{N}}
    status: Decided
    decided_date: "{{DATE}}"
    kind:
      value: direction
      justification: >-
        Clause 1 narrows a gate: a change that adds a row fails until one more old row is compacted; undone, a log over
        the limit holds its size for ever.
    amends: [275]
    significance:
      value: numbered_decision
      justification: >-
        It re-measures Decision 275 cl.4's ratified hold and adds a rule for changing old rows; a dated note on Decision
        275 (considered) cannot re-measure a ratified clause (Decision 276), and contract-population.yaml (considered)
        holds the values, not the authority to tighten the gate.
    delegates:
      - key: docs/contracts/contract-population.yaml#amendment_log_retention.keep_full
        change_rule: contract_amendment
        bounds: {min: 3, max: 5}
      - key: docs/contracts/contract-population.yaml#amendment_log_retention.decay_per_change
        change_rule: contract_amendment
        bounds: {min: 1, max: 3}
    ```

    **Status:** Decided
    **Date:** {{DATE}}
    **Warehouse ID:** dec-{{N}} (per Decision 84 backfill)

    **Problem:** Decision 275 cl.4 holds a log at its base count of full rows when a row is added, so the 27 contracts
    over five full rows never shrink: 151 rows sit past the newest five, 107 of them compactable by the tool (main
    30a7a678). Old rows reworded by hand can drop the plan, rec or Decision a terse row exists to keep, and no check sees it.

    **Intent:** A contract's amendment_log returns to its newest N full rows one change at a time, and every compacted row
    keeps its pointers.

    **Decision:**
    1. **Decay.** A change that adds a top-level amendment_log row leaves at most N full rows, or the base's full rows
       less D if that is more, with N and D held at docs/contracts/contract-population.yaml amendment_log_retention (today
       5 and 1). Only rows the compaction tool (scripts.checks.contracts.amendment_compact) selects on the changed file
       count: where it selects none, Decision 275 cl.4's hold still binds. One decay per change, however many rows it
       adds. The failure names the tool command; CI never rewrites a contract.
    2. **Newest.** Full rows rank by date, ties broken as amendment_log_retention orders them; the tool compacts the
       oldest first and never the newest N.
    3. **Lossless.** In any change, an existing row stays as it was or becomes a terse row with the same date,
       semantic_break and change_class that keeps every pointer its full text named (the tool's pointer set: plans, recs,
       Decisions and roadmap ids). A row marking a semantic break does not change.
    4. **New rows.** A new top-level row not marking a semantic break carries only the terse row's keys, so the tool
       can compact it later; other detail goes to the plan or Decision it names.
    5. **Amends Decision 275 cl.4.** Its hold stands where the tool selects nothing; this Decision adds clauses 1-4. Its
       exemptions stand: rows marking a semantic break, field-level logs and north-star.yaml.

    **Options considered:** one decay per added row -- rejected: a change adding several rows would compact many; decay
    on any edit -- rejected: it would tax edits that add no row and log-only compactions; counting every compactable row
    -- rejected: rows inside the newest N cannot be compacted, so the rule could demand the impossible; counting the
    base's selectable rows -- rejected: a new row changes which rows sit past the newest N; a warning period -- rejected:
    the remedy is one printed command; a CI autofix -- rejected: it writes to other projects' branches; a dated note on
    Decision 275 -- rejected: a note cannot re-measure a ratified clause.

    **Coverage (Decision 181 cl.2):** cl.1-4 -- validate_contract_drift (Pass 2); cl.5 -- the dated note on Decision 275.
    Residual: rows the tool refuses (44 past the newest five today) stay full until compacted by hand under clause 3;
    standards census row S8 tracks the files over the limit.

    ```yaml reversal-conditions
    decision: {{N}}
    review_by: 2027-02-24
    on_trigger: "re-decide via /plan"
    conditions:
      - id: decay-too-slow
        kind: manual
        description: "60 days after install, full rows past the newest N across docs/contracts have fallen by less than a third: raise D or sweep."
      - id: refused-grows
        kind: manual
        description: "Rows the tool refuses past the newest N rise above their count at install: clause 4 is not holding; re-decide it."
    ```

    **Related:** Decision 275 (amended: cl.4), 240 cl.4, 276, 278, 166; rec-5452, rec-5453, rec-5454.

