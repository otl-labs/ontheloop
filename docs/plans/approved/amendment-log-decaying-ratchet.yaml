schema_version: 1
slug: amendment-log-decaying-ratchet
tldr: A new Decision amending Decision 275 cl.4. A change that adds a top-level amendment_log row to a contract over its five
  full rows also compacts one more row the compaction tool can select (one decay per change), while today's hold still binds
  where the tool selects nothing; an old full row changes only by a lossless terse compaction and stays compactable if it
  was; and a new non-break row is terse or one the tool can compact later. A dated note on Decision 275 records the amendment.
