schema_version: 1
slug: apache-flip-precedes-client-work
tldr: >-
  A new direction Decision reverses Decision 194's reasoning: the early Apache-2.0 flip no longer waits for a finished
  local core and a serving paid service, but only for the founder-to-company IP assignment and a clean
  dependency-licence audit, and it comes before On The Loop Labs offers On The Loop to any services client. It says
  what the flip spends (no Additional Use Grant widening, no commercial licence, no dual licensing) and leaves the
  flip itself, the Licensor line, the release, the vocabulary, contributions and client guardrails to six recs. NS.2
  becomes "Open source before the first client depends on it" with its README line; Decision 194 gains one dated note.
  No licence file changes here.
