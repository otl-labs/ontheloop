    ## Decision 183:
- id: north-star-ns2
  file: docs/contracts/north-star.yaml
  before: |2
      - id: NS.2
        kind: north_star
        principle: Source-available now, open source on proof.
        detail: >-
          Why: to stop companies with more capital outcompeting On The Loop Labs before it is ready to compete. On The
          Loop Labs supports open-source principles but is not yet in a position to make On The Loop open source. The
          entry governs this repository's code; an adopter's own code never has to be open source. BUSL-1.1,
          forward-only (Decision 171); the conversion to Apache-2.0 is staged on two named conditions rather than left
          to the fixed Change Date (Decision 194), whose grant text this entry never fixes. What is paid is set by NS.7,
          and "free" is a price, never a licence term (Decision 233 clause 2). On The Loop Labs Limited owns On The Loop
          and this repository; the Licensor line follows the owner once the IP assignment executes (Decision 195
          clauses 1-3).
        failure_signal: >-
          A capability one team needs to run the governed loop appearing only in the paid service, Decision 194's
          conditions holding with no flip scheduled, or a licence term reaching an adopter's own code.
        binds: repository
        carried_by: [171, 194, 195, 233]
  after: |2
      - id: NS.2
        kind: north_star
        principle: Open source before the first client depends on it.
        detail: >-
          Why: On The Loop Labs' first revenue is services work in which a client depends on On The Loop as a
          framework, and a licence term reserving production use would keep that client off the core and stop the
          adoption that shows which adapters and brownfield paths to build. The entry governs this repository's code;
          an adopter's own code never has to be open source. BUSL-1.1, forward-only (Decision 171), until the
          Apache-2.0 flip, which waits only on the IP assignment and a clean dependency-licence audit and comes before
          any services engagement (Decision {{N}}); this entry never fixes the licence text. What is paid is set by
          NS.7, and "free" is a price, never a licence term (Decision 233 clause 2). On The Loop Labs Limited owns On
          The Loop and this repository; the Licensor line follows the owner once the IP assignment executes (Decision
          195 clauses 1-3).
        failure_signal: >-
          A services client depending on a release while its licence is BUSL-1.1, Decision {{N}}'s two preconditions
          holding with no flip scheduled, or a licence term reaching an adopter's own code.
        binds: repository
        carried_by: [171, 194, 195, 233, {{N}}]
