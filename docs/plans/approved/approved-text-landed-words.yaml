schema_version: 1
slug: approved-text-landed-words
tldr: >-
  Lets a plan be marked implemented after its approved wording has already landed. For a bound file the closing PR
  leaves unchanged, the merge check accepts the one earlier main commit that made exactly the approved change (and
  prints it), so later edits on main no longer block it; your approval is still checked. Late closure stops excluding
  plans with approved wording. git-ops.yaml says so in three places, gains a log row, and two old log rows are shortened
  for the size cap.
blocks:
- id: gitops-landed-rule
  file: docs/contracts/git-ops.yaml
  before: |2-
    applied (whitespace and line wrapping ignored; a YAML file must still parse). Provenance
  after: |2-
    applied (whitespace and line wrapping ignored; a YAML file must still parse). LANDED (rec-5057): a bound file the
    declaring PR leaves unchanged that fails this check passes instead when one first-parent commit C after the
    sidecar's adding commit, the same C for every such file and the only one qualifying, turned the file's words at C^
    into the approved result, with C's diff touching the plan's scope, the plan undeclared at C and the sidecar's
    approved words at C equal to the base's; validate_merge_step and premerge print LANDED naming C, and the approval
    check below still runs. Words edited on main after C are not rechecked. Provenance
- id: gitops-late-closure
  file: docs/contracts/git-ops.yaml
  before: |2-
    the plan has bundled recs and no approved-text sidecar (excluded; it closes only through the normal path), and
  after: |2-
    the plan has bundled recs (a sidecar's words are checked by approved_text_binding LANDED), and
- id: gitops-coverage
  file: docs/contracts/git-ops.yaml
  before: |2-
    which is procedural, and a plan with an approved-text sidecar is excluded from the route (its bound text has no
    mechanical late check). These residuals
  after: |2-
    which is procedural, and a sidecar plan's bound words are checked mechanically by validate_merge_step's LANDED
    rule (approved_text_binding). These residuals
