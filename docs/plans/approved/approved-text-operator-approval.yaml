- id: git-ops-binding
  file: docs/contracts/git-ops.yaml
  before: |
    `scripts.roadmap.approved_text record`
      prints the digest the operator approves; the approving message id stays outside the repository. That the committed
      sidecar is the text the operator approved is procedural (the digest is compared outside the repository); rec-4769
      owns that residual (Decision 181 clause 2).
  after: |
    Provenance
      (Decision {{N}}): `scripts.roadmap.approved_text record` prints the digest and the approved-words digest (anchor
      words dropped, so an anchor-only re-anchor keeps it). The operator approves a sidecar on the `approved-text` Environment gate of an approved-text-approval.yml run
      dispatched from main with its slug, commit and approved-words digest; the run comments on any open PR at that
      commit. validate_plan_documents (a sidecar the diff adds or changes) and validate_merge_step (the base sidecar)
      read that approval from GitHub (scripts/roadmap/approved_text_github.py) or accept a sidecar grandfathered at the
      rollout commit (scripts/roadmap/approved_text_provenance.py); a missing or unreadable approval fails in
      pull-request CI only and is advisory elsewhere. Residual owners: the grant-based approval (rec-4695), block
      location (rec-4907), merge on red (rec-4080) and checks judged by their own copy (rec-2827).
- id: planning-step-8b
