  before: |
    it checks the tree holds exactly the sidecar's edits (`approved_text.verify`), then runs `validate --pre` there, whose selector runs every test and registered check that reads a changed file. Revise until PASS; record each run as a `gate: wording-check` row with the digest, base and selection status it printed.
  after: |
    it checks the tree holds exactly the sidecar's edits, then runs `validate --pre` there. Revise until PASS; record each run as a `gate: wording-check` row with the digest, base and selection it printed. Then push it and get approval per Decision {{N}}: dispatch the approval run and paste the wording with its link.
