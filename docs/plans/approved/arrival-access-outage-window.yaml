schema_version: 1
slug: arrival-access-outage-window
tldr: "Records the 2026-11-12 to 2026-11-14 agent AWS access outage as a lost window in the arrival check, so the five
  merged sessions whose pull requests were opened while no session could reach the telemetry writer stop counting as
  missing and telemetry-arrival on main goes green; nothing else in the file changes."
blocks:
- id: lost-window
  file: config/telemetry/arrival.yaml
  before: |
    lost_windows:
      - {to: "2026-10-28T00:00:00Z", owner: "Decision 250", reason: before production capture}
      - {from: "2026-11-03T00:49:00Z", to: "2026-11-06T00:56:31Z", owner: rec-4939, reason: "capture pin outage, no backfill"}
      - {from: "2026-11-09T22:33:00Z", to: "2026-11-11T10:38:16Z", owner: rec-5055, reason: "plugin hooks skipped after the harness start directory moved, no backfill"}
  after: |
    lost_windows:
      - {to: "2026-10-28T00:00:00Z", owner: "Decision 250", reason: before production capture}
      - {from: "2026-11-03T00:49:00Z", to: "2026-11-06T00:56:31Z", owner: rec-4939, reason: "capture pin outage, no backfill"}
      - {from: "2026-11-09T22:33:00Z", to: "2026-11-11T10:38:16Z", owner: rec-5055, reason: "plugin hooks skipped after the harness start directory moved, no backfill"}
      - {from: "2026-11-12T20:54:23Z", to: "2026-11-14T14:05:36Z", owner: rec-5144, reason: "agent AWS access outage, sessions could not reach the telemetry writer until the environment swap, no backfill"}
