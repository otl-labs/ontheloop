schema_version: 1
slug: arrival-lost-window-author-date
tldr: "Turns on the arrival check's author-date rule with a 7-day grace (a session whose own commits were written inside a
  recorded outage window is not counted missing when its PR opens within 7 days after it) and records the second GitHub
  read in the ports contract."
blocks:
- id: grace-days
  file: config/telemetry/arrival.yaml
  before: |
    collapse_min_commits: 3
  after: |
    collapse_min_commits: 3
    authored_grace_days: 7
- id: sa-07
  file: docs/contracts/ports.yaml
  before: |
    The arrival check assumes squash-merge first-parent history on main whose subject ends with a (#N) pull request number, the
    harness's Claude-Session trailer whose URL's last segment is the harness session key, GitHub's pulls/{n} created_at, and
    the literal default repository slug otl-labs/ontheloop when GITHUB_REPOSITORY is unset.
  after: |
    The arrival check assumes squash-merge first-parent history on main whose subject ends with a (#N) pull request number, the
    harness's Claude-Session trailer whose URL's last segment is the harness session key, GitHub's pulls/{n} created_at,
    GitHub's pulls/{n}/commits author dates (at most 250 commits listed, and an author date a rebase keeps), and the literal
    default repository slug otl-labs/ontheloop when GITHUB_REPOSITORY is unset.
- id: amendment-log
  file: docs/contracts/ports.yaml
  before: |
    amendment_log:
  after: |
    amendment_log:
      - {date: "{{DATE}}", semantic_break: false, change_class: field_add, summary: "PLAN-arrival-lost-window-author-date (rec-5084): structural_assumptions SA-07 extends to GitHub's pulls/{n}/commits author dates, read when a pull request's creation misses every lost window."}
