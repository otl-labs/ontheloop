schema_version: 1
slug: bootstrap-ci-gated-apply
tldr: terraform/bootstrap moves to CI. After merge, a read-only preview lists each change by name and flags new roles, trust
  and grant changes; one approval in a new tf-bootstrap-apply Environment lets a gated role apply only what it listed, and
  only to boundary-carrying agent-platform-* CI roles and their policies. The protected set (boundary, PlatformAdmin, PlatformDev,
  agent users, detector, github-settings and bootstrap roles) stays your CloudShell step, as do the pre-merge plan and the
  IAM simulation after a CI-role grant change, until CI can run them.
