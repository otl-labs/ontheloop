  after: |2
      recovery: "For a terraform/bootstrap change an agent opens a pull request; bootstrap_ci_apply below applies or refuses it. For agent_platform_admin IAM/trust/destroy changes, an agent's only move is to file a rec describing what's needed and why -- those are human-only. The Decision 120 break-glass local-apply loop is a narrower carve-out: an agent may execute terraform apply there only after a human has reviewed the plan and explicitly directed it -- never self-directed."
