  after: |2
          role's grant surface ends SIMULATE_OWED, when the operator runs the POST-APPLY simulate in CloudShell from a
          clone of main with no profile, until a gated CI runbook carries it. Before the approval the preview checks each
          changed policy document and trust with IAM Access Analyzer against config/iam-invariants.json (Decision 257's
          {{DATE}} Update); a refused check turns the run red, CloudShell plans included, and the gated job applies only
          the documents the preview checked.
