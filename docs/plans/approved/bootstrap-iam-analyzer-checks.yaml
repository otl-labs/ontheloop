schema_version: 1
slug: bootstrap-iam-analyzer-checks
tldr: 'Before you approve a terraform/bootstrap apply, its preview now checks every policy the run would change with AWS IAM Access Analyzer. A policy that gives the agent user or a CI-writable role anything on a fixed never-list (IAM writes, role assumption, secret values, S3 objects and the like), fails AWS policy validation, or opens a trust to the public stops the run before approval. A wider grant is flagged, not stopped. Only changed policies are checked. Words: a dated Update to Decision 257 and two deploy-paths lines.'
blocks:
- id: decision-257-update
  file: docs/DECISIONS.md
  before: |
    **Related:** Decisions 77, 94, 113, 143, 172, 180, 202, 205, 233, 237, 239, 246, 248, 252.
  after: |
    **Related:** Decisions 77, 94, 113, 143, 172, 180, 202, 205, 233, 237, 239, 246, 248, 252.

    > **Update ({{DATE}}):** The preview also checks, with IAM Access Analyzer, each policy the run would change
    > (PLAN-bootstrap-iam-analyzer-checks). Clause 3 widens for bootstrap-preview alone: it may call ValidatePolicy,
    > CheckAccessNotGranted, CheckNoNewAccess and CheckNoPublicAccess, which read no account resource and return only
    > verdicts; bootstrap-apply gains nothing. Clause 2 gains a step: the preview sends Access Analyzer every created or
    > updated policy document, the policy of each new attachment and each changed trust, and only those. A document
    > belongs to a class by its own name or by the principal it is attached to: the agent session user's, or the
    > agent-platform-* roles and policies CI may write. One that grants an action on its class's never-list in
    > config/iam-invariants.json, that ValidatePolicy reports an error on (in those classes, a security warning too),
    > or (a trust) that allows public access refuses the run before the approval, a plan that ends in CloudShell
    > included. A permissions boundary CI may write is a ceiling, not a grant: it is held to neither the never-list
    > nor security warnings. A grant wider than the one it replaces is flagged for the operator, never refused. The
    > gated job calls no Access Analyzer check: it applies only rows whose documents match, by digest, the ones the
    > preview checked. A change to the never-list re-checks every document once. Output names the resource, the check
    > and its verdict, never the document or a finding's text (Decision 238 cl.4). The never-list changes only by a
    > reviewed PR, and a never row is never removed or narrowed to pass a check (Decision 235). Clause 8's coverage adds
    > tests/checks/iam_tf/test_bootstrap_preview_analyzer.py, tests/checks/iam_tf/test_iam_invariants.py and the
    > analyzer's and gate's tests. Residuals: each check reads one document, never its boundary or its principal's
    > other policies; an AWS-managed attachment, a document unknown until apply and IAM group policies are not
    > checked; a trust is checked for public access only.
