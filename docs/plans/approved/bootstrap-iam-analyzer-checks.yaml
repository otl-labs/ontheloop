schema_version: 1
slug: bootstrap-iam-analyzer-checks
tldr: 'AWS''s public-access check rejects any role trust that names a GitHub OIDC provider, so the bootstrap preview now checks those trust statements itself: it refuses unless each one names an OIDC provider of this account alone and pins a repository on its sub condition. The trust''s other statements still go to AWS. Words: a second dated Update to Decision 257 after the 2026-11-16 one, which stays as it is.'
blocks:
- id: decision-257-oidc-trust-update
  file: docs/DECISIONS.md
  before: |
    > policies (the API route, App key and trail policies) and policy blocks inside a role are not checked; a trust is
    > checked for public access only.
  after: |
    > policies (the API route, App key and trail policies) and policy blocks inside a role are not checked; a trust is
    > checked for public access only.

    > **Update ({{DATE}}):** A federated OIDC role trust (the GitHub Actions roles) is rejected by CheckNoPublicAccess,
    > so the analyzer checks it by its own rule: it refuses unless each Allow statement names an OIDC provider of the
    > account alone and pins a repository on that provider's sub condition; the document's other statements still go
    > to Access Analyzer. The residual 'a trust is checked for public access only' stands for every other trust.
