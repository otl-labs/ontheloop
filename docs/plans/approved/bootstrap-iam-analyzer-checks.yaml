schema_version: 1
slug: bootstrap-iam-analyzer-checks
tldr: 'AWS''s public-access check rejects any role trust statement that names a GitHub OIDC provider, so the bootstrap preview now checks those statements itself: each one that allows access must name only OIDC providers of this account and pin one exact repository, with no wildcard, on its sub condition, or the run is refused. The trust''s other statements still go to AWS. Which repository is pinned is not checked. Words: a second dated Update to Decision 257 after the 2026-11-16 one, which stays as it is.'
blocks:
- id: decision-257-oidc-trust-update
  file: docs/DECISIONS.md
  before: |
    > policies (the API route, App key and trail policies) and policy blocks inside a role are not checked; a trust is
    > checked for public access only.
  after: |
    > policies (the API route, App key and trail policies) and policy blocks inside a role are not checked; a trust is
    > checked for public access only.

    > **Update ({{DATE}}):** CheckNoPublicAccess rejects a trust statement whose principal is a federated OIDC
    > provider (the GitHub Actions roles) or a federated '*', so the analyzer checks each such statement by its own
    > rule: one that allows access refuses the run unless it names only OIDC providers of the account and pins one
    > repository, with no wildcard, on each provider's sub condition. The document's other statements still go to
    > Access Analyzer. Which repository a pin names is not checked; 'a trust is checked for public access only' stands
    > for every other trust statement.
