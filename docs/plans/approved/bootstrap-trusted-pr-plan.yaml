  after: |
    The canonical corpus of ratified architectural and operational decisions, and the sole ETL source for the `ops_decisions` warehouse table (Decision 84). Fully-superseded entries move to `docs/DECISIONS_ARCHIVE.md` per the archival policy in Decision 146.

    ## Decision {{N}}: terraform/bootstrap PRs get a screened PR-time trusted plan under their own read-only role, which replaces the operator's CloudShell pre-merge plan for every PR it accepts (amends Decisions 144, 238 and 257) (Decided)

    ```yaml
    number: {{N}}
    status: Decided
    decided_date: "{{DATE}}"
    kind:
      value: direction
      justification: >-
        Yes: it sets which identity plans a bootstrap PR before merge, what that job may read and refuse (clauses 1-3),
        and when the operator's CloudShell pre-merge plan is still needed (clause 4), each a standing rule.
    amends: [144, 238, 257]
    serves: [NS.9]
    significance:
      value: numbered_decision
      justification: >-
        Yes: it re-decides Decision 257 cl.5 on its pr-time-plan-lands condition, adds a third role to 257 cl.3, names a
        boundary-free role (144 cl.3, as Decision 270 did) and adds a trusted workflow to 238 cl.2; dated notes on each
        (amendment_forms, considered) would split one ruling in three, and deploy-paths.yaml (considered) is navigation
        only (Decision 126 cl.2) and holds no role.
    ```

    **Status:** Decided
    **Date:** {{DATE}}
    **Warehouse ID:** dec-{{N}} (per Decision 84 backfill)

    **Problem:** Decision 257 cl.5 keeps the operator's CloudShell read-only plan and caller check on every
    terraform/bootstrap PR until a screened PR-time trusted plan covers the root. Since Decision 256 no agent holds an
    admin identity, so every bootstrap PR costs the operator two pastes before merge.

    **Intent:** A bootstrap PR first meets the provider in CI before merge, with no operator step, and unreviewed agent
    HCL never runs as the identity whose preview feeds the gated apply.

    **Decision:**
    1. **Job (amends 238 cl.2, 257 cl.5).** .github/workflows/terraform-bootstrap-plan.yml, main's definition on
       pull_request_target for same-repo, non-Dependabot PRs aimed at main that touch terraform/bootstrap, in the
       tf-trusted-plan Environment, joins Decision 238 cl.2's trusted workflows, and 238 cl.3 and cl.4 hold for it: only
       the root's .tf files come from the PR, init is hermetic from the S3 provider mirror, tfvars exist only as process
       environment, output is names only, no plan file or plan JSON is stored and no LLM runs. It plans the PROD backend
       read-only with -lock=false and posts the bootstrap gate's predicted verdict and rows and the Access Analyzer
       verdicts on the documents the plan changes. It is advisory, never a required check; a failed plan or an Analyzer
       refusal fails it. Decision 257 cl.2's post-merge preview stays authoritative.
    2. **Role (amends 144 cl.3, 257 cl.3).** bootstrap-pr-plan joins bootstrap-preview and bootstrap-apply: inside the
       protected bootstrap-* set, outside agent-platform-*, boundary-free by explicit exclusion for 257 cl.3's reasons. Its
       one trust statement names the tf-trusted-plan subject and this workflow's job_workflow_ref at refs/heads/main,
       exact match. It holds bootstrap-preview's plan-time reads through the same policy, the four Access Analyzer
       checks and a read of the hashicorp/aws mirror prefix, denies everything else and never writes or locks state. It
       is a declared consumer of the personal tfvars parameter (Decision 237 cl.2). bootstrap-preview and bootstrap-apply
       are unchanged.
    3. **Screen (238 cl.4 for this root).** Before any credential, main's screen with this root's code-owned row refuses
       a change to a main-only file (main.tf, the lockfile, the SIT backend file, the authority budget, variables.tf and
       the files holding the PlatformDev and PlatformAdmin roles, PlatformAdmin's policies and the heartbeat canary); a
       resource type outside the row; a data source other than aws_iam_policy_document and the secret-metadata lookups the
       row names, each by its literal name; an import id that is not a literal; any reference to the ExternalId or owner variables or to
       an attribute of the PlatformDev or PlatformAdmin roles other than arn, name and id; and count or for_each over
       anything but locals built from literals and the environment variable.
    4. **Pre-merge plan (re-decides 257 cl.5).** For a PR the job plans, its comment at the PR's current head is the
       root's pre-merge live contact. deploy-paths.yaml pre_merge_live_plan's CloudShell plan and caller check remain only
       for a PR it refuses and for the SIT backend (Decision 252 cl.7). The Decision 205 plan reviewer does not come with
       it: 205 cl.2 keeps a persona off pull_request_target, its input names are agent-written, and every apply of this
       root is already operator-approved and Access-Analyzer-checked.
    5. **Residual.** HCL that passes the screen is evaluated with read access to a state holding the break-glass trust
       documents, so a plan's shape (counts, success, timing) can carry a few bits, as 238 cl.4 accepted for
       terraform/personal; clause 3 bounds it for the ExternalIds and the owner address. The operator accepts it for this
       root.

    **Rationale:** The trusted pattern already plans two roots. A separate role keeps the post-merge preview's identity on
    reviewed HCL, gives the PR plan its own CloudTrail identity and lets it be revoked alone, for one more protected role
    whose reads cannot drift because they are one policy. Rejected: adding the workflow to bootstrap-preview's trust (one
    identity for reviewed and unreviewed HCL); a credential-free reviewer job (a model credential beside
    pull_request_target for little gain); registry init (238 cl.3).

    **Coverage (Decision 181 cl.2):** cl.1, validate_trusted_plan_environment's predicates on the new workflow; cl.2,
    tests/checks/iam_tf/test_bootstrap_pr_plan_role.py and the post-apply simulation; cl.3, the bootstrap-row nodes of
    tests/test_terraform_hcl_screen.py; cl.4, validate_admin_root_premerge_gate; the first live run, the probe PR.
    Residuals: clause 5's bit channel; the job plans the PROD backend only; CODEOWNERS does not bind agent PRs (rec-2827).

    ```yaml reversal-conditions
    decision: {{N}}
    review_by: 2027-05-31
    on_trigger: "re-decide via /plan; disable terraform-bootstrap-plan.yml until then"
    conditions:
      - id: screen-miss
        kind: manual
        description: "A PR's plan evaluated HCL this root's screen row should have refused: re-decide clause 3."
      - id: protected-ci-apply
        kind: manual
        description: "CI may apply part of the protected set: re-check clause 2's separation."
    ```

    **Related:** Decisions 77, 101, 126, 172, 202, 205, 223, 235, 237, 238, 252, 256, 257.
