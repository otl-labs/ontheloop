- id: taxonomy-bootstrap
  file: docs/contracts/environment-taxonomy.yaml
  before: |2
        apply_gating: >-
          admin-only for its pre-merge plan and its protected set (operator CloudShell, deploy-paths.yaml
          admin_out_of_band.bootstrap_ci_apply); every other change is CI-applied by terraform-bootstrap-apply.yml from
          main behind one operator approval in the tf-bootstrap-apply Environment, applying only what its read-only
          preview listed (Decision 257). NEVER auto-apply (Decision 77; CD.35 Wave 4 / T2.23)
  after: |2
        apply_gating: >-
          admin-only for its protected set (operator CloudShell, deploy-paths.yaml admin_out_of_band.bootstrap_ci_apply)
          and for the pre-merge plan of a PR its trusted PR plan refuses; every other change is CI-applied by
          terraform-bootstrap-apply.yml from main behind one operator approval in the tf-bootstrap-apply Environment,
          applying only what its read-only preview listed (Decision 257). Its pre-merge live provider contact is the
          read-only PR-time CI plan, terraform-bootstrap-plan.yml (main's copy on pull_request_target, Decision {{N}}),
          unless that job refuses the PR. NEVER auto-apply (Decision 77; CD.35 Wave 4 / T2.23)
- id: planning-skill-admin-roots
  file: .claude/skills/planning/SKILL.md
  before: |
    **Admin-only roots:** if scope touches a non-Markdown file under a root whose `environment-taxonomy.yaml` axis_a apply_gating is admin-only (today `terraform/bootstrap`), the plan MUST meet `docs/contracts/deploy-paths.yaml` `admin_out_of_band.pre_merge_live_plan`: a pre-merge read-only ADMIN plan step, the credential check, and the V3 resolution in `context:`.
  after: |
    **Admin-only roots:** scope touching a non-Markdown file under an admin-only root (`environment-taxonomy.yaml` axis_a; today `terraform/bootstrap`) MUST meet `docs/contracts/deploy-paths.yaml` `admin_out_of_band.pre_merge_live_plan`: the trusted PR plan's verdict step (a refused PR: the CloudShell plan and caller check) and the V3 resolution in `context:`.
