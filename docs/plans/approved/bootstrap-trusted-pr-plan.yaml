- id: deploy-paths-pre-merge
  file: docs/contracts/deploy-paths.yaml
  before: |2
      pre_merge_live_plan:
        description: >-
          Standing rule (incident #1316, fixed by #1323) for any plan whose scope changes a non-Markdown
          file under a Terraform root whose environment-taxonomy.yaml axis_a apply_gating is admin-only
          (today terraform/bootstrap); a Markdown-only change is exempt. Static checks never reach a provider, so the root's first live contact
          must happen BEFORE merge. Rule and navigation only: apply-model and guard rules stay in
          environment-taxonomy.yaml.
        rule:
          - >-
            PRE-MERGE GATE (ADMIN): the plan carries a pre-deploy step that runs a read-only `terraform
            plan -lock=false` of the root in a throwaway git worktree at the CI-green $PR_HEAD_SHA, with
            a declared expected outcome (named counts, or failure only on named diagnostics). Plan files
            are deleted in the same step; counts-only evidence and the sha are posted on the PR; a new
            head re-runs the gate. The gate never applies or writes state, so it is not a bootstrap
            change under Decision 126; like every admin-tier action it runs on the operator's direction, given in that
            session (protected-actions.yaml approval); a standing or relayed authorisation does not count.
          - >-
            ENVIRONMENT CHECK: before assuming any post-merge hand-off, the implementing session checks
            its own credentials with `bin/venv-python -m scripts.aws_identity caller-arn --profile
            agent_platform_admin 2>/dev/null | grep -q 'assumed-role/PlatformAdmin/' && echo
            ADMIN_CHAIN_OK || echo ADMIN_CHAIN_ABSENT` (the helper reads the identity from a second
            region's STS host, because the agent proxy re-signs every call to the project region's STS
            host as the IAM user). ADMIN_CHAIN_OK: the session runs the gate itself.
            ADMIN_CHAIN_ABSENT: the PR waits at CI-green, the gate steps go to an ADMIN session, and the
            merge is held until the evidence is on the PR.
          - >-
            V3 RESOLUTION: the plan's context carries a line starting "V3 resolution:" stating that the
            posted pre-merge gate evidence for the current head substitutes for the pre-merge
            post-deploy evidence the implement V3 Merge Gate and the code-review V3 check require; that
            the behavioural acceptance (Decision 48) is the plan's named post-merge, human-directed apply
            walk; and that the walk's evidence is a counts-only comment on the merged PR naming the
            applied sha (CloudWatch history ages out and is not the record).
          - "All posted evidence is counts-only: no account ids, ARNs, ExternalIds or hosts (Decision 101)."
        enforcement: >-
          validate_admin_root_premerge_gate (fast tier, net-new plans whose scope has a non-Markdown file
          under such a root) checks all three clauses
          structurally: a pre-deploy step running terraform plan -lock=false of the root at
          $PR_HEAD_SHA, a pre-deploy step running the ADMIN_CHAIN_OK check, and the "V3 resolution:"
          context line; it also checks protected-actions.yaml approval.build_start's "Approvals at build start:" line.
          It cannot judge the expected outcome or that evidence was posted; plan-critique
          and code-review judge those.
        precedent: "PLAN-platform-iam-bootstrap-adopt (steps 8-11), PLAN-platform-iam-personal-release, PLAN-heartbeat-canary-plan-time-grant (steps 9-12)."
  after: |2
      pre_merge_live_plan:
        description: >-
          Standing rule (incident #1316, fixed by #1323) for any plan whose scope changes a non-Markdown
          file under a Terraform root whose environment-taxonomy.yaml axis_a apply_gating is admin-only
          (today terraform/bootstrap); a Markdown-only change is exempt. Static checks never reach a provider, so the root's first live contact
          must happen BEFORE merge. terraform/github's is its PR-time CI plan, terraform-github-plan.yml (axis_a.github),
          so this rule does not bind it. Rule and navigation only: apply-model and guard rules stay in
          environment-taxonomy.yaml.
        rule:
          - >-
            PRE-MERGE GATE (ADMIN): for terraform/bootstrap the gate is the trusted PR plan, terraform-bootstrap-plan.yml
            (Decision {{N}}): its names-only comment for the CI-green $PR_HEAD_SHA ends in a BOOTSTRAP_PR_PLAN line with
            category=OK and the plan's declared expected verdict and rows; the plan carries a pre-deploy step that reads it,
            and a new head re-runs it. A PR that job refuses (OVERLAY_REFUSED or SCREEN_REFUSED) and a plan for the SIT
            backend instead carry an operator CloudShell step that runs a read-only `terraform plan -lock=false` of the root
            at $PR_HEAD_SHA in a temporary folder, with a declared expected outcome (named counts, or failure only on named
            diagnostics); plan files are deleted in the same step, counts-only evidence and the sha are posted on the PR, and
            the operator's paste is the direction (protected-actions.yaml approval); a standing or relayed authorisation does
            not count. Neither form applies or writes state, so neither is a bootstrap change under Decision 126.
          - >-
            ENVIRONMENT CHECK: no agent session holds an admin identity (Decision 256 cl.3), so a CloudShell gate's block
            first prints "caller-arn check: ADMIN_CHAIN_OK" for the operator's own identity, or ADMIN_CHAIN_ABSENT, and then
            plans nothing. The trusted PR plan needs no check: its job can assume only bootstrap-pr-plan. Either way the PR
            waits at CI-green and the merge is held until the evidence is on the PR.
          - >-
            V3 RESOLUTION: the plan's context carries a line starting "V3 resolution:" stating that the
            posted pre-merge gate evidence for the current head substitutes for the pre-merge
            post-deploy evidence the implement V3 Merge Gate and the code-review V3 check require; that
            the behavioural acceptance (Decision 48) is the plan's named post-merge, human-directed apply
            walk; and that the walk's evidence is a counts-only comment on the merged PR naming the
            applied sha (CloudWatch history ages out and is not the record).
          - "All posted evidence is counts-only: no account ids, ARNs, ExternalIds or hosts (Decision 101)."
        enforcement: >-
          validate_admin_root_premerge_gate (fast tier, net-new plans whose scope has a non-Markdown file under such a
          root) checks the clauses structurally: a pre-deploy step reading terraform-bootstrap-plan.yml's BOOTSTRAP_PR_PLAN
          line (accepted only when every such file is a terraform/bootstrap file outside its screen row's main-only files)
          or the CloudShell pair, a pre-deploy step running terraform plan -lock=false of the root at $PR_HEAD_SHA and one
          printing the ADMIN_CHAIN_OK check; always the "V3 resolution:" context line and protected-actions.yaml
          approval.build_start's "Approvals at build start:" line. It cannot judge the expected outcome or that evidence was
          posted; plan-critique and code-review judge those.
        precedent: "PLAN-platform-iam-bootstrap-adopt (steps 8-11), PLAN-platform-iam-personal-release, PLAN-heartbeat-canary-plan-time-grant (steps 9-12)."
