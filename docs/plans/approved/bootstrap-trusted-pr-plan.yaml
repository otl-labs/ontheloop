schema_version: 1
slug: bootstrap-trusted-pr-plan
tldr: 'Bootstrap PRs get a CI plan before merge instead of your two CloudShell pastes: main''s workflow on pull_request_target plans the PR''s screened HCL under a new read-only role, bootstrap-pr-plan (your card choice), and posts names, the predicted verdict and the Access Analyzer results. CloudShell stays for a PR it refuses (main.tf, the lockfile, variables.tf, the PlatformDev/PlatformAdmin files) and for SIT. No LLM plan reviewer comes with it. Words: a new Decision amending 144, 238 and 257, and the deploy-paths, taxonomy and planning-skill lines.'
