    **Status:** Decided
    **Date:** {{DATE}}
    **Warehouse ID:** dec-{{N}} (per Decision 84 backfill)

    **Problem:** #2311 moved CI RCA to Claude Code CLI 2.1.323 on 2026-11-20. The first real run, 44945298668 a day later, went red: the new CLI's stderr warning broke the FILED-marker check (rec-5492), and nobody saw it, because CI RCA cannot alarm on its own failure. CI RCA's only manual entry files a real rec, so the bump's plan waited for the next real red instead of proving the change.

    **Intent:** The alarm for every red on main never merges a runtime change it has not run end to end.

    **Decision:**
    1. **Smoke mode.** ci-rca.yml carries a smoke job that runs what the rca job runs -- the pinned CLI install, the shared agent entrypoint over scripts/ci/claude_p_retry.sh with the same prompt, model and allow list, and the FILED-marker check -- against a committed fixture failure. The portal's rec write goes to a dry-run sink: the rec passes every client-side validation except the dedup backstop that a forced run skips, is recorded in the job only and gets a smoke-N id outside the writer's rec-NNN keyspace (Decision 84 I-2). The sink is never uploaded or replayed into the warehouse, and the fixture's evidence bundle is not uploaded. Writer-side rules (Decisions 207, 210, 268) are not exercised.
    2. **When it runs.** On every push to main that touches the runtime surface (scripts/ci_rca/smoke.py lists it), and on a workflow_dispatch from the maintainer's account. For this smoke only, an agent session acting under that account meets Decision 205 cl.1's maintainer identity (amends Decision 205 cl.1): the smoke tests a branch and approves nothing, acts on no work item, files no rec and emits no check run, so it is not a persona step under Decision 229 cl.2; its verdict is its own job's conclusion, which the gate reads, and its agent session is captured to telemetry as the rca job's are, tagged by job (rec-5508). The workflow-dispatcher App is refused as for the rca job (Decision 267). Never on a schedule (Decision 205 cl.1); drift between changes is rec-4678's fallback.
    3. **Gate (amends Decision 83).** pr-validate fails a pull request whose diff touches the runtime surface until a successful smoke dispatch of ci-rca.yml on the PR's own head branch records a runtime-surface digest equal to the PR head's, read from the Actions run, never a commit status (Decision 271's reasoning). An unreadable lookup fails in PR CI and is advisory elsewhere (Decision 246 cl.3). There is no agent override and no Dependabot exemption. An operator merge in the GitHub UI is the release valve, for a vendor outage, an expired token or a fork pull request (which cannot be smoked on its own branch) too, and the push smoke on main must then go green; a red CI RCA run on main is rec-5504's alarm.
    4. **Exception (amends Decision 205 cl.2).** A smoke dispatched on a branch runs that branch's workflow and code with CLAUDE_CODE_OAUTH_TOKEN. This is accepted for this smoke only, because any same-repository branch can already read that repository secret through a push workflow. rec-5507 scopes the token to Environments, and this clause is re-decided when it lands. A branch smoke has no AWS credentials, so IAM and reader grants are proven only by the push smoke.
    5. **Coverage (Decision 181 cl.2).** Clauses 1-3: the smoke and wake jobs, scripts/ci_rca/smoke.py, the sink, the evidence generator's no-upload flag, validate_persona_trigger_policy's exclusion of steps that cannot run on workflow_run, and validate_ci_rca_smoke_proof, with their tests. The smoke is a change proof for one workflow, authorised here, not a Decision 212 cl.2(b) drift run. Residuals: a branch can weaken its own smoke and gate, or print a digest its files do not have, since each is judged by its own copy (Decision 246 cl.6), and the push smoke on main's code is the backstop; a smoke diagnoses a fixture, not a real red, so it proves the runtime, not diagnosis quality; a maintainer-account dispatch does not prove a human acted (rec-2827); the smoke runs only what it lists as the runtime surface, so the rca job's own log-fetch, dedup, refusal and range steps, its telemetry capture, taxonomy rows, dependency pins and transitive imports are not smoked, and a break there shows first on a real red, which rec-4678's fallback filing and rec-5504's alarm record.

    **Options considered:** Main's own workflow running the PR's CLI pin and prompt as data -- rejected as the sole proof: wrapper, parser and workflow edits would be proven only after merge, and a bump that also adapts the parser goes red pre-merge. After-merge smoke only, with a planning rule -- rejected: a rule plans must remember is what failed with #2311. A timed schedule -- barred by Decision 205 cl.1. A per-SHA approved waiver run for outages -- rejected for the operator UI merge, the release valve Decisions 246 and 264 already use.

    ```yaml reversal-conditions
    decision: {{N}}
    review_by: 2027-05-23
    on_trigger: "re-decide via /plan; never add an agent override"
    conditions:
      - id: token-scoped
        kind: manual
        description: "rec-5507 scopes CLAUDE_CODE_OAUTH_TOKEN to Environments: re-decide clause 4."
      - id: claude-p-retired
        kind: manual
        description: "T4.26 moves CI RCA off claude -p: re-point or retire the runtime surface and the gate."
      - id: smoke-false-reds
        kind: manual
        description: "Smoke reds that no runtime change caused recur: fix the fixture or classify inconclusive outcomes, never add an override."
      - id: native-gate-available
        kind: manual
        description: "rec-4624 lets the ruleset require more checks: move the gate to a native required check."
    ```

    **Related:** Decisions 72, 74, 83, 84, 162, 170, 181, 205, 212, 229, 246, 264, 267, 271, 279; rec-4678, rec-5492, rec-5493, rec-5494, rec-5500, rec-5504, rec-5507, rec-5508.

