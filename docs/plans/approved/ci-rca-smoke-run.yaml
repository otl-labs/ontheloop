schema_version: 1
slug: ci-rca-smoke-run
tldr: A new Decision. CI RCA gains a smoke job that runs the real CLI, wrapper, agent and filing check on a committed fixture with a no-write portal sink. It runs after each runtime merge to main and on a dispatch from your account, agent sessions included (a Decision 205 cl.1 reading). pr-validate keeps a CI RCA runtime PR red until a smoke on the same runtime files is green; your UI merge is the release valve. A branch smoke holds the CLI token, an exception to Decision 205 cl.2 until rec-5507. Dated notes on Decisions 83 and 205.
