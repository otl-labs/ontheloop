    ## Decision {{N}}: A change to CI RCA's runtime merges only after a green smoke run of the real CI RCA job on the same runtime files -- a branch smoke holds the CLI token, an accepted exception to Decision 205 clause 2, and an operator merge stays the release valve (amends Decisions 205 and 83) (Decided)

    ```yaml
    number: {{N}}
    status: Decided
    decided_date: "{{DATE}}"
    kind:
      value: direction
      justification: >-
        Clause 3 adds a refusal with no agent override and an operator merge as the release valve, narrowing Decision
        83's non-wedging property again, and clauses 2 and 4 relax Decision 205 clauses 1 and 2 for one workflow;
        undone, a CI RCA runtime change merges unproven.
    amends: [205, 83]
    serves: [NS.6]
    significance:
      value: numbered_decision
      justification: >-
        Durable, reversal-relevant: a merge refusal and a credential exception that bind every session changing CI RCA.
        Not a ci-rca-lifecycle.yaml note: a contract records a gate's shape, not the authority to refuse merges or to
        place a secret on branch code (Decision 262's reasoning). Not amendment_forms: it amends two entries and adds a
        gate.
