- id: ghas-probe-credential-header
  file: .github/workflows/ghas-probe.yml
  before: |
    #   - GHAS_PROBE_TOKEN: fine-grained PAT, repo-scoped to benjamin-blake/theseus only.
    #     Scopes: Administration (read-only), Secret scanning alerts (read-only), Metadata
    #     (read-only, auto-required). Expires 2027-05-31.
    #   - CLAUDE_CODE_OAUTH_TOKEN: Claude Code OAuth token (Max-plan subscription, no API billing).
    #     Expires 2027-05-31. Not consumed by this workflow's run step -- recorded here for operator
    #     convenience alongside the other repo PAT pending rec (c)'s durable home.
    #   - Rotation procedure (either credential): re-mint with the same scopes, update the matching
    #     GitHub Actions secret, re-run this workflow via workflow_dispatch, confirm the run is green,
    #     then append fresh dated evidence to Decision 83 (docs/DECISIONS.md) and re-arm its
    #     reversal-conditions stanza.
  after: |
    #   - GHAS_PROBE_TOKEN: fine-grained PAT, repo-scoped to benjamin-blake/theseus only.
    #     Scopes: Administration (read-only), Secret scanning alerts (read-only), Metadata
    #     (read-only, auto-required). Expires 2027-05-31.
    #     Rotation: re-mint with the same scopes, update the matching GitHub Actions secret, re-run
    #     this workflow via workflow_dispatch, confirm the run is green, then append fresh dated
    #     evidence to Decision 83 (docs/DECISIONS.md) and re-arm its reversal-conditions stanza.
    #   - CLAUDE_CODE_OAUTH_TOKEN: Claude Code OAuth token from the operator's own seat on the company
    #     Claude account's subscription (no API billing). Expires 2027-11-20. Not consumed by this
    #     workflow's run step -- recorded here for operator convenience alongside the other repo PAT
    #     pending rec (c)'s durable home.
    #     Rotation: the operator runs claude setup-token from that seat, updates the secret, dispatches
    #     subagent-review-smoke on main, confirms the run is green, then appends an ANT-04 entry to
    #     the evidence_ledger of docs/contracts/account-credential-inventory.yaml.
