schema_version: 1
slug: claude-cli-account-migration
tldr: 'Records the move of the CI token CLAUDE_CODE_OAUTH_TOKEN to the operator''s own seat on the company Claude account:
  its inventory row becomes company-owned and proven, on the green smoke run on main after the re-mint, with one ledger
  entry and one short amendment line. The old personal token is not revoked; it lapses when the personal plan is
  downgraded, and that account is kept. The ghas-probe header, the T4.26 note and its graduated check name the new
  expiry, 2027-11-20.'
