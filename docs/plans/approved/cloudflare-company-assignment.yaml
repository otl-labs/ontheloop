  file: docs/contracts/account-credential-inventory.yaml
  before: |
    amendment_log:
  after: |
    amendment_log:
      - {date: "{{DATE}}", semantic_break: false, change_class: correction, summary: "PLAN-cloudflare-company-assignment (rec-5424): the Cloudflare account is assigned in place; DNS-01..DNS-04 and BILL-05 flip with ledger entries."}
- id: inventory-dns-rows
