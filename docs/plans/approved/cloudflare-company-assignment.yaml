      - {date: "{{DATE}}", row: DNS-01, status: proven, evidence: "PLAN-cloudflare-company-assignment C1, P1 and R1: the company Workspace identity is a Super Administrator that ran the billing and registrar steps, and the founder's personal login has left the account and been deleted (operator screenshots of the members page, checked by the agent)"}
