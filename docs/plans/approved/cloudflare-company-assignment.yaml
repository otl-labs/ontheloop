schema_version: 1
slug: cloudflare-company-assignment
tldr: 'Records the Cloudflare move: the account is assigned in place to the company (a company Super Administrator login,
  company billing and the company card as the only payment method, the founder''s login and card gone), the company becomes
  registrant of onthelooplabs.com and otl-labs.com, and theseus.support is left to lapse as the operator ruled. Five inventory
  rows flip with one ledger entry each and one amendment-log line.'
blocks:
