      - {id: DNS-03, provider: Cloudflare, item: otl-labs.com, kind: domain, location: Cloudflare Registrar, owner_today: founder, target: Company registrant, stage: everything_else, rec: [], status: personal, expires: "2027-09-17"}
      - {id: DNS-04, provider: Cloudflare, item: theseus.support (retired brand; Decision 198), kind: domain, location: Cloudflare Registrar, owner_today: founder, target: "Company registrant or lapse (operator call)", stage: everything_else, rec: [], status: personal, expires: "2027-06-27"}
  after: |2
