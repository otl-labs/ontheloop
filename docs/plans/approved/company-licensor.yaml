schema_version: 1
slug: company-licensor
tldr: After the IP assignment signed on 2026-11-19, On The Loop Labs Limited replaces the founder as copyright holder in README
  and as licensor and assignee in CONTRIBUTING and COMMERCIAL-LICENSE; PROJECT_CONTEXT names the company; Decisions 195 and
  194 gain dated Updates; inventory IP-01, IP-02 and MAIL-02 become proven. LICENSE, the licence check and SECURITY.md are
  approved as a final diff (Decision 246 cl.4).
blocks:
- id: readme-copyright
  file: README.md
  before: |
    Copyright 2026 Benjamin Blake.
  after: |
    Copyright 2026 On The Loop Labs Limited.
- id: contributing-licensor
  file: CONTRIBUTING.md
  before: 'The maintainer offers On The Loop under two licences:'
  after: 'On The Loop Labs Limited offers On The Loop under two licences:'
- id: contributing-assignee
  file: CONTRIBUTING.md
  before: |-
    must come with an assignment of
    copyright to the maintainer, or a licence grant
  after: |-
    must come with an assignment of
    copyright to On The Loop Labs Limited, or a licence grant
- id: contributing-provenance
  file: CONTRIBUTING.md
  before: |-
    ## Provenance of the existing code

    Two facts are recorded here plainly
  after: |-
    ## Provenance of the existing code

    The founder assigned the copyright and other intellectual property rights in On The Loop to
    On The Loop Labs Limited by a signed written assignment dated 2026-11-19 (Decision 195).
    Third-party material keeps its own licence.

    Two facts are recorded here plainly
- id: contributing-trailer-position
  file: CONTRIBUTING.md
  before: convention, not an assignment of copyright, and the maintainer's position is that it does not
  after: convention, not an assignment of copyright, and On The Loop Labs Limited's position is that it does not
- id: commercial-channel
  file: COMMERCIAL-LICENSE.md
  before: want to discuss licensing, and the maintainer will arrange a private channel.
  after: want to discuss licensing, and On The Loop Labs will arrange a private channel.
- id: project-context-thesis
  file: docs/PROJECT_CONTEXT.md
  before: This repository builds On The Loop, an agentic software-engineering framework. Its purpose is to let LLM agents
    plan, build, verify, deploy, monitor, and improve software safely and reliably with minimal human oversight.
  after: On The Loop Labs builds On The Loop, an agentic software-engineering framework. Its purpose is to let LLM agents
    plan, build, verify, deploy, monitor and improve software safely and reliably with minimal human oversight.
- id: decision-195-update
  file: docs/DECISIONS.md
  before: |
    > **Update (2026-11-02):** The `account-move-decided` reversal condition is discharged by Decision 242:
    > migrate, not rebuild; the account is assigned in place to the company.
  after: |
    > **Update (2026-11-02):** The `account-move-decided` reversal condition is discharged by Decision 242:
    > migrate, not rebuild; the account is assigned in place to the company.

    > **Update (2026-11-19):** The `assignment-executes` reversal condition is discharged: the founder signed and
    > dated the written founder-to-company IP assignment on 2026-11-19; it is held in the company's records, not in
    > this repository. Clause 2's two edits landed in one commit: LICENSE names On The Loop Labs Limited as Licensor
    > and `validate_licence_consistency.py`'s regex pins that name (PLAN-company-licensor). The operator deferred the
    > contributor provenance audit and a CLA or DCO mechanism until the first outside contribution or the first
    > commercial licence sale, whichever comes first (rec-3154);
    > Decision 171 clause 5's premise stays unverified, as recorded above.
- id: decision-194-update
  file: docs/DECISIONS.md
  before: |
    > **Update (2026-10-23):** Decision 234's local-first users are licence-sensitive -- source-available terms such as BUSL draw objections -- which informs the grant-widening point (clause 4, T4.24 c6) as context only; the two stanza conditions remain the flip's sole trigger, and contributor copyright assignment stays Decision 171 clause 5's matter (rec-3154).

    > **Update (2026-11-02):** Where "platform" or "product" here names a side of On The Loop, read it through the read_as rows of docs/contracts/glossary.yaml (Decision 240); no clause changes.
  after: |
    > **Update (2026-10-23):** Decision 234's local-first users are licence-sensitive -- source-available terms such as BUSL draw objections -- which informs the grant-widening point (clause 4, T4.24 c6) as context only; the two stanza conditions remain the flip's sole trigger, and contributor copyright assignment stays Decision 171 clause 5's matter (rec-3154).

    > **Update (2026-11-02):** Where "platform" or "product" here names a side of On The Loop, read it through the read_as rows of docs/contracts/glossary.yaml (Decision 240); no clause changes.

    > **Update (2026-11-19):** Assumption A2's precondition is met: the founder-to-company IP assignment
    > executed on 2026-11-19 and LICENSE names On The Loop Labs Limited as Licensor (Decision 195, Update of the same
    > date). The flip's trigger is unchanged: the two stanza conditions.
