schema_version: 1
slug: computed-reversal-conditions
tldr: Moves 60 reversal-stanza review dates a few days earlier so that no date carries more than three reviews (today 15,
  17, 24 and 16 stanzas fall due on four 2027 month-ends). Dates only ever move earlier, so no review is postponed; each edit
  is the stanza's review_by line alone (Decision 177 clause 4); no clause, condition or note changes.
