schema_version: 1
slug: computed-reversal-conditions
tldr: Wires Decision 179's two measurable reversal conditions to computed predicates that fire only at review, and moves 60
  stanza review dates a few days earlier so that no date carries more than three reviews. Dates only ever move earlier, so
  no review is postponed; Decision 179 gets one dated note; no clause changes.
blocks:
- id: decision-179-index-condition
  file: docs/DECISIONS.md
  before: |2
        predicate: null   # manual until rec-5264 registers it
        params: {max_bytes: 110608}
  after: |2
        predicate: decision_index_bytes_exceed
        fires: at_review
        params: {max_bytes: 110608}
- id: decision-179-inflow-condition
  file: docs/DECISIONS.md
  before: |2
        predicate: null   # manual until rec-5264 registers it
        params: {window_days: 90, max_entries_per_plan: 0.30}
  after: |2
        predicate: decision_entries_per_plan_exceed
        fires: at_review
        params: {window_days: 90, max_entries_per_plan: 0.30}
- id: decision-179-note
  file: docs/DECISIONS.md
  before: |
    > 2026-12-01 to 2027-03-01.
  after: |
    > 2026-12-01 to 2027-03-01.

    > **Update ({{DATE}}, PLAN-computed-reversal-conditions, rec-5264):** index-read-context-cost and inflow-per-plan
    > are computed from the repository each session (predicates decision_index_bytes_exceed and
    > decision_entries_per_plan_exceed, scripts/preflight/decision_conditions.py) and, as their "At review" wording
    > says, fire only once review_by has passed (fires: at_review). No clause changes.
