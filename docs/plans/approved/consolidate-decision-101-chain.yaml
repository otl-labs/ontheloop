slug: consolidate-decision-101-chain
tldr: 'Chain consolidation 5 of 6, step 1 of Decision 101''s full supersession. One new Decision restates 101''s current rule
  unchanged: external marks on external surfaces only, internal identifiers frozen behind a numbered Decision, the marketing-prose
  exception, the public-content boundary with the 2026-10-17 financial-figures reading, Cloudflare Pages hosting and the positioning.
  Decision 101 compacts to a stub; 171, 198, 202, 209 and 237 keep their parts. Re-deciding the rule is a later entry.'
