slug: consolidate-decision-126-chain
tldr: 'The third chain consolidation. One new Decision states the deployment model''s standing rules (three agent intents
  with one trigger each; two heal verbs under one routing rule; in the admin tier an agent prepares and the operator runs,
  as Decision 256 cl.3 already has it) and supersedes Decisions 126 and 183, which compact to stubs. That settles rec-3298:
  deploy-paths.yaml, terraform-cc-web-operations.yaml, AGENTS.md and terraform/CLAUDE.md stop saying an agent runs the admin
  apply. NS.9 in north-star.yaml names the new Decision as its carrier in place of 126 (Tier A, Decision 243 cl.5). Three
  tests that pinned notes on the two bodies now check the stubs; one graduated record that pinned 126''s NS.9 note retires
  and is replaced.'
