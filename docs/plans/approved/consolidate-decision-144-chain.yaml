    ## Decision {{N}}: The CI deployer's authority in one entry -- broad prefix-scoped grants under a mandatory permissions boundary that only a named exclusion escapes, and role creation that stays reviewer-gated (supersedes Decisions 144 and 180; amends Decision 98) (Decided)

    ```yaml
    number: {{N}}
    status: Decided
    decided_date: "{{DATE}}"
    kind:
      value: direction
      justification: >-
        Clause 4 keeps role creation behind a reviewer-approved Environment apply, and clause 3 lets a CI role shed the
        boundary only by an exclusion a live Decision names; both are human gates.
    supersedes: [144, 180]
    amends: [98]
    significance:
      value: numbered_decision
      justification: >-
        It restates the current rule of Decision 144 and its whole amender 180 as one entry so both can compact (Decisions
        149 and 278); dated notes (considered) cannot retire a chain, and no contract holds the boundary's scope or its
        exclusions (iam-simulate-fixture.yaml, considered, records expected decisions, not the rule behind them).
    ```

    **Status:** Decided
    **Date:** {{DATE}}
    **Warehouse ID:** dec-{{N}} (per Decision 84 backfill)

    **Problem:** A reader needs ten entries to learn the CI deployer's current authority: Decision 144, its six amenders,
    the two that amend 180, and Decision 98, which 144 amends (rec-5448). Decision 144 recorded the model as a target;
    T2.48 has since realised it, and Decision 225 emptied Decision 180's enumeration.

    **Intent:** One entry states the deployer's standing authority, so Decisions 144 and 180 compact to stubs; rules that
    live in an amender stay there.

    **Decision:**
    1. **Broad, bounded deployer.** The CI apply role writes through broad per-service grants on the managed resource
       types instead of an enumerated per-resource allow-list, under the mandatory permissions boundary
       agent-platform-github-ci-apply-boundary. The boundary is a ceiling and grants nothing: DenyIAMEscalation (conditioned
       on boundary propagation), DenyBoundaryRemoval and DenyBoundaryPolicyModification keep a bounded role from widening
       or shedding it, and SCPs add to it, never replace it (Decision 252 cl.8). The guard and the authority budget still
       judge danger in front of it (Decision 277).
    2. **Prefix-scoped grants on both axes.** Read and write grants are scoped per service to account-scoped name
       patterns, chiefly agent-platform-* (Decision 129's pattern); the apply role's terraform/bootstrap policies name every
       pattern, and validate_ci_refresh_read_coverage asserts read and write coverage per managed resource type; iam:
       reads and value-capable verbs stay enumerated by ARN (Decision 129 pt2, Decision 157 cl.1, Decision 237 cl.2). The
       boundary, not the name, decides coverage. A family excluded by name (platform-security-*, Decision 202
       cl.3; telemetry-content-*, Decision 270 cl.2) is outside CI reach by design, never a gap to widen.
    3. **Mandatory boundary, named exclusions.** In the AWS roots CI applies (terraform/personal and terraform/bootstrap), the
       boundary is mandatory on every agent-platform-* CI and execution role and on PlatformDev, and a CI role named outside
       agent-platform-* is boundary-free only by an exclusion a live Decision names (Decision 257 cl.3, Decision 270 cl.2). PlatformAdmin is excluded because it must stay able to amend the
       boundary, and no CI-writable Resource pattern ever matches it; reversing that re-decides Decision 113's
       two-principal split.
    4. **Role creation stays gated (amends Decision 98 pt1).** CI creates a boundary-carrying agent-platform-* role only
       in a reviewer-approved apply: the tf-gated-apply Environment's for terraform/personal (Decision 277 cl.1) or the
       tf-bootstrap-apply Environment's for terraform/bootstrap (Decision 257 cl.1 and cl.3); role creation is never in budget.
       Other roles stay the operator's admin tier, and the protected set changes only as Decision 257 cl.4 states.
       In-budget inline-policy and attachment writes are Decision 277's guard classification.
    5. **Carried forward.** Decision 202 keeps the platform-security-* family, Decision 238 the state-read rule and the
       trusted-plan role, Decision 252 the Organization and its SCPs, Decision 257 the bootstrap roles and protected set,
       Decision 270 the telemetry-content roles, Decision 223 one state per applier and Decision 225 no CI IAM write on
       PlatformDev or PlatformAdmin (reads per Decision 257). Decision 98's other points stand. A ruling change is a new entry superseding this one.

    **Options considered:** taking 238, 223 or 225 as victims (rejected: each holds a general rule beyond the deployer);
    restating the boundary-free list (rejected: three amenders grew it, so each name stays with the entry that excludes
    it); taking Decision 98 as a victim (rejected: it amends nothing in the chain, and its other points stand).

    **Coverage (Decision 181 cl.2):** cl.1 -- validate_authority_budget and the iam-simulate fixture; cl.2 --
    validate_ci_refresh_read_coverage; cl.3 -- validate_boundary_attached (terraform/personal), test_platform_iam_bootstrap_adoption.py (PlatformDev),
    test_platform_role_metadata_admin_scope.py's PlatformAdmin negative, test_bootstrap_ci_roles.py and the bootstrap
    apply classifier's boundary routing (test_terraform_bootstrap_apply_gate.py); its named-exclusion arm is a residual
    owned by rec-5650; cl.4 -- the guard's role-create routing tests; the accounting
    -- validate_delegated_key_changes over the consolidation manifest.

    ```yaml reversal-conditions
    decision: {{N}}
    review_by: 2027-05-31
    on_trigger: "re-decide via /plan"
    conditions:
      - id: prefix-over-grant
        kind: manual
        description: "A resource CI must not write comes to match a CI grant's name pattern, or an incident shows a grant over-grants: re-narrow that grant (from Decisions 129, 144 and 180)."
      - id: unbounded-ci-role
        kind: manual
        description: "In an AWS root CI applies, an agent-platform-* CI or execution role, PlatformDev, or a CI role named outside agent-platform-* carries no boundary and no live Decision excludes it by name: attach the boundary, or a new Decision names the exclusion (from Decision 144 cl.3)."
      - id: computed-role-classifier
        kind: manual
        description: "A computed role classifier replaces naming as the test of what CI may write: re-decide clauses 2 and 3 (from Decision 180 (b))."
    ```

    **Related:** Decisions 144 and 180 (superseded), 98 (amended), 202, 223, 225, 238, 252, 257 and 270 (carried
    forward), 77, 113, 129, 143, 157, 237, 240, 248, 255, 256, 277, 278, 283; T2.48; rec-3327, rec-5448.

