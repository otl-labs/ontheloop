tldr: 'Chain consolidation 4 of 6. One new Decision states the CI deployer''s standing authority: broad prefix-scoped grants
  under a mandatory permissions boundary, a boundary-free role only by a named exclusion, PlatformAdmin outside every CI-writable
  pattern, and role creation only in a reviewer-approved Environment apply. It supersedes Decisions 144 and 180, which compact
  to stubs, and amends Decision 98 by a note; 202, 223, 225, 238, 252, 257 and 270 keep their parts. No test or graduated
  record changes.'
