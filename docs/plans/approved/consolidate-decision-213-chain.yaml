schema_version: 1
slug: consolidate-decision-213-chain
tldr: 'Chain consolidation 6 of 6. One new Decision states the current rule for identity-trusting DuckLake Lambdas: reachable
  only through their Function URL or named API route under three permissions-boundary Denies, telemetry writes on their own
  functions with scoped DML-only catalog logins, and an ADMIN-agent login step only under human direction. It supersedes Decision
  213, which compacts to a stub, and amends Decision 91 by a note; 216, 230, 237, 255 and 270 keep their parts. No test or
  graduated record changes.'
