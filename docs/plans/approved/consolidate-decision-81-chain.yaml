slug: consolidate-decision-81-chain
tldr: 'Chain consolidation 3 of 6. One new Decision states the DuckLake ops runtime''s standing rules: functions split by
  access pattern behind a closed read/write boundary, concurrent idempotent writes through one chokepoint onto an append-only
  history with a same-transaction current projection, and agent-free maintenance whose garbage collection fails closed. It
  supersedes Decisions 81 and 188, which compact to stubs; 143, 210 and eight other amenders keep their parts. No test or
  graduated record changes.'
