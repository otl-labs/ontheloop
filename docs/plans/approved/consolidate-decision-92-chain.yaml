    **Status:** Superseded
    **Date:** 2026-06-19

    **Decision:** Superseded by Decision {{N}}, which restates its standing rules with Decision 94, Decision 154 and Decision 190 and the parts that Decision 144, Decision 238 and Decision 257 amended; the values live in docs/contracts/environment-taxonomy.yaml and docs/contracts/terraform-personal-cd.yaml. Point map: pt1 -> cl.1; pt2 -> cl.2 and convergence_anchor; pt3 -> cl.1, cl.3 and axis_a.sandbox_gated_apply; pt4 -> cl.3; pt5 -> cl.3 and guard_classification; pt6 -> cl.5; the ratification-path sentence of the Rationale is held by Decision 84 I-2 and Decision 105. Compacted in place (Decision 149), not archived, because code and contracts still cite "Decision 92" by name.

