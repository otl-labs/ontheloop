schema_version: 1
slug: consult-escalation-authority
tldr: 'A new Decision: the advice consult becomes a compute-plane persona that decides a plan critique''s convergence escalations.
  Blind to round history and every recommendation, it rules only whether a disputed finding holds, on evidence it read, and
  may choose one more round once per plan; what it cannot verify it hands back. Scope, tier, Decision, taste, cost and intent
  forks, weakening findings, deferral, re-scope, split and abandon stay the operator''s, who is told at once and may override
  until the plan PR merges. Demoted if the operator overrides or re-escalates 4 of its first 10.'
