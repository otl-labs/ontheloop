    ## Decision {{N}}: The advice consult is a compute-plane persona that decides a plan critique's convergence escalations -- a ruling on a disputed finding or one more round -- and every sign-off escalation stays the operator's (Decided)

    ```yaml
    number: {{N}}
    status: Decided
    decided_date: "{{DATE}}"
    kind:
      value: direction
      justification: >-
        Clause 3 moves a decision from the operator to an agent. Undone, every convergence escalation waits for the
        operator, who today passes most of them to a consult unread.
    serves: [NS.8, NS.9]
    significance:
      value: numbered_decision
      justification: >-
        Durable and reversal-relevant: it sets who decides an escalation for every later plan and gives the consult a
        persona role. Not a coordinator.yaml or planning skill note (considered): those hold the routing, not the choice to
        delegate a human decision. Not amendment_forms (considered): no single entry holds the rule it changes.
    ```

    **Status:** Decided
    **Date:** {{DATE}}
    **Warehouse ID:** dec-{{N}} (per Decision 84 backfill)

    **Problem:** The advice consult has no recorded role. Decision 231 cl.4 calls it a judgment persona and Decision
    229's 2026-11-02 update lets a session run it as a read-only subagent until its persona flips, but nothing defines
    what it may decide. The planning skill sends every critique escalation to the operator and says the consult
    "decides nothing". The operator reports passing most escalations to a consult (unmeasured; rec-5645): after
    "write the plan" has fixed intent, scope and taste, a convergence escalation is mechanical, so the operator's gate no
    longer discriminates (NS.9's failure signal).

    **Intent:** A plan critique that fails to converge is settled by a consult without waiting for the operator, while
    every question of intent, taste, cost or approved scope still reaches the operator.

    **Decision:**
    1. **Persona.** The advice consult is a compute_plane persona (Decision 229 cl.3), in the consult capability class
       (rec-5646). It reads and never edits or runs tests. Its output separates settled consensus from contested points,
       each with its basis; its caller records adopt, adapt or reject per point.
    2. **Invocation.** Until its persona flips, a planning session runs it as a fresh-context subagent (Decision 229's
       2026-11-02 update). After the flip, personas never invoke personas (cl.2): plan_agent returns a consult-requested
       outcome naming the escalation, and the coordinator dispatches the consult and re-runs plan_agent with its answer
       as a named input.
    3. **Convergence escalations.** An oscillation, a third blocking finding on one plan row or sidecar block, a REVISE
       at the sixth round and a disputed blocking finding go to the consult. Its brief gives each disputed finding and
       both positions unattributed, and withholds round history and every recommendation. On evidence it read itself it
       rules whether each disputed finding holds (where it does not, the planner writes the ruling's evidence at the
       finding's anchor and the finding stays disputed) and may choose one more round, once per plan; what it cannot
       verify it hands back unruled, with the reason. A ruling against a finding waives no check: the next round reads
       the whole plan afresh and the finding stays in the record (Decision 235 cl.1). It rules once per finding: a
       re-raise at an anchor it ruled on goes to the operator. The planner records its choice with escalation_decider
       consult in gate_rounds and tells the operator at once; the operator may override until the plan PR merges,
       recorded with overrides_consult.
    4. **Sign-off escalations.** A fix that would change approved scope, tier or a cited Decision, any fork that turns on
       taste, cost or intent, a finding that the plan weakens verification (Decision 235 cl.1), and the choices
       accept-with-deferral, re-scope, split and abandon stay the operator's. The
       consult hands such an escalation back with its recommendation.
    5. **Evidence.** gate_rounds rows are the record: after 10 consult-decided escalations, convergence escalations
       return to the operator if the operator overrode or re-escalated 4 or more of them. The operator's
       approval of this Decision is the human-ratified promotion NS.8 asks for; the evidence is gathered after it, and
       the override window keeps each choice reviewable meanwhile.
    6. **Follow-on.** The persona contract (docs/contracts/personas/consult.yaml), its index row and the coordinator's
       dispatch are T4.39.

    **Options considered:** the consult choosing every option but accept-with-deferral -- rejected: re-scope and abandon
    change what the operator approved, and a split changes what one approval covered (Decision 247 cl.4); waiting for
    telemetry attribution (rec-5071) before delegating -- rejected: gate_rounds already records each choice; the consult
    re-ruling a re-raised finding -- rejected: two fresh readers could disagree without end.

    **Coverage (Decision 181 cl.2):** cl.3 and cl.4's choice bounds -- scripts/roadmap/plan_gate_rounds.py's validator (a
    consult decides only one more round; an override is the operator's); routing -- .claude/skills/planning/SKILL.md's
    Escalate rule, .claude/skills/consult/SKILL.md and coordinator.yaml routing, held by
    tests/test_consult_escalation_contract.py. Residuals: cl.1's read-only capability and cl.2's dispatch until T4.39;
    whether a disputed finding was real is the planner's declaration, never checked; consult and critic may
    share a model, so their independence is assumed (a known gap).

    ```yaml reversal-conditions
    decision: {{N}}
    review_by: 2027-03-31
    on_trigger: "re-decide via /plan"
    conditions:
      - id: overrides-high
        kind: manual
        description: "Of the first 10 consult-decided escalations, the operator overrode or re-escalated 4 or more: return convergence escalations to the operator."
      - id: unused
        kind: manual
        description: "By 2027-03-31 no gate_rounds row records escalation_decider consult: the route serves no one; re-decide."
    ```

    **Related:** Decisions 229, 231 cl.4, 247 cl.4-5, 205 cl.6, 235, 279; rec-5644, rec-5646, rec-5071; T4.39.

