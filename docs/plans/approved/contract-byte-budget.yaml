schema_version: 1
slug: contract-byte-budget
tldr: A new Decision amending Decisions 166 and 240. Contracts keep the 500-line budget and also get a 48 KiB per-file byte
  limit. The four contracts still over it after their logs are compacted are grandfathered by name; each later raise needs
  Decision text added in the same change naming that contract. A contract at its budget first compacts old amendment_log rows
  to one-line rows (the newest 5 and breaking-change rows stay full; the one sanctioned rewrite of a record), then moves detail
  out by citation, then splits off a second subject, and raises last.
