schema_version: 1
slug: contract-pointer-sections
tldr: Every always-read pointer to git-ops.yaml now names the key a run needs (the push trigger names push_pr_ci_merge_flow),
  and /plan and PROJECT_CONTEXT send file look-ups to a new route lookup, `bin/venv-python -m scripts.session.file_router
  <term>`, instead of the whole file-router.yaml. No rule changes; AGENTS.md gets shorter.
blocks:
- id: agents-git-ops-pointer
  file: AGENTS.md
  before: |
    Read `docs/contracts/git-ops.yaml` before any push/PR/CI/merge action -- it carries the full
    procedure (branching topology, commit-message conventions, rebase mechanics, wake-signal detail,
    and the CI-credential/OAuth-token runbook); AGENTS.md keeps only the machine-enforced norms and
    one-line triggers below.
  after: |
    Before any push/PR/CI/merge action read `docs/contracts/git-ops.yaml#push_pr_ci_merge_flow` and the keys it
    names; read its other keys (branching, commit messages, Resolves: trailer, OAuth-token runbook) only when needed.
    AGENTS.md keeps only the machine-enforced norms and one-line triggers below.
- id: plan-git-ops-note
  file: .claude/commands/plan.md
  before: |
    For the canonical git-ops procedure (branching, rebase rules, PR/CI/merge flow), see `docs/contracts/git-ops.yaml`.*
  after: |
    For the git-ops procedure read only the key a step names: branching `docs/contracts/git-ops.yaml#branching_topology`, rebase rules `git-ops.yaml#rebase_phase_distinction`, PR/CI/merge flow `git-ops.yaml#push_pr_ci_merge_flow`.*
- id: plan-file-router-step
  file: .claude/commands/plan.md
  before: |
    1. Use the File Router to locate source files.
  after: |
    1. Locate source files with `bin/venv-python -m scripts.session.file_router <term>` (rows of `docs/contracts/file-router.yaml#routes`); never read the whole file.
- id: implement-git-ops-note
  file: .claude/commands/implement.md
  before: |
    For the canonical git-ops procedure (branching, rebase rules, PR/CI/merge flow), see `docs/contracts/git-ops.yaml`.*
  after: |
    For the git-ops procedure read only the key a step names: `docs/contracts/git-ops.yaml#handoff_sequence`, `git-ops.yaml#rebase_phase_distinction.commit_flow_time`, `git-ops.yaml#push_pr_ci_merge_flow` and, with bundled recs, `git-ops.yaml#resolves_trailer`.*
- id: planning-branch-pointer
  file: .claude/skills/planning/SKILL.md
  before: |
    See `docs/contracts/git-ops.yaml` as the canonical git-ops authority for branching topology (DEV vs ADMIN containers, AWS profiles, harness branch vs never agent/).
  after: |
    See `docs/contracts/git-ops.yaml#branching_topology` as the canonical git-ops authority (DEV vs ADMIN containers, AWS profiles, harness branch vs never agent/).
- id: implement-skill-authority
  file: .claude/skills/implement/SKILL.md
  before: |
    (Decision 76). See `docs/contracts/git-ops.yaml` as the canonical git-ops authority.
  after: |
    (Decision 76). Git-ops flow: `docs/contracts/git-ops.yaml#push_pr_ci_merge_flow`.
- id: implement-skill-handoff
  file: .claude/skills/implement/SKILL.md
  before: (git-ops.yaml `handoff_sequence`).
  after: (`git-ops.yaml#handoff_sequence`).
- id: implement-skill-wake
  file: .claude/skills/implement/SKILL.md
  before: canonical in `docs/contracts/git-ops.yaml` steps 3-5, not restated here.
  after: canonical in `git-ops.yaml#push_pr_ci_merge_flow`, not restated here.
- id: implement-skill-rebase
  file: .claude/skills/implement/SKILL.md
  before: |
    See `docs/contracts/git-ops.yaml` `rebase_phase_distinction.commit_flow_time`; once pushed, use
  after: |
    See `docs/contracts/git-ops.yaml#rebase_phase_distinction.commit_flow_time`; once pushed, use
- id: implement-skill-trailer
  file: .claude/skills/implement/SKILL.md
  before: '`docs/contracts/git-ops.yaml::resolves_trailer`: an acceptance-verdict refusal'
  after: '`docs/contracts/git-ops.yaml#resolves_trailer`: an acceptance-verdict refusal'
- id: project-context-router
  file: docs/PROJECT_CONTEXT.md
  before: |
    Use `docs/contracts/file-router.yaml` as the discovery and ownership index.
  after: |
    Find file homes: `bin/venv-python -m scripts.session.file_router <term>`.
