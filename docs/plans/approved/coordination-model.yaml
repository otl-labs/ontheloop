- id: t4-37-item
  file: docs/ROADMAP-PLATFORM.yaml
  before: |2
      # ----- T5: Decommissioning & cleanup -----
  after: |2
      - id: T4.37
        tier: T4
        name: Coordinator step -- the loop's bounded judgment step, desk scope first and epic scope in shadow (Decision {{N}})
        intent: >-
          Per Decision {{N}} cl.2-3, the one LLM step in the loop's control flow outside the personas: an event-triggered,
          stateless step the engine (T4.1) invokes only for an event that maps to no transition, a tie the order cannot
          break, or a human message. It reads bounded slices through named read verbs and writes graph state through a
          closed verb set; the engine launches every persona. Desk scope first, the human's entry point on T4.33; the epic
          scope is built on the same verbs and data, runs in shadow, and acts per epic only on a measured trigger.
          deferred_post_mvp: it runs on the deferred work-item store (T4.23) and the loop host (Decision 93).
        depends_on: [T4.1, T4.10a, T4.23]
        files_in_scope:
          - docs/contracts/personas/coordinator_step.yaml    # new
        exit_criteria:
          - id: c1
            text: "CLOSED VERBS -- a persona contract (T4.10a) with schemas and turn and wall-clock budgets names the verb set: route to planning, write a note and wake its worker, file items and edges, park, escalate, raise a gate card, propose a policy change. The engine rejects any other verb; no verb launches a persona, schedules the step or extends its run, and adding a verb needs a Decision"
            status: open
          - id: c2
            text: "TRIGGERS -- the engine invokes the step only for a plan-defect report, a repeated failure, conflicting decompositions, a budget exhausted with partial output, a stall after its nudge, an order tie or a human message; the step never polls. On a failure it routes, escalates or files an RCA rec and never repairs (Decision 55); Decision 217 cl.2's rebase escalation rec is an input it reads"
            status: open
          - id: c3
            text: "BOUNDED -- reads go through named read verbs over bounded slices (the frontier's top N, the blocked and stalled sets, the event's item and its notes), never caller SQL or the whole queue; every invocation is a run record (Decision 231); the step never runs on Actions (Decision 205 cl.1), never approves (Decision 233 cl.4) and never sets a loop-policy value (Decision 185 cl.3)"
            status: open
          - id: c4
            text: "DESK FIRST -- the first build runs the desk scope only, and every exception reaches it: frontier and forks, intake triage (Decision 232 cl.6), cross-epic duplicates and conflicts, gate cards and policy proposals, shown on T4.33 (c9)"
            status: open
          - id: c5
            text: "EPIC SCOPE IN SHADOW -- the epic scope reads one epic's frontier, notes and exceptions and files items only part_of its own epic within the epic's declared paths, anything wider going to the desk. It runs in shadow (logged runs, verbs not applied) on at least one epic, and acts for an epic only when a measured trigger fires (the desk's exception load or the count of concurrently active epics passing a threshold the shadow window calibrates), a loop-policy value under a human ceiling"
            status: open
          - id: c6
            text: "GROWTH WATCH -- telemetry reports coordinator-step turns per completed work item, alerting on an upward trend, and the share of the step's outputs that changed an outcome, the evidence for Decision {{N}}'s step-adds-nothing reversal condition"
            status: open
        related_decisions: [55, 90, 93, 185, 197, 205, 212, 217, 229, 231, 232, 233, 235]
        effort: L
        strategic: false
        status: deferred_post_mvp
