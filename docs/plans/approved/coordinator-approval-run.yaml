schema_version: 1
slug: coordinator-approval-run
blocks:
- id: contract-version
  file: docs/contracts/coordinator.yaml
  before: |2
      contract_version: 2
  after: |2
      contract_version: 3
- id: amendment-log
  file: docs/contracts/coordinator.yaml
  before: |2
      - {date: "2026-11-04", semantic_break: true, change_class: field_add, summary: "PLAN-coordinator-approve-once (operator ruling 2026-11-03): standing_authorisation lets a build merge approved, sidecar-bound text on code review PROCEED + green CI without a second operator word; approvals and the handoff template follow. contract_version 1 -> 2."}
  after: |2
      - {date: "2026-11-04", semantic_break: true, change_class: field_add, summary: "PLAN-coordinator-approve-once (operator ruling 2026-11-03): standing_authorisation lets a build merge approved, sidecar-bound text on code review PROCEED + green CI without a second operator word; approvals and the handoff template follow. contract_version 1 -> 2."}
      - {date: "{{DATE}}", semantic_break: true, change_class: field_add, summary: "PLAN-coordinator-approval-run (Decision {{N}}): governing wording is approved on GitHub through the approval run the planning worker dispatches, never a chat word alone; the approve-once item reads that approval through validate_merge_step and drops its interim check; the approvals rules, paste rule and handoff template follow. contract_version 2 -> 3."}
- id: write-the-plan
  file: docs/contracts/coordinator.yaml
  before: |2
        - {step: write_the_plan, rule: "The operator's 'write the plan' is the only human gate in planning; 'yes to all' takes every recommendation. It approves the exact wording pasted at presentation; wording added later needs a new approval."}
  after: |2
        - {step: write_the_plan, rule: "The operator's 'write the plan' is the only human gate in planning; 'yes to all' takes every recommendation. Governing wording is approved on GitHub, never by a chat word alone (Decision {{N}} cl.1): the planning worker pastes the wording inline with the link to the approval run it dispatched, and the operator's approval of that run's gate binds it; wording changed later needs a new run."}
- id: standing-authorisation
  file: docs/contracts/coordinator.yaml
  before: |2
      - "Merge a build PR whose only always_ask content is text the operator approved at planning, bound by the plan's sidecar (docs/plans/approved/<slug>.yaml), on code review PROCEED + green CI with no second operator word. The planning approval is that build's approval for that text (it overrides always_ask handling and the acting-worker rule in approvals) when the handoff note records the sidecar path, its approved digest and the plan merge commit; approved_text verify --slug <slug> --expect <digest> passes; validate_merge_step is green; and the sidecar has no commit after that plan merge. Any other always_ask content in the diff, such as a loosened test or assertion the sidecar does not name or a manual or admin step, still needs its own word, and the operator's word on the final diff stays required for CODEOWNERS paths (rec-2827), hook and other security code, IAM, spend and deploys not run by the reviewed CI channel. That the sidecar holds the approved words stays procedural until rec-4769 lands (git-ops.yaml approved_text_binding)."
  after: |2
      - "Merge a build PR whose only always_ask content is text its base sidecar (docs/plans/approved/<slug>.yaml) binds, on code review PROCEED + green CI with no second operator word, once validate_merge_step, which reads the operator's GitHub approval of that sidecar (Decision {{N}} cl.3-4), is green. This overrides always_ask handling and the acting-worker rule in approvals for that text. Any other always_ask content in the diff, such as a loosened test or assertion the sidecar does not name or a manual or admin step, still needs its own word, and the operator's word on the final diff stays required for CODEOWNERS paths (rec-2827), hook and other security code, IAM, spend and deploys not run by the reviewed CI channel."
- id: approvals-definition
  file: docs/contracts/coordinator.yaml
  before: |2
      - "An approval is the operator's own words, in the session record, about that specific action. Before a gated step, fetch the message by id and check it says what you think."
  after: |2
      - "An approval is the operator's own words, in the session record, about that specific action. Before a gated step, fetch the message by id and check it says what you think. Governing wording is the exception: its approval is the operator's approval of its run on GitHub (Decision {{N}}), which CI reads."
- id: approvals-acting-worker
  file: docs/contracts/coordinator.yaml
  before: |2
      - "A decision_prompt answer counts only in the session that posted it; an approval for a worker's action is given in that worker, except approved text a build places under standing_authorisation, whose approval is the one given in the planning worker."
  after: |2
      - "A decision_prompt answer counts only in the session that posted it; an approval for a worker's action is given in that worker, except approved text a build places under standing_authorisation, whose approval is the operator's GitHub approval of its sidecar."
- id: paste-rule
  file: docs/contracts/coordinator.yaml
  before: |2
      - "Text to approve is pasted inline in the acting worker (split across messages if long); a link may be added, never instead."
  after: |2
      - "Text to approve is pasted inline in the acting worker (split across messages if long); a link may be added, never instead. Sidecar wording also carries its approval run's link (Decision {{N}})."
- id: approvals-record
  file: docs/contracts/coordinator.yaml
  before: |2
      - "Record every approval with its message id and date in the handoff note and memory, never in the repository."
  after: |2
      - "Record every approval with its date and its message id, or for wording its approval run link, in the handoff note and memory; never put a message id in the repository."
- id: handoff-approved-text
  file: docs/contracts/coordinator.yaml
  before: |2
        Approved text: <sidecar path, approved digest, plan merge commit; or "none">
  after: |2
        Approved text: <sidecar path and approval run link; or "none">
