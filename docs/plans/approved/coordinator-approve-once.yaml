schema_version: 1
slug: coordinator-approve-once
blocks:
- id: contract-version
  file: docs/contracts/coordinator.yaml
  before: |2
      contract_version: 1
  after: |2
      contract_version: 2
- id: amendment-log
  file: docs/contracts/coordinator.yaml
  before: |2
      - {date: "2026-11-02", semantic_break: false, change_class: correction, summary: "roles.structure follows Decision 229's 2026-11-02 update: a worker starts no planning or implementation agent of its own, and may run verdict gates and advisor consults as subagents."}
  after: |2
      - {date: "2026-11-02", semantic_break: false, change_class: correction, summary: "roles.structure follows Decision 229's 2026-11-02 update: a worker starts no planning or implementation agent of its own, and may run verdict gates and advisor consults as subagents."}
      - {date: "{{DATE}}", semantic_break: true, change_class: field_add, summary: "PLAN-coordinator-approve-once (operator ruling 2026-11-03): standing_authorisation lets a build merge approved, sidecar-bound text on code review PROCEED + green CI without a second operator word; approvals and the handoff template follow. contract_version 1 -> 2."}
- id: build-step
  file: docs/contracts/coordinator.yaml
  before: |2
        - {step: build, rule: "When the handoff's dependencies merge, the coordinator starts a build worker; the build checks live preconditions itself, builds, runs code review, drives CI green and merges, holding only for an always_ask item.", see: "docs/contracts/git-ops.yaml#push_pr_ci_merge_flow"}
  after: |2
        - {step: build, rule: "When the handoff's dependencies merge, the coordinator starts a build worker; the build checks live preconditions itself, builds, runs code review, drives CI green and merges, holding only for an always_ask item that standing_authorisation does not already cover.", see: "docs/contracts/git-ops.yaml#push_pr_ci_merge_flow"}
- id: standing-authorisation
  file: docs/contracts/coordinator.yaml
  before: |2
      - Merge a build PR on code review PROCEED + green CI, including deploys run by the repo's reviewed CI deploy channel.
  after: |2
      - Merge a build PR on code review PROCEED + green CI, including deploys run by the repo's reviewed CI deploy channel.
      - "Merge a build PR whose only always_ask content is text the operator approved at planning, bound by the plan's sidecar (docs/plans/approved/<slug>.yaml), on code review PROCEED + green CI with no second operator word. The planning approval is that build's approval for that text (it overrides always_ask handling and the acting-worker rule in approvals) when the handoff note records the sidecar path, its approved digest and the plan merge commit; approved_text verify --slug <slug> --expect <digest> passes; validate_merge_step is green; and the sidecar has no commit after that plan merge. Any other always_ask content in the diff, such as a loosened test or assertion the sidecar does not name or a manual or admin step, still needs its own word, and the operator's word on the final diff stays required for CODEOWNERS paths (rec-2827), hook and other security code, IAM, spend and deploys not run by the reviewed CI channel. That the sidecar holds the approved words stays procedural until rec-4769 lands (git-ops.yaml approved_text_binding)."
- id: approvals-acting-worker
  file: docs/contracts/coordinator.yaml
  before: |2
      - "A decision_prompt answer counts only in the session that posted it; an approval for a worker's action is given in that worker."
  after: |2
      - "A decision_prompt answer counts only in the session that posted it; an approval for a worker's action is given in that worker, except approved text a build places under standing_authorisation, whose approval is the one given in the planning worker."
- id: handoff-approved-text
  file: docs/contracts/coordinator.yaml
  before: |2
        Merge rule: <standing, or the always_ask item that holds it; approvals with message ids and allowed variance>
  after: |2
        Merge rule: <standing, or the always_ask item that holds it; approvals with message ids and allowed variance>
        Approved text: <sidecar path, approved digest, plan merge commit; or "none">
