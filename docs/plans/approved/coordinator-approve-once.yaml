  after: |2
      - Merge a build PR on code review PROCEED + green CI, including deploys run by the repo's reviewed CI deploy channel.
      - "Merge a build PR whose only always_ask content is text the operator approved at planning, bound by the plan's sidecar (docs/plans/approved/<slug>.yaml), on code review PROCEED + green CI with no second operator word, when approved_text verify passes, validate_merge_step is green, and the sidecar has not changed since the merge the handoff note records with that approval. The operator's word on the final diff stays required for CODEOWNERS paths (rec-2827), hook and other security code, IAM, spend and deploys not run by the reviewed CI channel. That the sidecar holds the approved words stays procedural until rec-4769 lands (git-ops.yaml approved_text_binding)."
