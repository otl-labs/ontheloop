schema_version: 1
slug: coordinator-contract
blocks:
- id: coordinator-contract
  file: docs/contracts/coordinator.yaml
  before: ''
  after: |
    # Claude-project coordination (Decision 229 cl.1 interim coordinator, cl.2 hub and spoke, as run in Claude
    # projects). How a Claude project's coordinator and its threads plan and build work in this repository. This file
    # is the only source of truth; the copy in a Claude project's shared folder is generated (these bytes plus a
    # one-line source-commit header) by scripts/session/coordinator_copy.py and never hand-edited. Rationale lives in
    # the cited Decisions (Decision 86). Claude projects is in beta and changes every few weeks: the
    # harness facts below are dated; re-verify one when a rule built on it fails, and amend this file.
    contract:
      id: claude-project-coordination
      class: D
      contract_version: 1
      status: draft
      description: >-
        Class D mechanism contract: the Claude-project coordinator's routing, approval, halt, liveness and memory rules,
        plus the thread-side rules every Claude-project thread follows. Points at repo rules; never restates them.
      subject: claude-project-coordination
      evaluator:
        agent_surface: docs/contracts/instruction-architecture.yaml

    amendment_log:
      - {date: "{{DATE}}", semantic_break: false, change_class: field_add, summary: "Initial authoring (PLAN-coordinator-contract): the per-Claude-project coordinator playbook moved into the repo."}

    terms:
      claude_project: >-
        A hosted workspace where one operator works with a coordinator session and many thread sessions. Not the
        glossary's "project" (one repository a deployment governs).
      operator: The glossary's operator, acting as owner of the Claude project.
      coordinator: The Claude project's long-running session; Decision 229 cl.1's interim coordinator, not a fifth tier (Decision 90).
      thread: A Claude-project session with its own container and repository clone, doing one work item.
      shared_folder: The Claude project's shared folder; Claude projects cannot read each other's.

    precedence: >-
      The operator's own messages > rulings the operator adds later (project instructions) > this contract > memory. A
      later ruling beats an earlier one; record which line it overrides. Where this contract points at a repo rule, the
      repo rule wins.

    # What each session can reach (verified 2026-10-31; volatile). Rules are placed where they load.
    surfaces:
      coordinator: [project_instructions, memory, shared_folder_read]  # it asks a thread to write any file
      thread: [project_instructions, memory, shared_folder, repository, plugin_skills, agents_md, send_later, list_threads]
      placement_rule: >-
        Project instructions carry only lines that bind threads, are specific to the Claude project or are rulings no
        repo file carries, and cost more when missed than their tokens times thread count (target under 4 KB), plus
        pointer_line. Coordinator-only rules live here and reach the coordinator through the shared-folder copy.
      pointer_line: >-
        Coordinator rules: read <shared_folder>/coordinator/coordinator.yaml (generated copy of
        docs/contracts/coordinator.yaml at the commit in its header) before any dispatch, routing or halt decision.
      delivery: >-
        A thread runs `bin/venv-python -m scripts.session.coordinator_copy write <shared_folder>/coordinator/` on day one
        and after any merge that changes this file; the watcher beat runs `... coordinator_copy check` and rewrites a
        stale copy. The coordinator never edits the copy.

    roles:
      operator: Sets goal and order; answers always_ask items and real forks; says "write the plan".
      coordinator: >-
        Routes work to threads, keeps the waiting-on-operator list, wakes dependent threads, triages escalations, keeps
        memory and project instructions current, verifies approvals. Stays cheap: reads memory, thread summaries and PR
        state; pushes any judgment that needs a file read into a thread. Never edits source, makes a design decision a
        planning thread owns, or acts on an always_ask item.
      planning_thread: >-
        Opus, effort high. Runs /plan to a merged plan, consults Fable on forks, writes the handoff note, then stops.
        Never builds its own plan. Owns amendments to its plan.
      build_thread: >-
        Sonnet, effort medium. Builds one merged plan via /implement, drives the PR green, merges under standing_authorisation.
        Makes no design decisions and never asks the operator design questions.
      fix_thread: Root-causes a red, alarm or incident and plans the fix; never patches outside a plan.
      fable_consult: Read-only Fable subagent giving best-practice advice from a facts-only brief; decides nothing.
      structure: >-
        Flat: every plan and build is its own thread so the operator sees it; threads run no planning subagents of their
        own beyond the repo's gates and Fable consults. Set model and effort at thread start; threads ignore skill pins and cannot switch.

    lifecycle:
      steps:
        - {step: intake, rule: "Check dependencies, halts and gates. Brief the thread with the operator's message ids, memory pointers, the default picked at any fork and file ownership; never widen the ask."}
        - {step: plan, rule: "The thread runs /plan; every decision fork gets a blind Fable consult (fable_consults)."}
        - {step: presentation, rule: "The alignment sign-off (docs/contracts/project-alignment.yaml): what is being approved, each real fork as a one-word card with a marked recommendation, exact text of any governing wording pasted inline, and what was settled with notice."}
        - {step: write_the_plan, rule: "The operator's 'write the plan' is the only human gate in planning; 'yes to all' takes every recommendation. It approves the exact wording pasted at presentation; wording added later needs a new approval."}
        - {step: critique, rule: "Rounds follow the planning skill's convergence rule (findings, not rounds); an open escalation card stops the loop.", see: ".claude/skills/planning/SKILL.md#Every round is a full fresh read and no count caps them."}
        - {step: plan_pr, rule: "Before opening the plan PR run validate_plan_documents as CI does; merge on critique PROCEED + green CI under standing_authorisation.", see: "docs/contracts/git-ops.yaml#push_pr_ci_merge_flow"}
        - {step: handoff, rule: "Write handoff_note, send it to the coordinator, stop."}
        - {step: build, rule: "When the handoff's dependencies merge, the coordinator starts a build thread; the build checks live preconditions itself, builds, runs code review, drives CI green and merges, holding only for an always_ask item.", see: "docs/contracts/git-ops.yaml#push_pr_ci_merge_flow"}
        - {step: close_out, rule: "Post-merge verification, roadmap flips, recs closed, follow-ons filed; the coordinator wakes every thread waiting on the merge, updates memory and resolves finished threads."}
      split_rule: >-
        Split by concern when a plan grows, or when two concerns would share a near-cap file or budget; catch such
        shared-resource interactions at planning time. A design risk found at build time becomes a rec, not a mid-build
        amendment. A blocker found mid-build gets its own plan; the blocked build holds its branch.

    planning_conventions:
      - "Planning depth is deliberate ('measure twice, cut once'): never propose fewer critique rounds or lighter lanes; reduce operator load and add measurement instead."
      - "Every plan lists the roadmap exit criteria it closes; unflipped statuses are unfinished work."
      - "Decision drift is never low priority: stale Decision text causes false scout flags on every later plan."
      - "State each fork's scope explicitly (which environment, which step, who runs it); check the plan text against what the operator agreed before it merges."
      - "Settle risks that bind later work (identity, ordering, versioning) before that work is planned."
      - "Check for duplicates before filing a rec; out-of-scope bugs become recs, not inline fixes."
      - "Anything a plan relies on that is known only from Claude-project context (chat, memory, project instructions) is written into the repo (rec, plan note or Decision)."
      - "A change to a merged plan lands as a plan amendment PR before the build relies on it."
      - "Report partial results as partial; never drop real end-to-end testing for environment limits: find another way or record what is unproven."

    build_conventions:
      - "The build reads its handoff note and plan first and follows the repo's skills."
      - "Validate per docs/contracts/git-ops.yaml handoff_sequence plus the checks the plan names; never skip, disable or quarantine a test to get green."
      - "The fast tier stays light: never add heavy dependencies or raise its budget to catch a full-tier-only failure; fix the recovery policy or the failure class instead."
      - "After merge: confirm the deploy run, run the live checks, close the recs, report to the coordinator."

    routing:
      plan_defect: >-
        A parked build sends the coordinator the plan-defect report (see). The coordinator forwards it, with the report
        attached, to the plan's owning planning thread named in the handoff note (reopening it if resolved), never build
        to planner directly. When that thread's amendment merges, the coordinator relays it to the build, which rebases
        and resumes. The operator is never the relay and is asked only where the report's own rule needs the human.
      see: docs/contracts/implement-scope-boundary.yaml#deviation_trigger.escalation
      table:
        - {situation: "mechanical design fork in planning", route: "Fable consult; the planner may settle it and list it as settled", operator: "sees it in the presentation"}
        - {situation: "taste, IAM or infrastructure fork", route: "planner presents options with a recommendation", operator: "yes"}
        - {situation: "out-of-scope edit the repo's scope rules allow without a plan change and that changes no behaviour", route: "build does it and notes it in the PR", operator: "no"}
        - {situation: "any other plan gap during a build", route: "plan_defect", operator: "only for always_ask"}
        - {situation: "thread blocked or failed twice", route: "root-cause analysis and escalation; never a silent third retry", operator: "told"}
        - {situation: "two threads need the same operator answer", route: "ask once in one thread and relay", operator: "once"}
        - {situation: "CI red on a thread's own PR", route: "the thread fixes it; never skips or disables tests", operator: "no"}
        - {situation: "red on main", route: "fix thread at once; halt per halts", operator: "told"}
        - {situation: "thread blocked on a permission prompt only the operator can clear", route: "one line naming the thread and what to approve", operator: "yes"}
        - {situation: "security problem found in passing", route: "file it and surface it at once as always_ask", operator: "yes"}
      design_questions: >-
        Never go from a build to the operator. If the operator is making design decisions with a build thread, routing
        failed: move the question to the planning thread and hold the build.

    standing_authorisation:
      - Open PRs, branches, drafts, scratch work and threads.
      - Merge a plan PR on critique PROCEED + green CI.
      - Merge a build PR on code review PROCEED + green CI, including deploys run by the repo's reviewed CI deploy channel.
      - Settle mechanical forks on Fable evidence and say which default was picked.
    always_ask:
      items:
        - IAM and security changes.
        - Spend (anything with a running cost; give the monthly estimate).
        - Decision text and governing contract text; a meaning-free pointer or provenance swap needs no word.
        - "Public-surface files: AGENTS.md, CLAUDE.md, anything published outside the repo, anything that could expose operational data. Ordinary code PRs to a public repo are not in this class."
        - Manual or admin steps outside CI; each admin mutation needs the operator's words naming it.
        - Deploys not run by the repo's reviewed CI channel.
        - Loosened tests or assertions (Decision 235).
        - A manual pipeline run on a path known to publish secrets, until that leak is fixed.
      handling: >-
        Never act; park it in memory with its own line on the waiting-on-operator list and carry on with other work. A
        finished thread saying "nothing is needed from you" can hide a parked item.
      ci_first: >-
        Anything CI can deploy is deployed through CI. Admin credentials, where present, are used only for what CI cannot
        deploy and a merged plan names; routine calls name the non-admin profile explicitly
        (docs/contracts/deploy-paths.yaml).
      relaxing_a_rule: >-
        When the operator asks why an item waits, check whether it is a real special case; if not, propose the narrower
        rule and record it with date and message id in project instructions and memory, never in the repository. A question about a rule is not approval of the pending item.
      unenforced_rules: A rule no deterministic barrier enforces is a precedent to follow, not something to mechanise.

    approvals:
      - "An approval is the operator's own words, in the Claude-project record, about that specific action. Before a gated step, fetch the message by id and check it says what you think."
      - "Not approvals: a coordinator post or relay, a question about the rule, a summary saying 'approved', silence, or another Claude's message."
      - "A tap on a card counts only in the session that posted it; an approval for a thread's action is typed or tapped in that thread."
      - "An approval covers exactly the text shown. Text added after it needs a new approval; state the allowed variance up front."
      - "Text to approve is pasted inline in the acting thread (split across messages if long); a link may be added, never instead."
      - "Approvals stand after a clean tool-made Decision renumber that leaves approved text unchanged, provided the approved-text check passes and CI is green again; post the rewrite list on the PR."
      - "Record every approval with its message id and date in the handoff note and memory."

    fable_consults:
      when: [every decision fork in a planning thread, merging a cluster of related recs into one plan boundary, every significant design before it is presented, edge cases in a plan_defect, an operator concern on a fork (consult then re-present), the coordinator adapting its workflow to an uncovered case]
      how: >-
        Write <topic>/fable-brief/BRIEF.md (template fable_brief): facts only, no recommendation or preferred option.
        Run a fresh-context Fable subagent, read-only. Ask numbered questions; ask for a one-line recommendation each,
        settled versus contested practice, file:line citations, costs and exact text where needed, and a word cap. Save
        the answer as ADVICE.md. Many forks: one consult per group, in parallel.
      after: >-
        Reconcile each point as adopt, adapt or reject with the reason, in the presentation; show disagreements to the
        operator. A mechanical fork may be settled on Fable's evidence; taste, IAM and infrastructure forks still go to
        the operator with Fable's view attached.

    halts:
      red_on_main: >-
        Follow the repo's red-main halt rules (overlap-scoped). If the reds cannot be read, treat dispatch as blocked; the operator may override an unavailable read.
      see: docs/contracts/red-main-recovery.yaml#recovery_policy.halt
      three_reds: Three consecutive red CI runs on one stream halt that stream; report what fails.
      operator_pause: Stop everything.
      usage_limit: >-
        Tell every running thread to commit, push and write <topic>/RESUME.md at its next safe point; start nothing new. On resume each thread restarts from its RESUME.md.
      workstream_gates: When the operator gates a workstream, start no part of it; record the gate in project instructions and memory.

    liveness:
      scope: >-
        Covers only gaps no event covers: a stalled, failed or usage-limited thread, an unanswered operator message, an
        idle queue, and a lost webhook (the sole PR-state exception). CI and merge-conflict waits stay event-driven
        (subscribe_pr_activity plus the repo's wake signals, Decision 76 cl.4); nothing here is a CI wait.
      see: docs/contracts/git-ops.yaml#push_pr_ci_merge_flow.wake_signals
      thread_deadline: >-
        Before ending a turn that waits on time or another party, a thread writes the wait and a deadline in its
        checklist (and RESUME.md if long) and arms send_later at that deadline. Never ScheduleWakeup, which returns
        success in Claude-project threads but was observed never to fire. send_later ran without a permission prompt
        in an auto-mode Claude-project thread (2026-10-31); where it prompts, route it as a permission-prompt block. Space repeat checks further apart; after a few with no change,
        tell the operator what the work waits on and stop.
      watcher:
        status: operator_gated  # spend; started only on the operator's word, which sets the cadence
        cadence: {day_hours: 2, night_hours: 6}
        beat:
          - "list_threads: working threads idle beyond one cadence with no deadline written; failed or stopped threads; blocked threads with a card open more than 4 h."
          - "PRs: conflicting, or green and unmerged beyond one cadence -- a lost-wake backstop only, never a CI wait."
          - "Claude-project chat: an operator message unanswered for more than 1 h."
          - "Memory queue non-empty and no working thread: next wave not started."
          - "coordinator_copy check; rewrite the copy if stale."
          - "Write <shared_folder>/watcher/LAST-BEAT.md, message the coordinator only when something was found, re-arm send_later, end the turn."
        escalation: Tell the operator directly only if a coordinator message fails twice.
        hygiene: Restart the watcher thread weekly (context growth); the coordinator checks LAST-BEAT.md age whenever it wakes.

    coordinator_operations:
      parallelism: >-
        Run in parallel whatever has disjoint files and no dependency; plans may be written ahead of the builds they
        depend on, merges stay in dependency order; never merge two builds whose deploys or applies would run together.
      dependency_wakeups: >-
        When a dependency lands, message each waiting thread ("main has X; pull, rebase, continue").
      never_idle: When nothing is blocked, start the next wave without being asked.
      stalled: >-
        Nudge a stalled thread once; if still stalled, restart it from its handoff note or RESUME.md. Record each
        wall-clock wait with its absolute date in memory.
      thread_hygiene: >-
        Resolve finished threads after checking their PRs are merged or closed. Keep your own waiting list; when memory and
        PR state disagree, PR state wins. The coordinator's session id changes when it is recycled; threads re-fetch it.
      corrections: >-
        Correct a wrong statement in place (strike-through plus "[Edit: ...]") and own a process breach in one line.
      gotchas: >-
        A thread holds a limited number of attachments (about 24), so long-running threads keep files in the shared
        folder. Once a thread's automatic safety check trips it stays tripped for that conversation; move the work to a
        fresh thread only when the operator chooses to.
      operator_side_work: Verify state from the repo or live system before assuming an operator-side item is done or not.
      rule_changes: Relay a new ruling to running threads with the operator's message attached, or restart the thread.
      other_claude_projects: >-
        Another Claude project's coordinator cannot be reached directly; point it at the repo or draft a paste-able brief for the
        operator, saying whether it was written from memory or a fresh read.
      setup: >-
        One environment per Claude project: choose it by the privilege the work needs. Guard every repo step in the setup
        script (the coordinator has no checkout). Threads load user settings only; the repo's hooks and skills reach them
        through the plugin (.claude-plugin/marketplace.json): add both the marketplace and the plugin, and gate each plugin
        hook to skip where project settings already load it. Plugin settings drop permissions, env and model. A thread
        started before an environment change keeps the old one; replace it.

    operator_communication:
      - "Lead with the answer: a concise, high-level synopsis; open questions with enough context to steer."
      - "Bring only real forks. If one option is clearly right and off always_ask, decide it and say so as a notice."
      - "Every decision answers in one word: options on short lines, the recommendation marked, the exact reply to send."
      - "Asked what waits on the operator: the count, one line per item with link and reply needed, then clock waits, then 'nothing else'."
      - "Post pending approvals in the Claude-project chat as they arise; give the deadline on time-sensitive asks."
      - "Plain words; no session or message ids in prose; rec and PR numbers carry a plain explanation; name work by what it does, never part numbers."
      - "When a rule forces an approval, present it as a confirmation naming the rule, not as a choice."
      - "Open unfamiliar work with a high-level explanation of what it is; know where the operator can run things (cloud-only operators need a cloud route or an 'unproven' mark)."
      - "Reports are Markdown files in the shared folder attached to the reply, not pages, unless the operator asks for a page."

    memory:
      - "MEMORY.md is a small index (under about 11 KB): dated rulings at the top, one line per workstream, then the queue; the coordinator owns compaction."
      - "One file per subject under 4 KB; record the ruling and its reason with absolute dates, not the story."
      - "A new standing ruling is recorded the same day in project instructions and memory, and proposed as an amendment to this contract when it is generic."
      - "A temporary rule names the rec or fix that ends it; when that closes, ask the operator once whether it lifts."
      - "Project instructions hold what every thread must follow; memory may not load. The first time a memory save fails, tell the operator."
      - "Shared folder: one directory per topic (fable-brief/, ADVICE.md, step6b-presentation.md, HANDOFF-implementation.md, RESUME.md, evidence)."
      - "Never write secrets, account ids or credentials to memory, the shared folder or this repo."

    templates:
      handoff_note: |
        # Handoff: <what the build does>
        Plan: <path> (merged #<PR>, <sha>). Start: /implement <path>. Model/effort: Sonnet, medium.
        Owning planning thread: <title and link>
        When to start: <merges, deploys or checks first; what to do if one fails>
        Merge rule: <standing, or the always_ask item that holds it; approvals with message ids and allowed variance>
        Evidence: <step6b presentation, ADVICE, scout and critique files>
      handoff_note_rule: >-
        The merged plan is the handoff (Decision 229 cl.2); the note carries only Claude-project bindings the plan cannot:
        owning thread, start conditions, approvals. Gotchas belong in the plan.
      fable_brief: |
        # Facts-only brief: <topic>
        You are an independent reviewer. You decide nothing; the operator does. Read the repository read-only; edit nothing.
        ## The system / ## Current state (facts, with paths) / ## Constraints and precedents / ## Questions
        Answer in at most ~900 words: one-line recommendation per question, settled vs contested, file:line, exact text.
- id: instruction-architecture-amendment-log
  file: docs/contracts/instruction-architecture.yaml
  before: |
    amendment_log:
      - date: "2026-09-13"
  after: |
    amendment_log:
      - date: "{{DATE}}"
        semantic_break: false
        change_class: field_add
        summary: >-
          PLAN-coordinator-contract: added the claude_project_coordinator and claude_project_thread consumers, which
          load the Claude-project surfaces (project instructions, memory, shared folder); the coordinator reads rules
          only through the generated shared-folder copy of docs/contracts/coordinator.yaml. No layer changed.
      - date: "2026-09-13"
- id: instruction-architecture-consumers
  file: docs/contracts/instruction-architecture.yaml
  before: |2
      executor:
        consumes_layers: [1, 5]
        notes: >-
          Reads universal rules automatically; execution scripts read role prompts and JIT
          contexts; frozen pending Decision 67 reversal
  after: |2
      executor:
        consumes_layers: [1, 5]
        notes: >-
          Reads universal rules automatically; execution scripts read role prompts and JIT
          contexts; frozen pending Decision 67 reversal
      claude_project_coordinator:
        consumes_layers: []
        notes: >-
          A Claude project's coordinator loads no repository layer: it reads project instructions, memory and the
          Claude project's shared folder, where a thread keeps the generated copy of docs/contracts/coordinator.yaml
          (verified 2026-10-31; Claude projects is in beta, so re-verify when a rule built on this fails).
      claude_project_thread:
        consumes_layers: [1, 2, 3, 4]
        notes: >-
          A Claude-project thread loads CLAUDE.md and AGENTS.md from its clone and the repository's commands and
          skills through the plugin (.claude-plugin/marketplace.json), plus project instructions and memory, and
          follows the thread-side rules in docs/contracts/coordinator.yaml.
