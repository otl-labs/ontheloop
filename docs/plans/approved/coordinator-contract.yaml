schema_version: 1
slug: coordinator-contract
blocks:
- id: coordinator-contract
  file: docs/contracts/coordinator.yaml
  before: ''
  after: |
    # Repo-less coordination (Decision 229 cl.1 interim coordinator, cl.2 hub and spoke). How a coordinator session
    # that cannot read this repository, and the worker sessions it dispatches, plan and build work here. Origin: written
    # for a hosted multi-session workspace (Claude projects, 2026) whose coordinator saw only its standing instructions,
    # a memory store and a shared folder; per-harness facts (tool names, limits, quirks) live in that harness's standing
    # instructions or memory, never here. This file is the only source of truth; the copy in the shared store is
    # generated (these bytes plus a one-line source-commit header) by scripts/session/coordinator_copy.py and never
    # hand-edited. Rationale lives in the cited Decisions (Decision 86).
    contract:
      id: repo-less-coordination
      class: D
      contract_version: 1
      status: draft
      description: >-
        Class D mechanism contract: a repo-less coordinator's routing, approval, halt, liveness and memory rules, plus
        the rules every worker session it dispatches follows. Points at repo rules; never restates them.
      subject: repo-less-coordination
      evaluator:
        agent_surface: docs/contracts/instruction-architecture.yaml

    amendment_log:
      - {date: "{{DATE}}", semantic_break: false, change_class: field_add, summary: "Initial authoring (PLAN-coordinator-contract): the coordinator playbook moved into the repo, harness-neutral."}

    terms:
      operator: The glossary's operator, acting as owner of the coordinated work.
      coordinator: >-
        A long-running session that dispatches and tracks work but cannot read this repository; Decision 229 cl.1's
        interim coordinator, not a fifth tier (Decision 90).
      worker: A session with its own repository clone, doing one work item.
      standing_instructions: Text the harness loads into every session (coordinator and workers) at start.
      memory: A store the coordinator and workers read and write across sessions; may fail to load.
      shared_store: A file area every session can read; workers can write it.
      self_wake: A mechanism by which a worker schedules its own later turn.
      decision_prompt: A one-question, few-option prompt the operator answers with one word or a tap.

    precedence: >-
      The operator's own messages > rulings the operator adds later (standing instructions) > this contract > memory. A
      later ruling beats an earlier one; record which line it overrides. Where this contract points at a repo rule, the
      repo rule wins.

    surfaces:
      assumes:
        coordinator: [standing_instructions, memory, shared_store_read]  # it asks a worker to write any file
        worker: [standing_instructions, memory, shared_store, repository, repo_agent_rules, self_wake, worker_list]
      placement_rule: >-
        Standing instructions carry only lines that bind workers, are specific to this deployment of the coordinator or
        are rulings no repo file carries, and cost more when missed than their tokens times worker count (target under
        4 KB), plus pointer_line. Coordinator-only rules live here and reach the coordinator through the shared copy.
      pointer_line: >-
        Coordinator rules: read <shared_store>/coordinator/coordinator.yaml (generated copy of
        docs/contracts/coordinator.yaml at the commit in its header) before any dispatch, routing or halt decision.
      delivery: >-
        A worker runs `bin/venv-python -m scripts.session.coordinator_copy write <shared_store>/coordinator/` on day one
        and after any merge that changes this file; the watcher beat runs `... coordinator_copy check` and rewrites a
        stale copy. The coordinator never edits the copy.

    roles:
      operator: Sets goal and order; answers always_ask items and real forks; says "write the plan".
      coordinator: >-
        Routes work to workers, keeps the waiting-on-operator list, wakes dependent workers, triages escalations, keeps
        memory and standing instructions current, verifies approvals. Stays cheap: reads memory, worker summaries and PR
        state; pushes any judgment that needs a file read into a worker. Never edits source, makes a design decision a
        planning worker owns, or acts on an always_ask item.
      planning_worker: >-
        Most capable model, high effort. Runs /plan to a merged plan, consults an advisor on forks, writes the handoff
        note, then stops. Never builds its own plan. Owns amendments to its plan.
      build_worker: >-
        Mid-tier model, medium effort. Builds one merged plan via /implement, drives the PR green, merges under
        standing_authorisation. Makes no design decisions and never asks the operator design questions.
      fix_worker: Root-causes a red, alarm or incident and plans the fix; never patches outside a plan.
      advisor: Read-only fresh-context subagent giving best-practice advice from a facts-only brief; decides nothing.
      structure: >-
        Flat: every plan and build is its own worker so the operator sees it; workers run no planning subagents of their
        own beyond the repo's gates and advisor consults. Set model and effort at worker start.

    lifecycle:
      steps:
        - {step: intake, rule: "Check dependencies, halts and gates. Brief the worker with the operator's message ids, memory pointers, the default picked at any fork and file ownership; never widen the ask."}
        - {step: plan, rule: "The worker runs /plan; every decision fork gets a blind advisor consult (advisor_consults)."}
        - {step: presentation, rule: "The alignment sign-off (docs/contracts/project-alignment.yaml): what is being approved, each real fork as a decision_prompt with a marked recommendation, exact text of any governing wording pasted inline, and what was settled with notice."}
        - {step: write_the_plan, rule: "The operator's 'write the plan' is the only human gate in planning; 'yes to all' takes every recommendation. It approves the exact wording pasted at presentation; wording added later needs a new approval."}
        - {step: critique, rule: "Rounds follow the planning skill's convergence rule (findings, not rounds); an open escalation stops the loop.", see: ".claude/skills/planning/SKILL.md#Every round is a full fresh read and no count caps them."}
        - {step: plan_pr, rule: "Before opening the plan PR run validate_plan_documents as CI does; merge on critique PROCEED + green CI under standing_authorisation.", see: "docs/contracts/git-ops.yaml#push_pr_ci_merge_flow"}
        - {step: handoff, rule: "Write handoff_note, send it to the coordinator, stop."}
        - {step: build, rule: "When the handoff's dependencies merge, the coordinator starts a build worker; the build checks live preconditions itself, builds, runs code review, drives CI green and merges, holding only for an always_ask item.", see: "docs/contracts/git-ops.yaml#push_pr_ci_merge_flow"}
        - {step: close_out, rule: "Post-merge verification, roadmap flips, recs closed, follow-ons filed; the coordinator wakes every worker waiting on the merge, updates memory and closes finished workers."}
      split_rule: >-
        Split by concern when a plan grows, or when two concerns would share a near-cap file or budget; catch such
        shared-resource interactions at planning time. A design risk found at build time becomes a rec, not a mid-build
        amendment. A blocker found mid-build gets its own plan; the blocked build holds its branch.

    planning_conventions:
      - "Planning depth is deliberate ('measure twice, cut once'): never propose fewer critique rounds or lighter lanes; reduce operator load and add measurement instead."
      - "Every plan lists the roadmap exit criteria it closes; unflipped statuses are unfinished work."
      - "Decision drift is never low priority: stale Decision text causes false scout flags on every later plan."
      - "State each fork's scope explicitly (which environment, which step, who runs it); check the plan text against what the operator agreed before it merges."
      - "Settle risks that bind later work (identity, ordering, versioning) before that work is planned."
      - "Check for duplicates before filing a rec; out-of-scope bugs become recs, not inline fixes."
      - "Anything a plan relies on that is known only from session context (chat, memory, standing instructions) is written into the repo (rec, plan note or Decision)."
      - "A change to a merged plan lands as a plan amendment PR before the build relies on it."
      - "Report partial results as partial; never drop real end-to-end testing for environment limits: find another way or record what is unproven."

    build_conventions:
      - "The build reads its handoff note and plan first and follows the repo's skills."
      - "Validate per docs/contracts/git-ops.yaml handoff_sequence plus the checks the plan names; never skip, disable or quarantine a test to get green."
      - "The fast tier stays light: never add heavy dependencies or raise its budget to catch a full-tier-only failure; fix the recovery policy or the failure class instead."
      - "After merge: confirm the deploy run, run the live checks, close the recs, report to the coordinator."

    routing:
      plan_defect: >-
        A parked build sends the coordinator the plan-defect report (see). The coordinator forwards it, with the report
        attached, to the plan's owning planning worker named in the handoff note (reopening it if closed), never build
        to planner directly. When that worker's amendment merges, the coordinator relays it to the build, which rebases
        and resumes. The operator is never the relay and is asked only where the report's own rule needs the human.
      see: docs/contracts/implement-scope-boundary.yaml#deviation_trigger.escalation
      table:
        - {situation: "mechanical design fork in planning", route: "advisor consult; the planner may settle it and list it as settled", operator: "sees it in the presentation"}
        - {situation: "taste, IAM or infrastructure fork", route: "planner presents options with a recommendation", operator: "yes"}
        - {situation: "out-of-scope edit the repo's scope rules allow without a plan change and that changes no behaviour", route: "build does it and notes it in the PR", operator: "no"}
        - {situation: "any other plan gap during a build", route: "plan_defect", operator: "only for always_ask"}
        - {situation: "worker blocked or failed twice", route: "root-cause analysis and escalation; never a silent third retry", operator: "told"}
        - {situation: "two workers need the same operator answer", route: "ask once in one worker and relay", operator: "once"}
        - {situation: "CI red on a worker's own PR", route: "the worker fixes it; never skips or disables tests", operator: "no"}
        - {situation: "red on main", route: "fix worker at once; halt per halts", operator: "told"}
        - {situation: "worker blocked on a permission prompt only the operator can clear", route: "one line naming the worker and what to approve", operator: "yes"}
        - {situation: "security problem found in passing", route: "file it and surface it at once as always_ask", operator: "yes"}
      design_questions: >-
        Never go from a build to the operator. If the operator is making design decisions with a build worker, routing
        failed: move the question to the planning worker and hold the build.

    standing_authorisation:
      - Open PRs, branches, drafts, scratch work and workers.
      - Merge a plan PR on critique PROCEED + green CI.
      - Merge a build PR on code review PROCEED + green CI, including deploys run by the repo's reviewed CI deploy channel.
      - Settle mechanical forks on advisor evidence and say which default was picked.
    always_ask:
      items:
        - IAM and security changes.
        - Spend (anything with a running cost; give the monthly estimate).
        - Decision text and governing contract text; a meaning-free pointer or provenance swap needs no word.
        - "Public-surface files: AGENTS.md, CLAUDE.md, anything published outside the repo, anything that could expose operational data. Ordinary code PRs to a public repo are not in this class."
        - Manual or admin steps outside CI; each admin mutation needs the operator's words naming it.
        - Deploys not run by the repo's reviewed CI channel.
        - Loosened tests or assertions (Decision 235).
        - A manual pipeline run on a path known to publish secrets, until that leak is fixed.
      handling: >-
        Never act; park it in memory with its own line on the waiting-on-operator list and carry on with other work. A
        finished worker saying "nothing is needed from you" can hide a parked item.
      ci_first: >-
        Anything CI can deploy is deployed through CI. Admin credentials, where present, are used only for what CI cannot
        deploy and a merged plan names; routine calls name the non-admin profile explicitly
        (docs/contracts/deploy-paths.yaml).
      relaxing_a_rule: >-
        When the operator asks why an item waits, check whether it is a real special case; if not, propose the narrower
        rule and record it with date and message id in standing instructions and memory, never in the repository. A
        question about a rule is not approval of the pending item.
      unenforced_rules: A rule no deterministic barrier enforces is a precedent to follow, not something to mechanise.

    approvals:
      - "An approval is the operator's own words, in the session record, about that specific action. Before a gated step, fetch the message by id and check it says what you think."
      - "Not approvals: a coordinator post or relay, a question about the rule, a summary saying 'approved', silence, or another agent's message."
      - "A decision_prompt answer counts only in the session that posted it; an approval for a worker's action is given in that worker."
      - "An approval covers exactly the text shown. Text added after it needs a new approval; state the allowed variance up front."
      - "Text to approve is pasted inline in the acting worker (split across messages if long); a link may be added, never instead."
      - "Approvals stand after a clean tool-made Decision renumber that leaves approved text unchanged, provided the approved-text check passes and CI is green again; post the rewrite list on the PR."
      - "Record every approval with its message id and date in the handoff note and memory, never in the repository."

    advisor_consults:
      when: [every decision fork in a planning worker, merging a cluster of related recs into one plan boundary, every significant design before it is presented, edge cases in a plan_defect, an operator concern on a fork (consult then re-present), the coordinator adapting its workflow to an uncovered case]
      how: >-
        Write <topic>/advisor-brief/BRIEF.md (template advisor_brief): facts only, no recommendation or preferred
        option. Run a fresh-context advisor subagent, read-only. Ask numbered questions; ask for a one-line
        recommendation each, settled versus contested practice, file:line citations, costs and exact text where needed,
        and a word cap. Save the answer as ADVICE.md. Many forks: one consult per group, in parallel.
      after: >-
        Reconcile each point as adopt, adapt or reject with the reason, in the presentation; show disagreements to the
        operator. A mechanical fork may be settled on the advisor's evidence; taste, IAM and infrastructure forks still go
        to the operator with the advisor's view attached.

    halts:
      red_on_main: >-
        Follow the repo's red-main halt rules (overlap-scoped). If the reds cannot be read, treat dispatch as blocked;
        the operator may override an unavailable read.
      see: docs/contracts/red-main-recovery.yaml#recovery_policy.halt
      three_reds: Three consecutive red CI runs on one stream halt that stream; report what fails.
      operator_pause: Stop everything.
      usage_limit: >-
        Tell every running worker to commit, push and write <topic>/RESUME.md at its next safe point; start nothing new.
        On resume each worker restarts from its RESUME.md.
      workstream_gates: When the operator gates a workstream, start no part of it; record the gate in standing instructions and memory.

    liveness:
      scope: >-
        Covers only gaps no event covers: a stalled, failed or usage-limited worker, an unanswered operator message, an
        idle queue, and a lost webhook (the sole PR-state exception). CI and merge-conflict waits stay event-driven
        (PR-event subscription plus the repo's wake signals, Decision 76 cl.4); nothing here is a CI wait.
      see: docs/contracts/git-ops.yaml#push_pr_ci_merge_flow.wake_signals
      worker_deadline: >-
        Before ending a turn that waits on time or another party, a worker writes the wait and a deadline where the
        coordinator can see it (and RESUME.md if long) and arms a self_wake at that deadline, using only a mechanism
        verified to fire in this harness. Space repeat checks further apart; after a few with no change, tell the
        operator what the work waits on and stop.
      watcher:
        role: A long-lived worker whose only job is the beat below; it fixes nothing and reports to the coordinator.
        status: operator_gated  # spend; started only on the operator's word, which sets the cadence
        cadence: {day_hours: 2, night_hours: 6}
        beat:
          - "Workers: working ones idle beyond one cadence with no deadline written; failed or stopped ones; blocked ones with a decision_prompt open more than 4 h."
          - "PRs: conflicting, or green and unmerged beyond one cadence -- a lost-wake backstop only, never a CI wait."
          - "Operator messages to the coordinator unanswered for more than 1 h."
          - "Memory queue non-empty and no working worker: next wave not started."
          - "coordinator_copy check; rewrite the copy if stale."
          - "Write <shared_store>/watcher/LAST-BEAT.md, message the coordinator only when something was found, re-arm the self_wake, end the turn."
        escalation: Tell the operator directly only if a coordinator message fails twice.
        hygiene: Restart the watcher weekly (context growth); the coordinator checks LAST-BEAT.md age whenever it wakes.

    coordinator_operations:
      parallelism: >-
        Run in parallel whatever has disjoint files and no dependency; plans may be written ahead of the builds they
        depend on, merges stay in dependency order; never merge two builds whose deploys or applies would run together.
      dependency_wakeups: >-
        When a dependency lands, message each waiting worker ("main has X; pull, rebase, continue").
      never_idle: When nothing is blocked, start the next wave without being asked.
      stalled: >-
        Nudge a stalled worker once; if still stalled, restart it from its handoff note or RESUME.md. Record each
        wall-clock wait with its absolute date in memory.
      worker_hygiene: >-
        Close finished workers after checking their PRs are merged or closed. Keep your own waiting list; when memory and
        PR state disagree, PR state wins.
      corrections: >-
        Correct a wrong statement in place (strike-through plus "[Edit: ...]") and own a process breach in one line.
      operator_side_work: Verify state from the repo or live system before assuming an operator-side item is done or not.
      rule_changes: Relay a new ruling to running workers with the operator's message attached, or restart the worker.
      other_coordinators: >-
        Another coordinator cannot be reached directly; point it at the repo or draft a paste-able brief for the
        operator, saying whether it was written from memory or a fresh read.
      setup: >-
        Choose each worker environment by the privilege the work needs; guard every repo step in setup, since the
        coordinator has no checkout. Verify on day one which of the repo's agent rules, hooks and skills actually load in
        workers, and record any gap in standing instructions. A worker started before an environment change keeps the
        old one; replace it.

    operator_communication:
      - "Lead with the answer: a concise, high-level synopsis; open questions with enough context to steer."
      - "Bring only real forks. If one option is clearly right and off always_ask, decide it and say so as a notice."
      - "Every decision answers in one word: options on short lines, the recommendation marked, the exact reply to send."
      - "Asked what waits on the operator: the count, one line per item with link and reply needed, then clock waits, then 'nothing else'."
      - "Post pending approvals where the operator talks to the coordinator as they arise; give the deadline on time-sensitive asks."
      - "Plain words; no session or message ids in prose; rec and PR numbers carry a plain explanation; name work by what it does, never part numbers."
      - "When a rule forces an approval, present it as a confirmation naming the rule, not as a choice."
      - "Open unfamiliar work with a high-level explanation of what it is; know where the operator can run things (cloud-only operators need a cloud route or an 'unproven' mark)."
      - "Reports are Markdown files in the shared store attached to the reply, unless the operator asks for another form."

    memory:
      - "The memory index is small (under about 11 KB): dated rulings at the top, one line per workstream, then the queue; the coordinator owns compaction."
      - "One file per subject under 4 KB; record the ruling and its reason with absolute dates, not the story."
      - "A new standing ruling is recorded the same day in standing instructions and memory, and proposed as an amendment to this contract when it is generic."
      - "A temporary rule names the rec or fix that ends it; when that closes, ask the operator once whether it lifts."
      - "Standing instructions hold what every worker must follow; memory may not load. The first time a memory save fails, tell the operator."
      - "Shared store: one directory per topic (advisor-brief/, ADVICE.md, the presentation, HANDOFF-implementation.md, RESUME.md, evidence)."
      - "Never write secrets, account ids or credentials to memory, the shared store or this repo."

    templates:
      handoff_note: |
        # Handoff: <what the build does>
        Plan: <path> (merged #<PR>, <sha>). Start: /implement <path>. Model/effort: mid-tier, medium.
        Owning planning worker: <title and link>
        When to start: <merges, deploys or checks first; what to do if one fails>
        Merge rule: <standing, or the always_ask item that holds it; approvals with message ids and allowed variance>
        Evidence: <presentation, ADVICE, scout and critique files>
      handoff_note_rule: >-
        The merged plan is the handoff (Decision 229 cl.2); the note carries only session bindings the plan cannot:
        owning worker, start conditions, approvals. Gotchas belong in the plan.
      advisor_brief: |
        # Facts-only brief: <topic>
        You are an independent reviewer. You decide nothing; the operator does. Read the repository read-only; edit nothing.
        ## The system / ## Current state (facts, with paths) / ## Constraints and precedents / ## Questions
        Answer in at most ~900 words: one-line recommendation per question, settled vs contested, file:line, exact text.
- id: instruction-architecture-amendment-log
  file: docs/contracts/instruction-architecture.yaml
  before: |
    amendment_log:
      - date: "2026-09-13"
  after: |
    amendment_log:
      - date: "{{DATE}}"
        semantic_break: false
        change_class: field_add
        summary: >-
          PLAN-coordinator-contract: added the repo_less_coordinator and coordinated_worker consumers, which load
          harness surfaces (standing instructions, memory, a shared store) rather than repository layers; the coordinator
          reads rules only through the generated shared-store copy of docs/contracts/coordinator.yaml. No layer changed.
      - date: "2026-09-13"
- id: instruction-architecture-consumers
  file: docs/contracts/instruction-architecture.yaml
  before: |2
      executor:
        consumes_layers: [1, 5]
        notes: >-
          Reads universal rules automatically; execution scripts read role prompts and JIT
          contexts; frozen pending Decision 67 reversal
  after: |2
      executor:
        consumes_layers: [1, 5]
        notes: >-
          Reads universal rules automatically; execution scripts read role prompts and JIT
          contexts; frozen pending Decision 67 reversal
      repo_less_coordinator:
        consumes_layers: []
        notes: >-
          A coordinator session that cannot read the repository loads no repository layer: it reads its standing
          instructions, memory and a shared store, where a worker keeps the generated copy of
          docs/contracts/coordinator.yaml.
      coordinated_worker:
        consumes_layers: [1, 2, 3, 4]
        notes: >-
          A worker session dispatched by a repo_less_coordinator loads CLAUDE.md and AGENTS.md from its clone and the
          repository's commands and skills, plus its standing instructions and memory, and follows the worker rules in
          docs/contracts/coordinator.yaml.
