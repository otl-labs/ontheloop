schema_version: 1
slug: coordinator-playbook-kit
blocks:
- id: contract-version
  file: docs/contracts/coordinator.yaml
  before: |2
      contract_version: 3
  after: |2
      contract_version: 4
- id: amendment-log
  file: docs/contracts/coordinator.yaml
  before: |2
      - {date: "2026-11-07", semantic_break: true, change_class: field_add, summary: "PLAN-coordinator-approval-run (Decision 246): governing wording is approved on GitHub through the approval run the planning worker dispatches, never a chat word alone; the approve-once item reads that approval through validate_merge_step and drops its interim check; the approvals rules, paste rule and handoff template follow. contract_version 2 -> 3."}
  after: |2
      - {date: "2026-11-07", semantic_break: true, change_class: field_add, summary: "PLAN-coordinator-approval-run (Decision 246): governing wording is approved on GitHub through the approval run the planning worker dispatches, never a chat word alone; the approve-once item reads that approval through validate_merge_step and drops its interim check; the approvals rules, paste rule and handoff template follow. contract_version 2 -> 3."}
      - {date: "{{DATE}}", semantic_break: true, change_class: field_add, summary: "PLAN-coordinator-playbook-kit (operator goal 2026-10-30, scoped to work on this repository; other repositories rec-4999): templates gain the adoption kit (goal, standing instructions, memory seed, day one); split_rule, planning_conventions and operator_side_work take the generic rulings of this coordinated work; memory rulings carry a routing tag and generic ones land in batches, one approval per owning file. contract_version 3 -> 4."}
- id: split-rule
  file: docs/contracts/coordinator.yaml
  before: |2
        shared-resource interactions at planning time. A design risk found at build time becomes a rec, not a mid-build
        amendment. A blocker found mid-build gets its own plan; the blocked build holds its branch.
  after: |2
        shared-resource interactions at planning time. A design risk found at build time becomes a rec, not a mid-build
        amendment. A blocker found mid-build that the build cannot fix inside its own plan, such as CI it cannot make
        pass (a red on main follows halts), gets its own plan from a new planning worker the coordinator starts; a
        defect in the build's own plan follows routing.plan_defect. The blocked build holds its branch.
- id: routing-own-pr-red
  file: docs/contracts/coordinator.yaml
  before: |2
        - {situation: "CI red on a worker's own PR", route: "the worker fixes it; never skips or disables tests", operator: "no"}
  after: |2
        - {situation: "CI red on a worker's own PR", route: "the worker fixes it; never skips or disables tests; a blocker it cannot fix inside its own plan follows lifecycle.split_rule", operator: "no"}
- id: planning-deterministic-proof
  file: docs/contracts/coordinator.yaml
  before: |2
      - "Planning depth is deliberate ('measure twice, cut once'): never propose fewer critique rounds or lighter lanes; reduce operator load and add measurement instead."
  after: |2
      - "Planning depth is deliberate ('measure twice, cut once'): never propose fewer critique rounds or lighter lanes; reduce operator load and add measurement instead."
      - "Prove a plan with deterministic checks; never propose a throwaway build to test it."
- id: operator-side-work
  file: docs/contracts/coordinator.yaml
  before: |2
      operator_side_work: Verify state from the repo or live system before assuming an operator-side item is done or not.
  after: |2
      operator_side_work: >-
        Verify state from the repo or live system before assuming an operator-side item is done or not. Work the
        operator takes outside the coordinated work leaves its remit: record that and track only the outcome.
- id: memory-routing-tag
  file: docs/contracts/coordinator.yaml
  before: |2
      - "A new standing ruling is recorded the same day in standing instructions and memory, and proposed as an amendment to this contract when it is generic."
  after: |2
      - "A new standing ruling is recorded the same day in standing instructions and memory. Its memory line carries one routing tag: [contract] (generic, belongs here), [harness] (a harness fact), [local] (this coordinated work only) or [repo:<path>] (another repo file owns it; name its rec once one is filed); the coordinator appends 'landed <date>' at close_out of the change that carries it and drops the line at the next compaction."
      - "Generic rulings land in batches. When the watcher reports, or the coordinator finds on any wake, more than five [contract] or [repo:<path>] lines not landed and naming no open rec, or the oldest over seven days, the coordinator offers the operator one amendment per owning file as a decision_prompt and, on yes, starts one planning worker for each, which lands all of that file's rulings under one approval; on no, it records the answer and offers again only when the count or the oldest line changes."
- id: watcher-ruling-batch
  file: docs/contracts/coordinator.yaml
  before: |2
          - "coordinator_copy check; rewrite the copy if stale."
  after: |2
          - "coordinator_copy check; rewrite the copy if stale."
          - "Memory rulings tagged [contract] or [repo:<path>], not landed and naming no open rec: more than five, or the oldest over seven days."
- id: templates-adoption-kit
  file: docs/contracts/coordinator.yaml
  before: |2
        Answer in at most ~900 words: one-line recommendation per question, settled vs contested, file:line, exact text.
  after: |2
        Answer in at most ~900 words: one-line recommendation per question, settled vs contested, file:line, exact text.
      goal: |
        Drive <workstream> to completion under the delegated authority in the standing instructions. Order: <A> -> <B>.
        Done means: <deliverable, and how it is proven>. Method, halts and the always_ask list: the coordinator
        contract's lifecycle, halts and always_ask.
      standing_instructions: |
        Workspace: <name>. Repo: <owner/repo> (source of truth for plans, recs, Decisions, roadmap).
        <pointer_line>
        Workers: planning <most capable model, high effort>; build <mid-tier model, medium effort>; set at start.
        Rulings (newest wins; dated): <only those no repo file carries yet, one line each>
        Harness facts: <where this harness's facts live>
        Day one: until <shared_store>/coordinator/coordinator.yaml exists, the only dispatch is a worker that writes it.
      memory_seed: |
        - <date> Goal: <one line>. Operator: <name>; runs things from <where>.
        - Rulings, newest first: <date> <ruling> [<routing tag>]
        - Workstreams: <one line each: owning worker, plan, handoff note, recs>
        - Queue: <next items in order>
      day_one: |
        1. Operator: set the worker environment (coordinator_operations.setup) before any worker starts.
        2. Operator: fill goal and standing_instructions into the harness's goal and instruction fields, seed memory
           from memory_seed, and give the coordinator steps 3-4 in its first message.
        3. Coordinator: the one dispatch before the shared copy exists, a worker that writes it (surfaces.delivery) and
           records which repo rules, hooks and skills load in workers.
        4. Coordinator: ask the operator where they can run things and whether to start the watcher (liveness.watcher).
- id: test-contract-version
  file: tests/checks/contracts/test_coordinator_contract.py
  before: |2
        assert _DOC["contract"]["contract_version"] == 3
  after: |2
        assert _DOC["contract"]["contract_version"] == 4
