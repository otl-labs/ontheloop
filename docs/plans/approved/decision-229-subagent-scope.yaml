schema_version: 1
slug: decision-229-subagent-scope
blocks:
- id: decision-229-update
  file: docs/DECISIONS.md
  before: |
    > human's own approval, and nothing is loosened to obtain green (Decision 235). Hub and spoke is
    > unchanged.
  after: |
    > human's own approval, and nothing is loosened to obtain green (Decision 235). Hub and spoke is
    > unchanged.

    > **Update (2026-11-02):** operator clarification of cl.2's scope. "Personas never invoke personas"
    > binds the doing personas: no session, worker or persona starts a planning or implementation agent of
    > its own; the coordinator dispatches each. It does not bar a planning or build session from running
    > the repo's in-session verdict gates (decision-scout, plan-critique, code-review) or a read-only
    > advice consult as subagents, which gate until their persona flips (cl.4). After a flip, a session
    > runs that gate only as cl.4's outage fallback, so the end state is no nested personas.
- id: coordinator-amendment-log
  file: docs/contracts/coordinator.yaml
  before: |
    - {date: "2026-11-02", semantic_break: false, change_class: field_add, summary: "Initial authoring (PLAN-coordinator-contract): the coordinator playbook moved into the repo, harness-neutral."}
  after: |
    - {date: "2026-11-02", semantic_break: false, change_class: field_add, summary: "Initial authoring (PLAN-coordinator-contract): the coordinator playbook moved into the repo, harness-neutral."}
    - {date: "{{DATE}}", semantic_break: false, change_class: correction, summary: "roles.structure follows Decision 229's 2026-11-02 update: a worker starts no planning or implementation agent of its own, and may run verdict gates and advisor consults as subagents."}
- id: coordinator-structure
  file: docs/contracts/coordinator.yaml
  before: |
    structure: >-
      Flat: every plan and build is its own worker so the operator sees it; workers run no planning subagents of their
      own beyond the repo's gates and advisor consults. Set model and effort at worker start.
  after: |
    structure: >-
      Flat: every plan and build is its own worker so the operator sees it; a worker starts no planning or
      implementation agent of its own (Decision 229 cl.2) but may run the repo's verdict gates and advisor consults as
      subagents. Set model and effort at worker start.
