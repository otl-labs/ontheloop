schema_version: 1
slug: decision-263-pr-refusal-proof
tldr: >-
  Decision 263 still says a pull_request job's refusal of the persona-verdict role waits for a live run. This dated
  Update says it is already established by three things: the static trust test, a new test showing GitHub's
  pull_request claims fail the role's conditions, and the refusal job's live AccessDenied (run 45166608964). It names
  the one case no live run has shown (right Environment, wrong workflow ref) as a residual held by Decision 263's
  trust-claims-change condition. No workflow, secret or role changes.
blocks:
- id: decision-263-update-pr-refusal
  file: docs/DECISIONS.md
  before: |
    ---

    ## Decision 262: A plan PR whose last decision-scout row is BLOCK fails its check, with no exemption and no agent override -- the operator's admin bypass merge is the release valve (amends Decision 83) (Decided)
  after: |
    > **Update ({{DATE}}):** A pull_request job's refusal (the Coverage line and the 2026-11-17 Update) is established without a live pull_request job: such a job could name the role only with the account id secret, and the persona path's pull_request trigger is secretless (Decision 205 cl.2). It rests on test_persona_verdict_role.py, which pins the one StringEquals trust statement with no pull_request subject; test_pull_request_claims_fail_the_trust_conditions, which shows GitHub's pull_request claims, with or without the Environment, fail the parsed conditions; and the refusal job's live AccessDenied (run 45166608964), which shows AWS enforcing the subject condition. The two tests are the enforcing checks. One residual is unproven live: a token with the Environment's subject but another job_workflow_ref, which a pull_request job naming the main-only Environment would carry if GitHub ran it. It rests on AWS evaluating job_workflow_ref, held by trust-claims-change.

    ---

    ## Decision 262: A plan PR whose last decision-scout row is BLOCK fails its check, with no exemption and no agent override -- the operator's admin bypass merge is the release valve (amends Decision 83) (Decided)
