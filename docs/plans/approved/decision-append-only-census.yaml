tldr: 'Three dated notes. Decisions 210 and 65 record that merge 660d5b54 (#1568) shortened ratified text in place, where
  the original is, and that the shortened text stands (210 gets two small restorations: "never a write-time rule source" and
  the write-time-enforcement pointer). Decision 177 records that the append-only census re-lands clauses 1-4 as a report plus
  a fast-tier WARN, and that its acknowledgement ledger is post-hoc, not a waiver route. No clause changes.'
