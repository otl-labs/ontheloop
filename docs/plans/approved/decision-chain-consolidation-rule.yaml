schema_version: 1
slug: decision-chain-consolidation-rule
tldr: 'The general rule for retiring long Decision amendment chains: a new Decision amending Decision 149 lets a consolidating
  entry count a delegated value as restated (three safeguards), nominates any Decision with five or more live amenders without
  forcing a consolidation, and requires a checked manifest that accounts for every paragraph of each retired entry; decision-compaction.yaml
  gains the consolidation key that holds the values.'
