schema_version: 1
slug: decision-index-slim-rows
tldr: >-
  The decision scout stops loading every Decision's excerpt on every planning round: the committed index keeps slim
  rows, the scout screens the remaining entries by title (discarding only when certain) and fetches excerpts for the
  rest in one call, and compacted stubs become skeleton rows; the scout's skill and the contract that states its
  method say so, and the skill gets shorter.
blocks:
- id: skill-step-1
  file: .claude/skills/decision-scout/SKILL.md
  before: |
    Each live entry's `title`, `triage_excerpt` (<=320 chars; its marker in `triage_excerpt_source`), `currency` and `category_tags` is the Phase 2 signal -- never a whole-file load here.
  after: |
    Each live entry's `title`, `currency` and `category_tags` is the Phase 2 signal -- never a whole-file load here.
- id: skill-step-2-inputs
  file: .claude/skills/decision-scout/SKILL.md
  before: |
    - **Intent** (1-2 sentences from `/plan` Step 3 clarification)
    - **Proposed approach** (paragraph from `/plan` Step 3-5 synthesis)
    - **Scope file list** (from `/plan` Step 4 Identify Affected Files)
    - **Verification Tier** (V1 / V2 / V3, from `/plan` Step 5)
    - **Explicitly cited decision IDs** (any decisions the human or planning agent has already referenced)
  after: |
    - **Intent** (1-2 sentences, `/plan` Step 3)
    - **Proposed approach** (`/plan` Steps 3-5 synthesis)
    - **Scope file list** (`/plan` Step 4)
    - **Verification Tier** (V1/V2/V3, `/plan` Step 5)
    - **Explicitly cited decision IDs** (any the human or planning agent already named)
- id: skill-step-3
  file: .claude/skills/decision-scout/SKILL.md
  before: |
    THEN classify every REMAINING entry PROVISIONALLY via title + `triage_excerpt`:
  after: |
    THEN screen every REMAINING entry by title (IRRELEVANT only when certain), fetch the rest's excerpts in one call (`bin/venv-python -m scripts.decisions_index --excerpts <ids>`) and classify each PROVISIONALLY via title + excerpt:
- id: contract-bounded-retrieval
  file: docs/contracts/instruction-architecture.yaml
  before: |
    triage every live title + triage_excerpt from the index, then read ONLY shortlisted
    entries as targeted source-file sections.
  after: |
    triage every live title, tag set and currency from the slim index, fetch excerpts on demand
    (scripts.decisions_index --excerpts) only for entries a title screen does not discard as
    certainly irrelevant, then read ONLY shortlisted entries as targeted source-file sections.
- id: contract-triage-source
  file: docs/contracts/instruction-architecture.yaml
  before: |
    decision number (numbering gaps). triage_excerpt follows the Intent/Problem/Context/Decision
    fallback order; triage_excerpt_source names which; a small terse-historical band carries none.
  after: |
    decision number (numbering gaps). The index holds slim rows, one compact row per line, and
    compacted stubs are skeleton rows like archived ones, keeping currency (rec-3250, rec-5258);
    excerpts are never committed or loaded whole: scripts.decisions_index --excerpts derives them on
    demand through the same parser. triage_excerpt follows the Intent/Problem/Context/Decision
    fallback order; triage_excerpt_source names which; a small terse-historical band carries none.
- id: contract-amendment-log
  file: docs/contracts/instruction-architecture.yaml
  before: |
    amendment_log:
  after: |
    amendment_log:
      - date: "{{DATE}}"
        semantic_break: false
        change_class: governance_note_add
        summary: >-
          PLAN-decision-index-slim-rows (rec-3250, rec-5258; contract-first retrospective CFR-03): bounded_retrieval
          and triage_source_provenance follow the slim index, whose excerpts the scout fetches on demand for entries
          its title screen keeps. The output contract and quality gates are unchanged. No layer or consumer changed.
