schema_version: 1
slug: decision-index-slim-rows
tldr: >-
  The decision scout's whole-load index gets about a quarter smaller without changing what the scout sees: every live
  Decision keeps its title, excerpt text, tags and currency, but the index drops the excerpt's source and truncation
  markers (available on demand from a command), writes one compact row per line, and makes compacted stubs skeleton
  rows; the scout's skill and the contract that states its method say so, and the skill gets shorter.
blocks:
- id: skill-step-1
  file: .claude/skills/decision-scout/SKILL.md
  before: |
    Each live entry's `title`, `triage_excerpt` (<=320 chars; its marker in `triage_excerpt_source`), `currency` and `category_tags` is the Phase 2 signal -- never a whole-file load here.
  after: |
    Each live entry's `title`, `triage_excerpt` (<=320 chars), `currency` and `category_tags` is the Phase 2 signal -- never a whole-file load here.
- id: skill-step-2-inputs
  file: .claude/skills/decision-scout/SKILL.md
  before: |
    - **Intent** (1-2 sentences from `/plan` Step 3 clarification)
    - **Proposed approach** (paragraph from `/plan` Step 3-5 synthesis)
    - **Scope file list** (from `/plan` Step 4 Identify Affected Files)
    - **Verification Tier** (V1 / V2 / V3, from `/plan` Step 5)
    - **Explicitly cited decision IDs** (any decisions the human or planning agent has already referenced)
  after: |
    - **Intent** (1-2 sentences, `/plan` Step 3)
    - **Proposed approach** (`/plan` Steps 3-5 synthesis)
    - **Scope file list** (`/plan` Step 4)
    - **Verification Tier** (V1/V2/V3, `/plan` Step 5)
    - **Explicitly cited decision IDs** (any the human or planning agent already named)
- id: contract-triage-source
  file: docs/contracts/instruction-architecture.yaml
  before: |
    decision number (numbering gaps). triage_excerpt follows the Intent/Problem/Context/Decision
    fallback order; triage_excerpt_source names which; a small terse-historical band carries none.
  after: |
    decision number (numbering gaps). The index writes one compact row per line; a live row keeps
    its triage_excerpt text but not its source or truncation marker, and compacted stubs are
    skeleton rows like archived ones, keeping currency (rec-3250, rec-5258);
    scripts.decisions_index --excerpts serves all three excerpt fields on demand through the same
    parser. triage_excerpt follows the Intent/Problem/Context/Decision fallback order;
    triage_excerpt_source names which; a small terse-historical band carries none.
- id: contract-amendment-log
  file: docs/contracts/instruction-architecture.yaml
  before: |
    amendment_log:
  after: |
    amendment_log:
      - date: "{{DATE}}"
        semantic_break: false
        change_class: governance_note_add
        summary: >-
          PLAN-decision-index-slim-rows (rec-5258, part of rec-3250; contract-first retrospective CFR-03):
          triage_source_provenance follows the compacted index, which keeps every live entry's excerpt text after a
          recall replay showed a title-only screen loses cited Decisions. The output contract and quality gates are
          unchanged. No layer or consumer changed.
