schema_version: 1
slug: decision-number-fill
blocks:
- id: entry-number-assignment
  file: docs/contracts/decision-entry.yaml
  before: |2-
        rebasing onto origin/main, fills it with MAX(decision number across docs/DECISIONS.md and
        docs/DECISIONS_ARCHIVE.md) + 1 in the edit that inserts the entry;
  after: |2-
        rebasing onto origin/main, fills it with MAX(decision number across docs/DECISIONS.md and
        docs/DECISIONS_ARCHIVE.md) + 1 in the edit that inserts the entry by running
        `bin/venv-python -m scripts.session.decision_fill`;
- id: entry-parser-note
  file: docs/contracts/decision-entry.yaml
  before: |2
      tests/test_decision_field_grammar.py pins both constants to field_grammar's regexes (CI fails
      on divergence).
  after: |2
      tests/test_decision_field_grammar.py pins both constants to field_grammar's regexes (CI fails
      on divergence). A placeholder entry is read through the same module's iter_placeholder_headings(content)
      and extract_entry_envelope(block, placeholder=True), never a hand-rolled regex.
- id: entry-amendment
  file: docs/contracts/decision-entry.yaml
  before: |2
      - {date: "2026-11-07", semantic_break: false, change_class: field_add, summary: "PLAN-serves-claim-verification (rec-4915): serves gains verification, the evidence a serves id needs, and plan-critique step 12p, not the decision scout, verifies the claim. Three 2026 rows above were rewritten in flow style, words unchanged."}
  after: |2
      - {date: "2026-11-07", semantic_break: false, change_class: field_add, summary: "PLAN-serves-claim-verification (rec-4915): serves gains verification, the evidence a serves id needs, and plan-critique step 12p, not the decision scout, verifies the claim. Three 2026 rows above were rewritten in flow style, words unchanged."}
      - {date: "{{DATE}}", semantic_break: false, change_class: prose_improvement, summary: "PLAN-decision-number-fill (rec-4793, rec-4664): number_assignment names scripts.session.decision_fill, the implementer's fill of the number placeholder; shared_parser_note names the placeholder grammar."}
- id: ratification-plan-note
  file: docs/contracts/candidate-decision-ratification.yaml
  before: |2
          contradiction with the drafted text, resolve it before presenting. Numbering-race note:
          decision numbers are not reserved at draft time. Re-check the current max ## Decision NNN:
          header in docs/DECISIONS.md at /implement execution time -- a concurrent PR may have
          claimed the drafted number. The referential guard (validate_candidate_decision_ratification)
          catches any resulting header mismatch, so shifting to the next free number at execution
          time is safe.
  after: |2
          contradiction with the drafted text, resolve it before presenting. Numbering: no number is
          assigned at planning; the drafted entry carries the number placeholder and is numbered per
          docs/contracts/decision-entry.yaml metadata_envelope.number_assignment.
- id: ratification-implement-note
  file: docs/contracts/candidate-decision-ratification.yaml
  before: |2
          assumed or inferred yes. (3) Author the DECISIONS.md entry using the confirmed text. Before
          assigning the number, re-check the current max ## Decision NNN: header (numbering-race
          note: a concurrent PR may have claimed the drafted number since /plan ran -- shift to the
          next free number if so, and update the ratified_as/filed_via targets in the same edit). (4)
  after: |2
          assumed or inferred yes. (3) Author the DECISIONS.md entry using the confirmed text and number
          it per docs/contracts/decision-entry.yaml metadata_envelope.number_assignment: after rebasing
          onto origin/main, `bin/venv-python -m scripts.session.decision_fill` replaces the placeholder
          with MAX + 1; update the ratified_as/filed_via targets in the same edit, and a later collision
          is renumbered by scripts.session.rebase_resolve. (4)
- id: ratification-amendment
  file: docs/contracts/candidate-decision-ratification.yaml
  before: |
    amendment_log:
      - date: "2026-09-12"
  after: |
    amendment_log:
      - {date: "{{DATE}}", semantic_break: false, change_class: correction, summary: "PLAN-decision-number-fill (rec-4659): the plan-step and implement-step numbering-race notes point to decision-entry.yaml metadata_envelope.number_assignment, which numbers a drafted entry at implementation with scripts.session.decision_fill."}
      - date: "2026-09-12"
