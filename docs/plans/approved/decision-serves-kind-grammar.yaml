schema_version: 1
slug: decision-serves-kind-grammar
blocks:
- id: kind-contract
  file: docs/contracts/decision-kind.yaml
  before: ''
  after: |
    # The one definition of a Decision's kind (direction | mechanism). decision-entry.yaml's envelope, the
    # operator_decision journal row and any later autonomy ladder point here; none restates it.
    contract:
      id: decision-kind
      class: D
      contract_version: 1
      status: ratified
      ratified_via: "Decision 243 clause 8 / PLAN-decision-serves-kind-grammar"
      description: >-
        The direction/mechanism classification every new Decision declares, and how any agent decides it.
      subject: decision-kind
      evaluator:
        check: validate_decision_entry_conformance

    amendment_log:
      - date: "{{DATE}}"
        semantic_break: false
        change_class: field_add
        summary: "PLAN-decision-serves-kind-grammar: created (Decision 243 clause 8)."

    shape: "{value, justification}, the same shape as decision-entry.yaml's significance."
    values: [direction, mechanism]
    test: >-
      If the entry's own clauses were undone (restoring what it replaced, retired or superseded), would a goal, a human
      gate or a data or user commitment change? Yes: direction. Only the means: mechanism. The justification is one
      sentence answering this and naming the deciding clause.
    own_clauses: >-
      Count what the entry sets, moves, widens, narrows or removes, including an existing rule it writes down as its own
      model and the change an amending entry makes; ignore what it only restates or cites, and later entries' amendments.
    direction_when: >-
      An own clause says what On The Loop or an adopter product is for, whom it serves or what success is; creates,
      moves, widens, narrows or removes a human gate; or sets or moves a commitment on licence, price or paywall,
      tenancy, or what data (the operator's included) is shipped, served or exposed and to whom.
    human_gate: >-
      An act an agent may not take without a human: a human approval or human-confirmed plan, a required citation of a
      human-approved record such as a numbered Decision, or a prohibition that removes the act from agents alone.
      Applying an existing gate to a new population (for example the raise-approved marker to a new class of file)
      widens it; changing what satisfies a gate (which approval or citation counts) moves it.
    mechanism_when: >-
      Every own clause states how something is done (tool, format, check, threshold, data shape, procedure, placement,
      vendor), including how an unchanged gate or commitment is enforced. A check that blocks a defect for every author
      alike, human or agent, is mechanism. An API, module or function boundary is mechanism; the word boundary is not a
      signal.
    tie_break: >-
      Any direction clause makes the entry direction, and an unclear clause reads as direction (fail closed: direction
      labelled mechanism is the harmful error). Put a human gate in its own entry so its mechanism can earn autonomy.
    semantics: >-
      direction is pinned at human approval on every autonomy ladder, forever. mechanism may earn autonomy on a ladder a
      later ratified Decision defines (Decision 235 is the pattern). kind grants and gates nothing until then. north_star
      is not a decision kind (north stars live in docs/contracts/north-star.yaml, Decision 243 clause 2). Unrelated to the
      kind of reversal-conditions stanzas and of work items, and to Decision 197's shipped mechanism.
    consumer_contract: >-
      Read kind.value from scripts.decisions_md.parse_decisions_md or docs/decisions-index.json; never re-derive it from
      prose. An entry without kind (the band before this field) reads as direction.
    enforcement: >-
      validate_decision_entry_conformance fails a new-in-diff entry whose kind is missing, whose value is outside values,
      or whose justification is empty. A mechanism entry listed in a north star's carried_by is a WARN; the remedy is to
      drop it from carried_by or supersede the entry, never to edit its envelope (Decision 177).
      scripts.roadmap.plan_obligations applies the same rules to drafts and quotes test when kind is missing.
- id: entry-amendment-row
  file: docs/contracts/decision-entry.yaml
  before: |
    schema_version: 1
  after: |2
      - date: "{{DATE}}"
        semantic_break: false
        change_class: field_add
        summary: "PLAN-decision-serves-kind-grammar (Decision 243 clause 8): required kind (defined in decision-kind.yaml), optional serves, closed_key_set, number_assignment (Decision 217 clause 5) and draft_check."

    schema_version: 1
- id: entry-fields
  file: docs/contracts/decision-entry.yaml
  before: |2
      required_fields: [number, significance]
      optional_fields: [status, decided_date, amends, supersedes]
  after: |2
      required_fields: [number, significance, kind]
      optional_fields: [status, decided_date, amends, supersedes, serves]
      closed_key_set: >-
        A new-in-diff envelope may carry only required_fields and optional_fields keys; any other key fails the entry.
      number_assignment: >-
        Assigned at implementation, never at planning (Decision 217 clause 5: max-plus-one with the re-check, until
        T4.24's per-file split). Approved text writes the entry's number as scripts.roadmap.approved_text's number
        placeholder, in the heading, the envelope number and the entry's citations of itself. The implementer, after
        rebasing onto origin/main, fills it with MAX(decision number across docs/DECISIONS.md and
        docs/DECISIONS_ARCHIVE.md) + 1 in the edit that inserts the entry; a later collision is renumbered at rebase
        (mechanical-conflicts.yaml decision_numbering). A new number not above the baseline maximum, or an unfilled
        placeholder heading, fails.
      draft_check: >-
        bin/venv-python -m scripts.roadmap.plan_obligations --plan <plan> (the plan and its approved-text sidecar) or
        --decision-draft <file> applies these envelope rules to drafted entries before their wording is approved; the
        number placeholder is expected and a concrete number is a WARN. Advisory; validate_decision_entry_conformance is
        the gate.
- id: entry-field-shapes
  file: docs/contracts/decision-entry.yaml
  before: |2
          justification: A non-empty one-line reason the claimed routing row applies.
  after: |2
          justification: A non-empty one-line reason the claimed routing row applies.
        kind: Defined in docs/contracts/decision-kind.yaml (shape, values, test, enforcement); never restated here.
        serves:
          shape: A non-empty, duplicate-free list of north-star ids, each a string matching ^NS\.\d+$, e.g. [NS.6, NS.8].
          resolves_against: docs/contracts/north-star.yaml
          semantics: >-
            The north stars this Decision serves, as declared by its author. Advisory: the decision scout verifies the
            claim and the operator promotes it; it grants nothing. The mission is not nameable. A north star's carried_by
            list is the authoritative reverse link, and serves never edits it.
          enforcement: >-
            A new-in-diff entry fails when an id does not resolve to an entry in resolves_against. A baseline entry whose
            id no longer resolves is a WARN; the remedy is to keep the id in resolves_against as retired, because
            envelopes are append-only (Decision 177).
          flips_to_hard_fail_when: A ratified Decision makes serves load-bearing for an autonomy or promotion gate.
- id: obligations-description
  file: docs/contracts/plan-obligations.yaml
  before: |
    repo state (rec-4383, rec-4751, rec-4752, rec-4754).
      subject: plan-obligations
  after: |
    repo state (rec-4383, rec-4751, rec-4752, rec-4754).
        Its advisory CLI also reports a decision_drafts section: drafted "## Decision" entries checked
        against the envelope rules decision-entry.yaml and decision-kind.yaml own (report-only; never
        part of this check's verdict).
      subject: plan-obligations
- id: obligations-amendment-row
  file: docs/contracts/plan-obligations.yaml
  before: |
    contract_version stays 1.
    registration_surfaces:
  after: |
    contract_version stays 1.
      - date: "{{DATE}}"
        semantic_break: false
        change_class: governance_note_add
        summary: >-
          Its advisory CLI also reports a decision_drafts section: drafted "## Decision" entries checked
          against the envelope rules decision-entry.yaml and decision-kind.yaml own (report-only; never
          part of this check's verdict).
    registration_surfaces:
- id: planning-envelope-test
  file: .claude/skills/planning/SKILL.md
  before: |
    1. **Envelope marker cited.** The drafted entry's fenced ```yaml metadata envelope carries a
       `significance` field naming one of the routing keys plus a non-empty justification
       (`decision-entry.yaml`'s `metadata_envelope.required_fields`, Decision 167 clause 2) -- a
       Significance claim made only in narrative prose, with no envelope field, fails this test.
  after: |
    1. **Envelope fields cited.** The drafted entry's fenced ```yaml envelope carries `significance` (a routing
       key) and `kind` (answering `docs/contracts/decision-kind.yaml`'s `test`), each with a non-empty justification
       (`decision-entry.yaml`'s `metadata_envelope.required_fields`, Decision 167 clause 2); a narrative-only claim
       fails this test.
- id: critique-12p-intro
  file: .claude/skills/plan-critique/SKILL.md
  before: |
    No other check here asks whether a drafted numbered Decision's claimed significance row matches its body.
  after: |
    No other check here asks whether a drafted numbered Decision's claimed significance row and kind match its body.
- id: critique-12p-verdict
  file: .claude/skills/plan-critique/SKILL.md
  before: |
    for the claimed row. A claimed-row/body mismatch is REVISE-worthy on its own -- this is a mandatory category-consistency gate, not a discretionary surface-and-defer check the human can wave through.
  after: |
    for the claimed row, and the own clause deciding `decision-kind.yaml`'s `test` for `kind.value`. Either mismatch is REVISE-worthy on its own -- a mandatory gate, never surface-and-defer.
