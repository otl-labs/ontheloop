schema_version: 1
slug: evaluator-coverage-live-surfaces
tldr: >-
  A skill or doc that evaluates a contract must be a surface an agent loads (a layer file, a file the coordinator
  loads, or one contract away from one; never a retired skill) and must hold the quoted instruction that sends an agent
  there; a check may list the keys it asserts. Both are rows of one evaluator_coverage table in contract-population.yaml,
  and the drift gate prints each contract's keys asserted, instructed and neither. deploy-paths gains a pointer row for
  the restore rehearsal.
blocks:
- id: population-amendment
  file: docs/contracts/contract-population.yaml
  before: |
    # Top-level, sibling of `contract:` -- same convention as a ritual document's amendment_log.
    amendment_log:
  after: |
    # Top-level, sibling of `contract:` -- same convention as a ritual document's amendment_log.
    amendment_log:
      - {date: "{{DATE}}", semantic_break: true, change_class: field_add, summary: "PLAN-evaluator-coverage-live-surfaces (rec-5263, CFR-08; operator ruling 2026-11-17 on chained surfaces): evaluator_kinds.agent_surface requires a live surface and triggers; evaluator_kinds.check admits asserted keys; evaluator_coverage holds both, one row per contract; the gate prints keys asserted, instructed and neither per Class D contract."}
- id: population-check-asserts
  file: docs/contracts/contract-population.yaml
  before: |
    "...iam-simulate-fixture.yaml") must never certify as a reading.
      agent_surface: >-
  after: |
    "...iam-simulate-fixture.yaml") must never certify as a reading.
        A check contract's evaluator_coverage row may list `asserts: [<key>, ...]`, the body keys the check asserts (a
        body key is a top-level key other than contract, amendment_log, version, contract_version, status, ratified_at
        and ratified_via). Each must be a body key of the contract and occur as an exact string literal, in executable
        context, in the module or a one-hop scripts/ import the basename rule reads. The gate prints, per Class D
        contract, the body keys asserted, instructed and neither; the print measures coverage and fails nothing by
        itself (rec-5263, a first slice of T2.54 c1).
      agent_surface: >-
- id: population-agent-surface
  file: docs/contracts/contract-population.yaml
  before: |
    `{agent_surface: <repo-relative-path>}`. Resolves iff the named path exists and its text
        contains the contract's basename -- the non-Python analogue of the check AST scan. Widened
        (migration-step-3-grandfathering) beyond skills/slash-commands to admit Layer-1 ambient
        instruction files (AGENTS.md, CLAUDE.md) as legitimate agent_surface targets -- an ambient
        rule an agent reads on every turn is at least as strong evidence of a genuine evaluator as a
        skill loaded on demand.
  after: |
    `{agent_surface: <repo-relative-path>}`. Resolves iff the named path is live, its text
        contains the contract's basename, and the contract's evaluator_coverage row lists triggers,
        each of which occurs in that text (whitespace-normalised) and itself contains the basename. A
        trigger is the instruction that sends an agent to the contract, not a mention: a
        `<basename>#<key>` anchor in it marks that top-level key instructed, and a bare basename marks
        every body key instructed. Live: the path matches a layers[].content_locations or
        consumers[].loads glob in docs/contracts/instruction-architecture.yaml and is not in its
        retired_surfaces.paths (depth 0); or it is a docs/contracts Class D contract whose own
        agent_surface is live at depth 0 (depth 1; operator ruling 2026-11-17). A deeper chain, a
        self-pointer or a loop is not live, and the gate names the chain. A skill or slash command
        whose frontmatter description starts "Being retired" must be in retired_surfaces.paths, or the
        gate fails. Layer-1 ambient files (AGENTS.md, CLAUDE.md) stay legitimate targets
        (migration-step-3-grandfathering): an ambient rule an agent reads on every turn is at least
        as strong evidence of a genuine evaluator as a skill loaded on demand.
- id: population-coverage-table
  file: docs/contracts/contract-population.yaml
  before: |
    grandfather_only_forms:
      status_active: >-
  after: |
    # One row per Class D contract basename (rec-5263). An agent_surface contract's row lists triggers (required);
    # a check contract's row may list asserts. A row whose contract is missing, is not Class D, or has the other
    # evaluator kind fails the gate, as does an agent_surface contract with no row.
    evaluator_coverage:
      _joins.yaml: {triggers: ["consulting `docs/contracts/_joins.yaml` for the join/correlation-key obligation"]}
      candidate-decision-ratification.yaml: {triggers: ["MANDATORY read-trigger: read `docs/contracts/candidate-decision-ratification.yaml#lane_steps.implement.execute` in full before executing"]}
      contract-population.yaml: {asserts: [declared_subtrees]}
      coordinator-harness-claude-projects.yaml: {triggers: ["coordinator-harness-claude-projects.yaml), or in its standing instructions and memory until it has one"]}
      coordinator.yaml: {triggers: ["Claude projects harness profile for docs/contracts/coordinator.yaml: the contract's terms in one hosted harness"]}
      deploy-paths.yaml: {triggers: ["red/drift = the heal verb `docs/contracts/deploy-paths.yaml`'s reconcile row selects", "check `docs/contracts/deploy-paths.yaml` first"]}
      ducklake-partition-remediation.yaml: {triggers: ["procedure_ref: \"docs/contracts/ducklake-partition-remediation.yaml -- the full ADMIN-container procedure lives there"]}
      overseer-dispatch.yaml: {triggers: ["Class each design fork: consistency-only is decided-with-notice, else ask in the pinned shape -- `docs/contracts/overseer-dispatch.yaml#autonomy_tiers.plan_fork_classification`", "schema: `docs/contracts/overseer-dispatch.yaml#gate_request_trampoline`"]}
      package-registry-reservation.yaml: {triggers: ["see docs/contracts/package-registry-reservation.yaml"]}
      project-alignment.yaml: {triggers: ["the process is defined in `docs/contracts/project-alignment.yaml`"]}
      red-main-recovery.yaml: {triggers: ["(Decision 226; rules in `docs/contracts/red-main-recovery.yaml`)"]}
      restore-rehearsal.yaml: {triggers: ["procedure_ref: \"docs/contracts/restore-rehearsal.yaml -- the sitting, its boundary and its evidence live there"]}
      visual-grammar.yaml: {triggers: ["whose grammar `docs/contracts/visual-grammar.yaml` owns"]}

    grandfather_only_forms:
      status_active: >-
- id: architecture-coordinator-loads
  file: docs/contracts/instruction-architecture.yaml
  before: |
    repo_less_coordinator:
        consumes_layers: []
  after: |
    repo_less_coordinator:
        consumes_layers: []
        loads:
          - docs/contracts/coordinator.yaml
          - docs/contracts/coordinator-harness-*.yaml
- id: architecture-retired-surfaces
  file: docs/contracts/instruction-architecture.yaml
  before: |
    behavioural_invariant_sources:
      - ".claude/skills/*/SKILL.md"
  after: |
    retired_surfaces:
      note: >-
        Layer files no workflow loads. An agent_surface evaluator naming one does not resolve
        (contract-population.yaml evaluator_kinds.agent_surface).
      paths:
        - .claude/skills/overseer/SKILL.md   # Decision 247
        - .claude/commands/overseer.md       # Decision 247

    behavioural_invariant_sources:
      - ".claude/skills/*/SKILL.md"
- id: architecture-amendment
  file: docs/contracts/instruction-architecture.yaml
  before: |
    amendment_log:
      - date: "2026-11-02"
  after: |
    amendment_log:
      - {date: "{{DATE}}", semantic_break: false, change_class: field_add, summary: "PLAN-evaluator-coverage-live-surfaces (rec-5263): retired_surfaces lists the overseer skill and command (Decision 247), and repo_less_coordinator.loads names the two files its shared-store copies carry; contract-population.yaml's agent_surface liveness reads both. No layer changed."}
