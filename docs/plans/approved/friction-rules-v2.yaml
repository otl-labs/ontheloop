schema_version: 1
slug: friction-rules-v2
tldr: 'Friction classifier version 2 (rec-4605, rec-5097): a skip a repo CLI reports becomes its own notice-class label outside the exception total, a reported failure gets its own exception label, a failing call whose own error event is already counted is counted once (with an absorbed count), and orphan tool closes no longer form a repeat run. Contract text in telemetry_sessions.yaml rework_total and exception_total, plus two dated log lines.'
blocks:
- id: rework-semantics
  file: docs/contracts/telemetry_sessions.yaml
  before: |2
        semantics: >-
          A key self-improvement-loop friction signal; no physical column. The facts are process_events at severity error, warning or critical, plus tool_call closes with outcome error or blocked, read after R5 dedupe. rework_total counts runs: at least repeat_threshold consecutive error closes of the
          same tool inside one turn; a same-tool blocked close breaks a run. The rules (signatures, dispositions, labels, classes, repeat_threshold) live in a governed, versioned rules file bundled into the reader's named-read registry as data, owned by 2b (PLAN-telemetry-reader-verbs, #1496); classifier_version is stamped on
          every response and is never a column.
  after: |2
        semantics: >-
          A key self-improvement-loop friction signal; no physical column. The facts are process_events at severity error, warning or critical, plus tool_call closes with outcome error or blocked, read after R5 dedupe. rework_total counts runs: at least repeat_threshold consecutive error closes of the
          same tool inside one turn; a same-tool blocked close breaks a run, a close with no name (an orphan close) joins no run, and an error close absorbed into a process_event fact (see exception_total) still counts toward its run. The rules (signatures, signature prefixes, dispositions, labels, classes, repeat_threshold) live in a governed, versioned rules file bundled into the reader's named-read registry as data, owned by 2b (PLAN-telemetry-reader-verbs, #1496); classifier_version is stamped on
          every response and is never a column.
- id: rework-derivation-and-log
  file: docs/contracts/telemetry_sessions.yaml
  before: |2
        derivation: {timing: read, derived_by: reader_verb:session_friction_rollup, formula: "count of runs of at least repeat_threshold consecutive tool_call closes with outcome error for the same tool (name) inside one turn (parent_observation_id), ordered by event_timestamp then source_ordinal, a same-tool blocked close breaking a run; repeat_threshold comes from the reader's rules file", inputs: [telemetry_observations.session_id, telemetry_observations.observation_type, telemetry_observations.event_kind, telemetry_observations.observation_id, telemetry_observations.name, telemetry_observations.severity, telemetry_observations.outcome, telemetry_observations.parent_observation_id, telemetry_observations.event_timestamp, telemetry_observations.source_ordinal], realized: false}
        amendment_log:
          - {date: "2026-10-16", semantic_break: false, change_class: prose_improvement, summary: "PLAN-reader-verbs-decision-notes follow-up (rec-4324): reader-verb ownership pointer moved from rec-4024 to PLAN-telemetry-reader-verbs (#1496); no change in meaning."}
          - {date: "2026-10-05", semantic_break: true, change_class: governance_note_add, summary: "PLAN-telemetry-lifecycle-friction-amendment (C10, friction-k1 (a), friction-k2 (a)): the facts, the run rule and the input list; the rules live in the reader's governed rules file, not the rec-4032 labels table (later materialised form)."}
  after: |2
        derivation: {timing: read, derived_by: reader_verb:session_friction_rollup, formula: "count of runs of at least repeat_threshold consecutive tool_call closes with outcome error for the same tool (name, never NULL) inside one turn (parent_observation_id), ordered by event_timestamp then source_ordinal, a same-tool blocked close breaking a run and a close with a NULL name joining no run; repeat_threshold comes from the reader's rules file", inputs: [telemetry_observations.session_id, telemetry_observations.observation_type, telemetry_observations.event_kind, telemetry_observations.observation_id, telemetry_observations.name, telemetry_observations.severity, telemetry_observations.outcome, telemetry_observations.parent_observation_id, telemetry_observations.event_timestamp, telemetry_observations.source_ordinal], realized: false}
        amendment_log:
          - {date: "{{DATE}}", semantic_break: true, change_class: governance_note_add, summary: "PLAN-friction-rules-v2 (rec-5097 G2, classifier_version 2): a close with a NULL name (an orphan close) joins no run, an error close absorbed into a process_event fact still counts toward its run, and the rules file gains signature prefixes. Contracts-class relief valve: the two 2026-10-16 PLAN-reader-verbs-decision-notes pointer-move lines (rework_total and state; no change in meaning) are compacted into this line."}
          - {date: "2026-10-05", semantic_break: true, change_class: governance_note_add, summary: "PLAN-telemetry-lifecycle-friction-amendment (C10, friction-k1 (a), friction-k2 (a)): the facts, the run rule and the input list; the rules live in the reader's governed rules file, not the rec-4032 labels table (later materialised form)."}
- id: state-log-compaction
  file: docs/contracts/telemetry_sessions.yaml
  before: |2
          - {date: "2026-10-18", semantic_break: true, change_class: governance_note_add, summary: "PLAN-telemetry-read-side-session-end (Decision 228, amends Decision 199 cl.1): a root session's state is read from its turns (SE-1): the producer close stands only while no turn opened after it, else the latest turn's outcome once idle, abandoned only when stopped mid-turn.", migration_story: "Derived at read; no stored row changes. Sessions without turn outcomes keep the prior rule."}
          - {date: "2026-10-16", semantic_break: false, change_class: prose_improvement, summary: "PLAN-reader-verbs-decision-notes follow-up (rec-4324): reader-verb ownership pointer moved from rec-4024 to PLAN-telemetry-reader-verbs (#1496); no change in meaning."}
          - {date: "2026-10-05", semantic_break: true, change_class: field_add, summary: "PLAN-telemetry-lifecycle-friction-amendment (feedback-loop review C9; W3 rulings reader-k1 (a), reader-k3 (a)): new read-derived state field (no column) with its ordering, close-last tie, governed idle threshold and sub-agent branch."}
  after: |2
          - {date: "2026-10-18", semantic_break: true, change_class: governance_note_add, summary: "PLAN-telemetry-read-side-session-end (Decision 228, amends Decision 199 cl.1): a root session's state is read from its turns (SE-1): the producer close stands only while no turn opened after it, else the latest turn's outcome once idle, abandoned only when stopped mid-turn.", migration_story: "Derived at read; no stored row changes. Sessions without turn outcomes keep the prior rule."}
          - {date: "2026-10-05", semantic_break: true, change_class: field_add, summary: "PLAN-telemetry-lifecycle-friction-amendment (feedback-loop review C9; W3 rulings reader-k1 (a), reader-k3 (a)): new read-derived state field (no column) with its ordering, close-last tie, governed idle threshold and sub-agent branch."}
- id: exception-semantics
  file: docs/contracts/telemetry_sessions.yaml
  before: |2
        semantics: >-
          A key self-improvement-loop friction signal; no physical column. exception_total counts the facts (process_events at severity error, warning or critical, plus tool_call closes with outcome error or blocked) that the reader's rules file labels exception-class. Each fact gets one label (an exact
          signature beats the generic rule), and a blocked tool_call whose own hook block is already a fact is not counted twice. classifier_version is stamped on every response and is never a column.
  after: |2
        semantics: >-
          A key self-improvement-loop friction signal; no physical column. exception_total counts the facts (process_events at severity error, warning or critical, plus tool_call closes with outcome error or blocked) that the reader's rules file labels exception-class; a fact it labels notice-class (a skip a repo CLI reported on a status: line) is counted in label_counts only. Each fact gets one label (an exact
          signature beats the generic rule, and a signature prefix ranks between the two), and a tool_call close with outcome error or blocked whose own child process_event at severity error is already a fact (a hook block, or a gate, pre-commit or status failure the call printed) is not counted twice; the verb reports how many closes it absorbed this way as absorbed_count. classifier_version is stamped on every response and is never a column.
- id: exception-derivation-and-log
  file: docs/contracts/telemetry_sessions.yaml
  before: |2
        derivation: {timing: read, derived_by: reader_verb:session_friction_rollup, formula: "count of facts (process_event points at severity error, warning or critical, and tool_call closes with outcome error or blocked) that the reader's rules file labels exception-class, one label per fact (an exact signature beats the generic rule), a blocked tool_call whose own hook block is already a fact not counted twice", inputs: [telemetry_observations.session_id, telemetry_observations.observation_type, telemetry_observations.event_kind, telemetry_observations.observation_id, telemetry_observations.name, telemetry_observations.severity, telemetry_observations.outcome, telemetry_observations.parent_observation_id, telemetry_observations.event_timestamp, telemetry_observations.source_ordinal], realized: false}
        amendment_log:
          - {date: "2026-10-05", semantic_break: true, change_class: governance_note_add, summary: "PLAN-telemetry-lifecycle-friction-amendment (C10, friction-k2 (a)): one label per fact, no double count of a blocked tool_call already a fact; read from the reader's governed rules file, not the rec-4032 labels table (later materialised form)."}
  after: |2
        derivation: {timing: read, derived_by: reader_verb:session_friction_rollup, formula: "count of facts (process_event points at severity error, warning or critical, and tool_call closes with outcome error or blocked) that the reader's rules file labels exception-class (notice-class facts excluded), one label per fact (an exact signature beats a signature prefix, which beats the generic rule), a tool_call close with outcome error or blocked whose own child process_event at severity error is already a fact not counted twice", inputs: [telemetry_observations.session_id, telemetry_observations.observation_type, telemetry_observations.event_kind, telemetry_observations.observation_id, telemetry_observations.name, telemetry_observations.severity, telemetry_observations.outcome, telemetry_observations.parent_observation_id, telemetry_observations.event_timestamp, telemetry_observations.source_ordinal], realized: false}
        amendment_log:
          - {date: "{{DATE}}", semantic_break: true, change_class: governance_note_add, summary: "PLAN-friction-rules-v2 (rec-4605, rec-5097 G1, classifier_version 2): status: process_events take their own labels by signature prefix (a reported skip is notice-class, outside exception_total; a reported failure is exception-class), the absorb rule widens from a blocked close to any error or blocked close whose own child process_event at error is a fact, and the verb reports absorbed_count."}
          - {date: "2026-10-05", semantic_break: true, change_class: governance_note_add, summary: "PLAN-telemetry-lifecycle-friction-amendment (C10, friction-k2 (a)): one label per fact, no double count of a blocked tool_call already a fact; read from the reader's governed rules file, not the rec-4032 labels table (later materialised form)."}
