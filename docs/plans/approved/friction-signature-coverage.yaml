schema_version: 1
slug: friction-signature-coverage
tldr: 'The telemetry reader gains one read, friction_signature_counts: for up to seven days it lists, per session tree, each friction signature
  (which hook, check, pre-commit hook or tool failed, which rule labelled it, and whether that rule is a catch-all) with fact and session counts,
  so the share of failures the classifier cannot name, and which ones they are, can be read. It reports facts only and no content. The telemetry
  reader contract describes the new read, and its change log says the same merge moves the friction classifier to version 3. Because the new change-log
  rule lets a new entry add no more full entries, the log''s oldest entry (the contract''s first authoring) becomes a one-line entry in the same
  change.'
blocks:
- id: reader-friction-signature-invariant
  file: docs/contracts/ducklake_telemetry_reader.yaml
  before: No row carries content, cost or a single summed token total."
  after: "No row carries content, cost or a single summed token total.\"\n  - \"Friction signature verb (PLAN-friction-signature-coverage; feedback-loop\
    \ wave 2; agent-facing): friction_signature_counts takes day_from and day_to over at most 7 UTC days, reads telemetry_sessions and telemetry_observations\
    \ of real-purpose projects only, and answers one row per tree (the usage verbs' tree), workflow and friction signature. Each row carries the\
    \ tree's root_session_id, harness_session_key, branch, session_started_at and roots_in_tree, the session's workflow, and, for the facts session_friction_rollup's\
    \ rules label after the R4/R5 dedupe and its absorb rule: observation_type, signature (a process_event's name, a tool_call close's tool name,\
    \ or a repeat run's tool name), disposition (the severity or outcome the rule matched), rule_id (run for a repeat run), label, class and generic\
    \ (true when the labelling rule names neither a signature nor a signature prefix), with fact_count, session_count, the rules' classifier_version\
    \ and the tree-level Decision 207 stamps the usage verbs carry (generations, conflicted_grain_keys, derivation_conflicted). The verb never\
    \ sums across trees (Decision 199 cl.1): callers sum rows across trees and windows, and the unmapped share is the caller's division of generic\
    \ process_event facts by all process_event facts. No row carries content.\""
- id: reader-friction-signature-log
  file: docs/contracts/ducklake_telemetry_reader.yaml
  before: 'previous_versions: []'
  after: "  - date: \"{{DATE}}\"\n    semantic_break: false\n    change_class: field_add\n    summary: >-\n      PLAN-friction-signature-coverage\
    \ (feedback-loop wave 2): friction_signature_counts joins model_usage_rollup,\n      tool_use_rollup and session_startup_baseline in the served\
    \ set as an agent-facing seven-day window verb over per-tree\n      friction signature rows, so the friction classifier's unmapped share and\
    \ the signatures behind it are readable.\n    migration_story: >-\n      A new verb, and friction classifier_version 3 in the same merge:\
    \ session_friction_rollup gains exact rules for twenty\n      repo checks, the detect-secrets pre-commit hook and five blocking hooks, and\
    \ its unmapped_count counts every\n      process_event fact a generic rule labelled, hook_fault included. Every row carries its classifier_version,\
    \ so callers never mix the two versions; no\n      existing verb gains or loses a column.\nprevious_versions: []"
- id: reader-log-compact-oldest
  file: docs/contracts/ducklake_telemetry_reader.yaml
  before: "- date: \"2026-10-25\"\n    semantic_break: false\n    change_class: field_add\n    summary: >-\n      PLAN-telemetry-reader-and-smoke-twin\
    \ (Decision 236): first authoring of the telemetry reader contract, with the describe\n      and named_read verbs, the typed terminal answers\
    \ and the audit invariants.\n    migration_story: >-\n      A new function, so no existing verb or response changes. It reads the empty production\
    \ catalog until the flip."
  after: '- {date: "2026-10-25", semantic_break: false, change_class: field_add, summary: "PLAN-telemetry-reader-and-smoke-twin (Decision 236):
    first authoring of the reader contract: describe, named_read, typed answers and audit invariants."}'
