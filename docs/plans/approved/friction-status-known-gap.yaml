schema_version: 1
slug: friction-status-known-gap
tldr: 'Retires a now-false sentence in the telemetry_observations contract (rec-5193): it said status skips and failures read as
  hook_fault and unmapped_block until the reader gained status rules; friction classifier version 2 (PR #2057) added them, so the
  sentence now names reported_skip and reported_failure. The pinned test''s two stale words become the new labels, and one dated
  log line records it and absorbs a meaning-free 2026-10-16 log line so the file stays at its size cap.'
blocks:
- id: name-semantics
  file: docs/contracts/telemetry_observations.yaml
  before: |2
          column. name is required on process_event points. The grammar is write-enforced by dq_intent.pattern_when (Decision 210 cl.1), scoped to process_event rows so tool_call and model_call names stay unconstrained: the source is hook, gate, precommit or status, and a new source ships as a contract amendment plus a writer deploy before any producer emits it (cl.4). The claude_code producer emits gate:<check> and precommit:<hook> only from structured markers in a Bash tool_call's full output (validation markers, pre-commit's own per-hook failure lines), parented to that tool_call, with role gate_event.<n>; never from free text. From parser_version 6 the claude_code producer also emits status:<source>.skipped (severity warning) and status:<source>.failed (severity error) from STATUS v1 lines in the last 200 output lines of a Bash tool_call whose command names a repo CLI (-m scripts. or scripts/), with role gate_event.<n>; done emits nothing, the reason is never stored, and a source over 192 characters is dropped and counted (status_source_too_long). Known gaps, declared here: an echoed or printed whole STATUS line inside such a command's output mints a row; until the reader's friction rules gain a status row (rec-4605) r91 labels a status warning hook_fault and r90 a status error unmapped_block.
  after: |2
          column. name is required on process_event points. The grammar is write-enforced by dq_intent.pattern_when (Decision 210 cl.1), scoped to process_event rows so tool_call and model_call names stay unconstrained: the source is hook, gate, precommit or status, and a new source ships as a contract amendment plus a writer deploy before any producer emits it (cl.4). The claude_code producer emits gate:<check> and precommit:<hook> only from structured markers in a Bash tool_call's full output (validation markers, pre-commit's own per-hook failure lines), parented to that tool_call, with role gate_event.<n>; never from free text. From parser_version 6 the claude_code producer also emits status:<source>.skipped (severity warning) and status:<source>.failed (severity error) from STATUS v1 lines in the last 200 output lines of a Bash tool_call whose command names a repo CLI (-m scripts. or scripts/), with role gate_event.<n>; done emits nothing, the reason is never stored, and a source over 192 characters is dropped and counted (status_source_too_long). Known gap, declared here: an echoed or printed whole STATUS line inside such a command's output mints a row. From classifier_version 2 (rec-4605) the reader's friction rules label a status warning reported_skip (notice class, outside exception_total) and a status error reported_failure (exception class).
