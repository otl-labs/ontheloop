schema_version: 1
slug: gate-consumers-flag-aware
tldr: Three per-persona switches (in_session or actions, default in_session) say where each verdict persona's verdict
  comes from. The merge gate reads them from main only; on actions it requires that persona's GitHub check on the head,
  and refuses an agent merge that switches one back. The coordinator, lifecycle and alignment contracts read the
  switches; ports.yaml records the coupling and a roadmap note defines a code PR.
blocks:
