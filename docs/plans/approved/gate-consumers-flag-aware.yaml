  file: docs/contracts/project-configuration.yaml
  before: 'rows name homes and variables only. A docs/contracts/ports.yaml structural_assumptions row that otl init # resolves by configuration names its setting''s row id here; neither file restates the other.'
  after: |-
    rows name homes and variables only, except that each gates.<persona>.verdict_source row's defaults is the value
    # the merge gate reads from origin/main until T4.24 c16 homes it. A docs/contracts/ports.yaml structural_assumptions
    # row that otl init resolves by configuration names its setting's row id here; neither file restates the other.
