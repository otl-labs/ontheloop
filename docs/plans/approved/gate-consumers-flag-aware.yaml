  file: docs/ROADMAP-PLATFORM.yaml
  before: 'and triggers on every PR changing code; it discharges no T4.2 foundation criterion of its own"'
  after: 'and triggers on every PR changing code; it discharges no T4.2 foundation criterion of its own [Amendment {{DATE}}, PLAN-gate-consumers-flag-aware (T4.32 c5): a PR changing code is every pull request whose diff from its merge base is not confined to docs/plans/ (scripts/ci/push_scope.py confined_to_plans), and the check run is posted on every head of such a PR, since the merge gate requires it there once gates.code_reviewer.verdict_source reads actions]"'
