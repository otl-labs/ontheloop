- id: ports-amendment-log
  file: docs/contracts/ports.yaml
  before: 'amendment_log:'
  after: |-
    amendment_log:
      - {date: "{{DATE}}", semantic_break: false, change_class: field_add, summary: "PLAN-gate-consumers-flag-aware (T4.32 c5, rec-5121, Decision 212 clause 3): coupling_findings gains PC-10 (the merge gate's persona leg trusts only GitHub Actions check runs named persona-verdict/<persona>, so it presumes the verdict_plane github_actions adapter), open for T4.2 c9; semantics.coupling_findings, semantics.structural_assumptions and PC-02 are re-flowed onto one line each, words unchanged, for the line budget.", migration_story: "Prose only; no code or contract consumer reads it."}
- id: ports-pc-10
  file: docs/contracts/ports.yaml
  before: |2
        owning_item: dec-234

    structural_assumptions:
  after: |2
        owning_item: dec-234
      - id: PC-10
        ports: [change_surface, verdict_plane]
        location: .claude/hooks/merge_gate.py
        description: >-
          The merge gate's persona leg (T4.32 c5) accepts a verdict persona's check only as a check run named persona-verdict/<persona> created by the app github-actions on the exact head, so the change_surface github adapter's merge seam presumes the verdict_plane github_actions adapter; a verdict_app check (T4.2 c9) would refuse. The verdict jobs must post that check on every head of the persona's class (a pull request confined to docs/plans/ for decision_scout and plan_critic, every other pull request for code_reviewer), including a head a scout fingerprint covers (T4.32 c4).
        status: open
        owning_item: "T4.2:c9"

    structural_assumptions:
