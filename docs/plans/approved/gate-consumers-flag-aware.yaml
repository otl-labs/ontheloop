- id: co-amendment-log
  file: docs/contracts/coordinator.yaml
  before: 'land there in the same batches as [contract] ones."}'
  after: |-
    land there in the same batches as [contract] ones."}
      - {date: "{{DATE}}", semantic_break: false, change_class: field_add, summary: "PLAN-gate-consumers-flag-aware (T4.32 c5, rec-5121): lifecycle gains verdict_source, the per-persona switch of docs/contracts/project-configuration.yaml that critique PROCEED, the scout verdict and code review PROCEED read; roles.structure, the critique, plan_pr and build steps and two standing_authorisation items point at it. Nothing changes while every switch reads in_session."}
- id: co-verdict-source
  file: docs/contracts/coordinator.yaml
  before: 'closes finished workers."}'
  after: |-
    closes finished workers."}
      verdict_source: >-
        Where a verdict persona's verdict comes from, set per persona by the gates.<persona>.verdict_source row of
        docs/contracts/project-configuration.yaml on main: in_session (the worker's verdict subagent) or actions (that
        persona's GitHub check run, concluded success on the head being merged). In this file "critique PROCEED", the
        scout verdict and "code review PROCEED" mean the verdict of the lane the row selects. The merge gate refuses a
        merge the actions lane has not passed, an in-session verdict never stands in for it, and a change returning a
        row from actions to in_session is merged by the operator (Decision {{N}} cl.4-5).
- id: co-structure
  file: docs/contracts/coordinator.yaml
  before: 'consults as subagents. Set model and effort at worker start.'
  after: |-
    consults as subagents; a verdict gate whose verdict_source is actions is read from its check run, never run as a subagent. Set model and effort at worker start.
- id: co-critique
  file: docs/contracts/coordinator.yaml
  before: 'an open escalation stops the loop.", see:'
  after: |-
    an open escalation stops the loop. When plan_critic's verdict_source is actions, each round is the plan-critique check run on the pushed head of the ready plan PR.", see:
- id: co-plan-pr
  file: docs/contracts/coordinator.yaml
  before: 'rule: "Before opening the plan PR run validate_plan_documents as CI does; merge on critique PROCEED'
  after: |-
    rule: "Before opening the plan PR run validate_plan_documents as CI does; when decision_scout's or plan_critic's verdict_source is actions, open it as a draft before that persona's step; merge on critique PROCEED
- id: co-build
  file: docs/contracts/coordinator.yaml
  before: 'builds, runs code review, drives CI green'
  after: 'builds, gets the code review verdict from the lane its verdict_source selects (actions: the code_reviewer check run on the pushed PR head), drives CI green'
- id: co-sa-plan
  file: docs/contracts/coordinator.yaml
  before: 'Merge a plan PR on critique PROCEED + green CI.'
  after: 'Merge a plan PR on critique PROCEED (lifecycle.verdict_source) + green CI.'
- id: co-sa-build
  file: docs/contracts/coordinator.yaml
  before: 'Merge a build PR on code review PROCEED + green CI, including'
  after: 'Merge a build PR on code review PROCEED (lifecycle.verdict_source) + green CI, including'
- id: til-amendment-log
  file: docs/contracts/tier-item-lifecycle.yaml
  before: 'amendment_log:'
  after: |-
    amendment_log:
      - date: "{{DATE}}"
        semantic_break: false
        change_class: field_add
        summary: >-
          PLAN-gate-consumers-flag-aware (T4.32 c5, rec-5121): parallel_with_code_review_state_machine steps (1) and (4)
          read gates.code_reviewer.verdict_source; on actions the verdict is the code-review check run on the pushed
          head. Nothing changes while the switch reads in_session.
- id: til-step-1
  file: docs/contracts/tier-item-lifecycle.yaml
  before: "(1) Dispatch the code-review subagent (the implement skill's Code Review Protocol)."
  after: >-
    (1) Get the code-review verdict from the lane gates.code_reviewer.verdict_source selects
    (docs/contracts/project-configuration.yaml on origin/main): in_session -- dispatch the code-review subagent (the
    implement skill's Code Review Protocol); actions -- push the head and wait for the wake of its code-review check
    run.
- id: til-step-4
  file: docs/contracts/tier-item-lifecycle.yaml
  before: 'REVISE iff any Critical or High finding, else PROCEED.'
  after: >-
    REVISE iff any Critical or High finding, else PROCEED. On the actions lane the verdict is that check run's
    conclusion on the pushed head: success is PROCEED, any other completed conclusion is REVISE, and no readable check
    run is no verdict (step 5); the bookkeeping commit is a new head, so the merge waits for its own check run.
