    amendment_log:
  after: |
    differential admits it. The assertion was never repointed (Decision 181).

    STANDING (Decision {{N}}, {{DATE}}): every live record is a standing regression guard.
    validate_graduated_rerun (full tier) re-runs each record that is not a plain pytest call and statically
    resolves each pinned test id; the full tier's test suite re-runs the tests themselves. The one exception is
    config/agent/verification_registry/known_red.yaml, a mapping with schema_version 1 and an entries list of
    {check_id, owner_rec, entered_at}: a listed record may be red; a listed record that passes, a listed id that
    is not a live record, or a duplicate id fails the run. validate_known_red_shrinks (fast and full tiers)
    fails a change whose list holds an id the base list does not, so the list only shrinks; it carries no
    count and is no index of entries/. A record that turns red leaves by a fix to the file it guards, a
    claim-preserving repair, or retirement to entries/deprecated/, never by joining the list.
    amendment_log:
      - {date: "{{DATE}}", semantic_break: true, change_class: governance_note_add, summary: "PLAN-graduated-records-standing-rerun (rec-4831, Decision {{N}}): records become standing guards re-run by the full tier, with the shrink-only known_red.yaml exception list. contract_version 6 -> 7."}
