schema_version: 1
slug: graduation-rows-on-main
tldr: "The graduation check accepts a plan's registry row that an earlier PR of the same plan already put on main (unless
  known_red.yaml lists it), so multi-PR plans and late closures can be declared; the registry contract's check_id
  semantics and a dated note on Decision 132 say so."
blocks:
- id: contract-check-id-semantics
  file: docs/contracts/verification-registry.yaml
  before: |
    declared-graduate step to its registry row on the (plan_slug, check_id) pair below, and
    fails the PR when no row with that exact pair was newly added in the diff.
  after: |
    declared-graduate step to its registry row on the (plan_slug, check_id) pair below, and
    fails the PR when no row with that exact pair is in the registry at the PR head, whether
    the diff adds it or an earlier PR of the same plan did; a row already on main that
    known_red.yaml lists does not count.
- id: contract-version
  file: docs/contracts/verification-registry.yaml
  before: |
    contract_version: 9
  after: |
    contract_version: 10
- id: contract-amendment-row
  file: docs/contracts/verification-registry.yaml
  before: |
    amendment_log:
      - {date: "2026-11-04", semantic_break: false, change_class: governance_note_add, summary: "PLAN-retire-ci-only-red-records (rec-4888, Decision 244 cl.5): governance note recording the retirement of data-pipeline-excludes-control-module and push-context-session-branch-guard into entries/deprecated/, and the flow-style compaction of the 2026-10-15 and 2026-10-11 rows, words unchanged, under the Decision 166 limit. No field schema change."}
  after: |
    amendment_log:
      - {date: "{{DATE}}", semantic_break: true, change_class: governance_note_add, summary: "PLAN-graduation-rows-on-main (rec-2837, Decision 132 amendment): check_id semantics -- the implement-PR leg accepts a (plan_slug, check_id) row an earlier PR of the same plan put on main, unless known_red.yaml lists it. contract_version 9 -> 10."}
      - {date: "2026-11-04", semantic_break: false, change_class: governance_note_add, summary: "PLAN-retire-ci-only-red-records (rec-4888, Decision 244 cl.5): governance note recording the retirement of data-pipeline-excludes-control-module and push-context-session-branch-guard into entries/deprecated/, and the flow-style compaction of the 2026-10-15 and 2026-10-11 rows, words unchanged, under the Decision 166 limit. No field schema change."}
- id: decision-132-note
  file: docs/DECISIONS.md
  before: |
    disposition-presence obligation and the differential admission gate are unchanged; only the implement-PR leg's resolution signal moves from commit-message grammar to diff-carried plan content.]
  after: |
    disposition-presence obligation and the differential admission gate are unchanged; only the implement-PR leg's resolution signal moves from commit-message grammar to diff-carried plan content.]

    [Amendment {{DATE}}: clause 2's implement-PR leg accepts a matching registry row that is in the registry at the PR head, whether the diff adds it or an earlier PR of the same plan did (a plan built over several PRs, or closed late under git-ops.yaml LATE CLOSURE), instead of new-in-diff rows only. The (plan_slug, check_id) join is unchanged, a row already on main that known_red.yaml lists does not count, and the differential admission gate is unchanged, so every such row passed its own PR's differential (PLAN-graduation-rows-on-main, rec-2837).]
