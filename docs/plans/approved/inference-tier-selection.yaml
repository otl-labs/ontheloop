      - id: SA-13
        assumption: >-
          The inference tier resolver in scripts/llm assumes this repository's two contract paths and their shapes:
          docs/contracts/inference-provider.yaml holds the tier rows, model_id_formats.litellm_tier_models (provider,
          models and default_model per tier) and model_id_formats.litellm_persona_selection, and
          docs/contracts/project-configuration.yaml holds one ports.run_persona.litellm.api_key.<role> row per committed
          tier role, whose variable names the environment variable that carries the key. A repository without these
          files resolves no selection, and the resolver fails loudly rather than guessing. Until ontheloop/platform.yaml
          exists (Decision 224 clause 7) the resolver reads these rows from this repository; T4.24 c16 moves them.
        location: scripts/llm
        status: open
        owning_item: "T4.24:c9"
