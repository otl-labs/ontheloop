schema_version: 1
slug: inference-tier-selection
tldr: 'Names the models and settings the verdict personas run with, in the one contract that holds them: DeepSeek''s deepseek-flash alias (no version pin) as primary and Claude Opus 5.5 as the fallback, each role''s default model, and per persona thinking on and effort high in both roles. States how the fallback''s monthly free credit is checked at start-up (a hard cap: one small billable call must succeed; a spent credit pauses the runs that need the fallback). Splits the API-key setting into one row per role, each naming its SSM parameter, records the resolver''s repository-layout assumption, refreshes stale tier and IAM text plus one test fixture''s row id, and compacts the six oldest amendment-log rows of the provider contract to one line each to stay under the contracts size cap.'
blocks:
- id: s01-ip-1
  file: docs/contracts/inference-provider.yaml
  before: |
    amendment_log:
      - {date: "2026-11-02",
  after: |
    amendment_log:
      - {date: "{{DATE}}", semantic_break: true, change_class: field_add, summary: "PLAN-inference-tier-selection (T4.32 c1, Decision 173 clause 2; operator rulings 2026-11-09 and 2026-11-11): litellm_tier_models rows gain default_model and name current ids (tier 1 deepseek/deepseek-flash, tier 2 anthropic/claude-opus-5-5); tier 2's notes state the remaining-allowance assertion for a hard-capped monthly credit; model_id_formats gains litellm_persona_selection (thinking and effort per persona and role, never a model id); stale tier state and iam_requirements text refreshed. Decision 173 clause 2(c) does not fire: neither role's vendor or billing shape changes. One premise does change: tier 2 now draws on the organisation's API credit, which is separate from the subscription allowance claude -p draws on, so the allowance contention Decisions 116 and 164 weigh no longer applies to it; no dated annotation is owed under clause 2(c). Tier 2's remaining-allowance threshold becomes any credit above zero, replacing CD.28's above 10%. The six oldest rows are compacted to one line each to stay under the contracts size cap (full text in git history)."}
      - {date: "2026-11-02",
