- id: s04-ip-4
  file: docs/contracts/inference-provider.yaml
  before: |2
        tier_1:
          provider: DeepSeek-direct   # CURRENT SELECTION for the primary role (Decision 173)
          models: ["deepseek/deepseek-chat", "deepseek/deepseek-reasoner"]
          notes: >-
            Aliases remap to deepseek-v4-flash post-2026-07-24 per upstream deprecation; native
            context caching is hash-based and automatic. Selection under Decision 173 clause 2 --
            changing it is a contract edit, not a Decision amendment.
        tier_2:
          provider: Anthropic-direct  # CURRENT SELECTION for the warm-fetched fallback role
          models: ["Anthropic-direct Claude models via LiteLLM"]
          notes: >-
            Funded by a fixed non-rollover allowance credit; boot validation asserts REMAINING
            ALLOWANCE per Decision 173 clause 4 -- CD.28's ">10% pool" figure is that rule's
            fixed-allowance instance.
  after: |2
        tier_1:
          provider: DeepSeek-direct   # CURRENT SELECTION for the primary role (Decision 173)
          models: ["deepseek/deepseek-flash"]
          default_model: deepseek/deepseek-flash
          notes: >-
            deepseek-flash is DeepSeek's alias for its current flash release, used with no version pin
            (operator ruling 2026-11-09). PLAN-llm-client-litellm-transport is to record, per call,
            the model asked for and the model DeepSeek reports serving it, so a release change under
            the alias will show per call. It
            replaces the deepseek-chat and deepseek-reasoner ids, which DeepSeek's API reference no
            longer names (read 2026-11-11). The alias serves verdict runs only: a Decision 221
            experiment arm or a Decision 231 comparison run needs a pinned model id first. Native
            context caching is hash-based and automatic.
            Selection under Decision 173 clause 2 -- changing it is a contract edit, not a Decision
            amendment.
        tier_2:
          provider: Anthropic-direct  # CURRENT SELECTION for the warm-fetched fallback role
          models: ["anthropic/claude-opus-5-5"]
          default_model: anthropic/claude-opus-5-5
          notes: >-
            Funded by the monthly free API credit of the Anthropic organisation that holds the key
            (operator, 2026-11-11); unspent credit does not roll over, so the billing shape is
            fixed_non_rollover_allowance. The credit is a hard cap: the organisation holds no payment
            method or auto-reload, so spend cannot pass it (operator-stated; no read proves it). No
            Anthropic API reports the remaining credit, so the remaining-allowance assertion
            (Decision 173 clause 4) takes this form: one minimal billable completion on
            default_model succeeds. A refusal that says the credit is spent means the allowance is
            used up, the role is unavailable and the runs that need it pause; any other failure is
            not asserted and never passes. Only runs that need this role pause; a run the primary
            serves does not. The threshold is any credit above zero: the hard cap replaces CD.28's
            ">10% pool" figure, which needs a live balance, and Anthropic's usage and cost reports
            give spend, not the credit left. Utilization for Decision 173's fixed-allowance-saturation
            reversal condition is to be measured from the per-call token counts
            PLAN-llm-client-litellm-transport records, against the monthly credit. claude-opus-5-5 is an exact id (Anthropic offers no
            family alias); moving to a newer model is a reviewed version bump (rec-5069), never
            automatic.
- id: s05-ip-5
  file: docs/contracts/inference-provider.yaml
  before: |2
      litellm_local_servers:  # Decision 234 cl.4
  after: |2
      litellm_persona_selection:  # T4.32 c1 -- settings per verdict persona and role; never a model id
        vocabulary:
          thinking: [enabled, disabled]
          effort: [low, high, max]
        note: >-
          Each verdict persona names the settings it runs with in each role. The model is that role's
          litellm_tier_models default_model, so this block never repeats a model id (Decision 173
          clause 2; one home per value). effort holds the three levels both current providers accept
          as they are; the transport passes the level in each provider's own request field, because
          LiteLLM's DeepSeek adapter drops it. Operator rulings 2026-11-11: thinking enabled and effort
          high for every persona in both roles. The dual-run agreement count restarts on the rules
          T4.28 c5 and T4.29 and T4.30 c4 state (a change to the persona's definition hash or to the
          served model string). A thinking or effort change is not covered by the definition hash
          (rec-4433); rec-5072 owns the reset rule for it.
        personas:
          decision_scout:
            primary: {thinking: enabled, effort: high}
            warm_fetched_escape_hatch: {thinking: enabled, effort: high}
          plan_critic:
            primary: {thinking: enabled, effort: high}
            warm_fetched_escape_hatch: {thinking: enabled, effort: high}
          code_reviewer:
            primary: {thinking: enabled, effort: high}
            warm_fetched_escape_hatch: {thinking: enabled, effort: high}
      litellm_local_servers:  # Decision 234 cl.4
- id: s06-ip-6
  file: docs/contracts/inference-provider.yaml
  before: |2
      summary: >-
        No inference-provider IAM grants are required: the operative executor transport (Gemini
        CLI) and the committed CD.28 tiers (DeepSeek-direct, Anthropic-direct via LiteLLM)
        authenticate with API keys (Secrets Manager / local credential files), not AWS IAM.
  after: |2
      summary: >-
        No inference-provider IAM grants are required to call a provider: the operative executor
        transport (Gemini CLI) and the committed CD.28 tiers (DeepSeek-direct, Anthropic-direct via
        LiteLLM) authenticate with API keys, not AWS IAM. In this repository each tier's key is an SSM
        SecureString parameter under /secret/ (Decision 237); reading it is a grant of the reader's own
        role, never an inference grant. Each parameter's name lives only in its role's
        ports.run_persona.litellm.api_key row of docs/contracts/project-configuration.yaml.
