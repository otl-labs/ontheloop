schema_version: 1
slug: last-green-batched-full-tier-decision
tldr: 'Records rec-4874''s design as one Decision: the full tier runs after merge on batches of main instead of once per push, a red batch is narrowed to its culprit commit by a deterministic job, which may open (never merge) a revert PR outside terraform and deploy paths, and code deploys take the newest commit a passing run covers, the last-green ref. A red pauses deploys but never blocks a merge; past the 4 h repair target an alarm replaces the halt on new plans. Eleven amended Decisions get dated notes (245 and 249 record their reversal conditions firing), the SIT Decision''s promotion sentence is read as a necessary condition, and the taxonomy reserves the new term. Nothing is built: five child recs carry build plans 2-6.'
