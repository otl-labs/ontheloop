schema_version: 1
slug: litellm-call-record
tldr: >-
  inference-provider.yaml gains usage_mapping: how the four token classes of a LiteLLM call are read from the
  provider's own usage fields, one row per LiteLLM prefix (deepseek, anthropic, default), at LiteLLM 1.106.2 with
  golden vectors. Missing usage keeps 0 and is named in usage_absent; reasoning_tokens is the provider's count or
  NULL; the Anthropic response id LiteLLM replaces is not recorded. Three notes are re-joined onto one line each to
  stay under the size cap; their words are unchanged.
blocks:
- id: u01-amendment-log
  file: docs/contracts/inference-provider.yaml
  before: |-
    amendment_log:
  after: |-
    amendment_log:
      - {date: "{{DATE}}", semantic_break: false, change_class: field_add, summary: "PLAN-litellm-call-record (rec-4028 plan 3a, T4.32 c1; Decisions 173 and 199): usage_mapping declares how the four model_call token classes, the cache-write split and reasoning_tokens are read from one LiteLLM response's usage, per LiteLLM prefix, with the missing-usage rule and whether the response id is the provider's; src/turn_capture/litellm_usage.py mirrors it and tests/fixtures/litellm_usage/vectors.json holds its golden vectors. The top-level note, projects_to's model_routing note and tier_model.note are re-joined onto one line each (words unchanged) to stay under the contracts size cap."}
- id: u02-usage-mapping
  file: docs/contracts/inference-provider.yaml
  before: |-
    iam_requirements:
      summary: >-
  after: |-
    usage_mapping:  # rec-4028 plan 3a -- the model_call token classes of one LiteLLM response, per LiteLLM prefix (Decision 199)
      source: "Read from the LiteLLM Usage object's model_dump at litellm_version 1.106.2, which keeps the provider's own usage keys beside LiteLLM's normalised ones. The provider's fields are normative; LiteLLM's prompt_tokens, which includes cached tokens, is read only where the provider sends no uncached count of its own. The one implementation is src/turn_capture/litellm_usage.py USAGE_TABLE, which mirrors these rows because that package is stdlib-only and cannot read this file; a test holds the two equal and this litellm_version equal to the litellm pin in requirements-dev.txt, so a LiteLLM bump fails until the golden vectors in tests/fixtures/litellm_usage/vectors.json are re-checked. Each vector holds a provider wire body, its LiteLLM dump at this version and the expected columns, and both map to the same columns. A row is chosen by the model id's LiteLLM prefix; a prefix with no row uses default."
      missing_usage: "A response with no usage block, or a key its row guarantees missing from it, keeps 0 in each token class it could not fill and names those classes in usage_absent; a structural 0 (a class the provider never bills) is a fact and is never named there. reasoning_tokens is the provider's own count or NULL, never LiteLLM's local estimate. cache_creation_1h_tokens and cache_creation_5m_tokens are NULL when the provider sends no split. response_id provider means the response id is the provider's own; not_recorded means LiteLLM replaces or may replace it, so the call record carries none."
      rows:
        deepseek: {tokens_input: prompt_cache_miss_tokens, tokens_cache_read: prompt_cache_hit_tokens, tokens_cache_creation: 0, tokens_output: completion_tokens, cache_creation_split: none, reasoning_tokens: completion_tokens_details.reasoning_tokens, guaranteed: [prompt_cache_miss_tokens, prompt_cache_hit_tokens, completion_tokens], response_id: provider}
        anthropic: {tokens_input: prompt_tokens - cache_read_input_tokens - cache_creation_input_tokens, tokens_cache_read: cache_read_input_tokens, tokens_cache_creation: cache_creation_input_tokens, tokens_output: completion_tokens, cache_creation_split: prompt_tokens_details.cache_creation_token_details.ephemeral_1h_input_tokens and ephemeral_5m_input_tokens, reasoning_tokens: none, guaranteed: [prompt_tokens, cache_read_input_tokens, cache_creation_input_tokens, completion_tokens], response_id: not_recorded}
        default: {tokens_input: prompt_tokens - prompt_tokens_details.cached_tokens, tokens_cache_read: prompt_tokens_details.cached_tokens, tokens_cache_creation: 0, tokens_output: completion_tokens, cache_creation_split: none, reasoning_tokens: none, guaranteed: [prompt_tokens, completion_tokens], response_id: not_recorded}

    iam_requirements:
      summary: >-
