schema_version: 1
slug: litellm-claude-code-scoping
tldr: >-
  The data-modeling standard's arrival rule for telemetry_sessions says plainly that a litellm root (a verdict
  persona's own run) is outside its denominator: no Claude-Session trailer can name one, and persona-run arrival stays
  with telemetry_agents' residual expectation (rec-4951). One terse dated log entry records it (Decision 275); no
  rule, check or join key changes.
blocks:
