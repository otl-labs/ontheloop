  file: docs/contracts/telemetry-event-envelope.yaml
  before: the host-run facts of the GitHub Actions job that ran it (the host-run sidecar schema of src/turn_capture/host_run.py)
  after: the host-run facts of the host that ran it (src/turn_capture/host_run.py; a local host from parser_version 2, rec-5437)
- id: env-ll1
  file: docs/contracts/telemetry-event-envelope.yaml
