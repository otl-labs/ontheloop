schema_version: 1
slug: litellm-local-host-root
tldr: 'Words for rec-5437. A persona run on your own machine now gets a session name under the local host prefix: the host
  makes one fresh run id per run, from litellm parser version 2. When one host runs inside another, the outer host''s record
  names the run and the inner host makes none. The litellm line no longer reads as GitHub-only, and Claude Code still reads
  only GitHub records. PC-13 now covers only Fargate. The host_run_ref field and ports.yaml log the change; two old log rows
  are shortened to keep size headroom.'
blocks:
