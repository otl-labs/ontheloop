schema_version: 1
slug: litellm-producer-envelope
tldr: >-
  The telemetry envelope declares the litellm producer before it is built: a run_persona run is its own root session,
  pinned from the run's recorded start time; its session is litellm:<host run ref> with one ordinal per run in the job;
  calls without a provider id get a turn-and-position ref; a partial run file maps to open rows and calls only; a
  call cancelled by the time limit keeps a zero-token row marked cancelled; and the Claude Code checks and alarms are
  scoped to that producer, so litellm trees never trip them.
