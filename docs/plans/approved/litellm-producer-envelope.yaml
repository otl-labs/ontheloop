- id: e03-litellm-line
  file: docs/contracts/telemetry-event-envelope.yaml
  before: |-
    DQ intents (owner rec-4063): more than one distinct row per grain key (conflict);
  after: |-
    LITELLM PARSER_VERSION 1 (PLAN-litellm-producer-envelope, rec-4028; built by its producer plan): the litellm producer maps one run_persona run's events file (src/persona_backends/events.py: a header, turn records, an end record) and the host-run facts of the GitHub Actions job that ran it (the host-run sidecar schema of src/turn_capture/host_run.py) to rows, and is the only producer of its tree. LL-1: its root session entity_ref is litellm:<host_run_ref>, the gha grammar with a retry ordinal that counts the job's run_persona invocations from 1, so a re-run attempt or a second persona run in one job is a new session; the top-level run's entity_ref is <session ref>/run. As a new producer's first grammar it is outside R10 (see parser_version). A run with no host-run sidecar (a run_persona run on another persona compute host) DEFERS: this line gives it no root grammar, and declaring one later is an R10 change. LL-2: a model_call whose call record holds the provider's own response id takes the shared '<id>/model_call' ref; a failed attempt, an attempt whose provider id is not recorded (inference-provider.yaml usage_mapping response_id) and a cold-start probe record without one take entity_ref <session ref>/call/<turn>/<n>, n the attempt's 1-based position in its turn record's attempt list (a cancelled call included) or probe for the probe record, and external_ref <entity_ref>/model_call. The open rows are '<session ref>#0/open' and '<session ref>/run#0/open'; the one session close and run close, built from the end record, are '<session ref>/end#0/close' and '<session ref>/end#0/run_close'.
    LL-3: R7 applies without a cursor: no two rows under one grain key, every column a pure function of the two input files, the one telemetry_sessions batch last. A turn record is written once and the events file is replaced whole, so a file with no end record is a prefix of the final one and maps to the open rows and the model_calls with no close; no open row reads a turn record. It emits no turn rows: a litellm root's state reads from its end-record close, and a run with none reads running, then abandoned (Decision 228 cl.1); the turn evidence of Decision 228 cl.3 is absent by design, since a run is complete when its end record is written. A parser_version bump re-emits only the runs whose two input files are still held and retires nothing else. LL-4: losses are declared, never guessed. A turn the run's wall-clock deadline cut short still records every attempt its transport made: each completed attempt as usual, and the call in flight, if any, as one more attempt entry written from the selection it sent (provider, billing_shape, started_at_ms) with outcome cancelled. That call was sent and is presumed billed, but its response is never read: it gets one model_call row at its own position with zero tokens and a declared cancelled loss marker. A deadline that fires with no call in flight (during a retry backoff) adds no entry and no row. A failed attempt (an outage, including a provider answer that LiteLLM raises as an error) and an attempt the transport closed as malformed_output or empty_output each get their row with zero tokens and a declared usage-not-recorded loss marker (rec-5352). A run aborted on transport_exception writes no turn record for that turn, so its calls have no rows; the loss is declared by the error its end record carries into the run close. A cold-start probe answered with no choices leaves no record and no row (rec-5338).
    LL-5: checks written for Claude Code transcripts do not judge a litellm tree. The verification monitor's stored-row silent checks (harness_key_missing, checkout_sha_missing, background_notice_unknown, resume_without_prior_close; their parser_version floor is a claude_code version, R2), the transcript ledger and shape legs and the Decision 250 arrival oracle are scoped to producer claude_code before the first litellm row is written; a litellm tree is held to the producer-agnostic checks (verb re-derivation, orphan counts, dedupe). A litellm root can never be named by telemetry_sessions' Claude-Session trailer arrival denominator; persona-run arrival stays with telemetry_agents' residual expectation (rec-4951).
    DQ intents (owner rec-4063): more than one distinct row per grain key (conflict);
