  after: |-
    the stored column is unchanged (Decision 96
          clause 4). A transcript-less producer that is the sole producer of its tree (litellm, for a run_persona run)
          pins session_started_at itself, once, as the integer epoch-millisecond start its run record carries (the
          events header's started_at_ms, read from the run's UTC clock before its first provider call); its rows'
          event_timestamps come from that same clock, so it declares no skew allowance; a run record without that integer
          DEFERS, a row timed before the pin is a producer HALT, and the handoff rule above binds only a transcript-less
          producer joining a tree another producer roots. Separately, one obligation spans EVERY hop, producer-to-writer included:
