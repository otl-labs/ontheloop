schema_version: 1
slug: litellm-telemetry-producer
tldr: 'Words for the litellm telemetry producer (rec-5396), placed by its second build PR. A lost provider call (cancelled,
  failed, malformed or empty) is a zero-token model_call row whose metadata says loss: cancelled or usage_not_recorded. host_run_ref''s
  retry ordinal counts run_persona runs for litellm. ports.yaml marks the litellm adapter implemented and opens PC-13 (only
  GitHub-hosted runs are measured; rec-5437). To fit the size limits, twelve old full log rows become short rows and PC-12
  and SA-14 are shortened by citation.'
