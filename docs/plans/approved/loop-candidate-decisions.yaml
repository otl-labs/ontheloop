schema_version: 1
slug: loop-candidate-decisions
tldr: 'Files the five feedback-loop decisions as pending roadmap entries CD.46, CD.47, CD.48, CD.50 and CD.51, worded to your answers of 17 November after the blind consult: a trust ladder capped at sampling until evidence supports more; one production record store that freezes each verdict''s evidence and only gating daily series; recs still close at merge, with a recurrence watch and a shadow fix proof; cost per useful outcome with an output floor and one hard stop on metered API spend; published external tables as the allow-list. Each becomes a numbered Decision when its build plan is approved.'
blocks:
- id: e01-loop-candidate-decisions
  file: docs/ROADMAP-PLATFORM.yaml
  before: |2-
        narrowly_supersedes: {decision_id: 197, clause: "clause 8 sequencing, for the one CD.45 pilot fixture only (detail SEQUENCING)"}

    tier_items:
  after: |2-
        narrowly_supersedes: {decision_id: 197, clause: "clause 8 sequencing, for the one CD.45 pilot fixture only (detail SEQUENCING)"}
      - id: CD.46
        title: Telemetry feedback loop review ladder -- one rule family over four rungs for every loop component and decision class, automatic demotion, operator promotion, and a reachable-rung cap until the audited sample supports an error bound (one Decision for X4-X8, X16, X19)
        detail: |
          FILED from REPORT-w3-feedback-loop-staging.md section 3 CD.46 and section 9 CD.46-r1 and r2, re-drafted to the operator's
          answers of 2026-11-17 after a blind best-practice consult (PLAN-loop-candidate-decisions). Binding while pending; the plan
          that builds the ladder controller drafts its numbered Decision.
          RULE FAMILY: every loop component, and every decision class (a (source, kind) pair of operator_decision rows, CD.47), carries
          one review ladder with rungs read_all, sampled, spot_check and anomaly_triggered over one named reviewable unit, on one
          controller and transition log (Decision 221 cl.7). Promotion: N consecutive outputs the operator confirmed since the last
          overturned one (read_all -> sampled), M consecutive sampled outputs at fraction f1 (sampled -> spot_check), D consecutive
          days with the component's own failure_signal within its bound at fraction f2 (spot_check -> anomaly_triggered), each with the
          Goodhart register's verdict sound for that component that day. The operator approves every promotion. Every demotion is
          automatic and logged: an overturned output returns the lane to read_all; an own-signal breach demotes one rung and holds
          until the bound holds for D days; a register verdict that is not sound demotes one rung and holds, with a dead-man alert
          while it holds; a drop of the ceiling demotes to the new ceiling the same day. CEILING: effective rung = min(earned rung,
          lowest rung among the component's data upstreams); the earned rung is kept while capped.
          REACHABLE RUNG: until a lane's audited random sample supports an upper error bound at its declared target (zero defects in n
          audited outputs bounds the rate near 3/n), the lane can reach sampled and no higher.
          ERROR MEASURE (answers W3-6): error and false-positive shares count operator-reviewed outputs only, are read only above a
          minimum reviewed count per detector, and keep wrong apart from duplicate or covered; the unreviewed share is estimated from
          the audited rate (REPORT-w1-maturity-ladder.md est_escaped_share), never counted as clean.
          RESTART: a lane restarts at read_all when what it reads or decides changes: the integer derivation version of a verb it
          reads (rec-5080), its rule set, or its model. A declared no-behaviour-change bump gets a short re-qualification instead of a
          full restart. Model versions are pinned; a component that runs two models side by side carries one lane per model.
          REVIEWER CHECK: a small blind share of the operator's own reviews is reviewed again, to catch rubber-stamping.
          REGISTER: every series that gates a transition carries a Goodhart register row naming the cheapest way its metric improves
          without the work improving, a counter independent of the metric's numerator and a seeded drill measuring recall; a series
          without a row is unsound; the register reads soundness only and carries rows for the budget (CD.50) and for itself. The two
          operator-decision rows staged in REPORT-w3 section 9 join it; they gate no rung and drill only in Decision 231's offline lane.
          DECISION CLASSES (CD.46-r1): a direction class stays at read_all for good; a mechanism class earns rungs with a per-class
          minimum fork count; a verification-weakening fork stays on Decision 235's own lane; an always_ask fork stays at read_all.
          REVIEW LOAD: the ladder owns the review_items envelope (about 60 a day, operator-set), which the budget reads as a
          diagnostic line (CD.50); full-transcript reads have their own envelope of about 5-10 a day (rec-4696), outside it.
          Seeds stay per component and provisional; capture-q1 stands as ruled 2026-10-04. The pilot schema change (P7) and the
          T3.4 c2 anchor (W3-3) are the controller plan's. Decision 235 cl.2's lane and Decision 221 cl.3's one lane per arm bind
          when this row ratifies.
        gates: []
        affects: [T3.4, T3.3, T3.20, T2.36]
        state: pending
        filed_via: pending_log_decision_lambda
      - id: CD.47
        title: Telemetry feedback loop record journal -- one append-only journal in production, a table per record kind, verdict records that freeze their own evidence, and frozen daily series only for measures that gate a ladder move or decide a proof (amends Decision 199 clause 1 at ratification; one Decision for X11)
        detail: |
          FILED from REPORT-w3-feedback-loop-staging.md section 3 CD.47 and section 9 CD.47-r1 to r3, with the operator's
          2026-11-12 frozen-series ruling, re-drafted to his answers of 2026-11-17 after a blind best-practice consult
          (PLAN-loop-candidate-decisions). Binding while pending; the plan that builds the journal writer (rec-5077) drafts its
          numbered Decision.
          JOURNAL: every loop component's operational record (filer run, back-validation verdict, ladder transition and current rung,
          egress log with withheld counts, register verdict, budget line verdict and attribution), and the records other Decisions
          route here (persona-eval runs, Decision 231; shadowed-check verdicts, Decision 235 cl.3; init attempts, Decision 221 cl.7 and
          rec-4388; coordination events, Decision 241 cl.4; operator_decision, CD.47-r1), live in one append-only journal on the
          Decision 199 model, one table per record kind, never a new contract class and never a table per item. Each component writes
          its own kind only. The journal lives in production only: SIT resets weekly and event verbs refuse off the PROD data path
          (Decision 252).
          EVIDENCE: every verdict record freezes the evidence it was judged on: its counts (numerator and denominator), the method
          versions it read (verb derivation_version, parser_version, register or budget version), its window and its stop day. Every
          daily verdict record carries a faults list naming each leg that fired that day.
          FROZEN SERIES (amends Decision 199 cl.1 at ratification): a daily series is stored only for a measure that gates a ladder
          transition or decides a proof. A stored row holds counts only (numerator and denominator, never a ratio, never dollars,
          Decision 221 cl.1), keyed by tenant_id, project_id, metric_id, UTC day, integer method version and a restatement number;
          it is insert-only (a restatement is a new row with the next restatement number, naming the row it supersedes, so no key is
          written twice, Decision 207), written after a declared lateness bound, never compared across versions, and checked against
          the live verb by a sampled re-derivation while snapshots allow. metric_id excludes dollars, recursive aggregates
          (read-only views, Decision 221 cl.7) and operator-decision metrics (CD.47-r3). Producers are named reader verbs plus
          declared non-verb producers (the verification monitor's counts, the cost ledger, git-side counters), each on a declared
          producer list and stamping its own code version. The reason is reproducing a judged verdict after snapshot expiry (30
          days), not read latency: T2.52 c1 stays deferred, telemetry landing on DuckLake does not reactivate T2.52 (the remaining
          half of staged CD.52), and rec-4833's derived-read-too-costly watch is unchanged.
          INGEST TIME: telemetry event rows gain a write-boundary arrival timestamp, so a read can be scoped to what was known at a
          given time after snapshot expiry, which DuckLake's own time travel cannot serve; the telemetry contracts carry the column.
          CD.47-r1 (operator_decision kind), CD.47-r2 (tenant keys on every kind, Decision 200) and CD.47-r3 (operator-decision
          metrics derived at read, never stored) are filed with this row as REPORT-w3 section 9 states them. Grain: one row per
          (component, run or verdict, day) for verdict records and per (tenant, project, metric, day, version, restatement) for
          stored series, confirmed at build by the data-modeling standard; each table's schema is a Class A contract entry the day
          the table exists.
        gates: []
        affects: [T2.36, T3.3, T3.4]
        state: pending
        filed_via: pending_log_decision_lambda
      - id: CD.48
        title: Proving a fix -- recs keep closing at merge under Decision 201, a fix-attempt stamp and a recurrence watch reopen on regression, and the telemetry proof runs in shadow until calibrated; a statistical verdict never closes a rec (one Decision for X10, P8)
        detail: |
          FILED from REPORT-w3-feedback-loop-staging.md section 3 CD.48, re-scoped to the operator's answers of 2026-11-17 after a
          blind best-practice consult (PLAN-loop-candidate-decisions): the staged hold-open design, which amended Decision 201 points
          1-2, is withdrawn. It inverted common practice (close at merge, reopen on regression) and turned most real fixes into
          unmeasurable verdicts for operator review (REPORT-w1-back-validation.md:93-97). Binding while pending; the plan that builds
          back-validation drafts its numbered Decision.
          CLOSE: a rec keeps closing at merge on its static or junit verdict under Decision 201, unchanged. At merge, a rec whose
          acceptance names a telemetry signature also gets a fix-attempt stamp {fix sha, effective day} under a key distinct from the
          fixed-by sha (rec-5078), reconstructable from the Resolves: trailers in git history. The effective day is the deploy of the
          first last-green ref covering the fix (Decision 254) for a deployed artifact, and the merge day otherwise (answers
          backval-q2).
          RECURRENCE WATCH: after the effective day, a recurrence of the rec's signature among exposed sessions reopens the rec, or
          files a linked rec where a reopen is refused. Exposure is a machine predicate the detector's owner declares in its rules at
          filing, frozen before any post-fix data is read (answers backval-q1).
          SHADOW PROOF: back-validation's statistical verdict (holds, fails or unmeasurable) runs on every eligible rec in shadow. It is
          written to the journal (CD.47) and closes, reopens and proposes nothing. Its calibration uses a burst-aware test (day or burst
          level, never per-session independence), suspends verdicts across declared change windows (parser, derivation or model
          changes), uses the recurrence bound for a deterministic signature and the test only for a diffuse rate change, and measures
          its real false-proof rate against operator judgement and later recurrence. Its prerequisites are the session start commit
          (rec-4426), the rec_ids join (rec-4606), a deploy-event record and about 57 clean days.
          NEVER: a statistical verdict never closes a rec by itself, at any rung. Decision 221 cl.7 holds as written ("back-validation
          stays the only proposer of a PROOF close"): in shadow it proposes none, and whether a calibrated verdict may later propose a
          close is re-decided when this row ratifies.
          T3.4 c1 READING: "telemetry delta proves fix" is met only once the shadow proof is calibrated (its measured false-proof rate
          within its design target) and the operator has read a verdict record showing the delta for a rec closed at merge whose
          watch is quiet; until then c1 stays open (NS.6: a signal is not proof).
          The filer's own stale_no_recurrence closes stay rung-keyed as ruled 2026-10-04 (q5). As drafted this row amends no Decision:
          Decision 201 points 1-3 stand, and the ratifying plan says whether the reopen path, a non-trailer update_rec caller, needs an
          amending clause.
        gates: []
        affects: [T3.4, T3.3]
        state: pending
        filed_via: pending_log_decision_lambda
      - id: CD.50
        title: Telemetry feedback loop cost and egress budget -- every meter a budget line with an owner, kept in its own unit and priced at read, a runaway alarm and never a target, optimised on cost per useful outcome with an output floor; among its lines only the metered API lane's dollar caps stop work (one Decision for #1401's register; amends Decision 217 clause 4's timing at ratification)
        detail: |
          FILED from REPORT-w3-feedback-loop-staging.md section 3 CD.50, re-drafted to the operator's answers of 2026-11-17 after a
          blind best-practice consult (PLAN-loop-candidate-decisions). Binding while pending; the plan that builds the budget register
          drafts its numbered Decision.
          LINES: every meter the loop turns (model tokens by class, catalog data transfer, Lambda GB-seconds, storage, operator review
          items) is a budget line with an owner, typed budget, diagnostic or tripwire (#1401 k9 (a), ruled 2026-10-04 q12); the
          review_items line is the ladder's (CD.46), read here as a diagnostic line. A line is kept in its meter's unit; dollars derive
          at read from the effective-dated price table (rec-4031) and are never stored or published (Decision 221 cl.1). Where a
          provider reports a per-call cost, the reported figure wins for metered spend and the table is the check and the fallback; a
          variance beyond a set tolerance is a finding. Allowance lanes read as tokens and share of allowance, never summed with
          metered dollars; an unpriced call reads unpriced, never 0. The verdict personas' metered model spend is a line here owned by
          the Agents in GitHub workspace, which checks the table against provider bills.
          NOT A TARGET: the envelope guards against runaway spend and is never an objective; spending less is never a win by itself.
          The loop optimises unit cost per useful outcome (tokens and GB-seconds per verified merge, Decision 217 cl.4) beside an
          output floor (verified merges per week), so a loop that runs nothing reads red. Until a product exists, the baseline is the
          platform's own use before and after a change. A meter that reports nothing on a day it should is a failure, never a saving.
          WINS: the loop files a cost or efficiency rec only when the expected payback is large against the effort, counting latency
          and operator wait as well as spend (the operator's example: the DuckLake compaction work of Decision 266 cut warehouse reads
          and writes from about 2 minutes to about 1 second); smaller gains are not chased at this stage. The payback threshold is a
          provisional register value.
          VERDICT: a daily deterministic verdict per line (ok, warn, projected_breach, breach, dark, unattributed or unregistered) with
          a faults list (CD.47). A breach files one rec per line per month through the cost reconciliation's existing rec path (F13
          (a), ruled 2026-10-04 q13) and stops nothing; the first measured month runs in shadow; stopping a schedule is a kill switch a
          human pulls on the consumer, never on the meter and never unattended.
          ONE STOP: among this register's lines, only the metered API lane's per-rec and per-day dollar caps (Decision 217 cl.4) stop
          work; every other register line alarms. Decision 217 cl.4's subscription-lane units (turns and wall-clock), Decision 206
          cl.6's plan-limit pause and T4.32's projected-breach pause stand unchanged. The caps go live before a metered lane carries
          production traffic; that brings forward cl.4, which is recorded unbuilt, so this row amends Decision 217 cl.4 at
          ratification.
          REGISTER: the register lives beside the monthly reconciliation's thresholds (a loop_budget block in
          config/agent/cost_reconciliation.yaml, #1401 k2 (a)), versioned and stamped on every verdict; the monthly leg reconciles
          the priced ledger against invoices. Seeds stay provisional until the first measured month replaces them; the catalog
          transfer envelope is re-seeded after the catalog moves to RDS (Decision 253). The local adapter, which has no bill, keeps
          the same lines in units with no priced read (answers budget-q2). Always-ask at build: billed-metric sources (S3 request
          metrics, access logs, Inventory, Storage Lens), any catalog consumption credential, and the governed Lambda deploy behind
          per-call attribution stamps.
        gates: []
        affects: [T2.36, T2.19, T2.26, T2.52]
        state: pending
        filed_via: pending_log_decision_lambda
      - id: CD.51
        title: Data leaving a customer's account -- dedicated published external tables whose declared schemas are the allow-list, keyed shared ids, a minimum group size and push transport; each table's columns and grain are set when a consumer exists (amends Decision 209 clause 5(i) at ratification)
        detail: |
          FILED from REPORT-w3-feedback-loop-staging.md section 3 CD.51 and section 9 CD.51-r1, re-drafted to the operator's
          direction of 2026-11-17 after a blind best-practice consult (PLAN-loop-candidate-decisions); it replaces the staged
          per-column allow-list over the source contracts. Binding while pending; the plan that builds the first egress path drafts
          its numbered Decision.
          PUBLISHED LAYER: nothing crosses from a data plane except rows of dedicated published external tables, built inside the
          data plane by named verbs from the internal tables. Each external table's declared schema is its allow-list (Decision 209
          cl.2(b): an allow-list, never a deny-list), and the published set is Decision 221 cl.7's one allow-list; dashboards, joins
          and visualisations over the published set need no further per-column approval. A batch that carries a column outside its
          table's declared schema, or a malformed tenancy id, is refused, and the receiving side rejects unknown fields as a second
          check. Adding a column or a table to the published set is a reviewed change whose wording the operator approves
          (Decision 246).
          NEVER CROSSES: free text of any kind (prompts, transcripts, titles, paths, error messages; Decision 209 cl.2(b)), dollars
          (Decision 221 cl.1 and cl.5), and every free-text column of the operator_decision kind (CD.51-r1).
          IDENTIFIERS (answers k2): an id shared across published tables is a keyed hash (an HMAC under a key the customer holds),
          never a raw internal id; tenant_id and project_id cross as Decision 200 mints them.
          GROUP SIZE: an aggregate cell below a minimum group size is suppressed or coarsened, because a day total over one session is
          that session and Decision 221 cl.5 publishes curves; the minimum is a provisional seed.
          TRANSPORT (answers k3): the data plane pushes to a tenant-scoped ingest endpoint under a short-lived, write-only,
          customer-revocable credential (Decision 209 cl.2(d)); the credential, role and endpoint are the operator's to grant at
          build.
          SET PER TABLE when a consumer exists (allow-q2; rec-4141, rec-4386): which external tables exist, their columns and their
          grain (k1 and k4 become each table's design). CD.51-r1 binds as staged, a crossing column now meaning a published table's
          column.
        gates: []
        affects: [T4.24, T2.36]
        state: pending
        filed_via: pending_log_decision_lambda

    tier_items:
