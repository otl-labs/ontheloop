schema_version: 1
slug: marker-guard-supersession-chain
tldr: The shared raise-marker guard follows a cited Decision's Superseded by chain hop by hop instead of one hop, so a marker
  stays authorized when the successor that restates its key is itself consolidated later. Each hop counts only when the
  successor declares the entry before it, the same rule as the consolidation manifests; the first body on the path that
  names the key decides and the kind rule judges that body. No live marker cites a superseded Decision today, so nothing
  passing today fails.
