- id: grammar-hop
  file: docs/contracts/marker-grammar.yaml
  before: |2
      supersession_hop: >-
        ONE hop only. When the cited Decision's own body does not authorize, and that body carries
        the Decision 149 compact-in-place `**Superseded by: Decision N**` marker, Decision N's body
        is also consulted. Closes the Decision 149 compaction interaction: a compacted stub's body
        is reduced to `**Status:** Superseded` / `**Date:**` / a one-line `**Decision:**` pointer /
        the supersession marker, with no path mentions of its own -- without the hop, compacting a
        cited Decision would silently un-authorize every live marker citing it, and because the scan
        is retroactive (see below), that would red every subsequent PR, not just the compacting one.
        The one-hop bound is deliberate, not a claim that chains cannot exceed length 1: Decision 149
        evaluates direction-consistency per compaction EVENT and its stub grammar never re-points an
        inbound A->B stub to a later C, so a two-generation A->B(stub)->C chain is structurally
        reachable. What actually bounds the risk is fail-loud: the five guards run unconditionally in
        `--pre` with no diff-gating, so the PR that compacts B re-runs the retroactive scan against
        the freshly-stubbed corpus and reds THERE -- remediation in that PR is to retarget the
        marker, or add the key to the grandfather hook (never to chase a second hop).
  after: |2
      supersession_hop: >-
        Chain-following, bounded by the corpus. When the cited Decision's own body does not authorize, and that body carries
        the Decision 149 compact-in-place `**Superseded by: Decision N**` marker, the guard follows Superseded by markers
        hop by hop (scripts/checks/_decision_chain.py resolve_live) and consults each body on the path in order; the first
        body that mentions the key decides, and the kind rule judges that body. A hop counts only when the successor
        declares the entry before it, in its envelope `supersedes` or its heading title, the same rule as
        docs/contracts/decision-compaction.yaml consolidation.manifest.resolve: a Superseded by marker records lineage, the
        declaration records that the successor took the entry over, and only an entry's owner authorizes on its behalf (a
        lineage-only pointer such as 37 -> 116, whose stub says 116 restates none of 37's live content, is not followed).
        The walk stops at an undeclared hop, at the first entry without a marker, at a number with no header, or at a
        repeat; a path on which no body mentions the key fails. Closes the Decision 149 and Decision 278 compaction
        interaction: a compacted stub has no path mentions of its own, and chain consolidations compact successors in turn,
        so without the walk compacting a cited Decision or its successor would un-authorize every live marker citing it and,
        because the scan is retroactive (see below), red every subsequent PR. Fail-loud still bounds the risk: the guards
        run unconditionally in `--pre` with no diff-gating, so the PR that compacts an entry whose successor does not both
        declare it and restate the key reds THERE; remediation is to restate the key in a declaring successor, retarget the
        marker to the live Decision, or add the key to the grandfather hook.
