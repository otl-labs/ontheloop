schema_version: 1
slug: merge-annotate-contract-reader
tldr: 'A merge link written after a session ends no longer counts as that session''s activity: the idle clock and every last-activity
  read skip link rows. Coverage, which nothing measures yet, is excused on link rows until rec-4599 produces it (review by
  2027-02-17), and the link''s identity is one row per root session and merge. It also defines what each link column means
  (recs resolved, PR link, the merge''s diff size, and its CI result as the first attempt of that commit''s own CI run). Old
  history lines are merged to stay under the file''s size cap.'
blocks:
- id: state-idle-semantics
  file: docs/contracts/telemetry_sessions.yaml
  before: across its rows in all four telemetry tables exceeds
  after: across its rows in all four telemetry tables, telemetry_sessions annotate rows excluded (a merge link is a post-close
    fact, never activity), exceeds
- id: state-idle-formula
  file: docs/contracts/telemetry_sessions.yaml
  before: max(event_timestamp over this session's rows in the four telemetry tables)
  after: max(event_timestamp over this session's rows in the four telemetry tables, telemetry_sessions annotate rows excluded)
