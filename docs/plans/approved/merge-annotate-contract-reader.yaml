    \ summary: \"PLAN-telemetry-event-journal-contracts (Decision 199): re-grounded to the annotate event_kind (a post-close\
    \ fact) and added dq_intent.required_when; field meaning unchanged.\"}"
  after: "    semantics: Optional quality metric; coverage_after - coverage_before is the session coverage delta, typically\
