    (Decision 228, amends Decision 199 cl.1): a root session''s'
  after: '- {date: "{{DATE}}", semantic_break: true, change_class: governance_note_add, summary: "PLAN-merge-annotate-contract-reader
    (rec-5270): idleness and every last-event read exclude telemetry_sessions annotate rows, so a merge link written after
    a session never keeps it running; the reader verbs and the verification oracle change together.", migration_story: "Derived
    at read; no stored row changes. No annotate row exists before PLAN-merge-annotate-producer, so no reading changes until
    it writes."}

    - {date: "2026-10-18", semantic_break: true, change_class: governance_note_add, summary: "PLAN-telemetry-read-side-session-end
    (Decision 228, amends Decision 199 cl.1): a root session''s'
