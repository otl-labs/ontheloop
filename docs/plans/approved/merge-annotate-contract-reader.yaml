    \ residual; rec-4599 decides any exclude_before when it lifts the exemption).\n    populated_by: \"unproduced: rec-4599\
    \ (no producer writes it)\"\n    dq_intent: {required_when: {event_kind: [annotate]}, write_time_exemptions: {required_when:\
    \ {class: temporary, reason: \"no producer measures coverage yet, so a merge link row (ci_annotate) could not be written\"\
    , owner: rec-4599, review_by: \"2027-02-17\"}}}\n    amendment_log:\n      - {date: \"{{DATE}}\", semantic_break: true,\
    \ change_class: governance_note_add, summary: \"PLAN-merge-annotate-contract-reader (rec-5270): required_when annotate\
    \ gains a temporary write-time exemption owned by rec-4599 (review_by 2027-02-17), so ci_annotate link rows can be written\
    \ before coverage is produced; pre-removal rows stay null. Contracts-class relief valve: the 2026-09-24 PLAN-telemetry-event-journal-contracts\
    \ line (re-grounded to the annotate event_kind and added required_when; field meaning unchanged) is compacted into this\
    \ line.\"}"
- id: external-ref-merge-link
  file: docs/contracts/telemetry_sessions.yaml
  before: SessionEnd cut the segment has two closes with different anchors and the reader takes the latest.
  after: 'SessionEnd cut the segment has two closes with different anchors and the reader takes the latest. An annotate row
    (producer ci_annotate, a merge link) uses ''<root entity_ref>:merge:<squash sha>#0/annotate'': one row per root session
    started at or before the squash commit and squash merge, written once with final values, so an identical re-send collapses
    and a differing one is a GrainConflict (Decision 207); its event_timestamp is the squash commit''s committer time, and
    its session_started_at and entity_ref are the root''s.'
