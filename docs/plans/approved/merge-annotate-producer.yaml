schema_version: 1
slug: merge-annotate-producer
tldr: The ports file records what the new merge link writer assumes about GitHub. It reuses the arrival check's own readers
  of the merge history, the session trailer and the PR number, so it inherits those three recorded assumptions, and it also
  reads the GitHub Actions run of each merged commit for its CI result, always under the default repository name.
blocks:
- id: ports-sa07
  file: docs/contracts/ports.yaml
  before: default repository slug otl-labs/ontheloop when GITHUB_REPOSITORY is unset.
  after: default repository slug otl-labs/ontheloop when GITHUB_REPOSITORY is unset. The ci_annotate merge link producer (scripts/telemetry_capture/merge_annotate.py)
    imports this check's trailer, (#N) and history parsers, so it shares the history, trailer and (#N) assumptions above,
    and also assumes the default slug for its pr_url and Actions reads even when GITHUB_REPOSITORY is set, GitHub's actions/workflows/ci.yml/runs
    list filtered by event push, branch main and head_sha, each run's run_attempt, and the runs/{id}/attempts/1 read for a
    re-run commit.
- id: ports-amendment
  file: docs/contracts/ports.yaml
  before: "amendment_log:\n  - {date: \"2026-11-16\", semantic_break: false, change_class: field_add, summary: \"PLAN-scheduled-workflow-dispatch"
  after: "amendment_log:\n  - {date: \"{{DATE}}\", semantic_break: false, change_class: field_add, summary: \"PLAN-merge-annotate-producer\
    \ (rec-5270, Decision 212 clause 3): structural_assumptions SA-07 extends to the ci_annotate merge link producer, which\
    \ reuses the arrival check's trailer, (#N) and history parsers and reads GitHub's Actions runs for a commit's CI push\
    \ run; no new port.\", migration_story: \"Prose only; no code or contract consumer reads it.\"}\n  - {date: \"2026-11-16\"\
    , semantic_break: false, change_class: field_add, summary: \"PLAN-scheduled-workflow-dispatch"
