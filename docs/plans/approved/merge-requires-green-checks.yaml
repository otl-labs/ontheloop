schema_version: 1
slug: merge-requires-green-checks
tldr: Agents may merge only what GitHub shows green. The merge hook reads main's required checks and the PR head's check runs
  and refuses an agent merge or auto-merge unless each check's newest GitHub Actions run on that exact head succeeded. Anything
  unknown refuses, a merge must name its head, and the operator's GitHub UI merge stays the release valve. A new Decision
  states this and the later persona-switch rule (switch rollback is the outage fallback); notes on Decisions 83, 229, 245
  and 246; git-ops.yaml and ports.yaml record it.
