- id: git-ops-merge-flow
  file: docs/contracts/git-ops.yaml
  before: |2
          On green confirmation: mcp__github__merge_pull_request(..., merge_method="squash") then
          mcp__github__unsubscribe_pr_activity(...). An IMPLEMENTATION merge first runs `scripts.session.merge_step
          premerge` on the squash message, merges with commit_message=<that message> and expectedHeadSha=<the head
          premerge checked>, then runs `scripts.session.merge_step readback` on the merge sha. Before it, the fail-closed PreToolUse hook `.claude/hooks/merge_gate.sh` (Decision 245) refuses merge_pull_request and enable_pr_auto_merge when main changed a file the PR also changes since its base: update the branch (mcp__github__update_pull_request_branch), `git pull --ff-only` the updated head so premerge and expectedHeadSha name it (the GitHub-authored update commit, committer noreply@github.com, is expected and is never reset-author'd or amended), wait for the CI-green wake, then merge; on an update conflict take the commit_flow_time rebase_resolve route. The same hook also refuses a merge_pull_request whose commit_message's Claude-Session key set differs from the PR branch commits' (remedy: use the printed lines), and premerge carries that check as its ATTRIBUTION leg.
  after: |2
          On green confirmation: mcp__github__merge_pull_request(..., merge_method="squash") then mcp__github__unsubscribe_pr_activity(...). An IMPLEMENTATION merge first runs `scripts.session.merge_step premerge` on the squash message, merges with commit_message=<that message> and expectedHeadSha=<the head premerge checked>, then runs `scripts.session.merge_step readback` on the merge sha. Before it, the fail-closed PreToolUse hook `.claude/hooks/merge_gate.sh` (Decision 245) refuses merge_pull_request and enable_pr_auto_merge when main changed a file the PR also changes since its base: update the branch (mcp__github__update_pull_request_branch), `git pull --ff-only` the updated head so premerge and expectedHeadSha name it (the GitHub-authored update commit, committer noreply@github.com, is expected and is never reset-author'd or amended), wait for the CI-green wake, then merge; on an update conflict take the commit_flow_time rebase_resolve route. The same hook also refuses a merge_pull_request whose commit_message's Claude-Session key set differs from the PR branch commits' (remedy: use the printed lines), and premerge carries that check as its ATTRIBUTION leg. It then refuses either tool unless every required check of main's live ruleset has, on the PR head, a newest GitHub Actions check run that completed with success (Decision {{N}}; skipped, pending, missing or unreadable refuses), and refuses a merge_pull_request without expectedHeadSha: wait for the CI-green wake, then merge naming that head; a red check is fixed by a new push, never merged past.
