      not closed. FALLBACK IS CONDITIONAL (Decision 201): `bin/venv-python -m scripts.ops_data_portal
      --update-rec rec-NNNN --status closed --resolution "..."` (Decision 70) is sanctioned ONLY after
      a transport failure or a MERGE-LEG refusal above -- both leave a rec open for a reason
