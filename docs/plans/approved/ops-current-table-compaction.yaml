slug: ops-current-table-compaction
tldr: 'One numbered Decision for ops current-table compaction: a per-table verb rewrite_current_deletes in the 6-hourly merge_ops pass at a 0.0 delete threshold; a predecessor-snapshot proof re-run each pass; transient failures isolated, a proof mismatch aborts the pass; a 200-file ceiling; three reversal conditions. An Update note on Decision 204 (re-lay means a partition-layout rewrite; current tables rebuild from the append-only history), the new VERB_UNIVERSE literal on 192, pointers on 191, 188 and 88.'
