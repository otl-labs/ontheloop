    **Status:** Decided
    **Date:** {{DATE}}
    **Warehouse ID:** dec-{{N}} (per Decision 84 backfill)

    **Problem:** Every write to an ops current table deletes the superseded row from an existing file, and
    merge_adjacent_files consolidates only delete-free files, so the 6-hourly merge_ops pass never bounds a current
    table: on 2026-11-15 ops_recommendations_current held 580 live data files, 563 with a delete file, for 3,880 rows, and
    a first full read on a fresh reader connection took 84-106 s against the 120 s route limit (audit
    ducklake-api-latency-442ff085 LAT-01, rec-5179).

    **Intent:** A current table stays a handful of files after every pass, without changing a row, a partition spec or the
    agent-free schedule.

    **Decision:**
    1. **Verb.** rewrite_current_deletes is a per-table maintenance verb: VERB_UNIVERSE reads ("merge_ops",
       "reconcile_partitions", "rewrite_partition_layout", "rewrite_current_deletes"), every class declares its cell, and
       a catalog-wide verb still takes none (Decision 192 cl.2). It runs only inside the scheduled merge_ops pass, before
       the merge, with no agent invocation (Decision 81 cl.6). It rewrites a current table's delete-bearing files in place
       under the table's live partition spec with ducklake_rewrite_data_files at an explicit delete threshold of 0.0, never
       the engine default; this in-place compaction is licensed here and is not a re-lay (Decision 204 cl.3). It refuses a
       non-current table and a table with legacy-scheme files.
    2. **Proof.** After commit, the row count and full-row NULL-explicit digest at the commit's immediate predecessor
       snapshot equal those at the commit snapshot (Decision 204 cl.1's proof shape).
    3. **Failures.** Decision 191 cl.3's isolation carve-out gains a fourth site, the per-table rewrite: a transient failure
       isolates to that table, every table still merges, and the pass ends non-successfully via the same post-loop
       aggregate raise. A proof mismatch is not transient: it aborts the pass before any merge as a breaker trip (Decision
       188's guard-violation shape), nothing is auto-restored, and the table is rebuilt from its history table (Decision
       81 cl.8) by a separately planned procedure.
    4. **Ceiling.** control_health asserts every 6 h that each current table holds no more than 100 live data files.

    **Rationale:** The native rewrite at an explicit threshold is the smallest change that bounds a Type-1 projection; a
    full read then opens about 16 objects instead of 1,143. Rejected: folding the rewrite into the merge_ops cell (it would
    exclude other classes by absence, Decision 191 cl.1); a separate schedule (a third cadence on the singleton, Decision
    192 cl.5); rebuilding current from history on a schedule (a new write path); an in-transaction proof (a compaction is
    invisible inside its own transaction, so it proves nothing).

    **Coverage (Decision 181 cl.2):** clause 1's cells by validate_maintenance_policy_matrix and its explicit threshold by a
    unit test; clauses 2 and 3 by the compaction module's unit and real-engine tests (PLAN-ops-current-table-compaction);
    clause 4 by control_health and the ControlTableInvariantViolation alarm. The rebuild procedure clause 3 relies on is
    owned by rec-5202 and is unenforced until it lands.

    ```yaml reversal-conditions
    decision: {{N}}
    review_by: 2027-05-31
    on_trigger: "re-decide via /plan"
    conditions:
      - id: catalog-stats-growth
        kind: manual
        description: "After the first gc_ops that can reclaim superseded current files, file_column_stats rows reach 1.5x the pre-deploy baseline (rec-5200): reopen the 0.0 threshold."
      - id: proof-mismatch
        kind: manual
        description: "Any rewrite_current_deletes proof mismatch: set its scd2 and smoke_harness cells to apply false until the cause is known."
      - id: ceiling-breach
        kind: manual
        description: "control_health reports a current table over 100 live files while merge_ops passes succeed: the rewrite no longer bounds that table."
    ```

    **Related:** Decisions 81, 84, 88, 99, 128, 143, 188, 191, 192, 204, 214, 216.

