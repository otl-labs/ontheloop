    > **Update ({{DATE}}):** cl.3's "re-lay" means a partition-layout rewrite (cl.1); in-place compaction of a current table under its live spec is Decision {{N}}'s rewrite_current_deletes, not a re-lay. The history tables are the true, append-only record: every write appends, no write changes a recorded row, and every current table can always be rebuilt from its history table (Decision 81 cl.8; the procedure is owned by rec-5202).
