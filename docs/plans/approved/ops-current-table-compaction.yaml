    ## Decision {{N}}: The 6-hourly merge_ops pass compacts each ops current table in place before merging, under a declared per-table verb, a proof that aborts the pass on mismatch, and a live-file ceiling (amends Decisions 88, 188, 191 and 192) (Decided)

