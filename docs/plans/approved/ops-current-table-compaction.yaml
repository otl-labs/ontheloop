slug: ops-current-table-compaction
tldr: 'Adds one numbered Decision for the ops current-table compaction: rewrite_current_deletes joins VERB_UNIVERSE as a per-table verb run inside the 6-hourly merge_ops pass at an explicit 0.0 delete threshold; its proof compares the commit''s predecessor snapshot with the commit; a transient failure becomes Decision 191 cl.3''s fourth isolation site while a proof mismatch aborts the pass as a breaker trip; control_health holds a 100-file ceiling; three manual reversal conditions. Annotates Decision 204 (re-lay means a partition-layout rewrite; current tables can always be rebuilt from the immutable, append-only history tables, procedure rec-5202) and Decision 192 (the new VERB_UNIVERSE literal), with pointers on 191 and 188.'
