    ## Decision {{N}}: The 6-hourly merge_ops pass compacts each ops current table in place before merging, under a declared per-table verb, a proof that aborts the pass on mismatch, and a live-file ceiling (amends Decisions 188, 191 and 192) (Decided)

    ```yaml
    number: {{N}}
    status: Decided
    decided_date: "{{DATE}}"
    kind:
      value: mechanism
      justification: >-
        Only the means: clauses 1-4 change how the merge_ops pass compacts current tables and handles a failure; undoing
        them changes no goal, human gate or data commitment.
    amends: [188, 191, 192]
    significance:
      value: numbered_decision
      justification: >-
        It widens two ratified exact sets (Decision 192's VERB_UNIVERSE literal and Decision 191 cl.3's isolation sites)
        and adds an abort path with reversal conditions; a dated amendment_forms note (considered) cannot widen an exact
        set or add a carve-out (Decision 216, the Decision 204 cl.4 precedent), and docs/contracts/ducklake_maintenance.yaml
        (considered) states verb contracts, not which carve-outs the Decisions sanction.
