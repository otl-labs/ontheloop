schema_version: 1
slug: persona-check-origin
tldr: >-
  The merge gate counts a persona's verdict check only when the dedicated verdict GitHub App posted it, named by a new
  setting read from main. Same-named checks from anywhere else are ignored. While the setting is empty, a persona on
  Actions refuses every agent merge of its kind, and only the operator merges a change to it. A new Decision amends
  Decisions 264 and 205.
