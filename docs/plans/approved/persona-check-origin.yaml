- id: ports-pc-10
  file: docs/contracts/ports.yaml
  before: |2
      - id: PC-10
        ports: [change_surface, verdict_plane]
        location: .claude/hooks/merge_gate.py
        description: >-
          The merge gate's persona leg (T4.32 c5) accepts a verdict persona's check only as a check run named persona-verdict/<persona> created by the app github-actions on the exact head, so the change_surface github adapter's merge seam presumes the verdict_plane github_actions adapter; a verdict_app check (T4.2 c9) would refuse. The verdict jobs must post that check on every head of the persona's class (a pull request confined to docs/plans/ for decision_scout and plan_critic, every other pull request for code_reviewer), including a head a scout fingerprint covers (T4.32 c4).
        status: open
        owning_item: "T4.2:c9"
  after: |2
      - {id: PC-10, ports: [change_surface, verdict_plane], location: .claude/hooks/merge_gate.py, status: open, owning_item: "T4.2:c9", description: "The merge gate's persona leg (T4.32 c5) accepts a verdict persona's check only as a check run named persona-verdict/<persona> created on the exact head by the verdict GitHub App that gates.verdict_app.app_id names on origin/main (Decision {{N}}), so the change_surface github adapter's merge seam presumes a GitHub App check identity on the verdict plane; a verdict plane off GitHub needs its own identity (T4.2 c9). The verdict jobs must post that check on every head of the persona's class (a pull request confined to docs/plans/ for decision_scout and plan_critic, every other pull request for code_reviewer), including a head a scout fingerprint covers (T4.32 c4)."}
