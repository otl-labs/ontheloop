                "type": "string"
              },
              "severity": {
                "enum": [
                  "BLOCK",
                  "WARN",
                  "NOTE"
                ],
                "type": "string"
              },
              "title": {
                "minLength": 1,
                "type": "string"
              }
            },
            "required": [
              "id",
              "decision",
              "severity",
              "title",
              "clause",
              "element",
              "resolution"
            ],
            "type": "object"
          },
          "type": "array"
        },
        "decisions_live": {
          "minimum": 1,
          "type": "integer"
        },
        "decisions_triaged": {
          "minimum": 0,
          "type": "integer"
        },
        "north_star": {
          "additionalProperties": false,
          "properties": {
            "engaged": {
              "items": {
                "minLength": 1,
                "type": "string"
              },
              "type": "array"
            },
            "rationale": {
              "minLength": 1,
