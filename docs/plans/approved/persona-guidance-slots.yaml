schema_version: 1
slug: persona-guidance-slots
tldr: >-
  A new Decision: a project's guidance (an adopter's, or this repository's own) reaches a persona only as the value of
  a guidance slot its contract declares, never as text in the hash-pinned prompt, so guidance changes without a
  contract or hash change. A provider registered for the slot fills it; the default reads a file under the guidance
  home at the base ref, never the change's head. Guidance may add to or focus a persona's judgement, never relax it.
  The home path is a key in executor-personas.yaml. No persona contract gains a slot here (rec-5585 does that).
