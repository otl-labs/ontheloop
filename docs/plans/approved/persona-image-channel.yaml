schema_version: 1
slug: persona-image-channel
tldr: >-
  The persona image gets its publish channel: deploy-paths.yaml names it (a CI workflow publishes the newest green main
  commit's image to a public GHCR package, after its conformance suite passes, with no AWS role and no Environment
  reviewer, and attests it); ports.yaml records the image's structural assumption SA-14. SA-03 is reflowed with its
  words unchanged to keep ports.yaml under its cap.
