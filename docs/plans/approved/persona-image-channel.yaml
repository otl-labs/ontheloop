  before: |2-
      recovery: "If a dispatch is blocked or a publish fails, diagnose via the named contract's procedure before retrying -- never widen the publish workflow's credential surface or bypass the Environment's required reviewer."

    admin_out_of_band:
  after: |2-
      recovery: "If a dispatch is blocked or a publish fails, diagnose via the named contract's procedure before retrying -- never widen the publish workflow's credential surface or bypass the Environment's required reviewer."

    publish_persona_image:
      description: "The persona container image (Decision 205 clause 2; T4.32 c2): one public GHCR package that every persona compute host runs by digest; config/persona_image.yaml names the image, its inputs, its consumers and the pinned digest."
      trigger: "CI, never a person: .github/workflows/persona-image-publish.yml, woken by main's completed CI run, publishes the newest main commit whose full tier passed when an image input changed (scripts/ci/deploy_gate.py channel persona_image, Decision 249 clause 2), only after the conformance suite passes on that exact image, under GITHUB_TOKEN packages: write with no AWS role, and attests its build provenance. Its record is the package's main tag, whose org.opencontainers.image.revision label names the source commit. Unlike publish_artifacts it has no Environment reviewer: like deploy_code it ships only reviewed, green main code, here to a package this repository owns."
      actor_role: agent
      blocks_ref: "config/persona_image.yaml (image inputs, consumers, pinned digest); scripts/ci/deploy_gate.py (the gate)"
      recovery: "A red main or a failed suite pushes nothing and the pinned digest keeps serving; the next green commit publishes, or a workflow_dispatch from main republishes the newest green commit (force skips only the already-published and no-change skips; first_publish only for the package's first push). Consumers move only when a pin PR records a new digest. Package visibility and access are operator settings an agent never changes, and a published version is never deleted while a pin may name it."
      status: "Landed with T4.32 c2's channel legs (PLAN-persona-image-channel); the operator sets the package Public after its first publish."

    admin_out_of_band:
