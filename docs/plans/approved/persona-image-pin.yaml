schema_version: 1
slug: persona-image-pin
tldr: >-
  Persona image pin: actions-capacity.yaml gains the persona-image-publish ledger row (about 2 job-minutes per merge,
  assumed); deploy-paths.yaml says a pin PR passes pr-validate's pin verification and merges on the operator's word
  (Decision 246 cl.4), and one old amendment entry becomes one line, words unchanged, for the line cap; T4.32 c2 is
  met at the first pin, its text re-grounded: the twin reads config/persona_image.yaml now, the verdict workflow
  later (T4.2:c8).
