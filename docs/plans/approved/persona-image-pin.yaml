schema_version: 1
slug: persona-image-pin
tldr: >-
  The persona image pin: actions-capacity.yaml's ledger gains the persona-image-publish row (about 2 job-minutes per
  merge, assumed; live once the publish workflow's runs appear), and deploy-paths.yaml's publish_persona_image
  recovery says a pin PR must pass pr-validate's pin verification and merges on the operator's word (Decision 246
  clause 4). One amendment row in each file.
