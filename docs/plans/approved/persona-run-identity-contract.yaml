schema_version: 1
slug: persona-run-identity-contract
tldr: On a persona run, telemetry_agents.agent_type carries the persona's registry key (code-review, plan-critique, decision-scout), mapped by a new checked registry_key on each executor-personas.yaml row; persona ids stay. A new nullable definition_sha256 column holds the hash of the definition text the run loaded; production telemetry deploys hold until it is added there. Parity reads group by (agent_type, persona_backend), metadata.prompt_hash goes, and five old log entries are compacted, values unchanged. ci-rca and the advice consult are a named gap (rec-5071). Producers come in plan 2.
blocks:
- id: t01-agent-type
  file: docs/contracts/telemetry_agents.yaml
  before: |-
    governance_notes_local: >-
      The agent-identity DIMENSION KEY: a canonical lineage key from
      config/agent/data_quality/source_registry.yaml (Decision 66), the SAME registry
      ops_recommendations.source draws from. Registry membership is validated at write time.
    joins:
      - lineage_join_source_to_agent_type
  after: |-
    governance_notes_local: >-
      The agent-identity DIMENSION KEY: a canonical lineage key from
      config/agent/data_quality/source_registry.yaml (Decision 66), the SAME registry
      ops_recommendations.source draws from. Registry membership is validated at write time.
      On a PERSONA RUN it is that persona's registry_key from the personas rows of
      docs/contracts/executor-personas.yaml, on every producer and both run shapes, so one
      persona's runs share one key on every backend and the lineage join meets the recs filed
      under that key; on any other run it is the producer's or the agent's own key (run_shapes).
      A reader tells a persona run by agent_type being one of those registry_key values. The
      claude_code producer writes a persona's key from parser_version 10 (rec-4433); every
      sub-agent row it wrote before carries claude-code-subagent.
    joins:
      - lineage_join_source_to_agent_type
    amendment_log:
      - {date: "{{DATE}}", semantic_break: true, change_class: governance_note_add, summary: "PLAN-persona-run-identity-contract (rec-4433, Decision 206 cl.4): on a persona run agent_type is that persona's registry_key from executor-personas.yaml, on every producer and both run shapes; the persona ids keep Decision 231 cl.4's spelling and the personas rows hold the map.", migration_story: "No stored row changes (append-only): every stored sub-agent row carries claude-code-subagent, so a read of rows before claude_code parser_version 10 cannot tell a persona run from another sub-agent run; top-level rows keep their agent's key (ci_rca)."}
- id: t02-agent-name
  file: docs/contracts/telemetry_agents.yaml
  before: |-
    description: Optional human-facing display label for the agent instance, when it differs from the canonical agent_type. Usually redundant with agent_type.
    semantics: Retained as an OPTIONAL display alias only, so agent_type stays the single authoritative key. Null when identical to agent_type.
    populated_by: the claude_code producer, at the open event.
    dq_intent: {}
    amendment_log:
  after: |-
    description: The producer's own name for the agent instance as spawned; for claude_code, the Agent tool's subagent_type (e.g. general-purpose). NULL on a top-level run.
    semantics: >-
      A raw label for display and grouping (tool_use_rollup groups on it), never the identity key: agent_type stays the
      single authoritative key, and a persona run's persona is read from agent_type, not from this label (several
      personas spawn as general-purpose).
    populated_by: the claude_code producer, at the open event (the spawn's subagent_type); NULL on a top-level run row.
    dq_intent: {}
    amendment_log:
      - {date: "{{DATE}}", semantic_break: true, change_class: governance_note_add, summary: "PLAN-persona-run-identity-contract (rec-4433): agent_name is re-described as what the claude_code producer writes, the spawn's subagent_type, and is never the persona key.", migration_story: "No stored row changes: every claude_code version writes the spawn's subagent_type here (src/turn_capture/sessions.py _agent_row) and leaves it NULL on a top-level row, so the old 'Null when identical to agent_type' text never matched a stored row."}
- id: t03-definition-hash
  file: docs/contracts/telemetry_agents.yaml
  before: |-
    host_run_ref:
      type: str
      iceberg_type: string
  after: |-
    definition_sha256:
      type: str
      iceberg_type: string
      nullable: true
      description: "SHA-256 of the persona definition text a persona run loaded as its instructions, 64 lower-case hex characters; NULL on a run that is not a persona run."
      semantics: >-
        One meaning on every producer: the definition the run was given, never its inputs, its host or its run
        configuration. claude_code: the text of the persona's gate-skill definition that the harness injected into the
        run's own stream (the meta record answering the run's first persona Skill call), as UTF-8, with the leading
        "Base directory for this skill: <path>" line and the blank line after it removed and any trailing "ARGUMENTS:"
        block removed, so one definition hashes the same on every host. A run_persona producer: the rendered system
        prompt it sends, which equals the persona contract's rendered_prompt_sha256 (Decision 206 cl.7). The two
        producers hash different texts, so one persona's hashes are not expected to match across backends; within one
        producer a changed definition is a changed hash. Run configuration (model, thinking, effort;
        docs/contracts/inference-provider.yaml) and run inputs are outside the hash, so a reader that needs a
        configuration change reads it from its own column or contract (rec-5072 owns the dual-run reset rule for
        thinking and effort). Written on the run's open and close rows (Decision 199 cl.1).
      populated_by: "unproduced: rec-4433 (no producer writes it)"
      dq_intent:
        pattern: "^[0-9a-f]{64}$"
      amendment_log:
        - {date: "{{DATE}}", semantic_break: false, change_class: field_add, summary: "PLAN-persona-run-identity-contract (rec-4433, Decisions 206 cl.7, 210 cl.1, 222): one nullable definition_sha256 column, 64 lower-case hex characters, write-enforced; the hash of the definition text a persona run loaded.", migration_story: "Additive nullable column; no stored row changes. Production add owed (provision_telemetry_catalog, Decision 230 cl.4); until then it is pending_reconcile and the governed deploy holds the production telemetry writer and reader."}
    host_run_ref:
      type: str
      iceberg_type: string
