    signal_interpretation: "telemetry_agents.agent_type for every non-persona sub-agent run captured from a Claude Code transcript (PLAN-telemetry-turn-capture-core), and for every sub-agent run captured before claude_code parser_version 10 (rec-4433). Also a valid ops_recommendations.source value by the shared-registry contract."
