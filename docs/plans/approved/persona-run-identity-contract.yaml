  before: |-
    realization:
      produced: {write_boundary: [event_id, created_timestamp, tenant_id, project_id, session_id, observation_id, agent_run_id], claude_code: [event_kind, event_timestamp, session_started_at, source_ordinal, external_ref, entity_ref, producer, producer_version, parser_version, agent_type, agent_name, model, version, trigger, outcome, error, workflow_run_id, host_run_ref]}
      unproduced: {T4.32:c1: [provider], rec-4711: [lambda_request_id, findings_count, recs_created, queue_entries_written]}
  after: |-
    realization:
      produced: {write_boundary: [event_id, created_timestamp, tenant_id, project_id, session_id, observation_id, agent_run_id], claude_code: [event_kind, event_timestamp, session_started_at, source_ordinal, external_ref, entity_ref, producer, producer_version, parser_version, agent_type, agent_name, model, version, trigger, outcome, error, workflow_run_id, host_run_ref]}
      unproduced: {T4.32:c1: [provider], rec-4711: [lambda_request_id, findings_count, recs_created, queue_entries_written], rec-4433: [definition_sha256]}
- id: t05-run-shape-sub-agent
  file: docs/contracts/telemetry_agents.yaml
  before: |-
    agent_type: "the producer's registry key (claude-code-subagent for claude_code)"
  after: |-
    agent_type: "the persona's registry_key on a persona run (executor-personas.yaml personas rows), else the producer's registry key (claude-code-subagent for claude_code)"
- id: t06-run-shape-top-level
  file: docs/contracts/telemetry_agents.yaml
  before: |-
    agent_type: "the source_registry key of the agent (e.g. ci_rca)"
  after: |-
    agent_type: "the source_registry key of the agent (e.g. ci_rca); the persona's registry_key on a persona run"
- id: t07-governance-note
  file: docs/contracts/telemetry_agents.yaml
  before: |-
    governance_notes: >-
      TOP-LEVEL RUN: a CI job running claude -p, a Fargate task, a Lambda or a local unattended run is its root session plus one open/close
  after: |-
    governance_notes: >-
      PERSONA RUN: a run whose instructions are a registered persona's definition (the personas rows of
      docs/contracts/executor-personas.yaml) carries that persona's registry_key in agent_type and the definition's hash in
      definition_sha256, on its open and close rows and on either run shape; outcome-parity reads group by (agent_type,
      persona_backend) (telemetry_observations.yaml persona_backend). Declared residuals: a custom named sub-agent is not a
      persona run (its definition is not in the transcript), and the judgment personas ci-rca and the advice consult have no
      personas row yet, so their runs carry their agent's or the producer's key and a NULL definition_sha256 (rec-5071).
      TOP-LEVEL RUN: a CI job running claude -p, a Fargate task, a Lambda or a local unattended run is its root session plus one open/close
