schema_version: 1
slug: persona-run-identity-producer
tldr: From claude_code parser_version 11, a verdict persona's sub-agent run (code-review, plan-critique, decision-scout) writes the persona's registry key in agent_type and the hash of the skill definition it loaded in definition_sha256, on its open and close rows; close rows repeat the open row. definition_sha256 becomes required at write whenever agent_type is a persona key. Parser version 11, not 10, in plan 1's two sentences. Rows of one run that disagree go to a data check (rec-5227); claude_cli hash source is rec-5226.
blocks:
- id: t01-agent-type
  file: docs/contracts/telemetry_agents.yaml
  before: |2-
      A reader tells a persona run by agent_type being one of those registry_key values. The
      claude_code producer writes a persona's key from parser_version 10 (rec-4433); every
      sub-agent row it wrote before carries claude-code-subagent.
    joins:
      - lineage_join_source_to_agent_type
    amendment_log:
  after: |2-
      A reader tells a persona run by agent_type being one of those registry_key values. The
      claude_code producer writes a persona's key from parser_version 11 (rec-4433, envelope rules PI-1..PI-4); every
      sub-agent row it wrote before carries claude-code-subagent.
    joins:
      - lineage_join_source_to_agent_type
    amendment_log:
      - {date: "{{DATE}}", semantic_break: false, change_class: prose_improvement, summary: "PLAN-persona-run-identity-producer (rec-4433): the claude_code producer writes a persona's key from parser_version 11, not 10 (Feedback Loop's rec-4959 took 10 first), by the envelope's rules PI-1..PI-4. Meaning unchanged.", migration_story: "No stored row changes: no claude_code version before 11 writes a persona key, so every stored sub-agent row carries claude-code-subagent, as the note says."}
