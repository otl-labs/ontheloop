  file: docs/contracts/telemetry_agents.yaml
  before: |2-
      personas row yet, so their runs carry their agent's or the producer's key and a NULL definition_sha256 (rec-5071).
  after: |2-
      personas row yet, so their runs carry their agent's or the producer's key and a NULL definition_sha256 (rec-5071).
      From parser_version 11 the claude_code producer writes a verdict persona's sub-agent run (envelope rules PI-1..PI-4):
      the persona is the first Skill call within the run's open bound that names a verdict persona's skill and has a
      readable injected definition, and every close row repeats its run's open row's agent_type and definition_sha256.
      Rows of one run that still disagree are a data-quality finding (rec-5227), not a write rule: the rows arrive in
      different passes and batches, so the writer cannot see the run (Decision 210 cl.2).
