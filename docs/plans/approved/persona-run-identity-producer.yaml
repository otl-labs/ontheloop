- id: t03-definition-required
  file: docs/contracts/telemetry_agents.yaml
  before: |-
    dq_intent:
      pattern: "^[0-9a-f]{64}$"
    amendment_log:
  after: |-
    dq_intent:
      required_when: {agent_type: [implement-agent, planning, code-review, decision-scout, plan-critique]}
      pattern: "^[0-9a-f]{64}$"
    governance_notes_local: >-
      required_when names every persona registry key, so a persona run's rows are refused at write without a hash
      (operator, 2026-11-12: a persona run never carries a NULL hash); the column stays nullable because every other run
      carries none, and rec-5096 owns the wider NULL check. It is undated (required_when is not a dateable rule kind) and
      lands after the production column add (2026-11-16), as Decision 222 cl.1 requires. tests/telemetry/
      test_definition_sha256_required.py keeps the list equal to the executor-personas.yaml rows' registry_key set, so a
      new personas row (rec-5071) brings its hash rule with it. A claude_cli persona run (T4.27) has no hash source yet,
      so its rows would be refused until it has one (rec-5226).
    amendment_log:
      - {date: "{{DATE}}", semantic_break: true, change_class: not_null_tighten, summary: "PLAN-persona-run-identity-producer (rec-4433): definition_sha256 is required when agent_type is a persona registry key (write-enforced required_when, undated, every personas row's key), and semantics names envelope rules PI-1 and PI-2.", migration_story: "census: 0 violators (2026-11-16): no stored telemetry_agents row carries a persona key before claude_code parser_version 11, since claude_code wrote claude-code-subagent on every sub-agent row and the host-run sidecar's agent on a top-level row (no capture.yaml agent is a persona key), and the deploy smoke vector writes manual; from parser_version 11 every persona row carries its hash (rule PI-3). The production column add (2026-11-16, Decision 230 cl.4) precedes this rule (Decision 222 cl.1)."}
