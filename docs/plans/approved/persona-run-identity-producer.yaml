- id: e01-envelope-parser-version-11
  file: docs/contracts/telemetry-event-envelope.yaml
  before: |-
    DQ intents (owner rec-4063): more than one distinct row per grain key (conflict); pending
  after: |-
    PARSER_VERSION 11 (PLAN-persona-run-identity-producer, rec-4433): claude_code writes a verdict persona's sub-agent run under the persona's registry key, with the SHA-256 of the definition the run loaded (telemetry_agents.yaml PERSONA RUN). PI-1: a Skill call's name is normalised by stripping it, lower-casing it and removing one leading / and then one ontheloop: prefix (the plugin name in .claude/.claude-plugin/plugin.json); WA-2 reads the same name, so ontheloop:planning reads plan. The run's persona is the first Skill tool_use in its own stream at or before its open bound (WT-9) whose normalised name maps through PERSONA_SKILLS (src/turn_capture/persona_identity.py: code-review, decision-scout and plan-critique, each its own registry key, kept equal to the verdict personas' skill_tether.skill and registry_key) and whose definition record is readable; an earlier mapped call with no record or an unreadable one is skipped and counted (persona_definition_absent, persona_definition_unreadable). PI-2: the definition record is the single user record of that stream at or before the bound with isMeta true and sourceToolUseID the call's id whose content, a string or a list holding one text block, opens with 'Base directory for this skill: '; more than one such record, no blank line after that header line, or, when the call's args is a non-empty string, a text that does not end with a blank line and 'ARGUMENTS: ' followed by the args makes it unreadable. The hash is the SHA-256 of the UTF-8 text after the first blank line, with that ARGUMENTS trailer removed.
    PI-3: a persona run's open and close rows carry agent_type the registry key and definition_sha256 the hash (diag persona_run); any other sub-agent run keeps claude-code-subagent and no hash, and top-level rows are unchanged. PI-4: in each pass's union of cut parses and the tree, every telemetry_agents close row takes the agent_type and definition_sha256 of the open row with the same entity_ref, so a run whose open row was first built at a finalization cut before its Skill call keeps one identity; stored rows that still disagree are a data-quality finding (rec-5227). Every verdict reads only the stream's records at or before its open bound (R7). No parser_version 10 golden case holds a definition record or a plugin-prefixed skill name, so the parser changes none beyond the version stamp; host_run_only_withheld's host-run agent moves from code-review to architectural-review, since a top-level persona row with no hash is refused (rec-5226).
    DQ intents (owner rec-4063): more than one distinct row per grain key (conflict); pending
