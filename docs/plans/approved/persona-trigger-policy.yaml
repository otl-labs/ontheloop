schema_version: 1
slug: persona-trigger-policy
tldr: 'An LLM persona may run on GitHub Actions only from a repository event, a maintainer''s own dispatch, or CI''s own re-dispatch
  of ci-rca for a failed run (Decision 205 cl.1). A deterministic gate before each dispatchable LLM step stops any other dispatch
  fail-closed, and before the reconcile and sandbox reviews that stop also prevents the apply and the convergence record write.
  A registered check, validate_persona_trigger_policy, refuses LLM workflows on other triggers, ungated dispatch steps, checks:
  write on pull_request workflows, and any compute-plane persona start. Two dated annotations record this on Decisions 158
  (its route set holds for admitted dispatchers) and 229 (the compute-plane residual is now checked by launch signature);
  no clause changes.'
