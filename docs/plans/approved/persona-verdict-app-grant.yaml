schema_version: 1
slug: persona-verdict-app-grant
tldr: 'Records where the verdict GitHub App''s private key lives and who may read it: one SSM /secret/ parameter, one role
  that only persona-verdict.yml''s post job can assume through a new main-only Environment, and a Deny in the CI apply boundary
  that refuses the read to every other role. A new Decision accepts that the post job''s code stays agent-editable (an exception
  to Decision 143 clause 1) and re-anchors the boundary''s size trigger; a settings row and a credential inventory row record
  the rest.'
