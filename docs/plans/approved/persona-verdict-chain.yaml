schema_version: 1
slug: persona-verdict-chain
tldr: >-
  Splits T4.32's verdict-jobs roadmap hint into six plans, because the persona runner and image are unplanned. The
  first builds only the GitHub chain: trigger, verdict workflow on main's code, author check, routing, input and one
  check per persona. It runs a non-AI probe on fixture PRs and assumes no AWS role until the egress plan.
blocks:
- id: t4-32-intent-annotation
  file: docs/ROADMAP-PLATFORM.yaml
  before: |2-
          (Decision 217 clause 4's API-lane units, a PR being a verdict run's work item). ORDER: each decomposition_hints
          entry names the plans it follows; entries that name none may run in parallel.]
  after: |2-
          (Decision 217 clause 4's API-lane units, a PR being a verdict run's work item). ORDER: each decomposition_hints
          entry names the plans it follows; entries that name none may run in parallel.] [Annotation {{DATE}},
          PLAN-persona-verdict-chain -- VERDICT CHAIN SPLIT: the verdict chain lands in the six PLAN-persona-verdict-*
          plans its decomposition_hints name, the chain plan first and ahead of the backend and image plans. Until
          PLAN-persona-verdict-fixture-run the chain runs a deterministic, non-LLM probe persona on fixture PRs in place
          of the digest-pinned image and the run_persona entrypoint, a deferral of T4.2 c8's image clause (Decision 205
          clause 2) and never a verdict on a real PR; and no persona job assumes the persona-verdict role before
          PLAN-persona-verdict-egress, whose egress denial comes first (the operator's 2026-11-16 ruling on c7). The
          chain runs only the verdict personas whose docs/contracts/executor-personas.yaml implementation reads
          implemented; it materialises the input fields every verdict contract shares, and each persona's add plan
          supplies that persona's own pre-computations when it binds the contract, so T4.2 c8's pre-computation clause
          is discharged persona by persona.]
- id: t4-32-progress-note
  file: docs/ROADMAP-PLATFORM.yaml
  before: |2-
          - 2026-11-12 (PLAN-persona-trigger-policy): the c1 trigger-policy check and the dispatch gate are built (see T4.2
            c10); T4.32 stays not_started.
  after: |2-
          - 2026-11-12 (PLAN-persona-trigger-policy): the c1 trigger-policy check and the dispatch gate are built (see T4.2
            c10); T4.32 stays not_started.
          - {{DATE}} (PLAN-persona-verdict-chain): the verdict-jobs hint split into six plans; the chain plan's trigger,
            verdict workflow, allowlist, diff routing, shared input and check-run poster are built with a probe persona
            on fixture PRs; c1, c3, c4, c6 and c7 stay open.
- id: t4-32-verdict-jobs-hint
  file: docs/ROADMAP-PLATFORM.yaml
  before: |2-
            - "PLAN-persona-verdict-jobs -- the verdict chain, verdict identity, plan-PR routing, input projection, wake, override record, egress policy and fixture run (c1, c3, c6, c7; audit WP-12; rec-4946; after PLAN-persona-verdict-credential, PLAN-scout-input-fingerprint, PLAN-persona-trigger-policy and PLAN-persona-image-channel)"
  after: |2-
            - "PLAN-persona-verdict-chain -- the verdict chain shell: the secretless pull_request trigger, the workflow_run verdict workflow on main's definition, the author allowlist, diff routing, the input fields every verdict contract shares materialised in a credential-free job with the head-tree snapshot off the import path, and one check run per routed persona on the head SHA from a poster job, proven by a non-LLM probe persona on fixture PRs (c1 part: verdict chain, identity and plan-PR routing; T4.2 c8 shell half, c9 identity and allowlist, c12; rec-5041 part 1; audit WP-12; after PLAN-persona-verdict-credential, PLAN-scout-input-fingerprint and PLAN-persona-trigger-policy)"
            - "PLAN-persona-verdict-wake -- the value-free, idempotent wake per (head SHA, persona) and its docs/contracts/git-ops.yaml wake_signals row (c1's WAKE leg; after PLAN-persona-verdict-chain)"
            - "PLAN-persona-verdict-override -- the override workflow waiting in a reviewer-gated Environment, the run's shape and the event that re-runs the verdict job (c6; after PLAN-persona-verdict-chain; before the decision_scout add)"
            - "PLAN-persona-verdict-egress -- the shell and container egress default-deny with a red fixture for each leg, then the verdict job's first assumption of the persona-verdict role and first key read (the inference credential smoke in CI, rec-5166), the rest of rec-5041, and Decision 263 clause 4's ports.yaml coupling and telemetry-writer principal records (c7; c1's credential leg; after PLAN-persona-verdict-chain and PLAN-persona-image-channel)"
            - "PLAN-persona-verdict-fixture-run -- the probe persona replaced by the digest-pinned image and the run_persona entrypoint, and a fixture persona run through run_image on local_container and through the chain on a fixture PR, with the injection case (c3; T4.2 c8's image clause; after PLAN-run-persona-litellm-backend, PLAN-persona-image-channel, PLAN-persona-verdict-wake and PLAN-persona-verdict-egress)"
            - "PLAN-persona-verdict-rescout -- c4's verdict-chain legs: the per-push fingerprint recompute, 're-scout required', and the push-to-main re-scout of open plan PRs whose cited Decisions or north-star.yaml changed (c4; rec-5103; rec-4946; after PLAN-persona-verdict-fixture-run)"
