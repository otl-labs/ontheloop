schema_version: 1
slug: persona-verdict-container-egress
tldr: 'Container egress (rec-5549), per your 2026-11-23 rulings and ''write the plan'': the persona container runs only through a fixed root launcher, on an internal network whose one reachable port is a non-root host proxy with a fixed upstream that adds the key, so the container never holds a key or picks a destination. Proven keyless first; rec-5550 re-runs the same red fixture with the key. Decision 263 gets a dated Update: the key goes to the proxy, not the persona process.'
blocks:
- id: roadmap-t4-32-c7-container
  file: docs/ROADMAP-PLATFORM.yaml
  before: |
    The PLACEMENT ruling stands: the floor changes nothing before the filter, and an AWS-placed job still stops as UNSUPPORTED_PLACEMENT]"
  after: |
    The PLACEMENT ruling stands: the floor changes nothing before the filter, and an AWS-placed job still stops as UNSUPPORTED_PLACEMENT] [Amendment {{DATE}}, PLAN-persona-verdict-container-egress, rec-5549, the operator's 2026-11-23 rulings: CONTAINER -- a covered job runs the digest-pinned image only through one fixed root launcher. Its egress floor leaves the container services running with the Docker socket open to root alone, set by the services' own unit files, which the filter's agent never rewrites; it pulls the image by digest before any step the runner user controls; and its sudo rule lets the runner user run that launcher and nothing else. The launcher is a root-owned, hash-checked copy that takes no path, network, engine, image or entrypoint from its caller. The container sits on an internal Docker network with no route out and no IPv6, gets no answer for any name, and can reach one host port only: a key-adding proxy, a host process under its own non-root user bound to that network's gateway address, with one fixed upstream, the routed tier's provider, to which it opens TLS itself and adds the key. So the container never holds a key and cannot choose a destination, and the proxy's own traffic stays under the filter, the floor and its exit hook. Within one run the proxy does not fail over to the other provider; the escape hatch is a re-run on the fallback role. For such a job this replaces the FLOOR text's stopping of containers, and the launcher is the only command sudo allows. ORDER -- the container leg's red fixture is first proven on main by a job that holds no credential, with a control job showing each refusal is the control's; the plan whose job first runs the image while holding a key (rec-5550) re-runs the identical fixture in that job before its key read and as its last step, and that re-run proves the container leg; until it does, no persona-verdict job that holds id-token: write runs a container. The launcher, the proxy, the floor's container variant and the sudo rule live in files an agent can merge, and the custody of the inference keys (Decision 263) rests on them: the residual Decision 273 clause 5 names, extended to those keys]"
- id: decision-263-update-proxy
  file: docs/DECISIONS.md
  before: |
    > **Update (2026-11-17):** "The verdict-jobs plan" in clause 4 and the Coverage line reads as the PLAN-persona-verdict-* plans of T4.32's decomposition_hints. PLAN-persona-verdict-egress records clause 4's coupling as ports.yaml PC-12, and the telemetry writer principal registry (docs/contracts/telemetry-writer-principals.yaml, rec-4420) holds this role's principal row. PLAN-persona-verdict-first-key-read is to prove the live assume and decryption under the role, and that a job holding id-token: write without the Environment is refused; a pull_request job's refusal stays with the fixture run (T4.32 c3). The verdict App's key is to be read by a separate role in its own Environment under PLAN-persona-verdict-app-grant's own Decision (the operator's 2026-11-17 ruling), so this role's grant list does not change.
  after: |
    > **Update (2026-11-17):** "The verdict-jobs plan" in clause 4 and the Coverage line reads as the PLAN-persona-verdict-* plans of T4.32's decomposition_hints. PLAN-persona-verdict-egress records clause 4's coupling as ports.yaml PC-12, and the telemetry writer principal registry (docs/contracts/telemetry-writer-principals.yaml, rec-4420) holds this role's principal row. PLAN-persona-verdict-first-key-read is to prove the live assume and decryption under the role, and that a job holding id-token: write without the Environment is refused; a pull_request job's refusal stays with the fixture run (T4.32 c3). The verdict App's key is to be read by a separate role in its own Environment under PLAN-persona-verdict-app-grant's own Decision (the operator's 2026-11-17 ruling), so this role's grant list does not change.

    > **Update ({{DATE}}):** On a host that runs the persona image in a container through the fixed root launcher (PLAN-persona-verdict-container-egress, rec-5549, the operator's 2026-11-23 ruling), clause 4's "hands the values to the persona process" reads as: the workflow shell hands the values to a key-adding host proxy, which adds the key to each call it forwards to the routed provider, and the persona process receives only <PREFIX>_API_BASE naming that proxy and a fixed non-secret placeholder under the key variable. The persona process never holds a key, and the litellm adapter still assumes no AWS identity. ports.yaml PC-12 records that every compute host is to keep the key out of the persona process; the Fargate host's plan (T4.15, rec-5555) and the local_container host's key-out mode (rec-5556) choose how, and until rec-5556 lands local_container still passes the key into its container.
