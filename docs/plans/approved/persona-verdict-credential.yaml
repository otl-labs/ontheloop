      ## Decision {{N}}: The verdict personas' GitHub jobs read their inference keys from SSM under one role that only main's persona-verdict.yml in the persona-verdict Environment can assume -- an accepted exception to the Actions-secret CI home (Decided)

      ```yaml
      number: {{N}}
      status: Decided
      decided_date: "{{DATE}}"
      kind:
        value: mechanism
        justification: >-
          Every clause says how a credential reaches a job: which role, what it may read and where the key lives. No gate,
          data commitment or direction moves. Undone, the verdict jobs would take their keys from Actions secrets.
      amends: []
      significance:
        value: numbered_decision
        justification: >-
          Durable and reversal-relevant: a standing exception to Decision 224 clause 2's CI home, which two
          project-configuration rows name as their owning_item, and a new credential path into the inference keys. Not a
          contract note: project-configuration.yaml carries rows, never the rule, and an accepted row must name a
          Decision. Not amendment_forms: no clause of Decision 224 or 237 changes.
      ```

      **Status:** Decided
      **Date:** {{DATE}}
      **Warehouse ID:** dec-{{N}} (per Decision 84 backfill)

      **Problem:** The three verdict personas will run as GitHub Actions jobs (T4.32) and need the DeepSeek key and the Anthropic fallback key. Decision 224 clause 2 homes a CI secret in a GitHub Actions secret, but this repository already holds both keys as SSM SecureString parameters (Decision 237). A second copy in GitHub would be a second home to rotate, set by hand, whose reads no AWS log records.

      **Decision:**
      1. Delivery. In this repository the verdict jobs read the two keys with ssm:GetParameter from /secret/agent-platform-deepseek-api-key and /secret/agent-platform-anthropic-api-key under the role agent-platform-github-ci-persona-verdict. No Actions or Environment secret holds either key.
      2. Binding. The role carries the apply boundary (Decision 144 cl.3) and one trust statement, StringEquals only: the audience, the persona-verdict Environment's subject in each repository subject form, and job_workflow_ref equal to persona-verdict.yml at refs/heads/main (the Decision 238 shape). The Environment admits main only, has no reviewers so the jobs run unattended, allows no admin bypass and is never destroyed. A pull_request job, another workflow, or the file on another branch cannot assume the role. Its grants are the two key parameters by literal ARN (Decision 237 cl.2), a URL-only invoke of the production telemetry writer (Decision 213) and a read of that writer's URL parameter, nothing else. The other declared reader of the two keys is PlatformDev, for the credential smoke test.
      3. Exception, not amendment. ports.run_persona.litellm.api_key.primary and .warm_fetched_escape_hatch record this read as accepted, owning_item this Decision. On The Loop's ci home for adopters stays actions_secret.
      4. Edge. The workflow shell reads the parameters and hands the values to the persona process; the litellm adapter assumes no AWS identity (Decision 212 cl.3). The verdict-jobs plan records that coupling in ports.yaml and adds the role to the telemetry writer contract's principals.
      5. Changes. A later trust edit on the role is an admin split-apply (Decision 223 cl.4, Decision 238 cl.6). A rename or transfer pre-stages the new job_workflow_ref value additively before the move (Decision 172 cl.2).

      **Rationale:** One home per value: one rotation, CloudTrail records every read, and GitHub never holds a copy. A dedicated role keeps the keys away from every role that runs pull-request or agent-branch code. Rejected: an Environment secret (a second home, set by hand, with no read log); granting the reads to github_ci_branch (it runs unreviewed agent branches); one key per persona (the split that matters is per consumer, CI against development; revisit when each persona gets its own job and role, or when per-persona spend caps are wanted).

      **Coverage (Decision 181 cl.2):** cl.1 and cl.2 -- tests/checks/iam_tf/test_persona_verdict_role.py (the trust shape, the exact grants, the two keys' only readers, the Environment's shape and that only persona-verdict.yml may name it) and validate_secret_parameter_grants; cl.3 -- validate_project_configuration; cl.4 -- the verdict-jobs plan, a residual until it lands. The live assume, a pull_request job's refusal and decryption under the role are proved by that plan's fixture run (T4.32 c3) and are unproven until then.

      ```yaml reversal-conditions
      decision: {{N}}
      review_by: 2027-05-31
      on_trigger: "re-decide via /plan"
      conditions:
        - id: sit-hosts-verdict-jobs
          kind: manual
          description: "SIT's account gets its own CI roles and keys (Decision 252, rec-5027): re-decide which account's role and parameters the verdict jobs read."
        - id: actions-secret-needed
          kind: manual
          description: "The verdict jobs must run where no AWS role can be assumed: re-decide clause 1."
        - id: per-persona-keys-wanted
          kind: manual
          description: "Per-persona spend caps or revocation are wanted: re-decide clause 1's one key per provider."
        - id: trust-claims-change
          kind: manual
          description: "GitHub changes the environment or job_workflow_ref claims under workflow_run, or AWS stops evaluating job_workflow_ref: re-decide clause 2."
      ```

      **Related:** Decisions 144, 172, 205, 212, 213, 223, 224, 237, 238, 248, 252; T4.32.

