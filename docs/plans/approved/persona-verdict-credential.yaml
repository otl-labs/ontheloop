schema_version: 1
slug: persona-verdict-credential
tldr: >-
  Records how the verdict personas' GitHub jobs get their inference keys: one dedicated AWS role that only main's
  persona-verdict.yml, running in the protected persona-verdict Environment, can assume. It reads the DeepSeek and
  Anthropic keys straight from their SSM parameters and writes telemetry, nothing else; GitHub never holds a copy. A new
  Decision states this as an accepted exception to the Actions-secret CI home, the two key rows point to it, and one
  simulate-fixture note is corrected.
