schema_version: 1
slug: persona-verdict-egress-floor
tldr: 'Egress floor (rec-5362), per your 2026-11-23 ''write the plan'': the filter leaves Azure''s DNS/host address, the metadata address, private ranges and IPv6 open to every user, and on a mid-job failure drops its rules. A pinned root step now blocks those for job steps in a table the filter never clears, takes sudo and containers itself, and makes the filter''s exit cut all job traffic (the job ends lost, not open; about a second before exit stays open). The results-store wildcard stays a residual: its accounts share Azure storage hosts. SA-16 is rewritten to fit the byte cap.'
blocks:
- id: roadmap-t4-32-c7-floor
  file: docs/ROADMAP-PLATFORM.yaml
  before: |
    An automatic re-run, a watch on the share of jobs GitHub places on AWS and the cause given to the vendor belong to rec-5455]"
  after: |
    An automatic re-run, a watch on the share of jobs GitHub places on AWS and the cause given to the vendor belong to rec-5455] [Amendment {{DATE}}, PLAN-persona-verdict-egress-floor, rec-5362, the operator's 2026-11-23 ruling: FLOOR -- every covered job turns off the filter's own sudo and container switch and runs, right after the filter and its checkouts and before its self-check, one pinned root step, the egress floor, that blocks for every user but root Azure's host address 168.63.129.16, 169.254.0.0/16 (the instance metadata address), the private ranges 10/8, 172.16/12 and 192.168/16, and all IPv6 but loopback, in a rule table the filter's agent never clears, then revokes sudo with a rule the agent cannot restore and stops containers. Job steps run as the runner user, so the AZURE HOST ADDRESSES residual is closed for them; root services such as Azure's VM agent keep those addresses. FAIL-CLOSED -- the same step makes the agent's exit, which follows any mid-job rule removal, block all traffic but loopback of every user but root for the rest of the job, and masks the container services so that the agent's revert cannot restart them, so such a job ends failed or lost instead of open; the second or so between the agent's rule removal and its exit, in which an unlisted raw address can be reached, is a named accepted residual whose fix is the vendor's (block mode failing closed). Every covered job's last step re-runs the self-check whatever happened before it; this replaces the FAIL-OPEN removal residual, and keyless probe jobs show a simulated mid-job removal cut off with the exit hook and visibly open without it. RESULTS STORE -- the results-store wildcard stays a named accepted residual on corrected grounds: the filter allows by resolved address and GitHub's results-store accounts sit on Azure storage hosts shared with other accounts, so naming the accounts exactly would not close it; its exposure equals that of GitHub's own hosts and a key's custody is its guard. The floor, its exit hook and the last self-check live in files an agent can merge, the residual Decision 273 clause 5 names. The PLACEMENT ruling stands: the floor changes nothing before the filter, and an AWS-placed job still stops as UNSUPPORTED_PLACEMENT]"
