- id: roadmap-t4-32-rationale
  file: docs/ROADMAP-PLATFORM.yaml
  before: |2
          rationale: "Eight independently testable plans; the transport, credential, fingerprint and trigger-policy plans may run in parallel once T4.10a is in_progress. The gate-consumer plan runs beside the backend, image and verdict-jobs plans once the transport has landed; it binds before any add step, as this item's completion edge to T4.28-T4.30 requires, and the add plans write their flag-conditional text against its rows."
  after: |2
          rationale: "Independently testable plans; the transport, credential, fingerprint and trigger-policy plans may run in parallel once T4.10a is in_progress. The gate-consumer plan runs beside the backend, image and PLAN-persona-verdict-* plans once the transport has landed; it binds before any add step, as this item's completion edge to T4.28-T4.30 requires, and the add plans write their flag-conditional text against its rows."
- id: roadmap-t4-2-umbrella-hint
  file: docs/ROADMAP-PLATFORM.yaml
  before: |2
            - "Per Decision 229 each persona is its own child item owning its own atomic plans, on the shared T4.32 foundation (the LiteLLM transport precursor lands under it first): T4.28 code_reviewer, T4.30 decision_scout, T4.29 plan_critic, T4.15 implement_agent, T4.31 plan_agent. PLAN-llm-client-litellm-transport and PLAN-persona-verdict-jobs are T4.32's atomic plans now, so each slug resolves to one parent [Amendment 2026-11-09, PLAN-verdict-persona-roadmap-regrounding, rec-4497: PLAN-persona-plan-agent is T4.31's atomic plan and PLAN-persona-implement-agent T4.15's, so this umbrella heads no persona plan]"
  after: |2
            - "Per Decision 229 each persona is its own child item owning its own atomic plans, on the shared T4.32 foundation (the LiteLLM transport precursor lands under it first): T4.28 code_reviewer, T4.30 decision_scout, T4.29 plan_critic, T4.15 implement_agent, T4.31 plan_agent. PLAN-llm-client-litellm-transport and the PLAN-persona-verdict-* plans are T4.32's atomic plans now, so each slug resolves to one parent [Amendment 2026-11-09, PLAN-verdict-persona-roadmap-regrounding, rec-4497: PLAN-persona-plan-agent is T4.31's atomic plan and PLAN-persona-implement-agent T4.15's, so this umbrella heads no persona plan]"
- id: decision-263-update
  file: docs/DECISIONS.md
  before: |
    **Related:** Decisions 144, 172, 205, 212, 213, 223, 224, 237, 238, 248, 252; T4.32.
  after: |
    **Related:** Decisions 144, 172, 205, 212, 213, 223, 224, 237, 238, 248, 252; T4.32.

    > **Update ({{DATE}}):** "The verdict-jobs plan" in clause 4 and the Coverage line reads as the PLAN-persona-verdict-* plans of T4.32's decomposition_hints. PLAN-persona-verdict-egress records clause 4's coupling as ports.yaml PC-12, and the telemetry writer principal registry (docs/contracts/telemetry-writer-principals.yaml, rec-4420) holds this role's principal row. PLAN-persona-verdict-first-key-read is to prove the live assume and decryption under the role, and that a job holding id-token: write without the Environment is refused; a pull_request job's refusal stays with the fixture run (T4.32 c3). The verdict App's key is to be read by a separate role in its own Environment under PLAN-persona-verdict-app-grant's own Decision (the operator's 2026-11-17 ruling), so this role's grant list does not change.
