schema_version: 1
slug: persona-verdict-egress
tldr: 'Egress wording for the verdict jobs (T4.32 c7): adds the hosts the runner itself needs, names the blocking mechanisms
  (harden-runner on the shell, an internal network plus proxy in the container) and orders them: the shell block is proven
  before any job takes the persona role; the container block when the image first runs with a key. The egress hint splits
  into five plans. Decision 263 gets a dated note. ports.yaml records the chain''s GitHub assumptions and the key handoff.'
blocks:
- id: roadmap-t4-32-c7
  file: docs/ROADMAP-PLATFORM.yaml
  before: |2
            text: "EGRESS (rec-4947) -- before the verdict job's first secret-bearing run, the shell and the digest-pinned image allow outbound connections only to the endpoints a run needs (the configured LLM providers, the AWS endpoints of c1's credential leg, the telemetry writer, the image registry and the GitHub API), denied by default from both the shell and the container, with a red fixture for each; this is the runner's network egress, distinct from the catalog egress of Decisions 88 and 214"
  after: |2
            text: "EGRESS (rec-4947) -- before the verdict job's first secret-bearing run, the shell and the digest-pinned image allow outbound connections only to the endpoints a run needs (the configured LLM providers, the AWS endpoints of c1's credential leg, the telemetry writer, the image registry and the GitHub API), denied by default from both the shell and the container, with a red fixture for each; this is the runner's network egress, distinct from the catalog egress of Decisions 88 and 214 [Amendment {{DATE}}, PLAN-persona-verdict-egress, rec-5041 parts 2-3, the operator's 2026-11-17 ruling on the order of the legs: ENDPOINTS -- a run's endpoints also include GitHub's OIDC token endpoint, which c1's role assumption calls first, and the Actions artifact, cache, results and action-download services the runner itself needs; each job's list lives in one repository file, and a wildcard host (such as the artifact store's) is a named accepted residual only in a job that uploads or downloads artifacts. The telemetry writer's host is never committed (Decision 255 clause 1, Decision 101) and never matched by a wildcard: a job that writes telemetry takes it into its list from a source outside the public file, which the plan that first writes telemetry from a verdict job names. The filter's own vendor endpoint, which the filter reaches in every mode, is a named accepted residual, and PLAN-persona-verdict-shell-deny records what it sends and who can read it. MECHANISMS -- on the shell, a SHA-pinned egress filter action in block mode (step-security/harden-runner) is the first step of every job in .github/workflows/persona-verdict*.yml that holds id-token: write or reads a secret other than its GITHUB_TOKEN (an Environment that only gates on a reviewer, as persona-verdict-override.yml's approve job does, is not covered), with sudo and containers disabled in such a job that runs no container; in the container, an internal Docker network whose only route out is an allowlisting proxy. ORDER -- the shell leg's red fixture, on a job that holds no credential, is proven on main before any job assumes c1's role, and the first job to assume it (the inference credential smoke in CI, rec-5166) runs no container; the container leg's red fixture is proven by the plan whose job first runs the digest-pinned image while holding a key (PLAN-persona-verdict-fixture-run), and until then no persona-verdict job that holds id-token: write runs a container. This criterion is met only when both legs are proven]"
- id: roadmap-t4-32-egress-hints
  file: docs/ROADMAP-PLATFORM.yaml
  before: |2
            - "PLAN-persona-verdict-egress -- the shell and container egress default-deny with a red fixture for each leg, then the verdict job's first assumption of the persona-verdict role and first key read (the inference credential smoke in CI, rec-5166), the rest of rec-5041, and Decision 263 clause 4's ports.yaml coupling and telemetry-writer principal records (c7; c1's credential leg; after PLAN-persona-verdict-chain and PLAN-persona-image-channel)"
  after: |2
            - "PLAN-persona-verdict-egress -- c7's approved wording (the endpoints the runner needs, the shell and container mechanisms and the order of the legs), Decision 263's dated note naming the plans that discharge its clause 4 and Coverage line, and the verdict chain shell's ports.yaml records (rec-5249; Decision 263 clause 4's coupling) (c7; after PLAN-persona-verdict-chain)"
            - "PLAN-persona-verdict-shell-deny -- c7's shell leg: each keyed job's endpoint list in one repository file, a static check that every job in .github/workflows/persona-verdict*.yml holding id-token: write or reading a secret other than its GITHUB_TOKEN starts with the block-mode filter whose list equals that file's, and a credential-free egress-probe job on fixture PRs whose red fixture shows a listed host reached and an unlisted host, a raw-IP connect and an outside resolver refused (c7; rec-5041 part 3; after PLAN-persona-verdict-egress)"
            - "PLAN-persona-verdict-first-key-read -- the first assumption of the persona-verdict role: a smoke job on fixture PRs in the persona-verdict Environment, behind the block filter and the pull_request-event conjunct, runs the inference credential smoke (rec-5166), and a sibling job holding id-token: write without the Environment shows the role refuses it; the LLM-step detector or the shape check covers the smoke; rec-5041's acceptance is tightened to node ids, its container leg moving to PLAN-persona-verdict-fixture-run, before its Resolves trailer (c1's credential leg; rec-5041 parts 2-3; after PLAN-persona-verdict-shell-deny is proven on main)"
            - "PLAN-persona-verdict-app-grant -- the verdict GitHub App's key custody: the operator creates the App (checks: write only) and puts its private key in an SSM /secret/ parameter (Decision 237); a separate Environment and role, used only by the post job, read it by literal ARN, so no job that runs a model can reach it (the operator's 2026-11-17 ruling); its own Decision records the key custody in the Decision 267 clause 5 form, and a dated Update on Decision 271 re-points the App's ownership from PLAN-persona-verdict-egress to this plan and PLAN-persona-verdict-app-post (rec-5351) (T4.2 c9; after PLAN-persona-check-origin's build)"
            - "PLAN-persona-verdict-app-post -- the post job mints an App installation token under that role and posts every persona-verdict check run with it instead of GITHUB_TOKEN; scripts/personas/override.py's origin rule and its check-suite test move to the gates.verdict_app.app_id pin; the operator sets that row by a GitHub-UI merge (T4.2 c9; after PLAN-persona-verdict-first-key-read, PLAN-persona-verdict-app-grant and PLAN-persona-check-origin's build)"
