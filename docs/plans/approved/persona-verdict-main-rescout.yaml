schema_version: 1
slug: persona-verdict-main-rescout
tldr: >-
  A new Decision: an agent merge of a PR is refused when a plan the re-scout barrier examines on it has a different
  scout-input fingerprint on the PR head than on main merged with the PR. It compares by content, fails closed and has
  no agent override (amends Decision 83). Approved but unbuilt wording in other plans is not part of the comparison;
  rec-5673 surfaces those conflicts at approval. Dated notes on Decisions 245 and 83 point to it.
