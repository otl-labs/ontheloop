    ## Decision {{N}}: An agent merge of a plan is refused when main has changed what its decision scout read -- compared by the scout-input fingerprint on the PR head and on main with the PR's changes, fail closed, no agent override (amends Decision 83) (Decided)

    ```yaml
    number: {{N}}
    status: Decided
    decided_date: "{{DATE}}"
    kind:
      value: direction
      justification: >-
        Clause 3 makes a human gate: a refusal only agents face, with no agent override and an operator merge as the
        release valve, narrowing Decision 83's commitment to autonomous merge again; undone, an agent merges a plan on a
        scout verdict computed against Decisions main has since changed.
    amends: [83]
    significance:
      value: numbered_decision
      justification: >-
        Durable, reversal-relevant: a standing, no-override refusal binding every merging session, in the Decision 245
        clause 3 form (T4.32 c4). Not a git-ops.yaml note: a contract records the gate's shape, not the authority to
        refuse a tool call (Decision 203's rejected home). Not amendment_forms on Decision 245: it adds a predicate with
        its own inputs and skip rule, as Decision 264 did.
    ```

    **Status:** Decided
    **Date:** {{DATE}}
    **Warehouse ID:** dec-{{N}} (per Decision 84 backfill)

    **Problem:** A plan's decision-scout verdict holds only for the inputs it read: the Decisions the plan cites or
    amends, the roadmap rows its scope meets, north-star and its approved wording, which the scout-input fingerprint
    records (Decision 229 cl.4, T4.32 c4). The re-scout barrier compares that record with the PR's own tree, so a
    Decision amended on main after the PR's last CI run goes unseen, and an agent merges a plan scouted against text that
    no longer holds. Refusing any plan PR while main changed a file the fingerprint reads was rejected: replayed over the
    80 plans merged in the week to 2026-11-26, that rule fires 4 to 8 times as often as the fingerprint moves, and on
    build PRs that never re-scout, so its cost grows with main's throughput.

    **Intent:** An agent merges a plan only on a scout verdict whose inputs still hold on main, at a cost that grows with
    change to what the plan cites, not with main's throughput.

    **Decision:**
    1. **Refusal.** After Decision 245's overlap rule clears, the merge gate refuses mcp__github__merge_pull_request and
       mcp__github__enable_pr_auto_merge on this repository when a plan the re-scout barrier examines on the PR (a plan
       file the PR adds, or changes so that the plan's fingerprint moves) has a different scout-input fingerprint on the
       PR head than on origin/main merged with the PR. The refusal names the plan and the inputs that moved; the remedy
       is Decision 245's branch update, after which the re-scout barrier or the verdict carry asks for a re-scout.
    2. **By content.** The comparison is scripts.roadmap.plan_fingerprint's, the single extractor; the gate never
       restates a plan's inputs, and the files it materialises are held equal to the extractor's reads by a test. A main
       change that leaves the fingerprint equal never refuses, and the gate skips the computation when
       main changed none of the files the fingerprint reads. Decision 254 cl.8's narrowing of Decision 245's overlap rule
       does not narrow this predicate.
    3. **Fail closed, no override (amends Decision 83).** An unreadable plan, sidecar or tree, a failed git read, a
       fingerprint error or a timeout refuses, and no agent override exists (the Decision 203 cl.3 pattern). This narrows
       Decision 83's non-wedging property for agent merges of plans only; an operator merge stays the release valve.
    4. **Current main, not pending intent.** The comparison reads main as it is. Wording approved in another plan's
       sidecar but not yet built is intent, not state: a conflict between approved intents is surfaced to humans at
       approval (rec-5673), never folded into this comparison.
    5. **Coverage (Decision 181 cl.2).** Clauses 1-3: the gate and its tests (PLAN-persona-verdict-main-rescout).
       Residuals: GitHub UI merges (rec-4624); a merged plan whose cited Decision moves before its build (rec-5671);
       approved but unbuilt edits to a cited Decision (rec-5673); a change to an approved-text sidecar alone, which the
       barrier does not examine (rec-5671's build-start check); the seconds between the gate's fetch and the merge.

    **Options considered:** a push-to-main sweep that re-scouts or marks every open plan PR -- rejected: the verdict
    chain judges one PR per run, and a sweep wakes build PRs for drift that predates them; a file rule -- rejected: its
    churn grows with main's throughput (Problem); comparing against main with approved but unbuilt sidecar wording
    applied -- rejected: it bakes intent that may never land into every verdict and fails closed on any sidecar that no
    longer applies; splitting DECISIONS.md or moving the roadmap into the work-item store first -- rejected: both are
    post-MVP (Decision 196 cl.8, Decision 197 cl.8), and the fingerprint already hashes per Decision, so they refine this
    rule through plan_fingerprint's tree reader without changing it.

    ```yaml reversal-conditions
    decision: {{N}}
    review_by: 2027-05-26
    on_trigger: "re-decide via /plan; never add an agent override"
    conditions:
      - id: empty-rescouts
        kind: manual
        description: "In 30 days, more than ten refusals are followed by a re-scout that changes neither the verdict nor the CITE list: re-decide what the fingerprint hashes (roadmap bookkeeping is the known coarseness)."
      - id: deadline-pressure
        kind: manual
        description: "The predicate times out on a real agent merge: re-decide where the comparison runs (rec-4624's required check)."
      - id: native-gate-available
        kind: manual
        description: "rec-4624 lets the ruleset require a check that runs this comparison, or a merge identity without the admin bypass lands (rec-2827): retire the clauses GitHub then enforces."
    ```

    **Related:** Decisions 83, 181, 196, 197, 203, 205, 229, 245, 254, 264, 271; T4.32; rec-2827, rec-4624, rec-5654,
    rec-5671, rec-5673.

