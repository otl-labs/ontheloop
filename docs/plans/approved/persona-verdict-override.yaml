schema_version: 1
slug: persona-verdict-override
tldr: >-
  Lets the operator overrule a failing decision-scout or plan-critique check: an override run for one PR head, check
  run and set of finding ids waits in a new reviewer-gated Environment; once the operator approves it, the verdict job
  posts a new success check naming the approver, the ids and the run, without re-running the persona. It marks T4.32
  c6 met and leaves Decision 262's admin bypass as it is.
