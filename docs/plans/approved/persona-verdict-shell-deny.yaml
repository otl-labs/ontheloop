schema_version: 1
slug: persona-verdict-shell-deny
tldr: 'Shell egress block for the verdict jobs (T4.32 c7 shell leg): the egress filter (harden-runner) itself allows all of
  GitHub in every job, from a list its vendor serves; per your 2026-11-18 card that is a named residual, watched by a
  control job. The filter can pass while blocking nothing, so every keyed job runs a self-check first. Telemetry is off;
  the vendor still sees repository, run id and job name. ports.yaml records the shell''s dependence on the filter.'
blocks:
- id: roadmap-t4-32-c7-shell-leg
  file: docs/ROADMAP-PLATFORM.yaml
  before: |2
    until then no persona-verdict job that holds id-token: write runs a container. This criterion is met only when both legs are proven]"
  after: |2
    until then no persona-verdict job that holds id-token: write runs a container. This criterion is met only when both legs are proven] [Amendment {{DATE}}, PLAN-persona-verdict-shell-deny, the operator's 2026-11-18 ruling: FILTER-SUPPLIED HOSTS -- in block mode the shell filter itself allows GitHub's own hosts (github.com and its subdomains, githubapp.com, ghcr.io, and GitHub's content, Actions and results-store hosts, the last by wildcard) in every job, from a list its vendor serves when the job starts. This is a named accepted residual in every covered job, not only in one that moves artifacts: GitHub's hosts accept writes under any account's token, so the shell filter's value is refusing every other host and every raw IP, and a key's protection against a GitHub-hosted exit is its custody. config/persona_verdict_egress.yaml holds each covered job's list and a snapshot of the filter-supplied set, and a keyless control job fails when the vendor's list is wider than that snapshot. FAIL-OPEN -- the filter step can pass while blocking nothing, so every covered job runs a self-check that an unlisted host, a raw-IP connect and sudo are refused before any step that can reach a credential. VENDOR -- telemetry is off in every covered job; the vendor still receives the repository, run id and job name when the filter starts, which are public for this public repository, and an adopter's private repository is re-decided before the shell reaches it (rec-5357). The public job log prints every host on a covered job's list, so a host that must stay unpublished is listed only after a decision on where it lives (rec-5358)]"
