schema_version: 1
slug: persona-verdict-shell-deny
tldr: 'Shell egress block for the verdict jobs (T4.32 c7 shell leg): the egress filter (harden-runner) allows all of GitHub
  in every job, from a list its vendor serves, and leaves Azure''s host addresses open; per your 2026-11-18 cards both
  are named residuals. The filter can pass while blocking nothing or drop its rules mid-job, so every keyed job runs a self-check
  first. Telemetry is off; the vendor still sees repository, run id and job name. ports.yaml records the shell''s dependence
  on the filter.'
