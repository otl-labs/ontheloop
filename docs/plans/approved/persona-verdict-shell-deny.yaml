schema_version: 1
slug: persona-verdict-shell-deny
tldr: 'Shell egress block for the verdict jobs (T4.32 c7 shell leg): the egress filter (harden-runner) allows all of GitHub,
  Azure storage under GitHub''s name prefix and Azure''s own addresses in every job; per your 2026-11-18 cards these are named
  residuals. The filter can pass while blocking nothing or swap its agent, so every keyed job runs a self-check first; a mid-job
  rule drop stays a residual. Telemetry is off; the vendor still sees repository, run id and job name. ports.yaml records
  it as SA-16 (five older log rows shortened to fit its size limit); the image test finds its row by content.'
blocks:
- id: roadmap-t4-32-c7-shell-leg
  file: docs/ROADMAP-PLATFORM.yaml
  before: |2
    until then no persona-verdict job that holds id-token: write runs a container. This criterion is met only when both legs are proven]"
  after: |2
    until then no persona-verdict job that holds id-token: write runs a container. This criterion is met only when both legs are proven] [Amendment {{DATE}}, PLAN-persona-verdict-shell-deny, the operator's 2026-11-18 rulings: FILTER-SUPPLIED HOSTS -- in block mode the shell filter itself allows GitHub's own hosts (github.com and its subdomains, githubapp.com, ghcr.io, and GitHub's content, Actions and results-store hosts, the last by wildcard) in every job, from a list its vendor serves when the job starts. This is a named accepted residual in every covered job, not only in one that moves artifacts. The results-store wildcard is a plain name-prefix match, so it also admits an Azure storage account a third party registers under that prefix. GitHub's hosts accept writes under any account's token and such a store under its owner's, so the shell filter's value is refusing every other host and every public raw IP outside the Azure host addresses below, and a key's protection against a GitHub-hosted exit is its custody. config/persona_verdict_egress.yaml holds each covered job's list and a snapshot of the filter-supplied set, and a keyless control job, run whenever the list, the probe or a fixture changes, fails when the vendor's list is wider than that snapshot. AZURE HOST ADDRESSES -- the filter also leaves open TCP to Azure's host address 168.63.129.16, Azure's DNS resolver, so a slow DNS tunnel may stay possible; TCP to the instance metadata address 169.254.169.254; all traffic to the private ranges 10/8, 172.16/12 and 192.168/16; and IPv6, which it does not filter and hosted runners do not route today. These Azure openings and the storage wildcard are named accepted residuals: the probe reports the DNS one each run, a key's custody is the guard, and rec-5362 owns closing or watching them before a covered job holds more than the short-lived verdict role. IPv6 is asserted refused in the probe and every self-check, so a runner that gains an IPv6 route turns them red. FAIL-OPEN -- the filter step can pass while blocking nothing, and its agent removes every rule and gives sudo back if one of its own processes fails mid-job, so every covered job runs a self-check, before any step that can reach a credential, that an unlisted name gets no real answer and that an unlisted host, a raw-IP connect and sudo are refused; a removal after the self-check is a named accepted residual that rec-5362 owns. VENDOR -- telemetry is off in every covered job; the vendor still receives the repository, run id and job name when the filter starts, which are public for this public repository, and serves the feature flags and blocklist that steer the filter in each run, and its answer at start, or a timeout, picks which of two pinned agent binaries runs (agent v0.18.1, read for this plan, or agent-ebpf, not read), so the self-check also refuses to continue unless the running agent's binary hash equals agent v0.18.1's, and a job under the other binary fails rather than runs; an adopter's private repository is re-decided before the shell reaches it (rec-5357). The public job log prints every host on a covered job's list, so a host that must stay unpublished is listed only after a decision on where it lives (rec-5358)]"
