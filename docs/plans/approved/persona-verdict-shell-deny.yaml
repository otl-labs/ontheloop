  after: |2
    until then no persona-verdict job that holds id-token: write runs a container. This criterion is met only when both legs are proven] [Amendment {{DATE}}, PLAN-persona-verdict-shell-deny, the operator's 2026-11-18 rulings: FILTER-SUPPLIED HOSTS -- in block mode the shell filter itself allows GitHub's own hosts (github.com and its subdomains, githubapp.com, ghcr.io, and GitHub's content, Actions and results-store hosts, the last by wildcard) in every job, from a list its vendor serves when the job starts. This is a named accepted residual in every covered job, not only in one that moves artifacts: GitHub's hosts accept writes under any account's token, so the shell filter's value is refusing every other host and every public raw IP outside the Azure host addresses below, and a key's protection against a GitHub-hosted exit is its custody. config/persona_verdict_egress.yaml holds each covered job's list and a snapshot of the filter-supplied set, and a keyless control job, run whenever the list, the probe or a fixture changes, fails when the vendor's list is wider than that snapshot. AZURE HOST ADDRESSES -- the filter also leaves open TCP to Azure's host address 168.63.129.16, which answers DNS too, so a slow DNS tunnel stays possible; TCP to the instance metadata address 169.254.169.254; all traffic to the private ranges 10/8, 172.16/12 and 192.168/16; and IPv6, which it does not filter and hosted runners do not route today. The Azure openings are named accepted residuals: the probe reports the DNS one each run, a key's custody is the guard, and rec-5362 owns closing or watching them before a covered job holds more than the short-lived verdict role. IPv6 is asserted refused in the probe and every self-check, so a runner that gains an IPv6 route turns them red. FAIL-OPEN -- the filter step can pass while blocking nothing, and its agent removes every rule and gives sudo back if one of its own processes fails mid-job, so every covered job runs a self-check, before any step that can reach a credential, that an unlisted name gets no real answer and that an unlisted host, a raw-IP connect and sudo are refused; a removal after the self-check is a named accepted residual. VENDOR -- telemetry is off in every covered job; the vendor still receives the repository, run id and job name when the filter starts, which are public for this public repository, and serves the feature flags and blocklist that steer the filter in each run; an adopter's private repository is re-decided before the shell reaches it (rec-5357). The public job log prints every host on a covered job's list, so a host that must stay unpublished is listed only after a decision on where it lives (rec-5358)]"
