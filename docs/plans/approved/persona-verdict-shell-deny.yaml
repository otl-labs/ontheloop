  file: docs/contracts/ports.yaml
  before: |2
      - {date: "2026-11-20", semantic_break: false, change_class: field_add, summary: "PLAN-persona-verdict-shell-deny (T4.32 c7 shell leg, Decision 212 cl.3): SA-16 records the verdict shell's reliance on the harden-runner filter and its vendor."}
  after: |2
      - {date: "{{DATE}}", semantic_break: false, change_class: correction, summary: "PLAN-persona-verdict-shell-deny: SA-16 adds the eth0 condition."}
      - {date: "2026-11-20", semantic_break: false, change_class: field_add, summary: "PLAN-persona-verdict-shell-deny (T4.32 c7, Decision 212 cl.3): SA-16 records the shell's reliance on harden-runner."}
- id: ports-sa-16-placement
  file: docs/contracts/ports.yaml
  before: |2
      - {id: SA-16, assumption: "The verdict chain shell's egress deny (config/persona_verdict_egress.yaml) assumes the SHA-pinned step-security/harden-runner and its agent v0.18.1 on ubuntu-latest with sudo at job start, the vendor's GitHub host list and its reachability at setup (it may switch the filter off), the agent alive all job, Azure's host addresses, the private ranges and the results-store wildcard as the only extra openings, no IPv6 route, and a public repository for the free tier; self-hosted, container or non-GitHub runners and private adopters need another mechanism.", location: scripts/personas/, status: open, owning_item: "T4.32:c7"}
  after: |2
      - {id: SA-16, assumption: "The verdict shell's egress deny (config/persona_verdict_egress.yaml) assumes pinned step-security/harden-runner, agent v0.18.1 and eth0 as the default interface (Azure; else the job stops), ubuntu-latest with sudo at start, the vendor's host list reachable at setup, the agent alive all job, Azure host addresses, private ranges and results-store wildcard as the only extra openings, no IPv6 route and a public repo; other runners and private adopters need another way.", location: scripts/personas/, status: open, owning_item: "T4.32:c7"}
