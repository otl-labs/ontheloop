schema_version: 1
slug: persona-verdict-shell-deny
tldr: 'Shell egress filter vs GitHub''s AWS runners: about 1 in 5 hosted jobs now land on AWS, where the vendor''s filter (its rules name a network card eth0) blocks no raw IP. Per your 2026-11-20 call, no local workaround: the self-check also refuses a card not named eth0, so such a job stops as UNSUPPORTED_PLACEMENT before any key and is re-run. The proof is one Azure green run plus one AWS run that stops. The fix is the vendor''s (issue #721). SA-16 names the eth0 condition, shortened to fit ports.yaml''s size cap. Re-runs and an AWS-share watch: rec-5455.'
blocks:
- id: roadmap-t4-32-c7-placement
  file: docs/ROADMAP-PLATFORM.yaml
  before: |2
    The public job log prints every host on a covered job's list, so a host that must stay unpublished is listed only after a decision on where it lives (rec-5358)]"
  after: |2
    The public job log prints every host on a covered job's list, so a host that must stay unpublished is listed only after a decision on where it lives (rec-5358)] [Amendment {{DATE}}, PLAN-persona-verdict-shell-deny Amendment 5, the operator's 2026-11-20 ruling on runner placement: PLACEMENT -- the filter's agent names the network interface eth0 in every rule it writes, so on a hosted runner that GitHub places on AWS, whose interface has another name, it refuses no raw IP while its DNS sinkhole still answers (the vendor's open issue step-security/harden-runner#721 reports the symptom). The self-check therefore also refuses to continue unless the default-route interface is eth0, so a covered job on such a runner stops as UNSUPPORTED_PLACEMENT before any step that can reach a credential and is re-run; the shell leg is proven on an Azure-placed runner, with an AWS-placed run shown to stop. Nothing changes the runner's network before the filter: the fix is the vendor's, and a new pin waits for a release whose rules match the interface that carries the default route. An automatic re-run, a watch on the share of jobs GitHub places on AWS and the cause given to the vendor belong to rec-5455]"
