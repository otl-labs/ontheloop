schema_version: 1
slug: persona-verdict-wake
tldr: >-
  Adds the wake for persona verdicts. After a verdict run posts its check runs, a new job posts one comment on the
  agent PR with a hidden marker per persona not yet woken, so a watching session wakes without polling. The comment
  never carries the verdict. git-ops.yaml gains the row naming it; other wake text is re-wrapped and one probe story cut.
blocks:
- id: gitops-amendment-log
  file: docs/contracts/git-ops.yaml
  before: |2-
    amendment_log:
      - {date: "2026-11-12", semantic_break: true, change_class: field_add, summary: "PLAN-merge-requires-green-checks
  after: |2-
    amendment_log:
      - {date: "{{DATE}}", semantic_break: false, change_class: field_add, summary: "PLAN-persona-verdict-wake (T4.32 c1 WAKE leg): wake_signals gains persona_verdict, the verdict-landed wake comment; coverage_note names the signals without a count; merge_conflict's rec-3874 probe narrative is cut to one clause (the closed rec keeps the detail); four wake_signals entries are re-wrapped, words unchanged, for the line budget."}
      - {date: "2026-11-12", semantic_break: true, change_class: field_add, summary: "PLAN-merge-requires-green-checks
- id: gitops-coverage-note
  file: docs/contracts/git-ops.yaml
  before: |2-
        coverage_note: >-
          Two comment-based signals cover what subscribe_pr_activity cannot deliver natively -- CI
          success, and a merge-conflict transition from a push to main. send_later/trigger calls for
          CI-wait or merge-conflict-wait purposes are out of scope -- both gaps are closed by the two
          signals below, not by polling.
  after: |2-
        coverage_note: >-
          Comment-based signals cover what subscribe_pr_activity cannot deliver natively -- CI success, a merge-conflict
          transition from a push to main, and a persona verdict landing. send_later/trigger calls for these waits are out
          of scope -- the signals below close them, not polling.
- id: gitops-merge-conflict-probe
  file: docs/contracts/git-ops.yaml
  before: |2-
          indefinitely. 2026-09-15 conflict-wake-probe (rec-3874, n=1): a live PR-activity
          subscription held across ~16 minutes of a blocked -> dirty mergeability transition with the
          control holding, and no native wake was observed for that transition (the harness documents
          its own notice as best-effort) -- confirming this sweep is the only reliable conflict path
          and must be retained.
  after: |2-
          indefinitely. 2026-09-15 conflict-wake-probe (rec-3874, n=1): no native wake was observed for a blocked ->
          dirty transition, so this sweep is the only reliable conflict path and must be retained.
- id: gitops-persona-verdict-row
  file: docs/contracts/git-ops.yaml
  before: |2-
          dropdown (Auto mode, if org-enabled); there is no committed-config fix.
        auto_merge_relationship: >-
  after: |2-
          dropdown (Auto mode, if org-enabled); there is no committed-config fix.
        persona_verdict: >-
          persona-verdict.yml's wake job, after its post job, posts one comment per verdict run on a PR whose head ref
          matches a declared branch prefix, with one `<!-- persona-verdict-wake:<head sha>:<route id> -->` marker per (head
          SHA, persona) pair not yet marked (best effort; a run that leaves a route unposted posts a fault wake instead).
          It never carries a verdict: read the persona-verdict/ check runs on that head. Delivery is observed, not proven
          (rec-3335; T4.32 c3).
        auto_merge_relationship: >-
