  file: docs/contracts/overseer-dispatch.yaml
  before: |2
      - date: "2026-09-03"
        semantic_break: false
        change_class: field_add
        summary: >-
          PLAN-step-6b-fork-classification (B2-R4, PDB-03): added
          autonomy_tiers.plan_fork_classification (ports the four-criteria Autonomy-Boundary Policy
          to plan-grain design forks); declared the Step 6b confirmation as a fourth `gate` value
