  after: |2
      - {date: "2026-09-03", semantic_break: false, change_class: field_add, summary: "PLAN-step-6b-fork-classification (B2-R4, PDB-03): added autonomy_tiers.plan_fork_classification (the four-criteria Autonomy-Boundary Policy at plan grain); a fourth GATE_REQUEST gate value with its trampoline_sequence stage, gate_run_id.not_applicable_to carve-out and pending_gates.write_ahead clause; and the corrected dispatch header and gate_run_id.provenance scoping. .claude/commands/plan.md and .claude/skills/planning/SKILL.md are named in applies_to."}
      - {date: "2026-10-18", semantic_break: false, change_class: field_add, summary: "PLAN-red-main-recovery-policy (Decision 226): autonomy_tiers.proceed_with_notice.never_overrides now names the red_overlap verdict instead of any open critical ci_rca rec."}
