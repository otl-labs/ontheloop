    registration_surfaces:
- id: plan-obligations-4
  file: docs/contracts/plan-obligations.yaml
  before: |2
          - label: "ci_rca_taxonomy workflows map row"
            path_template: "config/ci_rca_taxonomy.yaml"
  after: |2
          - label: "ci_rca_taxonomy workflows map row"
            path_template: "config/ci_rca_taxonomy.yaml"

    derived_findings:
      purpose: >-
        Obligations and headroom derived from repo state rather than a path_template. scripts.roadmap.plan_lint computes
        each row from the sources it names, at check time, and refuses a row it has no derivation for. A gating row joins
        validate_plan_scope_closure's verdict for a net-new plan exactly as `requires` does; an advisory row prints in the
        --plan report only. A row gates only when its finding follows from the plan's own fields and committed files;
        anything resting on the network stays advisory.
      rows:
        pre_glob_closure:
          gating: true
          reads: scope[].new_imports, plus the import view validate_pre_glob_closure audits
          finding: >-
            Each gated manifest Entry a declared new import leaves uncovered requires its domain _manifest.py in scope
            (rec-4383). A scoped module that gated Entries reach is listed even with no new_imports declared.
        accounting_baseline_strike:
          gating: true
          reads: config/check_accounting_baseline.yaml and the registry's check-to-module map
          finding: >-
            A Modify row on a baselined check's module requires config/check_accounting_baseline.yaml in scope (Decision
            170 touch-it-fix-it; rec-4383).
        class_d_amendment_entry:
          gating: true
          reads: each Modify docs/contracts/*.yaml row's contract block and amendment_log
          finding: >-
            A Class D contract (class_d shape, with or without an amendment_log yet) needs its row's purpose to name a
            new amendment_log entry, or validate_contract_drift fails the build (rec-4754).
        registry_shard_disposition:
          gating: true
          reads: config/agent/verification_registry/entries/*.yaml node_id and command
          finding: >-
            A Modify or Delete row on a test file a graduated shard names requires that shard in scope (retired by git mv
            to entries/deprecated/; check_id is immutable) or its check_id named in the plan as kept (rec-4754).
        size_headroom:
          gating: false
          reads: config/sloc_budgets.yaml, config/structural_size_budgets.yaml and its classes, config/prose_budgets.yaml
          finding: Per Modify row, the size, limit and headroom; NEAR_CAP when headroom is under 5% of the limit (rec-4751).
        unbuilt_same_file:
          gating: false
          reads: docs/plans/PLAN-*.yaml at schema_version >= 4 with implementation_declared not true, added in the last 30 days
          finding: Each such plan whose scope lists the same file (rec-4752).
        acceptance_decidable:
          gating: false
          reads: the bundled recommendations' acceptance through the ducklake reader (UNREACHABLE when offline)
          finding: An acceptance lint_acceptance_command(require_decidable=True) rejects, which never auto-closes (rec-4754).
        frozen_companions:
          gating: false
          reads: frozen_companions below
          finding: The freeze or count test a scope row's change can break, with the change that breaks it (rec-3545).

    frozen_companions:
      - source: scripts/session/preflight.py
        test: tests/test_session_preflight_decomposition.py
        breaks_when: a top-level preflight report key is added or removed (FROZEN_REPORT_KEYS and its count)
