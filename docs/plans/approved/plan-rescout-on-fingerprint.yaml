schema_version: 1
slug: plan-rescout-on-fingerprint
tldr: /plan now re-runs the decision scout exactly when a plan's scout-input fingerprint changes, or after a BLOCK, instead of on a judged 'material change'. The plan check fails a plan whose last scout round does not match ('re-scout required') or is a BLOCK, accepted or not. A new Decision, noted on Decision 83, makes the operator's admin bypass merge the only way past a BLOCK. The project-alignment contract states the rule; the ledger names the check and what it cannot prove, each with an owner rec.
blocks:
- id: p01-task-sequencing
  file: docs/contracts/project-alignment.yaml
  before: |
    task_sequencing: >-
      decision_scout_recon completes first; alignment_sign_off is requested on the draft refined from its findings, and a
      material change after feedback re-runs the first task.
  after: |
    task_sequencing: >-
      decision_scout_recon completes first; alignment_sign_off is requested on the draft refined from its findings. The
      first task re-runs after a BLOCK pivot and whenever the draft's scout-input fingerprint
      (scripts/roadmap/plan_fingerprint.py) differs from the value the last scout round recorded, checked before
      re-presenting after feedback, before each plan-critique round and after an approved-text sidecar is written; an equal
      value never re-runs it. validate_plan_documents fails a plan whose last scout round does not match ("re-scout
      required"). The rule and its payload are T4.32 c4's and Decision 229 cl.4's; this contract does not restate them.
