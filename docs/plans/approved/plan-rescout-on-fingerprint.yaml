schema_version: 1
slug: plan-rescout-on-fingerprint
tldr: '/plan now re-runs the decision scout exactly when a plan''s scout-input fingerprint changes, or after a BLOCK, instead of on a judged ''material change''. The plan check fails a plan whose last scout round does not match: ''re-scout required''. The project-alignment contract states that rule; the ledger notes for plan cites and the fingerprint now name the check that enforces them and what it still cannot prove, each with an owner rec. Each file gets an amendment-log row.'
blocks:
- id: p01-task-sequencing
  file: docs/contracts/project-alignment.yaml
  before: |
    task_sequencing: >-
      decision_scout_recon completes first; alignment_sign_off is requested on the draft refined from its findings, and a
      material change after feedback re-runs the first task.
  after: |
    task_sequencing: >-
      decision_scout_recon completes first; alignment_sign_off is requested on the draft refined from its findings. The
      first task re-runs after a BLOCK pivot and whenever the draft's scout-input fingerprint
      (scripts/roadmap/plan_fingerprint.py) differs from the value the last scout round recorded, checked before
      re-presenting after feedback, before each plan-critique round and after an approved-text sidecar is written; an equal
      value never re-runs it. validate_plan_documents fails a plan whose last scout round does not match ("re-scout
      required"). The rule and its payload are T4.32 c4's and Decision 229 cl.4's; this contract does not restate them.
- id: p02-contract-version
  file: docs/contracts/project-alignment.yaml
  before: |2
      contract_version: 1
  after: |2
      contract_version: 2
- id: p03-amendment-row
  file: docs/contracts/project-alignment.yaml
  before: |2
      - {date: "2026-10-24", semantic_break: false, change_class: field_add, summary: "Initial authoring (PLAN-project-alignment, rec-3042, rec-3214): the process definition, two tasks, three carriers, autonomy pointer and legacy_labels map."}
  after: |2
      - {date: "2026-10-24", semantic_break: false, change_class: field_add, summary: "Initial authoring (PLAN-project-alignment, rec-3042, rec-3214): the process definition, two tasks, three carriers, autonomy pointer and legacy_labels map."}
      - date: "{{DATE}}"
        semantic_break: true
        change_class: governance_note_add
        summary: >-
          PLAN-plan-rescout-on-fingerprint (rec-4490): task_sequencing re-runs the decision scout when the scout-input
          fingerprint moves or after a BLOCK pivot, instead of on a judged material change; validate_plan_documents enforces
          the match.
- id: l01-cites-governance
  file: docs/contracts/exit-criteria-ledger.yaml
  before: |2
        governance_notes: >-
          Decision 181 cl.2 per-surface coverage: token shape and the version floor are enforced by validate_plan_documents in
          both tiers; existence of the named decision is UNENFORCED, owned by rec-4517; that a plan's cites hold the scout's
          CITE ids is enforced only by the fingerprint comparison rec-4490's plan adds.
  after: |2
        governance_notes: >-
          Decision 181 cl.2 per-surface coverage: token shape and the version floor are enforced by validate_plan_documents in
          both tiers; existence of the named decision is UNENFORCED, owned by rec-4517; that a plan's cites hold the scout's
          CITE ids is enforced by the re-scout barrier's comparison (plan_scout_input_fingerprint) only as far as the recorded
          value is the scout's own, the copied-value residual owned by rec-5129.
- id: l02-fingerprint-governance
  file: docs/contracts/exit-criteria-ledger.yaml
  before: |2
        governance_notes: >-
          Decision 181 cl.2 per-surface coverage: shape and decision-scout-only placement are enforced by
          validate_plan_documents in both tiers; that the recorded value equals the recomputed one is UNENFORCED until
          rec-4490's plan adds the comparison, and on Actions until rec-5103's verdict jobs.
  after: |2
        governance_notes: >-
          Decision 181 cl.2 per-surface coverage: shape and decision-scout-only placement are enforced by
          validate_plan_documents in both tiers. The re-scout barrier (scripts/checks/roadmap/_plan_rescout_barrier.py, run
          by validate_plan_documents) compares the last decision-scout row's value with the one recomputed on the checked-out
          tree for every added plan and every modified plan whose fingerprint moved, at schema_version 6 and above, and fails
          "re-scout required" everywhere except the push to main, where it warns. Modified plans below 6 are unchecked, a gap
          that closes as they are built (rec-5102). UNENFORCED: that a scout run produced the recorded value (a planner can
          compute it; rec-5129, and on Actions rec-5103's verdict jobs); a Decision amended on main after a PR's last CI run;
          an amendment of a merged plan whose own inputs are unchanged while a cited Decision moved (both rec-5103). A
          decision-scout BLOCK row passes only with the human's accept-with-deferral recorded on it, an in-session interim
          that T4.32 c6's approved override run replaces at the decision_scout flip; after the flip the barrier follows
          gates.decision_scout.verdict_source (rec-5128, T4.32 c5).
- id: l03-amendment-row
  file: docs/contracts/exit-criteria-ledger.yaml
  before: |2
          PLAN-scout-input-fingerprint: contract.description names PlanDocument.cites and
          GateRound.scout_input_fingerprint beside the other plan-linkage fields. No field shape changed.
  after: |2
          PLAN-scout-input-fingerprint: contract.description names PlanDocument.cites and
          GateRound.scout_input_fingerprint beside the other plan-linkage fields. No field shape changed.
      - date: "{{DATE}}"
        semantic_break: false
        change_class: governance_note_add
        summary: >-
          PLAN-plan-rescout-on-fingerprint (rec-4490, rec-5102): the plan_cites and plan_scout_input_fingerprint
          governance_notes name the re-scout barrier that now compares the recorded fingerprint, and its residuals. No
          field shape, description or semantics changed.
