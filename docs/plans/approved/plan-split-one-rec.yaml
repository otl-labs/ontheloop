schema_version: 1
slug: plan-split-one-rec
tldr: Plans stop splitting on the five-file rule of thumb. One plan solves one rec. A planner splits only when the fast-tier
  budget check says breach, the work edits another project's files, a check forces an order, or a design fork divides it.
  A split files child recs with dependency edges and a split-of-rec tag and marks the parent superseded, so no plan gets a
  nested name. A second split of the same work goes to the operator.
blocks:
- id: complexity-split-test
  file: .claude/skills/planning/SKILL.md
  before: |
    - **Scope files > 5** OR **estimated steps > 8** suggests the item may be too large for one plan (a heuristic). Plan types are IMPLEMENTATION and REPORT-ONLY only (Decision 247; the schema refuses STRATEGIC): author one larger IMPLEMENTATION plan, or decompose -- file child recs or split into atomic IMPLEMENTATION plans now, each planned on its own.
    - If IMPLEMENTATION (and complex), execution steps must have explicit pre/post-conditions.
    - **Presentation Rule:** The classification MUST be presented to the human and confirmed, not assumed.
  after: |
    - **One plan solves one rec; split on the fast-tier budget, never a file count.** Run `bin/venv-python -m scripts.checks.deps.selection_budget --paths <draft scope>`: `within_budget` is one plan, `breadth_waived` one plan declaring the measured breadth in `context:`, `breach` a split. Split also for another project's files, an order a check forces, or a design fork. Split per `/plan` Step 8 into child recs, never nested plan names (no `3b-2a`); a second split of one lineage goes to the human (Decision 247 cl.5).
    - If IMPLEMENTATION (and complex), execution steps must have explicit pre/post-conditions.
    - **Presentation Rule:** present the verdict to the human to confirm; never assume it.
- id: suggest-one-rec-relief
  file: .claude/skills/planning/SKILL.md
  before: |
    1. Extract keywords and scope file paths from the task description
    2. Match the returned open recs against the task's `title`, `file`, and `context`
    3. Present top 3-5 matches (if any):
    > "These open recommendations may align with your task:
    > - **rec-XXX**: [title] (effort: [effort], priority: [priority])
    >
    > Want to bundle any into this session? Say 'include rec-XXX' or 'skip'."
  after: |
    Match the open recs it returns against the task's keywords and scope, present the top 3-5 (id, title, effort, priority) and ask which to bundle or skip. A bundled rec is one this change closes whole, beside the rec the plan solves.
- id: plan-step4-split-test
  file: .claude/commands/plan.md
  before: |
    5. Conduct a Complexity Assessment to decide whether the item fits one plan or decomposes into child recs or atomic plans (Decision 247).
  after: |
    5. Conduct a Complexity Assessment: run the planning skill's split test on the draft scope. One plan solves one rec, and a split files child recs (Step 8's Planning-time split). `selection_budget` prices only the test half: until rec-5389 prices hermetic VP replays, weigh those against the 270s non-test half yourself. `breach` is rare by design (Decision 208: the allowance tracks measured cost), and `non_test_breach` is never a reason to split.
- id: plan-step8-child-recs
  file: .claude/commands/plan.md
  before: |
    **Planning-time split.** Applies only if this plan defers a half -- a split decided at planning time: file the other half now via the same portal call `.claude/commands/implement.md` Step 7 describes, and record the returned id in this plan's `followon_recs`. A plan that defers nothing writes nothing; the clause is a no-op then, exactly as in `implement.md` Step 7.
  after: |
    **Planning-time split.** One plan solves one rec; work with no rec (a roadmap item or hint) gets one filed first. This applies only if the Complexity Assessment says split and the human confirmed the split at sign-off; otherwise it is a no-op. Run `bin/venv-python -m scripts.ops_data_portal --guidance` (Decision 66), then `--file-rec` once per child, in dependency order (the writer refuses a dangling dependency), each a whole rec one plan can close: `--context` opens "Split of rec-NNNN: <its edge>", `--acceptance` is a discriminating oracle, `--source planning`, `--tags split-of-rec-NNNN`, and `--dependencies` names each child that must land first. Then `--update-rec rec-NNNN --status superseded --resolution "Split into rec-A, rec-B: <why>"` (an escape-classified parent also needs the closure waiver the portal names, Decision 186), and read every write back with `recs_by_ids`. A rec that already carries a `split-of-rec-` tag is never split again: take it to the human (Decision 247 cl.5). Plan one child whose dependencies are all closed, as this plan's rec, and name the others in the handoff by rec id, never by a nested plan name. `followon_recs` is not a split: it is written only if this plan defers a half at build time (`implement.md` Step 7).
- id: critique-step8-split-test
  file: .claude/skills/plan-critique/SKILL.md
  before: |
    8. **Evaluate Scope breadth (IMPLEMENTATION plans; a split means child recs or atomic plans, Decision 247):**
  after: |
    8. **Evaluate Scope breadth (IMPLEMENTATION; split by the planning skill's test, into child recs):**
- id: critique-scope-template
  file: .claude/skills/plan-critique/SKILL.md
  before: |
    - [Area or file 1]: appropriately scoped / too large (suggest split into: X, Y; deferred half filed as a follow-on rec) / too small (merge with: Z)
  after: |
    - [Area or file 1]: appropriately scoped / too large (split test: child recs X, Y; not a deferred half filed as a follow-on rec) / too small (merge with: Z)
