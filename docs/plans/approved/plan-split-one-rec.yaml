schema_version: 1
slug: plan-split-one-rec
tldr: Plans stop splitting on the five-file rule of thumb. One plan delivers one outcome that can be verified and reverted
  on its own, under one primary rec; work with no rec gets one filed first. Child recs only for independent parts, another
  project's files or a different risk class; a design fork is settled first. A forced order, the CI budget or a size cap will
  mean more PRs in one plan; until rec-5411 adds build checks for that, child recs with an order edge. Children carry dependency
  edges and a split-of-rec tag, the parent stays open until they close, and a second split goes to the operator.
blocks:
- id: agents-split-form
  file: AGENTS.md
  before: |-
    Plans are IMPLEMENTATION or REPORT-ONLY: work too large for one plan
    splits into child recs or atomic IMPLEMENTATION plans, each planned on its own (Decision 247).
  after: |-
    Plans are IMPLEMENTATION or REPORT-ONLY: one plan is one verifiable,
    revertible outcome; more work splits into child recs, each planned on its own (Decision 247).
- id: complexity-split-test
  file: .claude/skills/planning/SKILL.md
  before: |
    - **Scope files > 5** OR **estimated steps > 8** suggests the item may be too large for one plan (a heuristic). Plan types are IMPLEMENTATION and REPORT-ONLY only (Decision 247; the schema refuses STRATEGIC): author one larger IMPLEMENTATION plan, or decompose -- file child recs or split into atomic IMPLEMENTATION plans now, each planned on its own.
    - If IMPLEMENTATION (and complex), execution steps must have explicit pre/post-conditions.
    - **Presentation Rule:** The classification MUST be presented to the human and confirmed, not assumed.
  after: |
    - **One plan delivers one outcome that can be verified and reverted on its own, under one primary rec.** Never split on a file count. `/plan` Step 4 item 5 holds the split test and Step 8 the filing: child recs, never nested plan names (no `3b-2a`); a second split of one lineage goes to the human (Decision 247 cl.5).
    - If IMPLEMENTATION (and complex), execution steps must have explicit pre/post-conditions.
    - **Presentation Rule:** present the verdict to the human to confirm; never assume it.
- id: suggest-one-rec-relief
  file: .claude/skills/planning/SKILL.md
  before: |
    1. Extract keywords and scope file paths from the task description
    2. Match the returned open recs against the task's `title`, `file`, and `context`
    3. Present top 3-5 matches (if any):
    > "These open recommendations may align with your task:
    > - **rec-XXX**: [title] (effort: [effort], priority: [priority])
    >
    > Want to bundle any into this session? Say 'include rec-XXX' or 'skip'."
  after: |
    Match the open recs it returns against the task's keywords and scope, present the top 3-5 (id, title, effort, priority) and ask which to bundle or skip. Bundle at most two beside the primary rec, each one this change closes whole; the merge's Resolves trailer closes it only when its own acceptance holds (Decision 201).
- id: plan-step4-split-test
  file: .claude/commands/plan.md
  before: |
    5. Conduct a Complexity Assessment to decide whether the item fits one plan or decomposes into child recs or atomic plans (Decision 247).
  after: |
    5. Conduct a Complexity Assessment. One plan delivers one outcome that can be verified and reverted on its own, under one primary rec. Split it into child recs (Step 8) only when its parts are independently valuable or can run in parallel, when a part edits another project's files, or when a part differs in risk class (an IAM trust change or a production step beside mechanical work). When the only pressure is delivery mechanics (an order a check forces, the fast-tier budget, a size cap), the target is one plan delivered as at most three PRs merged in linear order; until rec-5411 gives every PR the build gates, a plan is one PR, so file child recs with an order edge instead. A design fork is not a split: settle it first (a blind consult, then the human) and plan the branch chosen. A near-cap shared file that another open plan edits in the same lines needs a dependency edge between the two plans' recs, or a split. `bin/venv-python -m scripts.checks.deps.selection_budget --paths <draft scope>` is a guardrail, not the trigger: declare a `breadth_waived` breadth in `context:`, and treat a `breach` (rare by design, Decision 208) as delivery mechanics, above. It prices only the test half: until rec-5389 lands, weigh the plan's hermetic VP replays against the 270s non-test half yourself, and until rec-5397 lands, a `breach` whose test-half high end equals its allowance is a rounding artefact.
- id: plan-step3-rec-first
  file: .claude/commands/plan.md
  before: |
    Suggest 3-5 open recommendations aligned with the task (`bin/venv-python -m scripts.recs_related` over the likely scope files).
  after: |
    Suggest 3-5 open recommendations aligned with the task (`bin/venv-python -m scripts.recs_related` over the likely scope files). Work with no rec (a roadmap item or hint) gets one filed now (`--guidance`, then `--file-rec` naming the item in `--context`, Decision 66); it is the plan's primary rec.
- id: plan-step8-child-recs
  file: .claude/commands/plan.md
  before: |
    **Planning-time split.** Applies only if this plan defers a half -- a split decided at planning time: file the other half now via the same portal call `.claude/commands/implement.md` Step 7 describes, and record the returned id in this plan's `followon_recs`. A plan that defers nothing writes nothing; the clause is a no-op then, exactly as in `implement.md` Step 7.
  after: |
    **Planning-time split.** Applies only if the human confirmed a split at sign-off or chose split at a Step 9 escalation (then delete the written plan from the branch); otherwise it is a no-op. Run `bin/venv-python -m scripts.ops_data_portal --guidance` (Decision 66), then `--file-rec` once per child, in dependency order (the writer refuses a dangling dependency), each one outcome a fresh planner can plan from its rec alone: `--context` opens "Split of rec-NNNN: <its edge>" and carries what that planner needs, `--acceptance` is a discriminating oracle, `--source planning`, `--tags split-of-rec-NNNN`, and `--dependencies` names each sibling that must land first. Then `--update-rec rec-NNNN --dependencies <its existing dependencies and every child>`: the parent stays open as the umbrella, becomes eligible only when every child has closed, and is then closed when its own acceptance holds or taken to the human when it does not (Decision 247, children-miss-parent). Read every write back with `recs_by_ids`. A rec that carries a `split-of-rec-` tag is never split again: take it to the human (Decision 247 cl.5). Then stop: end the run `decomposed`, plan no child, and hand the child ids to the coordinator (Decision 247 cl.3). `followon_recs` is not a split: it is written only if this plan defers a half at build time (`implement.md` Step 7).
- id: critique-step8-split-test
  file: .claude/skills/plan-critique/SKILL.md
  before: |
    8. **Evaluate Scope breadth (IMPLEMENTATION plans; a split means child recs or atomic plans, Decision 247):**
  after: |
    8. **Evaluate Scope breadth (IMPLEMENTATION; one verifiable, revertible outcome, `/plan` Step 4):**
- id: critique-scope-template
  file: .claude/skills/plan-critique/SKILL.md
  before: |
    - [Area or file 1]: appropriately scoped / too large (suggest split into: X, Y; deferred half filed as a follow-on rec) / too small (merge with: Z)
  after: |
    - [Area or file 1]: appropriately scoped / too large (more PRs, or child recs X, Y; not a deferred half filed as a follow-on rec) / too small (merge with: Z)
