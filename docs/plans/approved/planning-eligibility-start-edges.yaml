schema_version: 1
slug: planning-eligibility-start-edges
blocks:
- id: roadmap-eligibility
  file: docs/ROADMAP-PLATFORM.yaml
  before: |2
        - Work is discoverable via tier_items[]. An item is eligible when status ==
          "not_started" AND all depends_on entries have status == "complete".
  after: |2
        - Work is discoverable via tier_items[]. An item is eligible when status ==
          "not_started" AND each depends_on entry has status == "complete", or is
          named by one of the item's start_edges and has status == "in_progress"
          (scripts/platform_roadmap_state.py eligible_items() computes this).
        - tier_items[].start_edges (optional) lists {ref, once: in_progress, note}
          entries. Each ref is a tier_item id, never a tier shortcut, that is also
          in the item's depends_on. A start edge only lets the item START once ref
          is in_progress: depends_on still orders completion, and an item carrying
          start_edges cannot be complete while any depends_on entry is not.
- id: planning-skill-reject
  file: .claude/skills/planning/SKILL.md
  before: |
    When the human's stated intent matches one of these and names no tier_item, the Freshness Gate is skipped. Do NOT reject the session -- issue a soft warning and proceed. Reject only when the intent *claims* tier_item alignment but the referenced id does not exist or its depends_on are not satisfied.
  after: |
    When the human's stated intent matches one of these and names no tier_item, the Freshness Gate is skipped; warn softly and proceed. Reject only when the intent *claims* tier_item alignment but the referenced id does not exist or its depends_on are unmet (a `start_edges` ref counts once in_progress).
- id: orient-status-digest
  file: .claude/skills/orient/SKILL.md
  before: |
    Compact table of tier_items currently `in_progress` or eligible (`not_started` with all depends_on satisfied).
  after: |
    Compact table of tier_items currently `in_progress` or eligible (`next_eligible`; it honours `start_edges`).
- id: orient-omit-blocked
  file: .claude/skills/orient/SKILL.md
  before: |
    Omit items with status `complete`, `reserved`, or blocked (depends_on not satisfied).
  after: |
    Omit items that are `complete`, `reserved`, or blocked (`platform_roadmap.blocked`).
