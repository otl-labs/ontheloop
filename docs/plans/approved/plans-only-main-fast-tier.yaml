    gate: "See AGENTS.md's Merge protocol section (post-merge disposition)."
    plans_only_exception: "A push to `main` whose diff from `github.event.before` to `github.sha` is confined to docs/plans/ runs `--pre` in ci.yml's main-validate job instead of this tier (Decision 205 clause 5; Decision 73's 2026-09-28 amendment), and Main Canary's 3-hourly full tier backstops it; validate_graduated_rerun_plan_readers keeps the graduated records that read docs/plans/ in that fast tier (Decision 244, as updated). The full-tier step is skipped on that path, so scripts/ci/deploy_gate.py never takes such a commit as full-tier green (Decision 249 clause 2). A zero or unresolvable `before`, a forced push, an empty diff, a git error or any changed path outside docs/plans/ runs the full tier (scripts/ci/push_scope.py, a scope classifier, not a diff base; fail closed, Decision 170)."
