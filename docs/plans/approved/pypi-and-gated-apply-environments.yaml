schema_version: 1
slug: pypi-and-gated-apply-environments
tldr: "Records that tf-gated-apply no longer admits every branch: a dated note on Decision 248 says clause 9's branch
  residual is closed, since tf-gated-apply and pypi now admit main only by an explicit policy a test enforces, while
  admins can still bypass tf-gated-apply until rec-4965. The GitHub transfer playbook's fail-open row now covers every
  Environment terraform/github declares, pypi included, and recreates them all from terraform/github. No clause
  changes."
blocks:
- id: decision-248-update
  file: docs/DECISIONS.md
  before: |
    > **Amended by Decision 256 (2026-11-13):** Clause 6's "an ADMIN-session agent runs" reads "the operator runs, from an agent-prepared CloudShell block (Decision 256 cl.3)", still after the pre-merge admin plan, which the operator's block also runs.
  after: |
    > **Amended by Decision 256 (2026-11-13):** Clause 6's "an ADMIN-session agent runs" reads "the operator runs, from an agent-prepared CloudShell block (Decision 256 cl.3)", still after the pre-merge admin plan, which the operator's block also runs.

    > **Update ({{DATE}}, PLAN-pypi-and-gated-apply-environments, rec-4651):** Clause 9's residual "tf-gated-apply admits any branch" is closed: tf-gated-apply and pypi admit main only, by an explicit deployment branch policy that tests/checks/iam_tf/test_tf_gated_apply_branch_policy.py enforces. Admins can still bypass tf-gated-apply until rec-4965. No clause changes.
- id: transfer-binding
  file: docs/contracts/github-org-transfer.yaml
  before: |
    binding: GitHub Environments tf-gated-apply and tf-trusted-plan (Terraform-managed) and pypi (not Terraform-managed)
  after: |
    binding: Every GitHub Environment terraform/github declares (tf-gated-apply, tf-trusted-plan, pypi and the rest)
- id: transfer-fix
  file: docs/contracts/github-org-transfer.yaml
  before: |
    The operator reads all three environments, their reviewers and branch policies in Settings on the new path BEFORE the
    first merge to main or any dispatch (the agent proxy blocks environment reads); recreate them from
    terraform/github (tf-gated-apply, tf-trusted-plan) or the console (pypi) before unfreezing. Proven live by a
    tf-gated-apply dispatch that waits for its reviewer.
  after: |
    The operator reads every environment, its reviewers and branch policy in Settings on the new path BEFORE the
    first merge to main or any dispatch (the agent proxy blocks environment reads); recreate them from
    terraform/github before unfreezing. Proven live by a tf-gated-apply dispatch that waits for its reviewer.
