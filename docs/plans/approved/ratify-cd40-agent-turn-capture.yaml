    > **Update ({{DATE}}):** CD.40 is ratified onto this Decision. This is a ratification record, not a clause-1 or clause-5 note: it adds and changes no clause. Each CD.40 clause already lives elsewhere: ops_session_log is retired, not migrated (Decision 78's 2026-09-22 amendment, T2.26); docs/SESSION_LOG.md is retired by deletion (Decisions 127 and 174, #1696), and no earlier history was imported, so no imported-row flag exists; turn-grain rows go through the telemetry writer (clause 1 here, Decision 213); a materialized session aggregate (the audit's ops_sessions, not telemetry_sessions) waits on the derived-read-too-costly condition above, which rec-4833 watches; and the hook-side credential scrub stays a launch criterion (telemetry_transcripts.yaml, T3.20 c1), because snapshot retention defeats redaction after the write.
- id: cd40-ratified
  file: docs/ROADMAP-PLATFORM.yaml
  before: |2
      - id: CD.40
        title: >-
          Agent-turn telemetry capture reconciled onto the canonical telemetry model
        detail: |
          Records the surviving facets of the retired T-1.9 session-log-architecture audit
          document (the substantive REPORT-ONLY deliverable; docs/plans/PLAN-session-log-audit.md
          is its companion planning artefact, not the source of this content), reconciled onto
          the canonical four-table DuckLake telemetry model (Decisions 95/96/97) rather than the
          document's original bespoke 7th-Lambda design:
            - Retire ops_session_log (event-flavoured, unverified writer semantics, no live
              agent-facing reader) once T2.26 migrates or retires it.
            - Retire docs/SESSION_LOG.md post-reader-rewire (session_preflight.recent_sessions
              moves to a query-Lambda verb); archived to docs/SESSION_LOG_ARCHIVE.md, not deleted outright.
            - Turn-write via the DuckLake writer boundary (Decision 84) -- agent-turn events land
              as turn-grain rows on telemetry_observations + telemetry_transcripts (Decision 95),
              NOT a new telemetry_agent_turns / telemetry_agent_turn_transcripts table pair and
              NOT a bespoke 7th Lambda (the doc's original agent-platform-log-turn design).
            - Aggregate ops_sessions table deferred with the doc's 3-condition structural trigger
              (>=10,000 telemetry_observations turn rows; >=2 distinct recs requesting an
              aggregate shape the raw event table can't answer cheaply; either a deployed
              query-Lambda verb against the event tier OR 6 months elapsed since the event-tier
              Lambda deployment) -- not a wall-clock deferral.
            - Hook-side pre-write credential scrub (AWS keys, Anthropic keys, GitHub PATs, generic
              Bearer tokens) is a launch criterion, not post-hoc polish: DuckLake snapshot
              retention defeats post-hoc redaction.
        gates: [T3.20]
        affects: [T2.26]
        state: pending
        filed_via: pending_log_decision_lambda
        discipline_points:
          - >-
            The deliverable's originally proposed two-tier metadata/transcript split is SUBSUMED by
            Decision 95's canonical telemetry_observations node + telemetry_transcripts sidecar --
            not re-proposed here.
          - >-
            The deliverable's bespoke table set and agent-platform-log-turn Lambda design are
            SUPERSEDED by Decisions 84/95/96/97 (telemetry lives on the DuckLake closed boundary;
            writes via the ducklake_writer boundary, not a new Lambda).
          - >-
            Kept UNRATIFIED per Decision 105 (ratify only on realization evidence) and Decision 87
            (record destination now, defer build) -- the underlying subsystem (T3.20) is unbuilt.
          - "Cites Decisions 86, 84, 95, 96, 97, 105, 87, 75."
          - >-
            Partial realization (rec-3579, 2026-09-10): T2.26 has already re-sequenced ownership of
            the ops_session_log retire decision onto itself and cites this CD's disposition in its
            own criterion text -- the ops_session_log clause realizes early via T2.26. Four of this
            CD's five clauses remain unbuilt behind T3.20, so this CD stays state: pending with no
            realization_evidence.
          - >-
            clause 1 realized (2026-09-22, PLAN-t2-26-retire-ops-session-log / T2.26): ops_session_log
            is retired -- the dormant registry block, its reconcile-governance entry, and every
            production reference (scripts/, src/, config/) are deleted; the boundary refuses the table
            by name at both the writer/reader Lambda layer. This CD's other four clauses (turn-write
            via DuckLake, docs/SESSION_LOG.md retirement, the aggregate ops_sessions deferral, and the
            hook-side credential scrub) remain unbuilt behind T3.20, so state stays pending with no
            realization_evidence -- clause-level realization is not CD-level ratification.
          - >-
            clause 2 realized differently (2026-10-28, PLAN-telemetry-session-log-retirement / T3.20 c6): docs/SESSION_LOG.md is
            deleted, not archived, per Decisions 127 and 174 (no standing human-audience artefact; retirement is by deletion), and
            session_preflight.recent_sessions is read from the reader's sessions_window verb. A realization note, not a ratification:
            state stays pending.
  after: |2
