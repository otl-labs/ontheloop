slug: rec-dependency-existence-at-writer
tldr: 'One numbered Decision amending Decision 210 cl.2(a): one same-table merge-key point lookup inside the write''s transaction is write-decidable; the ops writer rejects a dangling ops_recommendations dependency on insert or on a change to the column; rec-4166 becomes a backstop; two reversal conditions. Matching prose in data-modeling-standard.yaml and on the dependencies field of ops_recommendations.yaml.'
