schema_version: 1
slug: rec-writer-session-tripwire
tldr: "The ops writer contract records the new session tripwire: a hook that refuses an agent session's command
  calling the rec writer directly and points it at the portal. The text says the hook has no authority, is never a
  control, fails open and misses indirection, and that the writer's own schema and row rules are what bind."
blocks:
- id: writer-tripwire-invariant
  file: docs/contracts/ducklake_writer.yaml
  before: |
    under the older-rows rule before any MERGE; a rejection is a terminal 422 row_rule that writes nothing and is never retried."
    amendment_log:
  after: |
    under the older-rows rule before any MERGE; a rejection is a terminal 422 row_rule that writes nothing and is never retried."
      - "Session tripwire (PLAN-rec-writer-session-tripwire, operator ruling 2026-11-16): .claude/hooks/rec_writer_tripwire.py refuses an agent session's Bash or Monitor command that calls this writer directly (an HTTP client aimed at the ops/writer route or a writer URL, inline code calling the portal's writer transport, or aws lambda invoke on the writer) and points it at scripts.ops_data_portal. Authority: none. It is an early warning for honest mistakes and is never cited as a control: it is agent-editable code inside the agent's loop (Decision 143 cl.1), every session signs as one identity (Decision 256), and it fails open. Indirection it does not parse (variables, aliases, script files, other languages, tools other than Bash and Monitor) passes, so its silence is no evidence that no direct call happened. What binds is this writer's schema and row rules (Decision 210)."
    amendment_log:
      - date: "2026-11-17"
        semantic_break: false
        change_class: governance_note_add
        summary: >-
          PLAN-rec-writer-session-tripwire (rec write-path plan F): audit_invariants gains the session tripwire line, which
          states that the hook refusing direct writer calls from agent sessions has no authority and is not a control.
        migration_story: >-
          Nothing migrates: the writer, its verbs and its callers are unchanged. A session command that called the writer
          directly is now refused in the session and goes through scripts.ops_data_portal instead.
