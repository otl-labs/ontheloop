- id: public-identity-contract
  file: docs/contracts/public-identity.yaml
  before: ""
  after: |
    # Class D mechanism contract for On The Loop's public identity: the confidential classes no public surface carries
    # and the frozen internal identifier families (Decision {{N}} cl.2 and cl.7, which delegate these two keys under
    # operator_approval; approval-routing.yaml gates this file). Rulings and rationale live in that Decision (Decision 86).
    contract:
      id: public-identity
      class: D
      contract_version: 1
      status: draft
      description: >-
        The sole list of confidential classes that no public surface carries (the repository and its history, CI logs and
        job summaries, pull-request and issue comments, runtime responses and log lines, the public site), the enforcers
        that hold it, and the complete inventory of frozen internal identifier families.
      subject: public-identity
      evaluator:
        agent_surface: AGENTS.md

    amendment_log:
      - {date: "{{DATE}}", semantic_break: false, change_class: field_add, summary: "PLAN-redecide-public-identity (Decision {{N}}, rec-5668): first authoring; the confidential classes and the frozen identifier families delegated by Decision {{N}}."}

    confidential:
      classes:
        - AWS account ids and ARNs
        - IAM ExternalIds and other cross-account trust tokens
        - credentials, API keys, access tokens and secret values
        - internal hostnames and endpoint ids that give an attack surface (Function URLs, API ids and hosts)
        - private operational data, including personal contact details and principal_ref values
      enforcers:
        - .pre-commit-config.yaml block-sensitive-identifiers (shape patterns, never literal values)
        - scripts/ci/redaction_check.py (speculative-plan PR comments)
        - workflow masking of resolved URLs and hosts before they reach a log
        - src/common/ducklake_handler_errors.py (no exception message in a response body)

    frozen_identifiers:
      families:
        - {family: "agent-platform-*", kind: AWS resource name prefix}
        - {family: "/agent-platform/*", kind: SSM parameter path}
        - {family: agent_platform, kind: IAM profile and Glue database}
        - {family: "platform-security-*", kind: AWS resource name prefix, scope: terraform/bootstrap only, source: "Decisions 202 cl.3, 270 cl.3"}
        - {family: "/secret/", kind: SSM parameter root for secret values, source: Decision 237}
        - {family: "bootstrap-preview, bootstrap-apply", kind: IAM role, source: Decision 257 cl.3}
        - {family: "github-settings-preview, github-settings-apply", kind: IAM role, source: Decision 248 cl.4}
        - {family: "telemetry-content-reader, telemetry-content-deploy", kind: IAM role, source: Decision 270 cl.2}
        - {family: "PlatformDev, PlatformAdmin", kind: IAM role, source: "Decision 223 cl.1-2"}
        - {family: ducklake-api-access-logs, kind: IAM role, scope: terraform/bootstrap only, source: Decision 255 cl.4}
        - {family: "OrganizationAdmin, org-admin-operator", kind: IAM role and IAM user, scope: terraform/organization only, source: Decision 256 cl.3}
      not_frozen: >-
        The repository name (Decision 171 cl.1; otl-labs/ontheloop, Decision 218) and project_id, an opaque writer-minted
        ULID (Decision 200 cl.1).
