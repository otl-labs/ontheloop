          materialization time (fail-loud, GraduationError, on a missing required key for
          the row's slot). PORTABILITY (rec-4889): a command never runs ripgrep in program
          position as vp-red-before.yaml's rg_portability_lint defines it, a bash -c body or a
          $(...) substitution included, since the CI runner has none, and never reads the live
          checkout's branch, push context or GITHUB_* event variables, since the full tier
          re-runs every record on main. validate_verification_registry refuses either where the
          command's own text shows it, in an added or modified row only; reads through
          first-party code are rec-4904's, unmodified live rows are not scanned, and the one live
          match, ungoverned-counter-creation-retired, is rec-3286's.
