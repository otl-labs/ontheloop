schema_version: 1
slug: retire-ci-only-red-records
blocks:
- id: registry-retirement-note
  file: docs/contracts/verification-registry.yaml
  before: |
    claim-preserving repair, or retirement to entries/deprecated/, never by joining the list.
    amendment_log:
  after: |
    claim-preserving repair, or retirement to entries/deprecated/, never by joining the list.

      PLAN-retire-ci-only-red-records (rec-4888, Decision 244 cl.5, {{DATE}}): data-pipeline-excludes-control-module and
      push-context-session-branch-guard RETIRED by git mv into entries/deprecated/ (100% renames, content untouched),
      operator-approved under Decision 235 cl.1. Both went red on main's first full-tier re-run for environmental reasons:
      the first calls ripgrep, absent on the CI runner (exit 127); the second asserts push_context_base() is None in the
      live checkout, true on a session branch and false on main's push run. An in-place repair is not admissible:
      run_differential rejects each repaired form as tautological because it passes on origin/main (rec-3286 owns the
      repair path). No standing claim is dropped: push-context's is asserted hermetically by
      tests/checks/_common/test_push_context_base.py::TestPushContextBase::test_session_branch_false_positive_regression;
      data-pipeline's exclude row is held by control-modules-track-scd2-membership while data-pipeline excludes
      ducklake_scd2_schema.py, and its deploy-trigger half was one-time evidence for its own merge (Decision 244 cl.4): a
      later change that adds a data-pipeline path to that workflow's trigger is legitimate, not a regression. DECLARED
      RESIDUAL: the two resolved plans that graduated them still name the ids; they are never replayed or edited.
    amendment_log:
      - {date: "{{DATE}}", semantic_break: false, change_class: governance_note_add, summary: "PLAN-retire-ci-only-red-records (rec-4888, Decision 244 cl.5): governance note recording the retirement of data-pipeline-excludes-control-module and push-context-session-branch-guard into entries/deprecated/, and the flow-style compaction of the 2026-10-15 and 2026-10-11 rows, words unchanged, under the Decision 166 limit. No field schema change."}
