schema_version: 1
slug: reviewer-read-tree-wording
tldr: code_reviewer (its contract version raised by one) opts into read_tree on the change's head tree and on main, under deliberately high limits whose hit ends the run as review_incomplete, and reads the rules it judges against in main. Both review lanes define the review scope as the review files, where any issue is reported, plus the change's reach, where an issue is reported only when the change causes or depends on it; the code-review skill is compacted to keep its prose budget.
