schema_version: 1
slug: reviewer-read-tree
tldr: 'Verdict reviewer personas get a shared read_tree capability: bounded, recorded, read-only reads of the change''s head tree and of main, a limit hit ending the run as review_incomplete. code_reviewer
  (contract 3) names it and gains reference_hits, a whole-tree search for what the change touches. Both review lanes define the review scope as the review files plus the change''s reach and report a reach
  issue only when the change causes it; the code-review skill is compacted to keep its prose budget.'
