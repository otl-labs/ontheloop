  after: |2+
       c. For each Python file in the changed + planned sets, run `bin/venv-python -m scripts.extract_imports <file>` to collect `src.*` direct imports.
       d. The review files are: **changed files + planned files + the files of the step (c) imports**, one level deep (e.g., `src.common.config` → `src/common/config.py`); test files only when `tests/` files are in the diff or the plan Scope. Report any issue in them.
       e. Skip whole directories (e.g. `src/data/handlers/`) unless files in them are review files.
       f. The change's reach is any other file that depends on what changed (a caller or importer of a changed function; a test, contract, document or config naming a changed path, module or symbol): search the repository for each. Report an issue there only when the change causes it (a broken call, a stale reference, a contract no longer met), anchored where it breaks.

       > **Review scope = review files + the change's reach. Never report an issue the change neither causes nor depends on.**

