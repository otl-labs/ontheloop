- id: executor-personas-yaml-04
  file: docs/contracts/executor-personas.yaml
  before: |2
            binding serves no blob the contract's input_schema does not declare (T4.10a c6).
        - id: read_repo
  after: |2
            binding serves no blob the contract's input_schema does not declare (T4.10a c6).
        - id: read_tree
          effect: read
          target: tree
          parameter: {domain: tree, from: "head (the change's head-tree snapshot) or main (the default branch at the run's definition SHA)"}
          binding: {litellm: {kind: backend_tool, tool: read_tree, owning_item: "T4.32:c1"}}
          meaning: >-
            Read-only access to one pinned tree: a file by line range, one directory's entries, or a literal search, under
            the contract's budget.read_tree limits (max_calls, max_read_bytes, max_search_results, max_total_bytes). Paths
            that are absolute, leave the tree, pass through .git or a symlink are refused and binary files skipped; file text
            is returned as delimited data. Every call is recorded on the run's events (tree, op, path, git blob SHA, range,
            bytes, result). A call over a limit ends the run as the failure review_incomplete, which the contract must list.
            The claude_cli binding is T4.27 c7's.
        - id: read_repo
