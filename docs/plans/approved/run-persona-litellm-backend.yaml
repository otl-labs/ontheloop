schema_version: 1
slug: run-persona-litellm-backend
tldr: >-
  The litellm run_persona backend asks every model call for a JSON object, checks the final reply against the
  persona's output schema or its listed failures, repairs up to max_revisions, then returns schema_invalid. Every
  provider attempt, retries included, counts as a turn. It builds only read_input and refuses any other capability.
  read_repo, run_tests and edit_repo move to T4.15 c3, since no verdict persona uses them.
blocks:
- id: e01-amendment-log
  file: docs/contracts/executor-personas.yaml
  before: |-
    amendment_log:
  after: |-
    amendment_log:
      - {date: "{{DATE}}", semantic_break: false, change_class: governance_note_add, summary: "PLAN-run-persona-litellm-backend (T4.32 c1, backend leg): run_persona.result states how the litellm backend reaches a result (json_object on every call, the terminal turn checked, max_revisions repairs, then schema_invalid) and that it builds only read_input; budget_rules counts every provider attempt as a turn; the read_repo, run_tests and edit_repo bindings' owning_item moves from T4.32:c1 to T4.15:c3, the compute-plane workspace leg, since no verdict persona names them. No persona contract, rendered prompt or hash changes."}
- id: e02-result
  file: docs/contracts/executor-personas.yaml
  before: |2-
      A success value valid against the contract's output_schema, or a failure value in failure_envelope's shape whose
      failure id the contract's failure_outputs lists; never anything else.
  after: |2-
      A success value valid against the contract's output_schema, or a failure value in failure_envelope's shape whose
      failure id the contract's failure_outputs lists; never anything else. The litellm backend asks every call for a
      JSON object and checks the run's terminal turn, a response with no tool calls, against output_schema or
      failure_envelope; a terminal turn that fails is answered with the check's error paths and counts as a revision,
      and a run past max_revisions returns schema_invalid. It builds only the read_input binding and refuses a contract
      naming any other capability until that binding's owning item builds it.
