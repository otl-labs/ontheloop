schema_version: 1
slug: run-persona-mcp-bridge
tldr: >-
  The litellm run_persona backend gains the warehouse_read tool. For a persona whose contract names a warehouse read,
  it starts the On The Loop MCP server once per run, offers the model only the reads the contract lists, and gives the
  server the reader's credentials but never an inference key or a GitHub token. The contract sentence saying the
  backend builds only read_input now says this. No persona names warehouse_read yet.
