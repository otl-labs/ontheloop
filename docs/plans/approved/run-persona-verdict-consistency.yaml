schema_version: 1
slug: run-persona-verdict-consistency
tldr: 'Each verdict persona contract gains verdict_consistency, its existing verdict rule as data (for example REVISE when
  any finding is Critical or High, else PROCEED), so the backend refuses a verdict that contradicts its own findings: a repair
  turn, then schema_invalid. The three contracts go to version 2 with a widened schema_invalid meaning and re-rendered prompts;
  the index declares the field and the check.'
blocks:
- id: i01
  file: docs/contracts/executor-personas.yaml
  before: |-
    amendment_log:
  after: |-
    amendment_log:
      - {date: "{{DATE}}", semantic_break: false, change_class: field_add, summary: "PLAN-run-persona-verdict-consistency (T4.32 c1, backend leg; rec-5052): persona_contract gains verdict_consistency, a verdict persona's skill_tether.verdict_rule as data in a closed grammar, which validate_persona_contracts requires of every kind verdict contract and checks against its output_schema and verdict_rule; run_persona.result and failure_envelope's schema_invalid name the verdict check. The three verdict contracts go to contract_version 2 with the rule, a widened schema_invalid meaning and re-rendered prompts."}
- id: i02
  file: docs/contracts/executor-personas.yaml
  before: |2-
        failure_envelope; a terminal turn that fails is answered with the check's error paths and counts as a revision,
        and a run past max_revisions returns schema_invalid. It builds only the read_input binding and refuses a contract
        naming any other capability until that binding's owning item builds it.
  after: |2-
        failure_envelope; a terminal turn that fails is answered with the check's error paths and counts as a revision,
        and a run past max_revisions returns schema_invalid. For a verdict persona, a terminal success whose verdict is not
        the one its contract's verdict_consistency rule gives fails that check the same way. It builds only the read_input
        binding and refuses a contract naming any other capability until that binding's owning item builds it.
- id: i03
  file: docs/contracts/executor-personas.yaml
  before: |2-
          verdict values equal to output_schema's verdict enum.
  after: |2-
          verdict values equal to output_schema's verdict enum.
        verdict_consistency: >-
          For a verdict persona, its skill_tether.verdict_rule as data, so every backend refuses a success whose verdict
          contradicts its own findings: {cases, otherwise}. cases is an ordered list of {verdict, any}; any is a list of
          conditions {array, field, in}, where array is a dotted path to an array property of output_schema, and field and
          in, given together or not at all, name an enum property of that array's items and a subset of its enum. A
          condition holds when the array has an element (whose field value is in that subset); the first case with a
          holding condition gives the verdict, and otherwise gives it when none holds. The case verdicts and otherwise are
          output_schema's verdict enum, each once, and every verdict and in value appears in skill_tether.verdict_rule.
          Required of a kind verdict contract and checked by validate_persona_contracts.
- id: i04
  file: docs/contracts/executor-personas.yaml
  before: |2-
        budget_exhausted: The run reached max_turns or max_wall_clock_seconds before a valid result.
        schema_invalid: The result still failed output_schema after max_revisions repairs.
  after: |2-
        budget_exhausted: The run reached max_turns or max_wall_clock_seconds before a valid result.
        schema_invalid: >-
          The result still failed output_schema, or for a verdict persona its verdict_consistency rule, after max_revisions
          repairs.
