schema_version: 1
slug: sandbox-reviewer-revise-route
tldr: On a push to main, a sandbox plan-reviewer REVISE no longer latches the convergence record red. It routes the saved plan to the tf-gated-apply Environment the way a guard block does, so the operator reads the reason and approves or refuses; the record keeps its status with a pending_gated marker. A rejection is no veto; a revert PR is. Auto-apply needs an explicit PROCEED. The dispatch and Reconcile still fail a REVISE red (rec-5213). A new Decision amends 154 and 183; environment-taxonomy.yaml names the route.
