schema_version: 1
slug: scheduled-workflow-dispatch
tldr: 'Records how terraform-drift, convergence-health and main-canary get started on time: an AWS clock calls one small Lambda
  that starts each workflow through a dedicated GitHub App, with GitHub''s cron kept as the fallback. A new Decision accepts
  that the App''s Actions access is held by agent-editable code (an exception to Decision 143 clause 1) and names the checks
  that watch it; three settings rows, one port coupling row and one credential inventory row record the rest.'
