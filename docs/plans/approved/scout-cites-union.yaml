schema_version: 1
slug: scout-cites-union
tldr: The fingerprint command now prints the merged cited-Decision list under the fingerprint, and /plan and the planning
  skill tell the planner to copy that list into the plan's cites. A cite the scout leaves out stays, so syncing no longer
  moves the fingerprint and forces a pointless re-scout. /plan also names what moves the fingerprint.
blocks:
- id: plan-md-step6-cites
  file: .claude/commands/plan.md
  before: '**DO NOT present findings to the human until this gate completes.** Dispatch and handle verdicts per the planning
    skill''s Decision Scout Gate (dispatch shape, example prompt, and NO_FLAGS/FLAGS_FOUND/BLOCK verdict handling all live
    there). Substitute the synthesis produced in Steps 3-5 into the dispatch. First write the scratch draft (below) with the
    slug (derived from the task; Step 7 confirms it), intent, plan_type, verification_tier, phase, scope, closes_criteria,
    amends, introduces and `cites` (the human''s `dec:N` ids), and name it in the dispatch. Record the `scout_input_fingerprint=`
    line the scout prints on that round''s `gate_rounds` row, and write the exact `dec:` tokens the scout passed to `--with-cites`
    into the draft''s `cites`. A report without that line, or with FINGERPRINT-ERROR, is an incomplete gate.

    '
  after: '**DO NOT present findings to the human until this gate completes.** Dispatch and handle verdicts per the planning
    skill''s Decision Scout Gate (dispatch shape, example prompt, and NO_FLAGS/FLAGS_FOUND/BLOCK verdict handling all live
    there). Substitute the synthesis produced in Steps 3-5 into the dispatch. First write the scratch draft (below) with the
    slug (derived from the task; Step 7 confirms it), intent, plan_type, verification_tier, phase, scope, closes_criteria,
    amends, introduces and `cites` (the human''s `dec:N` ids), and name it in the dispatch. Record the `scout_input_fingerprint=`
    line the scout prints on that round''s `gate_rounds` row, and set the draft''s `cites` to the `cites=` line printed under
    it: the draft''s own cites plus the scout''s CITE ids, so a cite the scout left out stays. Only a hashed input moves the
    fingerprint (intent, scope paths, tier, plan type, cites, amends, introduces, each cited or amended Decision''s text,
    the named roadmap items and the rows the scope touches, approved-text blocks on the Decisions, roadmap or north-star files,
    the north star), never context, verification_plan or another field `FIELD_CLASSES` excludes. A report without the `scout_input_fingerprint=`
    and `cites=` lines, or with FINGERPRINT-ERROR, is an incomplete gate.

    '
- id: planning-skill-scout-convergence
  file: .claude/skills/planning/SKILL.md
  before: '**Convergence rule -- findings, not rounds:** each row records the printed `scout_input_fingerprint`; the plan''s
    `cites` holds the `dec:` tokens fed to `--with-cites`; re-dispatch after a BLOCK pivot or when the fingerprint moves (project-alignment
    task_sequencing), never otherwise; escalate at once when a pivot is re-BLOCKed on the same decision id, naming whether
    the intent contradicts it (re-scope) or it needs revisiting (file a rec; record accept-with-deferral); only admin bypass
    merges it. Carrier (AskUserQuestion, chat or GATE_REQUEST) and stop as in Step 9.

    '
  after: '**Convergence rule -- findings, not rounds:** each row records the printed `scout_input_fingerprint`; the plan''s
    `cites` is the printed `cites=` line; re-dispatch after a BLOCK pivot or when the fingerprint moves (project-alignment
    task_sequencing), never otherwise; escalate at once when a pivot is re-BLOCKed on the same decision id, naming whether
    the intent contradicts it (re-scope) or it needs revisiting (file a rec; record accept-with-deferral); only admin bypass
    merges it. Carrier (AskUserQuestion, chat or GATE_REQUEST) and stop as in Step 9.

    '
- id: planning-skill-gate-error-cites
  file: .claude/skills/planning/SKILL.md
  before: '- **Gate-error:** the gate has NOT completed if the subagent errors, its output lacks the `Verdict:` line, lacks
    "Decisions triaged: N of M" or shows N != M (a truncated read), or lacks the fingerprint line or shows FINGERPRINT-ERROR
    -- re-dispatch; never proceed past an incomplete gate.

    '
  after: '- **Gate-error:** the gate has NOT completed if the subagent errors, its output lacks the `Verdict:` line, lacks
    "Decisions triaged: N of M" or shows N != M (a truncated read), or lacks the fingerprint line or `cites=` line or shows
    FINGERPRINT-ERROR -- re-dispatch; never proceed past an incomplete gate.

    '
- id: skill-test-cites-pin
  file: tests/test_planning_skill_scout_fingerprint.py
  before: '    assert "the plan''s `cites` holds the `dec:` tokens fed to `--with-cites`" in gate

    '
  after: "    assert \"the plan's `cites` is the printed `cites=` line\" in gate\n    step6 = _step(_PLAN_MD, 6)\n    assert\
    \ \"`cites=` line printed under it\" in step6 and \"a cite the scout left out stays\" in step6\n    assert \"never context,\
    \ verification_plan\" in step6 and \"write the exact `dec:` tokens\" not in step6\n"
