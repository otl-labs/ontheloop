schema_version: 1
slug: scout-input-fingerprint
tldr: 'Plans can list the Decisions they rely on in a typed cites field (plan format 6). The exit-criteria ledger documents that field and defines the scout-input fingerprint a scout round records: exactly which plan inputs it hashes, how, and that a recorded fingerprint never excuses a re-scout because every reader recomputes it. One stale ''not built'' pointer now names the new extractor, and seven old amendment rows are reflowed to one line each (words unchanged) to stay under the size cap.'
blocks:
- id: l01-description
  file: docs/contracts/exit-criteria-ledger.yaml
  before: |2-
        declared plan edges PlanDocument.amends / PlanDocument.introduces / PlanDocument.principal,
        with the roadmap_alignment_projection audit_invariant.
  after: |2-
        declared plan edges PlanDocument.amends / PlanDocument.cites / PlanDocument.introduces / PlanDocument.principal,
        with the roadmap_alignment_projection audit_invariant, and the gate-row field
        GateRound.scout_input_fingerprint.
- id: l02-amends-consumer
  file: docs/contracts/exit-criteria-ledger.yaml
  before: '      Consumer: T4.32 c4''s single plan-edge extractor, not built and not claimed here.'
  after: |2-
          Consumer: the single plan-edge extractor (scripts/roadmap/plan_edges.py; T4.32 c4), which feeds the
          scout-input fingerprint (scripts/roadmap/plan_fingerprint.py).
- id: l03-cites-and-fingerprint-fields
  file: docs/contracts/exit-criteria-ledger.yaml
  before: |2
          The plan author at /plan time, when the plan introduces a named artefact; omitted otherwise.
        dq_intent: {}
      plan_principal:
  after: |2
          The plan author at /plan time, when the plan introduces a named artefact; omitted otherwise.
        dq_intent: {}
      plan_cites:
        type: "list[str]"
        description: >-
          PlanDocument.cites field (scripts/roadmap/plan_document.py) -- the decisions that govern a plan's approach, declared
          as typed tokens so the plan-edge extractor reads a field instead of free text.
        semantics: >-
          Each entry is a "dec:<number>[#<clause-id>]" token with plan_amends' grammar and clause deferral. Holds the ids the
          human cited and every id on the decision scout's CITE list; the scout-input fingerprint (plan_scout_input_fingerprint)
          hashes each cited and amended decision's content. The context CITE line stays the verbatim scout record and the
          extractor never reads it. A DECLARATION, never the durable record (Decision 197 cl.5). Refused below schema_version 6.
          Default [].
        populated_by: >-
          The plan author at /plan time: the human-cited ids before the scout runs, the scout's CITE ids after it.
        governance_notes: >-
          Decision 181 cl.2 per-surface coverage: token shape and the version floor are enforced by validate_plan_documents in
          both tiers; existence of the named decision is UNENFORCED, owned by rec-4517; that a plan's cites hold the scout's
          CITE ids is enforced only by the fingerprint comparison rec-4490's plan adds.
        dq_intent: {}
      plan_scout_input_fingerprint:
        type: "str | None"
        description: >-
          GateRound.scout_input_fingerprint field (scripts/roadmap/plan_gate_rounds.py), on decision-scout rows of a plan's
          gate_rounds -- the scout-input fingerprint T4.32 c4 binds a scout verdict to (Decision 229 cl.4, Decision 217 cl.8).
        semantics: >-
          Computed only by scripts.roadmap.plan_fingerprint over the edges scripts.roadmap.plan_edges extracts (THE single
          plan-edge extractor); no other module re-derives either. Payload keys, exactly: v; intent, whitespace runs collapsed
          to one space; scope_paths; verification_tier; plan_type; cites; amends; introduces; decisions, one [number,
          content_hash] pair per cited or amended decision, content_hash being scripts.decisions_md's sha256 of that decision's
          raw block in the fingerprinted tree, null when no such decision exists, a #clause resolving to the whole decision
          until Decision 196 cl.8's split; items, the item half of each closes_criteria token plus phase's first token when it
          has a tier_item id's shape; edges, each such item's depends_on and start_edges in that tree's roadmap as
          scripts.roadmap.platform_roadmap.load reads it (archived stubs hydrated), null for an item it lacks;
          roadmap_projection, scripts.roadmap.scope_projection.project_items over scope_paths, the roadmap rows the scout's
          ROADMAP overlay reads, sorted by id; approved_blocks, the sha256 of [file, words(before), words(after)] for each
          approved-text sidecar block on docs/DECISIONS.md, docs/ROADMAP-PLATFORM.yaml or docs/contracts/north-star.yaml; and
          north_star, the sha256 of docs/contracts/north-star.yaml's bytes, null when absent. Lists sorted and de-duplicated;
          canonical JSON (sorted keys, compact separators, UTF-8); recorded as "v<N>:<64 lowercase hex>", N raised on any
          payload change, so an older record never equals a newer digest. phase, closes_criteria and slug feed derived keys
          only; every other plan field is excluded, context, scope purposes, execution_steps, constraints, acceptance_criteria,
          verification_plan and gate_rounds among them, and a test fails while any PlanDocument or ScopeEntry field is
          classified neither hashed, derived nor excluded. Fail closed: a plan, roadmap, decision file or sidecar that cannot be
          read or parsed is an error, never a digest. The recorded value is a run fact, the digest of the scouted input with the
          scout's CITE ids merged into cites; it never excuses a scout, and every reader recomputes and compares rather than
          trusting it (Decision 205 cl.5). Optional; default None.
        populated_by: >-
          The planner, when it records a decision-scout round: bin/venv-python -m scripts.roadmap.plan_fingerprint --plan
          <draft> --with-cites <the scout's CITE ids>.
        governance_notes: >-
          Decision 181 cl.2 per-surface coverage: shape and decision-scout-only placement are enforced by
          validate_plan_documents in both tiers; that the recorded value equals the recomputed one is UNENFORCED until
          rec-4490's plan adds the comparison, and on Actions until rec-5103's verdict jobs.
        dq_intent: {}
      plan_principal:
