schema_version: 1
slug: scout-north-star-lane
blocks:
- id: scout-intent
  file: .claude/skills/decision-scout/SKILL.md
  before: |
    Given a proposed plan approach, surface every active decision that is relevant
  after: |
    Given a proposed plan approach, read the north stars first (step 0), then surface every active decision that is relevant
- id: scout-intent-bounded
  file: .claude/skills/decision-scout/SKILL.md
  before: |
    plus targeted reads of shortlisted entries -- the corpus never loads wholesale; only the structured summary returns.
  after: |
    plus targeted reads of shortlisted entries; only the structured summary returns.
- id: scout-gate-line
  file: .claude/skills/decision-scout/SKILL.md
  before: |
    A BLOCKING gate before `/plan` Step 6. A superficial scan that misses a contradiction is worse than not running -- the parent and human both trust this output to be exhaustive.
  after: |
    A BLOCKING `/plan` Step 6 gate whose output the parent and human trust as exhaustive.
- id: scout-t15-redundant
  file: .claude/skills/decision-scout/SKILL.md
  before: |
    See the same contract's `gate_subagent_retrieval.substrate_swap_contract`; T1.5 c1 owns the swap.
  after: |
    See the same contract's `gate_subagent_retrieval.substrate_swap_contract`.
- id: scout-step0
  file: .claude/skills/decision-scout/SKILL.md
  before: |
    1. **Triage source.** Read `docs/decisions-index.json`
  after: |
    0. **North stars first.** Read `docs/contracts/north-star.yaml` in full before the index (rationale: `gate_subagent_retrieval.north_star_lane`).

    1. **Triage source.** Read `docs/decisions-index.json`
- id: scout-step1
  file: .claude/skills/decision-scout/SKILL.md
  before: |
    (provenance/hermeticity rationale: `gate_subagent_retrieval.triage_source_provenance`). Derive **M** = count of `live: true` entries -- the live-file header count, excluding the archive and distinct from the max decision number (numbering gaps). Each live entry's `title`, `triage_excerpt` (<=320 chars, Intent/Problem/Context/Decision fallback order; `triage_excerpt_source` names which; a small terse-historical band carries none), `currency`, and `category_tags` (deterministic artifact/process tags, e.g. `lambda`/`terraform`/`iam`/`secrets`/`deploy`/`egress`) is the Phase 2 signal -- never a whole-file load here.
  after: |
    (rationale: `gate_subagent_retrieval.triage_source_provenance`). Derive **M** = count of `live: true` entries, never the max decision number (numbering gaps). Each live entry's `title`, `triage_excerpt` (<=320 chars; its marker in `triage_excerpt_source`), `currency` and `category_tags` is the Phase 2 signal -- never a whole-file load here.
- id: scout-step3
  file: .claude/skills/decision-scout/SKILL.md
  before: |
    a mechanical set-intersection, never per-entry judgment (many decisions govern by ARTIFACT TYPE, not topic keyword). THEN classify
  after: |
    a mechanical set-intersection, never per-entry judgment (many decisions govern by ARTIFACT TYPE, not topic keyword). SECOND, run `bin/venv-python -m scripts.north_star_shortlist <ids>` on the north stars the approach serves or nears the failure_signal of; add what it prints (serves_only: RELATED at most); non-zero exit: their `carried_by` by hand. THEN classify
- id: scout-step3-final
  file: .claude/skills/decision-scout/SKILL.md
  before: |
    Tag-matched + non-IRRELEVANT
  after: |
    Tag- or `carried_by`-matched + non-IRRELEVANT
- id: scout-step6
  file: .claude/skills/decision-scout/SKILL.md
  before: |
    (e.g. pg_dump/pg_restore instead of Neon branching). Fires even if previously recorded as a "human decision" -- that does not exempt it. Decision 100 extends Decision 75 to ALL managed services.
  after: |
    (e.g. pg_dump/pg_restore instead of Neon branching), for ALL managed services (Decision 100), even one a prior "human decision" accepted.
- id: scout-spirit-intro
  file: .claude/skills/decision-scout/SKILL.md
  before: |
    without contradicting any single clause. Gated hard against noise -- defensive-over-citation applies with FULL force here. Emit a SPIRIT flag ONLY when ALL FOUR hold:
  after: |
    without contradicting any single clause. Emit a SPIRIT flag ONLY when ALL FOUR hold:
- id: scout-spirit-ii
  file: .claude/skills/decision-scout/SKILL.md
  before: |
    OR -- widened for bounded retrieval -- the `**Decision:**` clause (a REQUIRED marker per `docs/contracts/decision-entry.yaml`, the most reliable fallback). Ungrounded means no flag. The terse-historical residual (no quotable marker, no SPIRIT flag) is Decision 160 point 8.
  after: |
    OR the `**Decision:**` clause (a REQUIRED marker, the most reliable fallback). Ungrounded means no flag.
- id: scout-spirit-north-star
  file: .claude/skills/decision-scout/SKILL.md
  before: |2
       - (iv) **Capped at 3.** Keep the 3 highest-severity (WARN over NOTE) if more qualify.
  after: |2
       - (iv) **Capped at 3.** Keep the 3 highest-severity (WARN over NOTE) if more qualify.

       **North stars feed this lane only**, never CONTRADICT or BLOCK: a flag on `NS.n` or `mission` quotes its failure_signal or principle for (ii) and shares the cap, Decision flags first on a tie. If a CONTRADICT on one of its `carried_by` names the same element, fold it there as "carries NS.n".
- id: scout-template
  file: .claude/skills/decision-scout/SKILL.md
  before: |
    [(showing 5 of K) if K > 5]

    ### Verdict
  after: |
    [(showing 5 of K) if K > 5]

    ### North-Star Alignment (NORTH STAR)
    - Serves: [NS.n | mission | none] X/5 -- [1-2 sentences; 1 = no link to the Intent, 5 = directly advances it]
    - Engaged: [ids passed in step 3, or None]

    ### Verdict
- id: scout-copy
  file: .claude/skills/decision-scout/SKILL.md
  before: |
    (Planning agent: copy both count lines verbatim into the plan's scout context line.)
  after: |
    (Planning agent: copy both count lines verbatim into the plan's scout context line. Copy the Serves line too.)
- id: scout-cap
  file: .claude/skills/decision-scout/SKILL.md
  before: |
    Cap total response at ~1,200 words (ROADMAP share: <=150). The planning agent reads this verbatim and surfaces it to the human; bloat dilutes the signal. Revisit:
  after: |
    Cap total response at ~1,200 words (ROADMAP share: <=150). Revisit:
- id: scout-quality-gate-shortlist
  file: .claude/skills/decision-scout/SKILL.md
  before: |
    - [ ] You applied the mechanical tag shortlist (step 3) before judgment,
  after: |
    - [ ] You read north-star.yaml first, applied both mechanical shortlists (step 3) before judgment,
- id: scout-quality-gate
  file: .claude/skills/decision-scout/SKILL.md
  before: |
    - [ ] SPIRIT flags number <= 3, and no decision appears in both SPIRIT and CONTRADICT

    If any checkbox is false, fix before returning -- the caller cannot self-verify these; a malformed output forces re-dispatch.
  after: |
    - [ ] SPIRIT flags number <= 3, no decision appears in both SPIRIT and CONTRADICT, and no north star in CONTRADICT
    - [ ] NORTH STAR carries a score

    If any checkbox is false, fix it before returning.
- id: scout-output-rule
  file: .claude/skills/decision-scout/SKILL.md
  before: |
    Each section is mandatory even when empty -- render `None` there -- so the planning agent's parsing logic never has to branch.
  after: |
    Each section is mandatory even when empty -- render `None` there.
- id: scout-anti-overcitation
  file: .claude/skills/decision-scout/SKILL.md
  before: |
    governs the approach's *action*; be ruthless -- CITE only when omission would meaningfully harm the plan. Long form:
  after: |
    governs the approach's *action*; CITE only when omission would meaningfully harm the plan. Long form:
- id: scout-anti-hedged
  file: .claude/skills/decision-scout/SKILL.md
  before: |
    "This *might* contradict Decision N." -> either it does or it doesn't. If undetermined, mark NOTE and explain what's uncertain. Hedge in the explanation, not the classification.
  after: |
    "This *might* contradict Decision N" is no classification: if undetermined, mark NOTE and hedge in the explanation.
- id: critique-intent
  file: .claude/skills/plan-critique/SKILL.md
  before: |
    This BLOCKING gate assesses strategic soundness, bounds, and North Star alignment; formatting-only review is insufficient.
  after: |
    This BLOCKING gate assesses strategic soundness and bounds; formatting-only review is insufficient.
- id: critique-step2
  file: .claude/skills/plan-critique/SKILL.md
  before: |
    2. Read `docs/PROJECT_CONTEXT.md` in full (for North Star and rules).
  after: |
    2. Read `docs/PROJECT_CONTEXT.md` in full (for rules); read `docs/contracts/north-star.yaml` when a Phase 2b answer turns on a north star.
- id: critique-step7
  file: .claude/skills/plan-critique/SKILL.md
  before: |
    7. **Score North Star alignment (1-5):** Does the `## Intent` section directly serve a North Star principle (NS.1-NS.5, `docs/ROADMAP-PLATFORM.yaml`)? A score of 1 means no discernible connection; 5 means it directly advances one. Name it and give a 1-2 sentence justification.
  after: |
    7. **North Star alignment is the decision scout's (Decision 243 clause 8):** quote its Serves line from the plan's `context`; never re-score it. Absent: a nit.
- id: critique-files-read
  file: .claude/skills/plan-critique/SKILL.md
  before: |
    **Files Read:** [plan path; docs/PROJECT_CONTEXT.md;
  after: |
    **Files Read:** [plan path; docs/PROJECT_CONTEXT.md; docs/contracts/north-star.yaml (if read);
- id: critique-output
  file: .claude/skills/plan-critique/SKILL.md
  before: |
    **North Star Alignment:** X/5 -- [1-2 sentence justification]
  after: |
    **North Star Alignment:** [the scout's Serves line, quoted] / absent (nit)
