schema_version: 1
slug: secret-read-exact-target
tldr: 'Makes every protected-action approve line name exactly what it covers: secret-read targets become exact, case-sensitive secret names (entry
  points declare theirs, a read the gate cannot name is never approvable), any stops approving any class, and sync-terraform-assets.sh --tfvars
  also needs the admin-credential line for the profile it uses.'
blocks:
- id: protected-version
  file: docs/contracts/protected-actions.yaml
  before: |2
      contract_version: 1
  after: |2
      contract_version: 2
- id: protected-log
  file: docs/contracts/protected-actions.yaml
  before: |
    amendment_log:
  after: |
    amendment_log:
      - date: "{{DATE}}"
        semantic_break: true
        change_class: accepted_values_narrow
        summary: >-
          PLAN-secret-read-exact-target (rec-5124): an approve line covers only the target it names, never any.
          secret-read targets are exact, case-sensitive secret names, one per secret a command names; an entry point's
          come only from entry_point_reads, and a read the gate cannot name is unknown. admin-credential also fires on an
          entry point in entry_point_profiles.
        migration_story: >-
          An "approve secret-read any" or "approve admin-credential any" line no longer approves: ask again with the
          exact line the deny prints. A read the gate cannot name (inline code, by-path, ARN, --filters or
          --cli-input-json) is rewritten as an aws call naming each secret, or as a declared entry point.
- id: secret-read-target
  file: docs/contracts/protected-actions.yaml
  before: |2
        entry_points:
          - .github/actions/materialise-tfvars/materialise_tfvars.sh
          - bin/sync-terraform-assets.sh --tfvars
          - scripts/ci/neon_api_key.sh
          - scripts/ci/terraform_github_apply.sh
        target: the --secret-id, --name, --names or --path value, else any
  after: |2
        entry_points:
          - .github/actions/materialise-tfvars/materialise_tfvars.sh
          - bin/sync-terraform-assets.sh --tfvars
          - scripts/ci/neon_api_key.sh
          - scripts/ci/terraform_github_apply.sh
        entry_point_reads:
          .github/actions/materialise-tfvars/materialise_tfvars.sh: [/secret/agent-platform-terraform-personal-tfvars]
          bin/sync-terraform-assets.sh --tfvars: [/secret/agent-platform-terraform-personal-tfvars]
          scripts/ci/neon_api_key.sh: [/secret/neon-api-key]
          scripts/ci/terraform_github_apply.sh: [agent-platform-terraform-github-apply-app]
        entry_point_reads_note: >-
          The secrets each entry point reads, copied from its script, which is the source: a test fails when a script
          reads a secret this map does not list for it, or does not read one it lists. An entry point's targets are these
          names only, never a flag in its arguments.
        target: >-
          Each secret the command names, one target per name: every --secret-id, --name, --names or --secret-id-list
          value, at every occurrence, with an SSM :version or :label suffix dropped; for an entry point, its
          entry_point_reads names. Anything the gate cannot name is unknown, which is never approvable: a value that is
          not literal, a Secrets Manager value containing a colon or an SSM value starting arn: (an ARN), a command that
          carries --filters or --cli-input-json or names no secret, get-parameters-by-path, inline code, and an entry
          point missing from entry_point_reads.
        target_case: exact
- id: admin-entry-point
  file: docs/contracts/protected-actions.yaml
  before: |2
          TF_VAR_ do not clear this, because the terraform backends read the ambient profile.
        admin_default_roots: [terraform/bootstrap, terraform/personal]
  after: |2
          TF_VAR_ do not clear this, because the terraform backends read the ambient profile. (4) A command that runs an
          entry point in entry_point_profiles, whose script selects that profile itself.
        admin_default_roots: [terraform/bootstrap, terraform/personal]
        entry_point_profiles:
          bin/sync-terraform-assets.sh --tfvars: agent_platform_admin
- id: grammar-notes
  file: docs/contracts/protected-actions.yaml
  before: |2
      grammar_notes: >-
        Case-insensitive; a whole line, or a whole comma-separated item, is one approval, so a line that only mentions
        one ("do not approve ...") is none; one message may carry several. Target any covers every target of a session
        class. <commit> is at least 7 hex characters of a commit id.
  after: |2
      grammar_notes: >-
        Case-insensitive, except the target of a class whose target_case is exact, which matches only as written; a
        whole line, or a whole comma-separated item, is one approval, so a line that only mentions one ("do not approve
        ...") is none; one message may carry several. An approval covers only the target it names: any is not a target,
        and unknown is never approvable. <commit> is at least 7 hex characters of a commit id.
- id: known-limit-branch
  file: docs/contracts/protected-actions.yaml
  before: |
    known_limits:
  after: |
    known_limits:
      - >-
        The hook runs the gate code in the session's working tree, so a session on a branch from before contract_version
        2 still accepts any and still refuses an exact name for an entry point until it rebases onto main.
