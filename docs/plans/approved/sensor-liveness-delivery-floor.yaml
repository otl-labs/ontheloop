schema_version: 1
slug: sensor-liveness-delivery-floor
tldr: "Raises the scheduled-loop liveness alarm's minimum threshold from 6 to 24 hours, because GitHub runs this repo's
  sub-daily crons up to about 12 hours late; records the new floor, its detection latency, the fleet rule's new numbers and the
  per-episode rec bound in the source registry, and adds one dated update line each to Decisions 250 and 62."
blocks:
- id: registry-threshold
  file: config/agent/data_quality/source_registry.yaml
  before: |
    (a) threshold = clamp(2 x nominal
          cron period, 6h, 45d) -- the floor tolerates GitHub's best-effort scheduled delivery on the
          two hourly loops (~5 missed runs), the ceiling is the LARGEST threshold whose first staleness
  after: |
    (a) threshold = clamp(2 x nominal
          cron period, 24h, 45d) -- the floor tolerates GitHub's best-effort scheduled delivery, which here
          runs every sub-daily cron up to about 12 hours past its nominal time whatever its period (up to 89 days
          to 2026-11-12, worst gaps: 12.7h hourly, 14.6h every-3-hours, 16.0h every-6-hours, 15.9h
          every-12-hours; PLAN-sensor-liveness-delivery-floor, rec-4931), so every sub-daily cron shares
          the one 24h floor; the ceiling is the LARGEST threshold whose first staleness
- id: registry-latency
  file: config/agent/data_quality/source_registry.yaml
  before: |
    clamp imposes a numeric detection latency per cadence class -- 6 hours to detect a dead hourly
          loop, 14 days a dead weekly loop, 45 days a dead monthly loop -- applied identically to both
          legs.
  after: |
    clamp imposes a numeric detection latency per cadence class -- 24 hours to detect a dead
          sub-daily loop, 48 hours a dead daily loop, 14 days a dead weekly loop, 45 days a dead monthly
          loop -- applied identically to both legs.
- id: registry-fleet
  file: config/agent/data_quality/source_registry.yaml
  before: |
    defects; 3 rather than a 5-of-9 majority because the live threshold classes are 6h x3 (both
          hourly loops plus the every-3-hours loop), 14d x5 (the weeklies) and 45d x1 (the monthly), so
          a total delivery outage reaches 3 stale at T+6h but would not reach a majority until T+14d --
          a majority rule would have missed the 2026-08-15 OIDC-rename incident (Decision 172) entirely,
          since it resolved within days.
  after: |
    defects; 3 rather than an 8-of-15 majority because the live threshold classes are 24h x6 (the
          three hourly loops and the every-3-hours, every-6-hours and every-12-hours loops), 48h x2 (the
          dailies), 14d x6 (the weeklies) and 45d x1 (the monthly), so a total delivery outage reaches 3
          stale at T+24h but a majority only at T+48h -- a correlated outage such as the 2026-08-15
          OIDC-rename incident (Decision 172) gets its one fleet rec a day sooner than a majority rule would give it.
- id: registry-episode-bound
  file: config/agent/data_quality/source_registry.yaml
  before: |
    bounding recs per EPISODE (~11/year for a permanently-dead loop) but not episode
  after: |
    bounding recs per EPISODE (~9/year for a permanently-dead sub-daily loop) but not episode
- id: decision-250-update
  file: docs/DECISIONS.md
  before: |
    **Related:** Decisions 55, 62, 83, 88, 167, 170, 181, 210, 215, 226, 236; rec-4233, rec-4439, rec-4734, rec-4939, rec-4940, rec-4949.
  after: |
    **Related:** Decisions 55, 62, 83, 88, 167, 170, 181, 210, 215, 226, 236; rec-4233, rec-4439, rec-4734, rec-4939, rec-4940, rec-4949.

    > **Update ({{DATE}}):** Clause 3's last sentence no longer holds for the threshold. PLAN-sensor-liveness-delivery-floor (rec-4931) raised the sweep's floor from 6 to 24 hours to fit up to 89 days of measured GitHub schedule delivery, whose worst sub-daily gap was 16 hours, so every sub-daily loop is judged at 24 hours and a dead one is found within a day. rec-4233 still owns delivery itself, and a tighter floor waits for it. telemetry-arrival, the one enforced expectation, was already judged at 24 hours.
- id: decision-62-update
  file: docs/DECISIONS.md
  before: |
    > **Update (2026-11-07):** Decision 250 clause 4 amends the 2026-06-16 amendment above for arrival checks: an arrival check may be ci-rca watched instead of filing its own recs, so its red files a source=ci_rca rec under Decision 226. Every other live-reader check keeps the 2026-06-16 route.
  after: |
    > **Update (2026-11-07):** Decision 250 clause 4 amends the 2026-06-16 amendment above for arrival checks: an arrival check may be ci-rca watched instead of filing its own recs, so its red files a source=ci_rca rec under Decision 226. Every other live-reader check keeps the 2026-06-16 route.

    > **Update ({{DATE}}):** The threshold the 2026-09-25 correction quotes is now clamp(2 x nominal cron period, 24h, 45d) (PLAN-sensor-liveness-delivery-floor, rec-4931); the loop_liveness_stale row of config/agent/data_quality/source_registry.yaml is authoritative. The weekly coincidence that correction describes (2 x 7 days = 14 days) is unchanged.
