      - {date: "{{DATE}}", semantic_break: false, change_class: field_add, summary: "PLAN-serves-claim-verification (rec-4915): serves gains verification, the evidence a serves id needs, and plan-critique step 12p, not the decision scout, verifies the claim. Three 2026 rows above were rewritten in flow style, words unchanged."}
- id: entry-serves-verification
  file: docs/contracts/decision-entry.yaml
  before: |2
          semantics: >-
            The north stars this Decision serves, as declared by its author. Advisory: the decision scout verifies the
            claim and the operator promotes it; it grants nothing. The mission is not nameable. A north star's carried_by
            list is the authoritative reverse link, and serves never edits it.
  after: |2
          semantics: >-
            The north stars this Decision serves, as declared by its author. Advisory: plan-critique step 12p verifies the
            claim (verification below) and the operator promotes it; it grants nothing. The mission is not nameable. A
            north star's carried_by list is the authoritative reverse link, and serves never edits it.
          verification: >-
            Each id needs one verbatim sentence from the Decision's own clauses (decision-kind.yaml own_clauses; an Intent
            or Problem sentence alone never counts) that advances that north star's principle or guards against its
            failure_signal. A link from the Decision's amends, supersedes or Related line into the north star's carried_by
            corroborates and never substitutes, and the decision scout's Serves line, which scores the plan and stays
            plan-critique step 7's, is a witness, never the evidence. An id no such sentence supports is a REVISE: drop
            the id or re-point it to the north star the sentence serves, never add text to fit the claim.
