schema_version: 1
slug: serves-claim-verification
blocks:
- id: critique-12p-header
  file: .claude/skills/plan-critique/SKILL.md
  before: |
    No other check here asks whether a drafted numbered Decision's claimed significance row and kind match its body.
  after: |
    No other check here asks whether a drafted numbered Decision's claimed significance row, kind and serves match its body.
- id: critique-12p-trigger
  file: .claude/skills/plan-critique/SKILL.md
  before: |
    A `docs/DECISIONS.md` scope row that adds ONLY a dated amendment trailer -- no drafted numbered heading -- does NOT fire this check: an amendment carries no significance envelope to adjudicate.
  after: |
    A row adding only a dated amendment trailer does not fire it: an amendment carries no envelope.
- id: critique-12p-verdict
  file: .claude/skills/plan-critique/SKILL.md
  before: |
    for the claimed row, and the own clause deciding `decision-kind.yaml`'s `test` for `kind.value`. Either mismatch is REVISE-worthy on its own -- a mandatory gate, never surface-and-defer.
  after: |
    for the claimed row, the own clause deciding `decision-kind.yaml`'s `test` for `kind.value`, and for each `serves` id the sentence `decision-entry.yaml`'s `serves.verification` requires (`plan_obligations` prints the north star). Any mismatch is REVISE-worthy on its own -- a mandatory gate, never surface-and-defer.
- id: critique-12p-na
  file: .claude/skills/plan-critique/SKILL.md
  before: |
    When the trigger does not fire, the Phase-3 row emits "Category consistency: N/A -- plan drafts no numbered Decision text", so a silent omission is distinguishable from a pass.
  after: |
    Untriggered, emit the Phase-3 row's N/A form, so a silent omission is distinguishable from a pass.
- id: critique-12p-row
  file: .claude/skills/plan-critique/SKILL.md
  before: |
    supports claimed [routing row] / REVISE -- claimed [routing row] but body reads: "[verbatim quote]"
  after: |
    supports claimed [row, kind, NS.n] / REVISE -- claimed [row, kind, NS.n] but body reads: "[verbatim quote]" or no sentence supports it
