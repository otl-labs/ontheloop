- id: deploy-paths-organization-row
  file: docs/contracts/deploy-paths.yaml
  before: |2
      github_settings_apply_provisioning:
  after: |2
      organization_provisioning:
        description: "Decision {{N}} cl.7's admin tier for terraform/organization (the AWS Organization root, SCPs included), run by the operator as Decision 256 cl.3 directs: every plan, apply and out-of-Terraform act is a block an agent prepares and the operator pastes into AWS CloudShell in the management account, signed in with MFA as the console-only IAM user org-admin-operator and switched to role OrganizationAdmin, after pre_merge_live_plan, one sitting at a time and never beside another admin apply. No agent environment and no CI role holds a management-account identity. Outside Terraform those blocks run only the state bucket's create-bucket, the PROD invitation and an emergency detach-policy. The operator alone signs up an account, seeds the user and role as root, sets the user's password and MFA, accepts the invitation in PROD as the break-glass user, and removes or closes an account."
        procedure_ref: "terraform/organization/CLAUDE.md -- the seed block, the sitting order and the read-backs (navigation only)."
      github_settings_apply_provisioning:
