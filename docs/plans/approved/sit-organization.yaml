- id: decision-113-note
  file: docs/DECISIONS.md
  before: |
    > **Update (2026-10-25):** The agent_static key no longer sits in the containers. Each cloud environment's agent proxy holds it as an AWS network secret and signs requests to the project region's STS host only; `~/.aws` holds placeholder credentials printed by `bin/aws-proxy-placeholder-credentials` (rec-4510, PLAN-agent-aws-proxy-credentials). Because the proxy re-signs every call to that host as the IAM user, identity checks read the assumed role from a second region's STS host (`scripts/aws_identity.py` `caller_arn`). The two roles, their ExternalId conditions and the two-principal semantic are unchanged.
  after: |
    > **Update (2026-10-25):** The agent_static key no longer sits in the containers. Each cloud environment's agent proxy holds it as an AWS network secret and signs requests to the project region's STS host only; `~/.aws` holds placeholder credentials printed by `bin/aws-proxy-placeholder-credentials` (rec-4510, PLAN-agent-aws-proxy-credentials). Because the proxy re-signs every call to that host as the IAM user, identity checks read the assumed role from a second region's STS host (`scripts/aws_identity.py` `caller_arn`). The two roles, their ExternalId conditions and the two-principal semantic are unchanged.

    > **Update ({{DATE}}):** The reversal's second account arrived with Decision {{N}}'s Organization. Identity Center was reconsidered and stays out (the operator's 2026-11-10 choice; Decision 242 cl.3 had removed its unused instance). The management account gets its own Pattern B lane instead: one IAM user whose key only a separate ADMIN cloud environment's proxy holds, assuming that account's OrganizationAdmin role (deploy-paths.yaml admin_out_of_band.organization_provisioning). This entry's two roles are unchanged.
- id: decision-202-note
  file: docs/DECISIONS.md
  before: |
    > **Update (2026-10-18):** Clause 6's "email until rec-4049 lands" is discharged by Decision 225: CI holds no IAM grant on PlatformDev, so the platform-role alarm has no sanctioned CI source. Alerts stay unfiltered by actor.
  after: |
    > **Update (2026-10-18):** Clause 6's "email until rec-4049 lands" is discharged by Decision 225: CI holds no IAM grant on PlatformDev, so the platform-role alarm has no sanctioned CI source. Alerts stay unfiltered by actor.
    >
    > **Update ({{DATE}}):** Clauses 1 and 2 read per account until the organisation trail (Decision {{N}} cl.8) replaces PROD's account trail: each account's Terraform owns one trail, and one principal holds the six verbs on that trail's ARN alone. In the Organization's management account, which no SCP reaches, the trail is agent-platform-org-security-trail in terraform/organization and the principal is OrganizationAdmin (Sid OrgSecurityTrailManage). StopLogging, DeleteTrail and cloudtrail:* stay banned in every grant; an SCP Deny that names them grants nothing. cloudtrail-write-grant-scoped-to-platform-trail checks both. PLAN-sit-organization.
