          (today terraform/bootstrap); a Markdown-only change is exempt.
  after: |2
          (today terraform/bootstrap and terraform/organization); a Markdown-only change is exempt.
- id: deploy-paths-env-check
  file: docs/contracts/deploy-paths.yaml
  before: |2
        - >-
          ENVIRONMENT CHECK: before assuming any post-merge hand-off, the implementing session checks
          its own credentials with `bin/venv-python -m scripts.aws_identity caller-arn --profile
          agent_platform_admin 2>/dev/null | grep -q 'assumed-role/PlatformAdmin/' && echo
          ADMIN_CHAIN_OK || echo ADMIN_CHAIN_ABSENT` (the helper reads the identity from a second
          region's STS host, because the agent proxy re-signs every call to the project region's STS
          host as the IAM user). ADMIN_CHAIN_OK: the session runs the gate itself.
          ADMIN_CHAIN_ABSENT: the PR waits at CI-green, the gate steps go to an ADMIN session, and the
          merge is held until the evidence is on the PR.
  after: |2
        - >-
          ENVIRONMENT CHECK: before assuming any post-merge hand-off, the implementing session checks its own credentials with `bin/venv-python -m scripts.aws_identity caller-arn --profile agent_platform_admin 2>/dev/null | grep -q 'assumed-role/PlatformAdmin/' && echo ADMIN_CHAIN_OK || echo ADMIN_CHAIN_ABSENT` (the helper reads the identity from a second region's STS host, because the agent proxy re-signs every call to the project region's STS host as the IAM user). ADMIN_CHAIN_OK: the session runs the gate itself. ADMIN_CHAIN_ABSENT: the PR waits at CI-green, the gate steps go to an ADMIN session, and the merge is held until the evidence is on the PR. For terraform/organization the same check reads --profile agent_platform_admin_org and assumed-role/OrganizationAdmin/, and only the management environment runs the gate.
