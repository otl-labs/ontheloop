- id: decision-113-note
  file: docs/DECISIONS.md
  before: |
    ---

    ## Decision 112: Ratify CD.21 -- CI migrated from self-hosted EC2 runner to GitHub-hosted runners + OIDC federation (Decided)
  after: |
    > **Update ({{DATE}}):** The reversal's second account arrived with Decision {{N}}'s Organization. Identity Center was reconsidered and stays out (the operator's 2026-11-10 choice; Decision 242 cl.3 had removed its unused instance). The management account's admin lane holds no access key: the operator signs in with MFA as the console-only IAM user org-admin-operator, switches to that account's OrganizationAdmin role in the console and runs AWS CloudShell in that role (Decision 256 cl.3; deploy-paths.yaml admin_out_of_band.organization_provisioning). This entry's two roles are unchanged.

    ---

    ## Decision 112: Ratify CD.21 -- CI migrated from self-hosted EC2 runner to GitHub-hosted runners + OIDC federation (Decided)
- id: decision-202-note
  file: docs/DECISIONS.md
  before: |
    ---

    ## Decision 201: Closure-time acceptance-verdict precondition -- a verdict LAYER asserted at update_rec, with a static evaluator wired in (amends Decision 103, 186) (Decided)
  after: |
    > **Update ({{DATE}}):** Clauses 1 and 2 read per account until the organisation trail (Decision {{N}} cl.8) replaces PROD's account trail: each account's Terraform owns one trail, and one principal holds the six verbs on that trail's ARN alone. In the Organization's management account, which no SCP reaches, the trail is agent-platform-org-security-trail in terraform/organization and the principal is OrganizationAdmin (Sid OrgSecurityTrailManage). StopLogging, DeleteTrail and cloudtrail:* stay banned in every grant; an SCP Deny that names them grants nothing. cloudtrail-write-grant-scoped-to-platform-trail checks both. PLAN-sit-organization.

    ---

    ## Decision 201: Closure-time acceptance-verdict precondition -- a verdict LAYER asserted at update_rec, with a static evaluator wired in (amends Decision 103, 186) (Decided)
- id: decision-252-note
  file: docs/DECISIONS.md
  before: |
    ---

    ## Decision 251: The SIT restore rehearsal runs as one human-directed ADMIN-agent sitting on ephemeral functions and a throwaway Neon branch, never on a production function, catalog or prefix (amends Decisions 81, 126 and 237) (Decided)
  after: |
    > **Update ({{DATE}}):** Clause 7's admin tier for terraform/organization runs as Decision 256 cl.3 directs: the operator pastes agent-prepared blocks into AWS CloudShell in the management account, the one-time seed as root and every later sitting signed in with MFA as the console-only IAM user org-admin-operator, switched in the console to role OrganizationAdmin; the apply comes only after deploy-paths.yaml pre_merge_live_plan, one sitting at a time and never beside another admin apply. No agent environment and no CI role holds a management-account identity. Outside Terraform those blocks run only the seed's IAM creates (the operator user, its group agent-platform-org-admin-operators with the group's inline policy and the user's membership, and the OrganizationAdmin role with its inline policy), the state bucket's create-bucket, the PROD invitation and an emergency detach-policy. The operator alone signs up an account, creates the tfvars parameter in the console, seeds the user, group and role as root, sets the user's password and MFA, accepts the invitation in PROD as the break-glass user, and removes or closes an account (deploy-paths.yaml admin_out_of_band.organization_provisioning; procedure in terraform/organization/CLAUDE.md; PLAN-sit-organization).

    ---

    ## Decision 251: The SIT restore rehearsal runs as one human-directed ADMIN-agent sitting on ephemeral functions and a throwaway Neon branch, never on a production function, catalog or prefix (amends Decisions 81, 126 and 237) (Decided)
