schema_version: 1
slug: sit-organization
tldr: "Makes terraform/organization an admin-only live root (taxonomy row, gate live root and admin profile, pre-merge plan rule with a management-profile check), adds the organization_provisioning carve-out naming who acts outside Terraform, records the management account, its key, its tfvars and the SIT account in the inventory, and adds dated notes on Decision 113 (Identity Center reconsidered; the management account gets its own key lane in a separate environment) and Decision 202 (one trail and one trail-write principal per account until the organisation trail)."
blocks:
- id: deploy-paths-organization-row
  file: docs/contracts/deploy-paths.yaml
  before: |2
      github_settings_apply_provisioning:
  after: |2
      organization_provisioning:
        description: "Decision {{N}} cl.7's admin tier for terraform/organization (the AWS Organization root, SCPs included): an ADMIN-session agent in the separate management cloud environment, whose proxy holds only the management account's admin IAM user key (profile agent_platform_admin_org, role OrganizationAdmin), applies it on the operator's explicit direction after pre_merge_live_plan, one sitting at a time and never beside another admin apply; never self-directed. Outside Terraform that agent runs, each on the operator's direction, only the state bucket's create-bucket, the PROD invitation and an emergency detach-policy. The operator alone signs up an account, mints the management key, seeds the OrganizationAdmin role, accepts the invitation in PROD as the break-glass user, and removes or closes an account."
        procedure_ref: "terraform/organization/CLAUDE.md -- the sitting order, the seed commands and the read-backs (navigation only)."
      github_settings_apply_provisioning:
- id: deploy-paths-premerge-roots
  file: docs/contracts/deploy-paths.yaml
  before: |2
          (today terraform/bootstrap); a Markdown-only change is exempt.
  after: |2
          (today terraform/bootstrap and terraform/organization); a Markdown-only change is exempt.
- id: deploy-paths-env-check
  file: docs/contracts/deploy-paths.yaml
  before: |2
        - >-
          ENVIRONMENT CHECK: before assuming any post-merge hand-off, the implementing session checks
          its own credentials with `bin/venv-python -m scripts.aws_identity caller-arn --profile
          agent_platform_admin 2>/dev/null | grep -q 'assumed-role/PlatformAdmin/' && echo
          ADMIN_CHAIN_OK || echo ADMIN_CHAIN_ABSENT` (the helper reads the identity from a second
          region's STS host, because the agent proxy re-signs every call to the project region's STS
          host as the IAM user). ADMIN_CHAIN_OK: the session runs the gate itself.
          ADMIN_CHAIN_ABSENT: the PR waits at CI-green, the gate steps go to an ADMIN session, and the
          merge is held until the evidence is on the PR.
  after: |2
        - >-
          ENVIRONMENT CHECK: before assuming any post-merge hand-off, the implementing session checks its own credentials with `bin/venv-python -m scripts.aws_identity caller-arn --profile agent_platform_admin 2>/dev/null | grep -q 'assumed-role/PlatformAdmin/' && echo ADMIN_CHAIN_OK || echo ADMIN_CHAIN_ABSENT` (the helper reads the identity from a second region's STS host, because the agent proxy re-signs every call to the project region's STS host as the IAM user). ADMIN_CHAIN_OK: the session runs the gate itself. ADMIN_CHAIN_ABSENT: the PR waits at CI-green, the gate steps go to an ADMIN session, and the merge is held until the evidence is on the PR. For terraform/organization the same check reads --profile agent_platform_admin_org and assumed-role/OrganizationAdmin/, and only the management environment runs the gate.
