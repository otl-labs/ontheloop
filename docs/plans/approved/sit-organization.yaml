schema_version: 1
slug: sit-organization
tldr: 'Makes terraform/organization an admin-only live root (taxonomy row, gate live root, pre-merge plan rule), adds organization_provisioning: the operator runs every admin step as a CloudShell block, signed in as a console-only user with MFA and switched to OrganizationAdmin, with no key anywhere; records the management account, that user, its tfvars and the SIT account in the inventory; adds dated notes on Decision 113 (Identity Center stays out; the keyless lane) and Decision 202 (one trail and one trail-write principal per account).'
