schema_version: 1
slug: sit-organization
tldr: "Registers the new terraform/organization root as an admin-only live root (taxonomy row, protected-action gate, pre-merge plan rule with a management-profile identity check), adds the organization_provisioning admin carve-out naming who does what outside Terraform, records the management account, its key, its tfvars and the SIT account in the inventory, and adds a dated note on Decision 113 that Identity Center was reconsidered and the management account gets its own static-key lane in a separate environment."
blocks:
- id: deploy-paths-organization-row
  file: docs/contracts/deploy-paths.yaml
  before: |2
      github_settings_apply_provisioning:
  after: |2
      organization_provisioning:
        description: "Decision {{N}} cl.7's admin tier for terraform/organization (the AWS Organization root, SCPs included): an ADMIN-session agent in the separate management cloud environment, whose proxy holds only the management account's admin IAM user key (profile agent_platform_admin_org, role OrganizationAdmin), applies it on the operator's explicit direction after pre_merge_live_plan, one sitting at a time and never beside another admin apply; never self-directed. Outside Terraform that agent runs, each on the operator's direction, only the state bucket's create-bucket, the PROD invitation and an emergency detach-policy. The operator alone signs up an account, mints the management key, seeds the OrganizationAdmin role, accepts the invitation in PROD as the break-glass user, and removes or closes an account."
        procedure_ref: "terraform/organization/CLAUDE.md -- the sitting order, the seed commands and the read-backs (navigation only)."
      github_settings_apply_provisioning:
- id: deploy-paths-premerge-roots
  file: docs/contracts/deploy-paths.yaml
