- id: contract-new
  file: docs/contracts/restore-rehearsal.yaml
  before: ''
  after: |
    # SIT restore rehearsal (rec-5023, Decision {{N}}). Class D mechanism contract: the ephemeral-only rehearsal verb, its
    # boundary, the human-directed ADMIN sitting, the consistency rule, the counts-only evidence and the verifier's exit
    # criteria. PUBLIC repository (Decision 101): logical names only; no host, DSN, password, bucket name or ARN anywhere.
    contract:
      id: restore-rehearsal
      class: D
      contract_version: 1
      status: draft
      description: >-
        Proves, in the single account and before any SIT resource exists, that a PROD catalog dump restores into an empty
        Neon target under its own role, that ducklake_metadata.data_path rewritten outside the production data path reads
        every table and takes writes there only, and records the timings, sizes and catalog format SIT's reset depends on.
        It also reports whether the restored catalog copies into a DuckDB-file catalog that reads identically, as
        evidence for the catalog-backend choice; that leg gates nothing here.
        A failed criterion is a result: SIT falls back to a fresh-init catalog with synthetic data (rec-5024 decides).
      subject: restore-rehearsal
      evaluator:
        agent_surface: docs/DECISIONS.md

    amendment_log:
      - {date: "2026-11-09", semantic_break: false, change_class: field_add, summary: "PLAN-sit-restore-spike (rec-5023, Decision {{N}}): created."}

    boundary:
      binding: >-
        Resource shape (Decision 143 cl.1). The rehearsal functions run under existing execution roles: the restore
        function under the maintenance-smoke role (read, write and delete on the smoke prefix only, nothing under a
        production prefix); the checksum function under the reader role (read-only). Scratch lives only under
        ducklake-neon-smoke/restore-rehearsal/<run_id>/. The restore target is a Neon child branch of the catalog project
        holding a new role and a new database, both named restore_rehearsal_<run_id>, deleted whole with the branch.
      defence_in_depth: >-
        The verb's own refusals: the function name must end in -restore-rehearsal-ephemeral; env DUCKLAKE_RESTORE_REHEARSAL
        must equal the event's confirm; the target DSN comes only from env DUCKLAKE_RESTORE_TARGET_DSN and its username and
        dbname must start with restore_rehearsal_; every scratch path must sit under the rehearsal prefix. A refusal is
        RestoreRehearsalRefused (400) before any connection opens.
      never:
        - A write or delete under ducklake/, ducklake-telemetry/ or telemetry-blobs/.
        - A maintenance verb (merge, gc, expire, cleanup, catalog_reinit) on a restored catalog.
        - A connection to the restore target with a PROD role, or a PROD catalog connection that is not READ_ONLY.
        - Terraform, an IAM change, a standing resource, or a /secret/ parameter. The target role's password lives only in
          the restore function's environment and on the branch, and dies with them; it is never printed, logged, returned
          or written to disk.
      residual: >-
        For the sitting's length, copied production ops data sits under the smoke prefix, which the CI-invokable
        maintenance-smoke function can also reach; its gc deletes only files older than FILE_CLEANUP_GRACE_DAYS (7), and
        CopyObject sets a fresh LastModified, so nothing copied is collected during a sitting. Teardown deletes the prefix;
        noncurrent versions expire under the bucket's existing lifecycle.

    verb:
      action: restore_rehearsal
      host: >-
        src/lambdas/ducklake_maintenance/restore_rehearsal_actions.py, shipped in the maintenance zip through the governed
        code-deploy channel (Decision 249) and run only on ephemeral functions created from that CI-published zip. It
        refuses on the production maintenance function.
      event: "{action: restore_rehearsal, step, confirm, run_id, plus the step's fields below}"
      steps:
        restore: >-
          Reads the dump from the scratch prefix, runs pg_restore --no-owner --no-acl --exit-on-error into the target, and
          returns restore_ms, the restored meta-schemas with each one's max snapshot_id, absolute_paths (data and delete
          file rows with path_is_relative false), foreign_owned (relations not owned by the target role) and foreign_acl
          (ACL entries naming any other role).
        rewrite: >-
          Sets ducklake_metadata.data_path in each named meta-schema to its scratch location and nothing else; refuses if
          absolute_paths is not 0 or a value falls outside the scratch prefix. Returns rewrite_ms.
        verify: >-
          For ducklake_ops: missing_files (referenced data and delete files absent from the scratch copy), then ATTACH
          READ_ONLY at the new data_path without OVERRIDE_DATA_PATH and, per table, row count and checksum (sum of hash of
          every column) at the restored snapshot. For ducklake_telemetry: ATTACH READ_ONLY, table names and data-file count
          only (its files are not copied).
        prod_checksum: >-
          Checksum function only: ATTACH the PROD ops catalog READ_ONLY with the function's own catalog DSN and return the
          same per-table count and checksum AT (VERSION => the restored snapshot_id).
        duckdb_copy: >-
          Restore function only, after prod_checksum: ATTACH the target READ_ONLY, initialise a DuckDB-file DuckLake
          catalog in the function's /tmp, copy every ducklake_ops catalog table into it, then ATTACH both READ_ONLY at
          the scratch data_path and compare each table's count and checksum at the restored snapshot and at the median
          snapshot_id. Returns copy_ms, catalog_rows, file_bytes and per-table match booleans. The file is never
          uploaded or returned: column statistics can hold text fragments, so it dies with the function.
        write_probe: >-
          ATTACH the target at the new data_path, create rehearsal_probe.t and insert 100 rows (data inlining disabled), and
          return the new file's relative key, whether it exists under the scratch prefix, and ducklake_metadata.version.
      responses: counts, booleans, durations, table names and relative keys only.

    sitting:
      where: An ADMIN cloud session (agent_platform_admin present); no cloud container has TCP/5432 egress, so all SQL runs in the functions.
      actor: >-
        An ADMIN-container agent, only under the operator's explicit direction in that session (Decision {{N}}), each
        admin-profile command acknowledged per protected-actions.yaml. Never self-directed or scheduled. Calls that need no
        admin grant name agent_platform.
      orchestrator: "bin/venv-python -m scripts.ducklake_neon_smoke_test --restore-rehearsal --profile agent_platform_admin --evidence-out <file>"
      order:
        - {id: teardown_handles, principal: none, rule: "Resolve every teardown handle before anything is created; fail loud if one cannot be resolved."}
        - {id: dump, principal: agent_platform_admin, rule: "One on-demand dump through the catalog-dr Function URL; record its size and wall time (Decision 88 egress)."}
        - {id: copy_dump, principal: agent_platform_admin, rule: "Copy that dump object into <scratch>/catalog.dump."}
        - {id: copy_data, principal: agent_platform, rule: "Server-side copy ducklake/ into <scratch>/ducklake/ after the dump; record objects, bytes, wall time."}
        - {id: neon_target, principal: agent_platform_admin, rule: "Child branch, role and empty database, all restore_rehearsal_<run_id>."}
        - {id: functions, principal: agent_platform_admin, rule: "Create maintenance-restore-rehearsal-ephemeral (maintenance-smoke role, the production maintenance function's layers) and reader-restore-rehearsal-ephemeral (reader role) from lambda-packages/ducklake-maintenance.zip; record its CodeSha256."}
        - {id: steps, principal: agent_platform_admin, rule: "Invoke restore, rewrite, verify, prod_checksum, duckdb_copy, write_probe in that order; any failure stops the run and goes to teardown."}
        - {id: probe_absent, principal: agent_platform, rule: "The probe's relative key is absent under ducklake/ (head-object 404)."}
        - {id: teardown, principal: "agent_platform_admin (functions, branch); agent_platform (scratch prefix)", rule: "In finally, whatever failed; record each in torn_down; a false is cleaned by hand at once."}
      version_recovery: >-
        Separate subcommand, run as agent_platform with S3 calls only: put a scratch object under <scratch>/versioning/,
        delete it, list its versions, copy the noncurrent version back, read it and compare sha256, then delete it.

    consistency_rule: >-
      Dump first, then copy. DuckLake data files are immutable and gc removes them only after FILE_CLEANUP_GRACE_DAYS, so a
      copy finished within that window after the dump holds every file the dump references; verify proves it
      (missing_files 0). Files written after the dump are harmless orphans in the copy. For SIT replication the same rule
      reads: the dump must postdate replication of every object it references, checked the same way.

    evidence:
      schema_version: 1
      keys: [run_id, measured_at, maintenance_zip_sha256, dump_bytes, dump_ms, copy_objects, copy_bytes, copy_ms, restore_ms,
        rewrite_ms, meta_schemas, snapshot_ids, absolute_paths, foreign_owned, foreign_acl, missing_files, ops_tables,
        telemetry_tables, telemetry_data_files, write_probe_key, write_probe_in_scratch, write_probe_in_production,
        catalog_format_version, prefix_sizes, duckdb_copy_ms, duckdb_catalog_rows, duckdb_file_bytes, duckdb_copy_tables,
        torn_down]
      ops_tables: one row per table with restored_count, restored_checksum, prod_count, prod_checksum.
      forbidden: any host, DSN, password, bucket name, account id or ARN; the verifier refuses a file that carries one.

    exit_criteria:
      restored: "restore returned ok; foreign_owned 0 and foreign_acl 0."
      rewritten: "absolute_paths 0; ATTACH at the new data_path succeeded without OVERRIDE_DATA_PATH."
      complete: "missing_files 0."
      faithful: "every ops table's restored_count and restored_checksum equal prod_count and prod_checksum."
      one_way_writes: "write_probe_in_scratch true and write_probe_in_production false."
      measured: "dump, copy, restore and rewrite timings, dump_bytes and prefix_sizes present."
      format: "catalog_format_version recorded; the candidate-engine leg is rec-5036."
      file_catalog: "Reported, not gating: every duckdb_copy_tables row matches at both snapshots; the verifier prints DUCKDB_COPY_OK or names each mismatch."
      torn_down: "every torn_down flag true."
      verifier: "bin/venv-python -m scripts.ducklake_smoke.restore_rehearsal verify-evidence <file> prints RESTORE_REHEARSAL_OK or names each failed criterion and exits 1."
