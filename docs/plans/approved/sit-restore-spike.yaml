- id: decision-new
  file: docs/DECISIONS.md
  before: |
    ## Decision 250: Every warehouse table declares what should arrive, from an independent source and by when; a check that cannot read its source is red, and every check is itself watched (amends Decision 62) (Decided)
  after: |
    ## Decision {{N}}: The SIT restore rehearsal runs as one human-directed ADMIN-agent sitting on ephemeral functions and a throwaway Neon branch, never on a production function, catalog or prefix (amends Decisions 81 and 126) (Decided)

    ```yaml
    number: {{N}}
    status: Decided
    decided_date: "{{DATE}}"
    kind:
      value: direction
      justification: >-
        Clause 1 changes who may act: an ADMIN-container agent may run the rehearsal sitting on the operator's direction.
        Undone, that path closes again and only the operator could run it.
    amends: [81, 126]
    significance:
      value: numbered_decision
      justification: >-
        Opens a narrow ADMIN-agent execution path that Decision 81 cl.6 and Decision 126 closed, as Decisions 204, 213 cl.5
        and 230 cl.4 each did for their own verbs: durable and reversal-relevant. Not a restore-rehearsal.yaml note: a
        contract note cannot widen a ratified rule or carve-out (Decision 230). Not amendment_forms lines: it amends two
        entries and grants a new path, which an annotation cannot.
    ```

    **Status:** Decided
    **Date:** {{DATE}}
    **Warehouse ID:** dec-{{N}} (per Decision 84 backfill)

    **Problem:** The SIT design builds SIT from a PROD catalog dump restored into SIT's own catalog database with
    ducklake_metadata.data_path rewritten to SIT's bucket. That restore and rewrite have never run (rec-5023). No cloud
    container has TCP/5432 egress, so the only route is ephemeral Lambdas created and invoked with the admin profile, plus a
    Neon branch, role and database created through the Neon API. No Decision names an ADMIN-agent path that does this.

    **Intent:** Prove the restore and rewrite once, on real production data, with nothing production able to change.

    **Decision:**
    1. **Sanctioned sitting.** An ADMIN-container agent may run the restore rehearsal sitting in
       docs/contracts/restore-rehearsal.yaml, and only under the operator's explicit direction in that session, each
       admin-profile command acknowledged per protected-actions.yaml. Never self-directed or scheduled. This overrides
       Decision 81 cl.6 for the restore_rehearsal verb on ephemeral functions only, and is a narrow carve-out beside
       Decision 126's admin tier.
    2. **Boundary is resource shape (Decision 143 cl.1).** The ephemeral functions use existing execution roles that cannot
       write a production prefix: the maintenance-smoke role for the restore, rewrite, verify and write probe, and the
       reader role, read-only, for the PROD checksum. Scratch lives only under ducklake-neon-smoke/restore-rehearsal/. The
       restore target is a Neon child branch holding a new role and a new database, deleted whole at teardown; a PROD role
       never connects to it. The verb's in-handler refusals are defence in depth. No Terraform, IAM change, standing
       resource or /secret/ parameter: the target role's password lives only in the ephemeral function's environment and
       on the branch, and dies with them.
    3. **Data.** Production data leaves its prefixes only as in-account server-side copies into that scratch prefix (the
       ops prefix and one on-demand catalog dump), deleted at teardown. No maintenance verb ever runs on a restored catalog.
       Evidence is counts only (Decision 101).
    4. **Native primitives (Decision 100).** pg_restore of the DR dump is the claim under test, because SIT's catalog will
       live on its own RDS instance that no Neon branch reaches, and PROD moves there by dump and restore too (Decision 214
       cl.1 as amended). Restoring into RDS itself is rec-5030's proof. The branch, S3 server-side copy and S3
       versioning are used natively for everything else.
    5. **Closure.** rec-5023 closes through a committed counts-only evidence fixture and its test, as rec-4070 did
       (Decision 204 cl.5): Decision 201's evaluator cannot run a live sitting. The candidate-engine leg is rec-5036.
    6. **Scope.** Rehearsal sittings only, until SIT's reset path (rec-5030) exists. The SIT Decision (rec-5024) decides
       whether the verb stays.

    ```yaml reversal-conditions
    decision: {{N}}
    review_by: 2027-05-31
    on_trigger: "re-decide via /plan"
    conditions:
      - id: residue-left
        kind: manual
        description: "A sitting leaves a function, branch or scratch object behind twice: suspend cl.1 until the teardown is fixed."
      - id: verb-reachable
        kind: manual
        description: "The verb runs on a production function, or a rehearsal role is found to write a production prefix: suspend cl.1 and fix first."
      - id: sit-reset-exists
        kind: manual
        description: "SIT's reset path (rec-5030) is live: retire or re-scope cl.6."
    ```

    **Related:** Decisions 77, 81, 88, 100, 101, 126, 143, 201, 204, 213, 214, 216, 230, 237, 249; rec-5023, rec-5024, rec-5030, rec-5036.

