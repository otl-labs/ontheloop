schema_version: 1
slug: supersede-decision-133
tldr: 'Supersedes Decision 133 (the operator''s build capacity given to this repository''s work before a paper-trading loop,
  review overdue since 2026-09-30) with one short new Decision that sets no successor rule: this repository holds only On
  The Loop''s source and each adopter product orders its own work in the monorepo that holds it. Decision 133 compacts to
  a stub, its review stanza goes with it, Decision 93 gets one dated note, and the glossary drops 133 from its reads-through
  roster.'
