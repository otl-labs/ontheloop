        never re-derive it by hand.
        A red carrying stale_gated_approval (a routed gated change left unapproved past the 2.0h
        bound) still derives red_cause=out_of_band_drift for dedup, but its heal is to approve or
        reject the waiting tf-gated-apply run (an approval writes green); after a rejection, the
        acknowledge-and-retry dispatch. A gated apply whose green write the drift guard refused (a
        drift red that arrived during the approval wait) leaves the record red: review that drift,
        then acknowledge-and-retry.
