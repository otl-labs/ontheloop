      R8: non-replayable producers emit no open marker, never re-emit, and a bump retires nothing.
  after: |2
      PARSER_VERSION 9 (PLAN-telemetry-capture-hook-labels, rec-4939): claude_code identifies its own capture hook records by the lines those hooks write to stderr, and reads a hook attachment's recorded command only as a legacy form, because Claude Code 2.1.317 and later records the command in cloud sessions as a label ('command hook', 'command hook N') unless the hook sets statusMessage, whose text is free. The SessionStart pin hook also writes '[session_start_log_turn] capture pin project_ref=<ref>' when it was given exactly one well-formed --project-ref. P-2: a SessionStart hook attachment's project_ref is that line's when exactly one well-formed such line is present, else the command's single --project-ref token as before; the earliest attachment that yields a ref pins the tree, copied fork records still take no part (K-1), and a root pin attachment whose two forms name different refs is counted pin_ref_disagreement. PV-1: a pin attachment is a SessionStart hook attachment whose command names the pin script or whose stderr holds a capture pin line. WT-2: a Stop witness is a Stop hook_success attachment whose stderr opens with the witness line, whatever its command. H-1: a hook whose command names no script takes the name of its capture line when it has one (hook:session_start_log_turn, hook:stop_log_turn), else hook:<hookName> (H-2), so in a labelled transcript every other hook reads its hookName fallback (e.g. hook:SessionStart.startup). Every parser_version 8 golden transcript yields the same rows apart from the version stamps, and every verdict reads only the attachment's own fields, so every prefix agrees (R7).
      R8: non-replayable producers emit no open marker, never re-emit, and a bump retires nothing.
