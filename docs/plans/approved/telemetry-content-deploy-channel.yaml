slug: telemetry-content-deploy-channel
tldr: 'The content reader goes live through its own deploy channel, which asks you only when the code that protects transcript text changes. Words: a new Decision recording that rule as an exception to the ship-every-change deploy rule, the record writer and what plan B still owes; a dated note on Decision 249; one more deploy-record prefix on the CI deploy role in terraform/personal; and the test pinning that grant.'
