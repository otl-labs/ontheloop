schema_version: 1
slug: telemetry-content-edit-hook
tldr: 'The content reader gets its last two early warnings: a hook that stops Claude''s edit tools changing a protected file unless a merged plan lists it, and an on-demand masked read-back that proves the live reader masks a planted secret, including from the blob tier. Re-runs of an approved content deploy are refused, so every deploy needs a fresh approval. Words: dated notes on Decisions 239, 267 and 272, the re-armed Decision 267 reversal condition, and the protected-actions contract''s tamper note with its log row.'
blocks:
- id: decision-272-note
  file: docs/DECISIONS.md
  before: |
    **Related:** Decisions 79, 125, 126, 154, 238, 239, 249, 254, 267, 270.
  after: |
    **Related:** Decisions 79, 125, 126, 154, 238, 239, 249, 254, 267, 270.

    > **Update ({{DATE}}):** PLAN-telemetry-content-edit-hook (rec-5322) delivers the two early warnings the Coverage
    > paragraph names as owed. .claude/hooks/protected_path_guard.py refuses a session's Edit, Write, MultiEdit or
    > NotebookEdit of a PROTECTED path unless a plan merged to main, named in .claude/protected_edit_plan, scopes that
    > exact path; a Bash edit bypasses it. lambda_telemetry_golden_gates.py --content-leg writes one current synthetic
    > tree, one row of it in the blob tier, and reads it back masked through the content route as
    > agent-platform-session, a verification consumer beside the feedback loop (Decision 270 cl.1). Both are early
    > warnings, not controls (Decision 239 cl.5), and CI does not run the leg (rec-4735). The deploy and record jobs
    > now refuse a re-run attempt (Decision 267's lock-available re-decision). Coverage:
    > tests/hooks/test_protected_path_guard.py, tests/ducklake_neon_smoke_test/test_lambda_telemetry_golden_content.py
    > and tests/verify_ci_workflow/test_deploy_telemetry_content_workflow.py.
- id: decision-267-stanza
  file: docs/DECISIONS.md
  before: |
    description: "rec-4696 delivers Decision 239 cl.5's change lock, or rec-5029's SCP takes the key read outside the agent merge loop: re-decide clause 5."
  after: |
    description: "rec-5029's SCP takes the key read outside the agent merge loop, or another production deploy is put behind an operator-approved GitHub Environment: re-decide clause 5."
- id: decision-267-note
  file: docs/DECISIONS.md
  before: |
    **Related:** Decisions 143, 166, 205, 237, 239, 248, 250, 252; rec-4233, rec-5113, rec-5126, rec-5029, rec-4696.
  after: |
    **Related:** Decisions 143, 166, 205, 237, 239, 248, 250, 252; rec-4233, rec-5113, rec-5126, rec-5029, rec-4696.

    > **Update ({{DATE}}):** lock-available re-decided (rec-5323). The content reader's change lock is live (Decision
    > 272), so clause 5 was checked against it, and clause 5 stands. GitHub's REST documentation lets only a required
    > reviewer review a pending deployment, so the App's token cannot approve one. It can cancel a pending content
    > deploy, which only delays it while the last approved code stays live, and it can delete runs, which clause 5
    > already accepts. It can also re-run a run, and this repository's approvals preflight records approvals per run,
    > not per attempt, so a re-run attempt of an approved content deploy would need no fresh review. The deploy's
    > live-code check refuses most such re-runs but is skipped on a first deploy and on a rebaseline.
    > PLAN-telemetry-content-edit-hook therefore makes the deploy and record jobs of deploy-telemetry-content.yml
    > refuse any attempt after the first, so every deploy takes a new run and a new approval; off_register_run still
    > flags a bot re-run. The condition is re-armed on its remaining half.
