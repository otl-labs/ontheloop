schema_version: 1
slug: telemetry-content-reader-api-lock
tldr: 'The masked transcript reader gets its AWS home with a do-nothing placeholder. Agents reach it only through a fifth route on the signed DuckLake API, and only a deploy job you approve in a new reviewer-gated Environment can change it. The CI ceiling policy gains the lock and shortens three direct-invoke rules to wildcards, shrinking from 5,696 to 5,427 bytes. Words: a new Decision with nine dated notes, two new Terraform files, edits to the ceiling, API routes, trail, alarms, bootstrap roles and GitHub Environments, and the test pins those edits move.'
