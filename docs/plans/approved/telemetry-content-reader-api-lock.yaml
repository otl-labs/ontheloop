    ## Decision {{N}}: The telemetry content reader is reached through a fifth DuckLake API route, and its change lock lives in the CI apply boundary, paid for by prefix-named URL-only Denies (amends Decisions 144, 213, 230, 239, 255, 256, 257 and 258) (Decided)

    ```yaml
    number: {{N}}
    status: Decided
    decided_date: "{{DATE}}"
    kind:
      value: direction
      justification: >-
        Yes: it sets where the content reader's lock and its fence live, who may reach the reader and by which path,
        and the boundary size at which the operator re-decides, each a standing rule later plans must follow.
    amends: [144, 213, 230, 239, 255, 256, 257, 258]
    serves: [NS.9]
    significance:
      value: numbered_decision
      justification: >-
        Yes: it amends eight Decisions' clauses about one boundary and one function, and clause 5 is the operator's
        re-decision that Decision 258 cl.3 requires; a dated note on each amended entry (amendment_forms, considered)
        would split one ruling into eight, and no contract holds boundary placement or its trigger
        (docs/contracts/deploy-paths.yaml, considered, holds channels, not fences).
    ```

    **Status:** Decided
    **Date:** {{DATE}}
    **Warehouse ID:** dec-{{N}} (per Decision 84 backfill)

    **Problem:** Decision 239's content reader was planned on a Function URL invoked by PlatformDev. Since Decisions
    255 and 256 agents reach the DuckLake verbs only through the signed REST API as user agent-platform-session, and the
    CI apply boundary stands at 5,696 bytes, Decision 258's trigger, so the lock's Deny cannot be added without the
    operator re-deciding where the fence lives (258 cl.3).

    **Intent:** Agents read masked production transcript text through the same signed path as every other verb, and
    only the operator-approved deploy can change the reader, with every fence still in the one boundary.

    **Decision:**
    1. **Path and consumer (amends 239 cl.1 and cl.4, 255 cl.1, 256 cl.2).** Agents read production transcript text
       only through agent-platform-ducklake-telemetry-content on a fifth POST route of the one DuckLake API,
       telemetry/content; the function has no Function URL. Its session consumer is the feedback loop's masked reads,
       as agent-platform-session, whose execute-api grant gains that route. Clause 4's access line names the caller's
       user or role name, read from the event shape of the path that delivered the request.
    2. **Roles (amends 144 cl.3, 239 cl.7, 257 cl.3).** The execution role telemetry-content-reader carries the CI
       apply boundary and is excepted by its exact ARN from Decision 230 cl.5's fence. The deploy role
       telemetry-content-deploy is boundary-free by explicit exclusion, because clause 3's Deny must not refuse it; it
       may only change the content function's code and configuration and read layers, and only a job in the
       reviewer-gated telemetry-content-deploy Environment running deploy-telemetry-content.yml at main may assume it
       (Decision 238 cl.2). Both roles are named telemetry-content-*, outside agent-platform-*, so no CI IAM grant
       reaches them; the boundary's protected-role Deny names that prefix, and both roles join Decision 257 cl.3's
       protected set.
    3. **Lock (Decision 239 cl.5).** The boundary's DenyTelemetryContentChange refuses every boundary carrier every
       Lambda create, delete, publish, put, tag and update on the content function and its qualifiers; the URL-only
       Denies keep refusing direct invoke and permission edits. A Decision 202 filter pages on any IAM write naming a
       telemetry-content-* role and on any Lambda write on the content function by an identity other than the deploy
       role.
    4. **Prefix names (amends 213 cl.1, 230 cl.5).** The three URL-only Denies name the writer and reader by prefix,
       writer* and reader*, beside telemetry-*, with the account segment wildcarded and the region kept. Each prefix
       covers its function and every qualifier, and widens a Deny only to a future function of that prefix.
    5. **Re-decision (amends 258 cl.2).** On 2026-11-16 the operator re-decided where the fences live: every fence
       stays in the boundary, and clause 4's shorter names pay for clause 3's Deny. The boundary-headroom conditions
       of Decisions 230 and 239 fire when the boundary's minified PROD rendering passes 5427 bytes, its size with this
       entry's changes as measured by the build that lands it; the SIT rendering fires on the same growth. Decision
       258 cl.1's no-headroom rule and cl.3's rules stand for every later change.

    **Rationale:** The fifth route reuses Decision 255's signed path, its access log and its detector, instead of a
    second transport agents cannot reach. Prefix names cost a Deny nothing and free more bytes than the lock uses.
    Rejected: raising the trigger to 5,946 bytes with no shorter names (198 bytes left under the 6,144-byte limit for
    every later fence); a Deny attached to each CI role (a role CI creates would not carry it); a service control
    policy (an organisation-wide redesign); deferring the deploy (the feedback loop keeps no forensic read).

    **Coverage (Decision 181 cl.2):** tests/checks/iam_tf/test_telemetry_content_reader_iam.py pins clause 5's size,
    clause 3's statement, clause 2's roles, trust and grants, and clause 1's route; tests/checks/iam_tf/
    test_url_only_invoke_guard.py pins clause 4's cover of every identity-trusting function and qualifier; the
    detector filter is clause 3's alarm. Clause 1's consumer naming is an unenforced residual the decision scout
    reads. Residual, owned by Decision 239 cl.6: a boundary carrier may still pass the bounded telemetry reader role
    to a new function.

    ```yaml reversal-conditions
    decision: {{N}}
    review_by: 2027-05-31
    on_trigger: "re-decide via /plan"
    conditions:
      - id: boundary-size
        description: "The boundary's minified PROD rendering passes clause 5's size: re-decide where the fences live."
      - id: prefix-collision
        description: "A function named agent-platform-ducklake-writer* or -reader* other than the two verb functions is planned: re-decide clause 4."
    ```

    **Related:** Decisions 101, 126, 143, 154, 172, 177, 181, 202, 223, 236, 237, 238, 246, 248.

