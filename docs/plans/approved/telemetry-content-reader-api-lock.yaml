schema_version: 1
slug: telemetry-content-reader-api-lock
tldr: 'The masked transcript reader gets its AWS home with a do-nothing placeholder inside: agents reach it only through a fifth route on the signed DuckLake API, and only a deploy job you approve in a new reviewer-gated Environment can change it. The CI ceiling policy gains the lock rule and shortens its three direct-invoke rules to wildcards, so it shrinks from 5,696 to 5,427 bytes, and your trigger line resets to that size. Words: a new Decision with eight dated amendment notes, two new Terraform files, and edits to the ceiling, the API routes, the trail, the alarms, the bootstrap preview reads and the GitHub Environments.'
