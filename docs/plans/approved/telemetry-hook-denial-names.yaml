schema_version: 1
slug: telemetry-hook-denial-names
tldr: 'Parser version 10 (rec-4959): in cloud sessions a hook that blocks a tool call leaves no hook record, so the friction labels for never-on-main, stale branch base and scope creep went silent. The parser now names the blocking hook from a new marker line the four blocking hooks print, falling back to their existing BLOCKED by text for older transcripts. Contract text: one envelope governance line plus its log entry, and one clause on the ports SA-02 assumption plus its log entry.'
blocks:
- id: envelope-parser-version-10
  file: docs/contracts/telemetry-event-envelope.yaml
  before: |2
      R8: non-replayable producers emit no open marker, never re-emit, and a bump retires nothing.
  after: |2
      R8: non-replayable producers emit no open marker, never re-emit, and a bump retires nothing.
      PARSER_VERSION 10 (PLAN-telemetry-hook-denial-names, rec-4959): claude_code names the hook that blocked a tool call when Claude Code wrote no hook record for the block, as cloud sessions on 2.1.322 do; the block then survives only in the denied tool_result, whose permissionDecision.source is hook. HD-1: for each tool_call close in a closed turn whose result carries permissionDecision.source hook, the producer emits one process_event point at severity error, parented to that tool_call, and the close keeps its outcome blocked. HD-2: the name is hook:<stem> from the last whole line of the result text that reads HOOK-BLOCK v1 hook=<stem>, which never_on_main, fresh_branch_base, edit_scope_guard and scheduled_agent_log_only print as their last stderr line; else from the hook-owned text BLOCKED by .claude/hooks/<stem>.py: anywhere in the result text, for transcripts written before the marker; else hook:<event>.<tool> from the decision's reasonCode and the tool's name; else hook:unknown. A stem must fit the signature class, and the result text is never stored. HD-3: no row when a PreToolUse hook record with exit code 2 on the same toolUseID precedes the result, since that record already names the block (older CLIs). HD-4: every verdict reads only the result record, its tool_use and the records before it (R7). Hooks that print neither form (merge_gate, handoff_evidence_gate, protected_action_gate) read hook:<event>.<tool>, which the reader labels unmapped_block. No existing golden case changes beyond the version stamp.
