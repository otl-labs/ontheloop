schema_version: 1
slug: telemetry-planning-cost-reads
tldr: 'The telemetry reader gains one read, session_tree_rollup: one row per session tree with how many times it compacted
  its context, which workflows its sessions ran, and the merges linked to it (merge, PR, recs, CI result). It reports facts
  only; deciding which merges are plans is left to the caller. It carries no token or cost column. Both reader contracts list
  the new read.'
blocks:
- id: reader-tree-rollup-invariant
  file: docs/contracts/ducklake_telemetry_reader.yaml
  before: No row carries content, cost or a single summed token total."
  after: "No row carries content, cost or a single summed token total.\"\n  - \"Tree rollup verb (PLAN-telemetry-planning-cost-reads;\
    \ rec-5257; agent-facing): session_tree_rollup takes day_from and day_to over at most 7 UTC days, reads telemetry_sessions\
    \ and telemetry_observations of real-purpose projects only, and answers one row per tree (the usage verbs' tree) with\
    \ root_session_id, harness_session_key, branch, the root's workflow, session_started_at, the tree's last event, roots_in_tree,\
    \ session_count, workflows (the distinct non-null workflow values over the tree's sessions, root and sub-agents, sorted;\
    \ [] when none), compact_count and compacted_session_count (the tree's compact lifecycle rows after the R4/R5 dedupe,\
    \ and the sessions holding one), merge_links (one struct per ci_annotate annotate row in the tree: merge_sha, the 40-hex\
    \ squash sha read from the row's external_ref in telemetry_sessions.yaml's merge-link format; merged_at, its event_timestamp;\
    \ pr_url, rec_ids and ci_outcome; ordered by merged_at then merge_sha; [] when none) and the tree-level Decision 207 stamps.\
    \ A merge can link to several trees, so a caller totalling per merge counts each linked tree once. The verb judges nothing:\
    \ which merges are plan merges and which workflows mark planning are the caller's. No row carries content, cost or a token\
    \ count.\""
- id: reader-tree-rollup-amendment
  file: docs/contracts/ducklake_telemetry_reader.yaml
  before: 'previous_versions: []'
  after: "  - date: \"{{DATE}}\"\n    semantic_break: false\n    change_class: field_add\n    summary: >-\n      PLAN-telemetry-planning-cost-reads\
    \ (rec-5257): session_tree_rollup joins the served set as an agent-facing seven-day\n      window verb, one row per tree\
    \ with its compaction counts, workflows and merge links.\n    migration_story: >-\n      A new verb only; no existing\
    \ verb, payload or answer changes; describe lists one more agent-facing verb.\nprevious_versions: []"
- id: read-engine-roster
  file: docs/contracts/read-engine.yaml
  before: session_tree_rows, telemetry_orphan_counts, telemetry_root_sessions]
  after: session_tree_rows, telemetry_orphan_counts, telemetry_root_sessions, session_tree_rollup]
- id: read-engine-amendment
  file: docs/contracts/read-engine.yaml
  before: "amendment_log:\n  - date: \"2026-10-29\""
  after: "amendment_log:\n  - date: \"{{DATE}}\"\n    semantic_break: false\n    change_class: field_add\n    summary: >-\n\
    \      PLAN-telemetry-planning-cost-reads (rec-5257): session_tree_rollup joins read_surface.named_verbs under\n     \
    \ telemetry_sessions (an agent-facing seven-day window verb served by the telemetry reader).\n  - date: \"2026-10-29\""
