schema_version: 1
slug: telemetry-read-timeouts
tldr: 'The production telemetry catalog is no longer merged on a fixed 6-hour clock. A check every 5 minutes (skipping :15, :30 and :45, which other maintenance jobs use) reads two CloudWatch numbers and merges when at least 100 telemetry writes have landed since the last merge, or when 6 hours have passed, so on a busy day the unmerged pile that pushed the reader smoke (rec-5247) and the arrival check (rec-5248) past the read deadline stays small, and a quiet catalog is never woken. One amendment line on Decision 236 clause 5 records the change, and the maintenance contract names the gated merge and its event field; the weekly garbage collection, its guards and every existing alarm stay as they are. Estimated extra cost is about 2 to 5 US dollars a month.'
blocks:
- id: decision-236-cl5-backlog-gated
  file: docs/DECISIONS.md
  before: |
    [Amendment 2026-10-29, Decision 239: cl.3's content consumer exists; agents read production transcript text masked, only through the telemetry content reader; cl.2 and cl.6 count two production telemetry readers, so the closed read boundary is three readers.]
  after: |
    [Amendment 2026-10-29, Decision 239: cl.3's content consumer exists; agents read production transcript text masked, only through the telemetry content reader; cl.2 and cl.6 count two production telemetry readers, so the closed read boundary is three readers.]

    [Amendment {{DATE}}, PLAN-telemetry-read-timeouts: cl.5's merge_ops on the production telemetry catalog is gated on the write backlog, as Decision 88 cl.1(iii) sizes cadence to write rate: a check every 5 minutes, except :15, :30 and :45, reads CloudWatch only and merges when at least 100 telemetry writer calls have landed since the last pass or 6 hours have passed. Each telemetry write lands as its own small files, and on every busy day the 6-hour backlog pushed cold reads of the newest days past the reader's deadline (rec-5247, rec-5248). The weekly guarded gc_ops, the guards and every existing alarm are unchanged.]
