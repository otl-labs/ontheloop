          ducklake_ops, cron(50 */6 * * ? *) and gc_ops cron(5 4 ? * SUN *) -> PRODUCTION ducklake_telemetry; merge_ops_gated cron(0,6,8,10,16,18,20,22,24,26,32,34,36,38,40,46,52,54,56,58 * * * ? *) -> PRODUCTION ducklake_telemetry). OPERATIONAL actions (catalog_reinit, restore_drill, catalog_stats,
- id: contract-merge-ops-gated-verb
  file: docs/contracts/ducklake_maintenance.yaml
  before: |2
          version_mismatch: "DuckDB/extension version mismatch (500)"
      gc_ops:
  after: |2
          version_mismatch: "DuckDB/extension version mismatch (500)"
      merge_ops_gated:
        payload_schema_ref: >-
          event envelope {action: "merge_ops_gated", data_path (s3://), meta_schema, backlog_gate {min_commits, max_unmerged_minutes}}. SCHEDULED against PRODUCTION
          ducklake_telemetry beside its every-6h merge_ops. Reads CloudWatch only: the newest MergeOpsTablesCount datapoint in 6 h is the last pass, and the writer's
          CommitLatencyMs samples since then are the committed appends. At min_commits, or once a commit has waited max_unmerged_minutes, it runs merge_ops with the same
          event; otherwise, or when a read fails, it returns skipped without a catalog connection. Emits MergeOpsBacklogCommits when read, else MergeOpsGateUnreadable.
        response_codes:
          200: "merge_ops's 200 body, or {ok, action, skipped: true, reason (below_threshold | gate_unreadable), commits, last_pass}"
          500: "DuckLakeRuntimeError: a missing or non-positive backlog_gate field; otherwise merge_ops's 500"
      gc_ops:
- id: contract-amendment-log
  file: docs/contracts/ducklake_maintenance.yaml
  before: |
    amendment_log:
  after: |
    amendment_log:
      - {date: "{{DATE}}", semantic_break: false, change_class: field_add, summary: "PLAN-telemetry-read-timeouts (Decision 236 cl.5 amendment, rec-5247, rec-5248): the new merge_ops_gated verb runs merge_ops on the production telemetry catalog when its backlog_gate (60 commits or 30 minutes) is met, from a rule that ticks every two to six minutes; the every-6h telemetry merge stays as the floor; the MergeOpsBacklogCommits, MergeOpsGateUnreadable and MergeOpsFilesBeforeTotal catalog metrics; the ops catalog's cadence and every existing alarm are unchanged."}
