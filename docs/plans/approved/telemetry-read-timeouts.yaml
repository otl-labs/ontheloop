schema_version: 1
slug: telemetry-read-timeouts
tldr: 'The production telemetry catalog keeps its 6-hour merge as a floor and gains a merge triggered by the pile of unmerged writes. A check every two to six minutes (never in the three minutes before another maintenance job starts) reads two CloudWatch numbers and merges when at least 60 telemetry writes have been committed since the last merge or any write has waited 30 minutes, so on a busy day the unmerged pile that pushed the reader smoke (rec-5247) and the arrival check (rec-5248) past the read deadline stays small, and a quiet catalog is never woken. If the check cannot read its numbers it skips and an alarm fires. One amendment line on Decision 236 clause 5 records the change, and the maintenance contract names the new gated merge; the weekly garbage collection, its guards and every existing alarm stay as they are. Estimated extra cost is about 2 to 5 US dollars a month.'
blocks:
- id: decision-236-cl5-backlog-gated
  file: docs/DECISIONS.md
  before: |
    [Amendment 2026-10-29, Decision 239: cl.3's content consumer exists; agents read production transcript text masked, only through the telemetry content reader; cl.2 and cl.6 count two production telemetry readers, so the closed read boundary is three readers.]
  after: |
    [Amendment 2026-10-29, Decision 239: cl.3's content consumer exists; agents read production transcript text masked, only through the telemetry content reader; cl.2 and cl.6 count two production telemetry readers, so the closed read boundary is three readers.]

    [Amendment {{DATE}}, PLAN-telemetry-read-timeouts: cl.5's every-6h merge_ops on the production telemetry catalog stays as the floor, and a backlog-gated pass is added, as Decision 88 cl.1(iii) sizes cadence to write rate: a rule ticks every two to six minutes, never in the three minutes up to another maintenance job's start, reads CloudWatch only, and merges when at least 60 telemetry commits have landed since the last pass or a commit has waited 30 minutes; a gate that cannot read its metrics skips and alarms. Each telemetry write lands as its own small files, and on every busy day the 6-hour backlog pushed cold reads of the newest days past the reader's deadline (rec-5247, rec-5248). The weekly guarded gc_ops, the guards and every existing alarm are unchanged.]
