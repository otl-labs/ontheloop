schema_version: 1
slug: telemetry-read-timeouts
tldr: 'The production telemetry catalog is merged every hour instead of every 6 hours, so the newest days of telemetry never hold more than about an hour of unmerged small files, which a cold reader fetches one at a time. That pile is what pushed the reader smoke (rec-5247) and the arrival check (rec-5248) past the read deadline. One amendment line on Decision 236 clause 5 records the retune, and the maintenance contract names the hourly rule; the weekly garbage collection, its guards and every alarm stay as they are. Estimated extra cost is about 3 to 12 US dollars a month.'
blocks:
- id: decision-236-cl5-hourly
  file: docs/DECISIONS.md
  before: |
    [Amendment 2026-10-29, Decision 239: cl.3's content consumer exists; agents read production transcript text masked, only through the telemetry content reader; cl.2 and cl.6 count two production telemetry readers, so the closed read boundary is three readers.]
  after: |
    [Amendment 2026-10-29, Decision 239: cl.3's content consumer exists; agents read production transcript text masked, only through the telemetry content reader; cl.2 and cl.6 count two production telemetry readers, so the closed read boundary is three readers.]

    [Amendment {{DATE}}, PLAN-telemetry-read-timeouts: cl.5's cadence is retuned to the write rate, as Decision 88 cl.1(iii) sizes it: merge_ops on the production telemetry catalog runs hourly, not every 6 hours. Each telemetry write lands as its own small file, and on a busy day six hours of unmerged files pushed cold reads of the newest days past the reader's deadline (rec-5247, rec-5248). The weekly guarded gc_ops, the guards and every alarm are unchanged.]
