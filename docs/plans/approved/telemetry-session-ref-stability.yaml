schema_version: 1
slug: telemetry-session-ref-stability
tldr: 'Words for rec-5477. Rule R10 now says what it protects: renaming the session of anything already stored needs a numbered
  Decision and a version bump of every producer; naming runs that never produced a row renames nothing, a registered host
  prefix never changes, and session names stay distinct across producers. The one-off first-grammar exemption and the litellm
  line''s R10 sentences go. Two old log rows are shortened to fit the size limit.'
blocks:
- id: env-r10
  file: docs/contracts/telemetry-event-envelope.yaml
  before: |-
    An identity-spec change, or a change to
          ANY session entity_ref grammar (root or sub-agent), bumps EVERY producer and requires a
          Decision (R10) -- the generation unit is the session, so a re-keyed session escapes R5a
          retirement. A new producer's first session entity_ref grammar is not such a change: it re-keys no stored
          session (the litellm grammar, LITELLM PARSER_VERSION 1 below). The registry and golden-corpus check that enforce this are rec-4122.
  after: |-
    An identity-spec change, or a change to
          the session entity_ref (root or sub-agent) of any input that has stored rows, bumps EVERY producer and
          requires a Decision (R10) -- the generation unit is the session, so a re-keyed session escapes R5a
          retirement. A ref for an input that never produced a row re-keys nothing; a registered host_run_ref prefix
          never changes; session refs stay disjoint across producers. Enforced by rec-4122's registry check and
          tests/telemetry/test_session_ref_stability.py.
- id: env-ll1
  file: docs/contracts/telemetry-event-envelope.yaml
  before: 'As a new producer''s first grammar it is outside R10 (see parser_version). A run with no host-run sidecar (a run_persona
    run on another persona compute host) DEFERS: this line gives it no root grammar, and declaring one later is an R10 change.'
  after: The root composes the host_run_ref registry (R10). A run with no host-run sidecar DEFERS.
- id: env-log
  file: docs/contracts/telemetry-event-envelope.yaml
  before: |2

    amendment_log:
  after: |2

    amendment_log:
      - {date: "{{DATE}}", semantic_break: true, change_class: governance_note_add, summary: "PLAN-telemetry-session-ref-stability (rec-5477): R10 is stated on stored session refs; the first-grammar carve-out and LL-1's R10 sentences go."}
- id: agt-log
  file: docs/contracts/telemetry_agents.yaml
  before: |2

    amendment_log:
  after: |2

    amendment_log:
      - {date: "{{DATE}}", semantic_break: false, change_class: prose_improvement, summary: "PLAN-telemetry-session-ref-stability (rec-5477): host_run_ref says a registered prefix never changes (envelope R10)."}
- id: agt-prefix
  file: docs/contracts/telemetry_agents.yaml
  before: |-
    A new host is a new prefix and a contract
          widen (Decision 210 cl.3).
  after: |-
    A new host is a new prefix and a contract
          widen (Decision 210 cl.3); a registered prefix never changes (envelope R10).
- id: env-compact-0925a
  file: docs/contracts/telemetry-event-envelope.yaml
  before: 'summary: "PLAN-telemetry-kernel-identity-append: named the committed golden-vector file (tests/telemetry/fixtures/identity_vectors.yaml)
    as this spec''s CONFORMANCE..."}'
  after: 'summary: "PLAN-telemetry-kernel-identity-append: CONFORMANCE names tests/telemetry/fixtures/identity_vectors.yaml."}'
- id: env-compact-0925b
  file: docs/contracts/telemetry-event-envelope.yaml
  before: 'summary: "PLAN-telemetry-kernel-identity-append (rec-4065): the governance_notes derivation-bound sentence reworded
    from \"day(session_started_at) partition\" to..."}'
  after: 'summary: "PLAN-telemetry-kernel-identity-append (rec-4065): the derivation-bound sentence reworded."}'
