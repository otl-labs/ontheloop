    def _rename_in_file(ctx: dict[str, Any], rel: str, old: str, new: str) -> dict[str, Any]:
        text, n = re.subn(rf'(name\s*=\s*)"{re.escape(old)}"', rf'\1"{new}"', ctx["files"][rel], count=1)
