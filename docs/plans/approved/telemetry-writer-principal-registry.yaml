schema_version: 1
slug: telemetry-writer-principal-registry
tldr: "The telemetry writer contract gains one list of every identity allowed to write production telemetry (CI's branch
  role, PlatformDev, the agent session user and the verdict-persona role, which was granted but undeclared): its
  Terraform identity, the statements that grant it, its route, its project and the Decision that admitted it. A new
  check fails CI on any undeclared writer. The producer tests read the list instead of a hard-coded map, and roadmap
  T3.22 c4 is reworded to the two open routes and marked met. No IAM or runtime change."
