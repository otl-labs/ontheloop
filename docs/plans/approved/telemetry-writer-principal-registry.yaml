    _ADMISSION_TOKEN = r"^(Decision [0-9]+|rec-[0-9]+)$"


    class PrincipalIdentity(BaseModel):
        """A Terraform identity named by its file, resource address and IAM name (text, never state)."""

        model_config = ConfigDict(extra="forbid")

        file: str
        resource: str = Field(pattern=r"^aws_iam_(role|user)\.[a-z0-9_]+$")
        name: str


    class PrincipalGrant(BaseModel):
        """The Allow statements, by Sid in one Terraform file, that hold a class's grant."""

        model_config = ConfigDict(extra="forbid")

        file: str
        sids: list[str] = Field(min_length=1)


    class PrincipalClassSpec(BaseModel):
        """One admitted principal class (rec-4420): who it is, which statements grant it, which open paths it uses."""

        model_config = ConfigDict(extra="forbid")

        identity: PrincipalIdentity
        grant: PrincipalGrant
        paths: list[Literal["function_url", "rest_route"]] = Field(min_length=1)
        project_scope: list[str] = Field(min_length=1)
        project_scope_enforcement: Literal["producer", "writer"]
        admitted_by: str = Field(pattern=_ADMISSION_TOKEN)
        pinned_by: str
        retire_when: str | None = Field(default=None, pattern=_ADMISSION_TOKEN)


    class PrincipalExclusion(BaseModel):
        """A named holder that is not a class: the statements and the reason it is excluded."""

        model_config = ConfigDict(extra="forbid")

        file: str
        sids: list[str] = Field(min_length=1)
        reason: str


    class PrincipalAdmission(BaseModel):
