        @model_validator(mode="after")
        def _admission_matches_classes(self) -> ContractGovernance:
            admission = self.principal_admission
            if admission is None:
                return self
            declared = self.principal_classes or []
            if len(set(declared)) != len(declared) or set(declared) != set(admission.classes):
                raise ValueError("principal_classes must equal principal_admission.classes keys, with no duplicates")
            used = {p for spec in admission.classes.values() for p in spec.paths}
            if not used <= set(admission.paths):
                raise ValueError(f"a class uses an undefined path: {sorted(used - set(admission.paths))}")
            return self


