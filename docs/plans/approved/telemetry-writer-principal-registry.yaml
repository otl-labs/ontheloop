- id: telemetry-writer-principals-create
  file: docs/contracts/telemetry-writer-principals.yaml
  before: ''
  after: |
    # Telemetry writer principals (rec-4420, rec-5177; T3.22 c4). Class D mechanism contract: every identity that may invoke
    # the production telemetry writer, the open path each uses, its project scope and the Decision that admitted it, plus
    # the two named non-producer holders. validate_telemetry_writer_principals checks the Terraform text against it.
    contract:
      id: telemetry-writer-principals
      class: D
      contract_version: 1
      status: draft
      description: >-
        Who may write production telemetry. The writer's own contract (ducklake_telemetry_writer.yaml) lists the class
        tokens in governance.principal_classes; this file holds each class's row, and the two must name the same classes.
      subject: telemetry-writer-principals
      evaluator:
        check: validate_telemetry_writer_principals

    amendment_log:
      - {date: "{{DATE}}", semantic_break: false, change_class: field_add, summary: "PLAN-telemetry-writer-principal-registry (rec-4420, rec-5177): created with the four writer classes and two exclusions."}

    procedure: >-
      One change admits a producer identity: its class row here, its token in ducklake_telemetry_writer.yaml's
      governance.principal_classes and its grant in the identity's own Terraform root (IAM, always-ask).
      validate_telemetry_writer_principals fails CI on any Terraform identity that can invoke the production writer without
      a row, and on a row whose statements exceed its paths.
    tenant_scope: caller_account
    scope_enforcement_owner: "rec-4714: the producer enforces project_scope while one project writes under the house tenant (Decision 200); the writer refuses out-of-scope rows once rec-4714 builds"
    paths:
      function_url: "lambda:InvokeFunctionUrl on the writer (both ARN forms), optionally lambda:GetFunctionUrlConfig, and lambda:InvokeFunction only under Bool lambda:InvokedViaFunctionUrl true; never lambda:InvokeAsync (Decision 213)"
      rest_route: "execute-api:Invoke on the REST API's telemetry/writer route and never a Lambda invoke; the API's route-scoped lambda permission and its principal fence name exactly the rest_route classes (Decisions 255, 256)"
    exclusions:
      PlatformAdmin: {file: terraform/bootstrap/platform_admin_policies.tf, sids: [LambdaAdminManagement], reason: "the unbounded operator, Resource * (Decision 144 cl.3); its non-URL invoke is Decision 213's residual, rec-4204"}
      ci_apply_boundary: {file: terraform/bootstrap/github_ci_apply_boundary.tf, sids: [DataPlaneAllow], reason: "a permissions boundary is a ceiling and grants nothing (Decision 144 cl.1)"}
    classes:
      github_ci_branch: {identity: {file: terraform/personal/oidc_ci_roles.tf, resource: aws_iam_role.github_ci_branch, name: agent-platform-github-ci-branch}, grant: {file: terraform/personal/oidc_ci_roles.tf, sids: [TelemetryWriterInvokeCI, TelemetryWriterInvokeCIViaUrlOnly]}, paths: [function_url], project_scope: [ontheloop], project_scope_enforcement: producer, admitted_by: Decision 213, pinned_by: tests/checks/iam_tf/test_url_only_invoke_guard.py}
      PlatformDev: {identity: {file: terraform/bootstrap/platform_roles.tf, resource: aws_iam_role.platform_dev, name: PlatformDev}, grant: {file: terraform/bootstrap/platform_dev_policies.tf, sids: [DuckLakeInvokeUrl, DuckLakeInvokeViaUrlOnly]}, paths: [function_url], project_scope: [ontheloop], project_scope_enforcement: producer, admitted_by: Decision 213, pinned_by: tests/checks/iam_tf/test_url_only_invoke_guard.py, retire_when: rec-5282}
      agent-platform-session: {identity: {file: terraform/bootstrap/agent_session_user.tf, resource: aws_iam_user.agent_session, name: agent-platform-session}, grant: {file: terraform/bootstrap/agent_session_user.tf, sids: [DuckLakeApiInvoke]}, paths: [rest_route], project_scope: [ontheloop], project_scope_enforcement: producer, admitted_by: Decision 256, pinned_by: tests/checks/contracts/test_telemetry_writer_producers.py}
      github_ci_persona_verdict: {identity: {file: terraform/personal/oidc_persona_verdict_role.tf, resource: aws_iam_role.github_ci_persona_verdict, name: agent-platform-github-ci-persona-verdict}, grant: {file: terraform/personal/oidc_persona_verdict_role.tf, sids: [TelemetryWriterInvoke, TelemetryWriterInvokeViaUrlOnly]}, paths: [function_url], project_scope: [ontheloop], project_scope_enforcement: producer, admitted_by: Decision 263, pinned_by: tests/checks/iam_tf/test_persona_verdict_role.py}
