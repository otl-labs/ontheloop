schema_version: 1
slug: telemetry-writer-session-producer
tldr: "The telemetry writer contract declares agent-platform-session, the proxy-held agent session user, as a producer
  beside github_ci_branch and PlatformDev, and its caller-identity text names both open paths (the Function URL and the
  REST API's telemetry/writer route), so the contract matches what the writer already serves; tenant-id.yaml's producer
  note follows. No behaviour changes."
blocks:
- id: writer-description
  file: docs/contracts/ducklake_telemetry_writer.yaml
  before: |
    Telemetry-scoped DuckLake runtime Lambda invoked over an AWS_IAM (SigV4) Function URL, URL-only (direct invoke is denied
    in the permissions boundary, Decision 213).
  after: |
    Telemetry-scoped DuckLake runtime Lambda invoked over an AWS_IAM (SigV4) Function URL or the agent REST API's
    telemetry/writer route (Decision 255), never directly (direct invoke is denied in the permissions boundary, Decision
    213).
- id: writer-auth-and-classes
  file: docs/contracts/ducklake_telemetry_writer.yaml
  before: |
    auth_type: >-
      AWS_IAM SigV4-signed Function URL, invoked URL-only. The caller's account is taken from the signed identity at the
      handler edge (CallerPrincipal, Decision 184 cl.2); no verb accepts a principal, tenant or catalog parameter.
    principal_classes:
      - github_ci_branch
      - PlatformDev
  after: |
    auth_type: >-
      AWS_IAM SigV4-signed, on one of two open paths (Decision 213 as amended by Decision 255): the Function URL, or the
      IAM-authorised REST API's telemetry/writer route (AWS_PROXY), which only the agent session user may invoke. The
      handler reads the caller only from the signed identity of the path that delivered the call and refuses any other
      shape (CallerPrincipal, Decision 184 cl.2); no verb accepts a principal, tenant or catalog parameter.
    principal_classes:
      - github_ci_branch
      - PlatformDev
      - agent-platform-session
- id: describe-403
  file: docs/contracts/ducklake_telemetry_writer.yaml
  before: |
    200: "body {ok, function, actions, verbs, catalog: {meta_schema, data_path_is_smoke}, blob_protocol, schema}"
    403: "missing_caller_identity: the Function URL authorizer context carries no caller identity"
  after: |
    200: "body {ok, function, actions, verbs, catalog: {meta_schema, data_path_is_smoke}, blob_protocol, schema}"
    403: "missing_caller_identity: the delivering path's signed context (the Function URL authorizer's iam, or the REST API's identity) carries no caller identity"
- id: provision-403
  file: docs/contracts/ducklake_telemetry_writer.yaml
  before: |
    200: "body {ok, tables (the nine physical tables), counters {ops_tenants, ops_projects}}"
    400: "bad_request: an unknown key, or an invalid string with the field named, never the value"
    403: "missing_caller_identity: the Function URL authorizer context carries no caller identity"
  after: |
    200: "body {ok, tables (the nine physical tables), counters {ops_tenants, ops_projects}}"
    400: "bad_request: an unknown key, or an invalid string with the field named, never the value"
    403: "missing_caller_identity: the delivering path's signed context (the Function URL authorizer's iam, or the REST API's identity) carries no caller identity"
- id: register-tenant-403
  file: docs/contracts/ducklake_telemetry_writer.yaml
  before: |
    200: "body {ok, tenant_id, created}; never the principal or a hash of it"
    400: "bad_request: an unknown key, or an invalid string with the field named, never the value"
    403: "missing_caller_identity: the Function URL authorizer context carries no caller identity"
  after: |
    200: "body {ok, tenant_id, created}; never the principal or a hash of it"
    400: "bad_request: an unknown key, or an invalid string with the field named, never the value"
    403: "missing_caller_identity: the delivering path's signed context (the Function URL authorizer's iam, or the REST API's identity) carries no caller identity"
- id: register-project-403
  file: docs/contracts/ducklake_telemetry_writer.yaml
  before: |
    403: "tenant_unresolved: the caller's tenant is not registered (remedy: register_tenant); missing_caller_identity: the Function URL authorizer context carries no caller identity"
  after: |
    403: "tenant_unresolved: the caller's tenant is not registered (remedy: register_tenant); missing_caller_identity: the delivering path's signed context (the Function URL authorizer's iam, or the REST API's identity) carries no caller identity"
- id: missing-caller-invariant
  file: docs/contracts/ducklake_telemetry_writer.yaml
  before: |
    it arises only on an invoke without authorizer context (an unsigned Function URL call gets the URL's own 403 with no
    error_type).
  after: |
    it arises only on an invoke whose delivering path carries no signed caller fields (neither the Function URL
    authorizer's iam context nor the REST API's identity, or both at once); an unsigned Function URL call gets the URL's
    own 403 with no error_type, and a REST call the API refuses never reaches the handler.
- id: principal-residual
  file: docs/contracts/ducklake_telemetry_writer.yaml
  before: |
    - "Declared residual (principal classes): the declared producers are github_ci_branch (caller_role
    agent-platform-github-ci-branch, CI's ambient credentials) and PlatformDev (caller_role PlatformDev). From this
    ratification, turn capture's writer client (scripts/telemetry_capture/transport.py make_client) signs with the
    agent_platform (PlatformDev) profile and ignores AWS_PROFILE;
  after: |
    - "Declared residual (principal classes): the declared producers are github_ci_branch (caller_role
    agent-platform-github-ci-branch, CI's ambient credentials, over the Function URL), PlatformDev (caller_role
    PlatformDev, over the Function URL) and agent-platform-session (caller_role agent-platform-session, the proxy-held
    agent session user of Decision 256, over the REST API's telemetry/writer route;
    tests/checks/contracts/test_telemetry_writer_producers.py binds the class to that user and its route grant). Turn
    capture's writer client (scripts/telemetry_capture/transport.py make_client) signs with the agent_platform profile and ignores AWS_PROFILE:
    since Decision 256 an agent environment signs as agent-platform-session through its proxy and selects the REST route
    (OTL_OPS_VERBS_TRANSPORT=execute_api), the profile name kept with placeholder credentials, while sessions started
    before that swap still sign PlatformDev over the Function URL;
- id: governance-notes-and-amendment
  file: docs/contracts/ducklake_telemetry_writer.yaml
  before: |
    This contract holds only the pointer;
    contract.governance.principal_classes is unchanged.
    amendment_log:
  after: |
    This contract holds only the pointer.
    amendment_log:
      - date: "2026-11-14"
        semantic_break: false
        change_class: prose_improvement
        summary: >-
          PLAN-telemetry-writer-session-producer (rec-5153; Decisions 255 and 256): governance.principal_classes gains
          agent-platform-session, the proxy-held agent session user, beside github_ci_branch and PlatformDev; the
          description, auth_type, the four 403 rows, the missing_caller_identity invariant and the principal-classes
          residual name both open paths, the Function URL and the REST API's telemetry/writer route; governance_notes
          drops a clause that named principal_classes as unchanged.
        migration_story: >-
          No verb, request, response or error behaviour changes: the handler has accepted the REST caller shape since
          PLAN-agent-proxy-signed-access, and the session user's appends already land in the house tenant (Decision 200),
          so only the declared producer set and its prose catch up.
- id: tenant-producer-note
  file: docs/contracts/tenant-id.yaml
  before: |
    The production writer's invoke stays {github_ci_branch, PlatformDev}, URL-only
    (Decision 213), with github_ci_branch's agent/* trust owned by rec-4480;
  after: |
    The production writer's invoke is {github_ci_branch, PlatformDev, agent-platform-session}, never a direct invoke
    (Decision 213 as amended by Decision 255): github_ci_branch and PlatformDev over its Function URL, and
    agent-platform-session, the proxy-held agent session user (Decision 256), over the REST API's telemetry/writer route;
    github_ci_branch's agent/* trust is owned by rec-4480;
- id: tenant-amendment
  file: docs/contracts/tenant-id.yaml
  before: |
    caller's account is the house tenant; the two production invoke principals; rec-4480 and rec-4420 own the rest).
    migration_story: No field meaning changes; prose only.
  after: |
    caller's account is the house tenant; the two production invoke principals; rec-4480 and rec-4420 own the rest).
    migration_story: No field meaning changes; prose only.
    - date: "2026-11-14"
      semantic_break: false
      change_class: governance_note_add
      summary: >-
        PLAN-telemetry-writer-session-producer (rec-5153; Decisions 255 and 256): the producer identity note's writer
        invoke set gains agent-platform-session, the proxy-held agent session user, over the REST API's telemetry/writer
        route, beside github_ci_branch and PlatformDev over the Function URL.
      migration_story: No field meaning changes; prose only.
- id: identity-model-needles
  file: tests/checks/contracts/test_tenant_id_producer_identity_model.py
  before: |
    "URL-only",
    "rec-4480",
  after: |
    "never a direct invoke",
    "Decision 255",
    "agent-platform-session",
    "rec-4480",
- id: identity-model-classes
  file: tests/checks/contracts/test_tenant_id_producer_identity_model.py
  before: |
    assert writer["contract"]["governance"]["principal_classes"] == ["github_ci_branch", "PlatformDev"]
  after: |
    assert writer["contract"]["governance"]["principal_classes"] == [
        "github_ci_branch",
        "PlatformDev",
        "agent-platform-session",
    ]
- id: ratification-triple-anchor
  file: tests/checks/contracts/test_telemetry_writer_ratification.py
  before: |
    newest = [(e["change_class"], e["semantic_break"]) for e in raw["amendment_log"][:3]]
  after: |
    log = raw["amendment_log"]
    at = next(i for i, e in enumerate(log) if e["summary"].startswith("PLAN-ratify-telemetry-writer-contract"))
    assert all(str(e["date"]) > "2026-10-29" for e in log[:at])
    newest = [(e["change_class"], e["semantic_break"]) for e in log[at : at + 3]]
