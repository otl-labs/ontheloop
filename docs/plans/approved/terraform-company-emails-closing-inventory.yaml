    [rec-3950], status: proven}
- id: row-aws-11
  file: docs/contracts/account-credential-inventory.yaml
  before: >-
    - {id: AWS-11, provider: AWS, item: alerts mailbox (SNS e-mail subscription on agent-platform-alerts), kind: alerts_email
    variable, location: terraform/personal/sns_alerts.tf, owner_today: founder, target: A company mailbox, stage: aws_account,
    rec: [rec-3904], status: personal}
  after: >-
    - {id: AWS-11, provider: AWS, item: alerts mailbox (SNS e-mail subscription on agent-platform-alerts), kind: alerts_email
    variable, location: terraform/personal/sns_alerts.tf, owner_today: company, target: The company alerts role alias, stage:
    aws_account, rec: [rec-3904], status: proven}
- id: ledger-entries
  file: docs/contracts/account-credential-inventory.yaml
  before: |-
    tracking:
      closes: [rec-4542]
  after: |2-
      - {date: "{{DATE}}", row: AWS-07, status: proven, evidence: "PLAN-terraform-company-emails S1, -forget S2 and -closing S3 and S4: owner_email holds the company operations role alias and alerts_email the company alerts role alias; no founder contact value is left in the parameter's current version, and neon_org_id names the company organisation (NEON-02); rec-4048 (the ExternalIds the parameter also holds) is outside this row's kind and stays open (verified {{DATE}})"}
      - {date: "{{DATE}}", row: AWS-10, status: proven, evidence: "PLAN-terraform-company-emails-closing B3 and A1: every Owner-tagged resource in both roots carries the company operations role alias (terraform-apply-sandbox run {{N}} and the bootstrap admin apply, verified {{DATE}}); the Account tag names this account (Decision 242 cl.5)"}
      - {date: "{{DATE}}", row: AWS-11, status: proven, evidence: "PLAN-terraform-company-emails C1 and P1 and -forget C2: the alerts topic's only e-mail subscription is the company alerts role alias, confirmed, and an alarm page reached it before the founder's subscription was deleted (verified {{DATE}})"}

    tracking:
      closes: [rec-4542]
- id: inventory-amendment-log
  file: docs/contracts/account-credential-inventory.yaml
  before: 'amendment_log:'
  after: |-
    amendment_log:
      - {date: "{{DATE}}", semantic_break: false, change_class: correction, summary: "PLAN-terraform-company-emails-closing: AWS-07, AWS-10 and AWS-11 flip to proven with owner company, each with one evidence_ledger entry; AWS-10's location names providers.tf and its target records that the Account tag names this account (Decision 242 cl.5); AWS-11's target names the company alerts role alias."}
