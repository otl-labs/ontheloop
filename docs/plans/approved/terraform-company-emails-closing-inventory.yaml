schema_version: 1
slug: terraform-company-emails-closing-inventory
tldr: >-
  Plan 3 (closing) PR 4 wording, approved in chat on 2026-11-04 and now re-approved on GitHub (Decision 246): the account
  and credential inventory flips AWS-07 (the tfvars parameter), AWS-10 (the Owner tags) and AWS-11 (the alerts mailbox)
  to proven with owner company, appends one evidence entry for each, and logs the amendment. Dates and run ids are filled
  in at build time; no other word changes.
blocks:
- id: row-aws-07
  file: docs/contracts/account-credential-inventory.yaml
  before: >-
    - {id: AWS-07, provider: AWS, item: agent-platform-terraform-personal-tfvars, kind: "SSM SecureString parameter holding
    owner_email, alerts_email and neon_org_id", location: AWS SSM Parameter Store, owner_today: founder, target: Company
    values, stage: aws_account, rec: [rec-4048, rec-3950], status: personal}
  after: >-
    - {id: AWS-07, provider: AWS, item: agent-platform-terraform-personal-tfvars, kind: "SSM SecureString parameter holding
    owner_email, alerts_email and neon_org_id", location: AWS SSM Parameter Store, owner_today: company, target: Company
    values, stage: aws_account, rec: [rec-4048, rec-3950], status: proven}
- id: row-aws-10
  file: docs/contracts/account-credential-inventory.yaml
  before: >-
    - {id: AWS-10, provider: AWS, item: Owner and Account default tags, kind: provider default_tags, location: "terraform/personal/main.tf,
    terraform/bootstrap/main.tf", owner_today: founder, target: Company values, stage: aws_account, rec: [rec-3950], status:
    personal}
  after: >-
    - {id: AWS-10, provider: AWS, item: Owner and Account default tags, kind: provider default_tags, location: "terraform/personal/providers.tf,
    terraform/bootstrap/main.tf", owner_today: company, target: "Owner holds the company operations role alias in both roots;
