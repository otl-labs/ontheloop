schema_version: 1
slug: terraform-company-emails-closing
tldr: >-
  Plan 3 (closing) PR 3 wording, approved in chat on 2026-11-04, re-approved here on GitHub (Decision 246): the contract's
  recoverable variables drop company_alerts_email, Owner and alerts entries name the company role aliases, and the runbook
  says to confirm a subscription under your own AWS sign-in. Changed from the chat words: the stale clause about the agent's
  admin role now reads that no agent session can confirm. New: the sns_alerts.tf code (the one subscription moved back to
  its address) and its guard test, bound because a sidecar binds each file whole.
blocks:
- id: contract-recoverable-vars
  file: docs/contracts/terraform-cc-web-operations.yaml
  before: >-
    Seven no-default, non-ephemeral vars (`account_id`, `alerts_email`, `owner_email`, `platform_dev_external_id`, `platform_admin_external_id`,
    `neon_org_id`, and the transitional `company_alerts_email`) are recoverable;
  after: >-
    Six no-default, non-ephemeral vars (`account_id`, `alerts_email`, `owner_email`, `platform_dev_external_id`, `platform_admin_external_id`,
    `neon_org_id`) are recoverable;
- id: contract-owner-email-source
  file: docs/contracts/terraform-cc-web-operations.yaml
  before: >-
    the `Owner` resource tag value in the remote state -- the GitHub no-reply role-alias identity (see `owner_vs_alerts_email`
    below; this is never the alerts mailbox).
  after: >-
    the `Owner` resource tag value in the remote state of both roots -- the company operations role alias (see `owner_vs_alerts_email`
    below; never a person and never the alerts mailbox).
- id: contract-company-alerts-entry-removed
  file: docs/contracts/terraform-cc-web-operations.yaml
  before: >-
    company_alerts_email: declared_in: terraform/personal/sns_alerts.tf source: >- The `/secret/agent-platform-terraform-personal-tfvars`
    SSM parameter; also present as the `endpoint` attribute of `aws_sns_topic_subscription.company_alerts_email` in the
    remote state -- the company alerts role alias. Transitional (PLAN-terraform-company-emails): it carries the successor
    subscription while the founder's is retired, and leaves with PLAN-terraform-company-emails-closing, which moves the
    subscription to `aws_sns_topic_subscription.alerts_email`.
  after: ''
- id: contract-owner-vs-alerts
  file: docs/contracts/terraform-cc-web-operations.yaml
  before: >-
    `owner_email` and `alerts_email` are two different role-alias identities that must never be reconciled to the same value:
    `owner_email` backs the GitHub no-reply identity used for resource `Owner` tags (a stable per-repo identifier, never
    a deliverable mailbox); `alerts_email` backs the SNS alerts subscription endpoint (a real, deliverable mailbox that
    must receive and confirm the page-out email). They differ BY DESIGN. Reading the tag-vs- subscription-endpoint diff
    as drift is a misdiagnosis -- the diff is a RECOVERY ARTEFACT of two intentionally distinct sources, and "fixing" it
    would either break alerting (routing pages to a no-reply address that cannot receive mail) or pollute the `Owner` tag
    with a real mailbox literal in a public repository (Decision 101).
  after: >-
    `owner_email` and `alerts_email` are two different company role aliases that must never be reconciled to the same value:
    `owner_email` is the company operations role alias used for resource `Owner` tags in both roots (whom to contact about
    a resource: a role, never a person); `alerts_email` is the company alerts role alias, the deliverable mailbox that confirms
    the SNS alerts subscription and receives every page. They differ BY DESIGN. Reading the tag-vs- subscription-endpoint
    diff as drift is a misdiagnosis -- the diff is a RECOVERY ARTEFACT of two intentionally distinct sources, and "fixing"
    it would couple two contacts that are re-pointed independently (the alerts alias may become an on-call group while the
    `Owner` tag stays the operations role). Neither value is committed: both live in the tfvars parameter, every `*_email`
    tfvars value is masked in CI logs, and plan comments print names only (Decision 101, Decision 238).
- id: contract-amendment-log
  file: docs/contracts/terraform-cc-web-operations.yaml
  before: 'amendment_log:'
  after: |-
    amendment_log:
      - date: "{{DATE}}"
        semantic_break: true
        change_class: correction
        summary: >-
          PLAN-terraform-company-emails-closing (rec-3904, rec-3950): owner_email is the company operations role
          alias and alerts_email the company alerts role alias; owner_vs_alerts_email keeps the two distinct and drops
          "never a deliverable mailbox"; the alerts subscription is back at aws_sns_topic_subscription.alerts_email,
          so the transitional company_alerts_email leaves recoverable_vars and where_values_live.
- id: sns-header
  file: terraform/personal/sns_alerts.tf
  before: |-
    # Shared personal-account SNS alerts topic (T2.18 FP-B / Decision 39).
    #
    # Decision 39: SNS is the canonical alarm/failure-notification primitive. This module
    # introduces the single shared personal-account SNS topic; both the DuckLake maintenance
    # circuit-breaker alarm and the catalog-DR freshness alarm target this topic.
    #
    # Email subscription endpoint supplied via gitignored terraform.personal.tfvars
    # (alerts_email = "..."). NOT hardcoded -- no email address is committed to source.
    # The subscription is created in PENDING state; the recipient must click the confirmation
    # link in the initial subscription email before alarms can page (VP9 manual step).
    #
    # ---------------------------------------------------------------------------
    # APPLY POSTURE (Decision 35 + 77): HUMAN-GATED via agent_platform_admin.
    # ---------------------------------------------------------------------------
    # aws_sns_topic and aws_sns_topic_subscription are NOT IAM-sensitive resources, but they
    # are created together with the DR Lambda (IAM role + policy), so they ride the same
    # human-gated admin apply for the T2.18 FP-B apply pass.
  after: |-
    # Shared SNS alerts topic (T2.18 FP-B / Decision 39): SNS is the canonical alarm primitive, and every
    # CloudWatch alarm in both roots targets this topic.
    #
    # The one e-mail subscription's endpoint is the company alerts role alias, from the tfvars parameter
    # (alerts_email; never committed). CI may subscribe but never unsubscribe or reconfigure a subscription
    # (terraform/bootstrap/github_ci_apply_policy.tf), so a new endpoint is a successor subscription beside this
    # one: the operator confirms it with authenticate-on-unsubscribe (never by opening the mail's link) and
    # proves a page, a removed block forgets the predecessor and the operator deletes it in the console, then a
    # moved block returns the successor to this address (PLAN-terraform-company-emails, -forget and -closing).
- id: sns-alerts-email-description
  file: terraform/personal/sns_alerts.tf
  before: |-
    description = "Email address for the shared personal-account SNS alerts subscription. Supplied via gitignored terraform.personal.tfvars."
    type        = string
    # No default: this must be explicitly set in terraform.personal.tfvars.
  after: |-
    description = "Company alerts role alias for the alerts topic's e-mail subscription, from the tfvars parameter (never committed)."
    type        = string
    # No default: the tfvars parameter supplies it.
- id: sns-subscription-moved-back
  file: terraform/personal/sns_alerts.tf
  before: |-
    # CI cannot unsubscribe (github_ci_apply_policy.tf): forget the founder's subscription and let the operator
    # delete it in the console once the company successor pages (PLAN-terraform-company-emails-forget).
    removed {
      from = aws_sns_topic_subscription.alerts_email

      lifecycle {
        destroy = false
      }
    }

    # Transitional (PLAN-terraform-company-emails): the company successor beside the predecessor. CI may
    # subscribe but never unsubscribe (github_ci_apply_policy.tf), so PLAN-terraform-company-emails-forget
    # forgets the predecessor for the operator to delete, and PLAN-terraform-company-emails-closing moves
    # this subscription back to aws_sns_topic_subscription.alerts_email.
    variable "company_alerts_email" {
      description = "Company alerts role alias for the successor alerts subscription, from the tfvars parameter (never committed)."
      type        = string
    }

    resource "aws_sns_topic_subscription" "company_alerts_email" {
      topic_arn = aws_sns_topic.alerts.arn
      protocol  = "email"
      endpoint  = var.company_alerts_email
    }
  after: |-
    resource "aws_sns_topic_subscription" "alerts_email" {
      topic_arn = aws_sns_topic.alerts.arn
      protocol  = "email"
      endpoint  = var.alerts_email
    }

    moved {
      from = aws_sns_topic_subscription.company_alerts_email
      to   = aws_sns_topic_subscription.alerts_email
    }
- id: runbook-endpoint
  file: docs/runbooks/ducklake-catalog-operations.md
  before: >-
    The SNS email subscription endpoint is set in `terraform/personal/terraform.personal.tfvars` (`alerts_email = "..."`).
    The file is gitignored -- no email address is committed to source.
  after: >-
    The SNS e-mail subscription endpoint is `alerts_email` in the `/secret/agent-platform-terraform-personal-tfvars` parameter:
    the company alerts role alias, never committed (the `terraform/personal/sns_alerts.tf` header describes a change of
    endpoint).
- id: runbook-confirmation
  file: docs/runbooks/ducklake-catalog-operations.md
  before: >-
    after the first `terraform apply` that creates the SNS resources, AWS sends a subscription-confirmation email. The recipient
    must click the confirmation link before the page-out is live.
  after: >-
    after the `terraform apply` that creates a subscription, AWS sends a subscription-confirmation e-mail to the company
    alerts role alias. Do not open its link, which confirms without authentication: confirm it under your own AWS sign-in
    (for example in CloudShell; no agent session can confirm) with `aws sns confirm-subscription --topic-arn <the alerts
    topic> --token <the token from the link> --authenticate-on-unsubscribe true` (the `terraform/personal/sns_alerts.tf`
    header gives the order of steps). The page-out is live once confirmed.
- id: test-subscription-at-pinned-address
  file: tests/checks/iam_tf/test_alerts_email_subscription.py
  before: |-
    """PLAN-terraform-company-emails-forget: the founder's alerts subscription is forgotten with destroy = false, never
    destroyed, and the company successor stays on the alerts topic from a no-default tfvars variable with no meta-argument
    (text-level guard over sns_alerts.tf).

    Transitional: PLAN-terraform-company-emails-closing replaces this test and the removed block it checks.
    """

    from __future__ import annotations

    import re
    from pathlib import Path

    import pytest

    from scripts.checks.contracts.validate_terraform_cc_web_operations import _declared_no_default_variables
    from tests.checks.iam_tf._platform_security_hcl import _block_body, _mask, _resource_body, _strip_comments

    pytestmark = pytest.mark.unit

    _DIR = Path(__file__).resolve().parents[3] / "terraform" / "personal"
    _SNS = _DIR / "sns_alerts.tf"
    _META_ARGUMENT = re.compile(r"^\s*(?:count|for_each|lifecycle)\b", re.MULTILINE)
    _PREDECESSOR = "aws_sns_topic_subscription.alerts_email"


    def _removed_destroy_flags(text: str, address: str) -> list[bool | None]:
        """destroy flag (None when undeclared) of every `removed { from = <address> ... }` block, comments ignored."""
        flags: list[bool | None] = []
        for m in re.finditer(r"\bremoved\s*\{", _mask(text)):
            body = _block_body(text, m.end() - 1)
            fm = re.search(r"^\s*from\s*=\s*([\w.]+)\s*$", _strip_comments(body), re.M)
            if fm is None or fm.group(1) != address:
                continue
            destroy: bool | None = None
            lcm = re.search(r"\blifecycle\s*\{", _mask(body))
            if lcm is not None:
                dm = re.search(r"\bdestroy\s*=\s*(true|false)\b", _strip_comments(_block_body(body, lcm.end() - 1)))
                if dm is not None:
                    destroy = dm.group(1) == "true"
            flags.append(destroy)
        return flags


    def test_predecessor_forgotten_not_destroyed() -> None:
        text = _SNS.read_text(encoding="utf-8")
        assert _resource_body(text, "aws_sns_topic_subscription", "alerts_email") is None, "the founder's resource block stays"
        assert _removed_destroy_flags(text, _PREDECESSOR) == [False], f"{_PREDECESSOR}: exactly one removed block, destroy = false"

        block = _resource_body(text, "aws_sns_topic_subscription", "company_alerts_email")
        assert block is not None, "the company successor subscription is gone"
        body = _strip_comments(block)
        assert re.search(r"^\s*topic_arn\s*=\s*aws_sns_topic\.alerts\.arn\s*$", body, re.MULTILINE)
        assert re.search(r'^\s*protocol\s*=\s*"email"\s*$', body, re.MULTILINE)
        assert re.search(r"^\s*endpoint\s*=\s*var\.company_alerts_email\s*$", body, re.MULTILINE)
        assert not _META_ARGUMENT.search(body), "the trusted-plan screen refuses count and for_each"
        assert "company_alerts_email" in _declared_no_default_variables(_DIR), "company_alerts_email must declare no default"
        assert "@" not in text, "sns_alerts.tf must carry no e-mail address"
  after: |-
    """PLAN-terraform-company-emails-closing: the alerts topic's one e-mail subscription is back at its pinned address,
    aws_sns_topic_subscription.alerts_email on var.alerts_email, moved there from the transitional company successor, with
    no meta-argument (text-level guard over sns_alerts.tf).
    """

    from __future__ import annotations

    import re
    from pathlib import Path

    import pytest

    from scripts.checks.contracts.validate_terraform_cc_web_operations import _declared_no_default_variables
    from tests.checks.iam_tf._platform_security_hcl import _block_body, _mask, _resource_body, _strip_comments

    pytestmark = pytest.mark.unit

    _DIR = Path(__file__).resolve().parents[3] / "terraform" / "personal"
    _SNS = _DIR / "sns_alerts.tf"
    _META_ARGUMENT = re.compile(r"^\s*(?:count|for_each|lifecycle)\b", re.MULTILINE)
    _SUCCESSOR = "aws_sns_topic_subscription.company_alerts_email"
    _PINNED = "aws_sns_topic_subscription.alerts_email"


    def _moved_pairs(text: str) -> list[tuple[str | None, str | None]]:
        """(from, to) of every `moved { ... }` block, comments ignored."""
        pairs: list[tuple[str | None, str | None]] = []
        for m in re.finditer(r"\bmoved\s*\{", _mask(text)):
            body = _strip_comments(_block_body(text, m.end() - 1))
            fm = re.search(r"^\s*from\s*=\s*([\w.]+)\s*$", body, re.MULTILINE)
            tm = re.search(r"^\s*to\s*=\s*([\w.]+)\s*$", body, re.MULTILINE)
            pairs.append((fm.group(1) if fm else None, tm.group(1) if tm else None))
        return pairs


    def test_subscription_at_pinned_address() -> None:
        text = _SNS.read_text(encoding="utf-8")
        block = _resource_body(text, "aws_sns_topic_subscription", "alerts_email")
        assert block is not None, f"the alerts subscription is not at {_PINNED}"
        body = _strip_comments(block)
        assert re.search(r"^\s*topic_arn\s*=\s*aws_sns_topic\.alerts\.arn\s*$", body, re.MULTILINE)
        assert re.search(r'^\s*protocol\s*=\s*"email"\s*$', body, re.MULTILINE)
        assert re.search(r"^\s*endpoint\s*=\s*var\.alerts_email\s*$", body, re.MULTILINE)
        assert not _META_ARGUMENT.search(body), "the trusted-plan screen refuses count and for_each"
        assert _resource_body(text, "aws_sns_topic_subscription", "company_alerts_email") is None, "the successor resource stays"
        assert not re.search(r'\bvariable\s+"company_alerts_email"', _strip_comments(text)), "the successor variable stays"
        assert (_SUCCESSOR, _PINNED) in _moved_pairs(text), "the moved block from the successor to the pinned address is gone"
        assert "alerts_email" in _declared_no_default_variables(_DIR), "alerts_email must declare no default"
        assert "@" not in text, "sns_alerts.tf must carry no e-mail address"
