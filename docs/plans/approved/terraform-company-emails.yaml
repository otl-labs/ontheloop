schema_version: 1
slug: terraform-company-emails
blocks:
- id: contract-recoverable-vars
  file: docs/contracts/terraform-cc-web-operations.yaml
  before: >-
    Six no-default, non-ephemeral vars (`account_id`, `alerts_email`, `owner_email`,
    `platform_dev_external_id`, `platform_admin_external_id`, `neon_org_id`) are recoverable;
  after: >-
    Seven no-default, non-ephemeral vars (`account_id`, `alerts_email`, `owner_email`,
    `platform_dev_external_id`, `platform_admin_external_id`, `neon_org_id`, and the transitional
    `company_alerts_email`) are recoverable;
- id: contract-owner-email-source
  file: docs/contracts/terraform-cc-web-operations.yaml
  before: >-
    the `Owner` resource tag value in the remote state -- the GitHub no-reply role-alias identity (see
    `owner_vs_alerts_email` below; this is never the alerts mailbox).
  after: >-
    the `Owner` resource tag value in the remote state of both roots -- the company operations role alias
    (see `owner_vs_alerts_email` below; never a person and never the alerts mailbox).
- id: contract-company-alerts-entry
  file: docs/contracts/terraform-cc-web-operations.yaml
  before: >-
    the deliverable alerts-mailbox role-alias (see `owner_vs_alerts_email` below; this is never the Owner
    tag identity).
  after: |2-
        the deliverable alerts-mailbox role-alias (see `owner_vs_alerts_email` below; this is never the Owner
        tag identity).
    company_alerts_email:
      declared_in: terraform/personal/sns_alerts.tf
      source: >-
        The `/secret/agent-platform-terraform-personal-tfvars` SSM parameter; also present as the `endpoint`
        attribute of `aws_sns_topic_subscription.company_alerts_email` in the remote state -- the company
        alerts role alias. Transitional (PLAN-terraform-company-emails): it carries the successor
        subscription while the predecessor is retired, and leaves with that plan's last PR, which moves the
        subscription to `aws_sns_topic_subscription.alerts_email`.
- id: contract-owner-vs-alerts
  file: docs/contracts/terraform-cc-web-operations.yaml
  before: >-
    `owner_email` and `alerts_email` are two different role-alias identities that must never be
    reconciled to the same value: `owner_email` backs the GitHub no-reply identity used for
    resource `Owner` tags (a stable per-repo identifier, never a deliverable mailbox);
    `alerts_email` backs the SNS alerts subscription endpoint (a real, deliverable mailbox that
    must receive and confirm the page-out email). They differ BY DESIGN. Reading the tag-vs-
    subscription-endpoint diff as drift is a misdiagnosis -- the diff is a RECOVERY ARTEFACT of
    two intentionally distinct sources, and "fixing" it would either break alerting (routing
    pages to a no-reply address that cannot receive mail) or pollute the `Owner` tag with a real
    mailbox literal in a public repository (Decision 101).
  after: >-
    `owner_email` and `alerts_email` are two different company role aliases that must never be
    reconciled to the same value: `owner_email` is the company operations role alias used for
    resource `Owner` tags in both roots (whom to contact about a resource: a role, never a person);
    `alerts_email` is the company alerts role alias, the deliverable mailbox that confirms the SNS
    alerts subscription and receives every page. They differ BY DESIGN. Reading the tag-vs-
    subscription-endpoint diff as drift is a misdiagnosis -- the diff is a RECOVERY ARTEFACT of
    two intentionally distinct sources, and "fixing" it would couple two contacts that are
    re-pointed independently (the alerts alias may become an on-call group while the `Owner` tag
    stays the operations role). Neither value is committed: both live in the tfvars parameter,
    every `*_email` tfvars value is masked in CI logs, and plan comments print names only
    (Decision 101, Decision 238).
- id: contract-amendment-log
  file: docs/contracts/terraform-cc-web-operations.yaml
  before: 'amendment_log:'
  after: |-
    amendment_log:
      - date: "{{DATE}}"
        semantic_break: true
        change_class: correction
        summary: >-
          PLAN-terraform-company-emails (rec-3975): owner_email becomes the company operations role alias and
          alerts_email the company alerts role alias; owner_vs_alerts_email keeps the two distinct and drops "never
          a deliverable mailbox"; the transitional company_alerts_email joins recoverable_vars and
          where_values_live while the alerts subscription moves, and leaves with that plan's last PR.
- id: sns-successor-subscription
  file: terraform/personal/sns_alerts.tf
  before: 'output "alerts_topic_arn" {'
  after: |-
    # Transitional (PLAN-terraform-company-emails): the company successor beside the predecessor. CI may
    # subscribe but never unsubscribe (github_ci_apply_policy.tf), so the predecessor is forgotten, removed
    # by the operator and this subscription moved back to aws_sns_topic_subscription.alerts_email.
    variable "company_alerts_email" {
      description = "Company alerts role alias for the successor alerts subscription, from the tfvars parameter (never committed)."
      type        = string
    }

    resource "aws_sns_topic_subscription" "company_alerts_email" {
      topic_arn = aws_sns_topic.alerts.arn
      protocol  = "email"
      endpoint  = var.company_alerts_email
    }

    output "alerts_topic_arn" {
