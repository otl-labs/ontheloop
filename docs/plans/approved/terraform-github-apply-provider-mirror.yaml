schema_version: 1
slug: terraform-github-apply-provider-mirror
blocks:
- id: tf-mirror-arn
  file: terraform/bootstrap/github_settings_apply.tf
  before: |
    github_settings_state_arn = "arn:aws:s3:::agent-platform-data-lake/tfstate/github/terraform.tfstate"
  after: |
    github_settings_state_arn  = "arn:aws:s3:::agent-platform-data-lake/tfstate/github/terraform.tfstate"
    github_settings_mirror_arn = "arn:aws:s3:::agent-platform-data-lake/tf-provider-mirror/registry.terraform.io/integrations/github/*"
- id: tf-apply-mirror-read
  file: terraform/bootstrap/github_settings_apply.tf
  before: |
    Resource = ["${local.github_settings_state_arn}.tflock"]
          },
  after: |
    Resource = ["${local.github_settings_state_arn}.tflock"]
          },
          {
            Sid      = "ProviderMirrorGithubRead"
            Effect   = "Allow"
            Action   = ["s3:GetObject"]
            Resource = [local.github_settings_mirror_arn]
          },
- id: tf-preview-mirror-read
  file: terraform/bootstrap/github_settings_apply.tf
  before: |
    Sid      = "TfstateGithubRead"
            Effect   = "Allow"
            Action   = ["s3:GetObject"]
            Resource = [local.github_settings_state_arn]
          },
  after: |
    Sid      = "TfstateGithubRead"
            Effect   = "Allow"
            Action   = ["s3:GetObject"]
            Resource = [local.github_settings_state_arn]
          },
          {
            Sid      = "ProviderMirrorGithubRead"
            Effect   = "Allow"
            Action   = ["s3:GetObject"]
            Resource = [local.github_settings_mirror_arn]
          },
- id: decision-248-update
  file: docs/DECISIONS.md
  before: |
    description: "CloudTrail shows the apply App entry read by a principal outside clause 5's list: re-decide clause 5."
    ```
  after: |
    description: "CloudTrail shows the apply App entry read by a principal outside clause 5's list: re-decide clause 5."
    ```

    > **Update ({{DATE}}):** Clause 4 widens for provider installation (rec-5005; on 2026-11-08 github.com answered 504
    > for the integrations/github provider checksum and the preview could not init). Both roles may also read, and only
    > read, the integrations/github packages in the S3 provider mirror (s3:GetObject on
    > tf-provider-mirror/registry.terraform.io/integrations/github/*; no listing, no write). Each job copies the exact
    > package the committed lockfile names and installs it from there, checked against the lockfile's hashes, and falls
    > back to a direct fetch from github.com when the package is missing or unreadable. Clause 6 still governs how the
    > grant is provisioned.
- id: codeowners-mirror-script
  file: .github/CODEOWNERS
  before: |
    /scripts/ci/terraform_github_apply_gate.py @benjamin-blake
  after: |
    /scripts/ci/terraform_github_apply_gate.py @benjamin-blake
    /scripts/ci/terraform_github_apply_mirror.sh @benjamin-blake
