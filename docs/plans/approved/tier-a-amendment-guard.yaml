schema_version: 1
slug: tier-a-amendment-guard
blocks:
- id: grammar-log
  file: docs/contracts/marker-grammar.yaml
  before: |2
    amendment_log:
      - date: "2026-10-29"
  after: |2
    amendment_log:
      - date: "{{DATE}}"
        semantic_break: false
        change_class: field_add
        summary: >-
          PLAN-tier-a-amendment-guard (rec-3959, rec-3736): added the tier-a-amendment-approved token (check_state_diff,
          a RegistrySpec declared in scripts/checks/contracts/validate_tier_a_amendment_guard.py, plus that guard's
          carrying-Decision, approval-pointer and amendment_log rules) and state_diff_mechanics (5)-(8): the opt-in
          fresh_mention, boundary_match and transition_label RegistrySpec fields, and reason_required honoured by the
          shared helpers. No export is added to scripts/checks/_marker_guard.py.
      - date: "2026-10-29"
- id: grammar-token
  file: docs/contracts/marker-grammar.yaml
  before: |2
        # loosening is in Decision 235 cl.1's class by that clause's own wording.
        used_by: [validate_detector_registry_edits]
  after: |2
        # loosening is in Decision 235 cl.1's class by that clause's own wording.
        used_by: [validate_detector_registry_edits]
      tier-a-amendment-approved:
        direction: any
        reason_required: true
        # A Tier A key of docs/contracts/north-star.yaml (an entry id NS.n, mission, partial_order or semantics),
        # never a path, so a Decision authorizes one key, never the file. Every change is gated, not one direction:
        # an edited, added or retired key needs one marker on the key's own lines (from its dash or key line to the
        # line before the next sibling), and a removed entry has no lines, so removal has no marker escape (Decision
        # 187 cl.5). Direction any is outside Decision 235 cl.1's down-or-loosening class, so a Tier A change never
        # earns autonomy on that ladder; the guard is in cl.5's floor through used_by. Bound via check_state_diff with
        # fresh_mention and boundary_match set, a RegistrySpec declared in
        # scripts/checks/contracts/validate_tier_a_amendment_guard.py (adds no export to _marker_guard.py). The guard
        # adds three rules of its own: the cited Decision carries the key (for the mission or an NS.n, it is in that
        # entry's carried_by at head; for partial_order or semantics, it is the Decision the contract's ratified_via
        # names at the diff base, so the change is a dated note on it, Decision 177); the reason carries the human
        # approval as `approval: <ref> <YYYY-MM-DD>`; and an amendment_log row added in the same change names the key.
        # Authority: Decision 243 cl.6 and Decision 196 cl.3. Coverage (Decision 181 cl.2): that added Decision text
        # names the key, the carrying Decision, the approval pointer's presence and the log row are mechanical; that
        # the pointer is real and a human approved the text is procedural until a code-owner review binds
        # (CODEOWNERS, rec-2827) and T4.21's base-ref check refuses an executor-authored change.
        used_by: [validate_tier_a_amendment_guard]
- id: grammar-mechanics
  file: docs/contracts/marker-grammar.yaml
  before: |2
      branch (spec.gates_deletion(base_state) is True) never consults marker text at all; this is a
      structural absence, not a policy that could be relaxed by adding a lookup.
  after: |2
      branch (spec.gates_deletion(base_state) is True) never consults marker text at all; this is a
      structural absence, not a policy that could be relaxed by adding a lookup. (5) fresh mention -- a
      RegistrySpec with fresh_mention also reads docs/DECISIONS.md and docs/DECISIONS_ARCHIVE.md through
      its base_reader, and a head marker authorizes only when the cited Decision gained text in the change
      by addition alone (a Decision absent at the base, or lines inserted into its body with no base line
      deleted or rewritten) and that added text names the key. A mention the base already carried is
      spent, and an in-place rewrite of a ratified body never authorizes (Decision 177). The retroactive
      scan checks present markers against the head corpus only: freshness is a diff-time property, like
      (3). (6) boundary match -- with boundary_match, a candidate counts only where no letter, digit,
      underscore or hyphen adjoins it, so NS.1 is never named by NS.10 or by a range such as NS.1-NS.9, nor
      mission by permission. (7) transition_label names the gated transition in check_state_diff's
      messages (default weakening). (8) reason -- check_state_diff and check_present_markers treat a
      marker with an empty reason as no marker when spec.reason_required is set (rec-3736).
- id: north-star-header
  file: docs/contracts/north-star.yaml
  before: |
    # Decision 243 (Decision 86); this file never restates it. Every change to an entry needs explicit human
    # confirmation (Decision 196 clause 3).
  after: |
    # Decision 243 (Decision 86); this file never restates it. Every change to an entry needs explicit human
    # confirmation (Decision 196 clause 3). validate_tier_a_amendment_guard refuses a change to the mission, an NS.n,
    # partial_order or semantics (edited, added or retired) unless that key's own lines carry
    # `# tier-a-amendment-approved: dec-NNN <reason> approval: <ref> <YYYY-MM-DD>` citing a Decision that carries the
    # key (for the mission or an NS.n, one in its carried_by; for partial_order or semantics, the one ratified_via
    # names) and whose text added in the same change names it, with an amendment_log row added in the same change
    # naming it; a removed entry is refused outright (docs/contracts/marker-grammar.yaml).
- id: north-star-log
  file: docs/contracts/north-star.yaml
  before: |
    amendment_log:
