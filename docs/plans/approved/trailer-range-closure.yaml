- id: s01-closeout
  file: .claude/skills/implement/SKILL.md
  before: |-
    5. **Post-merge closeout fallback (Decision 201, conditional).** WAIT for the
       `trailer-closure` job (`mcp__github__actions_list` by merge sha -> `get_job_logs`, never
       `$GITHUB_STEP_SUMMARY`) to CONCLUDE, then follow the conditional fallback in
       `docs/contracts/git-ops.yaml::resolves_trailer`: an acceptance-verdict refusal takes that clause's
       route, a Decision 186 refusal stays open and is reported, a merge-leg refusal or a non-refusal
       per-rec log line permits the fallback, a trailer readback found missing goes to `merge_step
       recover` (never the fallback); anything else waits.
  after: |-
    5. **Post-merge closeout fallback (Decision 201, conditional).** WAIT for the
       `trailer-closure` job (`mcp__github__actions_list` by merge sha -> `get_job_logs`, never
       `$GITHUB_STEP_SUMMARY`) to CONCLUDE, then per
       `docs/contracts/git-ops.yaml#resolves_trailer`: an acceptance-verdict refusal takes that clause's
       route, a Decision 186 refusal stays open and is reported, a `TRAILER-RANGE` line waits for the
       covering run, a merge-leg refusal or any other per-rec log line permits the fallback, a missing
       trailer goes to `merge_step recover` (never the fallback); anything else waits.
- id: i01-closeout
  file: .claude/commands/implement.md
  before: A rec the log names as closed, not-found, or errored may use the direct fallback command;
  after: A rec the log names in a `TRAILER-RANGE` line waits for its covering run's trailer-closure job (same clause). A rec the log names as closed, not-found, or errored may use the direct fallback command;
