schema_version: 1
slug: trailer-range-closure
tldr: The trailer gate closes a merge's junit-checked recs in the run that tests a tree containing it (the covering run), keyed to that merge; a run that skipped the full tier leaves them open (DEFERRED, not a refusal); closeout waits for the covering run. Adds full-tier-range.yaml trailer_census, two in-place git-ops.yaml sentences, the implement closeout text and a Decision 254 cl.9 note. rec-4874 build plan 2b.
