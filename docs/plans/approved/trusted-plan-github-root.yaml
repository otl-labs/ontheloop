schema_version: 1
slug: trusted-plan-github-root
tldr: >-
  Records the last step of moving the terraform/github PR-time plan onto the trusted executor (rec-4638, PR 5). A
  dated Update on Decision 238 says the github plan runs under its own role, with what it may read, and that the shared
  trusted-plan role loses its github state read now and its github trust entry in rec-4640. Three contracts follow:
  the plan App key's home becomes the tf-trusted-plan environment secret (two rows in github-org-transfer, GH-09 in
  the credential inventory), the github PR-time plan prerequisite notes that a PR changing main.tf or the lockfile
  is refused, and the github row of environment-taxonomy names main's copy of the plan and says how such a change
  first meets the provider. Each contract gets one dated amendment_log row, and two old github-org-transfer log rows
  are reflowed to one line each, words unchanged, to keep that file under its 500-line cap.
blocks:
  - id: decision-238-update
    file: docs/DECISIONS.md
    before: |
      > **Update (2026-11-06):** Decision 248 clause 4 amends clause 2: tf-trusted-plan also admits terraform-github-apply.yml's preview job; the trusted-plan role's trust is unchanged.
    after: |
      > **Update (2026-11-06):** Decision 248 clause 4 amends clause 2: tf-trusted-plan also admits terraform-github-apply.yml's preview job; the trusted-plan role's trust is unchanged.

      > **Update ({{DATE}}, PLAN-trusted-plan-github-root, rec-4638):** the terraform/github speculative plan runs under its own role, agent-platform-github-ci-trusted-github-plan. It has cl.2's subject form (the tf-trusted-plan Environment and a job_workflow_ref naming terraform-github-plan.yml at refs/heads/main), carries the mandatory boundary, and holds only tfstate/github read and provider-mirror read and list (Decision 143 cl.1). agent-platform-github-ci-trusted-plan's terraform-github-plan.yml entry and its tfstate/github read leave it: the grant in rec-4638, the trust entry in rec-4640's admin split-apply. Coverage: test_terraform_github_plan_trusted, test_trusted_github_plan_identity and test_trusted_plan_identity.
  - id: taxonomy-github-row
    file: docs/contracts/environment-taxonomy.yaml
    before: |
      (terraform-github-plan.yml, rec-4335), so deploy-paths.yaml admin_out_of_band.pre_merge_live_plan does not
      apply to it
    after: |
      (terraform-github-plan.yml, rec-4335; main's copy on pull_request_target since rec-4638, Decision 238), so
      deploy-paths.yaml admin_out_of_band.pre_merge_live_plan does not apply to it. That job refuses a PR that changes
      main.tf or the lockfile; such a change first meets the provider after merge, in terraform-github-apply.yml's
      read-only preview, and nothing applies without the operator's approval of the apply job that follows it
      (Decision 248)
  - id: taxonomy-log
    file: docs/contracts/environment-taxonomy.yaml
    before: |
      amendment_log:
    after: |
      amendment_log:
        - {date: "{{DATE}}", semantic_break: false, change_class: governance_note_add, summary: "PLAN-trusted-plan-github-root (rec-4638, Decision 238): axis_a.github.apply_gating names main's PR-time plan copy on pull_request_target and where a main.tf or lockfile change first meets the provider. No gating changes."}
  - id: org-transfer-pr-plan-scope
    file: docs/contracts/github-org-transfer.yaml
    before: |
      rec-4335: a CI job runs a read-only terraform plan of terraform/github on every PR touching it,
    after: |
      rec-4335: a CI job runs a read-only terraform plan of terraform/github on every PR touching it
      (since rec-4638 a PR that changes main.tf or the lockfile is refused, not planned),
  - id: org-transfer-plan-app-locations
    file: docs/contracts/github-org-transfer.yaml
    before: |
      locations: [operator console, repository secrets (App private key)]
    after: |
      locations: [operator console, tf-trusted-plan environment secret (App private key)]
  - id: org-transfer-plan-app-held
    file: docs/contracts/github-org-transfer.yaml
    before: |
      held: existing repository secret,
    after: |
      held: tf-trusted-plan environment secret,
  - id: org-transfer-log
    file: docs/contracts/github-org-transfer.yaml
    before: |
      planned_evaluator: >-
    after: |2
        - {date: "{{DATE}}", semantic_break: false, change_class: correction, summary: "PLAN-trusted-plan-github-root (rec-4638): breakage_map.terraform_github_plan_app and its transfer_credentials row name the tf-trusted-plan environment secret; prerequisites.terraform-github-pr-time-plan notes the main.tf and lockfile refusal; the two 2026-10-20 rows are reflowed to one line each, words unchanged."}

      planned_evaluator: >-
  - id: org-transfer-log-compact
    file: docs/contracts/github-org-transfer.yaml
    before: |
      - date: "2026-10-20"
        semantic_break: false
        change_class: governance_note_add
        summary: >-
          PLAN-repo-identity-transfer-readiness (rec-3903): validate_github_org_transfer evaluates
          rec-3903's four static rows (retired-identity pins; the dependabot gate accepts the target
          from pre_staged on); owner_literal_defaults resolves the repository from GITHUB_REPOSITORY
          with one fallback constant in scripts/repo_identity.py.
      - date: "2026-10-20"
        semantic_break: false
        change_class: correction
        summary: >-
          PLAN-terraform-github-state-reconcile: prerequisites.terraform-github-state-reconciled is
          satisfied (rec-3136 closed; two evidence_ledger rows); breakage_map.terraform_github_root's
          post-transfer re-key now points at rec-4355.
    after: |
      - {date: "2026-10-20", semantic_break: false, change_class: governance_note_add, summary: "PLAN-repo-identity-transfer-readiness (rec-3903): validate_github_org_transfer evaluates rec-3903's four static rows (retired-identity pins; the dependabot gate accepts the target from pre_staged on); owner_literal_defaults resolves the repository from GITHUB_REPOSITORY with one fallback constant in scripts/repo_identity.py."}
      - {date: "2026-10-20", semantic_break: false, change_class: correction, summary: "PLAN-terraform-github-state-reconcile: prerequisites.terraform-github-state-reconciled is satisfied (rec-3136 closed; two evidence_ledger rows); breakage_map.terraform_github_root's post-transfer re-key now points at rec-4355."}
  - id: inventory-gh-09
    file: docs/contracts/account-credential-inventory.yaml
    before: |
      location: "repository secret TF_GITHUB_PLAN_APP_PRIVATE_KEY, variable TF_GITHUB_PLAN_APP_CLIENT_ID",
    after: |
      location: "tf-trusted-plan environment secret TF_GITHUB_PLAN_APP_PRIVATE_KEY, variable TF_GITHUB_PLAN_APP_CLIENT_ID",
  - id: inventory-log
    file: docs/contracts/account-credential-inventory.yaml
    before: |
      amendment_log:
    after: |
      amendment_log:
        - {date: "{{DATE}}", semantic_break: false, change_class: correction, summary: "PLAN-trusted-plan-github-root (rec-4638): GH-09's location names the tf-trusted-plan environment secret."}
