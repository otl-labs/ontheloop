schema_version: 1
slug: vp-replay-base-flag-pr-relative
tldr: "The post-merge VP replay will also skip, once main already holds the change, steps that compare against
  origin/main through git merge-base or a --base origin/main flag (such as approved_text verify), as it already skips
  git diff and git show origin/main steps. They still run at PR time. The vp-red-before contract text names the two new
  shapes, logs the change and goes to version 9."
blocks:
- id: partition-shapes
  file: docs/contracts/vp-red-before.yaml
  before: |
    hermetic pre-deploy step whose command is PR-relative (_is_pr_relative -- matches both
    `git diff origin/main -- <path>` and `git show origin/main:<path>`, the shape of
    PLAN-vp-red-before-gate.yaml step 16, the command behind rec-3845) is EXCLUDED from replay,
  after: |
    hermetic pre-deploy step whose command is PR-relative (_is_pr_relative -- matches four shapes:
    `git diff origin/main -- <path>` and `git show origin/main:<path>`, the shape of
    PLAN-vp-red-before-gate.yaml step 16, the command behind rec-3845; `git merge-base origin/main
    HEAD`, as a shell command or a Python argv list; and a `--base origin/main` or
    `--base=origin/main` flag on any program, the shape of `approved_text verify` behind rec-5364)
    is EXCLUDED from replay,
- id: contract-version
  file: docs/contracts/vp-red-before.yaml
  before: |
    contract_version: 8
  after: |
    contract_version: 9
- id: amendment-entry
  file: docs/contracts/vp-red-before.yaml
  before: |2
          alongside this entry, per this file's own convention.

    # The FOUR frozen outcome classes
  after: |2
          alongside this entry, per this file's own convention.
