schema_version: 1
slug: weakening-dispositions-per-diff
tldr: 'Words for the weakening-disposition gate (rec-5441). The gate now judges every PR that has weakened-test candidates,
  not only the PR that flips a plan to implemented. Each candidate needs a reason in a plan the PR touches, and a PR with
  candidates that touches no plan fails, except a tests-only repair with no plan. Reasons already on main are history and
  are not re-checked, so a late closure has nothing to judge. A plan-only PR may record reasons ahead of the build. The
  residual row that points at the gate now says the same.'
blocks:
- id: dispositions-row
  file: docs/contracts/implement-scope-boundary.yaml
  before: |2-
          - surface: "a weakening candidate on an implement PR with no recorded disposition, one recorded as weakening, or one whose cite resolves to nothing"
            status: mechanical
            enforced_by: validate_weakening_dispositions
            note: >-
              On a diff that flips a plan's implementation_declared to true, every item validate_weakening_candidates
              lists must match exactly one entry in the resolved plans' weakening_dispositions (keyed "[category]
              path::node"), carrying one review_dispositions key other than weakening and a cite that resolves under that
              key's rule above (its referent must resolve -- for retirement, deleted by this diff; whether it justifies the
              label is review's judgement -- Decision 165's existence-versus-authorization distinction); no entry may name a candidate the diff no longer has. Exceptionless, with no marker or waiver. It proves that every candidate
              received a recorded disposition whose cite resolves -- not that the disposition is right, nor whether code
              review or the implementing agent wrote it. Diffs that flip no plan are not gated; the report still lists
              their candidates. That includes Decision 226's fast-lane repair PRs (red-main-recovery.yaml procedure.fast_lane_repair), which change only tests/** with no plan and record their dispositions in the PR body; making that structural is rec-4442.
  after: |2-
          - surface: "a weakening candidate on any PR with no recorded disposition, one recorded as weakening, or one whose cite resolves to nothing"
            status: mechanical
            enforced_by: validate_weakening_dispositions
            note: >-
              On every diff, each item validate_weakening_candidates lists must match exactly one entry in the
              weakening_dispositions of the plans the diff touches (keyed "[category] path::node"), carrying one
              review_dispositions key other than weakening and a cite that resolves under that key's rule above (its
              referent must resolve -- for retirement, deleted by this diff; whether it justifies the label is review's
              judgement -- Decision 165's existence-versus-authorization distinction). A diff with candidates that touches
              no plan fails, so a build records its dispositions in its own plan in the same PR, and a revert PR in the
              reverted build's plan. An entry the diff adds or changes must name a candidate the diff has, unless the diff
              changes only docs/plans/** (a plan PR may record planned dispositions); entries already on the base are
              history and are never re-checked as stale, so a late closure (git-ops.yaml resolves_trailer LATE CLOSURE) has
              nothing to judge, though a base entry may still satisfy a later candidate with the same key (rec-5463).
              Exceptionless, with no marker or waiver. It proves that every candidate received a recorded
              disposition whose cite resolves -- not that the disposition is right, nor whether code review or the
              implementing agent wrote it. The one diff not gated is a tests-only diff that touches no plan: Decision 226's
              fast-lane repair PRs (red-main-recovery.yaml procedure.fast_lane_repair) record their dispositions in the PR
              body, the report still lists their candidates, and making that structural is rec-4442.
