  file: .claude/skills/planning/SKILL.md
  before: |
    **Amendment mode** (a plan-defect report, implement-scope-boundary.yaml `deviation_trigger.escalation`): fix the plan in a plan-text-only PR (`plan({slug}): scope amendment -- <reason>`), re-run this step and a fresh critique, merge as any plan PR merges, and report the merge SHA to the coordinator. An approved_text or contract defect, or any loosened assertion, goes to the human first; nothing is loosened to obtain green (Decisions 181, 235).
  after: |
    **Amendment mode** (a plan-defect report, implement-scope-boundary.yaml `deviation_trigger.escalation`): fix the plan in a plan-text-only PR (`plan({slug}): scope amendment -- <reason>`), re-run this step and a fresh critique, merge as any plan PR merges, and report the merge SHA to the coordinator. A gated-text defect or any loosened assertion goes to the human first; nothing is loosened to obtain green (Decisions 181, 235).
- id: test-scope-escalation
  file: tests/test_scope_boundary_contract.py
  before: |2
            assert (
                "an approved_text or contract fix, or any loosened assertion, still needs the human's own approval" in escalation
            )
  after: |2
            assert (
                "a fix to gated text (docs/contracts/approval-routing.yaml) or any loosened assertion "
                "still needs the human's own approval" in escalation
            )
