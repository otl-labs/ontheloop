- id: routing-contract
  file: docs/contracts/approval-routing.yaml
  before: ''
  after: |
    # Which wording needs the operator's per-change approval (Decision {{N}}). Rationale lives in that Decision; the
    # approval mechanism (sidecars, approval runs) in docs/contracts/git-ops.yaml approved_text_binding.
    contract:
      id: approval-routing
      class: D
      contract_version: 1
      status: ratified
      ratified_via: "Decision {{N}} / PLAN-wording-approval-routing"
      description: >-
        The gated set: text whose every change needs an operator-approved sidecar (Decision 246). Everything else is
        notice class.
      subject: approval-routing
      evaluator:
        check: validate_approval_routing

    amendment_log:
      - {date: "{{DATE}}", semantic_break: false, change_class: field_add, summary: "PLAN-wording-approval-routing (Decision {{N}}): created; lane on sampled."}

    lane:
      id: wording_approval
      rungs: [read_all, sampled]
      rung: sampled
      sampled_since: "{{DATE}}"
      kind_floor: {{N}}
      semantics: >-
        read_all: every change to Decision text or governing contract text needs a run (the rule before Decision {{N}}).
        sampled: only the gated set needs a run. Transitions are rows in this file's amendment_log and demotions; they
        move onto Decision 221 cl.7's one controller when CD.46 ratifies. kind_floor is Decision {{N}}'s number. The check
        and the digest read this file at the diff base; the marker guard reads kind_floor from the working tree, where any
        change to this file is gated.

    gated:
      files:
        - docs/contracts/north-star.yaml
        - docs/contracts/approval-routing.yaml
        - docs/contracts/decision-kind.yaml
        - docs/contracts/protected-actions.yaml
        - docs/contracts/project-alignment.yaml
        - docs/DECISIONS.md
        - docs/DECISIONS_ARCHIVE.md
        - AGENTS.md
        - README.md
        - LICENSE
        - LICENSE-APACHE
        - CONTRIBUTING.md
        - SECURITY.md
        - .github/CODEOWNERS
        - "**/CLAUDE.md"
      yaml_keys:
        docs/contracts/coordinator.yaml: [lifecycle, routing, standing_authorisation, always_ask, approvals, halts]
        docs/contracts/decision-entry.yaml: [significance]
        docs/contracts/marker-grammar.yaml: [tokens, authorization_mechanics]
        docs/contracts/git-ops.yaml: [approved_text_binding]
        docs/contracts/deploy-paths.yaml: [admin_out_of_band, reconcile]
        docs/contracts/environment-taxonomy.yaml: [axis_a, guard_classification]
        docs/contracts/implement-scope-boundary.yaml: [invariants, deviation_trigger]
        config/agent/executor/capabilities.yaml: [boundary_patterns]
      md_sections:
        .claude/skills/planning/SKILL.md: ["## Plan Lint and Wording Check (Workflow Step 8b, before critique)", "## Alignment Sign-off (Workflow Step 6, project alignment)"]
        .claude/skills/plan-critique/SKILL.md: ["12p."]
        .claude/commands/plan.md: ["## Step 6: Project Alignment"]
      selectors: >-
        files: any change. yaml_keys: a change to the parsed value of a listed top-level key. md_sections: a change between
        a listed heading and the next heading of the same or higher level, or, for an entry ending in ".", in the list
        item it starts. A gated change in a file binds the whole file: every change to it rides the sidecar
        (approved_text_binding).
      exempt: Appending a row to demotions or an entry to boundary_patterns; both only tighten.

    decision_entries:
      direction: Approved whole.
      mechanism: >-
        The approval pins the Intent line; the rest is context. Mechanism only if it is the plan's only drafted entry, the
        plan's latest kind-blind gate row reads mechanism (a fresh subagent given the draft without its kind field:
        bin/venv-python -m scripts.roadmap.plan_obligations --blind-drafts <plan>), the entry amends no direction or
        kind-less entry, and no north star's carried_by lists it. Otherwise direction; a label only escalates.
      markers: An entry numbered above lane.kind_floor authorizes a marker only if it is direction (Decision {{N}} cl.5).

    notice:
      surfaces: [docs/, .claude/, config/, .github/prompts/, .github/agents/]
      meaning: >-
        A change outside the gated set to a file under surfaces. Written under the plan the operator confirmed; no run.
        The presentation lists the notice-class files a plan changes. Code, tests and workflows are neither gated nor
        notice: their review rules are unchanged until a revert demotes one (demotions).
      digest: >-
        On sampled, .github/workflows/notice-digest.yml posts one comment per merged commit with notice-class changes to
        the open issue labelled notice-digest: the PR, the declared plan's intent, each file and class, the tripwire
        result, and a sample flag. Never a tracked file (Decision 127); interim until T4.33 (Decision 232).
      reading: >-
        The operator reads every row for seven days from sampled_since, then the rows flagged sample (the commit sha read
        as a hex number divisible by five). Reading is procedural.

    demotions:
      rule: >-
        A file listed here, or a file outside the gated set, code included, that a main commit since sampled_since
        reverted (its subject starts with "revert", or its body says "This reverts commit"), is gated whole. Anyone may
        append a row; removing one, or listing a reverted file in restorations, is a gated change.
      rows: []
      restorations: []
