  after: |
    Run `bin/venv-python -m scripts.roadmap.plan_obligations --plan <plan>` on the plan: fold each gating finding (a derived companion) into scope and act on each advisory one -- a NEAR_CAP row gets a relief step, an unbuilt plan editing the same file is named in `context:`, an undecidable bundled-rec acceptance is fixed or dropped. A mechanism Decision draft needs a `kind-blind` row from a fresh subagent shown only `plan_obligations --blind-drafts`. Gated wording (approval-routing.yaml) goes in the approved-text sidecar (its `tldr` is the presentation's Summary); place it in an uncommitted scratch worktree of origin/main and run `bin/venv-python -m scripts.roadmap.plan_wording_check --slug <slug> --tree <worktree>`: it checks the tree holds only the sidecar's edits and runs `validate --pre`. Revise until PASS; record each run as a `gate: wording-check` row with its digest, base and selection. Push it, dispatch the approval run (Decision 246), paste TLDR, wording and run link; "write the plan" never waits on it. Ask the operator to approve it after plan-critique returns PROCEED, then re-run the plan PR's pr-validate (its wake matches its own commit). If critique changes approved words, cancel the run and dispatch one on the final sidecar. Each live-infrastructure assumption (grants, cadence, concurrency, memory, provider values) carries a read-only probe in `context:` or UNPROVEN. The handoff names this session as the plan's owner.
