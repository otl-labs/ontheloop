artifact: data-pipeline.zip
functions:
  - agent-platform-scheduled-agent-dispatcher
  - agent-platform-findings-processor
handlers:
  - src/data/handlers/scheduled_agent_handler.py
  - src/data/handlers/findings_processor_handler.py
includes:
  - src/
  - scripts/__init__.py
  - scripts/aws_profile.py
  - scripts/llm/__init__.py
  - scripts/llm/github_models_client.py
  - scripts/llm/client.py
  - scripts/llm/utils.py
  - scripts/run_scheduled_agent.py
  - scripts/s3_log_store.py
  - scripts/tool_runtime.py
excludes:
  # T2.17 DuckLake runtime code lives ONLY in the ducklake-deps/-extensions layers + the two
  # ducklake_* zips. The wildcard `includes: - src/` above would otherwise drag it into
  # data-pipeline.zip (and mark this artifact affected by DuckLake changes). Keep it out.
  - src/common/ducklake_runtime.py
  - src/common/ducklake_writes.py
  - src/common/ducklake_write_rules.py  # rec-4158 plan B: DuckLake-bundle only
  - src/common/ducklake_tables.py
  - src/common/ducklake_reads.py
  - src/common/ducklake_metrics.py
  - src/common/ducklake_handler_errors.py  # serving-function bundles only
  - src/common/ducklake_scd2_schema.py
  - src/common/ducklake_named_reads.py
  - src/common/ducklake_event_reads.py  # reader-bundle only (rec-4291)
  - src/common/ducklake_event_read_sql.py  # reader-bundle only (rec-4291)
  - src/common/ducklake_event_read_verbs.py  # reader-bundle only (rec-4291)
  - src/common/ducklake_event_content.py  # reader-bundle only (rec-4291)
  - src/common/ducklake_content_read_verbs.py  # content-reader bundle only (Decision 239)
  - src/common/ducklake_read_deadline.py  # reader-bundle only (rec-4474)
  - src/common/ducklake_dq_checks.py  # reader-bundle only (query-ops-retirement)
  - src/common/ducklake_write_verbs.py
  - src/common/ducklake_partition_spec.py
  - src/common/ducklake_partition_layout.py  # Decision 204: maintenance-bundle only
  - src/common/ducklake_partition_rewrite.py  # Decision 204: maintenance-bundle only
  - src/common/ducklake_control_tables.py
  - src/common/ducklake_connect_probe.py
  - src/common/ducklake_maintenance.py
  - src/common/ducklake_catalog_index_status.py  # DuckLake-bundle only
  - src/common/ducklake_maintenance_ops.py
  - src/common/ducklake_maintenance_scope.py
  - src/common/ducklake_gc_verification.py
  - src/common/ducklake_gc_ops.py
  - src/common/ducklake_control_health.py
  - src/common/ducklake_telemetry_txn.py  # telemetry-writer bundle only
  - src/common/ducklake_telemetry_registration.py  # telemetry-writer bundle only
  - src/common/ducklake_telemetry_provision.py  # telemetry-writer bundle only
  - src/common/ducklake_telemetry_append.py  # telemetry-writer bundle only
  - src/common/ducklake_telemetry_blobstore.py  # telemetry writer and reader bundles only
  - src/common/ducklake_telemetry_blobs.py  # telemetry-writer bundle only
  - src/common/ducklake_telemetry_handshake.py  # telemetry-writer bundle only
  - src/common/catalog_dr.py
  - src/lambdas/ducklake_writer
  - src/lambdas/ducklake_reader
  - src/lambdas/ducklake_maintenance
  - src/lambdas/ducklake_maintenance_smoke
  - src/lambdas/ducklake_telemetry_writer
  - src/lambdas/ducklake_telemetry_reader
  - src/lambdas/ducklake_telemetry_content_reader  # stub package until rec-4696 (Decision 239)
  - src/lambdas/ducklake_catalog_dr
  # PLAN-telemetry-kernel-identity-append: the plane-neutral telemetry kernel (Decision 184 cl.2)
  # stays out of this artifact (V2 ground, Decision 79 note) -- it has no writer/reader Lambda yet.
  - src/telemetry
  - src/telemetry_client
  - src/row_rules  # rec-4158 plan B: shared row-rule engine is DuckLake-bundle only
  # PLAN-telemetry-turn-capture-core: the plane-neutral transcript producer core (slice 3a) is inert here too.
  - src/turn_capture
  # PLAN-sensitive-value-detectors: the stdlib detector leaf package is inert here (rec-4481 plan 1).
  - src/sensitive_values
assets:
  - .github/agents/schedule.yaml
  - .github/prompts/scheduled/
  - docs/ROADMAP-PLATFORM.yaml
  - config/config.yaml
config:
  - config/lambda/data-pipeline/
pip_packages:
  - pyyaml>=6.0
runtime_config: []
status: active
notes: >-
  findings-processor slated for Phase-5 retirement (Decision 61).
  runtime_config SSM/AppConfig fetch mechanism declared for forward-compatibility; actual fetch deferred to follow-on plan.
  T2.43 (rec-2164): both functions are now PROVISIONED in terraform/personal/prod_lambdas.tf (the
  decoupled_build_pipeline class, decoupled from day one) and governed-deployed via
  .github/workflows/deploy-prod-lambdas.yml; the schedule stays disabled (Decision 61/37/116).
  pip_packages carries only pyyaml (the sole third-party import scheduled_agent_handler /
  findings_processor_handler / their direct script deps actually need) bundled directly into
  this zip; no dependency layer is attached to these two functions.
