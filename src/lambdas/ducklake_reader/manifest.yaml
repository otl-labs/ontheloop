notes: >-
  T2.17 DuckLake read-scoped runtime Lambda (CD.33 / Decision 81). Read-only: S3 GetObject + the
  Neon catalog credential; no write path. duckdb (pinned via config/lambda/ducklake/version.yaml) +
  psycopg2-binary + python-ulid live in the ducklake-deps layer; the ducklake/httpfs/postgres
  extensions live in the ducklake-extensions layer. Function URL is AWS_IAM, smoke-test ingress ONLY
  (Single-Portal deferral to T2.19, Decision 78/81). The shared reader holds no telemetry state after slice 2c: no
  event-read module, telemetry slot or read deadline; production telemetry is read through
  agent-platform-ducklake-telemetry-reader (Decision 236).
