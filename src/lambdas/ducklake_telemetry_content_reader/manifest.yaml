notes: >-
  Decision 239: the production transcript content reader. Serves two masked verbs (one row, one session tree)
  over the telemetry reader's SELECT-only login attached READ_ONLY, masks every served byte with the read_masked profile
  inside the function and writes one value-free access-log line per read. A stub (Decision 79): no build, deploy or smoke
  until rec-4696 builds the infrastructure and the operator-gated deploy, then flips this to active. Env-pinned to the
  production telemetry catalog (TELEMETRY_META_SCHEMA, TELEMETRY_DATA_PATH, TELEMETRY_DSN_SECRET_ID,
  TELEMETRY_BLOB_ROOT).
