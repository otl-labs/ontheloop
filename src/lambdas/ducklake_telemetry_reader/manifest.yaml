status: active
notes: >-
  Slice 2c (Decision 236 cl.2-3): the production telemetry reader. Serves the event verbs minus transcript_content
  over a SELECT-only login attached READ_ONLY; no caller SQL, no ops verb, no content module, no blob access. Env-pinned
  to the production telemetry catalog (TELEMETRY_META_SCHEMA, TELEMETRY_DATA_PATH, TELEMETRY_DSN_SECRET_ID);
  DUCKLAKE_DATA_PATH and DUCKLAKE_META_SCHEMA are deliberately unset. Function URL is AWS_IAM and invoked URL-only.
  duckdb, psycopg2-binary and python-ulid live in the shared ducklake-deps layer and the extensions in the shared
  ducklake-extensions layer.
