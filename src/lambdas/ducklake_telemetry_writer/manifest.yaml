notes: >-
  T2.36 slice 2a-2 option D part 1 (Decision 143 cl.3, Decision 213): telemetry write verbs get their own function so
  telemetry identities never reach ops verbs or the shared catalog login. Dispatch table is {describe, attach_check} plus the four verbs;
  plan 3 part 1 adds the verbs provision_telemetry, register_tenant, register_project and telemetry_probe (telemetry_actions.py)
  and bundles the src/telemetry kernel their provisioning reads specs through. Plan 4 adds begin_blobs and the claim-check
  route (src/telemetry/blobs.py, ducklake_telemetry_blobstore.py, ducklake_telemetry_blobs.py and
  ducklake_telemetry_handshake.py; src/telemetry_client is the producer's and is never bundled). Plan 3 part 2 adds append_telemetry
  (telemetry_edge.py: caps and the verb body; telemetry_log.py: the C6 line with its EMF block; the request grammar in
  src/telemetry/request.py and the adapter in src/common/ducklake_telemetry_append.py). Env-pinned to the production
  telemetry catalog ducklake_telemetry on the ducklake_telemetry_writer_prod login since slice 2c's flip (Decision 230;
  TELEMETRY_META_SCHEMA, TELEMETRY_DATA_PATH, TELEMETRY_BLOB_ROOT, TELEMETRY_DSN_SECRET_ID); DUCKLAKE_DATA_PATH and
  DUCKLAKE_META_SCHEMA are deliberately unset and never read from the event. Function URL is AWS_IAM and invoked
  URL-only; github_ci_branch is the CI invoker (rec-4207's identity record). duckdb, psycopg2-binary and python-ulid live in the
  shared ducklake-deps layer and the extensions in the shared ducklake-extensions layer (no pgclient layer).
  The smoke twin agent-platform-ducklake-telemetry-writer-smoke deploys this same zip with its own role, the smoke
  catalog pin and the smoke scoped login (Decision 236 cl.1); it is deployed first and carries the disposable proofs.
