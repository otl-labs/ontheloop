name: w
on:
    workflow_run:
      workflows: [Sched, Gated]
    workflow_dispatch:
jobs:
  j:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.head_branch == 'main') }}
    steps:
      - name: Persona dispatch gate (Decision 205 cl.1)
        id: persona_gate
        if: github.event_name == 'workflow_dispatch'
        run: python3 scripts/ci/persona_dispatch_gate.py
      - name: Review
        id: review
        if: "github.event_name == 'workflow_dispatch' && steps.persona_gate.outputs.refused != 'true'"
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: echo review
