name: w
on:
    push:
    workflow_dispatch:
jobs:
  j:
    runs-on: ubuntu-latest
    steps:
      - name: Persona dispatch gate (Decision 205 cl.1)
        id: persona_gate
        if: github.event_name == 'workflow_dispatch' && success()
        run: python3 scripts/ci/persona_dispatch_gate.py
      - name: Review
        id: review
        if: "success() && steps.persona_gate.outputs.refused != 'true'"
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: echo review
