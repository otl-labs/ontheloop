name: w
on:
    workflow_dispatch:
jobs:
  j:
    runs-on: ubuntu-latest
    steps:
      - name: Persona dispatch gate (Decision 205 cl.1)
        id: persona_gate
        run: python3 scripts/ci/persona_dispatch_gate.py
      - name: Review
        id: review
        if: "steps.persona_gate.outputs.refused != 'true' || always()"
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: echo review
