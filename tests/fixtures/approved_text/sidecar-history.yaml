e/skills/overseer/SKILL.md\n  before: |\n    description: >-\n      Deep methodology for the orchestration meta-layer that composes /plan and /implement subagents\n      to drive an entire roadmap item or audit to completion largely unattended -- read-nothing\n      router discipline, the Design-B gate-request trampoline, division of labor, liveness/watchdog\n      resilience, autonomy calibration, and the Fable advice-consult protocol. Use when running the\n      /overseer workflow. Detail: docs/contracts/overseer-dispatch.yaml.\n  after: |\n    description: >-\n      Being retired (Decision {{N}}); do not run. It starts no planning or implementation agent of its\n      own: the coordinator dispatches each (Decision 229 cl.2). The text below is historical.\n- id: overseer-skill-banner\n  file: .claude/skills/overseer/SKILL.md\n  before: |\n    # Overseer Methodology & Rules\n  after: |\n    # Overseer Methodology & Rules\n\n    **Being retired (Decision {{N}}); do not run.** The dispatch recipes below are historical.\n- id: cmd-overseer-description\n  file: .claude/commands/overseer.md\n  before: |\n    description: >-\n      Orchestration meta-layer that composes /plan and /implement subagents to drive an entire\n      roadmap item or audit to completion largely unattended, narrowing the human to intake,\n      decomposition, and completion gates. Not a fifth workflow tier -- composes the existing four-tier\n      workflow (Decision 90).\n  after: |\n    description: >-\n      Being retired (Decision {{N}}); do not run. The coordinator dispatches each planning and\n      implementation agent (Decision 229 cl.2); the text below is historical.\n- id: cmd-overseer-banner\n  file: .claude/commands/overseer.md\n  before: |\n    # Overseer Workflow\n  after: |\n    # Overseer Workflow\n\n    **Being retired (Decision {{N}}); do not run.** Everything below is historical.\n- id: dq-ops-execution-plans-description\n  file: config/agent/data_quality/ops.yaml\n  before: |\n    DuckLake migration landed T2.26 (c9); the executor producer stays CD.17-frozen (Decision 67) so the table lands empty until resume.\"\n  after: |\n    DuckLake migration landed T2.26 (c9); the legacy executor producer is retired (Decision {{N}}), so the table lands empty until the Decision 185 loop (T4.2) writes it.\"\n- id: dq-ops-execution-plans-row-count\n  file: config/agent/data_quality/ops.yaml\n  before: |\n    severity: warn  # empty-on-fresh-provision is expected until the frozen producer resumes\n  after: |\n    severity: warn  # empty-on-fresh-provision is expected until the Decision 185 loop (T4.2) writes it\n- id: dq-ops-execution-plans-recency\n  file: config/agent/data_quality/ops.yaml\n  before: |\n    enforced: false  # CD.17-frozen producer: staleness is expected, not a signal\n  after: |\n    enforced: false  # no producer until T4.2 (legacy executor retired): staleness is expected, not a signal\n- id: executor-prompts-readme\n  file: config/agent/executor/prompts/README.md\n  before: |\n    The executor CLI is frozen pending Decision 67 reversal; auto-loading these as system context is the\n    intended/historical mechanism, not a currently-live one.\n  after: |\n    The executor CLI is retired (Decision {{N}}); auto-loading these as system context was the\n    historical mechanism, not a live one.\n- id: gitops-branch-prefix-reversal\n  file: docs/contracts/git-ops.yaml\n  before: |\n    `agent/` is also the frozen executor's namespace (scripts/executor/branch_lifecycle.py creates\n        `agent/{rec_id}`). On executor unfreeze a prefix can no longer separate the two populations;\n  after: |\n    `agent/` was also the retired legacy executor's namespace (scripts/executor/branch_lifecycle.py\n        creates `agent/{rec_id}`; Decision {{N}}). If the Decision 185 loop (T4.2) opens `agent/` branches,\n        a prefix can no longer separate the two populations;\n- id: gitops-branch-prefix-trigger\n  file: docs/contracts/git-ops.yaml\n  before: |\n    Review trigger: the FIRST of (a) executor unfreeze, (b)\n  after: |\n    Review trigger: the FIRST of (a) the Decision 185 loop opening `agent/` branches, (b)\n- id: source-registry-scoping\n  file: config/agent/data_quality/source_registry.yaml\n  before: |\n    description: \"Scoping agent or /implement workflow that decomposes a STRATEGIC plan into atomic executor recommendations\"\n  after: |\n    description: \"Scoping agent or /implement workflow that decomposed a STRATEGIC plan into atomic executor recommendations (retired with the STRATEGIC plan type, Decision {{N}}; historical recs only)\"\n- id: critique-template-scope-heading\n  file: .claude/skills/plan-critique/SKILL.md\n  before: |\n    **Work Area / Scope Evaluation:**\n  after: |\n    **Scope Evaluation:**\n- id: registry-currency-67-repin\n  file: config/agent/verification_registry/entries/decisions-index-currency-derivation.yaml\n  before: |\n    exp={44:'superseded_compacted',58:'superseded_compacted',37:'superseded_compacted',80:'superseded_pointer',43:'amended',67:'amended',168:'current'};\n  after: |\n    exp={44:'superseded_compacted',58:'superseded_compacted',37:'superseded_compacted',80:'superseded_pointer',43:'amended',67:'superseded_compacted',168:'current'};\n- id: implement-pre-push-rebase-heading\n  file: .claude/skills/implement/SKILL.md\n  before: |\n    ### Pre-Push Rebase (applies to both flows)\n  after: |\n    ### Pre-Push Rebase\n- id: test-antidrift-commit-flow-slice\n  file: tests/test_workflow_skill_antidrift.py\n  before: |2\n        commit_flow = skill[skill.index(\"### IMPLEMENTATION Commit Flow\") : skill.index(\"### STRATEGIC Commit Flow\")]\n  after: |2\n        commit_flow = skill[skill.index(\"### IMPLEMENTATION Commit Flow\") :]\n- id: test-decisions-index-67-compacted\n  file: tests/test_decisions_index.py\n  before: |2\n                67: \"amended\",\n  after: |2\n                67: \"superseded_compacted\",\n"
retire-strategic@44d7d83d: "schema_version: 1\nslug: retire-strategic-plans-and-legacy-executor\nblocks:\n- id: decision-new\n  file: docs/DECISIONS.md\n  before: |\n    ## Decision 243: North stars are a Tier A file --\n  after: |\n    ## Decision {{N}}: The legacy Python executor is retired and the STRATEGIC plan type is shelved, both for good -- an item too large for one plan is decomposed by its planner into child work items, which ride the parent's approval only through a deterministic check (supersedes Decision 67; amends Decisions 73, 90, 182, 203 and 229) (Decided)\n\n    ```yaml\n    number: {{N}}\n    status: Decided\n    decided_date: \"{{DATE}}\"\n    supersedes: [67]\n    amends: [73, 90, 182, 203, 229]\n    significance:\n      value: numbered_decision\n      justification: >-\n        Durable, reversal-relevant: it ends a freeze that instruction surfaces, CD.17 and the plan schema still read as\n        temporary, and fixes how oversized work splits for every later planner. Not a contract note: the plan schema can\n        enforce a type list but cannot retire a Decision or dispose of a candidate decision. Not amendment_forms: a\n        note cannot retire a Decision, and Decision 67 already carries two clause-level amendments.\n    ```\n\n    **Status:** Decided\n    **Date:** {{DATE}}\n    **Warehouse ID:** dec-{{N}} (per Decision 84 backfill)\n\n    **Problem:** Decision 67 froze the single-process Python executor (scripts/execute_recommendation.py, scripts/executor/)\n    and the STRATEGIC plan type it consumed, pending a reversal (CD.17) keyed to T4.2. That executor was a proof of\n    concept; its successor is the Decision 185 loop with the Decision 205 and 229 personas, so the freeze can never\n    reverse. Yet AGENTS.md, three skills and the plan schema still treat it as temporary, and no rule says how an item too\n    large for one plan splits once STRATEGIC plans are gone.\n\n    **Intent:** Work too large for one plan splits into smaller work items that each get their own plan, never into a plan\n    of plans, and a split carries the parent's approval only as far as a mechanical check can prove it.\n\n    **Decision:**\n    1. **Executor retired.** The legacy Python executor and the `/develop-executor` tier are retired, never to be\n       unfrozen; \"executor\" in Decisions 185, 205 and 229 names their successor. T5.6 deletes or re-homes the code and no\n       longer waits on T4.2. The self-modification boundary (Decision 117's capabilities.yaml) is not retired: it binds the\n       successor and is re-homed, never deleted. The /overseer stops being an interim coordinator (Decision 229 cl.1; its\n       files go separately): the coordinator alone starts a planning or implementation agent (Decision 229 cl.2).\n    2. **STRATEGIC shelved.** Plan types are IMPLEMENTATION and REPORT-ONLY; the plan schema refuses STRATEGIC and any\n       non-empty `work_areas`. A tier item's `strategic: true` marks decomposition need only.\n    3. **Decomposition by child items.** A planner that finds its item too large for one plan ends its run `decomposed`\n       and starts nothing: the item becomes kind epic and the planner files child work items `part_of` it, ordered by\n       `depends_on` -- the work-item edge model's decomposition form, whose lifecycle the children's edges follow. The\n       engine (today the coordinator) schedules the children. Until the work-item store (T4.23) and plan_agent (T4.31)\n       exist, a planning session files child recs or atomic IMPLEMENTATION plans instead, each planned and signed off by\n       the human as today.\n    4. **Inherited approval.** A child rides its parent's approval only when a deterministic check passes all five tests\n       against the approved parent plan: (a) its paths lie inside the parent's declared scope; (b) its budget fits the\n       parent's remainder and adds no cloud resource or spend class; (c) it cites no Decision the parent did not and edits\n       no contract, Decision or public-surface text; (d) every criterion refines a parent criterion; (e) it adds no named\n       verb, table, port or contract term. Taste and cost never inherit. The check returns a verdict and never approves\n       (Decision 233 cl.4); a pass is consumed by a standing direction the human sets on the parent. It runs as a Decision\n       235 cl.2 ladder lane (T4.4): every child goes to triage first, each rung promotion is operator-approved on measured\n       evidence, and a reverted child that rode the check demotes the lane automatically.\n    5. **Promotion, not a depth cap.** One planner lineage decomposes at most once under inherited approval. A child that\n       would decompose again, or a split wider than the fan-out ceiling the human sets (Decision 185 cl.3), goes to triage\n       (today the human), which may make the epic a stream (Decision 241 cl.5): work-in-progress, budget, path ownership and a `serves`\n       edge to a north star. Deep decomposition is allowed; silent deep decomposition is not.\n    6. **Disposals.** Decision 67 is superseded whole (Decision 79 already carries its Lambda-deploy clause). CD.17 is\n       superseded with no successor trigger. Decisions 73, 90, 182, 203 and 229 carry dated notes saying what each\n       re-keys to; anything else keyed to either's reversal re-keys to T4.2's completion.\n\n    **Coverage (Decision 181 cl.2):** cl.2 -- the plan schema and tests/decisions/test_decision_67_supersession.py, which\n    also sweeps the live instruction surfaces for a revived freeze or STRATEGIC rule; cl.1 -- T5.6; cl.3 and cl.5 -- T4.31,\n    interim practice unenforced by design (every child is human-planned); cl.4 -- T4.4.\n\n    ```yaml reversal-conditions\n    decision: {{N}}\n    review_by: 2027-06-30\n    on_trigger: \"re-decide via /plan\"\n    conditions:\n      - id: children-miss-parent\n        kind: manual\n        description: \"Twice, every child of a decomposed item completes while the parent's criteria stay unmet: re-decide clause 3.\"\n      - id: inherited-child-reverted\n        kind: manual\n        description: \"A child that rode the check is reverted for taste or cost after its lane's first promotion: re-decide clause 4's tests.\"\n      - id: plan-of-plans-needed\n        kind: manual\n        description: \"A real item needs one reviewed artefact spanning several plans that child items and edges cannot carry: re-decide clause 2.\"\n    ```\n\n    **Related:** Decisions 55, 67, 73, 79, 90, 117, 182, 185, 197, 203, 205, 229, 233, 235, 241; CD.17; T4.4, T4.23, T4.31, T5.6;\n    rec-4478, rec-4479.\n\n    ---\n\n    ## Decision 243: North stars are a Tier A file --\n- id: decision-67-stub\n  file: docs/DECISIONS.md\n  before: |2\n\n    **Status:** Amended by Decision 79 (2026-06-03). Two clauses; each has its own status.\n\n    **[LAMBDA-DEPLOY CLAUSE -- LIFTED by Decision 79 / CD.16 + CD.24]**\n    The blanket `DEFERRED: build_lambda.py --deploy` pattern is withdrawn. Plans are now gated per\n    Lambda artifact (see Decision 79 + CD.16). Step 12b of plan-critique updated accordingly.\n    The blanket DEFERRED marker is no longer acceptable in lieu of active per-Lambda deploy steps.\n\n    **[STRATEGIC-PLAN CLAUSE -- RETAINED, pending CD.17 / T4.2]**\n    **Status:** Active -- remove when reversal condition is met\n    **Reversal condition:** Legacy telemetry tables (`telemetry_sessions`, `telemetry_process_events`,\n    `telemetry_model_calls`, `telemetry_phases`, `telemetry_steps`) confirmed operational end-to-end\n    with passing data quality checks AND executor re-enabled per CD.17 / T4.2.\n\n    [RESTATED by Decision 95 (2026-06-23): the draft tables telemetry_process_events / telemetry_model_calls /\n    telemetry_phases / telemetry_steps collapse into the unified telemetry_observations table; the reversal\n    condition now tracks the canonical four-table model -- telemetry_sessions, telemetry_observations,\n    telemetry_transcripts (and telemetry_agents) operational with passing DQ checks AND executor re-enabled per\n    CD.17 / T4.2. The executor-re-enabled clause and the CD.17 / T4.2 gate are unchanged. See Decision 95.]\n\n    **Effect on planning (STRATEGIC clause only):**\n    - STRATEGIC plans are blocked. All plans must be IMPLEMENTATION type.\n\n    **Effect on plan-critique (STRATEGIC clause only):** Step 12d blocks STRATEGIC plans while\n    this clause is active.\n\n    **Rationale (original, preserved):** The executor telemetry pipeline (telemetry_sessions etc.)\n    is not yet confirmed operational. Running executor-mediated recs risks silent telemetry loss.\n    Lambda dispatcher is separately disabled pending telemetry confirmation and scheduled-agent\n    migration completion. The Lambda-deploy half reverses per Decision 79; the STRATEGIC half\n    reverses when telemetry is confirmed and executor re-enabled (CD.17 / T4.2).\n  after: |2\n\n    **Status:** Superseded\n    **Date:** 2026-05-08\n\n    **Decision:** Superseded by Decision {{N}}, which retires the legacy Python executor and shelves the STRATEGIC plan type for good and supersedes CD.17; Decision 79 had already lifted the Lambda-deploy clause (per-Lambda gating, CD.16). Kept live rather than archived because roadmap annotations, code comments and contracts still cite \"Decision 67\" by name (Decision 146's still-cited-live carve-out; compacted under docs/contracts/decision-entry.yaml's `compaction:` section).\n\n    **Superseded by: Decision {{N}}**\n- id: decision-73-note\n  file: docs/DECISIONS.md\n  before: |\n    > **Amended by Decision 217 (2026-10-14):** Above executor concurrency 1, clause 4's plan-time block on an open ci-rca rec becomes an affected-set overlap block, and a red whose file set cannot be determined still blocks (Decision 217 clause 1); until then clause 4 stands unchanged. Textual conflicts route per Decision 217 clause 2.\n\n    > **Amended by Decision 226 (2026-10-18):** Clause 3's fixed priority=\"critical\" becomes track-derived (High for a tests-only repair on a CI-tier workflow), and a manual revert PR is a permitted Track B corrective outside terraform/** and governed deploy paths (automated revert stays excluded). Clause 3's L6 pause and clause 4's plan-time block become the red_overlap overlap block; clause 4 as written now applies only to a red past its repair SLO. Clause 5's rec -> plan -> implement recovery stands for Track B, with Track A on the fast lane (Decision 226 cl.1-4). This supersedes the Decision 217 line above for clause 4.\n  after: |\n    > **Amended by Decision 217 (2026-10-14):** Above executor concurrency 1, clause 4's plan-time block on an open ci-rca rec becomes an affected-set overlap block, and a red whose file set cannot be determined still blocks (Decision 217 clause 1); until then clause 4 stands unchanged. Textual conflicts route per Decision 217 clause 2.\n\n    > **Amended by Decision 226 (2026-10-18):** Clause 3's fixed priority=\"critical\" becomes track-derived (High for a tests-only repair on a CI-tier workflow), and a manual revert PR is a permitted Track B corrective outside terraform/** and governed deploy paths (automated revert stays excluded). Clause 3's L6 pause and clause 4's plan-time block become the red_overlap overlap block; clause 4 as written now applies only to a red past its repair SLO. Clause 5's rec -> plan -> implement recovery stands for Track B, with Track A on the fast lane (Decision 226 cl.1-4). This supersedes the Decision 217 line above for clause 4.\n\n    > **Amended by Decision {{N}} ({{DATE}}):** Clause 4's suspension of mandatory discussion when `non_automatable_recommendations > 0` is permanent: Decision 67 never reverses and the executor it waited on is retired. Counts stay informational.\n- id: decision-90-note\n  file: docs/DECISIONS.md\n  before: |\n    **Related:** Decision 42 (superseded here), Decision 67 (executor + STRATEGIC freeze; the current operational constraint), Decision 76 (.claude/ as the canonical interactive layer).\n\n    > **Update (2026-10-19):** Decision 229 cl.1 reads the freeze above, as an interim reading pending rec-4478, as binding STRATEGIC plans and the autonomous queue consumer: before any loop host, an interactive session or the /overseer may dispatch one human-gated persona step on an operator-chosen work item (a rec today) -- plan_agent drafting its plan, every later step on that approved IMPLEMENTATION plan -- never from the rec queue.\n  after: |\n    **Related:** Decision 42 (superseded here), Decision 67 (executor + STRATEGIC freeze; the current operational constraint), Decision 76 (.claude/ as the canonical interactive layer).\n\n    > **Update (2026-10-19):** Decision 229 cl.1 reads the freeze above, as an interim reading pending rec-4478, as binding STRATEGIC plans and the autonomous queue consumer: before any loop host, an interactive session or the /overseer may dispatch one human-gated persona step on an operator-chosen work item (a rec today) -- plan_agent drafting its plan, every later step on that approved IMPLEMENTATION plan -- never from the rec queue.\n\n    > **Amended by Decision {{N}} ({{DATE}}):** The fourth tier is the Decision 185 loop with its personas. `/develop-executor` and the legacy Python executor are retired, STRATEGIC plans are shelved, and `/implement` executes IMPLEMENTATION plans only; the operational state above is no longer a freeze.\n- id: decision-182-note\n  file: docs/DECISIONS.md\n  before: |\n    **Related:** 153 (amended), 73 (cited, narrowed, not amended), 135, 128, 165, 167, 177, 181, 84.\n\n    > **Update (2026-09-26):** Reversal condition (b) fires: PLAN-vp-replay-deadline-from-shared-budget re-derives validate_vp_replay's replay term to MAX_AGGREGATE_SECONDS (120) alone -- a replayed step's deadline is now the remaining share of that aggregate, never a flat per-step cap, so the 30s term this point's 150s figure used to add on top is retired. Re-derived, not reversed: NON_TEST_BUDGET_SECONDS stays 240 against the calibrated 71.766s static worst (120 + 71.766 = 191.766 < 240, headroom rises from 18.2s to 48.2s); CEILING_SECONDS - NON_TEST_BUDGET_SECONDS is unchanged at 1260. The check's own worst-case green maximum TIGHTENS from 150s to 120s. Reversal condition (a)'s measured-series re-check remains open, owned by rec-4093.\n  after: |\n    **Related:** 153 (amended), 73 (cited, narrowed, not amended), 135, 128, 165, 167, 177, 181, 84.\n\n    > **Update (2026-09-26):** Reversal condition (b) fires: PLAN-vp-replay-deadline-from-shared-budget re-derives validate_vp_replay's replay term to MAX_AGGREGATE_SECONDS (120) alone -- a replayed step's deadline is now the remaining share of that aggregate, never a flat per-step cap, so the 30s term this point's 150s figure used to add on top is retired. Re-derived, not reversed: NON_TEST_BUDGET_SECONDS stays 240 against the calibrated 71.766s static worst (120 + 71.766 = 191.766 < 240, headroom rises from 18.2s to 48.2s); CEILING_SECONDS - NON_TEST_BUDGET_SECONDS is unchanged at 1260. The check's own worst-case green maximum TIGHTENS from 150s to 120s. Reversal condition (a)'s measured-series re-check remains open, owned by rec-4093.\n\n    > **Amended by Decision {{N}} ({{DATE}}):** Decision 67 never lifts. The planning skill's file-count heuristic now flags decomposition need, not a STRATEGIC plan; replacing it with this measured breadth number is owed when plan_agent decides splits (T4.31).\n- id: decision-203-note\n  file: docs/DECISIONS.md\n  before: |2\n\n    **Related:** 25, 67, 72, 73, 76, 83, 115, 132, 135, 138, 150, 162, 163, 167, 168, 177, 181, 184,\n    187, 189. Roadmap refs: rec-4083, rec-4085, rec-4086, rec-4087, T2.54.\n  after: |2\n\n    **Related:** 25, 67, 72, 73, 76, 83, 115, 132, 135, 138, 150, 162, 163, 167, 168, 177, 181, 184,\n    187, 189. Roadmap refs: rec-4083, rec-4085, rec-4086, rec-4087, T2.54.\n\n    > **Amended by Decision {{N}} ({{DATE}}):** Reversal condition (e) reads as the Decision 185 loop going live (T4.2): the legacy executor never returns.\n- id: decision-229-note\n  file: docs/DECISIONS.md\n  before: |\n    > the repo's in-session verdict gates (decision-scout, plan-critique, code-review) or a read-only\n    > advice consult as subagents, which gate until their persona flips (cl.4). After a flip, a session\n    > runs that gate only as cl.4's outage fallback, so the end state is no nested personas.\n  after: |\n    > the repo's in-session verdict gates (decision-scout, plan-critique, code-review) or a read-only\n    > advice consult as subagents, which gate until their persona flips (cl.4). After a flip, a session\n    > runs that gate only as cl.4's outage fallback, so the end state is no nested personas.\n\n    > **Amended by Decision {{N}} ({{DATE}}):** Clause 1's interim reading is final: the legacy executor and STRATEGIC plans are retired for good, and the /overseer is no longer an interim coordinator: the coordinator alone starts a planning or implementation agent. Clause 4's CD.17 hold is discharged: CD.17 is superseded with no successor trigger.\n- id: agents-constraint\n  file: AGENTS.md\n  before: |\n    ## Temporary Operational Constraints\n    - **STRATEGIC plans suspended (Decision 67):** during this window all plans must be\n      IMPLEMENTATION type -- STRATEGIC plan-type declarations are refused (enforced by /plan,\n      the planning skill, and plan-critique). The planning skill's complexity heuristic (>5 files\n      or >8 steps) is also suspended -- author the work as a single larger IMPLEMENTATION plan OR\n      split it into multiple atomic IMPLEMENTATION plans yourself. Restores when CD.17 / T4.2\n      reverses.\n    - **Lambda deployment\n  after: |\n    ## Temporary Operational Constraints\n    - **Lambda deployment\n- id: agents-workflow\n  file: AGENTS.md\n  before: |\n    Decision 90 four-tier workflow: `/orient` (read-only; writes nothing; picks the item) -> `/plan` (writes\n    `docs/plans/PLAN-{slug}.yaml`) -> `/implement` -> `/develop-executor` (frozen, Decision 67). `/audit` composes\n    `docs/audit-prompts/AUDIT-{slug}.md` and audits nothing. `/overseer` composes `/plan` and `/implement` subagents to\n    drive a roadmap item or audit; it is not a fifth tier, never bypasses the workflow or the Decision 67 freeze, is\n    human-gated and IMPLEMENTATION-only, and does not consume the recommendation queue. Each skill's description has\n    the rest.\n  after: |\n    Decision 90 workflow: `/orient` (read-only; writes nothing; picks the item) -> `/plan` (writes\n    `docs/plans/PLAN-{slug}.yaml`) -> `/implement`; the fourth tier is the Decision 185 loop, and the legacy\n    `/develop-executor` is retired (Decision {{N}}). Plans are IMPLEMENTATION or REPORT-ONLY: work too large for one plan\n    splits into child recs or atomic IMPLEMENTATION plans, each planned on its own (Decision {{N}}). `/audit` composes\n    `docs/audit-prompts/AUDIT-{slug}.md` and audits nothing. `/overseer` is being retired: it is not a fifth tier, never\n    bypasses the workflow, and starts no planning or implementation agent of its own -- the coordinator dispatches each,\n    one human-gated persona step on an operator-chosen rec, never the recommendation queue, hub and spoke (Decision 229\n    cl.1-2). Each skill's description has the rest.\n- id: readme-executor-row\n  file: README.md\n  before: |\n    hosted on Step Functions; executor freeze active pending CD.17 / T4.2 reversal |\n  after: |\n    hosted on Step Functions; the legacy Python executor is retired (Decision {{N}}) |\n- id: project-context-executor\n  file: docs/PROJECT_CONTEXT.md\n  before: |\n    The older local executor is frozen pending Decision 67 reversal; `config/agent/executor/capabilities.yaml` keeps\n  after: |\n    The older local executor is retired (Decision {{N}}); `config/agent/executor/capabilities.yaml` keeps\n- id: planning-non-automatable\n  file: .claude/skills/planning/SKILL.md\n  before: |\n    Individual review is suspended per Decision 73 until CD.17 / T4.2 reverses (Decision 67's Lambda-deploy clause was lifted by Decision 79; the STRATEGIC clause survives).\n  after: |\n    Individual review stays suspended for good (Decision 73 cl.4 as amended by Decision {{N}}).\n- id: planning-complexity\n  file: .claude/skills/planning/SKILL.md\n  before: |\n    - **Scope files > 5** OR **estimated steps > 8** suggests **STRATEGIC** (a heuristic). **Freeze override (active, AGENTS.md Temporary Operational Constraints):** STRATEGIC is suspended -- author one larger IMPLEMENTATION plan or split it into atomic IMPLEMENTATION plans now.\n    - If STRATEGIC (only valid when freeze is lifted), Work Areas must have precise lists, clear order, and concrete names.\n    - If IMPLEMENTATION (and complex), execution steps must have explicit pre/post-conditions.\n  after: |\n    - **Scope files > 5** OR **estimated steps > 8** suggests the item may be too large for one plan (a heuristic). Plan types are IMPLEMENTATION and REPORT-ONLY only (Decision {{N}}; the schema refuses STRATEGIC): author one larger IMPLEMENTATION plan, or decompose -- file child recs or split into atomic IMPLEMENTATION plans now, each planned on its own.\n    - If IMPLEMENTATION (and complex), execution steps must have explicit pre/post-conditions.\n- id: planning-template-type\n  file: .claude/skills/planning/SKILL.md\n  before: |\n    plan_type: IMPLEMENTATION # IMPLEMENTATION | STRATEGIC | REPORT-ONLY\n  after: |\n    plan_type: IMPLEMENTATION # IMPLEMENTATION | REPORT-ONLY\n- id: planning-template-work-areas\n  file: .claude/skills/planning/SKILL.md\n  before: |\n    work_areas: [] # STRATEGIC plans only (required there, forbidden otherwise);\n      # entry shape: {area, scope, rationale, complexity: XS|S|M|L|XL}\n  after: |\n    work_areas: [] # always empty (STRATEGIC retired, Decision {{N}}); omit on new plans\n- id: planning-step10\n  file: .claude/skills/planning/SKILL.md\n  before: |\n    **Applies only when Plan Type is REPORT-ONLY.** For IMPLEMENTATION and STRATEGIC plans, Step 10 is a no-op; skip to Step 11.\n  after: |\n    **Applies only when Plan Type is REPORT-ONLY.** For IMPLEMENTATION plans, Step 10 is a no-op; skip to Step 11.\n- id: planning-confirmation\n  file: .claude/skills/planning/SKILL.md\n  before: |\n    - **IMPLEMENTATION / STRATEGIC:** use this block (STRATEGIC scopes into recs; IMPLEMENTATION executes directly):\n  after: |\n    - **IMPLEMENTATION:** use this block:\n- id: critique-step5\n  file: .claude/skills/plan-critique/SKILL.md\n  before: |\n    to verify the plan's accuracy. For STRATEGIC plans, this is not required -- work areas are high-level and do not require file-level verification.\n  after: |\n    to verify the plan's accuracy.\n- id: critique-step8\n  file: .claude/skills/plan-critique/SKILL.md\n  before: |\n    8. **Evaluate Work Area scoping (STRATEGIC plans) or Scope breadth (IMPLEMENTATION plans):**\n       - For STRATEGIC: Are Work Areas well-bounded (one logical concern per area)? Too large (suggest split)? Too small (merge with adjacent area)?\n       - For IMPLEMENTATION: Are all scope entries necessary? Too large (suggest split)? Does the Scope extend beyond the stated phase?\n  after: |\n    8. **Evaluate Scope breadth (IMPLEMENTATION plans; a split means child recs or atomic plans, Decision {{N}}):**\n       - For IMPLEMENTATION: Are all scope entries necessary? Too large (suggest split)? Does the Scope extend beyond the stated phase?\n- id: critique-12d\n  file: .claude/skills/plan-critique/SKILL.md\n  before: |\n    12d. **STRATEGIC plan gate:** If the plan's `## Plan Type` is `STRATEGIC` AND the executor freeze is still active per AGENTS.md Temporary Operational Constraints (pending CD.17 reversal), recommend REVISE with: \"STRATEGIC plans are suspended while the executor freeze holds (CD.17): the autonomous executor has no consumer for STRATEGIC-decomposed recommendations. Convert to an IMPLEMENTATION plan, or split into multiple atomic IMPLEMENTATION plans, or wait for CD.17 reversal.\"\n  after: |\n    12d. **Retired (Decision {{N}}):** the plan schema refuses `plan_type: STRATEGIC` and non-empty `work_areas`; an oversized plan is a step 8 split finding.\n- id: critique-template-type\n  file: .claude/skills/plan-critique/SKILL.md\n  before: |\n    **Plan Type:** STRATEGIC / IMPLEMENTATION / REPORT-ONLY\n  after: |\n    **Plan Type:** IMPLEMENTATION / REPORT-ONLY\n- id: implement-description\n  file: .claude/skills/implement/SKILL.md\n  before: |\n    including live verification protocols, strategic scoping gates, code review integration, and commit flows.\n  after: |\n    including live verification protocols, code review integration, and commit flows.\n- id: implement-alarm\n  file: .claude/skills/implement/SKILL.md\n  before: |\n    - **Interactive-era alarm (now):** while the executor is frozen (Decision 67) the alarm is\n  after: |\n    - **Interactive-era alarm (now):** until the Decision 185 loop is live (T4.2) the alarm is\n- id: implement-forward-note\n  file: .claude/skills/implement/SKILL.md\n  before: |\n    when the executor goes live (CD.17 reversal) this alarm flips\n  after: |\n    when the Decision 185 loop goes live (T4.2) this alarm flips\n- id: implement-decomposition-hint\n  file: .claude/skills/implement/SKILL.md\n  before: |\n    A STRATEGIC parent tier_item that was split into atomic IMPLEMENTATION plans under the freeze\n    override (AGENTS.md Temporary Operational Constraints / CD.17; the T2.19 pattern) carries a\n  after: |\n    A parent tier_item that was split into atomic IMPLEMENTATION plans (the T2.19 pattern) carries a\n- id: implement-not-a-license\n  file: .claude/skills/implement/SKILL.md\n  before: |\n    `false` (inherit `false`). This is not a license to author STRATEGIC children: the freeze stays\n    in force and atomic children remain IMPLEMENTATION plans.\n  after: |\n    `false` (inherit `false`). Children are always IMPLEMENTATION plans (Decision {{N}}).\n- id: implement-strategic-scoping\n  file: .claude/skills/implement/SKILL.md\n  before: |\n    ## Strategic Scoping Rules (Workflow Step 3 -- STRATEGIC Plans only)\n\n    ### JIT Context Injection\n    When breaking a STRATEGIC plan into atomic recommendations, review `docs/PROJECT_CONTEXT.md`. Copy any relevant \"Known Gotchas\" or constraints directly into the recommendation's `context` field. Autonomous executors no longer read `copilot-instructions.md` by default, so they rely entirely on the JIT context you provide.\n\n    ### Quality Gate Validation\n    Before filing each recommendation using `bin/venv-python -m scripts.ops_data_portal`, apply this gate. FAIL if any check fails:\n    1. **Acceptance Command:** Must be a single inline command in backticks. FAIL if: contains `python -c`, contains `--pre` flag, has trailing prose, or uses line numbers. Must be behavioural.\n    2. **Target File:** Verify `\"file\"` field exists relative to repo root.\n    3. **Effort Threshold:** If `L` or `XL`, REQUIRE human confirmation before filing.\n    4. **Context Quality:** FAIL if context is vague or < 50 characters.\n\n    ### Dedup Gate\n    Before filing, search for open recs targeting the same file with at least 3 keyword matches. If duplicates found:\n    - Surface: \"Found potential duplicate(s). Options: (1) supersede existing, (2) file both, (3) skip this one?\" Wait for human.\n\n    ## Commit Flows (Workflow Step 7 -- MANDATORY)\n  after: |\n    ## Commit Flows (Workflow Step 7 -- MANDATORY)\n- id: implement-strategic-commit-flow\n  file: .claude/skills/implement/SKILL.md\n  before: |\n    recover` (never the fallback); anything else waits.\n\n    ### STRATEGIC Commit Flow\n    STRATEGIC plans are suspended (Decision 67). When restored, use the same MCP PR/subscribe/merge pattern, committing `docs/plans/briefings/` with a `scope({slug}): ...` message.\n  after: |\n    recover` (never the fallback); anything else waits.\n- id: orient-strategic-pending\n  file: .claude/skills/orient/SKILL.md\n  before: |\n    4. **Strategic pending**: list separately at the bottom, noted \"blocked by executor freeze (CD.17 reversal required)\".\n  after: |\n    4. **Strategic pending**: list separately at the bottom, noted \"decompose into child items first (Decision {{N}})\".\n- id: overseer-guardrail\n  file: .claude/skills/overseer/SKILL.md\n  before: |\n    - **Decision 67:** human-gated CC-web orchestration -- NOT `scripts/execute_recommendation.py`.\n      Never consumes the rec queue; IMPLEMENTATION only.\n  after: |\n    - **Decisions {{N}} and 229:** being retired; starts no planning or implementation agent of its own --\n      the coordinator dispatches each, one human-gated persona step on an operator-chosen rec, never the\n      rec queue, hub and spoke.\n- id: overseer-decision-90\n  file: .claude/skills/overseer/SKILL.md\n  before: |\n    - **Decision 90:** composes `/plan`/`/implement` as-is -- no new tier, plan type, or bypass.\n  after: ''\n- id: cmd-overseer-guardrails\n  file: .claude/commands/overseer.md\n  before: |\n    the Decision 67/55/73/90 guardrails), invoke\n  after: |\n    the Decision {{N}}/229/55/73 guardrails), invoke\n- id: cmd-plan-step4\n  file: .claude/commands/plan.md\n  before: |\n    5. Conduct a Complexity Assessment to determine if this is STRATEGIC or IMPLEMENTATION.\n  after: |\n    5. Conduct a Complexity Assessment to decide whether the item fits one plan or decomposes into child recs or atomic plans (Decision {{N}}).\n- id: cmd-plan-step10\n  file: .claude/commands/plan.md\n  before: |\n    **If Plan Type is IMPLEMENTATION or STRATEGIC, SKIP this step entirely and proceed to Step 11.**\n  after: |\n    **If Plan Type is IMPLEMENTATION, SKIP this step entirely and proceed to Step 11.**\n- id: cmd-implement-description\n  file: .claude/commands/implement.md\n  before: |\n    description: Implements IMPLEMENTATION plans directly or scopes STRATEGIC plans into atomic recommendations for the executor. Run after /plan.\n  after: |\n    description: Implements IMPLEMENTATION plans directly. Run after /plan.\n- id: cmd-implement-intent\n  file: .claude/commands/implement.md\n  before: |\n    **Intent**: For IMPLEMENTATION plans: execute the Ordered Execution Steps directly. For STRATEGIC plans: research Work Areas and produce atomic, automatable recommendations for the executor.\n  after: |\n    **Intent**: Execute an IMPLEMENTATION plan's Ordered Execution Steps directly.\n- id: cmd-implement-step2\n  file: .claude/commands/implement.md\n  before: |\n    Extract Intent, Plan Type, Verification Tier, Work Areas (STRATEGIC) or Execution Steps (IMPLEMENTATION), Verification Plan, and Constraints.\n  after: |\n    Extract Intent, Plan Type, Verification Tier, Execution Steps, Verification Plan, and Constraints.\n- id: cmd-implement-step3-strategic\n  file: .claude/commands/implement.md\n  before: |\n    4. Proceed to Step 4.\n\n    ### For STRATEGIC Plans\n    1. Research each Work Area by reading files/modules.\n    2. Identify dependencies.\n    3. Break into atomic recs (effort `<= M`).\n    4. Write full context (executor should not need to read the plan).\n    5. Define acceptance command and verification steps.\n    6. Apply the **Quality Gate Validation**, **Dedup Gate**, and **JIT Context Injection** from your `implement` skill.\n    7. File approved recs using `bin/venv-python -m scripts.ops_data_portal --file-rec ...`. For recs `> M` effort, create `docs/plans/briefings/BRIEFING-rec-NNN.md`.\n    8. Skip Steps 4-5 and proceed directly to Step 6.\n  after: |\n    4. Proceed to Step 4.\n- id: cmd-implement-report\n  file: .claude/commands/implement.md\n  before: |\n    - **STRATEGIC**: Total recs filed, breakdowns, briefing files created, and next step instructions.\n    - **IMPLEMENTATION**:\n  after: |\n    - **IMPLEMENTATION**:\n- id: cmd-implement-commit-flow\n  file: .claude/commands/implement.md\n  before: |\n    Apply the appropriate **Commit Flow** (STRATEGIC or IMPLEMENTATION) defined in your `implement` skill.\n  after: |\n    Apply the appropriate **Commit Flow** (the IMPLEMENTATION Commit Flow) defined in your `implement` skill.\n- id: cmd-develop-executor-delete\n  file: .claude/commands/develop-executor.md\n  before: |\n    ---\n    description: Supervisor workflow for developing the autonomous executor. Runs Root Cause Analysis on unrecoverable executor failures and files a permanent fix as a recommendation, per Decision 55. Does not repair the failure inline.\n    ---\n\n    # Workflow: Develop Executor (RCA)\n\n    **Purpose**: Execute Root Cause Analysis (RCA) on unrecoverable executor failures, as mandated by Decision 55.\n    **Trigger**: Slash command `/develop-executor`\n\n    ## 1. Context Gathering\n    - Ask the user to specify the failure context if not provided (e.g., a specific `rec-NNN` or transcript path).\n    - Read the most recent failure transcript in `logs/transcripts/` or the latest exception in `logs/.telemetry-process-events.jsonl` matching the context.\n\n    ## 2. Execute RCA Skill\n    - Run the Executor RCA skill in a fresh context to ensure unbiased diagnosis. This is intentionally a headless invocation via `run_skill.py` (not the in-session Skill tool), so the diagnosis is uncontaminated by this session's reasoning. Context is supplied explicitly via `--context` (frontmatter-based auto-loading is retired; every caller now names its own context files):\n      ```bash\n      bin/venv-python -m scripts.agent_development.run_skill --skill executor-rca --target <path_to_failure_transcript> --context docs/PROJECT_CONTEXT.md --model auto\n      ```\n    - Wait for the skill to output its root cause analysis and the generated recommendation JSON.\n\n    ## 3. File the Recommendation\n    The RCA skill emits a recommendation JSON. File it via the ops portal (NOT a direct write to the JSONL — Single Portal Invariant). Translate each JSON field into the corresponding `--file-rec` argument:\n\n    ```bash\n    bin/venv-python -m scripts.ops_data_portal --file-rec \\\n        --title \"<rca.title>\" \\\n        --file \"<rca.file>\" \\\n        --context \"<rca.context>\" \\\n        --acceptance \"<rca.acceptance>\" \\\n        --effort <XS|S|M|L|XL> \\\n        --priority <Critical|High|Medium|Low> \\\n        --source executor-rca \\\n        --risk <low|medium|high> \\\n        --verification \"<rca.verification>\" \\\n        --verification-tier <V1|V2|V3>\n    ```\n\n    - The ducklake_writer allocates the next `rec-NNN` ID atomically with the insert (`file_ops`, Decision 84 I-2).\n    - RCA recommendations derive `automatable=false` automatically -- executor files match the boundary patterns in `config/agent/executor/capabilities.yaml` (Decision 44). The `--automatable` CLI flag has been removed; the portal formula handles it.\n    - If AWS credentials are missing, the write FAILS LOUDLY (Decision 84 I-4 -- no outbox). Restore the chain (`aws sts get-caller-identity --profile agent_platform`) and re-file.\n\n    ## 4. Stop Cleanly\n    - **CRITICAL INVARIANT:** Do not attempt to repair the failure. Do not apply workarounds.\n    - Terminate the workflow, leaving the fix to be prioritised and implemented via the standard `/plan` -> `/implement` loop.\n  after: ''\n- id: gitops-scope-prefix\n  file: docs/contracts/git-ops.yaml\n  before: |\n    use_for: STRATEGIC plan scoping (currently suspended, Decision 67)\n  after: |\n    use_for: Retired with the STRATEGIC plan type (Decision {{N}}); historical commits only, never a new one\n- id: gitops-amendment\n  file: docs/contracts/git-ops.yaml\n  before: |\n    amendment_log:\n  after: |\n    amendment_log:\n      - {date: \"{{DATE}}\", semantic_break: false, change_class: prose_improvement, summary: \"PLAN-retire-strategic-plans-and-legacy-executor (rec-4478, Decision {{N}}): the scope({slug}) commit prefix row is marked retired with the STRATEGIC plan type (the row stays so historical commits still parse); development_surface names the legacy executor retired; agent_branch_prefixes_reversal re-keys its executor-unfreeze trigger to the Decision 185 loop opening agent/ branches. contract_version unchanged.\"}\n- id: tier-lifecycle-not-a-license\n  file: docs/contracts/tier-item-lifecycle.yaml\n  before: |2\n      This is not a license to author STRATEGIC children: the freeze stays in force and atomic\n      children remain IMPLEMENTATION plans.\n  after: |2\n      Children are always IMPLEMENTATION plans: the STRATEGIC plan type is retired (Decision {{N}}).\n- id: tier-lifecycle-amendment\n  file: docs/contracts/tier-item-lifecycle.yaml\n  before: |\n    amendment_log:\n      - date: \"2026-09-12\"\n  after: |\n    amendment_log:\n      - date: \"{{DATE}}\"\n        semantic_break: false\n        change_class: prose_improvement\n        summary: >-\n          PLAN-retire-strategic-plans-and-legacy-executor (rec-4478, Decision {{N}}): decomposition_hint_inheritance's\n          closing sentence says children are always IMPLEMENTATION plans because the STRATEGIC type is retired, not\n          frozen. No rule changed.\n      - date: \"2026-09-12\"\n- id: instr-arch-executor\n  file: docs/contracts/instruction-architecture.yaml\n  before: |\n    contexts; frozen pending Decision 67 reversal\n  after: |\n    contexts; the legacy Python executor is retired (Decision {{N}}), and the Decision 185 loop's personas succeed it\n- id: instr-arch-amendment\n  file: docs/contracts/instruction-architecture.yaml\n  before: |\n    amendment_log:\n      - date: \"2026-11-02\"\n  after: |\n    amendment_log:\n      - date: \"{{DATE}}\"\n        semantic_break: false\n        change_class: prose_improvement\n        summary: >-\n          PLAN-retire-strategic-plans-and-legacy-executor (rec-4478, Decision {{N}}): the executor consumer's note says the\n          legacy executor is retired rather than frozen. No layer