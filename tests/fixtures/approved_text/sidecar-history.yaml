  file: .claude/skills/planning/SKILL.md\n  before: |\n    Individual review is suspended per Decision 73 until CD.17 / T4.2 reverses (Decision 67's Lambda-deploy clause was lifted by Decision 79; the STRATEGIC clause survives).\n  after: |\n    Individual review stays suspended for good (Decision 73 cl.4 as amended by Decision {{N}}).\n- id: planning-complexity\n  file: .claude/skills/planning/SKILL.md\n  before: |\n    - **Scope files > 5** OR **estimated steps > 8** suggests **STRATEGIC** (a heuristic). **Freeze override (active, AGENTS.md Temporary Operational Constraints):** STRATEGIC is suspended -- author one larger IMPLEMENTATION plan or split it into atomic IMPLEMENTATION plans now.\n    - If STRATEGIC (only valid when freeze is lifted), Work Areas must have precise lists, clear order, and concrete names.\n    - If IMPLEMENTATION (and complex), execution steps must have explicit pre/post-conditions.\n  after: |\n    - **Scope files > 5** OR **estimated steps > 8** suggests the item may be too large for one plan (a heuristic). Plan types are IMPLEMENTATION and REPORT-ONLY only (Decision {{N}}; the schema refuses STRATEGIC): author one larger IMPLEMENTATION plan, or decompose -- file child recs or split into atomic IMPLEMENTATION plans now, each planned on its own.\n    - If IMPLEMENTATION (and complex), execution steps must have explicit pre/post-conditions.\n- id: planning-template-type\n  file: .claude/skills/planning/SKILL.md\n  before: |\n    plan_type: IMPLEMENTATION # IMPLEMENTATION | STRATEGIC | REPORT-ONLY\n  after: |\n    plan_type: IMPLEMENTATION # IMPLEMENTATION | REPORT-ONLY\n- id: planning-template-work-areas\n  file: .claude/skills/planning/SKILL.md\n  before: |\n    work_areas: [] # STRATEGIC plans only (required there, forbidden otherwise);\n      # entry shape: {area, scope, rationale, complexity: XS|S|M|L|XL}\n  after: |\n    work_areas: [] # always empty (STRATEGIC retired, Decision {{N}}); omit on new plans\n- id: planning-step10\n  file: