s executor has no consumer for STRATEGIC-decomposed recommendations. Convert to an IMPLEMENTATION plan, or split into multiple atomic IMPLEMENTATION plans, or wait for CD.17 reversal.\"\n  after: |\n    12d. **Retired (Decision {{N}}):** the plan schema refuses `plan_type: STRATEGIC` and non-empty `work_areas`; an oversized plan is a step 8 split finding.\n- id: critique-template-type\n  file: .claude/skills/plan-critique/SKILL.md\n  before: |\n    **Plan Type:** STRATEGIC / IMPLEMENTATION / REPORT-ONLY\n  after: |\n    **Plan Type:** IMPLEMENTATION / REPORT-ONLY\n- id: implement-description\n  file: .claude/skills/implement/SKILL.md\n  before: |\n    including live verification protocols, strategic scoping gates, code review integration, and commit flows.\n  after: |\n    including live verification protocols, code review integration, and commit flows.\n- id: implement-alarm\n  file: .claude/skills/implement/SKILL.md\n  before: |\n    - **Interactive-era alarm (now):** while the executor is frozen (Decision 67) the alarm is\n  after: |\n    - **Interactive-era alarm (now):** until the Decision 185 loop is live (T4.2) the alarm is\n- id: implement-forward-note\n  file: .claude/skills/implement/SKILL.md\n  before: |\n    when the executor goes live (CD.17 reversal) this alarm flips\n  after: |\n    when the Decision 185 loop goes live (T4.2) this alarm flips\n- id: implement-decomposition-hint\n  file: .claude/skills/implement/SKILL.md\n  before: |\n    A STRATEGIC parent tier_item that was split into atomic IMPLEMENTATION plans under the freeze\n    override (AGENTS.md Temporary Operational Constraints / CD.17; the T2.19 pattern) carries a\n  after: |\n    A parent tier_item that was split into atomic IMPLEMENTATION plans (the T2.19 pattern) carries a\n- id: implement-not-a-license\n  file: .claude/skills/implement/SKILL.md\n  before: |\n    `false` (inherit `false`). This is not a license to author STRATEGIC children: the freeze stays\n    in force and atomic children remain IMPLEMENTATION plans.\n  after: |\n    `false` (inherit `false`). Children are always IMPLEMENTATION plans (Decision {{N}}).\n- id: implement-strategic-scoping\n  file: .claude/skills/implement/SKILL.md\n  before: |\n    ## Strategic Scoping Rules (Workflow Step 3 -- STRATEGIC Plans only)\n\n    ### JIT Context Injection\n    When breaking a STRATEGIC plan into atomic recommendations, review `docs/PROJECT_CONTEXT.md`. Copy any relevant \"Known Gotchas\" or constraints directly into the recommendation's `context` field. Autonomous executors no longer read `copilot-instructions.md` by default, so they rely entirely on the JIT context you provide.\n\n    ### Quality Gate Validation\n    Before filing each recommendation using `bin/venv-python -m scripts.ops_data_portal`, apply this gate. FAIL if any check fails:\n    1. **Acceptance Command:** Must be a single inline command in backticks. FAIL if: contains `python -c`, contains `--pre` flag, has trailing prose, or uses line numbers. Must be behavioural.\n    2. **Target File:** Verify `\"file\"` field exists relative to repo root.\n    3. **Effort Threshold:** If `L` or `XL`, REQUIRE human confirmation before filing.\n    4. **Context Quality:** FAIL if context is vague or < 50 characters.\n\n    ### Dedup Gate\n    Before filing, search for open recs targeting the same file with at least 3 keyword matches. If duplicates found:\n    - Surface: \"Found potential duplicate(s). Options: (1) supersede existing, (2) file both, (3) skip this one?\" Wait for human.\n\n    ## Commit Flows (Workflow Step 7 -- MANDATORY)\n  after: |\n    ## Commit Flows (Workflow Step 7 -- MANDATORY)\n- id: implement-strategic-commit-flow\n  file: .claude/skills/implement/SKILL.md\n  before: |\n    recover` (never the fallback); anything else waits.\n\n    ### STRATEGIC Commit Flow\n    STRATEGIC plans are suspended (Decision 67). When restored, use the same MCP PR/subscribe/merge pattern, committing `docs/plans/briefings/` with a `scope({slug}): ...` message.\n  after: |\n    recover` (never the fallback); anything else waits.\n- id: orient-strategic-pending\n  file: .claude/skills/orient/SKILL.md\n  before: |\n    4. **Strategic pending**: list separately at the bottom, noted \"blocked by executor freeze (CD.17 reversal required)\".\n  after: |\n    4. **Strategic pending**: list separately at the bottom, noted \"decompose into child items first (Decision {{N}})\".\n- id: overseer-guardrail\n  file: .claude/skills/overseer/SKILL.md\n  before: |\n    - **Decision 67:** human-gated CC-web orchestration -- NOT `scripts/execute_recommendation.py`.\n      Never consumes the rec queue; IMPLEMENTATION only.\n  after: |\n    - **Decisions {{N}} and 229:** being retired; starts no planning or implementation agent of its own --\n      the coordinator dispatches each, one human-gated persona step on an operator-chosen rec, never the\n      rec queue, hub and spoke.\n- id: overseer-decision-90\n  file: .claude/skills/overseer/SKILL.md\n  before: |\n    - **Decision 90:** composes `/plan`/`/implement` as-is -- no new tier, plan type, or bypass.\n  after: ''\n- id: cmd-overseer-guardrails\n  file: .claude/commands/overseer.md\n  before: |\n    the Decision 67/55/73/90 guardrails), invoke\n  after: |\n    the Decision {{N}}/229/55/73 guardrails), invoke\n- id: cmd-plan-step4\n  file: .claude/commands/plan.md\n  before: |\n    5. Conduct a Complexity Assessment to determine if this is STRATEGIC or IMPLEMENTATION.\n  after: |\n    5. Conduct a Complexity Assessment to decide whether the item fits one plan or decomposes into child recs or atomic plans (Decision {{N}}).\n- id: cmd-plan-step10\n  file: .claude/commands/plan.md\n  before: |\n    **If Plan Type is IMPLEMENTATION or STRATEGIC, SKIP this step entirely and proceed to Step 11.**\n  after: |\n    **If Plan Type is IMPLEMENTATION, SKIP this step entirely and proceed to Step 11.**\n- id: cmd-implement-description\n  file: .claude/commands/implement.md\n  before: |\n    description: Implements IMPLEMENTATION plans directly or scopes STRATEGIC plans into atomic recommendations for the executor. Run after /plan.\n  after: |\n    description: Implements IMPLEMENTATION plans directly. Run after /plan.\n- id: cmd-implement-intent\n  file: .claude/commands/implement.md\n  before: |\n    **Intent**: For IMPLEMENTATION plans: execute the Ordered Execution Steps directly. For STRATEGIC plans: research Work Areas and produce atomic, automatable recommendations for the executor.\n  after: |\n    **Intent**: Execute an IMPLEMENTATION plan's Ordered Execution Steps directly.\n- id: cmd-implement-step2\n  file: .claude/commands/implement.md\n  before: |\n    Extract Intent, Plan Type, Verification Tier, Work Areas (STRATEGIC) or Execution Steps (IMPLEMENTATION), Verification Plan, and Constraints.\n  after: |\n    Extract Intent, Plan Type, Verification Tier, Execution Steps, Verification Plan, and Constraints.\n- id: cmd-implement-step3-strategic\n  file: .claude/commands/implement.md\n  before: |\n    4. Proceed to Step 4.\n\n    ### For STRATEGIC Plans\n    1. Research each Work Area by reading files/modules.\n    2. Identify dependencies.\n    3. Break into atomic recs (effort `<= M`).\n    4. Write full context (executor should not need to read the plan).\n    5. Define acceptance command and verification steps.\n    6. Apply the **Quality Gate Validation**, **Dedup Gate**, and **JIT Context Injection** from your `implement` skill.\n    7. File approved recs using `bin/venv-python -m scripts.ops_data_portal --file-rec ...`. For recs `> M` effort, create `docs/plans/briefings/BRIEFING-rec-NNN.md`.\n    8. Skip Steps 4-5 and proceed directly to Step 6.\n  after: |\n    4. Proceed to Step 4.\n- id: cmd-implement-report\n  file: .claude/commands/implement.md\n  before: |\n    - **STRATEGIC**: Total recs filed, breakdowns, briefing files created, and next step instructions.\n    - **IMPLEMENTATION**:\n  after: |\n    - **IMPLEMENTATION**:\n- id: cmd-implement-commit-flow\n  file: .claude/commands/implement.md\n  before: |\n    Apply the appropriate **Commit Flow** (STRATEGIC or IMPLEMENTATION) defined in your `implement` skill.\n  after: |\n    Apply the appropriate **Commit Flow** (the IMPLEMENTATION Commit Flow) defined in your `implement` skill.\n- id: cmd-develop-executor-delete\n  file: .claude/commands/develop-executor.md\n  before: |\n    ---\n    description: Supervisor workflow for developing the autonomous executor. Runs Root Cause Analysis on unrecoverable executor failures and files a permanent fix as a recommendation, per Decision 55. Does not repair the failure inline.\n    ---\n\n    # Workflow: Develop Executor (RCA)\n\n    **Purpose**: Execute Root Cause Analysis (RCA) on unrecoverable executor failures, as mandated by Decision 55.\n    **Trigger**: Slash command `/develop-executor`\n\n    ## 1. Context Gathering\n    - Ask the user to specify the failure context if not provided (e.g., a specific `rec-NNN` or transcript path).\n    - Read the most recent failure transcript in `logs/transcripts/` or the latest exception in `logs/.telemetry-process-events.jsonl` matching the context.\n\n    ## 2. Execute RCA Skill\n    - Run the Executor RCA skill in a fresh context to ensure unbiased diagnosis. This is intentionally a headless invocation via `run_skill.py` (not the in-session Skill tool), so the diagnosis is uncontaminated by this session's reasoning. Context is supplied explicitly via `--context` (frontmatter-based auto-loading is retired; every caller now names its own context files):\n      ```bash\n      bin/venv-python -m scripts.agent_development.run_skill --skill executor-rca --target <path_to_failure_transcript> --context docs/PROJECT_CONTEXT.md --model auto\n      ```\n    - Wait for the skill to output its root cause analysis and the generated recommendation JSON.\n\n    ## 3. File the Recommendation\n    The RCA skill emits a recommendation JSON. File it via the ops portal (NOT a direct write to the JSONL — Single Portal Invariant). Translate each JSON field into the corresponding `--file-rec` argument:\n\n    ```bash\n    bin/venv-python -m scripts.ops_data_portal --file-rec \\\n        --title \"<rca.title>\" \\\n        --file \"<rca.file>\" \\\n        --context \"<rca.context>\" \\\n        --acceptance \"<rca.acceptance>\" \\\n        --effort <XS|S|M|L|XL> \\\n        --priority <Critical|High|Medium|Low> \\\n        --source executor-rca \\\n        --risk <low|medium|high> \\\n        --verification \"<rca.verification>\" \\\n        --verification-tier <V1|V2|V3>\n    ```\n\n    - The ducklake_writer allocates the next `rec-NNN` ID atomically with the insert (`file_ops`, Decision 84 I-2).\n    - RCA recommendations derive `automatable=false` automatically -- executor files match the boundary patterns in `config/agent/executor/capabilities.yaml` (Decision 44). The `--automatable` CLI flag has been removed; the portal formula handles it.\n    - If AWS credentials are missing, the write FAILS LOUDLY (Decision 84 I-4 -- no outbox). Restore the chain (`aws sts get-caller-identity --profile agent_platform`) and re-file.\n\n    ## 4. Stop Cleanly\n    - **CRITICAL INVARIANT:** Do not attempt to repair the failure. Do not apply workarounds.\n    - Terminate the workflow, leaving the fix to be prioritised and implemented via the standard `/plan` -> `/implement` loop.\n  after: ''\n- id: gitops-scope-prefix\n  file: docs/contracts/git-ops.yaml\n  before: |\n    use_for: STRATEGIC plan scoping (currently suspended, Decision 67)\n  after: |\n    use_for: Retired with the STRATEGIC plan type (Decision {{N}}); historical commits only, never a new one\n- id: gitops-amendment\n  file: docs/contracts/git-ops.yaml\n  before: |\n    amendment_log:\n  after: |\n    amendment_log:\n      - {date: \"{{DATE}}\", semantic_break: false, change_class: prose_improvement, summary: \"PLAN-retire-strategic-plans-and-legacy-executor (rec-4478, Decision {{N}}): the scope({slug}) commit prefix row is marked retired with the STRATEGIC plan type (the row stays so historical commits still parse); development_surface names the legacy executor retired; agent_branch_prefixes_reversal re-keys its executor-unfreeze trigger to the Decision 185 loop opening agent/ branches. contract_version unchanged.\"}\n- id: tier-lifecycle-not-a-license\n  file: docs/contracts/tier-item-lifecycle.yaml\n  before: |2\n      This is not a license to author STRATEGIC children: the freeze stays in force and atomic\n      children remain IMPLEMENTATION plans.\n  after: |2\n      Children are always IMPLEMENTATION plans: the STRATEGIC plan type is retired (Decision {{N}}).\n- id: tier-lifecycle-amendment\n  file: docs/contracts/tier-item-lifecycle.yaml\n  before: |\n    amendment_log:\n      - date: \"2026-09-12\"\n  after: |\n    amendment_log:\n      - date: \"{{DATE}}\"\n        semantic_break: false\n        change_class: prose_improvement\n        summary: >-\n          PLAN-retire-strategic-plans-and-legacy-executor (rec-4478, Decision {{N}}): decomposition_hint_inheritance's\n          closing sentence says children are always IMPLEMENTATION plans because the STRATEGIC type is retired, not\n          frozen. No rule changed.\n      - date: \"2026-09-12\"\n- id: instr-arch-executor\n  file: docs/contracts/instruction-architecture.yaml\n  before: |\n    contexts; frozen pending Decision 67 reversal\n  after: |\n    contexts; the legacy Python executor is retired (Decision {{N}}), and the Decision 185 loop's personas succeed it\n- id: instr-arch-amendment\n  file: docs/contracts/instruction-architecture.yaml\n  before: |\n    amendment_log:\n      - date: \"2026-11-02\"\n  after: |\n    amendment_log:\n      - date: \"{{DATE}}\"\n        semantic_break: false\n        change_class: prose_improvement\n        summary: >-\n          PLAN-retire-strategic-plans-and-legacy-executor (rec-4478, Decision {{N}}): the executor consumer's note s