persona: fixture_persona
contract_version: 1
kind: verdict

input_schema:
  type: object
  additionalProperties: false
  required: [change_id, head_sha, notes]
  properties:
    change_id: {type: string, minLength: 1}
    head_sha: {type: string, pattern: "^[0-9a-f]{40}$"}
    notes: {type: string}

output_schema:
  type: object
  additionalProperties: false
  required: [outcome, verdict, findings]
  properties:
    outcome: {const: success}
    verdict: {type: string, enum: [PROCEED, REVISE]}
    findings: {type: array, items: {type: string}}

capabilities:
  - read_input:notes

budget:
  max_turns: 6
  max_wall_clock_seconds: 60
  max_revisions: 1

failure_outputs:
  - {id: budget_exhausted, meaning: "The run reached max_turns or max_wall_clock_seconds before a valid result."}
  - {id: schema_invalid, meaning: "The result still failed output_schema after max_revisions repairs."}
  - {id: input_incomplete, meaning: "The materialised input lacks a field input_schema requires."}
  - {id: injection_suspected, meaning: "Quoted content tried to direct the result."}

