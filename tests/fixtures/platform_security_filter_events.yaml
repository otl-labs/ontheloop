# Sanitised CloudTrail events for the platform-security-* metric filters (rec-4044, Decision 202).
#
# Each entry names, in must_match, the EXACT set of filters (keyed by alarm name, as in
# local.platform_security_filter_patterns in terraform/bootstrap/platform_security_alarms.tf) that
# must match its event. Read by tests/checks/iam_tf/test_platform_role_iam_change_alarms.py (shape,
# coverage, no account id) and by the plan's ADMIN logs:TestMetricFilter step (live evaluation of the
# events exactly as committed). The account id is the literal ACCOUNT -- never twelve digits.
# Denied events mirror CloudTrail's real denied shape (observed live 2026-10-12): requestParameters,
# responseElements and resources are null, and the target role is named only in errorMessage.
events:
  - name: lowercase-platformadmin-update-role
    must_match: [platform-security-platform-role-iam-change, platform-security-iam-event-heartbeat]
    event:
      eventVersion: "1.09"
      userIdentity: {type: AssumedRole, arn: "arn:aws:sts::ACCOUNT:assumed-role/PlatformAdmin/session"}
      eventTime: "2026-09-25T12:00:00Z"
      eventSource: iam.amazonaws.com
      eventName: UpdateRole
      awsRegion: us-east-1
      requestParameters: {roleName: platformadmin, maxSessionDuration: 3600}
      readOnly: false
      eventID: fixture-event-01
      eventType: AwsApiCall
      recipientAccountId: ACCOUNT
  - name: platformdev-tag-role-denied
    must_match:
      - platform-security-platform-role-iam-change
      - platform-security-denied-iam-write
      - platform-security-iam-event-heartbeat
    event:
      eventVersion: "1.09"
      userIdentity: {type: AssumedRole, arn: "arn:aws:sts::ACCOUNT:assumed-role/PlatformDev/session"}
      eventTime: "2026-09-25T12:01:00Z"
      eventSource: iam.amazonaws.com
      eventName: TagRole
      awsRegion: us-east-1
      errorCode: AccessDenied
      errorMessage: "User: arn:aws:sts::ACCOUNT:assumed-role/PlatformDev/session is not authorized to perform: iam:TagRole on resource: role platformadmin because no identity-based policy allows the iam:TagRole action"
      requestParameters: null
      responseElements: null
      readOnly: false
      eventID: fixture-event-02
      eventType: AwsApiCall
      recipientAccountId: ACCOUNT
  - name: boundary-policy-create-policy-version
    must_match: [platform-security-platform-role-iam-change, platform-security-iam-event-heartbeat]
    event:
      eventVersion: "1.09"
      userIdentity: {type: AssumedRole, arn: "arn:aws:sts::ACCOUNT:assumed-role/PlatformAdmin/session"}
      eventTime: "2026-09-25T12:02:00Z"
      eventSource: iam.amazonaws.com
      eventName: CreatePolicyVersion
      awsRegion: us-east-1
      requestParameters:
        policyArn: "arn:aws:iam::ACCOUNT:policy/agent-platform-github-ci-apply-boundary"
        policyDocument: "{}"
        setAsDefault: true
      readOnly: false
      eventID: fixture-event-03
      eventType: AwsApiCall
      recipientAccountId: ACCOUNT
  - name: trail-stop-logging
    must_match: [platform-security-detector-tamper]
    event:
      eventVersion: "1.09"
      userIdentity: {type: AssumedRole, arn: "arn:aws:sts::ACCOUNT:assumed-role/PlatformAdmin/session"}
      eventTime: "2026-09-25T12:03:00Z"
      eventSource: cloudtrail.amazonaws.com
      eventName: StopLogging
      awsRegion: eu-west-2
      requestParameters: {name: "arn:aws:cloudtrail:eu-west-2:ACCOUNT:trail/platform-security-trail"}
