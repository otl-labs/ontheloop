        - {session: root, event_id: m3, event_kind: point, observation_id: m3, observation_type: model_call, at: "2026-09-25T10:35:00+00:00", so: 3}
        - {session: root, event_id: m4a, event_kind: point, observation_id: m4, observation_type: model_call, tokens_input: 1, tokens_output: 1, tokens_cache_read: 1, tokens_cache_creation: 1, at: "2026-09-25T10:40:00+00:00", so: 4}
