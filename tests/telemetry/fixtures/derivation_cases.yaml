      telemetry_observations:
        - {session: root, event_id: p1, event_kind: point, observation_id: p1, observation_type: process_event, name: "hook:a", severity: info, at: "2026-09-25T10:01:00+00:00", so: 1}
        - {session: root, event_id: p1, event_kind: point, observation_id: p1, observation_type: process_event, name: "hook:a", severity: info, at: "2026-09-25T10:01:00+00:00", so: 1, created: "2026-09-25T10:00:30+00:00", producer_version: "2.0"}
        - {session: root, event_id: p2, event_kind: point, observation_id: p2, observation_type: process_event, name: "hook:b", severity: info, at: "2026-09-25T10:02:00+00:00", so: 2}
        - {session: root, event_id: p3, event_kind: point, observation_id: p3, observation_type: process_event, name: "hook:c", severity: info, at: "2026-09-25T10:03:00+00:00", so: 3}
        - {session: root, event_id: s1o, event_kind: open, observation_id: s1, observation_type: step, name: one, at: "2026-09-25T10:04:00+00:00", so: 4}
        - {session: root, event_id: s1c, event_kind: close, observation_id: s1, observation_type: step, name: one, at: "2026-09-25T10:05:00+00:00", so: 5}
        - {session: root, event_id: s2o, event_kind: open, observation_id: s2, observation_type: step, name: two, at: "2026-09-25T10:06:00+00:00", so: 6}
        - {session: root, event_id: s2c, event_kind: close, observation_id: s2, observation_type: step, name: two, at: "2026-09-25T10:07:00+00:00", so: 7}
        - {session: root, event_id: s3o, event_kind: open, observation_id: s3, observation_type: step, name: three, at: "2026-09-25T10:08:00+00:00", so: 8}
    expect:
