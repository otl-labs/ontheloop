# Golden derivation cases for the telemetry event-journal reader verbs (rec-4291), authored from the contract formulas
# (telemetry_sessions.yaml state / duration_seconds, telemetry_agents.yaml, envelope R4/R5), never from the SQL. Fix the SQL, not
# these expectations, unless a case misreads the contract.
#
# sessions: name -> {started_at, parent (a session name), project (a project name)}; the test derives each session_id from the
#   name with src.telemetry.identity so its ULID time prefix is the root start. Rows: `session` names the row's session, `at` is
#   event_timestamp, `so` is source_ordinal; every other key is a stored column. Rows default to producer claude_code, parser_version 1.
# expect: a verb call with params (session or day window plus as_of) and `rows`, subsets of the verb's output columns in order;
#   in a row, `session: name` stands for that session's id, and *_timestamp / as_of values are ISO strings.

projects:
  real: {purpose: real}
  drill: {purpose: drill}

cases:
  - id: c01_closed_session_is_terminal_at_any_as_of
    sessions: {root: {started_at: "2026-09-25T10:00:00+00:00"}}
    rows:
      telemetry_sessions:
        - {session: root, event_id: e1, event_kind: open, at: "2026-09-25T10:00:00+00:00", so: 0}
        - {session: root, event_id: e2, event_kind: close, at: "2026-09-25T11:00:00+00:00", so: 1, outcome: success}
    expect:
      - verb: session_state_and_duration
        session: root
        params: {as_of: "2026-09-25T12:00:00+00:00"}
        rows: [{state: success, outcome: success, duration_seconds: 3600, last_event_timestamp: "2026-09-25T11:00:00+00:00", derivation_conflicted: false}]
      - verb: session_state_and_duration
        session: root
        params: {as_of: "2026-12-01T00:00:00+00:00"}
        rows: [{state: success, outcome: success, duration_seconds: 3600}]

  - id: c02_failed_and_cancelled_outcomes_are_the_state
    sessions: {failed: {started_at: "2026-09-25T10:00:00+00:00"}, cancelled: {started_at: "2026-09-25T10:00:00+00:00"}}
    rows:
      telemetry_sessions:
        - {session: failed, event_id: f1, event_kind: open, at: "2026-09-25T10:00:00+00:00", so: 0}
        - {session: failed, event_id: f2, event_kind: close, at: "2026-09-25T10:30:00+00:00", so: 1, outcome: failed}
        - {session: cancelled, event_id: g1, event_kind: open, at: "2026-09-25T10:00:00+00:00", so: 0}
        - {session: cancelled, event_id: g2, event_kind: close, at: "2026-09-25T10:10:00+00:00", so: 1, outcome: cancelled}
    expect:
      - {verb: session_state_and_duration, session: failed, params: {as_of: "2026-09-25T12:00:00+00:00"}, rows: [{state: failed, outcome: failed, duration_seconds: 1800}]}
      - {verb: session_state_and_duration, session: cancelled, params: {as_of: "2026-09-25T12:00:00+00:00"}, rows: [{state: cancelled, outcome: cancelled, duration_seconds: 600}]}

  - id: c03_resume_after_close_is_running_again
    sessions: {root: {started_at: "2026-09-25T10:00:00+00:00"}}
    rows:
      telemetry_sessions:
        - {session: root, event_id: e1, event_kind: open, at: "2026-09-25T10:00:00+00:00", so: 0}
        - {session: root, event_id: e2, event_kind: close, at: "2026-09-25T11:00:00+00:00", so: 1, outcome: success}
        - {session: root, event_id: e3, event_kind: resume, at: "2026-09-25T12:00:00+00:00", so: 2}
    expect:
      - {verb: session_state_and_duration, session: root, params: {as_of: "2026-09-25T13:00:00+00:00"}, rows: [{state: running, outcome: null, duration_seconds: 3600, last_event_timestamp: "2026-09-25T12:00:00+00:00"}]}
      - {verb: session_state_and_duration, session: root, params: {as_of: "2026-09-26T11:59:00+00:00"}, rows: [{state: running, duration_seconds: 3600}]}
      - {verb: session_state_and_duration, session: root, params: {as_of: "2026-09-26T12:01:00+00:00"}, rows: [{state: abandoned, outcome: null, duration_seconds: 3600}]}

  - id: c04_close_ranks_last_on_a_full_tie
    sessions: {root: {started_at: "2026-09-25T10:00:00+00:00"}}
    rows:
      telemetry_sessions:
        - {session: root, event_id: e1, event_kind: open, at: "2026-09-25T10:00:00+00:00", so: 0}
        - {session: root, event_id: e2, event_kind: resume, at: "2026-09-25T11:00:00+00:00", so: 2}
        - {session: root, event_id: e0, event_kind: close, at: "2026-09-25T11:00:00+00:00", so: 2, outcome: success}
    expect:
      - {verb: session_state_and_duration, session: root, params: {as_of: "2026-09-25T12:00:00+00:00"}, rows: [{state: success, outcome: success, duration_seconds: 3600}]}
      - {verb: session_state_and_duration, session: root, params: {as_of: "2026-10-30T12:00:00+00:00"}, rows: [{state: success, outcome: success, duration_seconds: 3600}]}

  - id: c04b_a_later_ordinal_beats_close_on_the_same_timestamp
    sessions: {root: {started_at: "2026-09-25T10:00:00+00:00"}}
    rows:
      telemetry_sessions:
        - {session: root, event_id: e1, event_kind: open, at: "2026-09-25T10:00:00+00:00", so: 0}
        - {session: root, event_id: e2, event_kind: close, at: "2026-09-25T11:00:00+00:00", so: 1, outcome: success}
        - {session: root, event_id: e3, event_kind: resume, at: "2026-09-25T11:00:00+00:00", so: 2}
    expect:
      - {verb: session_state_and_duration, session: root, params: {as_of: "2026-09-25T12:00:00+00:00"}, rows: [{state: running, outcome: null, duration_seconds: 3600}]}
      - {verb: session_state_and_duration, session: root, params: {as_of: "2026-09-27T12:00:00+00:00"}, rows: [{state: abandoned, duration_seconds: 3600}]}

  - id: c05_annotate_rows_never_decide_the_state
    sessions: {root: {started_at: "2026-09-25T10:00:00+00:00"}}
    rows:
      telemetry_sessions:
        - {session: root, event_id: e1, event_kind: open, at: "2026-09-25T10:00:00+00:00", so: 0}
        - {session: root, event_id: e2, event_kind: close, at: "2026-09-25T11:00:00+00:00", so: 1, outcome: success}
        - {session: root, event_id: e3, event_kind: annotate, at: "2026-09-26T15:00:00+00:00", so: 3, pr_url: "https://example.test/pr/1"}
    expect:
      - {verb: session_state_and_duration, session: root, params: {as_of: "2026-09-27T00:00:00+00:00"}, rows: [{state: success, duration_seconds: 3600, last_event_timestamp: "2026-09-26T15:00:00+00:00"}]}
      - {verb: session_state_and_duration, session: root, params: {as_of: "2026-12-01T00:00:00+00:00"}, rows: [{state: success}]}

  - id: c06_abandoned_only_strictly_past_the_idle_threshold
    sessions: {root: {started_at: "2026-09-25T10:00:00+00:00"}}
    rows:
      telemetry_sessions:
        - {session: root, event_id: e1, event_kind: open, at: "2026-09-25T10:00:00+00:00", so: 0}
    expect:
      - {verb: session_state_and_duration, session: root, params: {as_of: "2026-09-26T09:59:00+00:00"}, rows: [{state: running, outcome: null, duration_seconds: null, idle_threshold_seconds: 86400}]}
      - {verb: session_state_and_duration, session: root, params: {as_of: "2026-09-26T10:00:00+00:00"}, rows: [{state: running}]}
      - {verb: session_state_and_duration, session: root, params: {as_of: "2026-09-26T10:00:01+00:00"}, rows: [{state: abandoned, outcome: null, duration_seconds: null, as_of: "2026-09-26T10:00:01+00:00"}]}

  - id: c07_activity_in_any_table_keeps_a_session_running
    sessions: {root: {started_at: "2026-09-25T10:00:00+00:00"}}
    rows:
      telemetry_sessions:
        - {session: root, event_id: e1, event_kind: open, at: "2026-09-25T10:00:00+00:00", so: 0}
      telemetry_observations:
        - {session: root, event_id: o1, event_kind: open, observation_id: t1, observation_type: tool_call, name: Bash, at: "2026-09-26T09:00:00+00:00", so: 1}
      telemetry_transcripts:
        - {session: root, event_id: x1, event_kind: point, at: "2026-09-26T09:30:00+00:00", so: 2}
    expect:
      - {verb: session_state_and_duration, session: root, params: {as_of: "2026-09-26T12:00:00+00:00"}, rows: [{state: running, last_event_timestamp: "2026-09-26T09:30:00+00:00"}]}
      - {verb: session_state_and_duration, session: root, params: {as_of: "2026-09-27T09:31:00+00:00"}, rows: [{state: abandoned}]}

  - id: c08_multi_producer_latest_row_decides
    sessions: {root: {started_at: "2026-09-25T10:00:00+00:00"}}
    rows:
      telemetry_sessions:
        - {session: root, event_id: e1, event_kind: open, at: "2026-09-25T10:00:00+00:00", so: 0}
        - {session: root, event_id: e2, event_kind: close, at: "2026-09-25T11:00:00+00:00", so: 1, outcome: success}
        - {session: root, event_id: a1, producer: ci_annotate, event_kind: resume, at: "2026-09-25T11:30:00+00:00", so: 0}
    expect:
      - verb: session_state_and_duration
        session: root
        params: {as_of: "2026-09-25T12:00:00+00:00"}
        rows: [{state: running, outcome: null, duration_seconds: 3600, generations: [{producer: claude_code, parser_version: 1}]}]
      - {verb: session_state_and_duration, session: root, params: {as_of: "2026-09-27T00:00:00+00:00"}, rows: [{state: abandoned}]}

  - id: c09_generation_bump_retires_the_older_close
    sessions: {root: {started_at: "2026-09-25T10:00:00+00:00"}}
    rows:
      telemetry_sessions:
        - {session: root, event_id: e1, event_kind: open, at: "2026-09-25T10:00:00+00:00", so: 0, parser_version: 1}
        - {session: root, event_id: e2, event_kind: close, at: "2026-09-25T11:00:00+00:00", so: 1, outcome: failed, parser_version: 1}
        - {session: root, event_id: e1, event_kind: open, at: "2026-09-25T10:00:00+00:00", so: 0, parser_version: 2}
        - {session: root, event_id: e2, event_kind: close, at: "2026-09-25T11:30:00+00:00", so: 1, outcome: success, parser_version: 2}
    expect:
      - {verb: session_state_and_duration, session: root, params: {as_of: "2026-09-25T12:00:00+00:00"}, rows: [{state: success, outcome: success, duration_seconds: 5400, generations: [{producer: claude_code, parser_version: 2}]}]}

  - id: c10_conflicted_grain_key_is_reported_not_resolved
    sessions: {root: {started_at: "2026-09-25T10:00:00+00:00"}}
    rows:
      telemetry_sessions:
        - {session: root, event_id: e1, event_kind: open, at: "2026-09-25T10:00:00+00:00", so: 0, workflow: plan}
        - {session: root, event_id: e1, event_kind: open, at: "2026-09-25T10:00:00+00:00", so: 0, workflow: implement, created: "2026-09-25T10:00:05+00:00"}
        - {session: root, event_id: e2, event_kind: close, at: "2026-09-25T11:00:00+00:00", so: 1, outcome: success}
    expect:
      - verb: session_state_and_duration
        session: root
        params: {as_of: "2026-09-25T12:00:00+00:00"}
        rows:
          - state: success
            duration_seconds: 3600
            derivation_conflicted: true
            conflicted_grain_keys: [{table_name: telemetry_sessions, producer: claude_code, event_id: e1, parser_version: 1}]

  - id: c11_sub_agents_take_state_and_duration_from_the_agent_run_pair
    sessions:
      root: {started_at: "2026-09-25T10:00:00+00:00"}
      sync_ok: {started_at: "2026-09-25T10:00:00+00:00", parent: root}
      sync_failed: {started_at: "2026-09-25T10:00:00+00:00", parent: root}
      sync_timeout: {started_at: "2026-09-25T10:00:00+00:00", parent: root}
      sync_throttled: {started_at: "2026-09-25T10:00:00+00:00", parent: root}
    rows:
      telemetry_sessions:
        - {session: root, event_id: e1, event_kind: open, at: "2026-09-25T10:00:00+00:00", so: 0}
        - {session: sync_ok, event_id: c1, event_kind: open, at: "2026-09-25T10:00:00+00:00", so: 0}
        - {session: sync_failed, event_id: c2, event_kind: open, at: "2026-09-25T10:00:00+00:00", so: 0}
        - {session: sync_timeout, event_id: c3, event_kind: open, at: "2026-09-25T10:00:00+00:00", so: 0}
        - {session: sync_throttled, event_id: c4, event_kind: open, at: "2026-09-25T10:00:00+00:00", so: 0}
      telemetry_agents:
        - {session: sync_ok, event_id: a1, agent_run_id: r1, agent_type: reviewer, event_kind: open, at: "2026-09-25T10:05:00+00:00", so: 1}
        - {session: sync_ok, event_id: a2, agent_run_id: r1, agent_type: reviewer, event_kind: close, at: "2026-09-25T10:15:00+00:00", so: 2, outcome: success}
        - {session: sync_failed, event_id: a3, agent_run_id: r2, agent_type: reviewer, event_kind: open, at: "2026-09-25T10:05:00+00:00", so: 1}
        - {session: sync_failed, event_id: a4, agent_run_id: r2, agent_type: reviewer, event_kind: close, at: "2026-09-25T10:06:00+00:00", so: 2, outcome: failed}
        - {session: sync_timeout, event_id: a5, agent_run_id: r3, agent_type: reviewer, event_kind: open, at: "2026-09-25T10:05:00+00:00", so: 1}
        - {session: sync_timeout, event_id: a6, agent_run_id: r3, agent_type: reviewer, event_kind: close, at: "2026-09-25T10:25:00+00:00", so: 2, outcome: timeout}
        - {session: sync_throttled, event_id: a7, agent_run_id: r4, agent_type: reviewer, event_kind: open, at: "2026-09-25T10:05:00+00:00", so: 1}
        - {session: sync_throttled, event_id: a8, agent_run_id: r4, agent_type: reviewer, event_kind: close, at: "2026-09-25T10:35:00+00:00", so: 2, outcome: throttled}
    expect:
      - {verb: session_state_and_duration, session: sync_ok, params: {as_of: "2026-09-25T12:00:00+00:00"}, rows: [{state: success, outcome: success, duration_seconds: 600, parent_session_id: {session: root}}]}
      - {verb: session_state_and_duration, session: sync_failed, params: {as_of: "2026-09-25T12:00:00+00:00"}, rows: [{state: failed, outcome: failed, duration_seconds: 60}]}
      - {verb: session_state_and_duration, session: sync_timeout, params: {as_of: "2026-09-25T12:00:00+00:00"}, rows: [{state: failed, outcome: timeout, duration_seconds: 1200}]}
      - {verb: session_state_and_duration, session: sync_throttled, params: {as_of: "2026-09-25T12:00:00+00:00"}, rows: [{state: failed, outcome: throttled, duration_seconds: 1800}]}
      - {verb: agent_run_state_and_duration, session: sync_timeout, params: {as_of: "2026-09-25T12:00:00+00:00"}, rows: [{agent_run_id: r3, agent_type: reviewer, state: failed, outcome: timeout, duration_seconds: 1200}]}

  - id: c12_async_sub_agent_without_a_close
    sessions:
      root: {started_at: "2026-09-25T10:00:00+00:00"}
      child: {started_at: "2026-09-25T10:00:00+00:00", parent: root}
    rows:
      telemetry_sessions:
        - {session: root, event_id: e1, event_kind: open, at: "2026-09-25T10:00:00+00:00", so: 0}
        - {session: child, event_id: c1, event_kind: open, at: "2026-09-25T10:00:00+00:00", so: 0}
      telemetry_agents:
        - {session: child, event_id: a1, agent_run_id: r1, agent_type: reviewer, event_kind: open, at: "2026-09-25T10:05:00+00:00", so: 1}
      telemetry_observations:
        - {session: child, event_id: m1, event_kind: point, observation_id: m1, observation_type: model_call, at: "2026-09-25T10:20:00+00:00", so: 2, tokens_input: 5, tokens_output: 1}
    expect:
      - {verb: session_state_and_duration, session: child, params: {as_of: "2026-09-26T10:19:00+00:00"}, rows: [{state: running, outcome: null, duration_seconds: null}]}
      - {verb: session_state_and_duration, session: child, params: {as_of: "2026-09-26T10:21:00+00:00"}, rows: [{state: abandoned, outcome: null, duration_seconds: null}]}
      - {verb: agent_run_state_and_duration, session: child, params: {as_of: "2026-09-26T10:21:00+00:00"}, rows: [{agent_run_id: r1, state: abandoned, outcome: null, duration_seconds: null}]}

  - id: c13_process_event_and_step_rollup_after_dedupe
