        - {session: root, event_id: mB, event_kind: point, observation_id: mB, observation_type: model_call, model: claude-x, provider: anthropic_max, billing_shape: fixed_non_rollover_allowance, cost_usd_reported: 0.7, at: "2026-09-25T10:20:00+00:00", so: 2}
        - {session: root, event_id: mC, event_kind: point, observation_id: mC, observation_type: model_call, model: claude-x, provider: litellm, at: "2026-09-25T10:30:00+00:00", so: 3}
