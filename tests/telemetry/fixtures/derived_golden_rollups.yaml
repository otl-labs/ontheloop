# Hand-authored expectations for the telemetry roll-up verbs (agent_run_token_rollup, session_process_event_rollup,
# session_friction_rollup, model_call_cost_estimate). Residual-class file (Decision 166): one flow-mapping line per expectation,
# why inline. Companion of derived_golden_state.yaml (same header rule, same shape, same selectors, same size rule); together
# they are the one expectations set every engine asserts. PLAN-telemetry-golden-harness (rec-4025).
#
# AUTHORING RULE (as the state file): the contract formula applied BY HAND to the rows the CURRENT producer (parser_version
# below) emits; never copied from a verb or oracle output; known_defect names the owner rec where the emitted rows carry a
# known producer defect (none at parser_version 7: rec-4354's non-final usage is flagged on the row by usage_final false).
# FORMULAS. tokens_*_total = sum over the session's model_call rows after R5c (one per observation_id; telemetry_agents.yaml
# tokens_*_total); model_call_count = those rows; usage_missing_count = those with no token counts (none in these trees).
# process_event_total = count of process_event observations; steps_completed_total = step-kind closes (telemetry_sessions.yaml).
# Friction: facts are process_events at severity error|warning|critical and tool_call closes with outcome error|blocked;
# each fact gets one label (hook:never_on_main -> branch_policy_block; any other process_event at error|critical ->
# unmapped_block; at warning -> hook_fault; tool_call error -> tool_error; blocked -> tool_blocked); a blocked tool_call whose
# own blocking hook is already a fact is not counted twice; rework needs 3 consecutive error closes of one tool in one turn
# (a success or blocked close of the same tool breaks the run); classifier_version 1. label_counts rows compare sorted by label.
# Cost: fixed_non_rollover_allowance rows derive cost_usd NULL with cost_source allowance (Decision 206), never 0.
parser_version: 7
trees:
  - tree: corpus:hooks_resume_and_compact
    pass: final
    why: three model calls (10, 20, 30, 40 each) and six process events (resume x3, PreCompact, compact, PostCompact)
    expect:
      - {verb: agent_run_token_rollup, session: root, params: {}, rows: [{tokens_input_total: 30, tokens_output_total: 60, tokens_cache_read_total: 90, tokens_cache_creation_total: 120, model_call_count: 3, usage_missing_count: 0}], why: 3 x (10, 20, 30, 40)}
      - {verb: session_process_event_rollup, session: root, params: {}, rows: [{process_event_total: 6, steps_completed_total: 0}], why: six hook process events; no step observations}
      - {verb: model_call_cost_estimate, session: root, params: {}, rows: [{event_timestamp: "2026-01-01T00:00:02Z", model: claude-test-1, billing_shape: fixed_non_rollover_allowance, tokens_input: 10, tokens_output: 20, cost_usd: null, cost_source: allowance}, {event_timestamp: "2026-01-01T00:00:05Z", tokens_input: 10, cost_usd: null, cost_source: allowance}, {event_timestamp: "2026-01-01T00:00:08Z", tokens_output: 20, cost_usd: null, cost_source: allowance}], why: allowance rows derive no dollar cost and never a 0}
  - tree: corpus:hooks_resume_and_compact
    pass: stop
    why: a Stop pass emits the same three calls and six process events
    expect:
      - {verb: agent_run_token_rollup, session: root, params: {}, rows: [{tokens_input_total: 30, tokens_output_total: 60, tokens_cache_read_total: 90, tokens_cache_creation_total: 120, model_call_count: 3, usage_missing_count: 0}], why: 3 x (10, 20, 30, 40)}
      - {verb: session_process_event_rollup, session: root, params: {}, rows: [{process_event_total: 6, steps_completed_total: 0}], why: six hook process events}
  - tree: corpus:resume_after_interrupt
