# Hand-authored expectations for the telemetry state verbs (session_state_and_duration, agent_run_state_and_duration,
# sessions_window, sessions_window_all_purposes). Residual-class file (Decision 166): one flow-mapping line per expectation,
# why inline. Companion: derived_golden_rollups.yaml (the roll-up verbs); together they are the one expectations set every
# engine (in-memory DuckDB, local DuckLake, later the deployed reader) asserts. PLAN-telemetry-golden-harness (rec-4025).
#
# AUTHORING RULE. Every value is the Class A contract formula (telemetry_sessions.yaml state / duration_seconds,
# telemetry_agents.yaml duration_seconds, the envelope's R4/R5) applied BY HAND to the rows the CURRENT producer
# (parser_version below) emits for the tree. A value is never copied from a verb or oracle output and never edited to make a
# run pass; a disagreement is re-derived by hand. A trap tree reproducing a known producer defect carries the emitted value
# and known_defect naming the owner rec; the transcript truth is asserted by scripts/telemetry_verify shape and ledger checks.
# A plan that bumps PARSER_VERSION and changes a tree's emitted rows re-authors the affected lines by hand in its own PR,
# citing itself in each changed entry's why, and moves parser_version; tests/telemetry_verify/test_derive.py fails until it does.
#
# SHAPE. trees: [{tree: "corpus:<golden case>" | "verification:<tree>", pass: final | stop, why, expect: [...]}].
# expect line: {verb, session: root | "agent:<agentId>" (absent for the window verbs), params, rows: [asserted column subset],
# why, known_defect?, discriminates?}. rows[i] columns are compared to the verb's i-th row; {session: <selector>} stands for
# that session's stored id. Event time = 2026-01-01T00:00:SS; session_started_at = the root's first record.
# as_of RULE (state verbs): I = 2026-01-01T12:00:00Z (inside the 24 h idle threshold of the session's own last event),
# B = 2026-01-03T00:00:00Z (beyond it); on a NON-TERMINAL session a third value exactly last event + 86,400 s, tagged
# discriminates idle_threshold: the contract says idle time must EXCEED the threshold, so exactly equal still reads running
# (telemetry_sessions.yaml state; derivation_cases.yaml c06). A terminal session reads its outcome at any as_of.
# PLAN-telemetry-read-side-session-end (SE-1..SE-3): every root expectation below was re-derived by hand from the amended formulas over the
# rows its tree emits; each tree holds a producer close that no turn follows, or an open last turn, so no value moved.
# INTEGER CONVERSION. A fractional duration is truncated toward zero to whole seconds (the contract's int; rec-4405).
parser_version: 7
trees:
  - tree: corpus:hooks_resume_and_compact
    pass: final
    why: "root open 1, resume 3, compact 6, closes 2 and 8 (segment closes derived at the resume boundaries) and 9 (the finalization close); PLAN-telemetry-capture-producer-fixes: the trailing resume 9 is not due until its hook group ends (SC-3), so the close at 9 is the sole latest row and no tie remains"
    expect:
      - {verb: session_state_and_duration, session: root, params: {as_of: "2026-01-01T12:00:00Z"}, rows: [{state: success, outcome: success, duration_seconds: 8, last_event_timestamp: "2026-01-01T00:00:09Z"}], why: "PLAN-telemetry-capture-producer-fixes (v4): the latest lifecycle row is the close at 9 (ordinal 11); 9 - 1 = 8 s; last event is the 9 s rows"}
      - {verb: session_state_and_duration, session: root, params: {as_of: "2026-01-03T00:00:00Z"}, rows: [{state: success, outcome: success, duration_seconds: 8}], why: terminal at any as_of}
      - {verb: sessions_window, params: {day_from: "2026-01-01", day_to: "2026-01-01", as_of: "2026-01-01T12:00:00Z"}, rows: [{state: success, outcome: success, duration_seconds: 8}], why: one root session of a real project}
      - {verb: sessions_window_all_purposes, params: {day_from: "2026-01-01", day_to: "2026-01-01", as_of: "2026-01-03T00:00:00Z"}, rows: [{state: success, outcome: success, duration_seconds: 8}], why: same root over every purpose}
  - tree: corpus:hooks_resume_and_compact
    pass: stop
    why: "PLAN-telemetry-capture-producer-fixes (v4): no finalization yet, but the resume boundary at 9 derives the segment close at 8 (SC-1), so the latest lifecycle row is that close and the root is terminal"
    expect:
      - {verb: session_state_and_duration, session: root, params: {as_of: "2026-01-01T12:00:00Z"}, rows: [{state: success, outcome: success, duration_seconds: 7, last_event_timestamp: "2026-01-01T00:00:09Z"}], why: "PLAN-telemetry-capture-producer-fixes (v4): latest lifecycle row is the close at 8 (the compact is at 6); 8 - 1 = 7 s; the last event is the resume hook's process event at 9"}
      - {verb: session_state_and_duration, session: root, params: {as_of: "2026-01-03T00:00:00Z"}, rows: [{state: success, outcome: success, duration_seconds: 7}], why: terminal at any as_of, so never abandoned}
      - {verb: sessions_window, params: {day_from: "2026-01-01", day_to: "2026-01-01", as_of: "2026-01-01T12:00:00Z"}, rows: [{state: success, outcome: success, duration_seconds: 7}], why: one root, terminal}
      - {verb: sessions_window_all_purposes, params: {day_from: "2026-01-01", day_to: "2026-01-01", as_of: "2026-01-03T00:00:00Z"}, rows: [{state: success, outcome: success, duration_seconds: 7}], why: same root over every purpose}
  - tree: corpus:resume_after_interrupt
    pass: final
    why: "PLAN-telemetry-capture-producer-fixes (v4): open 1, close 4 cancelled (segment close at the resume boundary), resume 6, close 11 success"
    expect:
      - {verb: session_state_and_duration, session: root, params: {as_of: "2026-01-01T12:00:00Z"}, rows: [{state: success, outcome: success, duration_seconds: 10, last_event_timestamp: "2026-01-01T00:00:11Z"}], why: latest row is the close at 11; 11 - 1 = 10 s}
      - {verb: session_state_and_duration, session: root, params: {as_of: "2026-01-03T00:00:00Z"}, rows: [{state: success, outcome: success, duration_seconds: 10}], why: terminal at any as_of}
      - {verb: sessions_window, params: {day_from: "2026-01-01", day_to: "2026-01-01", as_of: "2026-01-03T00:00:00Z"}, rows: [{state: success, outcome: success, duration_seconds: 10}], why: one root}
  - tree: corpus:resume_after_interrupt
    pass: stop
    why: "PLAN-telemetry-capture-producer-fixes (v4): no finalization; the segment close at 4 (cancelled) precedes the resume at 6, so the latest lifecycle row is the resume and the root is not terminal; PLAN-telemetry-stop-turn-close (v5, WT-8): the open last turn p2 lands its turn open row at 10 once its prompt is on disk, so the last event is that row, not the second resume hook's process event at 7"
    expect:
      - {verb: session_state_and_duration, session: root, params: {as_of: "2026-01-01T12:00:00Z"}, rows: [{state: running, duration_seconds: 3, last_event_timestamp: "2026-01-01T00:00:10Z"}], why: "PLAN-telemetry-stop-turn-close (v5): last_event_timestamp is the open turn p2's open row at 10 (WT-8); latest row is the resume at 6 after the close at 4, so running; duration is the latest close minus the pin, 4 - 1 = 3 s, including the gap to the later resume (telemetry_sessions.yaml duration_seconds)"}
      - {verb: session_state_and_duration, session: root, params: {as_of: "2026-01-02T00:00:07Z"}, rows: [{state: running}], discriminates: idle_threshold, why: "idle exactly 86,400 s (last event 7 s + 1 day) does not EXCEED the threshold"}
      - {verb: session_state_and_duration, session: root, params: {as_of: "2026-01-03T00:00:00Z"}, rows: [{state: abandoned}], why: "PLAN-telemetry-read-side-session-end (SE-1): the latest turn p2 has an open and no close, so it stopped mid-turn and reads abandoned once idle 1.99 days exceeds 24 h; no turn closed after the segment close at 4, so duration (SE-3) stays 3 s"}
      - {verb: sessions_window, params: {day_from: "2026-01-01", day_to: "2026-01-01", as_of: "2026-01-02T00:00:07Z"}, rows: [{state: running}], discriminates: idle_threshold, why: the window verb applies the same strict idle rule}
      - {verb: sessions_window, params: {day_from: "2026-01-01", day_to: "2026-01-01", as_of: "2026-01-03T00:00:00Z"}, rows: [{state: abandoned}], why: beyond the threshold}
