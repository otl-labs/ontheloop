# The friction vectors (REPORT-w1-friction-classifier.md section 2, v01-v17; v18-v27 added by PLAN-friction-rules-v2, rec-4605
# and rec-5097), committed as a fixture like dedupe_vectors.yaml. An optional `absorbed` key is the expected absorbed_count,
# asserted only when present (v02 and v10 absorb one blocked close under classifier_version 2 and carry no key, staying byte-identical).
# v28-v36 (PLAN-friction-signature-coverage, classifier_version 3) also carry `unmapped`, the expected unmapped_count (generic
# process_event facts, hook_fault included), asserted only when present.
# Each row is [observation_id, observation_type, event_kind, name, severity, outcome, parent_observation_id, t] where t is both the
# event time (seconds) and the source ordinal; `expected` lists [ref, label]. Normative: fix the SQL, never the vectors.
vectors:
  - id: v01-hook-pass-is-not-friction
    rows: [[h1, process_event, point, 'hook:never_on_main', info, null, t1, 1], [t1, tool_call, close, Edit, null, success, A, 2]]
    expected: []
  - id: v02-hook-block-absorbs-its-tool-block
    rows: [[h1, process_event, point, 'hook:never_on_main', error, null, t1, 1], [t1, tool_call, close, Edit, null, blocked, A, 2]]
    expected: [[h1, branch_policy_block]]
  - id: v03-block-without-hook-row
    rows: [[t1, tool_call, close, Edit, null, blocked, A, 1]]
    expected: [[t1, tool_blocked]]
  - id: v04-unknown-signature-is-unmapped
    rows: [[h1, process_event, point, 'hook:custom_check', error, null, A, 1]]
    expected: [[h1, unmapped_block]]
  - id: v05-non-blocking-hook-error
    rows: [[h1, process_event, point, 'hook:never_on_main', warning, null, t1, 1], [t1, tool_call, close, Edit, null, success, A, 2]]
    expected: [[h1, hook_fault]]
  - id: v06-three-errors-then-success
    rows: [[t1, tool_call, close, Bash, null, error, A, 1], [t2, tool_call, close, Bash, null, error, A, 2], [t3, tool_call, close, Bash, null, error, A, 3], [t4, tool_call, close, Bash, null, success, A, 4]]
    expected: [[t1, tool_error], [t2, tool_error], [t3, tool_error], [t1, repeated_tool_failure]]
  - id: v07-success-breaks-the-run
    rows: [[t1, tool_call, close, Bash, null, error, A, 1], [t2, tool_call, close, Bash, null, success, A, 2], [t3, tool_call, close, Bash, null, error, A, 3], [t4, tool_call, close, Bash, null, error, A, 4]]
    expected: [[t1, tool_error], [t3, tool_error], [t4, tool_error]]
  - id: v08-runs-do-not-cross-turns
    rows: [[t1, tool_call, close, Bash, null, error, A, 1], [t2, tool_call, close, Bash, null, error, A, 2], [t3, tool_call, close, Bash, null, error, B, 3]]
    expected: [[t1, tool_error], [t2, tool_error], [t3, tool_error]]
  - id: v09-other-tools-do-not-break-the-run
    rows: [[t1, tool_call, close, Bash, null, error, A, 1], [t2, tool_call, close, Read, null, success, A, 2], [t3, tool_call, close, Bash, null, error, A, 3], [t4, tool_call, close, Bash, null, error, A, 4]]
    expected: [[t1, tool_error], [t3, tool_error], [t4, tool_error], [t1, repeated_tool_failure]]
  - id: v10-scope-guard-block
    rows: [[h1, process_event, point, 'hook:edit_scope_guard', error, null, t1, 1], [t1, tool_call, close, Write, null, blocked, A, 2]]
    expected: [[h1, scope_creep]]
  - id: v11-gate-signature-once-emitted
    rows: [[g1, process_event, point, 'gate:validate_scope_boundary', error, null, A, 1]]
    expected: [[g1, scope_creep]]
  - id: v12-interrupt-and-open-rows-are-not-friction
    rows: [[t1, tool_call, open, Bash, null, null, A, 1], [t1, tool_call, close, Bash, null, interrupted, A, 2]]
    expected: []
  - id: v13-four-errors-is-one-run
    rows: [[t1, tool_call, close, Bash, null, error, A, 1], [t2, tool_call, close, Bash, null, error, A, 2], [t3, tool_call, close, Bash, null, error, A, 3], [t4, tool_call, close, Bash, null, error, A, 4]]
    expected: [[t1, tool_error], [t2, tool_error], [t3, tool_error], [t4, tool_error], [t1, repeated_tool_failure]]
  - id: v14-only-a-blocking-hook-absorbs-a-block
    rows: [[h1, process_event, point, 'hook:never_on_main', info, null, t1, 1], [h2, process_event, point, 'hook:fresh_branch_base', warning, null, t1, 2], [t1, tool_call, close, Edit, null, blocked, A, 3]]
    expected: [[h2, hook_fault], [t1, tool_blocked]]
  - id: v15-critical-severity-is-a-fact
    rows: [[h1, process_event, point, 'hook:custom_check', critical, null, A, 1]]
    expected: [[h1, unmapped_block]]
  - id: v16-a-hook-under-a-process-event-drops-neither
    rows: [[g1, process_event, point, 'gate:validate_scope_boundary', error, null, A, 1], [h1, process_event, point, 'hook:custom_check', error, null, g1, 2]]
    expected: [[g1, scope_creep], [h1, unmapped_block]]
  - id: v17-a-block-breaks-the-run
    rows: [[t1, tool_call, close, Bash, null, error, A, 1], [t2, tool_call, close, Bash, null, error, A, 2], [t3, tool_call, close, Bash, null, blocked, A, 3], [t4, tool_call, close, Bash, null, error, A, 4]]
    expected: [[t1, tool_error], [t2, tool_error], [t3, tool_blocked], [t4, tool_error]]
  - id: v18-gate-error-under-an-error-close-counts-once
    rows: [[g1, process_event, point, 'gate:validate_scope_boundary', error, null, t1, 1], [t1, tool_call, close, Bash, null, error, A, 2]]
    expected: [[g1, scope_creep]]
    absorbed: 1
  - id: v19-precommit-error-under-an-error-close-counts-once
    rows: [[p1, process_event, point, 'precommit:ruff', error, null, t1, 1], [t1, tool_call, close, Bash, null, error, A, 2]]
    expected: [[p1, unmapped_block]]
    absorbed: 1
  - id: v20-reported-skip-is-a-notice
    rows: [[s1, process_event, point, 'status:ops_portal.file_rec.skipped', warning, null, t1, 1], [t1, tool_call, close, Bash, null, success, A, 2]]
    expected: [[s1, reported_skip]]
    absorbed: 0
  - id: v21-reported-failure-has-its-own-label
    rows: [[s1, process_event, point, 'status:ops_portal.file_rec.failed', error, null, t1, 1], [t1, tool_call, close, Bash, null, success, A, 2]]
    expected: [[s1, reported_failure]]
    absorbed: 0
  - id: v22-reported-failure-absorbs-its-error-close
    rows: [[s1, process_event, point, 'status:ops_portal.file_rec.failed', error, null, t1, 1], [t1, tool_call, close, Bash, null, error, A, 2]]
    expected: [[s1, reported_failure]]
    absorbed: 1
  - id: v23-a-skip-does-not-absorb-an-error-close
    rows: [[s1, process_event, point, 'status:ops_portal.file_rec.skipped', warning, null, t1, 1], [t1, tool_call, close, Bash, null, error, A, 2]]
    expected: [[s1, reported_skip], [t1, tool_error]]
    absorbed: 0
  - id: v24-orphan-closes-form-no-run
    rows: [[t1, tool_call, close, null, null, error, A, 1], [t2, tool_call, close, null, null, error, A, 2], [t3, tool_call, close, null, null, error, A, 3]]
    expected: [[t1, tool_error], [t2, tool_error], [t3, tool_error]]
    absorbed: 0
  - id: v25-absorbed-closes-still-form-a-run
    rows: [[g1, process_event, point, 'gate:validate_scope_boundary', error, null, t1, 1], [t1, tool_call, close, Bash, null, error, A, 2], [g2, process_event, point, 'gate:validate_scope_boundary', error, null, t2, 3], [t2, tool_call, close, Bash, null, error, A, 4], [g3, process_event, point, 'gate:validate_scope_boundary', error, null, t3, 5], [t3, tool_call, close, Bash, null, error, A, 6]]
    expected: [[g1, scope_creep], [g2, scope_creep], [g3, scope_creep], [t1, repeated_tool_failure]]
    absorbed: 3
  - id: v26-blocking-hook-under-a-blocked-close
    rows: [[h1, process_event, point, 'hook:never_on_main', error, null, t1, 1], [t1, tool_call, close, Bash, null, blocked, A, 2]]
    expected: [[h1, branch_policy_block]]
    absorbed: 1
  - id: v27-status-prefix-boundary
    rows: [[s1, process_event, point, 'statuses:x.skipped', warning, null, A, 1]]
    expected: [[s1, hook_fault]]
    absorbed: 0
  - id: v28-listed-gate-error-is-check-failure
    rows: [[g1, process_event, point, 'gate:validate_plan_documents', error, null, A, 1]]
    expected: [[g1, check_failure]]
    absorbed: 0
    unmapped: 0
  - id: v29-detect-secrets-error-is-precommit-failure
    rows: [[p1, process_event, point, 'precommit:detect-secrets', error, null, A, 1]]
    expected: [[p1, precommit_failure]]
    absorbed: 0
    unmapped: 0
  - id: v30-unlisted-gate-stays-unmapped
    rows: [[g1, process_event, point, 'gate:validate_not_listed', error, null, A, 1]]
    expected: [[g1, unmapped_block]]
    absorbed: 0
    unmapped: 1
  - id: v31-gate-warning-stays-hook-fault
    rows: [[g1, process_event, point, 'gate:validate_plan_documents', warning, null, A, 1]]
    expected: [[g1, hook_fault]]
    absorbed: 0
    unmapped: 1
  - id: v32-scheduled-agent-log-only-error
    rows: [[h1, process_event, point, 'hook:scheduled_agent_log_only', error, null, A, 1]]
    expected: [[h1, scheduled_agent_write_block]]
    absorbed: 0
    unmapped: 0
  - id: v33-handoff-evidence-gate-error
    rows: [[h1, process_event, point, 'hook:handoff_evidence_gate', error, null, A, 1]]
    expected: [[h1, handoff_evidence_block]]
    absorbed: 0
    unmapped: 0
  - id: v34-merge-gate-error
    rows: [[h1, process_event, point, 'hook:merge_gate', error, null, A, 1]]
    expected: [[h1, merge_gate_block]]
    absorbed: 0
    unmapped: 0
  - id: v35-rec-writer-tripwire-error
    rows: [[h1, process_event, point, 'hook:rec_writer_tripwire', error, null, A, 1]]
